  - id: cvs.L04.003
    kind: mcq
    topic: shock
    stem: >-
      A 45-year-old man is brought to the emergency department after a stab wound to the chest.
      His blood pressure is 80/50 mm Hg, his neck veins are distended and his heart sounds are distant.
      Systolic blood pressure falls by 15 mm Hg on inspiration. Which of the following is the most likely
      finding on echocardiography?
    options:
      - Diastolic collapse of the right ventricle
      - Dilated left ventricle with a low ejection fraction
      - Asymmetric septal hypertrophy
      - Flail mitral leaflet
      - Vegetation on the tricuspid valve
    answer: 0
    why:
      - Tamponade compresses the heart; the echo shows systolic RA collapse, diastolic RV collapse and IVC plethora.
      - A dilated, poorly contracting LV is dilated cardiomyopathy, which does not give Beck triad after trauma.
      - Asymmetric septal hypertrophy is hypertrophic cardiomyopathy.
      - A flail leaflet gives acute mitral regurgitation and pulmonary edema, not distended neck veins with distant sounds.
      - Tricuspid vegetations suggest endocarditis in people who inject drugs.
    src: { page: 317 }
    status: unverified
    tags: [high-yield]
