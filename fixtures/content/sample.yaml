      - Presentation: [Tearing chest pain radiating to the back, Unequal BP in the arms, Mediastinal widening on CXR]
      - Stanford classification: [Type A involves the ascending aorta and needs surgery, Type B is distal to the left subclavian and gets β-blockers then vasodilators]
      - Complications: [Acute aortic regurgitation, Cardiac tamponade, Organ ischemia]
    src: { page: 305 }
    status: unverified
  - id: cvs.L04.006
    kind: case
    topic: dissection
    stem: A 62-year-old man with long-standing hypertension has sudden tearing chest pain that radiates to his back.
    steps:
      - reveal: "BP 170/100 mm Hg in the right arm and 130/80 mm Hg in the left. CXR: mediastinal widening."
        question: What is the most likely diagnosis?
        options: [Acute MI, Aortic dissection, Pulmonary embolism, Acute pericarditis, Tension pneumothorax]
        answer: 1
        why: Tearing pain to the back with unequal arm pressures and a wide mediastinum point to dissection.
      - reveal: CT angiography shows a flap in the ascending aorta.
        question: What is the treatment?
        options: [β-blockers alone, Surgery, Thrombolysis, Pericardiocentesis, Observation]
        answer: 1
        why: Stanford type A involves the ascending aorta and is treated with surgery.
    src: { page: 305 }
    status: unverified
