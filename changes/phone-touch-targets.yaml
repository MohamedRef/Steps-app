- kind: new
  ar_eg: "على الموبايل فيه زرار بحث جنب الإعدادات فوق: بيفتح «دوّر بسرعة» زي ⌘K، ولما تقفله بيرجّعك مكانك"
  en: "On phones a search button next to Settings opens quick search, the same box as ⌘K; closing it puts you back where you were"
- kind: improved
  ar_eg: "في المراجعة على الموبايل الصغير، شريط التقدّم ما بيتزنقش تاني: التراجع وإنهاء في سطر لوحدهم تحته، وأزرار التقييم فوق شريط الإيماءات بتاع أندرويد"
  en: "Phone review keeps the progress bar readable: Undo and End sit on their own row, and the grade buttons stay above Android's gesture bar"
- kind: improved
  ar_eg: "أزرار أكبر للمس على الموبايل (٤٨dp): تابات القايمة تحت، زرار القفل في «المزيد»، علامات ✓ و✗ في الجداول، عرض وترتيب القوايم، ونطاق وتاريخ بنك الأسئلة"
  en: "Bigger touch targets on phones (48dp): the bottom tabs, More's Close, the table ✓/✗ marks, list view and sort buttons, and the question bank's scope and history"
