- kind: new
  ar_eg: "شاشة البلوك بقت زي شاشة امتحان بنوك Step 1: فوق نوع البلوك و«سؤال 7 من 20» والوقت و«علّم» والقيم المعملية والملاحظة، وجنب السؤال لستة الأسئلة بحالتها."
  en: "Blocks work like a Step 1 bank's test screen: a top bar with the block, question number, clock, Mark, lab values and a note, and a question navigator."
- kind: new
  ar_eg: "تشطب على أي اختيار بضغطة طويلة أو كليك يمين، وتحدّد أي كلام في السؤال يتعلّم عليه بالأصفر، والاتنين بيفضلوا معاك لو سبت الامتحان ورجعتله."
  en: "Strike out an option with a long press or a right click, and select words in a question to highlight them; both stay when you come back to a paper."
- kind: new
  ar_eg: "اللي تعلّم عليه بيفضل متعلّم عليه بعد البلوك وعلى كل أجهزتك، وتقدر تحل من «المتعلّم عليه» بس من اختيارات البنك."
  en: "Marked questions stay marked after the block and on all your devices, and the bank can draw a paper from just the marked ones."
- kind: improved
  ar_eg: "بعد ما تأكّد الإجابة: «إجابة صح» أو «إجابة غلط» مع اخترت إيه والإجابة الصح والوقت، والشرح جنب السؤال على التابلت والماك."
  en: "After you confirm an answer: right or wrong, what you picked and the answer, the time, and the explanation beside the question on wide screens."
- kind: new
  ar_eg: "نهاية البلوك: النتيجة والوقت ومتوسط السؤال، الصح والغلط واللي ما اتجاوبش والمتعلّم عليه، جدول الأسئلة، والنتيجة حسب الـ system."
  en: "The end of a block: score, time and time per question, right, wrong, unanswered and marked, a table of the questions and the score per system."
- kind: new
  ar_eg: "من نهاية البلوك: «راجع الأسئلة الغلط» بشرحها، أو «بلوك جديد من الغلط والمتعلّم عليه» على طول."
  en: "From the end of a block: review the wrong questions with their explanations, or start a new block of the wrong and marked ones."
- kind: improved
  ar_eg: "الكيبورد في البلوك: الحروف بتختار، Enter بيأكّد الإجابة، والأسهم بتنقّلك بين الأسئلة، وF بيعلّم على السؤال."
  en: "Keys in a block: letters pick, Enter confirms, the arrows move between questions and F marks the question."
