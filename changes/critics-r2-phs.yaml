- kind: improved
  ar_eg: "كروت الصحة العامة (phs) اللي كانت شايلة كذا معلومة اتقسمت لكروت أصغر، والردود اتكتبت بكلامنا بدل كلام الكتاب حرفياً."
  en: "Public health (phs) cards that packed several facts are split into smaller ones, and copied backs are reworded."
- kind: new
  ar_eg: "كروت phs جديدة: α و الـ CI والـ meta-analysis والـ variance، الـ pronouns واللغة المفضلة، والـ palliative care والـ Doxy-PEP."
  en: "New phs cards: α, confidence intervals, meta-analysis, variance, pronouns and preferred language, palliative care team, Doxy-PEP companions."
- kind: fixed
  ar_eg: "دروس phs: علاج الـ measurement bias اتصلح، وصفحات الخطوات بقت مظبوطة، وسؤال الـ screening بقى ليه إجابة واحدة."
  en: "phs lessons: measurement-bias fix corrected, step pages split by page, and the screening check now has one defensible answer."
