- kind: fixed
  ar_eg: "تسجيل الدخول بجوجل على أندرويد بقى يستنى لحد ما ترجع لـ Steps قبل ما يكمّل، فمابقاش يتقطع وهو في الخلفية. ولو اتقطع، هيقولك بوضوح تسجّل دخول تاني"
  en: "Google sign-in on Android now waits until you are back in Steps, so it no longer breaks in the background; if it was cut off, Steps asks you to sign in again"
