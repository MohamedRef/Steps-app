- kind: improved
  ar_eg: "«ضيف أسئلة من ملف» بقى يوريك قبل وبعد الإضافة كل سؤال: رقمه، محاضرته وصفحته، أول سطر منه وإجابته، وإيه اللي اتغيّر فيه."
  en: "Questions from a file now show each question before and after adding: its id, lecture and page, stem, answer, and what changed."
- kind: new
  ar_eg: "بعد الإضافة دوس على أي سؤال يفتحلك في البنك، أو «افتح أسئلة MH في البنك» تفتح البنك كله."
  en: "After adding, tap a question to open it in the bank, or open its whole bank."
