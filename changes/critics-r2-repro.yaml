- kind: improved
  ar_eg: "كروت الـ Reproductive اتقسمت لمعلومة واحدة في كل كارت، واتضافت كروت جديدة لحاجات كانت ناقصة (germ cell tumors، torsion، varicocele، HER2، الأدوية)."
  en: "Reproductive cards now hold one fact each, with new cards for missing facts (germ cell tumors, torsion, varicocele, HER2, drugs)."
- kind: fixed
  ar_eg: "أسئلة MCQ في الـ Reproductive بقت بتختبر خطوة بعد التشخيص، واتصلحت شروحات الاختيارات الغلط وجدول Tanner."
  en: "Reproductive MCQs now test one step past the diagnosis; misleading option explanations and the Tanner table were fixed."
- kind: improved
  ar_eg: "دروس الـ Reproductive: رسمتين جداد (hCG في الحمل وسرعة الـ GnRH pulses)، وتمارين آخر الدرس بقت كروت بس، واختصارات جديدة في القاموس."
  en: "Reproductive lessons: two new figures (hCG in pregnancy, GnRH pulse frequency), end-of-lesson practice uses cards only, and new glossary abbreviations."
