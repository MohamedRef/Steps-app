  ar_eg: "النهارده بقى يبدأ بالدرس قبل كروت المحاضرة الجديدة: لو لسه ماخلّصتش ولا درس منها، الزرار الرئيسي يفتح الدرس، والكروت تحته بضغطة."
  en: "Today opens the lesson before a lecture's first new cards. Until one of its lessons is finished, the cards stay one tap away under the button."
