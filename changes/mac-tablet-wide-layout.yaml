- kind: improved
  ar_eg: "الماك والتابلت بالعرض بيستغلوا الشاشة كلها: الدرس بقى عمودين (اسم الدرس جنب، والخطوة وزرار «كمّل» تحتها على طول)، والشاشات التانية بقت أعرض"
  en: "The Mac and a landscape tablet use the whole window: lessons get a side column with the step and Continue right under it, and screens are centred"
- kind: improved
  ar_eg: "صفحة الكتاب والاختصارات بيفتحوا على الماك والتابلت بالعرض كلوحة جانبية طويلة، ومش بيغطّوا الدرس ولا زرار «كمّل»"
  en: "On the Mac and a landscape tablet the book page and abbreviations open as a full-height side panel that never covers the lesson or Continue"
- kind: improved
  ar_eg: "اختصارات الكيبورد: الأسهم بتنقّلك بين خطوات الدرس، Space أو Enter بعد ما تكشف الإجابة = «تمام»، وZ ترجع في آخر تقييم، وأرقام 1–4 ظاهرة على زراير التقييم"
  en: "Keyboard: arrows move between lesson steps, Space or Enter after the reveal rates Good, Z undoes the last rating, and 1–4 show on the rating buttons"
