- kind: new
  ar_eg: "الخطة بقت على 3 مراحل: الأجهزة، الربط، والفترة المركّزة (6 أسابيع افتراضيًا، تختار من 4 لـ 8)، وعدد أسئلة بنك الأسئلة كل يوم على حسب المرحلة"
  en: "The exam plan has three phases (systems, integration, dedicated of 4-8 weeks) and a daily qbank question target per phase"
- kind: new
  ar_eg: "التقييمات الذاتية في الخطة: تقييم بداية، تقييم كل 3 شهور تقريبًا، تقييم كل أسبوع في الفترة المركّزة، وFree 120 قبل الامتحان بكام يوم"
  en: "Self-assessment days in the plan: baseline, about every 3 months, weekly in dedicated, Free 120 a few days before the exam"
- kind: new
  ar_eg: "لو الخطة مش هتلحق، بتقترح ميعاد امتحان أبعد بدل ما تقصّر الفترة المركّزة، وتقدر تنقله بدوسة"
  en: "A plan that doesn't fit suggests a later exam day instead of a shorter dedicated period, with one tap to move it"
- kind: new
  ar_eg: "حِمل كل يوم (خفيف، عادي، تقيل)، يوم لحاق في الأسبوع من غير جديد، وأجازات من غير مذاكرة ولا تنبيهات"
  en: "Per-weekday load (light, normal, heavy), a weekly catch-up day and vacations with no study or reminders"
- kind: new
  ar_eg: "لو فاتك جديد امبارح، الخطة بتسألك بهدوء: توزّعه على الأيام الجاية ولا تحطّه في يوم اللحاق، مع معاينة قبل وبعد وزرار رجّع"
  en: "Missed new items: spread them or move them to the catch-up day, with a before/after preview and undo"
