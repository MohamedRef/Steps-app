- kind: new
  ar_eg: "«دوّر بسرعة» (⌘K أو Ctrl+K، أو زرار البحث في القايمة الجانبية على الماك والتابلت): اكتب اسم محاضرة أو درس أو شاشة أو رقم صفحة في First Aid وافتحها على طول"
  en: "Quick search (⌘K, Ctrl+K or the sidebar search button): type a lecture, lesson, screen or First Aid page number and open it straight away"
- kind: new
  ar_eg: "وضع التركيز في الدرس والمراجعة (زرار جنب العدّاد أو حرف F): القايمة بتختفي والخطوة بتبقى في النص لوحدها"
  en: "Focus mode in lessons and review (button by the counter, or F) hides the menu and keeps just the step, centred"
- kind: improved
  ar_eg: "على الماك والتابلت تقدر تسحب الفاصل بين السؤال والإجابة عشان تكبّر أي ناحية، وSteps بيفتكر العرض (دبل كليك يرجّعه زي ما كان)"
  en: "On the Mac and tablets drag the divider between question and answer to resize them; Steps remembers it, and a double click resets it"
