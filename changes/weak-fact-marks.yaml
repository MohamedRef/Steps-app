  ar_eg: "الحاجة اللي غلطت فيها آخر مرة بتتعلّم \"راجعها تاني\" في الدرس وفي صفحة الكتاب، وتمشي العلامة أول ما تجاوبها صح. تقدر تقفلها من الإعدادات"
