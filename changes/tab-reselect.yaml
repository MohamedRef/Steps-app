- kind: improved
  ar_eg: "لما تدوس على التبويب اللي إنت فيه، بيرجّعك لأوله: نتيجة البلوك أو ملخص الجلسة بيرجعوا للبداية، والصفحة المفتوحة فوقه بتتقفل؛ والبلوك أو الجلسة اللي شغّالين بيفضلوا زي ما هما"
  en: "Tapping the tab you are on takes it back to its start: a block result or a session summary returns to the setup, and a page open over it closes; a block or session in progress stays as it is"
