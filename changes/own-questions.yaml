- kind: new
  ar_eg: "ضيف أسئلتك من ملف: الإعدادات › بياناتك › «ضيف أسئلة من ملف». Excel أو JSON أو YAML، لوحده أو في zip مع الصور، والتمبلت هناك."
  en: "Add your own questions from a file in Settings › Your data: Excel, JSON or YAML, alone or zipped with figures; the template is there."
- kind: new
  ar_eg: "كل تصنيف في الملف بيبقى بنك لوحده في بنك الأسئلة، والأسئلة وصورها بتتزامن على كل أجهزتك."
  en: "Each category in the file is a bank of its own, and the questions and their figures sync to every device."
- kind: new
  ar_eg: "قبل ما تضيف بيقولك هيضيف كام وهيعدّل كام، وأي غلطة في أنهي صف. نفس الملف تاني بيعدّل مكانه ومش بيكرر."
  en: "Before adding it says what it will add and change and what is wrong in which row; the same file again updates in place."
