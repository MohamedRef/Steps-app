- kind: improved
  ar_eg: "كروت الـ pharmacology اللي كانت شايلة لستة طويلة بقت أسئلة «عدّد» أو كروت منفصلة، وكل حقيقة في مكانها."
  en: "Pharmacology: packed list cards are now enumerate items or split cards, one fact each."
- kind: improved
  ar_eg: "إجابات كروت الـ pharmacology بقت بكلامنا بدل ما تنسخ جملة الكتاب، وأسئلة phentolamine و tetrabenazine بقت بتسأل عن الـ mechanism."
  en: "Pharmacology: card backs reworded, and the phentolamine and tetrabenazine MCQs now ask the mechanism."
- kind: new
  ar_eg: "كروت جديدة: cilostazol بيوقف PDE-3 و dipyridamole مش selective، والـ albuterol في جدول الـ hemodynamics."
  en: "Pharmacology: new cards on cilostazol (PDE-3) and dipyridamole (nonspecific), and an albuterol row in the hemodynamics table."
- kind: fixed
  ar_eg: "رسمة «أدوية بتأثر على خلايا الدم» اتصلّحت، وكلمة «نقلّي البول» بقت «نخلّي البول قلوي»."
  en: "Pharmacology lessons: blood-cell drug figure fixed and the urine-alkalinizing wording corrected."
- kind: new
  ar_eg: "رسمتين جديدتين: علاج تسمم الـ organophosphate (atropine و pralidoxime)، وأدوية بتأذي الرئة والمثانة."
  en: "Pharmacology lessons: new figures for organophosphate poisoning and drug-induced lung and bladder injury."
