- kind: fixed
  ar_eg: "على الماك: لو Steps اتفتح من نسخة الماك المؤقتة، التحديث بيقولك تعمل إيه مرة واحدة، وفي زرار ينسخ سطر الـ Terminal."
  en: "On the Mac: when Steps runs from macOS's read-only copy, the update says the one-time fix and copies the Terminal line."
- kind: fixed
  ar_eg: "لو المحتوى الجديد محتاج نسخة أحدث من التطبيق، شاشة التحديثات بتقول كده بدل «هيجرّب تاني بعدين»."
  en: "When new content needs a newer app, the update screen says so instead of 'will try again later'."
