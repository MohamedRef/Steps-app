- kind: fixed
  ar_eg: "الاختصارات بقت بتظهر بمعناها في المادة نفسها: LA في القلب «Left atrium»، و ADA في الكيمياء الحيوية «Adenosine deaminase»، بدل معاني مواد تانية."
  en: "Abbreviations now show the meaning their own course intends (LA in cardiovascular is left atrium), in US spelling, instead of another field's."
