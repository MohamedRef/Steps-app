name: Android WebView renderer regression

# Nightly and by hand only, not per pull request (Mohamed, 2026-11-04).
on:
  schedule:
    - cron: "28 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webview-renderer:
    name: Renderer-loss Kotlin/JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run production-guard regression tests (no emulator)
        run: gradle --no-daemon -p android/renderer-tests test
