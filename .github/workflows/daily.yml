name: Daily platform runs

# GitHub never fired this repo's `schedule:` triggers (#340): no Nightly,
# Mac, preview APK or browser check ran at night, and nothing said so. This
# doesn't rely on cron. After each green CI run on main, it starts every
# platform workflow whose newest run on main is more than 20 hours old, so
# each one runs at most about once a day, and only on days when main moved.
# A run started here counts as a nightly one for alerts.yml.
#
# It also warns when the newest *scheduled* Nightly run is more than 36
# hours old (or there is none), and keeps one issue open about it until the
# schedules fire again.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # To start the platform workflows (workflow_dispatch from GITHUB_TOKEN is
  # allowed to start a run).
  actions: write
  issues: write

concurrency:
  group: daily-platform-runs
  cancel-in-progress: false

jobs:
  kick:
    name: Start what hasn't run today
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Start stale platform workflows on main
        run: |
          now="$(date -u +%s)"
          for wf in nightly.yml mac.yml steps-android-preview.yml settings-browser.yml android-webview-regression.yml; do
            last="$(gh run list --workflow "$wf" --branch main --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
            age=999999
            if [ -n "$last" ]; then
              age=$(( (now - $(date -u -d "$last" +%s)) / 3600 ))
            fi
            if [ "$age" -ge 20 ]; then
              gh workflow run "$wf" --ref main
              echo "started $wf (last run on main ${age}h ago)"
            else
              echo "$wf ran ${age}h ago: nothing to do"
            fi
          done
      - name: Scheduled Nightly older than 36 hours?
        run: |
          title="Scheduled workflows are not firing"
          last="$(gh run list --workflow nightly.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)"
          if [ -n "$last" ] && [ $(( $(date -u +%s) - $(date -u -d "$last" +%s) )) -lt $(( 36 * 3600 )) ]; then
            echo "Last scheduled Nightly: $last"
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "A scheduled Nightly ran at $last: the schedules fire again."
            fi
            exit 0
          fi
          msg="No scheduled Nightly checks run in the last 36 hours (last: ${last:-never}). daily.yml starts the platform workflows after green CI on main meanwhile."
          echo "::warning::$msg"
          if [ -z "$open" ]; then
            gh issue create --title "$title" --body "$msg

          GitHub runs a \`schedule:\` as the user who last changed its cron line. The fix that usually works: Mohamed merges the PR that shifts each cron line by one minute himself (docs/RUN.md § Tests and coverage). This issue closes itself when a scheduled Nightly runs (#340)."
          fi
