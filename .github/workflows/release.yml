name: Release

# Builds a real Steps release and publishes it (docs/RELEASE.md §1, §4–5):
# the signed release APK, the signed Steps.app and the content pack. The
# version is the calendar's (YEAR.MONTH.N, scripts/version.sh release) and
# the channel is picked here (alpha unless told), on
#
# - the channel feed(s) the release reaches (`steps-alpha`, …): the signed
#   update.json the installed apps read, files first, manifest last;
# - a release of its own (`v<version>`) with Steps-<version>-android.apk,
#   Steps-<version>-mac.zip and SHA256SUMS.txt for installing by hand.
#
# Dry run by default: it builds, signs and checks the APK and Steps.app and
# publishes nothing; untick "Dry run" for the real release (#341).
# By hand only (Actions › Release › Run workflow), and from main only:
# nothing is released unless Mohamed says go, and never from a branch that
# hasn't been reviewed and merged (#104). The keys come from repo secrets that
# scripts/release-secrets.sh copies from the Mac's Keychain; the public
# update key is crates/app/update-key.pub. Same build steps as
# steps-android-preview.yml and mac.yml, with the release keys.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel: alpha (default), beta (also reaches alpha) or stable (reaches everyone)"
        type: choice
        options: [alpha, beta, stable]
        default: alpha
      notes_en:
        description: "Short notes (English, optional: what's new comes from changes/)"
        required: false
        default: ""
      notes_ar_eg:
        description: "Short notes (Egyptian Arabic, optional)"
        required: false
        default: ""
      dry_run:
        description: "Dry run: build and sign the APK and Steps.app, publish nothing (#341)"
        type: boolean
        required: false
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Steps Cloud and Google sign-in, built in like the preview builds
  # (crates/app/src/cloud/mod.rs, docs/CLOUD.md §3.5). The URL and client id
  # are public; the client secret (a repo secret) is passed only to the two
  # build steps. Never echo these.
  STEPS_CLOUD_URL: ${{ vars.STEPS_CLOUD_URL || 'https://steps-cloud.hamorefaat85.workers.dev' }}
  STEPS_GOOGLE_CLIENT_ID: ${{ vars.STEPS_GOOGLE_CLIENT_ID }}

jobs:
  prepare:
    name: Version, keys and content pack
    # Signed with the permanent release keys: main only (#104). Every other
    # job needs this one, so a dispatch from a branch builds nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # To check Nightly checks and Mac passed on this commit.
      actions: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      channels: ${{ steps.v.outputs.channels }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The build number is main's commit count and the version counts
          # this month's release tags (scripts/version.sh).
          fetch-depth: 0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tools
          save-if: false
      - name: Release version and its channels
        id: v
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          read -r v build < <(scripts/version.sh release)
          channels="$(cargo run -q -p steps-tools -- update channels --version "$v" --channel "${CHANNEL:-alpha}" | tr '\n' ' ')"
          [ -n "${channels// }" ] || { echo "::error::$v belongs on no channel"; exit 1; }
          # Refuse the -alpha.0 placeholder and a version that isn't newer
          # than what a channel's feed already carries (a re-run included).
          previous=()
          for channel in $channels; do
            if curl -fsSL --retry 3 -o "$RUNNER_TEMP/$channel.json" \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/steps-$channel/update.json"; then
              previous+=(--previous "$RUNNER_TEMP/$channel.json")
            fi
          done
          if ! out="$(cargo run -q -p steps-tools -- update guard --version "$v" "${previous[@]}" 2>&1)"; then
            if [ "$DRY_RUN" = true ]; then
              # A dry run publishes nothing, so it still builds; the real run would stop here.
              echo "::warning::A real release would stop here: $out"
            else
              echo "::error::$out"
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Steps $v (build $build) → $channels"
      # A real release ships only a commit that passed the platform checks
      # (#341): Nightly checks (Android, web, Worker, coverage) and Mac.
      - name: Nightly checks and Mac passed on this commit
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ok=true
          for wf in nightly.yml mac.yml; do
            if [ -z "$(gh run list --workflow "$wf" --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[].databaseId')" ]; then
              echo "::error::$wf has no green run on ${GITHUB_SHA::7}: run it (Actions › Run workflow on main) and release once it passes (docs/RELEASE.md §4)."
              ok=false
            fi
          done
          $ok
      - name: Every key is there
        env:
          HAVE_UPDATE: ${{ secrets.STEPS_UPDATE_SECRET != '' }}
          HAVE_KEYSTORE: ${{ secrets.STEPS_ANDROID_KEYSTORE != '' && secrets.STEPS_ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_MAC: ${{ secrets.STEPS_MAC_CERT_P12 != '' && secrets.STEPS_MAC_CERT_PASSWORD != '' }}
          HAVE_GOOGLE: ${{ secrets.STEPS_GOOGLE_CLIENT_SECRET != '' }}
          CERT_SHA256: ${{ vars.STEPS_ANDROID_CERT_SHA256 }}
        run: |
          ok=true
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::repo variable STEPS_ANDROID_CERT_SHA256 is missing (scripts/release-secrets.sh)"; ok=false; }
          grep -q '^[A-Za-z0-9+/]\{43\}=$' crates/app/update-key.pub \
            || { echo "::error::crates/app/update-key.pub holds no key: run scripts/release-secrets.sh on the Mac and commit it"; ok=false; }
          [ "$HAVE_UPDATE" = true ] || { echo "::error::secret STEPS_UPDATE_SECRET is missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_KEYSTORE" = true ] || { echo "::error::secrets STEPS_ANDROID_KEYSTORE(_PASSWORD) are missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_MAC" = true ] || { echo "::error::secrets STEPS_MAC_CERT_P12/_PASSWORD are missing (scripts/release-secrets.sh)"; ok=false; }
          [ "$HAVE_GOOGLE" = true ] || echo "::warning::STEPS_GOOGLE_CLIENT_SECRET is missing: Google sign-in for sync may fail (docs/CLOUD.md §3.5)"
          $ok
      - name: Content pack (built in and on the feed)
        run: |
          cargo run -q -p steps-tools -- validate
          cargo run -q -p steps-tools -- packs build --out dist/packs
      - uses: actions/upload-artifact@v4
        with:
          name: steps-release-pack
          path: dist/packs/
          retention-days: 30

  android:
    name: Release APK
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      STEPS_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The release's version in the build (versionName, the app's label);
      # never committed.
      - name: Release version into Cargo.toml
        run: scripts/version.sh apply "${{ needs.prepare.outputs.version }}"
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: steps-android-preview
          save-if: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install dx 0.7.10
        run: cargo binstall -y --force dioxus-cli@0.7.10
      - uses: actions/download-artifact@v4
        with:
          name: steps-release-pack
          path: dist/packs
      - name: Build identity
        run: |
          {
            echo "STEPS_COMMIT=${GITHUB_SHA::7}"
            echo "STEPS_BUILTIN_CONTENT=$(sha256sum dist/packs/steps-content.pack | cut -d' ' -f1)"
            echo "ANDROID_HOME=$ANDROID_SDK_ROOT"
            echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME"
          } >> "$GITHUB_ENV"
          ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1 >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: crates/app
        env:
          STEPS_GOOGLE_CLIENT_SECRET: ${{ secrets.STEPS_GOOGLE_CLIENT_SECRET }}
        run: |
          dx bundle --platform android --release --package-types apk \
            --target aarch64-linux-android --no-default-features --features mobile \
            --out-dir ../../dist/android/raw
      - name: Rebuild as a release APK (not debuggable, R8, versionCode)
        run: |
          APK="$(scripts/android-release-apk.sh)"
          scripts/android-check-apk.sh "$APK"
          mkdir -p dist/android/release && cp "$APK" dist/android/release/steps-unsigned.apk
      - name: Sign with the release key
        env:
          KEYSTORE_B64: ${{ secrets.STEPS_ANDROID_KEYSTORE }}
          PASS: ${{ secrets.STEPS_ANDROID_KEYSTORE_PASSWORD }}
          # Public fingerprint of the permanent release certificate (repo
          # variable from scripts/release-secrets.sh).
          CERT_SHA256: ${{ vars.STEPS_ANDROID_CERT_SHA256 }}
        run: |
          ks="$RUNNER_TEMP/steps-release.jks"
          printf %s "$KEYSTORE_B64" | base64 -d > "$ks"
          zipalign -f -p 4 dist/android/release/steps-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$ks" --ks-key-alias steps --ks-pass env:PASS --key-pass env:PASS \
            --out dist/android/steps.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$ks"
          apksigner verify --print-certs dist/android/steps.apk | tee "$RUNNER_TEMP/certs.txt"
          [ -n "$CERT_SHA256" ] || { echo "::error::repo variable STEPS_ANDROID_CERT_SHA256 is missing (scripts/release-secrets.sh)"; exit 1; }
          grep -qi "certificate SHA-256 digest: $CERT_SHA256\$" "$RUNNER_TEMP/certs.txt" \
            || { echo "::error::the APK is not signed with the permanent release key ($CERT_SHA256)"; exit 1; }
          unzip -l dist/android/steps.apk | grep -q 'lib/arm64-v8a/' \
            || { echo "APK has no arm64-v8a library"; exit 1; }
          ls -lh dist/android/steps.apk
      - uses: actions/upload-artifact@v4
        with:
          name: steps-release-apk
          path: dist/android/steps.apk
          retention-days: 30

  mac:
    name: Release Steps.app
    needs: prepare
    runs-on: macos-15
    # A cold macOS build took 40 minutes (#343).
    timeout-minutes: 75
    env:
      STEPS_BUILD: ${{ needs.prepare.outputs.build }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Release version into Cargo.toml
        run: scripts/version.sh apply "${{ needs.prepare.outputs.version }}"
      - uses: ./.github/actions/rust
        with:
          components: llvm-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
          save-if: false
      - name: Install dx 0.7.10
        run: |
          if ! dx --version 2>/dev/null | grep -q '0.7.10'; then
            cargo install dioxus-cli --version 0.7.10 --locked
          fi
      - uses: actions/download-artifact@v4
        with:
          name: steps-release-pack
          path: dist/packs
      - name: Build Steps.app
        env:
          STEPS_GOOGLE_CLIENT_SECRET: ${{ secrets.STEPS_GOOGLE_CLIENT_SECRET }}
        run: |
          export STEPS_COMMIT="${GITHUB_SHA::7}"
          export STEPS_BUILTIN_CONTENT="$(shasum -a 256 dist/packs/steps-content.pack | cut -d' ' -f1)"
          cd crates/app
          if ! dx bundle --platform macos --release --package-types macos --out-dir ../../dist/mac/raw > ../../dx-bundle.log 2>&1; then
            grep -iE 'error|failed|panick|not found|no such' ../../dx-bundle.log | grep -v ' INFO Compiled' | tail -n 9 | sed 's/^/::error::/'
            exit 1
          fi
          cd ../..
          app="$(find dist/mac/raw -maxdepth 4 -name '*.app' | head -1)"
          test -n "$app"
          rm -rf dist/mac/Steps.app && cp -R "$app" dist/mac/Steps.app
      - name: Sign as "Steps Code Signing" (the identity installed apps trust)
        env:
          P12_B64: ${{ secrets.STEPS_MAC_CERT_P12 }}
          P12_PASS: ${{ secrets.STEPS_MAC_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/steps.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          printf %s "$P12_B64" | base64 -d > "$RUNNER_TEMP/steps.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/steps.p12" -k "$kc" -P "$P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/steps.p12"
          codesign --force --deep --keychain "$kc" --sign "Steps Code Signing" dist/mac/Steps.app
          codesign --verify --deep --strict dist/mac/Steps.app
          codesign -dvv dist/mac/Steps.app 2>&1 | grep -E 'Authority|Identifier'
          ditto -c -k --keepParent dist/mac/Steps.app dist/mac/Steps.app.zip
          ls -lh dist/mac/Steps.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: steps-release-mac
          path: dist/mac/Steps.app.zip
          retention-days: 30

  publish:
    name: Publish the release and its update feed
    needs: [prepare, android, mac]
    # A dry run stops after the signed builds (their artifacts stay on the run).
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      STEPS_BUILD: ${{ needs.prepare.outputs.build }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # What's new reads the changes/ files merged since the feed's build.
          fetch-depth: 0
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-tools
          save-if: false
      - uses: actions/download-artifact@v4
        with:
          path: dist/in
      - name: Signed feed per channel
        env:
          V: ${{ needs.prepare.outputs.version }}
          CHANNELS: ${{ needs.prepare.outputs.channels }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_AR_EG: ${{ inputs.notes_ar_eg }}
          STEPS_UPDATE_SECRET: ${{ secrets.STEPS_UPDATE_SECRET }}
        run: |
          apk=dist/in/steps-release-apk/steps.apk
          zip=dist/in/steps-release-mac/Steps.app.zip
          pack=dist/in/steps-release-pack/steps-content.pack
          for channel in $CHANNELS; do
            out="dist/update/$channel"
            curl -fsSL --retry 3 -o /tmp/previous.json \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/steps-$channel/update.json" \
              || rm -f /tmp/previous.json
            cargo run -q -p steps-tools -- update manifest --channel "$channel" --version "$V" \
              --build "$STEPS_BUILD" --commit "${GITHUB_SHA::7}" \
              --notes-en "$NOTES_EN" --notes-ar-eg "$NOTES_AR_EG" --previous /tmp/previous.json --changes \
              --asset "android-arm64=$apk" --asset "macos-arm64=$zip" --asset "content=$pack" --out "$out"
            cargo run -q -p steps-tools -- update sign "$out"
            # The app's own checks, against the key built into release builds.
            cargo run -q -p steps-tools -- update verify "$out"
            ls -l "$out"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: steps-release-feeds
          path: dist/update/
          retention-days: 30
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.prepare.outputs.version }}
          CHANNELS: ${{ needs.prepare.outputs.channels }}
          CHANNEL: ${{ inputs.channel || 'alpha' }}
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_AR_EG: ${{ inputs.notes_ar_eg }}
        run: |
          # The release people install from by hand: v<version>, with
          # uniform file names, checksums and what's new from changes/.
          tag="v$V"
          mkdir -p dist/human
          cp dist/in/steps-release-apk/steps.apk "dist/human/Steps-$V-android.apk"
          cp dist/in/steps-release-mac/Steps.app.zip "dist/human/Steps-$V-mac.zip"
          (cd dist/human && sha256sum Steps-* > SHA256SUMS.txt)
          first="${CHANNELS%% *}"
          scripts/release-notes.sh "dist/update/$first/update.json" "$CHANNEL" "$NOTES_EN" "$NOTES_AR_EG" > dist/notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flag=--prerelease
            [ "$CHANNEL" = stable ] && flag=--latest
            gh release create "$tag" "$flag" --target "$GITHUB_SHA" --title "Steps $V" --notes-file dist/notes.md
          fi
          gh release upload "$tag" dist/human/* --clobber
          # The feeds: files first, the signed manifest last.
          for channel in $CHANNELS; do
            feed="steps-$channel"
            out="dist/update/$channel"
            if ! gh release view "$feed" >/dev/null 2>&1; then
              gh release create "$feed" --prerelease --latest=false --target "$GITHUB_SHA" --title "Steps updates ($channel)" \
                --notes "Steps's $channel update feed. The app reads update.json, checks its signature and each file's SHA-256. Published by the Release workflow; never edit by hand."
            fi
            files=()
            for f in "$out"/*; do
              case "$(basename "$f")" in update.json|update.json.sig) ;; *) files+=("$f") ;; esac
            done
            gh release upload "$feed" "${files[@]}" --clobber
            gh release upload "$feed" "$out/update.json.sig" "$out/update.json" --clobber
            echo "published $V on $channel: https://github.com/$GH_REPO/releases/tag/$feed"
          done
