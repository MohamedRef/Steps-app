name: Nightly checks

# The slow and platform checks, nightly and by hand only, never per pull
# request (Mohamed, 2026-11-04; they moved here from ci.yml): Android arm64,
# web and Worker compiles, the Worker end-to-end test and the 90% coverage
# gate. Run one now: Actions › Nightly checks › Run workflow.
on:
  schedule:
    - cron: "9 3 * * *"
  workflow_dispatch:

# A started run finishes; a newer one waits for it.
concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android arm64 compiles
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy for aarch64-linux-android with the runner's NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          cargo clippy -p steps-app --target aarch64-linux-android --no-default-features --features mobile -- -D warnings

  coverage:
    name: Test coverage (90% of lines)
    # The slowest job; pull requests still run every test in ci.yml `check`.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # docs/RUN.md § Coverage. Left out: the browser-check fixture exporters
      # (run by the screens jobs) and platform/, the device glue that only
      # runs on a Mac, an Android phone or in a browser.
      - name: Every crate's tests, at least 90% of lines covered
        run: >-
          cargo llvm-cov --workspace --summary-only --fail-under-lines 90
          --ignore-filename-regex '(browser\.rs|browser_fixture\.rs|crates/app/src/platform/)'
      # Under 90% at night: say so where it is seen, once.
      - name: Open an issue when coverage drops
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly coverage under 90% of lines"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "The nightly coverage job failed on ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  later-dates:
    name: Tests on later dates (tomorrow, next year)
    # A test pinned to today's date passes the day it is written and turns
    # every pull request red the next morning (2026-11-05: the changelog
    # test). This runs every test with the clock moved forward, so such a
    # test is caught here at night, not on everyone's PRs.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: libfaketime
        run: sudo apt-get update && sudo apt-get install -y faketime
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: later-dates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Every test, 37 hours on (past midnight) and 400 days on (another year)
        run: scripts/test-later-dates.sh '+37h' '+400d'
      - name: Open an issue when a test depends on today's date
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly: a test depends on today's date"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "A test failed with the clock moved forward on ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Use dates relative to now (or a fixed clock) in that test (docs/RUN.md § Tests and coverage)."
          fi

  web:
    name: Web app compiles (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # docs/WEB.md: the same app, built for the browser.
      - run: cargo clippy -p steps-app --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  worker:
    name: Steps Cloud Worker compiles (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p steps-server --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Local Worker test tools
        run: |
          cargo install worker-build --version ^0.8 --locked
          npm install -g wrangler@4
      - name: Steps Cloud end-to-end (fake Google, two devices)
        run: node crates/server/tests/e2e.mjs
