name: Lesson and study browser regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch: a newer push cancels the older run, on main too (the
# newest main holds every earlier merge).
concurrency:
  group: screens-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: settings-browser
          # Only main saves: pull-request caches can't be read by other
          # branches and evicted main's from the 10 GB store.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Render the production lesson player and study screen
        env:
          APP_BROWSER_FIXTURES: ${{ github.workspace }}/target/screen-fixtures
        run: cargo test -p steps-app --no-default-features --locked export_screen_fixtures -- --ignored
      - name: Install the pinned test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Layout, RTL, touch targets, names and Back targets
        run: NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" node crates/app/tests/screens-browser.cjs target/screen-fixtures target/screen-results
      - name: Browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens-browser-results
          path: target/screen-results
          if-no-files-found: ignore
          retention-days: 14
