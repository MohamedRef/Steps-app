name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The platform compiles (Android, web, Worker) and the 90% coverage gate run
# nightly and by hand in nightly.yml, so a pull request waits only on the
# checks that gate it (Mohamed, 2026-11-04). They used to be skipped jobs in
# this file, which cluttered every pull request's run.
#
# One run per branch: a newer push cancels the older run, on main too (the
# newest main holds every earlier merge, so testing it covers them). Many
# merges in an hour used to stack one full run per commit and starve the
# pull requests of runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, content
    runs-on: ubuntu-24.04
    # A green run takes about 13 minutes. Without a limit, a hung test holds
    # a runner for 6 hours.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its first parent, for the What's new check.
          fetch-depth: 2
      - name: No build output, book text or huge files in git
        run: scripts/check-tracked-files.sh
      # Mohamed, 2026-11-05: nothing on GitHub names the tools the work was
      # written with. The pull request's title and body are checked here;
      # merge with them as the squash message (docs/RUN.md), so branch
      # commit trailers never reach main.
      - name: No assistant names in the pull request's text
        if: github.event_name == 'pull_request'
        # Read live, not from the event, so editing the text and re-running
        # the job is enough.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          tool="cl""aude|anthr""opic"
          text="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.title + "\n" + (.body // "")')"
          hits="$(printf '%s\n' "$text" | grep -iE "$tool" | grep -viE "(${tool%%|*})[ -]bernard" || true)"
          # A warning, not a failure: the posting tools can append a footer on
          # their own, and a check nobody can clear would stop every merge.
          if [ -n "$hits" ]; then
            echo "::warning title=Assistant named::The pull request's title or body names an assistant (Mohamed: never on GitHub). Edit it (the gh CLI adds a footer on every write; edit with the GitHub web page or API tools that don't) and re-run this job."
            echo "$hits" | head -10
            true
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      # The app's desktop WebView (its default `desktop` feature) needs
      # WebKitGTK, and installing it with apt took ~4.7 of the ~13 minutes
      # (#109). The tests render with Dioxus SSR and never open a window, so
      # the app is checked here without that feature; the nightly Mac build
      # and `just check` compile the desktop path.
      - run: cargo clippy --workspace --exclude steps-app --all-targets -- -D warnings
      - run: cargo clippy -p steps-app --no-default-features --all-targets -- -D warnings
      # A test past a minute is named on the run (Mohamed, 2026-11-04: keep
      # the runs fast). Tests that grow with the content were the cause
      # before: a bank paper of every MCQ took minutes per test.
      - name: cargo test --workspace
        run: |
          set -o pipefail
          { cargo test --workspace --exclude steps-app && cargo test -p steps-app --no-default-features; } 2>&1 | tee test-output.txt
      - name: Name the slow tests
        if: always()
        run: |
          grep -oE 'test [^ ]+ has been running for over 60 seconds' test-output.txt 2>/dev/null \
            | awk '{print "::warning title=Slow test::" $2 " ran over a minute; make it smaller (docs/RUN.md § Tests and coverage)"}' || true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Android Back navigation controller regression tests
        run: node --test crates/app/tests/system-back.test.cjs
      - name: Production Android Back and Settings keyboard regression tests
        run: node --test crates/app/tests/ui-runtime.test.mjs
      - name: Content impact classification tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_content_impact.py' -v
      - name: Explain update impact
        if: github.event_name == 'pull_request'
        run: python3 scripts/content_impact.py --base HEAD^1 --head HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Content checks (schema, ids, pages, approvals)
        run: cargo run -q -p steps-tools -- validate
      - name: Offline content pack builds and round-trips
        run: cargo run -q -p steps-tools -- packs build --check
      # His review history, lesson progress and plan point at content ids.
      # Against the commit before this one (the PR's base; the previous
      # main on a push), no id may vanish or change meaning unless
      # content/ids-retired.txt says so (docs/CONTENT-IDS.md).
      - name: Content ids his records point at
        run: |
          status=0
          cargo run -q -p steps-tools -- ids check --base HEAD^1 > ids.txt 2>&1 || status=$?
          cat ids.txt
          { echo '### Content ids'; echo '```'; cat ids.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Every pull request says what Mohamed will notice in
      # changes/<topic>.yaml (docs/RELEASE.md §5, "What's new"): new lines in
      # a new or existing file, or a new file holding [] when there is
      # nothing to tell. Without one the update showed the PR's English
      # title under the wrong kind. The files must parse. HEAD is the merge
      # commit; HEAD^1 is the base it was made on, so a base that moved
      # since can't lend this PR its files (#320).
      - name: What's new file
        if: github.event_name == 'pull_request'
        run: cargo run -q -p steps-tools -- update changes --gate HEAD^1
