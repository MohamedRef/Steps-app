name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The platform compiles (Android, web, Worker) run nightly and by hand only,
  # so a pull request waits on the checks that gate it (Mohamed, 2026-11-04).
  schedule:
    - cron: "7 3 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, content
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # The merge commit and its first parent, for the What's new check.
          fetch-depth: 2
      - name: No build output, book text or huge files in git
        run: scripts/check-tracked-files.sh
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Android Back navigation controller regression tests
        run: node --test crates/app/tests/system-back.test.cjs
      - name: Production Android Back and Settings keyboard regression tests
        run: node --test crates/app/tests/ui-runtime.test.mjs
      - name: Content impact classification tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_content_impact.py' -v
      - name: Explain update impact
        if: github.event_name == 'pull_request'
        run: python3 scripts/content_impact.py --base HEAD^1 --head HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Content checks (schema, ids, pages, approvals)
        run: cargo run -q -p steps-tools -- validate
      - name: Offline content pack builds and round-trips
        run: cargo run -q -p steps-tools -- packs build --check
      # His review history, lesson progress and plan point at content ids.
      # Against the commit before this one (the PR's base; the previous
      # main on a push), no id may vanish or change meaning unless
      # content/ids-retired.txt says so (docs/CONTENT-IDS.md).
      - name: Content ids his records point at
        run: |
          status=0
          cargo run -q -p steps-tools -- ids check --base HEAD^1 > ids.txt 2>&1 || status=$?
          cat ids.txt
          { echo '### Content ids'; echo '```'; cat ids.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      # Every pull request says what Mohamed will notice in
      # changes/<topic>.yaml (docs/RELEASE.md §5, "What's new"): new lines in
      # a new or existing file, or a new file holding [] when there is
      # nothing to tell. Without one the update showed the PR's English
      # title under the wrong kind. The files must parse. HEAD is the merge
      # commit; HEAD^1 is the base it was made on, so a base that moved
      # since can't lend this PR its files (#320).
      - name: What's new file
        if: github.event_name == 'pull_request'
        run: cargo run -q -p steps-tools -- update changes --gate HEAD^1

  android:
    name: Android arm64 compiles
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy for aarch64-linux-android with the runner's NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          cargo clippy -p steps-app --target aarch64-linux-android --no-default-features --features mobile -- -D warnings

  coverage:
    name: Test coverage (90% of lines)
    # Nightly and by hand only (Mohamed, 2026-11-04): it is the slowest job,
    # and pull requests still run every test in `check`.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # docs/RUN.md § Coverage. Left out: the browser-check fixture exporters
      # (run by the screens jobs) and platform/, the device glue that only
      # runs on a Mac, an Android phone or in a browser.
      - name: Every crate's tests, at least 90% of lines covered
        run: >-
          cargo llvm-cov --workspace --summary-only --fail-under-lines 90
          --ignore-filename-regex '(browser\.rs|browser_fixture\.rs|crates/app/src/platform/)'
      # Under 90% at night: say so where it is seen, once.
      - name: Open an issue when coverage drops
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Nightly coverage under 90% of lines"
          if [ -z "$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[].number')" ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "The nightly coverage job failed on ${GITHUB_SHA::7}: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi

  web:
    name: Web app compiles (wasm32)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # docs/WEB.md: the same app, built for the browser.
      - run: cargo clippy -p steps-app --target wasm32-unknown-unknown --no-default-features --features web -- -D warnings

  worker:
    name: Steps Cloud Worker compiles (wasm32)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p steps-server --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Local Worker test tools
        run: |
          cargo install worker-build --version ^0.8 --locked
          npm install -g wrangler@4
      - name: Steps Cloud end-to-end (fake Google, two devices)
        run: node crates/server/tests/e2e.mjs
