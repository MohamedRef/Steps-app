    src: { page: 246, quote: "Ascending paralysis, respiratory failure, salivation" }
    status: unverified
  - id: pharm.L03.008
    kind: mcq
    topic: plant-toxins
    stem: >-
      A 42-year-old man collapses after drinking an herbal tincture made from monkshood. He has tingling
      of his face and limbs, a BP of 80/50 mm Hg, and ECG shows polymorphic ventricular tachycardia.
      Which antiarrhythmic approach does the book recommend?
    options:
      - Lidocaine or amiodarone; avoid class IA and III
      - Procainamide, a class IA antiarrhythmic
      - Sotalol, a class III antiarrhythmic
      - Digoxin-specific antibody Fab fragments
      - Physostigmine to reverse anticholinergic effects
    answer: 0
    why:
      - "Right. Aconitine activates Na+ channels (site 2) with sustained Na+ influx → ventricular arrhythmias; treat with lidocaine or amiodarone and avoid class IA/III."
      - "Procainamide is class IA, which the book says to avoid."
      - "Sotalol is a class III agent, also to avoid."
      - "Digoxin Fab treats cardiac glycoside (foxglove, oleander) poisoning."
      - "Physostigmine treats anticholinergic (jimsonweed) toxicity."
    src: { page: 246, quote: "Supportive, lidocaine or amiodarone for arrhythmia; avoid class IA/III agents" }
    status: unverified
