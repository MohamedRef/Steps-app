  - id: pharm.L03.002
    kind: card
    topic: ingested-seafood-toxins
    front: What are the symptoms of scombroid poisoning, and what is it often mistaken for?
    back: It mimics anaphylaxis (oral burning, facial flushing, erythema, urticaria, itching; may progress to bronchospasm, angioedema, hypotension) and is frequently misdiagnosed as fish allergy.
    src: { page: 246, quote: "Frequently misdiagnosed as fish allergy Mimics anaphylaxis: oral burning sensation, facial flushing, erythema, urticaria, itching; may progress to bronchospasm, angioedema, hypotension" }
    status: unverified
    tags: [high-yield]
  - id: pharm.L03.003
    kind: card
    topic: ingested-seafood-toxins
    front: Which seafood toxin causes reversal of hot and cold sensations, and what are its other features?
    back: "Ciguatoxin (reef fish): nausea, vomiting, diarrhea, perioral numbness, reversal of hot and cold sensations, bradycardia, heart block, hypotension."
    src: { page: 246, quote: "Nausea, vomiting, diarrhea, perioral numbness, reversal of hot and cold sensations, bradycardia, heart block, hypotension" }
    status: unverified
    tags: [high-yield]
  - id: pharm.L03.004
    kind: mcq
    topic: ingested-seafood-toxins
    stem: >-
      A 30-year-old man comes to the emergency department 2 hours after eating barracuda on a Caribbean
      holiday. He has vomiting, diarrhea and numbness around his mouth, and says that cold drinks feel
      hot. His heart rate is 48/min. What is the mechanism of the toxin responsible?
    options:
      - It opens Na+ channels, causing depolarization
      - It blocks fast voltage-gated Na+ channels, preventing depolarization
      - Bacterial histidine decarboxylase converts histidine to histamine
      - It inhibits Na+/K+-ATPase
      - It antagonizes muscarinic ACh receptors
    answer: 0
    why:
      - "Right. Ciguatoxin from reef fish (barracuda, snapper, moray eel) opens Na+ channels; reversal of hot and cold sensations and bradycardia are classic."
      - "Blocking Na+ channels is tetrodotoxin from pufferfish, causing paresthesias, weakness and loss of reflexes."
      - "Histamine (scombroid) poisoning comes from spoiled dark-meat fish and mimics anaphylaxis."
      - "Na+/K+-ATPase inhibition is the action of cardiac glycosides (foxglove, oleander)."
      - "Muscarinic antagonism is the action of atropine/jimsonweed: dry skin and mydriasis, not hot-cold reversal."
    src: { page: 246, quote: "Ciguatoxin Reef fish such as barracuda, snapper, and moray eel Opens Na+ channels, causing depolarization" }
    status: unverified
