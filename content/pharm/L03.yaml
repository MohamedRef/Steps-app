      - [Atropine/scopolamine, "Atropa belladonna, Datura stramonium (jimsonweed)", Muscarinic antagonist, "Anticholinergic toxidrome: dry mouth, mydriasis, hyperthermia, delirium", "Physostigmine, cooling, fluids"]
