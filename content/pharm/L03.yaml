      - "Na+/K+-ATPase inhibition is digoxin's mechanism."
      - "Dilated cardiomyopathy is from alcohol, anthracyclines and trastuzumab."
      - "Histamine release is vancomycin infusion reaction."
    src: { page: 247, quote: "Torsades de pointes Associated with agents that prolong QT interval: Methadone, antiArrhythmics (class IA, III), antiBiotics (eg, macrolides, fluoroquinolones)" }
    status: unverified
