    kind: mcq
    topic: drug-reactions-cardiovascular
    stem: >-
      A 34-year-old woman in a methadone maintenance program is admitted with community-acquired
      pneumonia and started on azithromycin. On day 2 she has nausea and is given ondansetron. That
      evening she has a syncopal episode; telemetry shows polymorphic ventricular tachycardia with a
      twisting QRS axis. What is the shared mechanism of her three medications that caused this?
    options:
      - Prolongation of the QT interval
      - Coronary vasospasm
      - Inhibition of Na+/K+-ATPase
      - Dilated cardiomyopathy
      - Histamine release
    answer: 0
    why:
      - "Right. Methadone, macrolides (antiBiotics) and ondansetron (antiEmetics) all prolong QT, causing torsades de pointes."
