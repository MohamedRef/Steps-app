items:
  # ---------- p234: drug effect modifications ----------
  - id: pharm.L02.001
    kind: table
    topic: drug-effect-modifications
    title: Drug effect modifications
    columns: [Term, Definition, Example]
    rows:
      - [Additive, "A + B = sum of individual effects (2 + 2 = 4)", Aspirin and acetaminophen]
      - [Permissive, "A is required for the full effects of B", Cortisol on catecholamine responsiveness]
      - [Synergistic, "A + B > sum of individual effects (2 + 2 > 4)", Clopidogrel with aspirin]
      - [Potentiation, "Drug B (no action alone) enhances drug A (2 + 0 > 2)", Carbidopa blocking peripheral conversion of levodopa]
      - [Antagonistic, "A + B < sum of individual effects (2 + 2 < 4)", Morphine with naloxone]
      - [Tachyphylactic, "Acute ↓ response after initial/repeated administration", "Repeated intranasal oxymetazoline → ↓ response, rebound congestion"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [3, 1], [1, 1]]
    src: { page: 234, quote: "Synergistic Effect of substances A and B together is greater than the sum of their individual effects Clopidogrel with aspirin" }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.002
    kind: card
    topic: drug-effect-modifications
    front: "How does potentiation differ from synergism? Give an example of potentiation."
    back: In potentiation drug B has no therapeutic action alone but enhances drug A ("2 + 0 > 2"), eg, carbidopa only blocks the enzyme that converts levodopa peripherally.
    src: { page: 234, quote: "Similar to synergism, but drug B (with no therapeutic action alone) enhances the therapeutic action of drug A Carbidopa only blocks enzyme to prevent peripheral conversion of levodopa" }
    status: unverified
  - id: pharm.L02.003
    kind: mcq
    topic: drug-effect-modifications
    stem: >-
      A 28-year-old woman has used an over-the-counter oxymetazoline nasal spray several times a day for
      two weeks for a cold. The spray now seems to work less each time, and her congestion is worse than
      before whenever she stops it. Which term best describes this change in her response to the drug?
    options:
      - Tachyphylaxis
      - Permissive effect
      - Potentiation
      - Synergism
      - Antagonism
    answer: 0
    why:
      - "Right. Tachyphylaxis is an acute decrease in response after repeated doses; the book's example is intranasal oxymetazoline with rebound congestion."
      - "A permissive effect means drug A is needed for B's full effect (cortisol on catecholamine responsiveness)."
      - "Potentiation is drug B with no action alone enhancing drug A (carbidopa with levodopa)."
      - "Synergism is a combined effect greater than the sum (clopidogrel with aspirin)."
      - "Antagonism is a combined effect less than the sum (morphine with naloxone); only one drug is used here."
    src: { page: 234, quote: "Acute decrease in response to a drug after initial/repeated administration Repeat use of intranasal decongestant (eg, oxymetazoline) → ↓ therapeutic response (with rebound congestion)" }
    status: unverified
  # ---------- p234: autonomic receptors ----------
  - id: pharm.L02.004
    kind: card
    topic: autonomic-receptors
    front: Which nerves make up the parasympathetic nervous system?
    back: The pelvic splanchnic nerves and cranial nerves III, VII, IX and X.
    src: { page: 234, quote: "Pelvic splanchnic nerves and CNs III, VII, IX, and X are part of the parasympathetic nervous system." }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.005
    kind: card
    topic: autonomic-receptors
    front: What innervates the adrenal medulla?
    back: Preganglionic sympathetic fibers directly (acting on Nn receptors); the medulla releases epinephrine into the blood.
    src: { page: 234, quote: "Adrenal medulla is directly innervated by preganglionic sympathetic fibers." }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.006
    kind: card
    topic: autonomic-receptors
    front: Sweat glands belong to which autonomic pathway, and which neurotransmitter do their fibers use?
    back: The sympathetic pathway, but they are innervated by cholinergic fibers (ACh on M3), the "chold" sweat.
    src: { page: 234, quote: "Sweat glands are part of the sympathetic pathway but are innervated by cholinergic fibers (sympathetic nervous system results in a “chold” sweat)." }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.007
    kind: cloze
    topic: autonomic-receptors
    text: The renal vasculature smooth muscle is innervated by sympathetic postganglionic fibers releasing {{c1::dopamine}}, acting on {{c2::D1}} receptors.
    src: { page: 234, quote: "Renal vasculature smooth muscle" }
    status: unverified
  - id: pharm.L02.008
    kind: mcq
    topic: autonomic-receptors
    stem: >-
      A 45-year-old man has severe palmar hyperhidrosis that persists despite topical antiperspirants. His
      physician notes that although sweating is a fight-or-flight response, a drug that blocks
      adrenergic receptors would not reduce it. Which receptor, activated by which neurotransmitter,
      mediates his sweating?
    options:
      - Muscarinic receptor activated by acetylcholine
      - α1-receptor activated by norepinephrine
      - β2-receptor activated by epinephrine
      - Nicotinic Nm receptor activated by acetylcholine
      - D1 receptor activated by dopamine
    answer: 0
    why:
      - "Right. Sweat glands are on the sympathetic pathway but are innervated by cholinergic fibers acting on muscarinic (M3) receptors."
      - "α1-receptors are on vascular and visceral smooth muscle, not the cholinergic sweat gland fibers."
      - "β2-receptors mediate bronchodilation and vasodilation, not eccrine sweating."
      - "Nm receptors are at the skeletal neuromuscular junction."
      - "D1 receptors are on renal vascular smooth muscle."
    src: { page: 234, quote: "Sweat glands are part of the sympathetic pathway but are innervated by cholinergic fibers" }
    status: unverified
  # ---------- p235: acetylcholine receptors ----------
  - id: pharm.L02.009
    kind: card
    topic: acetylcholine-receptors
    front: What kind of receptor is the nicotinic ACh receptor, and which ions move through it?
    back: An ion channel opened by ACh binding; Na+ (sometimes Ca2+ too) rushes in while K+ leaks out.
    src: { page: 235, quote: "Nicotinic ACh receptors are ligand-gated channels allowing efflux of K+ and influx of Na+ and in some cases Ca2+." }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.010
    kind: cloze
    topic: acetylcholine-receptors
    text: The NN nicotinic receptor is found in {{c1::autonomic ganglia}} and the {{c2::adrenal medulla}}; the NM receptor is found at the {{c3::neuromuscular junction}} of skeletal muscle.
    src: { page: 235, quote: "Two subtypes: NN (found in autonomic ganglia, adrenal medulla) and NM (found in neuromuscular junction of skeletal muscle)." }
    status: unverified
  - id: pharm.L02.011
    kind: card
    topic: acetylcholine-receptors
    front: What kind of receptor is the muscarinic ACh receptor, how many subtypes are there, and where are they found?
    back: G-protein–coupled receptors acting through 2nd messengers. 5 subtypes (M1–5) in the heart, smooth muscle, brain, exocrine glands and sweat glands (cholinergic sympathetic).
    src: { page: 235, quote: "Muscarinic ACh receptors are G-protein–coupled receptors that usually act through 2nd messengers. 5 subtypes: M1–5 found in heart, smooth muscle, brain, exocrine glands, and on sweat glands (cholinergic sympathetic)." }
    status: unverified
  - id: pharm.L02.012
    kind: mcq
    topic: acetylcholine-receptors
    stem: >-
      A 19-year-old man smokes his first cigarettes at a party and develops palpitations and a rise in
      blood pressure. Nicotine acts on acetylcholine receptors that are themselves ion channels: they open
      within a millisecond to let Na+ in and K+ out, with no G protein involved. Besides the autonomic
      ganglia, where is this receptor subtype found?
    options:
      - Adrenal medulla chromaffin cells
      - Cardiac sinoatrial node cells
      - Bronchial smooth muscle
      - Parietal cells of the stomach
      - Eccrine sweat glands
    answer: 0
    why:
      - "Right. A fast ligand-gated Na+/K+ channel is a nicotinic receptor; NN receptors are in autonomic ganglia and the adrenal medulla."
      - "SA node cells use muscarinic (M2) G-protein–coupled receptors."
      - "Bronchial smooth muscle uses muscarinic (M3) receptors."
      - "Gastric glands use muscarinic receptors, not ligand-gated channels."
      - "Sweat glands use muscarinic receptors (cholinergic sympathetic)."
    src: { page: 235, quote: "Two subtypes: NN (found in autonomic ganglia, adrenal medulla)" }
    status: unverified
  # ---------- p235: pain transmission ----------
  - id: pharm.L02.013
    kind: card
    topic: pain-transmission
    front: Which fibers carry nociceptive pain, and what kind of pain does each carry?
    back: Aδ fibers carry sharp, acute pain; C fibers carry dull, throbbing, chronic pain.
    src: { page: 235, quote: "Signals transmitted by Aδ fibers (sharp, acute pain) or C fibers (dull, throbbing, chronic pain)." }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.014
    kind: card
    topic: pain-transmission
    front: Which receptors start nociceptive signaling, and how?
    back: TRPV (transient receptor potential vanilloid) receptors let Ca2+ in, and that Ca2+ switches on Na+ channels.
    src: { page: 235, quote: "Transient receptor potential vanilloid ligand receptors cause Ca2+ influx–induced Na+ channel activation." }
    status: unverified
  - id: pharm.L02.015
    kind: table
    topic: pain-transmission
    title: Processes in pain transmission and what blocks them
    columns: [Process, Blocked by]
    rows:
      - [Transduction, "Local anesthetics, α2-agonists, gabapentinoids, NSAIDs, acetaminophen, glucocorticoids"]
      - [Transmission, "Local anesthetics, α2-agonists, opioids"]
      - [Modulation, "TCAs, SSRIs, SNRIs, gabapentinoids"]
      - [Perception, "α2-agonists, opioids, TCAs, SSRIs, SNRIs"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 235, quote: "Transmission—blocked by local anesthetics, α2 -agonists, opioids Modulation—blocked by TCAs, SSRIs, SNRIs, gabapentinoids" }
    status: unverified
  - id: pharm.L02.016
    kind: card
    topic: pain-transmission
    front: "What causes neuropathic pain, and how is it transmitted? Give an example."
    back: "Faulty central or peripheral neurons; the signal rides on voltage-gated Na+ channels that are overexpressed and stay switched on. Example: diabetic peripheral neuropathy."
    src: { page: 235, quote: "Caused by neuronal dysfunction of the CNS or PNS. Transmitted via upregulation and persistent activation of voltage-gated Na+ channels. Example: diabetic peripheral neuropathy." }
    status: unverified
  - id: pharm.L02.017
    kind: mcq
    topic: pain-transmission
    stem: >-
      A 62-year-old man with long-standing type 2 diabetes has burning pain and tingling in both feet in a
      stocking distribution, worse at night. Light touch with cotton feels painful. Which mechanism most
      directly sustains his pain?
    options:
      - Upregulated, persistently active voltage-gated Na+ channels in damaged neurons
      - Activation of transient receptor potential vanilloid receptors by tissue injury
      - Prostaglandin sensitization of nociceptors at an inflamed site
      - Signals carried mainly by fast myelinated Aδ fibers
      - Loss of muscarinic receptors on sweat glands
    answer: 0
    why:
      - "Right. This is neuropathic pain (the book's example is diabetic peripheral neuropathy), transmitted by upregulation and persistent activation of voltage-gated Na+ channels."
      - "Vanilloid receptor activation starts nociceptive pain from mechanical, thermal or chemical stimuli."
      - "Prostaglandin sensitization is part of inflammatory nociceptive transduction, which NSAIDs block."
      - "Aδ fibers carry sharp acute nociceptive pain, not this chronic neuropathic pain."
      - "Sweat gland innervation is unrelated to the pain mechanism."
    src: { page: 235, quote: "Transmitted via upregulation and persistent activation of voltage-gated Na+ channels. Example: diabetic peripheral neuropathy." }
    status: unverified
  # ---------- p236: micturition ----------
  - id: pharm.L02.018
    kind: card
    topic: micturition-control
    front: What does stimulating the sympathetic and the parasympathetic system do to the bladder, and what coordinates them?
    back: "⊕ sympathetic → ↑ urinary retention; ⊕ parasympathetic → ↑ urine voiding. The micturition center in the pons coordinates them."
    src: { page: 236, quote: "Micturition center in pons regulates involuntary bladder function via coordination of sympathetic and parasympathetic nervous systems. ⊕ sympathetic → ↑ urinary retention. ⊕ parasympathetic → ↑ urine voiding." }
    status: unverified
  - id: pharm.L02.019
    kind: table
    topic: micturition-control
    title: Bladder nerves and receptors
    columns: [Nerve, Input, Receptor and target]
    rows:
      - [Pelvic nerve, Parasympathetic, M3 on detrusor muscle]
      - [Hypogastric nerve, Sympathetic, "β3 on detrusor; α1 on internal urethral sphincter"]
      - [Pudendal nerve, Somatic, Nicotinic on external urethral sphincter]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 236, quote: "Pelvic nerve (parasympathetic input) Hypogastric nerve (sympathetic input) Pudendal nerve (somatic input)" }
    status: unverified
  - id: pharm.L02.020
    kind: table
    topic: micturition-control
    title: Autonomic drugs for bladder dysfunction
    columns: [Drug, Mechanism, Application]
    rows:
      - [Muscarinic agonist (bethanechol), "⊕ M3 → detrusor contraction → ↑ bladder emptying", Urinary retention]
      - [Muscarinic antagonist (oxybutynin), "⊝ M3 → detrusor relaxation → ↓ detrusor overactivity", Urgency incontinence]
      - [Sympathomimetic (mirabegron), "⊕ β3 → detrusor relaxation → ↑ bladder capacity", Urgency incontinence]
      - [α1-antagonist (tamsulosin), "⊝ α1 → relaxation of bladder neck and prostate smooth muscle → ↓ obstruction", BPH]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [3, 1], [3, 2]]
    src: { page: 236, quote: "Muscarinic agonists (eg, bethanechol) ⊕ M3 receptor → contraction of detrusor smooth muscle → ↑ bladder emptying Urinary retention" }
    status: unverified
    tags: [high-yield]
  - id: pharm.L02.021
    kind: mcq
    topic: micturition-control
    stem: >-
      A 71-year-old woman has a sudden urge to urinate many times a day and sometimes leaks before
      reaching the toilet. Urinalysis is normal. Her physician avoids an antimuscarinic because of her
      mild cognitive impairment and chooses a drug that relaxes the detrusor and increases bladder
      capacity. Which receptor does this drug stimulate?
    options:
      - β3-receptor
      - M3 receptor
      - α1-receptor
      - Nicotinic receptor of the external sphincter
      - β1-receptor
    answer: 0
    why:
      - "Right. Mirabegron stimulates β3-receptors → detrusor relaxation → ↑ bladder capacity, for urgency incontinence."
      - "Stimulating M3 (bethanechol) contracts the detrusor; it treats urinary retention."
      - "α1-receptors are on the internal sphincter and prostate; blocking them (tamsulosin) treats BPH."
      - "The nicotinic receptor on the external sphincter is somatic (pudendal) and is not the target."
      - "β1-receptors are in the heart and kidney."
    src: { page: 236, quote: "Sympathomimetics (eg, mirabegron) ⊕ β3 receptor → relaxation of detrusor smooth muscle → ↑ bladder capacity Urgency incontinence" }
    status: unverified
  - id: pharm.L02.111
    kind: card
    topic: micturition-control
    front: "Which four drugs act on micturition control, and what does each do and treat?"
    back: "Bethanechol (muscarinic agonist, urinary retention), Oxybutynin (muscarinic antagonist, urgency incontinence), Mirabegron (β3 agonist, urgency incontinence) and Tamsulosin (α1-antagonist, BPH). Mnemonic: \"Baby one more time\" (B, O, M, T)."
    src: { page: 236, quote: "Baby one more time." }
    status: unverified
    tags: [high-yield]
  # ---------- p236: adrenergic receptor distribution ----------
