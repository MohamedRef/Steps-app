  - id: pharm.L02.023
    kind: card
    topic: adrenergic-receptor-distribution
    front: In the pancreas, which adrenergic receptor causes inhibition of insulin secretion, and which causes stimulation of insulin secretion?
    back: "α2 (pancreas): inhibition of insulin secretion. β2 (pancreas): stimulation of insulin secretion."
    src: { page: 236, quote: "Pancreas Presynaptic terminals Salivary glands Inhibition of insulin secretion" }
    status: unverified
  - id: pharm.L02.024
    kind: mcq
    topic: adrenergic-receptor-distribution
    stem: >-
      A 55-year-old man with hypertension is started on a drug that lowers his plasma renin activity by
      blocking the adrenergic receptor on his juxtaglomerular cells. Which other effect is this drug most
      likely to produce?
    options:
      - ↓ heart rate and contractility
      - Bronchodilation
      - Mydriasis
      - ↓ release of norepinephrine from sympathetic nerve endings
      - ↑ lipolysis
    answer: 0
    why:
      - "Right. The JG cells' receptor is β1, which also ↑ heart rate and contractility; blocking it lowers both."
      - "Bronchodilation comes from β2 stimulation; blocking β1 does not cause it."
      - "Mydriasis comes from α1 stimulation of the radial (dilator) muscle."
      - "↓ norepinephrine release is an α2-agonist effect (clonidine)."
      - "β1 stimulation ↑ lipolysis; blocking it would not raise lipolysis."
    src: { page: 236, quote: "β1 Heart Kidney ↑ heart rate, contractility ↑ renin secretion" }
    status: unverified
