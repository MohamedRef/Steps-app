  - id: pharm.L01.043
    kind: card
    topic: efficacy-vs-potency
    front: What is potency, and what does a left shift of the dose-response curve mean?
    back: The amount of drug needed for a given effect, read as the x-value (EC50). Left shift = ↓ EC50 = ↑ potency = less drug needed. Unrelated to efficacy.
    src: { page: 232, quote: "Amount of drug needed for a given effect. Represented by the x-value (EC50). Left shifting = ↓ EC50 = ↑ potency = ↓ drug needed." }
