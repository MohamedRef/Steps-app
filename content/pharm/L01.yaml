  # ---------- p232: efficacy vs potency ----------
  - id: pharm.L01.042
    kind: card
    topic: efficacy-vs-potency
    front: What is efficacy, and where is it read on a dose-response curve?
    back: The maximal effect a drug can produce (intrinsic activity), read as the y-value (Emax). It is unrelated to potency. Partial agonists have less efficacy than full agonists.
    src: { page: 232, quote: "Maximal effect a drug can produce (intrinsic activity). Represented by the y-value (Emax). ↑ y-value = ↑ Emax = ↑ efficacy. Unrelated to potency" }
    status: unverified
