  - id: pharm.L04.009
    kind: mcq
    topic: drug-names-autonomic
    stem: >-
      A 70-year-old man with benign prostatic hyperplasia and hypertension is started on doxazosin. He
      asks why its name sounds like prazosin. Based on the name, how do both drugs act?
    options:
      - They block α1-receptors on smooth muscle
      - They block β1-receptors in the heart
      - They stimulate β2-receptors, relaxing smooth muscle
      - They inhibit acetylcholinesterase
      - They stimulate muscarinic receptors
    answer: 0
    why:
      - "Right. -zosin is an α1-blocker (prazosin); blocking α1-mediated smooth muscle contraction lowers BP and eases urinary outflow."
      - "β-blockers end in -olol."
      - "β2-agonists end in -terol."
      - "AChE inhibitors end in -stigmine."
      - "Cholinergic agonists end in -chol."
