  - id: pharm.L04.011
    kind: mcq
    topic: drug-names-cardiovascular
    stem: >-
      A 63-year-old woman arrives 90 minutes after the sudden onset of left-sided weakness and slurred
      speech. CT shows no hemorrhage, and alteplase is given. Based on its name, how does this drug act?
    options:
      - It dissolves the clot that has already formed
      - It potentiates antithrombin
      - It directly inhibits factor Xa
      - It inhibits angiotensin-converting enzyme
      - It inhibits phosphodiesterase-5
    answer: 0
    why:
      - "Right. -plase is a thrombolytic (alteplase): it breaks down an existing clot rather than preventing a new one."
      - "Heparins (LMWH ends in -parin, enoxaparin) potentiate antithrombin."
      - "Direct factor Xa inhibitors end in -xaban (apixaban)."
      - "ACE inhibitors end in -pril."
      - "PDE-5 inhibitors end in -afil."
    src: { page: 253, quote: "-plase Thrombolytic Alteplase" }
    status: unverified
