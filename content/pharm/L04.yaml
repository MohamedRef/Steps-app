  - id: pharm.L04.005
    kind: mcq
    topic: drug-names-antineoplastic
    stem: >-
      A 9-year-old boy with Burkitt lymphoma is about to start chemotherapy. His uric acid is 11 mg/dL
      and creatinine is rising. He is given rasburicase. Based on the ending of its name, how does this
      drug act?
    options:
      - It breaks down uric acid
      - It inhibits xanthine oxidase
      - It alkylates DNA after crossing the blood-brain barrier
      - It cross-links DNA strands with platinum
      - It inhibits topoisomerase I
    answer: 0
    why:
      - "Right. -case is a recombinant uricase (rasburicase), which breaks down uric acid instead of blocking its production."
      - "Xanthine oxidase inhibitors (allopurinol, febuxostat) block uric acid production; -case means recombinant uricase."
      - "Nitrosoureas end in -mustine (carmustine)."
      - "Platinum compounds end in -platin (cisplatin)."
      - "Topoisomerase I inhibitors end in -tecan (irinotecan)."
    src: { page: 252, quote: "-case Recombinant uricase Rasburicase" }
    status: unverified
