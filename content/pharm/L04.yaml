    stem: >-
      A 52-year-old woman with type 2 diabetes and heart failure is started on empagliflozin. She later
      develops a genital yeast infection. Based on the drug's name, how does it act?
    options:
      - It inhibits sodium-glucose cotransporter 2 in the kidney
      - It inhibits dipeptidyl peptidase-4 in the plasma
      - It acts as a GLP-1 analog to increase insulin release
      - It closes K+ channels in β cells, like a meglitinide
      - It activates PPAR-γ to increase insulin sensitivity
    answer: 0
    why:
      - "Right. -gliflozin is an SGLT-2 inhibitor (dapagliflozin); the glucose it leaves in the urine favors genital yeast infections."
      - "DPP-4 inhibitors end in -gliptin (sitagliptin)."
      - "GLP-1 analogs end in -glutide (liraglutide)."
