    front: "Hepatitis C drugs: what do the endings -asvir, -buvir and -previr inhibit?"
    back: "-asvir: NS5A (ledipasvir). -buvir: NS5B (sofosbuvir). -previr: NS3/4A (grazoprevir)."
    src: { page: 252, quote: "-asvir NS5A inhibitor Ledipasvir -bendazole Antiparasitic/antihelminthic Mebendazole -buvir NS5B inhibitor Sofosbuvir" }
