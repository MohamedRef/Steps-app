  - id: pharm.L04.007
    kind: mcq
    topic: drug-names-cns
    stem: >-
      A 66-year-old man with Parkinson disease on carbidopa-levodopa has "wearing-off" episodes before
      each dose. His neurologist adds entacapone. Based on its name, how does entacapone act?
    options:
      - It inhibits catechol-O-methyltransferase
      - It inhibits monoamine oxidase B
      - It inhibits the vesicular monoamine transporter
      - It blocks muscarinic receptors
      - It is a 5-HT1B/1D agonist
    answer: 0
    why:
      - "Right. -capone is a COMT inhibitor (entacapone)."
      - "MAO-B inhibitors end in -giline (selegiline)."
      - "VMAT inhibitors end in -benazine (tetrabenazine)."
      - "Entacapone is not an antimuscarinic; benztropine is."
      - "5-HT1B/1D agonists end in -triptan."
    src: { page: 252, quote: "-capone COMT inhibitor Entacapone" }
    status: unverified
