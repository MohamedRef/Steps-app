  - id: pharm.L04.003
    kind: mcq
    topic: drug-names-antimicrobial
    stem: >-
      A 41-year-old man with HIV starts a regimen that includes dolutegravir. His pharmacist explains
      that the drug's name tells its class. Which step of the viral life cycle does dolutegravir block?
    options:
      - Insertion of viral DNA into the host genome
      - Cleavage of viral polyproteins
      - Release of virions from the host cell by neuraminidase
      - Viral DNA polymerase activity on herpesvirus DNA
      - Bacterial transpeptidation
    answer: 0
    why:
      - "Right. -tegravir is an integrase inhibitor, which blocks integration of viral DNA into the host genome."
      - "Polyprotein cleavage is blocked by protease inhibitors (-navir, eg, ritonavir)."
      - "Neuraminidase inhibitors end in -mivir (oseltamivir)."
      - "Viral DNA polymerase inhibitors end in -ovir (acyclovir)."
      - "Transpeptidase inhibitors end in -cillin."
    src: { page: 252, quote: "-tegravir Integrase inhibitor Dolutegravir" }
    status: unverified
