  # ---------- p459: muscle contraction ----------
  - id: msk.L01.081
    kind: card
    topic: muscle-contraction
    front: What are T-tubules, and why do they matter?
    back: "Tube-shaped infoldings of the muscle cell membrane that reach deep into the fiber and touch the sarcoplasmic reticulum, so the action potential reaches every sarcomere at once and the whole striated fiber contracts together."
    src: { page: 459, quote: "T-tubules are extensions of plasma membrane in contact with the sarcoplasmic reticulum, allowing for coordinated contraction of striated muscles." }
    status: unverified
  - id: msk.L01.082
    kind: order
    topic: muscle-contraction
    prompt: Put the steps from motor neuron action potential to muscle contraction in order.
    steps:
      - Action potential opens presynaptic voltage-gated Ca2+ channels → ACh release
      - Postsynaptic ACh binding depolarizes the motor end plate; depolarization spreads into the T-tubules
      - Depolarization changes the dihydropyridine receptor (DHPR), mechanically coupled to the ryanodine receptor → Ca2+ release from the sarcoplasmic reticulum
      - Ca2+ binds troponin C, shifting tropomyosin off the myosin-binding sites on actin
      - Myosin head binds actin (crossbridge); Pi release starts the power stroke
      - ADP is released at the end of the power stroke
      - New ATP binds and detaches the myosin head from actin
      - ATP hydrolysis cocks the myosin head back to its high-energy position
    src: { page: 459, quote: "Membrane depolarization induces conformational changes in the voltage- sensitive dihydropyridine receptor (DHPR) and its mechanically coupled ryanodine receptor" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.083
    kind: card
    topic: muscle-contraction
    front: Which protein buffers Ca2+ inside the sarcoplasmic reticulum, and which pump takes Ca2+ back up for relaxation?
    back: Calsequestrin buffers it; the sarco(endo)plasmic reticulum Ca2+ ATPase (SERCA) takes it back up → relaxation.
    src: { page: 459, quote: "release from the sarcoplasmic reticulum (buffered by calsequestrin) into the cytoplasm." }
    status: unverified
  - id: msk.L01.084
    kind: card
    topic: muscle-contraction
    front: What does Ca2+ bind to start contraction, and what happens next?
    back: Troponin C (TnC). Tropomyosin, which was blocking the myosin-binding sites on actin, shifts to expose them.
    src: { page: 459, quote: "Tropomyosin is blocking myosin-binding sites on the actin filament. Released binds to troponin" }
    status: unverified
  - id: msk.L01.085
    kind: card
    topic: muscle-contraction
    front: What causes the myosin head to detach from actin, and what re-cocks it?
    back: Binding of a new ATP detaches it; hydrolysis of that ATP into ADP and Pi returns the head to its high-energy (cocked) position.
    src: { page: 459, quote: "Binding of new ATP molecule causes detachment of myosin head from actin filament." }
    status: unverified
  - id: msk.L01.086
    kind: cloze
    topic: muscle-contraction
    text: "In contraction, the {{c1::H}} and {{c2::I}} bands and the distance between Z lines shorten (HI, I'm wearing shortZ), while the {{c3::A}} band stays the same length."
    src: { page: 459, quote: "Muscle shortening occurs, with shortening of H and I bands and between Z lines (HI, I’m wearing shortZ). The A band remains the same length (A band is Always the same length)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.148
    kind: card
    topic: muscle-contraction
    front: On the book's sarcomere figure, what are the sarcomere, the A band and the I band made of?
    back: "A sarcomere runs from one Z line to the next. The A band is the length of the myosin (thick filament), centred on the M line, with the H band as its myosin-only middle; the I band holds only actin (thin filament) on either side of a Z line."
    src: { page: 459, quote: "Myosin H band Sarcomere (Z line to Z line) A band I band I band M line Myosin (thick filament) Actin (thin filament) Z line" }
    status: unverified
  - id: msk.L01.149
    kind: card
    topic: muscle-contraction
    front: After ATP hydrolysis re-cocks the myosin head, what decides whether it forms another crossbridge?
    back: "Whether Ca2+ is still available: the cocked head can bind a new site on actin and repeat the cycle as long as Ca2+ keeps the binding sites exposed. Once SERCA pumps Ca2+ back into the sarcoplasmic reticulum, the muscle relaxes."
    src: { page: 459, quote: "The myosin head can bind to a new site on actin to form a crossbridge if Ca2+ remains available." }
    status: unverified
  - id: msk.L01.087
    kind: mcq
    topic: muscle-contraction
    stem: >-
      A 25-year-old man is found dead in a cold mountain cabin. At autopsy, his skeletal muscles are
      rigid. Electron microscopy of a muscle sample shows myosin heads tightly bound to actin. The
      absence of which molecule best explains the persistent crossbridges?
    options:
      - ATP
      - Ca2+
      - Acetylcholine
      - Troponin C
      - Inorganic phosphate
    answer: 0
    why:
      - "Right. A new ATP must bind myosin to detach the head from actin; without ATP the crossbridges stay locked (rigor)."
      - "Ca2+ exposes the binding sites; it is needed to attach, not to detach."
      - "ACh starts the end-plate depolarization; it doesn't release crossbridges."
      - "Troponin C binds Ca2+ to move tropomyosin; it doesn't detach myosin."
      - "Pi release starts the power stroke; detachment needs ATP binding."
    src: { page: 459, quote: "Binding of new ATP molecule causes detachment of myosin head from actin filament." }
    status: unverified
