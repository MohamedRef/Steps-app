  # ---------- p454: distortions of the hand ----------
  - id: msk.L01.044
    kind: card
    topic: distortions-of-the-hand
    front: Why is clawing seen best with distal (not proximal) median or ulnar nerve lesions?
    back: In a distal lesion the long (extrinsic) finger flexors still work and pull unopposed by the lost lumbricals, so the fingers extend at the MCP and bend at the DIP and PIP joints.
    src: { page: 454, quote: "“Clawing” A —seen best with distal lesions of median or ulnar nerves. Remaining extrinsic flexors of the digits exaggerate the loss of the lumbricals → fingers extend at MCP, flex at DIP and PIP joints." }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.146
    kind: card
    topic: distortions-of-the-hand
    front: What balance keeps the resting hand in its normal posture?
    back: "A balance between the extrinsic (forearm) flexors and extensors of the hand and the intrinsic hand muscles, particularly the lumbricals, which flex the MCP joints and extend the DIP and PIP joints. Lose the lumbricals and the long muscles pull the fingers into a claw."
    src: { page: 454, quote: "At rest, a balance exists between the extrinsic flexors and extensors of the hand, as well as the intrinsic muscles of the hand—particularly the lumbrical muscles (flexion of MCP, extension of DIP and PIP joints)." }
    status: unverified
