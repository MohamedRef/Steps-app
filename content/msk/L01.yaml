  # ---------- p450-451: upper extremity nerves ----------
  - id: msk.L01.001
    kind: card
    topic: upper-extremity-nerves
    front: Which two shoulder injuries classically damage the axillary nerve (C5-C6)?
    back: A fracture through the surgical neck of the humerus, or an anterior dislocation of the shoulder (humeral head).
    src: { page: 450, quote: "Axillary (C5-C6) Fractured surgical neck of humerus Anterior dislocation of humerus" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.108
    kind: card
    topic: upper-extremity-nerves
    front: How does an axillary nerve (C5-C6) injury present?
    back: "A flat deltoid, inability to abduct the arm at the shoulder past about 15°, and numbness over the deltoid and the lateral arm."
    src: { page: 450, quote: "Flattened deltoid Loss of arm abduction at shoulder (>15°) Loss of sensation over deltoid and lateral arm" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.002
    kind: card
    topic: upper-extremity-nerves
    front: Musculocutaneous nerve (C5-C7) injury from upper trunk compression gives which reflex, motor and sensory deficits?
    back: "The biceps (C5-C6) jerk is weak; the patient can't bend the elbow or turn the palm up well; the skin on the radial (outer) side of the forearm goes numb."
    src: { page: 450, quote: "Upper trunk compression ↓ biceps (C5-C6) reflex Loss of forearm flexion and supination Loss of sensation over radial and lateral forearm" }
    status: unverified
  - id: msk.L01.003
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Enumerate the causes of radial nerve (C5-T1) injury (3).
    points:
      - Compression of the axilla (crutches, or sleeping with the arm over a chair, "Saturday night palsy")
      - Midshaft fracture of the humerus
      - Repetitive pronation/supination of the forearm, eg, screwdriver use ("finger drop")
    pass: 3
    hook: "الـ radial بيتعور في 3 أماكن على طول الدراع: فوق في الإبط (عكاز أو كرسي)، في النص (midshaft)، وتحت في الساعد (مفك)."
    src: { page: 450, quote: "Compression of axilla, eg, due to crutches or sleeping with arm over chair (“Saturday night palsy”) Midshaft fracture of humerus Repetitive pronation/supination of forearm, eg, due to screwdriver use (“finger drop”)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.004
    kind: card
    topic: upper-extremity-nerves
    front: What does a radial nerve injury above the elbow cause, and why is grip strength reduced?
    back: "Numbness over the back of the arm, forearm and hand, and wrist drop: the elbow, wrist and fingers can't be straightened. Grip is weaker because the finger flexors only pull at full strength when the wrist is held extended."
    src: { page: 450, quote: "Injuries above the elbow cause loss of sensation over posterior arm/forearm and dorsal hand, wrist drop (due to loss of elbow, wrist, and finger extension) with ↓ grip strength (wrist extension necessary for maximal action of flexors)" }
    status: unverified
  - id: msk.L01.005
    kind: card
    topic: upper-extremity-nerves
    front: Radial nerve injury below the elbow can cause which two deficits, and from which branches?
    back: "Tingling on the back of the hand if the sensory branch (superficial radial) is hit, or wrist drop if the motor branch (posterior interosseous) is hit."
    src: { page: 450, quote: "Injuries below the elbow can cause paresthesias of the dorsal hand (superficial radial nerve) or wrist drop (posterior interosseus nerve)" }
    status: unverified
  - id: msk.L01.006
    kind: cloze
    topic: upper-extremity-nerves
    text: In a midshaft humerus fracture with radial nerve injury, {{c1::triceps}} function and {{c2::posterior arm}} sensation are spared.
    src: { page: 450, quote: "Tricep function and posterior arm sensation spared in midshaft fracture" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.007
    kind: card
    topic: upper-extremity-nerves
    front: Which injury gives a proximal median nerve lesion, and which give a distal one?
    back: "Proximal: supracondylar fracture of the humerus. Distal: carpal tunnel syndrome and wrist laceration."
    src: { page: 450, quote: "Supracondylar fracture of humerus → proximal lesion of the nerve Carpal tunnel syndrome and wrist laceration → distal lesion of the nerve" }
    status: unverified
  - id: msk.L01.008
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Median nerve injury causes loss of wrist flexion and of which hand muscles (LOAF, 4)?
    points:
      - Lateral two Lumbricals
      - Opponens pollicis
      - Abductor pollicis brevis
      - Flexor pollicis brevis
    pass: 4
    hook: "الكتاب بيقولها LOAF: Lumbricals (الاتنين اللي برّه) و Opponens و Abductor و Flexor pollicis brevis. رغيف العيش في إيد الـ median."
    src: { page: 450, quote: "Loss of wrist flexion and function of the lateral two Lumbricals, Opponens pollicis, Abductor pollicis brevis, Flexor pollicis brevis (LOAF)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.009
    kind: cloze
    topic: upper-extremity-nerves
    text: A proximal median nerve lesion causes loss of sensation over the {{c1::thenar eminence}} and the dorsal and palmar aspects of the lateral {{c2::3 1/2}} fingers.
    src: { page: 450, quote: "Loss of sensation over thenar eminence and dorsal and palmar aspects of lateral 3 1/2 fingers with proximal lesion" }
    status: unverified
  - id: msk.L01.010
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Enumerate the causes of ulnar nerve (C8-T1) injury given in the book (3).
    points:
      - Fracture of the medial epicondyle of the humerus (proximal lesion)
      - Fractured hook of the hamate from a fall on an outstretched hand (distal lesion)
      - Compression against the hamate as the wrist rests on handlebars during cycling
    pass: 3
    src: { page: 450, quote: "Fracture of medial epicondyle of humerus (proximal lesion) Fractured hook of hamate (distal lesion) from fall on outstretched hand Compression of nerve against hamate as the wrist rests on handlebar during cycling" }
    status: unverified
  - id: msk.L01.011
    kind: card
    topic: upper-extremity-nerves
    front: What are the motor signs of ulnar nerve injury?
    back: "\"Ulnar claw\" on digit extension; radial deviation of the wrist on flexion (proximal lesion); ↓ flexion of the ulnar fingers, finger abduction and adduction (interossei), thumb adduction and the ulnar 2 lumbricals."
    src: { page: 450, quote: "“Ulnar claw” on digit extension Radial deviation of wrist upon flexion (proximal lesion) ↓ flexion of ulnar fingers, abduction and adduction of fingers (interossei), thumb adduction, actions of ulnar 2 lumbrical muscles" }
    status: unverified
  - id: msk.L01.109
    kind: card
    topic: upper-extremity-nerves
    front: Where is sensation lost in an ulnar nerve injury?
    back: Over the medial (ulnar) 1 1/2 fingers, and the hypothenar eminence with them.
    src: { page: 450, quote: "Loss of sensation over ulnar 1 1/2 fingers including hypothenar eminence" }
    status: unverified
  - id: msk.L01.012
    kind: card
    topic: upper-extremity-nerves
    front: A superficial laceration of the palm cuts the recurrent branch of the median nerve. What is lost, and what is spared?
    back: "\"Ape hand\": loss of the thenar muscle group (opposition, abduction and flexion of the thumb). No loss of sensation."
    src: { page: 450, quote: "Superficial laceration of palm “Ape hand” Loss of thenar muscle group: opposition, abduction, and flexion of thumb No loss of sensation" }
    status: unverified
  - id: msk.L01.013
    kind: cloze
    topic: upper-extremity-nerves
    text: "Humerus fractures, proximally to distally, follow the ARM nerves: {{c1::Axillary}} (surgical neck) → {{c2::Radial}} (midshaft) → {{c3::Median}} (supracondylar)."
    src: { page: 450, quote: "Humerus fractures, proximally to distally, follow the ARM (Axillary → Radial → Median) nerves" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.014
    kind: mcq
    topic: upper-extremity-nerves
    stem: >-
      A 7-year-old boy falls from a jungle gym onto his outstretched right arm. X-ray shows a displaced
      supracondylar fracture of the humerus. After reduction he cannot flex his wrist well, and when he
      tries to make a fist the index and middle fingers stay extended. Sensation is reduced over the
      thenar eminence. Which other finding is most likely?
    options:
      - Loss of sensation over the palmar lateral 3 1/2 fingers
      - Loss of finger abduction and adduction
      - Wrist drop with loss of sensation over the dorsal hand
      - Loss of sensation over the hypothenar eminence
      - Flattened deltoid with loss of arm abduction
    answer: 0
    why:
      - "Right. A supracondylar fracture gives a proximal median nerve lesion, with sensory loss over the thenar eminence and the lateral 3 1/2 fingers (hand of benediction on making a fist)."
      - "The interossei are supplied by the ulnar nerve."
      - "Wrist drop with dorsal hand numbness is a radial nerve injury, typical of a midshaft fracture."
      - "The hypothenar eminence is ulnar nerve territory."
      - "Flattened deltoid is axillary nerve injury, from a surgical neck fracture or anterior dislocation."
    src: { page: 450, quote: "Supracondylar fracture of humerus → proximal lesion of the nerve" }
    status: unverified
  - id: msk.L01.015
    kind: mcq
    topic: upper-extremity-nerves
    stem: >-
      A 45-year-old man is brought to the emergency department after a motorcycle crash. X-ray shows a
      fracture through the middle of the shaft of the left humerus. He cannot extend his wrist or fingers,
      and sensation over the dorsum of the hand is reduced. Which of the following is most likely preserved?
    options:
      - Wrist extension
      - Elbow extension
      - Finger extension at the MCP joints
      - Sensation over the dorsal hand
      - Grip strength
    answer: 1
    why:
      - "Wrist extension is lost: that is the wrist drop."
      - "Right. The radial nerve runs in the spiral groove; at the midshaft the branches to the triceps have already left, so triceps function (and posterior arm sensation) is spared."
      - "Finger extension is lost with the radial nerve."
      - "Dorsal hand sensation comes from the radial nerve and is reduced here."
      - "Grip is weak because maximal flexor action needs wrist extension."
    src: { page: 450, quote: "Tricep function and posterior arm sensation spared in midshaft fracture" }
    status: unverified
  - id: msk.L01.143
    kind: table
    topic: upper-extremity-nerves
    title: "Skin of the upper limb: which nerve (book figure)"
    columns: [Skin area, Nerve]
    rows:
      - [Over the deltoid, Axillary]
      - [Lateral arm below the deltoid, Radial]
      - [Upper medial arm near the axilla, Intercostobrachial]
      - [Medial arm, Medial brachial cutaneous]
      - [Medial forearm, Medial antebrachial cutaneous]
      - [Lateral forearm, Musculocutaneous]
      - [Lateral dorsum of the hand, Radial]
      - ["Palmar lateral 3 1/2 fingers (and their dorsal tips)", Median]
      - ["Medial 1 1/2 fingers, palm and dorsum", Ulnar]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1]]
    src: { page: 451, quote: "Intercostobrachial nerve Medial brachial cutaneous nerve Medial antebrachial cutaneous nerve Musculocutaneous nerve" }
    status: unverified
  # ---------- p451: rotator cuff ----------
  - id: msk.L01.016
    kind: enumerate
    topic: rotator-cuff-muscles
    prompt: Enumerate the rotator cuff muscles with their nerves (SItS, 4).
    points:
      - Supraspinatus (suprascapular nerve)
      - Infraspinatus (suprascapular nerve)
      - teres minor (axillary nerve)
      - Subscapularis (upper and lower subscapular nerves)
    pass: 4
    hook: "SItS، والـ t صغيرة عشان teres minor (الكتاب). والأعصاب: 2 suprascapular، و axillary للصغير، و subscapular للـ Subscapularis."
    src: { page: 451, quote: "Innervated primarily by C5-C6. SItS (small t is for teres minor)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.017
    kind: card
    topic: rotator-cuff-muscles
    front: What does the supraspinatus do?
    back: It starts lifting the arm sideways (the first part of abduction) before the deltoid takes over.
    src: { page: 451, quote: "Supraspinatus (suprascapular nerve)— abducts arm initially (before the action of the deltoid)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.118
    kind: card
    topic: rotator-cuff-muscles
    front: Which rotator cuff muscle is injured most often?
    back: The supraspinatus, either from trauma or from wear and impingement that lead to tendinopathy or a tear.
    src: { page: 451, quote: "most common rotator cuff injury (trauma or degeneration and impingement → tendinopathy or tear" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.119
    kind: card
    topic: rotator-cuff-muscles
    front: Which bedside test assesses the supraspinatus?
    back: The "empty can" (or "full can") test.
    src: { page: 451, quote: "assessed by “empty/full can” test" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.018
    kind: table
    topic: rotator-cuff-muscles
    title: Rotator cuff muscles
    columns: [Muscle, Nerve, Action]
    rows:
      - [Supraspinatus, Suprascapular, Initial abduction (before the deltoid)]
      - [Infraspinatus, Suprascapular, External rotation (pitching injury)]
      - [teres minor, Axillary, Adduction and external rotation]
      - [Subscapularis, Upper and lower subscapular, Internal rotation and adduction]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2], [3, 2]]
    src: { page: 451, quote: "Infraspinatus (suprascapular nerve)— externally rotates arm; pitching injury" }
    status: unverified
  - id: msk.L01.019
    kind: cloze
    topic: rotator-cuff-muscles
    text: The rotator cuff is innervated primarily by {{c1::C5-C6}}.
    src: { page: 451, quote: "Innervated primarily by C5-C6." }
    status: unverified
  - id: msk.L01.144
    kind: card
    topic: rotator-cuff-muscles
    front: On the book's rotator cuff figure, which cuff tendons attach to the greater tubercle of the humerus and which to the lesser tubercle?
    back: "Supraspinatus, infraspinatus and teres minor attach to the greater tubercle; subscapularis attaches to the lesser tubercle (it sits in front, so it rotates the arm internally)."
    src: { page: 451, quote: "Supraspinatus Acromion Coracoid Greater tubercle Humerus Infraspinatus Teres minor Lesser tubercle Subscapularis" }
    status: unverified
  - id: msk.L01.020
    kind: mcq
    topic: rotator-cuff-muscles
    stem: >-
      A 58-year-old house painter has had right shoulder pain for 3 months, worse when he reaches overhead.
      With his arm abducted to 90° in the scapular plane and internally rotated (thumb pointing down),
      he cannot resist downward pressure and the pain is reproduced. Which muscle is most likely injured,
      and which nerve supplies it?
    options:
      - Supraspinatus; suprascapular nerve
      - Infraspinatus; axillary nerve
      - Teres minor; suprascapular nerve
      - Subscapularis; long thoracic nerve
      - Deltoid; suprascapular nerve
    answer: 0
    why:
      - "Right. The empty-can test assesses the supraspinatus, the most common rotator cuff injury (impingement → tendinopathy or tear); it is supplied by the suprascapular nerve."
      - "The infraspinatus is supplied by the suprascapular nerve, not the axillary, and it externally rotates the arm."
      - "The teres minor is supplied by the axillary nerve."
      - "The subscapularis is supplied by the upper and lower subscapular nerves."
      - "The deltoid is supplied by the axillary nerve, and the empty-can test is for the supraspinatus."
    src: { page: 451, quote: "most common rotator cuff injury (trauma or degeneration and impingement → tendinopathy or tear [arrow in A ]), assessed by “empty/full can” test" }
    status: unverified
  # ---------- p451: arm abduction ----------
  - id: msk.L01.021
    kind: table
    topic: arm-abduction
    title: Arm abduction
    columns: [Degree, Muscle, Nerve]
    rows:
      - ["0°-15°", Supraspinatus, Suprascapular]
      - ["15°-90°", Deltoid, Axillary]
      - [">90°", Trapezius, Accessory]
      - [">90°", Serratus Anterior, Long Thoracic (SALT)]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 451, quote: "0°-15° Supraspinatus Suprascapular 15°-90° Deltoid Axillary >90° Trapezius Accessory >90° Serratus Anterior Long Thoracic (SALT)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.022
    kind: mcq
    topic: arm-abduction
    stem: >-
      A 40-year-old woman has a right cervical lymph node biopsy in the posterior triangle of the neck.
      Two weeks later she cannot raise her right arm above her head, though she can lift it to the side
      up to shoulder level. Her right shoulder droops. Besides the injured nerve's muscle, which other
      nerve supplies a muscle needed to raise the arm above 90°?
    options:
      - Long thoracic nerve
      - Axillary nerve
      - Suprascapular nerve
      - Musculocutaneous nerve
      - Radial nerve
    answer: 0
    why:
      - "Right. The posterior triangle biopsy cut the accessory nerve (trapezius). Abduction above 90° needs the trapezius together with the serratus anterior, supplied by the long thoracic nerve (SALT)."
      - "The axillary nerve (deltoid) carries abduction from 15° to 90°, the range she still has."
      - "The suprascapular nerve (supraspinatus) only starts abduction, from 0° to 15°."
      - "The musculocutaneous nerve flexes and supinates the forearm; it plays no part in abduction."
      - "The radial nerve extends the elbow, wrist and fingers; it plays no part in abduction."
    src: { page: 451, quote: ">90° Trapezius Accessory >90° Serratus Anterior Long Thoracic (SALT)" }
    status: unverified
  # ---------- p452: brachial plexus lesions ----------
  - id: msk.L01.023
    kind: order
    topic: brachial-plexus-lesions
    prompt: Put the parts of the brachial plexus in order, from the spinal cord out (Remember To Drink Cold Beer).
    steps:
      - Roots
      - Trunks
      - Divisions
      - Cords
      - Branches
    src: { page: 452, quote: "Divisions of brachial plexus: Remember To Drink Cold Beer" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.024
    kind: card
    topic: brachial-plexus-lesions
    front: Which structures pass between the anterior and middle scalene muscles, and where does the subclavian vein pass?
    back: "Through the gap between anterior and middle scalene: the plexus trunks with the subclavian artery. The subclavian vein stays outside that gap, in front of and medial to it."
    src: { page: 452, quote: "Trunks of brachial plexus and the subclavian artery pass between anterior and middle scalene muscles. Subclavian vein passes anteromedial to the scalene triangle." }
    status: unverified
  - id: msk.L01.025
    kind: card
    topic: brachial-plexus-lesions
    front: Erb palsy ("waiter's tip") is a traction or tear injury of which trunk and roots?
    back: The upper trunk of the brachial plexus, roots C5 and C6.
    src: { page: 452, quote: "Erb palsy (“waiter’s tip”) Traction or tear of upper trunk: C5-C6 roots" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.120
    kind: card
    topic: brachial-plexus-lesions
    front: What causes Erb palsy in a newborn?
    back: Pulling the baby's neck sideways (lateral traction) during delivery.
    src: { page: 452, quote: "Infants—lateral traction on neck during delivery" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.121
    kind: card
    topic: brachial-plexus-lesions
    front: What causes Erb palsy in an adult?
    back: Trauma that stretches the neck away from the shoulder, eg, landing on the head and shoulder in a motorcycle crash.
    src: { page: 452, quote: "Adults—trauma leading to neck traction (eg, falling on head and shoulder in motorcycle accident)" }
    status: unverified
  - id: msk.L01.026
    kind: table
    topic: brachial-plexus-lesions
    title: Erb palsy, muscles and deficits (Herb gets DIBs on tips)
    columns: [Muscle deficit, Functional deficit, Arm position]
    rows:
      - ["Deltoid, supraspinatus", Abduction, Arm hangs by side]
      - ["Infraspinatus, supraspinatus", Lateral rotation, Arm medially rotated]
      - [Biceps brachii, "Flexion, supination", Arm extended and pronated]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 452, quote: "Deltoid, supraspinatus Abduction (arm hangs by side) Infraspinatus, supraspinatus Lateral rotation (arm medially rotated) Biceps brachii Herb gets DIBs on tips Flexion, supination (arm extended and pronated)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.027
    kind: card
    topic: brachial-plexus-lesions
    front: Klumpke palsy is a traction or tear injury of which trunk and roots?
    back: The lower trunk of the brachial plexus, roots C8 and T1.
    src: { page: 452, quote: "Klumpke palsy Traction or tear of lower trunk: C8-T1 roots" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.122
    kind: card
    topic: brachial-plexus-lesions
    front: What causes Klumpke palsy in a newborn?
    back: The baby's arm being pulled upward during delivery.
    src: { page: 452, quote: "Infants—upward force on arm during delivery" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.123
    kind: card
    topic: brachial-plexus-lesions
    front: What causes Klumpke palsy in an adult?
    back: Trauma that yanks the arm upward, eg, grabbing a tree branch to stop a fall.
    src: { page: 452, quote: "Adults—trauma (eg, grabbing a tree branch to break a fall)" }
    status: unverified
  - id: msk.L01.124
    kind: enumerate
    topic: brachial-plexus-lesions
    prompt: Enumerate the intrinsic hand muscle groups lost in Klumpke palsy (4).
    points:
      - Lumbricals
      - Interossei
      - Thenar muscles
      - Hypothenar muscles
    pass: 4
    src: { page: 452, quote: "Intrinsic hand muscles: lumbricals, interossei, thenar, hypothenar" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.028
    kind: card
    topic: brachial-plexus-lesions
    front: Why does Klumpke palsy give a claw hand?
    back: The lumbricals normally bend the MCP joints and straighten the PIP and DIP joints; with them gone the fingers take the opposite posture, a claw ("Clawmpke").
    src: { page: 452, quote: "Claw hand (“Clawmpke” palsy): lumbricals normally flex MCP joints and extend DIP and PIP joints" }
    status: unverified
  - id: msk.L01.125
    kind: card
    topic: brachial-plexus-lesions
    front: When does Klumpke palsy come with Horner syndrome?
    back: When the injury also involves the T1 root or the sympathetic chain.
    src: { page: 452, quote: "+/– Horner syndrome if T1 root/sympathetic chain involved" }
    status: unverified
  - id: msk.L01.029
    kind: card
    topic: brachial-plexus-lesions
    front: What is compressed in thoracic outlet syndrome, and where?
    back: The lower trunk of the brachial plexus together with the subclavian vessels, usually inside the scalene triangle.
    src: { page: 452, quote: "Thoracic outlet syndrome Compression of lower trunk and subclavian vessels, most commonly within the scalene triangle" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.110
    kind: card
