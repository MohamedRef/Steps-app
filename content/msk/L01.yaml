  # ---------- p450-451: upper extremity nerves ----------
  - id: msk.L01.001
    kind: card
    topic: upper-extremity-nerves
    front: Which two injuries classically damage the axillary nerve (C5-C6), and how does the patient present?
    back: Fractured surgical neck of the humerus or anterior dislocation of the humerus. Flattened deltoid, loss of arm abduction at the shoulder beyond 15°, and loss of sensation over the deltoid and lateral arm.
    src: { page: 450, quote: "Axillary (C5-C6) Fractured surgical neck of humerus Anterior dislocation of humerus Flattened deltoid Loss of arm abduction at shoulder (>15°) Loss of sensation over deltoid and lateral arm" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.002
    kind: card
    topic: upper-extremity-nerves
    front: Musculocutaneous nerve (C5-C7) injury from upper trunk compression gives which reflex, motor and sensory deficits?
    back: ↓ biceps (C5-C6) reflex; loss of forearm flexion and supination; loss of sensation over the radial and lateral forearm.
    src: { page: 450, quote: "Upper trunk compression ↓ biceps (C5-C6) reflex Loss of forearm flexion and supination Loss of sensation over radial and lateral forearm" }
    status: unverified
  - id: msk.L01.003
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Enumerate the causes of radial nerve (C5-T1) injury (3).
    points:
      - Compression of the axilla (crutches, or sleeping with the arm over a chair, "Saturday night palsy")
      - Midshaft fracture of the humerus
      - Repetitive pronation/supination of the forearm, eg, screwdriver use ("finger drop")
    pass: 3
    hook: "الـ radial بيتعور في 3 أماكن على طول الدراع: فوق في الإبط (عكاز أو كرسي)، في النص (midshaft)، وتحت في الساعد (مفك)."
    src: { page: 450, quote: "Compression of axilla, eg, due to crutches or sleeping with arm over chair (“Saturday night palsy”) Midshaft fracture of humerus Repetitive pronation/supination of forearm, eg, due to screwdriver use (“finger drop”)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.004
    kind: card
    topic: upper-extremity-nerves
    front: What does a radial nerve injury above the elbow cause, and why is grip strength reduced?
    back: Loss of sensation over the posterior arm/forearm and dorsal hand, and wrist drop (loss of elbow, wrist and finger extension) with ↓ grip strength, because wrist extension is needed for maximal action of the flexors.
    src: { page: 450, quote: "Injuries above the elbow cause loss of sensation over posterior arm/forearm and dorsal hand, wrist drop (due to loss of elbow, wrist, and finger extension) with ↓ grip strength (wrist extension necessary for maximal action of flexors)" }
    status: unverified
  - id: msk.L01.005
    kind: card
    topic: upper-extremity-nerves
    front: Radial nerve injury below the elbow can cause which two deficits, and from which branches?
    back: Paresthesias of the dorsal hand (superficial radial nerve) or wrist drop (posterior interosseous nerve).
    src: { page: 450, quote: "Injuries below the elbow can cause paresthesias of the dorsal hand (superficial radial nerve) or wrist drop (posterior interosseus nerve)" }
    status: unverified
  - id: msk.L01.006
    kind: cloze
    topic: upper-extremity-nerves
    text: In a midshaft humerus fracture with radial nerve injury, {{c1::triceps}} function and {{c2::posterior arm}} sensation are spared.
    src: { page: 450, quote: "Tricep function and posterior arm sensation spared in midshaft fracture" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.007
    kind: card
    topic: upper-extremity-nerves
    front: Which injury gives a proximal median nerve lesion, and which give a distal one?
    back: "Proximal: supracondylar fracture of the humerus. Distal: carpal tunnel syndrome and wrist laceration."
    src: { page: 450, quote: "Supracondylar fracture of humerus → proximal lesion of the nerve Carpal tunnel syndrome and wrist laceration → distal lesion of the nerve" }
    status: unverified
  - id: msk.L01.008
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Median nerve injury causes loss of wrist flexion and of which hand muscles (LOAF, 4)?
    points:
      - Lateral two Lumbricals
      - Opponens pollicis
      - Abductor pollicis brevis
      - Flexor pollicis brevis
    pass: 4
    hook: "الكتاب بيقولها LOAF: Lumbricals (الاتنين اللي برّه) و Opponens و Abductor و Flexor pollicis brevis. رغيف العيش في إيد الـ median."
    src: { page: 450, quote: "Loss of wrist flexion and function of the lateral two Lumbricals, Opponens pollicis, Abductor pollicis brevis, Flexor pollicis brevis (LOAF)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.009
    kind: cloze
    topic: upper-extremity-nerves
    text: A proximal median nerve lesion causes loss of sensation over the {{c1::thenar eminence}} and the dorsal and palmar aspects of the lateral {{c2::3 1/2}} fingers.
    src: { page: 450, quote: "Loss of sensation over thenar eminence and dorsal and palmar aspects of lateral 3 1/2 fingers with proximal lesion" }
    status: unverified
  - id: msk.L01.010
    kind: enumerate
    topic: upper-extremity-nerves
    prompt: Enumerate the causes of ulnar nerve (C8-T1) injury given in the book (3).
    points:
      - Fracture of the medial epicondyle of the humerus (proximal lesion)
      - Fractured hook of the hamate from a fall on an outstretched hand (distal lesion)
      - Compression against the hamate as the wrist rests on handlebars during cycling
    pass: 3
    src: { page: 450, quote: "Fracture of medial epicondyle of humerus (proximal lesion) Fractured hook of hamate (distal lesion) from fall on outstretched hand Compression of nerve against hamate as the wrist rests on handlebar during cycling" }
    status: unverified
  - id: msk.L01.011
    kind: card
    topic: upper-extremity-nerves
    front: What are the motor and sensory signs of ulnar nerve injury?
    back: "\"Ulnar claw\" on digit extension; radial deviation of the wrist on flexion (proximal lesion); ↓ flexion of the ulnar fingers, finger abduction and adduction (interossei), thumb adduction and the ulnar 2 lumbricals. Sensory loss over the ulnar 1 1/2 fingers including the hypothenar eminence."
    src: { page: 450, quote: "“Ulnar claw” on digit extension Radial deviation of wrist upon flexion (proximal lesion) ↓ flexion of ulnar fingers, abduction and adduction of fingers (interossei), thumb adduction, actions of ulnar 2 lumbrical muscles" }
    status: unverified
  - id: msk.L01.012
    kind: card
    topic: upper-extremity-nerves
    front: A superficial laceration of the palm cuts the recurrent branch of the median nerve. What is lost, and what is spared?
    back: "\"Ape hand\": loss of the thenar muscle group (opposition, abduction and flexion of the thumb). No loss of sensation."
    src: { page: 450, quote: "Superficial laceration of palm “Ape hand” Loss of thenar muscle group: opposition, abduction, and flexion of thumb No loss of sensation" }
    status: unverified
  - id: msk.L01.013
    kind: cloze
    topic: upper-extremity-nerves
    text: "Humerus fractures, proximally to distally, follow the ARM nerves: {{c1::Axillary}} (surgical neck) → {{c2::Radial}} (midshaft) → {{c3::Median}} (supracondylar)."
    src: { page: 450, quote: "Humerus fractures, proximally to distally, follow the ARM (Axillary → Radial → Median) nerves" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.014
    kind: mcq
    topic: upper-extremity-nerves
    stem: >-
      A 7-year-old boy falls from a jungle gym onto his outstretched right arm. X-ray shows a displaced
      supracondylar fracture of the humerus. After reduction he cannot flex his wrist well, and when he
      tries to make a fist the index and middle fingers stay extended. Sensation is reduced over the
      thenar eminence. Which other finding is most likely?
    options:
      - Loss of sensation over the palmar lateral 3 1/2 fingers
      - Loss of finger abduction and adduction
      - Wrist drop with loss of sensation over the dorsal hand
      - Loss of sensation over the hypothenar eminence
      - Flattened deltoid with loss of arm abduction
    answer: 0
    why:
      - "Right. A supracondylar fracture gives a proximal median nerve lesion, with sensory loss over the thenar eminence and the lateral 3 1/2 fingers (hand of benediction on making a fist)."
      - "The interossei are supplied by the ulnar nerve."
      - "Wrist drop with dorsal hand numbness is a radial nerve injury, typical of a midshaft fracture."
      - "The hypothenar eminence is ulnar nerve territory."
      - "Flattened deltoid is axillary nerve injury, from a surgical neck fracture or anterior dislocation."
    src: { page: 450, quote: "Supracondylar fracture of humerus → proximal lesion of the nerve" }
    status: unverified
  - id: msk.L01.015
    kind: mcq
    topic: upper-extremity-nerves
    stem: >-
      A 45-year-old man is brought to the emergency department after a motorcycle crash. X-ray shows a
      fracture through the middle of the shaft of the left humerus. He cannot extend his wrist or fingers,
      and sensation over the dorsum of the hand is reduced. Which of the following is most likely preserved?
    options:
      - Wrist extension
      - Elbow extension
      - Finger extension at the MCP joints
      - Sensation over the dorsal hand
      - Grip strength
    answer: 1
    why:
      - "Wrist extension is lost: that is the wrist drop."
      - "Right. The radial nerve runs in the spiral groove; at the midshaft the branches to the triceps have already left, so triceps function (and posterior arm sensation) is spared."
      - "Finger extension is lost with the radial nerve."
      - "Dorsal hand sensation comes from the radial nerve and is reduced here."
      - "Grip is weak because maximal flexor action needs wrist extension."
    src: { page: 450, quote: "Tricep function and posterior arm sensation spared in midshaft fracture" }
    status: unverified
  # ---------- p451: rotator cuff ----------
  - id: msk.L01.016
    kind: enumerate
    topic: rotator-cuff-muscles
    prompt: Enumerate the rotator cuff muscles with their nerves (SItS, 4).
    points:
      - Supraspinatus (suprascapular nerve)
      - Infraspinatus (suprascapular nerve)
      - teres minor (axillary nerve)
      - Subscapularis (upper and lower subscapular nerves)
    pass: 4
    hook: "SItS، والـ t صغيرة عشان teres minor (الكتاب). والأعصاب: 2 suprascapular، و axillary للصغير، و subscapular للـ Subscapularis."
    src: { page: 451, quote: "Innervated primarily by C5-C6. SItS (small t is for teres minor)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.017
    kind: card
    topic: rotator-cuff-muscles
    front: What does the supraspinatus do, how is it injured, and which test assesses it?
    back: It abducts the arm initially (before the deltoid). It is the most common rotator cuff injury (trauma, or degeneration and impingement → tendinopathy or tear), assessed by the "empty/full can" test.
    src: { page: 451, quote: "abducts arm initially (before the action of the deltoid); most common rotator cuff injury (trauma or degeneration and impingement → tendinopathy or tear" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.018
    kind: table
    topic: rotator-cuff-muscles
    title: Rotator cuff muscles
    columns: [Muscle, Nerve, Action]
    rows:
      - [Supraspinatus, Suprascapular, Initial abduction (before the deltoid)]
      - [Infraspinatus, Suprascapular, External rotation (pitching injury)]
      - [teres minor, Axillary, Adduction and external rotation]
      - [Subscapularis, Upper and lower subscapular, Internal rotation and adduction]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2], [3, 2]]
    src: { page: 451, quote: "Infraspinatus (suprascapular nerve)— externally rotates arm; pitching injury" }
    status: unverified
  - id: msk.L01.019
    kind: cloze
    topic: rotator-cuff-muscles
    text: The rotator cuff is innervated primarily by {{c1::C5-C6}}.
    src: { page: 451, quote: "Innervated primarily by C5-C6." }
    status: unverified
  - id: msk.L01.020
    kind: mcq
    topic: rotator-cuff-muscles
    stem: >-
      A 58-year-old house painter has had right shoulder pain for 3 months, worse when he reaches overhead.
      With his arm abducted to 90° in the scapular plane and internally rotated (thumb pointing down),
      he cannot resist downward pressure and the pain is reproduced. Which muscle is most likely injured,
      and which nerve supplies it?
    options:
      - Supraspinatus; suprascapular nerve
      - Infraspinatus; axillary nerve
      - Teres minor; suprascapular nerve
      - Subscapularis; long thoracic nerve
      - Deltoid; suprascapular nerve
    answer: 0
    why:
      - "Right. The empty-can test assesses the supraspinatus, the most common rotator cuff injury (impingement → tendinopathy or tear); it is supplied by the suprascapular nerve."
      - "The infraspinatus is supplied by the suprascapular nerve, not the axillary, and it externally rotates the arm."
      - "The teres minor is supplied by the axillary nerve."
      - "The subscapularis is supplied by the upper and lower subscapular nerves."
      - "The deltoid is supplied by the axillary nerve, and the empty-can test is for the supraspinatus."
    src: { page: 451, quote: "most common rotator cuff injury (trauma or degeneration and impingement → tendinopathy or tear [arrow in A ]), assessed by “empty/full can” test" }
    status: unverified
  # ---------- p451: arm abduction ----------
  - id: msk.L01.021
    kind: table
    topic: arm-abduction
    title: Arm abduction
    columns: [Degree, Muscle, Nerve]
    rows:
      - ["0°-15°", Supraspinatus, Suprascapular]
      - ["15°-90°", Deltoid, Axillary]
      - [">90°", Trapezius, Accessory]
      - [">90°", Serratus Anterior, Long Thoracic (SALT)]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 451, quote: "0°-15° Supraspinatus Suprascapular 15°-90° Deltoid Axillary >90° Trapezius Accessory >90° Serratus Anterior Long Thoracic (SALT)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.022
    kind: mcq
    topic: arm-abduction
    stem: >-
      A 40-year-old woman has a right cervical lymph node biopsy in the posterior triangle of the neck.
      Two weeks later she cannot raise her right arm above her head, though she can lift it to the side
      up to shoulder level. Her right shoulder droops. Which nerve was most likely injured?
    options:
      - Suprascapular nerve
      - Axillary nerve
      - Accessory nerve
      - Musculocutaneous nerve
      - Radial nerve
    answer: 2
    why:
      - "The suprascapular nerve (supraspinatus) starts abduction from 0° to 15°."
      - "The axillary nerve (deltoid) carries abduction from 15° to 90°, which she still has."
      - "Right. Abduction above 90° needs the trapezius (accessory nerve) and serratus anterior (long thoracic); the accessory nerve crosses the posterior triangle."
      - "The musculocutaneous nerve flexes and supinates the forearm."
      - "The radial nerve extends the elbow, wrist and fingers."
    src: { page: 451, quote: ">90° Trapezius Accessory" }
    status: unverified
  # ---------- p452: brachial plexus lesions ----------
  - id: msk.L01.023
    kind: order
    topic: brachial-plexus-lesions
    prompt: Put the parts of the brachial plexus in order, from the spinal cord out (Remember To Drink Cold Beer).
    steps:
      - Roots
      - Trunks
      - Divisions
      - Cords
      - Branches
    src: { page: 452, quote: "Divisions of brachial plexus: Remember To Drink Cold Beer" }
    status: unverified
  - id: msk.L01.024
    kind: card
    topic: brachial-plexus-lesions
    front: Which structures pass between the anterior and middle scalene muscles, and where does the subclavian vein pass?
    back: The trunks of the brachial plexus and the subclavian artery pass between the anterior and middle scalenes. The subclavian vein passes anteromedial to the scalene triangle.
    src: { page: 452, quote: "Trunks of brachial plexus and the subclavian artery pass between anterior and middle scalene muscles. Subclavian vein passes anteromedial to the scalene triangle." }
    status: unverified
  - id: msk.L01.025
    kind: card
    topic: brachial-plexus-lesions
    front: Erb palsy ("waiter's tip") injures which roots, and what causes it in infants and in adults?
    back: "Traction or tear of the upper trunk, C5-C6 roots. Infants: lateral traction on the neck during delivery. Adults: trauma with neck traction (eg, falling on the head and shoulder in a motorcycle accident)."
    src: { page: 452, quote: "Erb palsy (“waiter’s tip”) Traction or tear of upper trunk: C5-C6 roots Infants—lateral traction on neck during delivery Adults—trauma leading to neck traction" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.026
    kind: table
    topic: brachial-plexus-lesions
    title: Erb palsy, muscles and deficits (Herb gets DIBs on tips)
    columns: [Muscle deficit, Functional deficit, Arm position]
    rows:
      - ["Deltoid, supraspinatus", Abduction, Arm hangs by side]
      - ["Infraspinatus, supraspinatus", Lateral rotation, Arm medially rotated]
      - [Biceps brachii, "Flexion, supination", Arm extended and pronated]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 452, quote: "Deltoid, supraspinatus Abduction (arm hangs by side) Infraspinatus, supraspinatus Lateral rotation (arm medially rotated) Biceps brachii Herb gets DIBs on tips Flexion, supination (arm extended and pronated)" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.027
    kind: card
    topic: brachial-plexus-lesions
    front: Klumpke palsy injures which roots, what causes it, and which muscles are lost?
    back: "Traction or tear of the lower trunk, C8-T1 roots. Infants: upward force on the arm during delivery. Adults: trauma, eg, grabbing a tree branch to break a fall. Lost: the intrinsic hand muscles (lumbricals, interossei, thenar, hypothenar)."
    src: { page: 452, quote: "Klumpke palsy Traction or tear of lower trunk: C8-T1 roots Infants—upward force on arm during delivery Adults—trauma (eg, grabbing a tree branch to break a fall) Intrinsic hand muscles: lumbricals, interossei, thenar, hypothenar" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.028
    kind: card
    topic: brachial-plexus-lesions
    front: Why does Klumpke palsy give a claw hand, and when does Horner syndrome come with it?
    back: The lumbricals normally flex the MCP joints and extend the DIP and PIP joints, so losing them gives a claw hand ("Clawmpke"). Horner syndrome appears if the T1 root or sympathetic chain is involved.
    src: { page: 452, quote: "Claw hand (“Clawmpke” palsy): lumbricals normally flex MCP joints and extend DIP and PIP joints +/– Horner syndrome if T1 root/sympathetic chain involved" }
    status: unverified
  - id: msk.L01.029
    kind: card
    topic: brachial-plexus-lesions
    front: What is thoracic outlet syndrome, what causes it, and how does it present?
    back: Compression of the lower trunk and subclavian vessels, most commonly in the scalene triangle, by a cervical or anomalous first rib or a Pancoast tumor. Same deficits as Klumpke palsy (atrophy of intrinsic hand muscles) plus ischemia, pain and edema from vascular compression.
    src: { page: 452, quote: "Thoracic outlet syndrome Compression of lower trunk and subclavian vessels, most commonly within the scalene triangle Cervical/ anomalous first ribs (arrows in A ), Pancoast tumor Same as Klumpke palsy Atrophy of intrinsic hand muscles; ischemia, pain, and edema due to vascular compression" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.030
    kind: card
    topic: brachial-plexus-lesions
    front: Winged scapula is a lesion of which nerve and roots, from what causes, and what is the deficit?
    back: "Long thoracic nerve, roots C5-C7 (\"wings of heaven\"), from axillary node dissection after mastectomy or stab wounds. The serratus anterior can't anchor the scapula to the thoracic cage, so the arm can't be abducted above the horizontal."
    src: { page: 452, quote: "Winged scapula Lesion of long thoracic nerve, roots C5-C7 (“wings of heaven”) Axillary node dissection after mastectomy, stab wounds Serratus anterior Inability to anchor scapula to thoracic cage" }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.031
    kind: mcq
    topic: brachial-plexus-lesions
    stem: >-
      A newborn boy weighing 4.6 kg is delivered after a difficult vaginal delivery complicated by
      shoulder dystocia, with lateral traction on the head. His right arm hangs at his side, medially
      rotated, with the elbow extended and the forearm pronated. Grasp is normal. Which reflex is most
      likely absent on the right?
    options:
      - Biceps reflex
      - Triceps reflex
      - Patellar reflex
      - Finger flexor reflex
      - Palmar grasp reflex
    answer: 0
    why:
      - "Right. Erb palsy is an upper trunk (C5-C6) injury; the biceps (C5-C6) is lost, so the biceps reflex goes and the arm is extended and pronated."
      - "The triceps reflex is mainly C7, outside the upper trunk."
      - "The patellar reflex is L4 and has nothing to do with the brachial plexus."
      - "Finger flexors are C8-T1 (lower trunk), lost in Klumpke palsy."
      - "Grasp is normal: the intrinsic hand muscles (C8-T1) are spared."
    src: { page: 452, quote: "Biceps brachii Herb gets DIBs on tips Flexion, supination (arm extended and pronated)" }
    status: unverified
  - id: msk.L01.032
    kind: mcq
    topic: brachial-plexus-lesions
    stem: >-
      A 62-year-old man who has smoked for 40 years has 3 months of pain along the inner arm and weakness
      of his right hand. Examination shows wasting of the intrinsic hand muscles, ptosis and a small pupil
      on the right, and decreased sweating of the right side of the face. Chest x-ray shows an apical
      mass. Which structure explains the eye findings?
    options:
      - The upper trunk of the brachial plexus
      - The long thoracic nerve
      - The T1 root and cervical sympathetic chain
      - The phrenic nerve
      - The oculomotor nerve
    answer: 2
    why:
      - "The upper trunk (C5-C6) gives Erb palsy, without Horner syndrome."
      - "The long thoracic nerve gives a winged scapula."
      - "Right. A Pancoast tumor compresses the lower trunk (Klumpke-like hand) and, when it involves the T1 root or sympathetic chain, adds Horner syndrome."
      - "The phrenic nerve supplies the diaphragm; it does not cause ptosis or miosis."
      - "Oculomotor palsy gives ptosis with a dilated pupil, not a small one."
    src: { page: 452, quote: "+/– Horner syndrome if T1 root/sympathetic chain involved" }
    status: unverified
  # ---------- p453: wrist region ----------
  - id: msk.L01.033
    kind: order
    topic: wrist-region
    prompt: Put the carpal bones in the book's order, proximal row lateral to medial and then distal row medial to lateral (So long to pinky, here comes the thumb).
    steps:
      - Scaphoid
      - Lunate
      - Triquetrum
      - Pisiform
      - Hamate
      - Capitate
      - Trapezoid
      - Trapezium
    src: { page: 453, quote: "Scaphoid, lunate, triquetrum, pisiform, hamate, capitate, trapezoid, trapezium A . (So long to pinky, here comes the thumb)" }
    status: unverified
  - id: msk.L01.034
    kind: card
    topic: wrist-region
    front: Which carpal bone is most commonly fractured, how, and where is it palpable?
    back: The scaphoid, typically from a fall on an outstretched hand. It is palpable in the anatomic snuff box.
    src: { page: 453, quote: "Scaphoid (palpable in anatomic snuff box B ) is the most commonly fractured carpal bone, typically due to a fall on an outstretched hand." }
    status: unverified
    tags: [high-yield]
  - id: msk.L01.035
    kind: card
    topic: wrist-region
    front: Why do proximal scaphoid fractures risk avascular necrosis and nonunion?
    back: Its blood supply is retrograde, from a branch of the radial artery, so a proximal fracture cuts the proximal fragment off. The fracture may be occult on the first x-ray.
    src: { page: 453, quote: "Complications of proximal scaphoid fractures include avascular necrosis and nonunion due to retrograde blood supply from a branch of the radial artery. Occult fracture not always seen on initial x-ray." }
    status: unverified
    tags: [high-yield]
