      - ["Intermediate (300-2400 mg/day)", Antipyretic and analgesic]
      - ["High (2400-4000 mg/day)", Anti-inflammatory]
    blanks: [[0, 1], [2, 1]]
    src: { page: 496, quote: "(<300 mg/day): ↓ platelet aggregation. Intermediate dose (300-2400 mg/day)" }
    status: unverified
