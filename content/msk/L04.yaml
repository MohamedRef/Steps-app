  - id: msk.L04.008
    kind: mcq
    topic: arachidonic-acid-pathways
    stem: >-
      A 24-year-old woman with asthma still has nighttime symptoms despite an inhaled glucocorticoid.
      Her physician adds an oral drug that directly inhibits 5-lipoxygenase. Which mediators will this
      drug decrease most directly?
    options:
      - Leukotrienes
      - Thromboxane A2
      - Prostacyclin
      - Prostaglandin E2
      - Arachidonic acid
    answer: 0
    why:
      - "Right. Zileuton inhibits 5-lipoxygenase, so leukotriene synthesis (LTB4, LTC4, LTD4, LTE4) falls."
      - "TXA2 comes from the COX arm, not 5-lipoxygenase."
      - "Prostacyclin (PGI2) comes from the COX arm."
      - "PGE2 comes from the COX arm."
      - "Arachidonic acid is made upstream by phospholipase A2; blocking 5-lipoxygenase does not lower it."
    src: { page: 495, quote: "Zileuton LEUKOTRIENE SYNTHESIS (5-lipoxygenase)" }
    status: unverified
  # ---------- Acetaminophen (p495) ----------
  - id: msk.L04.009
    kind: card
    topic: acetaminophen
    front: How does acetaminophen work, and what can it not do?
    back: "Reversibly inhibits cyclooxygenase, mostly in the CNS; inactivated peripherally. Antipyretic and analgesic, but not anti-inflammatory."
    src: { page: 495, quote: "Reversibly inhibits cyclooxygenase, mostly in CNS. Inactivated peripherally." }
    status: unverified
  - id: msk.L04.010
    kind: card
    topic: acetaminophen
    front: Why is acetaminophen used instead of aspirin in children with viral infections?
    back: To avoid Reye syndrome.
    src: { page: 495, quote: "Used instead of aspirin to avoid Reye syndrome in children with viral infection." }
    status: unverified
    tags: [high-yield]
  - id: msk.L04.011
    kind: card
    topic: acetaminophen
    front: How does acetaminophen overdose damage the liver, and what is the antidote?
    back: "Hepatic necrosis: the metabolite NAPQI depletes glutathione and forms toxic byproducts in the liver. N-acetylcysteine is the antidote; it regenerates glutathione."
    src: { page: 495, quote: "Overdose produces hepatic necrosis; acetaminophen metabolite (NAPQI) depletes glutathione and forms toxic tissue byproducts in liver. N-acetylcysteine is antidote—regenerates glutathione." }
    status: unverified
    tags: [high-yield]
  - id: msk.L04.012
    kind: mcq
    topic: acetaminophen
    stem: >-
      A 19-year-old woman is brought to the emergency department 6 hours after taking a large number of
      over-the-counter pain tablets. She has nausea but is otherwise well. Two days later her ALT is
      above 5000 U/L. Which treatment works by the mechanism that best counters the toxic metabolite?
    options:
      - N-acetylcysteine, which regenerates glutathione
      - Sodium bicarbonate, which alkalinizes the urine
      - Fomepizole, which inhibits alcohol dehydrogenase
      - Naloxone, which blocks opioid receptors
      - Activated charcoal, which binds NAPQI in the liver
    answer: 0
    why:
      - "Right. NAPQI depletes glutathione; N-acetylcysteine regenerates it."
      - "Bicarbonate is the overdose treatment for aspirin, not acetaminophen."
      - "Fomepizole is for methanol or ethylene glycol."
      - "Naloxone reverses opioids."
      - "Charcoal binds drug in the gut; it does not act on NAPQI in the liver."
    src: { page: 495, quote: "N-acetylcysteine is antidote—regenerates glutathione." }
    status: unverified
  # ---------- Aspirin (p496) ----------
  - id: msk.L04.013
    kind: card
    topic: aspirin
    front: How does aspirin's mechanism differ from other NSAIDs, and what does it do to bleeding tests?
    back: "It irreversibly inhibits COX-1 and COX-2 by covalent acetylation → ↓ TXA2 and prostaglandins. Bleeding time ↑, no effect on PT or PTT; the effect lasts until new platelets are made."
    src: { page: 496, quote: "bleeding time. No effect on PT, PTT. Effect lasts until new platelets are produced." }
    status: unverified
    tags: [high-yield]
