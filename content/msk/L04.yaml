  # ---------- Celecoxib (p496) ----------
  - id: msk.L04.019
    kind: card
    topic: celecoxib
    front: Why does celecoxib spare the stomach and platelets?
    back: "It selectively and reversibly inhibits COX-2 (inflammatory cells, vascular endothelium) and spares COX-1, which maintains gastric mucosa and is needed for platelet TXA2."
    src: { page: 496, quote: "Thus, does not have the corrosive effects of other NSAIDs on the GI lining. Spares platelet function as" }
