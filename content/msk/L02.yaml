items:
  # ---------- p462: cell biology of bone ----------
  - id: msk.L02.001
    kind: card
    topic: cell-biology-of-bone
    front: What does the osteoblast do, where does it come from, and how is its activity measured?
    back: It forms bone - it lays down collagen and, with alkaline phosphatase working in an alkaline setting, drives mineral deposition. It arises from mesenchymal stem cells of the periosteum. Its activity is tracked with bone-specific ALP, osteocalcin and the propeptides of type I procollagen.
    src: { page: 462, quote: "Osteoblast Builds bone by secreting collagen and catalyzing mineralization in alkaline environment via ALP. Differentiates from mesenchymal stem cells in periosteum. Osteoblastic activity measured by bone ALP, osteocalcin, propeptides of type I procollagen." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.002
    kind: card
    topic: cell-biology-of-bone
    front: How does the osteoclast dissolve bone, and which lineage does it come from?
    back: It secretes H+ and collagenases. It forms from a fusion of monocyte/macrophage lineage precursors.
    src: { page: 462, quote: "and collagenases. Differentiates from a fusion of monocyte/macrophage lineage precursors." }
    status: unverified
  - id: msk.L02.003
    kind: cloze
    topic: cell-biology-of-bone
    text: "{{c1::RANK}} receptors on osteoclasts are stimulated by {{c2::RANKL}}, expressed on osteoblasts; {{c3::OPG (osteoprotegerin)}} is a decoy receptor that binds RANKL and ↓ osteoclast activity."
    src: { page: 462, quote: "RANK receptors on osteoclasts are stimulated by RANKL (RANK ligand, expressed on osteoblasts). OPG (osteoprotegerin, a RANKL decoy receptor) binds RANKL to prevent RANK-RANKL interaction" }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.004
    kind: card
    topic: cell-biology-of-bone
    front: How does the effect of PTH on bone depend on its pattern?
    back: Low, intermittent PTH is anabolic (builds bone) through osteoblasts and, indirectly, osteoclasts. Chronically ↑ PTH (1° hyperparathyroidism) is catabolic (osteitis fibrosa cystica).
    src: { page: 462, quote: "At low, intermittent levels, exerts anabolic effects (building bone) on osteoblasts and osteoclasts (indirect). Chronically ↑ PTH levels (1° hyperparathyroidism) cause catabolic effects (osteitis fibrosa cystica)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.005
    kind: card
    topic: cell-biology-of-bone
    front: What does estrogen do to bone cells, and what happens when it is lacking?
    back: It inhibits apoptosis of osteoblasts and induces apoptosis of osteoclasts, and it closes the epiphyseal plate in puberty. Deficiency (surgical or postmenopausal) → ↑ remodeling cycles and resorption → ↑ osteoporosis risk.
    src: { page: 462, quote: "Inhibits apoptosis in bone-forming osteoblasts and induces apoptosis in bone-resorbing osteoclasts. Causes closure of epiphyseal plate during puberty." }
    status: unverified
  - id: msk.L02.006
    kind: mcq
    topic: cell-biology-of-bone
    stem: >-
      A 66-year-old woman with postmenopausal osteoporosis is started on a twice-yearly subcutaneous
      injection of a monoclonal antibody. Six months later, markers of bone resorption have fallen
      sharply. The drug mimics the action of which natural molecule?
    options:
      - Osteoprotegerin
      - RANK ligand
      - Parathyroid hormone given intermittently
      - Bone-specific alkaline phosphatase
      - Osteocalcin
    answer: 0
    why:
      - "Right. The antibody (denosumab) binds RANKL, as the decoy receptor OPG does, blocking RANK-RANKL interaction → ↓ osteoclast activity."
      - "RANKL itself stimulates osteoclasts; mimicking it would increase resorption."
      - "Intermittent PTH builds bone through osteoblasts, not by blocking RANKL."
      - "Bone ALP is an osteoblast product and marker, not a regulator of osteoclasts."
      - "Osteocalcin is a marker of osteoblast activity."
    src: { page: 462, quote: "OPG (osteoprotegerin, a RANKL decoy receptor) binds RANKL to prevent RANK-RANKL interaction" }
    status: unverified
  # ---------- p462: elbow ----------
  - id: msk.L02.007
    kind: table
    topic: overuse-injuries-of-the-elbow
    title: Overuse injuries of the elbow
    columns: [Condition, Cause, Pain]
    rows:
      - [Medial (golfer's) elbow tendinopathy, Repetitive wrist flexion or idiopathic, Near medial epicondyle]
      - [Lateral (tennis) elbow tendinopathy, Repetitive wrist extension (backhand shots) or idiopathic, Near lateral epicondyle]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 462, quote: "Repetitive wrist flexion or idiopathic → pain near medial epicondyle. Lateral (tennis) elbow tendinopathy Repetitive wrist extension (backhand shots) or idiopathic → pain near lateral epicondyle." }
    status: unverified
  - id: msk.L02.008
    kind: mcq
    topic: overuse-injuries-of-the-elbow
    stem: >-
      A 45-year-old woman who plays tennis three times a week has 2 months of pain on the outer side of
      her right elbow. Pain is reproduced by resisted extension of the wrist. Which movement is most
      likely responsible?
    options:
      - Repetitive wrist extension during backhand strokes
      - Repetitive wrist flexion during the golf swing
      - Repetitive forearm pronation using a screwdriver
      - A sudden pull on the arm
      - Repetitive kneeling
    answer: 0
    why:
      - "Right. Lateral (tennis) elbow tendinopathy comes from repetitive wrist extension (backhand shots), with pain near the lateral epicondyle."
      - "Repetitive wrist flexion causes medial (golfer's) elbow, at the medial epicondyle."
      - "Repetitive pronation/supination with a screwdriver is a cause of radial nerve injury."
      - "A sudden pull on a child's arm causes radial head subluxation."
      - "Kneeling causes prepatellar bursitis."
    src: { page: 462, quote: "Repetitive wrist extension (backhand shots) or idiopathic → pain near lateral epicondyle." }
    status: unverified
  # ---------- p463: clavicle ----------
  - id: msk.L02.009
    kind: card
    topic: clavicle-fractures
    front: Where is the clavicle weakest, which segment fractures most, and how does the fracture present?
    back: Weakest at the junction of the middle and lateral thirds; middle-third fractures are the most common. Shoulder drop and a shortened clavicle (the lateral fragment is depressed by arm weight and rotated medially by arm adductors such as pectoralis major).
    src: { page: 463, quote: "Weakest point at the junction of middle and lateral thirds A ; fractures at the middle third segment are most common. Presents as shoulder drop, shortened clavicle" }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.175
    kind: card
    topic: clavicle-fractures
    front: Who commonly gets clavicle fractures, and how are they usually caused?
    back: Children, and newborns as birth trauma. Usually a fall on an outstretched hand or direct trauma to the shoulder.
    src: { page: 463, quote: "Clavicle fractures Common in children and as birth trauma. Usually caused by a fall on outstretched hand or by direct trauma to shoulder." }
    status: unverified
  - id: msk.L02.010
    kind: mcq
    topic: clavicle-fractures
    stem: >-
      A 9-year-old boy falls off his bicycle onto his outstretched hand. His right shoulder sits lower than
      the left and is rotated forward. X-ray shows a clavicle fracture with the lateral fragment displaced
      downward. What pulls the lateral fragment downward?
    options:
      - The weight of the arm
      - The sternocleidomastoid muscle
      - The trapezius muscle
      - The deltoid muscle
      - The coracoclavicular ligament
    answer: 0
    why:
      - "Right. The lateral fragment is depressed by the arm's weight and rotated medially by arm adductors such as pectoralis major."
      - "The sternocleidomastoid pulls the medial fragment up, not the lateral fragment down."
      - "The trapezius elevates the shoulder."
      - "The deltoid abducts the arm; the book names arm weight."
      - "The coracoclavicular ligament holds the lateral clavicle up."
    src: { page: 463, quote: "lateral fragment is depressed due to arm weight and medially rotated by arm adductors [eg, pectoralis major]" }
    status: unverified
  # ---------- p463: wrist and hand injuries ----------
  - id: msk.L02.011
    kind: card
    topic: wrist-and-hand-injuries
    front: What is Guyon canal syndrome, and in whom is it classically seen?
    back: Compression of the ulnar nerve at the wrist, classically in cyclists from handlebar pressure; also with fracture/dislocation of the hook of the hamate.
    src: { page: 463, quote: "Compression of ulnar nerve at wrist. Classically seen in cyclists due to pressure from handlebars. May also be seen with fracture/dislocation of the hook of hamate." }
    status: unverified
  - id: msk.L02.012
    kind: card
    topic: wrist-and-hand-injuries
    front: In carpal tunnel syndrome the thenar eminence atrophies, but its sensation is spared. Why?
    back: The palmar cutaneous branch of the median nerve enters the hand external to (above) the carpal tunnel.
    src: { page: 463, quote: "Thenar eminence atrophies but sensation spared, because palmar cutaneous branch enters hand external to carpal tunnel." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.013
    kind: card
    topic: wrist-and-hand-injuries
    front: Which two bedside tests suggest carpal tunnel syndrome?
    back: "Tinel sign: percussion of the wrist causes tingling. Phalen maneuver: 90° flexion of the wrist causes tingling."
    src: { page: 463, quote: "Suggested by ⊕ Tinel sign (percussion of wrist causes tingling) and Phalen maneuver (90° flexion of wrist causes tingling)." }
    status: unverified
  - id: msk.L02.014
    kind: enumerate
    topic: wrist-and-hand-injuries
    prompt: Enumerate the conditions associated with carpal tunnel syndrome (6).
    points:
      - Pregnancy (edema)
      - Rheumatoid arthritis
      - Hypothyroidism
      - Diabetes
      - Acromegaly
      - Dialysis-related amyloidosis
    pass: 5
    hook: "أي حاجة بتورّم أو بتملا النفق: مية (حمل)، التهاب (RA)، myxedema (thyroid)، سكر، عضم وأنسجة زيادة (acromegaly)، و amyloid من الغسيل. 6 بيضيّقوا النفق."
    src: { page: 463, quote: "Associated with pregnancy (due to edema), rheumatoid arthritis, hypothyroidism, diabetes, acromegaly, dialysis-related amyloidosis; may be associated with repetitive use." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.015
    kind: card
    topic: wrist-and-hand-injuries
    front: What is a boxer's fracture, and how does it present?
    back: A metacarpal neck fracture, most commonly of the 5th metacarpal, typically in young males from direct trauma (punching a wall). Pain, swelling and tenderness over the metacarpal, reduced grip strength, possible deformity.
    src: { page: 463, quote: "Most commonly the 5th metacarpal A (“boxer’s fracture”). Typically occurs in young males due to direct trauma (eg, punching a wall)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.016
    kind: mcq
    topic: wrist-and-hand-injuries
    stem: >-
      A 30-year-old woman at 34 weeks' gestation has numbness and tingling of the thumb, index and middle
      fingers that wakes her at night. Tapping over the volar wrist reproduces the tingling. Sensation over
      the thenar eminence itself is normal. Which best explains the normal thenar sensation?
    options:
      - The palmar cutaneous branch enters the hand outside the carpal tunnel
      - The thenar skin is supplied by the ulnar nerve
      - The recurrent branch of the median nerve is sensory to the thenar skin
      - The superficial radial nerve supplies the whole thenar eminence
      - Edema in pregnancy spares sensory fibers
    answer: 0
    why:
      - "Right. The palmar cutaneous branch leaves the median nerve before the tunnel, so thenar skin sensation is spared even as the thenar muscles waste."
      - "The thenar eminence is median territory; the ulnar nerve supplies the hypothenar skin."
      - "The recurrent branch is motor; cutting it gives no sensory loss."
      - "The superficial radial nerve supplies the dorsal hand."
      - "Compression affects sensory fibers in the tunnel; the reason is the branch's route."
    src: { page: 463, quote: "Thenar eminence atrophies but sensation spared, because palmar cutaneous branch enters hand external to carpal tunnel." }
    status: unverified
  # ---------- p463: psoas abscess ----------
  - id: msk.L02.017
    kind: card
    topic: psoas-abscess
    front: How does pus reach the psoas, and which organism is most common?
    back: Hematogenously, or from adjacent structures (vertebral osteomyelitis, tuberculous spondylitis [Pott disease], pyelonephritis). S aureus is most commonly isolated, but TB can cause it. Associated with Crohn disease, diabetes and immunocompromise.
    src: { page: 463, quote: "May spread from blood (hematogenous) or from adjacent structures (eg, vertebral osteomyelitis, tuberculous spondylitis [also called Pott disease], pyelonephritis). Associated with Crohn disease, diabetes, and immunocompromised states. Staphylococcus aureus most commonly isolated" }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.018
    kind: card
    topic: psoas-abscess
    front: What are the findings and treatment of a psoas abscess?
    back: Flank pain, fever, inguinal mass, positive psoas sign (hip extension worsens lower abdominal pain); leukocytosis; a focal hypodense lesion in the muscle on CT/MRI. Treatment is drainage and antibiotics.
    src: { page: 463, quote: "Findings: flank pain, fever, inguinal mass, ⊕ psoas sign (hip extension exacerbates lower abdominal pain)." }
    status: unverified
  - id: msk.L02.019
    kind: mcq
    topic: psoas-abscess
    stem: >-
      A 56-year-old man with poorly controlled type 2 diabetes has 10 days of fever and right flank pain.
      Two weeks ago he had an infected boil on his right thigh. He walks with his right hip slightly
      flexed, and passive extension of the right hip worsens his lower abdominal pain. WBC count is
      raised; urinalysis is normal. CT shows a hypodense fluid collection within the right iliopsoas;
      the vertebrae, disc spaces, kidneys and bowel are normal. Which organism is most likely?
    options:
      - Staphylococcus aureus
      - Mycobacterium tuberculosis
      - Escherichia coli
      - Bacteroides fragilis
      - Candida albicans
    answer: 0
    why:
      - "Right. With no nearby source, this abscess came through the blood from a skin infection in a diabetic, and S aureus is the organism most commonly isolated from a psoas abscess."
      - "TB reaches the psoas from tuberculous spondylitis (Pott disease); his vertebrae and discs are normal and the course is acute."
      - "E coli reaches the psoas from a kidney (pyelonephritis) or the bowel next to it; his urinalysis, kidneys and bowel are normal."
      - "Bacteroides is a gut anaerobe that comes with spread from diseased bowel, such as Crohn disease; his bowel is normal and the source was the skin."
      - "Candida causes deep infection mainly with neutropenia or lines, and it does not follow a boil; it is not the usual isolate."
    src: { page: 463, quote: "Staphylococcus aureus most commonly isolated, but may also occur 2° to tuberculosis." }
    status: unverified
  # ---------- p464: knee conditions ----------
  - id: msk.L02.020
    kind: card
    topic: common-knee-conditions
    front: What is the "unhappy triad," how does it happen, and which meniscus is actually more often involved?
    back: Damage to the ACL, MCL and medial meniscus from a lateral force on the knee with the foot planted (contact sports). However, the lateral meniscus is more commonly involved than the medial one with ACL and MCL injury.
    src: { page: 464, quote: "Consists of damage to the ACL A , MCL, and medial meniscus (attached to MCL). However, lateral meniscus involvement is more common than medial meniscus involvement in conjunction with ACL and MCL injury." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.021
    kind: card
    topic: common-knee-conditions
    front: What is prepatellar bursitis, and what is its old name?
    back: Inflammation of the prepatellar bursa in front of the kneecap from repeated trauma or pressure from excessive kneeling ("housemaid's knee").
    src: { page: 464, quote: "Prepatellar bursitis Inflammation of the prepatellar bursa in front of the kneecap (red arrow in B ). Can be caused by repeated trauma or pressure from excessive kneeling (also called “housemaid’s knee”)." }
    status: unverified
  - id: msk.L02.022
    kind: card
    topic: common-knee-conditions
    front: What is a popliteal (Baker) cyst?
    back: Fluid that collects behind the knee in the bursa between the gastrocnemius and the semimembranosus. That bursa often opens into the knee joint, so the cyst usually comes with long-standing joint disease such as OA or RA.
    src: { page: 464, quote: "Popliteal fluid collection (red arrow in C ) in gastrocnemius- semimembranosus bursa commonly communicating with synovial space and related to chronic joint disease (eg, osteoarthritis, rheumatoid arthritis)." }
    status: unverified
  - id: msk.L02.023
    kind: mcq
    topic: common-knee-conditions
    stem: >-
      A 68-year-old woman with long-standing knee osteoarthritis notices a soft swelling behind her right
      knee that is more prominent when she stands. Ultrasound shows a fluid collection between the medial
      head of the gastrocnemius and the semimembranosus tendon. Where does this fluid most likely come
      from?
    options:
      - The knee's synovial space
      - The prepatellar bursa
      - The popliteal artery
      - The popliteal vein
      - The iliotibial band
    answer: 0
    why:
      - "Right. A Baker cyst sits in the gastrocnemius-semimembranosus bursa, which commonly communicates with the synovial space, and it comes with chronic joint disease such as OA or RA."
      - "The prepatellar bursa is in front of the kneecap (housemaid's knee)."
      - "A popliteal aneurysm would pulsate; this is a fluid collection in a bursa."
      - "A venous clot is not a fluid collection in the bursa."
      - "The iliotibial band is lateral, and its syndrome is a friction injury in runners."
    src: { page: 464, quote: "commonly communicating with synovial space and related to chronic joint disease (eg, osteoarthritis, rheumatoid arthritis)." }
    status: unverified
  # ---------- p465: common MSK conditions ----------
  - id: msk.L02.024
    kind: card
    topic: common-musculoskeletal-conditions
    front: What is costochondritis, and what can it mimic?
    back: Inflammation of the costochondral or costosternal junctions with focal tenderness and sharp, positional chest pain that may worsen with deep inspiration; more common in younger females. It may mimic MI or pulmonary embolism.
    src: { page: 465, quote: "Inflammation of costochondral or costosternal junctions. Presents with focal tenderness to palpation and sharp, positional chest pain that may worsen with deep inspiration." }
    status: unverified
  - id: msk.L02.025
    kind: card
    topic: common-musculoskeletal-conditions
    front: What is de Quervain tenosynovitis, how is it tested, and who gets it?
    back: Noninflammatory thickening of the abductor pollicis longus and extensor pollicis brevis tendons → pain at the radial styloid; positive Finkelstein test (pain on stretching the thumb tendons). ↑ risk in new mothers (lifting the baby), golfers, racquet players and thumb texters.
    src: { page: 465, quote: "Noninflammatory thickening of abductor pollicis longus and extensor pollicis brevis tendons → pain or tenderness at radial styloid. ⊕ Finkelstein test" }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.026
    kind: card
    topic: common-musculoskeletal-conditions
    front: What causes Dupuytren contracture, which fingers does it affect, and in whom?
    back: Fibroblastic proliferation and thickening of the superficial palmar fascia, typically at the base of the ring and little fingers. Unknown cause; most often in males >50 of Northern European descent.
    src: { page: 465, quote: "Caused by fibroblastic proliferation and thickening of superficial palmar fascia. Typically involves the fascia at the base of the ring and little fingers." }
    status: unverified
  - id: msk.L02.027
    kind: card
    topic: common-musculoskeletal-conditions
    front: What is a ganglion cyst, and how is it told from a tumor?
    back: A mucin-filled swelling over a joint or tendon sheath, most often on the dorsal wrist. It transilluminates (tumors don't), and it usually resolves on its own.
    src: { page: 465, quote: "Mucin-filled swelling overlying joint or tendon sheath, most commonly at dorsal side of wrist. Transilluminates with shining light (tumors lack transillumination). Usually resolves spontaneously." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.028
    kind: card
    topic: common-musculoskeletal-conditions
    front: What causes iliotibial band syndrome?
    back: An overuse injury of the lateral knee, mainly in runners, from friction of the iliotibial band against the lateral femoral epicondyle.
    src: { page: 465, quote: "Overuse injury of lateral knee that occurs primarily in runners. Pain develops 2° to friction of iliotibial band against lateral femoral epicondyle." }
    status: unverified
  - id: msk.L02.029
    kind: order
    topic: common-musculoskeletal-conditions
    prompt: Put the chain of limb compartment syndrome in order.
    steps:
      - ↑ pressure within a fascial compartment
      - Venous outflow obstruction and arteriolar collapse
      - Anoxia and necrosis
      - Rhabdomyolysis
      - Acute tubular necrosis
    src: { page: 465, quote: "↑ pressure within fascial compartment of a limb → venous outflow obstruction and arteriolar collapse → anoxia, necrosis, rhabdomyolysis → acute tubular necrosis." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.030
    kind: card
    topic: common-musculoskeletal-conditions
    front: Which signs of limb compartment syndrome are late, and what do they mean?
    back: A raised serum CK and motor deficits. By the time they appear, the muscle and nerve damage is irreversible.
    src: { page: 465, quote: "Increased serum creatine kinase and motor deficits are late signs of irreversible muscle and nerve damage." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.191
    kind: card
    topic: common-musculoskeletal-conditions
    front: "What are 3 causes of limb compartment syndrome?"
    back: Significant long bone fractures (the tibia is the example), reperfusion injury and animal venoms.
    src: { page: 465, quote: "Causes include significant long bone fractures (eg, tibia), reperfusion injury, animal venoms." }
    status: unverified
  - id: msk.L02.192
    kind: card
    topic: common-musculoskeletal-conditions
    front: How does limb compartment syndrome present?
    back: Severe pain and a tense, swollen compartment, with pain when the muscles in that compartment are passively stretched.
    src: { page: 465, quote: "Presents with severe pain and tense, swollen compartments with passive stretch of muscles in the affected compartment." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.193
    kind: enumerate
    topic: common-musculoskeletal-conditions
    prompt: Enumerate the 5 P's of limb compartment syndrome (5).
    points:
      - Pain
      - Pallor
      - Paresthesia
      - Pulselessness
      - Paralysis
    pass: 4
    src: { page: 465, quote: "5 P’s: pain, pallor, paresthesia, pulselessness, paralysis." }
    status: unverified
    tags: [high-yield]
  - id: msk.L02.031
    kind: card
    topic: common-musculoskeletal-conditions
    front: What causes medial tibial stress syndrome (shin splints)?
    back: Bone resorption outpacing bone formation in the tibial cortex. Common in runners and military recruits, with shin pain and diffuse tenderness.
    src: { page: 465, quote: "Common cause of shin pain and diffuse tenderness in runners and military recruits. Caused by bone resorption that outpaces bone formation in tibial cortex." }
    status: unverified
  - id: msk.L02.032
    kind: card
    topic: common-musculoskeletal-conditions
    front: How does plantar fasciitis present, and what is it associated with?
    back: Heel pain, worse with the first steps in the morning or after inactivity, and tenderness. Associated with obesity, prolonged standing or jumping (dancers, runners) and flat feet; heel spurs often coexist.
    src: { page: 465, quote: "Inflammation of plantar aponeurosis characterized by heel pain (worse with first steps in the morning or after period of inactivity) and tenderness. Associated with obesity, prolonged standing or jumping (eg, dancers, runners), and flat feet." }
    status: unverified
  - id: msk.L02.033
    kind: card
    topic: common-musculoskeletal-conditions
    front: How do temporomandibular disorders present?
