  # ---------- p468: osteopetrosis ----------
  - id: msk.L02.056
    kind: card
    topic: osteopetrosis
    front: What is the mechanism of osteopetrosis?
    back: Failure of normal bone resorption from defective osteoclasts → thickened, dense bones prone to fracture. Mutations (eg, carbonic anhydrase II) stop the osteoclast making the acidic environment needed for resorption.
    src: { page: 468, quote: "Mutations (eg, carbonic anhydrase II) impair ability of osteoclast to generate acidic environment necessary for bone resorption." }
