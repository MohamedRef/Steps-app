    tags: [high-yield]
  - id: msk.L02.057
    kind: card
    topic: osteopetrosis
    front: What complications does osteopetrosis cause, and why?
    back: Thick cortical bone grows into the marrow space, so marrow fails (pancytopenia) and blood is made elsewhere (extramedullary hematopoiesis). The skull foramina narrow, so cranial nerves are squeezed and palsies follow.
    src: { page: 468, quote: "Overgrowth of cortical bone fills marrow space → pancytopenia, extramedullary hematopoiesis. Can result in cranial nerve impingement and palsies due to narrowed foramina." }
    status: unverified
    tags: [high-yield]
