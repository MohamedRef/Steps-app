  # ---------- p481: scleroderma ----------
  - id: msk.L03.001
    kind: card
    topic: scleroderma
    front: What is the triad of systemic sclerosis, and how does the skin look?
    back: Autoimmunity, noninflammatory vasculopathy, and collagen deposition with fibrosis. Puffy, taut skin without wrinkles and fingertip pitting; 75% female.
    src: { page: 481, quote: "Triad of autoimmunity, noninflammatory vasculopathy, and collagen deposition with fibrosis. Commonly sclerosis of skin, manifesting as puffy, taut skin A without wrinkles, fingertip pitting B ." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.002
    kind: card
    topic: scleroderma
    front: Which organs can systemic sclerosis involve, and how is scleroderma renal crisis treated?
    back: "Renal (scleroderma renal crisis, treated with ACE inhibitors), pulmonary (interstitial fibrosis, pulmonary hypertension), GI (↓ peristalsis and LES tone → dysphagia, heartburn) and cardiovascular."
    src: { page: 481, quote: "Can involve other systems, eg, renal (scleroderma renal crisis; treat with ACE inhibitors), pulmonary (interstitial fibrosis, pulmonary hypertension), GI (↓ peristalsis and LES tone → dysphagia, heartburn), cardiovascular." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.003
    kind: table
    topic: scleroderma
    title: Diffuse vs limited scleroderma
    columns: [Feature, Diffuse, Limited]
    rows:
      - [Skin, "Widespread, rapid progression", Confined to fingers and face]
      - [Viscera, Early visceral involvement, More benign course]
      - [Antibodies, "Anti-Scl-70 (anti-DNA topoisomerase-I), anti-RNA polymerase III", Anti-centromere]
      - [Syndrome, —, CREST]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 2]]
    src: { page: 481, quote: "Diffuse scleroderma—widespread skin involvement, rapid progression, early visceral involvement. Associated with anti-Scl-70 antibody (anti-DNA topoisomerase-I antibody) and anti-RNA polymerase III." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.004
    kind: enumerate
    topic: scleroderma
    prompt: Enumerate the features of CREST syndrome (5).
    points:
      - Calcinosis cutis
      - Raynaud phenomenon
      - Esophageal dysmotility
      - Sclerodactyly
      - Telangiectasia
    pass: 5
    hook: "CREST وفوقها الـ anti-Centromere (الـ C التانية). فكّر في قمة (crest) جبل باردة: Raynaud، والإيد ناشفة (Sclerodactyly) وفيها كالسيوم (Calcinosis)، والمريء متصلّب، والوش فيه شعيرات (Telangiectasia)."
    src: { page: 481, quote: "CREST syndrome: Calcinosis cutis C , anti-Centromere antibody, Raynaud phenomenon, Esophageal dysmotility, Sclerodactyly, and Telangiectasia. More benign clinical course." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.005
    kind: mcq
    topic: scleroderma
    stem: >-
      A 45-year-old woman has 1 year of tight, thickening skin spreading from her hands up her arms and over
      her trunk, with heartburn and Raynaud phenomenon. She now has a headache and blurred vision. Blood
      pressure is 210/120 mm Hg, and serum creatinine has risen sharply over a week. Which drug class is
      the treatment for this complication?
    options:
      - ACE inhibitors
      - Calcium channel blockers
      - High-dose glucocorticoids
      - Thiazide diuretics
      - Beta blockers
    answer: 0
    why:
      - "Right. Diffuse systemic sclerosis can cause scleroderma renal crisis, treated with ACE inhibitors."
      - "Calcium channel blockers treat her Raynaud, but the book's treatment for renal crisis is ACE inhibitors."
      - "Steroids are not the treatment for renal crisis."
      - "Thiazides are not the book's treatment."
      - "Beta blockers are not the book's treatment."
    src: { page: 481, quote: "renal (scleroderma renal crisis; treat with ACE inhibitors)" }
    status: unverified
  - id: msk.L03.006
    kind: mcq
    topic: scleroderma
    stem: >-
      A 55-year-old woman has 10 years of Raynaud phenomenon, tight skin limited to her fingers, small
      firm white nodules on her fingertips, red spots on her face and lips, and food sticking when she
      swallows. Which antibody is most likely positive?
    options:
      - Anti-centromere
      - Anti-Scl-70
      - Anti-U1 RNP
      - Anti-dsDNA
      - Anti-Jo-1
    answer: 0
    why:
      - "Right. Limited scleroderma with CREST (calcinosis, Raynaud, esophageal dysmotility, sclerodactyly, telangiectasia) goes with anti-centromere."
      - "Anti-Scl-70 goes with diffuse scleroderma, with widespread skin and early organ involvement."
      - "Anti-U1 RNP is mixed connective tissue disease."
      - "Anti-dsDNA is SLE."
      - "Anti-Jo-1 is polymyositis/dermatomyositis."
    src: { page: 481, quote: "Limited scleroderma—limited skin involvement confined to fingers and face. Also with CREST syndrome: Calcinosis cutis C , anti-Centromere antibody" }
    status: unverified
  # ---------- p481: skin layers ----------
  - id: msk.L03.007
    kind: order
    topic: skin-layers
    prompt: Put the epidermal layers in order from the surface down (come, let's get sunburned).
    steps:
      - Stratum corneum
      - Stratum lucidum
      - Stratum granulosum
      - Stratum spinosum
      - Stratum basale
    src: { page: 481, quote: "Stratum corneum Stratum lucidum Stratum granulosum Stratum spinosum Stratum basale Dermis" }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.008
    kind: card
    topic: skin-layers
    front: What are the 3 layers of skin?
    back: Epidermis, dermis, and subcutaneous fat (hypodermis, subcutis).
    src: { page: 481, quote: "Skin has 3 layers: epidermis, dermis, subcutaneous fat (hypodermis, subcutis). Epidermal layers: come, let’s get sunburned." }
    status: unverified
  - id: msk.L03.009
    kind: mcq
    topic: skin-layers
    stem: >-
      A 2-year-old boy has fever and a generalized erythematous rash. Over a day the upper layers of
      his epidermis slough, and gentle stroking separates the epidermis (Nikolsky sign). His oral
      mucosa is spared. A staphylococcal exotoxin has destroyed the keratinocyte attachments in
      which layer?
    options:
      - Stratum granulosum
      - Stratum spinosum
      - Stratum basale
      - Stratum corneum
      - Papillary dermis
    answer: 0
    why:
      - "Right. Staphylococcal scalded skin syndrome: the exotoxin destroys attachments in the stratum granulosum only, so the split is high and heals completely."
      - "Stratum spinosum lies below the granulosum; the split here is higher."
      - "Stratum basale is the deepest epidermal layer; a split at the epidermal-dermal junction is toxic epidermal necrolysis, which involves mucosa."
      - "The stratum corneum is the outermost layer; the split lies below it."
      - "The dermis lies beneath the whole epidermis; the skin heals completely because the split is intraepidermal."
    src: { page: 487, quote: "Exotoxin destroys keratinocyte attachments in stratum granulosum only" }
    status: unverified
  # ---------- p482: junctions ----------
  - id: msk.L03.010
    kind: table
    topic: epithelial-cell-junctions
    title: Epithelial cell junctions
    columns: [Junction, Made of / function, Disease]
    rows:
      - [Tight junction (zonula occludens), "Claudins and occludins; prevents paracellular movement of solutes", —]
      - [Adherens junction (zonula adherens), "Cadherins (Ca2+-dependent) link actin cytoskeletons in a belt", Loss of E-cadherin promotes metastasis]
      - [Desmosome (macula adherens), Structural support via intermediate filaments, Anti-desmoglein 3 ± 1 → pemphigus vulgaris]
      - [Gap junction, Connexons permit electrical and chemical communication, —]
      - [Hemidesmosome, Connects keratin in basal cells to basement membrane, Autoantibodies → bullous pemphigoid]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 2], [3, 1], [4, 2]]
