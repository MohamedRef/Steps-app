  - id: msk.L03.020
    kind: mcq
    topic: dermatologic-microscopic-terms
    stem: >-
      A skin biopsy from a 60-year-old man with flaccid oral and skin blisters shows keratinocytes that
      have lost their attachments to each other within the epidermis. These findings are caused by IgG
      antibodies against which target?
    options:
      - Desmoglein 3 ± desmoglein 1 in desmosomes
      - Hemidesmosomes of the epidermal basement membrane
      - Claudins and occludins of tight junctions
      - Connexons of gap junctions
      - Integrins binding fibronectin and laminin
    answer: 0
    why:
      - "Right. Separation of epidermal cells (acantholysis) with flaccid blisters and oral involvement is pemphigus vulgaris, a type II reaction with IgG against desmoglein 3 ± 1 in the desmosomes joining keratinocytes in the stratum spinosum."
      - "IgG against hemidesmosomes is bullous pemphigoid: the antibodies are \"bullow\" the epidermis, giving tense blisters with eosinophils, no acantholysis and a spared mouth."
      - "Tight junctions (claudins, occludins) block paracellular movement of solutes; they are not the pemphigus target."
      - "Gap junctions (connexons) let cells communicate; they are not the pemphigus target."
      - "Integrins anchor the hemidesmosome to the basement membrane; the split would be below the epidermis, not within it."
    src: { page: 489, quote: "IgG antibodies against desmoglein 3 +/– desmoglein 1 (component of desmosomes, which connect keratinocytes in the stratum spinosum)." }
    status: unverified
