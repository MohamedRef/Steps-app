    tags: [high-yield]
  - id: msk.L03.081
    kind: card
    topic: skin-cancer
    front: Describe squamous cell carcinoma of the skin, including Marjolin ulcer.
    back: The second most common skin cancer, associated with immunosuppression, chronic nonhealing wounds and occasionally arsenic. Marjolin ulcer - SCC in a chronic wound or scar years later. Face, lower lip, ears, hands; locally invasive, may reach lymph nodes, rarely metastasizes. Keratin "pearls" on histology.
    src: { page: 494, quote: "Associated with immunosuppression, chronic nonhealing wounds, and occasionally arsenic exposure. Marjolin ulcer—SCC arising in chronic wounds or scars; usually develops years after insult." }
