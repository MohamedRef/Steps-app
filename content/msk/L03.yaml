  - id: msk.L03.013
    kind: mcq
    topic: epithelial-cell-junctions
    stem: >-
      A 75-year-old man has many large, tense blisters on his thighs and trunk with no lesions in the
      mouth. Rubbing normal skin does not separate the epidermis. Autoantibodies are directed at a
      structure in the basal cells. What does that structure normally do?
    options:
      - Connects keratin in basal cells to the basement membrane
      - Connects intermediate filaments of adjacent keratinocytes
      - Prevents paracellular movement of solutes
      - Allows electrical communication between cells
      - Links actin cytoskeletons of adjacent cells with cadherins
    answer: 0
    why:
      - "Right. Bullous pemphigoid targets hemidesmosomes, which connect keratin in basal cells to the basement membrane (hemidesmosomes are down 'bullow')."
      - "That is the desmosome, the target in pemphigus vulgaris (flaccid blisters, oral involvement, Nikolsky positive)."
      - "That is the tight junction."
      - "That is the gap junction."
      - "That is the adherens junction."
    src: { page: 482, quote: "Hemidesmosome E –connects keratin in basal cells to underlying basement membrane. Autoantibodies → bullous pemphigoid." }
    status: unverified
