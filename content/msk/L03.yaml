    front: Describe basal cell carcinoma.
    back: The most common skin cancer, on sun-exposed areas (face). Locally invasive, rarely metastasizes. Waxy, pink, pearly nodules with telangiectasias, rolled borders and central crusting or ulceration; also a scaling plaque (superficial BCC).
    src: { page: 494, quote: "Most common skin cancer. Found in sun-exposed areas of body (eg, face). Locally invasive, but rarely metastasizes. Waxy, pink, pearly nodules, commonly with telangiectasias, rolled borders A , central crusting or ulceration." }
