  - id: msk.L03.015
    kind: mcq
    topic: exocrine-glands
    stem: >-
      A 16-year-old boy has comedones and inflamed papules on his face and upper back. His
      dermatologist explains that the lesions start in the pilosebaceous unit, where androgens drive
      sebum production. How does the sebaceous gland release sebum?
    options:
      - "Holocrine: whole cells disintegrate and are released with their contents"
      - "Merocrine: secretory vesicles are released by exocytosis"
      - "Apocrine: a pinched-off portion of the cell is released"
      - "Endocrine: the product enters the blood without a duct"
      - "Paracrine: the product acts on neighboring cells"
    answer: 0
    why:
      - "Right. First Aid's example of holocrine secretion is the sebaceous gland."
      - "Merocrine secretion (vesicles) is the salivary and sweat gland mode."
      - "Apocrine secretion (pinched-off portion of the cell) is the mammary gland mode."
      - "Exocrine glands like the sebaceous gland secrete through ducts, not into blood."
      - "Paracrine signals act locally on nearby cells; sebum is an exocrine secretion."
    src: { page: 482, quote: "Can be merocrine (eg, salivary and sweat glands), apocrine (eg, mammary glands), or holocrine (eg, sebaceous glands)." }
    status: unverified
