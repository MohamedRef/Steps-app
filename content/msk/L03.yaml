  - id: msk.L03.020
    kind: mcq
    topic: dermatologic-microscopic-terms
    stem: >-
      A skin biopsy from a 60-year-old man with flaccid oral and skin blisters shows keratinocytes that
      have lost their attachments to each other within the epidermis. Which term describes this finding?
    options:
      - Acantholysis
      - Acanthosis
      - Spongiosis
      - Parakeratosis
      - Dyskeratosis
    answer: 0
    why:
      - "Right. Acantholysis is separation of epidermal cells, the book's example being pemphigus vulgaris."
      - "Acanthosis is epidermal hyperplasia (↑ spinosum)."
      - "Spongiosis is edema between epidermal cells (eczema)."
      - "Parakeratosis is retained nuclei in the stratum corneum."
      - "Dyskeratosis is abnormal premature keratinization (SCC)."
    src: { page: 483, quote: "Acantholysis Separation of epidermal cells Pemphigus vulgaris" }
    status: unverified
