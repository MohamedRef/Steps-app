  - id: msk.L03.022
    kind: mcq
    topic: pigmented-skin-disorders
    stem: >-
      A 30-year-old woman with Hashimoto thyroiditis has enlarging, sharply bordered white patches on her
      hands and around her mouth. A biopsy of a patch would most likely show which finding?
    options:
      - Absence of melanocytes
      - Normal melanocytes with ↓ tyrosinase activity
      - Increased melanin in basal keratinocytes
      - Malassezia yeasts in the stratum corneum
      - Failure of neural crest cells to differentiate
    answer: 0
    why:
      - "Right. Vitiligo is complete depigmentation from destruction of melanocytes, believed autoimmune and associated with other autoimmune disorders."
      - "Normal melanocyte number with ↓ tyrosinase is albinism."
      - "Increased pigment is melasma."
      - "Malassezia causes tinea versicolor, with hypopigmentation but intact melanocytes."
      - "Neural crest defects cause Waardenburg syndrome, which is congenital."
    src: { page: 484, quote: "Irregular patches of complete depigmentation C . Caused by destruction of melanocytes (believed to be autoimmune). Associated with other autoimmune disorders." }
    status: unverified
  - id: msk.L03.023
    kind: card
    topic: seborrheic-dermatitis
    front: Describe seborrheic dermatitis (lesions, sites, associations, treatment).
    back: Erythematous, well-demarcated plaques with greasy yellow scales in sebaceous-rich areas (scalp, face, periocular); infants (cradle cap) and adults. Extensive disease may go with HIV and Parkinson disease. Possibly Malassezia. Topical antifungals and glucocorticoids.
    src: { page: 484, quote: "Erythematous, well-demarcated plaques A with greasy yellow scales in areas rich in sebaceous glands, such as scalp, face, and periocular region." }
    status: unverified
  - id: msk.L03.024
    kind: mcq
    topic: seborrheic-dermatitis
    stem: >-
      A 70-year-old man with Parkinson disease has red patches with greasy yellow scale on his scalp,
      eyebrows and the folds beside his nose. Which treatment is most appropriate?
    options:
      - Topical antifungal and glucocorticoid
      - Oral isotretinoin
      - Dapsone and a gluten-free diet
      - Wide local excision
      - Oral penicillin
    answer: 0
    why:
      - "Right. Seborrheic dermatitis (associated with Parkinson disease, possibly Malassezia) is treated with topical antifungals and glucocorticoids."
      - "Isotretinoin is for acne."
      - "Dapsone and gluten-free diet treat dermatitis herpetiformis."
      - "Excision is for skin cancer."
      - "Penicillin treats streptococcal infections like erysipelas."
    src: { page: 484, quote: "Possibly associated with Malassezia spp. Treatment: topical antifungals and glucocorticoids." }
    status: unverified
  # ---------- p485: common skin disorders ----------
  - id: msk.L03.025
    kind: card
    topic: common-skin-disorders
    front: What are the four factors in acne, and how is it treated?
    back: ↑ sebum/androgen production, abnormal keratinocyte desquamation, Cutibacterium acnes colonization of the pilosebaceous unit (comedones), and inflammation (papules, pustules, nodules, cysts). Treatment - retinoids, benzoyl peroxide, antibiotics.
    src: { page: 485, quote: "abnormal keratinocyte desquamation, Cutibacterium acnes colonization of the pilosebaceous unit (comedones), and inflammation (papules/pustules A , nodules, cysts). Treatment: retinoids, benzoyl peroxide, and antibiotics." }
    status: unverified
  - id: msk.L03.026
    kind: card
    topic: common-skin-disorders
    front: Describe atopic dermatitis (associations and distribution).
    back: A pruritic eruption associated with ichthyosis vulgaris and other atopic diseases (asthma, allergic rhinitis, food allergies), with ↑ serum IgE. On the face in infancy, then on flexural surfaces in children and adults.
    src: { page: 485, quote: "Often appears on face in infancy B and then on flexural surfaces C in children and adults." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.027
    kind: card
    topic: common-skin-disorders
    front: What type of reaction is allergic contact dermatitis, and what causes it?
    back: A type IV hypersensitivity to a contact allergen (nickel, poison ivy, neomycin).
    src: { page: 485, quote: "Type IV hypersensitivity reaction secondary to contact allergen (eg, nickel D, poison ivy, neomycin)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.028
    kind: card
    topic: common-skin-disorders
    front: What are keratosis pilaris and pseudofolliculitis barbae?
    back: "Keratosis pilaris: follicular papules from keratin plugging, mostly on the extensor arms and thighs. Pseudofolliculitis barbae: painful, itchy papules and pustules from hair penetrating the skin near the jawline after shaving (razor bumps), more common with curly hair."
    src: { page: 485, quote: "Follicular-based papules E from keratin plugging, most often on extensor surfaces of arms and thighs." }
    status: unverified
  - id: msk.L03.029
    kind: card
    topic: common-skin-disorders
    front: What is a melanocytic nevus, and how do intradermal and junctional nevi look?
    back: A common mole, benign, but melanoma can arise in congenital or atypical moles. Intradermal nevi are papular; junctional nevi are flat macules.
    src: { page: 485, quote: "Common mole. Benign, but melanoma can arise in congenital or atypical moles. Intradermal nevi are papular F . Junctional nevi are flat macules G ." }
    status: unverified
  - id: msk.L03.030
    kind: card
    topic: common-skin-disorders
    front: What are the gross and histologic features of psoriasis?
    back: Papules and plaques with silvery scale, especially on knees and elbows. Acanthosis with parakeratotic scaling (nuclei in the stratum corneum), Munro microabscesses, ↑ stratum spinosum, ↓ stratum granulosum. Auspitz sign (pinpoint bleeding when scales are scraped). Associated with nail pitting and psoriatic arthritis.
    src: { page: 485, quote: "Acanthosis with parakeratotic scaling (nuclei still in stratum corneum), Munro microabscesses. ↑ stratum spinosum, ↓ stratum granulosum." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.031
    kind: card
    topic: common-skin-disorders
    front: How does rosacea differ from acne, and what are its complications?
    back: Erythematous facial papules and pustules but no comedones, with flushing to triggers (alcohol, heat). Complications - ocular involvement and rhinophyma (bulbous nose).
    src: { page: 485, quote: "Inflammatory facial skin disorder characterized by erythematous papules and pustules J , but no comedones." }
    status: unverified
  - id: msk.L03.032
    kind: card
    topic: common-skin-disorders
    front: What is seborrheic keratosis, and what is the Leser-Trélat sign?
    back: A well-demarcated, verrucous, benign proliferation of immature keratinocytes with keratin-filled horn cysts that looks "stuck on." Leser-Trélat sign - rapid onset of multiple seborrheic keratoses, a sign of possible malignancy (eg, GI adenocarcinoma).
    src: { page: 485, quote: "Looks “stuck on.” Leser-Trélat sign L —rapid onset of multiple seborrheic keratoses, indicates possible malignancy (eg, GI adenocarcinoma)." }
    status: unverified
    tags: [high-yield]
  - id: msk.L03.033
    kind: card
    topic: common-skin-disorders
    front: What causes verrucae, and what is their histology?
