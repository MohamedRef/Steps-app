  - id: msk.L03.018
    kind: mcq
    topic: dermatologic-macroscopic-terms
    stem: >-
      A 25-year-old man has several sharply demarcated, raised, solid lesions on his elbows and knees,
      each about 3 cm across and covered with silvery scale. The scale comes off in flakes when rubbed.
      The flaking scale is shed from which layer of the skin?
    options:
      - Stratum corneum
      - Stratum granulosum
      - Stratum spinosum
      - Stratum basale
      - Papillary dermis
    answer: 0
    why:
      - "Right. These are psoriasis plaques (papules >1 cm), and scale is by definition flaking off of the stratum corneum (eczema, psoriasis, SCC)."
      - "The stratum granulosum lies beneath the corneum and is actually ↓ in psoriasis; it does not flake off."
      - "The stratum spinosum is ↑ in psoriasis (acanthosis), but it is a living layer under the corneum, not the scale."
      - "The stratum basale is the deepest, dividing layer of the epidermis."
      - "The papillary dermis lies under the epidermis; scraping the scale exposes it and gives pinpoint bleeding (Auspitz sign), but it is not the scale."
    src: { page: 483, quote: "Scale Flaking off of stratum corneum Eczema, psoriasis, SCC I" }
    status: unverified
