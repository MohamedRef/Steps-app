  - id: msk.L03.011
    kind: cloze
    topic: epithelial-cell-junctions
    text: Loss of {{c1::E-cadherin}} in adherens junctions promotes metastasis.
    src: { page: 482, quote: "Loss of E-cadherin promotes metastasis." }
