  - id: msk.L03.017
    kind: card
    topic: dermatologic-macroscopic-terms
    front: What is the difference between an ulcer and an erosion, with examples?
    back: "Ulcer: epidermal loss exposing the basement membrane and deeper structures (arterial ulcer, decubitus ulcer, leprosy). Erosion: partial or full loss of epidermis without exposing the basement membrane (HSV, VZV, pemphigus vulgaris, SJS/TEN)."
    src: { page: 483, quote: "Erosion Partial or full loss of epidermis without exposure of the basement membrane HSV, VZV, pemphigus vulgaris, SJS/TEN" }
    status: unverified
  - id: msk.L03.018
    kind: mcq
    topic: dermatologic-macroscopic-terms
    stem: >-
      A 25-year-old man has several sharply demarcated, raised, solid lesions on his elbows and knees,
      each about 3 cm across and covered with silvery scale. Which term best describes each lesion?
    options:
      - Plaque
      - Papule
      - Patch
      - Wheal
      - Bulla
    answer: 0
    why:
      - "Right. A plaque is a papule >1 cm; psoriasis is the book's example."
      - "A papule is elevated and solid but <1 cm."
      - "A patch is a flat macule >1 cm."
      - "A wheal is transient (hives)."
      - "A bulla is a fluid-filled blister >1 cm."
    src: { page: 483, quote: "Plaque Papule >1 cm Psoriasis D" }
    status: unverified
