  # ---------- p704: decongestants ----------
  - id: resp.L05.001
    kind: card
    topic: pseudoephedrine-phenylephrine
    front: How do pseudoephedrine and phenylephrine work?
    back: They stimulate α-adrenergic receptors in the nasal mucosa, so the local vessels constrict.
    src: { page: 704, quote: "Activation of α-adrenergic receptors in nasal mucosa → local vasoconstriction." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.036
    kind: card
    topic: pseudoephedrine-phenylephrine
    front: "What are pseudoephedrine and phenylephrine used for?"
    back: "As nasal decongestants, shrinking hyperemia and edema, and to open blocked eustachian tubes."
    src: { page: 704, quote: "Reduce hyperemia, edema (used as nasal decongestants); open obstructed eustachian tubes." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.002
    kind: cloze
    topic: pseudoephedrine-phenylephrine
    text: "Nasal decongestants used for more than {{c1::4-6}} days cause rebound congestion ({{c2::rhinitis medicamentosa}})."
    src: { page: 704, quote: "Rebound congestion (rhinitis medicamentosa) if used more than 4-6 days." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.037
    kind: cloze
    topic: pseudoephedrine-phenylephrine
    text: "Pseudoephedrine and phenylephrine can cause {{c1::hypertension}}."
    src: { page: 704, quote: "Hypertension." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.038
    kind: cloze
    topic: pseudoephedrine-phenylephrine
    text: "Nasal decongestants are associated with {{c1::tachyphylaxis}}."
    src: { page: 704, quote: "Associated with tachyphylaxis." }
    status: unverified
  - id: resp.L05.039
    kind: cloze
    topic: pseudoephedrine-phenylephrine
    text: "{{c1::Pseudoephedrine}} can also cause CNS stimulation and anxiety."
    src: { page: 704, quote: "Can also cause CNS stimulation/anxiety (pseudoephedrine)." }
    status: unverified
  - id: resp.L05.003
    kind: mcq
    topic: pseudoephedrine-phenylephrine
    stem: >-
      A 30-year-old man has used a phenylephrine nasal spray several times a day for 2 weeks for a cold. Now his nose
      feels more blocked than ever, especially when he skips a dose. What is the most likely explanation?
    options:
      - Allergic rhinitis from the spray
      - Rhinitis medicamentosa
      - Nasal polyps from COX inhibition
      - Sinusitis from H influenzae
      - Choanal atresia
    answer: 1
    why:
      - "This is not an allergy; it follows prolonged use."
      - "Right. α-agonist decongestants cause rebound congestion (rhinitis medicamentosa) and tachyphylaxis when used more than 4–6 days."
      - "Polyps with COX sensitivity are Samter's triad."
      - "Nothing suggests bacterial sinusitis."
      - "Choanal atresia is congenital."
    src: { page: 704, quote: "Rebound congestion (rhinitis medicamentosa) if used more than 4-6 days. Associated with tachyphylaxis." }
    status: unverified
  # ---------- p704: H1-blockers ----------
  - id: resp.L05.004
    kind: table
    topic: h1-blockers
    title: First vs second generation H1-blockers
    columns: [Generation, Examples, Use, Adverse effects]
    rows:
      - [First, "Diphenhydramine, dimenhydrinate, chlorpheniramine, doxylamine (\"-en/-ine\", \"-en/-ate\")", "Allergy, motion sickness, vomiting in pregnancy, sleep aid", "Sedation, antimuscarinic, anti-α-adrenergic"]
      - [Second, "Loratadine, fexofenadine, desloratadine, cetirizine (\"-adine\")", Allergy, "Similar, but less sedation (less CNS entry)"]
    blanks: [[0, 2], [0, 3], [1, 1], [1, 3]]
    src: { page: 704, quote: "Allergy, motion sickness, vomiting in pregnancy, sleep aid." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.005
    kind: card
    topic: h1-blockers
    front: How do H1-blockers act at the receptor?
    back: Reversible inhibitors of H1 histamine receptors; they are inverse agonists.
    src: { page: 704, quote: "Also called antihistamines. Reversible inhibitors of H histamine receptors (inverse agonists)." }
    status: unverified
  - id: resp.L05.040
    kind: cloze
    topic: h1-blockers
    text: "First Aid's mnemonic: \"{{c1::Setirizine}}\" (cetirizine) is a {{c2::second}}-generation H1-blocker."
    src: { page: 704, quote: "Setirizine (cetirizine) is second-generation agent." }
    status: unverified
  - id: resp.L05.006
    kind: mcq
    topic: h1-blockers
    stem: >-
      A 75-year-old man takes an over-the-counter sleep aid containing diphenhydramine. Two days later he has urinary
      retention, dry mouth and confusion. Which property of the drug explains these effects?
    options:
      - Antimuscarinic activity
      - α-adrenergic agonism
      - NMDA receptor antagonism
      - Serotonin reuptake inhibition
      - β2 agonism
    answer: 0
    why:
      - "Right. First-generation H1-blockers cause sedation and antimuscarinic and anti-α-adrenergic effects; urinary retention, dry mouth and confusion are antimuscarinic."
      - "They are anti-α-adrenergic, not agonists."
      - "NMDA antagonism is dextromethorphan."
      - "That is not an H1-blocker action."
      - "β2 agonists cause tremor and arrhythmia."
    src: { page: 704, quote: "Sedation, antimuscarinic, anti-α-adrenergic." }
    status: unverified
    tags: [high-yield]
  # ---------- p704: dextromethorphan ----------
  - id: resp.L05.007
    kind: card
    topic: dextromethorphan
    front: What is dextromethorphan, and which receptor does it block?
    back: An antitussive that is an NMDA glutamate receptor antagonist.
    src: { page: 704, quote: "Antitussive. NMDA glutamate receptor antagonist" }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.032
    kind: card
    topic: dextromethorphan
    front: What effects does dextromethorphan's NMDA antagonism cause at high doses?
    back: Dissociative, hallucinogenic effects (ketamine-like).
    src: { page: 704, quote: "dissociative, hallucinogenic effects (ketamine like) at high doses." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.033
    kind: card
    topic: dextromethorphan
    front: Dextromethorphan is a synthetic codeine analog. What happens when it is used in excess, and what is given for overdose?
    back: A mild opioid effect; naloxone can be given for overdose.
    src: { page: 704, quote: "Naloxone can be given for overdose." }
    status: unverified
  - id: resp.L05.034
    kind: card
    topic: dextromethorphan
    front: What is the abuse potential of dextromethorphan?
    back: Mild abuse potential.
    src: { page: 704, quote: "Mild abuse potential." }
    status: unverified
  - id: resp.L05.008
    kind: cloze
    topic: dextromethorphan
    text: "Dextromethorphan may cause {{c1::serotonin syndrome}} if combined with other serotonergic agents."
    src: { page: 704, quote: "May cause serotonin syndrome if combined with other serotonergic agents." }
    status: unverified
  - id: resp.L05.041
    kind: cloze
    topic: dextromethorphan
    text: "Dextromethorphan may be combined with {{c1::bupropion}} as a fast-acting antidepressant."
    src: { page: 704, quote: "May be combined with bupropion as a fast-acting antidepressant." }
    status: unverified
  - id: resp.L05.009
    kind: mcq
    topic: dextromethorphan
    stem: >-
      A 40-year-old woman taking phenelzine for depression drinks a large amount of cough syrup. Hours later she is
      agitated and febrile with clonus and diarrhea. Which cough syrup ingredient is responsible?
    options:
      - Dextromethorphan
      - Diphenhydramine
      - Pseudoephedrine
      - Guaifenesin
      - Codeine
    answer: 0
    why:
      - "Right. Dextromethorphan can cause serotonin syndrome when combined with other serotonergic agents such as an MAOI."
      - "Diphenhydramine causes antimuscarinic toxicity."
      - "Pseudoephedrine causes hypertension and anxiety."
      - "Guaifenesin is an expectorant that thins respiratory secretions; it has no serotonergic action."
      - "Codeine causes opioid effects."
    src: { page: 704, quote: "May cause serotonin syndrome if combined with other serotonergic agents." }
    status: unverified
  # ---------- p704-705: asthma drugs ----------
  - id: resp.L05.010
    kind: card
    topic: asthma-drugs
    front: Which two pathways mediate bronchoconstriction in asthma, and what does therapy target?
    back: Inflammatory processes and parasympathetic tone; therapy is directed at both.
    src: { page: 704, quote: "Bronchoconstriction is mediated by (1) inflammatory processes and (2) parasympathetic tone; therapy is directed at these 2 pathways." }
    status: unverified
  - id: resp.L05.011
    kind: table
    topic: asthma-drugs
    title: Asthma drugs
    columns: [Class, Examples, Mechanism]
    rows:
      - [β2-agonists, "Albuterol (short-acting), salmeterol, formoterol", Relax bronchial smooth muscle]
      - [Glucocorticoids, "Fluticasone, budesonide", "Inhibit cytokine synthesis; inactivate NF-κB"]
      - [Muscarinic antagonists, "Tiotropium (long acting), ipratropium", Block muscarinic receptors]
      - [Antileukotrienes, "Montelukast, zafirlukast", Block CysLT1 receptors]
      - [5-lipoxygenase inhibitor, Zileuton, ↓ Leukotriene synthesis from arachidonic acid]
      - [Anti-IgE, Omalizumab, Binds unbound IgE; blocks FcεRI binding]
      - [Methylxanthines, Theophylline, "Inhibits PDE → ↑ cAMP; blocks adenosine"]
      - [PDE-4 inhibitor, Roflumilast, "↑ cAMP → bronchodilation, ↓ inflammation (COPD)"]
      - [Chromones, Cromolyn, Prevents mast cell degranulation]
      - [Anti-IL-5 / IL-5R, "Mepolizumab, reslizumab / benralizumab", Block eosinophil differentiation and survival]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [5, 2], [6, 2], [8, 2], [9, 2]]
    src: { page: 704, quote: "Fluticasone, budesonide—inhibit the synthesis of virtually all cytokines." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.057
    kind: card
    topic: asthma-drugs
    front: "In First Aid's asthma drug figure, how do glucocorticoids reduce leukotrienes and prostaglandins?"
    back: "They induce lipocortin, which inhibits phospholipase A2, so less arachidonic acid is released for 5-lipoxygenase (leukotrienes) and COX1/COX2 (prostaglandins, prostacyclin, thromboxane)."
    src: { page: 705, quote: "Leukotrienes Proinflammatory cytokines Phospholipase A₂ Arachidonic acid 5-Lipoxygenase COX1/COX2 Prostaglandins Prostacyclin Thromboxane Lipocortin" }
    status: unverified
  - id: resp.L05.058
    kind: card
    topic: asthma-drugs
    front: "In First Aid's asthma drug figure, what are the acute and the chronic responses to an allergen?"
    back: "Acute response: bronchoconstriction (↓ by β2-agonists via ↑ cAMP, and by muscarinic antagonists). Chronic response: inflammation with mucous secretion, plasma exudation and eosinophil recruitment; IL-4, IL-5, IL-9 and IL-13 act on airway smooth muscle cells."
    src: { page: 705, quote: "ACUTE RESPONSE (bronchoconstriction) cAMP β₂-agonists AC PDE CHRONIC RESPONSE (inflammation) Mucous secretion Plasma exudation Eosinophil recruitment" }
    status: unverified
  - id: resp.L05.012
    kind: card
    topic: asthma-drugs
    front: Which inhaled β2-agonist is used for acute asthma symptoms?
    back: Albuterol, the short-acting one.
    src: { page: 704, quote: "Albuterol is for acute symptoms." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.042
    kind: cloze
    topic: asthma-drugs
    text: "Inhaled β2-agonists can cause {{c1::tremor}} and {{c2::arrhythmia}}."
    src: { page: 704, quote: "Can cause tremor, arrhythmia." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.013
    kind: card
    topic: asthma-drugs
    front: How do inhaled glucocorticoids work in asthma?
    back: They switch off NF-κB, the transcription factor behind TNF-α and other inflammatory mediators, so almost all cytokine synthesis stops.
    src: { page: 704, quote: "Fluticasone, budesonide—inhibit the synthesis of virtually all cytokines. Inactivate NF-κB, the transcription factor that induces production of TNF-α and other inflammatory agents." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.043
    kind: cloze
    topic: asthma-drugs
    text: "Inhaled glucocorticoids are {{c1::1st-line}} therapy for chronic asthma."
    src: { page: 704, quote: "1st-line therapy for chronic asthma." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.044
    kind: card
    topic: asthma-drugs
    front: "How is oral thrush from inhaled glucocorticoids prevented?"
    back: "Inhale through a spacer, or rinse the mouth after each use."
    src: { page: 704, quote: "Use a spacer or rinse mouth after use to prevent oral thrush." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.014
    kind: card
    topic: asthma-drugs
    front: For which kinds of asthma are montelukast and zafirlukast especially good?
    back: Aspirin-induced and exercise-induced asthma; both drugs block the CysLT1 leukotriene receptor.
    src: { page: 704, quote: "Especially good for aspirin induced and exercise-induced asthma." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.045
    kind: cloze
    topic: asthma-drugs
    text: "Zileuton is a {{c1::5-lipoxygenase}} inhibitor, so less arachidonic acid is converted to {{c2::leukotrienes}}."
    src: { page: 704, quote: "Zileuton—5-lipoxygenase inhibitor. ↓ conversion of arachidonic acid to leukotrienes." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.046
    kind: cloze
    topic: asthma-drugs
    text: "Zileuton is {{c1::hepatotoxic}}."
    src: { page: 704, quote: "Hepatotoxic." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.015
    kind: card
    topic: asthma-drugs
    front: How does omalizumab work?
    back: It is an anti-IgE antibody that mops up free IgE in the serum, so IgE can no longer attach to its FcεRI receptor on mast cells.
    src: { page: 704, quote: "Omalizumab—binds mostly unbound serum IgE and blocks binding to FcεRI." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.035
    kind: enumerate
    topic: asthma-drugs
    prompt: "Enumerate the uses of omalizumab (4)."
    points:
      - "Allergic asthma with ↑ IgE levels resistant to inhaled glucocorticoids and long-acting β2-agonists"
      - "Chronic rhinosinusitis with nasal polyps"
      - "Chronic urticaria"
      - "IgE-mediated food allergy"
    pass: 4
    src: { page: 704, quote: "Also used for chronic rhinosinusitis with nasal polyps, chronic urticaria, and IgE-mediated food allergy." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.016
    kind: card
    topic: asthma-drugs
    front: Why is theophylline of limited use?
    back: Its therapeutic index is narrow (toxic to heart and nervous system), and cytochrome P-450 metabolizes it.
    src: { page: 704, quote: "Limited use due to narrow therapeutic index (cardiotoxicity, neurotoxicity); metabolized by cytochrome P-450." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.047
    kind: card
    topic: asthma-drugs
    front: "How does theophylline likely cause bronchodilation?"
    back: "It inhibits phosphodiesterase, so less cAMP is broken down and cAMP rises."
    src: { page: 704, quote: "Theophylline—likely causes bronchodilation by inhibiting phosphodiesterase → ↓ cAMP hydrolysis → ↑ cAMP levels." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.048
    kind: cloze
    topic: asthma-drugs
    text: "Theophylline also blocks the actions of {{c1::adenosine}}."
    src: { page: 704, quote: "Blocks actions of adenosine." }
    status: unverified
  - id: resp.L05.017
    kind: card
    topic: asthma-drugs
    front: Name the asthma biologics that target the IL-5 pathway.
    back: Mepolizumab and reslizumab bind IL-5; benralizumab binds the IL-5 receptor α.
    src: { page: 705, quote: "Mepolizumab, reslizumab—target IL-5. Benralizumab—targets IL-5 receptor α." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.049
    kind: card
    topic: asthma-drugs
    front: "What do the anti-IL-5 biologics do, and when are they used?"
    back: "They stop IL-5 from driving eosinophil differentiation, maturation, activation and survival; they are maintenance therapy for severe eosinophilic asthma."
    src: { page: 705, quote: "Prevent eosinophil differentiation, maturation, activation, and survival mediated by IL-5 stimulation. For maintenance therapy in severe eosinophilic asthma." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.050
    kind: cloze
    topic: asthma-drugs
    text: "{{c1::Dupilumab}} targets the IL-4 receptor α, inhibiting {{c2::IL-4 and IL-13}} signaling."
    src: { page: 705, quote: "Dupilumab—targets IL-4 receptor α (inhibits IL-4 and IL-13 signaling)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.018
    kind: cloze
    topic: asthma-drugs
    text: "{{c1::Roflumilast}} inhibits PDE-4 → ↑ cAMP → bronchodilation and ↓ airway inflammation."
    src: { page: 705, quote: "Roflumilast—inhibits phosphodiesterase → ↑ cAMP → bronchodilation, ↓ airway inflammation." }
    status: unverified
  - id: resp.L05.051
    kind: cloze
    topic: asthma-drugs
    text: "Roflumilast is used in {{c1::COPD}} to reduce exacerbations."
    src: { page: 705, quote: "Used in COPD to reduce exacerbations." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.052
    kind: cloze
    topic: asthma-drugs
    text: "{{c1::Cromolyn}} prevents mast cell degranulation and so prevents acute asthma symptoms."
    src: { page: 705, quote: "Cromolyn—prevents mast cell degranulation. Prevents acute asthma symptoms." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.053
    kind: cloze
    topic: asthma-drugs
    text: "Cromolyn is {{c1::rarely}} used."
    src: { page: 705, quote: "Rarely used." }
    status: unverified
  - id: resp.L05.019
    kind: mcq
    topic: asthma-drugs
    stem: >-
      A 14-year-old boy wheezes only during football practice. His physician adds a daily oral drug that blocks the
      receptor for cysteinyl leukotrienes. Which drug was prescribed?
    options:
      - Zileuton
      - Montelukast
      - Cromolyn
      - Omalizumab
      - Theophylline
    answer: 1
    why:
      - "Zileuton inhibits 5-lipoxygenase (synthesis), not the receptor, and is hepatotoxic."
      - "Right. Montelukast blocks CysLT1 receptors and is especially good for exercise-induced and aspirin-induced asthma."
      - "Cromolyn prevents mast cell degranulation."
      - "Omalizumab binds IgE."
      - "Theophylline inhibits phosphodiesterase."
    src: { page: 704, quote: "Montelukast, zafirlukast—block leukotriene receptors (CysLT1)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.020
    kind: mcq
    topic: asthma-drugs
    stem: >-
      A 45-year-old man with asthma is well controlled on theophylline. He is started on ciprofloxacin for a urinary tract
      infection and a week later has palpitations, tremor and a seizure. What explains this?
    options:
      - Ciprofloxacin induced theophylline metabolism
      - Inhibition of theophylline metabolism
      - Theophylline blocked adenosine in the kidneys
      - Ciprofloxacin acted as a β2-agonist
      - Seizure from hypokalemia due to the infection
    answer: 1
    why:
      - "Induction would lower levels, not cause toxicity."
      - "Right. Theophylline has a narrow therapeutic index and is metabolized by cytochrome P-450; an inhibitor raises levels → cardiotoxicity and neurotoxicity."
      - "Adenosine blockade is part of its action, not the cause of toxicity here."
      - "Ciprofloxacin is not a β2-agonist."
      - "Nothing supports hypokalemia."
    src: { page: 704, quote: "Limited use due to narrow therapeutic index (cardiotoxicity, neurotoxicity); metabolized by cytochrome P-450." }
    status: unverified
  - id: resp.L05.021
    kind: mcq
    topic: asthma-drugs
    stem: >-
      A 38-year-old woman with severe asthma still has exacerbations on high-dose inhaled glucocorticoids plus a LABA.
      Her blood eosinophil count is very high. Which drug best targets her disease?
    options:
      - Mepolizumab
      - Zileuton
      - Ipratropium
      - Roflumilast
      - Cromolyn
    answer: 0
    why:
      - "Right. Mepolizumab (anti-IL-5) prevents eosinophil differentiation, maturation, activation and survival; it is maintenance therapy in severe eosinophilic asthma."
      - "Zileuton is a 5-lipoxygenase inhibitor, not targeted to eosinophils."
      - "Ipratropium blocks muscarinic receptors."
      - "Roflumilast is used in COPD."
      - "Cromolyn is rarely used and not for severe eosinophilic asthma."
    src: { page: 705, quote: "For maintenance therapy in severe eosinophilic asthma." }
    status: unverified
    tags: [high-yield]
  # ---------- p706: triple therapy ----------
  - id: resp.L05.022
    kind: card
    topic: triple-therapy-copd
    front: What is triple therapy for COPD, and when is it used?
    back: Inhaled corticosteroid (↓ airway inflammation) + long-acting β2-agonist (bronchodilation) + long-acting muscarinic agent (↓ bronchoconstriction, ↓ mucus), for COPD with persistent dyspnea or exacerbations; ↑ FEV1, ↓ exacerbations. (The book prints "agonists" for the muscarinic drug; the class is the long-acting muscarinic antagonist, as on p704.)
    src: { page: 706, quote: "for treatment of COPD with persistent dyspnea or exacerbations." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.023
    kind: mcq
    topic: triple-therapy-copd
    stem: >-
      A 68-year-old woman with COPD has persistent dyspnea and two exacerbations a year despite a LABA. Her physician
      adds an inhaled corticosteroid and tiotropium. What does tiotropium add?
    options:
      - Reduced bronchoconstriction and mucus via muscarinic blockade
      - Inactivation of NF-κB, suppressing inflammatory cytokines
      - Blockade of cysteinyl leukotriene receptors on airway muscle
      - PDE-4 inhibition raising cAMP in inflammatory cells
      - Binding of free serum IgE so it cannot reach mast cells
    answer: 0
    why:
      - "Right. Tiotropium (a long-acting muscarinic antagonist) ↓ bronchoconstriction and ↓ mucus; with an ICS and a LABA it is triple therapy."
      - "That is the inhaled corticosteroid."
      - "That is montelukast."
      - "That is roflumilast."
      - "That is omalizumab."
    src: { page: 704, quote: "Tiotropium, ipratropium—competitively block muscarinic receptors, preventing bronchoconstriction. Also used for COPD. Tiotropium is long acting." }
    status: unverified
  - id: resp.L05.054
    kind: cloze
    topic: asthma-drugs
    text: "Besides asthma, the muscarinic antagonists tiotropium and ipratropium are also used for {{c1::COPD}}; {{c2::tiotropium}} is the long-acting one."
    src: { page: 704, quote: "Also used for COPD. Tiotropium is long acting." }
    status: unverified
    tags: [high-yield]
  # ---------- p706: PCV20 ----------
  - id: resp.L05.024
    kind: card
    topic: pcv20-vaccine
    front: How does the PCV20 vaccine protect?
    back: As a conjugate vaccine it raises a T-cell–dependent IgG response, which cuts nasopharyngeal colonization.
    src: { page: 706, quote: "20-valent pneumococcal conjugate vaccine: T-cell–dependent IgG response" }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.055
    kind: cloze
    topic: pcv20-vaccine
    text: "PCV20 adds serotypes beyond {{c1::PCV13/15}}, giving broader protection against {{c2::lobar pneumonia}} (\"Plenty CoVered in 20\")."
    src: { page: 706, quote: "adds serotypes beyond PCV13/15 → broader coverage/protection against lobar pneumonia. Plenty CoVered in 20." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.025
    kind: mcq
    topic: pcv20-vaccine
    stem: >-
      A 66-year-old man with type 2 diabetes comes to his primary care clinic for a routine visit. Last winter he
      was admitted with right lower lobe pneumonia and rusty sputum, and blood cultures grew gram-positive
      lancet-shaped diplococci. Today he is well and his examination is normal. He receives a vaccine in which the
