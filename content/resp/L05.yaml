  # ---------- p706: sotatercept ----------
  - id: resp.L05.029
    kind: card
    topic: sotatercept
    front: What is sotatercept, and what is it used for?
    back: A fusion protein (activin receptor + IgG Fc) that traps TGF-β family molecules (activins, growth differentiation factors) → ↓ pulmonary arteriolar remodeling; treats PAH (group 1).
    src: { page: 706, quote: "Treatment for PAH (group 1 pulmonary hypertension)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L05.030
    kind: enumerate
    topic: sotatercept
    prompt: Enumerate the adverse effects of sotatercept (7).
    points:
      - ↑ Hb
      - Thrombocytopenia → ↑ bleeding risk (eg, epistaxis)
      - Telangiectasia
      - Hypertension
      - Headache
      - Rash
      - Teratogenic (contraception required)
    pass: 5
    src: { page: 706, quote: "telangiectasia, hypertension, headache, rash, teratogenic (contraception required)." }
    status: unverified
  - id: resp.L05.031
    kind: mcq
    topic: sotatercept
    stem: >-
      A 31-year-old woman with group 1 PAH starts a drug that traps activins and growth differentiation factors. Which
      monitoring is required?
    options:
      - Hemoglobin and platelet counts
      - Liver function tests only
      - Blood glucose
      - Audiometry
      - Serum uric acid
    answer: 0
    why:
      - "Right. Sotatercept raises Hb and causes thrombocytopenia (bleeding, eg, epistaxis), so Hb and platelets are monitored; it is also teratogenic."
      - "LFT monitoring is for bosentan."
      - "Glucose is not listed."
      - "Audiometry is not relevant."
      - "Uric acid is not listed."
    src: { page: 706, quote: "Fusion protein (activin receptor paired with the Fc portion of IgG) that binds/traps TGF-β molecules (activins and growth differentiation factors)" }
    status: unverified
