  - id: resp.L01.024
    kind: card
    topic: alveolar-cell-types
    front: Which hormones are important for fetal surfactant synthesis?
    back: Glucocorticoids, which are important for fetal surfactant synthesis and lung development.
    src: { page: 679, quote: "Glucocorticoids are important for fetal surfactant synthesis and lung development." }
    status: unverified
