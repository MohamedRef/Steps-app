      - ↓ Alveolar collapse
      - ↓ Lung recoil
      - ↑ Compliance
    pass: 4
    src: { page: 679, quote: "Surfactant—↓ alveolar surface tension, ↓ alveolar collapse, ↓ lung recoil, and ↑ compliance." }
