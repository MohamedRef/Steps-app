  - id: resp.L01.025
    kind: card
    topic: alveolar-cell-types
    front: Where are hemosiderin-laden macrophages found?
    back: In conditions such as pulmonary edema and alveolar hemorrhage.
    src: { page: 679, quote: "Hemosiderin-laden macrophages may be found (eg, pulmonary edema, alveolar hemorrhage)." }
    status: unverified
  - id: resp.L01.026
    kind: mcq
    topic: alveolar-cell-types
    stem: >-
      A 47-year-old man was admitted to the ICU with severe influenza pneumonia and needed mechanical ventilation for
      diffuse bilateral infiltrates. Three weeks later he is off the ventilator and his oxygen saturation is improving,
      but a small infiltrate persists. A lung biopsy shows clusters of cuboidal cells lining the damaged alveoli and
      restoring the alveolar wall. Which other function do these cells have?
    options:
      - Degrading toxins with cytochrome P-450
      - Secreting surfactant from lamellar bodies
      - Phagocytosing hemosiderin
      - Forming the pores of Kohn
      - Covering 97% of the alveolar surface for gas exchange
    answer: 1
    why:
      - "That is the club cell of the bronchioles."
      - "Right. Type II pneumocytes proliferate after lung damage, replace type I cells, and secrete surfactant from lamellar bodies."
      - "Hemosiderin-laden macrophages are alveolar macrophages."
      - "Pores of Kohn are channels between alveoli, not cells."
      - "That is the type I pneumocyte, which is squamous."
    src: { page: 679, quote: "Secrete surfactant from lamellar bodies (arrowheads in B )." }
    status: unverified
    tags: [high-yield]
  # ---------- p679: neonatal respiratory distress syndrome ----------
  - id: resp.L01.027
    kind: card
    topic: neonatal-respiratory-distress-syndrome
    front: What is the mechanism of neonatal respiratory distress syndrome, and what does the CXR show?
    back: Surfactant deficiency → ↑ surface tension → alveolar collapse, giving a "ground-glass" appearance of the lung fields.
    src: { page: 679, quote: "Surfactant deficiency → ↑ surface tension → alveolar collapse (“ground-glass” appearance of lung fields) A ." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.028
    kind: enumerate
    topic: neonatal-respiratory-distress-syndrome
    prompt: Enumerate the risk factors for neonatal respiratory distress syndrome, with the reason where given (3).
    points:
      - Prematurity
      - Diabetes during pregnancy (↑ fetal insulin)
      - C-section delivery (↓ release of fetal glucocorticoids)
    pass: 3
    src: { page: 679, quote: "Risk factors: prematurity, diabetes during pregnancy (due to ↑ fetal insulin), C-section delivery (↓ release of fetal glucocorticoids; less stressful than vaginal delivery)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.029
    kind: card
    topic: neonatal-respiratory-distress-syndrome
    front: How is neonatal respiratory distress syndrome treated?
    back: Maternal glucocorticoids before birth; exogenous surfactant for the infant.
    src: { page: 679, quote: "Treatment: maternal glucocorticoids before birth; exogenous surfactant for infant." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.030
    kind: enumerate
    topic: neonatal-respiratory-distress-syndrome
