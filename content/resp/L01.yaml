    src: { page: 679, quote: "lecithin-sphingomyelin (L/S) ratio in amniotic fluid (≥2 is healthy; <1.5 predictive of NRDS)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.048
    kind: card
    topic: neonatal-respiratory-distress-syndrome
    front: "In amniotic fluid, why does the lecithin/sphingomyelin (L/S) ratio rise toward a mature value late in gestation?"
    back: "Lecithin concentration climbs steeply in the third trimester while sphingomyelin stays roughly flat, so the ratio passes the at-risk level (< 1.5) and reaches the mature level (≥ 2) at about 35 weeks."
    src: { page: 679, quote: "Sphingomyelin Mature L/S age At risk L/S age" }
    status: unverified
  - id: resp.L01.033
    kind: mcq
    topic: neonatal-respiratory-distress-syndrome
    stem: >-
      A 33-year-old woman with poorly controlled diabetes delivers at 34 weeks. Within hours the infant has grunting,
      retractions and cyanosis; chest x-ray shows diffuse ground-glass lung fields. What links the mother's diabetes to
      this condition?
    options:
      - Fetal hyperglycemia damages type I pneumocytes
      - Elevated fetal insulin impairs surfactant production
      - Maternal glucocorticoid excess blocks lung budding
      - Fetal hypoglycemia causes a patent ductus arteriosus
      - Macrosomia compresses the chest during delivery
    answer: 1
    why:
      - "First Aid gives the mechanism as fetal insulin, not direct pneumocyte damage."
      - "Right. Diabetes in pregnancy raises fetal insulin, a risk factor for surfactant deficiency and neonatal RDS."
      - "Glucocorticoids promote fetal surfactant synthesis; they are the treatment."
      - "PDA is a risk from persistently low O2 tension, not a cause of RDS."
      - "Ground-glass lungs reflect alveolar collapse, not birth trauma."
    src: { page: 679, quote: "diabetes during pregnancy (due to ↑ fetal insulin)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.034
    kind: mcq
    topic: neonatal-respiratory-distress-syndrome
    stem: >-
      A 27-week preterm boy with respiratory distress is treated with high concentrations of supplemental oxygen for
      several weeks. Which complication is most likely from the treatment itself?
    options:
