    src: { page: 679, quote: "Screening tests for fetal lung maturity: lamellar body count and lecithin-sphingomyelin (L/S) ratio in amniotic fluid (≥2 is healthy; <1.5 predictive of NRDS), foam stability index, surfactant-albumin ratio." }
    status: unverified
