  - id: resp.L01.046
    kind: cloze
    topic: alveolar-cell-types
    text: "Surfactant reaches mature levels at ~{{c1::35}} weeks of gestation."
    src: { page: 679, quote: "achieves mature levels ~35 weeks of gestation." }
    status: unverified
