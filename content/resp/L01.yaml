  # ---------- p678: lung development ----------
  - id: resp.L01.001
    kind: card
    topic: lung-development
    front: When and from what does lung development begin?
    back: With formation of the lung bud from the distal end of the respiratory diverticulum, during week 4 of development.
    src: { page: 678, quote: "Begins with the formation of lung bud from distal end of respiratory diverticulum during week 4 of development." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.002
    kind: order
    topic: lung-development
    prompt: "Put the five stages of lung development in order (mnemonic: \"Every pulmonologist can see alveoli\")."
    steps:
      - Embryonic (weeks 4–7)
      - Pseudoglandular (weeks 5–17)
      - Canalicular (weeks 16–25)
      - Saccular (weeks 24–38)
      - Alveolar (week 36–childhood)
    src: { page: 678, quote: "Occurs in five stages. Begins with the formation of lung bud from distal end of respiratory diverticulum during week 4 of development. Every pulmonologist can see alveoli." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.003
    kind: table
    topic: lung-development
    title: Stages of lung development
    columns: [Stage, Weeks, Structural development]
    rows:
      - [Embryonic, 4–7, "Lung bud → trachea → bronchial buds → mainstem bronchi → secondary (lobar) → tertiary (segmental) bronchi"]
      - [Pseudoglandular, 5–17, "Endodermal tubules → terminal bronchioles; modest capillary network"]
      - [Canalicular, 16–25, "Terminal bronchioles → respiratory bronchioles → alveolar ducts; prominent capillary network"]
      - [Saccular, 24–38, "Alveolar ducts → terminal sacs, separated by 1° septae"]
      - [Alveolar, 36–childhood, "Terminal sacs → adult alveoli (2° septation)"]
    blanks: [[0, 1], [1, 2], [2, 2], [3, 2], [4, 2]]
    src: { page: 678, quote: "Terminal bronchioles → respiratory bronchioles → alveolar ducts. Surrounded by prominent capillary network." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.004
    kind: enumerate
    topic: lung-development
    prompt: Enumerate the errors of the embryonic stage of lung development (4).
    points:
      - Tracheoesophageal fistula
      - Tracheal atresia
      - Tracheal stenosis
      - Pulmonary agenesis
    pass: 3
    src: { page: 678, quote: "Errors at this stage can lead to tracheoesophageal fistula, tracheal atresia/ stenosis and pulmonary agenesis." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.005
    kind: cloze
    topic: lung-development
    text: "In the pseudoglandular stage (weeks 5–17), respiration is {{c1::impossible}} (incompatible with life)."
    src: { page: 678, quote: "Respiration impossible, incompatible with life." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.035
    kind: cloze
    topic: lung-development
    text: "Pneumocytes develop starting at week {{c1::20}} (canalicular stage), when surfactant synthesis begins."
    src: { page: 678, quote: "Pneumocytes develop starting at week 20 (surfactant synthesis)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.036
    kind: cloze
    topic: lung-development
    text: "Respiration becomes possible at week {{c1::25}}, the end of the canalicular stage."
    src: { page: 678, quote: "Respiration capable at week 25." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.037
    kind: cloze
    topic: lung-development
    text: "In the canalicular stage (weeks 16–25), the airways {{c1::increase in diameter}}."
    src: { page: 678, quote: "Airways increase in diameter." }
    status: unverified
  - id: resp.L01.006
    kind: card
    topic: lung-development
    front: How does pulmonary vascular resistance change before and at birth?
    back: In utero, "breathing" is aspiration and expulsion of amniotic fluid, so pulmonary vascular resistance rises through gestation. At birth, air replaces the fluid and resistance falls.
    src: { page: 678, quote: "In utero, “breathing” occurs via aspiration and expulsion of amniotic fluid → ↑ pulmonary vascular resistance through gestation. At birth, air replaces fluid → ↓ pulmonary vascular resistance." }
    status: unverified
  - id: resp.L01.007
    kind: mcq
    topic: lung-development
    stem: >-
      A 29-year-old woman goes into spontaneous preterm labor and delivers a boy at 23 weeks' gestation in the labor
      ward. He weighs 550 g, is cyanotic with poor chest rise, and his oxygen saturation stays at 60% despite
      intubation and 100% oxygen. Arterial blood gas shows severe hypoxemia and hypercapnia. Which structures are
      forming in his distal lungs at this gestational age?
    options:
      - Mainstem and lobar bronchi from the lung bud
      - Respiratory bronchioles and alveolar ducts with a prominent capillary network
      - Terminal sacs separated by primary septae
      - Adult alveoli by secondary septation
      - Terminal bronchioles from endodermal tubules only, with no capillaries
    answer: 1
    why:
      - "That is the embryonic stage (weeks 4–7)."
      - "Right. Weeks 16–25 are the canalicular stage: respiratory bronchioles and alveolar ducts form, pneumocytes start at week 20, and respiration becomes possible only at week 25."
      - "Terminal sacs are the saccular stage (weeks 24–38)."
      - "Adult alveoli come in the alveolar stage (week 36–childhood)."
      - "Endodermal tubules forming terminal bronchioles is the pseudoglandular stage (weeks 5–17), which has a modest capillary network."
    src: { page: 678, quote: "Airways increase in diameter. Pneumocytes develop starting at week 20 (surfactant synthesis). Respiration capable at week 25." }
    status: unverified
    tags: [high-yield]
  # ---------- p678: choanal atresia ----------
  - id: resp.L01.008
    kind: card
    topic: choanal-atresia
    front: What is choanal atresia?
    back: A blocked posterior nasal opening (the choana), so air cannot pass from the nose into the nasopharynx.
    src: { page: 678, quote: "Blockage of posterior nasal opening." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.038
    kind: cloze
    topic: choanal-atresia
    text: "Choanal atresia is most often {{c1::unilateral}}."
    src: { page: 678, quote: "Most often unilateral." }
    status: unverified
  - id: resp.L01.039
    kind: cloze
    topic: choanal-atresia
    text: "Choanal atresia is often associated with bony abnormalities of the {{c1::midface}}."
    src: { page: 678, quote: "Often associated with bony abnormalities of the midface." }
    status: unverified
  - id: resp.L01.040
    kind: card
    topic: choanal-atresia
    front: How is choanal atresia diagnosed?
    back: A nasogastric tube will not pass beyond the pharynx; a CT scan confirms the blockage.
    src: { page: 678, quote: "Diagnosed by failure to pass nasogastric tube (beyond the pharynx) and confirmed with CT scan." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.009
    kind: cloze
    topic: choanal-atresia
    text: "Bilateral choanal atresia is an emergency: upper airway obstruction, noisy breathing and/or cyanosis that worsens during {{c1::feeding}} and improves with {{c2::crying}}."
    src: { page: 678, quote: "cyanosis that worsens during feeding and improves with crying." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.010
    kind: enumerate
    topic: choanal-atresia
    prompt: Enumerate the features of CHARGE syndrome (6).
    points:
      - Coloboma of eye
      - Heart defects
      - Atresia of choanae
      - Restricted growth and development
      - Genitourinary defects
      - Ear defects
    pass: 5
    src: { page: 678, quote: "Coloboma of eye ▘ Heart defects ▘ Atresia of choanae ▘ Restricted growth and development ▘ Genitourinary defects ▘ Ear defects" }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.011
    kind: mcq
    topic: choanal-atresia
    stem: >-
      A newborn girl turns blue while breastfeeding and pinks up when she cries. A nasogastric tube cannot be passed
      beyond the pharynx through either nostril. Examination also shows a keyhole defect of both irises and a heart
      murmur. Which additional finding is most likely?
    options:
      - Bilateral renal agenesis
      - Ear defects
      - Tracheoesophageal fistula
      - Left-sided diaphragmatic hernia
      - Ground-glass lung fields
    answer: 1
    why:
      - "Renal agenesis is Potter sequence, linked to pulmonary hypoplasia."
      - "Right. Bilateral choanal atresia with coloboma and a heart defect is CHARGE syndrome, which also includes ear defects."
      - "TEF is an embryonic-stage lung bud error, not part of CHARGE."
      - "Diaphragmatic hernia goes with pulmonary hypoplasia."
      - "Ground-glass lungs are neonatal RDS from surfactant deficiency."
    src: { page: 678, quote: "Often part of multiple malformation syndromes, such as CHARGE syndrome" }
    status: unverified
    tags: [high-yield]
  # ---------- p679: pulmonary hypoplasia ----------
  - id: resp.L01.012
    kind: card
    topic: pulmonary-hypoplasia
    front: What is pulmonary hypoplasia?
    back: An underdeveloped bronchial tree whose tissue is also histologically abnormal.
    src: { page: 679, quote: "Poorly developed bronchial tree with abnormal histology." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.041
    kind: cloze
    topic: pulmonary-hypoplasia
    text: "Pulmonary hypoplasia is associated with congenital {{c1::diaphragmatic hernia}} (usually {{c2::left}}-sided) and {{c3::bilateral renal agenesis}} (Potter sequence)."
    src: { page: 679, quote: "Associated with congenital diaphragmatic hernia (usually left-sided), bilateral renal agenesis (Potter sequence)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.013
    kind: mcq
    topic: pulmonary-hypoplasia
    stem: >-
      A term newborn boy has severe respiratory distress and a scaphoid abdomen. Chest x-ray shows bowel loops in the left
      hemithorax. The baby dies despite ventilation. What is the most likely lung finding at autopsy?
    options:
      - Fluid-filled cyst from abnormal foregut budding
      - Poorly developed bronchial tree with abnormal histology
      - Hyaline membranes from surfactant deficiency
      - Tracheoesophageal fistula
      - Normal lungs with a patent ductus arteriosus
    answer: 1
    why:
      - "A bronchogenic cyst is a discrete round density, not a whole underdeveloped lung."
      - "Right. A congenital diaphragmatic hernia (usually left-sided) causes pulmonary hypoplasia: a poorly developed bronchial tree."
      - "Surfactant deficiency is neonatal RDS of prematurity; this baby is term."
      - "TEF is an embryonic-stage error and does not explain bowel in the chest."
      - "The lungs cannot be normal when bowel fills the hemithorax."
    src: { page: 679, quote: "Associated with congenital diaphragmatic hernia (usually left-sided)" }
    status: unverified
    tags: [high-yield]
  # ---------- p679: bronchogenic cysts ----------
  - id: resp.L01.014
    kind: card
    topic: bronchogenic-cysts
    front: What causes bronchogenic cysts?
    back: The foregut buds abnormally and terminal or large bronchi dilate.
    src: { page: 679, quote: "Caused by abnormal budding of the foregut and dilation of terminal or large bronchi." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.042
    kind: card
    topic: bronchogenic-cysts
    front: How does a bronchogenic cyst look on CXR?
    back: A discrete, round, sharply marginated density filled with fluid; it contains air once it becomes infected.
    src: { page: 679, quote: "Discrete, round, sharply defined, fluid-filled densities on CXR (air-filled if infected)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.043
    kind: card
    topic: bronchogenic-cysts
    front: Do bronchogenic cysts cause symptoms, and if so how?
    back: Usually not. When a cyst drains badly it can press on the airway and set up repeated chest infections.
    src: { page: 679, quote: "Generally asymptomatic but can drain poorly → airway compression, recurrent respiratory infections." }
    status: unverified
  - id: resp.L01.015
    kind: mcq
    topic: bronchogenic-cysts
    stem: >-
      A 9-year-old boy has had three episodes of pneumonia in the same area in a year. Chest x-ray shows a round, sharply
      defined, fluid-filled density near the carina. What is the origin of this lesion?
    options:
      - Abnormal budding of the foregut
      - Herniation of bowel through the diaphragm
      - Failed septation of the trachea and esophagus
      - Arrest at the saccular stage
      - Surfactant deficiency
    answer: 0
    why:
      - "Right. A bronchogenic cyst comes from abnormal foregut budding; it can drain poorly → airway compression and recurrent infections."
      - "Diaphragmatic hernia causes pulmonary hypoplasia."
      - "That describes a tracheoesophageal fistula, an embryonic-stage error."
      - "Developmental arrest does not produce a discrete fluid-filled cyst."
      - "Surfactant deficiency gives diffuse ground-glass lungs in premature babies."
    src: { page: 679, quote: "Generally asymptomatic but can drain poorly → airway compression, recurrent respiratory infections." }
    status: unverified
  # ---------- p679: club cells ----------
  - id: resp.L01.016
    kind: card
    topic: club-cells
    front: What do club cells look like, and where are they?
    back: Low columnar to cuboidal cells with few microcilia and secretory granules, found in the bronchioles.
    src: { page: 679, quote: "Microciliated; low columnar/cuboidal with secretory granules. Located in bronchioles." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.044
    kind: enumerate
    topic: club-cells
    prompt: Enumerate the functions of club cells (3).
    points:
      - Degrade toxins (cytochrome P-450)
      - Secrete a surfactant-like component
      - Act as stem cells to replace bronchiolar epithelium
    pass: 3
    src: { page: 679, quote: "Degrade toxins (P-450); secrete surfactant-like component; act as stem cells to replace bronchiolar epithelium." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.017
    kind: mcq
    topic: club-cells
    stem: >-
      A 31-year-old male firefighter has cough and wheezing after smoke inhalation at a warehouse fire. A transbronchial
      biopsy shows injured bronchioles in which low columnar cells with secretory granules, which degrade inhaled
      toxins with cytochrome P-450, are preserved. Which other function of these cells will help his bronchioles
      recover?
    options:
      - Covers 97% of alveolar surfaces for gas exchange
      - Secretes DPPC from lamellar bodies
      - Replaces bronchiolar epithelium as a stem cell
      - Phagocytoses dust and releases alveolar proteases
      - Produces mucus in the trachea
    answer: 2
    why:
      - "That is the type I pneumocyte."
      - "Lamellar bodies belong to type II pneumocytes; club cells secrete only a surfactant-like component."
      - "Right. Club cells degrade toxins, secrete a surfactant-like component and act as stem cells for bronchiolar epithelium."
      - "That is the alveolar macrophage (dust cell)."
      - "Tracheal mucus comes from goblet cells and submucosal glands of the large airways; club cells sit in the bronchioles and secrete a surfactant-like component, not mucus."
    src: { page: 679, quote: "act as stem cells to replace bronchiolar epithelium." }
    status: unverified
  # ---------- p679: alveolar cell types ----------
  - id: resp.L01.018
    kind: table
    topic: alveolar-cell-types
    title: Alveolar cell types
    columns: [Cell, Shape or role]
    rows:
      - [Type I pneumocytes, "Squamous; 97% of alveolar surfaces; thinly line the alveoli for gas exchange"]
      - [Type II pneumocytes, "Cuboidal and clustered; stem cells for type I and II; secrete surfactant from lamellar bodies"]
      - [Alveolar macrophages (dust cells), "Phagocytose foreign material; release cytokines and alveolar proteases"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 679, quote: "Squamous. 97% of alveolar surfaces. Thinly line the alveoli A for optimal gas exchange." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.019
    kind: card
    topic: alveolar-cell-types
    front: What are the pores of Kohn?
    back: Small holes in the walls between neighbouring alveoli. Air, fluid and phagocytes move through them, and in pneumonia so do bacteria.
    src: { page: 679, quote: "Pores of Kohn—anatomical communications between alveoli that allow for passing of air, fluid, phagocytes, and bacteria (in pneumonia)." }
    status: unverified
  - id: resp.L01.020
    kind: cloze
    topic: alveolar-cell-types
    text: "Type II pneumocytes serve as stem cell precursors for {{c1::type I and type II pneumocytes}} and proliferate during {{c2::lung damage}}."
    src: { page: 679, quote: "Serve as stem cell precursors for 2 cell types (type I and type II pneumocytes); proliferate during lung damage." }
    status: unverified
    tags: [high-yield]
  - id: resp.L01.021
    kind: card
    topic: alveolar-cell-types
    front: How does the law of Laplace apply to alveoli?
    back: Collapsing pressure = 2 (surface tension)/radius, so alveoli tend to collapse on expiration as the radius falls.
    src: { page: 679, quote: "Application of Law of Laplace in alveoli–alveoli have ↑ tendency to collapse on expiration as radius ↓." }
    status: unverified
    tags: [high-yield]
