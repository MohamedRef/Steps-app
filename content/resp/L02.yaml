  - id: resp.L02.006
    kind: mcq
    topic: respiratory-tree
    stem: >-
      A 54-year-old woman who smokes has a wedge resection of a peripheral lung nodule. Beside the nodule, the
      pathologist describes a normal airway lined by ciliated cuboidal epithelium with sparse smooth muscle, no
      cartilage and no goblet cells, and with alveoli opening directly from its wall. Which airway is this?
    options:
      - Bronchus
      - Bronchiole
      - Terminal bronchiole
      - Respiratory bronchiole
      - Alveolar duct
    answer: 3
    why:
      - "Bronchi have cartilage and goblet cells."
      - "Bronchioles are conducting airways without alveoli in their walls."
      - "Terminal bronchioles are the end of the conducting zone; cilia continue one step further."
      - "Right. Cilia terminate in the respiratory bronchioles, the first gas-exchanging airway, lined mostly by cuboidal cells."
      - "Alveolar ducts lead to squamous-lined alveoli; there are no cilia beyond the respiratory bronchioles."
    src: { page: 680, quote: "Cilia terminate in respiratory bronchioles." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.007
    kind: mcq
    topic: respiratory-tree
    stem: >-
      A 30-year-old man with mild asthma comes to the clinic for pulmonary function testing. His physician
      reviews how airflow resistance is distributed along the airway tree. In which segment of the airway tree
      is resistance to airflow normally greatest?
    options:
      - Terminal bronchioles
      - Respiratory bronchioles
      - Large- to medium-sized bronchi
      - Alveolar ducts
      - Trachea
    answer: 2
    why:
      - "Each terminal bronchiole is narrow, but huge numbers lie in parallel, so together they have the least resistance."
      - "Respiratory bronchioles lie past the terminal bronchioles in the gas-exchange zone, where the combined cross-section is even larger and resistance is negligible."
      - "Right. Airway resistance is highest in the large- to medium-sized bronchi."
      - "Alveolar ducts are respiratory-zone passages with an enormous combined cross-section, so flow through them meets almost no resistance."
      - "The trachea is the widest single airway; the book puts the highest resistance one step further down, in the large- to medium-sized bronchi."
    src: { page: 680, quote: "Airway resistance highest in the large- to medium-sized bronchi. Small airways consist of bronchioles that further divide into terminal bronchioles (large numbers in parallel → least airway resistance)." }
    status: unverified
  # ---------- p681: lung anatomy ----------
  - id: resp.L02.008
    kind: card
    topic: lung-anatomy
    front: How many lobes does each lung have?
    back: Three on the right, two on the left.
    src: { page: 681, quote: "Right lung has 3 lobes; Left has less lobes (2) and lingula (homolog of right middle lobe [RML])." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.027
    kind: cloze
    topic: lung-anatomy
    text: "The {{c1::lingula}} of the left lung is the homolog of the right middle lobe."
    src: { page: 681, quote: "Left has less lobes (2) and lingula (homolog of right middle lobe [RML])." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.028
    kind: card
    topic: lung-anatomy
    front: What fills the place of a middle lobe in the left lung?
    back: The heart sits in that space.
    src: { page: 681, quote: "Instead of a middle lobe, left lung has a space occupied by the heart A ." }
    status: unverified
  - id: resp.L02.009
    kind: cloze
    topic: lung-anatomy
    text: "Pulmonary artery to bronchus at each hilum, RALS: {{c1::Right Anterior}}; {{c2::Left Superior}}."
    src: { page: 681, quote: "Relation of the pulmonary artery to the bronchus at each lung hilum is described by RALS—Right Anterior; Left Superior." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.010
    kind: card
    topic: lung-anatomy
    front: What is the relation of the carina to the aorta?
    back: The carina is posterior to the ascending aorta and anteromedial to the descending aorta.
    src: { page: 681, quote: "Carina is posterior to ascending aorta and anteromedial to descending aorta B ." }
    status: unverified
  - id: resp.L02.011
    kind: card
    topic: lung-anatomy
    front: Why is the right lung the more common site for inhaled foreign bodies?
    back: The right main stem bronchus is wider, more vertical and shorter than the left.
    src: { page: 681, quote: "Right lung is a more common site for inhaled foreign bodies because right main stem bronchus is wider, more vertical, and shorter than the left." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.012
    kind: table
    topic: lung-anatomy
    title: Where an aspirated peanut goes, by position
    columns: [Position, Usual site]
    rows:
      - [Supine, "Superior segment of the right lower lobe (sometimes posterior segment of the right upper lobe)"]
      - [Lying on right side or prone, Right upper lobe]
      - [Upright, Right lower lobe]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 681, quote: "While supine—usually enters superior segment of right lower lobe (RLL) or sometimes enters posterior segment of right upper lobe (RUL)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.013
    kind: mcq
    topic: lung-anatomy
    stem: >-
      A 62-year-old man is sedated and lying flat on his back in a dental chair when a fragment of a crown falls into
      his throat. He coughs briefly and is sent home. Two days later he has cough and right-sided crackles, and a chest
      x-ray shows the radiopaque fragment in a segmental bronchus. Given his position when he aspirated it, which lung
      segment does the fragment most likely occupy?
    options:
      - Superior segment of the right lower lobe
      - Lingula
      - Basal segments of the left lower lobe
      - Anterior segment of the left upper lobe
      - Apical segment of the left upper lobe
    answer: 0
    why:
      - "Right. While supine, an inhaled foreign body usually enters the superior segment of the right lower lobe (sometimes the posterior segment of the right upper lobe), because the right main stem bronchus is wider, more vertical and shorter."
      - "The lingula is on the left; the right lung is the more common site for inhaled foreign bodies."
      - "Left-sided segments are less likely: the right main stem bronchus is wider, more vertical and shorter than the left."
      - "The left upper lobe is not where a supine aspiration goes; First Aid names only right-sided sites for every position."
      - "The apical left upper lobe is a left-sided segment; supine aspiration favors the right lung, entering the superior segment of the right lower lobe."
    src: { page: 681, quote: "While supine—usually enters superior segment of right lower lobe (RLL)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.014
    kind: mcq
    topic: lung-anatomy
    stem: >-
      A 4-year-old boy chokes on a peanut while running around the playground and now has unilateral wheezing. Where is
      the peanut most likely lodged?
    options:
      - Left main bronchus
      - Right lower lobe
      - Right upper lobe
      - Lingula
      - Trachea above the carina
    answer: 1
    why:
      - "The left bronchus is narrower and less vertical than the right."
      - "Right. When upright, an aspirated object usually enters the right lower lobe through the wider, more vertical right main bronchus."
      - "The right upper lobe is typical when lying on the right side or prone."
      - "The lingula is on the left."
      - "Unilateral wheeze points to a bronchus, not the trachea."
    src: { page: 681, quote: "While upright—usually enters RLL." }
    status: unverified
  - id: resp.L02.015
    kind: card
    topic: lung-anatomy
    front: In thoracentesis, why does the needle go just above a rib?
    back: The intercostal neurovascular bundle runs along the lower edge of each rib, so staying on the upper edge of the rib below spares it.
    src: { page: 681, quote: "Needle above the rib → avoid neurovascular bundle below each rib." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.029
    kind: card
    topic: lung-anatomy
    front: In thoracentesis, why avoid going below the 9th rib?
    back: Below that level the needle can hit abdominal organs, such as the right lobe of the liver or the spleen.
    src: { page: 681, quote: "Avoid below 9th rib → risk of injuring abdominal structures (eg, right hepatic lobe, spleen)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.030
    kind: card
    topic: lung-anatomy
    front: What is thoracentesis?
    back: Draining fluid or air from the pleural space, the gap between the visceral and parietal pleura.
    src: { page: 681, quote: "Thoracentesis—removal of fluid or air from pleural space between visceral and parietal pleura." }
    status: unverified
  - id: resp.L02.016
    kind: mcq
    topic: lung-anatomy
    stem: >-
      A 65-year-old woman with a large left pleural effusion has a thoracentesis. Shortly after, she develops left upper
      quadrant pain, hypotension and a falling hemoglobin. Which procedural error most likely occurred?
    options:
      - Needle inserted just below the rib
      - Needle inserted below the 9th rib
      - Needle inserted in the 2nd intercostal space
      - Needle passed through the visceral pleura only
      - Needle inserted at the midclavicular line
    answer: 1
    why:
      - "A needle under the rib risks the intercostal neurovascular bundle, but LUQ pain with shock points to an abdominal organ."
      - "Right. Going below the 9th rib risks abdominal organs such as the spleen (or the right hepatic lobe on the right)."
      - "A high space would not reach the spleen."
      - "Thoracentesis enters the pleural space between the visceral and parietal pleura; that alone does not injure the spleen."
      - "The midclavicular line does not explain a splenic injury."
    src: { page: 681, quote: "Avoid below 9th rib → risk of injuring abdominal structures (eg, right hepatic lobe, spleen)." }
    status: unverified
    tags: [high-yield]
