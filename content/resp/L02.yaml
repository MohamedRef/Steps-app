  - id: resp.L02.023
    kind: mcq
    topic: diaphragm-structures
    stem: >-
      A 40-year-old woman has a ruptured splenic abscess irritating the left hemidiaphragm. Besides abdominal pain, she
      reports pain at the tip of her left shoulder. Which nerve roots carry this referred pain?
    options:
      - C3–C5 via the phrenic nerve
      - T8–T10 via intercostal nerves
      - Vagus nerve (CN 10)
      - T12 via the subcostal nerve
      - C7–T1 via the brachial plexus
    answer: 0
    why:
      - "Right. The diaphragm is supplied by the phrenic nerve (C3–5); irritation refers pain to the shoulder (C5) and trapezius ridge (C3, 4)."
      - "First Aid gives the phrenic nerve (C3–5) as the diaphragm's supply, not intercostal nerves."
      - "The vagus passes through the diaphragm at T10 but does not carry this pain."
      - "T12 is the level of the aortic hiatus, not the diaphragm's nerve supply."
      - "Shoulder-tip pain from the diaphragm is C3–5, not the lower brachial plexus."
    src: { page: 681, quote: "Pain from diaphragm irritation can be referred to shoulder (C5) and trapezius ridge (C3, 4)." }
    status: unverified
    tags: [high-yield]
