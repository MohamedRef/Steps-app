  - id: resp.L02.002
    kind: card
    topic: respiratory-tree
    front: Where is airway resistance highest?
    back: In the large- to medium-sized bronchi.
    src: { page: 680, quote: "Airway resistance highest in the large- to medium-sized bronchi." }
    status: unverified
    tags: [high-yield]
  - id: resp.L02.025
    kind: card
    topic: respiratory-tree
    front: Which airways have the least resistance, and why?
    back: The terminal bronchioles. Each is narrow, but there are so many of them side by side (in parallel) that their combined resistance is the lowest.
    src: { page: 680, quote: "Small airways consist of bronchioles that further divide into terminal bronchioles (large numbers in parallel → least airway resistance)." }
    status: unverified
    tags: [high-yield]
