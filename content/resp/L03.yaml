    topic: cyanide-vs-carbon-monoxide-poisoning
    front: What do cyanide and CO poisoning share mechanistically?
    back: Both inhibit complex IV of the ETC (cytochrome c oxidase) → hypoxia that does not fully correct with supplemental O2, and ↑ anaerobic metabolism.
    src: { page: 689, quote: "Both inhibit aerobic metabolism via inhibition of complex IV of ETC (cytochrome c oxidase) → hypoxia that does not fully correct with supplemental O2 and ↑ anaerobic metabolism." }
