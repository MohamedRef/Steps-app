    topic: methemoglobin
    front: What is methemoglobin?
    back: The oxidized form of Hb, whose iron is ferric (Fe3+) instead of the normal reduced ferrous (Fe2+, "just the 2 of us") state.
    src: { page: 688, quote: "Oxidized form of Hb (ferric, Fe3+ ) has reduced O2 affinity → tissue hypoxia from ↓ O2 saturation and ↓ O2 content." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.080
    kind: card
    topic: methemoglobin
    front: How does the ferric (Fe3+) iron of methemoglobin itself cause tissue hypoxia?
    back: Fe3+ has reduced O2 affinity → ↓ O2 saturation and ↓ O2 content.
    src: { page: 688, quote: "Oxidized form of Hb (ferric, Fe3+ ) has reduced O2 affinity → tissue hypoxia from ↓ O2 saturation and ↓ O2 content." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.081
    kind: card
    topic: methemoglobin
    front: In methemoglobin, how does Fe3+ change the O2 affinity of the remaining Fe2+, and what does that do to the ODC?
    back: It increases their O2 affinity, so O2 is held tightly and less is released to tissue (leftward shift in the ODC).
    src: { page: 688, quote: "Fe3+ also increases O2 affinity of remaining Fe2+ (→ O2 held tightly, less released to tissue [leftward shift in ODC])" }
    status: unverified
  - id: resp.L03.082
    kind: card
    topic: methemoglobin
    front: How does methemoglobin's affinity for cyanide compare with normal Hb?
    back: Methemoglobin (Fe3+) has ↑ affinity for cyanide.
    src: { page: 688, quote: "and has ↑ affinity for cyanide." }
    status: unverified
