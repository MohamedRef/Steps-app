  # ---------- p682: lung volumes and capacities ----------
  - id: resp.L03.001
    kind: table
    topic: lung-volumes-and-capacities
    title: The four lung volumes
    columns: [Volume, Definition]
    rows:
      - [Inspiratory reserve volume (IRV), Air that can still be breathed in after normal inspiration]
      - [Tidal volume (VT), "Air moved into the lung with each quiet inspiration; 6–8 mL/kg, typically ~500 mL"]
      - [Expiratory reserve volume (ERV), Air that can still be breathed out after normal expiration]
      - [Residual volume (RV), "Air in the lung after maximal expiration; cannot be measured by spirometry"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 682, quote: "Air in lung after maximal expiration; RV and any lung capacity that includes RV cannot be measured by spirometry" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.002
    kind: table
    topic: lung-volumes-and-capacities
    title: The four lung capacities
    columns: [Capacity, Sum, Meaning]
    rows:
      - [Inspiratory capacity (IC), IRV + VT, Air that can be breathed in after normal exhalation]
      - [Functional residual capacity (FRC), RV + ERV, "Gas in the lungs after normal expiration; chest wall outward pull balances lung inward collapse"]
      - [Vital capacity (VC), IRV + VT + ERV, Maximum volume expired after a maximal inspiration]
      - [Total lung capacity (TLC), IRV + VT + ERV + RV = VC + RV, Gas in the lungs after a maximal inspiration]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 682, quote: "Volume of gas in lungs after normal expiration; outward pulling force of chest wall is balanced with inward collapsing force of lungs" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.003
    kind: cloze
    topic: lung-volumes-and-capacities
    text: "There are {{c1::4}} volumes and {{c2::4}} capacities; a capacity is a sum of {{c3::≥2}} physiologic volumes."
    src: { page: 682, quote: "There are 4 volumes and 4 capacities. Note: a capacity is a sum of ≥2 physiologic volumes." }
    status: unverified
  - id: resp.L03.004
    kind: mcq
    topic: lung-volumes-and-capacities
    stem: >-
      A 45-year-old woman has spirometry before lung surgery. The report lists the volume she can exhale after a
      maximal inspiration, but the surgeon also wants her functional residual capacity, which spirometry cannot give.
      Why can't spirometry measure FRC?
    options:
      - FRC includes the residual volume
      - FRC includes the inspiratory reserve volume
      - FRC equals the tidal volume
      - FRC depends on surfactant
      - FRC is measured only during exercise
    answer: 0
    why:
      - "Right. FRC = RV + ERV, and RV and any capacity that includes RV cannot be measured by spirometry."
      - "FRC does not include IRV; that is the inspiratory capacity and vital capacity."
      - "FRC is RV + ERV, not VT."
      - "Surfactant affects compliance; it is not why spirometry fails."
      - "FRC is the resting volume after a normal expiration."
    src: { page: 682, quote: "RV and any lung capacity that includes RV cannot be measured by spirometry" }
    status: unverified
    tags: [high-yield]
  # ---------- p682: work of breathing ----------
  - id: resp.L03.005
    kind: card
    topic: work-of-breathing
    front: What is the work of breathing, and what two kinds of work make it up?
    back: The energy (O2) used by the respiratory muscles to produce the needed ventilation. It is flow-resistive plus elastic work (work = pressure × volume), overcoming airway resistance and elastic recoil.
    src: { page: 682, quote: "Combination of flow-resistive and elastic work (ie, work = force × distance = pressure × volume)—needed to overcome both elastic recoil and airway resistance." }
    status: unverified
  - id: resp.L03.006
    kind: table
    topic: work-of-breathing
    title: How patients minimize work of breathing
    columns: [Disease type, Extra work against, Breathing pattern]
    rows:
      - [Restrictive, Elastic recoil, ↑ RR and ↓ VT]
      - [Obstructive, Airway resistance, ↓ RR and ↑ VT]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 682, quote: "↑ in restrictive diseases (↑ work to overcome elastic recoil resistance achieved with ↑ RR and ↓ VT) and obstructive diseases (↑ work to overcome airway resistance achieved with ↓ RR and ↑ VT)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.007
    kind: mcq
    topic: work-of-breathing
    stem: >-
      A 62-year-old man with idiopathic pulmonary fibrosis has stiff lungs. To minimize his work of breathing, which
      breathing pattern does he adopt?
    options:
      - Slow, deep breaths
      - Rapid, shallow breaths
      - Normal rate with large tidal volumes
      - Pursed-lip prolonged expiration with slow rate
      - Breath holding at total lung capacity
    answer: 1
    why:
      - "Slow, deep breathing (↓ RR, ↑ VT) is the obstructive strategy against airway resistance."
      - "Right. In restrictive disease the extra work is against elastic recoil, so patients use ↑ RR and ↓ VT."
      - "Large tidal volumes increase elastic work in stiff lungs."
      - "Slow rate fits obstructive disease."
      - "Holding at TLC maximizes elastic work."
    src: { page: 682, quote: "↑ in restrictive diseases (↑ work to overcome elastic recoil resistance achieved with ↑ RR and ↓ VT)" }
    status: unverified
    tags: [high-yield]
  # ---------- p682: physiologic dead space ----------
  - id: resp.L03.008
    kind: card
    topic: physiologic-dead-space
    front: Give the equation for physiologic dead space.
    back: "VD = VT × (PaCO2 − PECO2)/PaCO2, where PaCO2 is arterial PCO2 and PECO2 is expired air PCO2."
    src: { page: 682, quote: "PaCO2 = arterial PCO2 . PECO2 = expired air PCO2 ." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.009
    kind: card
    topic: physiologic-dead-space
    front: What makes up physiologic dead space, and where in a healthy lung is alveolar dead space largest?
    back: Anatomic dead space of the conducting airways plus alveolar dead space; the apex of a healthy lung contributes most alveolar dead space.
    src: { page: 682, quote: "anatomic dead space of conducting airways plus alveolar dead space; apex of healthy lung is largest contributor of alveolar dead space." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.010
    kind: cloze
    topic: physiologic-dead-space
    text: "Physiologic dead space ≈ anatomic dead space in normal lungs, but may be {{c1::greater}} in lung diseases with {{c2::ventilation/perfusion mismatch}}."
    src: { page: 682, quote: "May be greater than anatomic dead space in lung diseases with ventilation/ perfusion mismatch." }
    status: unverified
  - id: resp.L03.011
    kind: mcq
    topic: physiologic-dead-space
    stem: >-
      A ventilated patient has a tidal volume of 500 mL, arterial PCO2 of 40 mm Hg and mixed expired PCO2 of 30 mm Hg.
      What is the physiologic dead space?
    options:
      - 75 mL
      - 125 mL
      - 150 mL
      - 375 mL
      - 500 mL
    answer: 1
    why:
      - "That would need (PaCO2 − PECO2)/PaCO2 of 0.15."
      - "Right. VD = VT × (PaCO2 − PECO2)/PaCO2 = 500 × (40 − 30)/40 = 125 mL."
      - "150 mL is the typical normal VD quoted on p683, not this calculation."
      - "375 mL is VT − VD, the part of the breath that does exchange gas."
      - "That is the whole tidal volume."
    src: { page: 682, quote: "VD = volume of inspired air that does not take part in gas exchange." }
    status: unverified
  # ---------- p683: ventilation ----------
  - id: resp.L03.012
    kind: table
    topic: ventilation
    title: Minute vs alveolar ventilation
    columns: [Term, Meaning, Equation]
    rows:
      - [Minute ventilation (VE), Total gas entering and leaving the lungs per minute, VE = VT × RR]
      - [Alveolar ventilation (VA), Gas reaching the alveoli each minute, VA = (VT − VD) × RR]
    blanks: [[0, 2], [1, 2]]
    src: { page: 683, quote: "Total volume of gas that reaches alveoli each minute. VA = (VT − VD) × RR" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.013
    kind: cloze
    topic: ventilation
    text: "Normal values: RR = {{c1::12-20}} breaths/min, VT = {{c2::500}} mL/breath, VD = {{c3::150}} mL/breath."
    src: { page: 683, quote: "RR = 12-20 breaths/min ▘ VT = 500 mL/breath ▘ VD = 150 mL/breath" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.014
    kind: mcq
    topic: ventilation
    stem: >-
      Two patients each have a minute ventilation of 6 L/min and a dead space of 150 mL. Patient A breathes 12 times a
      minute with a tidal volume of 500 mL; patient B breathes 30 times a minute with 200 mL. What is patient B's
      alveolar ventilation?
    options:
      - 6.0 L/min
      - 4.2 L/min
      - 3.0 L/min
      - 1.5 L/min
      - 0.6 L/min
    answer: 3
    why:
      - "That is minute ventilation, which includes dead space."
      - "4.2 L/min is patient A: (500 − 150) × 12."
      - "That would need VT − VD of 100 mL."
      - "Right. VA = (VT − VD) × RR = (200 − 150) × 30 = 1.5 L/min; rapid shallow breathing wastes ventilation on dead space."
      - "That is far too low for these numbers."
    src: { page: 683, quote: "VA = (VT − VD) × RR" }
    status: unverified
    tags: [high-yield]
  # ---------- p683: lung and chest wall properties ----------
  - id: resp.L03.015
    kind: card
    topic: lung-and-chest-wall-properties
    front: What is hysteresis in the lung?
    back: The difference between the pressure of inhalation (volume increasing) and exhalation (volume decreasing); inflation follows a different curve because surface tension must be overcome during inflation.
    src: { page: 683, quote: "Hysteresis—difference between pressure of inhalation (volume increasing) and pressure of exhalation (volume decreasing)." }
    status: unverified
  - id: resp.L03.016
    kind: card
    topic: lung-and-chest-wall-properties
    front: What is elastic recoil, and what is true of the pressures at FRC?
    back: Lungs tend to collapse inward and the chest wall to spring outward. At FRC, airway and alveolar pressures are atmospheric (zero), intrapleural pressure is negative (preventing atelectasis), the opposing pulls balance, and PVR is at a minimum.
    src: { page: 683, quote: "At FRC, airway and alveolar pressures equal atmospheric pressure (PB; called zero), and intrapleural pressure is negative (preventing atelectasis)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.017
    kind: card
    topic: lung-and-chest-wall-properties
    front: Define compliance and name what raises it.
    back: Change in lung volume per change in pressure (ΔV/ΔP); inversely proportional to wall stiffness and increased by surfactant.
    src: { page: 683, quote: "Change in lung volume for a change in pressure (ΔV/ΔP). Inversely proportional to wall stiffness and increased by surfactant." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.018
    kind: table
    topic: lung-and-chest-wall-properties
    title: Compliance changes
    columns: [Compliance, Meaning, Examples]
    rows:
      - [↑, Lung easier to fill, "Emphysema, older adults"]
      - [↓, Lung more difficult to fill, "Pulmonary fibrosis, pneumonia, ARDS, pulmonary edema"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 683, quote: "↑ compliance = lung easier to fill (eg, emphysema, older adults) ▘ ↓ compliance = lung more difficult to fill (eg, pulmonary fibrosis, pneumonia, ARDS, pulmonary edema)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.019
    kind: mcq
    topic: lung-and-chest-wall-properties
    stem: >-
      A healthy 25-year-old man breathes quietly. At the end of a normal expiration, before the next breath, which
      statement is true?
    options:
      - Intrapleural pressure is zero
      - Alveolar pressure is negative
      - Lung inward pull is balanced by chest wall outward pull
      - Pulmonary vascular resistance is at its maximum
      - Lung volume equals residual volume
    answer: 2
    why:
      - "Intrapleural pressure stays negative at FRC, which prevents atelectasis."
      - "At FRC alveolar pressure is atmospheric (zero)."
      - "Right. At FRC the inward pull of the lung balances the outward pull of the chest wall; system pressure is atmospheric."
      - "PVR is at a minimum at FRC."
      - "End of normal expiration is FRC (RV + ERV), not RV."
    src: { page: 683, quote: "The inward pull of the lung is balanced by the outward pull of the chest wall. System pressure is atmospheric. Pulmonary vascular resistance (PVR) is at a minimum." }
    status: unverified
    tags: [high-yield]
  # ---------- p684: pulmonary circulation ----------
  - id: resp.L03.020
    kind: card
    topic: pulmonary-circulation
    front: How does the pulmonary circulation respond to low alveolar PO2, and how does this differ from the systemic circulation?
    back: ↓ PAO2 causes hypoxic vasoconstriction, shifting blood from poorly to well-ventilated regions. In the systemic circulation, ↓ tissue PO2 causes vasodilation.
    src: { page: 684, quote: "causes hypoxic vasoconstriction that shifts blood away from poorly ventilated regions of lung to well-ventilated regions of lung" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.021
    kind: table
    topic: pulmonary-circulation
    title: Perfusion-limited vs diffusion-limited gas exchange
    columns: [Type, Gases, Key point]
    rows:
      - [Perfusion limited, "O2 (normal health), CO2, N2O", Gas equilibrates early along the capillary; exchange ↑ only if blood flow ↑]
      - [Diffusion limited, "O2 (emphysema, fibrosis), CO", Gas does not equilibrate by the end of the capillary]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 684, quote: "Gas equilibrates early along the length of the capillary. Exchange can be ↑ only if blood flow ↑." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.022
    kind: card
    topic: pulmonary-circulation
    front: Why do diffusion-limiting diseases such as pulmonary fibrosis cause hypoxia before hypercapnia?
    back: O2 diffuses slowly while CO2 diffuses very rapidly across the alveolar membrane.
    src: { page: 684, quote: "Disease states that lead to diffusion limitation (eg, pulmonary fibrosis) are more likely to cause early hypoxia than hypercapnia." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.023
    kind: cloze
    topic: pulmonary-circulation
    text: "Chronic hypoxic vasoconstriction may lead to {{c1::pulmonary hypertension}} +/– {{c2::cor pulmonale}}."
    src: { page: 684, quote: "Chronic hypoxic vasoconstriction may lead to pulmonary hypertension +/– cor pulmonale." }
    status: unverified
  - id: resp.L03.024
    kind: card
    topic: pulmonary-circulation
    front: Give Fick's law of diffusion and how emphysema and fibrosis change it.
    back: "J = A × Dk × (P1 − P2)/Δx (A = area, Δx = wall thickness, Dk = diffusion coefficient). Emphysema ↓ A; pulmonary fibrosis ↑ Δx."
    src: { page: 684, quote: "A ↓ in emphysema. ▘ Δx ↑ in pulmonary fibrosis." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.025
    kind: card
    topic: pulmonary-circulation
    front: What does DLCO measure?
    back: The extent to which CO passes from the air sacs of the lungs into the blood.
    src: { page: 684, quote: "DLCO is the extent to which CO passes from air sacs of lungs into blood." }
    status: unverified
  - id: resp.L03.026
    kind: mcq
    topic: pulmonary-circulation
    stem: >-
      A 58-year-old woman with idiopathic pulmonary fibrosis has an O2 saturation of 88% but a normal PaCO2. Which
      property of gas exchange best explains the isolated hypoxemia?
    options:
      - CO2 is perfusion limited and O2 never is
      - O2 diffuses slowly, while CO2 diffuses very rapidly
      - Fibrosis increases the alveolar surface area
      - Hypoxic vasodilation in fibrotic regions
      - CO2 binds hemoglobin with higher affinity than O2
    answer: 1
    why:
      - "O2 is perfusion limited in health but becomes diffusion limited in fibrosis."
      - "Right. Fibrosis thickens the wall (↑ Δx); O2 diffuses slowly while CO2 diffuses rapidly, so hypoxia comes before hypercapnia."
      - "Fibrosis increases wall thickness; emphysema decreases area."
      - "The pulmonary response to hypoxia is vasoconstriction."
      - "First Aid gives diffusion speed as the reason, not hemoglobin affinity."
    src: { page: 684, quote: "O2 diffuses slowly, while CO2 diffuses very rapidly across the alveolar membrane." }
    status: unverified
    tags: [high-yield]
  # ---------- p684: pulmonary vascular resistance ----------
  - id: resp.L03.027
    kind: card
    topic: pulmonary-vascular-resistance
    front: Give the formula for pulmonary vascular resistance.
    back: "PVR = (Ppulm artery − PL atrium)/Q̇, where PL atrium ≈ pulmonary artery occlusion (wedge) pressure and Q̇ = cardiac output."
    src: { page: 684, quote: "PL atrium ≈ pulmonary artery occlusion pressure (also called pulmonary capillary wedge pressure)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.028
    kind: cloze
    topic: pulmonary-vascular-resistance
    text: "Resistance R = 8ηl/πr⁴, so resistance is inversely proportional to the {{c1::fourth power of the radius}}; η is blood {{c2::viscosity}}."
    src: { page: 684, quote: "η = viscosity of blood (“stickiness”) l = vessel length r = vessel radius" }
    status: unverified
  - id: resp.L03.029
    kind: mcq
    topic: pulmonary-vascular-resistance
    stem: >-
      A patient has a mean pulmonary artery pressure of 25 mm Hg, a pulmonary capillary wedge pressure of 10 mm Hg and
      a cardiac output of 5 L/min. What is the pulmonary vascular resistance?
    options:
      - 2 mm Hg·min/L
      - 3 mm Hg·min/L
      - 5 mm Hg·min/L
      - 7 mm Hg·min/L
      - 15 mm Hg·min/L
    answer: 1
    why:
      - "That would need a pressure gradient of 10 mm Hg."
      - "Right. PVR = (Ppulm artery − PL atrium)/Q̇ = (25 − 10)/5 = 3; the wedge pressure stands in for left atrial pressure."
      - "That divides the PA pressure alone by output."
      - "That adds the pressures instead of subtracting them."
      - "15 mm Hg is the gradient; it still needs dividing by Q̇."
    src: { page: 684, quote: "PL atrium ≈ pulmonary artery occlusion pressure (also called pulmonary capillary wedge pressure)" }
    status: unverified
  # ---------- p685: V/Q mismatch ----------
  - id: resp.L03.030
    kind: table
    topic: ventilation-perfusion-mismatch
    title: V/Q at the apex and base
    columns: [Site, V/Q, Meaning]
    rows:
      - [Apex, "3", Wasted ventilation]
      - [Base, "0.6", Wasted perfusion]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 685, quote: "at apex of lung = 3 (wasted ventilation) ▘ at base of lung = 0.6 (wasted perfusion)" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.031
    kind: card
    topic: ventilation-perfusion-mismatch
    front: How do ventilation and perfusion compare between apex and base, and what happens in exercise?
    back: Both ventilation and perfusion are greater at the base. With exercise (↑ cardiac output), apical capillaries dilate and V/Q approaches 1.
    src: { page: 685, quote: "Both ventilation and perfusion are greater at the base of the lung than at the apex of the lung. With exercise (↑ cardiac output), there is vasodilation of apical capillaries → ratio approaches 1." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.032
    kind: card
    topic: ventilation-perfusion-mismatch
    front: Why does TB favor the lung apex?
    back: Organisms that thrive in high O2, such as TB, flourish in the apex (high V/Q).
    src: { page: 685, quote: "Certain organisms that thrive in high O2 (eg, TB) flourish in the apex." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.033
    kind: table
    topic: ventilation-perfusion-mismatch
    title: The two extremes of V/Q
    columns: [V/Q, Problem, Response to 100% O2, Example]
    rows:
      - ["0", "Airway obstruction (shunt)", Does not improve PaO2, Foreign body aspiration]
      - ["∞", "Blood flow obstruction (physiologic dead space)", Improves PaO2 (if dead space < 100%), Pulmonary embolus]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 685, quote: "In shunt, 100% O2 does not improve PaO2 (eg, foreign body aspiration)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.034
    kind: table
    topic: ventilation-perfusion-mismatch
    title: West lung zones
    columns: [Zone, Pressure order]
    rows:
      - [Zone 1, PA ≥ Pa > Pv]
      - [Zone 2, Pa > PA > Pv]
      - [Zone 3, Pa > Pv > PA]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 685, quote: "Zone 1 PA ≥ Pa > Pv" }
    status: unverified
  - id: resp.L03.035
    kind: mcq
    topic: ventilation-perfusion-mismatch
    stem: >-
      A 3-year-old boy inhales a peanut that completely blocks his right main bronchus. His saturation is 84% and does
      not rise on 100% O2 by face mask. What is the V/Q of the obstructed lung?
    options:
      - "0, a shunt"
      - "Infinite, dead space"
      - "1, matched"
      - "3, like the normal apex"
      - "0.6, like the normal base"
    answer: 0
    why:
      - "Right. Airway obstruction gives V/Q = 0 (shunt); blood passes unventilated alveoli, so 100% O2 does not improve PaO2."
      - "Infinite V/Q is blood flow obstruction (eg, pulmonary embolus), where 100% O2 does help."
      - "A blocked bronchus cannot have matched ventilation."
      - "V/Q of 3 is the normal apex (wasted ventilation)."
      - "0.6 is the normal base, not complete obstruction."
    src: { page: 685, quote: "= 0 = “oirway” obstruction (shunt). In shunt, 100% O2 does not improve PaO2 (eg, foreign body aspiration)." }
    status: unverified
    tags: [high-yield]
  # ---------- p685: alveolar gas equation ----------
  - id: resp.L03.036
    kind: card
    topic: alveolar-gas-equation
    front: Give the alveolar gas equation and its sea-level room-air form.
    back: "PAO2 = PIO2 − PaCO2/RQ; at sea level on room air, PAO2 ≈ 150 − PaCO2/0.8. RQ = CO2 produced/O2 consumed."
    src: { page: 685, quote: "RQ = respiratory quotient = CO2 produced/ O2 consumed" }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.037
    kind: cloze
    topic: alveolar-gas-equation
    text: "A-a gradient = PAO2 − PaO2. Normal is estimated as ({{c1::age/4}}) + 4, so under 40 years it should be < {{c2::14}}."
    src: { page: 685, quote: "Normal A-a gradient estimated as (age/4) + 4 (eg, for a person <40 years old, gradient should be <14)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L03.038
    kind: mcq
    topic: alveolar-gas-equation
    stem: >-
      A 32-year-old woman at sea level on room air has PaCO2 40 mm Hg and PaO2 70 mm Hg. Using RQ 0.8 and PIO2 150 mm
      Hg, what is her A-a gradient, and is it normal?
    options:
      - 10 mm Hg, normal
      - 30 mm Hg, increased
      - 50 mm Hg, increased
      - 80 mm Hg, increased
      - 100 mm Hg, normal
    answer: 1
    why:
      - "That would need PaO2 90 mm Hg."
      - "Right. PAO2 = 150 − 40/0.8 = 100; A-a = 100 − 70 = 30, above the normal (32/4) + 4 = 12."
      - "That miscalculates PAO2 as 120."
      - "That subtracts PaCO2 from PaO2 rather than using PAO2."
      - "100 mm Hg is the PAO2, not the gradient."
    src: { page: 685, quote: "A-a gradient = PAO2 – PaO2 ." }
    status: unverified
    tags: [high-yield]
  # ---------- p686: CO2 transport ----------
  - id: resp.L03.039
    kind: table
    topic: carbon-dioxide-transport
    title: How CO2 is carried in blood
    columns: [Form, Share]
    rows:
      - [HCO3− (made in RBCs by carbonic anhydrase; carried in plasma), "90%"]
      - [Carbamino compounds (plasma proteins and globin N-terminus → HbCO2), "5%"]
