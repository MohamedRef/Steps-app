    kind: card
    topic: ventilation-perfusion-mismatch
    front: What happens to apical V/Q during exercise, and why?
    back: Cardiac output rises, the apical capillaries open up (vasodilate), and the apical V/Q falls toward 1.
    src: { page: 685, quote: "With exercise (↑ cardiac output), there is vasodilation of apical capillaries → ratio approaches 1." }
