  - id: resp.L04.024
    kind: mcq
    topic: mediastinitis
    stem: >-
      Nine days after coronary bypass surgery, a 63-year-old man has fever, tachycardia, chest pain and purulent
      drainage from his sternal wound. WBC is 18,000/mm3. Besides cardiothoracic surgery, which of the following is
      another common cause of his condition?
    options:
      - Rupture of a pulmonary bleb
      - Esophageal perforation from repetitive vomiting
      - Histoplasma capsulatum infection
      - Asbestos exposure
      - Sarcoidosis
    answer: 1
    why:
      - "A ruptured bleb causes spontaneous pneumomediastinum (gas in the mediastinum), not an infection."
      - "Right. This is acute mediastinitis, commonly due to postoperative complications of cardiothoracic procedures (≤14 days), esophageal perforation (common with repetitive vomiting) or spread of odontogenic/retropharyngeal infection."
      - "Histoplasma is a common cause of chronic (fibrosing) mediastinitis, not this acute postoperative picture."
      - "Asbestos is linked to pleural plaques and mesothelioma, not mediastinal infection."
      - "Sarcoidosis causes hilar lymphadenopathy with noncaseating granulomas, not mediastinal infection."
    src: { page: 691, quote: "Commonly due to postoperative complications of cardiothoracic procedures (≤14 days), esophageal perforation (common with repetitive vomiting), or contiguous spread of odontogenic/retropharyngeal infection." }
    status: unverified
