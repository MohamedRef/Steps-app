  - id: resp.L04.007
    kind: mcq
    topic: epistaxis
    stem: >-
      A 15-year-old boy has had recurrent nosebleeds and a stuffy left nostril for several months. Tonight he comes
      to the emergency department with heavy bleeding that runs down the back of his throat; it does not stop after
      20 minutes of firm pressure on the soft front of his nose. He is pale, his pulse is 118/min and his blood
      pressure is 98/60 mm Hg. Which vessel is most likely the source of this bleed?
    options:
      - Kiesselbach plexus at the caudal septum
      - Sphenopalatine artery, a branch of the maxillary artery
      - Superficial temporal artery
      - Lingual artery
      - Internal jugular vein
    answer: 1
    why:
      - "Kiesselbach plexus, at the caudal septum in the anterior segment, is where most nosebleeds occur, but it is not the posterior source."
      - "Right. Life-threatening hemorrhages occur in the posterior segment, from the sphenopalatine artery, a branch of the maxillary artery."
      - "The superficial temporal artery supplies the scalp, not the nasal cavity."
      - "The lingual artery supplies the tongue, not the posterior nasal cavity."
      - "A venous source does not explain a life-threatening posterior nasal hemorrhage; First Aid names the sphenopalatine artery."
    src: { page: 690, quote: "Life-threatening hemorrhages occur in posterior segment (sphenopalatine artery, a branch of maxillary artery)." }
    status: unverified
    tags: [high-yield]
