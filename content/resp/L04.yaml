  - id: resp.L04.007
    kind: mcq
    topic: epistaxis
    stem: >-
      A 15-year-old boy has recurrent heavy nosebleeds and progressive unilateral nasal obstruction. Endoscopy shows a
      vascular mass in the posterior nasal cavity. What is the most likely diagnosis?
    options:
      - Kiesselbach plexus bleeding from nose picking
      - Nasal angiofibroma
      - Nasopharyngeal carcinoma from HPV-16
      - Allergic rhinitis
      - Laryngeal papillomatosis
    answer: 1
    why:
      - "Anterior septal bleeding is common but does not form a posterior mass."
      - "Right. Nasal angiofibromas are a cause of epistaxis that is common in adolescent males."
      - "Nasopharyngeal carcinoma is associated with EBV, not HPV-16 (HPV-16 is oropharyngeal)."
      - "Allergic rhinitis does not produce a vascular mass."
      - "Papillomatosis affects the true vocal cords and causes hoarseness."
    src: { page: 690, quote: "Common causes include foreign body, trauma, allergic rhinitis, and nasal angiofibromas (common in adolescent males)." }
    status: unverified
    tags: [high-yield]
  # ---------- p690: head and neck cancer ----------
  - id: resp.L04.008
    kind: card
    topic: head-and-neck-cancer
    front: What type are most head and neck cancers, and what are their risk factors?
    back: Mostly squamous cell carcinoma; risk factors are tobacco, alcohol, HPV-16 (oropharyngeal) and EBV (nasopharyngeal).
    src: { page: 690, quote: "Mostly squamous cell carcinoma. Risk factors include tobacco, alcohol, HPV-16 (oropharyngeal), EBV (nasopharyngeal)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.009
    kind: card
    topic: head-and-neck-cancer
    front: What is field cancerization?
    back: A carcinogen damages a wide mucosal area, so multiple tumors develop independently after exposure.
    src: { page: 690, quote: "Field cancerization: carcinogen damages wide mucosal area → multiple tumors develop independently after exposure." }
    status: unverified
  - id: resp.L04.010
    kind: card
    topic: head-and-neck-cancer
    front: How can nasopharyngeal carcinoma present?
    back: Unilateral nasal obstruction, discharge, epistaxis; Eustachian tube obstruction → otitis media ± effusion and hearing loss.
    src: { page: 690, quote: "Nasopharyngeal carcinoma may present with unilateral nasal obstruction, discharge, epistaxis. Eustachian tube obstruction may lead to otitis media +/– effusion, hearing loss." }
    status: unverified
  - id: resp.L04.011
    kind: cloze
    topic: head-and-neck-cancer
    text: "Laryngeal (recurrent respiratory) papillomatosis is a benign tumor of stratified squamous epithelium such as the true vocal cords, associated with HPV-{{c1::6}} and HPV-{{c2::11}}; glottic disease → {{c3::hoarseness}}."
    src: { page: 690, quote: "Associated with HPV-6 and HPV-11. Symptoms may guide location of pathology (supraglottic → dysphagia, infraglottic/glottic → hoarseness)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.012
    kind: mcq
    topic: head-and-neck-cancer
    stem: >-
      A 4-year-old girl has progressive hoarseness for 6 months. Laryngoscopy shows multiple wart-like growths on the
      true vocal cords. Her mother had genital warts during pregnancy. Which agent is most likely responsible?
    options:
      - HPV-16
      - HPV-6
      - EBV
      - Rhinovirus
      - H influenzae
    answer: 1
    why:
      - "HPV-16 is linked to oropharyngeal squamous cell carcinoma."
      - "Right. Laryngeal papillomatosis is associated with HPV-6 and HPV-11, possibly transmitted from mother to baby during labor."
      - "EBV is linked to nasopharyngeal carcinoma."
      - "Rhinovirus causes acute rhinosinusitis."
      - "H influenzae superinfects sinusitis; it does not cause papillomas."
    src: { page: 690, quote: "especially in children (possibly from HPV transmitted from mother to baby during labor). Associated with HPV-6 and HPV-11." }
    status: unverified
    tags: [high-yield]
  # ---------- p691: pulmonary emboli ----------
  - id: resp.L04.013
    kind: card
    topic: pulmonary-emboli
    front: What is a pulmonary embolus physiologically, and how does it present?
    back: Obstruction of the pulmonary artery or branches by foreign material (usually thrombus) from elsewhere; alveoli are ventilated but not perfused (↑ V/Q). Sudden dyspnea, pleuritic chest pain, tachypnea, tachycardia, hypoxemia, respiratory alkalosis.
    src: { page: 691, quote: "May present with sudden-onset dyspnea, pleuritic chest pain, tachypnea, tachycardia, hypoxemia, respiratory alkalosis." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.014
    kind: card
    topic: pulmonary-emboli
    front: How is PE diagnosed, and what can the ECG show?
    back: CT pulmonary angiography (filling defects). ECG may show sinus tachycardia or, less commonly, S1Q3T3.
    src: { page: 691, quote: "Diagnosed with CT pulmonary angiography (look for filling defects B ). ECG may show sinus tachycardia or, less commonly, S1Q3T3 abnormality." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.015
    kind: card
    topic: pulmonary-emboli
    front: What are lines of Zahn?
    back: Interdigitating pink (platelets, fibrin) and red (RBCs) layers found only in thrombi formed before death; they distinguish pre- from postmortem thrombi.
    src: { page: 691, quote: "Lines of Zahn C are interdigitating areas of pink (platelets, fibrin) and red (RBCs) found only in thrombi formed before death" }
    status: unverified
    tags: [high-yield]
