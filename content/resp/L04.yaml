  # ---------- p691: pulmonary emboli ----------
  - id: resp.L04.013
    kind: card
    topic: pulmonary-emboli
    front: In a pulmonary embolus, what happens to ventilation and perfusion of the affected alveoli?
    back: They are ventilated but not perfused (V/Q mismatch, ↑ V/Q), because foreign material (usually thrombus) from elsewhere obstructs the pulmonary artery or its branches.
    src: { page: 691, quote: "Affected alveoli are ventilated but not perfused" }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.014
    kind: card
    topic: pulmonary-emboli
    front: How is PE diagnosed?
    back: With CT pulmonary angiography, which shows the clot as a filling defect.
    src: { page: 691, quote: "Diagnosed with CT pulmonary angiography (look for filling defects B )." }
    status: unverified
    tags: [high-yield]
