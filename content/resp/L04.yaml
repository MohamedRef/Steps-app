    kind: card
    topic: pulmonary-emboli
    front: How is PE treated?
    back: Anticoagulation (eg, heparin, direct thrombin/factor Xa inhibitors); an IVC filter if anticoagulation is contraindicated.
    src: { page: 691, quote: "Treatment: anticoagulation (eg, heparin, direct thrombin/factor Xa inhibitors), IVC filter (if anticoagulation is contraindicated)." }
    status: unverified
  - id: resp.L04.019
    kind: mcq
    topic: pulmonary-emboli
    stem: >-
      A 24-year-old man is admitted after a femoral shaft fracture from a motorcycle crash. Two days later he becomes
      confused and hypoxemic, and petechiae appear on his chest and conjunctivae. Apart from long bone fractures, which
      of the following is also associated with the complication he has?
    options:
      - Prolonged immobilization after surgery
      - Liposuction
      - Rapid ascent while scuba diving
      - Central line placement
      - Labor and delivery
    answer: 1
    why:
      - "Recent surgery and immobilization are associated with thromboemboli, which do not cause this triad."
      - "Right. This is fat embolism (hypoxemia, neurologic abnormalities, petechial rash); fat emboli are associated with long bone fractures and liposuction."
      - "Divers who ascend get nitrogen air emboli (decompression sickness)."
      - "Central line placement is an iatrogenic cause of air emboli."
      - "Amniotic fluid emboli typically occur during labor or postpartum."
    src: { page: 691, quote: "Fat emboli—associated with long bone fractures and liposuction; classic triad of hypoxemia, neurologic abnormalities, petechial rash." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.020
    kind: mcq
    topic: pulmonary-emboli
    stem: >-
      A 66-year-old woman collapses on postoperative day 5 after a hip replacement. She is hypotensive with distended
      neck veins; CT angiography shows a large saddle embolus. What is the mechanism of her shock?
    options:
      - Loss of vascular tone from cytokines
      - Restricted LV filling from an enlarged RV
      - Primary LV systolic failure from infarction
      - Hemorrhage into the pleural space
      - Hypovolemia from fluid shifts
    answer: 1
    why:
      - "That is distributive (septic) shock."
      - "Right. A large or saddle embolus raises RV size and restricts LV filling → obstructive shock and possible sudden death."
      - "The LV itself is not the primary problem."
      - "There is no hemothorax."
      - "Distended neck veins argue against hypovolemia."
    src: { page: 691, quote: "Large emboli or saddle embolus (arrows in A ) may cause sudden death due to restricted LV filling and ↑ RV size → further ↓ in LV filling → obstructive shock." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.162
    kind: card
    topic: pulmonary-emboli
    front: "How can a large or saddle pulmonary embolus cause sudden death?"
    back: "The RV dilates against the blockage and squeezes the LV, so the LV fills poorly; less filling means less output, ending in obstructive shock."
    src: { page: 691, quote: "Large emboli or saddle embolus (arrows in A ) may cause sudden death due to restricted LV filling and ↑ RV size → further ↓ in LV filling → obstructive shock." }
    status: unverified
    tags: [high-yield]
