    front: Which way does the flow-volume loop shift in obstructive and restrictive disease?
    back: Obstructive loop shifts to the left (higher volumes); restrictive loop shifts to the right (lower volumes).
    src: { page: 692, quote: "OBSTRUCTIVE Loop shifts to the left" }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.029
    kind: mcq
    topic: flow-volume-loops
    stem: >-
      A 50-year-old man has PFTs showing FEV1 55% predicted, FVC 60% predicted and FEV1/FVC 85%. TLC is reduced. Which
      condition fits this pattern?
    options:
      - Emphysema
      - Asthma
      - Idiopathic pulmonary fibrosis
      - Chronic bronchitis
      - Bronchiectasis
    answer: 2
    why:
      - "Emphysema is obstructive: low FEV1/FVC with ↑ TLC."
      - "Asthma is obstructive."
      - "Right. A restrictive pattern: FEV1 and FVC fall in proportion, the ratio is normal or ↑, and TLC is ↓."
      - "Chronic bronchitis is obstructive."
      - "Bronchiectasis gives an obstructive pattern."
    src: { page: 692, quote: "FEV1 decreased proportionately to FVC" }
    status: unverified
    tags: [high-yield]
  # ---------- p692: obstructive lung diseases ----------
  - id: resp.L04.030
    kind: card
    topic: obstructive-lung-diseases
    front: What defines obstructive lung disease, and which conditions does it include?
    back: Obstructed airflow (↓↓ FEV1, normal/↓ FVC, ↓ FEV1/FVC) → air trapping (↑ RV, FRC, TLC) from premature airway closure at high lung volumes. Includes COPD (chronic bronchitis, emphysema), asthma and bronchiectasis.
    src: { page: 692, quote: "due to premature airway closure at high lung volumes. Includes COPD (chronic bronchitis and emphysema), asthma, and bronchiectasis." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.031
    kind: mcq
    topic: obstructive-lung-diseases
    stem: >-
      A 60-year-old woman with dyspnea has an FEV1/FVC of 55% and a raised residual volume on body plethysmography. What
      is the mechanism of the raised RV?
    options:
      - Weak respiratory muscles
      - Premature airway closure at high lung volumes
      - Stiff lung parenchyma
      - Loss of surfactant
      - Chest wall deformity
    answer: 1
    why:
      - "Muscle weakness causes extrapulmonary restriction with ↓ volumes."
      - "Right. In obstructive disease, airways close early at high lung volumes, trapping air (↑ RV, FRC, TLC)."
      - "Stiff lungs (fibrosis) are restrictive with ↓ volumes."
      - "Surfactant loss causes alveolar collapse, not air trapping."
      - "Chest wall disease is restrictive."
    src: { page: 692, quote: "due to premature airway closure at high lung volumes." }
    status: unverified
  # ---------- p692-693: COPD ----------
  - id: resp.L04.032
    kind: card
    topic: chronic-obstructive-pulmonary-disease
    front: What is the most important risk factor for COPD, and what is an exacerbation?
    back: Tobacco use (also pollutants, allergens). An exacerbation is an acute worsening of symptoms, often with a viral or bacterial upper respiratory infection.
    src: { page: 692, quote: "Often due to tobacco use (most important risk factor), pollutants, or allergens." }
    status: unverified
  - id: resp.L04.033
    kind: cloze
    topic: chronic-obstructive-pulmonary-disease
    text: "Chronic bronchitis is a clinical diagnosis: productive cough for ≥{{c1::3 months}} in ≥{{c2::2 consecutive years}}. Mechanism: hypertrophy and hyperplasia of {{c3::mucus-secreting glands}} in bronchi."
    src: { page: 692, quote: "Criteria: productive cough for ≥3 months in ≥2 consecutive years." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.034
    kind: card
    topic: chronic-obstructive-pulmonary-disease
    front: What is the Reid index, and what value marks chronic bronchitis?
    back: Thickness of the mucosal gland layer relative to the wall between epithelium and cartilage; ↑ to > 50% in chronic bronchitis.
    src: { page: 692, quote: "Reid index (thickness of mucosal gland layer relative to thickness of wall between epithelium and cartilage) >50%." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.035
    kind: card
    topic: chronic-obstructive-pulmonary-disease
    front: What other findings can occur in chronic bronchitis?
    back: Dyspnea, wheezes, crackles (mucus), cyanosis (hypoxemia from shunting), 2° polycythemia; metaplasia of pseudostratified ciliated columnar epithelium into stratified squamous epithelium.
    src: { page: 692, quote: "May also have dyspnea, wheezes, crackles (due to mucus), cyanosis (hypoxemia due to shunting), 2° polycythemia." }
    status: unverified
  - id: resp.L04.036
    kind: card
    topic: chronic-obstructive-pulmonary-disease
