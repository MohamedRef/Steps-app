    pass: 3
    src: { page: 690, quote: "Paranasal sinus infections may extend to the orbits, cavernous sinus, and brain, causing complications (eg, orbital cellulitis, cavernous sinus syndrome, meningitis)." }
    status: unverified
    tags: [high-yield]
