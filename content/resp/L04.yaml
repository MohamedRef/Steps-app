  # ---------- p691: mediastinitis ----------
  - id: resp.L04.023
    kind: card
    topic: mediastinitis
    front: What are the common causes of acute mediastinitis, and what causes chronic (fibrosing) mediastinitis?
    back: Acute is usually a complication of cardiothoracic surgery (≤14 days), esophageal perforation (eg, repetitive vomiting) or spread of odontogenic/retropharyngeal infection. Chronic fibrosing mediastinitis is commonly caused by Histoplasma capsulatum.
    src: { page: 691, quote: "Chronic mediastinitis—also called fibrosing mediastinitis; due to ↑ proliferation of connective tissue in mediastinum. Histoplasma capsulatum is common cause." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.024
    kind: mcq
    topic: mediastinitis
    stem: >-
      Nine days after coronary bypass surgery, a 63-year-old man has fever, tachycardia, chest pain and purulent
      drainage from his sternal wound. WBC is 18,000/mm3. What is the most likely diagnosis?
    options:
      - Pneumomediastinum from a ruptured bleb
      - Acute mediastinitis
      - Fibrosing mediastinitis from Histoplasma
      - Pulmonary embolus
      - Hiatal hernia
    answer: 1
    why:
      - "Pneumomediastinum gives subcutaneous emphysema and a Hamman sign, not purulent drainage."
      - "Right. Mediastinitis is commonly a complication of cardiothoracic surgery (≤14 days), with fever, tachycardia, leukocytosis, chest pain and sternal wound drainage."
      - "Fibrosing mediastinitis is chronic, not a postoperative infection."
      - "PE does not cause sternal wound drainage."
      - "Hiatal hernia is a middle mediastinal mass, not an infection."
    src: { page: 691, quote: "Clinical features: fever, tachycardia, leukocytosis, chest pain, and sternal wound drainage." }
    status: unverified
  # ---------- p691: pneumomediastinum ----------
  - id: resp.L04.025
    kind: card
    topic: pneumomediastinum
    front: What causes pneumomediastinum, and what is the Hamman sign?
    back: Spontaneous (ruptured pulmonary bleb) or secondary (trauma, iatrogenic, Boerhaave syndrome); air tracks along peribronchial and perivascular sheaths. Hamman sign is crepitus on cardiac auscultation.
    src: { page: 691, quote: "Clinical features: chest pain, dyspnea, voice change, subcutaneous emphysema, ⊕ Hamman sign (crepitus on cardiac auscultation)." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.026
    kind: mcq
    topic: pneumomediastinum
    stem: >-
      A 30-year-old man has severe chest pain after repeated forceful vomiting during a night of binge drinking. Crepitus
      is felt in his neck, and a crunching sound is heard with each heartbeat. What is the most likely finding on chest
      imaging?
    options:
      - Air in the mediastinum
      - Saddle pulmonary embolus
      - Bilateral hilar lymphadenopathy
      - Anterior mediastinal mass
      - Eggshell calcification of hilar nodes
    answer: 0
    why:
      - "Right. Boerhaave syndrome (esophageal rupture) causes pneumomediastinum with subcutaneous emphysema and a ⊕ Hamman sign."
      - "PE does not cause crepitus."
      - "Hilar adenopathy suggests sarcoidosis."
      - "A mass does not explain acute air in the tissues."
      - "Eggshell calcification is silicosis."
    src: { page: 691, quote: "Can either be spontaneous (due to rupture of pulmonary bleb) or 2° (eg, trauma, iatrogenic, Boerhaave syndrome)." }
    status: unverified
    tags: [high-yield]
