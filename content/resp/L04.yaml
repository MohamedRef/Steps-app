  - id: resp.L04.017
    kind: table
    topic: pulmonary-emboli
    title: Emboli and their associations
    columns: [Embolus, Associations]
    rows:
      - [Fat, "Long bone fractures, liposuction; triad of hypoxemia, neurologic abnormalities, petechial rash"]
      - [Air, "Ascending divers (decompression sickness; hyperbaric O2), or iatrogenic (eg, central line)"]
      - [Thrombus, "Recent surgery/immobilization, hypercoagulable states"]
