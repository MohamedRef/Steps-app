    stem: >-
      A 4-year-old girl has progressive hoarseness for 6 months. Laryngoscopy shows multiple wart-like growths on the
      true vocal cords. Her mother had genital warts during pregnancy. Which agent is most likely responsible?
    options:
      - HPV-16
