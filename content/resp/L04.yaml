  # ---------- p690: rhinosinusitis ----------
  - id: resp.L04.001
    kind: card
    topic: rhinosinusitis
    front: Why is the maxillary sinus most often affected in rhinosinusitis?
    back: Its ostia are located superomedially, so it drains against gravity; obstructed drainage → inflammation and pain.
    src: { page: 690, quote: "Typically affects maxillary sinuses, which drain against gravity due to ostia located superomedially" }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.002
    kind: table
    topic: rhinosinusitis
    title: What drains into each nasal meatus
    columns: [Meatus, Drains]
    rows:
      - [Superior, Posterior ethmoid and sphenoid]
      - [Middle, "Frontal, maxillary and anterior ethmoid"]
      - [Inferior, Nasolacrimal duct]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 690, quote: "Superior meatus—drains posterior ethmoid and sphenoid; middle meatus—drains frontal, maxillary, and anterior ethmoid; inferior meatus—drains nasolacrimal duct." }
    status: unverified
  - id: resp.L04.003
    kind: card
    topic: rhinosinusitis
    front: What causes acute rhinosinusitis, and which bacteria superinfect?
    back: Most commonly viruses (eg, rhinovirus); superimposed bacterial infection is most often nontypeable H influenzae, S pneumoniae, M catarrhalis.
    src: { page: 690, quote: "may lead to superimposed bacterial infection, most commonly nontypeable H influenzae, S pneumoniae, M catarrhalis." }
    status: unverified
    tags: [high-yield]
  - id: resp.L04.004
    kind: mcq
    topic: rhinosinusitis
    stem: >-
      A 35-year-old man has had nasal congestion and frontal headache for 10 days after a cold. He now has a swollen,
      red, painful left eyelid with pain on eye movement. Which complication has occurred?
    options:
      - Orbital cellulitis from sinus spread
      - Nasopharyngeal carcinoma
      - Posterior epistaxis
      - Laryngeal papillomatosis
      - Nasal angiofibroma
    answer: 0
    why:
      - "Right. Paranasal sinus infection can extend to the orbit (orbital cellulitis), cavernous sinus or brain (meningitis)."
      - "Nasopharyngeal carcinoma presents with unilateral obstruction, discharge and epistaxis, not acute eye infection."
      - "Epistaxis is bleeding, not orbital swelling."
      - "Papillomatosis affects the vocal cords."
      - "Angiofibromas cause epistaxis in adolescent males."
    src: { page: 690, quote: "Paranasal sinus infections may extend to the orbits, cavernous sinus, and brain, causing complications (eg, orbital cellulitis, cavernous sinus syndrome, meningitis)." }
    status: unverified
  - id: resp.L04.157
    kind: enumerate
