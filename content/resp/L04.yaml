  - id: resp.L04.023
    kind: card
    topic: mediastinitis
    front: What is a common cause of chronic (fibrosing) mediastinitis?
    back: Histoplasma capsulatum (↑ proliferation of connective tissue in the mediastinum).
    src: { page: 691, quote: "Chronic mediastinitis—also called fibrosing mediastinitis; due to ↑ proliferation of connective tissue in mediastinum. Histoplasma capsulatum is common cause." }
