  # ---------- p155: other protozoa ----------
  - id: mic.L04.029
    kind: card
    topic: protozoa-others
    front: What does Chagas disease cause in its chronic and acute stages?
    back: Trypanosoma cruzi, mostly in South America. Chronic - dilated cardiomyopathy with apical atrophy, megacolon, megaesophagus ("T cruzi causes big problems"). Acute - unilateral periorbital swelling (Romaña sign).
    src: { page: 155, quote: "Chagas disease—dilated cardiomyopathy with apical atrophy, megacolon, megaesophagus; (T cruzi causes big problems); predominantly in South America Unilateral periorbital swelling (Romaña sign) characteristic of acute stage" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.030
    kind: card
    topic: protozoa-others
    front: How is Trypanosoma cruzi transmitted, and how is it treated?
    back: The triatomine insect (kissing bug) bites and defecates around the mouth or eyes, so feces enter the bite site or mucosa. Benznidazole or nifurtimox.
    src: { page: 155, quote: "Triatomine insect (kissing bug) bites and defecates around the mouth or eyes →  fecal transmission into bite site or mucosa Trypomastigote in blood smear A Benznidazole or nifurtimox" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.031
    kind: card
    topic: protozoa-others
    front: What are the two forms of leishmaniasis, the vector, the diagnosis and the treatment?
    back: Visceral (kala-azar) - spiking fevers, hepatosplenomegaly, pancytopenia. Cutaneous - skin ulcers. Sandfly. Macrophages containing amastigotes. Amphotericin B, sodium stibogluconate.
    src: { page: 155, quote: "Visceral leishmaniasis (kala-azar)—spiking fevers, hepatosplenomegaly, pancytopenia Cutaneous leishmaniasis—skin ulcers B Sandfly Macrophages containing amastigotes C Amphotericin B, sodium stibogluconate" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.032
    kind: card
    topic: protozoa-others
    front: What are the features and treatment of Trichomonas vaginalis vaginitis?
    back: Foul-smelling, greenish discharge with itching and burning. Motile trophozoites on wet mount; punctate cervical hemorrhages ("strawberry cervix"). Metronidazole for patient and partner(s); check for STI.
    src: { page: 155, quote: "Vaginitis—foul-smelling, greenish discharge; itching and burning" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.033
    kind: card
    topic: protozoa-others
    front: Why is Trichomonas transmitted only sexually, and what must it not be confused with?
    back: It cannot exist outside humans because it cannot form cysts. Do not confuse it with Gardnerella vaginalis, a gram-variable bacterium of bacterial vaginosis.
    src: { page: 155, quote: "do not confuse with Gardnerella vaginalis, a gram-variable bacterium associated with bacterial vaginosis Sexual (cannot exist outside human because it cannot form cysts)" }
