    src: { page: 154, quote: "Ring form D1, “Maltese cross” D2; PCR" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.027
    kind: mcq
    topic: protozoa-hematologic
    stem: >-
      A 26-year-old woman returns from 6 months in India with fevers every 48 hours. A blood smear shows
      trophozoites with small red granules in enlarged red blood cells. She is treated with chloroquine and
      improves. Three months later the fevers return. What explains the relapse?
    options:
      - Dormant hypnozoites in the liver
      - Antigenic variation of surface glycoproteins
      - Parasitized red cells sequestered in cerebral capillaries
      - Reinfection from an Ixodes tick
      - Chloroquine-resistant gametocytes in the spleen
    answer: 0
    why:
      - "Right. P vivax/ovale (48-hr tertian fever, Schüffner stippling) leave dormant hypnozoites in the liver; primaquine is added to target them."
      - "Antigenic variation explains the recurring fever of Trypanosoma brucei."
      - "Capillary occlusion is P falciparum, which has no hypnozoite."
      - "Ixodes spreads Babesia, not Plasmodium (Anopheles)."
      - "Relapse after vivax comes from the liver stage, not gametocytes in the spleen."
    src: { page: 154, quote: "48-hr fever cycle (tertian); dormant form (hypnozoite) in liver Trophozoites and Schüffner stippling (small red granules) within RBC cytoplasm A Add primaquine to target hypnozoites" }
    status: unverified
  - id: mic.L04.028
    kind: mcq
    topic: protozoa-hematologic
    stem: >-
      A 68-year-old man from Massachusetts who had a splenectomy after a car crash has 1 week of fever, dark
      urine and fatigue in July. He has low hemoglobin, high LDH and low haptoglobin. A blood smear shows
      intraerythrocytic rings and tetrads in a cross shape. What is the best treatment?
    options:
      - Atovaquone + azithromycin
      - Chloroquine
      - Doxycycline
      - Primaquine
      - Sulfadiazine + pyrimethamine
    answer: 0
    why:
      - "Right. Babesia (Ixodes tick, Maltese cross, worse with asplenia) is treated with atovaquone + azithromycin."
      - "Chloroquine treats sensitive malaria."
      - "Doxycycline treats Lyme disease and Anaplasma from the same tick, not Babesia."
      - "Primaquine targets vivax/ovale hypnozoites."
      - "Sulfadiazine + pyrimethamine treats toxoplasmosis."
    src: { page: 154, quote: "Ring form D1, “Maltese cross” D2; PCR Atovaquone + azithromycin" }
    status: unverified
  # ---------- p155: other protozoa ----------
  - id: mic.L04.029
    kind: card
    topic: protozoa-others
    front: What does chronic Chagas disease (Trypanosoma cruzi) cause?
