  # ---------- p152: GI protozoa ----------
  - id: mic.L04.001
    kind: card
    topic: protozoa-gi
    front: What diarrhea does Giardia lamblia cause, and in whom is it classically seen?
    back: Bloating, flatulence, foul-smelling, nonbloody, fatty diarrhea, often in campers/hikers (cysts in water). Think fat-rich Ghirardelli chocolates for the fatty stools of Giardia.
    src: { page: 152, quote: "Giardiasis—bloating, flatulence, foul-smelling, nonbloody, fatty diarrhea (often seen in campers/hikers)—think fat-rich Ghirardelli chocolates for fatty stools of Giardia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.002
    kind: cloze
    topic: protozoa-gi
    text: Giardia is diagnosed by {{c1::multinucleated trophozoites}} or cysts in stool, antigen detection or PCR, and treated with {{c2::tinidazole, nitazoxanide, or metronidazole}}.
    src: { page: 152, quote: "Multinucleated trophozoites A or cysts B in stool, antigen detection, PCR Tinidazole, nitazoxanide, or metronidazole" }
    status: unverified
  - id: mic.L04.003
    kind: card
    topic: protozoa-gi
    front: What disease does Entamoeba histolytica cause?
    back: Amebiasis. Bloody diarrhea (dysentery), liver abscess ("anchovy paste" exudate), RUQ pain; colon biopsy shows flask-shaped ulcers.
    src: { page: 152, quote: "Amebiasis—bloody diarrhea (dysentery), liver abscess (“anchovy paste” exudate), RUQ pain; histology of colon biopsy shows flask-shaped ulcers" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.004
    kind: cloze
    topic: protozoa-gi
    text: In stool, Entamoeba trophozoites contain {{c1::engulfed RBCs}} ("Entamoeba Eats Erythrocytes"), and cysts have up to {{c2::4}} nuclei.
    src: { page: 152, quote: "trophozoites (with engulfed RBCs D in the cytoplasm) or cysts with up to 4 nuclei in stool E ; Entamoeba Eats Erythrocytes" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.005
    kind: card
    topic: protozoa-gi
    front: How is amebiasis treated, including asymptomatic cyst passers?
    back: Metronidazole; paromomycin for asymptomatic cyst passers.
    src: { page: 152, quote: "Metronidazole; paromomycin for asymptomatic cyst passers" }
    status: unverified
  - id: mic.L04.006
    kind: card
    topic: protozoa-gi
    front: What does Cryptosporidium cause, how is it diagnosed, and how is it managed?
    back: Severe diarrhea in AIDS; mild watery diarrhea in immunocompetent hosts. Oocysts in water; oocysts on acid-fast stain, antigen detection, PCR. Prevention (eg, filtering); nitazoxanide for severe disease and/or immunocompromised.
    src: { page: 152, quote: "Cryptosporidium Severe diarrhea in AIDS Mild disease (watery diarrhea) in immunocompetent hosts Oocysts in water Oocysts on acid-fast stain" }
    status: unverified
    tags: [high-yield]
