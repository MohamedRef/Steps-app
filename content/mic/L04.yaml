    kind: table
    topic: protozoa-hematologic
    title: Plasmodium species
    columns: [Species, Fever pattern and disease, Smear]
    rows:
      - [P malariae, 72-hr fever cycle (quartan), Trophozoite ring within RBC]
      - [P vivax/ovale, "48-hr fever cycle (tertian); dormant hypnozoite in liver", "Trophozoites and Schüffner stippling (small red granules)"]
      - [P falciparum, "Severe, irregular fever; RBCs occlude capillaries in brain, kidneys, lungs", "Headphone-shaped trophozoite ring; crescent-shaped gametocytes"]
    blanks: [[0, 1], [1, 1], [2, 1], [1, 2], [2, 2]]
    src: { page: 154, quote: "P malariae 72-hr fever cycle (quartan) Trophozoite ring within RBC P vivax/ovale 48-hr fever cycle (tertian); dormant form (hypnozoite) in liver" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.022
    kind: card
    topic: protozoa-hematologic
    front: Why is primaquine added for P vivax and P ovale malaria?
    back: To target the dormant hypnozoites (dormant liver form) that cause relapse.
    src: { page: 154, quote: "Add primaquine to target hypnozoites" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.023
    kind: card
    topic: protozoa-hematologic
    front: Why is P falciparum malaria the most dangerous?
    back: Its fever is severe and follows no regular cycle, and infected RBCs can plug capillaries in the brain (cerebral malaria), kidneys and lungs.
    src: { page: 154, quote: "P falciparum Severe, irregular fever pattern; parasitized RBCs may occlude capillaries in brain (cerebral malaria), kidneys, lungs" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.024
    kind: table
    topic: protozoa-hematologic
    title: Treatment of malaria
    columns: [Situation, Treatment]
    rows:
      - [Chloroquine sensitive, Chloroquine]
      - [Chloroquine resistant, "Mefloquine, doxycycline or atovaquone/proguanil"]
      - [Life threatening, "IV quinine or artesunate (test for G6PD deficiency)"]
      - [P vivax/ovale, Add primaquine to target hypnozoites]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 154, quote: "If sensitive, chloroquine; if resistant, mefloquine, doxycycline or atovaquone/proguanil If life threatening, use intravenous quinine or artesunate (test for G6PD deficiency)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.075
    kind: card
    topic: protozoa-hematologic
    front: In life-threatening malaria, which drugs does First Aid give, and what test goes with them?
    back: Intravenous quinine or artesunate; test for G6PD deficiency.
    src: { page: 154, quote: "use intravenous quinine or artesunate (test for G6PD deficiency)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.025
    kind: card
    topic: protozoa-hematologic
    front: What are the features of babesiosis, and why does asplenia raise the risk?
    back: Fever and hemolytic anemia, mostly in the northeastern and north central United States. Asplenia raises the risk of severe disease because infected RBCs cannot be cleared.
    src: { page: 154, quote: "Babesiosis—fever and hemolytic anemia; predominantly in northeastern and north central United States; asplenia ↑ risk of severe disease due to inability to clear infected RBCs" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.026
    kind: cloze
    topic: protozoa-hematologic
    text: Babesia is spread by the {{c1::Ixodes}} tick (also the vector of Borrelia burgdorferi and Anaplasma), shows a ring form or {{c2::"Maltese cross"}} on smear, and is treated with {{c3::atovaquone + azithromycin}}.
    src: { page: 154, quote: "Ixodes tick (also vector for Borrelia burgdorferi and Anaplasma spp) Ring form D1, “Maltese cross” D2; PCR Atovaquone + azithromycin" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.097
    kind: cloze
    topic: protozoa-hematologic
