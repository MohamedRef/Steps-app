items:
  # ---------- p152: GI protozoa ----------
  - id: mic.L04.001
    kind: card
    topic: protozoa-gi
    front: What diarrhea does Giardia lamblia cause, and in whom is it classically seen?
    back: Greasy, bad-smelling stools without blood, with bloating and gas; classically in campers and hikers who drink water carrying the cysts. The book's hook - fat-rich Ghirardelli chocolates for the fatty Giardia stools.
    src: { page: 152, quote: "Giardiasis—bloating, flatulence, foul-smelling, nonbloody, fatty diarrhea (often seen in campers/hikers)—think fat-rich Ghirardelli chocolates for fatty stools of Giardia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.002
    kind: cloze
    topic: protozoa-gi
    text: Giardia is diagnosed by {{c1::multinucleated trophozoites}} or cysts in stool, antigen detection or PCR, and treated with {{c2::tinidazole, nitazoxanide, or metronidazole}}.
    src: { page: 152, quote: "Multinucleated trophozoites A or cysts B in stool, antigen detection, PCR Tinidazole, nitazoxanide, or metronidazole" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.003
    kind: card
    topic: protozoa-gi
    front: What disease does Entamoeba histolytica cause?
    back: Amebiasis - dysentery (bloody diarrhea) with RUQ pain and a liver abscess whose pus looks like anchovy paste; a colon biopsy shows flask-shaped ulcers.
    src: { page: 152, quote: "Amebiasis—bloody diarrhea (dysentery), liver abscess (“anchovy paste” exudate), RUQ pain; histology of colon biopsy shows flask-shaped ulcers" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.096
    kind: cloze
    topic: protozoa-gi
    text: Entamoeba histolytica is transmitted by {{c1::cysts in water}}.
    src: { page: 152, quote: "histology of colon biopsy shows flask-shaped ulcers C Cysts in water" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.004
    kind: cloze
    topic: protozoa-gi
    text: In stool, Entamoeba trophozoites contain {{c1::engulfed RBCs}} ("Entamoeba Eats Erythrocytes"), and cysts have up to {{c2::4}} nuclei.
    src: { page: 152, quote: "trophozoites (with engulfed RBCs D in the cytoplasm) or cysts with up to 4 nuclei in stool E ; Entamoeba Eats Erythrocytes" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.005
    kind: card
    topic: protozoa-gi
    front: How is amebiasis treated, including asymptomatic cyst passers?
    back: Metronidazole for the disease; paromomycin for a person who sheds cysts without symptoms.
    src: { page: 152, quote: "Metronidazole; paromomycin for asymptomatic cyst passers" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.006
    kind: card
    topic: protozoa-gi
    front: What diarrhea does Cryptosporidium cause in AIDS versus in immunocompetent hosts?
    back: Severe diarrhea in AIDS; mild watery diarrhea in immunocompetent hosts.
    src: { page: 152, quote: "Cryptosporidium Severe diarrhea in AIDS Mild disease (watery diarrhea) in immunocompetent hosts" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.076
    kind: cloze
    topic: protozoa-gi
    text: Cryptosporidium spreads by {{c1::oocysts in water}}, shows oocysts on {{c2::acid-fast}} stain (or antigen detection, PCR), and is managed by prevention (eg, filtering) with {{c3::nitazoxanide}} for severe disease and/or immunocompromised patients.
    src: { page: 152, quote: "Oocysts in water Oocysts on acid-fast stain" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.007
    kind: table
    topic: protozoa-gi
    title: Protozoa—gastrointestinal infections
    columns: [Organism, Disease, Transmission, Diagnosis, Treatment]
    rows:
      - [Giardia lamblia, "Fatty, foul-smelling, nonbloody diarrhea (campers)", Cysts in water, "Multinucleated trophozoites or cysts in stool, antigen, PCR", "Tinidazole, nitazoxanide, or metronidazole"]
      - [Entamoeba histolytica, "Dysentery, liver abscess (anchovy paste), flask-shaped ulcers", Cysts in water, "Trophozoites with engulfed RBCs, cysts with up to 4 nuclei; serology, antigen, PCR", "Metronidazole; paromomycin for cyst passers"]
      - [Cryptosporidium, "Severe diarrhea in AIDS; mild watery diarrhea otherwise", Oocysts in water, "Oocysts on acid-fast stain, antigen, PCR", "Prevention (filtering); nitazoxanide"]
    blanks: [[0, 1], [1, 1], [2, 1], [1, 2], [0, 4], [1, 4], [2, 3]]
    src: { page: 152, quote: "ORGANISM DISEASE TRANSMISSION DIAGNOSIS TREATMENT Giardia lamblia Giardiasis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.008
    kind: mcq
    topic: protozoa-gi
    stem: >-
      A 38-year-old woman in Cairo is screened because her husband was just treated for a liver abscess
      that drained thick brown "anchovy paste" fluid after weeks of bloody diarrhea. She feels well, with
      no diarrhea, fever or abdominal pain, and her examination is normal. Her stool shows cysts with
      4 nuclei, and stool antigen testing confirms the same species as her husband's. Which drug is most
      appropriate for her?
    options:
      - Paromomycin
      - Metronidazole
      - Praziquantel
      - Albendazole
      - Nitazoxanide
    answer: 0
    why:
      - "Right. She is an asymptomatic Entamoeba histolytica cyst passer, and First Aid treats asymptomatic cyst passers with paromomycin."
      - "Metronidazole is First Aid's treatment for amebiasis itself (dysentery, liver abscess); for a symptom-free cyst passer the book names paromomycin."
      - "Praziquantel treats flukes and most tapeworms, not protozoa."
      - "Albendazole is for nematodes, neurocysticercosis and hydatid cysts."
      - "Nitazoxanide is for Cryptosporidium and an option for Giardia, not for amebic cyst passers."
    src: { page: 152, quote: "Metronidazole; paromomycin for asymptomatic cyst passers" }
    status: unverified
  - id: mic.L04.009
    kind: mcq
    topic: protozoa-gi
    stem: >-
      A 29-year-old man with HIV and a CD4+ count of 60 cells/mm3 has profuse watery diarrhea for 3 weeks.
      Routine stool culture is negative. Which finding on stool examination is most likely?
    options:
      - Oocysts on acid-fast stain
      - Trophozoites with engulfed red blood cells
      - Multinucleated trophozoites
      - Rhabditiform larvae
      - Knobby-coated oval eggs
    answer: 0
    why:
      - "Right. Cryptosporidium causes severe diarrhea in AIDS; oocysts are seen on acid-fast stain."
      - "Engulfed RBCs mark Entamoeba, which gives bloody diarrhea."
      - "Giardia gives fatty, foul-smelling diarrhea, typically in campers."
      - "Rhabditiform larvae in stool point to Strongyloides."
      - "Knobby-coated eggs are Ascaris."
    src: { page: 152, quote: "Oocysts on acid-fast stain F , antigen detection, PCR" }
    status: unverified
  # ---------- p153: CNS protozoa ----------
  - id: mic.L04.010
    kind: card
    topic: protozoa-cns
    front: How does Toxoplasma gondii present in an immunocompetent host versus reactivation in AIDS?
    back: Immunocompetent - mononucleosis-like symptoms with a negative heterophile antibody test. Reactivation in AIDS - brain abscesses, usually multiple ring-enhancing lesions on MRI.
    src: { page: 153, quote: "Immunocompetent: mononucleosis-like symptoms, ⊝ heterophile antibody test Reactivation in AIDS →  brain abscesses usually seen as multiple ring-enhancing lesions on MRI" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.011
    kind: enumerate
    topic: protozoa-cns
    prompt: Enumerate the classic triad of congenital toxoplasmosis (3).
    points:
      - Chorioretinitis
      - Hydrocephalus
      - Intracranial calcifications
    pass: 3
    src: { page: 153, quote: "Congenital toxoplasmosis: classic triad of chorioretinitis, hydrocephalus, and intracranial calcifications" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.012
    kind: card
    topic: protozoa-cns
    front: How is Toxoplasma transmitted?
    back: Mostly by eating cysts in meat; also oocysts from cat feces, and across the placenta, so pregnant patients should keep away from cats.
    src: { page: 153, quote: "Cysts in meat (most common); oocysts in cat feces; crosses placenta (pregnant patients should avoid cats)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.013
    kind: cloze
    topic: protozoa-cns
    text: Toxoplasmosis is treated with {{c1::sulfadiazine + pyrimethamine}}; prophylaxis with {{c2::TMP-SMX}} starts when the CD4+ count is {{c3::<100 cells/mm3}}.
    src: { page: 153, quote: "Sulfadiazine + pyrimethamine Prophylaxis with TMP-SMX when CD4+ cell count <100 cells/mm3" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.014
    kind: card
    topic: protozoa-cns
    front: How is toxoplasmosis diagnosed, including possible intrauterine disease?
    back: Serology or a biopsy showing tachyzoites; if infection of the fetus is suspected, PCR on amniotic fluid.
    src: { page: 153, quote: "Serology, biopsy (tachyzoite) B ; PCR of amniotic fluid for possible intrauterine disease" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.015
    kind: card
    topic: protozoa-cns
    front: What does Naegleria fowleri cause, and how does it reach the CNS?
    back: Rapidly fatal meningoencephalitis after swimming in warm freshwater; it enters the CNS through the olfactory nerve via the cribriform plate.
    src: { page: 153, quote: "Naegleria fowleri Rapidly fatal meningoencephalitis Swimming in warm freshwater; enters CNS through olfactory nerve via cribriform plate" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.077
    kind: cloze
    topic: protozoa-cns
    text: Naegleria fowleri is diagnosed by {{c1::amoebas in CSF}}; {{c2::amphotericin B}} has been effective for a few survivors.
    src: { page: 153, quote: "Amoebas in CSF" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.016
    kind: card
    topic: protozoa-cns
    front: What are the features of African sleeping sickness, and why does the fever recur?
    back: Trypanosoma brucei. Enlarged lymph nodes, recurring fever (due to antigenic variation), somnolence, coma.
    src: { page: 153, quote: "African sleeping sickness— enlarged lymph nodes, recurring fever (due to antigenic variation), somnolence, coma" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.078
    kind: cloze
    topic: protozoa-cns
    text: Trypanosoma brucei is spread by the painful bite of the {{c1::tsetse fly}} and diagnosed by a {{c2::trypomastigote}} in a blood smear.
    src: { page: 153, quote: "Tsetse fly, a painful bite Trypomastigote in blood smear" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.017
    kind: cloze
    topic: protozoa-cns
    text: Trypanosoma brucei is treated with {{c1::suramin}} for blood-borne disease or {{c2::melarsoprol}} for CNS penetration ("I sure am mellow when I'm sleeping").
    src: { page: 153, quote: "Suramin for blood- borne disease or melarsoprol for CNS penetration (“I sure am mellow when I’m sleeping”)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.018
    kind: mcq
    topic: protozoa-cns
    stem: >-
      A 36-year-old man with HIV who stopped his antiretrovirals has headache, confusion and a left-sided
      weakness. His CD4+ count is 45 cells/mm3. MRI shows multiple ring-enhancing lesions at the gray-white
      junction and basal ganglia. Which exposure most likely led to his original infection?
    options:
      - Eating undercooked meat containing cysts
      - Swimming in warm freshwater
      - Inhaling pigeon droppings
      - The bite of a tsetse fly
      - Ingesting eggs in food contaminated with dog feces
    answer: 0
    why:
      - "Right. Toxoplasma reactivation in AIDS gives multiple ring-enhancing lesions; cysts in meat are the most common source (oocysts in cat feces too)."
      - "Warm freshwater is Naegleria, a rapidly fatal meningoencephalitis."
      - "Pigeon droppings are Cryptococcus, with soap bubble lesions and meningitis."
      - "The tsetse fly carries Trypanosoma brucei (sleeping sickness)."
      - "Dog feces carry Echinococcus eggs (hydatid cysts)."
    src: { page: 153, quote: "Cysts in meat (most common); oocysts in cat feces" }
    status: unverified
  - id: mic.L04.019
    kind: mcq
    topic: protozoa-cns
    stem: >-
      A 12-year-old boy develops severe headache, fever, vomiting and altered smell 5 days after swimming in a
      warm lake in late summer. He rapidly becomes comatose. CSF shows motile amoebas. How did the organism
      reach his brain?
    options:
      - Along the olfactory nerve through the cribriform plate
      - Hematogenous spread from a lung focus
      - Retrograde axonal transport from a skin bite
      - Direct extension from a middle ear infection
      - Crossing the blood-brain barrier inside infected macrophages
    answer: 0
    why:
      - "Right. Naegleria fowleri enters the CNS through the olfactory nerve via the cribriform plate."
      - "Hematogenous spread from the lung fits Cryptococcus or the systemic mycoses."
      - "Retrograde axonal transport from a bite is rabies."
      - "Spread from the middle ear is a bacterial complication, not amoebic."
      - "Spread inside macrophages is not how Naegleria reaches the brain."
    src: { page: 153, quote: "enters CNS through olfactory nerve via cribriform plate" }
    status: unverified
  # ---------- p154: hematologic protozoa ----------
  - id: mic.L04.020
    kind: card
    topic: protozoa-hematologic
    front: What are the clinical features of malaria?
    back: Fevers that come in cycles, headache, anemia and an enlarged spleen; severe disease can also cause hypoglycemia.
    src: { page: 154, quote: "Malaria—cyclic fevers, headache, anemia, splenomegaly; hypoglycemia in severe disease Anopheles mosquito Peripheral blood smear (also allows for identification of species)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.099
    kind: cloze
    topic: protozoa-hematologic
    text: Malaria is transmitted by the {{c1::Anopheles}} mosquito.
    src: { page: 154, quote: "hypoglycemia in severe disease Anopheles mosquito" }
    status: unverified
    tags: [high-yield]
  - id: mic.L04.100
    kind: cloze
    topic: protozoa-hematologic
    text: Malaria is diagnosed on a {{c1::peripheral blood smear}}, which also identifies the {{c2::species}}.
    src: { page: 154, quote: "Peripheral blood smear (also allows for identification of species)" }
    status: unverified
