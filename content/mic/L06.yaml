  - id: mic.L06.019
    kind: mcq
    topic: pneumonia
    stem: >-
      A 52-year-old man with long-standing alcohol use disorder is found after a binge with fever and cough
      productive of thick, bloody "currant jelly" sputum. Chest x-ray shows a right upper lobe consolidation with
      a bulging fissure. Sputum Gram stain shows plump gram-negative rods. Sputum culture on agar will most likely
      show which feature?
    options:
      - Large mucoid capsule with viscous colonies
      - Red-pigmented colonies
      - Swarming growth across the plate
      - Blue-green pigment with a fruity odor
      - Strong pink lactose fermentation with flat dry colonies
    answer: 0
    why:
      - "Right. In alcohol overuse, think Klebsiella (and aspiration anaerobes); Klebsiella has a large mucoid capsule and viscous colonies."
      - "A red pigment is Serratia marcescens, a healthcare-associated UTI cause."
      - "Swarming is Proteus mirabilis, linked to struvite stones."
      - "Blue-green pigment and fruity odor are Pseudomonas, healthcare-associated."
      - "Strong pink lactose fermentation without a mucoid capsule describes E coli colonies, the leading UTI cause."
    src: { page: 178, quote: "Large mucoid capsule and viscous colonies." }
    status: unverified
