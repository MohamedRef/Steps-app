  - id: mic.L06.057
    kind: mcq
    topic: pid
    stem: >-
      A 23-year-old woman has fever, lower abdominal pain and right upper quadrant pain that worsens with
      breathing. Pelvic exam shows purulent cervical discharge and cervical motion tenderness. Liver enzymes are
      normal. Laparoscopy would most likely show which finding over the liver?
    options:
      - Violin string adhesions between the liver capsule and peritoneum
      - A hydatid cyst with eggshell calcification
      - An amebic abscess with anchovy paste fluid
      - Multiple ring-enhancing lesions
      - Gallstones in the common bile duct
    answer: 0
    why:
      - "Right. PID can cause perihepatitis (Fitz-Hugh-Curtis): violin string adhesions of peritoneum to the liver."
      - "Hydatid cysts are Echinococcus."
      - "Anchovy paste fluid is an amebic liver abscess."
      - "Ring-enhancing lesions are brain findings."
      - "Gallstones do not fit cervical motion tenderness."
    src: { page: 181, quote: "Can lead to perihepatitis (Fitz-Hugh–Curtis syndrome)—infection and inflammation of liver capsule and “violin string” adhesions of peritoneum to liver" }
    status: unverified
  - id: mic.L06.058
    kind: mcq
    topic: healthcare-associated
    stem: >-
      A 67-year-old man on mechanical ventilation in the ICU for 8 days develops fever, a new infiltrate on chest
      x-ray, and more secretions with a sweet, grape-like odor. Gram stain of the tracheal aspirate shows
      gram-negative rods. On culture, the colonies will most likely show which feature?
    options:
      - Blue-green pigment
      - Red pigment
      - Swarming motility across the agar
      - Large mucoid capsule with viscous colonies
      - Strong pink lactose fermentation on MacConkey agar
    answer: 0
    why:
      - "Right. Late ventilator-associated pneumonia with a sweet odor is Pseudomonas, which makes a blue-green pigment with a fruity odor and is often drug resistant."
      - "A red pigment is Serratia marcescens."
      - "Swarming is Proteus mirabilis."
      - "A large mucoid capsule is Klebsiella, also a late ventilator pathogen but without the sweet odor."
      - "Strong pink lactose fermentation is E coli."
    src: { page: 178, quote: "Blue-green pigment and fruity odor" }
    status: unverified
