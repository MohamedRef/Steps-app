  - id: mic.L06.010
    kind: mcq
    topic: foodborne-illness
    stem: >-
      Three hours after a picnic, several guests develop intense vomiting and abdominal cramps, followed by
      nonbloody diarrhea. All ate potato salad with mayonnaise and custard pastries left in the sun. All recover
      within 24 hours. What explains the short incubation?
    options:
      - Ingestion of a preformed toxin
      - Invasion of the colonic mucosa
      - Germination of ingested spores in the gut
      - Antibody-dependent enhancement
      - Production of Shiga toxin in the colon
    answer: 0
    why:
      - "Right. S aureus in meats, mayonnaise and custard makes a preformed toxin; the illness starts quickly and ends quickly."
      - "Mucosal invasion (Shigella, EIEC) takes longer and gives bloody diarrhea."
      - "Spore germination in the gut is C perfringens or infant botulism, with a longer delay."
      - "Antibody-dependent enhancement is dengue."
      - "Shiga toxin gives bloody diarrhea after days."
    src: { page: 174, quote: "S aureus Meats, mayonnaise, custard; preformed toxin" }
    status: unverified
