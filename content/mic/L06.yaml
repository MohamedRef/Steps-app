    stem: >-
      An 8-year-old boy has right lower quadrant pain, fever and diarrhea. Several children at his day care have
      similar symptoms. At surgery for presumed appendicitis, the appendix is normal but the mesenteric nodes
      are enlarged. Which organism is the most likely cause?
    options:
      - Yersinia enterocolitica
      - Campylobacter jejuni
      - Shigella sonnei
      - Enterotoxigenic E coli
      - Vibrio cholerae
    answer: 0
    why:
      - "Right. Y enterocolitica causes day care outbreaks and pseudoappendicitis."
      - "Campylobacter is comma shaped, grows at 42°C, and is linked to poultry."
      - "Shigella gives bacillary dysentery with a very low ID50."
      - "ETEC gives watery travelers' diarrhea."
      - "V cholerae gives rice-water diarrhea."
    src: { page: 175, quote: "Y enterocolitica Day care outbreaks; pseudoappendicitis" }
    status: unverified
  - id: mic.L06.015
    kind: mcq
    topic: diarrhea
    stem: >-
      A 30-year-old woman develops bloody diarrhea 3 days after eating undercooked chicken at a barbecue. Two
      weeks later she has ascending weakness of both legs. Stool culture grew curved gram-negative rods at 42°C.
      Which organism caused the diarrhea?
    options:
      - Campylobacter jejuni
      - Salmonella enteritidis
      - Yersinia enterocolitica
      - Enteroinvasive E coli
      - Clostridioides difficile
    answer: 0
    why:
      - "Right. Campylobacter: comma or S shaped, grows at 42°C, from poultry; it is a classic trigger of Guillain-Barré syndrome."
      - "Salmonella is also from poultry and eggs but is not comma shaped and does not grow at 42°C as its clue."
      - "Yersinia causes pseudoappendicitis."
      - "EIEC invades colonic mucosa but is a straight rod."
      - "C difficile follows antibiotics and is usually watery."
    src: { page: 175, quote: "Comma- or S-shaped organisms; growth at 42°C" }
    status: unverified
