items:
  # ---------- p174: prions ----------
  - id: mic.L06.001
    kind: card
    topic: prions
    front: What is the molecular basis of prion disease?
    back: Normal, mostly α-helical prion protein (PrPc) converts to a β-pleated form (PrPsc), which resists protease degradation and converts more PrPc to PrPsc. Accumulation causes spongiform encephalopathy.
    src: { page: 174, quote: "PrPsc resists protease degradation and facilitates the conversion of still more PrPc to PrPsc." }
    status: unverified
    tags: [high-yield]
  - id: mic.L06.002
    kind: card
    topic: prions
    front: How are prions transmitted, and why are they a hazard for instruments?
    back: Via CNS-related tissue (iatrogenic CJD) or food contaminated by BSE-infected animal products (variant CJD). They resist standard sterilizing procedures, including standard autoclaving.
    src: { page: 174, quote: "which is transmissible via CNS-related tissue (iatrogenic CJD) or food contaminated by BSE-infected animal products (variant CJD)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L06.003
    kind: card
    topic: prions
    front: What are the clinical features of prion disease?
    back: Spongiform encephalopathy with dementia, ataxia, startle myoclonus, and death.
    src: { page: 174, quote: "spongiform encephalopathy and dementia, ataxia, startle myoclonus, and death." }
    status: unverified
    tags: [high-yield]
  - id: mic.L06.064
    kind: cloze
    topic: prions
    text: Creutzfeldt-Jakob disease is a {{c1::rapidly progressive dementia}}, typically {{c2::sporadic}} (some familial forms).
    src: { page: 174, quote: "rapidly progressive dementia, typically sporadic (some familial forms)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L06.065
    kind: cloze
    topic: prions
    text: Bovine spongiform encephalopathy is also called {{c1::"mad cow disease"}}.
    src: { page: 174, quote: "Bovine spongiform encephalopathy—also called “mad cow disease.”" }
    status: unverified
  - id: mic.L06.066
    kind: cloze
    topic: prions
    text: Kuru is an acquired prion disease seen in tribal populations practicing {{c1::human cannibalism}}.
    src: { page: 174, quote: "Kuru—acquired prion disease noted in tribal populations practicing human cannibalism." }
    status: unverified
  - id: mic.L06.004
    kind: mcq
    topic: prions
    stem: >-
      A 64-year-old woman has 4 months of rapidly worsening memory, unsteady gait, and sudden jerks of her limbs
      when startled. EEG shows periodic sharp wave complexes. She dies 2 months later, and brain autopsy shows
      small vacuoles throughout the cortex without inflammation. What is the mechanism of her disease?
    options:
      - Conversion of α-helical prion protein to a protease-resistant β-pleated form
      - Reactivation of JC virus in oligodendrocytes
      - Persistent measles virus infection
      - Accumulation of hyperphosphorylated tau in neurofibrillary tangles
      - Retrograde axonal spread of a bullet-shaped virus
    answer: 0
    why:
      - "Right. Creutzfeldt-Jakob disease: rapidly progressive dementia, startle myoclonus and spongiform change from PrPc to PrPsc conversion."
      - "JC virus causes PML in the immunocompromised."
      - "Persistent measles causes SSPE years after measles in childhood."
      - "Tau tangles are Alzheimer disease, which progresses slowly."
      - "Retrograde spread is rabies, with hydrophobia and Negri bodies."
    src: { page: 174, quote: "conversion of a normal (predominantly α-helical) protein termed prion protein (PrPc ) to a β-pleated form (PrPsc )" }
    status: unverified
