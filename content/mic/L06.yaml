  - id: mic.L06.014
    kind: mcq
    topic: diarrhea
    stem: >-
      An 8-year-old boy has 2 days of fever, diarrhea with flecks of blood, and right lower quadrant pain and
      tenderness. Several children at his day care had a similar diarrheal illness last week. Stool culture grows
      a gram-negative rod. He is taken to laparoscopy for presumed appendicitis. What will the surgeon most
      likely find?
    options:
      - A normal appendix with enlarged mesenteric lymph nodes
      - An inflamed appendix obstructed by a fecalith
      - Flask-shaped ulcers in the cecum
      - Yellow-white pseudomembranes on the colonic mucosa
      - Gas-filled necrosis of the bowel wall
    answer: 0
    why:
      - "Right. Y enterocolitica causes day care outbreaks and pseudoappendicitis: RLQ pain from mesenteric adenitis with a normal appendix."
      - "True appendicitis is not linked to day care diarrhea outbreaks; this is the picture Yersinia mimics."
      - "Flask-shaped ulcers are amebic dysentery (E histolytica), a protozoan, not a gram-negative rod."
      - "Pseudomembranes are C difficile after antibiotics or PPIs, a gram-positive organism."
      - "Gas gangrene is C perfringens, a gram-positive rod."
    src: { page: 175, quote: "Y enterocolitica Day care outbreaks; pseudoappendicitis" }
    status: unverified
  - id: mic.L06.015
    kind: mcq
    topic: diarrhea
    stem: >-
      A 30-year-old woman develops fever, cramps and bloody diarrhea 3 days after eating undercooked chicken at a
      barbecue. She recovers, but 2 weeks later she has symmetric weakness that began in her feet and is rising
      to her thighs, with absent ankle and knee reflexes. The microbiology laboratory recovers the diarrheal
      pathogen from her stored stool sample. Which description best fits the isolate?
    options:
      - Comma- or S-shaped rods that grow at 42°C
      - Lactose-nonfermenting rods with flagellar motility
      - Nonmotile lactose-nonfermenting rods with a very low ID50
      - Comma-shaped rods that grow best in alkaline media
      - Spore-forming gram-positive rods that make toxins A and B
    answer: 0
    why:
      - "Right. Campylobacter (poultry, bloody diarrhea) is comma or S shaped and grows at 42°C; it is a classic trigger of Guillain-Barré syndrome."
      - "Nontyphoidal Salmonella is lactose ⊝ with flagellar motility and also comes from poultry, but it is not the classic Guillain-Barré trigger."
      - "Shigella is lactose ⊝, has a very low ID50 and a human reservoir only."
      - "V cholerae is comma shaped but gives rice-water (watery) diarrhea from seafood."
      - "C difficile follows antibiotics or PPIs and gives mostly watery diarrhea."
    src: { page: 175, quote: "Comma- or S-shaped organisms; growth at 42°C" }
    status: unverified
