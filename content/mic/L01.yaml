  # ---------- p125: anaerobes ----------
  - id: mic.L01.029
    kind: card
    topic: anaerobes
    front: Why are anaerobes susceptible to oxygen, and what are typical examples?
    back: They lack catalase and/or superoxide dismutase, so they are susceptible to oxidative damage. Examples are Clostridioides, Clostridium, Bacteroides, Fusobacterium and Actinomyces israelii. ("Anaerobes Can't Breathe Fresh Air.")
    src: { page: 125, quote: "Examples include Clostridioides, Clostridium, Bacteroides, Fusobacterium, and Actinomyces israelii. They lack catalase and/or superoxide dismutase and are thus susceptible to oxidative damage." }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.030
    kind: card
    topic: anaerobes
    front: What gives anaerobic infections their foul smell?
    back: Short-chain fatty acids.
    src: { page: 125, quote: "Generally foul smelling (short- chain fatty acids), are difficult to culture, and produce gas in tissue" }
    status: unverified
  - id: mic.L01.031
    kind: card
    topic: anaerobes
    front: Why are aminoglycosides ineffective against anaerobes?
    back: Aminoglycosides require O2 to enter the bacterial cell ("AminO2glycosides").
    src: { page: 125, quote: "AminO2glycosides are ineffective against anaerobes because these antibiotics require O2 to enter into bacterial cell." }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.032
    kind: card
    topic: anaerobes
    front: What can facultative anaerobes do, and which bacteria are examples?
    back: They can make ATP with O2 as the final electron acceptor, yet switch to fermentation or other pathways that need no O2. Examples are streptococci, staphylococci and the gram ⊝ enterics.
    src: { page: 125, quote: "May use O2 as a terminal electron acceptor to generate ATP, but can also use fermentation and other O2-independent pathways. Streptococci, staphylococci, and enteric gram ⊝ bacteria." }
    status: unverified
  - id: mic.L01.033
    kind: mcq
    topic: anaerobes
    stem: >-
      A 58-year-old man with alcohol use disorder has 2 weeks of fever and cough productive of
      foul-smelling sputum. Chest x-ray shows a cavitary lesion with an air-fluid level in the
      posterior segment of the right upper lobe. Which antibiotic class would be ineffective against
      the most likely organisms, and why?
    options:
      - Aminoglycosides, because they need O2 to enter the bacterial cell
      - β-lactams, because anaerobes lack a cell wall
      - Metronidazole, because anaerobes lack catalase
      - Vancomycin, because most anaerobes are gram ⊝
      - Metronidazole, because anaerobes lack nitroreductase
    answer: 0
    why:
      - "Right. An aspiration lung abscess is anaerobic; aminoglycosides need O2 to enter the cell, so they don't work against anaerobes."
      - "Anaerobes have a cell wall; lacking a cell wall describes Mycoplasma."
      - "Anaerobes lacking catalase is why they are killed by O2; it does not stop metronidazole, which treats anaerobes below the diaphragm."
      - "Many anaerobes (eg, Clostridium, Actinomyces) are gram ⊕; Gram reaction is not why a class fails against anaerobes as a group."
      - "Anaerobes reduce metronidazole, which is why it works against them."
    src: { page: 125, quote: "AminO2glycosides are ineffective against anaerobes because these antibiotics require O2 to enter into bacterial cell." }
    status: unverified
