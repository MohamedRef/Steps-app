  # ---------- p122: bacterial structures ----------
  - id: mic.L01.001
    kind: table
    topic: bacterial-structures
    title: Bacterial structures
    columns: [Structure, Chemical composition, Function]
    rows:
      - [Flagellum, Proteins, Motility]
      - [Pilus/fimbria, Glycoprotein, "Adherence to cell surface; sex pilus forms during conjugation"]
      - [Spore, "Keratinlike coat, dipicolinic acid, peptidoglycan, DNA", "Survival: resists dehydration, heat, chemicals"]
      - [Capsule, "Discrete layer, usually polysaccharides (rarely proteins)", Protects against phagocytosis]
      - [Slime (S) layer, Loose network of polysaccharides, "Adherence to surfaces; biofilm formation (eg, indwelling catheters)"]
      - [Outer membrane (gram ⊝ only), "Outer leaflet: endotoxin (LPS/LOS); porins and other OMPs; inner leaflet: phospholipids", "Lipid A induces TNF and IL-1; porins transport across the outer membrane"]
      - [Periplasm, "Space between cytoplasmic and outer membrane in gram ⊝ (peptidoglycan in middle)", "Accumulates hydrolytic enzymes (eg, β-lactamases)"]
      - [Cell wall, Peptidoglycan cross-linked by transpeptidase, "Rigid support; protects against osmotic pressure"]
      - [Cytoplasmic membrane, "Phospholipid bilayer with embedded proteins (eg, PBPs)", "Oxidative and transport enzymes; PBPs in cell wall synthesis"]
    blanks: [[0, 2], [1, 2], [2, 1], [3, 2], [4, 2], [6, 2], [7, 1], [8, 2]]
    src: { page: 122, quote: "Flagellum Proteins Motility Pilus/fimbria Glycoprotein Mediate adherence of bacteria to cell surface; sex pilus forms during conjugation" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.002
    kind: card
    topic: bacterial-structures
    front: What is a bacterial spore made of, and what does it let the bacterium survive?
    back: A keratinlike coat, dipicolinic acid, peptidoglycan and DNA. It resists dehydration, heat and chemicals.
    src: { page: 122, quote: "Spore Keratinlike coat, dipicolinic acid, peptidoglycan, DNA Survival: resist dehydration, heat, chemicals" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.003
    kind: cloze
    topic: bacterial-structures
    text: The capsule is a discrete layer usually made of {{c1::polysaccharides}} and protects against {{c2::phagocytosis}}; the loose slime (S) layer mediates adherence and {{c3::biofilm}} formation, eg, on indwelling catheters.
    src: { page: 122, quote: "Capsule Discrete layer usually made of polysaccharides (and rarely proteins) Protects against phagocytosis Slime (S) layer Loose network of polysaccharides Mediates adherence to surfaces, plays a role in biofilm formation (eg, indwelling catheters)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.004
    kind: card
    topic: bacterial-structures
    front: Which part of endotoxin induces TNF and IL-1?
    back: Lipid A.
    src: { page: 122, quote: "Gram ⊝ only Endotoxin: lipid A induces TNF and IL-1; antigenic O polysaccharide component" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.005
    kind: card
    topic: bacterial-structures
    front: What is the periplasm, and which enzymes accumulate there?
    back: The space between the cytoplasmic membrane and the outer membrane in gram ⊝ bacteria (peptidoglycan in the middle). It accumulates hydrolytic enzymes exiting the cell, eg, β-lactamases.
    src: { page: 122, quote: "Periplasm Space between cytoplasmic membrane and outer membrane in gram ⊝ bacteria (peptidoglycan in middle) Accumulates components exiting gram ⊝ cells, including hydrolytic enzymes (eg, β-lactamases)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.006
    kind: cloze
    topic: bacterial-structures
    text: Peptidoglycan is a sugar backbone with peptide side chains cross-linked by {{c1::transpeptidase}}; this netlike structure protects against {{c2::osmotic pressure}} damage.
    src: { page: 122, quote: "Cell wall Peptidoglycan is a sugar backbone with peptide side chains cross-linked by transpeptidase Netlike structure gives rigid support, protects against osmotic pressure damage" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.007
    kind: card
    topic: bacterial-structures
    front: Which cell envelope component is unique to gram ⊕ bacteria, and what does it induce?
    back: Lipoteichoic acid, which extends from the cytoplasmic membrane to the exterior. It induces TNF-α and IL-1.
    src: { page: 122, quote: "Lipoteichoic acids (gram positive) only extend from membrane to exterior" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.008
    kind: card
    topic: bacterial-structures
    front: Where are penicillin-binding proteins (PBPs) located and what do they do?
    back: Embedded in the cytoplasmic membrane (phospholipid bilayer). They are involved in cell wall synthesis.
    src: { page: 122, quote: "Phospholipid bilayer sac with embedded proteins (eg, penicillin-binding proteins [PBPs]) and other enzymes" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.009
    kind: mcq
    topic: bacterial-structures
    stem: >-
      A 60-year-old man is admitted with fever, rigors and hypotension 2 days after a transrectal
      prostate biopsy. Blood cultures grow a lactose-fermenting gram-negative rod. He develops
      a high fever and falling blood pressure. Which bacterial component most directly triggers
      the release of TNF and IL-1 that causes his shock?
    options:
      - Lipid A of the outer membrane
      - Lipoteichoic acid
      - Peptidoglycan cross-linked by transpeptidase
      - Polysaccharide capsule
      - Periplasmic β-lactamase
    answer: 0
    why:
      - "Right. Lipid A of the endotoxin (LPS) in the gram ⊝ outer membrane induces TNF and IL-1, causing fever and shock."
      - "Lipoteichoic acid also induces TNF-α and IL-1, but it is found only in gram ⊕ bacteria."
      - "Peptidoglycan gives rigid support against osmotic pressure; it is not the toxic part of a gram ⊝ rod."
      - "The capsule protects against phagocytosis; it doesn't trigger the cytokine storm."
      - "β-lactamases in the periplasm destroy antibiotics; they do not cause shock."
    src: { page: 122, quote: "Endotoxin: lipid A induces TNF and IL-1" }
    status: unverified
  # ---------- p123: stains ----------
  - id: mic.L01.010
    kind: card
    topic: stains
    front: Why do some bacteria stain gram ⊕ and others gram ⊝?
    back: It depends on peptidoglycan thickness. A thick layer holds on to the crystal violet, so the cell stays purple (gram ⊕); a thin layer loses it and takes up the pink-red counterstain (gram ⊝).
    src: { page: 123, quote: "Bacteria with thick peptidoglycan layer retain crystal violet dye (gram ⊕); bacteria with thin peptidoglycan layer turn red or pink (gram ⊝) with counterstain." }
    status: unverified
  - id: mic.L01.011
    kind: table
    topic: stains
    title: Bugs that do not Gram stain well
    columns: [Organisms, Reason]
    rows:
      - ["Treponema, Leptospira", Too thin to be visualized]
      - [Mycobacteria, Cell wall has high lipid content]
      - ["Mycoplasma, Ureaplasma", No cell wall]
      - ["Legionella, Rickettsia, Chlamydia, Bartonella, Anaplasma, Ehrlichia", "Primarily intracellular (Chlamydia also lack classic peptidoglycan: ↓ muramic acid)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 123, quote: "Treponema, Leptospira Too thin to be visualized Mycobacteria Cell wall has high lipid content Mycoplasma, Ureaplasma No cell wall" }
    status: unverified
    tags: [high-yield]
