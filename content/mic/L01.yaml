    src: { page: 123, quote: "Giemsa stain H pylori, Chlamydia, Borrelia, Rickettsia, Trypanosomes A , Plasmodium Help! Certain Bugs Really Try my Patience" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.014
    kind: card
    topic: stains
    front: What does the periodic acid–Schiff (PAS) stain show, and which disease does it diagnose?
    back: Glycogen and mucopolysaccharides. It is used to diagnose Whipple disease (Tropheryma whipplei).
    src: { page: 123, quote: "Stains glycogen, mucopolysaccharides; used to diagnose Whipple disease (Tropheryma whipplei" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.015
    kind: cloze
    topic: stains
    text: The Ziehl-Neelsen (carbol fuchsin) stain shows acid-fast bacteria such as Mycobacteria and {{c1::Nocardia}} by staining {{c2::mycolic acid}} in the cell wall, and protozoa such as {{c3::Cryptosporidium}} oocysts; auramine-rhodamine is more often used for screening.
    src: { page: 123, quote: "Acid-fast bacteria (eg, Mycobacteria C , Nocardia; stains mycolic acid in cell wall); protozoa (eg, Cryptosporidium oocysts) Auramine-rhodamine stain is more often used for screening (inexpensive, more sensitive)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.016
    kind: card
    topic: stains
    front: Which stains show the capsule of Cryptococcus neoformans?
    back: India ink; mucicarmine can also stain the thick polysaccharide capsule red.
    src: { page: 123, quote: "India ink stain Cryptococcus neoformans D ; mucicarmine can also be used to stain thick polysaccharide capsule red" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.017
    kind: card
    topic: stains
    front: Which organisms does the silver stain show (book mnemonic)?
    back: "H pylori, Legionella, Bartonella henselae, and fungi (Coccidioides, Pneumocystis jirovecii, Aspergillus fumigatus). \"HeLiCoPters Are silver.\""
    src: { page: 123, quote: "Silver stain Helicobacter pylori, Legionella, Bartonella henselae, and fungi (eg, Coccidioides E , Pneumocystis jirovecii, Aspergillus fumigatus) HeLiCoPters Are silver" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.018
    kind: card
    topic: stains
    front: What does a fluorescent antibody stain identify, and what is the example for syphilis?
    back: Many bacteria and viruses, Pneumocystis jirovecii, Giardia and Cryptosporidium. FTA-ABS for syphilis.
    src: { page: 123, quote: "Used to identify many bacteria, viruses, Pneumocystis jirovecii, Giardia, and Cryptosporidium Example is FTA-ABS for syphilis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.019
    kind: mcq
    topic: stains
    stem: >-
      A 45-year-old man has had 6 months of diarrhea, a 10-kg weight loss, migratory joint pain and,
      recently, memory problems. A small-bowel biopsy shows foamy macrophages in the lamina propria
      that stain magenta. Which stain was most likely used to show these macrophages?
    options:
      - Periodic acid–Schiff
      - Ziehl-Neelsen
      - India ink
      - Giemsa
      - Gram stain
    answer: 0
    why:
      - "Right. PAS stains glycogen and mucopolysaccharides and is used to diagnose Whipple disease (Tropheryma whipplei)."
      - "Ziehl-Neelsen shows acid-fast organisms (Mycobacteria, Nocardia, Cryptosporidium)."
      - "India ink shows the capsule of Cryptococcus neoformans."
      - "Giemsa shows H pylori, Chlamydia, Borrelia, Rickettsia, trypanosomes and Plasmodium."
      - "The Gram stain classifies bacteria by peptidoglycan thickness; it is not the stain for Whipple macrophages."
    src: { page: 123, quote: "used to diagnose Whipple disease (Tropheryma whipplei" }
    status: unverified
  - id: mic.L01.020
    kind: mcq
    topic: stains
    stem: >-
      A 19-year-old college student has 10 days of low-grade fever, headache and a dry cough. His
      roommate had a similar illness. He looks well. Chest x-ray shows patchy bilateral interstitial
      infiltrates that look worse than his examination. A sputum Gram stain shows neutrophils but no
      organisms. Which feature of the most likely organism explains the Gram stain result?
    options:
      - It lacks a cell wall
      - Its cell wall has a high lipid content
      - It is too thin to be visualized
      - It is an obligate intracellular organism
      - Its peptidoglycan has ↓ muramic acid
    answer: 0
    why:
      - "Right. Mycoplasma (and Ureaplasma) have no cell wall, so there is no peptidoglycan to hold the stain."
      - "High lipid content is the reason for Mycobacteria."
      - "Too thin to be visualized fits Treponema and Leptospira."
      - "Being intracellular is the reason for Legionella, Rickettsia, Chlamydia and others, not this organism."
      - "Peptidoglycan with ↓ muramic acid is the extra reason given for Chlamydia; this organism has no peptidoglycan at all."
    src: { page: 123, quote: "Mycoplasma, Ureaplasma No cell wall" }
    status: unverified
