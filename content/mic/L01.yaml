  - id: mic.L01.023
    kind: card
    topic: special-culture-requirements
    front: How does Thayer-Martin agar select for Neisseria?
    back: Vancomycin inhibits gram ⊕ organisms, trimethoprim and colistin inhibit gram ⊝ organisms except Neisseria, and nystatin inhibits fungi. ("Very Typically Cultures Neisseria.")
    src: { page: 124, quote: "Selectively favors growth of Neisseria by inhibiting growth of gram ⊕ organisms with vancomycin, gram ⊝ organisms except Neisseria with trimethoprim and colistin, and fungi with nystatin" }
    status: unverified
    tags: [high-yield]
  - id: mic.L01.024
    kind: card
    topic: special-culture-requirements
    front: Which media isolate B pertussis?
    back: Bordet-Gengou agar (made with potato extract) or Regan-Lowe medium (charcoal, blood and an antibiotic).
    src: { page: 124, quote: "B pertussis Bordet-Gengou agar (Bordet for Bordetella) Regan-Lowe medium Potato extract Charcoal, blood, and antibiotic C diphtheriae Tellurite agar, Löffler medium" }
