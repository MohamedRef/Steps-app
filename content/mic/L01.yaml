    topic: special-culture-requirements
    stem: >-
      A 3-year-old unvaccinated girl has fever, drooling and a muffled voice. Blood cultures grow a
      small gram-negative coccobacillus that grows on chocolate agar but not on sheep blood agar.
      Which factors in chocolate agar does this organism require?
    options:
      - Factors V (NAD+) and X (hematin)
      - Cholesterol
      - Cysteine and iron
      - Tellurite
      - Vancomycin, colistin and nystatin
    answer: 0
