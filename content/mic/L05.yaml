  - id: mic.L05.089
    kind: card
    topic: ebola
    front: How is Ebola transmission prevented?
    back: Vaccination of contacts, strict isolation of infected individuals, and barrier practices for healthcare workers. Care is supportive; no definitive treatment.
    src: { page: 169, quote: "Vaccination of contacts, strict isolation of infected individuals, and barrier practices for healthcare workers are key to preventing transmission." }
