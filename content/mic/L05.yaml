items:
  # ---------- p159: structure and genetics ----------
  - id: mic.L05.001
    kind: card
    topic: viral-structure
    front: What are the three basic structural types of virus drawn in First Aid?
    back: Naked (nonenveloped) virus with icosahedral capsid; enveloped virus with icosahedral capsid; enveloped virus with helical capsid (plus the bacteriophage).
    src: { page: 159, quote: "Naked (nonenveloped) virus with icosahedral capsid Enveloped virus with icosahedral capsid Enveloped virus with helical capsid" }
    status: unverified
  - id: mic.L05.002
    kind: table
    topic: viral-genetics
    title: Viral genetics
    columns: [Process, What happens, Example]
    rows:
      - [Recombination, Exchange of genes between 2 chromosomes by crossing over within regions of significant base sequence homology, "-"]
      - [Reassortment, Viruses with segmented genomes exchange genetic material, "2009 H1N1 influenza A pandemic; antigenic shift"]
      - [Complementation, "A nonmutated virus makes a functional protein that serves a coinfecting mutated virus", HDV needs HBV to supply HBsAg]
      - [Phenotypic mixing, Genome of virus A coated with surface proteins of virus B (pseudovirion); coat B sets tropism, "Next progeny have type A coat"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [1, 2], [2, 2]]
    src: { page: 159, quote: "Reassortment When viruses with segmented genomes (eg, influenza virus) exchange genetic material." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.003
    kind: card
    topic: viral-genetics
    front: How did the 2009 H1N1 influenza A pandemic emerge?
    back: Complex viral reassortment of genes from human, swine and avian viruses. Reassortment can cause antigenic shift.
    src: { page: 159, quote: "the 2009 novel H1N1 influenza A pandemic emerged via complex viral reassortment of genes from human, swine, and avian viruses. Has potential to cause antigenic shift." }
    status: unverified
  - id: mic.L05.004
    kind: cloze
    topic: viral-genetics
    text: Hepatitis D virus needs replicating hepatitis B virus to supply {{c1::HBsAg}}, its envelope protein, an example of {{c2::complementation}}.
    src: { page: 159, quote: "hepatitis D virus requires the presence of replicating hepatitis B virus to supply HBsAg, the envelope protein for HDV." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.005
    kind: card
    topic: viral-genetics
    front: In phenotypic mixing, what determines the tropism of the hybrid virus, and what coat do its progeny have?
    back: The type B protein coat determines tropism (infectivity) of the pseudovirion. Progeny from its next infection have a type A coat, encoded by its type A genetic material.
    src: { page: 159, quote: "Type B protein coat determines the tropism (infectivity) of the hybrid virus. Progeny from subsequent infection of a cell by progeny 1 will have a type A coat that is encoded by its type A genetic material." }
    status: unverified
  # ---------- p160: genomes and envelopes ----------
  - id: mic.L05.006
    kind: card
    topic: viral-genomes
    front: Which naked viral nucleic acids are infectious, and why are the others not?
    back: Naked nucleic acids of most dsDNA viruses (except poxviruses and HBV) and ⊕ ssRNA viruses are infectious. ⊝ ssRNA and dsRNA are not, because they lack the polymerases needed to replicate; ⊝ ssRNA virions carry RNA-dependent RNA polymerases.
    src: { page: 160, quote: "Naked nucleic acids of ⊝ strand ssRNA and dsRNA viruses are not infectious because they lack the required polymerases to replicate." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.007
    kind: card
    topic: viral-genomes
    front: What are the exceptions to the DNA virus rules (dsDNA, linear)?
    back: All are dsDNA except Parvoviridae (ssDNA) ("Part of a virus"). All are linear except papilloma-, polyoma- and hepadnaviruses (circular).
    src: { page: 160, quote: "All have dsDNA genomes (like our cells) except Parvoviridae (ssDNA). All are linear except papilloma-, polyoma-, and hepadnaviruses (circular)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.008
    kind: card
    topic: viral-genomes
    front: Which RNA virus family is double stranded?
    back: Reoviridae (dsRNA); all other RNA viruses are ssRNA ("Repeato-virus").
    src: { page: 160, quote: "All have ssRNA genomes except Reoviridae (dsRNA)." }
    status: unverified
  - id: mic.L05.009
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the ⊕ stranded RNA virus families (7).
    points:
      - Retroviruses
      - Togaviruses
      - Flaviviruses
      - Coronaviruses
      - Hepeviruses
      - Caliciviruses
      - Picornaviruses
    pass: 6
    hook: "While at a retro toga party, I drank flavored Corona and ate hippie California pickles."
    src: { page: 160, quote: "⊕ stranded (≈ mRNA): retro-, toga-, flavi-, corona-, hepe-, calici-, and picornaviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.010
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the ⊝ stranded RNA virus families (6).
    points:
      - Arenaviruses
      - Bunyaviruses
      - Paramyxoviruses
      - Orthomyxoviruses
      - Filoviruses
      - Rhabdoviruses
    pass: 5
    hook: "Always bring polymerase or fail replication."
    src: { page: 160, quote: "⊝ stranded: arena-, bunya-, paramyxo-, orthomyxo-, filo-, and rhabdoviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.011
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the segmented RNA viruses (4).
    points:
      - Bunyaviruses
      - Orthomyxoviruses
      - Arenaviruses
      - Reoviruses
    pass: 4
    hook: "BOAR"
    src: { page: 160, quote: "Segmented: Bunya-, Orthomyxo-, Arena-, and Reoviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.012
    kind: card
    topic: viral-envelopes
    front: Where do enveloped viruses get their envelopes, and which is the exception?
    back: Generally from the plasma membrane as they exit the cell. Herpesviruses get theirs from the nuclear membrane.
    src: { page: 160, quote: "Generally, enveloped viruses acquire their envelopes from plasma membrane when they exit from cell. Exceptions include herpesviruses, which acquire envelopes from nuclear membrane." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.013
    kind: cloze
    topic: viral-envelopes
    text: The enveloped DNA viruses are {{c1::herpesvirus}}, {{c2::hepadnavirus}} and {{c3::poxvirus}} ("have helpful protection").
    src: { page: 160, quote: "Enveloped DNA viruses (herpesvirus, hepadnavirus, poxvirus) have helpful protection." }
    status: unverified
    tags: [high-yield]
  # ---------- p161: DNA viruses ----------
  - id: mic.L05.014
    kind: card
    topic: dna-viruses
    front: What do all DNA viruses share, and which is the exception?
    back: All are icosahedral and replicate in the nucleus, except poxvirus ("Pox is out of the box (nucleus)").
    src: { page: 161, quote: "All are icosahedral and replicate in the nucleus (except poxvirus). “Pox is out of the box (nucleus).”" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.015
    kind: table
    topic: dna-viruses
    title: DNA viruses
    columns: [Family, Envelope, DNA structure]
    rows:
      - [Herpesviruses, "Yes", DS and linear]
      - [Poxvirus, "Yes", "DS and linear (largest DNA virus)"]
      - [Hepadnavirus, "Yes", Partially DS and circular]
      - [Adenovirus, "No", DS and linear]
      - [Papillomavirus, "No", DS and circular]
      - [Polyomavirus, "No", DS and circular]
      - [Parvovirus, "No", "SS and linear (smallest DNA virus)"]
    blanks: [[0, 1], [2, 2], [3, 1], [4, 2], [5, 2], [6, 2]]
    src: { page: 161, quote: "VIRAL FAMILY ENVELOPE DNA STRUCTURE MEDICAL IMPORTANCE Herpesviruses Yes DS and linear" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.016
    kind: card
    topic: dna-viruses
    front: What diseases do poxviruses cause?
    back: Smallpox (eradicated by the live attenuated vaccine); cowpox ("milkmaid blisters"); molluscum contagiosum - flesh-colored papule with central umbilication, keratinocytes contain molluscum bodies.
    src: { page: 161, quote: "Molluscum contagiosum—flesh-colored papule with central umbilication; keratinocytes contain molluscum bodies" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.017
    kind: card
    topic: dna-viruses
    front: What is unusual about HBV, a hepadnavirus?
    back: It causes acute or chronic hepatitis and is not a retrovirus but has reverse transcriptase.
    src: { page: 161, quote: "Not a retrovirus but has reverse transcriptase" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.018
    kind: enumerate
    topic: dna-viruses
    prompt: Enumerate the diseases caused by adenovirus (6).
    points:
      - Febrile pharyngitis
      - Acute hemorrhagic cystitis
      - Pneumonia
      - Conjunctivitis (pink eye)
      - Gastroenteritis
      - Myocarditis
    pass: 5
    src: { page: 161, quote: "Febrile pharyngitis B —sore throat Acute hemorrhagic cystitis Pneumonia Conjunctivitis—“pink eye” Gastroenteritis Myocarditis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.019
    kind: cloze
    topic: dna-viruses
    text: HPV serotypes {{c1::1, 2, 6, 11}} are associated with warts and serotypes {{c2::16, 18}} with cancer (cervical, anal, penile, or oropharyngeal).
    src: { page: 161, quote: "serotypes 1, 2, 6, 11 associated with warts; serotypes 16, 18 associated with cancer" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.020
    kind: card
    topic: dna-viruses
    front: What do the two polyomaviruses cause?
    back: JC virus - progressive multifocal leukoencephalopathy (PML) in the immunocompromised (eg, HIV) ("Junky Cerebrum"). BK virus - transplant patients, commonly targets the kidney ("Bad Kidney").
    src: { page: 161, quote: "JC virus—progressive multifocal leukoencephalopathy (PML) in immunocompromised patients (eg, HIV) BK virus—transplant patients, commonly targets kidney JC: Junky Cerebrum; BK: Bad Kidney" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.021
    kind: card
    topic: dna-viruses
    front: What does parvovirus B19 infect, and what does it cause in each group?
    back: RBC precursors and endothelial cells, causing RBC destruction. Aplastic crises in sickle cell disease; "slapped cheek" rash in children (erythema infectiosum, fifth disease); hydrops fetalis and death in the fetus; pure RBC aplasia and rheumatoid arthritis-like symptoms in adults.
    src: { page: 161, quote: "B19 virus—aplastic crises in sickle cell disease, “slapped cheek” rash in children (erythema infectiosum, or fifth disease); infects RBC precursors and endothelial cells →  RBC destruction →  hydrops fetalis and death in fetus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.022
    kind: mcq
    topic: dna-viruses
    stem: >-
      A 9-year-old boy with sickle cell disease has fatigue and pallor 1 week after a febrile illness. His
      younger sister has bright red cheeks and a lacy rash on her arms. His hemoglobin has fallen from 8.5
      to 4.0 g/dL and the reticulocyte count is near zero. Which cells does the causative virus infect?
    options:
      - Erythroid precursors
      - CD4+ T cells
      - B cells via CD21
      - Hepatocytes
      - Renal tubular cells
    answer: 0
    why:
      - "Right. Parvovirus B19 (fifth disease in the sister) infects RBC precursors, causing an aplastic crisis in sickle cell disease."
      - "CD4+ T cells are the target of HIV."
      - "B cells via CD21 are the target of EBV."
      - "Hepatocytes are the target of the hepatitis viruses."
      - "The kidney is targeted by BK virus in transplant patients."
    src: { page: 161, quote: "infects RBC precursors and endothelial cells" }
    status: unverified
  - id: mic.L05.023
    kind: mcq
    topic: dna-viruses
    stem: >-
      A 46-year-old man with HIV and a CD4+ count of 40 cells/mm3 has weeks of progressive weakness of
      his right arm, clumsiness and trouble finding words, without fever. MRI shows multiple nonenhancing
      white matter lesions without mass effect. Which virus is the most likely cause?
    options:
      - JC virus
      - BK virus
      - Cytomegalovirus
      - Herpes simplex virus-1
      - Epstein-Barr virus
    answer: 0
    why:
      - "Right. JC virus reactivation causes PML in the immunocompromised: nonenhancing areas of demyelination."
      - "BK virus targets the kidney in transplant patients."
      - "CMV causes retinitis, colitis and encephalitis at low CD4+ counts, not this picture."
      - "HSV-1 causes temporal lobe encephalitis with fever and seizures."
      - "EBV causes CNS lymphoma, which enhances."
    src: { page: 173, quote: "JC virus (reactivation) Progressive multifocal leukoencephalopathy Nonenhancing areas of demyelination on MRI" }
    status: unverified
  # ---------- p162-163: herpesviruses ----------
  - id: mic.L05.024
    kind: card
    topic: herpesviruses
    front: What does HSV-1 cause, and where is it latent?
    back: Gingivostomatitis, keratoconjunctivitis, herpes labialis (cold sores), herpetic whitlow, temporal lobe encephalitis, esophagitis, erythema multiforme, and a growing share of herpes genitalis. Most commonly latent in the trigeminal ganglia.
    src: { page: 162, quote: "Gingivostomatitis, keratoconjunctivitis A , herpes labialis (cold sores) B , herpetic whitlow on finger, temporal lobe encephalitis, esophagitis, erythema multiforme." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.025
    kind: card
    topic: herpesviruses
    front: What is the most common cause of sporadic encephalitis, and how does it present?
    back: HSV-1 (temporal lobe encephalitis). Altered mental status, seizures, and/or aphasia.
    src: { page: 162, quote: "Most common cause of sporadic encephalitis, can present as altered mental status, seizures, and/or aphasia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.026
    kind: card
    topic: herpesviruses
    front: How is HSV-2 transmitted, what does it cause, and where is it latent?
    back: Sexual contact and perinatal. Herpes genitalis, neonatal herpes; viral meningitis is more common with HSV-2 than HSV-1. Most commonly latent in the sacral ganglia.
    src: { page: 162, quote: "Herpes genitalis, neonatal herpes C Most commonly latent in sacral ganglia Viral meningitis more common with HSV-2 than with HSV-1" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.027
    kind: card
    topic: herpesviruses
    front: What does varicella-zoster virus (HHV-3) cause, and where is it latent?
    back: Chickenpox, shingles, encephalitis, pneumonia; the most common complication of shingles is post-herpetic neuralgia. Latent in dorsal root or trigeminal ganglia; CN V1 involvement causes herpes zoster ophthalmicus.
    src: { page: 162, quote: "Latent in dorsal root or trigeminal ganglia; CN V1 branch involvement can cause herpes zoster ophthalmicus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.028
    kind: card
    topic: herpesviruses
    front: What are the features of infectious mononucleosis from EBV (HHV-4), and what must patients avoid?
    back: Fever, hepatosplenomegaly, pharyngitis and lymphadenopathy (especially posterior cervical nodes). Avoid contact sports until resolution because of the risk of splenic rupture.
    src: { page: 162, quote: "Mononucleosis—fever, hepatosplenomegaly F , pharyngitis, and lymphadenopathy (especially posterior cervical nodes); avoid contact sports until resolution due to risk of splenic rupture" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.029
    kind: card
    topic: herpesviruses
    front: Which cancers are associated with EBV?
    back: Lymphomas (eg, endemic Burkitt lymphoma), nasopharyngeal carcinoma (especially Asian adults), lymphoproliferative disease in transplant patients.
    src: { page: 162, quote: "Associated with lymphomas (eg, endemic Burkitt lymphoma), nasopharyngeal carcinoma (especially Asian adults), lymphoproliferative disease in transplant patients" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.030
    kind: cloze
    topic: herpesviruses
    text: EBV infects B cells through {{c1::CD21}} ("Must be 21 to drink Beer in a Barr"); the atypical lymphocytes on smear are reactive {{c2::cytotoxic T cells}}, not infected B cells.
    src: { page: 162, quote: "Infects B cells through CD21, “Must be 21 to drink Beer in a Barr” Atypical lymphocytes on peripheral blood smear G—not infected B cells but reactive cytotoxic T cells" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.031
    kind: card
    topic: herpesviruses
    front: What does the Monospot test detect, and what happens if a patient with mono gets amoxicillin?
    back: Heterophile antibodies, detected by agglutination of sheep or horse RBCs. Amoxicillin (eg, for presumed strep pharyngitis) can cause a maculopapular rash.
    src: { page: 162, quote: "⊕ Monospot test—heterophile antibodies detected by agglutination of sheep or horse RBCs Use of amoxicillin (eg, for presumed strep pharyngitis) can cause maculopapular rash" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.032
    kind: card
    topic: herpesviruses
    front: How is CMV (HHV-5) transmitted, and what does it cause?
    back: Congenital, transfusion, sexual contact, saliva, urine, transplant. Monospot-negative mononucleosis in the immunocompetent; in the immunocompromised, pneumonia (transplant), esophagitis, colitis, AIDS retinitis ("sightomegalovirus"); congenital CMV.
    src: { page: 162, quote: "Mononucleosis (⊝ Monospot) in immunocompetent patients; infection in immunocompromised, especially pneumonia in transplant patients; esophagitis; colitis; AIDS retinitis (“sightomegalovirus”)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.033
    kind: cloze
    topic: herpesviruses
    text: CMV-infected cells have characteristic {{c1::"owl eye"}} intranuclear inclusions, and the virus is latent in {{c2::mononuclear cells}}.
    src: { page: 162, quote: "Infected cells have characteristic “owl eye” intranuclear inclusions H Latent in mononuclear cells" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.034
    kind: card
    topic: herpesviruses
    front: What is roseola infantum, and which viruses cause it?
    back: HHV-6 (and less often HHV-7), via saliva. High fevers for several days that can cause seizures, followed by a diffuse macular rash starting on the trunk then spreading to the extremities; usually children <2 years. "Fever first, Rosy (rash) later." Self-limited.
    src: { page: 162, quote: "Roseola infantum (exanthem subitum): high fevers for several days that can cause seizures, followed by diffuse macular rash (starts on trunk then spreads to extremities) I ; usually seen in children <2 years old" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.035
    kind: card
    topic: herpesviruses
    front: What does HHV-8 cause, and in whom?
    back: Kaposi sarcoma, a neoplasm of endothelial cells, spread by sexual contact; seen in HIV/AIDS and transplant patients. Dark/violaceous plaques or nodules (vascular proliferations); can affect the GI tract and lungs.
    src: { page: 162, quote: "Kaposi sarcoma (neoplasm of endothelial cells). Seen in HIV/AIDS and transplant patients. Dark/violaceous plaques or nodules J representing vascular proliferations" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.036
    kind: table
    topic: herpesviruses
    title: Herpesvirus latency
    columns: [Virus, Latent in]
    rows:
      - [HSV-1, Trigeminal ganglia]
      - [HSV-2, Sacral ganglia]
      - [VZV, Dorsal root or trigeminal ganglia]
      - [CMV, Mononuclear cells]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 162, quote: "Most commonly latent in trigeminal ganglia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.037
    kind: mcq
    topic: herpesviruses
    stem: >-
      A 17-year-old boy has fever, sore throat and fatigue for 1 week. He has tonsillar exudates, posterior
      cervical lymphadenopathy and a palpable spleen. After amoxicillin is started for presumed strep
      pharyngitis, he develops a diffuse maculopapular rash. What are the atypical lymphocytes on his blood
      smear?
    options:
      - Reactive cytotoxic T cells
      - EBV-infected B cells
      - Plasma cells
      - Monocytes containing owl eye inclusions
      - Natural killer cells infected through CD4
    answer: 0
    why:
      - "Right. In EBV mononucleosis, the atypical lymphocytes are reactive cytotoxic T cells, not infected B cells."
      - "EBV infects B cells via CD21, but those are not the atypical cells on smear."
      - "Plasma cells are not the atypical lymphocytes of mono."
      - "Owl eye inclusions are CMV."
      - "CD4 is the HIV receptor."
    src: { page: 162, quote: "Atypical lymphocytes on peripheral blood smear G—not infected B cells but reactive cytotoxic T cells" }
    status: unverified
  - id: mic.L05.038
    kind: mcq
    topic: herpesviruses
    stem: >-
      A 34-year-old woman has fever, headache, confusion and a focal seizure. She says words that do not
      make sense. MRI shows hyperintensity of the left medial temporal lobe. Which test confirms the most
      likely diagnosis?
    options:
      - CSF PCR for HSV
      - Tzanck smear of the oral mucosa
      - India ink stain of CSF
      - Monospot test
      - Serum anti-HBc IgM
    answer: 0
    why:
      - "Right. HSV-1 temporal lobe encephalitis, the most common cause of sporadic encephalitis; CSF PCR is the test."
      - "The Tzanck test is outdated and is used on skin vesicles."
      - "India ink is for Cryptococcus meningitis."
      - "The Monospot test is for EBV mononucleosis."
      - "Anti-HBc IgM is a hepatitis B marker."
    src: { page: 163, quote: "CSF PCR for herpes encephalitis." }
    status: unverified
  - id: mic.L05.039
    kind: mcq
    topic: herpesviruses
    stem: >-
      A 10-month-old girl has had fevers to 40°C for 3 days, with one brief febrile seizure. On day 4 the fever
      breaks and a pink macular rash appears on her trunk and spreads to her limbs. She is playful. Which
      virus is the most likely cause?
    options:
      - Human herpesvirus 6
      - Measles virus
      - Parvovirus B19
      - Rubella virus
      - Varicella-zoster virus
    answer: 0
    why:
      - "Right. Roseola (HHV-6): high fever first, then the rash on the trunk spreading out; under 2 years."
      - "Measles has the 4 C's, and the rash starts at the head with fever ongoing."
      - "Parvovirus B19 gives slapped cheeks."
      - "Rubella's rash starts on the face with postauricular nodes."
      - "VZV gives vesicles in crops."
    src: { page: 162, quote: "Roseola: fever first, Rosy (rash) later" }
    status: unverified
  - id: mic.L05.040
    kind: card
    topic: hsv-identification
    front: How are HSV infections identified?
    back: PCR of skin lesions is the test of choice; CSF PCR for herpes encephalitis. The Tzanck test (outdated) shows multinucleated giant cells (HSV-1, HSV-2, VZV). Intranuclear eosinophilic Cowdry A inclusions are also seen with HSV-1, HSV-2, VZV.
    src: { page: 163, quote: "PCR of skin lesions is test of choice. CSF PCR for herpes encephalitis. Tzanck test (outdated)—a smear of an opened skin vesicle to detect multinucleated giant cells" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.041
    kind: table
    topic: viral-receptors
    title: Receptors used by viruses
    columns: [Virus, Receptor]
    rows:
      - [CMV, Integrins (heparan sulfate)]
      - [EBV, CD21]
      - [HIV, "CD4, CXCR4, CCR5"]
      - [Parvovirus B19, P antigen on RBCs]
      - [Rabies, Nicotinic AChR]
      - [Rhinovirus, ICAM-1 (I CAMe to see the rhino)]
