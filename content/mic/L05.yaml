items:
  # ---------- p159: structure and genetics ----------
  - id: mic.L05.001
    kind: card
    topic: viral-structure
    front: What are the three basic structural types of virus drawn in First Aid?
    back: Naked (nonenveloped) virus with icosahedral capsid; enveloped virus with icosahedral capsid; enveloped virus with helical capsid (plus the bacteriophage).
    src: { page: 159, quote: "Naked (nonenveloped) virus with icosahedral capsid Enveloped virus with icosahedral capsid Enveloped virus with helical capsid" }
    status: unverified
  - id: mic.L05.002
    kind: table
    topic: viral-genetics
    title: Viral genetics
    columns: [Process, What happens, Example]
    rows:
      - [Recombination, Exchange of genes between 2 chromosomes by crossing over within regions of significant base sequence homology, "-"]
      - [Reassortment, Viruses with segmented genomes exchange genetic material, "2009 H1N1 influenza A pandemic; antigenic shift"]
      - [Complementation, "A nonmutated virus makes a functional protein that serves a coinfecting mutated virus", HDV needs HBV to supply HBsAg]
      - [Phenotypic mixing, Genome of virus A coated with surface proteins of virus B (pseudovirion); coat B sets tropism, "Next progeny have type A coat"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [1, 2], [2, 2]]
    src: { page: 159, quote: "Reassortment When viruses with segmented genomes (eg, influenza virus) exchange genetic material." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.003
    kind: card
    topic: viral-genetics
    front: How did the 2009 H1N1 influenza A pandemic emerge?
    back: Complex viral reassortment of genes from human, swine and avian viruses. Reassortment can cause antigenic shift.
    src: { page: 159, quote: "the 2009 novel H1N1 influenza A pandemic emerged via complex viral reassortment of genes from human, swine, and avian viruses. Has potential to cause antigenic shift." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.004
    kind: cloze
    topic: viral-genetics
    text: Hepatitis D virus needs replicating hepatitis B virus to supply {{c1::HBsAg}}, its envelope protein, an example of {{c2::complementation}}.
    src: { page: 159, quote: "hepatitis D virus requires the presence of replicating hepatitis B virus to supply HBsAg, the envelope protein for HDV." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.005
    kind: card
    topic: viral-genetics
    front: "In phenotypic mixing, what decides the tropism of the hybrid virus, and what coat do its progeny carry?"
    back: "The borrowed B coat decides which cells the pseudovirion can infect; its offspring go back to an A coat, because their genes are A."
    src: { page: 159, quote: "Type B protein coat determines the tropism (infectivity) of the hybrid virus. Progeny from subsequent infection of a cell by progeny 1 will have a type A coat that is encoded by its type A genetic material." }
    status: unverified
  # ---------- p160: genomes and envelopes ----------
  - id: mic.L05.006
    kind: card
    topic: viral-genomes
    front: "Why are the naked nucleic acids of ⊝ ssRNA and dsRNA viruses not infectious?"
    back: "On their own they cannot replicate: they have no polymerase to copy them."
    src: { page: 160, quote: "Naked nucleic acids of ⊝ strand ssRNA and dsRNA viruses are not infectious because they lack the required polymerases to replicate." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.198
    kind: card
    topic: viral-genomes
    front: "Which naked viral nucleic acids are infectious?"
    back: "Those of ⊕ ssRNA viruses and of most dsDNA viruses (poxviruses and HBV are the exceptions)."
    src: { page: 160, quote: "Naked nucleic acids of most dsDNA viruses (except poxviruses and HBV) and ⊕ strand ssRNA viruses are infectious" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.199
    kind: card
    topic: viral-genomes
    front: "What enzyme do ⊝ ssRNA virions carry, and why?"
    back: "An RNA-dependent RNA polymerase, to make ⊕ strand copies of their ⊝ genome."
    src: { page: 160, quote: "Virions of ⊝ strand ssRNA viruses carry RNA-dependent RNA polymerases" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.007
    kind: card
    topic: viral-genomes
    front: "Which DNA virus family has a single-stranded genome?"
    back: "Parvoviridae; every other DNA virus is double stranded (\"Part of a virus\")."
    src: { page: 160, quote: "All have dsDNA genomes (like our cells) except Parvoviridae (ssDNA). All are linear except papilloma-, polyoma-, and hepadnaviruses (circular)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.211
    kind: card
    topic: viral-genomes
    front: "Which DNA virus families have circular genomes?"
    back: "Papillomaviruses, polyomaviruses and hepadnaviruses; the other DNA viruses are linear."
    src: { page: 160, quote: "All are linear except papilloma-, polyoma-, and hepadnaviruses (circular)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.008
    kind: card
    topic: viral-genomes
    front: Which RNA virus family is double stranded?
    back: Reoviridae (dsRNA); all other RNA viruses are ssRNA ("Repeato-virus").
    src: { page: 160, quote: "All have ssRNA genomes except Reoviridae (dsRNA)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.009
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the ⊕ stranded RNA virus families (7).
    points:
      - Retroviruses
      - Togaviruses
      - Flaviviruses
      - Coronaviruses
      - Hepeviruses
      - Caliciviruses
      - Picornaviruses
    pass: 6
    hook: "While at a retro toga party, I drank flavored Corona and ate hippie California pickles."
    src: { page: 160, quote: "⊕ stranded (≈ mRNA): retro-, toga-, flavi-, corona-, hepe-, calici-, and picornaviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.010
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the ⊝ stranded RNA virus families (6).
    points:
      - Arenaviruses
      - Bunyaviruses
      - Paramyxoviruses
      - Orthomyxoviruses
      - Filoviruses
      - Rhabdoviruses
    pass: 5
    hook: "Always bring polymerase or fail replication."
    src: { page: 160, quote: "⊝ stranded: arena-, bunya-, paramyxo-, orthomyxo-, filo-, and rhabdoviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.011
    kind: enumerate
    topic: viral-genomes
    prompt: Enumerate the segmented RNA viruses (4).
    points:
      - Bunyaviruses
      - Orthomyxoviruses
      - Arenaviruses
      - Reoviruses
    pass: 4
    hook: "BOAR"
    src: { page: 160, quote: "Segmented: Bunya-, Orthomyxo-, Arena-, and Reoviruses." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.012
    kind: card
    topic: viral-envelopes
    front: "Where do most enveloped viruses get their envelope?"
    back: "From the host plasma membrane, as they bud out of the cell."
    src: { page: 160, quote: "Generally, enveloped viruses acquire their envelopes from plasma membrane when they exit from cell. Exceptions include herpesviruses, which acquire envelopes from nuclear membrane." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.200
    kind: card
    topic: viral-envelopes
    front: "Which enveloped viruses take their envelope from the nuclear membrane instead of the plasma membrane?"
    back: "Herpesviruses."
    src: { page: 160, quote: "Exceptions include herpesviruses, which acquire envelopes from nuclear membrane" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.013
    kind: cloze
    topic: viral-envelopes
    text: The enveloped DNA viruses are {{c1::herpesvirus}}, {{c2::hepadnavirus}} and {{c3::poxvirus}} ("have helpful protection").
    src: { page: 160, quote: "Enveloped DNA viruses (herpesvirus, hepadnavirus, poxvirus) have helpful protection." }
    status: unverified
    tags: [high-yield]
  # ---------- p161: DNA viruses ----------
  - id: mic.L05.014
    kind: card
    topic: dna-viruses
    front: What do all DNA viruses share, and which is the exception?
    back: All are icosahedral and replicate in the nucleus, except poxvirus ("Pox is out of the box (nucleus)").
    src: { page: 161, quote: "All are icosahedral and replicate in the nucleus (except poxvirus). “Pox is out of the box (nucleus).”" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.015
    kind: table
    topic: dna-viruses
    title: DNA viruses
    columns: [Family, Envelope, DNA structure]
    rows:
      - [Herpesviruses, "Yes", DS and linear]
      - [Poxvirus, "Yes", "DS and linear (largest DNA virus)"]
      - [Hepadnavirus, "Yes", Partially DS and circular]
      - [Adenovirus, "No", DS and linear]
      - [Papillomavirus, "No", DS and circular]
      - [Polyomavirus, "No", DS and circular]
      - [Parvovirus, "No", "SS and linear (smallest DNA virus)"]
    blanks: [[0, 1], [2, 2], [3, 1], [4, 2], [5, 2], [6, 2]]
    src: { page: 161, quote: "VIRAL FAMILY ENVELOPE DNA STRUCTURE MEDICAL IMPORTANCE Herpesviruses Yes DS and linear" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.016
    kind: card
    topic: dna-viruses
    front: "What skin lesion does molluscum contagiosum (a poxvirus) cause?"
    back: "A skin-coloured papule with a dimple (umbilication) in its center."
    src: { page: 161, quote: "Molluscum contagiosum—flesh-colored papule with central umbilication; keratinocytes contain molluscum bodies" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.181
    kind: card
    topic: dna-viruses
    front: "How was smallpox (a poxvirus) eradicated worldwide?"
    back: "With the live attenuated vaccine."
    src: { page: 161, quote: "Smallpox eradicated world wide by use of the live attenuated vaccine" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.182
    kind: card
    topic: dna-viruses
    front: "Which poxvirus causes \"milkmaid blisters\"?"
    back: "Cowpox."
    src: { page: 161, quote: "Cowpox (“milkmaid blisters”)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.183
    kind: card
    topic: dna-viruses
    front: "What do keratinocytes in a molluscum contagiosum lesion contain?"
    back: "Molluscum bodies."
    src: { page: 161, quote: "keratinocytes contain molluscum bodies" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.017
    kind: card
    topic: dna-viruses
    front: "HBV is not a retrovirus. Which retroviral enzyme does it still have?"
    back: "Reverse transcriptase."
    src: { page: 161, quote: "Not a retrovirus but has reverse transcriptase" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.212
    kind: card
    topic: dna-viruses
    front: "What liver disease does HBV, the hepadnavirus, cause?"
    back: "Hepatitis, either acute or chronic."
    src: { page: 161, quote: "Acute or chronic hepatitis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.018
    kind: enumerate
    topic: dna-viruses
    prompt: Enumerate the diseases caused by adenovirus (6).
    points:
      - Febrile pharyngitis
      - Acute hemorrhagic cystitis
      - Pneumonia
      - Conjunctivitis (pink eye)
      - Gastroenteritis
      - Myocarditis
    pass: 5
    src: { page: 161, quote: "Febrile pharyngitis B —sore throat Acute hemorrhagic cystitis Pneumonia Conjunctivitis—“pink eye” Gastroenteritis Myocarditis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.019
    kind: cloze
    topic: dna-viruses
    text: HPV serotypes {{c1::1, 2, 6, 11}} are associated with warts and serotypes {{c2::16, 18}} with cancer (cervical, anal, penile, or oropharyngeal).
    src: { page: 161, quote: "serotypes 1, 2, 6, 11 associated with warts; serotypes 16, 18 associated with cancer" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.020
    kind: card
    topic: dna-viruses
    front: "What does JC virus cause, and in whom?"
    back: "Progressive multifocal leukoencephalopathy (PML), in people with weak immunity such as HIV (\"Junky Cerebrum\")."
    src: { page: 161, quote: "JC virus—progressive multifocal leukoencephalopathy (PML) in immunocompromised patients (eg, HIV) BK virus—transplant patients, commonly targets kidney JC: Junky Cerebrum; BK: Bad Kidney" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.213
    kind: card
    topic: dna-viruses
    front: "Which patients does BK virus affect, and which organ does it usually attack?"
    back: "Transplant recipients; it mostly goes for the kidney (\"Bad Kidney\")."
    src: { page: 161, quote: "BK virus—transplant patients, commonly targets kidney" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.021
    kind: card
    topic: dna-viruses
    front: Which cells does parvovirus B19 infect?
    back: RBC precursors and endothelial cells, so red cells are destroyed.
    src: { page: 161, quote: "B19 virus—aplastic crises in sickle cell disease, “slapped cheek” rash in children (erythema infectiosum, or fifth disease); infects RBC precursors and endothelial cells →  RBC destruction →  hydrops fetalis and death in fetus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.155
    kind: card
    topic: dna-viruses
    front: What does parvovirus B19 cause in sickle cell disease?
    back: An aplastic crisis.
    src: { page: 161, quote: "aplastic crises in sickle cell disease" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.156
    kind: card
    topic: dna-viruses
    front: What does parvovirus B19 cause in children?
    back: Erythema infectiosum (fifth disease), with a slapped-cheek rash.
    src: { page: 161, quote: "“slapped cheek” rash in children" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.157
    kind: card
    topic: dna-viruses
    front: What does parvovirus B19 cause in the fetus?
    back: Hydrops fetalis and fetal death.
    src: { page: 161, quote: "hydrops fetalis and death in fetus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.158
    kind: card
    topic: dna-viruses
    front: What does parvovirus B19 cause in adults?
    back: Pure RBC aplasia and rheumatoid arthritis-like joint symptoms.
    src: { page: 161, quote: "pure RBC aplasia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.022
    kind: mcq
    topic: dna-viruses
    stem: >-
      A 9-year-old boy with sickle cell disease has fatigue and pallor 1 week after a febrile illness. His
      younger sister has bright red cheeks and a lacy rash on her arms. His hemoglobin has fallen from 8.5
      to 4.0 g/dL and the reticulocyte count is near zero. Which cells does the causative virus infect?
    options:
      - Erythroid precursors
      - CD4+ T cells
      - B cells via CD21
      - Hepatocytes
      - Renal tubular cells
    answer: 0
    why:
      - "Right. Parvovirus B19 (fifth disease in the sister) infects RBC precursors, causing an aplastic crisis in sickle cell disease."
      - "CD4+ T cells are the target of HIV."
      - "B cells via CD21 are the target of EBV."
      - "Hepatocytes are the target of the hepatitis viruses."
      - "The kidney is targeted by BK virus in transplant patients."
    src: { page: 161, quote: "infects RBC precursors and endothelial cells" }
    status: unverified
  - id: mic.L05.023
    kind: mcq
    topic: dna-viruses
    stem: >-
      A 46-year-old man with HIV and a CD4+ count of 40 cells/mm3 has weeks of progressive weakness of
      his right arm, clumsiness and trouble finding words, without fever. MRI shows multiple nonenhancing
      white matter lesions without mass effect. Which virus is the most likely cause?
    options:
      - JC virus
      - BK virus
      - Cytomegalovirus
      - Herpes simplex virus-1
      - Epstein-Barr virus
    answer: 0
    why:
      - "Right. JC virus reactivation causes PML in the immunocompromised: nonenhancing areas of demyelination."
      - "BK virus targets the kidney in transplant patients."
      - "CMV causes retinitis, colitis and encephalitis at low CD4+ counts, not this picture."
      - "HSV-1 causes temporal lobe encephalitis with fever and seizures."
      - "EBV causes CNS lymphoma, which enhances."
    src: { page: 173, quote: "JC virus (reactivation) Progressive multifocal leukoencephalopathy Nonenhancing areas of demyelination on MRI" }
    status: unverified
  # ---------- p162-163: herpesviruses ----------
  - id: mic.L05.024
    kind: card
    topic: herpesviruses
    front: "Which diseases does HSV-1 cause?"
    back: "Gingivostomatitis, keratoconjunctivitis, cold sores (herpes labialis), herpetic whitlow of the finger, temporal lobe encephalitis, esophagitis and erythema multiforme."
    src: { page: 162, quote: "Gingivostomatitis, keratoconjunctivitis A , herpes labialis (cold sores) B , herpetic whitlow on finger, temporal lobe encephalitis, esophagitis, erythema multiforme." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.184
    kind: card
    topic: herpesviruses
    front: "Where is HSV-1 most commonly latent?"
    back: "The trigeminal ganglia."
    src: { page: 162, quote: "Most commonly latent in trigeminal ganglia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.185
    kind: card
    topic: herpesviruses
    front: "Which genital infection is increasingly caused by HSV-1?"
    back: "Herpes genitalis: HSV-1 causes a growing share of it."
    src: { page: 162, quote: "Responsible for a growing percentage of herpes genitalis" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.025
    kind: card
    topic: herpesviruses
    front: What is the most common cause of sporadic encephalitis, and how does it present?
    back: HSV-1 (temporal lobe encephalitis). Altered mental status, seizures, and/or aphasia.
    src: { page: 162, quote: "Most common cause of sporadic encephalitis, can present as altered mental status, seizures, and/or aphasia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.026
    kind: card
    topic: herpesviruses
    front: "Which diseases does HSV-2 cause?"
    back: "Genital herpes, and herpes in the newborn."
    src: { page: 162, quote: "Herpes genitalis, neonatal herpes C Most commonly latent in sacral ganglia Viral meningitis more common with HSV-2 than with HSV-1" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.214
    kind: card
    topic: herpesviruses
    front: "Where is HSV-2 most commonly latent?"
    back: "The sacral ganglia."
    src: { page: 162, quote: "Most commonly latent in sacral ganglia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.215
    kind: card
    topic: herpesviruses
    front: "Which herpes simplex type more often causes viral meningitis?"
    back: "HSV-2 (more often than HSV-1)."
    src: { page: 162, quote: "Viral meningitis more common with HSV-2 than with HSV-1" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.216
    kind: card
    topic: herpesviruses
    front: "How is HSV-2 transmitted?"
    back: "By sexual contact, and from mother to baby around birth (perinatal)."
    src: { page: 162, quote: "Sexual contact, perinatal" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.217
    kind: card
    topic: herpesviruses
    front: "Is HSV-1 limited to the mouth and HSV-2 to the genitals?"
    back: "No: recent data show both types can infect genital and nongenital sites."
    src: { page: 162, quote: "Recent data suggest both HSV-1 and HSV-2 can affect both genital and extragenital areas." }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.027
    kind: card
    topic: herpesviruses
    front: "Where is varicella-zoster virus (HHV-3) latent?"
    back: "In the dorsal root ganglia or the trigeminal ganglia."
    src: { page: 162, quote: "Latent in dorsal root or trigeminal ganglia; CN V1 branch involvement can cause herpes zoster ophthalmicus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.218
    kind: card
    topic: herpesviruses
    front: "Involvement of which nerve branch by VZV causes herpes zoster ophthalmicus?"
    back: "CN V1, the ophthalmic branch of the trigeminal nerve."
    src: { page: 162, quote: "CN V1 branch involvement can cause herpes zoster ophthalmicus" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.219
    kind: card
    topic: herpesviruses
    front: "Which diseases does varicella-zoster virus cause?"
    back: "Chickenpox and shingles, and also encephalitis and pneumonia."
    src: { page: 162, quote: "Varicella-zoster (chickenpox D , shingles E ), encephalitis, pneumonia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.220
    kind: card
    topic: herpesviruses
    front: "What is the most common complication of shingles?"
    back: "Post-herpetic neuralgia."
    src: { page: 162, quote: "Most common complication of shingles is post- herpetic neuralgia" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.028
    kind: card
    topic: herpesviruses
    front: "What are the clinical features of infectious mononucleosis from EBV (HHV-4)?"
    back: "Fever, a big liver and spleen, sore throat, and swollen lymph nodes, most of all at the back of the neck."
    src: { page: 162, quote: "Mononucleosis—fever, hepatosplenomegaly F , pharyngitis, and lymphadenopathy (especially posterior cervical nodes); avoid contact sports until resolution due to risk of splenic rupture" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.221
    kind: card
    topic: herpesviruses
    front: "Why must a patient with mononucleosis avoid contact sports until it resolves?"
    back: "The enlarged spleen could rupture."
    src: { page: 162, quote: "avoid contact sports until resolution due to risk of splenic rupture" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.029
    kind: card
    topic: herpesviruses
    front: "Which cancers are associated with EBV?"
    back: "Lymphoma (endemic Burkitt is the classic one), cancer of the nasopharynx (mostly in adults of Asian origin), and lymphocyte overgrowth after organ transplant (lymphoproliferative disease)."
    src: { page: 162, quote: "Associated with lymphomas (eg, endemic Burkitt lymphoma), nasopharyngeal carcinoma (especially Asian adults), lymphoproliferative disease in transplant patients" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.030
    kind: cloze
    topic: herpesviruses
    text: EBV infects B cells through {{c1::CD21}} ("Must be 21 to drink Beer in a Barr"); the atypical lymphocytes on smear are reactive {{c2::cytotoxic T cells}}, not infected B cells.
    src: { page: 162, quote: "Infects B cells through CD21, “Must be 21 to drink Beer in a Barr” Atypical lymphocytes on peripheral blood smear G—not infected B cells but reactive cytotoxic T cells" }
    status: unverified
    tags: [high-yield]
  - id: mic.L05.031
    kind: card
    topic: herpesviruses
