  - id: mic.L05.095
    kind: card
    topic: hepatitis-viruses
    front: How does the HBV DNA polymerase replicate the genome?
    back: It has DNA- and RNA-dependent activities. In the nucleus it completes the partial dsDNA; host RNA polymerase transcribes mRNA from viral DNA; then the DNA polymerase reverse transcribes viral RNA to DNA.
    src: { page: 170, quote: "HBV DNA polymerase has DNA- and RNA-dependent activities. Upon entry into nucleus, the polymerase completes the partial dsDNA." }
    status: unverified
  - id: mic.L05.096
    kind: card
    topic: hepatitis-viruses
    front: Why do antibodies fail to clear HCV?
    back: HCV lacks 3'-5' exonuclease activity, so it has no proofreading; its envelope proteins vary antigenically and host antibody production lags behind new mutant strains.
    src: { page: 170, quote: "HCV lacks 3′-5′ exonuclease activity →  no proofreading ability →  antigenic variation of HCV envelope proteins." }
    status: unverified
    tags: [high-yield]
