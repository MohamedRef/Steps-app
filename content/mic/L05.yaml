  - id: mic.L05.055
    kind: card
    topic: rotavirus
    front: What is rotavirus, and how does it cause diarrhea?
    back: A segmented dsRNA virus (reovirus); the most important global cause of infantile gastroenteritis, and a major cause of winter diarrhea in day care. Villous destruction with atrophy leads to ↓ absorption of Na+ and loss of K+.
    src: { page: 165, quote: "Most important global cause of infantile gastroenteritis. Major cause of acute diarrhea in the United States during winter, especially in day care centers, kindergartens. Villous destruction with atrophy leads to ↓ absorption of Na+ and loss of K+" }
