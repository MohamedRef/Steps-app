    topic: influenza
    front: What do the hemagglutinin and neuraminidase of influenza do?
    back: Hemagglutinin binds sialic acid and promotes viral entry ("lets the virus in"). Neuraminidase promotes progeny virion release ("Neuraminidaways - sends the virus away").
    src: { page: 166, quote: "Contain hemagglutinin (binds sialic acid and promotes viral entry) and neuraminidase (promotes progeny virion release) antigens." }
