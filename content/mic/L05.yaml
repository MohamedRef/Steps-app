  - id: mic.L05.053
    kind: card
    topic: picornavirus
    front: How are picornavirus proteins made, and which picornaviruses are enteroviruses?
    back: RNA is translated into 1 large polypeptide cleaved by virus-encoded proteases into functional proteins. Poliovirus, echovirus and coxsackievirus are enteroviruses and can cause aseptic (viral) meningitis.
    src: { page: 165, quote: "RNA is translated into 1 large polypeptide that is cleaved by virus-encoded proteases into functional viral proteins. Poliovirus, echovirus, and coxsackievirus are enteroviruses and can cause aseptic (viral) meningitis." }
