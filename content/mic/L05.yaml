  # ---------- p170: hepatitis viruses ----------
  - id: mic.L05.094
    kind: card
    topic: hepatitis-viruses
    front: Which hepatitis viruses are naked, and why does it matter?
    back: HAV and HEV lack an envelope and are not destroyed by the gut ("NAkEd viruses... the vowels hit your bowels"), so they spread fecal-oral.
    src: { page: 170, quote: "NAkEd viruses (HAV and HEV) lack an envelope and are not destroyed by the gut: the vowels hit your bowels." }
    status: unverified
