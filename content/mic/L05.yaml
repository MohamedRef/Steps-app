  - id: mic.L05.085
    kind: card
    topic: rabies
    front: How does rabies reach the CNS, and how does the disease progress?
    back: After binding ACh receptors, it migrates retrograde (via dynein motors) up nerve axons. Fever, malaise, then agitation, photophobia, hydrophobia, hypersalivation, then paralysis, coma and death.
    src: { page: 169, quote: "Travels to the CNS by migrating in a retrograde fashion (via dynein motors) up nerve axons after binding to ACh receptors." }
    status: unverified
    tags: [high-yield]
