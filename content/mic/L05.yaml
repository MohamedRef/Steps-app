    tags: [high-yield]
  - id: mic.L05.058
    kind: card
    topic: influenza
    front: Which bacterial superinfections threaten patients with influenza, and how is influenza treated?
    back: Fatal bacterial superinfection, most commonly S aureus, S pneumoniae and H influenzae. Treatment is supportive +/- a neuraminidase inhibitor (oseltamivir, zanamivir).
    src: { page: 166, quote: "Patients at risk for fatal bacterial superinfection, most commonly S aureus, S pneumoniae, and H influenzae. Treatment: supportive +/– neuraminidase inhibitor (eg, oseltamivir, zanamivir)." }
