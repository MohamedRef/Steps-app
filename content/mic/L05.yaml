    front: How does SARS-CoV-2 enter cells, and how do the vaccines work?
    back: The viral spike protein attaches to ACE2 (highly expressed in lungs, intestines, heart and kidneys). mRNA and viral vector vaccines present the spike protein, leading to anti-spike antibodies.
