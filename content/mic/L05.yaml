  - id: mic.L05.088
    kind: card
    topic: ebola
    front: How does Ebola present, how is it diagnosed, and how is it spread?
    back: A filovirus. After up to 21 days, abrupt flulike symptoms, diarrhea/vomiting, high fever, myalgia, which can progress to DIC, diffuse hemorrhage and shock. RT-PCR within 48 hr of onset. Direct contact with bodily fluids, fomites (including dead bodies), infected bats or primates; high healthcare-associated infection.
    src: { page: 169, quote: "Following an incubation period of up to 21 days, presents with abrupt onset of flulike symptoms, diarrhea/vomiting, high fever, myalgia. Can progress to DIC, diffuse hemorrhage, shock." }
