    topic: rhinovirus
    front: Why doesn't rhinovirus infect the GI tract?
    back: It is acid labile, destroyed by stomach acid (unlike the other picornaviruses). Nonenveloped RNA virus, cause of the common cold, >100 serologic types.
    src: { page: 165, quote: "Acid labile—destroyed by stomach acid; therefore, does not infect the GI tract (unlike the other picornaviruses)." }
