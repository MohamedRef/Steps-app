    stem: >-
      A 33-year-old man with newly diagnosed HIV has a CD4+ count of 80 cells/mm3 and is ⊕ for Toxoplasma IgG.
      Which prophylaxis is indicated?
    options:
      - TMP-SMX, against Pneumocystis and toxoplasmosis
      - Azithromycin only
      - Fluconazole only
      - Ganciclovir
      - No prophylaxis until CD4+ <50
    answer: 0
    why:
      - "Right. Under 100 cells/mm3, TMP-SMX covers both Pneumocystis pneumonia and toxoplasmosis."
      - "Azithromycin is MAC prophylaxis."
      - "Fluconazole is for Cryptococcus suppression."
      - "Ganciclovir treats CMV."
      - "Prophylaxis is already due below 200."
