  # ---------- p196-197: antihelminthics and antivirals ----------
  - id: mic.L07.079
    kind: card
    topic: antihelminthic-therapy
    front: Which drugs are antihelminthics, and how do mebendazole and praziquantel work?
    back: Pyrantel pamoate, ivermectin, mebendazole, praziquantel, diethylcarbamazine. Mebendazole disrupts microtubules and motility ("bendy worms"); praziquantel ↑ Ca2+ permeability and vacuolization.
    src: { page: 196, quote: "Pyrantel pamoate, ivermectin, mebendazole (treats “bendy worms” by disrupting microtubules and cellular motility), praziquantel (↑ Ca2+ permeability, ↑ vacuolization), diethylcarbamazine." }
