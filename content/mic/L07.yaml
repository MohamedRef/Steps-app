  - id: mic.L07.135
    kind: mcq
    topic: pregnancy-antimicrobials
    stem: >-
      A 26-year-old woman at 20 weeks' gestation is admitted with acute pyelonephritis and receives several
      days of an IV antibiotic that is bactericidal against severe gram ⊝ rod infections, is synergistic with
      β-lactams, and cannot kill anaerobes. At term her son fails the newborn hearing screen and is found to
      have bilateral sensorineural hearing loss. What is the mechanism of the antibiotic she received?
    options:
      - "Irreversible inhibition of the initiation complex at the 30S subunit"
      - "Inhibition of dihydropteroate synthase"
      - "Inhibition of DNA gyrase and topoisomerase IV"
      - "Binding of penicillin-binding proteins"
      - "Blocking translocation at the 50S subunit"
    answer: 0
    why:
      - "Right. Aminoglycosides cause fetal ototoxicity (\"Safe children take really good care\"); they bind 30S and irreversibly inhibit the initiation complex."
      - "That is the sulfonamides, whose fetal risk is kernicterus."
      - "That is the fluoroquinolones, whose fetal risk is cartilage damage."
      - "That is the β-lactams, which are not on the avoid-in-pregnancy list."
      - "That is the macrolides; clarithromycin is the embryotoxic one."
    src: { page: 197, quote: "Aminoglycosides Ototoxicity" }
    status: unverified
