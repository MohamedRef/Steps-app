  # ---------- p183: overview, penicillin ----------
  - id: mic.L07.001
    kind: table
    topic: antimicrobial-therapy
    title: Antimicrobial targets
    columns: [Target, Drugs]
    rows:
      - [Peptidoglycan synthesis, "Glycopeptides (vancomycin), bacitracin"]
      - [Peptidoglycan cross-linking, "Penicillins, cephalosporins, carbapenems, monobactams"]
      - [Membrane integrity, "Daptomycin (gram ⊕), polymyxins (gram ⊝)"]
      - [30S subunit, "Aminoglycosides, tetracyclines, tigecycline"]
      - [50S subunit, "Chloramphenicol, clindamycin, linezolid, macrolides, streptogramins"]
      - [DNA gyrase, Fluoroquinolones]
      - [DNA integrity (free radicals), Metronidazole]
      - [mRNA synthesis (RNA polymerase), Rifampin]
      - [Folic acid synthesis, "Sulfonamides, trimethoprim"]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1]]
    src: { page: 183, quote: "Daptomycin (gram ⊕) Polymyxins (gram ⊝)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.002
    kind: card
    topic: penicillin-g-v
    front: How does penicillin work?
    back: A D-Ala-D-Ala structural analog that binds penicillin-binding proteins (transpeptidases), blocks transpeptidase cross-linking of peptidoglycan, and activates autolytic enzymes.
    src: { page: 183, quote: "D-Ala-D-Ala structural analog. Bind penicillin-binding proteins (transpeptidases). Block transpeptidase cross-linking of peptidoglycan in cell wall. Activate autolytic enzymes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.003
    kind: card
    topic: penicillin-g-v
    front: What are the uses of penicillin G and V?
    back: Mostly gram ⊕ organisms (S pneumoniae, S pyogenes, Actinomyces), also gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum). Bactericidal; β-lactamase sensitive. G is IV/IM, V is oral.
    src: { page: 183, quote: "Mostly used for gram ⊕ organisms (S pneumoniae, S pyogenes, Actinomyces). Also used for gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.004
    kind: card
    topic: penicillin-g-v
    front: What are the adverse effects of penicillin, and how do bacteria resist it?
    back: Hypersensitivity reactions, direct Coombs ⊕ hemolytic anemia, drug-induced interstitial nephritis. Resistance - β-lactamase cleaves the β-lactam ring; mutations in PBPs.
    src: { page: 183, quote: "Hypersensitivity reactions, direct Coombs ⊕ hemolytic anemia, drug-induced interstitial nephritis. RESISTANCE β-lactamase cleaves the β-lactam ring. Mutations in PBPs." }
    status: unverified
    tags: [high-yield]
  # ---------- p184: penicillins ----------
  - id: mic.L07.005
    kind: card
    topic: aminopenicillins
    front: What do ampicillin and amoxicillin cover?
    back: "HHEELPSS: H influenzae, H pylori, E coli, Enterococci, Listeria monocytogenes, Proteus mirabilis, Salmonella, Shigella. Penicillinase sensitive, so often combined with clavulanic acid. Amoxicillin has better oral bioavailability."
    src: { page: 184, quote: "Extended-spectrum penicillin—H influenzae, H pylori, E coli, Enterococci, Listeria monocytogenes, Proteus mirabilis, Salmonella, Shigella." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.006
    kind: card
    topic: aminopenicillins
    front: What are the adverse effects of the aminopenicillins?
    back: Hypersensitivity reactions, rash, pseudomembranous colitis.
    src: { page: 184, quote: "Hypersensitivity reactions, rash, pseudomembranous colitis." }
    status: unverified
  - id: mic.L07.007
    kind: card
    topic: antistaph-penicillins
    front: "Why are dicloxacillin, nafcillin and oxacillin penicillinase resistant?"
    back: "A bulky R group blocks β-lactamase access to the β-lactam ring."
    src: { page: 184, quote: "penicillinase resistant because bulky R group blocks access of β-lactamase to β-lactam ring." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.137
    kind: card
    topic: antistaph-penicillins
    front: "What are dicloxacillin, nafcillin and oxacillin used for?"
    back: "S aureus, except MRSA (\"Use naf for staph\")."
    src: { page: 184, quote: "S aureus (except MRSA). “Use naf (nafcillin) for staph.”" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.138
    kind: card
    topic: antistaph-penicillins
    front: "How does MRSA resist nafcillin and oxacillin?"
    back: "It has an altered penicillin-binding protein target site."
    src: { page: 184, quote: "MRSA has altered penicillin-binding protein target site." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.139
    kind: card
    topic: antistaph-penicillins
    front: "What are the adverse effects of the penicillinase-resistant penicillins?"
    back: "Hypersensitivity reactions, interstitial nephritis."
    src: { page: 184, quote: "Hypersensitivity reactions, interstitial nephritis." }
    status: unverified
  - id: mic.L07.008
    kind: card
    topic: piperacillin
    front: What does piperacillin cover, and what is it given with?
    back: Antipseudomonal penicillin - Pseudomonas, gram ⊝ rods, anaerobes. Penicillinase sensitive, so used with β-lactamase inhibitors.
    src: { page: 184, quote: "Penicillinase sensitive; use with β-lactamase inhibitors. CLINICAL USE Pseudomonas spp., gram ⊝ rods, anaerobes." }
    status: unverified
    tags: [high-yield]
  # ---------- p185: cephalosporins ----------
  - id: mic.L07.009
    kind: card
    topic: cephalosporins
    front: Which organisms are not covered by 1st-4th generation cephalosporins?
    back: "LAME: Listeria, Atypicals (Chlamydia, Mycoplasma), MRSA, Enterococci."
    src: { page: 185, quote: "Organisms typically not covered by 1st-4th generation cephalosporins are LAME: Listeria, Atypicals (Chlamydia, Mycoplasma), MRSA, and Enterococci." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.010
    kind: table
    topic: cephalosporins
    title: Cephalosporin generations
    columns: [Generation, Examples, Coverage and use]
    rows:
      - [1st, "Cefazolin, cephalexin", "Gram ⊕ cocci, PEcK; cefazolin before surgery for S aureus"]
      - [2nd, "Cefaclor, cefoxitin, cefuroxime, cefotetan", "Gram ⊕ cocci, HENS PEcK"]
      - [3rd, "Ceftriaxone, cefpodoxime, ceftazidime, cefixime", "Serious gram ⊝ infections; cross BBB; ceftriaxone for meningitis, gonorrhea, disseminated Lyme; ceftazidime for Pseudomonas"]
      - [4th, Cefepime, "Gram ⊝ with ↑ activity against Pseudomonas and gram ⊕"]
      - [5th, Ceftaroline, "Broad, covers MRSA and E faecalis; not Pseudomonas"]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 2], [3, 1], [4, 2]]
    src: { page: 185, quote: "5th generation (ceftaroline)—broad gram ⊕ and gram ⊝ organism coverage; unlike 1st-4th generation cephalosporins, ceftaroline covers MRSA, and Enterococcus faecalis—does not cover Pseudomonas." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.011
    kind: card
    topic: cephalosporins
    front: What are the mnemonics for 2nd generation cephalosporins?
    back: "\"2nd graders wear fake fox fur to tea parties\" (cefaclor, cefoxitin, cefuroxime, cefotetan); coverage \"HENS PEcK\" (H influenzae, Enterobacter aerogenes, Neisseria, Serratia, Proteus, E coli, Klebsiella)."
    src: { page: 185, quote: "2nd graders wear fake fox fur to tea parties. 2nd generation—⊕ HENS PEcK." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.012
    kind: card
    topic: cephalosporins
    front: What are the adverse effects of cephalosporins?
    back: Hypersensitivity, autoimmune hemolytic anemia, disulfiram-like reaction, vitamin K deficiency; ↑ nephrotoxicity of aminoglycosides. Low cross-reactivity even in penicillin-allergic patients.
    src: { page: 185, quote: "Hypersensitivity reactions, autoimmune hemolytic anemia, disulfiram-like reaction, vitamin K deficiency. Low rate of cross- reactivity even in penicillin-allergic patients." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.140
    kind: cloze
    topic: cephalosporins
    text: "Bacteria resist cephalosporins by {{c1::cephalosporinases}} (a type of β-lactamase) and by a {{c2::structural change in penicillin-binding proteins}} (transpeptidases)."
    src: { page: 185, quote: "Inactivated by cephalosporinases (a type of β-lactamase). Structural change in penicillin- binding proteins (transpeptidases)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.013
    kind: enumerate
    topic: beta-lactamase-inhibitors
    prompt: Enumerate the β-lactamase inhibitors (4).
    points:
      - Clavulanic acid
      - Avibactam
      - Sulbactam
      - Tazobactam
    pass: 4
    hook: "CAST"
    src: { page: 185, quote: "Include Clavulanic acid, Avibactam, Sulbactam, Tazobactam. Often added to penicillin antibiotics to protect the antibiotic from destruction by β-lactamase." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.014
    kind: mcq
    topic: cephalosporins
    stem: >-
      A 45-year-old man with cellulitis has blood cultures growing MRSA. The team wants a β-lactam with
      activity against this organism. Which drug is appropriate?
    options:
      - Ceftaroline
      - Cefepime
      - Ceftriaxone
      - Cefazolin
      - Nafcillin
    answer: 0
    why:
      - "Right. Ceftaroline (5th generation) covers MRSA and E faecalis, unlike 1st-4th generations."
      - "Cefepime covers Pseudomonas and gram ⊕ but not MRSA (LAME)."
      - "Ceftriaxone does not cover MRSA."
      - "Cefazolin is for MSSA and surgical prophylaxis."
      - "MRSA has an altered PBP and resists nafcillin."
    src: { page: 185, quote: "ceftaroline covers MRSA, and Enterococcus faecalis—does not cover Pseudomonas." }
    status: unverified
  # ---------- p186: carbapenems, aztreonam, vancomycin ----------
  - id: mic.L07.015
    kind: card
    topic: carbapenems
    front: Why is imipenem given with cilastatin?
    back: Cilastatin inhibits renal dehydropeptidase I, decreasing inactivation of imipenem in the renal tubules ("the kill is lastin' with cilastatin").
    src: { page: 186, quote: "Always administered with cilastatin (inhibitor of renal dehydropeptidase I) to ↓ inactivation of drug in renal tubules." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.016
    kind: card
    topic: carbapenems
    front: "What do carbapenems cover?"
    back: "Gram ⊕ cocci, gram ⊝ rods and anaerobes."
    src: { page: 186, quote: "Gram ⊕ cocci, gram ⊝ rods, and anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.141
    kind: cloze
    topic: carbapenems
    text: "Unlike other carbapenems, {{c1::ertapenem}} is not active against Pseudomonas."
    src: { page: 186, quote: "Unlike other carbapenems, ertapenem is not active against Pseudomonas." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.142
    kind: card
    topic: carbapenems
    front: "Why are carbapenems kept for life-threatening infections or after other drugs fail?"
    back: "Their wide spectrum and significant adverse effects."
    src: { page: 186, quote: "Wide spectrum and significant adverse effects limit use to life-threatening infections or after other drugs have failed." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.143
    kind: cloze
    topic: carbapenems
    text: "At high plasma levels carbapenems cause GI distress, rash, and {{c1::CNS toxicity (seizures)}}."
    src: { page: 186, quote: "GI distress, rash, and CNS toxicity (seizures) at high plasma levels." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.144
    kind: cloze
    topic: carbapenems
    text: "Of the carbapenems, {{c1::meropenem}} has a ↓ risk of seizures."
    src: { page: 186, quote: "Meropenem has a ↓ risk of seizures" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.145
    kind: cloze
    topic: carbapenems
    text: "Unlike imipenem, which needs cilastatin, meropenem is {{c1::stable to dehydropeptidase I}}."
    src: { page: 186, quote: "Meropenem has a ↓ risk of seizures and is stable to dehydropeptidase I." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.017
    kind: card
    topic: carbapenems
    front: How do bacteria resist carbapenems?
    back: Carbapenemases produced by, eg, K pneumoniae, E coli, Klebsiella aerogenes.
    src: { page: 186, quote: "Inactivated by carbapenemases produced by, eg, K pneumoniae, E coli, Klebsiella aerogenes." }
    status: unverified
  - id: mic.L07.018
    kind: card
    topic: aztreonam
    front: "How does aztreonam work?"
    back: "Binds penicillin-binding protein 3 and prevents peptidoglycan cross-linking; less susceptible to β-lactamases."
    src: { page: 186, quote: "Prevents peptidoglycan cross-linking by binding to penicillin- binding protein 3." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.146
    kind: cloze
    topic: aztreonam
    text: "Aztreonam is {{c1::synergistic}} with aminoglycosides."
    src: { page: 186, quote: "Synergistic with aminoglycosides." }
    status: unverified
  - id: mic.L07.147
    kind: card
    topic: aztreonam
    front: "Why can aztreonam be given to a patient with penicillin allergy?"
    back: "It has no cross-allergenicity with penicillins."
    src: { page: 186, quote: "No cross-allergenicity with penicillins." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.148
    kind: card
    topic: aztreonam
    front: "What does aztreonam cover?"
    back: "Gram ⊝ rods only; no activity against gram ⊕ rods or anaerobes."
    src: { page: 186, quote: "Gram ⊝ rods only—no activity against gram ⊕ rods or anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.149
    kind: card
    topic: aztreonam
    front: "Which patients is aztreonam used for?"
    back: "Penicillin-allergic patients and those with renal insufficiency who cannot tolerate aminoglycosides."
    src: { page: 186, quote: "For penicillin-allergic patients and those with renal insufficiency who cannot tolerate aminoglycosides." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.019
    kind: card
    topic: vancomycin
    front: How does vancomycin work, and what does it treat?
    back: Binds the D-Ala-D-Ala portion of cell wall precursors, inhibiting peptidoglycan formation; bactericidal (bacteriostatic against C difficile). Gram ⊕ only - MRSA, S epidermidis, sensitive Enterococcus, and C difficile (oral).
    src: { page: 186, quote: "Inhibits cell wall peptidoglycan formation by binding D-Ala-D-Ala portion of cell wall precursors." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.020
    kind: card
    topic: vancomycin
    front: What are the adverse effects of vancomycin?
    back: Nephrotoxicity, ototoxicity, thrombophlebitis, diffuse flushing (vancomycin infusion reaction, preventable with antihistamines and slower infusion), DRESS syndrome.
    src: { page: 186, quote: "nephrotoxicity, ototoxicity, thrombophlebitis, diffuse flushing (vancomycin infusion reaction A —idiopathic reaction largely preventable by pretreatment with antihistamines and slower infusion rate), DRESS syndrome." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.021
    kind: cloze
    topic: vancomycin
    text: Enterococci resist vancomycin by changing D-Ala-D-Ala to {{c1::D-Ala-D-Lac}} ("If you Lack a D-Ala (dollar), you can't ride the van").
    src: { page: 186, quote: "Occurs in bacteria (eg, Enterococcus) via amino acid modification of D-Ala-D-Ala to D-Ala-D-Lac." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.022
    kind: mcq
    topic: vancomycin
    stem: >-
      Ten minutes into an IV infusion for MRSA bacteremia, a 50-year-old man develops intense flushing and
      itching of his face, neck and upper trunk. Blood pressure is normal and he has no wheeze. What is the
      best way to prevent this next time?
    options:
      - Slower infusion with antihistamine pretreatment
      - Switch to daptomycin because this is anaphylaxis
      - Give the drug orally instead
      - Add cilastatin to the infusion
      - Coadminister probenecid
    answer: 0
    why:
      - "Right. Vancomycin infusion reaction is idiopathic and largely preventable with antihistamines and a slower infusion."
      - "This is not anaphylaxis; there is no hypotension or wheeze."
      - "Oral vancomycin is not absorbed and treats only C difficile."
      - "Cilastatin protects imipenem from renal dehydropeptidase."
      - "Probenecid is given with cidofovir."
    src: { page: 186, quote: "largely preventable by pretreatment with antihistamines and slower infusion rate" }
    status: unverified
  # ---------- p187: protein synthesis ----------
  - id: mic.L07.023
    kind: card
    topic: protein-synthesis-inhibitors
    front: Why do protein synthesis inhibitors spare human cells, and which are bactericidal?
    back: They target the bacterial 70S ribosome (30S + 50S), leaving the human 80S ribosome. All are bacteriostatic except aminoglycosides (bactericidal) and linezolid (variable).
    src: { page: 187, quote: "All are bacteriostatic, except aminoglycosides (bactericidal) and linezolid (variable)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.024
    kind: table
    topic: protein-synthesis-inhibitors
    title: 30S vs 50S inhibitors
    columns: [Subunit, Drugs]
    rows:
      - [30S, "Aminoglycosides, tetracyclines"]
      - [50S, "Chloramphenicol, clindamycin, erythromycin (macrolides), linezolid"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 187, quote: "30S inhibitors Aminoglycosides Tetracyclines “Buy at 30, ccel (sell) at 50.” 50S inhibitors Chloramphenicol, Clindamycin Erythromycin (macrolides) Linezolid" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.025
    kind: card
    topic: aminoglycosides
    front: How do aminoglycosides work, and why don't they kill anaerobes?
    back: Bactericidal; irreversibly inhibit the initiation complex by binding 30S, cause mRNA misreading and block translocation. They need O2 for uptake, so they are ineffective against anaerobes ("Mean GNATS cannot kill anaerobes").
    src: { page: 187, quote: "Require O2 for uptake; therefore ineffective against anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.026
    kind: card
    topic: aminoglycosides
    front: What are the uses and adverse effects of aminoglycosides?
    back: Severe gram ⊝ rod infections, synergistic with β-lactams; neomycin for bowel surgery. Nephrotoxicity, neuromuscular blockade (absolute contraindication in myasthenia gravis), ototoxicity (especially with loop diuretics), teratogenicity.
    src: { page: 187, quote: "Nephrotoxicity, neuromuscular blockade (absolute contraindication with myasthenia gravis), ototoxicity (especially with loop diuretics), teratogenicity." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.027
    kind: cloze
    topic: aminoglycosides
    text: Bacteria resist aminoglycosides with transferase enzymes that inactivate the drug by {{c1::acetylation, phosphorylation, or adenylation}}.
    src: { page: 187, quote: "Bacterial transferase enzymes inactivate the drug by acetylation, phosphorylation, or adenylation." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.150
    kind: enumerate
    topic: aminoglycosides
    prompt: "Enumerate the aminoglycosides (5)."
    points:
      - "Gentamicin"
      - "Neomycin"
      - "Amikacin"
      - "Tobramycin"
      - "Streptomycin"
    pass: 4
    hook: "GNATS: الـ \"Mean\" GNATS ما بتقتلش الـ anaerobes"
    src: { page: 187, quote: "Gentamicin, Neomycin, Amikacin, Tobramycin, Streptomycin." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.028
    kind: mcq
    topic: aminoglycosides
    stem: >-
      A 70-year-old woman with gram-negative sepsis is treated with gentamicin and IV furosemide for fluid
      overload. Five days later she complains of ringing in her ears and unsteadiness, and her creatinine has
      doubled. Which other condition is an absolute contraindication to this antibiotic?
    options:
      - Myasthenia gravis
      - G6PD deficiency
      - Penicillin allergy
      - Prolonged QT interval
      - Pregnancy-related cholestasis
    answer: 0
    why:
      - "Right. Aminoglycosides cause neuromuscular blockade, an absolute contraindication in myasthenia gravis; ototoxicity is worse with loop diuretics."
      - "G6PD deficiency matters for sulfonamides, dapsone and primaquine."
      - "Penicillin allergy does not preclude aminoglycosides."
      - "QT prolongation matters for macrolides and fluoroquinolones."
      - "Cholestasis is a macrolide adverse effect."
    src: { page: 187, quote: "neuromuscular blockade (absolute contraindication with myasthenia gravis)" }
    status: unverified
  # ---------- p188: tetracyclines to clindamycin ----------
  - id: mic.L07.029
    kind: card
    topic: tetracyclines
    front: How do tetracyclines work, and what must they not be taken with?
