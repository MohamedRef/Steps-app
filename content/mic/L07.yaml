items:
  # ---------- p183: overview, penicillin ----------
  - id: mic.L07.001
    kind: table
    topic: antimicrobial-therapy
    title: Antimicrobial targets
    columns: [Target, Drugs]
    rows:
      - [Peptidoglycan synthesis, "Glycopeptides (vancomycin), bacitracin"]
      - [Peptidoglycan cross-linking, "Penicillins, cephalosporins, carbapenems, monobactams"]
      - [Membrane integrity, "Daptomycin (gram ⊕), polymyxins (gram ⊝)"]
      - [30S subunit, "Aminoglycosides, tetracyclines, tigecycline"]
      - [50S subunit, "Chloramphenicol, clindamycin, linezolid, macrolides, streptogramins"]
      - [DNA gyrase, Fluoroquinolones]
      - [DNA integrity (free radicals), Metronidazole]
      - [mRNA synthesis (RNA polymerase), Rifampin]
      - [Folic acid synthesis, "Sulfonamides, trimethoprim"]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1]]
    src: { page: 183, quote: "Daptomycin (gram ⊕) Polymyxins (gram ⊝)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.002
    kind: card
    topic: penicillin-g-v
    front: How does penicillin work?
    back: A D-Ala-D-Ala structural analog that binds penicillin-binding proteins (transpeptidases), blocks transpeptidase cross-linking of peptidoglycan, and activates autolytic enzymes.
    src: { page: 183, quote: "D-Ala-D-Ala structural analog. Bind penicillin-binding proteins (transpeptidases). Block transpeptidase cross-linking of peptidoglycan in cell wall. Activate autolytic enzymes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.003
    kind: card
    topic: penicillin-g-v
    front: "Which gram ⊕ organisms are penicillin G and V mostly used for?"
    back: "S pneumoniae, S pyogenes, Actinomyces."
    src: { page: 183, quote: "Mostly used for gram ⊕ organisms (S pneumoniae, S pyogenes, Actinomyces). Also used for gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.192
    kind: card
    topic: penicillin-g-v
    front: "Besides gram ⊕ organisms, what else do penicillin G and V treat?"
    back: "Gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum)."
    src: { page: 183, quote: "gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.193
    kind: cloze
    topic: penicillin-g-v
    text: "Penicillin G and V are {{c1::bactericidal}} for gram ⊕ cocci, gram ⊕ rods, gram ⊝ cocci, and spirochetes."
    src: { page: 183, quote: "Bactericidal for gram ⊕ cocci" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.194
    kind: cloze
    topic: penicillin-g-v
    text: "Penicillin G and V are β-lactamase {{c1::sensitive}}."
    src: { page: 183, quote: "β-lactamase sensitive." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.195
    kind: card
    topic: penicillin-g-v
    front: "How are penicillin G and penicillin V given?"
    back: "Penicillin G IV or IM; penicillin V orally."
    src: { page: 183, quote: "Penicillin G (IV and IM form), penicillin V (oral)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.004
    kind: card
    topic: penicillin-g-v
    front: "What are the adverse effects of penicillin?"
    back: "Allergic (hypersensitivity) reactions, hemolytic anemia with a positive direct Coombs test, and interstitial nephritis caused by the drug."
    src: { page: 183, quote: "Hypersensitivity reactions, direct Coombs ⊕ hemolytic anemia, drug-induced interstitial nephritis. RESISTANCE β-lactamase cleaves the β-lactam ring. Mutations in PBPs." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.196
    kind: cloze
    topic: penicillin-g-v
    text: "Bacteria resist penicillin when {{c1::β-lactamase}} cleaves the β-lactam ring, or by {{c2::mutations in PBPs}}."
    src: { page: 183, quote: "β-lactamase cleaves the β-lactam ring. Mutations in PBPs." }
    status: unverified
    tags: [high-yield]
  # ---------- p184: penicillins ----------
  - id: mic.L07.005
    kind: card
    topic: aminopenicillins
    front: "What do ampicillin and amoxicillin cover?"
    back: "HHEELPSS: H influenzae, H pylori, E coli, Enterococci, Listeria monocytogenes, Proteus mirabilis, Salmonella, Shigella."
    src: { page: 184, quote: "Extended-spectrum penicillin—H influenzae, H pylori, E coli, Enterococci, Listeria monocytogenes, Proteus mirabilis, Salmonella, Shigella." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.197
    kind: card
    topic: aminopenicillins
    front: "Why are ampicillin and amoxicillin often combined with clavulanic acid?"
    back: "They are penicillinase sensitive; clavulanic acid protects them from destruction by β-lactamase."
    src: { page: 184, quote: "Also combine with clavulanic acid" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.198
    kind: card
    topic: aminopenicillins
    front: "Which aminopenicillin has the better oral bioavailability?"
    back: "Amoxicillin (greater than ampicillin)."
    src: { page: 184, quote: "Amoxicillin has greater oral bioavailability than ampicillin." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.006
    kind: card
    topic: aminopenicillins
    front: What are the adverse effects of the aminopenicillins?
    back: Allergic (hypersensitivity) reactions, a skin rash, and pseudomembranous colitis.
    src: { page: 184, quote: "Hypersensitivity reactions, rash, pseudomembranous colitis." }
    status: unverified
  - id: mic.L07.007
    kind: card
    topic: antistaph-penicillins
    front: "Why are dicloxacillin, nafcillin and oxacillin penicillinase resistant?"
    back: "A bulky R group blocks β-lactamase access to the β-lactam ring."
    src: { page: 184, quote: "penicillinase resistant because bulky R group blocks access of β-lactamase to β-lactam ring." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.137
    kind: card
    topic: antistaph-penicillins
    front: "What are dicloxacillin, nafcillin and oxacillin used for?"
    back: "S aureus, except MRSA (\"Use naf for staph\")."
    src: { page: 184, quote: "S aureus (except MRSA). “Use naf (nafcillin) for staph.”" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.138
    kind: card
    topic: antistaph-penicillins
    front: "How does MRSA resist nafcillin and oxacillin?"
    back: "It has an altered penicillin-binding protein target site."
    src: { page: 184, quote: "MRSA has altered penicillin-binding protein target site." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.139
    kind: card
    topic: antistaph-penicillins
    front: "What are the adverse effects of the penicillinase-resistant penicillins?"
    back: "Drug allergy (hypersensitivity) and interstitial nephritis of the kidney."
    src: { page: 184, quote: "Hypersensitivity reactions, interstitial nephritis." }
    status: unverified
  - id: mic.L07.008
    kind: card
    topic: piperacillin
    front: "What does piperacillin cover?"
    back: "Pseudomonas, gram ⊝ rods, anaerobes (an antipseudomonal penicillin)."
    src: { page: 184, quote: "Penicillinase sensitive; use with β-lactamase inhibitors. CLINICAL USE Pseudomonas spp., gram ⊝ rods, anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.199
    kind: card
    topic: piperacillin
    front: "Why is piperacillin used with a β-lactamase inhibitor?"
    back: "It is penicillinase sensitive."
    src: { page: 184, quote: "Penicillinase sensitive; use with β-lactamase inhibitors." }
    status: unverified
    tags: [high-yield]
  # ---------- p185: cephalosporins ----------
  - id: mic.L07.009
    kind: card
    topic: cephalosporins
    front: Which organisms are not covered by 1st-4th generation cephalosporins?
    back: "LAME: Listeria, Atypicals (Chlamydia, Mycoplasma), MRSA, Enterococci."
    src: { page: 185, quote: "Organisms typically not covered by 1st-4th generation cephalosporins are LAME: Listeria, Atypicals (Chlamydia, Mycoplasma), MRSA, and Enterococci." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.010
    kind: table
    topic: cephalosporins
    title: Cephalosporin generations
    columns: [Generation, Examples, Coverage and use]
    rows:
      - [1st, "Cefazolin, cephalexin", "Gram ⊕ cocci, PEcK; cefazolin before surgery for S aureus"]
      - [2nd, "Cefaclor, cefoxitin, cefuroxime, cefotetan", "Gram ⊕ cocci, HENS PEcK"]
      - [3rd, "Ceftriaxone, cefpodoxime, ceftazidime, cefixime", "Serious gram ⊝ infections; cross BBB; ceftriaxone for meningitis, gonorrhea, disseminated Lyme; ceftazidime for Pseudomonas"]
      - [4th, Cefepime, "Gram ⊝ with ↑ activity against Pseudomonas and gram ⊕"]
      - [5th, Ceftaroline, "Broad, covers MRSA and E faecalis; not Pseudomonas"]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 2], [3, 1], [4, 2]]
    src: { page: 185, quote: "5th generation (ceftaroline)—broad gram ⊕ and gram ⊝ organism coverage; unlike 1st-4th generation cephalosporins, ceftaroline covers MRSA, and Enterococcus faecalis—does not cover Pseudomonas." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.011
    kind: card
    topic: cephalosporins
    front: "What is First Aid's mnemonic for the 2nd generation cephalosporin drugs?"
    back: "\"2nd graders wear fake fox fur to tea parties\": cefaclor, cefoxitin, cefuroxime, cefotetan."
    src: { page: 185, quote: "2nd graders wear fake fox fur to tea parties. 2nd generation—⊕ HENS PEcK." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.200
    kind: card
    topic: cephalosporins
    front: "What is First Aid's mnemonic for 2nd generation cephalosporin coverage?"
    back: "Gram ⊕ cocci plus HENS PEcK: H influenzae, Enterobacter aerogenes, Neisseria, Serratia, Proteus mirabilis, E coli, Klebsiella pneumoniae."
    src: { page: 185, quote: "2nd generation—⊕ HENS PEcK." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.012
    kind: card
    topic: cephalosporins
    front: What are the adverse effects of cephalosporins?
    back: Allergic (hypersensitivity) reactions, autoimmune hemolytic anemia, a disulfiram-like reaction with alcohol, and vitamin K deficiency.
    src: { page: 185, quote: "Hypersensitivity reactions, autoimmune hemolytic anemia, disulfiram-like reaction, vitamin K deficiency. Low rate of cross- reactivity even in penicillin-allergic patients." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.140
    kind: cloze
    topic: cephalosporins
    text: "Bacteria resist cephalosporins by {{c1::cephalosporinases}} (a type of β-lactamase) and by a {{c2::structural change in penicillin-binding proteins}} (transpeptidases)."
    src: { page: 185, quote: "Inactivated by cephalosporinases (a type of β-lactamase). Structural change in penicillin- binding proteins (transpeptidases)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.270
    kind: cloze
    topic: cephalosporins
    text: "Cephalosporins are {{c1::bactericidal}}."
    src: { page: 185, quote: "β-lactam drugs that inhibit cell wall synthesis but are less susceptible to penicillinases. Bactericidal." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.271
    kind: cloze
    topic: cephalosporins
    text: "Cephalosporins are β-lactams that are {{c1::less susceptible}} to penicillinases than penicillins."
    src: { page: 185, quote: "β-lactam drugs that inhibit cell wall synthesis but are less susceptible to penicillinases." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.272
    kind: cloze
    topic: cephalosporins
    text: "Cephalosporins ↑ the {{c1::nephrotoxicity}} of aminoglycosides."
    src: { page: 185, quote: "↑ nephrotoxicity of aminoglycosides." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.273
    kind: card
    topic: cephalosporins
    front: "How often do cephalosporins cross-react in a patient with penicillin allergy?"
    back: "Rarely: the cross-reactivity rate is low, even in penicillin-allergic patients."
    src: { page: 185, quote: "Low rate of cross- reactivity even in penicillin-allergic patients." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.013
    kind: enumerate
    topic: beta-lactamase-inhibitors
    prompt: Enumerate the β-lactamase inhibitors (4).
    points:
      - Clavulanic acid
      - Avibactam
      - Sulbactam
      - Tazobactam
    pass: 4
    hook: "CAST"
    src: { page: 185, quote: "Include Clavulanic acid, Avibactam, Sulbactam, Tazobactam. Often added to penicillin antibiotics to protect the antibiotic from destruction by β-lactamase." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.014
    kind: mcq
    topic: cephalosporins
    stem: >-
      A 45-year-old man with type 2 diabetes comes to the emergency department with 3 days of a spreading,
      warm, tender red swelling of his left lower leg. Temperature is 38.9°C. Blood cultures grow gram ⊕
      cocci in clusters that are resistant to oxacillin. He is started on the one IV cephalosporin that is
      active against this isolate. Besides this organism, which of the following does that drug also cover,
      unlike 1st-4th generation cephalosporins?
    options:
      - Enterococcus faecalis
      - Pseudomonas aeruginosa
      - Listeria monocytogenes
      - Mycoplasma pneumoniae
      - Chlamydia pneumoniae
    answer: 0
    why:
      - "Right. The isolate is MRSA, and the drug is ceftaroline (5th generation), which covers MRSA and E faecalis, unlike 1st-4th generations."
      - "Ceftaroline does not cover Pseudomonas; cefepime and ceftazidime do."
      - "Listeria is the L of LAME; the book credits ceftaroline only with MRSA and E faecalis beyond the older generations."
      - "Mycoplasma is an atypical (the A of LAME), not covered by cephalosporins."
      - "Chlamydia is also an atypical (LAME); macrolides or tetracyclines treat it."
    src: { page: 185, quote: "ceftaroline covers MRSA, and Enterococcus faecalis—does not cover Pseudomonas." }
    status: unverified
  # ---------- p186: carbapenems, aztreonam, vancomycin ----------
  - id: mic.L07.015
    kind: card
    topic: carbapenems
    front: Why is imipenem given with cilastatin?
    back: Cilastatin inhibits renal dehydropeptidase I, decreasing inactivation of imipenem in the renal tubules ("the kill is lastin' with cilastatin").
    src: { page: 186, quote: "Always administered with cilastatin (inhibitor of renal dehydropeptidase I) to ↓ inactivation of drug in renal tubules." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.016
    kind: card
    topic: carbapenems
    front: "What do carbapenems cover?"
    back: "Gram ⊕ cocci, gram ⊝ rods and anaerobes."
    src: { page: 186, quote: "Gram ⊕ cocci, gram ⊝ rods, and anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.141
    kind: cloze
    topic: carbapenems
    text: "Unlike other carbapenems, {{c1::ertapenem}} is not active against Pseudomonas."
    src: { page: 186, quote: "Unlike other carbapenems, ertapenem is not active against Pseudomonas." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.142
    kind: card
    topic: carbapenems
    front: "Why are carbapenems kept for life-threatening infections or after other drugs fail?"
    back: "Their wide spectrum and significant adverse effects."
    src: { page: 186, quote: "Wide spectrum and significant adverse effects limit use to life-threatening infections or after other drugs have failed." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.143
    kind: cloze
    topic: carbapenems
    text: "At high plasma levels carbapenems cause GI distress, rash, and {{c1::CNS toxicity (seizures)}}."
    src: { page: 186, quote: "GI distress, rash, and CNS toxicity (seizures) at high plasma levels." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.144
    kind: cloze
    topic: carbapenems
    text: "Of the carbapenems, {{c1::meropenem}} has a ↓ risk of seizures."
    src: { page: 186, quote: "Meropenem has a ↓ risk of seizures" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.145
    kind: cloze
    topic: carbapenems
    text: "Unlike imipenem, which needs cilastatin, meropenem is {{c1::stable to dehydropeptidase I}}."
    src: { page: 186, quote: "Meropenem has a ↓ risk of seizures and is stable to dehydropeptidase I." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.017
    kind: card
    topic: carbapenems
    front: How do bacteria resist carbapenems?
    back: Carbapenemases produced by, eg, K pneumoniae, E coli, Klebsiella aerogenes.
    src: { page: 186, quote: "Inactivated by carbapenemases produced by, eg, K pneumoniae, E coli, Klebsiella aerogenes." }
    status: unverified
  - id: mic.L07.274
    kind: cloze
    topic: carbapenems
    text: "{{c1::Imipenem}} is a broad-spectrum, β-lactamase–resistant carbapenem."
    src: { page: 186, quote: "Imipenem is a broad-spectrum, β-lactamase–resistant carbapenem." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.018
    kind: card
    topic: aztreonam
    front: "How does aztreonam work?"
    back: "Binds penicillin-binding protein 3 and prevents peptidoglycan cross-linking; less susceptible to β-lactamases."
    src: { page: 186, quote: "Prevents peptidoglycan cross-linking by binding to penicillin- binding protein 3." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.146
    kind: cloze
    topic: aztreonam
    text: "Aztreonam is {{c1::synergistic}} with aminoglycosides."
    src: { page: 186, quote: "Synergistic with aminoglycosides." }
    status: unverified
  - id: mic.L07.147
    kind: card
    topic: aztreonam
    front: "Why can aztreonam be given to a patient with penicillin allergy?"
    back: "It has no cross-allergenicity with penicillins."
    src: { page: 186, quote: "No cross-allergenicity with penicillins." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.148
    kind: card
    topic: aztreonam
    front: "What does aztreonam cover?"
    back: "Gram ⊝ rods only; no activity against gram ⊕ rods or anaerobes."
    src: { page: 186, quote: "Gram ⊝ rods only—no activity against gram ⊕ rods or anaerobes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.149
    kind: card
    topic: aztreonam
    front: "Which patients is aztreonam used for?"
    back: "Patients allergic to penicillin, and patients whose renal insufficiency rules out an aminoglycoside."
    src: { page: 186, quote: "For penicillin-allergic patients and those with renal insufficiency who cannot tolerate aminoglycosides." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.276
    kind: card
    topic: aztreonam
    front: "What are the adverse effects of aztreonam?"
    back: "Few: it is usually nontoxic, with occasional GI upset."
    src: { page: 186, quote: "Usually nontoxic; occasional GI upset." }
    status: unverified
  - id: mic.L07.019
    kind: card
    topic: vancomycin
    front: "How does vancomycin work?"
    back: "It binds the D-Ala-D-Ala portion of cell wall precursors, inhibiting peptidoglycan formation."
    src: { page: 186, quote: "Inhibits cell wall peptidoglycan formation by binding D-Ala-D-Ala portion of cell wall precursors." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.201
    kind: cloze
    topic: vancomycin
    text: "Vancomycin is bactericidal against most bacteria but {{c1::bacteriostatic}} against C difficile."
    src: { page: 186, quote: "bacteriostatic against C difficile" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.275
    kind: cloze
    topic: vancomycin
    text: "Vancomycin is {{c1::not susceptible}} to β-lactamases."
    src: { page: 186, quote: "Not susceptible to β-lactamases." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.202
    kind: card
    topic: vancomycin
    front: "What does vancomycin treat?"
    back: "Serious multidrug-resistant gram ⊕ bugs only: MRSA, S epidermidis, sensitive Enterococcus, and C difficile (oral route)."
    src: { page: 186, quote: "Gram ⊕ bugs only" }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.020
    kind: card
    topic: vancomycin
