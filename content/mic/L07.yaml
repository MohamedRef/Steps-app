  - id: mic.L07.080
    kind: card
    topic: neuraminidase-inhibitors
    front: How do oseltamivir and zanamivir work, and when should they be started?
    back: Inhibit influenza neuraminidase, ↓ release of progeny virus. Treat and prevent influenza A and B; starting within 48 hours of symptom onset may shorten illness.
    src: { page: 196, quote: "Inhibit influenza neuraminidase →  ↓ release of progeny virus. CLINICAL USE Treatment and prevention of influenza A and B." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.081
    kind: card
    topic: baloxavir
    front: How does baloxavir work?
    back: Inhibits the "cap snatching" endonuclease of the influenza RNA polymerase (transfer of the 5' cap from cell mRNA to viral mRNA), ↓ viral replication; shortens illness if started within 48 hours.
    src: { page: 196, quote: "Inhibits the “cap snatching” (transfer of the 5′ cap from cell mRNA onto viral mRNA) endonuclease activity of the influenza virus RNA polymerase" }
