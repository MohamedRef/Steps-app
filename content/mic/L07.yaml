      The infection-control team of a teaching hospital must sterilize heat-sensitive endoscopes that cannot
      be autoclaved, and the method must also kill spores. They choose ethylene oxide. What is the mechanism
      of this agent?
    options:
      - "Alkylation"
      - "Free radical oxidation"
      - "Protein denaturation and membrane disruption"
      - "Halogenation of DNA, RNA and proteins"
      - "Impaired membrane permeability"
    answer: 0
    why:
      - "Right. Ethylene oxide is an alkylating agent and is sporicidal."
      - "That is hydrogen peroxide, which is also sporicidal but works by free radical oxidation."
      - "That is the alcohols, which are not sporicidal."
      - "That is iodine and iodophors."
      - "That is the quaternary amines, which are not sporicidal."
    src: { page: 197, quote: "Ethylene oxidea Alkylating agent." }
