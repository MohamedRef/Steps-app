  # ---------- p194-195: antifungals and others ----------
  - id: mic.L07.067
    kind: card
    topic: amphotericin-b
    front: How does amphotericin B work, and what is it used for?
    back: Binds ergosterol (unique to fungi) and forms membrane pores that leak electrolytes ("tears holes"). Serious systemic mycoses - Cryptococcus (± flucytosine for meningitis), Blastomyces, Coccidioides, Histoplasma, Candida, Mucor; intrathecal for coccidioidal meningitis.
    src: { page: 194, quote: "Binds ergosterol (unique to fungi); forms membrane pores that allow leakage of electrolytes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L07.068
    kind: card
    topic: amphotericin-b
    front: What are the adverse effects of amphotericin B, and how are they reduced?
    back: Fever/chills ("shake and bake"), hypotension, nephrotoxicity, arrhythmias, anemia, IV phlebitis ("amphoterrible"). Supplement K+ and Mg2+; hydration ↓ nephrotoxicity; liposomal form ↓ toxicity.
    src: { page: 194, quote: "Fever/chills (“shake and bake”), hypotension, nephrotoxicity, arrhythmias, anemia, IV phlebitis (“amphoterrible”). Hydration ↓ nephrotoxicity. Liposomal amphotericin ↓ toxicity." }
