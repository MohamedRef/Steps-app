    topic: antituberculous-drugs
    stem: >-
      A 45-year-old woman started on 4-drug therapy for pulmonary tuberculosis 2 months ago now has burning and
      numbness in her feet. She also notices her urine is orange. Which supplement would have prevented her
      neuropathy?
    options:
      - Pyridoxine (vitamin B6)
      - Folinic acid
      - Vitamin K
      - Thiamine (vitamin B1)
      - Vitamin B12
    answer: 0
    why:
      - "Right. Isoniazid causes vitamin B6 deficiency with peripheral neuropathy; give pyridoxine. The orange urine is rifampin."
      - "Folinic acid (leucovorin) reduces trimethoprim marrow toxicity."
      - "Vitamin K deficiency is linked to cephalosporins."
      - "Thiamine is not the issue with INH."
      - "B12 deficiency comes from Diphyllobothrium, not TB drugs."
    src: { page: 192, quote: "Administer with pyridoxine (vitamin B6)" }
    status: unverified
  - id: mic.L07.065
    kind: mcq
    topic: antituberculous-drugs
    stem: >-
      A 52-year-old man from Egypt with cavitary pulmonary tuberculosis started 4-drug therapy 2 months ago.
      At a routine visit he says colors look washed out. On examination his visual acuity has fallen from 6/6
      to 6/18 in both eyes, and he cannot tell red from green on the color plates. Fundoscopy is normal. Which
      drug is responsible, and what is its target?
    options:
      - "Ethambutol; arabinosyltransferase"
      - "Isoniazid; mycolic acid synthesis"
      - "Rifampin; DNA-dependent RNA polymerase"
      - "Pyrazinamide; uncertain target, works at acidic pH"
      - "Streptomycin; 30S ribosomal subunit"
    answer: 0
    why:
      - "Right. Ethambutol (\"eyethambutol\") inhibits arabinosyltransferase and causes optic neuropathy with red-green color blindness or ↓ visual acuity."
      - "Isoniazid causes peripheral neuropathy and hepatotoxicity, not optic neuropathy."
      - "Rifampin causes red-orange body fluids and CYP450 induction."
      - "Pyrazinamide causes hepatotoxicity and hyperuricemia."
      - "Streptomycin is an aminoglycoside; its toxicity is ototoxicity, not color blindness."
    src: { page: 192, quote: "Optic neuropathy (red-green color blindness or ↓ visual acuity, typically reversible) Pronounce “eyethambutol”" }
    status: unverified
