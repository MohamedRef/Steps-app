    tags: [high-yield]
  - id: mic.L02.010
    kind: card
    topic: staphylococcus-aureus
    front: What makes MRSA resistant, and what does Panton-Valentine leukocidin do?
    back: Altered penicillin-binding proteins, conferred by the mecA gene. Panton-Valentine leukocidin (PVL), released by some strains, kills leukocytes and causes tissue necrosis.
    src: { page: 133, quote: "Resistance due to altered penicillin- binding proteins (conferred by mecA gene). Some strains release Panton-Valentine leukocidin (PVL), which kills leukocytes and causes tissue necrosis." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.011
    kind: card
    topic: staphylococcus-aureus
    front: "What are the clinical features of staphylococcal toxic shock syndrome?"
    back: "Fever, vomiting, diarrhea, rash, desquamation, shock and end-organ failure."
    src: { page: 133, quote: "fever, vomiting, diarrhea, rash, desquamation, shock, end-organ failure. TSS results in ↑ AST, ↑ ALT, ↑ bilirubin. Associated with prolonged use of vaginal tampons or nasal packing." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.264
    kind: card
    topic: staphylococcus-aureus
    front: "Which lab abnormalities does staphylococcal toxic shock syndrome cause?"
    back: "Raised liver tests: ↑ AST, ↑ ALT and ↑ bilirubin."
    src: { page: 133, quote: "TSS results in ↑ AST, ↑ ALT, ↑ bilirubin." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.265
    kind: card
    topic: staphylococcus-aureus
    front: "What is staphylococcal toxic shock syndrome associated with?"
    back: "Tampons or nasal packing left in for a long time."
    src: { page: 133, quote: "Associated with prolonged use of vaginal tampons or nasal packing." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.266
    kind: card
    topic: staphylococcus-aureus
    front: "What setting does S pyogenes toxic shock–like syndrome come with, compared with staphylococcal TSS?"
    back: "A painful skin infection (staphylococcal TSS: tampons or nasal packing)."
    src: { page: 133, quote: "Compare with Streptococcus pyogenes TSS (a toxic shock–like syndrome associated with painful skin infection)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.268
    kind: card
    topic: staphylococcus-aureus
    front: "How important is MRSA as a cause of infection?"
    back: "A major one: it causes serious infections picked up both in hospitals and in the community."
    src: { page: 133, quote: "MRSA (methicillin-resistant S aureus)— important cause of serious healthcare- associated and community-acquired infections." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.012
    kind: card
    topic: staphylococcus-aureus
    front: Why does S aureus food poisoning start so quickly, and why doesn't cooking prevent it?
    back: It is caused by ingestion of preformed toxin, so the incubation is short (2-6 hr), followed by nonbloody diarrhea and emesis. The enterotoxin is heat stable, so cooking doesn't destroy it.
    src: { page: 133, quote: "S aureus food poisoning due to ingestion of preformed toxin → short incubation period (2-6 hr) followed by nonbloody diarrhea and emesis. Enterotoxin is heat stable → not destroyed by cooking." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.013
    kind: cloze
    topic: staphylococcus-aureus
    text: S aureus makes {{c1::coagulase}} and forms a {{c2::fibrin clot}} around itself, giving an {{c3::abscess}}.
    src: { page: 133, quote: "S aureus makes coagulase and toxins. Forms fibrin clot around itself → abscess." }
    status: unverified
  - id: mic.L02.014
    kind: mcq
    topic: staphylococcus-aureus
    stem: >-
      A 34-year-old woman has vomiting and abdominal cramps 3 hours after a picnic where she ate potato
      salad with mayonnaise that had been left in the sun. The salad had been reheated before serving.
      Several other guests are ill too. She has no fever or bloody stools. Which feature of the toxin explains why reheating did not
      prevent the illness?
    options:
      - It is a heat-stable preformed enterotoxin
      - It is produced only after spores germinate in the gut
      - It is a lipid A endotoxin
      - It requires invasion of the intestinal mucosa
      - It is a superantigen that needs T cells to act
    answer: 0
    why:
      - "Right. S aureus enterotoxin is preformed in the food and heat stable, so cooking doesn't destroy it; onset is 2-6 hr."
      - "Spores germinating in the gut is infant botulism. C perfringens spores germinate in food left standing, and its illness starts late (10-12 hr)."
      - "Lipid A endotoxin belongs to gram ⊝ bacteria; S aureus is gram ⊕."
      - "There is no invasion; the illness is toxin-mediated and nonbloody."
      - "Heat stability, not superantigen action, explains why reheating failed."
    src: { page: 133, quote: "Enterotoxin is heat stable → not destroyed by cooking." }
    status: unverified
  - id: mic.L02.015
    kind: mcq
    topic: staphylococcus-aureus
    stem: >-
      A 30-year-old man has a large, painful, fluctuant abscess on his thigh that grew from what he
      thought was a spider bite. Culture grows gram-positive cocci in clusters that are catalase and
      coagulase positive and resistant to oxacillin. What is the mechanism of this resistance?
    options:
      - Altered penicillin-binding proteins encoded by mecA
      - β-lactamase in the periplasm
      - Efflux pumps
      - Altered peptidoglycan precursors encoded by vanA
      - Loss of porins in the outer membrane
    answer: 0
    why:
      - "Right. MRSA has altered penicillin-binding proteins conferred by mecA."
      - "S aureus is gram ⊕ and has no periplasm; plain β-lactamase doesn't resist oxacillin."
      - "Efflux is the resistance route for tetracyclines and others, not methicillin."
      - "vanA gives vancomycin resistance."
      - "Porins are in the gram ⊝ outer membrane."
    src: { page: 133, quote: "Resistance due to altered penicillin- binding proteins (conferred by mecA gene)." }
    status: unverified
  - id: mic.L02.192
    kind: card
    topic: staphylococcus-aureus
    front: "How does TSST-1 cause toxic shock syndrome?"
    back: "It is a superantigen: it binds MHC II and the T-cell receptor together, causing polyclonal T-cell activation and cytokine release."
    src: { page: 133, quote: "TSST-1 is a superantigen that binds to MHC II and T-cell receptor, resulting in polyclonal T-cell activation and cytokine release." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.193
    kind: cloze
    topic: staphylococcus-aureus
    text: "S aureus commonly colonizes the skin, {{c1::nares}}, ears, {{c2::axilla}} and {{c3::groin}}."
    src: { page: 133, quote: "Commonly colonizes the skin, nares, ears, axilla, and groin." }
    status: unverified
    tags: [high-yield]
