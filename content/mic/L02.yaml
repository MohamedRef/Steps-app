  # ---------- p132: gram-positive lab algorithm ----------
  - id: mic.L02.001
    kind: table
    topic: gram-positive-lab-algorithm
    title: Gram-positive cocci by hemolysis and the next test
    columns: [Hemolysis, Next test, Result]
    rows:
      - ["α (partial, green)", Optochin sensitivity and bile solubility, "Sensitive/soluble: S pneumoniae (encapsulated); resistant/insoluble: viridans strep (S mutans, S mitis)"]
      - ["β (complete, clear)", Bacitracin sensitivity and PYR, "Sensitive: group A (S pyogenes); resistant: group B (S agalactiae)"]
      - ["γ (none, grows in bile)", Growth in 6.5% NaCl and PYR, "Grows: Enterococcus (E faecium, E faecalis); doesn't: nonenterococcus (S gallolyticus)"]
    blanks: [[0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]]
    src: { page: 132, quote: "Optochin sensitiVity and bile solubility Bacitracin sensitiVity and PYR status GroWth in 6.5% NaCl and PYR Status NoVobiocin sensitiVity" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.002
    kind: card
    topic: gram-positive-lab-algorithm
    front: "Which test separates staphylococci from streptococci in the gram ⊕ cocci algorithm?"
    back: "Catalase: staphylococci are catalase ⊕ (clusters); streptococci are catalase ⊝ (pairs or chains)."
    src: { page: 132, quote: "Hemolysis Coagulase Catalase" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.003
    kind: card
    topic: gram-positive-lab-algorithm
    front: Which gram ⊕ bacilli form branching filaments, and how are they separated?
    back: "Aerobic: Nocardia (weakly acid fast). Anaerobic: Actinomyces (not acid fast)."
    src: { page: 132, quote: "Nocardia (Weakly acid fast) Actinomyces (not acid fast)" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.260
    kind: card
    topic: gram-positive-lab-algorithm
    front: "In the gram ⊕ cocci algorithm, which test separates S aureus from the other staphylococci?"
    back: "Coagulase: S aureus is coagulase ⊕; S epidermidis and S saprophyticus are coagulase ⊝."
    src: { page: 132, quote: "Coagulase Catalase" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.261
    kind: card
    topic: gram-positive-lab-algorithm
    front: "Which test separates S epidermidis from S saprophyticus?"
    back: "Novobiocin: S epidermidis is sensitive, S saprophyticus is resistant."
    src: { page: 132, quote: "NoVobiocin sensitiVity" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.262
    kind: card
    topic: gram-positive-lab-algorithm
    front: "Which non-branching gram ⊕ bacilli are aerobic in the algorithm?"
    back: "Listeria, Bacillus and Corynebacterium."
    src: { page: 132, quote: "Bacilli Listeria Bacillus Corynebacterium" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.263
    kind: card
    topic: gram-positive-lab-algorithm
    front: "Which non-branching gram ⊕ bacilli are anaerobic in the algorithm?"
    back: "Clostridium and Cutibacterium (formerly Propionibacterium)."
    src: { page: 132, quote: "Cutibacterium (formerly Propionibacterium) Clostridium" }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.004
    kind: mcq
    topic: gram-positive-lab-algorithm
    stem: >-
      A 6-year-old boy has fever and a sore throat with tonsillar exudates. A throat culture grows
      gram-positive cocci in chains that produce a clear zone of hemolysis on blood agar and are
      catalase negative. Which additional result identifies the organism as group A streptococcus?
    options:
      - Bacitracin sensitive and PYR positive
      - Optochin sensitive and bile soluble
      - Growth in 6.5% NaCl
      - Novobiocin resistant
      - Coagulase positive
    answer: 0
    why:
      - "Right. β-hemolytic strep are split by bacitracin and PYR: group A (S pyogenes) is bacitracin sensitive and PYR ⊕."
      - "Optochin and bile solubility split the α-hemolytic strep (S pneumoniae vs viridans)."
      - "Growth in 6.5% NaCl identifies Enterococcus among γ-hemolytic strep."
      - "Novobiocin splits the coagulase ⊝ staphylococci."
      - "Coagulase is a staphylococcal test; this organism is catalase ⊝, so it is a streptococcus."
    src: { page: 132, quote: "Bacitracin sensitiVity and PYR status" }
    status: unverified
  # ---------- p133: hemolytic bacteria ----------
  - id: mic.L02.005
    kind: table
    topic: hemolytic-bacteria
    title: Hemolytic bacteria
    columns: [Type, On blood agar, Examples]
    rows:
      - [α-hemolytic, "Partial oxidation of hemoglobin → greenish or brownish color without clearing", "S pneumoniae, viridans streptococci"]
      - [β-hemolytic, Complete lysis of RBCs → pale/clear area, "S aureus, S pyogenes (group A), S agalactiae (group B), Listeria monocytogenes"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 133, quote: "Include Staphylococcus aureus, Streptococcus pyogenes (group A strep), Streptococcus agalactiae (group B strep), Listeria monocytogenes." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.006
    kind: mcq
    topic: hemolytic-bacteria
    stem: >-
      A 2-week-old neonate born to a mother who ate unpasteurized cheese during pregnancy has fever and
      poor feeding. CSF culture grows a gram-positive rod that produces a narrow clear zone of
      hemolysis on blood agar. Which other organism shares this hemolysis pattern?
    options:
      - Streptococcus agalactiae
      - Streptococcus pneumoniae
      - Viridans streptococci
      - Enterococcus faecalis
      - Staphylococcus epidermidis
    answer: 0
    why:
      - "Right. Listeria is β-hemolytic, like S aureus, S pyogenes and S agalactiae (group B)."
      - "S pneumoniae is α-hemolytic (green, no clearing)."
      - "Viridans strep are α-hemolytic."
      - "Enterococci are typically nonhemolytic (γ), sometimes α."
      - "S epidermidis is not in the book's β-hemolytic list."
    src: { page: 133, quote: "Include Staphylococcus aureus, Streptococcus pyogenes (group A strep), Streptococcus agalactiae (group B strep), Listeria monocytogenes." }
    status: unverified
  # ---------- p133: S aureus ----------
  - id: mic.L02.007
    kind: card
    topic: staphylococcus-aureus
    front: How is S aureus identified in the lab, and what does its protein A do?
    back: Gram ⊕, β-hemolytic, catalase ⊕, coagulase ⊕ cocci in clusters. Protein A binds Fc-IgG, inhibiting complement activation and phagocytosis.
    src: { page: 133, quote: "Gram ⊕, β-hemolytic, catalase ⊕, coagulase ⊕ cocci in clusters A . Protein A (virulence factor) binds Fc-IgG, inhibiting complement activation and phagocytosis." }
    status: unverified
    tags: [high-yield]
  - id: mic.L02.008
    kind: enumerate
    topic: staphylococcus-aureus
    prompt: Enumerate the inflammatory diseases caused by S aureus (6).
    points:
      - Skin infections
      - Organ abscesses
      - Pneumonia (often after influenza)
      - Infective endocarditis
      - Septic arthritis
      - Osteomyelitis
    pass: 5
    src: { page: 133, quote: "Inflammatory disease—skin infections, organ abscesses, pneumonia (often after influenza virus infection), infective endocarditis, septic arthritis, and osteomyelitis." }
    status: unverified
  - id: mic.L02.009
    kind: table
