    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 133, quote: "Toxin-mediated disease—toxic shock syndrome (TSST-1), scalded skin syndrome (exfoliative toxin), rapid-onset food poisoning (enterotoxins)." }
