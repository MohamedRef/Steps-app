    kind: mcq
    topic: pneumocystis-jirovecii
    stem: >-
      A 40-year-old man with newly diagnosed HIV has 3 weeks of progressive shortness of breath, a dry
      cough and low-grade fever. His oxygen saturation falls with walking. CT shows diffuse bilateral
      ground-glass opacities with thin-walled cysts. His CD4+ count is 80 cells/mm3. Which finding on
      bronchoalveolar lavage confirms the diagnosis?
    options:
      - Disc-shaped yeast on methenamine silver stain
      - Narrow-budding encapsulated yeast on India ink
      - Acute-angle septate hyphae
      - Spherules with endospores
      - Acid-fast rods
    answer: 0
    why:
      - "Right. Pneumocystis shows disc-shaped yeast on methenamine silver stain or fluorescent antibody."
      - "Narrow-budding encapsulated yeast is Cryptococcus."
      - "Acute-angle septate hyphae are Aspergillus."
      - "Spherules are Coccidioides."
      - "Acid-fast rods are Mycobacteria."
    src: { page: 151, quote: "Disc-shaped yeast seen on methenamine silver stain of lung tissue C or with fluorescent antibody." }
    status: unverified
  # ---------- p151: Sporothrix ----------
  - id: mic.L03.030
    kind: card
    topic: sporothrix-schenckii
    front: What forms does the dimorphic fungus Sporothrix schenckii take in the body and in soil?
    back: A cigar-shaped yeast at 37°C in the human body; hyphae with spores (conidia) in soil.
    src: { page: 151, quote: "Exists as a cigar-shaped yeast at 37 ºC in the human body and as hyphae with spores in soil (conidia)." }
    status: unverified
    tags: [high-yield]
  - id: mic.L03.031
    kind: cloze
    topic: sporothrix-schenckii
    text: "Sporotrichosis is treated with {{c1::itraconazole}} or {{c2::potassium iodide}} (only for cutaneous/lymphocutaneous disease): think of a rose gardener who smokes a cigar and pot."
    src: { page: 151, quote: "Treatment: itraconazole or potassium iodide (only for cutaneous/lymphocutaneous). Think of a rose gardener who smokes a cigar and pot." }
    status: unverified
    tags: [high-yield]
