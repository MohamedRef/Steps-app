  - id: mic.L03.033
    kind: card
    topic: cryptococcus-neoformans
    front: Where is Cryptococcus neoformans found, and how does it reach the meninges?
    back: In soil and pigeon droppings; it is inhaled and spreads hematogenously to the meninges.
