# The hover glossary (PARITY.md §6.3): rest the S Pen or the mouse on one of
# these words anywhere in Steps and its expansion shows. One word per term
# (aliases for other spellings); expansions stay short. Like all content,
# every entry is unverified until Mohamed approves it (glossary.TERM in
# content/approved.txt). Checked by `steps-tools validate`.
#
# This file holds the terms as Steps reads them outside any one course
# (search, the lab values, a page quote), each with the meanings Steps uses
# and nothing else. A course's own abbreviations, with the meaning that
# course intends, go in content/glossary/<course>.yaml: validate refuses a
# course term that only another file explains, and prints how many terms
# here nothing uses.
schema: steps.glossary/v1
