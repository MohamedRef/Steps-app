    kind: card
    topic: wernicke-korsakoff
    front: What does Wernicke encephalopathy progress to?
    back: Korsakoff syndrome, with irreversible memory loss, confabulation and personality change.
    src: { page: 590, quote: "May progress to irreversible memory loss, confabulation, personality change (Korsakoff syndrome)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L03.007
    kind: mcq
    topic: wernicke-korsakoff
    stem: >-
      A 48-year-old homeless man is brought to the emergency department confused and unsteady. He has
      horizontal nystagmus and bilateral lateral rectus palsy. His fingerstick glucose is 52 mg/dL. Which
      of the following is the most appropriate next step?
    options:
      - IV thiamine before IV dextrose
      - IV dextrose before thiamine
      - Oral thiamine after the glucose normalizes
      - IV naloxone
      - Head CT before any treatment
    answer: 0
    why:
      - "Right. Wernicke encephalopathy (confusion, ophthalmoplegia, ataxia) is treated with IV vitamin B1 before dextrose, because dextrose first can precipitate symptoms."
      - "Dextrose before B1 can precipitate or worsen Wernicke-Korsakoff."
      - "Treatment is IV and urgent."
      - "Naloxone reverses opioids; this is the Wernicke triad."
      - "Thiamine should not wait for imaging."
    src: { page: 590, quote: "Treatment: IV vitamin B1 (before dextrose)." }
    status: unverified
    tags: [high-yield]
