  - id: psych.L03.003
    kind: mcq
    topic: alcohol-use-disorder
    stem: >-
      A 52-year-old man with alcohol use disorder wants medication to help him stay sober after
      detoxification. He has decompensated cirrhosis with ascites and a serum bilirubin of 4.2 mg/dL.
      His creatinine is normal. Which of the following is the most appropriate drug?
    options:
      - Acamprosate
      - Naltrexone
      - Disulfiram
      - Chlordiazepoxide
      - Buprenorphine
    answer: 0
    why:
      - "Right. Acamprosate is contraindicated only in renal failure, and his kidneys are normal."
      - "Naltrexone should be avoided in liver failure."
      - "Disulfiram conditions abstinence through an aversive reaction to alcohol; First Aid's liver warning is for naltrexone, and acamprosate is the safer pick with failing liver and normal kidneys."
      - "Chlordiazepoxide, a benzodiazepine, treats withdrawal, not long-term abstinence."
      - "Buprenorphine is for opioid use disorder."
    src: { page: 590, quote: "naltrexone (reduces cravings; avoid in liver failure), acamprosate (contraindicated in renal failure)" }
    status: unverified
    tags: [high-yield]
