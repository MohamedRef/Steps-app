  # ---------- p591: xanomeline-trospium ----------
  - id: psych.L03.026
    kind: card
    topic: xanomeline-trospium
    front: How does xanomeline act in the CNS?
    back: It stimulates M1 and M4 muscarinic receptors; M1 helps cognition (hippocampus, cortex) and M4 cuts mesolimbic dopamine release, which is the antipsychotic effect.
    src: { page: 591, quote: "Xanomeline—CNS M1/M4 muscarinic receptor agonist. ▘ ↑ M1 → pro-cognitive effects (hippocampus, cortex) ▘ ↑ M4 → ↓ mesolimbic dopamine release → antipsychotic effect" }
    status: unverified
    tags: [high-yield]
  - id: psych.L03.078
    kind: card
    topic: xanomeline-trospium
    front: Why is trospium paired with xanomeline?
    back: Trospium blocks muscarinic receptors only in the periphery (it stays out of the CNS), so it blunts xanomeline's peripheral effects while sparing its central action.
    src: { page: 591, quote: "Trospium—PNS muscarinic antagonist (does not cross BBB) → limits peripheral muscarinic effects of xanomeline without inhibiting its central action." }
    status: unverified
    tags: [high-yield]
  - id: psych.L03.027
    kind: card
    topic: xanomeline-trospium
    front: What does xanomeline-trospium treat?
    back: Schizophrenia; it helps both positive symptoms and cognition.
    src: { page: 591, quote: "CLINICAL USE Schizophrenia: improves positive symptoms and cognition." }
    status: unverified
  - id: psych.L03.079
    kind: card
    topic: xanomeline-trospium
    front: What are the adverse effects of xanomeline-trospium?
    back: Anticholinergic effects (nausea, constipation, urinary retention, tachycardia); the risk of extrapyramidal symptoms is low.
    src: { page: 591, quote: "ADVERSE EFFECTS Anticholinergic effects (nausea, constipation, urinary retention, tachycardia), low risk for extrapyramidal symptoms." }
    status: unverified
  - id: psych.L03.080
    kind: card
    topic: xanomeline-trospium
    front: In which eye condition is xanomeline-trospium contraindicated?
    back: Narrow-angle glaucoma.
    src: { page: 591, quote: "Contraindicated in narrow-angle glaucoma." }
    status: unverified
