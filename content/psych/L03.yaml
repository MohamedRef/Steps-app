    kind: card
    topic: alcohol-use-disorder
    front: What non-drug support helps people with alcohol use disorder stay abstinent?
    back: Support groups such as Alcoholics Anonymous, which help both the patient and the family.
    src: { page: 590, quote: "Support groups such as Alcoholics Anonymous are helpful in sustaining abstinence and supporting patient and family." }
