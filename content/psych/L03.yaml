    topic: alcohol-use-disorder
    front: What are the complications of alcohol use disorder?
    back: Vitamin B1 (thiamine) deficiency, alcoholic cirrhosis, hepatitis, pancreatitis, peripheral neuropathy, testicular atrophy.
    src: { page: 590, quote: "Complications: vitamin B1 (thiamine) deficiency, alcoholic cirrhosis, hepatitis, pancreatitis, peripheral neuropathy, testicular atrophy." }
    status: unverified
