  - id: psych.L01.023
    kind: mcq
    topic: ego-defenses
    stem: >-
      A 45-year-old man is told that his biopsy shows metastatic colon cancer. During the next visit he
      calmly asks detailed questions about the molecular pathways of colorectal carcinogenesis and the
      response rates of various chemotherapy regimens, saying that understanding the science keeps the
      news at a distance. Which ego defense is he
      most likely using?
    options:
      - Intellectualization
      - Denial
      - Isolation of affect
      - Rationalization
      - Sublimation
    answer: 0
    why:
      - "Right. Intellectualization uses facts and logic to emotionally distance oneself from a stressful situation, like a patient with cancer discussing its pathophysiology."
      - "In denial he would avoid awareness of the diagnosis; he accepts it."
      - "Isolation of affect separates feelings from ideas and events, like describing a murder without emotion; he is not described as emotionless, he uses facts and logic to keep his distance."
      - "Rationalization gives plausible explanations to avoid self-blame."
      - "Sublimation channels an unacceptable wish into a socially acceptable action."
    src: { page: 571, quote: "Intellectualization Using facts and logic to emotionally distance oneself from a stressful situation. A patient diagnosed with cancer discusses the pathophysiology of the disease." }
    status: unverified
  - id: psych.L01.024
    kind: mcq
    topic: ego-defenses
    stem: >-
      A 34-year-old woman is admitted after a suicide attempt. On the second day she tells the attending
      physician that he is the only doctor who truly understands her, and that the nurses are all cruel
      and incompetent. Which ego defense is she most likely using?
    options:
      - Splitting
      - Projection
      - Displacement
      - Idealization
      - Acting out
    answer: 0
    why:
      - "Right. Splitting is believing people are all good or all bad from intolerance of ambiguity; it is common in borderline personality disorder."
      - "Projection attributes one's own unacceptable impulse to someone else."
      - "Displacement redirects emotions to a neutral person or object."
      - "Idealization ignores negative thoughts about others, but the all-good and all-bad split is splitting."
      - "Acting out copes through actions rather than reflections or feelings."
    src: { page: 571, quote: "Believing that people are either all good or all bad at different times due to intolerance of ambiguity. Common in borderline personality disorder." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.025
    kind: mcq
    topic: ego-defenses
    stem: >-
      A 4-year-old boy who has been toilet trained for a year begins wetting the bed and asking for a
      bottle shortly after his parents bring home a newborn sister. Which ego defense best explains this
      behavior?
    options:
      - Regression
      - Fixation
      - Displacement
      - Acting out
      - Repression
    answer: 0
    why:
      - "Right. Regression is involuntarily turning back the maturational clock to earlier behaviors under stress, like bedwetting after a sibling's birth."
      - "Fixation is partially remaining at a childish level, not returning to it under stress."
      - "Displacement redirects emotions to a neutral target."
      - "Acting out uses actions instead of reflections or feelings to cope; returning to earlier developmental behaviors is regression."
      - "Repression withholds an idea or feeling from awareness."
    src: { page: 571, quote: "A previously toilet-trained child begins bedwetting again following the birth of a sibling." }
    status: unverified
