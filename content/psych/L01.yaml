    status: unverified
    tags: [high-yield]
  - id: psych.L01.011
    kind: mcq
    topic: transference-countertransference
    stem: >-
      A 32-year-old resident notices that she feels unusually protective of a 19-year-old patient with
      asthma and spends far longer with him than with other patients. On reflection, she realizes that
      he reminds her of her younger brother. Which of the following best describes her reaction?
    options:
      - Countertransference
      - Transference
      - Displacement
      - Denial
      - Acting out
    answer: 0
    why:
      - "Right. The physician projects feelings about an important person (her brother) onto the patient."
      - "Transference is the patient projecting feelings onto the physician."
      - "Displacement redirects emotions or impulses to a neutral person or object."
      - "Denial is avoiding awareness of a painful reality."
      - "Acting out copes with stressors using actions rather than reflections or feelings."
    src: { page: 570, quote: "Physician projects feelings about formative or other important persons onto patient (eg, patient reminds physician of younger sibling)." }
    status: unverified
  # ---------- p570-571: ego defenses ----------
  - id: psych.L01.012
    kind: card
    topic: ego-defenses
    front: What are ego defenses?
    back: Thoughts and behaviors (voluntary or involuntary) used to resolve conflict and prevent undesirable feelings (eg, anxiety, depression).
    src: { page: 570, quote: "Thoughts and behaviors (voluntary or involuntary) used to resolve conflict and prevent undesirable feelings (eg, anxiety, depression)." }
    status: unverified
  - id: psych.L01.013
    kind: table
    topic: ego-defenses
    title: Immature ego defenses (1)
    columns: [Defense, Description, Example]
    rows:
      - [Acting out, "Coping with stressors using actions rather than reflections or feelings", Skipping therapy after deep discomfort from dealing with the past]
      - [Denial, Avoiding awareness of a painful reality, A patient with cancer plans full-time work despite warnings of chemotherapy fatigue]
      - [Displacement, Redirecting emotions or impulses to a neutral person or object, A teacher reprimanded by her principal criticizes her wife's cooking]
      - [Dissociation, "Temporary drastic change in personality, memory, consciousness or motor behavior to avoid stress", An abuse survivor sees the abuser and becomes numb and detached]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 570, quote: "Displacement Redirection of emotions or impulses to a neutral person or object (vs projection)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.014
    kind: table
    topic: ego-defenses
    title: Immature ego defenses (2)
    columns: [Defense, Description, Example]
    rows:
      - [Fixation, Partially remaining at a more childish level of development, A college student sucks her thumb when studying for exams]
      - [Idealization, Extremely positive thoughts of self and others while ignoring negatives, A patient boasts about his physician while ignoring any flaws]
      - [Identification, Largely unconscious assumption of another person's traits, A resident carries her stethoscope like her favorite attending]
      - [Intellectualization, Using facts and logic to emotionally distance oneself, A patient with cancer discusses its pathophysiology]
      - [Isolation of affect, Separating feelings from ideas and events, Describing murder in graphic detail with no emotional response]
      - [Passive aggression, "Hostile feelings shown in a nonconfrontational, indirect way", An employee is repeatedly late to get back at the manager]
      - [Projection, Attributing an unacceptable internal impulse to an external source, A man who wants to cheat accuses his wife of infidelity]
      - [Rationalization, "Plausible explanations for events that occurred for other reasons, to avoid self-blame", A fired employee claims the job wasn't important anyway]
      - [Reaction formation, Replacing a warded-off idea or feeling with an emphasis on its opposite, A stepfather treats a child he resents with excessive nurturing]
      - [Regression, Involuntarily turning back to earlier behaviors under stress, A toilet-trained child wets the bed after a sibling's birth]
      - [Repression, Involuntarily withholding an idea or feeling from conscious awareness, A 20-year-old doesn't remember counseling during his parents' divorce]
      - [Splitting, "People are all good or all bad, from intolerance of ambiguity", "All the nurses are cold, but the physicians are warm"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1]]
    src: { page: 571, quote: "Projection Attributing an unacceptable internal impulse to an external source (vs displacement)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.015
    kind: enumerate
    topic: ego-defenses
    prompt: Enumerate the mature ego defenses ("Mature adults wear a SASH") (4).
    points:
      - "Sublimation: an unacceptable wish channeled into a similar but socially acceptable action"
