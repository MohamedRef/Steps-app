  # ---------- p570: classical conditioning ----------
  - id: psych.L01.001
    kind: cloze
    topic: classical-conditioning
    text: "Classical conditioning: a natural response (salivation) is elicited by a {{c1::conditioned (learned)}} stimulus (bell) that was previously presented with an {{c2::unconditioned}} stimulus (food); it usually elicits {{c3::involuntary}} responses."
    src: { page: 570, quote: "Learning in which a natural response (salivation) is elicited by a conditioned, or learned, stimulus (bell) that previously was presented in conjunction with an unconditioned stimulus (food)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.002
    kind: mcq
    topic: classical-conditioning
    stem: >-
      A 9-year-old boy with leukemia receives chemotherapy in a clinic with a distinctive blue waiting
      room, and the drug causes severe nausea. After several cycles, he begins vomiting as soon as he
      enters the blue waiting room, before any drug is given. Which of the following best explains his
      vomiting?
    options:
      - Classical conditioning
      - Positive reinforcement
      - Negative reinforcement
      - Positive punishment
      - Extinction
    answer: 0
    why:
      - "Right. A natural, involuntary response (nausea) is elicited by a learned stimulus (the room) previously paired with an unconditioned stimulus (chemotherapy), as Pavlov's bell provoked salivation."
      - "Reinforcement is operant conditioning, increasing a voluntary behavior with a reward."
      - "Negative reinforcement increases a behavior by removing an aversive stimulus."
      - "Punishment decreases a voluntary behavior by adding an aversive stimulus."
      - "Extinction is the elimination of a behavior when reinforcement stops."
    src: { page: 570, quote: "Usually elicits involuntary responses. Pavlov’s classical experiments with dogs— ringing the bell provoked salivation." }
    status: unverified
  # ---------- p570: operant conditioning ----------
  - id: psych.L01.003
    kind: card
    topic: operant-conditioning
    front: What is operant conditioning, and what kind of responses does it usually elicit?
    back: Learning in which a particular action is elicited because it produces a punishment or reward; usually voluntary responses.
    src: { page: 570, quote: "Learning in which a particular action is elicited because it produces a punishment or reward. Usually elicits voluntary responses." }
    status: unverified
  - id: psych.L01.004
    kind: table
    topic: operant-conditioning
    title: Skinner operant conditioning quadrants
    columns: ["", Increase behavior, Decrease behavior]
    rows:
      - [Add a stimulus, Positive reinforcement, Positive punishment]
      - [Remove a stimulus, Negative reinforcement, Negative punishment]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 570, quote: "Skinner operant conditioning quadrants: Increase behavior Decrease behavior" }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.005
    kind: card
    topic: operant-conditioning
    front: What is negative reinforcement?
    back: Removal of an aversive stimulus after the target behavior, which increases the behavior (not punishment).
    src: { page: 570, quote: "Target behavior (response) is followed by desired reward (positive reinforcement) or removal of aversive stimulus (negative reinforcement)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.006
    kind: card
    topic: operant-conditioning
    front: What is negative punishment?
    back: Removal of a desired reward to extinguish an unwanted behavior (positive punishment is repeated application of an aversive stimulus).
    src: { page: 570, quote: "Repeated application of aversive stimulus (positive punishment) or removal of desired reward (negative punishment) to extinguish unwanted behavior." }
    status: unverified
  - id: psych.L01.007
    kind: cloze
    topic: operant-conditioning
    text: "{{c1::Extinction}}: discontinuation of reinforcement (positive or negative) eventually eliminates a behavior; it can occur in {{c2::operant or classical}} conditioning."
    src: { page: 570, quote: "Extinction Discontinuation of reinforcement (positive or negative) eventually eliminates behavior. Can occur in operant or classical conditioning." }
    status: unverified
  - id: psych.L01.008
    kind: mcq
    topic: operant-conditioning
    stem: >-
      A 15-year-old boy keeps forgetting to take out the trash. His parents tell him that every week he
      does it without being reminded, they will stop nagging him about cleaning his room. Over the
      following month he takes out the trash every week. Which of the following best describes the
      parents' strategy?
    options:
      - Negative reinforcement
      - Positive reinforcement
      - Positive punishment
      - Negative punishment
      - Classical conditioning
    answer: 0
    why:
      - "Right. Removing an aversive stimulus (nagging) to increase a behavior is negative reinforcement."
      - "Positive reinforcement adds a desired reward."
      - "Positive punishment adds an aversive stimulus to decrease a behavior."
      - "Negative punishment removes a desired reward to decrease a behavior."
      - "Classical conditioning pairs stimuli to elicit an involuntary response; this is a voluntary behavior."
    src: { page: 570, quote: "Target behavior (response) is followed by desired reward (positive reinforcement) or removal of aversive stimulus (negative reinforcement)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L01.009
    kind: mcq
    topic: operant-conditioning
    stem: >-
      A 7-year-old girl repeatedly hits her younger brother. Her parents take away her tablet for the
      evening each time she does it, and the hitting becomes less frequent. Which of the following
      describes this approach?
    options:
      - Negative punishment
      - Negative reinforcement
      - Positive punishment
      - Positive reinforcement
      - Extinction
    answer: 0
    why:
      - "Right. Removing a desired reward (the tablet) to decrease an unwanted behavior is negative punishment."
      - "Negative reinforcement removes an aversive stimulus to increase a behavior."
      - "Positive punishment adds an aversive stimulus (eg, a scolding)."
      - "Positive reinforcement adds a reward to increase a behavior."
      - "Extinction is stopping reinforcement of a behavior, not removing a separate reward."
    src: { page: 570, quote: "removal of desired reward (negative punishment) to extinguish unwanted behavior." }
    status: unverified
