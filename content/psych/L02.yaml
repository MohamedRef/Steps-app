  # ---------- p573: child abuse ----------
  - id: psych.L02.001
    kind: card
    topic: child-abuse
    front: What must be done with every case of suspected child abuse?
    back: Report it to local child protective services.
    src: { page: 573, quote: "All cases of suspected child abuse must be reported to local child protective services." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.002
    kind: table
    topic: child-abuse
    title: Child abuse
    columns: [Type, Signs, Epidemiology]
    rows:
      - [Neglect, "Poor hygiene, malnutrition, withdrawn affect, impaired social/emotional development, failure to thrive", Most common form of child maltreatment]
      - [Physical abuse, "Nonaccidental trauma (fractures, bruises, burns) in different stages of healing or in implement patterns; abusive head trauma with subdural hematomas or retinal hemorrhages", 40% of abuse or neglect deaths occur in children <1 year old]
      - [Sexual abuse, "STIs, UTIs, genital, anal or oral trauma; most often no physical signs; age-incongruent sexual knowledge or behavior", Peak incidence 9-12 years old]
      - [Emotional abuse, "Young children lack a bond with the caregiver but are overly affectionate with less familiar adults; older children are labile, with angry outbursts and vague somatic symptoms", "~80% of young adult victims meet criteria for ≥1 psychiatric illness by age 21"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 2], [3, 2]]
    src: { page: 573, quote: "Neglect Poor hygiene, malnutrition, withdrawn affect, impaired social/ emotional development, failure to thrive" }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.003
    kind: cloze
    topic: child-abuse
    text: "Abusive head trauma (shaken baby syndrome) is characterized by {{c1::subdural hematomas}} or {{c2::retinal hemorrhages}}."
    src: { page: 573, quote: "Includes abusive head trauma (shaken baby syndrome), characterized by subdural hematomas or retinal hemorrhages." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.004
    kind: card
    topic: child-abuse
    front: Can sexual abuse be excluded when there is no physical trauma?
    back: No. Most often there are no physical signs, so it stays on the differential.
    src: { page: 573, quote: "Most often, there are no physical signs; sexual abuse should not be excluded from a differential diagnosis in the absence of physical trauma." }
    status: unverified
  - id: psych.L02.005
    kind: mcq
    topic: child-abuse
    stem: >-
      A 4-month-old boy is brought to the emergency department because he is lethargic and has vomited
      twice. His father says the boy rolled off the couch onto a carpeted floor. Examination shows a
      bulging fontanelle and bilateral retinal hemorrhages; there are no external bruises. Which of the
      following is the most likely finding on head CT?
    options:
      - Subdural hematoma
      - Epidural hematoma with a lucid interval
      - Normal brain imaging
      - Depressed skull fracture over the occiput
      - Subarachnoid hemorrhage from a berry aneurysm
    answer: 0
    why:
      - "Right. Abusive head trauma (shaken baby syndrome) is characterized by subdural hematomas or retinal hemorrhages; a roll-off history is inconsistent with a 4-month-old's development."
      - "Epidural hematoma follows direct skull trauma, usually with a fracture; shaking causes subdural bleeding."
      - "A bulging fontanelle and retinal hemorrhages point to intracranial bleeding."
      - "Shaking injury typically lacks an external impact."
      - "Berry aneurysm rupture is not the abusive head trauma pattern."
    src: { page: 573, quote: "Caregivers may delay seeking medical attention for the child or provide explanations inconsistent with the child’s developmental stage or pattern of injury." }
    status: unverified
    tags: [high-yield]
  # ---------- p573: vulnerable child syndrome ----------
  - id: psych.L02.006
    kind: card
    topic: vulnerable-child-syndrome
    front: What is vulnerable child syndrome?
    back: Parents misperceive the child as especially susceptible to illness or injury, usually after a serious illness or life-threatening event; it leads to missed school or overuse of medical services (a kid wrapped in bubble wrap). Contrast factitious disorder imposed on another.
    src: { page: 573, quote: "Parents misperceive the child as especially susceptible to illness or injury (vs factitious disorder imposed on another)." }
    status: unverified
  - id: psych.L02.007
    kind: mcq
    topic: vulnerable-child-syndrome
    stem: >-
      A 6-year-old girl who was treated for bacterial meningitis at 18 months is brought to the clinic
      for the fifth time this month with minor colds. Her mother keeps her home from school whenever
      she sneezes. Growth and development are normal, and there is no evidence that symptoms are being
      fabricated. Which of the following is the most likely explanation?
    options:
      - Vulnerable child syndrome
      - Factitious disorder imposed on another
      - Separation anxiety disorder
      - Child neglect
      - Illness anxiety disorder in the child
    answer: 0
    why:
      - "Right. Parents misperceive the child as especially susceptible to illness, usually after a serious illness, causing missed school and overuse of medical services."
      - "Factitious disorder imposed on another involves fabricating or inducing illness; here none is fabricated."
      - "Separation anxiety disorder is the child's fear of separation."
      - "Neglect is failure to provide care, not excessive care."
      - "The worry is the parent's, not the child's."
    src: { page: 573, quote: "Usually follows a child’s serious illness or life-threatening event. Can result in missed school or overuse of medical services" }
    status: unverified
  # ---------- p574: childhood and early-onset disorders ----------
  - id: psych.L02.008
    kind: card
    topic: childhood-disorders
    front: What are the age criteria and setting requirement for ADHD?
    back: Onset before age 12, but diagnosis only after age 4; hyperactivity, impulsivity and/or inattention in ≥2 settings (eg, school, home). Normal intelligence; often persists into adulthood.
    src: { page: 574, quote: "Onset before age 12, but diagnosis can only be established after age 4." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.009
    kind: card
    topic: childhood-disorders
    front: How is ADHD treated?
    back: Stimulants (eg, methylphenidate) ± behavioral therapy; alternatives are atomoxetine and α2-agonists (clonidine, guanfacine).
    src: { page: 574, quote: "Treatment: stimulants (eg, methylphenidate) +/– behavioral therapy; alternatives include atomoxetine and α -agonists (eg, clonidine, guanfacine)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.010
    kind: card
    topic: childhood-disorders
    front: Which features define autism spectrum disorder?
    back: Early childhood onset; social and communication deficits, repetitive/ritualized behaviors, restricted interests. May have intellectual disability and/or above-average specific skills; more common in males; associated with ↑ head and/or brain size.
    src: { page: 574, quote: "Social and communication deficits, repetitive/ritualized behaviors, restricted interests." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.011
    kind: cloze
    topic: childhood-disorders
    text: "Conduct disorder is often reclassified as {{c1::antisocial personality disorder}} after age {{c2::18}} (conduct = children, antisocial = adults)."
    src: { page: 574, quote: "After age 18, often reclassified as antisocial personality disorder. Conduct = children, antisocial = adults." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.012
    kind: table
    topic: childhood-disorders
    title: Behavior and mood disorders of childhood
    columns: [Disorder, Key features, Treatment]
    rows:
      - [Conduct disorder, "Repetitive, pervasive violation of societal norms or others' basic rights (aggression to people and animals, property destruction, theft)", "Psychotherapy (eg, CBT)"]
      - [Oppositional defiant disorder, "Anger and irritability with argumentative, vindictive, defiant behavior toward authority figures ≥6 months", "Psychotherapy (eg, CBT)"]
      - [Disruptive mood dysregulation disorder, "Onset before 10, diagnosed after 6; severe recurrent temper outbursts; constantly angry and irritable between outbursts", "CBT, stimulants, antipsychotics"]
      - [Intermittent explosive disorder, "Onset after 6; outbursts <30 min out of proportion, not premeditated; relief then remorse", "Psychotherapy, SSRIs"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
    src: { page: 574, quote: "Pattern of anger and irritability with argumentative, vindictive, and defiant behavior toward authority figures lasting ≥6 months." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.013
    kind: card
    topic: childhood-disorders
    front: What are the most common genetic and most common inherited causes of intellectual disability?
    back: Genetic, Down syndrome; inherited, fragile X syndrome.
    src: { page: 574, quote: "Most common genetic cause is Down syndrome; most common inherited cause is Fragile X syndrome." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.014
    kind: table
    topic: childhood-disorders
    title: Intellectual disability vs specific learning disorder
    columns: [Feature, Intellectual disability, Specific learning disorder]
    rows:
      - [Deficit, "Global cognitive deficits (reasoning, memory, abstract thinking, judgment, language, learning)", "One subject (math, reading, writing) below expected for ≥6 months despite intervention"]
      - [Function and intelligence, Adaptive functioning impaired, General functioning and intelligence normal]
      - [Treatment, "Psychotherapy, occupational therapy, special education", "Academic support, counseling, extracurricular activities"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 574, quote: "General functioning and intelligence are normal (vs intellectual disability)." }
    status: unverified
  - id: psych.L02.015
    kind: table
    topic: childhood-disorders
    title: Anxiety disorders of childhood
    columns: [Disorder, Key features, Treatment]
    rows:
      - [Selective mutism, "Onset before 5; ≥1 month not speaking in certain situations despite speaking in others; development not impaired; often with social anxiety disorder", "Behavioral, family and play therapy; SSRIs"]
      - [Separation anxiety disorder, "Overwhelming fear of separation from home or attachment figure ≥4 weeks; normal up to age 3-4; may fake physical complaints to avoid school", "CBT, play therapy, family therapy"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 574, quote: "Overwhelming fear of separation from home or attachment figure lasting ≥4 weeks. Can be normal behavior up to age 3-4." }
    status: unverified
  - id: psych.L02.016
    kind: card
    topic: childhood-disorders
    front: What defines Tourette syndrome?
    back: Onset before 18; sudden, recurrent, nonrhythmic, stereotyped motor and vocal tics persisting >1 year; coprolalia in some. Associated with OCD and ADHD.
    src: { page: 574, quote: "Sudden, recurrent, nonrhythmic, stereotyped motor (eg, grimacing, shrugging) and vocal (eg, grunting, throat clearing) tics that persist for >1 year." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.017
    kind: card
    topic: childhood-disorders
    front: How is Tourette syndrome treated?
    back: Psychoeducation and behavioral therapy; for intractable, distressing tics, tetrabenazine, antipsychotics, or α2-agonists.
    src: { page: 574, quote: "Treatment: psychoeducation, behavioral therapy. For intractable and distressing tics: tetrabenazine, antipsychotics" }
    status: unverified
  - id: psych.L02.018
    kind: mcq
    topic: childhood-disorders
    stem: >-
      A 9-year-old boy is brought to the clinic because his teacher reports that he cannot stay in his
      seat, blurts out answers, and loses his homework. His parents report the same behavior at home and
      at their place of worship since age 5. His intelligence is normal. Which of the following is the
      most appropriate first-line pharmacotherapy?
    options:
      - Methylphenidate
      - Atomoxetine
      - Risperidone
      - Fluoxetine
      - Tetrabenazine
    answer: 0
    why:
      - "Right. ADHD (onset before 12, symptoms in ≥2 settings) is treated with stimulants such as methylphenidate ± behavioral therapy."
      - "Atomoxetine is an alternative, not first line."
      - "Antipsychotics are used for disruptive mood dysregulation disorder or tics, not first line for ADHD."
      - "SSRIs treat anxiety disorders such as selective mutism."
      - "Tetrabenazine is for intractable tics in Tourette syndrome."
    src: { page: 574, quote: "Treatment: stimulants (eg, methylphenidate) +/– behavioral therapy" }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.019
    kind: mcq
    topic: childhood-disorders
    stem: >-
      An 8-year-old boy has had severe temper outbursts three or four times a week for the past 2 years,
      including throwing furniture when asked to turn off the television. Between outbursts his parents
      and teachers describe him as angry and irritable nearly every day. Which of the following is the
      most likely diagnosis?
    options:
      - Disruptive mood dysregulation disorder
      - Oppositional defiant disorder
      - Intermittent explosive disorder
      - Conduct disorder
      - Bipolar I disorder
    answer: 0
    why:
      - "Right. DMDD has onset before 10 (diagnosed after 6) with severe recurrent temper outbursts and constant anger and irritability between outbursts."
      - "ODD is argumentative, vindictive defiance of authority without severe outbursts and constant irritability between them."
      - "In intermittent explosive disorder the person is not constantly irritable between brief outbursts."
      - "Conduct disorder violates others' rights (theft, cruelty), not mainly mood outbursts."
      - "Bipolar I requires a distinct manic episode."
    src: { page: 574, quote: "Onset before age 10 and diagnosed after age 6. Severe, recurrent temper outbursts out of proportion to situation. Child is constantly angry and irritable between outbursts." }
    status: unverified
  - id: psych.L02.020
    kind: mcq
    topic: childhood-disorders
    stem: >-
      A 6-year-old girl talks freely at home with her family but has not spoken a word at school since
      starting first grade 3 months ago. Her speech and language development are normal. She appears
      very anxious around unfamiliar children. Which of the following is the most likely diagnosis?
    options:
      - Selective mutism
      - Autism spectrum disorder
      - Separation anxiety disorder
      - Intellectual disability
      - Specific learning disorder
    answer: 0
    why:
      - "Right. Selective mutism is an anxiety disorder with onset before 5 lasting ≥1 month, not speaking in certain situations despite speaking in others, with normal development; it often coexists with social anxiety disorder."
      - "Autism has social and communication deficits across settings with repetitive behaviors."
      - "Separation anxiety is fear of separation from an attachment figure."
      - "Development and cognition are normal."
      - "Specific learning disorder is difficulty in one academic subject."
    src: { page: 574, quote: "Anxiety disorder lasting ≥1 month involving refraining from speech in certain situations despite speaking in other, usually more comfortable situations." }
    status: unverified
  # ---------- p575: orientation ----------
  - id: psych.L02.021
    kind: cloze
    topic: orientation
    text: "Loss of orientation follows the order {{c1::time}} → {{c2::place}} → {{c3::person}}."
    src: { page: 575, quote: "order of loss: time → place → person" }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.022
    kind: card
    topic: orientation
    front: What are the common causes of loss of orientation?
    back: Alcohol, drugs, fluid/electrolyte imbalance, head trauma, hypoglycemia, infection, nutritional deficiencies, hypoxia.
    src: { page: 575, quote: "Common causes of loss of orientation: alcohol, drugs, fluid/electrolyte imbalance, head trauma, hypoglycemia, infection, nutritional deficiencies, hypoxia." }
    status: unverified
  - id: psych.L02.023
    kind: mcq
    topic: orientation
    stem: >-
      A 74-year-old man with pneumonia is becoming confused. On the first hospital day he knows his
      name and that he is in a hospital but gives the wrong year. Which of the following best describes
      the expected course if his confusion worsens?
    options:
      - He will next lose orientation to place, and finally to person
      - He will next lose orientation to person, then place
      - He will lose orientation to all three at once
      - He will lose orientation to place last
      - Orientation to person is lost first in infection
    answer: 0
    why:
      - "Right. The order of loss of orientation is time → place → person, and infection is a common cause."
      - "Person is lost last, not next."
      - "Orientation is lost in a predictable order."
      - "Place is lost second; person is last."
      - "Time is lost first whatever the cause."
    src: { page: 575, quote: "Patients’ ability to know the date and time, where they are, and who they are (order of loss: time → place → person)." }
    status: unverified
  # ---------- p575: amnesias ----------
  - id: psych.L02.024
    kind: table
    topic: amnesias
    title: Amnesias
    columns: [Type, Definition]
    rows:
      - [Retrograde amnesia, Inability to remember things that occurred before a CNS insult]
      - [Anterograde amnesia, "Inability to remember things after a CNS insult (↓ acquisition of new memory)"]
      - [Korsakoff syndrome, "Amnesia (anterograde > retrograde) and disorientation from vitamin B1 deficiency; confabulations"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 575, quote: "Retrograde amnesia Inability to remember things that occurred before a CNS insult." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.025
    kind: card
    topic: amnesias
    front: Which structures are damaged in Korsakoff syndrome, and in whom is it seen?
    back: The limbic system, especially the mammillary bodies and dorsomedial thalamus; seen in chronic alcohol use as a late neuropsychiatric manifestation of Wernicke encephalopathy.
    src: { page: 575, quote: "Associated with disruption and destruction of the limbic system, especially mammillary bodies and dorsomedial thalamus." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.026
    kind: mcq
    topic: amnesias
    stem: >-
      A 58-year-old man with a 30-year history of heavy alcohol use is admitted for a hip fracture. He
      cannot recall the names of nurses he met an hour earlier and, when asked what he did yesterday,
      describes a detailed trip to a fishing lake although he was in the hospital. Deficiency of which
      of the following is most likely responsible?
    options:
      - Thiamine (vitamin B1)
      - Cobalamin (vitamin B12)
      - Niacin (vitamin B3)
      - Folate
      - Pyridoxine (vitamin B6)
    answer: 0
    why:
      - "Right. Korsakoff syndrome is amnesia (anterograde > retrograde) with confabulation caused by vitamin B1 deficiency, a late manifestation of Wernicke encephalopathy in chronic alcohol use."
      - "B12 deficiency causes subacute combined degeneration and dementia, without this confabulation pattern."
      - "Niacin deficiency causes pellagra (dermatitis, diarrhea, dementia)."
      - "Folate deficiency causes megaloblastic anemia without neurologic findings."
      - "B6 deficiency causes neuropathy and seizures."
    src: { page: 575, quote: "Amnesia (anterograde > retrograde) and disorientation caused by vitamin B1 deficiency." }
    status: unverified
    tags: [high-yield]
  # ---------- p575: dissociative disorders ----------
  - id: psych.L02.027
    kind: table
    topic: dissociative-disorders
    title: Dissociative disorders
    columns: [Disorder, Key features]
    rows:
      - [Depersonalization/derealization disorder, "Persistent detachment from one's own body, thoughts and actions (depersonalization) or environment (derealization); intact reality testing (vs psychosis)"]
      - [Dissociative amnesia, "Inability to recall important personal information, usually after severe trauma or stress; may have dissociative fugue (abrupt travel away from home)"]
      - [Dissociative identity disorder, "≥2 distinct identities or personality states with distinct memories and behavior; more common in females; associated with sexual abuse, PTSD, depression, substance use, borderline personality"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 575, quote: "Persistent feelings of detachment or estrangement from one’s own body, thoughts, perceptions, and actions (depersonalization) or one’s environment (derealization)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.028
    kind: mcq
    topic: dissociative-disorders
    stem: >-
      A 31-year-old woman is found 400 miles from her home city, working as a waitress under a different
      name. She cannot recall her past or how she got there. Three months earlier her young son died in
      a house fire. Neurologic examination and brain MRI are normal. Which of the following is the most
      likely diagnosis?
    options:
      - Dissociative amnesia with dissociative fugue
      - Dissociative identity disorder
      - Depersonalization/derealization disorder
      - Korsakoff syndrome
      - Delirium
    answer: 0
    why:
      - "Right. Dissociative amnesia is the inability to recall important personal information after severe trauma, and may come with dissociative fugue (abrupt, unexpected travel away from home)."
      - "DID needs ≥2 distinct identities with distinct memories and behaviors."
      - "Depersonalization/derealization is feeling detached, with intact memory and reality testing."
      - "Korsakoff follows vitamin B1 deficiency and causes confabulation; her MRI and history don't fit."
      - "Delirium has a waxing and waning level of consciousness."
    src: { page: 575, quote: "Inability to recall important personal information, usually following severe trauma or stress. May be accompanied by dissociative fugue (abrupt, unexpected travel away from home)." }
    status: unverified
  # ---------- p575: delirium ----------
  - id: psych.L02.029
    kind: card
    topic: delirium
    front: What are the core features of delirium?
    back: "Acute onset, waxing and waning level of consciousness, ↓ attention span, ↓ arousal; disorganized thinking, hallucinations (often visual), illusions, sleep-wake disturbance, cognitive dysfunction, agitation. Reversible. \"Delirium = changes in sensorium.\""
    src: { page: 575, quote: "“Waxing and waning” level of consciousness with acute onset, ↓ attention span, ↓ level of arousal." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.030
    kind: card
    topic: delirium
    front: What causes delirium, and where is it most common?
    back: Usually 2° to another identifiable illness (CNS disease, infection, trauma, substance use or withdrawal, metabolic or electrolyte disturbance, hemorrhage, urinary or fecal retention) or medications (anticholinergics), especially in older adults. Most common presentation of altered mental status in inpatients, especially in the ICU.
    src: { page: 575, quote: "Most common presentation of altered mental status in inpatient setting, especially in the ICU or during prolonged hospital stays." }
    status: unverified
  - id: psych.L02.031
    kind: cloze
    topic: delirium
    text: "The EEG in delirium may show {{c1::diffuse background rhythm slowing}}."
    src: { page: 575, quote: "EEG may show diffuse background rhythm slowing." }
    status: unverified
  - id: psych.L02.032
    kind: card
    topic: delirium
    front: How is delirium managed, and which drugs should be avoided?
    back: Identify and manage the underlying condition; orientation protocols (clock, calendar), ↓ sleep disturbance, ↑ cognitive stimulation; antipsychotics (eg, haloperidol) as needed. Avoid unnecessary restraints and anticholinergics, benzodiazepines and opioids.
    src: { page: 575, quote: "Avoid unnecessary restraints and drugs that may worsen delirium (eg, anticholinergics, benzodiazepines, opioids)." }
    status: unverified
    tags: [high-yield]
  - id: psych.L02.033
    kind: mcq
    topic: delirium
    stem: >-
      An 81-year-old woman is admitted for a urinary tract infection. On the second night she is
      agitated, pulls at her IV line, and says she sees insects on the wall. The next morning she is
      calm and drowsy, and cannot keep track of a conversation. She was living independently before
      admission. Which of the following is the most appropriate initial step in management?
    options:
      - Treat the infection and use orientation measures such as a clock and calendar
      - Start lorazepam at night for agitation
      - Apply soft restraints overnight
      - Start donepezil for dementia
      - Give diphenhydramine to help her sleep
    answer: 0
    why:
      - "Right. Delirium (acute, waxing and waning, visual hallucinations) is managed by treating the underlying condition plus orientation protocols and fewer sleep disturbances."
      - "Benzodiazepines may worsen delirium."
      - "Avoid unnecessary restraints."
      - "Her acute, fluctuating course and prior independence point to delirium, which is reversible."
      - "Anticholinergics such as diphenhydramine worsen delirium."
    src: { page: 575, quote: "Treatment: identification and management of underlying condition. Orientation protocols (eg, keeping a clock or calendar nearby)" }
    status: unverified
    tags: [high-yield]
  # ---------- p576: psychosis ----------
  - id: psych.L02.034
    kind: card
    topic: psychosis
    front: What is psychosis, and what can cause it?
    back: Distorted perception of reality with delusions, hallucinations and/or disorganized thought or speech; it can occur in psychiatric illness, another medical condition, or secondary to substance or medication use.
    src: { page: 576, quote: "Distorted perception of reality characterized by delusions, hallucinations, and/or disorganized thought/speech." }
    status: unverified
  - id: psych.L02.035
    kind: card
    topic: psychosis
    front: What is a delusion?
