    src: { page: 35, quote: "Findings: intellectual disability, self-mutilation, aggression, hyperuricemia (red/orange “sand” [sodium urate crystals] in diaper), gout, dystonia, macrocytosis." }
    status: unverified
    tags: [high-yield]
