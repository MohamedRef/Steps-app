    kind: card
    topic: purine-salvage-deficiencies
    front: Which drugs act on adenosine deaminase, and which enzyme does rasburicase supply?
    back: Cladribine and pentostatin act on ADA. Rasburicase is urate oxidase (uric acid → allantoin).
    src: { page: 35, quote: "Urate oxidase (rasburicase)" }
    status: unverified
  - id: bio.L01.041
    kind: mcq
    topic: purine-salvage-deficiencies
    stem: >-
      A 2-year-old boy has delayed motor milestones, writhing movements of his limbs and has started
      biting his lips and fingers until they bleed. His mother says she has seen orange, sand-like
      crystals in his diapers since infancy. Serum uric acid is high. Deficiency of which enzyme is the
      most likely cause?
    options:
      - Adenosine deaminase
      - Hypoxanthine-guanine phosphoribosyltransferase
      - Xanthine oxidase
      - Adenine phosphoribosyltransferase
      - Carbamoyl phosphate synthetase II
    answer: 1
