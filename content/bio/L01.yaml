  # ---------- p32: chromatin structure ----------
  - id: bio.L01.001
    kind: card
    topic: chromatin-structure
    front: What is a nucleosome, and what does histone H1 do?
    back: DNA looped twice around a histone octamer ("beads on a string"). H1 binds the nucleosome and the linker DNA, stabilizing the chromatin fiber.
    src: { page: 32, quote: "DNA loops twice around a histone octamer to form a nucleosome (“beads on a string”). H1 binds to the nucleosome and to “linker DNA,” thereby stabilizing the chromatin fiber." }
    status: unverified
  - id: bio.L01.002
    kind: cloze
    topic: chromatin-structure
    text: DNA carries a {{c1::negative}} charge from its phosphate groups; histones carry a {{c2::positive}} charge from {{c3::lysine and arginine}}.
    src: { page: 32, quote: "DNA has ⊝ charge from phosphate groups. Histones are large and have ⊕ charge from lysine and arginine." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.003
    kind: cloze
    topic: chromatin-structure
    text: DNA and histone synthesis occur during {{c1::S}} phase.
    src: { page: 32, quote: "DNA and histone synthesis occurs during S phase." }
    status: unverified
  - id: bio.L01.004
    kind: card
    topic: chromatin-structure
    front: How does mitochondrial DNA differ from nuclear DNA in shape and packaging?
    back: It is circular and does not bind histones.
    src: { page: 32, quote: "Mitochondria have their own DNA, which is circular and does not bind histones." }
    status: unverified
  - id: bio.L01.005
    kind: table
    topic: chromatin-structure
    title: Heterochromatin vs euchromatin
    columns: [Feature, Heterochromatin, Euchromatin]
    rows:
      - [Condensation, "Highly condensed", "Less condensed"]
      - [Look on EM, "Darker", "Lighter"]
      - [Transcription, "Inactive (sterically inaccessible)", "Active (sterically accessible)"]
      - [Histone marks, "↑ methylation, ↓ acetylation", "Acetylation"]
      - [Example, "Barr bodies (inactive X) at the nuclear periphery", "Expressed genes (\"truly transcribed\")"]
    blanks: [[1, 1], [2, 1], [2, 2], [3, 1]]
    src: { page: 32, quote: "Condensed, appears darker on EM (labeled H in A ; Nu, nucleolus). Sterically inaccessible, thus transcriptionally inactive. ↑ methylation, ↓ acetylation." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.006
    kind: card
    topic: chromatin-structure
    front: What are Barr bodies, and where in the nucleus are they seen?
    back: Inactive X chromosomes (heterochromatin); they may be visible on the periphery of the nucleus.
    src: { page: 32, quote: "Barr bodies (inactive X chromosomes) may be visible on the periphery of nucleus." }
    status: unverified
  - id: bio.L01.007
    kind: mcq
    topic: chromatin-structure
    stem: >-
      A researcher studies buccal cells from a healthy 25-year-old woman. Electron microscopy of the
      nuclei shows a dense, dark-staining mass pressed against the inner nuclear envelope, while most
      of the nucleus is pale and loosely packed. Compared with the pale regions, the DNA in the dark
      mass is most likely characterized by which of the following?
    options:
      - Increased histone acetylation and active transcription
      - Increased methylation and transcriptional silence
      - Absence of histones, as in mitochondrial DNA
      - Loss of H1 binding to linker DNA
      - Active replication during G1 phase
    answer: 1
    why:
      - "Acetylation relaxes chromatin and marks euchromatin, the pale, active part."
      - "Right. The dark peripheral mass is a Barr body (inactive X): heterochromatin, with ↑ methylation, ↓ acetylation and no transcription."
      - "Nuclear DNA, condensed or not, is wound on histones; only mitochondrial DNA is histone-free."
      - "H1 stabilizes the chromatin fiber; condensed chromatin is not defined by losing it."
      - "DNA is synthesized in S phase, not G1, and condensed DNA is sterically inaccessible."
    src: { page: 32, quote: "Barr bodies (inactive X chromosomes) may be visible on the periphery of nucleus." }
    status: unverified
  # ---------- p32: DNA methylation ----------
  - id: bio.L01.008
    kind: card
    topic: dna-methylation
    front: What does DNA methylation do to a DNA segment?
    back: It reversibly changes the expression of the segment without changing its sequence.
    src: { page: 32, quote: "Reversibly changes the expression of a DNA segment without changing its sequence." }
    status: unverified
  - id: bio.L01.009
    kind: enumerate
    topic: dna-methylation
    prompt: Enumerate the processes DNA methylation is involved in (6).
    points:
      - Aging
      - Carcinogenesis
      - Epigenetics
      - Genomic imprinting
      - Transposable element repression
      - X chromosome inactivation (lyonization)
    pass: 5
    hook: "الـ methylation بيكتم الجينات في 6 مواقف: الكِبَر والسرطان، والـ epigenetics والـ imprinting، وتكتيم الـ transposons، وتكتيم الـ X التاني عند البنات."
    src: { page: 32, quote: "Involved with aging, carcinogenesis, epigenetics, genomic imprinting, transposable element repression, and X chromosome inactivation (lyonization)." }
    status: unverified
  - id: bio.L01.010
    kind: cloze
    topic: dna-methylation
    text: Methylation within a gene promoter ({{c1::CpG islands}}) typically {{c2::represses (silences)}} gene transcription. "CpG methylation makes DNA mute."
    src: { page: 32, quote: "Methylation within gene promoter (CpG islands) typically represses (silences) gene transcription. CpG methylation makes DNA mute." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.011
    kind: card
    topic: dna-methylation
    front: Dysregulated DNA methylation is implicated in which trinucleotide repeat syndrome?
    back: Fragile X syndrome.
    src: { page: 32, quote: "Dysregulated DNA methylation is implicated in fragile X syndrome." }
    status: unverified
  - id: bio.L01.012
    kind: mcq
    topic: dna-methylation
    stem: >-
      A 7-year-old boy is evaluated for intellectual disability and hyperactivity. He has a long face,
      large ears and a prominent jaw. Genetic testing shows a large CGG repeat expansion in the
      promoter region of the FMR1 gene, and FMR1 protein is absent. Which mechanism most directly
      silences the gene?
    options:
      - Acetylation of histone lysine residues
      - Methylation of cytosines in promoter CpG islands
      - A nonsense mutation creating an early stop codon
      - Loss of the 5′ 7-methylguanosine cap
      - Deletion of the gene from the X chromosome
    answer: 1
    why:
      - "Histone acetylation removes the positive charge and relaxes DNA, increasing transcription."
      - "Right. Fragile X involves dysregulated DNA methylation: methylated CpG islands in the promoter silence transcription (CpG methylation makes DNA mute)."
      - "The gene's coding sequence is intact; the problem is that it isn't transcribed."
      - "Capping happens to the transcript; no transcript is made here."
      - "The repeat expansion silences the gene; it isn't deleted."
    src: { page: 32, quote: "Dysregulated DNA methylation is implicated in fragile X syndrome." }
    status: unverified
  # ---------- p32: histone modifications ----------
  - id: bio.L01.013
    kind: table
    topic: histone-modifications
    title: Histone modifications
    columns: [Modification, Effect on DNA, Transcription, Book's link]
    rows:
      - [Histone methylation, "Usually reversible suppression (can activate, depending on site)", "Mostly ↓ (\"makes DNA mute\")", "Lysine and arginine residues are methylated"]
      - [Histone acetylation, "Removes histone's positive charge → relaxed DNA coiling", "↑ (\"makes DNA active\")", "Thyroid hormone synthesis altered by acetylation of thyroid hormone receptor"]
      - [Histone deacetylation, "Removes acetyl groups → tightened DNA coiling", "↓ (\"deactivates DNA\")", "May explain altered gene expression in Huntington disease"]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 2], [2, 3]]
    src: { page: 32, quote: "Histone acetylation Removal of histone’s ⊕ charge → relaxed DNA coiling → ↑ transcription." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.014
    kind: cloze
    topic: histone-modifications
    text: Histone {{c1::acetylation}} removes the histone's positive charge → relaxed DNA coiling → {{c2::↑}} transcription.
    src: { page: 32, quote: "Histone acetylation Removal of histone’s ⊕ charge → relaxed DNA coiling → ↑ transcription." }
    status: unverified
  - id: bio.L01.015
    kind: card
    topic: histone-modifications
    front: Which neurodegenerative disease may involve altered gene expression from histone deacetylation?
    back: Huntington disease.
    src: { page: 32, quote: "Histone deacetylation may be responsible for altered gene expression in Huntington disease." }
    status: unverified
  - id: bio.L01.016
    kind: card
    topic: histone-modifications
    front: Acetylation of which receptor alters thyroid hormone synthesis?
    back: The thyroid hormone receptor.
    src: { page: 32, quote: "Thyroid hormone synthesis is altered by acetylation of thyroid hormone receptor." }
    status: unverified
  - id: bio.L01.017
    kind: mcq
    topic: histone-modifications
    stem: >-
      An investigational drug for a hematologic cancer inhibits histone deacetylases. In treated
      cells, chromatin around several tumor-suppressor genes becomes less condensed and their mRNA
      levels rise. Which change in the histones best explains the effect?
    options:
      - Gain of positive charge on lysine residues, tightening DNA binding
      - Persistent acetylation that neutralizes the positive charge of lysines
      - Increased methylation of CpG islands in the promoters
      - Loss of DNA phosphate groups
      - Increased histone methylation at arginine residues
    answer: 1
    why:
      - "Tighter binding would condense chromatin and lower transcription, the opposite of what is seen."
      - "Right. Blocking deacetylation keeps histones acetylated; acetylation removes their positive charge, relaxing DNA coiling and increasing transcription."
      - "CpG methylation is DNA methylation and silences genes; the drug acts on histones."
      - "DNA's negative charge comes from phosphates, which aren't removed."
      - "Histone methylation mostly makes DNA mute; it wouldn't raise mRNA levels here."
    src: { page: 32, quote: "Histone deacetylation Removal of acetyl groups → tightened DNA coiling → ↓ transcription." }
    status: unverified
  # ---------- p33: nucleotides ----------
  - id: bio.L01.018
    kind: card
    topic: nucleotides
    front: What is the difference between a nucleoside and a nucleotide, and what bond links nucleotides?
    back: "Nucleoside = base + (deoxy)ribose. Nucleotide = base + (deoxy)ribose + phosphate. Nucleotides are linked by a 3′-5′ phosphodiester bond. (Nucleo-\"tri\"-des have three components.)"
    src: { page: 33, quote: "Nucleoside = base + (deoxy)ribose (sugar). Nucleotide = base + (deoxy)ribose + phosphate; linked by 3′-5′ phosphodiester bond." }
    status: unverified
  - id: bio.L01.019
    kind: cloze
    topic: nucleotides
    text: Purines ({{c1::A, G}}) have {{c2::2}} rings; pyrimidines ({{c3::C, U, T}}) have 1 ring. "Pure As Gold"; "CUT the pyramid."
    src: { page: 33, quote: "Purines (A,G)—2 rings. Pyrimidines (C,U,T)—1 ring." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.020
    kind: table
    topic: nucleotides
    title: Deamination reactions
    columns: [Base, Deaminated to]
    rows:
      - [Cytosine, Uracil]
      - [Adenine, Hypoxanthine]
      - [Guanine, Xanthine]
      - [5-methylcytosine, Thymine]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 33, quote: "Deamination reactions: Cytosine → uracil Adenine → hypoxanthine Guanine → xanthine 5-methylcytosine → thymine" }
    status: unverified
  - id: bio.L01.021
    kind: card
    topic: nucleotides
    front: Which base is in RNA and which in DNA, and how is one made from the other?
    back: Uracil in RNA, thymine in DNA. Methylation of uracil makes thymine ("Thymine has a methyl").
    src: { page: 33, quote: "Uracil found in RNA; thymine in DNA. Methylation of uracil makes thymine." }
    status: unverified
  - id: bio.L01.022
    kind: cloze
    topic: nucleotides
    text: The C-G bond has {{c1::3}} H bonds and the A-T bond has {{c2::2}}, so ↑ C-G content → {{c3::↑ melting temperature}} of DNA ("C-G bonds are like Crazy Glue").
    src: { page: 33, quote: "C-G bond (3 H bonds) stronger than A-T bond (2 H bonds). ↑ C-G content → ↑ melting temperature of DNA." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.023
    kind: enumerate
    topic: nucleotides
    prompt: Enumerate the amino acids necessary for purine synthesis (3).
    points: [Glycine, Aspartate, Glutamine]
    pass: 3
    hook: "الكتاب بيقولها: cats purr until they GAG، يعني Glycine و Aspartate و Glutamine."
    src: { page: 33, quote: "Amino acids necessary for purine synthesis (cats purr until they GAG): Glycine Aspartate Glutamine" }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.024
    kind: card
    topic: nucleotides
    front: During DNA synthesis, which end of the incoming nucleotide carries the triphosphate, and why does it matter?
    back: The 5′ end; the triphosphate is the energy source for the new bond.
    src: { page: 33, quote: "5′ end of incoming nucleotide bears the triphosphate (energy source for the bond)." }
    status: unverified
  - id: bio.L01.025
    kind: mcq
    topic: nucleotides
    stem: >-
      A microbiologist compares the genomes of two bacterial species. Species X lives in hot springs
      at 85°C; species Y lives in the human gut. When their purified DNA is heated slowly, the DNA of
      species X separates into single strands at a much higher temperature. Which property of
      species X DNA best explains this?
    options:
      - A higher proportion of adenine-thymine base pairs
      - A higher proportion of guanine-cytosine base pairs
      - More uracil in place of thymine
      - Absence of phosphodiester bonds
      - More pyrimidine-pyrimidine pairs
    answer: 1
    why:
      - "A-T pairs have only 2 hydrogen bonds; more of them lowers the melting temperature."
      - "Right. C-G pairs have 3 hydrogen bonds (Crazy Glue), so ↑ C-G content → ↑ melting temperature."
      - "Uracil belongs in RNA; DNA uses thymine."
      - "Every DNA strand is held together by 3′-5′ phosphodiester bonds."
      - "Each base pair is always one purine with one pyrimidine."
    src: { page: 33, quote: "C-G bond (3 H bonds) stronger than A-T bond (2 H bonds). ↑ C-G content → ↑ melting temperature of DNA." }
    status: unverified
  # ---------- p34: de novo pyrimidine and purine synthesis ----------
  - id: bio.L01.026
    kind: card
    topic: de-novo-nucleotide-synthesis
    front: What is the rate-limiting enzyme of de novo pyrimidine synthesis, and what do the 2 carbamoyl phosphate synthetases differ in?
    back: "Carbamoyl phosphate synthetase II (CPS2). CPS1 = mitochondria, urea cycle, liver (\"m1tochondria\"). CPS2 = cytosol, pyrimidine synthesis, most cells (\"cytwosol\")."
    src: { page: 34, quote: "CPS1 = m1tochondria, urea cycle, found in liver CPS2 = cytwosol, pyrimidine synthesis, found in most cells" }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.027
    kind: card
    topic: de-novo-nucleotide-synthesis
    front: What 4 things does de novo purine synthesis require?
    back: Aspartate, glycine, glutamine and THF.
    src: { page: 34, quote: "(de novo requires aspartate, glycine, glutamine, and THF)" }
    status: unverified
  - id: bio.L01.028
    kind: table
    topic: de-novo-nucleotide-synthesis
    title: Drugs that interfere with nucleotide synthesis
    columns: [Drug, Enzyme or step blocked, Pathway]
    rows:
      - [Leflunomide, Dihydroorotate dehydrogenase, Pyrimidine]
      - [5-FU (and its prodrug capecitabine), "Thymidylate synthase (via 5-F-dUMP) → ↓ dTMP", Pyrimidine]
      - [6-MP (and its prodrug azathioprine), "Converted to 6-thioguanine nucleotides (6-TGNs)", Purine]
      - [Mycophenolate, Inosine monophosphate dehydrogenase, Purine]
      - [Ribavirin, Inosine monophosphate dehydrogenase, Purine]
      - [Hydroxyurea, Ribonucleotide reductase, Purine and pyrimidine]
      - ["Methotrexate, trimethoprim, pyrimethamine", Dihydrofolate reductase (↓ dTMP), Purine and pyrimidine]
    blanks: [[0, 1], [1, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 34, quote: "Various immunosuppressive, antineoplastic, and antibiotic drugs function by interfering with nucleotide synthesis" }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.029
    kind: cloze
    topic: de-novo-nucleotide-synthesis
    text: 5-fluorouracil and its prodrug {{c1::capecitabine}} form {{c2::5-F-dUMP}}, which inhibits {{c3::thymidylate synthase}} (↓ dTMP).
    src: { page: 34, quote: "5-fluorouracil (5-FU) and its prodrug capecitabine: form 5-F-dUMP, which inhibits thymidylate synthase (↓ deoxythymidine monophosphate [dTMP])" }
    status: unverified
  - id: bio.L01.030
    kind: card
    topic: de-novo-nucleotide-synthesis
    front: Methotrexate, trimethoprim and pyrimethamine all inhibit dihydrofolate reductase. In which organism does each act?
    back: Methotrexate in humans, trimethoprim in bacteria, pyrimethamine in protozoa.
    src: { page: 34, quote: "inhibit dihydrofolate reductase (↓ dTMP) in humans (methotrexate), bacteria (trimethoprim), and protozoa (pyrimethamine)" }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.031
    kind: card
    topic: de-novo-nucleotide-synthesis
    front: Why is giving allopurinol with azathioprine or 6-MP dangerous, and what should be done?
    back: Xanthine oxidase inhibitors ↑ 6-MP conversion → ↑ 6-thioguanine nucleotide levels (toxic) → ↑ risk of severe immunosuppression. Reduce the dose and monitor the CBC.
    src: { page: 34, quote: "Concurrent use of xanthine oxidase inhibitors (eg, allopurinol) ↑ 6-MP conversion → ↑ 6-TGN levels (toxic) → ↑ risk of severe immunosuppression; reduce dose and monitor CBC." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.032
    kind: card
    topic: de-novo-nucleotide-synthesis
    front: Which step of nucleotide synthesis is impaired in orotic aciduria?
    back: The conversion of orotic acid to UMP in pyrimidine synthesis.
    src: { page: 34, quote: "Impaired in orotic aciduria" }
    status: unverified
  - id: bio.L01.033
    kind: mcq
    topic: de-novo-nucleotide-synthesis
    stem: >-
      A 45-year-old man with Crohn disease has taken azathioprine for 2 years with stable blood counts.
      Three weeks ago he developed an acute gout attack and was started on allopurinol, with no change
      to his azathioprine dose. He now has fever and mouth ulcers; WBC is 1,100/mm³. Which mechanism
      best explains the leukopenia?
    options:
      - Allopurinol inhibits dihydrofolate reductase in marrow cells
      - Xanthine oxidase inhibition increases conversion of 6-MP to toxic 6-thioguanine nucleotides
      - Allopurinol inhibits inosine monophosphate dehydrogenase
      - Azathioprine accumulates because allopurinol blocks its renal excretion
      - Allopurinol inhibits ribonucleotide reductase
    answer: 1
    why:
      - "DHFR is the target of methotrexate, trimethoprim and pyrimethamine, not allopurinol."
      - "Right. Azathioprine is a prodrug of 6-MP; blocking xanthine oxidase ↑ 6-MP conversion → ↑ 6-TGN levels → severe immunosuppression. Reduce the dose and monitor the CBC."
      - "IMP dehydrogenase is blocked by mycophenolate and ribavirin."
      - "The interaction is metabolic, through xanthine oxidase, not renal."
      - "Ribonucleotide reductase is the target of hydroxyurea."
    src: { page: 34, quote: "Concurrent use of xanthine oxidase inhibitors (eg, allopurinol) ↑ 6-MP conversion → ↑ 6-TGN levels (toxic) → ↑ risk of severe immunosuppression; reduce dose and monitor CBC." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.034
    kind: mcq
    topic: de-novo-nucleotide-synthesis
    stem: >-
      A 52-year-old woman with rheumatoid arthritis starts a drug that blocks pyrimidine synthesis in
      activated lymphocytes by inhibiting the enzyme that oxidizes dihydroorotate. Which drug was she
      given?
    options:
      - Methotrexate
      - Leflunomide
      - Mycophenolate mofetil
      - Hydroxyurea
      - 5-fluorouracil
    answer: 1
    why:
      - "Methotrexate inhibits dihydrofolate reductase."
      - "Right. Leflunomide inhibits dihydroorotate dehydrogenase in pyrimidine synthesis."
      - "Mycophenolate inhibits IMP dehydrogenase, a purine step."
      - "Hydroxyurea inhibits ribonucleotide reductase."
      - "5-FU inhibits thymidylate synthase via 5-F-dUMP."
    src: { page: 34, quote: "Leflunomide: inhibits dihydroorotate dehydrogenase" }
    status: unverified
  # ---------- p35: purine salvage deficiencies ----------
  - id: bio.L01.035
    kind: order
    topic: purine-salvage-deficiencies
    prompt: Put the steps from adenosine deaminase deficiency to immunodeficiency in order.
    steps:
      - ↓ ADA (adenosine and deoxyadenosine not degraded)
      - ↑ dATP
      - ↓ ribonucleotide reductase activity
      - ↓ DNA precursors in cells
      - ↓ lymphocytes
    src: { page: 35, quote: "↓ ADA → ↑ dATP → ↓ ribonucleotide reductase activity → ↓ DNA precursors in cells → ↓ lymphocytes." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.036
    kind: card
    topic: purine-salvage-deficiencies
    front: Adenosine deaminase deficiency is a major cause of which immunodeficiency, and how is it inherited?
    back: Severe combined immunodeficiency (SCID); autosomal recessive.
    src: { page: 35, quote: "One of the major causes of autosomal recessive SCID." }
    status: unverified
    tags: [high-yield]
  - id: bio.L01.037
    kind: card
    topic: purine-salvage-deficiencies
    front: What is the defect in Lesch-Nyhan syndrome, and why is uric acid high?
    back: Deficient or mutated HGPRT → ↓ GMP (from guanine) and ↓ IMP (from hypoxanthine). Compensatory ↑ purine synthesis (↑ PRPP amidotransferase) → excess uric acid.
    src: { page: 35, quote: "Defective purine salvage. Deficient or mutated HGPRT → ↓ GMP (from guanine) and ↓ IMP (from hypoxanthine) formation." }
    status: unverified
    tags: [high-yield]
