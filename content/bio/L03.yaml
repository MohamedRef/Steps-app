  # ---------- p50: elastin, Marfan, homocystinuria ----------
  - id: bio.L03.001
    kind: card
    topic: elastin
    front: Where is elastin found?
    back: Skin, lungs, large arteries, elastic ligaments, vocal cords, epiglottis and ligamenta flava.
    src: { page: 50, quote: "Stretchy protein within skin, lungs, large arteries, elastic ligaments, vocal cords, epiglottis, ligamenta flava" }
    status: unverified
  - id: bio.L03.045
    kind: cloze
    topic: elastin
    text: The ligamenta flava, which contain elastin, {{c1::connect vertebrae}} and move between {{c2::relaxed and stretched}} conformations.
    src: { page: 50, quote: "ligamenta flava (connect vertebrae → relaxed and stretched conformations)." }
    status: unverified
  - id: bio.L03.002
    kind: card
    topic: elastin
    front: How does the amino acid makeup of elastin differ from collagen?
    back: Elastin is rich in nonhydroxylated proline, glycine and lysine; collagen has hydroxylated residues.
    src: { page: 50, quote: "Rich in nonhydroxylated proline, glycine, and lysine residues, vs the hydroxylated residues of collagen." }
    status: unverified
  - id: bio.L03.003
    kind: card
    topic: elastin
    front: How is elastin assembled, and what gives it its elastic properties?
    back: Tropoelastin on a fibrillin scaffold; extracellular cross-linking by lysyl oxidase gives it elasticity.
    src: { page: 50, quote: "Tropoelastin with fibrillin scaffolding. Cross-linking occurs extracellularly via lysyl oxidase and gives elastin its elastic properties." }
    status: unverified
  - id: bio.L03.004
    kind: card
    topic: elastin
    front: What breaks down elastin, what normally inhibits it, and what happens in deficiency?
    back: Elastase, normally inhibited by α1-antitrypsin. α1-antitrypsin deficiency → unopposed elastase → COPD.
    src: { page: 50, quote: "Broken down by elastase, which is normally inhibited by α1-antitrypsin. α1-Antitrypsin deficiency results in unopposed elastase activity, which can cause COPD." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.005
    kind: card
    topic: elastin
    front: What is the genetic defect in Marfan syndrome?
    back: An FBN1 mutation on chromosome 15 (fifteen) → defective fibrillin-1, a glycoprotein that sheathes elastin and sequesters TGF-β.
    src: { page: 50, quote: "FBN1 gene mutation on chromosome 15 (fifteen) results in defective fibrillin-1, a glycoprotein that forms a sheath around elastin and sequesters TGF-β." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.040
    kind: cloze
    topic: elastin
    text: Marfan syndrome is {{c1::autosomal dominant}}, with variable expression and symptoms due to {{c2::pleiotropy}}.
    src: { page: 50, quote: "Marfan syndrome—autosomal dominant (with variable expression and symptoms due to pleiotropy) connective tissue disorder affecting skeleton, heart, and eyes." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.006
    kind: enumerate
    topic: elastin
    prompt: Enumerate the findings of Marfan syndrome.
    points:
      - Tall with long extremities
      - Chest wall deformity (pectus carinatum or excavatum)
      - Hypermobile joints
      - Arachnodactyly (long, tapering fingers and toes)
      - Cystic medial necrosis of the aorta; aortic root aneurysm rupture or dissection
      - Mitral valve prolapse
      - ↑ risk of spontaneous pneumothorax
    pass: 5
    hook: "Marfan هنا في 3 أماكن: الهيكل (طويل، صدر، مفاصل، صوابع)، القلب (aorta و mitral)، والرئة (pneumothorax)."
    src: { page: 50, quote: "Findings: tall with long extremities; chest wall deformity (pectus carinatum [pigeon chest] or pectus excavatum A ); hypermobile joints; long, tapering fingers and toes (arachnodactyly); cystic medial necrosis of aorta" }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.007
    kind: card
    topic: elastin
    front: What is the most common cause of death in Marfan syndrome?
    back: Aortic root aneurysm rupture or dissection.
    src: { page: 50, quote: "aortic root aneurysm rupture or dissection (most common cause of death)" }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.008
    kind: card
    topic: elastin
    front: What most commonly causes homocystinuria?
    back: Cystathionine-β-synthase deficiency, which leads to homocysteine buildup.
    src: { page: 50, quote: "Homocystinuria—most commonly due to cystathionine‐β‐synthase deficiency leading to homocysteine buildup." }
    status: unverified
  - id: bio.L03.039
    kind: enumerate
    topic: elastin
    prompt: Enumerate the Marfan-like features of homocystinuria, and the one that differs from Marfan syndrome.
    points:
      - Pectus deformity
      - Tall stature
      - ↑ arm:height ratio
      - ↓ upper:lower body segment ratio
      - Arachnodactyly
      - Joint hyperlaxity
      - Skin hyperelasticity
      - Scoliosis
      - Fair complexion (vs Marfan syndrome)
    pass: 7
    src: { page: 50, quote: "Presentation similar to Marfan syndrome with pectus deformity, tall stature, ↑ arm:height ratio, ↓ upper:lower body segment ratio, arachnodactyly, joint hyperlaxity, skin hyperelasticity, scoliosis, fair complexion (vs Marfan syndrome)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.009
    kind: table
    topic: elastin
    title: Marfan syndrome vs homocystinuria
    columns: [Feature, Marfan syndrome, Homocystinuria]
    rows:
      - [Inheritance, Autosomal dominant, Autosomal recessive]
      - [Intellect, Normal, Decreased]
      - [Vascular complications, Aortic root dilatation, Thrombosis]
      - [Lens dislocation, "Upward/temporal (Marfan fans out)", "Downward/nasal"]
    blanks: [[0, 1], [0, 2], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 50, quote: "INHERITANCE Autosomal dominant Autosomal recessive INTELLECT Normal Decreased VASCULAR COMPLICATIONS Aortic root dilatation Thrombosis" }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.010
    kind: mcq
    topic: elastin
    stem: >-
      A 19-year-old college basketball player collapses with sudden tearing chest pain radiating to his
      back. He is 203 cm tall with long fingers, a sunken sternum and upward-displaced lenses that were
      found last year. His father died suddenly at 35. A defect in which protein is the underlying cause?
    options:
      - Type III collagen
      - Fibrillin-1
      - Cystathionine-β-synthase
      - Elastase
      - Lysyl oxidase
    answer: 1
    why:
      - "Type III collagen defects give vascular Ehlers-Danlos (thin skin, bruising), not tall stature and upward lens dislocation."
      - "Right. Marfan syndrome: FBN1 mutation → defective fibrillin-1. Aortic root dissection is the most common cause of death; lenses go up and out (Marfan fans out)."
      - "CBS deficiency (homocystinuria) gives downward lens dislocation, thrombosis and ↓ intellect, recessive."
      - "Unopposed elastase damages lungs (COPD) in α1-antitrypsin deficiency."
      - "Lysyl oxidase is copper dependent and fails in Menkes disease."
    src: { page: 50, quote: "FBN1 gene mutation on chromosome 15 (fifteen) results in defective fibrillin-1, a glycoprotein that forms a sheath around elastin and sequesters TGF-β." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.011
    kind: mcq
    topic: elastin
    stem: >-
      A 14-year-old girl with learning difficulties is tall and thin with long fingers, scoliosis and fair
      skin. She has had a deep vein thrombosis of the leg. Slit-lamp examination shows both lenses
      displaced downward and inward. Her parents are unaffected first cousins. Which finding is most
      likely?
    options:
      - FBN1 mutation on chromosome 15
      - Elevated plasma homocysteine
      - Low serum α1-antitrypsin
      - Absent type III procollagen
      - Elevated very-long-chain fatty acids
    answer: 1
    why:
      - "FBN1 (Marfan) is dominant, with normal intellect, aortic dilatation and upward lens dislocation."
      - "Right. Homocystinuria (cystathionine-β-synthase deficiency, autosomal recessive): Marfan-like body, ↓ intellect, thrombosis, downward/nasal lens dislocation, fair complexion."
      - "α1-antitrypsin deficiency causes COPD from unopposed elastase."
      - "Type III procollagen defects cause vascular Ehlers-Danlos."
      - "VLCFA rise in peroxisomal disorders."
    src: { page: 50, quote: "LENS DISLOCATION Upward/temporal (Marfan fans out) Downward/nasal" }
    status: unverified
    tags: [high-yield]
  # ---------- p50: PCR ----------
  - id: bio.L03.012
    kind: card
    topic: pcr
    front: "What does PCR do, and which 2 diagnoses is it used for as examples?"
    back: It amplifies a desired fragment of DNA. Examples are neonatal HIV and herpes encephalitis.
    src: { page: 50, quote: "Molecular biology lab procedure used to amplify a desired fragment of DNA. Useful as a diagnostic tool (eg, neonatal HIV, herpes encephalitis)." }
    status: unverified
  - id: bio.L03.013
    kind: order
    topic: pcr
    prompt: Put the steps of one PCR cycle in order.
    steps:
      - "Denaturation: template, primers, heat-stable DNA polymerase and dNTPs are heated to separate the strands"
      - "Annealing: the sample is cooled and primers bind the target sequence"
      - "Elongation: temperature is raised and the polymerase adds dNTPs after each primer"
    src: { page: 50, quote: "Annealing—sample is cooled. DNA primers anneal to the specific sequence to be amplified on the DNA template." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.046
    kind: cloze
    topic: pcr
    text: In PCR, the heating and cooling cycles continue until {{c1::the amount of DNA is sufficient}}.
    src: { page: 50, quote: "Heating and cooling cycles continue until the amount of DNA is sufficient." }
    status: unverified
  - id: bio.L03.014
    kind: mcq
    topic: pcr
    stem: >-
      A 6-week-old boy born to a mother with untreated HIV is brought for a well-baby visit. He is
      feeding well and gaining weight, and the examination is normal. His anti-HIV antibody test is
      positive, but maternal IgG crosses the placenta. Which test best shows whether he is infected?
    options:
      - ELISA for anti-HIV antibodies
      - Western blot for anti-HIV antibodies
      - PCR for HIV nucleic acid
      - Flow cytometry for CD4+ count
      - Karyotyping
    answer: 2
    why:
      - "ELISA detects antibodies, which may be the mother's IgG."
      - "Western blot also detects antibodies, with the same problem."
      - "Right. PCR amplifies the virus's own nucleic acid; neonatal HIV is the book's example of PCR as a diagnostic tool."
      - "A CD4+ count follows HIV but doesn't diagnose infection in an infant."
      - "Karyotyping finds chromosomal imbalances."
    src: { page: 50, quote: "Useful as a diagnostic tool (eg, neonatal HIV, herpes encephalitis)." }
    status: unverified
  # ---------- p51: CRISPR/Cas9 ----------
  - id: bio.L03.015
    kind: card
    topic: crispr-cas9
    front: What are the 2 parts of CRISPR/Cas9, and what does each do?
    back: A guide RNA (gRNA) complementary to the target DNA, and Cas9, an endonuclease that makes a single- or double-strand break at the target site.
    src: { page: 51, quote: "Consists of a guide RNA (gRNA), which is complementary to a target DNA sequence, and an endonuclease (Cas9), which makes a single- or double-strand break at the target site." }
    status: unverified
  - id: bio.L03.047
    kind: cloze
    topic: crispr-cas9
    text: CRISPR/Cas9 is a genome editing tool derived from {{c1::bacteria}}.
    src: { page: 51, quote: "A genome editing tool derived from bacteria." }
    status: unverified
  - id: bio.L03.016
    kind: card
    topic: crispr-cas9
    front: After Cas9 cuts, how is a knock-out made and how is a knock-in made?
    back: "Knock-out: nonhomologous end joining (NHEJ) → frameshift/inactivation. Knock-in: homology-directed repair (HDR) with donor DNA → edited sequence."
    src: { page: 51, quote: "Frameshift/inactivation (”knock-out”) Edited sequence (”knock-in”) NHEJ Donor DNA + HDR" }
    status: unverified
  - id: bio.L03.017
    kind: card
    topic: crispr-cas9
    front: "What are 3 applications of CRISPR/Cas9?"
    back: Removing virulence factors from pathogens, replacing disease-causing alleles with healthy variants (eg, sickle cell disease), and targeting tumor cells.
    src: { page: 51, quote: "Applications include removing virulence factors from pathogens, replacing disease-causing alleles of genes with healthy variants (eg, sickle cell disease), and specifically targeting tumor cells." }
    status: unverified
  - id: bio.L03.018
    kind: mcq
    topic: crispr-cas9
    stem: >-
      A 19-year-old man with sickle cell disease has had 5 hospital admissions for pain crises this year.
      He enrolls in a gene-editing trial. His hematopoietic stem cells are collected and given a guide
      RNA matching the mutant β-globin sequence, Cas9, and a donor DNA template carrying the normal
      sequence. Which repair process must his cells use to insert the correct sequence?
    options:
      - Nonhomologous end joining
      - Homology-directed repair
      - Mismatch repair
      - Nucleotide excision repair
      - Base excision repair
    answer: 1
    why:
      - "NHEJ joins the cut ends without a template and gives a frameshift knock-out."
      - "Right. A donor template with HDR gives an edited sequence (knock-in), replacing the disease allele."
      - "Mismatch repair fixes replication errors in the new strand, not Cas9 cuts."
      - "NER removes bulky lesions like pyrimidine dimers."
      - "BER removes single damaged bases."
    src: { page: 51, quote: "Frameshift/inactivation (”knock-out”) Edited sequence (”knock-in”) NHEJ Donor DNA + HDR" }
    status: unverified
  # ---------- p51: blotting procedures ----------
  - id: bio.L03.019
    kind: table
    topic: blotting
    title: Blotting procedures (SNoW DRoP)
    columns: [Blot, Sample, Probe, Detects]
    rows:
      - [Southern, DNA, Labeled DNA probe, "Size of specific sequences (heterozygosity, CGG repeats in FMR1)"]
      - [Northern, RNA, Labeled DNA probe, "mRNA levels and size (gene expression); splicing errors"]
      - [Western, Protein, Labeled antibody, Specific protein and its quantity]
      - [Southwestern, Protein, Labeled dsDNA, "DNA-binding proteins (eg, transcription factors)"]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2], [3, 2], [3, 3]]
    src: { page: 51, quote: "SNoW DRoP: Southern = DNA Northern = RNA Western = Protein" }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.020
    kind: order
    topic: blotting
    prompt: Put the steps of a Southern blot in order.
    steps:
      - DNA is cut enzymatically into smaller pieces
      - The pieces are separated by gel electrophoresis
      - They are transferred to a membrane
      - The membrane is exposed to a labeled DNA probe that anneals to its complementary strand
      - The labeled double-stranded DNA is visualized on film or a digital imager
    src: { page: 51, quote: "DNA sample is enzymatically cleaved into smaller pieces, which are separated by gel electrophoresis, and then transferred to a membrane." }
    status: unverified
  - id: bio.L03.048
    kind: card
    topic: blotting
    front: How does a Northern blot differ from a Southern blot, and what does it detect?
    back: It is the same method except that an RNA sample is electrophoresed. It studies mRNA levels and size (reflecting gene expression) and detects splicing errors.
    src: { page: 51, quote: "Similar to Southern blot, except that an RNA sample is electrophoresed. Useful for studying mRNA levels and size, which are reflective of gene expression. Detects splicing errors." }
    status: unverified
  - id: bio.L03.049
    kind: card
    topic: blotting
    front: How is a Western blot done, and what does it tell you?
    back: Sample protein is separated by gel electrophoresis and transferred to a membrane; a labeled antibody binds the relevant protein. It identifies a specific protein and determines its quantity.
    src: { page: 51, quote: "Sample protein is separated via gel electrophoresis and transferred to a membrane. Labeled antibody is used to bind relevant protein. This helps identify specific protein and determines quantity." }
    status: unverified
  - id: bio.L03.021
    kind: mcq
    topic: blotting
    stem: >-
      A 5-year-old boy has developmental delay, a long face and large ears. To confirm the diagnosis, his
      DNA is cut with restriction enzymes, run on a gel, transferred to a membrane and hybridized with a
      labeled probe for the FMR1 gene; the band is much larger than normal. Which technique was used?
    options:
      - Northern blot
      - Southern blot
      - Western blot
      - Southwestern blot
      - ELISA
    answer: 1
    why:
      - "Northern blot runs RNA, not cut DNA."
      - "Right. Southern blot (DNA) sizes specific sequences, such as the number of CGG repeats in FMR1 for fragile X."
      - "Western blot detects proteins with antibodies."
      - "Southwestern blot probes protein with dsDNA to find DNA-binding proteins."
      - "ELISA detects antigens or antibodies."
    src: { page: 51, quote: "Useful to identify size of specific sequences (eg, determination of heterozygosity [as seen in image], # of CGG repeats in FMR1 to diagnose fragile X syndrome)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.022
    kind: mcq
    topic: blotting
    stem: >-
      A 6-year-old boy is brought to the pediatric clinic because he falls often and has trouble climbing
      stairs. He has calf enlargement and uses his hands to push himself up from the floor; serum
      creatine kinase is markedly raised. His physician suspects a mutation that makes an exon be skipped
      when his dystrophin transcript is processed, and wants to see whether the dystrophin mRNA in his
      muscle is shorter than normal. Which technique fits best?
    options:
      - Southern blot
      - Northern blot
      - Western blot
      - Southwestern blot
      - Karyotyping
    answer: 1
    why:
      - "A Southern blot sizes DNA, which wouldn't show a processing error."
      - "Right. Northern blot runs RNA and shows mRNA level and size; it detects splicing errors."
      - "Western blot would show the protein, not the transcript."
      - "Southwestern blot finds DNA-binding proteins."
      - "Karyotyping shows whole chromosomes."
    src: { page: 51, quote: "Useful for studying mRNA levels and size, which are reflective of gene expression. Detects splicing errors." }
    status: unverified
  # ---------- p52: flow cytometry ----------
  - id: bio.L03.023
    kind: card
    topic: flow-cytometry
    front: Which 3 properties of individual cells does flow cytometry assess?
    back: Size, granularity and protein expression (immunophenotype).
    src: { page: 52, quote: "Laboratory technique to assess size, granularity, and protein expression (immunophenotype) of individual cells in a sample." }
    status: unverified
  - id: bio.L03.041
    kind: order
    topic: flow-cytometry
    prompt: Put the steps of flow cytometry in order.
    steps:
      - Cells are tagged with antibodies to surface or intracellular proteins
      - The antibodies carry a unique fluorescent dye
      - A laser is focused on one cell at a time
      - Light scatter and fluorescence intensity are measured and plotted
    src: { page: 52, quote: "Cells are tagged with antibodies specific to surface or intracellular proteins. Antibodies are then tagged with a unique fluorescent dye. Sample is analyzed one cell at a time by focusing a laser on the cell and measuring light scatter and intensity of fluorescence." }
    status: unverified
  - id: bio.L03.050
    kind: card
    topic: flow-cytometry
    front: How are flow cytometry data plotted?
    back: As a histogram (one measure) or a scatter plot (any two measures).
    src: { page: 52, quote: "Data are plotted either as histogram (one measure) or scatter plot (any two measures, as shown)." }
    status: unverified
  - id: bio.L03.051
    kind: table
    topic: flow-cytometry
    title: "Reading a CD3 vs CD8 flow cytometry scatter plot"
    columns: [Quadrant, CD8, CD3]
    rows:
      - [Left lower, "⊝", "⊝"]
      - [Right lower (empty), "⊕", "⊝"]
      - [Left upper, "⊝", "⊕"]
      - [Right upper, "⊕", "⊕"]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 52, quote: "Cells in left lower quadrant ⊝ for both CD8 and CD3. ▘ Cells in right lower quadrant ⊕ for CD8 and ⊝ for CD3. In this example, right lower quadrant is empty because all CD8-expressing cells also express CD3. ▘ Cells in left upper quadrant ⊕ for CD3 and ⊝ for CD8. ▘ Cells in right upper quadrant ⊕ for both CD8 and CD3." }
    status: unverified
  - id: bio.L03.024
    kind: card
    topic: flow-cytometry
    front: In a CD3 vs CD8 flow scatter plot, why is the right lower quadrant (CD8+ CD3−) empty?
    back: Because all CD8-expressing cells also express CD3.
    src: { page: 52, quote: "In this example, right lower quadrant is empty because all CD8-expressing cells also express CD3." }
    status: unverified
  - id: bio.L03.025
    kind: card
    topic: flow-cytometry
    front: In which conditions is flow cytometry commonly used?
    back: Hematologic workups (leukemia, paroxysmal nocturnal hemoglobinuria, fetal RBCs in the pregnant person's blood) and immunodeficiencies (CD4+ count in HIV).
    src: { page: 52, quote: "Commonly used in workup of hematologic abnormalities (eg, leukemia, paroxysmal nocturnal hemoglobinuria, fetal RBCs in pregnant person’s blood) and immunodeficiencies (eg, CD4+ cell count in HIV)." }
    status: unverified
  - id: bio.L03.026
    kind: mcq
    topic: flow-cytometry
    stem: >-
      A 34-year-old man with HIV infection comes for follow-up 6 months after starting antiretroviral
      therapy. He feels well, and his physician wants to know how far his immune system has recovered
      before stopping prophylaxis against Pneumocystis pneumonia. Which laboratory technique produces
      the measurement she needs?
    options:
      - ELISA
      - Flow cytometry
      - Western blot
      - Microarray
      - PCR
    answer: 1
    why:
      - "ELISA detects antigen or antibody in a sample (eg, HIV screening), not the number of a cell type."
      - "Right. Immune recovery in HIV is judged by the CD4+ cell count, which flow cytometry measures by reading antibody-tagged cells one at a time."
      - "Western blot identifies a protein in a lysate."
      - "Microarrays compare gene transcription between RNA samples."
      - "PCR measures viral nucleic acid (viral load), not his immune cells."
    src: { page: 52, quote: "Commonly used in workup of hematologic abnormalities (eg, leukemia, paroxysmal nocturnal hemoglobinuria, fetal RBCs in pregnant person’s blood) and immunodeficiencies (eg, CD4+ cell count in HIV)." }
    status: unverified
  # ---------- p52: microarrays ----------
  - id: bio.L03.027
    kind: card
    topic: microarrays
    front: What are microarrays used for when run on RNA?
    back: Comparing the relative transcription of genes in two RNA samples.
    src: { page: 52, quote: "Used to compare the relative transcription of genes in two RNA samples." }
    status: unverified
  - id: bio.L03.042
    kind: cloze
    topic: microarrays
    text: When run on DNA, microarrays detect {{c1::single nucleotide polymorphisms (SNPs)}} and {{c2::copy number variants (CNVs)}}.
    src: { page: 52, quote: "Can detect single nucleotide polymorphisms (SNPs) and copy number variants (CNVs) for genotyping, clinical genetic testing, forensic analysis, and cancer mutation and genetic linkage analysis when DNA is used." }
    status: unverified
  - id: bio.L03.043
    kind: enumerate
    topic: microarrays
    prompt: Enumerate the uses of DNA microarrays (5).
    points:
      - Genotyping
      - Clinical genetic testing
      - Forensic analysis
      - Cancer mutation analysis
      - Genetic linkage analysis
    pass: 4
    src: { page: 52, quote: "Can detect single nucleotide polymorphisms (SNPs) and copy number variants (CNVs) for genotyping, clinical genetic testing, forensic analysis, and cancer mutation and genetic linkage analysis when DNA is used." }
    status: unverified
  - id: bio.L03.028
    kind: mcq
    topic: microarrays
    stem: >-
      A 52-year-old woman has a 2-cm invasive breast carcinoma removed at a cancer center. To guide her
      treatment, the laboratory compares her tumor with adjacent normal breast tissue to find which of
      thousands of genes are switched on or off in the tumor. RNA from each sample is labeled with a
      different dye and both are hybridized to one chip of known DNA probes. Which technique is this?
    options:
      - Northern blot
      - Microarray
      - Spectral karyotyping
      - Southern blot
      - Flow cytometry
    answer: 1
    why:
      - "A Northern blot looks at one transcript at a time."
      - "Right. Microarrays compare relative transcription of genes in two RNA samples."
      - "Spectral karyotyping paints whole chromosomes."
      - "A Southern blot sizes DNA sequences."
      - "Flow cytometry reads proteins on single cells."
    src: { page: 52, quote: "Used to compare the relative transcription of genes in two RNA samples." }
    status: unverified
  # ---------- p52: ELISA ----------
  - id: bio.L03.029
    kind: table
    topic: elisa
    title: Direct vs indirect ELISA
    columns: [Type, Detects, Labeled antibody]
    rows:
      - [Direct ELISA, A specific antigen, Labeled 1° antibody]
      - [Indirect ELISA, An antibody in the patient's blood, Labeled 2° antibody]
    blanks: [[0, 1], [1, 1]]
    src: { page: 52, quote: "Immunologic test used to detect the presence of either a specific antigen (in direct ELISA) or antibody (in indirect ELISA) in a patient’s blood sample." }
    status: unverified
  - id: bio.L03.030
    kind: card
    topic: elisa
    front: How does ELISA produce a signal?
    back: The detecting antibody carries an enzyme; substrate added to the well reacts with that enzyme and gives a signal that can be read.
    src: { page: 52, quote: "Detection involves the use of an antibody linked to an enzyme. Added substrate reacts with the enzyme, producing a detectable signal." }
    status: unverified
  - id: bio.L03.044
    kind: cloze
    topic: elisa
    text: ELISA can have high sensitivity and specificity but is less specific than {{c1::Western blot}}; it is often used to screen for {{c2::HIV}} infection.
    src: { page: 52, quote: "Can have high sensitivity and specificity, but is less specific than Western blot. Often used to screen for HIV infection." }
    status: unverified
  - id: bio.L03.031
    kind: mcq
    topic: elisa
    stem: >-
      A 26-year-old woman has a routine visit before planning a pregnancy. She has no symptoms. Her
      serum is added to wells coated with HIV antigens, followed by an enzyme-linked anti-human IgG
      antibody and a substrate, and the well turns colored. What does this result show?
    options:
      - HIV antigen in her blood
      - Antibodies against HIV in her blood
      - HIV RNA in her blood
      - Her CD4+ cell count
      - An HIV-specific protein separated by size
    answer: 1
    why:
      - "Direct ELISA detects antigen with a labeled primary antibody; here the wells already hold the antigen."
      - "Right. Indirect ELISA detects the patient's antibody with a labeled secondary antibody; it is often used to screen for HIV."
      - "Nucleic acid is detected by PCR."
      - "Cell counts come from flow cytometry."
      - "Separating proteins by size is Western blot."
