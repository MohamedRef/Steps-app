  - id: bio.L03.035
    kind: card
    topic: karyotyping
    front: What is FISH used for?
    back: A fluorescent DNA or RNA probe binds specific genes or sites on chromosomes, for specific localization.
    src: { page: 53, quote: "Fluorescence in situ hybridization (FISH)—fluorescent DNA or RNA probe binds to specific genes or other sites of interest on chromosomes. Used for specific localization." }
