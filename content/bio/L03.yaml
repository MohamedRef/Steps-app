  - id: bio.L03.036
    kind: mcq
    topic: karyotyping
    stem: >-
      A cytogenetics lab receives amniotic fluid from a 39-year-old woman at 16 weeks of gestation. Before
      staining, the technician adds a drug to the cultured fetal cells so that their chromosomes can be
      seen condensed and counted. Which phase do the cells stop in, and why?
    options:
      - G1, because the drug inhibits CDKs
      - Metaphase, because the drug disrupts the spindle
      - S phase, because the drug blocks ribonucleotide reductase
      - Anaphase, because the drug blocks cohesin cleavage
      - G0, because the drug removes growth factors
    answer: 1
    why:
      - "CDK inhibition stops cells at G1, before chromosomes condense."
      - "Right. Colchicine disrupts mitotic spindle assembly and arrests cells at metaphase, when chromosomes are condensed for Giemsa staining."
      - "Blocking ribonucleotide reductase is hydroxyurea and stops DNA synthesis, with uncondensed chromatin."
      - "The book's method arrests at metaphase, before anaphase."
      - "Cells in G0 don't show condensed chromosomes."
    src: { page: 53, quote: "Colchicine is added to cultured cells to disrupt the assembly of mitotic spindles and arrest cells at metaphase of mitosis." }
    status: unverified
  # ---------- p53: molecular cloning ----------
  - id: bio.L03.037
    kind: card
    topic: molecular-cloning
    front: What is molecular cloning, and what is it used for?
    back: "Making recombinant DNA inside host cells (bacteria or a eukaryotic cell line). It lets bacteria make human proteins such as insulin and growth hormone."
    src: { page: 53, quote: "Production of a recombinant DNA molecule in a bacterial or eukaryotic cell line host. Useful for production of human proteins by bacteria (eg, human growth hormone, insulin)." }
