  # ---------- p53: karyotyping, spectral karyotyping, FISH ----------
  - id: bio.L03.032
    kind: card
    topic: karyotyping
    front: How is a karyotype prepared?
    back: Colchicine is added to cultured cells to disrupt mitotic spindles and arrest them at metaphase. Chromosomes are stained with Giemsa and ordered by morphology, size, arm-length ratio and banding pattern.
    src: { page: 53, quote: "Colchicine is added to cultured cells to disrupt the assembly of mitotic spindles and arrest cells at metaphase of mitosis." }
    status: unverified
    tags: [high-yield]
  - id: bio.L03.033
    kind: card
    topic: karyotyping
    front: On what samples can karyotyping be done, and what does it diagnose?
    back: Blood, bone marrow, amniotic fluid or placental tissue. It diagnoses chromosomal imbalances (eg, autosomal trisomies, sex chromosome disorders).
    src: { page: 53, quote: "Can be performed on a sample of blood, bone marrow, amniotic fluid, or placental tissue. Used to diagnose chromosomal imbalances (eg, autosomal trisomies, sex chromosome disorders)." }
    status: unverified
  - id: bio.L03.052
    kind: card
    topic: karyotyping
    front: How does spectral karyotyping work, and what is it used to identify?
    back: Chromosomes are "painted" by hybridization with fluorescent probes that distinguish each chromosome from the others. It identifies aneuploidies and translocations in a karyotype.
    src: { page: 53, quote: "Chromosomes are “painted” by hybridization with fluorescent probes that distinguish each chromosome from the others. Used to identify aneuploidies and translocations in a karyotype." }
    status: unverified
