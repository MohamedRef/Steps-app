  - id: bio.L06.012
    kind: mcq
    topic: metabolic-compartmentation
    stem: >-
      A 52-year-old man with a high LDL cholesterol level and a family history of early myocardial
      infarction starts a drug that inhibits the rate-determining enzyme of cholesterol synthesis. The
      pathway this drug targets takes place in the same cell compartment as which other pathway?
    options:
      - Ketogenesis
      - Heme synthesis
      - Fatty acid synthesis
      - Urea cycle
      - Fatty acid β-oxidation
    answer: 2
    why:
      - "Ketogenesis is mitochondrial."
      - "Heme synthesis uses both the mitochondria and the cytoplasm."
      - "Right. Cholesterol synthesis (on the SER) runs in the cytoplasm, like glycolysis, the HMP shunt and fatty acid synthesis."
      - "The urea cycle uses both compartments."
      - "β-oxidation is mitochondrial."
    src: { page: 72, quote: "Cytoplasm Glycolysis, HMP shunt, and synthesis of cholesterol (SER), proteins (ribosomes, RER), fatty acids, and nucleotides." }
    status: unverified
