    back: Calcium-calmodulin activates glycogen phosphorylase kinase during contraction. (Muscle has no glucagon receptor; epinephrine works in both liver and muscle.)
    src: { page: 84, quote: "Calcium-calmodulin in muscle during contraction" }
    status: unverified
