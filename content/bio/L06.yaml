  - id: bio.L06.011
    kind: card
    topic: metabolic-compartmentation
    front: Which pathways happen in both the mitochondria and the cytoplasm?
    back: Heme synthesis, urea cycle and gluconeogenesis ("Hugs take two").
    src: { page: 72, quote: "Both Heme synthesis, urea cycle, gluconeogenesis. Hugs take two (both)." }
