  - id: bio.L06.024
    kind: card
    topic: glycolysis-regulation
    front: What is the net equation of glycolysis, and where does it happen?
    back: "In the cytoplasm: glucose + 2 Pi + 2 ADP + 2 NAD+ → 2 pyruvate + 2 ATP + 2 NADH + 2 H+ + 2 H2O."
    src: { page: 74, quote: "Net glycolysis (cytoplasm): Glucose + 2 Pi + 2 ADP + 2 NAD+ → 2 pyruvate + 2 ATP + 2 NADH + 2 H+ + 2 H2O." }
