    front: How do glucagon and epinephrine switch the liver from glycogen storage to breakdown?
    back: Their receptors raise cAMP (adenylate cyclase) → protein kinase A → activates glycogen phosphorylase kinase → glycogen phosphorylase on, glycogen synthase off. Insulin (tyrosine kinase receptor) activates protein phosphatase, doing the opposite.
