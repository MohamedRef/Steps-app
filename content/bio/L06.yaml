  - id: bio.L06.007
    kind: card
    topic: rate-determining-enzymes
    front: What activates the rate-limiting enzyme of the urea cycle?
    back: N-acetylglutamate activates carbamoyl phosphate synthetase I.
    src: { page: 71, quote: "Urea cycle Carbamoyl phosphate synthetase I N-acetylglutamate ⊕" }
