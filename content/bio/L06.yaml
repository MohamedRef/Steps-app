  # ---------- p71: enzyme terminology ----------
  - id: bio.L06.001
    kind: table
    topic: enzyme-terminology
    title: Enzyme descriptors
    columns: [Enzyme type, What it does, Example]
    rows:
      - [Kinase, Transfers a phosphate from a high-energy molecule (usually ATP), Phosphofructokinase]
      - [Phosphorylase, Adds inorganic phosphate without using ATP, Glycogen phosphorylase]
      - [Phosphatase, Removes a phosphate group, "Fructose-1,6-bisphosphatase 1"]
      - [Dehydrogenase, Catalyzes oxidation-reduction, Pyruvate dehydrogenase]
      - [Hydroxylase, Adds a hydroxyl group (−OH), Tyrosine hydroxylase]
      - [Carboxylase, Transfers carboxyl groups with the help of biotin, Pyruvate carboxylase]
      - [Mutase, Relocates a functional group within a molecule, Methylmalonyl-CoA mutase]
      - [Synthase, Synthesis without ATP as the energy source, Glycogen synthase]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1], [5, 1], [6, 1], [7, 1]]
    src: { page: 71, quote: "Phosphorylase Adds inorganic phosphate onto substrate without using ATP (eg, glycogen phosphorylase)." }
    status: unverified
  - id: bio.L06.002
    kind: card
    topic: enzyme-terminology
    front: Kinase vs phosphorylase vs phosphatase?
    back: Kinase transfers a phosphate from a high-energy molecule (usually ATP). Phosphorylase adds inorganic phosphate without using ATP. Phosphatase removes a phosphate group.
    src: { page: 71, quote: "Kinase Catalyzes transfer of a phosphate group from a high-energy molecule (usually ATP) to a substrate (eg, phosphofructokinase)." }
    status: unverified
  - id: bio.L06.003
    kind: mcq
    topic: enzyme-terminology
    stem: >-
      A 3-month-old girl is brought to the emergency department with poor feeding, vomiting and
      hypotonia. Labs show a high anion gap metabolic acidosis, low blood glucose and hyperammonemia.
      Urine methylmalonic acid is markedly elevated, and her serum vitamin B12 level is normal. The
      deficient enzyme belongs to which enzyme class?
    options:
      - Carboxylase
      - Kinase
      - Mutase
      - Synthase
      - Phosphorylase
    answer: 2
    why:
      - "Propionyl-CoA carboxylase (a biotin carboxylase) is deficient in propionic acidemia, where methylmalonic acid is low, not high."
      - "Kinases transfer a phosphate from ATP; none sits on the propionyl-CoA → succinyl-CoA path."
      - "Right. Methylmalonic acidemia with normal B12 points to methylmalonyl-CoA mutase, a mutase: it relocates a functional group within a molecule (B12-dependent)."
      - "Synthases build molecules without using ATP; none is missing here."
      - "Phosphorylases add inorganic phosphate, as glycogen phosphorylase does."
    src: { page: 71, quote: "Mutase Relocates a functional group within a molecule (eg, vitamin B12–dependent methylmalonyl-CoA mutase)." }
    status: unverified
