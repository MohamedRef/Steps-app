    kind: card
    topic: summary-of-pathways
    front: In the summary of pathways, which enzymes need thiamine (TPP) and which need biotin?
    back: "TPP: pyruvate dehydrogenase, α-ketoglutarate dehydrogenase and transketolase. Biotin: pyruvate carboxylase, acetyl-CoA carboxylase and propionyl-CoA carboxylase."
    src: { page: 72, quote: "Requires thiamine cofactor (TPP) Requires biotin cofactor" }
