  # ---------- p73: universal electron acceptors ----------
  - id: bio.L06.018
    kind: card
    topic: universal-electron-acceptors
    front: NAD+ vs NADPH, which is used in catabolism and which in anabolism?
    back: NAD+ is used in catabolic processes to carry reducing equivalents away as NADH. NADPH supplies reducing equivalents for anabolic processes (eg, steroid and fatty acid synthesis); it is made by the HMP shunt.
    src: { page: 73, quote: "NAD+ is generally used in catabolic processes to carry reducing equivalents away as NADH. NADPH is used in anabolic processes (eg, steroid and fatty acid synthesis) as a supply of reducing equivalents." }
    status: unverified
    tags: [high-yield]
  - id: bio.L06.019
    kind: enumerate
    topic: universal-electron-acceptors
    prompt: Enumerate the uses of NADPH.
    points:
      - Anabolic processes
      - Respiratory burst
      - Cytochrome P-450 system
      - Glutathione reductase
    pass: 4
    hook: "الـ NADPH بيبني (anabolic)، وبيقتل البكتيريا (respiratory burst)، وبيكسّر الأدوية (P-450)، وبيحمي الـ RBC (glutathione)."
    src: { page: 73, quote: "NADPH is used in: ▘ Anabolic processes ▘ Respiratory burst ▘ Cytochrome P-450 system ▘ Glutathione reductase" }
    status: unverified
    tags: [high-yield]
  - id: bio.L06.020
    kind: mcq
    topic: universal-electron-acceptors
    stem: >-
      A 4-year-old boy has recurrent Staphylococcus aureus and Aspergillus infections. Neutrophils fail to
      generate superoxide. The enzyme that is defective in his neutrophils uses an electron donor that
      is produced mainly by which pathway?
    options:
      - Glycolysis
      - TCA cycle
      - HMP shunt
      - β-oxidation
      - Urea cycle
    answer: 2
    why:
      - "Glycolysis yields NADH, not NADPH."
      - "The TCA cycle yields NADH and FADH2."
      - "Right. NADPH oxidase (defective in chronic granulomatous disease) uses NADPH for the respiratory burst; NADPH is a product of the HMP shunt."
      - "β-oxidation yields NADH and FADH2."
      - "The urea cycle disposes of nitrogen."
    src: { page: 73, quote: "NADPH is a product of the HMP shunt." }
    status: unverified
    tags: [high-yield]
  # ---------- p73: hexokinase vs glucokinase ----------
  - id: bio.L06.021
    kind: table
    topic: hexokinase-vs-glucokinase
    title: Hexokinase vs glucokinase
    columns: ["", Hexokinase, Glucokinase]
    rows:
      - [Location, "Most tissues, except liver and pancreatic β cells", "Liver, β cells of pancreas"]
      - [Km, Lower (↑ affinity), Higher (↓ affinity)]
