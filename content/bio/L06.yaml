  - id: bio.L06.022
    kind: card
    topic: hexokinase-vs-glucokinase
    front: Why does hexokinase keep working in tissues when glucose is low, while glucokinase works at high glucose?
    back: Hexokinase has a low Km (high affinity), so it sequesters glucose in tissues even at low concentrations. Glucokinase (liver, β cells) has a high Km and high Vmax, so at high glucose it helps store glucose in the liver.
    src: { page: 73, quote: "Hexokinase sequesters glucose in tissues, where it is used even when glucose concentrations are low. At high glucose concentrations, glucokinase helps to store glucose in liver." }
    status: unverified
  - id: bio.L06.023
    kind: mcq
    topic: hexokinase-vs-glucokinase
    stem: >-
      A 19-year-old lean woman has mild fasting hyperglycemia (fasting glucose 120 mg/dL) found on
      routine testing. Her father and grandmother have the same mild, stable hyperglycemia, and no one
      needed insulin. Islet autoantibodies are negative. Which enzyme's deficiency best explains this?
    options:
      - Hexokinase
      - Glucokinase
      - Glucose-6-phosphatase
      - Phosphofructokinase-1
      - Pyruvate kinase
    answer: 1
    why:
      - "Hexokinase deficiency isn't a described cause of MODY."
      - "Right. Glucokinase deficiency means ↑↑ glucose is needed to activate β-cell glucose sensing, so insulin release is impaired: a cause of MODY and gestational diabetes."
      - "That is von Gierke disease, with fasting hypoglycemia."
      - "PFK-1 deficiency affects muscle glycolysis."
      - "Pyruvate kinase deficiency causes hemolytic anemia."
    src: { page: 73, quote: "Glucokinase deficiency (→ ↑↑ glucose needed for activation → impaired insulin release [vs. diabetes mellitus]) is a cause of maturity onset diabetes of the young (MODY) and gestational diabetes." }
    status: unverified
    tags: [high-yield]
