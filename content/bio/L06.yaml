  # ---------- p84: glycogen ----------
  - id: bio.L06.110
    kind: card
    topic: glycogen
    front: What bonds hold glycogen, and how is glycogen used in muscle vs liver?
    back: Branches are α-(1,6) bonds; linear linkages are α-(1,4). Muscle breaks glycogen to glucose-1-P → glucose-6-P for its own use during exercise. Liver breaks it down to keep blood sugar normal.
    src: { page: 84, quote: "Glycogen Branches have α-(1,6) bonds; linear linkages have α-(1,4) bonds." }
    status: unverified
    tags: [high-yield]
  - id: bio.L06.111
    kind: order
    topic: glycogen
    prompt: Put the steps of glycogen breakdown in order.
    steps:
      - Glycogen phosphorylase releases glucose-1-P until 4 units remain on a branch
      - 4-α-D-glucanotransferase moves 3 of the 4 units to a linear chain
      - α-1,6-glucosidase cleaves the last residue as free glucose
    src: { page: 84, quote: "Then 4-α-D-glucanotransferase (debranching enzyme ) moves 3 of the 4 glucose units from the branch to the linear linkage." }
