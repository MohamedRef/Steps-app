  - id: bio.L06.014
    kind: card
    topic: summary-of-pathways
    front: Which enzyme defects in the pathway map give von Gierke disease, essential fructosuria and severe galactosemia?
    back: "Glucose-6-phosphatase (von Gierke), fructokinase (essential fructosuria), galactose-1-phosphate uridyltransferase (severe galactosemia). Aldolase B gives fructose intolerance; galactokinase gives mild galactosemia."
    src: { page: 72, quote: "Fructokinase (essential fructosuria) Aldolase B (fructose intolerance)" }
    status: unverified
