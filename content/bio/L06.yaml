  - id: bio.L06.026
    kind: mcq
    topic: glycolysis-regulation
    stem: >-
      During a prolonged fast, a 40-year-old man's liver shifts from glycolysis to gluconeogenesis.
      Glucagon is high, and alanine released from muscle reaches the liver. Which glycolytic enzyme is
      inhibited by both of these signals?
    options:
      - Hexokinase
      - Phosphoglycerate kinase
      - Pyruvate kinase
      - Glucokinase
      - Triose phosphate isomerase
    answer: 2
    why:
      - "Hexokinase is inhibited by glucose-6-phosphate."
      - "Phosphoglycerate kinase isn't a regulated step."
      - "Right. Pyruvate kinase is inhibited by ATP, alanine, glucagon and epinephrine, and activated by fructose-1,6-bisphosphate."
      - "Glucokinase is inhibited by fructose-6-phosphate."
      - "Triose phosphate isomerase isn't regulated this way."
    src: { page: 74, quote: "Fructose-1,6-bisphosphate ⊕. ATP ⊝, alanine ⊝, glucagon ⊝, epinephrine ⊝." }
    status: unverified
  # ---------- p74: fructose-2,6-bisphosphate ----------
  - id: bio.L06.027
    kind: card
    topic: fructose-2-6-bisphosphate
    front: How do fasting and feeding control fructose-2,6-bisphosphate?
    back: "PFK-2 and FBPase-2 are one bifunctional enzyme. Fasting: ↑ glucagon → ↑ cAMP → ↑ protein kinase A → ↑ FBPase-2, ↓ PFK-2 → less glycolysis, more gluconeogenesis. Fed: ↑ insulin → ↑ PFK-2 → more glycolysis. FaBian the Peasant (FBP) works hard when starving; Prince FredericK (PFK) works only when fed."
    src: { page: 74, quote: "Fasting state: ↑ glucagon → ↑ cAMP → ↑ protein kinase A → ↑ FBPase-2, ↓ PFK-2, less glycolysis, more gluconeogenesis." }
    status: unverified
    tags: [high-yield]
  - id: bio.L06.028
    kind: mcq
    topic: fructose-2-6-bisphosphate
    stem: >-
      A 22-year-old woman has not eaten for 18 hours. In her hepatocytes, protein kinase A phosphorylates
      the bifunctional enzyme that makes and breaks fructose-2,6-bisphosphate. What is the result?
    options:
      - ↑ PFK-2 activity and ↑ glycolysis
      - ↑ FBPase-2 activity and ↑ gluconeogenesis
      - ↑ fructose-2,6-bisphosphate and ↑ PFK-1 activity
      - ↓ cAMP and ↓ gluconeogenesis
      - No change; the enzyme isn't regulated by phosphorylation
    answer: 1
    why:
      - "That is the fed state with insulin."
      - "Right. Phosphorylation by protein kinase A turns on FBPase-2 and turns off PFK-2, so fructose-2,6-BP falls: less glycolysis, more gluconeogenesis."
      - "Fructose-2,6-BP falls in fasting, removing the push on PFK-1."
      - "Glucagon raises cAMP."
      - "The book states its function is reversed by protein kinase A phosphorylation."
