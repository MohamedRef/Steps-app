  - id: bio.L06.008
    kind: mcq
    topic: rate-determining-enzymes
    stem: >-
      A 30-year-old man has just eaten a large carbohydrate-rich meal. Insulin is high and citrate is
      accumulating in the cytosol of his hepatocytes. The product of the enzyme that citrate activates
      will then directly inhibit which enzyme?
    options:
      - Carnitine acyltransferase I
      - HMG-CoA reductase
      - Glycogen phosphorylase
      - Isocitrate dehydrogenase
      - Phosphofructokinase-1
    answer: 0
    why:
      - "Right. Citrate and insulin activate acetyl-CoA carboxylase; its product malonyl-CoA inhibits carnitine acyltransferase I, so new fatty acids aren't oxidized."
      - "HMG-CoA reductase is inhibited by glucagon and cholesterol."
      - "Glycogen phosphorylase is inhibited by insulin, G6P and ATP, not malonyl-CoA."
      - "Isocitrate dehydrogenase is inhibited by ATP and NADH."
      - "Citrate inhibits PFK-1 directly, but that isn't the product of the enzyme it activates."
    src: { page: 71, quote: "Fatty acid synthesis Acetyl-CoA carboxylase (ACC) Insulin ⊕, citrate ⊕ Glucagon ⊝, palmitoyl-CoA ⊝ Fatty acid oxidation Carnitine acyltransferase I Malonyl-CoA ⊝" }
    status: unverified
    tags: [high-yield]
  - id: bio.L06.009
    kind: mcq
    topic: rate-determining-enzymes
    stem: >-
      A 25-year-old woman is running a marathon. In her skeletal muscle, AMP rises as ATP is consumed.
      Which enzyme is directly activated by AMP to speed up glucose breakdown?
    options:
      - Fructose-1,6-bisphosphatase 1
      - Glycogen synthase
      - Phosphofructokinase-1
      - HMG-CoA reductase
      - Glucose-6-phosphate dehydrogenase
    answer: 2
    why:
      - "AMP inhibits fructose-1,6-bisphosphatase 1, the gluconeogenic enzyme."
      - "Glycogen synthase is activated by G6P, insulin and cortisol."
      - "Right. AMP and fructose-2,6-bisphosphate activate PFK-1, the rate-limiting step of glycolysis (AMP also activates glycogen phosphorylase)."
      - "HMG-CoA reductase controls cholesterol synthesis."
      - "G6PD is controlled by NADP+/NADPH."
    src: { page: 71, quote: "Glycolysis Phosphofructokinase-1 (PFK-1) AMP ⊕, fructose-2,6-bisphosphate ⊕" }
    status: unverified
