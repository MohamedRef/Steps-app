items:
  # ---------- p44: cell cycle phases and regulation ----------
  - id: bio.L02.001
    kind: card
    topic: cell-cycle-phases
    front: What regulates the checkpoints of the cell cycle?
    back: Cyclins, cyclin-dependent kinases (CDKs) and tumor suppressors.
    src: { page: 44, quote: "Checkpoints control transitions between phases of cell cycle. This process is regulated by cyclins, cyclin-dependent kinases (CDKs), and tumor suppressors." }
    status: unverified
  - id: bio.L02.002
    kind: card
    topic: cell-cycle-phases
    front: Which is the shortest phase of the cell cycle, what does it include, and which phase varies in length?
    back: M phase is the shortest; it includes mitosis (prophase, prometaphase, metaphase, anaphase, telophase) and cytokinesis. G1 is of variable duration.
    src: { page: 44, quote: "M phase (shortest phase of cell cycle) includes mitosis (prophase, prometaphase, metaphase, anaphase, telophase) and cytokinesis (cytoplasm splits in two). G1 is of variable duration." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.003
    kind: card
    topic: cell-cycle-phases
    front: Are CDKs always present? When are they active?
    back: They are constitutively expressed but inactive until bound to a cyclin.
    src: { page: 44, quote: "Constitutively expressed but inactive when not bound to cyclin." }
    status: unverified
  - id: bio.L02.004
    kind: card
    topic: cell-cycle-phases
    front: What are cyclins, and what does the cyclin-CDK complex do?
    back: Phase-specific regulatory proteins that activate CDKs when stimulated by growth factors. The complex phosphorylates other proteins (eg, Rb) to coordinate cell cycle progression.
    src: { page: 44, quote: "Cyclins are phase-specific regulatory proteins that activate CDKs when stimulated by growth factors. The cyclin-CDK complex can then phosphorylate other proteins (eg, Rb) to coordinate cell cycle progression." }
    status: unverified
  - id: bio.L02.005
    kind: order
    topic: cell-cycle-phases
    prompt: Put the steps by which p53 stops the cell cycle in order.
    steps:
      - p53 induces p21
      - p21 inhibits CDK
      - Rb stays hypophosphorylated (active)
      - Progression from G1 to S is inhibited
    src: { page: 44, quote: "p53 → p21 induction → CDK inhibition → Rb hypophosphorylation (activation) → G1-S progression inhibition." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.006
    kind: card
    topic: cell-cycle-phases
    front: Mutations in which tumor suppressor gene cause Li-Fraumeni syndrome, and what is the result?
    back: Loss of function of p53; unrestrained cell division.
    src: { page: 44, quote: "Mutations in tumor suppressor genes can result in unrestrained cell division (eg, Li-Fraumeni syndrome)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.007
    kind: card
    topic: cell-cycle-phases
    front: How do growth factors move a cell from G1 to S? Give the book's examples.
    back: They bind receptor tyrosine kinases (eg, insulin, PDGF, EGF) and nonreceptor tyrosine kinases (eg, EPO via JAK2).
    src: { page: 44, quote: "Growth factors bind receptor (eg, insulin, PDGF, EGF) and nonreceptor (eg, EPO via JAK2) tyrosine kinases to transition the cell from G1 to S phase." }
    status: unverified
  - id: bio.L02.008
    kind: card
    topic: cell-cycle-phases
    front: Which viral protein inactivates p53, and which proteins carry out p53-driven apoptosis?
    back: HPV E6 inactivates p53. p53 drives the intrinsic pathway through BAX/BAK and caspase activation, opposed by BCL-2 and BCL-XL.
    src: { page: 44, quote: "Apoptosis (intrinsic pathway) BAX/BAK Caspase activation BCL-2 BCL-XL DNA damage Li-Fraumeni syndrome (loss of function) p53 HPV E6" }
    status: unverified
  - id: bio.L02.009
    kind: mcq
    topic: cell-cycle-phases
    stem: >-
      A 32-year-old woman has breast cancer. Her mother died of a brain tumor at 40, her brother had an
      osteosarcoma at 14, and a cousin had a soft-tissue sarcoma at 25. Germline testing shows a
      loss-of-function mutation in a tumor suppressor. In her normal cells after DNA damage, which
      step is most likely impaired?
    options:
      - Phosphorylation of Rb by cyclin-CDK complexes
      - Induction of p21 to inhibit CDKs and block G1-S progression
      - Binding of growth factors to receptor tyrosine kinases
      - Addition of TTAGGG repeats to chromosome ends
      - Activation of CDKs by cyclins
    answer: 1
    why:
      - "Rb phosphorylation by cyclin-CDK pushes the cycle forward; it is what p53 normally prevents."
      - "Right. Li-Fraumeni is loss of p53: normally p53 → p21 → CDK inhibition → Rb stays active → G1-S blocked. Without it, damaged cells keep dividing."
      - "Growth factor signalling is upstream and isn't the lost tumor suppressor."
      - "That is telomerase."
      - "Cyclins activating CDKs is the normal forward drive, not the brake that is lost."
    src: { page: 44, quote: "p53 → p21 induction → CDK inhibition → Rb hypophosphorylation (activation) → G1-S progression inhibition." }
    status: unverified
    tags: [high-yield]
  # ---------- p44: cell types ----------
  - id: bio.L02.010
    kind: table
    topic: cell-types
    title: Cell types by cell cycle
    columns: [Type, Behaviour, Examples]
    rows:
      - [Permanent, "Remain in G0, regenerate from stem cells", "Neurons, skeletal and cardiac muscle, RBCs"]
      - ["Stable (quiescent)", "Enter G1 from G0 when stimulated", "Hepatocytes, lymphocytes, PCT, periosteal cells"]
      - [Labile, "Never go to G0, divide rapidly with a short G1; most affected by chemotherapy", "Bone marrow, gut epithelium, skin, hair follicles, germ cells"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 44, quote: "Permanent Remain in G0, regenerate from stem cells. Neurons, skeletal and cardiac muscle, RBCs. Stable (quiescent) Enter G1 from G0 when stimulated. Hepatocytes, lymphocytes, PCT, periosteal cells." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.011
    kind: mcq
    topic: cell-types
    stem: >-
      A 55-year-old man receives cyclophosphamide and doxorubicin for lymphoma. Ten days later he has
      painful mouth ulcers, diarrhea, patchy hair loss and a neutrophil count of 400/mm³. His
      neurologic and cardiac examinations are normal. Why are these tissues the most affected?
    options:
      - They remain permanently in G0
      - They never enter G0 and divide rapidly with a short G1
      - They enter G1 from G0 only when stimulated
      - They lack cyclin-dependent kinases
      - They regenerate only from stem cells
    answer: 1
    why:
      - "Permanent cells (neurons, cardiac muscle) stay in G0, which is why his heart and nerves are spared."
      - "Right. Labile cells (bone marrow, gut epithelium, skin, hair follicles) never go to G0 and divide rapidly, so chemotherapy hits them most."
      - "That describes stable cells such as hepatocytes."
      - "All dividing cells use CDKs."
      - "Regeneration from stem cells describes permanent cells."
    src: { page: 44, quote: "Labile Never go to G0, divide rapidly with a short G1. Most affected by chemotherapy." }
    status: unverified
    tags: [high-yield]
  # ---------- p45: rough ER ----------
  - id: bio.L02.012
    kind: card
    topic: rough-er
    front: What is made in the rough endoplasmic reticulum?
    back: Secretory (exported) proteins, and N-linked oligosaccharides are added to lysosomal and other proteins. Proteins within organelles (ER, Golgi, lysosomes) are also formed in RER.
    src: { page: 45, quote: "Site of synthesis of secretory (exported) proteins and of N-linked oligosaccharide addition to lysosomal and other proteins." }
    status: unverified
  - id: bio.L02.013
    kind: card
    topic: rough-er
    front: What are Nissl bodies?
    back: RER in neurons; they synthesize peptide neurotransmitters for secretion.
    src: { page: 45, quote: "Nissl bodies (RER in neurons)—synthesize peptide neurotransmitters for secretion." }
    status: unverified
  - id: bio.L02.014
    kind: card
    topic: rough-er
    front: Which proteins are made on free ribosomes?
    back: Cytosolic, peroxisomal and mitochondrial proteins.
    src: { page: 45, quote: "Free ribosomes—unattached to any membrane; site of synthesis of cytosolic, peroxisomal, and mitochondrial proteins." }
    status: unverified
  - id: bio.L02.015
    kind: cloze
    topic: rough-er
    text: N-linked glycosylation occurs in the {{c1::eNdoplasmic reticulum}}. Cells rich in RER include mucus-secreting {{c2::goblet cells}} of the small intestine and antibody-secreting {{c3::plasma cells}}.
    src: { page: 45, quote: "N-linked glycosylation occurs in the eNdoplasmic reticulum. Mucus-secreting goblet cells of small intestine and antibody-secreting plasma cells are rich in RER." }
    status: unverified
  - id: bio.L02.016
    kind: mcq
    topic: rough-er
    stem: >-
      A bone marrow biopsy from a 68-year-old man with bone pain and hypercalcemia shows sheets of cells
      with eccentric nuclei and abundant basophilic cytoplasm. Serum protein electrophoresis shows an M
      spike of IgG. Which organelle is most abundant in these cells?
    options:
      - Smooth endoplasmic reticulum
      - Rough endoplasmic reticulum
      - Peroxisomes
      - Free ribosomes only
      - Lysosomes
    answer: 1
    why:
      - "SER is abundant in steroid-producing cells and hepatocytes."
      - "Right. Plasma cells secrete antibody, a secretory protein, so they are rich in RER."
      - "Peroxisomes oxidize very-long-chain and branched fatty acids."
      - "Free ribosomes make cytosolic, peroxisomal and mitochondrial proteins, not secreted Ig."
      - "Lysosomes degrade material; they don't make antibody."
    src: { page: 45, quote: "Mucus-secreting goblet cells of small intestine and antibody-secreting plasma cells are rich in RER." }
    status: unverified
  # ---------- p45: smooth ER ----------
  - id: bio.L02.017
    kind: card
    topic: smooth-er
    front: What are the functions of the smooth ER, and which enzyme is located there?
    back: Steroid synthesis and detoxification of drugs and poisons (no surface ribosomes). It holds glucose-6-phosphatase, the last step of both glycogenolysis and gluconeogenesis.
    src: { page: 45, quote: "Site of steroid synthesis and detoxification of drugs and poisons. Lacks surface ribosomes. Location of glucose-6-phosphatase (last step in both glycogenolysis and gluconeogenesis)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.018
    kind: card
    topic: smooth-er
    front: Which cells are rich in smooth ER?
    back: Hepatocytes and the steroid hormone-producing cells of the adrenal cortex and gonads.
    src: { page: 45, quote: "Hepatocytes and steroid hormone–producing cells of the adrenal cortex and gonads are rich in SER." }
    status: unverified
  - id: bio.L02.019
    kind: mcq
    topic: smooth-er
    stem: >-
      Electron microscopy of a testicular tumor from a 30-year-old man with gynecomastia shows cells
      packed with a tubular, anastomosing membrane network that has no ribosomes on its surface. The
      cells most likely secrete which product?
    options:
      - Immunoglobulin
      - Steroid hormones
      - Mucin
      - Peptide neurotransmitters
      - Collagen
    answer: 1
    why:
      - "Antibody is a secretory protein made on RER."
      - "Right. Ribosome-free membranes are smooth ER, the site of steroid synthesis; gonadal steroid-producing cells are rich in SER."
      - "Mucin comes from goblet cells, which are rich in RER."
      - "Peptide neurotransmitters come from Nissl bodies (RER in neurons)."
      - "Collagen chains are made on RER."
    src: { page: 45, quote: "Hepatocytes and steroid hormone–producing cells of the adrenal cortex and gonads are rich in SER." }
    status: unverified
  # ---------- p45: cell trafficking ----------
  - id: bio.L02.020
    kind: enumerate
    topic: cell-trafficking
    prompt: Enumerate the posttranslational events in the Golgi (3).
    points:
      - Modifying N-oligosaccharides on asparagine
      - Adding O-oligosaccharides on serine and threonine
      - Adding mannose-6-phosphate to proteins for targeting to lysosomes
    pass: 3
    hook: "الـ Golgi مكتب بريد بيعمل 3 حاجات: يعدّل الـ N على الـ asparagine، يحط O على serine و threonine، ويلزق طابع mannose-6-phosphate على اللي رايح الـ lysosome."
    src: { page: 45, quote: "Posttranslational events in GOlgi include modifying N-oligosaccharides on asparagine, adding O-oligosaccharides on serine and threonine, and adding mannose-6-phosphate to proteins for targeting to lysosomes" }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.021
    kind: card
    topic: cell-trafficking
    front: What do endosomes do?
    back: They sort material from outside the cell or from the Golgi, sending it to lysosomes for destruction or back to the membrane/Golgi for reuse.
    src: { page: 45, quote: "Endosomes are sorting centers for material from outside the cell or from the Golgi, sending it to lysosomes for destruction or back to the membrane/Golgi for further use." }
    status: unverified
  - id: bio.L02.022
    kind: order
    topic: cell-trafficking
    prompt: Put the steps of I-cell disease in order.
    steps:
      - Defect in N-acetylglucosaminyl-1-phosphotransferase
      - The Golgi fails to phosphorylate mannose residues (↓ mannose-6-phosphate)
      - Enzymes are secreted outside the cell instead of going to lysosomes
      - Lysosomes lack digestive enzymes
      - Cellular debris builds up in lysosomes (inclusion bodies)
    src: { page: 45, quote: "defect in N-acetylglucosaminyl-1-phosphotransferase → failure of the Golgi to phosphorylate mannose residues (↓ mannose-6-phosphate) on glycoproteins → enzymes secreted extracellularly rather than delivered to lysosomes" }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.023
    kind: card
    topic: cell-trafficking
    front: What are the features of I-cell disease (mucolipidosis type II)?
    back: Autosomal recessive. Coarse facial features, gingival hyperplasia, corneal clouding, restricted joint movements, claw hand, kyphoscoliosis and ↑ plasma lysosomal enzymes. Like Hurler but more severe; often fatal in childhood.
    src: { page: 45, quote: "Results in coarse facial features, gingival hyperplasia, corneal clouding, restricted joint movements, claw hand deformities, kyphoscoliosis, and ↑ plasma levels of lysosomal enzymes." }
    status: unverified
  - id: bio.L02.024
    kind: card
    topic: cell-trafficking
    front: What does the signal recognition particle do, and what happens without it?
    back: An abundant cytosolic ribonucleoprotein that carries the polypeptide-ribosome complex from the cytosol to the RER. Absent or dysfunctional SRP → protein accumulates in the cytosol.
    src: { page: 45, quote: "Signal recognition particle (SRP)—abundant, cytosolic ribonucleoprotein that traffics polypeptide-ribosome complex from the cytosol to the RER. Absent or dysfunctional SRP → accumulation of protein in cytosol." }
    status: unverified
  - id: bio.L02.025
    kind: table
    topic: cell-trafficking
    title: Vesicular trafficking proteins
    columns: [Protein, Route]
    rows:
      - [COPI, "Golgi → Golgi (retrograde); cis-Golgi → ER"]
      - [COPII, "ER → cis-Golgi (anterograde)"]
      - [Clathrin, "trans-Golgi → lysosomes; plasma membrane → endosomes (receptor-mediated endocytosis, eg, LDL receptor)"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 45, quote: "COPI: Golgi → Golgi (retrograde); cis-Golgi → ER. ▘ COPII: ER → cis-Golgi (anterograde)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.026
    kind: mcq
    topic: cell-trafficking
    stem: >-
      A 14-month-old boy has coarse facial features, gingival hyperplasia, stiff joints and clouded
      corneas. His fibroblasts contain large inclusions, but the lysosomal hydrolases are found at
      very high levels in his plasma. Which step of protein processing is defective?
    options:
      - Addition of N-linked oligosaccharides in the RER
      - Phosphorylation of mannose residues in the Golgi
      - Transport of the ribosome-polypeptide complex to the RER by SRP
      - Clathrin-mediated endocytosis of LDL
      - Ubiquitin tagging for proteasome degradation
    answer: 1
    why:
      - "N-linked glycosylation in the ER is intact; the problem is the lysosome tag added later."
      - "Right. I-cell disease: N-acetylglucosaminyl-1-phosphotransferase is defective, so the Golgi can't add mannose-6-phosphate and the enzymes are secreted instead of reaching lysosomes."
      - "Without SRP, protein would pile up in the cytosol, not be secreted."
      - "Clathrin endocytosis isn't the step that targets hydrolases."
      - "Proteasome defects don't send lysosomal enzymes into plasma."
    src: { page: 45, quote: "failure of the Golgi to phosphorylate mannose residues (↓ mannose-6-phosphate) on glycoproteins → enzymes secreted extracellularly rather than delivered to lysosomes" }
    status: unverified
    tags: [high-yield]
  # ---------- p46: peroxisome ----------
  - id: bio.L02.027
    kind: enumerate
    topic: peroxisome
    prompt: Enumerate the functions of the peroxisome (4).
    points:
      - β-oxidation of very-long-chain fatty acids (strictly peroxisomal)
      - α-oxidation of branched-chain fatty acids (strictly peroxisomal)
      - Catabolism of amino acids and ethanol
      - Synthesis of bile acids and plasmalogens
    pass: 4
    hook: "الـ peroxisome بيكسّر الطويل (VLCFA) والمتفرع (branched)، وبيكسّر amino acids و ethanol، وبيبني bile acids و plasmalogens."
    src: { page: 46, quote: "β-oxidation of very-long-chain fatty acids (VLCFA) (strictly peroxisomal process) ▘ α-oxidation of branched-chain fatty acids (strictly peroxisomal process)" }
    status: unverified
  - id: bio.L02.028
    kind: card
    topic: peroxisome
    front: What are plasmalogens?
    back: Important membrane phospholipids, especially in the white matter of the brain; made in peroxisomes.
    src: { page: 46, quote: "Synthesis of bile acids and plasmalogens (important membrane phospholipid, especially in white matter of brain)" }
    status: unverified
  - id: bio.L02.029
    kind: table
    topic: peroxisome
    title: Peroxisomal disorders
    columns: [Disease, Inheritance, Defect, What builds up, Features]
    rows:
      - [Zellweger syndrome, AR, "Peroxisome biogenesis (mutated PEX genes)", "VLCFA and pipecolic acid", "Hypotonia, seizures, jaundice, craniofacial dysmorphia, hepatomegaly, early death"]
      - [Refsum disease, AR, α-oxidation, Phytanic acid, "Retinitis pigmentosa, anosmia, hearing loss, ataxia, neuropathy, ichthyosis, cardiac conduction defects"]
      - [Adrenoleukodystrophy, X-linked recessive, "β-oxidation (ABCD1 gene)", "VLCFA in adrenals, white matter, testes", "Adrenal crisis, progressive neurologic loss, death"]
    blanks: [[0, 2], [0, 3], [1, 2], [1, 3], [2, 1], [2, 3]]
    src: { page: 46, quote: "Zellweger syndrome—autosomal recessive disorder of peroxisome biogenesis due to mutated PEX genes → accumulation of VLCFA and pipecolic acid in plasma and urine." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.030
    kind: card
    topic: peroxisome
    front: How is Refsum disease treated?
    back: Diet and plasmapheresis.
    src: { page: 46, quote: "Treatment: diet, plasmapheresis." }
    status: unverified
  - id: bio.L02.031
    kind: mcq
    topic: peroxisome
    stem: >-
      A 7-year-old boy has worsening school performance, clumsiness and a change in behavior over 6
      months. He also tires easily and his skin has darkened. MRI shows symmetric white matter lesions.
      His maternal uncle died of a similar illness. Plasma levels of very-long-chain fatty acids are
      high. Mutation of which gene is most likely?
    options:
      - PEX genes
      - ABCD1
      - ATP7A
      - COL1A1
      - The gene for phytanoyl-CoA α-oxidation
    answer: 1
    why:
      - "PEX mutations cause Zellweger syndrome, autosomal recessive, with hypotonia and seizures in infancy."
      - "Right. Adrenoleukodystrophy: X-linked recessive ABCD1 mutation impairs β-oxidation, so VLCFA build up in the adrenals and white matter (adrenal insufficiency, neurologic decline)."
      - "ATP7A is Menkes disease (copper)."
      - "COL1A1 is osteogenesis imperfecta."
      - "An α-oxidation defect is Refsum disease, with phytanic acid, not VLCFA."
    src: { page: 46, quote: "Adrenoleukodystrophy—X-linked recessive disorder of β-oxidation due to mutation in ABCD1 gene → VLCFA buildup in adrenal glands, white (leuko) matter of brain, testes." }
    status: unverified
    tags: [high-yield]
  # ---------- p46: proteasome ----------
  - id: bio.L02.032
    kind: card
    topic: proteasome
    front: What is the proteasome, and which immune process does it serve?
    back: A barrel-shaped protein complex that degrades polyubiquitin-tagged proteins. It plays a role in the immune response (MHC I-mediated), and its defects are implicated in neurodegenerative diseases.
    src: { page: 46, quote: "Barrel-shaped protein complex that degrades polyubiquitin-tagged proteins. Plays a role in many cellular processes, including immune response (MHC I–mediated)." }
    status: unverified
  - id: bio.L02.033
    kind: mcq
    topic: proteasome
    stem: >-
      A virus-infected hepatocyte presents fragments of a viral protein on its surface, and a cytotoxic
      T cell kills it. Before presentation, the viral protein was tagged with chains of a small protein
      and broken down by a barrel-shaped complex in the cytosol. Which pathway is this?
    options:
      - Lysosomal degradation via mannose-6-phosphate
      - Ubiquitin-proteasome degradation feeding MHC I
      - Peroxisomal β-oxidation
      - Clathrin-mediated endocytosis
      - Autophagy via the Golgi
    answer: 1
    why:
      - "Mannose-6-phosphate targets enzymes to lysosomes; it doesn't tag cytosolic viral proteins."
      - "Right. The proteasome degrades polyubiquitin-tagged proteins and serves the MHC I-mediated immune response."
      - "Peroxisomes oxidize fatty acids."
      - "Clathrin brings material in from outside, such as LDL."
      - "The Golgi modifies and sorts proteins; it isn't the barrel-shaped complex."
    src: { page: 46, quote: "Barrel-shaped protein complex that degrades polyubiquitin-tagged proteins. Plays a role in many cellular processes, including immune response (MHC I–mediated)." }
    status: unverified
