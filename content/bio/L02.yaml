  - id: bio.L02.035
    kind: card
    topic: cytoskeletal-elements
    front: What is a microtubule made of?
    back: A cylinder of a helical array of polymerized α- and β-tubulin heterodimers; each dimer has 2 GTP bound. Its negative end is near the nucleus and positive end points to the periphery.
    src: { page: 46, quote: "Cylindrical outer structure composed of a helical array of polymerized heterodimers of α- and β-tubulin. Each dimer has 2 GTP bound." }
    status: unverified
  - id: bio.L02.036
