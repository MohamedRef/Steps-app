      - [Kinesin, "Anterograde (− → +): toward the periphery"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 46, quote: "Retrograde to microtubule (+ → −)—dynein. ▘ Anterograde to microtubule (− → +)—kinesin." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.037
    kind: card
    topic: cytoskeletal-elements
    front: Which toxin and viruses use dynein to reach the neuronal cell body, and how does HSV reactivate?
    back: Clostridium tetani toxin, poliovirus, rabies virus and HSV use dynein (retrograde). HSV reactivation travels anterograde from the cell body (kinesin).
    src: { page: 46, quote: "Clostridium tetani toxin, poliovirus, rabies virus, and herpes simplex virus (HSV) use dynein for retrograde transport to the neuronal cell body. HSV reactivation occurs via anterograde transport from cell body (kinesin mediated)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L02.038
    kind: card
    topic: cytoskeletal-elements
    front: What is the rate-limiting step of peripheral nerve regeneration after injury?
    back: Slow anterograde (axoplasmic) transport.
    src: { page: 46, quote: "Slow anterograde transport rate limiting step of peripheral nerve regeneration after injury." }
    status: unverified
  - id: bio.L02.039
    kind: enumerate
    topic: cytoskeletal-elements
    prompt: Enumerate the drugs that act on microtubules (4).
