  - id: bio.L05.009
    kind: card
    topic: water-soluble-vitamins
    front: Which water-soluble vitamins are stored, and for how long?
    back: B12 is stored in the liver for about 3-4 years and B9 for about 3-4 months; the rest wash out easily.
    src: { page: 63, quote: "Wash out easily from body except B12 and B9. B12 stored in liver for ~3-4 years. B9 stored in liver for ~3-4 months." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.010
    kind: card
    topic: water-soluble-vitamins
    front: What does B-complex deficiency often cause?
    back: Dermatitis, glossitis and diarrhea.
    src: { page: 63, quote: "B-complex deficiencies often result in dermatitis, glossitis, and diarrhea." }
    status: unverified
  - id: bio.L05.081
    kind: card
    topic: water-soluble-vitamins
    front: How do water-soluble vitamins work in metabolism? Give an example of each role.
    back: They can be coenzymes themselves (eg, ascorbic acid) or precursors to coenzymes (eg, FAD, NAD+).
    src: { page: 63, quote: "Can be coenzymes (eg, ascorbic acid) or precursors to coenzymes (eg, FAD, NAD+ )." }
    status: unverified
  - id: bio.L05.011
    kind: mcq
    topic: water-soluble-vitamins
    stem: >-
      A 50-year-old man has a total gastrectomy for gastric cancer and takes no supplements afterward.
      Which vitamin deficiency would take the longest to appear?
    options:
      - Folate
      - Cobalamin
      - Thiamine
      - Vitamin C
      - Riboflavin
    answer: 1
    why:
      - "Folate is stored in the liver for only about 3-4 months."
      - "Right. B12 (cobalamin) is stored in the liver for about 3-4 years, so deficiency appears years later."
      - "Thiamine washes out quickly."
      - "Vitamin C washes out quickly."
      - "Riboflavin washes out quickly."
    src: { page: 63, quote: "B12 stored in liver for ~3-4 years. B9 stored in liver for ~3-4 months." }
    status: unverified
