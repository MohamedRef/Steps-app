    front: What is required before prescribing isotretinoin, and why?
    back: A negative pregnancy test and two forms of contraception, because it is teratogenic (interferes with homeobox genes).
    src: { page: 64, quote: "Teratogenic (interferes with homeobox gene; cleft palate, cardiac abnormalities), therefore a ⊝ pregnancy test and two forms of contraception are required before isotretinoin (vitamin A derivative) is prescribed." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.019
    kind: mcq
    topic: vitamin-a
    stem: >-
      A 19-year-old woman has taken a vitamin A derivative for severe nodulocystic acne for 4 months. She
      now has daily headaches, blurred vision and bilateral papilledema; MRI is normal and lumbar puncture
      shows high opening pressure. Before the drug was started, which precaution was mandatory?
    options:
      - Baseline audiometry to detect later ototoxic hearing loss
      - A negative pregnancy test and two forms of contraception
      - Checking G6PD activity to prevent drug-induced hemolysis
      - Starting daily folic acid 1 month before the first dose
      - Measuring TPMT activity to predict bone marrow toxicity
    answer: 1
    why:
      - "Hearing isn't a known toxicity of vitamin A derivatives."
      - "Right. Isotretinoin is teratogenic (homeobox gene interference), so a negative pregnancy test and two contraceptive methods are required. Her symptoms are idiopathic intracranial hypertension from vitamin A toxicity."
      - "G6PD testing is for oxidant drugs like primaquine and dapsone."
      - "Folic acid before conception prevents neural tube defects; it isn't the isotretinoin requirement."
      - "TPMT activity matters for azathioprine and 6-MP."
    src: { page: 64, quote: "Teratogenic (interferes with homeobox gene; cleft palate, cardiac abnormalities), therefore a ⊝ pregnancy test and two forms of contraception are required before isotretinoin (vitamin A derivative) is prescribed." }
    status: unverified
    tags: [high-yield]
  # ---------- p64: vitamin B1 ----------
  - id: bio.L05.020
    kind: enumerate
    topic: vitamin-b1
    prompt: Enumerate the enzymes that use thiamine pyrophosphate as a cofactor (Be APT).
    points:
      - Branched-chain ketoacid dehydrogenase
      - α-Ketoglutarate dehydrogenase (TCA cycle)
      - Pyruvate dehydrogenase (links glycolysis to TCA cycle)
      - Transketolase (HMP shunt)
    pass: 4
    hook: "الكتاب: Be APT. B = Branched-chain، A = α-ketoglutarate، P = Pyruvate، T = Transketolase."
    src: { page: 64, quote: "In thiamine pyrophosphate (TPP), a cofactor for several dehydrogenase enzyme reactions (Be APT): ▘ Branched-chain ketoacid dehydrogenase ▘ α-Ketoglutarate dehydrogenase (TCA cycle) ▘ Pyruvate dehydrogenase (links glycolysis to TCA cycle) ▘ Transketolase (HMP shunt)" }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.021
    kind: card
    topic: vitamin-b1
    front: Why give thiamine before dextrose in someone with alcohol use disorder?
    back: Thiamine deficiency impairs glucose breakdown; glucose infusion worsens ATP depletion and can precipitate Wernicke encephalopathy. Brain and heart (highly aerobic) are hit first.
    src: { page: 64, quote: "In patients with chronic alcohol overuse or malnutrition, give thiamine before dextrose to ↓ risk of precipitating Wernicke encephalopathy." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.022
    kind: card
    topic: vitamin-b1
    front: How is thiamine deficiency diagnosed?
    back: ↑ RBC transketolase activity after giving vitamin B1.
    src: { page: 64, quote: "Diagnosis made by ↑ in RBC transketolase activity following vitamin B1 administration." }
    status: unverified
