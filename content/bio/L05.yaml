      - [Wernicke-Korsakoff syndrome, "Damage to the medial dorsal thalamic nucleus and mammillary bodies"]
      - [Dry beriberi, "Polyneuropathy, symmetric muscle wasting (spell beriberi Ber1Ber1)"]
      - [Wet beriberi, High-output cardiac failure (systemic vasodilation)]
