  # ---------- p64: vitamin A ----------
  - id: bio.L05.014
    kind: card
    topic: vitamin-a
    front: What are the functions of vitamin A?
    back: Antioxidant; part of visual pigments (retinal); essential for differentiation of epithelial cells into specialized tissue (pancreatic, mucus-secreting cells); prevents squamous metaplasia.
    src: { page: 64, quote: "Antioxidant; constituent of visual pigments (retinal); essential for normal differentiation of epithelial cells into specialized tissue (pancreatic cells, mucus-secreting cells); prevents squamous metaplasia." }
    status: unverified
  - id: bio.L05.082
    kind: card
    topic: vitamin-a
    front: Which compounds make up vitamin A, and which foods contain it?
    back: Retinal, retinol and retinoic acid; found in liver and leafy vegetables.
    src: { page: 64, quote: "Includes retinal, retinol, retinoic acid. FUNCTION Antioxidant; constituent of visual pigments (retinal); essential for normal differentiation of epithelial cells into specialized tissue (pancreatic cells, mucus-secreting cells); prevents squamous metaplasia. Retinol is vitamin A, so think retin-A (used topically for wrinkles and Acne). Found in liver and leafy vegetables." }
    status: unverified
  - id: bio.L05.015
    kind: card
    topic: vitamin-a
    front: What are the clinical uses of vitamin A and its derivatives?
    back: Supplementation in vitamin A-deficient measles patients; oral isotretinoin for severe cystic acne; all-trans retinoic acid for acute promyelocytic leukemia; retin-A topically for wrinkles and acne.
    src: { page: 64, quote: "Supplementation in vitamin A-deficient measles patients may improve outcomes. Use oral isotretinoin to treat severe cystic acne. Use all-trans retinoic acid to treat acute promyelocytic leukemia." }
    status: unverified
