    src: { page: 65, quote: "Symptoms of B3 deficiency (pellagra) (the 3 D’s): diarrhea, dementia (also hallucinations), dermatitis (C3/C4 dermatome circumferential “broad collar” rash [Casal necklace], hyperpigmentation of sun-exposed limbs A )." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.030
    kind: card
    topic: vitamin-b3
    front: Besides poor diet, what can cause pellagra?
    back: Hartnup disease, malignant carcinoid syndrome (tryptophan diverted to serotonin) and isoniazid (↓ B6).
    src: { page: 65, quote: "Severe deficiency of B3 leads to pellagra, which can also be caused by Hartnup disease, malignant carcinoid syndrome (↑ tryptophan metabolism → ↑ serotonin synthesis), and isoniazid (↓ vitamin B6)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.031
    kind: card
    topic: vitamin-b3
    front: What is Hartnup disease, and how is it treated?
    back: Autosomal recessive deficiency of neutral amino acid (eg, tryptophan) transporters in the renal PCT and enterocytes → neutral aminoaciduria, ↓ tryptophan for niacin → pellagra-like symptoms. Treat with a high-protein diet and nicotinic acid.
    src: { page: 65, quote: "Hartnup disease—autosomal recessive. Deficiency of neutral amino acid (eg, tryptophan) transporters in proximal renal tubular cells and on enterocytes" }
    status: unverified
  - id: bio.L05.032
    kind: card
    topic: vitamin-b3
