    kind: mcq
    topic: dietary-supplementation
    stem: >-
      A 38-year-old man living in a rural area eats mostly untreated maize. He has diarrhea, confusion and
      a dark, scaly rash on his neck and sun-exposed forearms. Which vitamin is he missing?
    options:
      - B1
      - B3
      - B6
      - B7
      - B12
    answer: 1
