  # ---------- p69: vitamin K ----------
  - id: bio.L05.064
    kind: card
    topic: vitamin-k
    front: How does vitamin K work, and which proteins need it?
    back: Epoxide reductase activates it to the reduced form, a cofactor for γ-carboxylation of glutamic acid residues. Needed for factors II, VII, IX, X and proteins C and S; warfarin blocks this.
    src: { page: 69, quote: "Necessary for the maturation of clotting factors II, VII, IX, X, and proteins C and S. Warfarin inhibits vitamin K–dependent synthesis of these factors and proteins." }
