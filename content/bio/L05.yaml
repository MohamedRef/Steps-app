  # ---------- p63: Williams syndrome ----------
  - id: bio.L05.001
    kind: card
    topic: williams-syndrome
    front: What is the genetic cause of Williams syndrome?
    back: A congenital microdeletion of the long arm of chromosome 7; the deleted region includes the elastin gene.
    src: { page: 63, quote: "Congenital microdeletion of long arm of chromosome 7 (deleted region includes elastin gene)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.080
    kind: enumerate
    topic: williams-syndrome
    prompt: Enumerate the findings of Williams syndrome.
    points:
      - Distinctive "elfin" facies
      - Intellectual disability
      - Hypercalcemia
      - Well-developed verbal skills
      - Extreme friendliness with strangers
      - Cardiovascular problems (supravalvular aortic stenosis, pulmonary and renal artery stenosis)
    pass: 5
    src: { page: 63, quote: "Findings: distinctive “elfin” facies, intellectual disability, hypercalcemia, well-developed verbal skills, extreme friendliness with strangers, cardiovascular problems (eg, supravalvular aortic stenosis, pulmonary artery stenosis, renal artery stenosis)." }
    status: unverified
    tags: [high-yield]
  - id: bio.L05.002
    kind: mcq
    topic: williams-syndrome
    stem: >-
      A 4-year-old girl has a broad forehead, full cheeks, a wide mouth and a starburst iris pattern. She
      is extremely chatty and hugs every stranger, though she has intellectual disability. Serum calcium
      is 11.8 mg/dL, and a systolic murmur is heard at the right upper sternal border. Echo shows
      narrowing of the aorta just above the valve. Which gene is deleted along with others in her disease?
    options:
      - Fibrillin-1
      - Elastin
      - Type III collagen
      - Dystrophin
      - CFTR
    answer: 1
    why:
      - "Fibrillin-1 mutations cause Marfan syndrome (tall stature, aortic root dilatation)."
      - "Right. Williams syndrome is a microdeletion of 7q that includes the elastin gene: elfin facies, friendliness, hypercalcemia, supravalvular aortic stenosis."
      - "Type III collagen defects give vascular Ehlers-Danlos."
      - "Dystrophin is muscular dystrophy."
      - "CFTR is on chromosome 7 too but causes cystic fibrosis."
    src: { page: 63, quote: "Findings: distinctive “elfin” facies, intellectual disability, hypercalcemia, well-developed verbal skills, extreme friendliness with strangers, cardiovascular problems (eg, supravalvular aortic stenosis, pulmonary artery stenosis, renal artery stenosis)." }
    status: unverified
    tags: [high-yield]
  # ---------- p63: essential fatty acids ----------
  - id: bio.L05.003
    kind: card
    topic: essential-fatty-acids
    front: What are essential fatty acids, and what do linoleic and linolenic acid become?
    back: Polyunsaturated fatty acids that must come from the diet (nuts, seeds, plant oils, seafood). Linoleic acid (omega-6) → arachidonic acid → leukotrienes and prostaglandins. Linolenic acid (omega-3) is cardioprotective and antihyperlipidemic.
    src: { page: 63, quote: "Linoleic acid (omega-6) is metabolized to arachidonic acid, which serves as the precursor to leukotrienes and prostaglandins." }
    status: unverified
  - id: bio.L05.004
    kind: card
    topic: essential-fatty-acids
    front: How do trans-unsaturated fatty acids affect cardiovascular risk?
    back: They promote cardiovascular disease by ↑ LDL and ↓ HDL.
    src: { page: 63, quote: "In contrast, consumption of trans-unsaturated fatty acids (found in fast food) promotes cardiovascular disease by ↑ LDL and ↓ HDL." }
    status: unverified
  - id: bio.L05.005
    kind: mcq
    topic: essential-fatty-acids
    stem: >-
      A 45-year-old man comes for a routine checkup. He eats fried fast food every day and rarely
      exercises. BMI is 29 kg/m² and blood pressure is 134/86 mm Hg. A fasting lipid panel is drawn, and
      he is counseled about the trans fats in his diet. Compared with a diet using unsaturated plant
      oils, which lipid pattern is these fats most likely to produce?
    options:
      - ↓ LDL and ↑ HDL
      - ↑ LDL and ↓ HDL
      - ↑ arachidonic acid from linolenic acid
      - ↓ leukotrienes from linoleic acid
      - No effect on lipoproteins
    answer: 1
    why:
      - "That would be protective, the opposite of trans fats."
      - "Right. Trans-unsaturated fatty acids promote cardiovascular disease by ↑ LDL and ↓ HDL."
      - "Arachidonic acid comes from linoleic (omega-6) acid, not linolenic."
      - "Leukotrienes come from arachidonic acid; trans fats aren't described as lowering them."
      - "The book states a clear lipoprotein effect."
    src: { page: 63, quote: "In contrast, consumption of trans-unsaturated fatty acids (found in fast food) promotes cardiovascular disease by ↑ LDL and ↓ HDL." }
    status: unverified
  # ---------- p63: fat-soluble vitamins ----------
  - id: bio.L05.006
    kind: card
    topic: fat-soluble-vitamins
    front: What does absorption of fat-soluble vitamins depend on, and why is their toxicity more common?
    back: Bile emulsification, pancreatic secretions and an intact ileum. Toxicity is more common than with water-soluble vitamins because they accumulate in fat.
    src: { page: 63, quote: "Absorption dependent on bile emulsification, pancreatic secretions, and intact ileum. Toxicity more common than for water-soluble vitamins because fat-soluble vitamins accumulate in fat." }
    status: unverified
  - id: bio.L05.007
    kind: mcq
    topic: fat-soluble-vitamins
    stem: >-
      A 28-year-old woman with celiac disease has bulky, greasy stools. Her INR is 1.9 without
      anticoagulants, and she has bone pain with low serum calcium and phosphate. Which other
      deficiency is most likely as part of the same process?
    options:
      - Vitamin B1
      - Vitamin A
      - Vitamin C
      - Vitamin B6
      - Vitamin B7
    answer: 1
    why:
      - "Thiamine is water soluble and isn't tied to steatorrhea."
      - "Right. Malabsorption with steatorrhea (eg, celiac disease, cystic fibrosis) causes deficiency of the fat-soluble vitamins A, D, E and K."
      - "Vitamin C is water soluble."
      - "B6 deficiency comes with isoniazid or oral contraceptives."
      - "Biotin is water soluble; its deficiency follows long-term antibiotics or raw egg whites."
    src: { page: 63, quote: "Malabsorption syndromes with steatorrhea (eg, cystic fibrosis and celiac disease) or mineral oil intake can cause fat-soluble vitamin deficiencies." }
    status: unverified
