    status: unverified
    tags: [high-yield]
  - id: bio.L04.085
    kind: card
    topic: modes-of-inheritance
    front: In X-linked recessive disease, who is usually more severely affected, and what must a female usually have to be affected?
    back: Males are commonly more severely affected. Females usually must be homozygous to be affected.
    src: { page: 57, quote: "Commonly more severe in males. Females usually must be homozygous to be affected." }
    status: unverified
  - id: bio.L04.086
    kind: cloze
    topic: modes-of-inheritance
    text: "Mitochondrial inheritance is caused by mutations in {{c1::mtDNA}} and is transmitted only through the {{c2::mother}}."
    src: { page: 57, quote: "Caused by mutations in mtDNA." }
    status: unverified
  - id: bio.L04.030
    kind: card
    topic: modes-of-inheritance
    front: Name the X-linked dominant examples in the book.
    back: Fragile X syndrome, Alport syndrome and hypophosphatemic rickets (X-linked hypophosphatemia, phosphate wasting at the proximal tubule).
    src: { page: 57, quote: "Examples: fragile X syndrome, Alport syndrome, hypophosphatemic rickets (also called X-linked hypophosphatemia)—phosphate wasting at proximal tubule → ricketslike presentation." }
    status: unverified
  - id: bio.L04.031
    kind: mcq
    topic: modes-of-inheritance
    stem: >-
      A 32-year-old man comes to the clinic with knee pain. He has had bowed legs and short stature since
      childhood. Serum phosphate is low, calcium is normal and urinary phosphate is high; x-rays show
      rickets-like changes. His wife is unaffected, and they plan to have children. Which pattern is
      expected in their children?
    options:
      - All children affected
      - All daughters affected, no sons affected
      - Half of the sons affected, no daughters affected
      - Half of all children affected regardless of sex
      - No children affected, all daughters carriers
    answer: 1
    why:
      - "Sons get his Y chromosome, not his X."
      - "Right. Hypophosphatemic rickets is X-linked dominant: affected fathers pass it to 100% of daughters and 0% of sons."
      - "That fits a carrier mother with an X-linked recessive disease."
      - "That fits an autosomal dominant disease or an affected mother with an X-linked dominant one."
      - "Daughters being only carriers fits X-linked recessive disease in the father."
    src: { page: 57, quote: "100% of daughters and 0% of sons of affected fathers will be affected." }
    status: unverified
    tags: [high-yield]
  # ---------- p58: autosomal dominant diseases ----------
  - id: bio.L04.032
    kind: enumerate
    topic: autosomal-dominant-diseases
