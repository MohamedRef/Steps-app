  # ---------- p54: gene expression modifications ----------
  - id: bio.L04.001
    kind: card
    topic: gene-expression-modifications
    front: What are the 2 transgenic strategies in mice, and what kind of expression does each give?
    back: Random insertion of a gene into the mouse genome (constitutive expression), and targeted insertion or deletion through homologous recombination with the mouse gene (conditional expression).
    src: { page: 54, quote: "Random insertion—constitutive expression. Targeted insertion—conditional expression." }
    status: unverified
  - id: bio.L04.002
    kind: cloze
    topic: gene-expression-modifications
    text: Knock-{{c1::out}} = removing a gene, taking it out. Knock-{{c2::in}} = inserting a gene.
    src: { page: 54, quote: "Knock-out = removing a gene, taking it out. Knock-in = inserting a gene." }
    status: unverified
  - id: bio.L04.003
    kind: mcq
    topic: gene-expression-modifications
    stem: >-
      A 9-year-old boy has progressive exercise intolerance, and echocardiography shows hypertrophic
      cardiomyopathy. Genetic testing finds a new missense mutation in a sarcomere gene. To study it, his
      physician's research group wants mice that carry the boy's mutant human gene in place of the mouse
      gene, so that it is switched on only in the heart and only after a drug is given. Which strategy,
      and which kind of expression, fits this aim?
    options:
      - Random insertion into the mouse genome; constitutive expression
      - Targeted insertion by homologous recombination with the mouse gene; conditional expression
      - Random insertion into the mouse genome; conditional expression
      - siRNA against the mouse gene; constitutive expression
      - Targeted deletion of the mouse gene (knock-out); no expression of the human gene
    answer: 1
    why:
      - "Random insertion gives constitutive expression, everywhere and always, not a switchable gene."
      - "Right. Targeted insertion through homologous recombination with the mouse gene gives conditional expression, so the human gene can be switched on where and when it is wanted."
      - "In the book, random insertion pairs with constitutive, not conditional, expression."
      - "siRNA lowers expression of an existing mRNA; it doesn't add the human gene."
      - "A knock-out only removes the mouse gene; it inserts nothing."
    src: { page: 54, quote: "Random insertion—constitutive expression. Targeted insertion—conditional expression." }
    status: unverified
  # ---------- p54: RNA interference ----------
  - id: bio.L04.004
    kind: table
    topic: rna-interference
    title: MicroRNA vs small interfering RNA
    columns: [Feature, MicroRNA, Small interfering RNA]
    rows:
      - [Source, Made by the cell as hairpin structures, "Usually exogenous dsRNA (eg, virus); can be made for knockdown experiments"]
      - [Pairing, "Loose → broad targeting of related mRNAs", "Complete → highly specific targeting"]
      - [Effect, "Blocks translation; sometimes helps degradation", mRNA cleavage before translation]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 2]]
    src: { page: 54, quote: "Naturally produced by cell as hairpin structures. Loose nucleotide pairing allows broad targeting of related mRNAs." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.005
    kind: card
    topic: rna-interference
    front: How can abnormal miRNA expression contribute to cancer?
    back: For example, by silencing an mRNA from a tumor suppressor gene.
    src: { page: 54, quote: "Abnormal expression of miRNAs contributes to certain malignancies (eg, by silencing an mRNA from a tumor suppressor gene)." }
    status: unverified
  - id: bio.L04.006
    kind: mcq
    topic: rna-interference
    stem: >-
      A 58-year-old man comes to the clinic with 2 years of burning pain and numbness in both feet,
      orthostatic dizziness and exertional dyspnea. Echocardiography shows thickened ventricular walls,
      and a fat-pad biopsy shows amyloid made of a mutant liver-derived transport protein. He is started
      on an infused synthetic double-stranded RNA drug, taken up by hepatocytes, that lowers the
      hepatic production of this protein by more than 80%. The drug matches a single target mRNA
      base for base. By which mechanism does it most likely act?
    options:
      - MicroRNA with loose pairing to many related mRNAs
      - Small interfering RNA with complete pairing to one mRNA
      - Antisense DNA that blocks transcription
      - CRISPR/Cas9 cutting of the gene
      - Histone deacetylation of the promoter
    answer: 1
    why:
      - "miRNA pairs loosely and broadly and mainly blocks translation."
      - "Right. siRNA needs complete pairing, targets one mRNA very specifically and cleaves it before translation."
      - "The drug is double-stranded RNA acting on mRNA in the cytoplasm, not DNA that blocks transcription."
      - "CRISPR edits DNA; the drug is RNA and the gene itself isn't touched."
      - "Histone changes act on chromatin, not mRNA."
    src: { page: 54, quote: "Once inside a cell, siRNA requires complete nucleotide pairing, leading to highly specific mRNA targeting. Results in mRNA cleavage prior to translation." }
    status: unverified
  # ---------- p54-55: genetic terms ----------
  - id: bio.L04.007
    kind: table
    topic: genetic-terms
    title: Genetic terms (1)
    columns: [Term, Definition, Example]
    rows:
      - [Codominance, Both alleles contribute to the heterozygote's phenotype, "Blood groups A, B, AB; α1-antitrypsin deficiency; HLA groups"]
      - [Variable expressivity, Same genotype gives varying phenotypes, Two patients with NF1 with different severity]
      - [Incomplete penetrance, Not everyone with the pathogenic variant shows the disease, BRCA1 mutations don't always cause cancer]
      - [Pleiotropy, One gene contributes to multiple phenotypic effects, "Cystic fibrosis (lungs, GI, pancreas, male infertility)"]
      - [Anticipation, Increased severity or earlier onset in succeeding generations, "Trinucleotide repeat diseases (eg, Huntington)"]
      - [Epistasis, The allele of one gene affects expression of alleles of another gene, "Albinism, alopecia"]
      - [Aneuploidy, Abnormal number of chromosomes from nondisjunction, "Down syndrome, Turner syndrome, oncogenesis"]
    blanks: [[0, 2], [1, 1], [2, 1], [3, 2], [4, 1], [5, 1], [6, 2]]
    src: { page: 54, quote: "Codominance Both alleles contribute to the phenotype of the heterozygote. Blood groups A, B, AB; α1-antitrypsin deficiency; HLA groups." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.008
    kind: cloze
    topic: genetic-terms
    text: "Risk of expressing a phenotype = {{c1::% penetrance}} × {{c2::probability of inheriting the genotype}}."
    src: { page: 54, quote: "% penetrance × probability of inheriting genotype = risk of expressing phenotype." }
    status: unverified
  - id: bio.L04.009
    kind: card
    topic: genetic-terms
    front: What is loss of heterozygosity, and which genes does it apply to?
    back: With a mutation in a tumor suppressor gene, the wild-type allele must also be deleted or mutated before cancer develops (not true of oncogenes). Examples are retinoblastoma (two-hit hypothesis), Lynch syndrome and Li-Fraumeni syndrome.
    src: { page: 54, quote: "If a patient inherits or develops a mutation in a tumor suppressor gene, the wild type allele must be deleted/mutated/eliminated before cancer develops. This is not true of oncogenes." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.010
    kind: table
    topic: genetic-terms
    title: Genetic terms (2)
    columns: [Term, Definition, Example]
    rows:
      - [Dominant negative mutation, "Heterozygote makes a nonfunctional protein that also blocks the normal one", "Mutant p53 binds DNA and blocks wild-type p53"]
      - [Linkage disequilibrium, "Alleles near each other occur together more or less often than chance; measured in a population", "HLA gene, CFTR gene"]
      - [Locus heterogeneity, Mutations at different loci → same disease, "Albinism, retinitis pigmentosa, familial hypercholesterolemia"]
      - [Allelic heterogeneity, Different mutations in the same locus → same disease, β-thalassemia]
      - [Heteroplasmy, "Normal and mutated mtDNA together → variable expression", Leber hereditary optic neuropathy]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2], [4, 1]]
    src: { page: 55, quote: "Locus heterogeneity Mutations at different loci result in the same disease. Albinism, retinitis pigmentosa, familial hypercholesteremia. Allelic heterogeneity Different mutations in the same locus result in the same disease. β-thalassemia." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.084
    kind: card
    topic: genetic-terms
    front: Who passes mtDNA to the children, and to which ones?
    back: All of them; mtDNA is passed from the mother to all children.
    src: { page: 55, quote: "mtDNA passed from mother to all children." }
    status: unverified
  - id: bio.L04.011
    kind: card
    topic: genetic-terms
    front: What is the difference between somatic and germline (gonadal) mosaicism, and when do you suspect germline mosaicism?
    back: "Somatic: a mitotic error after fertilization spreads through multiple tissues. Germline: the mutation is only in egg or sperm cells. Suspect it when the parents and relatives don't have the disease."
    src: { page: 55, quote: "Germline (gonadal) mosaicism—mutation only in egg or sperm cells. If parents and relatives do not have the disease, suspect gonadal (or germline) mosaicism." }
    status: unverified
  - id: bio.L04.012
    kind: card
    topic: genetic-terms
    front: What causes McCune-Albright syndrome, and how does it present?
    back: An activating Gs-protein (GNAS) mutation. Unilateral café-au-lait spots with ragged edges, polyostotic fibrous dysplasia and at least one endocrinopathy (eg, precocious puberty). Lethal if present before fertilization; survivable only as mosaicism.
    src: { page: 55, quote: "McCune-Albright syndrome—due to Gs-protein (GNAS) activating mutation. Presents with unilateral café-au-lait spots A with ragged edges, polyostotic fibrous dysplasia" }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.013
    kind: card
    topic: genetic-terms
    front: What is uniparental disomy, and what do heterodisomy and isodisomy indicate?
    back: "Two copies of a chromosome from 1 parent and none from the other (euploid; usually normal phenotype). Heterodisomy (heterozygous) = meiosis I error. Isodisomy (homozygous) = meiosis II error or postzygotic duplication and loss."
    src: { page: 55, quote: "Offspring receives 2 copies of a chromosome from 1 parent and no copies from the other parent. HeterodIsomy (heterozygous) indicates a meiosis I error." }
    status: unverified
  - id: bio.L04.014
    kind: card
    topic: genetic-terms
    front: A child has a recessive disease but only one parent is a carrier. What should you consider?
    back: Isodisomy (uniparental disomy).
    src: { page: 55, quote: "Consider isodisomy in an individual manifesting a recessive disorder when only one parent is a carrier." }
    status: unverified
  - id: bio.L04.015
    kind: mcq
    topic: genetic-terms
    stem: >-
      A 6-year-old girl has breast development and vaginal bleeding. She has a large café-au-lait patch
      with ragged, irregular borders on one side of her back, and x-rays show multiple lytic, ground-glass
      bone lesions. Her parents and siblings are healthy. Why does she survive with this mutation?
    options:
      - The mutation shows incomplete penetrance
      - The mutation arose after fertilization, so only some cells carry it (mosaicism)
      - She has uniparental disomy for the affected chromosome
      - The mutation is a dominant negative mutation
      - She has heteroplasmy of mitochondrial DNA
    answer: 1
    why:
      - "Penetrance is about who shows a disease; it doesn't explain survival here."
      - "Right. McCune-Albright (activating GNAS mutation) is lethal if present before fertilization in all cells, but survivable as mosaicism."
      - "UPD gives disease through imprinting or isodisomy, not this picture."
      - "The GNAS mutation is activating, not dominant negative."
      - "Heteroplasmy applies to mitochondrial diseases."
    src: { page: 55, quote: "Lethal if mutation occurs before fertilization (affecting all cells), but survivable in patients with mosaicism." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.016
    kind: mcq
    topic: genetic-terms
    stem: >-
      A 38-year-old woman is seen in the oncology clinic with a 2-cm hard, irregular breast mass; biopsy
      shows invasive ductal carcinoma, and germline testing finds a BRCA1 pathogenic variant. Cascade
      testing shows that her 70-year-old mother carries the same variant. Her mother has had normal
      mammograms and pelvic ultrasounds and has never had cancer. Which term best explains the
      mother's findings?
    options:
      - Variable expressivity
      - Incomplete penetrance
      - Pleiotropy
      - Anticipation
      - Locus heterogeneity
    answer: 1
    why:
      - "Variable expressivity is different severity among people who all have the disease (eg, NF1)."
      - "Right. Not everyone with the pathogenic variant shows the disease; BRCA1 is the book's example."
      - "Pleiotropy is one gene giving many effects."
      - "Anticipation is earlier or worse disease in later generations."
      - "Locus heterogeneity is different genes giving the same disease."
    src: { page: 54, quote: "BRCA1 gene mutations do not always result in breast or ovarian cancer." }
    status: unverified
  # ---------- p55: population genetics ----------
  - id: bio.L04.017
    kind: table
    topic: population-genetics
    title: Population genetics
    columns: [Concept, Description]
    rows:
      - [Bottleneck effect, "A disaster removes certain alleles by chance → new allele frequency (not naturally selected)"]
      - [Founder effect, A bottleneck caused by calamitous population separation]
      - [Natural selection, Alleles that increase fitness are more likely to be passed on]
      - [Genetic drift, "Dramatic chance shift in allele frequency (Wright effect); founder and bottleneck effects are examples"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 55, quote: "Genetic drift Also called allelic drift or Wright effect. A dramatic shift in allelic frequency that occurs by chance (not by natural selection)." }
    status: unverified
  - id: bio.L04.018
    kind: mcq
    topic: population-genetics
    stem: >-
      A healthy 24-year-old woman comes for preconception counseling. She grew up on an isolated island
      settled 300 years ago by 30 families. Carrier screening shows she carries a rare recessive allele
      that one of the founders brought; it is now found in 12% of the island's people but almost nowhere
      else, and it gives no survival advantage. Which process best explains why the allele is so
      common in her community?
    options:
      - Natural selection
      - Genetic drift
      - Hardy-Weinberg equilibrium
      - Linkage disequilibrium
      - Anticipation
    answer: 1
    why:
      - "The allele has no fitness benefit, so it wasn't selected."
      - "Right. The founder effect, a chance change in allele frequency from population separation, is a form of genetic drift."
      - "Hardy-Weinberg assumes a large population with no such chance shifts."
      - "Linkage disequilibrium describes alleles found together on a chromosome."
      - "Anticipation is worsening disease across generations."
    src: { page: 55, quote: "Founder effect and bottleneck effect are both examples of genetic drift." }
    status: unverified
  # ---------- p56: Hardy-Weinberg ----------
  - id: bio.L04.019
    kind: cloze
    topic: hardy-weinberg
    text: "In Hardy-Weinberg, p + q = 1 and {{c1::p² + 2pq + q²}} = 1, where {{c2::2pq}} is the heterozygote (carrier) frequency."
    src: { page: 56, quote: "2pq = frequency of heterozygosity (carrier frequency, if an autosomal recessive disease)" }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.020
    kind: cloze
    topic: hardy-weinberg
    text: The frequency of an X-linked recessive disease is {{c1::q}} in males and {{c2::q²}} in females.
    src: { page: 56, quote: "The frequency of an X-linked recessive disease in males = q and in females = q2" }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.021
    kind: enumerate
    topic: hardy-weinberg
    prompt: Enumerate the assumptions of the Hardy-Weinberg law (5).
    points:
      - No mutation at the locus
      - No natural selection
      - Completely random mating
      - No net migration
      - Large population
    pass: 5
    hook: "المجتمع الهادي: مفيش طفرة، مفيش انتقاء، الجواز عشوائي، محدش داخل ولا خارج، والعدد كبير."
    src: { page: 56, quote: "Hardy-Weinberg law assumptions include: ▘ No mutation occurring at the locus ▘ Natural selection is not occurring ▘ Completely random mating ▘ No net migration ▘ Large population" }
    status: unverified
  - id: bio.L04.022
    kind: card
    topic: hardy-weinberg
    front: Cystic fibrosis affects about 1/3200 people in the US. What are q and the carrier frequency?
    back: q² = 1/3200, so q ≈ 0.017. p ≈ 1 (rare disease), so carriers = 2pq ≈ 0.035 (3.5%).
    src: { page: 56, quote: "q2 = 1/3200, with q ≈ 0.017 or 1.7% of the population." }
    status: unverified
  - id: bio.L04.023
    kind: mcq
    topic: hardy-weinberg
    stem: >-
      An autosomal recessive disease affects 1 in 10,000 newborns in a large, randomly mating
      population. A healthy woman from this population with no family history asks her chance of being
      a carrier. What is the best estimate?
    options:
      - 1 in 100
      - 1 in 50
      - 1 in 200
      - 1 in 10,000
      - 1 in 25
    answer: 1
    why:
      - "1/100 is q, the allele frequency, not the carrier frequency."
      - "Right. q² = 1/10,000 → q = 1/100; p ≈ 1, so 2pq ≈ 2 × 1/100 = 1/50."
      - "This halves q instead of doubling it."
      - "That is the disease frequency, q²."
      - "This overestimates 2pq."
    src: { page: 56, quote: "2pq = frequency of heterozygosity (carrier frequency, if an autosomal recessive disease)" }
    status: unverified
    tags: [high-yield]
  # ---------- p56: disorders of imprinting ----------
  - id: bio.L04.024
    kind: card
    topic: imprinting
    front: What is imprinting, and what does it cause?
    back: One gene copy is silenced by methylation and only the other is expressed → parent-of-origin effects. Disease follows if the expressed copy is mutated, not expressed or deleted.
    src: { page: 56, quote: "One gene copy is silenced by methylation, and only the other copy is expressed → parent-of-origin effects." }
    status: unverified
  - id: bio.L04.025
    kind: table
    topic: imprinting
    title: Prader-Willi vs Angelman syndrome
    columns: [Feature, Prader-Willi, Angelman]
    rows:
      - [Normally silent, "Maternal genes (except UBE3A)", Paternal UBE3A]
      - [Disease when deleted or mutated, Paternal allele, Maternal allele]
      - [Signs, "Hyperphagia, obesity, intellectual disability, hypogonadism, hypotonia", "Hand-flapping, ataxia, severe intellectual disability, inappropriate laughter, seizures (HAILS)"]
      - [Chromosome, Chromosome 15 of paternal origin, UBE3A on maternal chromosome 15]
      - [Uniparental disomy, 25% are maternal UPD, 5% are paternal UPD]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [4, 1], [4, 2]]
    src: { page: 56, quote: "SIGNS AND SYMPTOMS Hyperphagia, obesity, intellectual disability, hypogonadism, hypotonia Hand-flapping, Ataxia, severe Intellectual disability, inappropriate Laughter, Seizures." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.026
    kind: card
    topic: imprinting
    front: What are the book's mnemonics for Prader-Willi and Angelman?
    back: "POP: Prader-Willi, Obesity/overeating, Paternal allele deleted. MAMAS: Maternal allele deleted, Angelman, Mood, Ataxia, Seizures. HAILS the Angels."
    src: { page: 56, quote: "POP: Prader-Willi, Obesity/overeating, Paternal allele deleted MAMAS: Maternal allele deleted, Angelman syndrome, Mood, Ataxia, Seizures" }
    status: unverified
  - id: bio.L04.027
    kind: mcq
    topic: imprinting
    stem: >-
      A 4-year-old boy was a floppy infant who fed poorly; now he eats constantly, takes food from the
      trash and is obese. He has small genitalia and mild intellectual disability. Testing shows no
      deletion on chromosome 15, but both copies of chromosome 15 came from his mother. Why is he
      affected?
    options:
      - The maternal copy of UBE3A on chromosome 15 is deleted or silent
      - The paternally expressed genes on 15q are absent because there is no paternal copy
      - He has a CGG trinucleotide repeat expansion in the FMR1 gene
      - He has a dominant negative mutation in UBE3A on the maternal allele
      - He has mosaic trisomy 15 from a mitotic nondisjunction after fertilization
    answer: 1
    why:
      - "Maternal UBE3A loss causes Angelman; he has two maternal copies, so UBE3A is present."
      - "Right. Prader-Willi: maternal genes are silenced by imprinting, so the disease appears when no active paternal copy exists; 25% of cases are maternal uniparental disomy."
      - "CGG repeats cause fragile X."
      - "The defect is imprinting, not a protein-blocking mutation."
      - "UPD is euploid; there is no extra chromosome."
    src: { page: 56, quote: "25% of cases are due to maternal uniparental disomy" }
    status: unverified
    tags: [high-yield]
  # ---------- p57: modes of inheritance ----------
  - id: bio.L04.028
    kind: table
    topic: modes-of-inheritance
    title: Modes of inheritance
    columns: [Mode, Key features]
    rows:
      - [Autosomal dominant, "Structural gene defects; many generations, both sexes; pleiotropic, variably expressive; 50% of children of an affected parent"]
      - [Autosomal recessive, "Enzyme deficiencies; usually one generation; more severe, childhood onset; 25% affected with 2 carrier parents; ↑ with consanguinity"]
      - [X-linked recessive, "Sons of carrier mothers 50% affected; no male-to-male transmission; skips generations"]
      - [X-linked dominant, "Both parents transmit; 50% of children of affected mothers; all daughters and no sons of affected fathers"]
      - [Mitochondrial, "Only through the mother; all offspring of affected females may show disease; variable from heteroplasmy"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 57, quote: "Transmitted through both parents. Children of affected mothers each have a 50% chance of being affected. 100% of daughters and 0% of sons of affected fathers will be affected." }
