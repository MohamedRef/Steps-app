      - Hereditary spherocytosis
      - Huntington disease
      - Li-Fraumeni syndrome
      - Marfan syndrome
      - Multiple endocrine neoplasias
      - Myotonic muscular dystrophy
      - Neurofibromatosis types 1 and 2
