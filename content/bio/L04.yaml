  # ---------- p62: Robertsonian translocation ----------
  - id: bio.L04.079
    kind: card
    topic: robertsonian-translocation
    front: What is a Robertsonian translocation, and which chromosomes does it usually involve?
    back: The long arms of 2 acrocentric chromosomes fuse at the centromere and the 2 short arms are lost. It commonly involves pairs 21, 22, 13, 14 and 15.
    src: { page: 62, quote: "Occurs when the long arms of 2 acrocentric chromosomes (chromosomes with centromeres near their ends) fuse at the centromere and the 2 short arms are lost." }
    status: unverified
    tags: [high-yield]
  - id: bio.L04.080
    kind: card
    topic: robertsonian-translocation
    front: What is the difference between balanced and unbalanced translocations?
    back: Balanced translocations (no significant gain or loss) usually don't cause an abnormal phenotype. Unbalanced ones (missing or extra genes) can cause miscarriage, stillbirth and chromosomal imbalance (eg, Down, Patau).
    src: { page: 62, quote: "Balanced translocations (no gain or loss of significant genetic material) normally do not cause abnormal phenotype." }
    status: unverified
  - id: bio.L04.081
    kind: mcq
    topic: robertsonian-translocation
    stem: >-
      A healthy 27-year-old woman has had two miscarriages and a child with Down syndrome. Her karyotype
      shows 45 chromosomes, with one chromosome made of the long arms of chromosomes 14 and 21 joined at
      the centromere. Why is she healthy?
    options:
      - She has low-level mosaicism for trisomy 21 in some of her somatic cells
      - Her translocation is balanced, with no significant genetic material lost
      - She has uniparental disomy of chromosome 21 with no extra chromosome
      - The lost short arms carry imprinted genes, so their loss goes unnoticed
      - She has trisomy 21 with incomplete penetrance of the Down phenotype
    answer: 1
    why:
      - "Her karyotype shows a translocation, not two cell lines."
      - "Right. In a Robertsonian translocation the short arms lost carry no significant genes, so a balanced carrier is normal but can make unbalanced gametes (miscarriage, Down syndrome)."
      - "UPD is two copies from one parent, not a fused chromosome."
      - "Imprinting isn't the reason; the short arms carry little essential material."
      - "Penetrance doesn't apply; she has no extra chromosome 21 material."
    src: { page: 62, quote: "Unbalanced translocations (missing or extra genes) can result in miscarriage, stillbirth, and chromosomal imbalance (eg, Down syndrome, Patau syndrome)." }
    status: unverified
