# Public health sciences (phs) abbreviations for the hover glossary. One file
# per course; `steps-tools validate` checks it with content/glossary.yaml as
# one glossary (a term listed twice anywhere is refused).
schema: steps.glossary/v1
entries:
  - { term: "NNH", kind: abbr, text: "Number needed to harm", status: unverified }
  - { term: "LR", kind: abbr, text: "Likelihood ratio", status: unverified }
  - { term: "TP", kind: abbr, text: "True positive (diseased, test positive)", status: unverified }
  - { term: "FN", kind: abbr, text: "False negative (diseased, test negative)", status: unverified }
  - { term: "TN", kind: abbr, text: "True negative (healthy, test negative)", status: unverified }
  - { term: "FP", kind: abbr, text: "False positive (healthy, test positive)", status: unverified }
  - { term: "PSA", kind: abbr, text: "Prostate-specific antigen", status: unverified }
  - { term: "ROC", kind: abbr, text: "Receiver operating characteristic (curve)", status: unverified }
  - { term: "SE", kind: abbr, text: "Standard error (of the mean)", status: unverified }
  - { term: "ANOVA", kind: abbr, text: "Analysis of variance", status: unverified }
  - { term: "DNR", kind: abbr, text: "Do not resuscitate (order)", status: unverified }
  - { term: "CPR", kind: abbr, text: "Cardiopulmonary resuscitation", status: unverified }
  - { term: "STIs", aliases: [STI], kind: abbr, text: "Sexually transmitted infections", status: unverified }
# Capitals in phs lessons that are not abbreviations (the book's mnemonics).
plain:
  - "SWIM"
  - "SN"
  - "OUT"
  - "SP"
  - "IN"
  - "ANalysis"
  - "VAriance"
  - "WIPE"
  - "SAVED"
