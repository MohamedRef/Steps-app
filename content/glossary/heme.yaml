# Hematology and Oncology (heme) abbreviations for the hover glossary. One
# file per course; `steps-tools validate` checks it with content/glossary.yaml
# as one glossary.
schema: steps.glossary/v1
entries:
  - { term: "ADP", kind: abbr, text: "Adenosine diphosphate (platelet dense granules)", status: unverified }
  - { term: "CD16", kind: abbr, text: "Cluster of differentiation 16 (Fc receptor on NK cells)", status: unverified }
  - { term: "CD21", kind: abbr, text: "Cluster of differentiation 21 (B-cell marker; EBV receptor)", status: unverified }
  - { term: "CD56", kind: abbr, text: "Cluster of differentiation 56 (NK-cell marker)", status: unverified }
  - { term: "GpIb", kind: abbr, text: "Glycoprotein Ib (platelet vWF receptor)", status: unverified }
  - { term: "HbA", kind: abbr, text: "Adult hemoglobin (HbA1, α2β2)", status: unverified }
  - { term: "HbA1", kind: abbr, text: "Adult hemoglobin A1 (α2β2)", status: unverified }
  - { term: "HbC", kind: abbr, text: "Hemoglobin C (β-globin glutamic acid → lysine)", status: unverified }
  - { term: "HETE", aliases: ["5-HETE"], kind: abbr, text: "Hydroxyeicosatetraenoic acid (5-HETE, a leukotriene precursor)", status: unverified }
  - { term: "HMWK", kind: abbr, text: "High-molecular-weight kininogen", status: unverified }
  - { term: "KIT", aliases: ["c-KIT"], kind: abbr, text: "KIT proto-oncogene (c-KIT), a receptor tyrosine kinase", status: unverified }
  - { term: "LPS", kind: abbr, text: "Lipopolysaccharide (endotoxin)", status: unverified }
  - { term: "RER", kind: abbr, text: "Rough endoplasmic reticulum", status: unverified }
  - { term: "TXA2", kind: abbr, text: "Thromboxane A2", status: unverified }
  - { term: "XR", kind: abbr, text: "X-linked recessive", status: unverified }
  - { term: "ALA", kind: abbr, text: "Aminolevulinic acid (first heme-synthesis intermediate)", status: unverified }
  - { term: "AVN", kind: abbr, text: "Avascular necrosis", status: unverified }
  - { term: "BT", kind: abbr, text: "Bleeding time", status: unverified }
  - { term: "CD1a", kind: abbr, text: "Cluster of differentiation 1a (Langerhans cell marker)", status: unverified }
  - { term: "CD5", kind: abbr, text: "Cluster of differentiation 5 (T-cell marker, also on CLL/SLL and mantle cell B cells)", status: unverified }
  - { term: "CD23", kind: abbr, text: "Cluster of differentiation 23 (on CLL/SLL B cells)", status: unverified }
  - { term: "CD207", kind: abbr, text: "Cluster of differentiation 207 (langerin, Langerhans cell marker)", status: unverified }
  - { term: "EDTA", kind: abbr, text: "Ethylenediaminetetraacetic acid (lead chelator)", status: unverified }
  - { term: "FLT3", kind: abbr, text: "FMS-like tyrosine kinase 3 (mutated in some AML)", status: unverified }
  - { term: "HbSC", kind: abbr, text: "Compound heterozygous hemoglobin S and C disease", status: unverified }
  - { term: "OTC", kind: abbr, text: "Ornithine transcarbamylase", status: unverified }
  - { term: "PBG", kind: abbr, text: "Porphobilinogen", status: unverified }
  - { term: "PML", kind: abbr, text: "Promyelocytic leukemia gene (PML::RARA fusion in APL)", status: unverified }
  - { term: "RANK", kind: abbr, text: "Receptor activator of nuclear factor κB (osteoclast activation)", status: unverified }
  - { term: "RARα", kind: abbr, text: "Retinoic acid receptor α", status: unverified }
  - { term: "rRNA", kind: abbr, text: "Ribosomal RNA", status: unverified }
  - { term: "TIBC", kind: abbr, text: "Total iron-binding capacity (reflects transferrin)", status: unverified }
  - { term: "TRAP", kind: abbr, text: "Tartrate-resistant acid phosphatase (hairy cell leukemia)", status: unverified }
  - { term: "UMP", kind: abbr, text: "Uridine monophosphate", status: unverified }
  - { term: "UROD", kind: abbr, text: "Uroporphyrinogen decarboxylase", status: unverified }
  - { term: "UTR", kind: abbr, text: "Untranslated region (of an mRNA)", status: unverified }
