# Microbiology (mic) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary.
schema: steps.glossary/v1
entries:
  - { term: "LPS", kind: abbr, text: "Lipopolysaccharide (endotoxin)", status: unverified }
  - { term: "PBPs", kind: abbr, text: "Penicillin-binding proteins", status: unverified }
  - { term: "PBP", kind: abbr, text: "Penicillin-binding protein", status: unverified }
  - { term: "FTA-ABS", kind: abbr, text: "Fluorescent treponemal antibody absorption test (syphilis)", status: unverified }
  - { term: "EMB", kind: abbr, text: "Eosin–methylene blue agar", status: unverified }
  - { term: "rRNA", kind: abbr, text: "Ribosomal RNA", status: unverified }
  - { term: "DNase", kind: abbr, text: "Deoxyribonuclease", status: unverified }
  - { term: "ADP", kind: abbr, text: "Adenosine diphosphate (as in ADP-ribosylation)", status: unverified }
  - { term: "EHEC", kind: abbr, text: "Enterohemorrhagic E coli", status: unverified }
  - { term: "ETEC", kind: abbr, text: "Enterotoxigenic E coli", status: unverified }
  - { term: "cGMP", kind: abbr, text: "Cyclic guanosine monophosphate", status: unverified }
  - { term: "SNARE", kind: abbr, text: "Soluble NSF attachment protein receptor (vesicle fusion proteins)", status: unverified }
  - { term: "ASO", kind: abbr, text: "Antistreptolysin O (antibody)", status: unverified }
  - { term: "TSST-1", kind: abbr, text: "Toxic shock syndrome toxin-1", status: unverified }
  - { term: "TLR4", kind: abbr, text: "Toll-like receptor 4 (binds LPS)", status: unverified }
  - { term: "LOS", kind: abbr, text: "Lipooligosaccharide (Neisseria endotoxin)", status: unverified }
  - { term: "OMPs", kind: abbr, text: "Outer membrane proteins", status: unverified }
  - { term: "SHiN", kind: abbr, text: "S pneumoniae, H influenzae type b, Neisseria (IgA protease, transformation)", status: unverified }
# Capitals in mic lessons that are not abbreviations (book mnemonics).
