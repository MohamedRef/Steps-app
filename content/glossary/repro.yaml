# Reproductive (repro) abbreviations for the hover glossary. One file per course:
# it lists every abbreviation the course's lessons and items use, with the
# meaning the course intends. A term may also be in glossary.yaml or in
# another course file; `steps-tools validate` reads them as one glossary and
# refuses a term listed twice within one file (docs/LESSONS.md).
