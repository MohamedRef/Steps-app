# Reproductive (repro) abbreviations for the hover glossary. One file per
# course (see content/glossary/cvs.yaml); shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "ADHD", kind: abbr, text: "Attention-deficit/hyperactivity disorder", status: unverified }
  - { term: "DHT", kind: abbr, text: "Dihydrotestosterone", status: unverified }
