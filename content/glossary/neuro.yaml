# Neurology and Special Senses (neuro) abbreviations for the hover glossary.
# One file per course; `steps-tools validate` checks them with
# content/glossary.yaml as one glossary (a term listed twice anywhere is
# refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "HOX", kind: abbr, text: "Homeobox (genes)", status: unverified }
  - { term: "DRG", kind: abbr, text: "Dorsal root ganglion", status: unverified }
  - { term: "NTD", aliases: [NTDs], kind: abbr, text: "Neural tube defect", status: unverified }
  - { term: "AChE", kind: abbr, text: "Acetylcholinesterase", status: unverified }
  - { term: "LMN", kind: abbr, text: "Lower motor neuron", status: unverified }
