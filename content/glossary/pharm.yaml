# Pharmacology (pharm) abbreviations for the hover glossary. One file per
# course; `steps-tools validate` checks it with content/glossary.yaml as one
# glossary (a term listed twice anywhere is refused).
schema: steps.glossary/v1
entries:
  - { term: "AUC", kind: abbr, text: "Area under the curve (plasma concentration over time)", status: unverified }
  - { term: "CL", kind: abbr, text: "Clearance (of a drug)", status: unverified }
  - { term: "EC50", kind: abbr, text: "Concentration giving 50% of maximal effect (median effective concentration)", status: unverified }
  - { term: "ED50", kind: abbr, text: "Median effective dose", status: unverified }
  - { term: "TD50", kind: abbr, text: "Median toxic dose", status: unverified }
  - { term: "LD50", kind: abbr, text: "Median lethal dose", status: unverified }
  - { term: "AChE", kind: abbr, text: "Acetylcholinesterase", status: unverified }
  - { term: "CNs", aliases: [CN], kind: abbr, text: "Cranial nerves", status: unverified }
  - { term: "DAG", kind: abbr, text: "Diacylglycerol", status: unverified }
  - { term: "ED", kind: abbr, text: "Erectile dysfunction; also emergency department", status: unverified }
  - { term: "IP3", kind: abbr, text: "Inositol trisphosphate", status: unverified }
  - { term: "MLCK", kind: abbr, text: "Myosin light-chain kinase", status: unverified }
  - { term: "NM", kind: abbr, text: "Nicotinic receptor of the neuromuscular junction (muscle type)", status: unverified }
  - { term: "NMJ", kind: abbr, text: "Neuromuscular junction", status: unverified }
  - { term: "NN", kind: abbr, text: "Nicotinic receptor of autonomic ganglia and adrenal medulla (neuronal type)", status: unverified }
  - { term: "SVT", kind: abbr, text: "Supraventricular tachycardia", status: unverified }
  - { term: "TRPV", kind: abbr, text: "Transient receptor potential vanilloid (receptor)", status: unverified }
  - { term: "VMAT", kind: abbr, text: "Vesicular monoamine transporter", status: unverified }
  - { term: "DIHS", kind: abbr, text: "Drug-induced hypersensitivity syndrome (DRESS)", status: unverified }
  - { term: "DRESS", kind: abbr, text: "Drug reaction with eosinophilia and systemic symptoms", status: unverified }
  - { term: "EDTA", kind: abbr, text: "Ethylenediaminetetraacetic acid (calcium disodium EDTA, a chelator)", status: unverified }
  - { term: "HCTZ", kind: abbr, text: "Hydrochlorothiazide", status: unverified }
  - { term: "LSD", kind: abbr, text: "Lysergic acid diethylamide", status: unverified }
  - { term: "SJS", kind: abbr, text: "Stevens-Johnson syndrome", status: unverified }
  - { term: "ADP", kind: abbr, text: "Adenosine diphosphate", status: unverified }
  - { term: "CDK", kind: abbr, text: "Cyclin-dependent kinase", status: unverified }
  - { term: "COMT", kind: abbr, text: "Catechol-O-methyltransferase", status: unverified }
  - { term: "CysLT1", kind: abbr, text: "Cysteinyl leukotriene receptor 1", status: unverified }
  - { term: "HT1B", kind: abbr, text: "5-HT1B serotonin receptor (5-HT = 5-hydroxytryptamine)", status: unverified }
  - { term: "HT3", kind: abbr, text: "5-HT3 serotonin receptor (5-HT = 5-hydroxytryptamine)", status: unverified }
  - { term: "NK1", kind: abbr, text: "Neurokinin 1 (substance P) receptor", status: unverified }
  - { term: "PARP", kind: abbr, text: "Poly(ADP-ribose) polymerase", status: unverified }
# Capitals in pharm lessons that are not abbreviations (the book's mnemonics).
  - { term: "ADHD", kind: abbr, text: "Attention-deficit hyperactivity disorder", status: unverified }
  - { term: "cGMP", kind: abbr, text: "Cyclic guanosine monophosphate", status: unverified }
  - { term: "BRCA", kind: abbr, text: "Breast cancer susceptibility gene (BRCA1, BRCA2)", status: unverified }
  - { term: "GPCR", kind: abbr, text: "G protein–coupled receptor", status: unverified }
  - { term: "MAOI", kind: abbr, text: "Monoamine oxidase inhibitor", status: unverified }
