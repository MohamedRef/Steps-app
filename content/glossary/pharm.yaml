# Pharmacology (pharm) abbreviations for the hover glossary. One file per
# course; `steps-tools validate` checks it with content/glossary.yaml as one
# glossary (a term listed twice anywhere is refused).
schema: steps.glossary/v1
entries:
  - { term: "AUC", kind: abbr, text: "Area under the curve (plasma concentration over time)", status: unverified }
  - { term: "CL", kind: abbr, text: "Clearance (of a drug)", status: unverified }
  - { term: "EC50", kind: abbr, text: "Concentration giving 50% of maximal effect (median effective concentration)", status: unverified }
  - { term: "ED50", kind: abbr, text: "Median effective dose", status: unverified }
  - { term: "TD50", kind: abbr, text: "Median toxic dose", status: unverified }
  - { term: "LD50", kind: abbr, text: "Median lethal dose", status: unverified }
