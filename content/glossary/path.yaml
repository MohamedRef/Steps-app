# General pathology (path) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "TNFR", kind: abbr, text: "Tumor necrosis factor receptor", status: unverified }
  - { term: "CD95", kind: abbr, text: "Fas, the death receptor of the extrinsic apoptosis pathway", status: unverified }
  - { term: "CCl4", kind: abbr, text: "Carbon tetrachloride", status: unverified }
  - { term: "CCl3", kind: abbr, text: "Trichloromethyl free radical (from carbon tetrachloride via cytochrome P-450)", status: unverified }
  - { term: "TTR", kind: abbr, text: "Transthyretin", status: unverified }
# Capitals in path lessons that are not abbreviations.
plain:
  - "PSaMMoMa"
