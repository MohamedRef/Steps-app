# General pathology (path) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "TNFR", kind: abbr, text: "Tumor necrosis factor receptor", status: unverified }
  - { term: "CD95", kind: abbr, text: "Fas, the death receptor of the extrinsic apoptosis pathway", status: unverified }
  - { term: "CCl4", kind: abbr, text: "Carbon tetrachloride", status: unverified }
  - { term: "CCl3", kind: abbr, text: "Trichloromethyl free radical (from carbon tetrachloride via cytochrome P-450)", status: unverified }
  - { term: "TTR", kind: abbr, text: "Transthyretin", status: unverified }
  - { term: "LewisX", kind: abbr, text: "Sialyl Lewis X, the leukocyte ligand for E- and P-selectin", status: unverified }
  - { term: "CD11", kind: abbr, text: "Integrin alpha subunit that pairs with CD18 (LFA-1, Mac-1)", status: unverified }
  - { term: "PECAM", kind: abbr, text: "Platelet endothelial cell adhesion molecule (PECAM-1, CD31; diapedesis)", status: unverified }
  - { term: "GlyCAM", kind: abbr, text: "Glycosylation-dependent cell adhesion molecule (GlyCAM-1; L-selectin ligand)", status: unverified }
  - { term: "CD54", kind: abbr, text: "ICAM-1, intercellular adhesion molecule 1", status: unverified }
  - { term: "CD106", kind: abbr, text: "VCAM-1, vascular cell adhesion molecule 1", status: unverified }
  - { term: "VLA", kind: abbr, text: "Very late antigen (VLA-4 integrin binds VCAM-1)", status: unverified }
  - { term: "CD31", kind: abbr, text: "PECAM-1, the diapedesis molecule on leukocytes and endothelium", status: unverified }
  - { term: "HETE", kind: abbr, text: "Hydroxyeicosatetraenoic acid (5-HETE, a chemotactic factor)", status: unverified }
  - { term: "EGF", kind: abbr, text: "Epidermal growth factor", status: unverified }
  - { term: "ErbB1", kind: abbr, text: "EGFR, the epidermal growth factor receptor (a tyrosine kinase)", status: unverified }
# Capitals in path lessons that are not abbreviations.
plain:
  - "PSaMMoMa"
