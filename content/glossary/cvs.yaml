# Cardiovascular (cvs) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "ASD", kind: abbr, text: "Atrial septal defect", status: unverified }
  - { term: "AVSD", kind: abbr, text: "Atrioventricular septal defect (endocardial cushion defect)", status: unverified }
  - { term: "PFO", kind: abbr, text: "Patent foramen ovale", status: unverified }
  - { term: "PGE1", kind: abbr, text: "Prostaglandin E1 (alprostadil)", status: unverified }
  - { term: "TGA", kind: abbr, text: "Transposition of the great arteries", status: unverified }
  - { term: "VSD", kind: abbr, text: "Ventricular septal defect", status: unverified }
  - { term: "LCA", kind: abbr, text: "Left (main) coronary artery", status: unverified }
  - { term: "LCX", kind: abbr, text: "Left circumflex artery", status: unverified }
  - { term: "RCA", kind: abbr, text: "Right coronary artery", status: unverified }
  - { term: "aVF", kind: abbr, text: "Augmented vector foot (ECG limb lead, inferior wall)", status: unverified }
  - { term: "SV", kind: abbr, text: "Stroke volume", status: unverified }
  - { term: "SW", kind: abbr, text: "Stroke work", status: unverified }
  - { term: "EDV", kind: abbr, text: "End-diastolic volume (preload)", status: unverified }
  - { term: "ESV", kind: abbr, text: "End-systolic volume", status: unverified }
  - { term: "TPR", kind: abbr, text: "Total peripheral resistance", status: unverified }
  - { term: "RAP", kind: abbr, text: "Right atrial pressure", status: unverified }
  - { term: "VT", kind: abbr, text: "Ventricular tachycardia", status: unverified }
  - { term: "MV", kind: abbr, text: "Mitral valve", status: unverified }
  - { term: "RBBB", kind: abbr, text: "Right bundle branch block", status: unverified }
  - { term: "LSB", kind: abbr, text: "Left sternal border", status: unverified }
  - { term: "HCN", kind: abbr, text: "Hyperpolarization-activated cyclic nucleotide-gated channel (funny current)", status: unverified }
  - { term: "NTS", kind: abbr, text: "Nucleus tractus solitarius", status: unverified }
  - { term: "PCWP", kind: abbr, text: "Pulmonary capillary wedge pressure", status: unverified }
  - { term: "LVEDP", kind: abbr, text: "Left ventricular end-diastolic pressure", status: unverified }
# Capitals in cvs lessons that are not abbreviations.
plain:
  - "kEEp"
  - "BEAR"
  - "AVenue"
