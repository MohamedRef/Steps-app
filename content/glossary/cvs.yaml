# Cardiovascular (cvs) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "ASD", kind: abbr, text: "Atrial septal defect", status: unverified }
  - { term: "AVSD", kind: abbr, text: "Atrioventricular septal defect (endocardial cushion defect)", status: unverified }
  - { term: "PFO", kind: abbr, text: "Patent foramen ovale", status: unverified }
  - { term: "PGE1", kind: abbr, text: "Prostaglandin E1 (alprostadil)", status: unverified }
  - { term: "TGA", kind: abbr, text: "Transposition of the great arteries", status: unverified }
  - { term: "VSD", kind: abbr, text: "Ventricular septal defect", status: unverified }
  - { term: "LCA", kind: abbr, text: "Left (main) coronary artery", status: unverified }
  - { term: "LCX", kind: abbr, text: "Left circumflex artery", status: unverified }
  - { term: "RCA", kind: abbr, text: "Right coronary artery", status: unverified }
  - { term: "aVF", kind: abbr, text: "Augmented vector foot (ECG limb lead, inferior wall)", status: unverified }
  - { term: "SV", kind: abbr, text: "Stroke volume", status: unverified }
  - { term: "SW", kind: abbr, text: "Stroke work", status: unverified }
  - { term: "EDV", kind: abbr, text: "End-diastolic volume (preload)", status: unverified }
  - { term: "ESV", kind: abbr, text: "End-systolic volume", status: unverified }
  - { term: "IP3", kind: abbr, text: "Inositol trisphosphate (Gq second messenger; releases Ca2+ from the sarcoplasmic reticulum)", status: unverified }
  - { term: "JLN", kind: abbr, text: "Jervell and Lange-Nielsen syndrome (autosomal recessive long QT with sensorineural deafness)", status: unverified }
  - { term: "TPR", kind: abbr, text: "Total peripheral resistance", status: unverified }
  - { term: "RAP", kind: abbr, text: "Right atrial pressure", status: unverified }
  - { term: "VT", kind: abbr, text: "Ventricular tachycardia", status: unverified }
  - { term: "MV", kind: abbr, text: "Mitral valve", status: unverified }
  - { term: "RBBB", kind: abbr, text: "Right bundle branch block", status: unverified }
  - { term: "MVP", kind: abbr, text: "Mitral valve prolapse", status: unverified }
  - { term: "LSB", kind: abbr, text: "Left sternal border", status: unverified }
  - { term: "HCN", kind: abbr, text: "Hyperpolarization-activated cyclic nucleotide-gated channel (funny current)", status: unverified }
  - { term: "cGMP", kind: abbr, text: "Cyclic guanosine monophosphate", status: unverified }
  - { term: "NTS", kind: abbr, text: "Nucleus tractus solitarius", status: unverified }
  - { term: "PCWP", kind: abbr, text: "Pulmonary capillary wedge pressure", status: unverified }
  - { term: "LVEDP", kind: abbr, text: "Left ventricular end-diastolic pressure", status: unverified }
  - { term: "AAA", kind: abbr, text: "Abdominal aortic aneurysm", status: unverified }
  - { term: "ADP", kind: abbr, text: "Adenosine diphosphate (platelet ADP receptor, eg, clopidogrel target)", status: unverified }
  - { term: "ASO", kind: abbr, text: "Antistreptolysin O (antibody titer)", status: unverified }
  - { term: "CPR", kind: abbr, text: "Cardiopulmonary resuscitation", status: unverified }
  - { term: "DCM", kind: abbr, text: "Dilated cardiomyopathy", status: unverified }
  - { term: "DNase", kind: abbr, text: "Deoxyribonuclease (anti-DNase B antibody after strep infection)", status: unverified }
  - { term: "EDP", kind: abbr, text: "End-diastolic pressure", status: unverified }
  - { term: "HACEK", kind: abbr, text: "Haemophilus, Aggregatibacter, Cardiobacterium, Eikenella, Kingella (culture-negative endocarditis)", status: unverified }
  - { term: "JVD", kind: abbr, text: "Jugular venous distention", status: unverified }
  - { term: "MAT", kind: abbr, text: "Multifocal atrial tachycardia", status: unverified }
  - { term: "MB", kind: abbr, text: "Muscle-brain (CK-MB, the cardiac creatine kinase isoenzyme)", status: unverified }
  - { term: "NBTE", kind: abbr, text: "Nonbacterial thrombotic endocarditis (marantic)", status: unverified }
  - { term: "PAC", kind: abbr, text: "Premature atrial contraction", status: unverified }
  - { term: "PPHN", kind: abbr, text: "Persistent pulmonary hypertension of the newborn", status: unverified }
  - { term: "PSVT", kind: abbr, text: "Paroxysmal supraventricular tachycardia", status: unverified }
  - { term: "PVC", kind: abbr, text: "Premature ventricular contraction", status: unverified }
  - { term: "RVH", kind: abbr, text: "Right ventricular hypertrophy", status: unverified }
  - { term: "SCD", kind: abbr, text: "Sudden cardiac death", status: unverified }
  - { term: "SVT", kind: abbr, text: "Supraventricular tachycardia", status: unverified }
  - { term: "TAPVR", kind: abbr, text: "Total anomalous pulmonary venous return", status: unverified }
  - { term: "TTN", kind: abbr, text: "Titin gene (familial dilated cardiomyopathy)", status: unverified }
  - { term: "VF", kind: abbr, text: "Ventricular fibrillation", status: unverified }
  - { term: "aVL", kind: abbr, text: "Augmented vector left (ECG limb lead, lateral wall)", status: unverified }
  - { term: "ERP", kind: abbr, text: "Effective refractory period", status: unverified }
  - { term: "HSL", kind: abbr, text: "Hormone-sensitive lipase", status: unverified }
  - { term: "IK", kind: abbr, text: "Delayed rectifier K+ current (repolarization)", status: unverified }
  - { term: "MVO2", kind: abbr, text: "Myocardial O2 consumption", status: unverified }
  - { term: "TnC", kind: abbr, text: "Troponin C (binds Ca2+ to start contraction)", status: unverified }
# Capitals in cvs lessons that are not abbreviations.
plain:
  - "CHALK"
  - "kEEp"
  - "APT"
  - "SAD"
  - "BEAR"
  - "AVenue"
  - "ABCDEF"
  - "COAT"
  - "NES"
  - "PLEASe"
  - "PROVe"
  - "GAS"
  - "SHE"
  - "IVabradine"
