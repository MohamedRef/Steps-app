# Immunology (imm) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "PALS", kind: abbr, text: "Periarteriolar lymphatic sheath (splenic T-cell zone)", status: unverified }
  - { term: "AChR", kind: abbr, text: "Acetylcholine receptor", status: unverified }
  - { term: "LPS", kind: abbr, text: "Lipopolysaccharide (gram-negative endotoxin)", status: unverified }
  - { term: "TAP", kind: abbr, text: "Transporter associated with antigen processing", status: unverified }
  - { term: "RER", kind: abbr, text: "Rough endoplasmic reticulum", status: unverified }
  - { term: "SJS", kind: abbr, text: "Stevens-Johnson syndrome", status: unverified }
  - { term: "TEN", kind: abbr, text: "Toxic epidermal necrolysis", status: unverified }
  - { term: "DQB1", kind: abbr, text: "HLA-DQ beta 1 gene (HLA-DQB1*0602: narcolepsy)", status: unverified }
  - { term: "CD16", kind: abbr, text: "Fc gamma receptor III (NK cells; ADCC)", status: unverified }
  - { term: "CD25", kind: abbr, text: "IL-2 receptor alpha chain (marks regulatory T cells)", status: unverified }
  - { term: "FOXP3", kind: abbr, text: "Forkhead box P3 (regulatory T-cell transcription factor)", status: unverified }
  - { term: "AIRE", kind: abbr, text: "Autoimmune regulator (drives thymic negative selection)", status: unverified }
  - { term: "IPEX", kind: abbr, text: "Immune dysregulation, polyendocrinopathy, enteropathy, X-linked syndrome", status: unverified }
# Capitals in imm lessons that are not abbreviations.
plain:
  - "FADES"
  - "PAIR"
  - "SL3"
  - "CHAR"
