# Immunology (imm) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary (a term
# listed twice anywhere is refused). Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "PALS", kind: abbr, text: "Periarteriolar lymphatic sheath (splenic T-cell zone)", status: unverified }
  - { term: "AChR", kind: abbr, text: "Acetylcholine receptor", status: unverified }
  - { term: "TAP", kind: abbr, text: "Transporter associated with antigen processing", status: unverified }
