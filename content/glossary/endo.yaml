# Endocrine (endo) abbreviations for the hover glossary. One file per
# course, so content threads never edit the same file; `steps-tools
# validate` checks them with content/glossary.yaml as one glossary.
schema: steps.glossary/v1
entries:
  - { term: "DHEA", kind: abbr, text: "Dehydroepiandrosterone (adrenal androgen)", status: unverified }
  # endo.L03 Physiology
  - { term: "RER", kind: abbr, text: "Rough endoplasmic reticulum", status: unverified }
  - { term: "PO4", kind: abbr, text: "Phosphate", status: unverified }
  - { term: "cGMP", kind: abbr, text: "Cyclic guanosine monophosphate", status: unverified }
  - { term: "GHIH", kind: abbr, text: "Growth hormone–inhibiting hormone (somatostatin)", status: unverified }
  - { term: "MIT", kind: abbr, text: "Monoiodotyrosine", status: unverified }
  - { term: "DIT", kind: abbr, text: "Diiodotyrosine", status: unverified }
  - { term: "SV", kind: abbr, text: "Stroke volume", status: unverified }
  - { term: "BMR", kind: abbr, text: "Basal metabolic rate", status: unverified }
  - { term: "TSI", kind: abbr, text: "Thyroid-stimulating immunoglobulin (anti-TSH receptor antibody of Graves disease)", status: unverified }
  - { term: "RANK", kind: abbr, text: "Receptor activator of nuclear factor-κB (on osteoclast precursors; RANKL is its ligand)", status: unverified }
  - { term: "GLUTs", kind: abbr, text: "Glucose transporters", status: unverified }
  - { term: "GLUT1", kind: abbr, text: "Glucose transporter 1 (insulin independent: RBCs, brain, cornea, placenta)", status: unverified }
  - { term: "GLUT2", kind: abbr, text: "Glucose transporter 2 (bidirectional: β cells, liver, kidney, GI tract)", status: unverified }
  - { term: "GLUT3", kind: abbr, text: "Glucose transporter 3 (brain, placenta)", status: unverified }
  - { term: "GLUT5", kind: abbr, text: "Glucose transporter 5 (fructose: spermatocytes, GI tract)", status: unverified }
  - { term: "StAR", kind: abbr, text: "Steroidogenic acute regulatory protein (moves cholesterol into mitochondria)", status: unverified }
  - { term: "EDRF", kind: abbr, text: "Endothelium-derived relaxing factor (nitric oxide)", status: unverified }
  - { term: "IP3", kind: abbr, text: "Inositol trisphosphate", status: unverified }
  - { term: "EGF", kind: abbr, text: "Epidermal growth factor", status: unverified }
