# Gastrointestinal (gi) abbreviations for the hover glossary. One file per
# course (see content/glossary/cvs.yaml); shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "CN", kind: abbr, text: "Cranial nerve (CN V3 = mandibular branch of the trigeminal)", status: unverified }
  - { term: "EA", kind: abbr, text: "Esophageal atresia", status: unverified }
  - { term: "TEF", kind: abbr, text: "Tracheoesophageal fistula", status: unverified }
  - { term: "VACTERL", kind: abbr, text: "Vertebral, Anal, Cardiac, Tracheo-Esophageal, Renal, Limb defects", status: unverified }
  - { term: "VATER", kind: abbr, text: "Vertebral, Anal, Tracheo-Esophageal, Renal/Radial defects", status: unverified }
  - { term: "IMA", kind: abbr, text: "Inferior mesenteric artery", status: unverified }
  - { term: "RER", kind: abbr, text: "Rough endoplasmic reticulum", status: unverified }
  - { term: "GRP", kind: abbr, text: "Gastrin-releasing peptide", status: unverified }
  - { term: "GLUT2", kind: abbr, text: "Glucose transporter 2 (basolateral enterocyte; also liver, beta cells)", status: unverified }
  - { term: "GLUT5", kind: abbr, text: "Glucose transporter 5 (fructose, apical enterocyte)", status: unverified }
  - { term: "ADEK", kind: abbr, text: "Fat-soluble vitamins A, D, E and K", status: unverified }
  - { term: "CHRPE", kind: abbr, text: "Congenital hypertrophy of the retinal pigment epithelium (Gardner syndrome)", status: unverified }
  - { term: "CIMP", kind: abbr, text: "CpG island methylator phenotype (serrated pathway)", status: unverified }
  - { term: "DCC", kind: abbr, text: "Deleted in colorectal cancer (tumor suppressor gene)", status: unverified }
  - { term: "HIDA", kind: abbr, text: "Hepatobiliary iminodiacetic acid scan (cholescintigraphy)", status: unverified }
  - { term: "JVD", kind: abbr, text: "Jugular venous distension", status: unverified }
  - { term: "KIT", kind: abbr, text: "KIT (CD117) tyrosine kinase receptor, mutated in GIST", status: unverified }
  - { term: "RET", kind: abbr, text: "RET proto-oncogene (Hirschsprung disease)", status: unverified }
  - { term: "SBO", kind: abbr, text: "Small bowel obstruction", status: unverified }
  - { term: "UGT", kind: abbr, text: "UDP-glucuronosyltransferase", status: unverified }
  - { term: "HT3", kind: abbr, text: "5-HT3 serotonin receptor (ondansetron blocks it)", status: unverified }
  - { term: "HT4", kind: abbr, text: "5-HT4 serotonin receptor (prucalopride stimulates it)", status: unverified }
  - { term: "NK1", kind: abbr, text: "Neurokinin-1 receptor, the substance P receptor", status: unverified }
  - { term: "cGMP", kind: abbr, text: "Cyclic guanosine monophosphate", status: unverified }
  - { term: "UDP", kind: abbr, text: "Uridine diphosphate (UDP-glucuronosyltransferase conjugates bilirubin)", status: unverified }
  - { term: "NH3", kind: abbr, text: "Ammonia", status: unverified }
  - { term: "NH4", kind: abbr, text: "Ammonium", status: unverified }
  - { term: "CDH", kind: abbr, text: "Congenital diaphragmatic hernia", status: unverified }
  - { term: "MMCs", aliases: [MMC], kind: abbr, text: "Migrating motor complexes (produced by motilin in the fasting state)", status: unverified }
  - { term: "GDA", kind: abbr, text: "Gastroduodenal artery", status: unverified }
  - { term: "α1AT", kind: abbr, text: "α1-antitrypsin", status: unverified }
  - { term: "FOBT", kind: abbr, text: "Fecal occult blood testing", status: unverified }
  - { term: "CCKB", kind: abbr, text: "Cholecystokinin B receptor (the gastrin receptor on parietal cells)", status: unverified }
  - { term: "NTS", kind: abbr, text: "Nucleus tractus solitarius", status: unverified }
  - { term: "IP3", kind: abbr, text: "Inositol trisphosphate (second messenger releasing Ca2+)", status: unverified }
  - { term: "PGE1", kind: abbr, text: "Prostaglandin E1 (misoprostol is an analog)", status: unverified }
  - { term: "AFB", kind: abbr, text: "Acid-fast bacilli", status: unverified }
  - { term: "CCl4", kind: abbr, text: "Carbon tetrachloride (a hepatotoxin)", status: unverified }
  - { term: "CpG", kind: abbr, text: "Cytosine-phosphate-guanine (CpG islands: promoter sites that DNA methylation silences)", status: unverified }
  - { term: "NRTIs", aliases: [NRTI], kind: abbr, text: "Nucleoside reverse transcriptase inhibitors", status: unverified }
  - { term: "EPS", kind: abbr, text: "Extrapyramidal symptoms (D2 blockers such as metoclopramide)", status: unverified }
  - { term: "CAN", kind: abbr, text: "Cardiac symptoms, Arthralgias, Neurologic symptoms: the book's Whipple disease mnemonic (\"Whipped cream in a CAN\")", status: unverified }
  - { term: "ICE", kind: abbr, text: "Internal spermatic fascia, Cremasteric muscle and fascia, External spermatic fascia: the book's spermatic cord mnemonic (\"ICE tie from bottom up\")", status: unverified }
  - { term: "AR", kind: abbr, text: "Autosomal recessive (eg, Wilson disease, hemochromatosis); also aortic regurgitation", status: unverified }
  - { term: "GT", kind: abbr, text: "Glucuronosyltransferase (UDP-GT = UGT, conjugates bilirubin); also gamma-glutamyl transferase", status: unverified }
  - { term: "NHE3", kind: abbr, text: "Sodium-hydrogen exchanger 3 on the intestinal lumen side (tenapanor blocks it); also in the proximal tubule", status: unverified }
  - { term: "HSV-1", kind: abbr, text: "Herpes simplex virus type 1", status: unverified }
  - { term: "H2CO3", kind: abbr, text: "Carbonic acid (CO2 + H2O, made by carbonic anhydrase)", status: unverified }
