# Psychiatry (psych) abbreviations for the hover glossary. One file per
# course; `steps-tools validate` checks it with content/glossary.yaml as one
# glossary (a term listed twice anywhere is refused).
schema: steps.glossary/v1
entries:
  - { term: "OCD", kind: abbr, text: "Obsessive-compulsive disorder", status: unverified }
  - { term: "OCPD", kind: abbr, text: "Obsessive-compulsive personality disorder", status: unverified }
  - { term: "ODD", kind: abbr, text: "Oppositional defiant disorder", status: unverified }
  - { term: "DMDD", kind: abbr, text: "Disruptive mood dysregulation disorder", status: unverified }
  - { term: "IED", kind: abbr, text: "Intermittent explosive disorder", status: unverified }
  - { term: "DID", kind: abbr, text: "Dissociative identity disorder", status: unverified }
  - { term: "MDE", kind: abbr, text: "Major depressive episode", status: unverified }
  - { term: "NMS", kind: abbr, text: "Neuroleptic malignant syndrome", status: unverified }
  - { term: "EEG", kind: abbr, text: "Electroencephalogram", status: unverified }
  - { term: "REM", kind: abbr, text: "Rapid eye movement (sleep)", status: unverified }
  - { term: "MDMA", kind: abbr, text: "3,4-methylenedioxymethamphetamine (ecstasy)", status: unverified }
  - { term: "SERT", kind: abbr, text: "Serotonin transporter", status: unverified }
  - { term: "CB1", kind: abbr, text: "Cannabinoid receptor type 1", status: unverified }
  - { term: "5-HT2A", aliases: [HT2A], kind: abbr, text: "Serotonin receptor subtype 2A", status: unverified }
  - { term: "5-HT2", aliases: [HT2], kind: abbr, text: "Serotonin receptor type 2", status: unverified }
  - { term: "5-HT1A", aliases: [HT1A], kind: abbr, text: "Serotonin receptor subtype 1A", status: unverified }
# Capitals in psych lessons that are not abbreviations (the book's mnemonics).
plain:
  - "SASH"
  - "DIG"
  - "FAST"
  - "SAD"
  - "PERSONS"
  - "CRIMES"
  - "PENIS"
  - "ToAST"
  - "ALcohol"
  - "ADAPT"
  - "NaHCO₃"
  - "traZZZobone"
  - "CyCliC"
