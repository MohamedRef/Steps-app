# Musculoskeletal, skin and connective tissue (msk) abbreviations for the
# hover glossary. One file per course; `steps-tools validate` checks it with
# content/glossary.yaml as one glossary. Shared terms stay in glossary.yaml.
schema: steps.glossary/v1
entries:
  - { term: "ACL", kind: abbr, text: "Anterior cruciate ligament", status: unverified }
  - { term: "ASIS", kind: abbr, text: "Anterior superior iliac spine", status: unverified }
  - { term: "DHPR", kind: abbr, text: "Dihydropyridine receptor (L-type Ca2+ channel of the T-tubule)", status: unverified }
  - { term: "FDP", kind: abbr, text: "Flexor digitorum profundus", status: unverified }
  - { term: "FOOSH", kind: abbr, text: "Fall on an outstretched hand", status: unverified }
  - { term: "LCL", kind: abbr, text: "Lateral collateral ligament", status: unverified }
  - { term: "MCL", kind: abbr, text: "Medial collateral ligament", status: unverified }
  - { term: "MLCK", kind: abbr, text: "Myosin light-chain kinase", status: unverified }
  - { term: "MLCP", kind: abbr, text: "Myosin light-chain phosphatase", status: unverified }
# Capitals in msk lessons that are not abbreviations.
plain:
  - "ARM"
  - "LOAF"
  - "DIBs"
  - "OAF"
  - "DAB"
  - "ABduct"
