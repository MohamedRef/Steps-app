    status: unverified
  - id: heme.L05.028
    kind: cloze
    topic: direct-coagulation-factor-inhibitors
    text: "Mnemonics: the direct thrombin inhibitors can be used in HIT, when heparin is {{c1::BAD}} (Bivalirudin, Argatroban, Dabigatran); apixaban, edoxaban and rivaroxaban directly inhibit ({{c2::ban}}) factor {{c3::Xa}}."
    src: { page: 441, quote: "Can be used in HIT, when heparin is BAD for the patient" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.029
    kind: mcq
    topic: direct-coagulation-factor-inhibitors
    stem: >-
      A 70-year-old man with atrial fibrillation wants an oral anticoagulant that does not need
      regular INR checks. He is started on a drug that directly inhibits factor Xa. Months later he
      arrives with a life-threatening GI bleed. Which of the following agents specifically reverses his
      anticoagulant?
    options:
      - Protamine sulfate
      - Idarucizumab
      - Andexanet alfa
      - Vitamin K
      - Aminocaproic acid
    answer: 2
    why:
      - "Protamine reverses heparin."
      - "Idarucizumab reverses dabigatran, a direct thrombin inhibitor."
      - "Right. Apixaban, edoxaban and rivaroxaban directly inhibit factor Xa, and andexanet alfa (an inactive recombinant factor Xa) reverses them."
      - "Vitamin K reverses warfarin, slowly."
      - "Aminocaproic acid is a nonspecific antifibrinolytic used for thrombolytic bleeding."
    src: { page: 441, quote: "Apixaban, edoxaban, rivaroxaban Directly inhibit (ban) factor Xa" }
    status: unverified
