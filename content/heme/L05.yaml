  - id: heme.L05.102
    kind: mcq
    topic: chemotoxicity-amelioration
    stem: >-
      A 14-year-old boy with osteosarcoma receives high-dose methotrexate. Twenty-four hours later a
      drug is started to protect his normal marrow and mucosa from toxicity. Which of the following is
      the mechanism of this protective drug?
    options:
      - Free radical scavenger
      - Iron chelator
      - Tetrahydrofolate precursor that bypasses dihydrofolate reductase
      - Sulfhydryl compound that binds acrolein
      - Recombinant uricase
    answer: 2
    why:
      - "Amifostine, a free radical scavenger, protects against platinum nephrotoxicity."
      - "Dexrazoxane, an iron chelator, protects against anthracycline cardiotoxicity."
      - "Right. Leucovorin (folinic acid) is a tetrahydrofolate precursor, so it supplies folate past the blocked dihydrofolate reductase: the leucovorin rescue of methotrexate myelosuppression."
      - "Mesna binds acrolein from cyclophosphamide and ifosfamide."
      - "Rasburicase treats tumor lysis syndrome."
    src: { page: 447, quote: "Leucovorin (folinic acid) Tetrahydrofolate precursor Myelosuppression from methotrexate (leucovorin “rescue”)" }
    status: unverified
