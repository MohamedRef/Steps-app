  - id: heme.L05.093
    kind: mcq
    topic: anticancer-monoclonal-antibodies
    stem: >-
      A 63-year-old man with metastatic melanoma is treated with nivolumab. Eight weeks later he has
      fatigue, cold intolerance and weight gain; TSH is high and free T4 is low. He also has new
      watery diarrhea. Which of the following best explains these effects?
    options:
      - Direct cytotoxicity to thyroid follicular cells
      - Release of T cells from inhibition, causing autoimmunity
      - Depletion of CD20 ⊕ B cells
      - VEGF blockade with impaired tissue perfusion
      - EGFR blockade in the gut epithelium
    answer: 1
    why:
      - "Checkpoint inhibitors are not directly cytotoxic."
      - "Right. Nivolumab blocks PD-1, and checkpoint blockade ↑ the risk of autoimmunity (endocrinopathies, enterocolitis, hepatitis, pneumonitis, dermatitis)."
      - "CD20 is the target of rituximab."
      - "VEGF is the target of bevacizumab."
      - "EGFR blockade (cetuximab) causes rash and diarrhea, but not hypothyroidism."
    src: { page: 446, quote: "Pembrolizumab, nivolumab, cemiplimab PD-1" }
    status: unverified
  - id: heme.L05.094
    kind: mcq
    topic: anticancer-monoclonal-antibodies
    stem: >-
      A 70-year-old man with follicular lymphoma receives his first infusion of rituximab. Thirty
      minutes in, he develops fever, rigors, flushing and hypotension. Which of the following best
      explains this reaction?
    options:
      - IgE-mediated anaphylaxis to mouse protein
      - Cytokine release after the drug binds its target on B cells
      - Tumor lysis with hyperkalemia
      - Antibodies against heparin-bound platelet factor 4
      - Complement deficiency
    answer: 1
    why:
      - "The book attributes the reaction to cytokine release, not IgE."
      - "Right. Rituximab targets CD20, and its infusion reaction is due to cytokine release following its interaction with its target on B cells."
      - "Tumor lysis causes electrolyte and kidney problems, typically after days, not rigors in minutes."
      - "That is HIT type 2, with heparin."
      - "Rituximab uses complement; it does not cause complement deficiency reactions."
    src: { page: 446, quote: "Infusion reaction due to cytokine release following interaction of rituximab with its target on B cells" }
    status: unverified
