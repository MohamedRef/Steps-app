  # ---------- p446: Tamoxifen ----------
  - id: heme.L05.084
    kind: card
    topic: tamoxifen
    front: What is the mechanism of tamoxifen?
    back: A selective estrogen receptor modulator (SERM) with a complex mode of action, an antagonist in breast tissue and a partial agonist in endometrium and bone. Blocks estrogen binding to ER in ER ⊕ cells.
    src: { page: 446, quote: "Selective estrogen receptor modulator with complex mode of action: antagonist in breast tissue, partial agonist in endometrium and bone." }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.085
    kind: card
    topic: tamoxifen
    front: What are the clinical uses and adverse effects of tamoxifen?
    back: "Uses: prevention and treatment of breast cancer; preventing gynecomastia in patients on prostate cancer therapy. Adverse: hot flashes, ↑ thromboembolic events (DVT, PE), endometrial cancer, uterine sarcoma."
    src: { page: 446, quote: "Hot flashes, ↑ risk of thromboembolic events (eg, DVT, PE), endometrial cancer, uterine sarcoma." }
    status: unverified
  - id: heme.L05.086
    kind: mcq
    topic: tamoxifen
    stem: >-
      A 56-year-old postmenopausal woman has taken a drug for 3 years after surgery for ER-positive
      breast cancer. She now has painless vaginal bleeding, and endometrial biopsy shows endometrial
      adenocarcinoma. Which of the following best explains the effect of her drug on the endometrium?
    options:
      - It is an estrogen receptor antagonist in all tissues
      - It is a partial estrogen agonist in the endometrium
      - It inhibits aromatase in peripheral fat
      - It blocks HER2 on endometrial cells
      - It is a progestin that causes endometrial atrophy
    answer: 1
    why:
      - "If it were an antagonist everywhere, it would not stimulate the endometrium."
      - "Right. Tamoxifen is a SERM: antagonist in breast, partial agonist in endometrium and bone, which raises the risk of endometrial cancer and uterine sarcoma."
      - "Aromatase inhibitors lower estrogen and do not stimulate the endometrium."
      - "HER2 is the target of trastuzumab."
      - "A progestin would protect the endometrium."
    src: { page: 446, quote: "antagonist in breast tissue, partial agonist in endometrium and bone" }
    status: unverified
