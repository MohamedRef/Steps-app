  - id: heme.L05.050
    kind: mcq
    topic: antibody-drug-conjugates
    stem: >-
      A 48-year-old woman has metastatic breast cancer whose cells strongly overexpress HER2. She is
      given ado-trastuzumab emtansine (T-DM1). Which of the following best explains why this drug is
      less toxic to normal tissue than giving the cytotoxic payload alone?
    options:
      - It is cleared by the kidneys before reaching normal cells
      - The antibody delivers the drug to cells bearing the tumor antigen
      - It works only on cells in M phase
      - It activates NK cells against all dividing cells
      - It requires bioactivation by the liver
    answer: 1
    why:
      - "Monoclonal antibodies are eliminated by macrophages, not by the kidneys."
      - "Right. The antibody targets HER2, the conjugate is taken up by receptor-mediated endocytosis and the drug is released inside the tumor cell, sparing healthy cells (↑ efficacy, ↓ toxicity)."
