  # ---------- p440: Tumor lysis syndrome ----------
  - id: heme.L05.001
    kind: enumerate
    topic: tumor-lysis-syndrome
    prompt: Enumerate the four lab changes of tumor lysis syndrome ("BreaK the CUP") (4).
    points:
      - ↑ K+ (hyperkalemia)
      - ↓ Ca2+ (hypocalcemia)
      - ↑ uric acid (hyperuricemia)
      - ↑ PO4 3− (hyperphosphatemia)
    pass: 4
    hook: "BreaK the CUP: K، Ca، Uric acid، PO4."
    src: { page: 440, quote: "Tumor cell breakdown causes ↑ K+ , ↓ Ca2+ , ↑ Uric acid, and ↑ PO 3– 4 (BreaK the CUP)" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.002
    kind: card
    topic: tumor-lysis-syndrome
    front: What is tumor lysis syndrome, and in which cancers is it most often seen?
    back: An oncologic emergency triggered by massive tumor cell lysis, seen most often with lymphomas and leukemias. Usually caused by starting treatment, but it can occur spontaneously with fast-growing cancers.
    src: { page: 440, quote: "Oncologic emergency triggered by massive tumor cell lysis, seen most often with lymphomas/leukemias. Usually caused by treatment initiation, but can occur spontaneously with fast-growing cancers." }
    status: unverified
  - id: heme.L05.003
    kind: cloze
    topic: tumor-lysis-syndrome
    text: In tumor lysis syndrome, hypocalcemia is due to Ca2+ {{c1::sequestration by PO4 3−}}, and ↑ nucleic acid breakdown → {{c2::hyperuricemia}} → {{c3::acute kidney injury}}.
    src: { page: 440, quote: "hypocalcemia due to Ca2+ sequestration by PO4 3– . ↑ nucleic acid breakdown → hyperuricemia → acute kidney injury" }
    status: unverified
  - id: heme.L05.004
    kind: card
    topic: tumor-lysis-syndrome
    front: What are the clinical consequences of each lab change in tumor lysis syndrome?
    back: "↑ K+ → arrhythmias, ECG changes, muscle weakness; ↓ Ca2+ → seizures, tetany; calcium phosphate and uric acid crystals → acute kidney injury."
    src: { page: 440, quote: "Arrhythmias, ECG changes Seizures, tetany Acute kidney injury Calcium phosphate crystals Uric acid crystals" }
    status: unverified
  - id: heme.L05.005
    kind: cloze
    topic: tumor-lysis-syndrome
    text: Prevention and treatment of tumor lysis syndrome include {{c1::aggressive hydration}}, {{c2::allopurinol}}, and {{c3::rasburicase}}.
    src: { page: 440, quote: "Prevention and treatment include aggressive hydration, allopurinol, rasburicase." }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.006
    kind: mcq
    topic: tumor-lysis-syndrome
    stem: >-
      A 9-year-old boy with a rapidly enlarging abdominal mass is diagnosed with Burkitt lymphoma and
      starts induction chemotherapy. Two days later he has muscle cramps, perioral tingling and
      decreased urine output. Serum potassium is 6.6 mEq/L and creatinine has tripled. Which of the
      following additional laboratory findings is most likely?
    options:
      - Low phosphate, high calcium, low uric acid
      - High phosphate, low calcium, high uric acid
      - High phosphate, high calcium, normal uric acid
      - Low phosphate, low calcium, high uric acid
      - Normal phosphate, normal calcium, low uric acid
    answer: 1
    why:
      - "Lysed cells release phosphate and nucleic acids, so phosphate and uric acid rise, not fall."
      - "Right. Tumor lysis releases K+ and PO4 3−; phosphate sequesters Ca2+ (hypocalcemia, tingling), and nucleic acid breakdown raises uric acid (BreaK the CUP)."
      - "Calcium falls, because the released phosphate binds it."
      - "Phosphate is released from lysed cells, so it rises."
      - "Every value of the CUP changes in tumor lysis; uric acid rises with nucleic acid breakdown."
    src: { page: 440, quote: "Release of K+ → hyperkalemia, release of PO4 3– → hyperphosphatemia, hypocalcemia due to Ca2+ sequestration by PO4 3–" }
    status: unverified
  # ---------- p440: Heparin ----------
  - id: heme.L05.007
    kind: cloze
    topic: heparin
    text: Heparin activates {{c1::antithrombin}}, which ↓ the action primarily of factors {{c2::IIa (thrombin)}} and {{c3::Xa}}. Short half-life.
    src: { page: 440, quote: "Activates antithrombin, which ↓ action primarily of factors IIa (thrombin) and Xa. Short half-life." }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.008
    kind: card
    topic: heparin
    front: What are the clinical uses of heparin, and how is it monitored?
    back: Immediate anticoagulation for PE, acute coronary syndrome, MI and DVT. Used during pregnancy (does not cross the placenta; LMWH such as enoxaparin preferred). Monitor PTT.
    src: { page: 440, quote: "Immediate anticoagulation for pulmonary embolism (PE), acute coronary syndrome, MI, deep venous thrombosis (DVT). Used during pregnancy (does not cross placenta" }
    status: unverified
  - id: heme.L05.009
    kind: enumerate
    topic: heparin
    prompt: Enumerate the adverse effects of heparin (5).
    points:
      - Bleeding (reverse with protamine sulfate)
      - Heparin-induced thrombocytopenia (HIT)
      - Osteoporosis (long-term use)
      - Drug-drug interactions
      - Type 4 renal tubular acidosis
    pass: 4
    hook: "نزيف، HIT، عضم هش، تداخلات، و RTA type 4."
    src: { page: 440, quote: "Bleeding (reverse with protamine sulfate), heparin-induced thrombocytopenia (HIT), osteoporosis (with long-term use), drug-drug interactions, type 4 renal tubular acidosis." }
    status: unverified
  - id: heme.L05.010
    kind: table
    topic: heparin
    title: HIT type 1 vs type 2
    columns: [Feature, HIT type 1, HIT type 2]
    rows:
      - [Mechanism, Nonimmunologic drop in platelet count, IgG antibodies against heparin-bound platelet factor 4 (PF4)]
      - [Timing, Within the first 2 days of heparin, 5-10 days after heparin]
      - [Severity, "Mild (platelets >100,000/mm3), transient, not clinically significant", "Antibody-heparin-PF4 complex activates platelets → splenic removal and thrombosis → ↓↓ platelets"]
      - [Management, None needed, "Stop heparin; start an alternative anticoagulant (eg, argatroban); fondaparinux is safe"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [3, 2]]
    src: { page: 440, quote: "HIT type 2—development of IgG antibodies against heparin-bound platelet factor 4 (PF4) that typically occurs 5-10 days after heparin administration" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.011
    kind: cloze
    topic: heparin
    text: HIT type 2 carries the highest risk with {{c1::unfractionated heparin}}. Fondaparinux is safe because it {{c2::does not interact with PF4}}.
    src: { page: 440, quote: "Highest risk with unfractionated heparin. Treatment: discontinue heparin, start alternative anticoagulant (eg, argatroban). Fondaparinux safe to use (does not interact with PF4)." }
    status: unverified
  - id: heme.L05.012
    kind: card
    topic: heparin
    front: How do low-molecular-weight heparins and fondaparinux differ from unfractionated heparin?
    back: "LMWHs (enoxaparin, dalteparin) act mainly on factor Xa and have a longer half-life; fondaparinux acts only on factor Xa. Both are not easily reversible."
    src: { page: 440, quote: "Low-molecular-weight heparins (eg, enoxaparin, dalteparin) act mainly on factor Xa. Longer half- life. Fondaparinux acts only on factor Xa. Both are not easily reversible." }
    status: unverified
  - id: heme.L05.013
    kind: card
    topic: heparin
    front: Which heparin is used in patients with renal insufficiency, and why?
    back: Unfractionated heparin, because low-molecular-weight heparins undergo renal clearance and should be used with caution.
    src: { page: 440, quote: "Unfractionated heparin used in patients with renal insufficiency (low-molecular-weight heparins should be used with caution because they undergo renal clearance)." }
    status: unverified
  - id: heme.L05.014
    kind: mcq
    topic: heparin
    stem: >-
      A 64-year-old woman is started on unfractionated heparin for a postoperative DVT. On day 7 her
      platelet count has fallen from 260,000/mm3 to 70,000/mm3, and she develops a new cool, painful
      left leg from an arterial thrombus. Which of the following best explains her findings?
    options:
      - Direct nonimmunologic platelet aggregation by heparin
      - IgG antibodies against heparin-bound platelet factor 4 that activate platelets
      - Depletion of protein C before factors II and X
      - Inhibition of platelet COX with ↓ thromboxane A2
      - Consumption of clotting factors by tissue factor release
    answer: 1
    why:
      - "That is HIT type 1: mild, within the first 2 days, platelets stay >100,000/mm3 and there is no thrombosis."
      - "Right. HIT type 2 appears 5-10 days after heparin; the antibody-heparin-PF4 complex activates platelets → thrombosis and splenic removal → ↓↓ platelets. Stop heparin and start argatroban."
      - "Early protein C depletion causes warfarin skin necrosis, not thrombocytopenia on heparin."
      - "That is aspirin's mechanism; it causes bleeding, not thrombosis."
      - "Factor consumption with bleeding and thrombosis is DIC, which has a trigger such as sepsis, not heparin timing."
    src: { page: 440, quote: "Antibody-heparin-PF4 complex binds and activates platelets → removal by splenic macrophages and thrombosis → ↓↓ platelet count." }
    status: unverified
  # ---------- p441: Warfarin ----------
  - id: heme.L05.015
    kind: cloze
    topic: warfarin
    text: Warfarin inhibits {{c1::vitamin K epoxide reductase}} by competing with vitamin K → ↓ γ-carboxylation of factors {{c2::II, VII, IX, and X}} and {{c3::proteins C and S}}.
    src: { page: 441, quote: "Inhibits vitamin K epoxide reductase by competing with vitamin K → inhibition of vitamin K– dependent γ-carboxylation of clotting factors II, VII, IX, and X and proteins C and S." }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.016
    kind: card
    topic: warfarin
    front: Which gene polymorphism affects warfarin metabolism?
    back: Polymorphisms in the gene for the vitamin K epoxide reductase complex (VKORC1).
    src: { page: 441, quote: "Metabolism affected by polymorphisms in the gene for vitamin K epoxide reductase complex (VKORC1)." }
    status: unverified
  - id: heme.L05.017
    kind: card
    topic: warfarin
    front: Which lab test does warfarin prolong, and what is the mnemonic?
    back: "The PT (extrinsic pathway); monitor PT/INR. Long half-life. \"The ex-PresidenT went to war(farin).\""
    src: { page: 441, quote: "In laboratory assay, has effect on extrinsic pathway and ↑ PT. Long half-life. “The ex-PresidenT went to war(farin).”" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.018
    kind: card
    topic: warfarin
    front: What are the clinical uses of warfarin, and why is it avoided in pregnancy?
    back: Chronic anticoagulation (VTE prophylaxis, stroke prevention in atrial fibrillation, systemic embolism prophylaxis with LVADs or mechanical heart valves). Not used in pregnancy because warfarin, unlike heparin, crosses the placenta.
    src: { page: 441, quote: "Not used in pregnant patients (because warfarin, unlike heparin, crosses placenta). Monitor PT/INR." }
    status: unverified
  - id: heme.L05.019
    kind: enumerate
    topic: warfarin
    prompt: Enumerate the adverse effects of warfarin (4).
    points:
      - Bleeding
      - Teratogenic effects
      - Skin/tissue necrosis
      - Drug-drug interactions (metabolized by CYP2C9)
    pass: 4
    hook: "نزيف، تشوهات، necrosis في الجلد، وتداخلات الـ CYP2C9."
    src: { page: 441, quote: "Bleeding, teratogenic effects, skin/tissue necrosis A , drug-drug interactions (metabolized by cytochrome P-450 [CYP2C9])." }
    status: unverified
  - id: heme.L05.020
    kind: card
    topic: warfarin
    front: Why does warfarin cause an initial hypercoagulable state?
    back: Protein C has a shorter half-life than factors II and X, so existing protein C is depleted before existing factors II and X (and before warfarin cuts their production) → hypercoagulation. Skin/tissue necrosis in the first few days of large doses is thought to come from small vessel microthrombosis.
    src: { page: 441, quote: "Initial risk of hypercoagulation: protein C has shorter half-life than factors II and X. Existing protein C depletes before existing factors II and X deplete" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.021
    kind: card
    topic: warfarin
    front: What is heparin "bridging", and why is it done?
    back: Heparin is given when warfarin is started. Heparin's activation of antithrombin anticoagulates during warfarin's initial transient hypercoagulable state, reducing recurrent VTE and skin/tissue necrosis.
    src: { page: 441, quote: "Heparin’s activation of antithrombin enables anticoagulation during initial, transient hypercoagulable state caused by warfarin." }
    status: unverified
  - id: heme.L05.022
    kind: cloze
    topic: warfarin
    text: To reverse warfarin, give {{c1::vitamin K}}. For rapid reversal, give {{c2::FFP or PCC}}.
    src: { page: 441, quote: "For reversal of warfarin, give vitamin K. For rapid reversal, give FFP or PCC." }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.023
    kind: mcq
    topic: warfarin
    stem: >-
      A 45-year-old woman is started on high-dose warfarin alone for a DVT. On day 3 she develops
      painful, dark purple, sharply demarcated skin lesions on her thighs and breasts that progress to
      necrosis. Which of the following best explains this complication?
    options:
      - Antibodies against heparin-bound platelet factor 4
      - Depletion of protein C, which has a shorter half-life than factors II and X
      - Direct inhibition of thrombin by warfarin
      - Warfarin-induced inhibition of CYP2C9
      - Immune complex vasculitis triggered by the drug
    answer: 1
    why:
      - "That is HIT type 2, caused by heparin, not warfarin."
      - "Right. Protein C falls before factors II and X, so warfarin starts with a transient hypercoagulable state; small vessel microthrombosis causes skin necrosis. Heparin bridging prevents it."
      - "Warfarin blocks vitamin K epoxide reductase; direct thrombin inhibitors are argatroban, bivalirudin and dabigatran."
      - "Warfarin is metabolized by CYP2C9; that explains drug interactions, not necrosis."
      - "The book attributes the necrosis to microthrombosis from early protein C loss, not vasculitis."
    src: { page: 441, quote: "Skin/tissue necrosis within first few days of large doses believed to be due to small vessel microthrombosis." }
    status: unverified
  # ---------- p441: Heparin vs warfarin ----------
  - id: heme.L05.024
    kind: table
    topic: heparin-vs-warfarin
    title: Heparin vs warfarin
    columns: [Feature, Heparin, Warfarin]
    rows:
      - [Route, "Parenteral (IV, SC)", Oral]
      - [Site of action, Blood, Liver]
      - [Onset, Rapid (seconds), "Slow, limited by half-lives of normal clotting factors"]
      - [Duration, Hours, Days]
      - [Monitoring, PTT (intrinsic pathway), PT/INR (extrinsic pathway)]
      - [Crosses placenta, No, Yes (teratogenic)]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2], [4, 1], [4, 2], [5, 1], [5, 2]]
    src: { page: 441, quote: "ROUTE OF ADMINISTRATION Parenteral (IV, SC) Oral SITE OF ACTION Blood Liver" }
    status: unverified
    tags: [high-yield]
  - id: heme.L05.025
    kind: mcq
    topic: heparin-vs-warfarin
    stem: >-
      A 30-year-old woman at 10 weeks' gestation has a proximal DVT confirmed on ultrasound. She has a
      normal creatinine. Which of the following is the most appropriate anticoagulant, and why?
    options:
      - Warfarin, because it is oral and has a long duration of action
      - Low-molecular-weight heparin, because it does not cross the placenta
      - Warfarin, because it acts in the liver rather than in the blood
      - Dabigatran, because it needs no lab monitoring
      - Alteplase, because it dissolves the existing clot
    answer: 1
    why:
      - "Warfarin crosses the placenta and is teratogenic, so it is not used in pregnancy."
      - "Right. Heparin does not cross the placenta, and low-molecular-weight heparin (eg, enoxaparin) is preferred in pregnancy."
      - "Its site of action is the liver, but it still crosses the placenta (teratogenic)."
      - "Pregnancy use is not what the book lists for direct factor inhibitors; heparin is the agent named for pregnancy."
      - "Thrombolytics are for early MI, early ischemic stroke and high-risk PE, not routine DVT."
    src: { page: 441, quote: "CROSSES PLACENTA No Yes (teratogenic)" }
    status: unverified
