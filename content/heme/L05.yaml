    topic: cancer-therapy-targets
    stem: >-
      A 52-year-old woman with metastatic breast cancer receives paclitaxel every 3 weeks. After the
      fourth cycle she reports numbness and tingling in both feet in a stocking distribution, and her
      neutrophil count is low. Ankle reflexes are reduced. Which of the following is the mechanism of
      action of the drug she is receiving?
    options:
      - Binding of β-tubulin, which blocks its polymerization into microtubules
      - Hyperstabilization of polymerized microtubules, which prevents breakdown of the mitotic spindle
      - Inhibition of topoisomerase II
      - Cross-linking of DNA
      - Inhibition of thymidylate synthase
    answer: 1
    why:
      - "That is the vinca alkaloids (vincristine, vinblastine), which inhibit microtubule formation: the opposite of taxanes."
      - "Right. Paclitaxel is a taxane: it hyperstabilizes polymerized microtubules so the mitotic spindle cannot break down (Taxes stabilize society). Its adverse effects include myelosuppression, neuropathy and hypersensitivity."
      - "Topoisomerase II is inhibited by etoposide and teniposide (and anthracyclines)."
      - "DNA cross-linking is the mechanism of alkylating agents and platinum compounds."
      - "Thymidylate synthase is inhibited by 5-FU (through 5-FdUMP)."
    src: { page: 445, quote: "Taxanes Docetaxel, paclitaxel Hyperstabilize polymerized microtubules → prevent mitotic spindle breakdown Various tumors (eg, ovarian and breast carcinomas) Myelosuppression, neuropathy, hypersensitivity Taxes stabilize society" }
    status: unverified
  # ---------- p443: Antibody-drug conjugates ----------
  - id: heme.L05.048
    kind: card
    topic: antibody-drug-conjugates
    front: What is an antibody-drug conjugate, and why is it useful?
    back: "A monoclonal antibody joined to a cytotoxic chemotherapy drug. Because the antibody seeks out tumor antigens, the drug is carried into tumor cells and healthy cells are spared, which raises efficacy and lowers toxicity."
    src: { page: 443, quote: "Formed by linking monoclonal antibodies with cytotoxic chemotherapeutic drugs. Antibody selectivity against tumor antigens allows targeted drug delivery to tumor cells while sparing healthy cells" }
    status: unverified
