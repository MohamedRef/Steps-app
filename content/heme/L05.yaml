  - id: heme.L05.031
    kind: card
    topic: anticoagulation-reversal
    front: How does protamine sulfate reverse heparin?
    back: It is a positively charged peptide that binds negatively charged heparin.
    src: { page: 442, quote: "Protamine sulfate ⊕ charged peptide that binds ⊝ charged heparin" }
    status: unverified
  - id: heme.L05.032
    kind: card
    topic: anticoagulation-reversal
    front: "What kind of molecule is idarucizumab, and which anticoagulant does it reverse?"
    back: "Fab fragments of a monoclonal antibody; it reverses dabigatran."
    src: { page: 442, quote: "Dabigatran Idarucizumab Monoclonal antibody Fab fragments" }
