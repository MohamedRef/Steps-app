      - "NK-cell ADCC does not target all dividing cells."
      - "Liver bioactivation applies to cyclophosphamide and nitrosoureas."
    src: { page: 443, quote: "Example: ado-trastuzumab emtansine (T-DM1) for HER2 ⊕ breast cancer." }
