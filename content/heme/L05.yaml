    stem: >-
      A 4-year-old boy with acute lymphoblastic leukemia is in the second week of induction
      chemotherapy with weekly intravenous vincristine, glucocorticoids and asparaginase. He now has
      tingling feet, absent ankle reflexes and severe constipation. His blood counts are only mildly
      reduced. In which phase of the cell cycle does the drug most likely causing these effects kill
      tumor cells?
    options:
      - G0 (it acts regardless of phase)
      - G1
      - S
      - G2
      - M
    answer: 4
    why:
      - "Cell cycle–independent drugs include alkylating agents, platinum compounds and dactinomycin (bleomycin and anthracyclines act on G2/M), not vinca alkaloids."
      - "G1 is where Rb and p53 control the restriction point; vincristine does not act there."
      - "S phase is where antimetabolites (methotrexate, 5-FU, cytarabine, hydroxyurea, thiopurines) act."
      - "Topoisomerase inhibitors cause arrest in S and G2; vincristine is not one."
      - "Right. Vincristine (neuropathy and constipation, 'crisps the nerves') is a vinca alkaloid; it blocks microtubule polymerization and the mitotic spindle, so it acts in M phase."
    src: { page: 443, quote: "Microtubule inhibitors Taxanes Vinca alkaloids" }
    status: unverified
