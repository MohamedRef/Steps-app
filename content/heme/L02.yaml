    topic: hematopoiesis
    title: Hematopoiesis from the multipotent stem cell
    columns: [Stem cell, Precursor, Mature cells]
    rows:
      - [Myeloid stem cell, Erythroblast, Reticulocyte → erythrocyte]
      - [Myeloid stem cell, Megakaryoblast, Megakaryocyte → platelets]
