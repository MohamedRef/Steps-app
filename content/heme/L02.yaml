    src: { page: 412, quote: "5-HETE (leukotriene precursor), kallikrein, platelet-activating factor, N-formylmethionine (bacterial proteins)." }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.007
    kind: card
    topic: neutrophils
    front: Which morphologic changes do inflammatory states (eg, bacterial infection) cause in neutrophils?
    back: Neutrophilia with left shift, toxic granulation (dark blue, coarse granules), Döhle bodies (light blue, peripheral inclusions), and cytoplasmic vacuoles.
    src: { page: 412, quote: "left shift, toxic granulation (dark blue, coarse granules), Döhle bodies (light blue, peripheral inclusions" }
    status: unverified
  - id: heme.L02.008
    kind: cloze
    topic: neutrophils
    text: Hypersegmented neutrophils (nucleus with {{c1::5-6+}} lobes) are seen in {{c2::vitamin B12/folate}} deficiency.
    src: { page: 412, quote: "Hypersegmented neutrophils (nucleus has 5-6+ lobes) are seen in vitamin B12 /folate deficiency." }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.009
    kind: card
    topic: neutrophils
    front: What is a left shift, and what does it reflect?
    back: More immature neutrophil forms (bands, metamyelocytes) circulating in the blood. It means the marrow is turning out myeloid cells faster, as in inflammation or CML.
    src: { page: 412, quote: "Left shift—↑ neutrophil precursors (eg, band cells, metamyelocytes) in peripheral blood. Reflects states of ↑ myeloid proliferation (eg, inflammation, CML)." }
    status: unverified
  - id: heme.L02.010
    kind: card
    topic: neutrophils
    front: What is a leukoerythroblastic reaction, and what does it suggest?
    back: Immature white cells (a left shift) plus immature red cells in the blood. It points to something occupying the marrow, such as myelofibrosis or metastatic cancer.
    src: { page: 412, quote: "Leukoerythroblastic reaction—left shift accompanied by immature RBCs. Suggests bone marrow infiltration (eg, myelofibrosis, metastasis)." }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.011
    kind: mcq
    topic: neutrophils
    stem: >-
      A 67-year-old woman with a history of breast cancer has 2 months of back pain and fatigue.
      Hemoglobin is 8.9 g/dL and the platelet count is 95,000/mm3. A peripheral smear shows myelocytes,
      metamyelocytes and nucleated red blood cells. There is no fever, and inflammatory markers are
      normal. Which of the following best explains the smear?
    options:
      - Acute bacterial infection
      - Vitamin B12 deficiency
      - Bone marrow infiltration by metastatic cancer
      - Glucocorticoid-induced demargination
      - Iron deficiency
    answer: 2
    why:
      - "Infection gives a left shift with toxic granulation and Döhle bodies, but not nucleated RBCs."
      - "B12 deficiency gives hypersegmented neutrophils (5-6+ lobes), not a leukoerythroblastic picture."
      - "Right. A left shift with immature RBCs is a leukoerythroblastic reaction, which suggests marrow infiltration (metastasis, myelofibrosis)."
      - "Demargination raises mature neutrophils, without immature red cells."
      - "Iron deficiency does not release immature white or red cells into the blood."
    src: { page: 412, quote: "Leukoerythroblastic reaction—left shift accompanied by immature RBCs. Suggests bone marrow infiltration (eg, myelofibrosis, metastasis)." }
    status: unverified
  # ---------- p413: erythrocytes ----------
  - id: heme.L02.012
    kind: card
    topic: erythrocytes
    front: What shape are erythrocytes, and why does it help?
    back: Biconcave, anucleate and without organelles. The shape gives a large surface area-to-volume ratio for rapid gas exchange.
    src: { page: 413, quote: "Anucleate and lack organelles; biconcave A , with large surface area-to-volume ratio for rapid gas exchange." }
    status: unverified
  - id: heme.L02.067
    kind: cloze
    topic: erythrocytes
    text: Erythrocytes carry {{c1::O2}} to the tissues and {{c2::CO2}} to the lungs.
    src: { page: 413, quote: "Carry O2 to tissues and CO2 to lungs." }
    status: unverified
  - id: heme.L02.013
    kind: cloze
    topic: erythrocytes
    text: The RBC life span is about {{c1::120}} days in healthy adults and {{c2::60-90}} days in neonates.
    src: { page: 413, quote: "Life span of ~120 days in healthy adults; 60-90 days in neonates." }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.014
    kind: cloze
    topic: erythrocytes
    text: The RBC's source of energy is {{c1::glucose}}; {{c2::90%}} is used in glycolysis and {{c3::10%}} in the HMP shunt.
    src: { page: 413, quote: "Source of energy is glucose (90% used in glycolysis, 10% used in HMP shunt)." }
    status: unverified
  - id: heme.L02.015
    kind: card
    topic: erythrocytes
    front: Which RBC membrane transporter lets red cells carry CO2 from the periphery to the lungs?
    back: The Cl−/HCO3− antiporter, which lets RBCs export HCO3−.
    src: { page: 413, quote: "Membranes contain Cl− /HCO3 − antiporter, which allow RBCs to export HCO3 − and transport CO2 from the periphery to the lungs for elimination." }
    status: unverified
  - id: heme.L02.016
    kind: table
    topic: erythrocytes
    title: RBC terms
    columns: [Term, Meaning]
    rows:
      - [Erythrocytosis (polycythemia), ↑ Hct]
      - [Anisocytosis, Varying sizes]
      - [Poikilocytosis, Varying shapes]
      - [Reticulocyte, Immature RBC; reflects erythroid proliferation]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 413, quote: "Erythrocytosis = polycythemia = ↑ Hct. Anisocytosis = varying sizes. Poikilocytosis = varying shapes." }
    status: unverified
  - id: heme.L02.017
    kind: card
    topic: erythrocytes
    front: Why do reticulocytes look bluish (polychromasia) on Wright-Giemsa stain?
    back: The blue is residual ribosomal RNA.
    src: { page: 413, quote: "Bluish color (polychromasia) on Wright-Giemsa stain of reticulocytes represents residual ribosomal RNA." }
    status: unverified
  - id: heme.L02.018
    kind: mcq
    topic: erythrocytes
    stem: >-
      A 24-year-old man develops dark urine and anemia after starting an antimalarial drug, and a
      defect in an enzyme of the hexose monophosphate (HMP) shunt is found. A student asks why his red
      cells depend entirely on glucose metabolism through glycolysis and the HMP shunt, with no
      oxidative phosphorylation. Which feature of the mature erythrocyte explains this dependence?
    options:
      - It has a Cl−/HCO3− antiporter in its membrane
      - It lacks a nucleus and organelles, including mitochondria
      - It has a biconcave shape
      - It contains residual ribosomal RNA
      - It lives about 120 days
    answer: 1
    why:
      - "The antiporter carries HCO3− for CO2 transport; it does not determine how the cell makes energy."
      - "Right. RBCs are anucleate and lack organelles, so with no mitochondria they rely on glucose: 90% through glycolysis and 10% through the HMP shunt."
      - "The biconcave shape is for a large surface area-to-volume ratio and gas exchange."
      - "Residual ribosomal RNA is in reticulocytes (polychromasia), not mature RBCs."
      - "The life span does not explain the energy source."
    src: { page: 413, quote: "Anucleate and lack organelles" }
    status: unverified
  # ---------- p413: thrombocytes ----------
  - id: heme.L02.019
    kind: card
    topic: thrombocytes
    front: What are platelets derived from, and what is their life span?
    back: Small anucleate cytoplasmic fragments of megakaryocytes. Life span 8-10 days ("pl8lets").
    src: { page: 413, quote: "Anucleate, small cytoplasmic fragments A derived from megakaryocytes. Life span of 8-10 days (pl8lets)." }
