    pass: 6
    hook: "الـ mnemonic بتاع الكتاب: PACMAN Eats، زي اللعبة اللي بتاكل كل حاجة قدامها."
    src: { page: 414, quote: "Causes of eosinophilia (PACMAN Eats): Parasites Asthma Chronic adrenal insufficiency Myeloproliferative disorders Allergic processes Neoplasia (eg, Hodgkin lymphoma) Eosinophilic granulomatosis with polyangiitis" }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.038
    kind: mcq
    topic: eosinophils
    stem: >-
      A 52-year-old man who moved from rural Brazil 2 years ago has 1 month of epigastric pain,
      diarrhea, a dry cough, and an itchy red rash on his buttocks and thighs. The
      leukocyte count is 11,000/mm3 with 22% eosinophils. Stool microscopy shows rhabditiform larvae.
      Which eosinophil product is the main toxin against this parasite?
    options:
      - Histaminase
      - Major basic protein
      - Myeloperoxidase
      - Heparin
      - Tryptase
    answer: 1
    why:
      - "Histaminase breaks down histamine; it is not the helminthotoxin."
      - "Right. This is a tissue-invading helminth (Strongyloides) with eosinophilia; eosinophils defend against helminths with major basic protein (MBP), their helminthotoxin."
      - "Myeloperoxidase is in neutrophil azurophilic granules."
      - "Heparin is in basophil and mast cell granules."
      - "Tryptase is released by mast cells."
    src: { page: 414, quote: "major basic protein (MBP, a helminthotoxin)" }
    status: unverified
  # ---------- p414: basophils ----------
  - id: heme.L02.039
    kind: card
    topic: basophils
    front: What do basophil granules contain, and what do basophils make on demand?
    back: Heparin (anticoagulant) and histamine (vasodilator). Leukotrienes are synthesized and released on demand. Basophils mediate allergic reactions.
