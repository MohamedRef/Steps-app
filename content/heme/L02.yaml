  - id: heme.L02.069
    kind: card
    topic: thrombocytes
    front: What do platelets do when endothelial injury activates them?
    back: They clump with other platelets and bind fibrinogen, which together form the platelet plug.
    src: { page: 413, quote: "When activated by endothelial injury, aggregate with other platelets and interact with fibrinogen to form platelet plug." }
