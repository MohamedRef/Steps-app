  - id: heme.L02.021
    kind: cloze
    topic: thrombocytes
    text: The vWF receptor on platelets is {{c1::GpIb}}; the fibrinogen receptor is {{c2::GpIIb/IIIa}}.
    src: { page: 413, quote: "vWF receptor: GpIb. Fibrinogen receptor: GpIIb/IIIa." }
    status: unverified
    tags: [high-yield]
  - id: heme.L02.022
    kind: card
    topic: thrombocytes
    front: What share of the platelet pool is stored in the spleen?
    back: About 1/3.
    src: { page: 413, quote: "Approximately 1/3 of platelet pool is stored in the spleen." }
    status: unverified
  - id: heme.L02.023
    kind: card
    topic: thrombocytes
    front: What does thrombocytopenia or ↓ platelet function cause on the skin?
    back: Petechiae.
    src: { page: 413, quote: "Thrombocytopenia or ↓ platelet function results in petechiae." }
    status: unverified
  - id: heme.L02.070
    kind: card
    topic: thrombocytes
    front: Which hormone stimulates megakaryocyte proliferation?
    back: Thrombopoietin.
    src: { page: 413, quote: "Thrombopoietin stimulates megakaryocyte proliferation." }
    status: unverified
  - id: heme.L02.024
    kind: mcq
    topic: thrombocytes
    stem: >-
      A 62-year-old man undergoes coronary stenting for an acute myocardial infarction. During the
      procedure he receives an intravenous drug that blocks the final common step of platelet
      aggregation, in which fibrinogen bridges adjacent activated platelets. Which platelet surface
      molecule does this drug target?
    options:
      - GpIb
      - GpIIb/IIIa
      - P2Y12 ADP receptor
      - Platelet factor 4
      - Thrombopoietin receptor
    answer: 1
    why:
      - "GpIb is the vWF receptor, used for adhesion to the injured vessel, not for fibrinogen bridging."
      - "Right. GpIIb/IIIa is the fibrinogen receptor; fibrinogen links activated platelets together into the plug."
      - "ADP from dense granules activates platelets, but the receptor that binds fibrinogen is GpIIb/IIIa."
      - "Platelet factor 4 is an α-granule content, not a surface receptor for fibrinogen."
      - "Thrombopoietin stimulates megakaryocyte proliferation; it does not mediate aggregation."
    src: { page: 413, quote: "Fibrinogen receptor: GpIIb/IIIa." }
    status: unverified
  # ---------- p413: monocytes ----------
  - id: heme.L02.025
    kind: card
    topic: monocytes
    front: What do monocytes look like, and what do they become in tissues?
    back: A large, kidney-shaped nucleus with extensive "frosted glass" cytoplasm. In tissues they differentiate into macrophages or dendritic cells.
    src: { page: 413, quote: "Large, kidney-shaped nucleus A . Extensive “frosted glass” cytoplasm." }
    status: unverified
  - id: heme.L02.026
    kind: mcq
    topic: monocytes
    stem: >-
      A 48-year-old man who emigrated from India has 3 months of cough, night sweats and weight loss.
      A transbronchial lung biopsy shows caseating granulomas containing multinucleated giant cells,
      and acid-fast bacilli are seen. The giant cells formed by fusion of tissue cells that came from
      a circulating blood leukocyte. On a peripheral smear, which appearance does that circulating
      precursor have?
    options:
      - Eccentric nucleus with clock-face chromatin
      - Large kidney-shaped nucleus with abundant frosted-glass cytoplasm
      - Bilobed nucleus packed with uniform pink granules
      - Multilobed nucleus with fine cytoplasmic granules
      - Dense dark purple granules that obscure the nucleus
    answer: 1
    why:
      - "Clock-face chromatin with an eccentric nucleus is a plasma cell, which makes antibody and does not form giant cells."
      - "Right. Granuloma giant cells are fused macrophages, and macrophages differentiate from blood monocytes: large kidney-shaped nucleus, extensive frosted-glass cytoplasm."
      - "A bilobed nucleus with uniform eosinophilic granules is an eosinophil."
      - "A multilobed nucleus is a neutrophil, the acute inflammatory cell."
      - "Dense basophilic granules hiding the nucleus describe a basophil."
    src: { page: 413, quote: "Large, kidney-shaped nucleus A . Extensive “frosted glass” cytoplasm." }
    status: unverified
