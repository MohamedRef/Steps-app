  - id: heme.L02.030
    kind: card
    topic: macrophages
    front: In which lesions are macrophages an important cellular component, and what can they form there?
    back: Granulomas (eg, TB, sarcoidosis), where they may fuse to form giant cells.
    src: { page: 413, quote: "Important cellular component of granulomas (eg, TB, sarcoidosis), where they may fuse to form giant cells." }
