  - id: heme.L02.004
    kind: card
    topic: neutrophils
    front: What is the role of neutrophils, and what does their nucleus look like?
    back: Acute inflammatory response cells; phagocytic. Multilobed nucleus.
    src: { page: 412, quote: "Acute inflammatory response cells. Phagocytic. Multilobed nucleus" }
    status: unverified
