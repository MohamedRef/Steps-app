  - id: heme.L02.031
    kind: mcq
    topic: macrophages
    stem: >-
      A 71-year-old man is admitted with fever, hypotension (BP 78/40 mm Hg) and confusion 2 days after
      a urinary catheter was placed. Blood cultures grow Escherichia coli. The cytokine cascade that
      caused his shock began when a bacterial component bound a receptor on his macrophages. Which
      receptor did it bind?
    options:
      - CD14
      - CD20
      - CD56
      - GpIb
      - MHC class I
    answer: 0
    why:
      - "Right. Lipid A of the LPS of gram-negative bacteria binds CD14 on macrophages and initiates septic shock."
      - "CD20 is a B-cell marker."
      - "CD56 is an NK-cell marker."
      - "GpIb is the platelet vWF receptor."
      - "MHC I presents endogenous antigen to CD8 T cells; it is not the LPS receptor."
    src: { page: 413, quote: "Lipid A from bacterial LPS binds CD14 on macrophages to initiate septic shock." }
    status: unverified
  # ---------- p414: dendritic cells ----------
  - id: heme.L02.032
    kind: card
    topic: dendritic-cells
    front: What is the main role of dendritic cells, and which surface molecules do they express?
    back: Highly phagocytic antigen-presenting cells that link innate and adaptive immunity (eg, via T-cell stimulation). They express MHC class II and Fc receptors.
    src: { page: 414, quote: "Function as link between innate and adaptive immune systems (eg, via T-cell stimulation). Express MHC class II and Fc receptors on surface." }
    status: unverified
  - id: heme.L02.033
    kind: cloze
    topic: dendritic-cells
    text: Dendritic cells can present exogenous antigens on MHC class {{c1::I}}, a process called {{c2::cross-presentation}}.
    src: { page: 414, quote: "Can present exogenous antigens on MHC class I (cross-presentation)." }
    status: unverified
  - id: heme.L02.034
    kind: mcq
    topic: dendritic-cells
    stem: >-
      A 16-year-old boy has had a common wart on his finger for 8 months. Human papillomavirus
      replicates only in keratinocytes. The wart now regresses, and a biopsy shows CD8+ cytotoxic T
      cells specific for a viral protein attacking the lesion. Skin antigen-presenting cells that were
      never infected had engulfed dying infected keratinocytes, migrated to the draining lymph node, and
      activated the naive CD8+ T cells there. Which process explains this activation?
    options:
      - Macrophage presentation of antigen on MHC class II
      - Dendritic cell cross-presentation of exogenous antigen on MHC class I
      - B-cell presentation on MHC class II
      - NK-cell recognition of missing MHC class I
      - Mast cell degranulation after IgE cross-linking
    answer: 1
    why:
      - "MHC II presents to CD4 T cells, not CD8 T cells."
      - "Right. Dendritic cells can present exogenous (engulfed) antigen on MHC class I to CD8 T cells: cross-presentation."
      - "B cells present on MHC II to helper T cells."
      - "NK cells kill cells lacking MHC I; they do not prime CD8 T cells."
      - "Mast cell degranulation is a type I hypersensitivity event."
    src: { page: 414, quote: "Can present exogenous antigens on MHC class I (cross-presentation)." }
    status: unverified
  # ---------- p414: eosinophils ----------
  - id: heme.L02.035
    kind: card
    topic: eosinophils
    front: What do eosinophils defend against, and what do they look like?
    back: Helminthic infections (major basic protein). Bilobate nucleus, packed with large eosinophilic granules of uniform size. They are highly phagocytic for antigen-antibody complexes.
    src: { page: 414, quote: "Defend against helminthic infections (major basic protein). Bilobate nucleus. Packed with large eosinophilic granules of uniform size" }
    status: unverified
  - id: heme.L02.036
    kind: enumerate
    topic: eosinophils
    prompt: Enumerate what eosinophils produce (5).
    points:
