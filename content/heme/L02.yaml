      - [Myeloid stem cell, Monoblast, Monocyte → macrophage]
      - [Lymphoid stem cell, Lymphoblast, "B cell (→ plasma cell), T cell (→ T-helper, T-cytotoxic), NK cell"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [4, 2]]
    src: { page: 412, quote: "Megakaryoblast Lymphoblast Myeloblast Erythroblast Granulocytopoiesis Monocytopoiesis Multipotent stem cell Lymphoid stem cell" }
    status: unverified
  - id: heme.L02.002
    kind: card
    topic: hematopoiesis
    front: Which stem cell gives rise to NK cells, and which to monocytes?
    back: "NK cells: the lymphoid stem cell (via the lymphoblast, with B and T cells). Monocytes: the myeloid stem cell (via the monoblast)."
    src: { page: 412, quote: "Multipotent stem cell Lymphoid stem cell Band NK cell Monoblast Macrophage Monocyte" }
    status: unverified
  - id: heme.L02.003
    kind: mcq
    topic: hematopoiesis
    stem: >-
      A 58-year-old man has a bone marrow biopsy for unexplained pancytopenia. The pathologist identifies
      a large precursor cell that undergoes repeated nuclear division without cell division and sheds
      small cytoplasmic fragments into the marrow sinusoids. Which cell in the peripheral blood comes
      from this precursor?
    options:
      - Reticulocyte
      - Platelet
      - Monocyte
      - Band neutrophil
      - Natural killer cell
    answer: 1
    why:
      - "Reticulocytes come from the erythroblast line."
      - "Right. The megakaryoblast matures into the megakaryocyte, whose cytoplasmic fragments are platelets."
      - "Monocytes come from the monoblast."
      - "Bands come from the myeloblast (granulocytopoiesis)."
      - "NK cells come from the lymphoid stem cell."
    src: { page: 412, quote: "Erythrocyte Platelets Megakaryocyte Megakaryoblast" }
    status: unverified
