  # ---------- p415: lymphocytes ----------
  - id: heme.L02.049
    kind: card
    topic: lymphocytes
    front: Which cells are lymphocytes, and which arm of immunity does each serve?
    back: B cells, T cells and natural killer (NK) cells. B and T cells mediate adaptive immunity; NK cells are part of the innate immune response. Round, densely staining nucleus with little pale cytoplasm.
    src: { page: 415, quote: "Refer to B cells, T cells, and natural killer (NK) cells. B cells and T cells mediate adaptive immunity. NK cells are part of the innate immune response." }
    status: unverified
  - id: heme.L02.050
    kind: mcq
    topic: lymphocytes
    stem: >-
      A 3-month-old boy has recurrent bacterial and viral infections. Flow cytometry shows that his
      circulating cells with a round, densely staining nucleus and scant pale cytoplasm are almost all
      CD56+ cells, with very few CD3+ or CD19+ cells. Which type of immunity remains intact?
    options:
      - Antibody-mediated (humoral) adaptive immunity
      - Cell-mediated adaptive immunity
      - Innate immunity by natural killer cells
      - Memory B-cell responses
      - Helper T-cell help to B cells
    answer: 2
    why:
      - "Humoral immunity needs B cells (CD19+), which are almost absent."
      - "Cell-mediated adaptive immunity needs T cells (CD3+), which are almost absent."
      - "Right. CD56+ cells are NK cells, which belong to innate immunity; B and T cells mediate adaptive immunity."
      - "Memory B cells come from B cells, which are missing."
      - "Helper T cells (CD3+ CD4+) are missing."
    src: { page: 415, quote: "B cells and T cells mediate adaptive immunity. NK cells are part of the innate immune response." }
    status: unverified
