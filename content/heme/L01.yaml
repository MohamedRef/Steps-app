  - id: heme.L01.014
    kind: cloze
    topic: blood-groups
    text: An Rh⊕ person can receive RBCs that are {{c1::Rh⊕ or Rh⊖}}; an Rh⊖ person can receive only {{c2::Rh⊖}} RBCs.
    src: { page: 411, quote: "Compatible RBC types to receive A, O B, O AB, A, B, O O Rh⊕ , Rh⊖" }
    status: unverified
  - id: heme.L01.015
    kind: mcq
    topic: blood-groups
    stem: >-
      A 45-year-old man with blood group B, Rh⊕ is bleeding from a duodenal ulcer and needs packed red
      cells. The blood bank has no group B units left. Which red cell units can he safely receive?
    options:
      - Group A, Rh⊕
      - Group AB, Rh⊖
      - Group O, Rh⊖
      - Group AB, Rh⊕
      - Group A, Rh⊖
    answer: 2
    why:
      - "His plasma has IgM anti-A, which would lyse group A cells."
      - "AB cells carry the A antigen, which his anti-A attacks."
      - "Right. A group B patient can receive B or O cells, and an Rh⊕ patient can receive Rh⊕ or Rh⊖ cells; O Rh⊖ cells carry no A, B or D antigen."
      - "AB cells carry the A antigen; his anti-A would attack them."
      - "Group A cells are attacked by his anti-A, whatever their Rh type."
    src: { page: 411, quote: "Compatible RBC types to receive A, O B, O AB, A, B, O O Rh⊕ , Rh⊖" }
    status: unverified
  # ---------- p411: hemolytic disease of the fetus and newborn ----------
  - id: heme.L01.016
    kind: card
    topic: hemolytic-disease-of-the-fetus-and-newborn
    front: What is hemolytic disease of the fetus and newborn also called, and which antigens does it most commonly involve?
    back: Erythroblastosis fetalis. Most commonly the major blood groups (Rh and ABO), but minor blood group incompatibilities (eg, Kell) can also cause disease, from mild to severe.
    src: { page: 411, quote: "Also called erythroblastosis fetalis. Most commonly involves the antigens of the major blood groups (eg, Rh and ABO), but minor blood group incompatibilities (eg, Kell) can also result in disease" }
    status: unverified
  - id: heme.L01.017
    kind: table
    topic: hemolytic-disease-of-the-fetus-and-newborn
    title: ABO vs Rh hemolytic disease
    columns: [Feature, ABO hemolytic disease, Rh hemolytic disease]
    rows:
      - [Interaction, Type O pregnant patient; type A or B fetus, Rh⊖ pregnant patient; Rh⊕ fetus]
      - [Mechanism, "Preexisting maternal anti-A and/or anti-B IgG cross the placenta → attack fetal and newborn RBCs → hemolysis", "First pregnancy: exposure to fetal blood (often at delivery) → maternal anti-D IgG. Subsequent pregnancies: anti-D IgG crosses the placenta → hemolysis"]
      - [Presentation, "Mild jaundice within 24 hours of birth; can occur in firstborns; usually less severe", "Hydrops fetalis, jaundice shortly after birth, kernicterus"]
      - [Treatment/prevention, Phototherapy or exchange transfusion, Anti-D IgG to Rh⊖ pregnant patients in the third trimester and early postpartum]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2]]
    src: { page: 411, quote: "INTERACTION Type O pregnant patient; type A or B fetus. Rh ⊖ pregnant patient; Rh ⊕ fetus." }
    status: unverified
    tags: [high-yield]
  - id: heme.L01.018
    kind: card
    topic: hemolytic-disease-of-the-fetus-and-newborn
    front: Why can ABO hemolytic disease affect a firstborn baby, while Rh hemolytic disease usually does not?
    back: In ABO disease the type O mother already has anti-A/anti-B IgG, which crosses the placenta. In Rh disease the mother must first be exposed to fetal Rh⊕ blood (often at delivery) to make anti-D IgG, which then attacks the RBCs of later Rh⊕ fetuses.
    src: { page: 411, quote: "Unlike Rh hemolytic disease, can occur in firstborn babies and is usually less severe." }
    status: unverified
    tags: [high-yield]
  - id: heme.L01.019
    kind: enumerate
    topic: hemolytic-disease-of-the-fetus-and-newborn
    prompt: Besides the third trimester and early postpartum, enumerate the situations in which an Rh⊖ pregnant patient gets anti-D IgG (if the fetus is Rh⊕) (4).
    points:
      - Ectopic pregnancy
      - Miscarriage
      - Abdominal trauma
      - Antepartum hemorrhage
    pass: 4
    hook: "أي حاجة ممكن تخلّي دم الجنين يقابل دم الأم: ectopic، miscarriage، trauma، bleeding."
    src: { page: 411, quote: "as well as in cases of ectopic pregnancy, miscarriage, abdominal trauma, and antepartum hemorrhage (if fetus Rh ⊕)" }
    status: unverified
  - id: heme.L01.020
    kind: card
    topic: hemolytic-disease-of-the-fetus-and-newborn
    front: How does giving anti-D IgG to an Rh⊖ pregnant patient prevent Rh hemolytic disease?
    back: It prevents the mother from producing her own anti-D IgG against the fetal Rh⊕ RBCs.
    src: { page: 411, quote: "Prevents maternal anti-D IgG production." }
    status: unverified
  - id: heme.L01.021
    kind: mcq
    topic: hemolytic-disease-of-the-fetus-and-newborn
    stem: >-
      A 30-year-old woman, gravida 2 para 1, is Rh⊖. Her first child, born 3 years ago in another
      country, was Rh⊕; she did not receive any injection during or after that pregnancy. At 28 weeks
      of the current pregnancy, ultrasound shows fetal ascites, pleural effusions and skin edema.
      Which of the following best explains the fetal findings?
    options:
      - Maternal IgM anti-D crossing the placenta
      - Maternal IgG anti-D made after exposure to fetal blood at her first delivery
      - Preexisting maternal IgG anti-A crossing the placenta
      - Fetal antibodies against maternal red cells
      - Maternal IgG anti-B made during the current pregnancy
    answer: 1
    why:
      - "IgM does not cross the placenta; the antibody in Rh disease is anti-D IgG."
      - "Right. Exposure to the first baby's Rh⊕ blood (often at delivery) made her form anti-D IgG; in this pregnancy it crosses the placenta, hemolyzes fetal RBCs and causes hydrops fetalis."
      - "Preexisting anti-A IgG is the ABO mechanism (type O mother), which gives mild neonatal jaundice, not hydrops."
      - "The antibodies are the mother's, attacking the fetal RBCs."
      - "ABO antibodies are preexisting, not made during pregnancy, and ABO disease is usually mild."
    src: { page: 411, quote: "First pregnancy: patient exposed to fetal blood (often during delivery) → formation of maternal anti-D IgG." }
    status: unverified
  - id: heme.L01.022
    kind: mcq
    topic: hemolytic-disease-of-the-fetus-and-newborn
    stem: >-
      A firstborn boy develops mild jaundice 18 hours after an uncomplicated term delivery. His blood
      type is A, Rh⊕. His mother is type O, Rh⊕. Hemoglobin is mildly decreased and the reticulocyte
      count is increased. Which of the following is the most appropriate treatment?
    options:
      - Anti-D immune globulin to the mother
      - Phototherapy
      - Oral iron
      - Splenectomy
      - No treatment until a second pregnancy
    answer: 1
    why:
      - "Anti-D IgG prevents Rh disease in an Rh⊖ mother; this mother is Rh⊕ and the problem is ABO."
      - "Right. ABO hemolytic disease (type O mother, type A fetus) can hit a firstborn with mild jaundice within 24 hours; it is treated with phototherapy, or exchange transfusion if severe."
      - "This is hemolysis from maternal antibodies, not iron deficiency."
      - "Splenectomy has no role in neonatal ABO hemolytic disease."
      - "The jaundiced baby needs treatment now; ABO disease does not wait for a second pregnancy."
    src: { page: 411, quote: "Mild jaundice in the neonate within 24 hours of birth." }
    status: unverified
