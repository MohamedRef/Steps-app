  - id: heme.L01.013
    kind: card
    topic: blood-groups
    front: Does an Rh⊖ person have anti-D antibodies?
    back: No, not unless sensitized. After sensitization (exposure to Rh⊕ RBCs) they make anti-D IgG.
    src: { page: 411, quote: "NONE NONE (UNLESS SENSITIZED) → Anti-D IgG" }
