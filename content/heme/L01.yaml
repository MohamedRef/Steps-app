  - id: heme.L01.004
    kind: mcq
    topic: fetal-erythropoiesis
    stem: >-
      A 5-year-old boy of Greek descent with transfusion-dependent β-thalassemia major is seen in
      clinic. He has frontal bossing and maxillary overgrowth, and the liver is palpable 5 cm below the
      costal margin with an enlarged spleen. His hematologist explains that the liver is enlarged
      because it has gone back to making red cells (extramedullary hematopoiesis), a job it held before
      birth. During which period of development was the liver a site of erythropoiesis?
    options:
      - From 3 to 8 weeks only
      - From 6 weeks until birth
      - From 10 to 28 weeks only
      - From 18 weeks into adult life
      - Only after birth
    answer: 1
    why:
      - "3 to 8 weeks is the yolk sac, the first site."
      - "Right. The liver makes red cells from 6 weeks until birth (Young Liver Synthesizes Blood); in severe chronic anemia it can take up that job again, giving hepatomegaly."
      - "10 to 28 weeks is the spleen's window."
      - "18 weeks into adult life is the bone marrow."
      - "The liver's erythropoietic role ends at birth; after birth the marrow is the normal site."
    src: { page: 410, quote: "Liver (6 weeks-birth)" }
    status: unverified
  # ---------- p410: hemoglobin development ----------
  - id: heme.L01.005
    kind: card
    topic: hemoglobin-development
    front: Which globin chains are the embryonic globins?
    back: ζ (zeta) and ε (epsilon).
    src: { page: 410, quote: "Embryonic globins: ζ and ε." }
    status: unverified
  - id: heme.L01.006
    kind: table
    topic: hemoglobin-development
    title: Hemoglobins and their chains
    columns: [Hemoglobin, Chains, Note]
    rows:
      - [Fetal hemoglobin (HbF), α2γ2, Higher O2 affinity]
      - [Adult hemoglobin (HbA1), α2β2, The main adult form]
      - [HbA2, α2δ2, Adult form present in small amounts]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 410, quote: "Fetal hemoglobin (HbF) = α γ 2 2 . Adult hemoglobin (HbA1 ) = α2 β2" }
    status: unverified
    tags: [high-yield]
  - id: heme.L01.007
    kind: card
    topic: hemoglobin-development
    front: Why does fetal hemoglobin (HbF) have a higher affinity for O2 than adult hemoglobin, and why does it matter?
    back: HbF binds 2,3-BPG with relatively lower affinity, so it holds O2 more tightly. This lets HbF take O2 from maternal hemoglobin (HbA1 and HbA2) across the placenta.
    src: { page: 410, quote: "HbF has higher affinity for O2 because it binds to 2,3-BPG with relatively lower affinity, allowing HbF to capture O2 from maternal hemoglobin" }
    status: unverified
    tags: [high-yield]
  - id: heme.L01.008
    kind: cloze
    topic: hemoglobin-development
    text: "From fetal to adult hemoglobin: {{c1::alpha}} always; {{c2::gamma}} goes, becomes {{c3::beta}}."
    src: { page: 410, quote: "From fetal to adult hemoglobin: Alpha always; gamma goes, becomes beta." }
    status: unverified
  - id: heme.L01.009
    kind: mcq
    topic: hemoglobin-development
    stem: >-
      A 31-year-old woman at 34 weeks' gestation has fetal growth restriction, and cordocentesis is
      done. At the same PO2 of 27 mm Hg, the fetal blood sample is far more saturated with oxygen than a
      sample of her own blood: the fetal oxygen dissociation curve is shifted to the left. This lets
      the fetus take up oxygen from her blood across the placenta. Which property of the fetus's main
      hemoglobin best explains this difference?
    options:
      - It contains two β chains that cooperate more strongly
      - It binds 2,3-bisphosphoglycerate with lower affinity
      - It binds carbon dioxide more avidly
      - Its heme iron is in the ferric (Fe3+) state
      - It is made of four identical γ chains
    answer: 1
    why:
      - "HbF is α2γ2; it has no β chains."
      - "Right. HbF binds 2,3-BPG less well, so less 2,3-BPG pulls O2 off it: higher O2 affinity, left-shifted curve, and O2 moves from maternal to fetal blood across the placenta."
      - "CO2 binding is not the reason the book gives for HbF's higher O2 affinity."
      - "Ferric (Fe3+) iron is methemoglobin, which cannot bind O2 at all."
      - "Four γ chains is not HbF; HbF has two α and two γ chains."
    src: { page: 410, quote: "HbF has higher affinity for O2 because it binds to 2,3-BPG with relatively lower affinity" }
    status: unverified
