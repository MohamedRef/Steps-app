  - id: heme.L01.011
    kind: card
    topic: blood-groups
    front: Which blood group has both IgG and IgM anti-A and anti-B antibodies in plasma?
    back: Group O (no A or B antigen on its RBCs). Because its antibodies include IgG, which crosses the placenta, a type O pregnant patient can cause ABO hemolytic disease.
    src: { page: 411, quote: "IgG, IgM Anti-A Anti-B" }
    status: unverified
    tags: [high-yield]
  - id: heme.L01.012
    kind: cloze
    topic: blood-groups
    text: Type {{c1::AB}} has no ABO antibodies and can receive RBCs of every ABO type; type {{c2::O}} can donate RBCs to every ABO type.
    src: { page: 411, quote: "Compatible RBC types to receive A, O B, O AB, A, B, O O" }
