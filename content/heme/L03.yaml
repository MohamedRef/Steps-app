  - id: heme.L03.039
    kind: mcq
    topic: vitamin-k-dependent-coagulation
    stem: >-
      A 70-year-old man taking warfarin for atrial fibrillation is brought to the emergency department
      after a fall, with a large intracranial hemorrhage on CT. INR is 6.2. Which treatment reverses
      the anticoagulant effect most rapidly?
    options:
      - Oral vitamin K alone
      - Prothrombin complex concentrate with intravenous vitamin K
      - Protamine sulfate
      - Tranexamic acid alone
      - Desmopressin
    answer: 1
    why:
      - "Vitamin K reverses warfarin, but the effect is delayed because the liver must make new factors."
      - "Right. FFP or PCC replaces the missing factors and reverses warfarin immediately; vitamin K is given with it in severe bleeding so the effect lasts."
      - "Protamine reverses heparin, not warfarin."
      - "Tranexamic acid is an antifibrinolytic; it does not replace the vitamin K-dependent factors."
      - "Desmopressin releases vWF and factor VIII, which warfarin does not lower."
    src: { page: 419, quote: "FFP or PCC administration reverses action of warfarin immediately and can be given with vitamin K in cases of severe bleeding." }
    status: unverified
