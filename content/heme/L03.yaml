  # ---------- p416: hemoglobin electrophoresis ----------
  - id: heme.L03.001
    kind: order
    topic: hemoglobin-electrophoresis
    prompt: Put the hemoglobins in order of how far they migrate toward the anode on gel electrophoresis, farthest first.
    steps:
      - HbA
      - HbF
      - HbS
      - HbC
    src: { page: 416, quote: "HbA migrates the farthest, followed by HbF, HbS, and HbC." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.002
    kind: card
    topic: hemoglobin-electrophoresis
    front: Why do HbS and HbC migrate less far toward the anode than HbA?
    back: Their missense mutations replace glutamic acid with valine (neutral) in HbS and with lysine in HbC, making them more positively charged than HbA, so they stay closer to the cathode.
    src: { page: 416, quote: "the missense mutations in HbS and HbC replace glutamic acid with valine (neutral) and lysine , respectively, making HbC and HbS more positively charged than HbA." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.003
    kind: cloze
    topic: hemoglobin-electrophoresis
    text: "\"A Fat Santa Claus can't go far\": HbA migrates farthest toward the anode, then {{c1::HbF}}, then {{c2::HbS}}, then {{c3::HbC}}, which stays closest to the cathode."
    src: { page: 416, quote: "A Fat Santa Claus can’t go far. HbC is closest to the Cathode. HbA is closest to the Anode." }
    status: unverified
  - id: heme.L03.004
    kind: table
    topic: hemoglobin-electrophoresis
    title: Electrophoresis patterns
    columns: [Bands, Meaning]
    rows:
      - [AA, Normal adult]
      - [AF, Normal newborn]
      - [AS, Sickle cell trait]
      - [SS, Sickle cell disease]
      - [AC, Hb C trait]
      - [CC, Hb C disease]
      - [SC, Hb SC disease]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src: { page: 416, quote: "AA Normal adult ↑ AF Normal newborn ↑ AS Sickle cell trait ↑ SS Sickle cell disease ↑ AC Hb C trait ↑ CC Hb C disease ↑ SC C A: normal hemoglobin β chain (HbA, adult) F: normal hemoglobin γ chain (HbF, fetal) S: sickle cell hemoglobin β chain (HbS) C: hemoglobin C β chain (HbC) S F A Hb SC disease" }
    status: unverified
  - id: heme.L03.005
    kind: mcq
    topic: hemoglobin-electrophoresis
    stem: >-
      A 22-year-old African American man has had several episodes of severe bone pain since
      childhood. Hemoglobin electrophoresis shows two bands: one at the position of HbS and one that
      migrates even less toward the anode than HbS, with no band at the HbA position. Which amino acid
      substitution in the β-globin chain produces the slowest band?
    options:
      - Glutamic acid replaced by valine
      - Glutamic acid replaced by lysine
      - Valine replaced by glutamic acid
      - Lysine replaced by glutamic acid
      - Deletion of the γ-globin gene
    answer: 1
    why:
      - "Glutamic acid → valine (neutral) is HbS, the other band."
      - "Right. HbC has glutamic acid replaced by lysine (positive), so it is the most positive and stays closest to the cathode; with HbS this is Hb SC disease."
      - "This is the reverse of the HbS mutation."
      - "This reverses the HbC mutation and would make the chain more negative."
      - "The γ chain belongs to HbF, which would run between HbA and HbS."
    src: { page: 416, quote: "replace glutamic acid with valine (neutral) and lysine , respectively" }
    status: unverified
  # ---------- p416: antiglobulin test ----------
  - id: heme.L03.006
    kind: card
    topic: antiglobulin-test
    front: What does the antiglobulin (Coombs) test detect?
    back: The presence of antibodies against circulating RBCs.
    src: { page: 416, quote: "Also called Coombs test. Detects the presence of antibodies against circulating RBCs." }
    status: unverified
  - id: heme.L03.007
    kind: table
    topic: antiglobulin-test
    title: Direct vs indirect antiglobulin test
    columns: [Test, What is mixed, Positive means, Used for]
    rows:
      - [Direct, Anti-human globulin (Coombs reagent) + the patient's RBCs, The patient's RBCs are coated with anti-RBC Abs, AIHA diagnosis]
      - [Indirect, "Normal (donor) RBCs + the patient's serum, then Coombs reagent", The patient's serum has anti-RBC Abs, Pretransfusion testing]
    blanks: [[0, 1], [0, 3], [1, 1], [1, 3]]
    src: { page: 416, quote: "Direct antiglobulin test—anti-human globulin (Coombs reagent) added to patient’s RBCs. RBCs agglutinate if RBCs are (directly) coated with anti-RBC Abs. Used for AIHA diagnosis." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.008
    kind: mcq
    topic: antiglobulin-test
    stem: >-
      A 34-year-old woman with systemic lupus erythematosus has 1 week of fatigue and dark urine.
      Hemoglobin is 7.8 g/dL, reticulocytes are increased, LDH is high and haptoglobin is low. The
      smear shows spherocytes. Which test best confirms that her red cells are coated with antibody?
    options:
      - Indirect antiglobulin test with donor RBCs
      - Direct antiglobulin test
      - Hemoglobin electrophoresis
      - Osmotic fragility test
      - Ristocetin assay
    answer: 1
    why:
      - "The indirect test looks for free anti-RBC antibodies in serum, for pretransfusion testing."
      - "Right. The direct test adds Coombs reagent to the patient's own RBCs; agglutination means the cells are coated with anti-RBC Abs, which diagnoses AIHA."
      - "Electrophoresis separates hemoglobin variants, not antibodies."
      - "Osmotic fragility is raised by spherocytes of any cause; it does not show antibody."
      - "The ristocetin assay tests vWF-GpIb binding of platelets."
    src: { page: 416, quote: "RBCs agglutinate if RBCs are (directly) coated with anti-RBC Abs. Used for AIHA diagnosis." }
    status: unverified
  - id: heme.L03.009
    kind: mcq
    topic: antiglobulin-test
    stem: >-
      A 45-year-old woman with three prior pregnancies is scheduled for elective surgery. Before
      crossmatching, the blood bank mixes reagent red cells with her serum and then adds anti-human
      globulin; the cells agglutinate. What does this result show?
    options:
      - Her own red cells are coated with IgG
      - Her serum contains antibodies against red cell antigens
      - She has hereditary spherocytosis
      - She has a platelet adhesion defect
      - She lacks complement C1-inhibitor
    answer: 1
    why:
      - "That is what a positive direct test shows; here her serum, not her cells, was tested."
      - "Right. This is the indirect antiglobulin test: normal RBCs added to the patient's serum agglutinate with Coombs reagent if the serum has anti-RBC Abs (eg, from sensitization in pregnancy). It is used for pretransfusion testing."
      - "Spherocytosis is not detected by antibody testing."
      - "Platelet adhesion is tested with ristocetin."
      - "C1-inhibitor deficiency causes hereditary angioedema and is unrelated."
    src: { page: 416, quote: "Indirect (not direct) antiglobulin test—normal RBCs added to patient’s serum. If serum has anti- RBC Abs, RBCs agglutinate when Coombs reagent is added. Used for pretransfusion testing." }
    status: unverified
  # ---------- p417: platelet plug formation ----------
  - id: heme.L03.010
    kind: order
    topic: platelet-plug-formation
    prompt: Put the steps of platelet plug formation in order.
    steps:
      - "Injury: endothelial damage → transient vasoconstriction (neural reflex and endothelin)"
      - "Exposure: vWF binds to exposed collagen"
      - "Adhesion: platelets bind vWF via GpIb at the site of injury and release ADP, Ca2+ and TXA2"
      - "Activation: ADP binding to P2Y12 induces GpIIb/IIIa expression"
      - "Aggregation: fibrinogen binds GpIIb/IIIa and links platelets"
    src: { page: 417, quote: "AGGREGATION Fibrinogen binds GpIIb/IIIa receptors and links platelets Balance between ACTIVATION ADHESION EXPOSURE INJURY Anti-aggregation factors: PGI2 and NO (released by endothelial cells) ↑ blood flow ↓ platelet aggregation Pro-aggregation factors: TXA2 (released by platelets) ↓ blood flow ↑ platelet aggregation Endothelial damage → transient vasoconstriction via neural stimulation reflex and endothelin (released from damaged cell) vWF binds to exposed collagen (vWF is from Weibel-Palade bodies of endothelial cells and α-granules of platelets) Platelets bind vWF via GpIb receptor at the site of injury only (specific) → platelets undergo conformational change ADP binding to P2Y12 receptor induces GpIIb/IIIa expression at platelet surface → rapid irreversible platelet aggregation Platelets release ADP and Ca2+ (necessary for coagulation cascade), TXA2 ADP helps platelets adhere to endothelium" }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.042
    kind: cloze
    topic: platelet-plug-formation
    text: During adhesion, platelets release ADP and {{c1::Ca2+}}; the latter is necessary for the {{c2::coagulation cascade}}.
    src: { page: 417, quote: "Platelets release ADP and Ca2+ (necessary for coagulation cascade), TXA2" }
    status: unverified
  - id: heme.L03.043
    kind: cloze
    topic: platelet-plug-formation
    text: In the adhesion step, released {{c1::ADP}} helps platelets adhere to the endothelium.
    src: { page: 417, quote: "ADP helps platelets adhere to endothelium" }
    status: unverified
  - id: heme.L03.011
    kind: card
    topic: platelet-plug-formation
    front: Where does the vWF that binds exposed collagen come from?
    back: Weibel-Palade bodies of endothelial cells and α-granules of platelets.
    src: { page: 417, quote: "vWF is from Weibel-Palade bodies of endothelial cells and α-granules of platelets" }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.012
    kind: table
    topic: platelet-plug-formation
    title: The balance that controls aggregation
    columns: [Factor, Source, Effect]
    rows:
      - ["Anti-aggregation: PGI2 and NO", Endothelial cells, "↑ blood flow, ↓ platelet aggregation"]
      - ["Pro-aggregation: TXA2", Platelets, "↓ blood flow, ↑ platelet aggregation"]
    blanks: [[0, 1], [1, 1], [0, 2], [1, 2]]
    src: { page: 417, quote: "Anti-aggregation factors: PGI2 and NO (released by endothelial cells) ↑ blood flow ↓ platelet aggregation Pro-aggregation factors: TXA2 (released by platelets)" }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.013
    kind: card
    topic: platelet-plug-formation
    front: What is the platelet plug of primary hemostasis like?
    back: A temporary plug that stops bleeding but is unstable and easily dislodged.
    src: { page: 417, quote: "Temporary plug stops bleeding; unstable, easily dislodged" }
    status: unverified
  - id: heme.L03.049
    kind: card
    topic: platelet-plug-formation
    front: What does the coagulation cascade (secondary hemostasis) add to the platelet plug?
    back: An insoluble fibrin mesh that makes the plug stable.
    src: { page: 417, quote: "Formation of insoluble fibrin mesh." }
    status: unverified
  - id: heme.L03.014
    kind: mcq
    topic: platelet-plug-formation
    stem: >-
      A 19-year-old man has had easy bruising and prolonged bleeding after dental extractions since
      childhood. His platelet count is normal, but his platelets are unusually large on the smear.
      Platelet aggregation fails with ristocetin. Von Willebrand factor levels and activity are normal.
      Which step of platelet plug formation is defective?
    options:
      - Binding of vWF to exposed collagen
      - Binding of platelets to vWF via GpIb
      - ADP binding to the P2Y12 receptor
      - Fibrinogen binding to GpIIb/IIIa
      - Thromboxane A2 synthesis by cyclooxygenase
    answer: 1
    why:
      - "vWF levels and activity are normal, so this is not von Willebrand disease."
      - "Right. A GpIb deficiency (Bernard-Soulier syndrome) blocks adhesion of platelets to vWF; the ristocetin assay fails in Bernard-Soulier syndrome and von Willebrand disease."
      - "P2Y12 is the target of clopidogrel; the ristocetin assay tests vWF-GpIb binding."
      - "A GpIIb/IIIa deficiency is Glanzmann thrombasthenia, in which ristocetin agglutination is normal."
      - "Cyclooxygenase is inhibited by aspirin; it doesn't explain a failed ristocetin assay."
    src: { page: 417, quote: "Failure of aggregation with ristocetin assay occurs in von Willebrand disease and Bernard-Soulier syndrome." }
    status: unverified
  - id: heme.L03.050
    kind: cloze
    topic: platelet-plug-formation
    text: Failure of aggregation with the ristocetin assay occurs in {{c1::von Willebrand disease}} and {{c2::Bernard-Soulier syndrome}}.
    src: { page: 417, quote: "Failure of aggregation with ristocetin assay occurs in von Willebrand disease and Bernard-Soulier syndrome." }
    status: unverified
    tags: [high-yield]
  # ---------- p417: thrombogenesis ----------
  - id: heme.L03.015
    kind: table
    topic: thrombogenesis
    title: Thrombogenesis targets
    columns: [Target, Drugs that act on it, Deficiency]
    rows:
      - [Cyclooxygenase (TXA2 synthesis), Aspirin (irreversible), "—"]
      - [ADP (P2Y12) receptor, "Clopidogrel, prasugrel, ticagrelor", "—"]
      - [GpIIb/IIIa, "Eptifibatide, tirofiban", Glanzmann thrombasthenia]
      - [GpIb, Ristocetin activates vWF to bind GpIb (test), Bernard-Soulier syndrome]
      - [vWF, Desmopressin releases vWF, von Willebrand disease]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2], [3, 2], [4, 2]]
    src: { page: 417, quote: "Clopidogrel, prasugrel, ticagrelor Eptifibatide, tirofiban Ristocetin Aspirin Desmopressin Deficiency: von Willebrand disease Deficiency: Bernard-Soulier syndrome Deficiency: Glanzmann thrombasthenia" }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.016
    kind: card
    topic: thrombogenesis
    front: How does aspirin inhibit platelets?
    back: It blocks cyclooxygenase permanently, so platelets can no longer make TXA2.
    src: { page: 417, quote: "Aspirin irreversibly inhibits cyclooxygenase, thereby inhibiting TXA2 synthesis." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.017
    kind: card
    topic: thrombogenesis
    front: How do clopidogrel, prasugrel and ticagrelor inhibit platelets?
    back: They block the platelet ADP receptor P2Y12, so ADP can no longer make platelets put GpIIb/IIIa on their surface.
    src: { page: 417, quote: "Clopidogrel, prasugrel, and ticagrelor inhibit ADP-induced expression of GpIIb/IIIa by blocking P2Y12 receptor." }
    status: unverified
  - id: heme.L03.018
    kind: card
    topic: thrombogenesis
    front: What does desmopressin do in hemostasis?
    back: It promotes the release of vWF and factor VIII from endothelial cells.
    src: { page: 417, quote: "Desmopressin promotes the release of vWF and factor VIII from endothelial cells." }
    status: unverified
  - id: heme.L03.019
    kind: cloze
    topic: thrombogenesis
    text: "vWF carries and protects factor {{c1::VIII}}: \"volksWagen Factories make gr8 cars.\""
    src: { page: 417, quote: "vWF carries/protects factor VIII; volksWagen Factories make gr8 cars." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.020
    kind: mcq
    topic: thrombogenesis
    stem: >-
      A 6-year-old girl has had nosebleeds and gum bleeding since infancy. Her platelet count and
      platelet size are normal. Platelet aggregation studies show no aggregation with ADP, collagen or
      thrombin, but normal agglutination with ristocetin. Deficiency of which platelet molecule is most
      likely?
    options:
      - GpIb
      - von Willebrand factor
      - GpIIb/IIIa
      - Cyclooxygenase
      - Factor VIII
    answer: 2
    why:
      - "GpIb deficiency (Bernard-Soulier) gives failed ristocetin agglutination and large platelets."
      - "vWF deficiency (von Willebrand disease) also fails the ristocetin assay."
      - "Right. Without GpIIb/IIIa (Glanzmann thrombasthenia) fibrinogen cannot link platelets, so no agonist causes aggregation, while vWF-GpIb binding with ristocetin is intact."
      - "Cyclooxygenase loss (as with aspirin) would not block aggregation to every agonist."
      - "Factor VIII deficiency is hemophilia A, a coagulation (secondary hemostasis) defect with joint bleeds."
    src: { page: 417, quote: "Deficiency: Glanzmann thrombasthenia" }
    status: unverified
