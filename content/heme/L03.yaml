  - id: heme.L03.029
    kind: mcq
    topic: coagulation-and-kinin-pathways
    stem: >-
      A 4-year-old boy has a painful swollen knee after a minor fall, and his maternal uncle had
      similar joint bleeds. Platelet count and bleeding time are normal. PT is normal and PTT is
      prolonged; the PTT corrects with normal plasma. Factor IX activity is normal. Deficiency of which
      factor is most likely?
    options:
      - Factor VII
      - Factor VIII
      - Factor XI
      - Factor XIII
      - von Willebrand factor
    answer: 1
    why:
      - "Factor VII is only in the extrinsic pathway; its deficiency prolongs the PT, not the PTT."
      - "Right. Hemophilia A is factor VIII deficiency (X-linked recessive, hence the maternal uncle): an intrinsic pathway defect with a prolonged PTT and normal PT."
      - "Hemophilia C (factor XI) is autosomal recessive and would not follow a maternal-uncle pattern."
      - "Factor XIII deficiency does not prolong the PT or PTT (the PTT reflects all factors except VII and XIII)."
      - "von Willebrand disease causes mucosal bleeding and an abnormal platelet function test, not mainly joint bleeds."
    src: { page: 418, quote: "Hemophilia A: deficiency of factor VIII (XR)" }
    status: unverified
  - id: heme.L03.030
    kind: mcq
    topic: coagulation-and-kinin-pathways
    stem: >-
      A 52-year-old woman develops swelling of the lips and tongue 3 weeks after starting lisinopril for
      hypertension. There is no urticaria or itching. Accumulation of which mediator best explains her
      swelling?
    options:
      - Histamine
      - Bradykinin
      - Thromboxane A2
      - Leukotriene B4
      - Plasmin
    answer: 1
    why:
      - "Histamine angioedema comes with urticaria and itching and is not caused by ACE inhibitors."
      - "Right. ACE inactivates bradykinin; blocking ACE lets bradykinin build up, causing vasodilation and ↑ permeability (angioedema)."
      - "TXA2 is a platelet pro-aggregation factor."
      - "LTB4 is a neutrophil chemotactic agent."
      - "Plasmin breaks down fibrin; it is not the mediator of ACE inhibitor angioedema."
    src: { page: 418, quote: "Note: Kallikrein activates bradykinin ACE inactivates bradykinin" }
    status: unverified
  # ---------- p419: vitamin K-dependent coagulation ----------
  - id: heme.L03.031
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: Which clotting factors and anticoagulant proteins are vitamin K–dependent?
    back: Factors II, VII, IX and X, plus protein C and protein S.
    src: { page: 419, quote: "↓ carboxylation and maturation of factors II, VII, IX, X, protein C, protein S." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.045
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: What does vitamin K deficiency do to the vitamin K–dependent factors?
    back: They are not carboxylated, so they do not mature (↓ carboxylation and maturation).
    src: { page: 419, quote: "Vitamin K deficiency—↓ carboxylation and maturation" }
    status: unverified
  - id: heme.L03.032
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: Which enzyme does warfarin inhibit?
    back: Vitamin K epoxide reductase, so oxidized (inactive) vitamin K is not recycled to its reduced (active) form for γ-glutamyl carboxylase.
    src: { page: 419, quote: "Warfarin inhibits vitamin K epoxide reductase." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.033
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: Does vitamin K reverse warfarin quickly?
    back: No. It can undo warfarin's block on clotting factor synthesis, but only after a delay.
    src: { page: 419, quote: "Vitamin K administration can potentially reverse inhibitory effect of warfarin on clotting factor synthesis (delayed)." }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.046
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: What reverses warfarin at once in severe bleeding?
    back: FFP or PCC, which act immediately; they can be given together with vitamin K.
    src: { page: 419, quote: "FFP or PCC administration reverses action of warfarin immediately" }
    status: unverified
    tags: [high-yield]
  - id: heme.L03.034
    kind: card
    topic: vitamin-k-dependent-coagulation
    front: Why are neonates vitamin K deficient, and how is it prevented?
    back: Their gut has no bacteria yet, and gut bacteria are what make vitamin K. Giving vitamin K soon after birth prevents the deficiency and its bleeding.
    src: { page: 419, quote: "Neonates lack enteric baKteria, which produce vitamin K. Early administration of vitamin K overcomes neonatal deficiency/coagulopathy." }
    status: unverified
