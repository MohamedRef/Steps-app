    front: "How do the projections of acanthocytes (spur cells) differ from those of echinocytes (burr cells)?"
    back: "Acanthocyte spikes vary in size and sit at irregular intervals (asymmetric); echinocyte spikes are smaller and more uniform (even)."
    src: { page: 420, quote: "Projections of varying size at irregular intervals (acanthocytes are asymmetric) Echinocytes B (“burr cells”) Liver disease, ESRD, pyruvate kinase deficiency Smaller and more uniform projections than acanthocytes (echinocytes are even)" }
