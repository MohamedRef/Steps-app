    src: { page: 428, quote: "Labs: CD55/59 ⊖ RBCs on flow cytometry. Treatment: eculizumab (targets terminal complement protein C5)." }
    status: unverified
  - id: heme.L04.069
    kind: card
    topic: intrinsic-hemolytic-anemias
    front: What is the mechanism of hemolysis in G6PD deficiency, and what triggers it?
    back: X-linked recessive. G6PD defect → ↓ NADPH → ↓ reduced glutathione → ↑ RBC susceptibility to oxidative stress (eg, sulfa drugs, antimalarials, fava beans) → hemolysis (extravascular and intravascular).
    src: { page: 428, quote: "G6PD defect → ↓ NADPH → ↓ reduced glutathione → ↑ RBC susceptibility to oxidative stress (eg, sulfa drugs, antimalarials, fava beans) → hemolysis." }
