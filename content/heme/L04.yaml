    topic: hereditary-thrombophilias
    stem: >-
      A 33-year-old man with a new deep vein thrombosis is started on unfractionated heparin by
      continuous infusion. Despite escalating doses over 2 days, his PTT barely rises. He has heavy
      proteinuria from nephrotic syndrome. Which deficiency best explains the poor response?
    options:
      - Protein C
      - Antithrombin
      - Factor V Leiden
      - Protein S
      - Plasminogen
    answer: 1
    why:
      - "Protein C deficiency raises the risk of warfarin skin necrosis but does not blunt heparin's PTT effect."
      - "Right. Heparin works by enhancing antithrombin; with antithrombin lost in the urine (nephrotic syndrome), the PTT rise after heparin is diminished."
