    front: What is the mechanism and presentation of pyruvate kinase deficiency?
    back: Autosomal recessive. ↓ ATP → rigid RBCs → extravascular hemolysis. ↑ 2,3-BPG → ↓ hemoglobin affinity for O2. Hemolytic anemia in a newborn; smear shows burr cells.
    src: { page: 428, quote: "Pyruvate kinase defect → ↓ ATP → rigid RBCs → extravascular hemolysis. Increases levels of 2,3-BPG → ↓ hemoglobin affinity for O2" }
    status: unverified
  - id: heme.L04.072
    kind: card
    topic: intrinsic-hemolytic-anemias
    front: What is the molecular defect of sickle cell anemia, and what precipitates sickling?
    back: A point mutation in the β-globin gene (glutamic acid → valine) alters a hydrophobic region → hemoglobin aggregation. ↓ O2, ↑ altitude or acidosis makes deoxygenated HbS polymerize → vaso-occlusive disease. Newborns are initially asymptomatic because of ↑ HbF and ↓ HbS.
    src: { page: 428, quote: "Point mutation in β-globin gene → single amino acid substitution (glutamic acid → valine) alters hydrophobic region on β-globin chain → aggregation of hemoglobin." }
    status: unverified
    tags: [high-yield]
