  # ---------- p420: RBC morphology ----------
  - id: heme.L04.001
    kind: table
    topic: rbc-morphology
    title: RBC morphology
    columns: [Cell, Associated pathology, Note]
    rows:
      - [Acanthocytes (spur cells), "Liver disease, abetalipoproteinemia, vitamin E deficiency", Projections of varying size at irregular intervals (asymmetric)]
      - [Echinocytes (burr cells), "Liver disease, ESRD, pyruvate kinase deficiency", "Smaller, more uniform projections (even)"]
      - [Dacrocytes (teardrop cells), "Bone marrow infiltration (eg, myelofibrosis)", The RBC is squeezed out of the marrow and "sheds a tear"]
      - [Schistocytes (helmet cells), "Microangiopathic hemolytic anemia (DIC, TTP/HUS, HELLP), mechanical hemolysis (heart valve prosthesis)", Fragmented RBCs]
      - [Degmacytes (bite cells), G6PD deficiency, Splenic macrophages remove Heinz bodies]
      - [Elliptocytes, Hereditary elliptocytosis, "Mutations in RBC membrane protein genes (eg, spectrin)"]
      - [Spherocytes, "Hereditary spherocytosis, autoimmune hemolytic anemia", "No central pallor; ↓ surface area-to-volume ratio"]
      - [Macro-ovalocytes, Megaloblastic anemia, Also hypersegmented PMNs]
      - [Target cells, "HbC disease, Asplenia, Liver disease, Thalassemia (HALT)", ↑ surface area-to-volume ratio]
      - [Sickle cells, Sickle cell anemia, "Sickling with low O2 (high altitude, acidosis) or high HbS concentration (dehydration)"]
