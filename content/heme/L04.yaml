  - id: heme.L04.014
    kind: mcq
    topic: anemias
    stem: >-
      A 58-year-old man with a 30-year history of heavy drinking has fatigue. He has spider angiomata and
      mild jaundice. Hemoglobin is 10.8 g/dL and MCV is 108 fL. The smear shows round macrocytes. Serum
      B12 and folate are normal. Which of the following best describes the mechanism and expected smear
      finding of this anemia?
    options:
      - "Delayed nuclear maturation from impaired DNA synthesis, with hypersegmented neutrophils"
      - "Macrocytosis with normal DNA synthesis, without hypersegmented neutrophils"
      - "Defective DNA repair causing bone marrow failure and pancytopenia"
      - "Hepcidin-mediated block of iron release from macrophages"
      - "Intrinsic defect of erythroid progenitor cells causing pure red cell aplasia"
    answer: 1
    why:
      - "Impaired DNA synthesis with hypersegmented neutrophils is megaloblastic anemia (B12, folate, drugs); his B12 and folate are normal."
      - "Right. Chronic alcohol overuse and liver disease cause nonmegaloblastic macrocytic anemia: DNA synthesis is normal, so the RBCs are large without hypersegmented neutrophils."
      - "Defective DNA repair is Fanconi anemia, a congenital cause of marrow failure."
      - "Hepcidin blocking ferroportin is anemia of chronic disease, which is normocytic or microcytic."
      - "An intrinsic erythroid progenitor defect is Diamond-Blackfan anemia, a congenital pure red cell aplasia presenting in the 1st year of life."
    src: { page: 426, quote: "Macrocytic anemia in which DNA synthesis is normal. Causes: chronic alcohol overuse, liver disease." }
    status: unverified
  # ---------- p423: reticulocyte production index, Mentzer, iron studies ----------
  - id: heme.L04.015
    kind: card
    topic: reticulocyte-production-index
    front: What does the reticulocyte production index (RPI) correct for, and how is it interpreted?
    back: It corrects a falsely elevated reticulocyte count in anemia and measures the marrow's response (effective erythropoiesis). RPI > 3 = compensatory RBC production; RPI < 2 = inadequate response.
    src: { page: 423, quote: "High RPI (>3) indicates compensatory RBC production; low RPI (<2) indicates inadequate response to correct anemia." }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.016
    kind: cloze
    topic: reticulocyte-production-index
    text: "RPI = % reticulocytes × ({{c1::actual Hct}} / {{c2::normal Hct}}) / {{c3::maturation time}}."
    src: { page: 423, quote: "RPI = % reticulocytes × actual Hct / maturation time normal Hct" }
    status: unverified
  - id: heme.L04.017
    kind: mcq
    topic: reticulocyte-production-index
    stem: >-
      A 27-year-old woman has fatigue for 3 months. Hematocrit is 22% (normal 45%), and the reticulocyte
      count is 6%. Using a maturation time of 2 days for this hematocrit, her reticulocyte production
      index is about 1.5. What does this value indicate?
    options:
      - The marrow is compensating appropriately for hemolysis
      - The marrow response is inadequate for the degree of anemia
      - The reticulocyte count is falsely low
      - The anemia must be caused by acute blood loss
      - The anemia is macrocytic
    answer: 1
    why:
      - "Compensatory RBC production gives an RPI above 3."
      - "Right. An RPI below 2 indicates an inadequate marrow response; the raw 6% overstated it because the hematocrit was low."
      - "The raw count is falsely high in anemia; the RPI corrects it downward."
      - "The RPI says how well the marrow responds, not that the cause is blood loss."
      - "The RPI does not measure cell size."
    src: { page: 423, quote: "low RPI (<2) indicates inadequate response to correct anemia." }
    status: unverified
  - id: heme.L04.018
    kind: card
    topic: mentzer-index
    front: What is the Mentzer index used for, and how is it interpreted?
    back: "MCV / RBC count, to tell thalassemia trait from iron deficiency anemia: < 13 suggests thalassemia trait; > 13 suggests iron deficiency anemia."
    src: { page: 423, quote: "An index of less than 13 suggests thalessemia trait. An increased index (>13) suggests iron deficiency anemia." }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.019
    kind: mcq
    topic: mentzer-index
    stem: >-
      A 24-year-old man of Greek descent has a mild microcytic anemia on a pre-employment blood test. MCV
      is 64 fL and the RBC count is 6.2 million/mm3 (Mentzer index about 10). Ferritin is normal. He feels
      well and has no bleeding. Hemoglobin electrophoresis is most likely to show which of the following?
    options:
      - "Increased HbA2"
      - "Absent HbA with markedly increased HbS"
      - "Hemoglobin made of γ4 tetramers (Hb Barts)"
      - "Normal hemoglobin fractions"
      - "Hemoglobin crystals from a glutamic acid-to-lysine substitution"
    answer: 0
    why:
      - "Right. A Mentzer index below 13 suggests thalassemia trait; in a Mediterranean man this is β-thalassemia minor (one β-globin gene mutated on chromosome 11), which gives a mild microcytic anemia with ↑ HbA2."
      - "Absent HbA with ↑↑ HbS is sickle cell anemia, a hemolytic normocytic anemia."
      - "Hb Barts (γ4) is α-thalassemia with all 4 α genes deleted, which causes hydrops fetalis."
      - "Normal fractions with a Mentzer index above 13 would fit iron deficiency; his index is about 10 and ferritin is normal."
      - "The glutamic acid-to-lysine mutation is HbC disease, with crystals and target cells on the smear."
    src: { page: 425, quote: "β-thalassemia minor Mild microcytic anemia. ↑ HbA2" }
    status: unverified
  - id: heme.L04.020
    kind: table
    topic: interpretation-of-iron-studies
    title: Interpretation of iron studies
    columns: [Test, Iron deficiency, Chronic disease, Hemochromatosis, Pregnancy/OCP use]
    rows:
      - [Serum iron, ↓, ↓, ↑, —]
      - [Transferrin or TIBC, ↑, ↓, ↓, ↑]
      - [Ferritin, ↓, ↑, ↑, —]
      - ["% transferrin saturation", ↓↓, —/↓, ↑↑, ↓]
    blanks: [[0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2], [2, 3], [1, 4]]
    src: { page: 423, quote: "Serum iron ↓ ↓ ↑ — Transferrin or TIBC ↑ ↓a ↓ ↑ Ferritin ↓ ↑ ↑ —" }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.021
    kind: card
    topic: interpretation-of-iron-studies
    front: What do transferrin, TIBC and ferritin each represent?
    back: "Transferrin: transports iron in blood. TIBC: indirectly measures transferrin. Ferritin: the body's 1° iron storage protein."
    src: { page: 423, quote: "Transferrin—transports iron in blood. TIBC—indirectly measures transferrin. Ferritin—1° iron storage protein of body." }
    status: unverified
  - id: heme.L04.022
    kind: card
    topic: interpretation-of-iron-studies
    front: Why is TIBC low in anemia of chronic disease (the book's evolutionary reasoning)?
    back: Pathogens use circulating iron to thrive, so the body stores iron within its cells and keeps it out of circulation, denying it to pathogens.
    src: { page: 423, quote: "Evolutionary reasoning—pathogens use circulating iron to thrive." }
    status: unverified
  - id: heme.L04.023
    kind: mcq
    topic: interpretation-of-iron-studies
    stem: >-
      A 61-year-old woman with long-standing rheumatoid arthritis has fatigue. Hemoglobin is 10.1 g/dL
      and MCV is 82 fL. Which pattern of iron studies is most likely?
    options:
      - "↓ serum iron, ↑ TIBC, ↓ ferritin"
      - "↓ serum iron, ↓ TIBC, ↑ ferritin"
      - "↑ serum iron, ↓ TIBC, ↑ ferritin, ↑↑ saturation"
      - "Normal serum iron, ↑ TIBC, normal ferritin, ↓ saturation"
      - "↑ serum iron, ↑ TIBC, ↓ ferritin"
    answer: 1
    why:
      - "This is iron deficiency."
      - "Right. Anemia of chronic disease: iron is locked in cells, so serum iron and TIBC are low and ferritin (storage) is high."
      - "This is hemochromatosis."
      - "This is pregnancy or OCP use, which raises transferrin."
      - "This combination fits none of the book's patterns."
    src: { page: 423, quote: "Serum iron ↓ ↓ ↑ — Transferrin or TIBC ↑ ↓a ↓ ↑ Ferritin ↓ ↑ ↑ —" }
    status: unverified
  # ---------- p424: iron deficiency, α-thalassemia ----------
  - id: heme.L04.024
    kind: card
    topic: microcytic-hypochromic-anemias
    front: What are the causes of iron deficiency, and which step of heme synthesis does it reduce?
    back: Chronic bleeding (GI loss, heavy menstrual bleeding), malnutrition, absorption disorders, GI surgery (eg, gastrectomy), or ↑ demand (eg, pregnancy). It reduces the final step of heme synthesis.
    src: { page: 424, quote: "↓ iron due to chronic bleeding (eg, GI loss, heavy menstrual bleeding), malnutrition, absorption disorders, GI surgery (eg, gastrectomy), or ↑ demand (eg, pregnancy) → ↓ final step in heme synthesis." }
    status: unverified
  - id: heme.L04.025
    kind: card
    topic: microcytic-hypochromic-anemias
    front: What are the lab findings of iron deficiency anemia?
    back: ↓ iron, ↑ TIBC, ↓ ferritin, ↑ free erythrocyte protoporphyrin, ↑ RDW, ↓ RI. Microcytosis and hypochromasia (↑ central pallor).
    src: { page: 424, quote: "Labs: ↓ iron, ↑ TIBC, ↓ ferritin, ↑ free erythrocyte protoporphyrin, ↑ RDW, ↓ RI." }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.026
    kind: enumerate
    topic: microcytic-hypochromic-anemias
    prompt: Enumerate the symptoms of iron deficiency anemia listed in First Aid (5).
    points:
      - Fatigue
      - Conjunctival pallor
      - Restless leg syndrome
      - Pica (craving and eating nonfood substances)
      - Spoon nails (koilonychia)
    pass: 4
    src: { page: 424, quote: "Symptoms: fatigue, conjunctival pallor B , restless leg syndrome, pica (persistent craving and compulsive eating of nonfood substances), spoon nails (koilonychia)." }
    status: unverified
  - id: heme.L04.027
    kind: card
    topic: microcytic-hypochromic-anemias
    front: What is Plummer-Vinson syndrome?
    back: The triad of iron deficiency anemia, esophageal webs, and dysphagia.
    src: { page: 424, quote: "Plummer-Vinson syndrome (triad of iron deficiency anemia, esophageal webs, and dysphagia)." }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.028
    kind: card
    topic: microcytic-hypochromic-anemias
    front: What is the genetic basis of α-thalassemia, and how does it differ from iron deficiency on the CBC?
    back: α-globin gene deletions on chromosome 16 (cis = same chromosome, trans = separate chromosomes; normal is αα/αα) → ↓ α-globin synthesis. It often has an ↑ RBC count, unlike iron deficiency. Target cells on the smear; ↑ prevalence in people of Asian and African descent.
    src: { page: 424, quote: "α-globin gene deletions on chromosome 16 → ↓ α-globin synthesis." }
    status: unverified
  - id: heme.L04.029
    kind: table
    topic: microcytic-hypochromic-anemias
    title: α-thalassemia by number of genes deleted
    columns: [Genes deleted, Disease, Outcome]
    rows:
      - ["1", α-thalassemia minima, No anemia (silent carrier)]
      - ["2 (cis or trans)", α-thalassemia minor, "Mild microcytic, hypochromic anemia"]
      - ["3", Hemoglobin H disease (β4), Moderate to severe microcytic hypochromic anemia]
      - ["4", Hemoglobin Barts disease (γ4), Hydrops fetalis; incompatible with life]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [3, 2]]
    src: { page: 424, quote: "Hemoglobin Barts disease; no α-globin, excess γ-globin forms γ4 Hydrops fetalis; incompatible with life" }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.030
    kind: mcq
    topic: microcytic-hypochromic-anemias
    stem: >-
      A 46-year-old woman has fatigue and difficulty swallowing solid food. Examination shows pale
      conjunctivae, a smooth red tongue, cracks at the corners of the mouth, and spoon-shaped nails.
      Barium swallow shows a thin web in the upper esophagus. Which laboratory pattern is expected?
    options:
      - "↓ ferritin, ↑ TIBC, ↑ RDW"
      - "↑ ferritin, ↓ TIBC, normal RDW"
      - "↑ iron, ↑ ferritin, ↑↑ transferrin saturation"
      - "↑ homocysteine, ↑ methylmalonic acid"
      - "↑ HbA2 with a normal RBC count"
    answer: 0
    why:
      - "Right. This is Plummer-Vinson syndrome (iron deficiency anemia, esophageal web, dysphagia) with glossitis, cheilosis and koilonychia; iron deficiency gives ↓ ferritin, ↑ TIBC and ↑ RDW."
      - "This is anemia of chronic disease."
      - "This is hemochromatosis."
      - "This is vitamin B12 deficiency."
      - "↑ HbA2 is β-thalassemia minor, which usually has an ↑ RBC count."
    src: { page: 424, quote: "May manifest as glossitis, cheilosis, Plummer-Vinson syndrome (triad of iron deficiency anemia, esophageal webs, and dysphagia)." }
    status: unverified
  - id: heme.L04.031
