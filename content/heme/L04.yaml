    front: How does Langerhans cell histiocytosis present in a child?
    back: Lytic bone lesions and a skin rash, or recurrent otitis media with a mass involving the mastoid bone. It is a group of proliferative disorders of Langerhans cells (skin antigen-presenting cells) that are functionally immature and do not effectively stimulate primary T cells.
