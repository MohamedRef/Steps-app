  - id: heme.L04.078
    kind: mcq
    topic: intrinsic-hemolytic-anemias
    stem: >-
      A 22-year-old Nigerian man is treated for malaria prophylaxis before travel. Three days after
      starting primaquine he has back pain, dark urine and scleral icterus. Hemoglobin falls from
      14.5 to 9.8 g/dL. A supravital stain shows inclusions in many red cells, and the Wright stain
      shows cells that look as if a bite was taken out of them. Which molecule is deficient in his red
      cells, leaving them unable to handle oxidant stress?
    options:
      - ATP
      - Reduced NADPH
      - 2,3-bisphosphoglycerate
      - CD55 and CD59
      - Spectrin
    answer: 1
    why:
      - "↓ ATP is pyruvate kinase deficiency, with rigid RBCs and burr cells."
      - "Right. In G6PD deficiency (X-linked recessive) ↓ NADPH → ↓ reduced glutathione, so oxidants (antimalarials, sulfa drugs, fava beans) denature hemoglobin into Heinz bodies, which the spleen bites out (bite cells)."
      - "2,3-BPG is increased, not decreased, in pyruvate kinase deficiency."
      - "Loss of CD55/CD59 is PNH."
      - "Spectrin defects cause hereditary spherocytosis or elliptocytosis."
    src: { page: 428, quote: "G6PD defect → ↓ NADPH → ↓ reduced glutathione" }
    status: unverified
  - id: heme.L04.079
    kind: mcq
    topic: intrinsic-hemolytic-anemias
    stem: >-
      A 34-year-old woman has episodes of red urine on waking, fatigue, and now right upper quadrant pain
      with ascites; Doppler ultrasound shows hepatic vein thrombosis. Hemoglobin is 8.6 g/dL, leukocytes
      2,900/mm3, platelets 88,000/mm3, LDH is high and haptoglobin is undetectable. The direct
      antiglobulin test is negative. Which drug targets the mechanism of her hemolysis?
    options:
      - Rituximab
      - Eculizumab
      - Hydroxyurea
      - Imatinib
      - Prednisone
    answer: 1
    why:
      - "Rituximab (anti-CD20) is used in AIHA and ITP, which are antibody-mediated."
      - "Right. PNH (Coombs ⊖ intravascular hemolysis, pancytopenia, venous thrombosis such as Budd-Chiari) is complement-mediated because GPI-anchored CD55/CD59 are missing; eculizumab blocks the terminal complement protein C5."
      - "Hydroxyurea raises HbF in sickle cell anemia."
      - "Imatinib inhibits BCR-ABL in CML."
      - "Steroids treat warm AIHA, which is Coombs ⊕."
    src: { page: 428, quote: "Treatment: eculizumab (targets terminal complement protein C5)." }
    status: unverified
  - id: heme.L04.080
    kind: mcq
    topic: intrinsic-hemolytic-anemias
    stem: >-
      An 8-year-old girl has had intermittent jaundice and now fatigue after a viral illness with fever
      and a rash on her cheeks. Her father had his spleen removed as a teenager. Hemoglobin is 6.0 g/dL
      and reticulocytes are near zero. Before this illness, her smear showed small round red cells
      without central pallor, and her MCHC was increased. Which test was most likely abnormal before this
      episode?
    options:
      - Direct antiglobulin test
      - Eosin-5-maleimide (EMA) binding test
      - Flow cytometry for CD55/CD59
      - Hemoglobin electrophoresis
      - G6PD activity
    answer: 1
    why:
      - "A positive Coombs test points to autoimmune hemolysis, but the family history and pattern point to a membrane defect."
      - "Right. Hereditary spherocytosis (mostly autosomal dominant) shows ↓ fluorescence in the EMA binding test and ↑ osmotic fragility; parvovirus B19 has now caused an aplastic crisis (reticulocytes near zero)."
      - "CD55/CD59 loss is PNH."
      - "Electrophoresis diagnoses hemoglobinopathies such as HbS or HbC."
      - "G6PD deficiency gives episodic oxidant hemolysis with bite cells, not spherocytes and ↑ MCHC."
    src: { page: 428, quote: "Labs: ↓ mean fluorescence of RBCs in eosin 5-maleimide (EMA) binding test, ↑ fragility in osmotic fragility test" }
    status: unverified
  - id: heme.L04.081
    kind: mcq
    topic: intrinsic-hemolytic-anemias
    stem: >-
      A 26-year-old man with sickle cell anemia has 2 days of painless gross hematuria. He is otherwise at
      his baseline. Urinalysis shows red cells and a small piece of tissue in the urine. Which feature of
      the renal medulla best explains this complication?
    options:
      - High blood flow
      - Low PO2 that promotes sickling
      - High pH that promotes sickling
      - Absence of hemoglobin F in renal cells
      - Immune complex deposition in medullary vessels
    answer: 1
    why:
      - "The medulla has low, not high, blood flow."
      - "Right. Sickling in the renal medulla, where PO2 is low, causes renal papillary necrosis → hematuria."
      - "Acidosis, not high pH, promotes sickling."
      - "HbF is a red cell protein; it does not explain medullary sickling."
      - "Sickle cell papillary necrosis is vaso-occlusive, not immune complex-mediated."
    src: { page: 428, quote: "Sickling in renal medulla (↓ Po2 ) → renal papillary necrosis → hematuria." }
    status: unverified
