    topic: normocytic-normochromic-anemias
    front: "In the intravascular hemolysis figure, what happens to the hemoglobin released into the blood vessel, and when does hemoglobinuria appear?"
    back: "Hemoglobin splits into dimers that bind haptoglobin (so haptoglobin falls). Only when haptoglobin capacity is exceeded are free dimers circulated to the kidneys → hemoglobinuria."
    src: { page: 427, quote: "Hemoglobin Dimers Circulated to kidneys (if haptoglobin capacity exceeded) Hemoglobinuria Dimers bind haptoglobin" }
