  # ---------- p420: RBC morphology ----------
  - id: heme.L04.001
    kind: table
    topic: rbc-morphology
    title: RBC morphology
    columns: [Cell, Associated pathology, Note]
    rows:
      - [Acanthocytes (spur cells), "Liver disease, abetalipoproteinemia, vitamin E deficiency", Projections of varying size at irregular intervals (asymmetric)]
      - [Echinocytes (burr cells), "Liver disease, ESRD, pyruvate kinase deficiency", "Smaller, more uniform projections (even)"]
      - [Dacrocytes (teardrop cells), "Bone marrow infiltration (eg, myelofibrosis)", The RBC is squeezed out of the marrow and "sheds a tear"]
      - [Schistocytes (helmet cells), "Microangiopathic hemolytic anemia (DIC, TTP/HUS, HELLP), mechanical hemolysis (heart valve prosthesis)", Fragmented RBCs]
      - [Degmacytes (bite cells), G6PD deficiency, Splenic macrophages remove Heinz bodies]
      - [Elliptocytes, Hereditary elliptocytosis, "Mutations in RBC membrane protein genes (eg, spectrin)"]
      - [Spherocytes, "Hereditary spherocytosis, autoimmune hemolytic anemia", "No central pallor; ↓ surface area-to-volume ratio"]
      - [Macro-ovalocytes, Megaloblastic anemia, Also hypersegmented PMNs]
      - [Target cells, "HbC disease, Asplenia, Liver disease, Thalassemia (HALT)", ↑ surface area-to-volume ratio]
      - [Sickle cells, Sickle cell anemia, "Sickling with low O2 (high altitude, acidosis) or high HbS concentration (dehydration)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1]]
    src: { page: 420, quote: "Dacrocytes C (“teardrop cells”) Bone marrow infiltration (eg, myelofibrosis)" }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.002
    kind: card
    topic: rbc-morphology
    front: How do acanthocytes (spur cells) differ from echinocytes (burr cells)?
    back: "Acanthocytes: projections of varying size at irregular intervals (asymmetric); liver disease, abetalipoproteinemia, vitamin E deficiency. Echinocytes: smaller, more uniform projections (even); liver disease, ESRD, pyruvate kinase deficiency."
    src: { page: 420, quote: "Smaller and more uniform projections than acanthocytes (echinocytes are even)" }
    status: unverified
  - id: heme.L04.003
    kind: enumerate
    topic: rbc-morphology
    prompt: Enumerate the causes of target cells ("HALT") (4).
    points:
      - HbC disease
      - Asplenia
      - Liver disease
      - Thalassemia
    pass: 4
    hook: "«HALT» said the hunter to his target: HbC، Asplenia، Liver، Thalassemia."
    src: { page: 420, quote: "HbC disease, Asplenia, Liver disease, Thalassemia “HALT,” said the hunter to his target" }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.004
    kind: cloze
    topic: rbc-morphology
    text: Spherocytes have a {{c1::↓}} surface area-to-volume ratio; target cells have an {{c2::↑}} surface area-to-volume ratio.
    src: { page: 420, quote: "Small, spherical cells without central pallor ↓ surface area-to-volume ratio" }
    status: unverified
  - id: heme.L04.005
    kind: mcq
    topic: rbc-morphology
    stem: >-
      A 66-year-old man has 6 months of fatigue, early satiety and weight loss. The spleen is palpable
      12 cm below the costal margin. Hemoglobin is 9.2 g/dL. The peripheral smear shows many red cells
      shaped like teardrops, with nucleated red cells and immature myeloid cells. A bone marrow
      aspirate yields no cells (dry tap). Which of the following best explains the shape of the red
      cells?
    options:
      - Removal of Heinz bodies by splenic macrophages
      - Mechanical squeezing of red cells out of a fibrotic marrow
      - Loss of membrane from a spectrin defect
      - Fragmentation on fibrin strands in small vessels
      - Polymerization of deoxygenated hemoglobin
    answer: 1
    why:
      - "Heinz body removal makes bite cells (degmacytes) in G6PD deficiency."
      - "Right. Dacrocytes (teardrop cells) mark bone marrow infiltration such as myelofibrosis: the RBC 'sheds a tear' because it is squeezed out of its home in the marrow."
      - "Membrane protein defects give spherocytes or elliptocytes."
      - "Fragmentation in narrowed vessels makes schistocytes (microangiopathic hemolysis)."
      - "HbS polymerization makes sickle cells."
    src: { page: 420, quote: "RBC “sheds a tear” because it’s mechanically squeezed out of its home in the bone marrow" }
    status: unverified
  # ---------- p421: RBC inclusions ----------
  - id: heme.L04.006
    kind: table
    topic: rbc-inclusions
    title: RBC inclusions
    columns: [Inclusion, Associated pathology, Note]
    rows:
      - [Iron granules (ringed sideroblasts; bone marrow), "Sideroblastic anemias (lead poisoning, myelodysplastic syndromes, chronic alcohol overuse)", Perinuclear mitochondria with excess iron; need Prussian blue stain]
      - [Howell-Jolly bodies, "Functional hyposplenia (eg, sickle cell disease), asplenia", Basophilic nuclear remnants (no iron); usually removed by splenic macrophages]
      - [Basophilic stippling, "Sideroblastic anemias, thalassemias", Basophilic ribosomal precipitates (no iron)]
      - [Pappenheimer bodies, Sideroblastic anemias, Basophilic granules (contain iron)]
      - [Heinz bodies, G6PD deficiency, "Denatured precipitated hemoglobin (contain iron); need supravital stain (eg, crystal violet)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 421, quote: "Howell-Jolly bodies B Functional hyposplenia (eg, sickle cell disease), asplenia" }
    status: unverified
    tags: [high-yield]
  - id: heme.L04.007
    kind: card
    topic: rbc-inclusions
    front: Which RBC inclusions contain iron, and which do not?
    back: "Contain iron: Pappenheimer bodies and Heinz bodies (and the iron granules of ringed sideroblasts). No iron: Howell-Jolly bodies (nuclear remnants) and basophilic stippling (ribosomal precipitates)."
    src: { page: 421, quote: "Pappenheimer bodies Sideroblastic anemias Basophilic granules (contain iron)" }
    status: unverified
  - id: heme.L04.008
    kind: card
    topic: rbc-inclusions
    front: How do Heinz bodies lead to bite cells?
    back: Phagocytic removal of Heinz bodies (denatured hemoglobin) by splenic macrophages leaves bite cells ("take a bite of Heinz ketchup").
    src: { page: 421, quote: "Phagocytic removal of Heinz bodies → bite cells (take a bite of Heinz [ketchup])" }
    status: unverified
  - id: heme.L04.009
    kind: mcq
    topic: rbc-inclusions
    stem: >-
      A 17-year-old girl with sickle cell disease has a routine blood smear. Many red cells contain a
      single small, round, dark purple inclusion near the edge of the cell. The inclusion does not stain
      with Prussian blue. Which of the following does this finding indicate?
    options:
      - Iron overload of red cell mitochondria
      - Loss of splenic function
      - Oxidative denaturation of hemoglobin
      - Inhibition of ribosomal RNA degradation by lead
      - Ineffective erythropoiesis from folate deficiency
    answer: 1
    why:
      - "Iron-laden mitochondria are ringed sideroblasts in the marrow; they stain with Prussian blue."
      - "Right. Howell-Jolly bodies are nuclear remnants without iron that splenic macrophages usually remove; they appear with functional hyposplenia (autosplenectomy in sickle cell disease) or asplenia."
      - "Denatured hemoglobin forms Heinz bodies, which need a supravital stain and come with G6PD deficiency."
      - "Retained rRNA aggregates are basophilic stippling: many fine dots, not one round body."
      - "Folate deficiency gives macro-ovalocytes and hypersegmented neutrophils."
    src: { page: 421, quote: "Basophilic nuclear remnants (do not contain iron) Usually removed by splenic macrophages" }
    status: unverified
