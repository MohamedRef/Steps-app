    kind: card
    topic: intrinsic-hemolytic-anemias
    front: What is the mechanism of paroxysmal nocturnal hemoglobinuria (PNH)?
    back: An acquired PIGA mutation in a hematopoietic stem cell → impaired GPI anchor synthesis for decay-accelerating factor (DAF/CD55) and membrane inhibitor of reactive lysis (MIRL/CD59), which protect the RBC membrane from complement → ↑ complement-mediated intravascular hemolysis, especially at night.
    src: { page: 428, quote: "Acquired PIGA mutation → impaired GPI anchor synthesis for decay-accelerating factor (DAF/CD55) and membrane inhibitor of reactive lysis (MIRL/ CD59), which protect RBC membrane from complement." }
