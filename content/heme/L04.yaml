  # ---------- p428: intrinsic hemolytic anemias ----------
  - id: heme.L04.064
    kind: card
    topic: intrinsic-hemolytic-anemias
    front: What is the defect in hereditary spherocytosis, and why are the cells removed?
    back: Primarily autosomal dominant defects in proteins linking the RBC membrane skeleton and plasma membrane (eg, ankyrin, band 3, protein 4.2, spectrin). Small round RBCs with no central pallor; ↓ surface area/dehydration → ↑ MCHC → premature removal by the spleen (extravascular hemolysis).
    src: { page: 428, quote: "Due to defect in proteins interacting with RBC membrane skeleton and plasma membrane (eg, ankyrin, band 3, protein 4.2, spectrin)." }
    status: unverified
    tags: [high-yield]
