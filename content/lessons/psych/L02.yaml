  - id: psych.L02.lesson4
    title: "بعد الولادة، والـ ECT، والانتحار، والقلق، والـ trauma"
    hook: "الـ blues بيخلص في أسبوعين؛ لو كمّل أو فيه psychosis يبقى حاجة تانية"
    minutes: 10
    pages: [579, 581]
    topics: [peripartum-mood-disturbances, electroconvulsive-therapy, suicide-risk, anxiety-disorders, panic-disorder, phobias, generalized-anxiety-disorder, obsessive-compulsive-disorders, trauma-stress-disorders]
    goals:
      - "تفرّق بين اضطرابات المزاج بعد الولادة وتعالجها"
      - "تعرف دواعي الـ ECT وآثاره، وعوامل خطر الانتحار"
      - "تعالج كل اضطراب قلق، وتفرّق بين adjustment و acute stress و PTSD"
    status: unverified
    steps:
      - kind: table
        title: "بعد الولادة"
        columns: ["", "How common", "Clue", "Treatment"]
        rows:
          - ["Postpartum blues", "50–85%", "Day 2–3, gone in 2 weeks", "Supportive"]
          - ["MDD, peripartum onset", "10–15%", "MDD criteria, in pregnancy or within 4 weeks after", "CBT, SSRIs"]
          - ["Postpartum psychosis", "0.1–0.2%", "Delusions, harm to baby", "Admit, atypical antipsychotic, ECT"]
        hide: [[0, 3], [1, 3], [2, 3]]
        page: 579
        quote: "Characterized by mood-congruent delusions, hallucinations, and thoughts of harming the baby or self."
      - kind: explain
        title: "الـ ECT"
        text: |-
          سريع، ودواعيه: ==refractory depression==، اكتئاب مع psychosis، ==catatonia==، و acute suicidality. بيعمل tonic-clonic seizure تحت anesthesia و neuromuscular blockade.

          آثاره: disorientation، صداع، و amnesia جزئية (anterograde و retrograde) بتروح غالباً في 6 شهور. ==مالوش absolute contraindications==، وآمن في الحمل والكبار.
        page: 579
        quote: "Rapid-acting method to treat refractory depression, depression with psychotic symptoms, catatonia, and acute suicidality."
      - kind: mnemonic
        word: "SAD PERSONS"
        parts:
          - { key: "S", text: "Sex: male" }
          - { key: "A", text: "Age: young adult or older adult" }
          - { key: "D", text: "Depression" }
          - { key: "P", text: "Previous attempt: the highest risk factor" }
          - { key: "E", text: "Ethanol or drug use" }
          - { key: "R", text: "Rational thinking loss (psychosis)" }
          - { key: "S", text: "Sickness (medical illness)" }
          - { key: "O", text: "Organized plan" }
          - { key: "N", text: "No spouse or social support" }
          - { key: "S", text: "Stated future intent" }
        hook: "SAD PERSONS are more likely to die from suicide. الستات بيحاولوا أكتر، والرجالة بيموتوا أكتر، وأشهر وسيلة في أمريكا السلاح."
        page: 579
        quote: "SAD PERSONS are more likely to die from suicide. Most common method in US is firearms"
      - kind: check
        question: "Two weeks after delivery, a mother believes her baby is possessed and hears voices telling her to harm him. Next step?"
        options:
          - "Hospitalize and start an atypical antipsychotic"
          - "Reassure her; it's postpartum blues"
          - "Start an SSRI as an outpatient"
          - "Follow up in 2 weeks"
        answer: 0
        why:
          - "صح: postpartum psychosis = hospitalization + atypical antipsychotic، و ECT لو ما نفعش."
          - "الـ blues مافيهوش delusions ولا hallucinations."
          - "الـ SSRI للـ MDD with peripartum onset."
          - "فيه خطر على الطفل، ومينفعش نستنى."
        page: 579
        quote: "Treatment: hospitalization and initiation of atypical antipsychotic; if insufficient, ECT may be used."
      - kind: explain
        title: "الـ panic والـ phobias"
        text: |-
          - **Panic disorder**: نوبات خوف شديدة بتوصل للقمة في ==10 دقايق== مع ≥4 أعراض جسدية، وبعدها ≥ شهر قلق من نوبة تانية أو تغيير في السلوك. العلاج ==CBT و SSRIs و venlafaxine==، والـ benzodiazepines أحياناً في الحاد.
          - **Specific phobia**: ≥6 شهور، وعارف إنه مبالغ ← ==CBT with exposure==.
          - **Social anxiety**: خوف من الإحراج ← CBT و SSRIs و SNRIs، ولو performance بس ← β-blockers أو benzodiazepines.
          - **Agoraphobia**: ≥2 أماكن (مواصلات، زحمة، برا البيت لوحده) لأن الهروب أو المساعدة مش متاحين؛ ومعاه panic disorder.
        page: 580
        quote: "Treatment: CBT, SSRIs, and venlafaxine are first line. Benzodiazepines occasionally used in acute setting."
      - kind: mnemonic
        word: "CRIMES"
        parts:
          - { key: "C", text: "Difficulty Concentrating" }
          - { key: "R", text: "Restlessness" }
          - { key: "I", text: "Irritability" }
          - { key: "M", text: "Muscle tension" }
          - { key: "E", text: "Fatigue (low Energy)" }
          - { key: "S", text: "Sleep disturbance" }
        hook: "GAD = anxiety over CRIMES: قلق على حاجات كتير معظم الأيام ≥6 شهور، و≥3 (أو ≥1 للأطفال). أول خط CBT و SSRIs و SNRIs، وتاني خط buspirone و TCAs و benzodiazepines."
        page: 580
        quote: "Treatment: CBT, SSRIs, SNRIs are first line. Buspirone, TCAs, benzodiazepines are second line."
      - kind: explain
        title: "الـ OCD وأقاربه"
        text: |-
          - **OCD**: obsessions و/أو compulsions، و ==egodystonic== (المريض شايفها غلط)، عكس الـ OCPD. معاه tic disorders. العلاج CBT و SSRIs، وتاني خط clomipramine و venlafaxine.
          - **Body dysmorphic disorder**: انشغال بعيب صغير أو متخيّل ← CBT.
          - **Trichotillomania**: شد الشعر، والشعر الباقي ==أطواله مختلفة== (عكس الـ alopecia) ← CBT و SSRIs.
        page: 580
        quote: "Egodystonic: behavior inconsistent with one’s own beliefs and attitudes (vs OCPD)."
      - kind: sort
        prompt: "أنهي اضطراب بعد الضغط ده؟"
        bins: ["Adjustment disorder", "Acute stress disorder", "PTSD"]
        cards:
          - { text: "Anxious and tearful 6 weeks after a divorce", bin: 0 }
          - { text: "Flashbacks for 2 weeks after an assault", bin: 1 }
          - { text: "Nightmares and avoidance 3 months after combat", bin: 2 }
          - { text: "Trouble focusing at work after losing a job", bin: 0 }
        why: "الـ adjustment بعد أي ضغط نفسي (طلاق، مرض) في خلال 3 شهور. الـ acute stress والـ PTSD بعد موقف ==يهدد الحياة==: من 3 أيام لشهر ده acute stress، وأكتر من شهر PTSD (HARD: Hyperarousal و Avoidance و Re-experiencing و Distress). والـ prazosin للكوابيس."
        page: 581
        quote: "Disturbance lasts >1 month with significant distress or impaired functioning. Treatment: CBT, SSRIs, and venlafaxine are first line. Prazosin can reduce nightmares."
      - kind: figure
        title: "إمتى بيبدأ كل واحد؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="140" x2="345" y2="140"/>
            <line class="fg-ink" x1="140" y1="16" x2="140" y2="144"/>
            <text x="40" y="158" class="t-sm">Pregnancy</text>
            <text x="112" y="158" class="t-sm t-b">Delivery</text>
            <text x="240" y="158" class="t-sm">4 weeks</text>
            <line class="fg-ink" x1="260" y1="136" x2="260" y2="144"/>
            <rect class="fg-box" x="148" y="24" width="50" height="22" rx="4"/>
