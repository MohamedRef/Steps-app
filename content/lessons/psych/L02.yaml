        hide: [[0, 2], [1, 2], [2, 1]]
        page: 583
        quote: "Symptoms are intentional, motivation is unconscious. Patient consciously creates physical and/or psychological symptoms in order to assume “sick role”"
      - kind: explain
        title: "الـ factitious والـ somatic"
        text: |-
          - **Factitious imposed on self (Munchausen)**: دخول مستشفى كتير، وموافق على procedures مؤذية، وأكتر في ==الستات وعمّال الصحة==.
          - **Imposed on another (by proxy)**: اللي بيرعى بيعمل أو بيألّف المرض في طفل أو كبير ← ==إساءة==.
          - **Somatic symptom disorder**: شكوى جسدية شهور مع قلق زيادة عليها ← ==زيارات منتظمة مع نفس الدكتور== من غير tests زيادة.
          - **Conversion disorder**: فقد حركة أو إحساس من غير سبب، غالباً بعد ضغط، و la belle indifférence.
          - **Illness anxiety**: خايف إنه عنده مرض خطير رغم الطمأنة، وأعراضه قليلة أو مفيش.
        page: 583
        quote: "Characterized by a history of multiple hospital admissions and willingness to undergo invasive procedures. More common in females and healthcare workers."
      - kind: figure
        title: "الـ anorexia: من الأكل للدورة"
