  - id: psych.L02.lesson7
    title: "طوارئ الطب النفسي والمخدرات"
    hook: "clonus ولا lead pipe؟ الإجابة بتفرّق بين serotonin syndrome والـ NMS"
    minutes: 10
    pages: [587, 589]
    topics: [psychiatric-emergencies, psychoactive-drugs]
    goals:
      - "تفرّق بين طوارئ الطب النفسي وتعرف علاج كل واحدة"
      - "تعرف التسمم والانسحاب لكل مخدر"
    status: unverified
    steps:
      - kind: table
        title: "serotonin syndrome ولا NMS؟"
        columns: ["", "Serotonin syndrome", "Neuroleptic malignant syndrome"]
        rows:
          - ["Cause", "Any drug that ↑ 5-HT", "Antipsychotics"]
          - ["Muscles", "Clonus, hyperreflexia, tremor", "Lead-pipe rigidity"]
          - ["Other", "Diarrhea, diaphoresis, hyperthermia", "Myoglobinuria, ↑ CK, unstable vitals"]
          - ["Treatment", "Benzodiazepines, then cyproheptadine", "Dantrolene, bromocriptine or amantadine"]
        hide: [[1, 1], [1, 2], [3, 1], [3, 2]]
        page: 587
        quote: "Dantrolene, dopaminergics (eg, bromocriptine, amantadine), benzodiazepines; discontinue causative agent"
      - kind: explain
        title: "مين بيعمل serotonin syndrome؟"
        text: |-
          أي دوا بيزوّد الـ 5-HT:
          - **نفسية**: MAO inhibitors، و SSRIs، و SNRIs، و TCAs، و vilazodone، و vortioxetine، و buspirone.
          - **غير نفسية**: ==tramadol، ondansetron، triptans، linezolid==، و MDMA، و dextromethorphan، و meperidine، و St. John's wort.

          الوقاية: ما تديش اتنين مع بعض، وسيب washout بينهم.
        page: 587
        quote: "Prevention: avoid simultaneous serotonergic drugs, and allow a washout period between them"
      - kind: check
        question: "A patient on sertraline is given linezolid for a skin infection and develops clonus, fever and agitation. First treatment after stopping the drugs?"
        options:
          - "Benzodiazepines and supportive care"
          - "Dantrolene"
          - "Phentolamine"
          - "Benztropine"
        answer: 0
        why:
          - "صح: serotonin syndrome ← benzodiazepines، وبعدين cyproheptadine لو ما اتحسنش."
          - "الـ dantrolene للـ NMS."
          - "الـ phentolamine للـ hypertensive crisis مع MAO inhibitors."
          - "الـ benztropine للـ acute dystonia."
        page: 587
        quote: "Nonpsychiatric drugs: tramadol, ondansetron, triptans, linezolid, MDMA, dextromethorphan, meperidine, St. John’s wort"
      - kind: match
        prompt: "وصّل الطوارئ بعلاجها"
        pairs:
          - ["Hypertensive crisis (MAO inhibitor + tyramine)", "Phentolamine"]
          - ["Delirium tremens", "Longer-acting benzodiazepines"]
          - ["Acute dystonia", "Benztropine or diphenhydramine"]
          - ["Lithium toxicity", "Stop lithium, isotonic saline, hemodialysis"]
          - ["TCA toxicity", "NaHCO3, ECG monitoring, activated charcoal"]
        why: "الـ tyramine بيزق الـ NE برا. والـ delirium tremens بعد 2-4 أيام من آخر كاس، غالباً في المستشفى. والـ thiazides و ACE inhibitors و NSAIDs بيرفعوا الـ lithium. والـ TCA: Convulsions و Coma و Cardiotoxicity (wide QRS)."
        page: 587
        quote: "Supportive treatment, monitor ECG, NaHCO3 (prevents arrhythmia), activated charcoal"
      - kind: explain
        title: "الكحول"
        text: |-
          الكحول ==GABA-A positive allosteric modulator== وبيثبط الـ NMDA. التسمم: انفعال، كلام متلخبط، ataxia، coma، و blackouts. و ==AST = 2 × ALT== ("ToAST 2 ALcohol").

          الانسحاب: الجسم زوّد الـ glutamate receptors، فلما الكحول يقف ← excitation زيادة. العلاج ==longer-acting benzodiazepines==.
        page: 588
        quote: "Adaptation causes ↑ glutamate receptors; symptoms result from unregulated excess excitation. Treatment: longer-acting benzodiazepines."
      - kind: figure
        title: "انسحاب الكحول على خط الزمن"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
