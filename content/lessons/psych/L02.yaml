  - id: psych.L02.lesson2
    title: "الوعي والذاكرة: delirium و amnesia و dissociation والـ psychosis"
    hook: "الـ delirium بيتذبذب ويرجع، فدوّر على السبب: عدوى، دوا، أو احتباس بول"
    minutes: 9
    pages: [575, 576]
    topics: [orientation, amnesias, dissociative-disorders, delirium, psychosis, mood-disorder]
    goals:
      - "تعرف ترتيب فقد الـ orientation وأنواع الـ amnesia والـ Korsakoff"
      - "تفرّق بين الـ dissociative disorders، وتعالج الـ delirium صح"
      - "تربط نوع الـ hallucination بالسبب، وتفهم مكان الـ psychosis في اضطرابات المزاج"
    status: unverified
    steps:
      - kind: explain
        title: "الـ orientation والـ amnesia"
        text: |-
          - الـ **orientation** بيضيع بالترتيب: ==time ← place ← person==. أسبابه: alcohol، drugs، electrolytes، head trauma، hypoglycemia، infection، nutritional deficiency، hypoxia.
          - **Retrograde**: ما يفتكرش اللي قبل الإصابة. **Anterograde**: ما يقدرش يحفظ الجديد بعدها.
          - **Korsakoff**: amnesia (anterograde أكتر) و disorientation من ==vitamin B1 deficiency==، في الـ mammillary bodies والـ dorsomedial thalamus، بعد الـ Wernicke في الإدمان المزمن، والعلامة المميزة ==confabulation==.
        page: 575
        quote: "Seen in chronic alcohol use as a late neuropsychiatric manifestation of Wernicke encephalopathy. Confabulations are characteristic."
      - kind: match
        prompt: "وصّل الـ dissociative disorder بوصفه"
        pairs:
          - ["Depersonalization/derealization", "Detached from self or surroundings; reality testing intact"]
          - ["Dissociative amnesia", "Can't recall personal information after trauma; may travel away (fugue)"]
          - ["Dissociative identity disorder", "≥2 distinct identities; linked to sexual abuse and PTSD"]
        why: "الفرق المهم إن الـ depersonalization فيه reality testing سليم، مش psychosis. والـ DID أكتر في الستات، ومعاه borderline و PTSD و substance use."
        page: 575
        quote: "Intact reality testing (vs psychosis)."
      - kind: explain
        title: "الـ delirium"
        text: |-
          بداية ==حادة== ووعي بيتذبذب (waxing and waning)، والانتباه قليل، و hallucinations غالباً ==visual==، و illusions، ونوم ملخبط. ==Reversible==. "Delirium = changes in sensorium".

          غالباً ثانوي لمرض (عدوى، CNS، trauma، withdrawal، electrolytes، احتباس بول أو براز) أو أدوية زي الـ anticholinergics، خصوصاً في الكبار. أشهر سبب لتغيّر الوعي في المستشفى والـ ICU. والـ EEG فيه diffuse slowing.

          العلاج: عالج السبب، وساعة ونتيجة جنبه، ونوم منتظم، وتنشيط ذهني، و haloperidol لو احتجنا. وابعد عن الـ restraints والـ anticholinergics والـ benzodiazepines والـ opioids.
        page: 575
        quote: "Usually 2° to other identifiable illness (eg, CNS disease, infection, trauma, substance use/ withdrawal, metabolic/electrolyte disturbances, hemorrhage, urinary/fecal retention), or medications (eg, anticholinergics)"
      - kind: check
        question: "An elderly inpatient with delirium can't sleep. Which drug should you avoid?"
        options:
          - "Diphenhydramine"
          - "Haloperidol"
          - "Acetaminophen"
          - "Ceftriaxone"
        answer: 0
        why:
          - "صح: الـ diphenhydramine دوا anticholinergic، والـ anticholinergics بتزوّد الـ delirium."
          - "الـ haloperidol مسموح لو احتجناه."
          - "الـ acetaminophen مش من الأدوية اللي بتزوّد الـ delirium."
          - "الـ ceftriaxone بيعالج عدوى، يعني بيعالج السبب، وده الأساس."
        page: 575
        quote: "Avoid unnecessary restraints and drugs that may worsen delirium (eg, anticholinergics, benzodiazepines, opioids)."
      - kind: explain
        title: "الـ psychosis"
        text: |-
          الـ **psychosis** = إدراك مشوّه للواقع: delusions أو hallucinations أو تفكير مش منظم.
          - **Delusion**: اعتقاد غلط وثابت رغم الدليل، ومش جزء من ثقافته أو دينه.
          - **Disorganized thought**: word salad، أو tangential، أو loose associations.
          - **Hallucination**: إدراك من غير مؤثر. أما الـ **illusion** فهو ==سوء فهم لمؤثر حقيقي== (ضل تفتكره قطة).
        page: 576
        quote: "Contrast with illusions, which are misperceptions of real external stimuli (eg, mistaking a shadow for a black cat)."
      - kind: match
        prompt: "وصّل نوع الـ hallucination بسببه الأشهر"
        pairs:
          - ["Auditory", "Schizophrenia"]
          - ["Visual", "Delirium, dementia, drug intoxication"]
          - ["Tactile", "Alcohol withdrawal, cocaine (crawlies)"]
          - ["Olfactory", "Temporal lobe epilepsy aura"]
          - ["Hypnagogic or hypnopompic", "Falling asleep or waking; narcolepsy"]
        why: "الـ auditory غالباً نفسي، والـ visual غالباً عضوي. والـ gustatory نادر وبيبان في الـ epilepsy. Hypnopompic = get pomped up in the morning."
        page: 576
        quote: "Auditory—more commonly due to psychiatric illness (eg, schizophrenia) than neurologic disease."
      - kind: figure
        title: "الـ psychosis جوه اضطرابات المزاج"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">MDE + psychosis</text>
            <rect class="fg-box" x="150" y="6" width="200" height="18" rx="4"/>
            <rect class="fg-acc" x="200" y="10" width="80" height="10" rx="3"/>
            <text x="10" y="62" class="t-sm t-b">Bipolar I</text>
            <rect class="fg-box" x="150" y="50" width="90" height="18" rx="4"/>
            <rect class="fg-box" x="260" y="50" width="90" height="18" rx="4"/>
            <rect class="fg-acc" x="170" y="54" width="40" height="10" rx="3"/>
            <rect class="fg-acc" x="285" y="54" width="40" height="10" rx="3"/>
            <text x="160" y="84" class="t-sm t-mut">mania</text>
            <text x="270" y="84" class="t-sm t-mut">MDE</text>
            <text x="10" y="112" class="t-sm t-b">Bipolar II</text>
            <rect class="fg-box" x="150" y="100" width="70" height="18" rx="4"/>
            <rect class="fg-box" x="250" y="100" width="100" height="18" rx="4"/>
            <rect class="fg-acc" x="275" y="104" width="40" height="10" rx="3"/>
            <text x="150" y="134" class="t-sm t-mut">hypomania: none</text>
            <text x="10" y="162" class="t-sm t-b">Schizoaffective</text>
            <rect class="fg-box" x="150" y="150" width="110" height="18" rx="4"/>
            <rect class="fg-acc" x="200" y="154" width="140" height="10" rx="3"/>
            <text x="225" y="184" class="t-sm t-acc">alone &gt; 2 weeks</text>
          </svg>
        caption: "المستطيل الفاتح = نوبة مزاج، والشريط الملوّن = psychosis. في الـ MDE والـ bipolar الـ psychosis جوه النوبة بس، ومفيش psychosis مع الـ hypomania. في الـ schizoaffective الـ psychosis بيطلع برا النوبة ولوحده أكتر من أسبوعين."
        alt: "Four rows of mood episode boxes with psychosis bars. MDE with psychotic features: psychosis inside the episode. Bipolar I: psychosis possible in mania or MDE. Bipolar II: none with hypomania, possible in MDE. Schizoaffective: psychosis extends beyond the episode and occurs alone for more than 2 weeks."
        page: 576
        quote: "Psychosis overlaps with mood episodes but must occur by itself for > 2 weeks"
      - kind: reveal
        prompt: "ليه الـ orientation بيضيع بالترتيب ده: time الأول، و person آخر حاجة؟"
        answer: "فكّر فيها كمعلومات محتاجة ==تتحدّث==: الوقت بيتغير كل دقيقة، فأول ما الانتباه يقل يضيع. المكان بيتغير أقل. أما ==هو مين== فمعلومة متخزنة من سنين وما بتتغيرش، فآخر حاجة تضيع. عشان كده مريض مش عارف هو مين وعارف التاريخ ده ترتيب غريب يخليك تفكّر في سبب تاني غير الـ delirium."
        page: 575
        quote: "Patients’ ability to know the date and time, where they are, and who they are (order of loss: time → place → person)."
      - kind: reveal
        prompt: "ليه بنبعد عن الـ benzodiazepines والـ anticholinergics والـ opioids في مريض الـ delirium، مع إنه هايج؟"
        answer: "لأن الـ delirium أصلاً ==مخ متلخبط ووعي متذبذب==. الأدوية دي بتقلل الانتباه والـ arousal أكتر وبتلخبط الذاكرة، فبتزوّد الـ delirium نفسه. عشان كده الكتاب بيقول: عالج ==السبب==، وظبّط البيئة (ساعة ونتيجة، نوم، تنشيط)، ولو لازم دوا يبقى antipsychotic زي الـ haloperidol، والـ restraints بس لو مفيش مفر."
        page: 575
        quote: "Antipsychotics (eg, haloperidol) as needed. Avoid unnecessary restraints and drugs that may worsen delirium (eg, anticholinergics, benzodiazepines, opioids)."
      - kind: explain
        title: "يعني إيه mood disorder؟"
        text: |-
          الكتاب بيعرّفه كـ ==مدى غير طبيعي من المزاج== مع ==فقد التحكم فيه==، لدرجة إنه يعمل distress و impairment في الشغل والحياة الاجتماعية. بيشمل: major depressive و bipolar و dysthymic و cyclothymic.

          والـ psychotic features (delusions و hallucinations وكلام أو سلوك مش منظم) ممكن تيجي في أي نوبة مزاج ==إلا الـ hypomania==. وده منطقي: لو فيه psychosis يبقى المزاج وصل لـ mania مش hypomania.
        page: 576
        quote: "Characterized by an abnormal range of moods or internal emotional states and loss of control over them. Severity of moods causes distress and impairment in social and occupational functioning."
      - kind: try
        items: [psych.L02.021, psych.L02.024, psych.L02.027, psych.L02.029, psych.L02.037]
    recap:
      - "Orientation: time ← place ← person."
      - "Korsakoff: B1، mammillary bodies، confabulation."
      - "Depersonalization: reality testing سليم. Dissociative amnesia ± fugue."
      - "Delirium: حاد ومتذبذب و visual hallucinations؛ عالج السبب وابعد عن الـ anticholinergics."
      - "Auditory = نفسي، visual = عضوي، olfactory = temporal lobe epilepsy."
