        caption: "الرعشة والعرق من حوالي 3 لـ 36 ساعة، والـ seizures من 6 لـ 48، والـ hallucinosis من 12 لـ 48، والـ delirium tremens من 48 لـ 96 ساعة، وده اللي بيموّت."
        alt: "Timeline in hours since the last drink. Tremor, insomnia and sweating from about 3 to 36 hours; withdrawal seizures from about 6 to 48 hours; visual hallucinosis from about 12 to 48 hours; delirium tremens, highlighted, from 48 to 96 hours."
        page: 588
        quote: "Tremors, insomnia, diaphoresis, agitation, GI upset Withdrawal seizures Alcoholic hallucinosis (usually visual) Delirium tremens"
      - kind: explain
        title: "الـ depressants التانية"
        text: |-
          - **Barbiturates**: هامش أمان ==قليل==، respiratory depression شديد، والانسحاب ممكن cardiovascular collapse.
          - **Benzodiazepines**: هامش أمان أكبر، والعلاج ==flumazenil==، والانسحاب seizures و anxiety.
          - **Opioids**: ==miosis==، و respiratory depression، و ↓ GI motility، وأشهر سبب وفاة بالـ overdose ← naloxone. الانسحاب ("cold turkey"): mydriasis، إسهال، رشح، تثاؤب، piloerection ← methadone أو buprenorphine.
          - **Inhalants**: euphoria و ataxia و periorifical rash، وبتبدأ وتخلص بسرعة.
        page: 588
        quote: "Mydriasis, diarrhea, flulike symptoms rhinorrhea, yawning, nausea, sweating, piloerection (“cold turkey”), lacrimation."
      - kind: sort
        prompt: "الحدقة: ضيقة ولا واسعة؟"
        bins: ["Miosis", "Mydriasis"]
        cards:
          - { text: "Opioid intoxication", bin: 0 }
          - { text: "Opioid withdrawal", bin: 1 }
          - { text: "Cocaine", bin: 1 }
          - { text: "Amphetamines", bin: 1 }
          - { text: "LSD", bin: 1 }
          - { text: "MDMA", bin: 1 }
        why: "الـ opioids هي اللي بتضيّق الحدقة (pinpoint)، وانسحابها بيوسّعها. والـ stimulants والـ hallucinogens بيوسّعوها."
        page: 588
        quote: "Activation of μ receptors causes the prototypic effect of miosis (pinpoint pupils)"
      - kind: explain
        title: "الـ amphetamines"
        text: |-
          - **Amphetamines**: بتعكس الـ transporters (VMAT و DAT و SERT و NET)؛ grandiosity و paranoia و meth mites ← benzodiazepines.
        page: 588
        quote: "Amphetamines Induces reversal of monoamine transporters (VMAT, DAT, SERT, NET), ↑ neurotransmitter release."
      - kind: explain
        title: "الـ stimulants والـ hallucinogens"
        text: |-
          - **Cocaine**: بيمنع الـ reuptake (DAT و SERT و NET)؛ formication و ==angina== و sudden cardiac death، وثقب في الـ nasal septum ← benzodiazepines.
          - **Caffeine**: adenosine antagonist. **Nicotine**: nicotinic receptors؛ الانسحاب ↑ appetite ← nicotine replacement و bupropion و varenicline.
          - **LSD**: 5-HT2A agonist، وفيه flashbacks. **Cannabis**: CB1 agonist، و conjunctival injection، و hyperemesis بتخف بالـ ==hot showers==.
          - **MDMA**: hyperthermia و ==hyponatremia== و serotonin syndrome. **PCP**: NMDA antagonist، violence و nystagmus و analgesia.
        page: 589
        quote: "Life-threatening effects include hypertension, tachycardia, hyperthermia, hyponatremia, serotonin syndrome."
      - kind: check
        question: "A violent, agitated man has vertical nystagmus and doesn't respond to pain. Which drug?"
        options:
