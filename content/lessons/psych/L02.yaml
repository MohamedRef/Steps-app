          - "الـ cannabis euphoria و conjunctival injection."
          - "الهيروين بيعمل sedation و miosis."
        page: 589
        quote: "Violence, nystagmus, impulsivity, psychomotor agitation, tachycardia, hypertension, analgesia, psychosis, delirium, seizures."
      - kind: reveal
        prompt: "ليه الـ cocaine بيخرّم الـ nasal septum، وليه انسحاب الـ opioids اسمه «cold turkey»؟"
        answer: "الـ cocaine بيعمل ==vasoconstriction== شديد في الغشاء المخاطي، فالدم ما يوصلش ويحصل ==ischemic necrosis== لحد ما الـ septum يتخرّم. وانسحاب الـ opioids عكس تأثيرها: بدل الـ miosis والإمساك يبقى mydriasis و diarrhea، وبيحصل ==piloerection== (الجلد بيبقى زي جلد الديك الرومي المتلّج)، ومنها جه اسم «cold turkey»."
        page: 589
        quote: "Chronic use may lead to perforated nasal septum due to vasoconstriction and resulting ischemic necrosis."
