lecture: psych.L02
lessons:
  - id: psych.L02.lesson1
    title: "إساءة الأطفال واضطرابات الطفولة"
    hook: "الإصابات اللي في مراحل التئام مختلفة، والحكاية اللي مش ماشية مع سن الطفل: دي إساءة لحد ما يثبت العكس"
    minutes: 9
    pages: [573, 574]
    topics: [child-abuse, vulnerable-child-syndrome, childhood-disorders]
    goals:
      - "تعرف أنواع إساءة الأطفال وعلاماتها، وإن أي شك لازم يتبلّغ"
      - "تفرّق بين اضطرابات الطفولة بالسن والمدة والعلاج"
    status: unverified
    steps:
      - kind: explain
        title: "إساءة الأطفال"
        text: |-
          ==أي شك في إساءة لطفل لازم يتبلّغ== للـ child protective services.
          - **Neglect**: نظافة وتغذية وحشة، و failure to thrive. ==أشهر نوع==.
          - **Physical abuse**: كسور وكدمات وحروق في ==مراحل التئام مختلفة== (different stages of healing) أو على شكل أداة، والأهل بيتأخروا أو حكايتهم مش ماشية مع سن الطفل. و 40% من الوفيات تحت سنة.
          - **Abusive head trauma (shaken baby)**: subdural hematoma و retinal hemorrhages.
          - **Sexual abuse**: غالباً مفيش علامات جسدية؛ الـ peak من 9 لـ 12 سنة.
          - **Emotional abuse**: الطفل الصغير ما عندوش bond مع أهله بس بيحضن الأغراب، والأكبر انفعالي وعنده أعراض جسدية مبهمة.
        page: 573
        quote: "Injuries often in different stages of healing or in patterns resembling possible implements of injury."
      - kind: check
        question: "A 3-month-old has retinal hemorrhages and a subdural hematoma; the parents say he fell from a bed. What is most likely?"
        options:
          - "Abusive head trauma"
          - "Accidental fall"
          - "Vulnerable child syndrome"
          - "Neglect only"
        answer: 0
        why:
          - "صح: subdural و retinal hemorrhages = shaken baby، والحكاية مش ماشية مع سنه."
          - "طفل 3 شهور ما بيتقلبش لوحده، والإصابة مش متسقة."
          - "ده أهل خايفين على الطفل زيادة، مش إصابة."
          - "الـ neglect إهمال، وده trauma."
        page: 573
        quote: "Includes abusive head trauma (shaken baby syndrome), characterized by subdural hematomas or retinal hemorrhages."
      - kind: aside
        tone: trap
        text: "**Vulnerable child syndrome** مش **factitious disorder imposed on another**: في الأول الأهل ==فاكرين== إن الطفل ضعيف (غالباً بعد مرض خطير)، فيغيب عن المدرسة ويروح للدكتور كتير. في التاني الأهل ==بيعملوا أو بيألفوا== المرض."
        page: 573
        quote: "Parents misperceive the child as especially susceptible to illness or injury (vs factitious disorder imposed on another)."
      - kind: explain
        title: "ADHD و autism"
        text: |-
          - **ADHD**: يبدأ ==قبل 12 سنة== بس ما نشخّصوش قبل 4. hyperactivity أو impulsivity أو inattention في ==مكانين على الأقل==. الذكاء طبيعي، وغالباً بيكمّل للكبر. العلاج: ==stimulants (methylphenidate)== ± behavioral therapy، والبدائل atomoxetine و α2-agonists (clonidine، guanfacine).
          - **Autism spectrum disorder**: من الطفولة المبكرة، مشاكل social و communication، وسلوك متكرر، واهتمامات محدودة. ممكن intellectual disability أو مهارة فوق العادي (زي الموسيقى). أكتر في الذكور، ومعاه ↑ head أو brain size.
        page: 574
        quote: "Onset before age 12, but diagnosis can only be established after age 4. Characterized by hyperactivity, impulsivity, and/or inattention in ≥2 settings"
      - kind: table
        title: "الطفل العصبي: مين فين؟"
        columns: ["", "Core feature", "Age or duration"]
        rows:
          - ["ODD", "Defiant, vindictive toward authority", "≥6 months"]
          - ["Conduct disorder", "Violates others' rights (cruelty, theft)", "Antisocial after 18"]
          - ["DMDD", "Severe outbursts + irritable between", "Onset <10, diagnosed >6"]
          - ["Intermittent explosive", "Brief outbursts (<30 min), relief then remorse", "Onset >6"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 574
        quote: "Repetitive, pervasive behavior violating societal norms or the basic rights of others (eg, aggression toward people and animals, destruction of property, theft)."
      - kind: check
        question: "A 12-year-old repeatedly sets fires, steals from classmates and tortures the family cat. Diagnosis?"
        options:
          - "Conduct disorder"
          - "Oppositional defiant disorder"
          - "Antisocial personality disorder"
          - "Intermittent explosive disorder"
        answer: 0
        why:
          - "صح: انتهاك حقوق الآخرين (قسوة على الحيوانات، سرقة، تخريب)."
          - "الـ ODD عناد مع السلطة من غير ما يأذي حقوق الناس."
          - "الـ antisocial بعد 18 سنة بس؛ Conduct = children."
          - "الـ IED نوبات غضب قصيرة من غير تخطيط."
        page: 574
        quote: "After age 18, often reclassified as antisocial personality disorder. Conduct = children, antisocial = adults."
      - kind: explain
        title: "التعلم والقلق والـ tics"
        text: |-
          - **Intellectual disability**: عجز ==شامل== في الإدراك والـ adaptive functioning. أشهر سبب genetic: **Down syndrome**، وأشهر سبب inherited: **Fragile X**.
          - **Specific learning disorder**: مادة واحدة (حساب، قراية، كتابة) ≥6 شهور رغم المساعدة، و ==الذكاء طبيعي==.
          - **Selective mutism**: قبل 5 سنين، ≥ شهر ما بيتكلمش في أماكن معينة وبيتكلم في غيرها، ومعاه غالباً social anxiety.
          - **Separation anxiety**: ≥4 أسابيع، وطبيعي لحد 3-4 سنين.
          - **Tourette**: قبل 18، tics حركية وصوتية >سنة، ومعاه ==OCD و ADHD==. العلاج psychoeducation و behavioral therapy، وللـ tics الصعبة tetrabenazine أو antipsychotics أو α2-agonists.
        page: 574
        quote: "Most common genetic cause is Down syndrome; most common inherited cause is Fragile X syndrome."
      - kind: figure
        title: "أعمار البداية في اضطرابات الطفولة"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
