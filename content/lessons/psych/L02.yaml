            <rect class="fg-acc" x="20" y="76" width="192" height="18" rx="4"/>
            <text x="217" y="90" class="t-sm">ADHD: before 12</text>
            <rect class="fg-box" x="20" y="104" width="288" height="18" rx="4"/>
            <text x="150" y="118" class="t-sm t-b">Tourette: before 18</text>
          </svg>
        caption: "الـ selective mutism قبل 5، والـ DMDD بيبدأ قبل 10 ونشخّصه بعد 6، والـ ADHD قبل 12 (ونشخّصه بعد 4)، والـ Tourette قبل 18."
        alt: "A horizontal age axis from 0 to 18 years with bars: selective mutism onset before 5; DMDD from 6 to 10; ADHD onset before 12; Tourette onset before 18."
        page: 574
        quote: "Tourette syndrome Onset before age 18."
      - kind: reveal
        prompt: "طفل مكسور وأهله متأخرين يومين قبل ما يجيبوه، والقصة إنه «اتقلب من على السرير» وهو عنده شهرين. إيه اللي يقلقك هنا؟"
        answer: "حاجتين الكتاب بيقول عليهم في الـ physical abuse: ==التأخير في طلب العلاج==، و==قصة مش متناسبة مع الـ developmental stage== أو شكل الإصابة. طفل عنده شهرين لسه ما بيتقلبش (التقلّب بيبدأ حوالين 6 شهور)، فالقصة نفسها هي الـ red flag. وكل اشتباه لازم يتبلّغ لـ child protective services."
        page: 573
        quote: "Caregivers may delay seeking medical attention for the child or provide explanations inconsistent with the child’s developmental stage or pattern of injury."
      - kind: explain
        title: "الـ neglect والـ emotional abuse: علامات من غير كدمات"
        text: |-
          - **Neglect** (==أشهر نوع== من الـ maltreatment): سببه إن الطفل ==ما بياخدش== أكل أو مأوى أو إشراف أو تعليم أو حنان كفاية. عشان كده بيبان كـ poor hygiene و malnutrition و failure to thrive و withdrawn affect.
          - **Emotional abuse**: الطفل الصغير ممكن ما يرتبطش بالـ caregiver بس يبقى ودود زيادة مع الغُرب، أو عدواني مع الأطفال والحيوانات، أو قلقان بزيادة. الأكبر بيبقى labile وعصبي، وبيبعد عن أهله وعن الأطفال، وعنده أعراض جسدية مبهمة. وحوالي ==80%== منهم بيبقى عندهم مرض نفسي واحد على الأقل قبل 21 سنة.
        page: 573
        quote: "Poor hygiene, malnutrition, withdrawn affect, impaired social/ emotional development, failure to thrive due to failure to provide a child with adequate food, shelter, supervision, education, and/or affection."
      - kind: try
        items: [psych.L02.001, psych.L02.003, psych.L02.009, psych.L02.011, psych.L02.013]
    recap:
      - "أي شك في إساءة طفل ← بلّغ. Neglect الأشهر. Shaken baby = subdural + retinal hemorrhages."
      - "ADHD: قبل 12، مكانين، methylphenidate."
      - "Conduct = children، antisocial = adults. DMDD: نوبات + عصبية بينهم."
      - "Down = أشهر genetic، Fragile X = أشهر inherited."
      - "Tourette قبل 18، ومعاه OCD و ADHD."
