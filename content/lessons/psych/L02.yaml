    steps:
      - kind: explain
        title: "الـ personality disorders"
        text: |-
          أنماط جامدة ومؤذية، و ==egosyntonic== (المريض مش شايف مشكلة)، وبتبان من بداية الشباب.
          - **Cluster A "weird"**: paranoid (شك وتربّص)، schizoid (بيحب الوحدة ومش فارق معاه رأي الناس)، schizotypal (أفكار غريبة و magical thinking). Genetic مع الـ schizophrenia.
          - **Cluster B "wild"**: antisocial (≥18 و conduct disorder قبل 15)، borderline (خوف من الهجر، إيذاء النفس، splitting ← ==dialectical behavior therapy==)، histrionic (لفت الانتباه)، narcissistic (grandiosity و entitlement وبيتجنن من النقد). Genetic مع الـ mood و substance use.
          - **Cluster C "worried"**: avoidant (عايز علاقات بس خايف من الرفض)، obsessive-compulsive (نظام و perfectionism و egosyntonic)، dependent (لازق ومش واثق في نفسه). Genetic مع الـ anxiety.
        page: 582
        quote: "Cluster B (remember as “wild”)—dramatic, emotional, or erratic; genetic association with mood disorders and substance use."
      - kind: match
        prompt: "وصّل الزوج المتشابه بالفرق"
        pairs:
          - ["Schizoid", "Prefers being alone; indifferent"]
          - ["Avoidant", "Wants relationships; fears rejection"]
          - ["OCD", "Egodystonic obsessions and compulsions"]
          - ["Obsessive-compulsive personality", "Egosyntonic perfectionism and control"]
          - ["Antisocial personality", "Age ≥18"]
          - ["Conduct disorder", "Age <18"]
        why: "الكتاب بيحط (vs) بين كل زوج من دول، فالامتحان بيحطهم مع بعض في الاختيارات."
        page: 582
        quote: "Preoccupation with order, perfectionism, and control (obsessive-compulsive); egosyntonic: behavior consistent with one’s own beliefs and attitudes (vs OCD)."
      - kind: check
        question: "A man demands to see only the department chief, insists he deserves special treatment, and rages when his wait is mentioned. Diagnosis?"
        options:
