  - id: psych.L02.lesson3
    title: "الـ schizophrenia والـ bipolar والاكتئاب"
    hook: "في الـ psychosis المدة هي التشخيص: يوم لشهر، شهر لـ 6، أكتر من 6"
    minutes: 10
    pages: [577, 578]
    topics: [schizophrenia-spectrum, manic-episode, hypomanic-episode, bipolar-disorder, major-depressive-disorder]
    goals:
      - "تشخّص الـ schizophrenia spectrum بالأعراض والمدة"
      - "تفرّق بين mania و hypomania، و bipolar I و II و cyclothymia"
      - "تحفظ معايير الـ MDD وأنواعه وعلاجه"
    status: unverified
    steps:
      - kind: explain
        title: "الـ schizophrenia"
        text: |-
          أعراض ==positive== (hallucinations، delusions، كلام وسلوك مش منظم)، و ==negative== (blunted affect، apathy، anhedonia، alogia، انعزال)، و ==cognitive== (ذاكرة عاملة وانتباه أقل).

          التشخيص: ≥2 أعراض، منهم واحد على الأقل من (delusions، hallucinations، disorganized speech)، والبداية ≥6 شهور، و≥ شهر أعراض نشطة.

          معاه ventriculomegaly، و ↑ serotonergic activity، و ↓ dendritic branching. 1.5%، والرجالة أكتر وأبدر (أواخر المراهقة). الـ cannabis في المراهقة بتزوّده. والعلاج atypical antipsychotics (risperidone).
        page: 577
        quote: "Diagnosis requires ≥2 of the following active symptoms, including ≥1 from symptoms #1-3"
      - kind: table
        title: "المدة بتحدد التشخيص"
        columns: ["", "Duration", "Note"]
        rows:
          - ["Brief psychotic", "1 day–1 month", "≥1 positive symptom, often stress"]
          - ["Schizophreniform", "1–6 months", "≥2 symptoms"]
          - ["Schizophrenia", "≥6 months", "≥1 month active"]
          - ["Delusional disorder", ">1 month", "Delusion only; functions well"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 577
        quote: "Symptom onset ≥6 months prior to diagnosis; requires ≥1 month of active symptoms over the past 6 months."
      - kind: check
        question: "Psychotic symptoms appear 2 days after a house fire and resolve completely in 10 days. Diagnosis?"
        options:
          - "Brief psychotic disorder"
          - "Schizophreniform disorder"
          - "Schizophrenia"
          - "Delusional disorder"
        answer: 0
        why:
          - "صح: من يوم لشهر، وغالباً بعد stress."
          - "الـ schizophreniform من شهر لـ 6."
          - "الـ schizophrenia ≥6 شهور."
          - "الـ delusional أكتر من شهر وفكرة واحدة بس."
        page: 577
        quote: "Brief psychotic disorder—≥1 positive symptom(s) lasting between 1 day and 1 month, usually stress-related."
      - kind: aside
        tone: exam
        text: "**Poor prognosis** في الـ schizophrenia: male، بداية بدري أو تدريجية، أعراض ==negative== غالبة، تاريخ عائلي، ومدة طويلة من غير علاج. و **schizoaffective** = psychosis ==لوحده ≥2 أسبوع== من غير نوبة مزاج، و **schizotypal** = cluster A على الـ spectrum."
        page: 577
        quote: "Poor prognosis: male sex, early or gradual onset, predominantly negative symptoms (often persistent after treatment), family history of psychosis, and long duration of untreated psychosis."
      - kind: mnemonic
        word: "DIG FAST"
        parts:
          - { key: "D", text: "Distractibility" }
          - { key: "I", text: "Impulsivity or Indiscretion: pleasure without regard to consequences" }
          - { key: "G", text: "Grandiosity: inflated self-esteem" }
          - { key: "F", text: "Flight of ideas: racing thoughts" }
          - { key: "A", text: "Goal-directed Activity or psychomotor Agitation" }
          - { key: "S", text: "↓ need for Sleep" }
          - { key: "T", text: "Talkativeness or pressured speech" }
        hook: "people with mania DIG FAST: ≥3 لمدة ≥ أسبوع، أو أي مدة لو دخل المستشفى. والـ hypomania نفس الشكل بس ≥4 أيام، من غير تعطيل شديد ولا psychosis."
        page: 577
        quote: "Diagnosis requires marked functional impairment with ≥3 of the following for ≥1 week, or any duration if hospitalization is required (people with mania DIG FAST)"
      - kind: explain
        title: "الـ bipolar"
        text: |-
          - **Bipolar I**: ==نوبة mania واحدة== تكفي (± hypomania أو اكتئاب).
          - **Bipolar II**: hypomania + نوبة اكتئاب، ==من غير mania أبداً==.
          - **Cyclothymia**: أعراض خفيفة بين اكتئاب و hypomania ≥2 سنة، نص الوقت على الأقل، وأي تحسّن ≤ شهرين.

          الـ antidepressants ==ممكن تقلب المزاج==، والـ suicide risk عالي. العلاج atypical antipsychotics و mood stabilizers: lithium و lamotrigine و valproate و carbamazepine ("A little less variable character").
        page: 578
        quote: "Bipolar I (requires 1 type of episode)—≥1 manic episode +/− a hypomanic or depressive episode (may be separated by any length of time)."
      - kind: check
        question: "A woman has had recurrent depressions and one 4-day period of high energy that didn't impair her work. Never manic. Diagnosis?"
        options:
          - "Bipolar II"
          - "Bipolar I"
          - "Cyclothymic disorder"
          - "Major depressive disorder"
        answer: 0
        why:
          - "صح: hypomania (≥4 أيام من غير تعطيل) + اكتئاب، ومفيش mania."
          - "الـ bipolar I محتاج mania."
          - "الـ cyclothymia أعراض خفيفة سنتين، مش نوبات اكتئاب كاملة."
          - "وجود hypomania بينفي الـ MDD."
        page: 578
        quote: "Bipolar II (requires 2 types of episodes)—a hypomanic and a depressive episode (no history of manic episodes)."
      - kind: mnemonic
        word: "SIG E CAPS"
        parts:
          - { key: "S", text: "Sleep disturbances" }
          - { key: "I", text: "↓ Interest (anhedonia)" }
          - { key: "G", text: "Guilt or worthlessness" }
          - { key: "E", text: "↓ Energy" }
          - { key: "C", text: "↓ Concentration" }
          - { key: "A", text: "Appetite or weight changes" }
          - { key: "P", text: "Psychomotor retardation or agitation" }
          - { key: "S", text: "Suicidal ideation" }
        hook: "≥5 من 9 لمدة ≥ أسبوعين، منهم depressed mood أو anhedonia. واسأل دايماً عن mania أو hypomania قبل كده. العلاج CBT و SSRIs."
        page: 578
        quote: "Screen for previous manic or hypomanic episodes to rule out bipolar disorder. Treatment: CBT and SSRIs are first line"
      - kind: table
        title: "أنواع الاكتئاب"
        columns: ["", "Clue", "Extra treatment"]
        rows:
          - ["With psychotic features", "Mood-congruent delusions only in MDE", "+ atypical antipsychotic, or ECT"]
          - ["Persistent (dysthymia)", "Milder, ≥2 years", "—"]
          - ["Seasonal pattern", "Winter episodes ≥2 years", "+ light therapy"]
          - ["Atypical features", "Mood reactivity, hypersomnia, hyperphagia, leaden paralysis", "CBT, SSRIs; MAO inhibitors not first line"]
        hide: [[0, 2], [2, 2], [3, 1]]
        page: 578
        quote: "Formerly called seasonal affective disorder. Major depressive episodes occurring only during a particular season (usually winter) in ≥2 consecutive years and in most years across a lifetime."
      - kind: figure
        title: "المدة هي التشخيص"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="140" x2="345" y2="140"/>
