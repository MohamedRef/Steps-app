            <rect class="fg-acc" x="20" y="66" width="240" height="22" rx="4"/>
            <text x="28" y="82" class="t-sm t-b">MDD, peripartum onset</text>
            <text x="20" y="116" class="t-sm">Onset in pregnancy or within 4 weeks after</text>
          </svg>
        caption: "الـ blues بتبدأ يوم 2-3 بعد الولادة وتخلص في أسبوعين. أما الـ MDD with peripartum onset فممكن تبدأ في الحمل نفسه أو لحد 4 أسابيع بعد الولادة."
        alt: "A timeline with delivery in the middle: postpartum blues runs from day 2-3 to 2 weeks after delivery; MDD with peripartum onset spans pregnancy and the first 4 weeks after delivery."
        page: 579
        quote: "Meets MDD criteria with onset either during pregnancy or within 4 weeks after delivery."
      - kind: reveal
        prompt: "ليه مريض الـ panic attack بييجي الطوارئ فاكر إنه عنده heart attack؟"
        answer: "لأن الكتاب بيقول إن الأعراض دي ==systemic manifestations of fear==: الخوف بيشغّل الـ sympathetic (fight or flight)، فيطلع palpitations و chest pain و sweating و shaking و shortness of breath و choking. الجسم كله بيتصرف كأن فيه خطر حقيقي، فالأعراض شبه القلب بالظبط. عشان كده لازم تستبعد السبب العضوي الأول، وبعدها العلاج CBT و SSRIs."
        page: 580
        quote: "Symptoms are systemic manifestations of fear."
      - kind: explain
        title: "مين يتعرض لـ PTSD؟"
        text: |-
          الـ PTSD مش بس للي حصلتله الحادثة. الكتاب بيقول التعرض يبقى بـ تلات طرق: إنك ==تعيش== الموقف، أو ==تشوفه== بيحصل، أو ==تعرف== إن حد بتحبه مرّ بموقف بيهدد الحياة (serious injury أو sexual assault).

          ده بيفرّقه عن الـ **adjustment disorder** اللي بيجي بعد أي ضغط عادي (طلاق، مرض)، مش لازم يهدد الحياة.
        page: 581
        quote: "Experiencing, witnessing, or discovering that a loved one has experienced a life-threatening situation (eg, serious injury, sexual assault)"
      - kind: table
        title: "ساعة الطب النفسي: المدة بتفرق"
        columns: ["Duration", "Disorders"]
        rows:
          - ["<1 month", "Brief psychotic disorder; acute stress disorder (3 days–1 month)"]
          - ["≥1 month", "PTSD (>1 mo); delusional disorder (>1 mo); panic disorder (≥1 mo of worry after an attack); selective mutism"]
          - ["≥2 weeks", "Major depressive episode"]
          - ["≥6 months", "Schizophrenia; generalized anxiety disorder; phobias; ODD"]
          - ["≥2 years", "Cyclothymic and persistent depressive (dysthymic) disorders"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1]]
        page: 581
        quote: "Diagnostic criteria by symptom duration"
