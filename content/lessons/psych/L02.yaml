      - kind: aside
        tone: exam
        text: "تعريف الـ **manic episode** بالكتاب: فترة ==واضحة== من مزاج مرتفع أو expansive أو ==irritable== بشكل غير طبيعي ومستمر، مع ↑ activity أو energy، و ==marked functional impairment==، و ≥3 من DIG FAST لمدة ≥ أسبوع (أو أي مدة لو احتاج hospitalization). خلي بالك: الـ irritable mood بيكفي، مش لازم يكون مبسوط. والفرق مع الـ hypomania إن الـ hypomania مافيهاش impairment كبير ولا hospitalization ولا psychosis."
        page: 577
        quote: "Manic episode Distinct period of abnormally and persistently elevated, expansive, or irritable mood and ↑ activity or energy. Diagnosis requires marked functional impairment with ≥3 of the following for ≥1 week, or any duration if hospitalization is required"
