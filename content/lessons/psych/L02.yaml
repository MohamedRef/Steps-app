            <rect class="fg-acc" x="220" y="92" width="125" height="22" rx="4"/>
            <text x="226" y="108" class="t-sm t-b">Schizophrenia ≥6 mo</text>
          </svg>
        caption: "نفس الأعراض، والمدة بس هي اللي بتغيّر الاسم: من يوم لشهر brief psychotic، من شهر لـ 6 schizophreniform، وأكتر من 6 شهور schizophrenia. (المسافات مش بالمقياس، كل خانة فترة.)"
        alt: "A schematic time axis (not to scale, one equal slot per period) with three bars: brief psychotic disorder from 1 day to 1 month, schizophreniform disorder from 1 to 6 months, and schizophrenia from 6 months on."
        page: 577
