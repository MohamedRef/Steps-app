      - kind: explain
        title: "اضطرابات الأكل"
        text: |-
          - **Anorexia**: وزن قليل (BMI <18.5)، نوعين: binge-eating/purging (hypokalemia) و restricting. العلاج nutritional rehabilitation و psychotherapy و ==olanzapine==. وخلي بالك من الـ **refeeding syndrome**: ↑ insulin ← ==↓ phosphate== و ↓ K و ↓ Mg ← قلب و rhabdomyolysis و seizures.
          - **Bulimia**: binge + purging أسبوعياً 3 شهور، والوزن ==طبيعي أو زيادة شوية==. parotid hypertrophy، تآكل الأسنان، Mallory-Weiss، metabolic alkalosis، و Russell sign. العلاج psychotherapy و fluoxetine، و bupropion ممنوع (seizures).
          - **Binge-eating**: binge من غير purging، ↑ diabetes، الأشهر في الكبار ← psychotherapy و SSRIs و lisdexamfetamine.
          - **Pica**: أكل حاجات مش أكل ≥ شهر، في الأطفال والحمل، ومعاه iron deficiency.
        page: 584
        quote: "Treatment: psychotherapy, nutritional rehabilitation, fluoxetine. Bupropion is contraindicated due to seizure risk."
      - kind: check
