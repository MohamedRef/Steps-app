  - id: psych.L02.lesson6
    title: "النوم والتبول والإدمان ومراحل التغيير"
    hook: "الطفل اللي بيصرّخ بالليل وما يفتكرش حاجة الصبح: ده N3، مش كابوس"
    minutes: 8
    pages: [585, 586]
    topics: [sleep-terror-disorder, elimination-disorders, narcolepsy, substance-use-disorder, gambling-disorder, stages-of-change]
    goals:
      - "تفرّق بين sleep terror و nightmares، وتعالج الـ enuresis والـ narcolepsy"
      - "تشخّص الـ substance use disorder والـ gambling disorder"
      - "تحدد مرحلة التغيير وتختار الأسلوب المناسب"
    status: unverified
    steps:
      - kind: explain
        title: "الـ sleep terror والـ enuresis"
        text: |-
          - **Sleep terror**: رعب وصريخ بالليل، أكتر في الأطفال، في ==stage N3 non-REM==، و ==ما يفتكرش==. الـ nightmares في الـ REM وبيفتكر الحلم. المحفزات: stress و fever وقلة النوم، وبيخلص لوحده.
          - **Enuresis**: ≥2 مرات في الأسبوع لمدة ≥3 شهور في سن ≥5. أول خط ==behavioral== (مواعيد للحمام، تقليل السوائل بالليل) و positive reinforcement، وبعدين alarm أو desmopressin (أحسن من imipramine).
          - **Encopresis**: ≥ مرة في الشهر لمدة ≥3 شهور في سن ≥4 ← behavioral و toilet training و laxatives.
        page: 585
        quote: "Periods of inconsolable terror with screaming in the middle of the night. Most common in children."
      - kind: explain
        title: "الـ narcolepsy"
        text: |-
          نوم بالنهار رغم إنه نايم كويس، ≥3 مرات في الأسبوع لمدة 3 شهور، من ==↓ orexin (hypocretin)== في الـ lateral hypothalamus.
          - hypnagogic أو hypnopompic hallucinations
          - النوم بيبدأ بالـ REM (sleep paralysis)
          - ==Cataplexy==: العضلات بتسيب كلها بعد انفعال قوي زي الضحك

          العلاج: نظام نوم وقيلولات، و stimulants بالنهار (modafinil و solriamfetol و pitolisant و amphetamines)، و sodium oxybate بالليل.
        page: 585
        quote: "Cataplexy (loss of all muscle tone following strong emotional stimulus, such as laughter)."
      - kind: check
        question: "Which finding is most specific for narcolepsy?"
        options:
          - "Sudden loss of muscle tone when laughing"
          - "Screaming at night with no memory"
          - "Bedwetting twice a week"
          - "Remembering frightening dreams"
        answer: 0
        why:
          - "صح: الـ cataplexy علامة الـ narcolepsy."
          - "ده sleep terror في N3."
          - "ده enuresis."
          - "دي nightmares في الـ REM."
        page: 585
        quote: "Cataplexy (loss of all muscle tone following strong emotional stimulus, such as laughter)."
      - kind: explain
        title: "الإدمان والقمار"
        text: |-
          - **Substance use disorder**: ==≥2 معايير في السنة== (tolerance، withdrawal، cravings، بياخد أكتر من اللي ناويه، فشل في التقليل، وقت كتير، تعطيل في الشغل، مشاكل مع الناس، بطّل هواياته، استخدام في خطر، بيكمّل رغم الضرر). بس الـ tolerance والـ withdrawal من ==دوا موصوف صح== مش إدمان.
        page: 585
        quote: "In the case of appropriate medical treatment with prescribed medications (eg, opioid analgesics, sedatives, stimulants), symptoms of tolerance and withdrawal do not indicate a substance use disorder."
      - kind: explain
        title: "القمار"
        text: |-
          - **Gambling disorder**: ≥4 معايير ومش مفسّر بالـ mania (بيلعب أكتر عشان نفس الإثارة، بيجري ورا الخساير، بيكدب، بيعتمد على فلوس غيره) ← psychotherapy.
        page: 586
        quote: "Persistent, recurrent, problematic gambling that cannot be better explained as a manic episode. Diagnosis made if patient meets ≥4 of the following criteria"
      - kind: figure
        title: "مراحل التغيير"
        svg: |-
