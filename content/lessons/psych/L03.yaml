        caption: "الـ methadone full agonist طويل المفعول، والـ buprenorphine partial agonist، والـ naloxone antagonist قصير للـ overdose. والـ naltrexone antagonist طويل المفعول بعد الـ detox عشان يمنع الرجوع."
        alt: "A line from full agonist to antagonist with three boxes: methadone, long-acting and oral; buprenorphine, partial agonist given as a sublingual film; naloxone, for overdose, given IM, IV or nasally. Notes below: methadone and buprenorphine for withdrawal and maintenance; oral naltrexone for relapse prevention after detoxification."
