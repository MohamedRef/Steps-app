      - kind: explain
        title: "أدوية بطّل التدخين"
        text: |-
          - **Nicotine replacement**: بيرتبط بالـ nicotinic ACh receptors عشان يخفف الـ withdrawal. ينفع patch طويل المفعول مع gum أو lozenge قصير. أعراضه: headache و oral irritation.
          - **Varenicline**: nicotinic ACh receptor ==partial agonist==: بيقلل أثر الـ reward وكمان بيقلل الـ withdrawal. أعراضه: GI discomfort و sleep disturbance. "Varenicline helps nicotine cravings decline".
          - **Bupropion**: برضه بيتستخدم للتدخين.
        page: 594
        quote: "Varenicline Nicotinic ACh receptor partial agonist. Diminishes effect on reward system, but also reduces withdrawal."
      - kind: figure
        title: "أدوية الـ opioid من agonist لـ antagonist"
