            <circle class="fg-dot-acc" cx="290" cy="85" r="5"/>
            <circle class="fg-dot-acc" cx="345" cy="85" r="5"/>
            <text x="40" y="108" class="t-sm t-b">1</text>
            <text x="67" y="108" class="t-sm t-b">2</text>
