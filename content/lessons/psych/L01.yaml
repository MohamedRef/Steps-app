            <text x="20" y="160" class="t-sm t-mut">9 mo: separation anxiety, object permanence</text>
          </svg>
        caption: "الأرقام بالشهور. 2 شهر social smile، 6 شهور يقعد و stranger anxiety، 9 شهور separation anxiety و object permanence، 10 شهور يقف و pincer grasp ويقول ماما، و12 شهر يشاور ويبتدي يمشي (12-18)."
        alt: "A timeline of months 1 to 12. Month 1 head up prone; 2 social smile; 4 orients to voice; 6 sits and stranger anxiety; 8 crawls; 10 stands, pincer grasp, says mama; 12 walks and points. Footnote: 9 months separation anxiety and object permanence."
        page: 572
        quote: "Posture—lifts head up prone (by 1 mo), rolls and sits (by 6 mo), crawls (by 8 mo), stands (by 10 mo), walks (by 12-18 mo)"
      - kind: check
        question: "An infant sits without support, shows stranger anxiety, but has no pincer grasp and doesn't crawl. Most likely age?"
        options:
          - "6 months"
          - "2 months"
          - "10 months"
          - "12 months"
        answer: 0
        why:
          - "صح: القعدة والـ stranger anxiety بحلول 6 شهور، والحبو (8) والـ pincer (10) لسه."
          - "في الشهرين بيبتسم بس، ولسه ما بيقعدش."
          - "في الـ 10 شهور المفروض عنده pincer grasp وبيحبي."
          - "في السنة بيشاور وبيبتدي يمشي."
        page: 572
        quote: "rolls and sits (by 6 mo)"
      - kind: explain
        title: "الـ toddler: Child Rearing Working"
        text: |-
          - **Motor**: يمشي ماسك في الحاجات وأول خطوات (12 شهر)، يطلع السلم (18)، و ==عدد المكعبات = العمر بالسنين × 3==، ياكل بالشوكة والمعلقة (20)، ويشوط الكورة (24).
          - **Social**: الـ ==parallel play== (24-36)، والـ rapprochement: يبعد عن أمه ويرجعلها (24)، والـ core gender identity (36).
          - **Verbal**: 50-200 كلمة (سنتين)، و300+ كلمة (3 سنين).
        page: 572
        quote: "Recreation—parallel play (by 24-36 mo) Rapprochement—moves away from and returns to parent (by 24 mo)"
      - kind: explain
        title: "الـ preschool: Don't Forget, they're still Learning!"
        text: |-
          - **Drive و Drawings و Dexterity**: tricycle بـ 3 عجلات في 3 سنين، يرسم خط أو دايرة و stick figure (4)، ==يقف على رجل واحدة في 4 سنين== ("4 on one foot")، والزراير والسوست ويهتم بنفسه (5).
          - **Freedom و Friends**: يقضي جزء من اليوم بعيد عن أهله براحته (3)، و ==cooperative play== وأصحاب خياليين (4).
          - **Language و Legends**: بيفهم 1000 كلمة (3 أصفار في 3 سنين)، وجمل كاملة و prepositions (4)، ويحكي قصص بالتفصيل (4).
        page: 572
        quote: "Friends—cooperative play, has imaginary friends (by 4 yr)"
      - kind: table
        title: "اللعب مع الأطفال التانيين"
        columns: ["", "Age", "Type of play"]
        rows:
          - ["Toddler", "24-36 mo", "Parallel play (next to, not with)"]
          - ["Preschool", "4 yr", "Cooperative play; imaginary friends"]
        hide: [[0, 2], [1, 2]]
        page: 572
        quote: "Recreation—parallel play (by 24-36 mo)"
      - kind: try
        items: [psych.L01.029, psych.L01.030, psych.L01.033, psych.L01.034, psych.L01.037]
    recap:
      - "الحزن الطبيعي: مالوش مراحل ثابتة، وممكن يبقى فيه hallucinations للمتوفى، والتأقلم في 6 شهور."
      - "Prolonged grief: 6-12 شهر على الأقل، بيعطّل، ومش متماشي مع الثقافة."
      - "Social smile 2، stranger 6، separation 9 شهور."
      - "المكعبات = العمر × 3. Parallel play 24-36 شهر؛ cooperative play 4 سنين."
      - "4 on one foot؛ 1000 كلمة في 3 سنين."
