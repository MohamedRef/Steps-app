      - kind: explain
        title: "Leukemia ولا lymphoma؟"
        text: |-
          - **Leukemia**: neoplasm (lymphoid أو myeloid) ==منتشر في الـ marrow==، والخلايا غالباً في الدم.
          - **Lymphoma**: ==كتلة== طالعة من الـ lymph nodes.

          الاتنين ممكن يعملوا **B symptoms**: حرارة خفيفة، عرق بالليل، نزول وزن.
        page: 434
        quote: "Lymphoid or myeloid neoplasm with widespread involvement of bone marrow. Tumor cells are usually found in peripheral blood."
      - kind: table
        title: "Hodgkin ولا non-Hodgkin"
        columns: ["", "Hodgkin", "Non-Hodgkin"]
        rows:
          - ["Spread", "One group, contiguous", "Multiple, extranodal, noncontiguous"]
