        text: |-
          - **Acute intermittent porphyria** (PBG deaminase، AD): يتراكم porphobilinogen و ALA. **5 P's**: Painful abdomen، Port wine Pee، Polyneuropathy، Psychological disturbances، و Precipitated بحاجات بتعلّي الـ ALA synthase (CYP450 inducers، alcohol، starvation). العلاج: ==hemin و glucose==.
          - **Porphyria cutanea tarda** (UROD): ==أشهر porphyria==. tea-colored urine، blisters في الجلد مع الشمس و hyperpigmentation، بيزيد مع الـ alcohol، و hepatitis C. العلاج: phlebotomy، تجنب الشمس، hydroxychloroquine.
        page: 430
        quote: "Precipitated by factors that ↑ ALA synthase (eg, drugs [CYP450 inducers], alcohol, starvation) Treatment: hemin and glucose."
      - kind: reveal
        prompt: "ليه الـ glucose والـ hemin بيوقفوا نوبة الـ AIP، والـ starvation بيعملها؟"
        answer: "الـ heme بيعمل negative feedback على الـ ALA synthase (أول خطوة). الـ **hemin** بيوقفها. والـ glucose برضه بيكبتها. الـ starvation والـ CYP450 inducers بيعلّوها ==فيتراكم الـ ALA والـ PBG== قبل الإنزيم الناقص. (الكتاب بيقول إن المرسّبات بتعلّي الـ ALA synthase، والعلاج hemin و glucose.)"
        page: 430
