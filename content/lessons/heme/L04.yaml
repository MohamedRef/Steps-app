    status: unverified
    steps:
      - kind: explain
        title: "von Willebrand disease"
        text: |-
          ==أشهر مرض نزيف وراثي==، وخفيف، وغالباً AD. بيبان بـ menorrhagia أو epistaxis.

          الـ vWF ليه شغلانتين، فلما يقل الاتنين يبوظوا:
          - بيلزّق الـ platelet ← **↑ BT**
          - بيشيل ويحمي الـ factor VIII ← **↑ PTT**

          العلاج: vWF concentrates أو ==desmopressin== (بيطلّع الـ vWF والـ VIII المتخزنين في الـ endothelium).
        page: 433
        quote: "Intrinsic pathway coagulation defect: ↓ quantity/function of vWF → ↑ PTT (vWF carries/protects factor VIII). Defect in platelet plug formation: ↓ vWF → defect in platelet-to-vWF adhesion."
      - kind: explain
        title: "DIC: تجلط ونزيف مع بعض"
        text: |-
          الـ clotting factors بتتنشّط في كل حتة ← جلطات كتير ← ==الـ factors والـ platelets بتخلص== ← نزيف (الدم بينزّ من أماكن الحقن). ممكن acute أو chronic.

          **Labs**: ↓ platelets، ↑ BT، ↑ PT، ↑ PTT، schistocytes، ↑ **D-dimers**، ↓ fibrinogen، ↓ factors V و VIII.
        page: 433
        quote: "Widespread clotting factor activation → thromboembolic state with excessive clotting factor consumption → ↑ thromboses, ↑ hemorrhages (eg, blood oozing from puncture sites)."
