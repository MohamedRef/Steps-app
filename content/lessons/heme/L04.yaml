        quote: "Mechanism: macrophages in spleen clear RBCs. Findings: splenomegaly, spherocytes in peripheral smear (most commonly due to hereditary spherocytosis and autoimmune hemolytic anemia), no hemoglobinuria/hemosiderinuria. Can present with urobilinogen in urine."
      - kind: explain
        title: "Hereditary spherocytosis"
        text: |-
          غالباً AD. عيب في بروتينات بتربط الـ membrane بالـ skeleton (==ankyrin، band 3، protein 4.2، spectrin==). الكرة بتخسر membrane ← صغيرة مدوّرة ← ↑ MCHC ← الـ spleen يشيلها.

          علاماتها: splenomegaly، pigmented gallstones، و aplastic crisis مع parvovirus B19. التشخيص: ↓ fluorescence في الـ **EMA binding test**، و ↑ osmotic fragility. العلاج ==splenectomy==.
        page: 428
        quote: "Due to defect in proteins interacting with RBC membrane skeleton and plasma membrane (eg, ankyrin, band 3, protein 4.2, spectrin)."
      - kind: explain
        title: "PNH: الكرة من غير درع"
        text: |-
          ==PIGA mutation== مكتسبة في الـ stem cell ← مفيش GPI anchor ← مفيش **CD55 (DAF)** ولا **CD59 (MIRL)** اللي بيحموا الكرة من الـ complement ← intravascular hemolysis، خصوصاً بالليل (بول أحمر الصبح).

          **Triad**: Coombs ⊖ hemolysis، pancytopenia، و ==venous thrombosis== (زي Budd-Chiari). مرتبط بالـ aplastic anemia والـ acute leukemias. التشخيص: CD55/59 ⊖ بالـ flow cytometry. العلاج: **eculizumab** (ضد C5).
        page: 428
        quote: "Triad: Coombs ⊖ hemolytic anemia (mainly intravascular), pancytopenia, venous thrombosis (eg, Budd-Chiari syndrome)."
