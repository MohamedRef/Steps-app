  - id: heme.L04.lesson7
    title: "vWD و DIC والـ thrombophilias ونقل الدم"
    hook: "مرض بيعمل نزيف وتجلط في نفس الوقت؟ ده DIC. واللي بيعمل تجلط بس: 4 جينات"
    minutes: 9
