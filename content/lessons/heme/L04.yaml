      - kind: explain
        title: "الـ thrombophilias الوراثية (AD)"
        text: |-
          - **Antithrombin deficiency**: مش بيغيّر الـ PT ولا الـ PTT، بس ==الـ PTT ما بيعلاش كويس بعد الـ heparin==. ممكن يتكسب من الـ nephrotic syndrome (بيضيع في البول).
          - **Factor V Leiden**: Arg506Gln ← factor V مش بيتكسر بالـ activated protein C ← DVT، cerebral vein thrombosis، إجهاض متكرر.
          - **Protein C أو S deficiency**: ↓ تعطيل Va و VIIIa، و ==↑ warfarin-induced skin necrosis==. الكتاب: protein C Cancels و protein S Stops.
          - **Prothrombin G20210A**: mutation في الـ 3′ UTR ← prothrombin زيادة ← جلطات وريدية.
        page: 433
