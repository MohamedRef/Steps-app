      - kind: explain
        title: "الـ PT والـ PTT والـ mixing"
        text: |-
          - **PT**: extrinsic + common (I، II، V، VII، X): ==Play Tennis outside==. والـ **INR** = PT المريض / PT الـ control، وده اللي بنتابع بيه الـ warfarin.
          - **PTT**: intrinsic + common (كله ما عدا VII و XIII): ==Play Table Tennis inside==.
          - **TT**: سرعة fibrinogen ← fibrin.

          **Mixing study**: نضيف plasma طبيعي. لو ==اتصلّح== يبقى نقص factor. لو ما اتصلّحش يبقى inhibitor (غالباً ضد factor VIII).
        page: 431
        quote: "Diagnosed with a mixing study, in which normal plasma is added to patient’s plasma. Clotting factor deficiencies should correct (the PT or PTT returns to within the appropriate normal range), whereas factor inhibitors will not correct."
      - kind: explain
        title: "Hemophilia و vitamin K"
        text: |-
          - **Hemophilia** A (VIII، XR، «hemophilia Ate»)، B (IX، XR)، C (XI، AR): PTT ↑ بس. نزيف في المفاصل (==hemarthrosis==) وبعد الجراحة والأسنان. العلاج: A: desmopressin، factor VIII، **emicizumab**؛ B: factor IX؛ C: factor XI.
          - **Vitamin K deficiency**: PT و PTT ↑، و bleeding time طبيعي.
        page: 431
        quote: "Hemorrhage in hemophilia—hemarthroses (bleeding into joints, eg, knee A ), easy bruising, bleeding after trauma or surgery (eg, dental procedures)."
      - kind: check
        question: "Prolonged PTT that does not correct after mixing with normal plasma. What does it mean?"
        options:
          - "A factor inhibitor"
          - "Hemophilia A"
          - "Vitamin K deficiency"
          - "Factor VII deficiency"
        answer: 0
        why:
