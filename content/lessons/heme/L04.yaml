          - ["Cells", "Reed-Sternberg", "Mostly B cells"]
          - ["Age", "Bimodal: young, > 55", "Children and adults"]
          - ["Associations", "EBV", "Autoimmune, HIV, EBV, HTLV"]
        hide: [[0, 1], [2, 1], [2, 2]]
        page: 434
        quote: "Localized, single group of nodes with contiguous spread (stage is strongest predictor of prognosis). Better prognosis."
      - kind: explain
        title: "Reed-Sternberg: عينين البومة"
        text: |-
          B cell كبيرة، nucleus بفصّين متطابقين، و nucleoli واضحة ==«owl eyes»==. عليها **CD15** و **CD30**. الكتاب: 2 owl eyes × 15 = 30.

          الأنواع:
          - **Nodular sclerosis**: ==الأشهر==
          - **Mixed cellularity**: eosinophilia
          - **Lymphocyte rich**: أحسن prognosis (الغني حسابه في البنك أحسن)
          - **Lymphocyte depleted**: أوحش prognosis
        page: 434
        quote: "Contains Reed Sternberg cells: large B cells with a bilobed nucleus, 2 mirrored halves, and prominent nucleoli (“owl eyes” A ). RS cells are CD15+ and CD30+ B-cell origin. 2 owl eyes × 15 = 30."
      - kind: check
        question: "Large binucleate 'owl-eye' cells in a lymph node. Which markers?"
        options:
