          - **Essential thrombocythemia**: platelets كتير جداً: نزيف وجلطات.
          - **Myelofibrosis**: megakaryocytes ← TGF-β ← fibrosis: ==massive splenomegaly== و teardrop cells و dry tap.
          - الـ **CML** هو الوحيد ⊕ للـ Philadelphia وسلبي للـ JAK2.
        page: 438
        quote: "Disorder of ↑ RBCs, usually due to acquired JAK2 mutation. May present as intense itching after shower (aquagenic pruritus)."
