  - id: heme.L04.lesson4
    title: "الـ macrocytic والـ normocytic اللي مش hemolytic"
    hook: "B12 ولا folate؟ والـ marrow فاضي ولا مخنوق؟ سؤالين بيحلوا نص الأسئلة"
    minutes: 10
    pages: [426, 427]
    topics: [macrocytic-anemias, nonhemolytic-normocytic-anemias]
    goals:
      - "تفرّق بين الـ B12 والـ folate deficiency"
