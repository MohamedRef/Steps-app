        alt: "Two columns. Intravascular: the red cell bursts in the vessel (prosthetic valve, PNH, microangiopathic hemolysis), free hemoglobin binds haptoglobin so haptoglobin falls, excess hemoglobin reaches the kidneys giving hemoglobinuria, plus hemosiderinuria and schistocytes. Extravascular: a splenic macrophage eats the red cell, making unconjugated bilirubin, which goes to the liver and gut, with urobilinogen in urine, splenomegaly and spherocytes but no hemoglobinuria."
