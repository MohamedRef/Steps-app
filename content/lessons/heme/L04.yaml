      - kind: explain
        title: "الـ translocations والـ Langerhans"
        text: |-
          الـ Ig heavy chain على chromosome ==14== شغال على طول. أي gene يتنقل جنبه بيشتغل زيادة:
          - t(8;14) Burkitt (c-myc) — «Burk-8»
