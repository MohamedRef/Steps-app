    status: unverified
    steps:
      - kind: explain
        title: "Megaloblastic: الـ nucleus متأخر"
        text: |-
          الـ DNA مش بيتعمل كويس، فالـ ==nucleus بيكبر أبطأ من الـ cytoplasm==. النتيجة: كرات كبيرة (macrocytosis)، hypersegmented neutrophils، و glossitis.

          الأسباب: B12، folate، وأدوية: hydroxyurea، phenytoin، methotrexate، sulfa، و metformin لمدة طويلة.
        page: 426
        quote: "Impaired DNA synthesis → maturation of nucleus of precursor cells in bone marrow delayed relative to maturation of cytoplasm."
      - kind: table
        title: "Folate ولا B12؟"
        columns: ["", "Folate", "B12"]
        rows:
          - ["Homocysteine", "↑", "↑"]
          - ["Methylmalonic acid", "Normal", "↑"]
          - ["Neuro symptoms", "No", "Yes (dementia, subacute combined degeneration)"]
          - ["Low intake → anemia in", "Weeks to months", "Years (liver stores)"]
        hide: [[1, 1], [1, 2], [2, 2], [3, 2]]
        page: 426
        quote: "↑ homocysteine, normal methylmalonic acid. No neurologic symptoms (vs B12 deficiency)."
      - kind: reveal
        prompt: "ليه الـ B12 بس اللي بيعمل أعراض أعصاب؟"
        answer: "لأن الـ B12 داخل في ==fatty acid pathways و myelin synthesis==، فنقصه بيبوّظ الـ myelin في الـ dorsal columns والـ lateral corticospinal والـ spinocerebellar tracts (subacute combined degeneration). والـ folate مالوش الدور ده."
        page: 426
        quote: "subacute combined degeneration (due to involvement of B12 in fatty acid pathways and myelin synthesis): spinocerebellar tract, lateral corticospinal tract, dorsal column dysfunction."
      - kind: aside
        tone: trap
        text: "لو اديت ==folate لمريض B12 deficiency==، الـ anemia هتتحسن بس الأعصاب ==هتسوء==. اتأكد من الـ B12 الأول."
        page: 426
        quote: "Folate supplementation in vitamin B12 deficiency can correct the anemia, but worsens neurologic symptoms."
      - kind: explain
        title: "الأسباب"
        text: |-
          - **Folate**: سوء تغذية (alcohol)، malabsorption، أدوية (methotrexate، trimethoprim، phenytoin)، احتياج زايد (hemolysis، حمل).
          - **B12**: ==pernicious anemia==، malabsorption (Crohn)، pancreatic insufficiency، gastrectomy، vegan، و **Diphyllobothrium latum** (fish tapeworm). زمان كان بيتشخّص بالـ Schilling test.
        page: 426
        quote: "Causes: pernicious anemia, malabsorption (eg, Crohn disease), pancreatic insufficiency, gastrectomy, insufficient intake (eg, veganism), Diphyllobothrium latum (fish tapeworm)."
      - kind: check
        question: "Megaloblastic anemia with ↑ homocysteine and normal methylmalonic acid, no neurologic signs. Deficiency?"
        options:
          - "Folate"
          - "Vitamin B12"
          - "Iron"
          - "Vitamin B6"
        answer: 0
        why:
          - "صح: الـ MMA الطبيعي بيستبعد الـ B12."
          - "الـ B12 بيعلّي الـ MMA كمان."
          - "الـ iron بيعمل microcytic."
          - "الـ B6 نقصه بيعمل sideroblastic."
        page: 426
        quote: "↑ homocysteine, normal methylmalonic acid."
      - kind: explain
        title: "اتنين نادرين بيتسألوا"
        text: |-
          - **Orotic aciduria**: نقص ==UMP synthase== (AR)، فالـ orotic acid ما يتحوّلش لـ UMP. طفل عنده failure to thrive و megaloblastic anemia ==ما بتردش على B12 ولا folate==، و orotic acid في البول، ومن غير hyperammonemia (عكس OTC deficiency). العلاج uridine monophosphate أو uridine triacetate.
          - **Diamond-Blackfan**: pure red cell aplasia خلقية في أول سنة، ↑ % HbF، وممكن triphalangeal thumbs وقصر. الكتاب: «A pure Diamond causes pure red cell aplasia».
          - **Nonmegaloblastic**: alcohol و liver disease: كرات كبيرة من غير hypersegmented neutrophils.
        page: 426
        quote: "Inability to convert orotic acid to UMP (de novo pyrimidine synthesis pathway) because of defect in UMP synthase."
      - kind: explain
        title: "Anemia of chronic disease: الـ hepcidin بيقفل الباب"
        text: |-
          الـ inflammation (↑ IL-6) ← الـ liver يعمل ==hepcidin== ← يمسك الـ **ferroportin** على خلايا الأمعاء والـ macrophages ويقفله. فالحديد ما يطلعش من الـ macrophages وما يتمصّش من الأمعاء.

          بيحصل مع infections مزمنة، cancer، CKD، autoimmune (SLE، RA). الـ labs: ↓ iron، ↓ TIBC، ↑ ferritin. العلاج: نعالج السبب، نقل دم بحساب، و EPO (زي في الـ CKD).
        page: 427
        quote: "Inflammation (eg, ↑ IL-6) → ↑ hepcidin (released by liver, binds ferroportin on intestinal mucosal cells and macrophages, thus inhibiting iron transport)"
      - kind: figure
        title: "الـ hepcidin والـ ferroportin"
