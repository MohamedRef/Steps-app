        text: |-
          أي hemolysis بيعلّي ==LDH و reticulocytes و unconjugated bilirubin==، وممكن pigmented gallstones و urobilinogen في البول.

          - **Intravascular** (جوه الأوعية): الـ hemoglobin الحر بيمسك الـ haptoglobin (فـ ==↓ haptoglobin==)، و schistocytes، و hemoglobinuria و hemosiderinuria. أمثلة: valve، PNH، MAHA.
          - **Extravascular** (الـ spleen): splenomegaly، spherocytes، ومن غير hemoglobinuria. أمثلة: HS و AIHA.
        page: 427
        quote: "Findings: ↓ haptoglobin, ↑ schistocytes on blood smear. Characteristic hemoglobinuria, hemosiderinuria, and urobilinogen in urine."
