      - kind: explain
        title: "Aplastic anemia: الـ marrow فاضي"
        text: |-
          الـ stem cells فشلت أو اتدمرت. الأسباب (الكتاب: «reducing volume from inside diaphysis»):

          - **R**adiation
          - **V**iral (EBV، HIV، hepatitis)
          - **F**anconi anemia (AR DNA repair defect: قصر، café-au-lait، عيوب الإبهام/الـ radius، ميل للأورام)
          - **I**diopathic (immune، ممكن بعد acute hepatitis)
          - **D**rugs (benzene، chloramphenicol، alkylating agents، antimetabolites)

          النتيجة: ==pancytopenia== (مش anemia بس زي الـ aplastic crisis)، ↓ reticulocytes، ↑ EPO، وmarrow ==hypocellular مليان دهون==. العلاج: نشيل السبب، immunosuppression (antithymocyte globulin، cyclosporine)، marrow transplant، نقل دم، و GM-CSF.
        page: 427
        quote: "Pancytopenia characterized by anemia, leukopenia, and thrombocytopenia (vs aplastic crisis, which causes anemia only). Normal cell morphology, but hypocellular bone marrow with fatty infiltration"
