        title: "MDS: الـ marrow شغال غلط"
        text: |-
          stem cell disorder: الـ hematopoiesis ==ineffective==، والخلايا (غير الـ lymphoid) ما بتنضجش. الـ blasts في الـ marrow ==< 20%== (لو > 20% يبقى AML). من mutations أو radiation أو benzene أو chemo، في الكبار، وممكن يتحول لـ AML.

          علامة في الـ smear: **pseudo-Pelger-Huët**: neutrophils بـ nucleus بفصّين (duet).
        page: 436
        quote: "Stem cell disorders involving ineffective hematopoiesis → defects in cell maturation of nonlymphoid lineages. Bone marrow blasts <20% (vs >20% in AML)."
      - kind: table
        title: "الـ leukemias"
        columns: ["", "Who", "Clue", "Note"]
        rows:
          - ["ALL", "Children, Down", "TdT+, CD10+", "CNS and testes; t(12;21) good, t(9;22) bad"]
          - ["CLL/SLL", "> 60", "CD20, CD23, CD5; smudge cells", "AIHA; Richter → DLBCL"]
          - ["Hairy cell", "Adult males", "TRAP+, BRAF; dry tap", "Massive spleen; cladribine"]
