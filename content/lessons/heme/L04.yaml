          - ["Seen in", "SLE, CLL, β-lactams, α-methyldopa", "CLL, Mycoplasma, mononucleosis"]
          - ["Treatment", "Steroids, rituximab, splenectomy", "Cold avoidance, rituximab"]
        hide: [[0, 1], [0, 2], [2, 2]]
        page: 429
        quote: "Cold AIHA–acute anemia in which primarily IgM + complement cause RBC agglutination and extravascular and intravascular hemolysis upon exposure to cold → painful, blue fingers and toes."
      - kind: explain
        title: "باقي الـ extrinsic"
        text: |-
          - **Drug-induced**: spherocytes = immune، bite cells = oxidative. أدوية زي penicillins، cephalosporins، NSAIDs، chemo.
          - **Microangiopathic**: الكرة بتتقطع في أوعية ضيقة (DIC، TTP/HUS، SLE، HELLP، hypertensive emergency) ← ==schistocytes==.
          - **Macroangiopathic**: prosthetic valves و aortic stenosis.
          - **Infections**: malaria، Babesia.
        page: 429
        quote: "Seen in DIC, TTP/HUS, SLE, HELLP syndrome, hypertensive emergency."
      - kind: explain
        title: "الـ leukopenias والـ steroids"
        text: |-
          - **Neutropenia**: ANC < 1500 (العدوى الشديدة < 500).
          - **Lymphopenia**: < 1500 (< 3000 في الأطفال): HIV، DiGeorge، SCID، SLE، steroids.
          - **Eosinopenia**: < 30: Cushing و steroids.

          والـ **glucocorticoids** بتعمل حاجة غريبة: ==neutrophilia== (بتمنع الـ neutrophils تلزق وتطلع من الأوعية)، بس eosinopenia (بتحبسهم في الـ lymph nodes) و lymphopenia (apoptosis).
        page: 429
        quote: "Glucocorticoids ↓ activation of neutrophil adhesion molecules, impairing migration out of the vasculature to sites of inflammation. In contrast, glucocorticoids sequester eosinophils in lymph nodes and cause apoptosis of lymphocytes."
