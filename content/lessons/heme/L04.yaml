schema: steps.lesson/v1
lecture: heme.L04
lessons:
  - id: heme.L04.lesson1
    title: "اقرا الـ smear: أشكال الكرات الحمرا واللي جواها"
    hook: "كل شكل غريب في الـ smear بيقولك اسم المرض. اتعلم تسمعه"
    minutes: 9
    pages: [420, 421]
    topics: [rbc-morphology, rbc-inclusions]
    goals:
      - "تربط كل شكل RBC بمرضه"
      - "تفرّق بين الـ inclusions اللي فيها iron واللي مفيهاش"
    status: unverified
    steps:
      - kind: explain
        title: "الشكل بيحكي الحكاية"
        text: |-
          الكرة الحمرا الطبيعية قرص مقعّر. أي تغيير في الشكل بيقولك حصل لها إيه:

          - ==Schistocytes== (helmet cells): اتقطّعت ميكانيكياً في وعاء ضيق أو على صمام: DIC، TTP/HUS، HELLP، prosthetic valve.
          - **Dacrocytes** (teardrop): اتعصرت وهي خارجة من marrow مليان fibrosis أو infiltration، فـ«بتعيط».
          - **Degmacytes** (bite cells): الـ spleen قضم منها الـ Heinz bodies: G6PD deficiency.
          - **Spherocytes**: صغيرة مدوّرة من غير central pallor (↓ surface area/volume): hereditary spherocytosis و AIHA.
        page: 420
        quote: "Schistocytes D (“helmet” cells) Microangiopathic hemolytic anemia (eg, DIC, TTP/HUS, HELLP syndrome), mechanical hemolysis (eg, heart valve prosthesis)"
      - kind: table
        title: "باقي الأشكال"
        columns: ["Cell", "Think of"]
        rows:
          - ["Acanthocytes (spur, irregular)", "Liver disease, abetalipoproteinemia, vitamin E deficiency"]
          - ["Echinocytes (burr, even)", "Liver disease, ESRD, pyruvate kinase deficiency"]
          - ["Elliptocytes", "Hereditary elliptocytosis (spectrin)"]
          - ["Macro-ovalocytes", "Megaloblastic anemia"]
          - ["Target cells", "HbC, Asplenia, Liver disease, Thalassemia"]
          - ["Sickle cells", "Sickle cell anemia"]
        hide: [[0, 1], [1, 1], [4, 1]]
        page: 420
        quote: "Acanthocytes A (“spur cells”) Liver disease, abetalipoproteinemia, vitamin E deficiency"
      - kind: aside
        tone: tip
        text: "**acanthocytes** ==asymmetric== (الشوك بأحجام مختلفة)، و**echinocytes** ==even== (الشوك صغير ومنتظم). وللـ target cells جملة الكتاب: «HALT» said the hunter to his target."
        page: 420
        quote: "HbC disease, Asplenia, Liver disease, Thalassemia “HALT,” said the hunter to his target"
      - kind: check
        question: "A smear shows fragmented 'helmet' red cells. Which condition fits best?"
        options:
          - "Hemolytic-uremic syndrome"
          - "Hereditary spherocytosis"
          - "Myelofibrosis"
          - "Abetalipoproteinemia"
        answer: 0
        why:
          - "صح: الـ schistocytes علامة microangiopathic hemolysis زي TTP/HUS و DIC."
          - "دي spherocytes."
          - "دي dacrocytes (teardrop)."
          - "دي acanthocytes."
        page: 420
        quote: "Microangiopathic hemolytic anemia (eg, DIC, TTP/HUS, HELLP syndrome)"
      - kind: figure
        title: "اللي جوه الكرة"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-box" cx="50" cy="50" r="30"/>
            <circle class="fg-dot-acc" cx="62" cy="40" r="6"/>
            <text x="14" y="100" class="t-sm t-b">Howell-Jolly</text>
            <text x="14" y="116" class="t-sm t-mut">no iron</text>
            <circle class="fg-box" cx="140" cy="50" r="30"/>
            <circle class="fg-dot-acc" cx="128" cy="40" r="2"/><circle class="fg-dot-acc" cx="145" cy="35" r="2"/><circle class="fg-dot-acc" cx="150" cy="55" r="2"/><circle class="fg-dot-acc" cx="132" cy="60" r="2"/><circle class="fg-dot-acc" cx="140" cy="48" r="2"/>
            <text x="98" y="100" class="t-sm t-b">Basophilic stippling</text>
            <text x="98" y="116" class="t-sm t-mut">no iron</text>
            <circle class="fg-box" cx="230" cy="50" r="30"/>
            <circle class="fg-dot-bad" cx="220" cy="62" r="3"/><circle class="fg-dot-bad" cx="226" cy="66" r="3"/>
            <text x="190" y="100" class="t-sm t-b">Pappenheimer</text>
            <text x="190" y="116" class="t-sm t-bad">iron</text>
            <circle class="fg-box" cx="315" cy="50" r="30"/>
            <circle class="fg-dot-bad" cx="300" cy="36" r="5"/><circle class="fg-dot-bad" cx="330" cy="62" r="5"/>
            <text x="290" y="100" class="t-sm t-b">Heinz</text>
            <text x="290" y="116" class="t-sm t-bad">iron</text>
            <text x="14" y="146" class="t-sm">Red = contains iron.</text><text x="14" y="164" class="t-sm">Ringed sideroblasts (marrow) need Prussian blue.</text>
          </svg>
        caption: "الـ Howell-Jolly والـ stippling مفيهمش iron. الـ Pappenheimer (sideroblastic) والـ Heinz (G6PD) فيهم iron."
        alt: "Four red cells. Howell-Jolly body, one round dot, no iron. Basophilic stippling, many fine dots, no iron. Pappenheimer bodies, a few granules containing iron. Heinz bodies, peripheral clumps containing iron."
        page: 421
        quote: "Pappenheimer bodies Sideroblastic anemias Basophilic granules (contain iron)"
      - kind: explain
        title: "الـ inclusions"
        text: |-
          - **Ringed sideroblasts** (في الـ marrow): mitochondria مليانة iron حوالين الـ nucleus، محتاجة ==Prussian blue==: sideroblastic anemias (lead، MDS، alcohol).
          - **Howell-Jolly bodies**: بقايا nucleus، والـ spleen بيشيلها عادةً. لو شفتها يبقى ==مفيش spleen شغال== (asplenia أو sickle cell).
          - **Basophilic stippling**: ribosomes متجمعة: sideroblastic و thalassemia.
          - **Heinz bodies**: hemoglobin متكسّر (supravital stain زي crystal violet)، والـ spleen بيقضمها ← bite cells: G6PD.
        page: 421
        quote: "Howell-Jolly bodies B Functional hyposplenia (eg, sickle cell disease), asplenia Basophilic nuclear remnants (do not contain iron) Usually removed by splenic macrophages"
      - kind: aside
        tone: joke
        text: "الكتاب بيقولها: الـ spleen بياخد ==bite of Heinz ketchup==، فتطلع الـ bite cells. والـ Pappenheimer اسمها «Pappen-hammer»: حبوب iron صلبة زي المسامير."
        page: 421
        quote: "Phagocytic removal of Heinz bodies → bite cells (take a bite of Heinz [ketchup])"
      - kind: check
        question: "Which RBC inclusion means the spleen is absent or not working?"
        options:
          - "Howell-Jolly bodies"
          - "Heinz bodies"
          - "Ringed sideroblasts"
          - "Basophilic stippling"
        answer: 0
        why:
          - "صح: الـ spleen بيشيل بقايا الـ nucleus، فوجودها = hyposplenia أو asplenia."
          - "الـ Heinz bodies علامة oxidative damage (G6PD)."
          - "الـ ringed sideroblasts في الـ marrow في الـ sideroblastic anemia."
          - "الـ stippling في sideroblastic و thalassemia و lead."
        page: 421
        quote: "Howell-Jolly bodies B Functional hyposplenia (eg, sickle cell disease), asplenia"
      - kind: try
        items: [heme.L04.001, heme.L04.003, heme.L04.006, heme.L04.007]
    recap:
      - "Schistocytes = microangiopathic أو mechanical. Dacrocytes = marrow infiltration. Bite cells = G6PD. Spherocytes = HS أو AIHA."
      - "Target cells = HALT. Acanthocytes asymmetric، echinocytes even."
      - "Howell-Jolly = مفيش spleen. Heinz و Pappenheimer فيهم iron."
    practice: [heme.L04.001, heme.L04.002, heme.L04.003, heme.L04.004, heme.L04.005, heme.L04.006, heme.L04.007, heme.L04.008, heme.L04.009]
  - id: heme.L04.lesson2
    title: "أي anemia: ابدأ بالـ MCV والـ reticulocytes والـ iron studies"
    hook: "3 أرقام بس بيحطوا أي anemia في خانتها"
    minutes: 9
    pages: [422, 423]
    topics: [anemias, reticulocyte-production-index, mentzer-index, interpretation-of-iron-studies]
    goals:
      - "تقسّم الـ anemia بالـ MCV"
      - "تستخدم الـ RPI والـ Mentzer index"
      - "تقرا الـ iron studies"
    status: unverified
    steps:
      - kind: explain
        title: "الـ MCV أول سؤال"
        text: |-
          - **Microcytic** (< 80 fL): الـ ==hemoglobin== هو اللي باظ: **TAIL** = Thalassemias، Anemia of chronic disease، Iron deficiency (late)، Lead poisoning.
          - **Macrocytic** (> 100 fL): الـ ==DNA== هو اللي باظ: megaloblastic (folate، B12، orotic aciduria، Fanconi) أو nonmegaloblastic (Diamond-Blackfan، liver disease، alcohol).
          - **Normocytic** (80-100): نشوف الـ reticulocytes: واطيين = nonhemolytic، عاليين = hemolytic.
        page: 422
        quote: "Hemoglobin affected (TAIL) Defective globin chain: •Thalassemias Defective heme synthesis: •Anemia of chronic disease •Iron deﬁciency (late) •Lead poisoning"
      - kind: figure
        title: "الشجرة"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="140" y="5" width="80" height="24" rx="6"/>
            <text x="158" y="22" class="t-sm t-b">Anemia</text>
            <line class="fg-arrow" x1="160" y1="29" x2="60" y2="50"/>
            <line class="fg-arrow" x1="180" y1="29" x2="180" y2="50"/>
            <line class="fg-arrow" x1="200" y1="29" x2="300" y2="50"/>
            <rect class="fg-acc" x="5" y="50" width="110" height="40" rx="6"/>
            <text x="12" y="66" class="t-sm t-b">Microcytic &lt;80</text>
            <text x="12" y="82" class="t-sm">TAIL</text>
            <rect class="fg-box" x="125" y="50" width="110" height="40" rx="6"/>
            <text x="132" y="66" class="t-sm t-b">Normocytic</text>
            <text x="132" y="82" class="t-sm">80-100</text>
            <rect class="fg-good" x="245" y="50" width="110" height="40" rx="6"/>
            <text x="252" y="66" class="t-sm t-b">Macrocytic &gt;100</text>
            <text x="252" y="82" class="t-sm">DNA affected</text>
            <line class="fg-arrow" x1="160" y1="90" x2="110" y2="115"/>
            <line class="fg-arrow" x1="200" y1="90" x2="250" y2="115"/>
            <rect class="fg-box" x="40" y="115" width="140" height="40" rx="6"/>
            <text x="48" y="131" class="t-sm t-b">Nonhemolytic</text>
            <text x="48" y="147" class="t-sm">low reticulocytes</text>
            <rect class="fg-bad" x="190" y="115" width="140" height="40" rx="6"/>
            <text x="198" y="131" class="t-sm t-b">Hemolytic</text>
            <text x="198" y="147" class="t-sm">intrinsic / extrinsic</text>
          </svg>
        caption: "الـ MCV بيقسم لـ 3، والـ normocytic بيتقسم تاني بالـ reticulocytes، والـ hemolytic لـ intrinsic أو extrinsic للكرة."
        alt: "Decision tree. Anemia splits by MCV into microcytic under 80 (TAIL), normocytic 80 to 100, and macrocytic over 100 (DNA affected). Normocytic splits into nonhemolytic with low reticulocytes and hemolytic, intrinsic or extrinsic."
        page: 422
        quote: "Nonhemolytic (low reticulocyte index) Hemolytic (high reticulocyte index) Intrinsic Extrinsic"
      - kind: reveal
        prompt: "ليه الـ iron deficiency بيظهر normocytic الأول وبعدين microcytic؟"
        answer: "في الأول الكرات القديمة لسه حجمها طبيعي والجديدة لسه بتبتدي تصغر، فالـ MCV لسه طبيعي (**early = normocytic**). مع الوقت كل الكرات تبقى من الإنتاج الناقص ← **late = microcytic**. نفس الحكاية في الـ anemia of chronic disease."
        page: 422
        quote: "•Iron deﬁciency (early) •Anemia of chronic disease •Aplastic anemia •Chronic kidney disease •Acute blood loss (hemorrhage)"
      - kind: explain
        title: "الـ RPI: هل الـ marrow بيرد صح؟"
        text: |-
          الـ reticulocyte % بيطلع ==أعلى من الحقيقة== في الـ anemia، لأن عدد الكرات الكلي قليل. فبنصححه:

          **RPI = % reticulocytes × (actual Hct / normal Hct) / maturation time**

          - **RPI > 3**: الـ marrow بيعوّض (زي الـ hemolysis أو النزيف).
          - **RPI < 2**: الرد ==مش كفاية== (مشكلة في الإنتاج).
        page: 423
        quote: "High RPI (>3) indicates compensatory RBC production; low RPI (<2) indicates inadequate response to correct anemia."
      - kind: explain
        title: "الـ Mentzer index: thalassemia ولا iron؟"
        text: |-
          **Mentzer = MCV / RBC count**.

          - **< 13**: ==thalassemia trait== (الكرات صغيرة بس كتير).
          - **> 13**: **iron deficiency** (الكرات صغيرة وقليلة).
        page: 423
        quote: "An index of less than 13 suggests thalessemia trait. An increased index (>13) suggests iron deficiency anemia."
      - kind: check
        question: "MCV 66 fL, RBC count 6.0 million/mm3 (Mentzer 11). Most likely?"
        options:
          - "Thalassemia trait"
          - "Iron deficiency anemia"
          - "Anemia of chronic disease"
          - "Aplastic anemia"
        answer: 0
        why:
          - "صح: Mentzer أقل من 13 = thalassemia trait."
          - "الـ iron deficiency Mentzer بتاعه أكتر من 13."
          - "الـ chronic disease غالباً normocytic، ومش بيعلّي عدد الكرات."
          - "الـ aplastic anemia normocytic مع pancytopenia."
        page: 423
        quote: "Used to differentiate between thalassemia trait and iron deficiency anemia. An index of less than 13 suggests thalessemia trait."
      - kind: table
        title: "الـ iron studies"
        columns: ["", "Iron deficiency", "Chronic disease", "Hemochromatosis", "Pregnancy/OCP"]
        rows:
          - ["Serum iron", "↓", "↓", "↑", "—"]
          - ["TIBC (transferrin)", "↑", "↓", "↓", "↑"]
          - ["Ferritin", "↓", "↑", "↑", "—"]
          - ["% saturation", "↓↓", "—/↓", "↑↑", "↓"]
        hide: [[1, 1], [2, 1], [1, 2], [2, 2]]
        page: 423
        quote: "Serum iron ↓ ↓ ↑ — Transferrin or TIBC ↑ ↓a ↓ ↑ Ferritin ↓ ↑ ↑ —"
      - kind: reveal
        prompt: "في الـ anemia of chronic disease الحديد قليل في الدم بس الـ ferritin عالي. ليه الجسم بيعمل كده؟"
        answer: "الكتاب بيقول: البكتيريا محتاجة الـ iron اللي في الدم عشان تعيش. فالجسم في الـ inflammation ==بيخبّي الحديد جوه الخلايا== (ferritin عالي)، ويقلّل الـ transferrin (TIBC واطي)، عشان الـ pathogens ما تلاقيش حديد."
        page: 423
        quote: "Evolutionary reasoning—pathogens use circulating iron to thrive. The body has adapted a system in which iron is stored within the cells of the body and prevents pathogens from acquiring circulating iron."
      - kind: check
        question: "Low serum iron, low TIBC, high ferritin. Which diagnosis?"
        options:
          - "Anemia of chronic disease"
          - "Iron deficiency"
          - "Hemochromatosis"
          - "Pregnancy"
        answer: 0
        why:
          - "صح: الحديد متخبّي في الخلايا (ferritin عالي) والـ TIBC واطي."
          - "الـ iron deficiency الـ ferritin واطي والـ TIBC عالي."
          - "الـ hemochromatosis الحديد في الدم عالي."
          - "الحمل بيعلّي الـ TIBC."
        page: 423
        quote: "Ferritin—1° iron storage protein of body."
      - kind: try
        items: [heme.L04.011, heme.L04.015, heme.L04.018, heme.L04.020]
    recap:
      - "Microcytic = TAIL (الـ hemoglobin)، macrocytic = الـ DNA، normocytic = شوف الـ reticulocytes."
      - "RPI > 3 تعويض، < 2 رد ضعيف."
      - "Mentzer < 13 thalassemia trait، > 13 iron deficiency."
      - "Iron deficiency: ferritin ↓ و TIBC ↑. Chronic disease: ferritin ↑ و TIBC ↓."
    practice: [heme.L04.010, heme.L04.011, heme.L04.012, heme.L04.013, heme.L04.014, heme.L04.015, heme.L04.016, heme.L04.017, heme.L04.018, heme.L04.019, heme.L04.020, heme.L04.021, heme.L04.022, heme.L04.023, heme.L04.191]
  - id: heme.L04.lesson3
    title: "الـ microcytic: iron، thalassemia، lead، sideroblastic"
    hook: "الأربعة بيوصلوا لنفس الكرة الصغيرة، بس كل واحد من باب مختلف"
    minutes: 10
    pages: [424, 425]
    topics: [microcytic-hypochromic-anemias]
    goals:
      - "تعرف أسباب وعلامات الـ iron deficiency و Plummer-Vinson"
      - "تعدّ الـ α و β genes وتعرف كل عدد بيعمل إيه"
      - "تعرف الـ lead poisoning (LLEEAAD) والـ sideroblastic anemia وعلاجهم"
    status: unverified
    steps:
      - kind: explain
        title: "Iron deficiency"
        text: |-
          الحديد بيقل من ==نزيف مزمن== (GI، دورة شديدة)، سوء تغذية، مشاكل امتصاص، جراحة (gastrectomy)، أو احتياج زايد (الحمل). من غير حديد، آخر خطوة في تصنيع الـ heme بتقف.

          **Labs**: ↓ iron، ↑ TIBC، ↓ ferritin، ↑ free erythrocyte protoporphyrin، ↑ RDW، ↓ RI. الكرات صغيرة وباهتة (↑ central pallor).

          **الأعراض**: fatigue، conjunctival pallor، restless legs، **pica**، spoon nails (koilonychia)، glossitis، cheilosis.
        page: 424
        quote: "Labs: ↓ iron, ↑ TIBC, ↓ ferritin, ↑ free erythrocyte protoporphyrin, ↑ RDW, ↓ RI."
      - kind: aside
        tone: exam
        text: "ست عندها anemia وبتشتكي إن الأكل الناشف بيقف في زورها، وفي الـ barium web في الـ esophagus؟ ده ==Plummer-Vinson syndrome==: iron deficiency + esophageal webs + dysphagia."
        page: 424
        quote: "Plummer-Vinson syndrome (triad of iron deficiency anemia, esophageal webs, and dysphagia)."
      - kind: explain
        title: "α-thalassemia: عُدّ الـ genes"
        text: |-
          عندك ==4 α genes== على chromosome 16 (αα/αα). الـ deletion ممكن يبقى cis (على نفس الـ chromosome) أو trans. وبيكتر في الأصول الآسيوية والأفريقية، وبيعمل target cells، وغالباً ==عدد الكرات بيعلى== (عكس الـ iron deficiency).

          - **1 مشال**: minima، silent carrier
          - **2**: minor، anemia خفيفة
          - **3**: **HbH disease**: الـ β الزيادة تعمل β4، anemia متوسطة لشديدة
          - **4**: **Hb Barts**: مفيش α خالص، الـ γ تعمل γ4 ← ==hydrops fetalis==
        page: 424
        quote: "α-globin gene deletions on chromosome 16 → ↓ α-globin synthesis. May have cis deletion (deletions occur on same chromosome) or trans deletion (deletions occur on separate chromosomes). Normal is αα/αα."
      - kind: figure
        title: "كام gene شغال؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-b">α genes deleted</text>
            <rect class="fg-good" x="10" y="30" width="80" height="60" rx="6"/>
            <text x="20" y="52" class="t-sm t-b">1</text>
            <text x="20" y="72" class="t-sm">silent</text>
            <rect class="fg-box" x="97" y="30" width="80" height="60" rx="6"/>
            <text x="107" y="52" class="t-sm t-b">2</text>
            <text x="107" y="72" class="t-sm">minor</text>
            <rect class="fg-acc" x="184" y="30" width="80" height="60" rx="6"/>
            <text x="194" y="52" class="t-sm t-b">3</text>
            <text x="194" y="72" class="t-sm">HbH (β4)</text>
            <rect class="fg-bad" x="271" y="30" width="80" height="60" rx="6"/>
            <text x="281" y="52" class="t-sm t-b">4</text>
            <text x="281" y="72" class="t-sm">Barts (γ4)</text>
            <text x="10" y="120" class="t-sm t-b">β-thalassemia</text>
            <text x="10" y="140" class="t-sm">1 mutated: minor (↑ HbA2)</text>
            <text x="10" y="158" class="t-sm">β0/β0: major (Cooley), transfusions</text>
          </svg>
        caption: "كل ما الـ genes الشغالة تقل، الـ anemia تتقل. في الـ α، الـ chains الزيادة (β أو γ) بتعمل tetramers ما بتشتغلش."
        alt: "Four boxes for alpha-thalassemia by genes deleted: 1 silent carrier, 2 minor, 3 hemoglobin H disease with beta-4, 4 hemoglobin Barts with gamma-4. Below, beta-thalassemia: one gene mutated gives minor with raised HbA2; beta-zero homozygous gives major needing transfusions."
        page: 424
        quote: "Hemoglobin H disease (HbH); excess β-globin forms β4 Moderate to severe microcytic hypochromic anemia"
      - kind: explain
        title: "β-thalassemia"
        text: |-
          Point mutation في الـ splice sites أو الـ promoter (Kozak) على chromosome 11 ← β قليل (β+) أو مش موجود (β0). بيكتر في ==Mediterranean==.

          - **Minor** (gene واحد): anemia خفيفة، ==↑ HbA2==.
          - **Intermedia**: من خفيف لمحتاج نقل دم.
          - **Major** (β0/β0، Cooley): anemia شديدة محتاجة نقل دم (← 2° hemochromatosis)، الـ marrow بيتمدد (**crew cut** في الـ skull x-ray) ← تشوهات عظم، extramedullary hematopoiesis ← HSM، parvovirus B19 ← aplastic crisis، pigmented gallstones.
          - **Sickle cell β-thalassemia**: sickle cell disease خفيف لمتوسط.

          وفي الحالات الشديدة الـ **gene therapy** ممكن ترجّع الـ β وتقلّل نقل الدم.
        page: 425
        quote: "Point mutation in splice sites or Kozak consensus sequence (promoter) on chromosome 11 → ↓ β-globin synthesis (β+ ) or absent β-globin synthesis (β0 ). ↑ prevalence in Mediterranean populations."
      - kind: reveal
        prompt: "طفل عنده β-thalassemia major كويس لحد 6 شهور وبعدين يتعب. ليه؟"
        answer: "قبل الولادة وبعدها بشوية معظم الـ hemoglobin هو **HbF** (α2γ2)، وده مش محتاج β. لما الـ HbF يقل حوالين 6 شهور والمفروض الـ β يستلم، المشكلة تبان. عشان كده ==الـ HbF protective==."
        page: 425
        quote: "becomes symptomatic after 6 months when HbF declines (HbF is protective)."
      - kind: check
        question: "A Mediterranean adult with mild microcytosis and a high RBC count has increased HbA2 on electrophoresis. Diagnosis?"
        options:
          - "β-thalassemia minor"
          - "α-thalassemia minima"
          - "Iron deficiency"
          - "Hemoglobin Barts disease"
        answer: 0
        why:
          - "صح: الـ β minor = anemia خفيفة microcytic مع ↑ HbA2."
          - "الـ α minima silent ومفيهاش anemia."
          - "الـ iron deficiency عدد الكرات واطي والـ HbA2 مش عالي."
          - "الـ Barts hydrops fetalis ومش متوافق مع الحياة."
        page: 425
        quote: "β-thalassemia minor Mild microcytic anemia. ↑ HbA2"
      - kind: explain
        title: "الـ lead: بيضرب إنزيمين"
        text: |-
          الـ lead بيوقف ==ferrochelatase و ALA dehydratase== ← ↓ heme و ↑ RBC protoporphyrin. وبيوقف تكسير الـ rRNA ← **basophilic stippling**.

          **LLEEAAD**:
          - **L**ead **L**ines على اللثة (Burton lines) وعلى الـ metaphyses
          - **E**ncephalopathy و **E**rythrocyte basophilic stippling
          - **A**bdominal colic و sideroblastic **A**nemia
          - **D**rops: wrist و foot drop

          العلاج chelation: ==succimer==، EDTA، dimercaprol. الأطفال من دهان البيوت القديمة (قبل 1978)، والكبار من الشغل (بطاريات، ذخيرة).
        page: 425
        quote: "Lead inhibits ferrochelatase and ALA dehydratase → ↓ heme synthesis and ↑ RBC protoporphyrin. Also inhibits rRNA degradation → RBCs retain aggregates of rRNA (basophilic stippling)."
      - kind: explain
        title: "Sideroblastic anemia"
        text: |-
          الحديد داخل الـ mitochondria بس مش بيتركّب في الـ heme، فبيتراكم ← ==ringed sideroblasts== (Prussian blue) في الـ marrow.

          - **Genetic**: X-linked defect في الـ ALA synthase
          - **Acquired**: myelodysplastic syndromes
          - **Reversible**: ==alcohol أشهر سبب==، و lead، و B6 deficiency، و copper deficiency، و أدوية (isoniazid، linezolid)

          **Labs**: ↑ iron، TIBC طبيعي أو ↓، ↑ ferritin. **العلاج**: pyridoxine (B6)، لأنه cofactor للـ ALA synthase.
        page: 425
        quote: "Causes: genetic (eg, X-linked defect in ALA synthase gene), acquired (myelodysplastic syndromes), and reversible (alcohol is most common; also lead poisoning, vitamin B6 deficiency, copper deficiency, drugs [eg, isoniazid, linezolid])."
      - kind: check
        question: "A patient on isoniazid has microcytic anemia with high ferritin and ringed sideroblasts. Treatment?"
        options:
          - "Pyridoxine"
          - "Iron"
          - "Succimer"
