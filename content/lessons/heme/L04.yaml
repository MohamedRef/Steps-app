        title: "Sickle cell و HbC"
        text: |-
          **Sickle**: glutamic acid ← valine في الـ β ← الـ HbS المنزوع الأكسجين بيتجمع (polymerize). الـ ↓ O2 والـ altitude والـ acidosis بيعملوا sickling ← vaso-occlusion. المواليد كويسين الأول (HbF عالي). الـ trait بيحمي من الـ malaria.

          **المضاعفات**: aplastic crisis (parvovirus)، ==autosplenectomy== (Howell-Jolly، encapsulated organisms، Salmonella osteomyelitis)، splenic sequestration، vaso-occlusive crises (dactylitis، priapism، ==acute chest syndrome== وده سبب وفاة شائع، AVN، stroke)، و renal papillary necrosis (الـ medulla PO2 واطي).

          **العلاج**: hydroxyurea (↑ HbF)، gene therapy، transplant، hydration.

          **HbC**: glutamic acid ← lysine، extravascular hemolysis، crystals و target cells. الـ HbSC أخف من الـ HbSS.
        page: 428
        quote: "Pathogenesis: ↓ O2 , ↑ altitude, or acidosis precipitates sickling (deoxygenated HbS polymerizes) → vaso-occlusive disease."
