          - "الـ hemophilia نقص factor فبيتصلّح."
          - "الـ vitamin K بيطوّل الاتنين وبيتصلّح."
          - "الـ VII بيطوّل الـ PT بس."
        page: 431
        quote: "Clotting factor deficiencies should correct (the PT or PTT returns to within the appropriate normal range), whereas factor inhibitors will not correct."
      - kind: explain
        title: "أمراض الـ platelets"
        text: |-
          كلهم: ==↑ bleeding time==، نزيف mucosal، petechiae و epistaxis.

          - **Bernard-Soulier** (AR): ↓ GpIb ← adhesion بايظ، ==big platelets==.
          - **Glanzmann** (AR): ↓ GpIIb/IIIa ← aggregation بايظ، مفيش clumping.
          - **ITP**: antibodies ضد GpIIb/IIIa ← الـ spleen ياكل الـ platelets؛ ↑ megakaryocytes. ممكن idiopathic أو مع SLE، HIV، HCV، CLL، أدوية. العلاج: steroids، IVIG، rituximab، TPO agonists (eltrombopag، romiplostim)، splenectomy.
          - **Uremic**: الـ uremic toxins بتبوّظ الـ adhesion والـ aggregation.
        page: 432
        quote: "Destruction of platelets in spleen. Most commonly due to anti-GpIIb/IIIa antibodies → splenic macrophages phagocytose platelets."
