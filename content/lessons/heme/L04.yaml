        caption: "الطريق بيبدأ في الـ mitochondria، يخرج للـ cytoplasm، ويرجع الـ mitochondria. الـ lead بيضرب في مكانين، والـ AIP والـ PCT كل واحد في إنزيم."
        alt: "Heme synthesis pathway. In mitochondria, succinyl CoA and glycine make ALA through ALA synthase, the X-linked sideroblastic anemia site. In cytoplasm, ALA dehydratase, inhibited by lead, makes porphobilinogen; porphobilinogen deaminase, deficient in acute intermittent porphyria, makes hydroxymethylbilane and uroporphyrinogen III; uroporphyrinogen decarboxylase, deficient in porphyria cutanea tarda, makes coproporphyrinogen III. Back in mitochondria, ferrochelatase, inhibited by lead, joins protoporphyrin and iron into heme."
