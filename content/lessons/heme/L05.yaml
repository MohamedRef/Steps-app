        title: "كل دوا بيضرب فين في الـ DNA"
        text: |-
          - **MTX و 5-FU**: ↓ thymidine. **Thiopurines**: ↓ purines. **Hydroxyurea**: ribonucleotide reductase.
          - **Alkylating و platinum**: ==cross-link== للـ DNA.
          - **Bleomycin**: يقطع الـ DNA. **Anthracyclines و dactinomycin**: intercalation.
          - **Etoposide**: topoisomerase II. **Irinotecan و topotecan**: topoisomerase I.
          - **Vinca**: تمنع ==تكوين== الـ microtubules. **Taxanes**: تمنع ==تفكيكها==.
