      - kind: explain
        title: "الـ monoclonal antibodies"
        text: |-
          بيشتغلوا على targets ==برّه الخلية==، يعادلوها أو يخلّوا المناعة تشوفها (ADCC من الـ NK cells و complement). وبيخرجوا عن طريق الـ macrophages، مش الكلى ولا الكبد.

          - **Alemtuzumab** على CD52: الـ CLL والـ MS، و ↑ infections و autoimmunity.
          - **Bevacizumab** على VEGF: يمنع الأوعية، فيعمل نزيف وجلطات وجرح ما يلمّش.
          - **Cetuximab و panitumumab** على EGFR: الـ CRC لو الـ ==RAS wild-type==، و rash.
          - **Rituximab** على CD20: الـ NHL والـ CLL والـ ITP والـ TTP والـ RA. أول infusion ممكن يعمل cytokine release reaction.
          - **Trastuzumab** على HER2: الثدي والمعدة، و dilated cardiomyopathy غالباً reversible.
          - **PD-1 و PD-L1 و CTLA-4** (pembrolizumab و nivolumab و atezolizumab و ipilimumab): بيشيلوا الفرامل عن الـ T cells، فبيعملوا autoimmunity.
