          فهو بيمنع ويعالج سرطان الثدي (ER ⊕)، وبيمنع الـ gynecomastia مع علاج سرطان البروستاتا. بس لأنه بيشغّل الـ endometrium بيزوّد **endometrial cancer** و uterine sarcoma، وكمان hot flashes و DVT و PE.
