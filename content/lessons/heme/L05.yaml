      - kind: explain
        title: "الـ thiopurines والـ purine analogs"
        text: |-
          - **Azathioprine** بيتحول لـ **6-MP**، والـ **HGPRT** بيشغّله ← ↓ de novo purine synthesis. استخدامه أكتر في الـ immunosuppression (RA و IBD و SLE والـ transplant) والـ ALL.
          - الـ 6-MP بيتكسّر بالـ **TPMT** وبالـ ==xanthine oxidase==، فلو اديت **allopurinol** أو febuxostat السمّية تعلى.
          - **Cladribine و pentostatin**: الـ ADA ما يقدرش يتعامل معاهم. الاتنين للـ **hairy cell leukemia**.
        page: 444
        quote: "6-MP is inactivated by thiopurine S-methyl- transferase (genetic polymorphism) and xanthine oxidase (↑ toxicity with allopurinol or febuxostat)"
      - kind: explain
        title: "الـ pyrimidines والـ folate"
        text: |-
          - **Cytarabine**: pyrimidine analog ← chain termination. الدوا الأساسي في الـ **AML**.
          - **5-FU**: يتحول لـ 5-FdUMP ← يوقف الـ ==thymidylate synthase==. للـ colon والـ pancreas، وموضعي للـ basal cell. بيعمل hand-foot syndrome. والـ capecitabine هو الـ prodrug بتاعه.
          - **Hydroxyurea**: يوقف الـ ribonucleotide reductase. للـ CML والـ polycythemia vera، وفي الـ **sickle cell** لأنه ↑ HbF.
          - **Methotrexate**: يوقف الـ ==dihydrofolate reductase==. للـ ALL والـ choriocarcinoma، وبرّه الأورام للـ ectopic pregnancy والـ RA والـ psoriasis. سمّيته (myelosuppression) بتتعكس بالـ **leucovorin rescue**.
        page: 444
        quote: "Pyrimidine analog bioactivated to 5-FdUMP → thymidylate synthase inhibition"
      - kind: aside
