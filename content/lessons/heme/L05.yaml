schema: steps.lesson/v1
lecture: heme.L05
lessons:
  - id: heme.L05.lesson1
    title: "الـ tumor lysis والـ heparin والـ warfarin: مين بيضرب فين"
    hook: "BreaK the CUP، والـ heparin في الدم والـ warfarin في الكبد: لو فهمت المكان فهمت كل الفروق"
    minutes: 9
    pages: [440, 441]
    topics: [tumor-lysis-syndrome, heparin, warfarin, heparin-vs-warfarin, direct-coagulation-factor-inhibitors]
    goals:
      - "تعرف الـ labs الأربعة في الـ tumor lysis syndrome وعلاجها"
      - "تفرّق بين HIT type 1 و type 2"
      - "تفهم ليه الـ warfarin بيعمل clotting في الأول، وليه بنعمل bridging"
      - "تحط كل direct inhibitor على الـ factor بتاعه"
    status: unverified
    steps:
      - kind: explain
        title: "Tumor lysis syndrome: الخلايا بتفرغ اللي جواها"
        text: |-
          لما خلايا كتير تتكسر مرة واحدة (غالباً ==lymphoma أو leukemia== أول ما نبدأ العلاج) اللي جواها بينزل الدم:

          - **K+** يعلى ← arrhythmias و muscle weakness.
          - **PO4** يعلى، ويمسك الـ **Ca2+** فينزل ← seizures و tetany.
          - الـ nucleic acids تتكسر ← **uric acid** يعلى ← crystals في الكلى ← ==acute kidney injury==.

          الوقاية والعلاج: **hydration** جامد، و **allopurinol**، و **rasburicase**.
        page: 440
        quote: "Release of K+ → hyperkalemia, release of PO4 3– → hyperphosphatemia, hypocalcemia due to Ca2+ sequestration by PO4 3– . ↑ nucleic acid breakdown → hyperuricemia → acute kidney injury."
      - kind: mnemonic
        word: "CUP"
        parts:
          - { key: "C", text: "Ca2+ نازل (الـ PO4 مسكه)" }
          - { key: "U", text: "Uric acid طالع" }
          - { key: "P", text: "PO4 طالع" }
        hook: "BreaK the CUP: والـ K في Break هو الـ K+ اللي طالع"
        page: 440
        quote: "Tumor cell breakdown causes ↑ K+ , ↓ Ca2+ , ↑ Uric acid, and ↑ PO 3– 4 (BreaK the CUP)."
      - kind: check
        question: "Which electrolyte falls in tumor lysis syndrome?"
        options:
          - "Calcium"
          - "Potassium"
          - "Phosphate"
          - "Uric acid"
        answer: 0
        why:
          - "صح: الـ PO4 العالي بيمسك الـ Ca2+ فينزل."
          - "الـ K+ بيطلع من الخلايا فيعلى."
          - "الـ PO4 بيطلع من الخلايا فيعلى."
          - "الـ uric acid بيعلى من تكسير الـ nucleic acids."
        page: 440
        quote: "hypocalcemia due to Ca2+ sequestration by PO4 3–"
      - kind: explain
        title: "Heparin: بيشغّل الـ antithrombin"
        text: |-
          الـ heparin مش بيوقف الـ factors بنفسه. بيشغّل الـ ==antithrombin== اللي بيوقف أساساً **IIa (thrombin)** و **Xa**. مفعوله سريع وقصير، ونتابعه بالـ **PTT**.

          بنستخدمه لما نحتاج anticoagulation فوري: PE و DVT و MI و acute coronary syndrome. وهو ==آمن في الحمل== لأنه ما بيعديش الـ placenta (والـ LMWH زي الـ enoxaparin هو المفضل).

          الـ **LMWH** (enoxaparin و dalteparin) شغلها على Xa أساساً وعمرها أطول، والـ **fondaparinux** على Xa بس. الاتنين صعب نعكسهم، والـ LMWH بتخرج من الكلى، فلو فيه renal insufficiency نرجع للـ unfractionated.
        page: 440
        quote: "Activates antithrombin, which ↓ action primarily of factors IIa (thrombin) and Xa. Short half-life."
      - kind: table
        title: "HIT type 1 و type 2"
        columns: ["", "Type 1", "Type 2"]
        rows:
          - ["السبب", "مش مناعي", "IgG ضد heparin-PF4"]
          - ["إمتى", "أول يومين", "بعد 5 لـ 10 أيام"]
          - ["الـ platelets", "فوق 100,000 ومؤقت", "↓↓ مع thrombosis"]
          - ["نعمل إيه", "ولا حاجة", "نوقف الـ heparin ونبدأ argatroban"]
        hide: [[1, 1], [1, 2], [3, 2]]
        page: 440
        quote: "Antibody-heparin-PF4 complex binds and activates platelets → removal by splenic macrophages and thrombosis → ↓↓ platelet count."
      - kind: aside
        tone: trap
        text: "الـ HIT type 2 ==بيجلّط== مش بس بيقلّل الـ platelets، لأن الـ antibody بيشغّل الـ platelets. عشان كده ما نديش platelets، ونوقف كل heparin. والـ **fondaparinux** آمن لأنه ما بيتفاعلش مع الـ PF4."
        page: 440
        quote: "Fondaparinux safe to use (does not interact with PF4)."
      - kind: check
        question: "On day 8 of unfractionated heparin, a patient's platelets fall by 70% and a new arterial clot forms. What is the mechanism?"
        options:
          - "IgG against heparin-bound PF4 activating platelets"
          - "Nonimmune direct platelet clumping by heparin"
          - "Early depletion of protein C"
          - "Consumption of factors by tissue factor"
        answer: 0
        why:
          - "صح: ده HIT type 2، بعد 5 لـ 10 أيام، والـ complex بيشغّل الـ platelets فيعمل thrombosis."
          - "ده HIT type 1: أول يومين وخفيف ومن غير جلطات."
          - "ده سبب الـ warfarin skin necrosis."
          - "ده DIC، ومحتاج سبب زي sepsis."
        page: 440
        quote: "HIT type 2—development of IgG antibodies against heparin-bound platelet factor 4 (PF4) that typically occurs 5-10 days after heparin administration."
      - kind: explain
        title: "Warfarin: بيضرب الـ vitamin K في الكبد"
        text: |-
          الـ warfarin بيوقف الـ ==vitamin K epoxide reductase==، فالكبد ما يقدرش يعمل γ-carboxylation للـ factors **II و VII و IX و X** ولا للـ **protein C و S**. مفعوله بطيء وطويل، وبيطوّل الـ **PT** (extrinsic): "The ex-PresidenT went to war(farin)".

          جيناته: الـ **VKORC1** بيأثر على الجرعة، والـ **CYP2C9** بيكسّره، فعنده تداخلات كتير.

          وبيعدّي الـ placenta (teratogenic) فممنوع في الحمل.
        page: 441
        quote: "Inhibits vitamin K epoxide reductase by competing with vitamin K → inhibition of vitamin K– dependent γ-carboxylation of clotting factors II, VII, IX, and X and proteins C and S."
      - kind: reveal
        prompt: "الـ warfarin anticoagulant. إزاي ممكن يعمل جلطات وskin necrosis في أول كام يوم؟"
        answer: "الـ **protein C** عمره أقصر من الـ factors II و X. فالـ protein C الموجود ==يخلص الأول== قبل ما الـ II و X يخلصوا، فالمريض يبقى hypercoagulable لفترة. ده بيعمل microthrombosis في الأوعية الصغيرة ← skin necrosis. الحل: **heparin bridging** لحد ما الـ warfarin يشتغل."
        page: 441
        quote: "Initial risk of hypercoagulation: protein C has shorter half-life than factors II and X. Existing protein C depletes before existing factors II and X deplete"
      - kind: figure
        title: "الـ heparin في الدم والـ warfarin في الكبد"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="heme5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg-dot"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="150" height="160" rx="10"/>
            <text x="85" y="40" text-anchor="middle" class="t-b">Liver</text>
            <text x="85" y="66" text-anchor="middle" class="t-sm">vitamin K</text>
            <text x="85" y="90" text-anchor="middle" class="t-sm">γ-carboxylation</text>
            <text x="85" y="114" text-anchor="middle" class="t-sm">II, VII, IX, X, C, S</text>
            <text x="85" y="150" text-anchor="middle" class="t-sm t-acc">warfarin blocks</text>
            <text x="85" y="168" text-anchor="middle" class="t-sm t-mut">PT/INR, oral, days</text>
            <line class="fg-line" x1="160" y1="100" x2="200" y2="100" marker-end="url(#heme5a)"/>
            <rect class="fg-box" x="200" y="20" width="150" height="160" rx="10"/>
            <text x="275" y="40" text-anchor="middle" class="t-b">Blood</text>
            <text x="275" y="66" text-anchor="middle" class="t-sm">antithrombin</text>
            <text x="275" y="90" text-anchor="middle" class="t-sm">IIa and Xa</text>
            <text x="275" y="150" text-anchor="middle" class="t-sm t-acc">heparin activates</text>
            <text x="275" y="168" text-anchor="middle" class="t-sm t-mut">PTT, IV/SC, hours</text>
          </svg>
        caption: "الـ warfarin بيمنع تصنيع الـ factors في الكبد، فلازم يستنى الـ factors القديمة تخلص (أيام). الـ heparin بيشتغل على الـ factors الموجودة في الدم (ثواني)."
        alt: "Two boxes. Left, Liver: vitamin K, gamma-carboxylation of factors II, VII, IX, X, C and S, blocked by warfarin; PT/INR, oral, days. An arrow leads to the right box, Blood: antithrombin acts on IIa and Xa, activated by heparin; PTT, IV or SC, hours."
        page: 441
        quote: "SITE OF ACTION Blood Liver ONSET OF ACTION Rapid (seconds) Slow, limited by half-lives of normal clotting factors"
      - kind: explain
        title: "الـ direct inhibitors"
        text: |-
          ما بيحتاجوش labs غالباً، و ==ممنوعين مع الـ mechanical heart valves==.

          - **Thrombin (IIa)**: bivalirudin و argatroban و dabigatran. ينفعوا في الـ HIT، لما الـ heparin يبقى **BAD** للمريض. الـ dabigatran بيتعكس بالـ **idarucizumab**.
          - **Xa**: apixaban و edoxaban و rivaroxaban، اللي بـ "ban" الـ Xa. Oral، للـ DVT/PE والـ atrial fibrillation، وبيتعكسوا بالـ **andexanet alfa**.
        page: 441
        quote: "Do not usually require lab monitoring. Not to be used in patients with mechanical heart valves."
      - kind: check
        question: "A patient with HIT type 2 needs ongoing anticoagulation. Which drug fits?"
        options:
          - "Argatroban"
          - "Enoxaparin"
          - "Warfarin alone"
          - "Protamine sulfate"
        answer: 0
        why:
          - "صح: direct thrombin inhibitor، والـ BAD (Bivalirudin، Argatroban، Dabigatran) ينفعوا في الـ HIT."
          - "الـ enoxaparin heparin برضه، فممنوع."
          - "الـ warfarin لوحده في الأول بيزوّد الـ clotting."
          - "الـ protamine بيعكس الـ heparin، مش anticoagulant."
        page: 441
        quote: "Can be used in HIT, when heparin is BAD for the patient"
      - kind: try
        items: [heme.L05.006, heme.L05.014, heme.L05.023, heme.L05.025, heme.L05.029]
    recap:
      - "Tumor lysis: ↑ K+ و ↓ Ca2+ و ↑ uric acid و ↑ PO4 (BreaK the CUP)، بالـ hydration و allopurinol و rasburicase."
      - "Heparin بيشغّل الـ antithrombin (IIa و Xa)، بالـ PTT، وآمن في الحمل. HIT type 2 بعد 5 لـ 10 أيام وبيجلّط."
      - "Warfarin بيضرب الـ vitamin K epoxide reductase، بالـ PT/INR، وبيعدّي الـ placenta. الـ protein C بيخلص الأول، فنعمل bridging."
      - "Thrombin: BAD. Xa: الـ -xaban. الاتنين ممنوعين مع الـ mechanical valves."
    practice: [heme.L05.001, heme.L05.002, heme.L05.003, heme.L05.004, heme.L05.005, heme.L05.007, heme.L05.008, heme.L05.009, heme.L05.010, heme.L05.011, heme.L05.012, heme.L05.013, heme.L05.015, heme.L05.016, heme.L05.017, heme.L05.018, heme.L05.019, heme.L05.020, heme.L05.021, heme.L05.022, heme.L05.024, heme.L05.026, heme.L05.027, heme.L05.028]
  - id: heme.L05.lesson2
    title: "نعكس الـ anticoagulant ونوقف الـ platelets ونكسّر الجلطة"
    hook: "لكل anticoagulant مفتاح بيقفله، ولكل خطوة في الـ platelet plug دوا بيوقفها"
    minutes: 8
    pages: [442, 442]
    topics: [anticoagulation-reversal, antiplatelets, thrombolytics]
    goals:
      - "تحفظ الـ reversal agent لكل anticoagulant"
      - "تحط كل antiplatelet على الـ receptor بتاعه"
      - "تعرف استخدامات الـ thrombolytics وموانعها"
    status: unverified
    steps:
      - kind: match
        prompt: "وصّل كل anticoagulant بالـ reversal بتاعه"
        pairs:
          - ["Heparin", "Protamine sulfate"]
          - ["Warfarin", "Vitamin K (slow), FFP or PCC (rapid)"]
          - ["Dabigatran", "Idarucizumab"]
          - ["Apixaban, rivaroxaban", "Andexanet alfa"]
        page: 442
        quote: "Heparin Protamine sulfate ⊕ charged peptide that binds ⊝ charged heparin Warfarin Vitamin K (slow) +/– FFP or PCC (rapid) Dabigatran Idarucizumab"
      - kind: explain
        title: "كل reversal بيشتغل إزاي"
        text: |-
          - **Protamine**: peptide ==موجب== بيمسك الـ heparin السالب.
          - **Idarucizumab**: Fab fragments من monoclonal antibody بتمسك الـ dabigatran.
          - **Andexanet alfa**: Xa ==مزيّف ومش شغّال==، بيشرب الـ inhibitor بداله.
          - **Warfarin**: الـ vitamin K بطيء لأن الكبد لازم يعمل factors جديدة. لو مستعجلين ندّي الـ factors جاهزة: **FFP** أو **PCC**.
        page: 442
        quote: "Andexanet alfa Recombinant modified factor Xa (inactive)"
      - kind: explain
        title: "الـ antiplatelets: كل واحد على خطوة"
        text: |-
          افتكر الـ platelet plug: adhesion ثم activation (ADP و TXA2) ثم aggregation على الـ GpIIb/IIIa.

          - **Aspirin**: بيقفل الـ COX ==irreversibly== ← ↓ TXA2.
          - **Clopidogrel و prasugrel و ticagrelor**: بيقفلوا الـ ADP receptor (**P2Y12**) ← الـ GpIIb/IIIa ما يظهرش. ومع الـ aspirin = dual antiplatelet therapy.
          - **Eptifibatide و tirofiban و abciximab**: بيقفلوا الـ **GpIIb/IIIa** نفسه (الـ fibrinogen receptor)، في الـ unstable angina والـ PCI. ممكن يعملوا thrombocytopenia.
          - **Cilostazol و dipyridamole**: بيقفلوا الـ phosphodiesterase ← ↑ cAMP في الـ platelets. الـ claudication والـ stroke prevention.
        page: 442
        quote: "Aspirin Irreversibly blocks COX → ↓ TXA2 release"
      - kind: check
        question: "A drug blocks the receptor that fibrinogen uses to link activated platelets. Which drug is it?"
        options:
          - "Eptifibatide"
          - "Clopidogrel"
          - "Aspirin"
          - "Cilostazol"
        answer: 0
        why:
          - "صح: الـ eptifibatide بيقفل الـ GpIIb/IIIa، الـ fibrinogen receptor."
          - "الـ clopidogrel بيقفل الـ P2Y12 فالـ GpIIb/IIIa ما يظهرش، بس مش بيقفله هو."
          - "الـ aspirin بيقفل الـ COX."
          - "الـ cilostazol بيقفل الـ phosphodiesterase."
        page: 442
        quote: "Eptifibatide, tirofiban, abciximab Block GpIIb/IIIa (fibrinogen receptor) on activated platelets"
      - kind: aside
        tone: exam
        text: "أعراض الـ aspirin الجانبية كتير بتيجي في الأسئلة: gastric ulcers و ==tinnitus== و allergic reactions و renal injury، و **Reye syndrome** لو اتدّى لطفل."
        page: 442
        quote: "Gastric ulcers, tinnitus, allergic reactions, renal injury, Reye syndrome (in children)"
      - kind: figure
        title: "الـ thrombolytics بيشغّلوا الـ plasmin"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="heme5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fg-dot"/></marker></defs>
            <rect class="fg-box" x="10" y="40" width="100" height="40" rx="8"/>
            <text x="60" y="65" text-anchor="middle" class="t-sm">Plasminogen</text>
            <line class="fg-line" x1="110" y1="60" x2="150" y2="60" marker-end="url(#heme5b)"/>
            <text x="130" y="30" text-anchor="middle" class="t-sm t-acc">tPA</text>
            <rect class="fg-box" x="150" y="40" width="80" height="40" rx="8"/>
            <text x="190" y="65" text-anchor="middle" class="t-sm">Plasmin</text>
            <line class="fg-line" x1="230" y1="60" x2="270" y2="60" marker-end="url(#heme5b)"/>
            <rect class="fg-box" x="270" y="40" width="80" height="40" rx="8"/>
            <text x="310" y="65" text-anchor="middle" class="t-sm">Fibrin cut</text>
            <text x="180" y="115" text-anchor="middle" class="t-sm t-mut">antifibrinolytics (tranexamic, aminocaproic acid) block this</text>
            <text x="180" y="135" text-anchor="middle" class="t-sm t-mut">↑ PT, ↑ PTT, platelets unchanged</text>
          </svg>
        caption: "الـ alteplase والـ reteplase والـ tenecteplase بيحوّلوا الـ plasminogen لـ plasmin، والـ plasmin بيقطّع الـ fibrin. لو حصل نزيف بنستخدم antifibrinolytics."
        alt: "Plasminogen converts to plasmin under tPA, and plasmin cuts fibrin. A note says antifibrinolytics such as tranexamic and aminocaproic acid block this, and that PT and PTT rise while platelets are unchanged."
        page: 442
        quote: "Directly or indirectly aid conversion of plasminogen to plasmin, which cleaves fibrin clots. ↑ PT, ↑ PTT, no change in platelet count."
      - kind: explain
        title: "إمتى وإمتى لأ"
        text: |-
          **الاستخدام**: early MI، و early ischemic stroke، و high-risk PE.

          **ممنوع** لو: active bleeding، أو ==تاريخ intracranial bleeding==، أو surgery قريبة، أو bleeding diathesis، أو severe hypertension.

          لو نزف: مفيش antidote خاص. بنستخدم **antifibrinolytics** (aminocaproic acid و tranexamic acid) و platelets و cryoprecipitate أو FFP أو PCC.
        page: 442
        quote: "Contraindicated in patients with active bleeding, history of intracranial bleeding, recent surgery, known bleeding diatheses, or severe hypertension."
      - kind: check
        question: "Which finding rules out alteplase in a patient with an acute ischemic stroke?"
        options:
          - "A past intracranial hemorrhage"
          - "Age over 60"
          - "Atrial fibrillation"
          - "Taking a statin"
        answer: 0
        why:
          - "صح: تاريخ intracranial bleeding من الموانع."
          - "السن مش من موانع الكتاب."
          - "الـ atrial fibrillation سبب شائع للـ stroke، مش مانع."
          - "الـ statin مش من الموانع."
        page: 442
        quote: "history of intracranial bleeding"
      - kind: try
        items: [heme.L05.033, heme.L05.037, heme.L05.042]
    recap:
      - "Heparin ← protamine. Warfarin ← vitamin K (بطيء) أو FFP/PCC (سريع). Dabigatran ← idarucizumab. Xa inhibitors ← andexanet alfa."
      - "Aspirin على الـ COX، clopidogrel على الـ P2Y12، eptifibatide على الـ GpIIb/IIIa، cilostazol على الـ phosphodiesterase."
      - "Thrombolytics: plasminogen ← plasmin، ↑ PT و PTT والـ platelets زي ما هي. الموانع أي نزيف."
    practice: [heme.L05.030, heme.L05.031, heme.L05.032, heme.L05.033, heme.L05.034, heme.L05.035, heme.L05.036, heme.L05.037, heme.L05.038, heme.L05.039, heme.L05.040, heme.L05.041, heme.L05.042]
