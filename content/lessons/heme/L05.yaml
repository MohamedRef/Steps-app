        title: "Antibody-drug conjugate: صاروخ موجّه"
        text: |-
          monoclonal antibody مربوط بدوا كيماوي. الـ antibody يمسك ==antigen على الورم==، الخلية تبلعه (receptor-mediated endocytosis)، الـ lysosome يكسّره، والدوا يطلع جوه الخلية. النتيجة: فعالية أكتر وسمّية أقل.

          المثال: **ado-trastuzumab emtansine (T-DM1)** لسرطان الثدي الـ HER2 ⊕.
        page: 443
        quote: "Antibody selectivity against tumor antigens allows targeted drug delivery to tumor cells while sparing healthy cells → ↑ efficacy and ↓ toxicity."
