  - id: heme.L05.lesson4
    title: "الـ alkylating والـ platinum والـ microtubules والـ topoisomerase"
    hook: "Vincristine بيحرق الأعصاب و vinblastine بيفجّر النخاع: كل دوا ليه بصمة"
    minutes: 8
    pages: [445, 445]
    topics: [alkylating-agents, platinum-compounds, microtubule-inhibitors, topoisomerase-inhibitors]
    goals:
      - "تعرف استخدام وسمّية كل alkylating agent"
      - "تعرف سمّية الـ platinum وإزاي نحمي الكلى"
      - "تفرّق بين الـ taxanes والـ vinca، والـ topoisomerase I و II"
    status: unverified
    steps:
      - kind: explain
        title: "الـ alkylating agents: cross-link في أي مرحلة"
        text: |-
          كلهم ==cell cycle nonspecific== وبيعملوا cross-link للـ DNA.

          - **Busulfan**: يمسح النخاع قبل الـ bone marrow transplant. Myelosuppression شديد، و pulmonary fibrosis، و hyperpigmentation.
          - **Cyclophosphamide و ifosfamide**: محتاجين الكبد يشغّلهم. بيعملوا ==hemorrhagic cystitis== وسرطان المثانة (نمنعه بالـ **mesna**)، و SIADH، والـ ifosfamide بيعمل Fanconi syndrome.
          - **Carmustine و lomustine (nitrosoureas)**: بيعدّوا الـ blood-brain barrier ← للـ brain tumors والـ glioblastoma، وسمّيتهم في الـ CNS.
          - **Procarbazine**: MAO inhibitor ضعيف (حذر من الـ tyramine)، و disulfiram-like reaction. للـ Hodgkin والـ brain tumors.
        page: 445
        quote: "Myelosuppression, SIADH, Fanconi syndrome (ifosfamide), hemorrhagic cystitis and bladder cancer (prevent with mesna)"
      - kind: aside
        tone: analogy
        text: "جملة الكتاب للـ nitrosoureas: ==Put nitro in your Mustang and travel the globe==. الـ nitro في الـ Mustang (mustard)، والـ globe هو الـ glioblastoma."
        page: 445
        quote: "Put nitro in your Mustang and travel the globe"
      - kind: check
        question: "Which alkylating agent is chosen for a glioblastoma because it crosses the blood-brain barrier?"
        options:
          - "Carmustine"
          - "Busulfan"
          - "Cyclophosphamide"
          - "Cisplatin"
        answer: 0
        why:
          - "صح: الـ nitrosoureas (carmustine و lomustine) بيعدّوا الـ blood-brain barrier."
          - "الـ busulfan لمسح النخاع قبل الـ transplant."
          - "الـ cyclophosphamide للـ solid tumors والـ lymphomas والـ SLE."
          - "الـ cisplatin platinum compound للـ solid tumors."
        page: 445
        quote: "Cross blood-brain barrier → CNS entry Brain tumors (including glioblastoma multiforme)"
      - kind: explain
        title: "Platinum: الكلى والودن والأعصاب"
        text: |-
          **Cisplatin و carboplatin و oxaliplatin**: cross-link، أي مرحلة. للـ testicular والـ bladder والـ ovarian والـ GI والـ lung والـ lymphomas.

          السمّية: ==nephrotoxicity== (زي Fanconi syndrome، ونحمي بالـ **amifostine**)، و peripheral neuropathy، و ==ototoxicity==.
        page: 445
        quote: "Nephrotoxicity (eg, Fanconi syndrome; prevent with amifostine), peripheral neuropathy, ototoxicity."
      - kind: explain
        title: "الـ microtubules: نبنيها ولا نهدّها"
        text: |-
          كلهم ==M-phase specific==.

          - **Taxanes (docetaxel و paclitaxel)**: يثبّتوا الـ microtubules فالـ spindle ما يتفكّش. "Taxes stabilize society". للـ ovarian والـ breast. سمّيتهم myelosuppression و neuropathy و hypersensitivity.
          - **Vinca (vincristine و vinblastine)**: يمسكوا الـ β-tubulin فالـ microtubules ما تتبنيش. للـ leukemias والـ lymphomas والـ solid tumors.
        page: 445
        quote: "Hyperstabilize polymerized microtubules → prevent mitotic spindle breakdown"
      - kind: mnemonic
        word: "CB"
        parts:
          - { key: "C", text: "vinCristine: Crisps the nerves (axonal neuropathy و constipation لحد الـ ileus)" }
          - { key: "B", text: "vinBlastine: Blasts the marrow (myelosuppression)" }
        hook: "Crisps و Blasts: الحرف التاني في الاسم بيقولك السمّية"
        page: 445
        quote: "Vincristine (crisps the nerves): neurotoxicity (axonal neuropathy), constipation (including ileus) Vinblastine (blasts the marrow): myelosuppression"
      - kind: explain
        title: "الـ topoisomerase inhibitors"
        text: |-
          كلهم بيزوّدوا الـ DNA breaks فالخلية تقف في ==S و G2==.

          - **Topoisomerase I**: irinotecan و topotecan ("-tecone"). للـ colon والـ ovarian والـ small cell lung. سمّيتهم severe myelosuppression و ==diarrhea==.
          - **Topoisomerase II**: etoposide و teniposide ("-bothside"، يعني 2). للـ testicular والـ small cell lung والـ leukemia والـ lymphoma. سمّيتهم myelosuppression و alopecia.
        page: 445
        quote: "All cause ↑ DNA strand breaks, resulting in cell cycle arrest in S and G2 phases."
      - kind: check
        question: "A child on chemotherapy for ALL develops foot drop and constipation with near-normal counts. Which drug?"
        options:
          - "Vincristine"
