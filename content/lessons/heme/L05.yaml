          - "الـ irinotecan بيعمل diarrhea مش constipation."
          - "الـ busulfan بيعمل myelosuppression شديد."
        page: 445
        quote: "Vincristine (crisps the nerves): neurotoxicity (axonal neuropathy), constipation (including ileus)"
