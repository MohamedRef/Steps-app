  - id: heme.L02.lesson3
    title: "الـ lymphocytes: B و T و NK و plasma cell"
    hook: "قاعدة الـ 8 وحرف واحد لكل خلية، وهتعرف مين بيعمل إيه في المناعة"
    minutes: 8
    pages: [415, 415]
    topics: [lymphocytes, natural-killer-cells, b-cells, t-cells, plasma-cells]
    goals:
      - "تفرّق بين الـ innate (NK) والـ adaptive (B و T)"
      - "تعرف الـ markers: CD19/20/21، CD3/4/8، CD56/16"
      - "تعرف شكل الـ plasma cell وعلاقته بالـ multiple myeloma"
    status: unverified
    steps:
      - kind: explain
        title: "تلات أنواع"
        text: |-
          الـ lymphocyte شكله بسيط: nucleus مدوّرة غامقة وحتة cytoplasm صغيرة باهتة. وتحته 3 أنواع:

          - **B cells** و **T cells**: ==adaptive immunity==
          - **NK cells**: ==innate immunity==

          ومعظم الـ lymphocytes اللي في الدم (**80%**) T cells.
        page: 415
        quote: "Refer to B cells, T cells, and natural killer (NK) cells. B cells and T cells mediate adaptive immunity. NK cells are part of the innate immune response."
      - kind: explain
        title: "الـ NK cell: بيقتل اللي مخبّي بطاقته"
        text: |-
          الـ NK cell أكبر من الـ B والـ T، وفيه **lytic granules** فيها ==perforin و granzymes== بتعمل apoptosis في الخلية المستهدفة. عليه **CD56** و **CD16** (Fc receptor).

          بيقتل إمتى؟ لما الخلية ==ما تعرضش MHC class I==، زي خلية فيها virus نزّلت الـ MHC I عشان تهرب من الـ CD8 T cells. وكمان بيتعرّف على بروتينات بتظهر مع الـ stress أو الـ malignant transformation أو الـ infection.
        page: 415
        quote: "Induce apoptosis (natural killer) in cells that do not express class I MHC cell surface molecules, eg, virally infected cells in which these molecules are downregulated."
      - kind: aside
        tone: analogy
        text: "الـ MHC I زي **البطاقة الشخصية** اللي كل خلية لازم تطلّعها. الـ CD8 T cell بيقرا البطاقة ويشوف فيها virus ولا لأ. الـ virus الشاطر بيخبّي البطاقة خالص، وهنا بييجي الـ NK: ==«ما معاكش بطاقة؟ يبقى انت مشبوه»==."
        page: 415
        quote: "Distinguish between healthy and infected cells by identifying cell surface proteins"
      - kind: check
        question: "A virus downregulates MHC class I on infected cells. Which cell is best placed to kill them?"
        options:
          - "NK cell"
          - "CD8+ cytotoxic T cell"
          - "CD4+ helper T cell"
          - "Plasma cell"
        answer: 0
        why:
          - "صح: الـ NK بيقتل الخلايا اللي مفيهاش MHC I، بالـ perforin والـ granzymes."
          - "الـ CD8 محتاج MHC I عشان يشوف الـ antigen، والـ virus شاله."
          - "الـ CD4 بيشوف MHC II وما بيقتلش الخلايا المصابة بنفسه."
          - "الـ plasma cell بيعمل antibodies بس."
        page: 415
        quote: "Induce apoptosis (natural killer) in cells that do not express class I MHC cell surface molecules"
      - kind: explain
        title: "B = bone marrow، T = thymus"
        text: |-
          - **B cells**: بتتولد ==وتنضج في الـ bone marrow==، وبعدين تروح الـ follicles في الـ lymph nodes والـ white pulp في الـ spleen والـ lymphoid tissue اللي مش متغلّف. لما تقابل antigen تبقى **plasma cells** (antibodies) و **memory cells**. وتقدر تشتغل APC. الـ markers: CD19، CD20، CD21.
          - **T cells**: بتتولد في الـ marrow بس ==بتنضج في الـ thymus==. بتبقى cytotoxic (CD8) أو helper (CD4) أو regulatory. كلها عليها CD3، ومحتاجة **CD28** كـ costimulatory signal عشان تتنشّط.
        page: 415
        quote: "Originate from stem cells in the bone marrow, but mature in the thymus. Differentiate into cytotoxic T cells (express CD8, recognize MHC I), helper T cells (express CD4, recognize MHC II), and regulatory T cells. CD28 (costimulatory signal) necessary for T-cell activation."
      - kind: aside
        tone: tip
        text: "**Rule of 8** من الكتاب: ==MHC II × CD4 = 8== و **MHC I × CD8 = 8**. لو افتكرت واحد، التاني بيطلع بالقسمة: الـ helper (CD4) بيشوف MHC II، والـ cytotoxic (CD8) بيشوف MHC I."
        page: 415
        quote: "Rule of 8: MHC II × CD4 = 8; MHC I × CD8 = 8."
      - kind: aside
        tone: exam
        text: "الـ ==CD4+ helper T cells== هي الهدف الأساسي للـ **HIV**. فلما الـ CD4 count يقع، المناعة الخلوية كلها بتقع وتطلع الـ opportunistic infections."
        page: 415
        quote: "CD4+ helper T cells are the primary target of HIV."
      - kind: explain
        title: "الـ plasma cell: مصنع antibodies"
        text: |-
          الـ plasma cell بيعمل كميات ضخمة من antibody واحد. فشكله كله بيخدم ده:

          - nucleus ==eccentric== و chromatin شكلها **«clock-face»**
          - **RER** كتير (بيعمل البروتين) و **Golgi** واضح (بيغلّفه)

          موجود في الـ **bone marrow** وما بيلفّش في الدم عادةً. والـ **multiple myeloma** هو ==plasma cell dyscrasia==.
        page: 415
        quote: "“Clock-face” chromatin distribution and eccentric nucleus, abundant RER, and well-developed Golgi apparatus (arrows in A ). Found in bone marrow and normally do not circulate in peripheral blood. Multiple myeloma is a plasma cell dyscrasia."
      - kind: table
        title: "مين عليه إيه"
        columns: ["Cell", "Markers", "Immunity"]
        rows:
          - ["B cell", "CD19, CD20, CD21", "Adaptive (humoral)"]
          - ["Cytotoxic T cell", "CD3, CD8", "Adaptive (cellular)"]
          - ["Helper T cell", "CD3, CD4", "Adaptive (cellular)"]
          - ["NK cell", "CD56, CD16", "Innate"]
        hide: [[0, 1], [1, 1], [3, 1], [3, 2]]
        page: 415
        quote: "Natural killer cells CD56 Lytic granules CD16 (FcR) C NK cell Important in innate immunity, especially against intracellular pathogens. NK cells are larger than B and T cells, with distinctive cytoplasmic lytic granules (containing perforin and granzymes) that, when released, act on target cells to induce apoptosis. Distinguish between healthy and infected cells by identifying cell surface proteins (induced by stress, malignant transformation, or microbial infections). Induce apoptosis (natural killer) in cells that do not express class I MHC cell surface molecules, eg, virally infected cells in which these molecules are downregulated. B cells CD20 CD21 CD19 B cell Mediate humoral immune response. Originate from stem cells in bone marrow and matures in marrow. Migrate to peripheral lymphoid tissue (follicles of lymph nodes, white pulp of spleen, unencapsulated lymphoid tissue). When antigen is encountered, B cells differentiate into plasma cells (which produce antibodies) and memory cells. Can function as an APC. B = bone marrow. T cells CD8 CD3 CD3 Tc CD4 Th Mediate cellular immune response."
