lecture: heme.L02
lessons:
  - id: heme.L02.lesson1
    title: "شجرة الدم، والـ neutrophil، والكرة الحمرا، والـ platelet"
    hook: "كل خلية في الدم ليها أصل وشغلانة وشكل. ابدأ بالشجرة وكل حاجة هتقعد في مكانها"
    minutes: 10
    pages: [412, 413]
    topics: [hematopoiesis, neutrophils, erythrocytes, thrombocytes]
    goals:
      - "ترسم شجرة الـ hematopoiesis: myeloid ولا lymphoid"
      - "تقرا الـ neutrophil في الـ smear: left shift، toxic granulation، hypersegmented، leukoerythroblastic"
      - "تعرف ليه الـ RBC شكله كده، وليه الـ platelet عايش 8 أيام"
    status: unverified
    steps:
      - kind: explain
        title: "شجرة واحدة، فرعين"
        text: |-
          كل خلايا الدم طالعة من ==multipotent stem cell== في الـ bone marrow، وبتتقسم لفرعين:

          - **Myeloid stem cell**: بيطلّع الـ erythroblast (← reticulocyte ← RBC)، والـ megakaryoblast (← megakaryocyte ← platelets)، والـ myeloblast (← band ← neutrophil، وكمان eosinophil و basophil)، والـ monoblast (← monocyte ← macrophage).
          - **Lymphoid stem cell**: بيطلّع الـ lymphoblast، ومنه الـ B cell (← plasma cell)، والـ T cell (← T-helper و T-cytotoxic)، والـ ==NK cell==.
        page: 412
        quote: "Megakaryoblast Lymphoblast Myeloblast Erythroblast Granulocytopoiesis Monocytopoiesis Multipotent stem cell Lymphoid stem cell"
      - kind: figure
        title: "شجرة الـ hematopoiesis"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="heme2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="115" y="5" width="130" height="24" rx="6"/>
            <text x="124" y="22" class="t-sm t-b">Multipotent stem cell</text>
            <path class="fg-arrow" d="M150 29 L90 50" marker-end="url(#heme2a)"/>
            <path class="fg-arrow" d="M210 29 L270 50" marker-end="url(#heme2a)"/>
            <rect class="fg-acc" x="20" y="52" width="140" height="24" rx="6"/>
            <text x="40" y="69" class="t-sm t-b">Myeloid stem cell</text>
            <rect class="fg-good" x="200" y="52" width="140" height="24" rx="6"/>
            <text x="218" y="69" class="t-sm t-b">Lymphoid stem cell</text>
            <text x="12" y="100" class="t-sm">Erythroblast → RBC</text>
            <text x="12" y="120" class="t-sm">Megakaryoblast → platelets</text>
            <text x="12" y="140" class="t-sm">Myeloblast → neutrophil,</text>
            <text x="30" y="156" class="t-sm">eosinophil, basophil</text>
            <text x="12" y="176" class="t-sm">Monoblast → monocyte →</text>
            <text x="30" y="192" class="t-sm">macrophage</text>
            <text x="205" y="100" class="t-sm">Lymphoblast →</text>
            <text x="215" y="120" class="t-sm">B cell → plasma cell</text>
            <text x="215" y="140" class="t-sm">T cell → helper,</text>
            <text x="250" y="156" class="t-sm">cytotoxic</text>
            <text x="215" y="176" class="t-sm t-acc">NK cell</text>
          </svg>
        caption: "الفرع الـ myeloid بيطلّع كل حاجة ما عدا الـ lymphocytes. والـ NK cell، رغم إنه innate، طالع من الفرع الـ lymphoid."
        alt: "Tree diagram. The multipotent stem cell splits into a myeloid stem cell, giving erythroblasts to red cells, megakaryoblasts to platelets, myeloblasts to neutrophils, eosinophils and basophils, and monoblasts to monocytes and macrophages; and a lymphoid stem cell, giving lymphoblasts to B cells and plasma cells, T cells, and NK cells."
        page: 412
        quote: "Multipotent stem cell Lymphoid stem cell Band NK cell Monoblast Macrophage Monocyte"
      - kind: explain
        title: "الـ neutrophil: أول واحد يوصل"
        text: |-
          الـ neutrophil هو خلية الـ ==acute inflammation==: بيلتهم البكتيريا، والـ nucleus بتاعه **multilobed**.

          عنده نوعين granules:
          - **Specific**: LAP (leukocyte alkaline phosphatase)، collagenase، lysozyme، lactoferrin
          - **Azurophilic** (دي lysosomes): proteinases، acid phosphatase، ==myeloperoxidase==، β-glucuronidase

          وبيتجذب للمكان بـ: C5a، IL-8، LTB4، 5-HETE، kallikrein، platelet-activating factor، و N-formylmethionine (من بروتينات البكتيريا).
        page: 412
        quote: "Specific granules contain leukocyte alkaline phosphatase (LAP), collagenase, lysozyme, and lactoferrin. Azurophilic granules (lysosomes) contain proteinases, acid phosphatase, myeloperoxidase, and β-glucuronidase."
      - kind: reveal
        prompt: "ليه الـ N-formylmethionine بالذات بيجذب الـ neutrophils؟"
        answer: "لأن البكتيريا بتبدأ بروتيناتها بـ **formylmethionine**، وخلايانا ما بتعملش كده. فوجوده معناه «في بكتيريا هنا»، فالـ neutrophil بيمشي ناحيته."
        page: 412
        quote: "N-formylmethionine (bacterial proteins)."
      - kind: table
        title: "اقرا الـ neutrophil في الـ smear"
        columns: ["Finding", "What it means"]
        rows:
          - ["Toxic granulation, Döhle bodies, vacuoles", "Inflammation (eg, bacterial infection)"]
          - ["Left shift (bands, metamyelocytes)", "↑ myeloid proliferation: inflammation, CML"]
          - ["Left shift + immature RBCs", "Leukoerythroblastic reaction: marrow infiltration (myelofibrosis, metastasis)"]
          - ["Hypersegmented (5-6+ lobes)", "Vitamin B12/folate deficiency"]
        hide: [[1, 1], [2, 1], [3, 1]]
        page: 412
        quote: "Left shift—↑ neutrophil precursors (eg, band cells, metamyelocytes) in peripheral blood. Reflects states of ↑ myeloid proliferation (eg, inflammation, CML). Leukoerythroblastic reaction—left shift accompanied by immature RBCs. Suggests bone marrow infiltration (eg, myelofibrosis, metastasis)."
      - kind: aside
        tone: analogy
        text: "الـ **leukoerythroblastic reaction** زي ما تلاقي عيال صغيرين في الشارع بالليل، أبيض وأحمر مع بعض. معناه إن ==البيت (الـ marrow) اتملا بحاجة غريبة== (fibrosis أو metastasis) فطردهم بدري."
        page: 412
        quote: "Leukoerythroblastic reaction—left shift accompanied by immature RBCs. Suggests bone marrow infiltration"
      - kind: check
        question: "A smear shows neutrophils with 6 nuclear lobes. Which deficiency is most likely?"
        options:
          - "Vitamin B12 or folate"
          - "Iron"
          - "Glucose-6-phosphate dehydrogenase"
          - "Vitamin K"
        answer: 0
        why:
          - "صح: الـ hypersegmented neutrophils (5-6+ lobes) علامة B12/folate deficiency."
          - "الـ iron deficiency ما بيعملش hypersegmentation."
          - "ده enzyme في الـ RBC، مالوش دعوة بشكل الـ neutrophil."
          - "الـ vitamin K بيأثر على التجلط مش على الـ neutrophils."
        page: 412
        quote: "Hypersegmented neutrophils (nucleus has 5-6+ lobes) are seen in vitamin B12 /folate deficiency."
      - kind: explain
        title: "الـ RBC: شنطة أكسجين"
        text: |-
          الـ RBC ==anucleate ومن غير organelles==، و**biconcave** عشان الـ surface area للـ volume تبقى كبيرة والغازات تتبادل بسرعة.

          - عايش **~120 يوم** في الكبار، و**60-90** في المواليد.
          - ما عندوش mitochondria، فطاقته من الـ **glucose**: 90% glycolysis و10% HMP shunt.
          - في الـ membrane فيه **Cl−/HCO3− antiporter**: بيطلّع الـ HCO3− عشان الـ CO2 يتنقل من الأنسجة للرئة.
        page: 413
        quote: "Life span of ~120 days in healthy adults; 60-90 days in neonates. Source of energy is glucose (90% used in glycolysis, 10% used in HMP shunt)."
      - kind: match
        prompt: "وصّل كل مصطلح بمعناه"
        pairs:
          - ["Erythrocytosis (polycythemia)", "↑ Hct"]
          - ["Anisocytosis", "Varying sizes"]
          - ["Poikilocytosis", "Varying shapes"]
          - ["Reticulocyte", "Immature RBC"]
          - ["Polychromasia", "Residual ribosomal RNA (bluish)"]
        why: "**aniso** = مش متساوي (الحجم)، **poikilo** = متنوع (الشكل). والـ reticulocyte لونه أزرق شوية لأن فيه لسه ribosomal RNA."
        page: 413
        quote: "Erythrocytosis = polycythemia = ↑ Hct. Anisocytosis = varying sizes. Poikilocytosis = varying shapes. Reticulocyte = immature RBC; reflects erythroid proliferation."
      - kind: explain
        title: "الـ platelet: حتة من megakaryocyte"
        text: |-
          الـ platelet مش خلية كاملة: حتة cytoplasm صغيرة من الـ **megakaryocyte**، من غير nucleus، وشغلانته الـ ==1° hemostasis==. عايش **8-10 أيام** (الكتاب بيكتبها pl8lets).

          - **Dense granules** = **CASH**: Ca2+، ADP، Serotonin، Histamine
          - **α granules**: vWF، fibrinogen، fibronectin، platelet factor 4
          - الـ receptor بتاع الـ vWF هو ==GpIb==، وبتاع الـ fibrinogen هو **GpIIb/IIIa**
          - **1/3** الـ platelets متخزنة في الـ spleen، والـ **thrombopoietin** بيكثّر الـ megakaryocytes
          - لو قلّت أو شغلها باظ ← **petechiae**
        page: 413
        quote: "Contain dense granules (Ca2+ , ADP, Serotonin, Histamine; CASH) and α granules (vWF, fibrinogen, fibronectin, platelet factor 4)."
      - kind: check
        question: "Platelets fail to adhere to exposed subendothelium, but aggregate normally once activated. Which receptor is most likely missing?"
        options:
          - "GpIb"
          - "GpIIb/IIIa"
          - "CD14"
          - "Thrombopoietin receptor"
        answer: 0
        why:
          - "صح: GpIb هو الـ vWF receptor، والـ vWF هو اللي بيلزّق الـ platelet في الـ subendothelium."
          - "GpIIb/IIIa بيمسك الـ fibrinogen وبيربط الـ platelets في بعض (aggregation)، وده سليم هنا."
          - "CD14 على الـ macrophage وبيمسك الـ LPS."
          - "الـ thrombopoietin بيكثّر الـ megakaryocytes، مش ليه دعوة بالـ adhesion."
        page: 413
        quote: "vWF receptor: GpIb. Fibrinogen receptor: GpIIb/IIIa."
      - kind: try
        items: [heme.L02.001, heme.L02.005, heme.L02.010, heme.L02.020, heme.L02.021]
    recap:
      - "Myeloid: RBC، platelets، granulocytes، monocytes. Lymphoid: B و T و NK."
      - "Left shift = myeloid proliferation؛ مع immature RBCs = marrow infiltration؛ 5-6+ lobes = B12/folate."
      - "RBC: 120 يوم، glucose (90% glycolysis)، Cl−/HCO3− antiporter."
      - "Platelet: 8-10 أيام، CASH و α granules، GpIb للـ vWF و GpIIb/IIIa للـ fibrinogen."
