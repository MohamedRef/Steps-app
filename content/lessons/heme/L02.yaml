  - id: heme.L02.lesson2
    title: "اللي بياكلوا واللي بيقدّموا واللي بيعملوا allergy"
    hook: "Monocyte و macrophage و dendritic و eosinophil و basophil و mast cell: كل واحد بجملة واحدة تفتكره بيها"
    minutes: 10
    pages: [413, 414]
    topics: [monocytes, macrophages, dendritic-cells, eosinophils, basophils, mast-cells]
    goals:
      - "تعرف أسامي الـ macrophages في كل نسيج، وإيه اللي بيعمل septic shock"
      - "تحفظ أسباب الـ eosinophilia بـ PACMAN Eats"
      - "تفرّق بين الـ basophil والـ mast cell، وتعرف الـ mastocytosis"
    status: unverified
    steps:
      - kind: explain
        title: "Monocyte في الدم، macrophage في النسيج"
        text: |-
          الـ **monocyte** هو أكبر خلية بيضا في الـ smear: nucleus ==kidney-shaped== و cytoplasm زي «frosted glass». أول ما يدخل النسيج بيبقى **macrophage** أو **dendritic cell**.

          الـ **macrophage** بياكل البكتيريا والـ debris والـ RBCs العجوزة، وبيعيش كتير في النسيج. بيتنشّط بـ ==IFN-γ==، وبيقدّم antigen على **MHC II**، وبيعمل كمان antibody-dependent cellular cytotoxicity. وهو أساس الـ **granuloma** (TB، sarcoidosis)، وهناك ممكن يلتحم ويعمل giant cells.
        page: 413
        quote: "Activated by IFN-γ. Can function as antigen-presenting cell via MHC II. Also engage in antibody- dependent cellular cytotoxicity. Important cellular component of granulomas (eg, TB, sarcoidosis), where they may fuse to form giant cells."
      - kind: match
        prompt: "وصّل النسيج باسم الـ macrophage بتاعه"
        pairs:
          - ["Liver", "Kupffer cells"]
          - ["Connective tissue", "Histiocytes"]
          - ["Bone", "Osteoclasts"]
          - ["Brain", "Microglial cells"]
        why: "كلهم نفس الخلية بأسامي مختلفة حسب المكان. الـ osteoclast بالذات بيتنسي إنه macrophage."
        page: 413
        quote: "Macrophage naming varies by specific tissue type (eg, Kupffer cells in liver, histiocytes in connective tissue, osteoclasts in bone, microglial cells in brain)."
      - kind: figure
        title: "Monocyte واحد، أسامي كتير"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="heme2l2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="6" y="78" width="96" height="48" rx="8"/>
            <text x="54" y="100" text-anchor="middle" class="t-sm t-b">Monocyte</text>
            <text x="54" y="118" text-anchor="middle" class="t-sm t-mut">in blood</text>
            <text x="54" y="146" text-anchor="middle" class="t-sm t-mut">→ tissues</text>
            <path class="fg-arrow-acc" d="M102 94 L146 70" marker-end="url(#heme2l2a)"/>
            <path class="fg-arrow-acc" d="M102 112 L146 164" marker-end="url(#heme2l2a)"/>
            <rect class="fg-good" x="150" y="8" width="204" height="124" rx="8"/>
            <text x="252" y="30" text-anchor="middle" class="t-sm t-b">Macrophage</text>
            <text x="160" y="54" class="t-sm">Liver: Kupffer cells</text>
            <text x="160" y="76" class="t-sm">Connective tissue: histiocytes</text>
            <text x="160" y="98" class="t-sm">Bone: osteoclasts</text>
            <text x="160" y="120" class="t-sm">Brain: microglial cells</text>
            <rect class="fg-acc" x="150" y="144" width="204" height="50" rx="8"/>
            <text x="252" y="164" text-anchor="middle" class="t-sm t-b">Dendritic cell</text>
            <text x="252" y="184" text-anchor="middle" class="t-sm">APC: innate ↔ adaptive link</text>
          </svg>
        caption: "الـ monocyte بيلف في الدم، ولما يدخل النسيج يبقى macrophage أو dendritic cell. والـ macrophage اسمه بيتغيّر حسب النسيج اللي قاعد فيه."
        alt: "A monocyte in blood enters tissues and becomes either a macrophage or a dendritic cell. The macrophage box lists its tissue names: Kupffer cells in liver, histiocytes in connective tissue, osteoclasts in bone, microglial cells in brain. The dendritic cell box says it is an antigen-presenting cell linking innate and adaptive immunity."
        page: 413
        quote: "Found in blood, differentiate into macrophages or dendritic cells. in tissues."
      - kind: aside
        tone: exam
        text: "سؤال septic shock من gram-negative؟ الـ ==Lipid A== اللي في الـ LPS بيمسك **CD14** على الـ macrophage، وده اللي بيبدأ الشلال."
        page: 413
        quote: "Lipid A from bacterial LPS binds CD14 on macrophages to initiate septic shock."
      - kind: explain
        title: "الـ dendritic cell: الجسر"
        text: |-
          الـ dendritic cell هو ==أقوى APC==: بيلتهم الـ antigen ويروح الـ lymph node ينشّط الـ T cells، فهو الجسر بين الـ innate والـ adaptive.

          عليه **MHC II** و **Fc receptors**. والمميز فيه: يقدر يقدّم antigen جاي من بره (exogenous) على **MHC I**، ودي اسمها ==cross-presentation==، وبكده بينشّط الـ CD8 T cells ضد فيروس ما أصابوش هو نفسه.
        page: 414
        quote: "Highly phagocytic antigen-presenting cells (APCs) A . Function as link between innate and adaptive immune systems (eg, via T-cell stimulation). Express MHC class II and Fc receptors on surface. Can present exogenous antigens on MHC class I (cross-presentation)."
      - kind: check
        question: "Which cell can present an engulfed (exogenous) viral antigen on MHC class I to CD8+ T cells?"
        options:
          - "Dendritic cell"
          - "Neutrophil"
          - "Mast cell"
          - "Plasma cell"
        answer: 0
        why:
          - "صح: ده الـ cross-presentation، والـ dendritic cell بيعمله."
          - "الـ neutrophil بيلتهم ويقتل، مش APC."
          - "الـ mast cell بتاع الـ allergy."
          - "الـ plasma cell بيعمل antibodies بس."
        page: 414
        quote: "Can present exogenous antigens on MHC class I (cross-presentation)."
      - kind: explain
        title: "الـ eosinophil: ضد الديدان"
        text: |-
          الـ eosinophil nucleus بتاعه ==bilobate==، ومليان granules كبيرة وردي بنفس الحجم. شغلانته الأساسية ضد الـ **helminths**، بالـ **major basic protein** (MBP، ده الـ helminthotoxin). وبيلتهم كمان الـ antigen-antibody complexes.

          بيعمل: histaminase، MBP، eosinophil cationic protein، eosinophil-derived neurotoxin، و**IL-5** (اللي بيكثّر الـ eosinophils وينشّطها).
        page: 414
        quote: "Defend against helminthic infections (major basic protein). Bilobate nucleus. Packed with large eosinophilic granules of uniform size A . Highly phagocytic for antigen- antibody complexes."
      - kind: mnemonic
        word: "PACMANE"
        parts:
          - { key: "P", text: "Parasites" }
          - { key: "A", text: "Asthma" }
          - { key: "C", text: "Chronic adrenal insufficiency" }
          - { key: "M", text: "Myeloproliferative disorders" }
          - { key: "A", text: "Allergic processes" }
          - { key: "N", text: "Neoplasia (eg, Hodgkin lymphoma)" }
          - { key: "E", text: "Eosinophilic granulomatosis with polyangiitis" }
        hook: "أسباب الـ eosinophilia من الكتاب: PACMAN Eats"
        page: 414
        quote: "Causes of eosinophilia (PACMAN Eats): Parasites Asthma Chronic adrenal insufficiency Myeloproliferative disorders Allergic processes Neoplasia (eg, Hodgkin lymphoma) Eosinophilic granulomatosis with polyangiitis"
      - kind: reveal
        prompt: "ليه الـ chronic adrenal insufficiency بيعمل eosinophilia؟"
        answer: "الـ **cortisol** في العادي بيقلّل الـ eosinophils في الدم. لو الـ adrenal مش بيعمل cortisol كفاية، الفرامل دي بتروح فالـ eosinophils تزيد. (ده تفسير فسيولوجي مقبول؛ الكتاب بيذكر السبب في القائمة بس.)"
        page: 414
        quote: "Chronic adrenal insufficiency"
      - kind: explain
        title: "Basophil و mast cell: قرايب مش توأم"
        text: |-
          - **Basophil** (في الدم): granules غامقة فيها **heparin** (anticoagulant) و**histamine** (vasodilator)، والـ leukotrienes بيعملها وقت اللزوم. الـ ==basophilia== نادرة، بس ممكن تبقى علامة **myeloproliferative disorder**، خصوصاً **CML**.
          - **Mast cell** (في النسيج): من نفس الـ precursor بتاع الـ basophil بس ==مش نفس الخلية==. بيمسك الـ Fc بتاع الـ **IgE**. بيتنشّط بالـ tissue trauma، و C3a و C5a، و IgE cross-linking ← degranulation ← histamine و heparin و tryptase و eosinophil chemotactic factors. ده أساس الـ **type I hypersensitivity**.
        page: 414
        quote: "Originate from same precursor as basophils but are not the same cell type. Can bind the Fc portion of IgE to membrane. Activated by tissue trauma, C3a and C5a, surface IgE cross-linking by antigen (IgE receptor aggregation) → degranulation → release of histamine, heparin, tryptase, and eosinophil chemotactic factors."
      - kind: aside
        tone: trap
        text: "**Vancomycin** و **opioids** و **radiocontrast dye** بيعملوا mast cell degranulation ==من غير IgE==. فالمريض ممكن يحمرّ ويهرش من أول جرعة، من غير ما يكون اتعرّض للدوا قبل كده. و**cromolyn sodium** بيمنع الـ degranulation (للوقاية من الـ asthma)."
        page: 414
        quote: "Cromolyn sodium prevents mast cell degranulation (used for asthma prophylaxis). Vancomycin, opioids, and radiocontrast dye can elicit IgE-independent mast cell degranulation."
      - kind: explain
        title: "Mastocytosis"
        text: |-
          مرض نادر: mast cells بتتكاثر في الجلد و/أو أعضاء تانية. مرتبط بـ ==c-KIT mutations== و**↑ serum tryptase**.

          وكل أعراضه من الـ **histamine** الزيادة: flushing، pruritus، hypotension، abdominal pain، diarrhea، و**peptic ulcer disease** (الـ histamine بيزوّد الـ acid).
        page: 414
        quote: "Mastocytosis—rare; proliferation of mast cells in skin and/or extracutaneous organs. Associated with c-KIT mutations and ↑ serum tryptase. ↑ histamine → flushing, pruritus, hypotension, abdominal pain, diarrhea, peptic ulcer disease."
      - kind: sort
        prompt: "حط كل حاجة مع الخلية بتاعتها"
        bins: ["Eosinophil", "Mast cell", "Macrophage"]
        cards:
          - { text: "Major basic protein", bin: 0 }
          - { text: "IL-5", bin: 0 }
          - { text: "Tryptase", bin: 1 }
          - { text: "c-KIT mutation (when proliferating)", bin: 1 }
          - { text: "CD14 binds lipid A", bin: 2 }
          - { text: "Activated by IFN-γ", bin: 2 }
          - { text: "Bilobate nucleus", bin: 0 }
          - { text: "Binds the Fc portion of IgE", bin: 1 }
        why: "الـ eosinophil: ديدان (MBP) و IL-5 و bilobate. الـ mast cell: IgE و tryptase و c-KIT. الـ macrophage: CD14 و IFN-γ."
        page: 414
        quote: "Can bind the Fc portion of IgE to membrane."
      - kind: try
