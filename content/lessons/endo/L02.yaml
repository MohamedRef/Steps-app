schema: steps.lesson/v1
lecture: endo.L02
lessons:
  - id: endo.L02.lesson1
    title: "الـ pituitary والـ adrenal والـ islets: مين بيعمل إيه ومنين جاي"
    hook: "صفحة واحدة فيها 3 غدد، وكل واحدة ليها قاعدة واحدة لو فهمتها مش هتحتاج تحفظ"
    minutes: 9
    pages: [331, 331]
    topics: [pituitary-gland, adrenal-cortex-and-medulla, endocrine-pancreas-cell-types]
    goals:
      - "تعدّ هرمونات الـ anterior pituitary وتقسمهم basophils و acidophils"
      - "تفهم ليه TSH و LH و FSH و hCG شبه بعض"
      - "تربط كل طبقة في الـ adrenal بالهرمون اللي بيتحكم فيها"
      - "تعرف مكان كل خلية في الـ islet"
    status: unverified
    steps:
      - kind: explain
        title: "الـ pituitary: غدتين لازقين في بعض"
        text: |-
          الـ pituitary في الحقيقة غدتين ليهم أصل مختلف خالص:
          - **Anterior (adenohypophysis)**: من الـ ==oral ectoderm (Rathke pouch)==، يعني حتة من سقف البق طلعت لفوق. دي غدة حقيقية بتصنّع هرموناتها.
          - **Posterior (neurohypophysis)**: من الـ ==neuroectoderm==، يعني امتداد للمخ نفسه. دي ما بتصنعش حاجة: بتخزّن وتطلّع **ADH** و **oxytocin** اللي اتعملوا في الـ hypothalamus (supraoptic و paraventricular nuclei) ونزلوا على الـ axons مع بروتينات شايلاهم اسمها **neurophysins**.
        page: 331
        quote: "Stores and releases vasopressin (antidiuretic hormone, or ADH) and oxytocin, both made in the hypothalamus (supraoptic and paraventricular nuclei) and transported to posterior pituitary via neurophysins (carrier proteins). Derived from neuroectoderm."
      - kind: mnemonic
        word: "FLATPeG"
        parts:
          - { key: "F", text: "FSH" }
          - { key: "L", text: "LH" }
          - { key: "A", text: "ACTH" }
          - { key: "T", text: "TSH" }
          - { key: "P", text: "Prolactin (PRL)" }
          - { key: "e", text: "مجرد حرف عشان الكلمة تتنطق PeG" }
          - { key: "G", text: "GH" }
        hook: "FLAT PeG من الكتاب: هرمونات الـ anterior pituitary. وزوّد عليهم β-endorphin، والـ MSH من الـ intermediate lobe."
        page: 331
        quote: "FLAT PeG: FSH, LH, ACTH, TSH, PRL, GH."
      - kind: table
        title: "Basophils ولا acidophils؟"
        columns: ["Cell", "Hormones", "Mnemonic"]
        rows:
          - ["Basophils", "FSH, LH, ACTH, TSH", "B-FLAT"]
          - ["Acidophils", "PRL, GH", "Acid PiG"]
        hide: [[0, 1], [1, 1]]
        page: 331
        quote: "B-FLAT: Basophils—FSH, LH, ACTH, TSH. Acid PiG: Acidophils — PRL, GH."
      - kind: explain
        title: "4 هرمونات بنفس الـ α"
        text: |-
          الـ **TSH** و **LH** و **FSH** و **hCG** كلهم glycoproteins معمولين من وحدتين:
          - ==α subunit==: واحدة في الأربعة.
          - ==β subunit==: هي اللي بتحدد الهرمون ده مين (specificity).

          عشان كده الـ pregnancy test بيدوّر على **β-hCG**: لو دوّر على الـ α هيلاقيه في أي حد عنده TSH.
        page: 331
        quote: "α subunit—hormone subunit common to TSH, LH, FSH, and hCG. β subunit—determines hormone specificity."
      - kind: mnemonic
        word: "BAM"
        parts:
          - { key: "B", text: "β-endorphin" }
          - { key: "A", text: "ACTH" }
          - { key: "M", text: "MSH" }
        hook: "Go pro with a BAM! (من الكتاب): التلاتة دول طالعين من نفس الجزيء الكبير، الـ POMC."
        page: 331
        quote: "Proopiomelanocortin (POMC) derivatives— β-endorphin, ACTH, and MSH. Go pro with a BAM!"
      - kind: reveal
        prompt: "مريض عنده ACTH عالي جداً، تتوقع لون جلده يبقى إزاي؟ وليه؟"
        answer: "غامق (hyperpigmentation). الـ ACTH والـ ==MSH== طالعين من نفس الـ POMC، فلما الجسم يصنّع POMC كتير عشان ACTH، الـ MSH بيعلى معاه ويحفّز الـ melanocytes."
        page: 331
        quote: "Proopiomelanocortin (POMC) derivatives— β-endorphin, ACTH, and MSH."
      - kind: check
        question: "Which hormone does NOT share the common α subunit?"
        options:
          - "ACTH"
          - "TSH"
          - "LH"
          - "hCG"
        answer: 0
        why:
          - "صح: الـ ACTH من الـ POMC، مش glycoprotein بـ α و β."
          - "الـ TSH من الأربعة اللي شايلين نفس الـ α."
          - "الـ LH من الأربعة."
          - "الـ hCG من الأربعة، وعشان كده بنقيس الـ β بتاعه."
        page: 331
        quote: "α subunit—hormone subunit common to TSH, LH, FSH, and hCG."
      - kind: explain
        title: "الـ adrenal: قشرة ولبّ"
        text: |-
          برضه غدتين في واحدة:
          - **Cortex** من الـ ==mesoderm==: بيعمل steroids.
          - **Medulla** من الـ ==neural crest==: هي عملياً sympathetic ganglion متخصص. الـ **chromaffin cells** بتاعتها بتاخد أوامرها من **preganglionic sympathetic fibers** مباشرة وبتطلّع **Epi و NE** في الدم.
        page: 331
        quote: "Adrenal cortex (derived from mesoderm) and medulla (derived from neural crest)."
      - kind: figure
        title: "طبقات الـ adrenal من برّه لجوّه"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="10" y="10" width="120" height="190" rx="14"/>
            <rect class="fg-acc" x="18" y="18" width="104" height="40" rx="8"/>
            <text x="30" y="43" class="t-sm t-b">Glomerulosa</text>
            <rect class="fg-good" x="18" y="62" width="104" height="44" rx="8"/>
            <text x="30" y="89" class="t-sm t-b">Fasciculata</text>
            <rect class="fg-box" x="18" y="110" width="104" height="40" rx="8"/>
            <text x="30" y="135" class="t-sm t-b">Reticularis</text>
            <rect class="fg-bad" x="18" y="154" width="104" height="40" rx="8"/>
            <text x="38" y="179" class="t-sm t-b">Medulla</text>
            <text x="142" y="35" class="t-sm">Angiotensin II → aldosterone</text>
            <text x="142" y="50" class="t-sm t-acc">salt</text>
            <text x="142" y="80" class="t-sm">ACTH, CRH → cortisol</text>
            <text x="142" y="95" class="t-sm t-good">sugar</text>
            <text x="142" y="128" class="t-sm">ACTH, CRH → DHEA</text>
            <text x="142" y="143" class="t-sm t-mut">sex</text>
            <text x="142" y="172" class="t-sm">Sympathetic fibers → Epi, NE</text>
            <text x="142" y="187" class="t-sm t-bad">chromaffin cells</text>
          </svg>
        caption: "من برّه لجوّه: GFR = salt و sugar و sex، وبعدين الـ medulla. الطبقة الخارجية بس هي اللي بتسمع كلام الـ angiotensin II، والتانيين بيسمعوا كلام الـ ACTH."
        alt: "Adrenal gland layers from outside in: zona glomerulosa (angiotensin II to aldosterone, salt), zona fasciculata (ACTH and CRH to cortisol, sugar), zona reticularis (ACTH and CRH to DHEA, sex), medulla (sympathetic fibers to epinephrine and norepinephrine, chromaffin cells)."
        page: 331
        quote: "GFR corresponds with salt (mineralocorticoids), sugar (glucocorticoids), and sex (androgens)."
      - kind: aside
        tone: exam
        text: "سؤال كلاسيكي: مريض الـ pituitary اتشال أو باظ، ليه الـ aldosterone بتاعه كويس نسبياً؟ لأن الـ ==zona glomerulosa== بتتحكم فيها الـ **angiotensin II** مش الـ ACTH."
        page: 331
        quote: "Angiotensin II Mineralocorticoids Aldosterone Zona Fasciculata ACTH, CRH Glucocorticoids Cortisol"
      - kind: explain
        title: "الـ islets: الـ insulin في النص"
        text: |-
          الـ **islets of Langerhans** تجمعات من خلايا α و β و δ، طالعة من الـ **pancreatic buds**:
          - **α = glucαgon**: على الأطراف (==peripheral==).
          - **β = insulin**: في النص (==central==)، وهي أغلبية الخلايا.
          - **δ = somatostatin**: متفرقة بينهم (interspersed).

          الكتاب بيكتبها glucαgon بحرف α عشان تفتكر.
        page: 331
        quote: "α = glucαgon (peripheral) β = insulin (central) δ = somatostatin (interspersed)"
      - kind: match
        prompt: "وصّل كل حاجة بأصلها أو بالهرمون بتاعها"
        pairs:
          - ["Anterior pituitary", "Oral ectoderm (Rathke pouch)"]
          - ["Posterior pituitary", "Neuroectoderm"]
          - ["Adrenal cortex", "Mesoderm"]
          - ["Adrenal medulla", "Neural crest"]
          - ["δ cells", "Somatostatin"]
        why: "الأمامية من سقف البق، والخلفية من المخ. القشرة mesoderm، واللبّ neural crest زي أي sympathetic ganglion."
        page: 331
        quote: "Adrenal cortex (derived from mesoderm) and medulla (derived from neural crest)."
      - kind: try
        items: [endo.L02.001, endo.L02.004, endo.L02.005, endo.L02.010, endo.L02.015]
    recap:
      - "Anterior pituitary من Rathke pouch: FLAT PeG + β-endorphin. Posterior من الـ neuroectoderm: بيخزّن ADH و oxytocin."
      - "B-FLAT basophils، و Acid PiG acidophils."
      - "TSH و LH و FSH و hCG نفس الـ α؛ الـ β هو اللي بيفرّق."
      - "POMC ← β-endorphin و ACTH و MSH (BAM)."
      - "GFR = salt و sugar و sex؛ الـ glomerulosa تحت أمر angiotensin II، والـ medulla من الـ neural crest."
      - "α على الأطراف، β في النص، δ متفرقة."
