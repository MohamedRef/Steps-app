        caption: "كل زرار في الـ hypothalamus بيشغّل هرمون في الـ anterior pituitary. لاحظ الـ TRH بيشغّل الـ TSH والـ prolactin مع بعض، والـ dopamine والـ somatostatin هما الفرامل."
        alt: "Hypothalamic hormones CRH, GnRH, TRH, GHRH stimulate ACTH, FSH and LH, TSH and prolactin, and GH respectively; somatostatin inhibits GH and dopamine inhibits prolactin."
        page: 332
        quote: "TRH ↑ TSH, ↑ prolactin"
      - kind: explain
        title: "كل زرار وشغلته"
        text: |-
          - **CRH** ← ↑ ACTH و MSH و β-endorphin (كلهم من الـ POMC). بيقل مع ==chronic glucocorticoid use== (الـ feedback).
          - **GnRH** ← ↑ FSH و LH. لازم ييجي **pulsatile** عشان البلوغ والخصوبة؛ لو اديته **tonic** (زي leuprolide) بيقفل المحور كله.
          - **TRH** ← ↑ TSH و ==prolactin== كمان.
          - **GHRH** ← ↑ GH، والـ analog بتاعه **tesamorelin** بيعالج الـ HIV-associated lipodystrophy.
          - **Somatostatin (GHIH)** ← ↓ GH و TSH.
          - **Dopamine** (prolactin-inhibiting factor) ← ↓ prolactin و TSH.
        page: 332
        quote: "Tonic GnRH analog (eg, leuprolide) suppresses hypothalamic–pituitary–gonadal axis. Pulsatile GnRH leads to puberty, fertility"
      - kind: aside
        tone: analogy
        text: "الـ GnRH زي جرس الباب: لو رنّيت كل شوية الناس تفتح (pulsatile ← FSH و LH). لو حطيت صباعك على الجرس وسبته (tonic) الناس هتطنّش خالص. عشان كده ==leuprolide== المستمر بيوقف المحور، وبنستخدمه نقفل الـ testosterone أو الـ estrogen."
        page: 332
        quote: "Tonic GnRH analog (eg, leuprolide) suppresses hypothalamic–pituitary–gonadal axis."
      - kind: explain
        title: "الـ prolactin: الهرمون الوحيد اللي فرامله أقوى من بنزينه"
        text: |-
          معظم الـ anterior pituitary بيستنى أمر عشان يشتغل. الـ prolactin العكس: الـ hypothalamus بيدوس عليه فرامل ==طول الوقت== بالـ dopamine من الـ **tuberoinfundibular pathway**. والـ dopamine أقوى في التحكم فيه من الـ TRH.

          والـ prolactin نفسه بيعلّي الـ dopamine عشان يوقف نفسه (negative feedback).

          الـ prolactin بيعمل لبن، وبيقفل الـ ==GnRH==. وده بيفسّر كل أعراضه: الرضاعة بتأخر التبويض (منع حمل طبيعي)، والـ prolactinoma بتعمل amenorrhea و osteoporosis و hypogonadism و galactorrhea.
        page: 334
        quote: "Prolactin secretion from anterior pituitary is tonically inhibited by dopamine from tuberoinfundibular pathway of hypothalamus."
      - kind: reveal
        prompt: "طب لو اديت المريض دوا بيـ block الـ dopamine (زي antipsychotic أو metoclopramide)، الـ prolactin هيعمل إيه؟ وإيه اللي هيعالج الـ prolactinoma؟"
        answer: "الفرامل اتشالت ← ==hyperprolactinemia== ← galactorrhea و amenorrhea. والعلاج بالعكس: **dopamine agonists** (bromocriptine و cabergoline) يرجّعوا الفرامل. والـ estrogens (OCPs و الحمل) كمان بتعلّي الـ prolactin."
        page: 334
        quote: "Dopamine antagonists (eg, most antipsychotics, metoclopramide) and estrogens (eg, OCPs, pregnancy) stimulate prolactin secretion."
      - kind: table
        title: "الـ prolactin العالي عند الست والراجل (+ infertility في الاتنين)"
        columns: ["Sex", "Effects"]
        rows:
          - ["Females", "Galactorrhea, amenorrhea, osteoporosis"]
          - ["Males", "Gynecomastia, ↓ libido, impotence"]
        hide: [[0, 1], [1, 1]]
        page: 334
        quote: "Elevated prolactin associated with infertility, plus In females: galactorrhea, amenorrhea, osteoporosis In males: gynecomastia, ↓ libido, impotence"
      - kind: aside
        tone: exam
        text: "ست عندها **hypothyroidism** ولبن نازل؟ مش لازم يبقى عندها tumor: الـ ==TRH== العالي بيشغّل الـ TSH والـ prolactin مع بعض."
        page: 332
        quote: "↑ TRH (eg, in 1°/2° hypothyroidism) may increase prolactin secretion → galactorrhea"
      - kind: check
        question: "A woman on haloperidol develops galactorrhea and amenorrhea. Which drug would best counter the mechanism?"
        options:
          - "Cabergoline"
          - "Metoclopramide"
          - "Octreotide"
          - "Leuprolide"
        answer: 0
        why:
          - "صح: الـ haloperidol شال فرامل الـ dopamine، والـ cabergoline (dopamine agonist) بيرجّعها."
          - "الـ metoclopramide هو كمان dopamine antagonist، هيزوّد المشكلة."
          - "الـ octreotide (somatostatin analog) للـ GH الزيادة."
          - "الـ leuprolide بيقفل محور الـ gonads، مش بيوطّي الـ prolactin."
        page: 334
        quote: "Dopamine agonists (eg, bromocriptine, cabergoline) inhibit prolactin secretion and can be used in treatment of prolactinoma."
      - kind: explain
        title: "الـ GH: بيشتغل بالوكالة"
        text: |-
          الـ **GH (somatotropin)** بيطلع من الـ anterior pituitary في **pulses** بأمر الـ GHRH. معظم شغله في النمو مش بإيده: بيخلي الكبد يطلّع ==IGF-1 (somatomedin C)==، وده اللي بيطوّل العضم ويكبّر العضل.

          وفي نفس الوقت الـ GH ==diabetogenic==: بيعلّي الـ insulin resistance. منطقي، لأنه بيطلع وقت الجوع والـ stress عشان يحافظ على السكر.
        page: 333
        quote: "Stimulates linear growth and muscle mass through IGF-1 (somatomedin C) secretion by liver. ↑ insulin resistance (diabetogenic)."
      - kind: sort
        prompt: "الـ GH secretion: بيزيد ولا بيقل؟"
        bins: ["↑ GH", "↓ GH"]
        cards:
          - { text: "Deep sleep", bin: 0 }
          - { text: "Hypoglycemia", bin: 0 }
          - { text: "Exercise", bin: 0 }
          - { text: "Puberty", bin: 0 }
          - { text: "Hyperglycemia", bin: 1 }
          - { text: "Obesity", bin: 1 }
          - { text: "Aging", bin: 1 }
          - { text: "Somatomedin (IGF-1)", bin: 1 }
        why: "الـ GH بيطلع لما الجسم عايز يحمي السكر أو يبني (نوم، جوع، رياضة، بلوغ، stress). السكر العالي والسن والسمنة والـ somatostatin والـ IGF-1 نفسه (feedback) بيوطّوه."
        page: 333
        quote: "Secretion ↑ during (deep) sleep, hypoglycemia, stress, puberty, exercise. Secretion ↓ with aging, obesity, hyperglycemia, somatostatin, somatomedin"
      - kind: explain
        title: "الـ ADH: الحنفية بتاعة الـ collecting duct"
        text: |-
          الـ **ADH (vasopressin)** بيتعمل في الـ supraoptic و paraventricular nuclei وبيتخزن في الـ posterior pituitary. ليه receptors اتنين:
          - ==V2==: في الـ principal cells بتاعة الـ collecting duct، بيدخّل **aquaporins** ← الماية ترجع ← البول يتركز والـ serum osmolality تقل. دي وظيفته الأساسية.
          - ==V1==: على الأوعية، بيعلّي الضغط. عشان كده الـ vasopressin بيتدي في الـ **septic shock**.

          اللي بيتحكم فيه أساساً الـ **plasma osmolality**، وبعدها الـ hypovolemia. والـ alcohol بيقفله ← polyuria وجفاف.
        page: 333
        quote: "Regulates b1ood pressure (V1-receptors) and serum osmolality (V2-receptors). Primary function is serum osmolality regulation"
      - kind: check
        question: "Polyuria after head trauma. The ADH level is low and urine concentrates after desmopressin. Diagnosis?"
        options:
          - "Central DI"
          - "Nephrogenic DI"
          - "Primary polydipsia"
          - "SIADH"
        answer: 0
        why:
          - "صح: الـ ADH واطي في الـ central DI، والـ desmopressin (ADH analog) بيعالجه."
          - "في الـ nephrogenic DI الـ ADH طبيعي أو عالي والكلية هي اللي مش سامعة."
          - "الـ primary polydipsia مش مذكورة هنا، ومش بتفرق مع الـ desmopressin بالشكل ده."
          - "الـ SIADH عكسه: ADH زيادة وبول مركز."
        page: 333
        quote: "ADH level is ↓ in central diabetes insipidus (DI), normal or ↑ in nephrogenic DI. Desmopressin (ADH analog) is a treatment for central DI and nocturnal enuresis."
      - kind: try
        items: [endo.L03.003, endo.L03.005, endo.L03.014, endo.L03.019, endo.L03.030]
    recap:
      - "CRH ← ACTH؛ GnRH (pulsatile) ← FSH و LH؛ TRH ← TSH و prolactin؛ GHRH ← GH؛ somatostatin و dopamine فرامل."
      - "الـ prolactin متفرمل بالـ dopamine؛ dopamine antagonists ← galactorrhea، dopamine agonists ← علاج الـ prolactinoma."
      - "الـ prolactin بيقفل الـ GnRH ← amenorrhea و infertility."
      - "الـ GH بيشتغل بالـ IGF-1 من الكبد، وهو diabetogenic."
      - "ADH: V2 للماية (aquaporins)، V1 للضغط؛ واطي في central DI."
