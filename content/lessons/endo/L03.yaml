lessons:
  - id: endo.L03.lesson1
    title: "الـ hypothalamus بيدّي أوامر، والـ pituitary بينفّذ"
    hook: "كل هرمون في الـ anterior pituitary له زرار في الـ hypothalamus. اعرف الزراير وهتعرف ليه الـ antipsychotics بتنزّل لبن"
    minutes: 10
    pages: [332, 334]
    topics: [hypothalamic-pituitary-hormones, growth-hormone, antidiuretic-hormone, prolactin]
    goals:
      - "تربط كل هرمون hypothalamic بالهرمون اللي بيشغّله أو بيوقفه"
      - "تفهم ليه الـ dopamine هو الفرامل الأساسية للـ prolactin"
      - "تعرف الـ GH بيشتغل من خلال IGF-1، وإيه بيعلّيه وإيه بيوطّيه"
      - "تفرّق بين V1 و V2 وبين central و nephrogenic DI"
    status: unverified
    steps:
      - kind: figure
        title: "الزراير"
        svg: |-
