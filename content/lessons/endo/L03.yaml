  - id: endo.L03.lesson3
    title: "الكالسيوم: الـ PTH بيمسكه ويرمي الـ phosphate"
    hook: "الـ PTH هرمون واحد بيشتغل على العضم والكلية والأمعاء. وفي سر صغير: الـ pH بيغيّر الـ calcium الشغّال من غير ما الـ total يتحرك"
    minutes: 9
    pages: [336, 337]
    topics: [parathyroid-hormone, calcium-homeostasis, calcitonin]
    goals:
      - "تعدّ أفعال الـ PTH في كل عضو"
      - "تفهم ليه الـ magnesium الواطي جداً بيوقف الـ PTH"
      - "تفهم ليه الـ alkalosis بيعمل tetany"
    status: unverified
    steps:
      - kind: explain
        title: "الـ PTH: هدفه واحد"
        text: |-
          الـ **PTH** طالع من الـ ==chief cells== بتاعة الـ parathyroid، وهدفه الأساسي إنه يعلّي الـ **free Ca2+** في الدم. بيعمل كده من 3 أماكن:
          - **العضم**: بيسحب Ca و PO4 (bone resorption).
          - **الأمعاء**: ↑ امتصاص Ca و PO4 (عن طريق الـ vitamin D).
          - **الكلية**: ↑ Ca reabsorption في الـ **DCT**، و ↓ PO4 reabsorption في الـ **PCT**، وبيشغّل الـ **1α-hydroxylase** في الـ PCT ← calcitriol.

          الكتاب بيقولك: tri to make D3 in the PCT.
        page: 336
        quote: "↑ 1,25-(OH)2D3 (calcitriol) production by activating 1α-hydroxylase in PCT (tri to make D3 in the PCT)"
      - kind: figure
        title: "الـ PTH في 3 أعضاء"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="en3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="130" y="8" width="100" height="34" rx="10"/>
            <text x="150" y="30" class="t-sm t-b">PTH ↑</text>
            <line class="fg-arrow-acc" x1="150" y1="42" x2="60" y2="80" marker-end="url(#en3d)"/>
            <line class="fg-arrow-acc" x1="180" y1="42" x2="180" y2="80" marker-end="url(#en3d)"/>
            <line class="fg-arrow-acc" x1="210" y1="42" x2="300" y2="80" marker-end="url(#en3d)"/>
            <rect class="fg-box" x="4" y="82" width="112" height="70" rx="8"/>
            <text x="14" y="100" class="t-sm t-b">Bone</text>
            <text x="14" y="118" class="t-sm">RANK-L → osteoclasts</text>
            <text x="14" y="136" class="t-sm">Ca, PO4 out</text>
            <rect class="fg-box" x="124" y="82" width="112" height="70" rx="8"/>
            <text x="134" y="100" class="t-sm t-b">Kidney</text>
            <text x="134" y="118" class="t-sm">DCT: Ca back</text>
            <text x="134" y="134" class="t-sm">PCT: PO4 lost</text>
            <text x="134" y="148" class="t-sm">PCT: 1α-hydroxylase</text>
            <rect class="fg-box" x="244" y="82" width="112" height="70" rx="8"/>
            <text x="254" y="100" class="t-sm t-b">Gut</text>
            <text x="254" y="118" class="t-sm">via calcitriol:</text>
            <text x="254" y="136" class="t-sm">Ca, PO4 in</text>
            <rect class="fg-good" x="60" y="160" width="240" height="26" rx="8"/>
            <text x="72" y="178" class="t-sm t-b">↑ serum Ca, ↓ serum PO4, ↑ urine PO4</text>
          </svg>
        caption: "الـ PTH بيجيب Ca من العضم والأمعاء ويمسكه في الكلية، بس بيرمي الـ PO4 في البول. النتيجة: Ca عالي و PO4 واطي في الدم."
        alt: "PTH acts on bone (RANK-L activates osteoclasts, calcium and phosphate released), kidney (calcium reabsorbed in the DCT, phosphate lost in the PCT, 1-alpha-hydroxylase activated in the PCT) and gut (calcitriol increases calcium and phosphate absorption). Net: high serum calcium, low serum phosphate, high urine phosphate."
        page: 336
        quote: "PTH ↑ serum Ca2+ , ↓ serum PO 3– 4 , ↑ urine PO 3– 4 , ↑ urine cAMP"
      - kind: aside
        tone: tip
        text: "الكتاب بيقولك: ==PTH = Phosphate-Trashing Hormone==. فاكر إنه بيمسك الـ Ca بس بيرمي الـ PO4، فالـ PO4 في الدم بيقل وفي البول بيزيد."
        page: 336
        quote: "PTH = Phosphate-Trashing Hormone"
      - kind: reveal
        prompt: "الـ osteoclast ما عندوش PTH receptor. أمال الـ PTH بيشغّله إزاي؟"
        answer: "بالواسطة: الـ PTH بيخلي الـ **osteoblasts** والـ osteocytes يطلّعوا ==RANK-L==، وده بيمسك الـ **RANK** على الـ osteoclasts وأسلافهم فيشتغلوا ويكسّروا العضم. (ولو الـ PTH اتدّى متقطع، ممكن يبني عضم كمان.)"
        page: 336
        quote: "secreted by osteoblasts and osteocytes; binds RANK (receptor) on osteoclasts and their precursors to stimulate osteoclasts"
      - kind: explain
        title: "مين بيتحكم في الـ PTH"
        text: |-
          - ↓ Ca2+ ← ↑ PTH (وده ==المتحكم الأساسي==).
          - ↑ PO4 ← ↑ PTH.
          - ↓ Mg2+ ← ↑ PTH.
          - لكن **↓↓ Mg2+** (واطي جداً) ← ==↓ PTH==.

          أسباب الـ Mg الواطي: diarrhea و aminoglycosides و diuretics و alcohol use disorder.

          وفي كمان **PTHrP**: بيشتغل زي الـ PTH، وبيطلع من أورام زي **squamous cell carcinoma of the lung** و **renal cell carcinoma**.
        page: 336
        quote: "Common causes of ↓ Mg2+ include diarrhea, aminoglycosides, diuretics, alcohol use disorder"
      - kind: aside
        tone: exam
        text: "مريض alcohol عنده hypocalcemia ومش بتتصلح بالـ calcium؟ شوف الـ ==magnesium==: الـ Mg الواطي جداً بيقفل الـ PTH. صلّح الـ Mg الأول."
        page: 336
        quote: "↓↓ serum Mg2+ → ↓ PTH secretion"
      - kind: explain
        title: "الـ calcium في الدم 3 أشكال"
        text: |-
          - **Free/ionized ~45%**: ده الشغّال، وهو اللي الـ PTH بيحس بيه.
          - **مربوط بالـ albumin ~40%**
          - **مربوط بـ anions ~15%**

          الـ Ca2+ والـ ==H+== بيتخانقوا على نفس الأماكن في الـ albumin. فالـ **pH** بيغيّر الـ free Ca والـ PTH، لكن تغيير الـ albumin نفسه ما بيغيّرش الـ PTH.
        page: 337
        quote: "Ionized/free Ca2+ is 1° regulator of PTH; changes in pH alter PTH secretion, whereas changes in albumin concentration do not"
      - kind: order
        prompt: "رتّب اللي بيحصل في الـ alkalemia (زي hyperventilation)"
        steps:
          - "↑ pH (H+ أقل)"
          - "الـ albumin بيمسك Ca2+ أكتر"
          - "↓ ionized Ca2+ ← cramps و paresthesias و carpopedal spasm"
          - "↑ PTH"
        why: "الـ H+ قل، فأماكنه على الـ albumin فضيت، والـ Ca2+ قعد مكانه. الـ total ما اتغيّرش، بس الـ free قل فالأعصاب بقت متهيجة."
        page: 337
        quote: "↑ pH (less H+ ) → albumin binds more Ca2+ → ↓ ionized Ca2+ (eg, cramps, pain, paresthesias, carpopedal spasm) → ↑ PTH"
      - kind: explain
        title: "الـ calcitonin: موجود بس مش مهم"
        text: |-
          الـ **calcitonin** طالع من الـ ==parafollicular (C) cells== في الـ thyroid. بيطلع لما الـ Ca يعلى، وبيوقف الـ osteoclasts (↓ bone resorption)، يعني عكس الـ PTH.

          بس في الظروف العادية ==مش مهم== في توازن الـ Ca. الكتاب بيقولك: Calcitonin tones down serum Ca2+ levels and keeps it in bones.
        page: 337
        quote: "Calcitonin opposes actions of PTH. Not important in normal Ca2+ homeostasis"
      - kind: check
        question: "A man with heavy alcohol use has Ca 6.8 mg/dL, very low Mg and a low PTH. What should be corrected first?"
        options:
          - "Magnesium"
          - "Phosphate"
          - "Calcitonin"
          - "Albumin"
        answer: 0
        why:
          - "صح: الـ ↓↓ Mg بيقفل الـ PTH، فالـ Ca مش هيتصلح غير لما الـ Mg يرجع."
          - "الـ PO4 العالي بيعلّي الـ PTH، مش هو السبب هنا."
          - "الـ calcitonin مش مهم في التوازن العادي."
          - "الـ albumin ما بيغيّرش الـ PTH."
        page: 336
        quote: "↓↓ serum Mg2+ → ↓ PTH secretion"
      - kind: try
        items: [endo.L03.045, endo.L03.046, endo.L03.048, endo.L03.049, endo.L03.054]
    recap:
      - "الـ PTH من الـ chief cells: ↑ Ca، ↓ PO4 في الدم، ↑ PO4 و cAMP في البول."
      - "العضم بالـ RANK-L، والكلية: Ca في الـ DCT، PO4 و 1α-hydroxylase في الـ PCT."
      - "↓ Ca و ↑ PO4 و ↓ Mg ← ↑ PTH؛ ↓↓ Mg ← ↓ PTH."
      - "PTHrP: squamous cell lung و renal cell carcinoma."
      - "Alkalemia ← الـ albumin يمسك Ca أكتر ← ↓ free Ca ← tetany."
      - "الـ calcitonin من الـ C cells، مش مهم في العادي."
