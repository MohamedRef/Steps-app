          - "الـ insulin receptor tyrosine kinase."
          - "الـ aldosterone intracellular receptor."
          - "الـ TRH بيستخدم IP3 (GOAT HAG)."
        page: 341
        quote: "cGMP BNP, ANP, EDRF (NO) BAD GraMPa"
      - kind: try
