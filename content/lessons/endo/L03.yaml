          </svg>
        caption: "أي إنزيم يقف، اللي قبله بيتراكم ويتحوّل للطريق المفتوح. الـ 21 والـ 11β في طريق الـ aldosterone والـ cortisol، فلو وقفوا الزيادة بتروح للـ androgens. الـ 17α هو باب الـ cortisol والـ androgens، فلو وقف الزيادة بتروح للـ mineralocorticoids."
        alt: "Adrenal steroid map in three columns: glomerulosa (progesterone to 11-deoxycorticosterone to corticosterone to aldosterone), fasciculata (17-hydroxyprogesterone to 11-deoxycortisol to cortisol), reticularis (androstenedione to testosterone). 17-alpha-hydroxylase opens the second and third columns; 21-hydroxylase and 11-beta-hydroxylase act in the first two."
        page: 339
        quote: "Androgens Estrogens, DHT Cholesterol (via StARa) Pregnenolone Progesterone"
      - kind: explain
        title: "قاعدة الرقم 1"
        text: |-
          الكتاب بيقولك:
          - الإنزيم اللي ==بيبتدي بـ 1== (11β و 17α) ← **hypertension**.
          - الإنزيم اللي ==بيخلص بـ 1== (21 و 11β) ← **virilization** في البنات.

          الـ 11β بيبتدي وبيخلص بـ 1، فبيعمل الاتنين.

          الضغط العالي سببه تراكم **11-deoxycorticosterone**، وده mineralocorticoid قوي.
        page: 339
        quote: "If deficient enzyme starts with 1, it causes hypertension; if deficient enzyme ends with 1, it causes virilization in females."
      - kind: table
        title: "الـ CAH التلاتة"
        columns: ["Enzyme", "BP", "[K+]", "Sex hormones", "Clue"]
        rows:
          - ["17α-hydroxylase", "↑", "↓", "↓", "XY atypical genitalia; XX no 2° sexual development"]
          - ["21-hydroxylase", "↓", "↑", "↑", "Most common; salt wasting; ↑ 17-OH progesterone, ↑ renin"]
          - ["11β-hydroxylase", "↑", "↓", "↑", "Severe hypertension, virilization, ↓ renin"]
        hide: [[0, 1], [0, 3], [1, 1], [1, 2], [2, 1], [2, 3]]
        page: 339
        quote: "Most common Presents in infancy (salt wasting) or childhood (precocious puberty) XX: virilization"
      - kind: reveal
        prompt: "ليه كل أنواع الـ CAH بتعمل adrenal كبيرة على الجنبين وجلد غامق؟"
        answer: "لأن الـ ==cortisol بيقل== في الكل، فالـ feedback بيروح ← ↑ ACTH ← الغدة تكبر (hyperplasia). والـ MSH بيطلع مع الـ ACTH من نفس الـ POMC ← hyperpigmentation. وكلهم autosomal recessive."
        page: 339
        quote: "All congenital adrenal enzyme deficiencies are autosomal recessive disorders and most are characterized by bilateral adrenal gland enlargement (due to ↑ ACTH stimulation)"
      - kind: case
        stem: "بنت عندها أسبوعين، بترجّع ومش بترضع، dehydrated، وعندها clitoromegaly. Na 124 و K 6.9."
        steps:
          - question: "Which enzyme is deficient?"
            options: ["21-hydroxylase", "11β-hydroxylase", "17α-hydroxylase"]
            answer: 0
            why: "Salt wasting (↓ aldosterone ← Na واطي و K عالي و ضغط واطي) مع virilization = ==21-hydroxylase==، وده الأشهر. الـ 11β والـ 17α بيعلّوا الضغط."
          - question: "Which lab is most expected?"
            options: ["↑ 17-hydroxyprogesterone", "↓ renin activity", "↓ androstenedione"]
            answer: 0
            why: "الـ 17-OH progesterone قبل الإنزيم اللي واقف فبيتراكم، والـ renin بيعلى لأن الـ volume ناقص. الـ ↓ renin للـ 11β، والـ ↓ androstenedione للـ 17α."
        page: 339
        quote: "↑ renin activity ↑ 17-hydroxy progesterone"
      - kind: explain
        title: "الـ cortisol: هرمون الـ stress"
        text: |-
          طالع من الـ ==zona fasciculata== وماشي في الدم مربوط بالـ corticosteroid-binding globulin. التحكم: CRH ← ACTH ← cortisol، والـ cortisol الزيادة بيوقف التلاتة.

          الكتاب بيقولك: **Cortisol is A BIG FIB**:
          - **A**ppetite ↑
          - **B**lood pressure ↑: بيحوّل NE لـ epinephrine، وبيكتّر الـ α1 receptors (permissive action)، وفي التركيزات العالية بيمسك الـ mineralocorticoid receptor.
          - **I**nsulin resistance ↑ (diabetogenic)
          - **G**luconeogenesis و lipolysis و proteolysis ↑
          - **F**ibroblasts ↓ ← جروح بطيئة، collagen أقل، striae
          - **I**nflammation و Immunity ↓
          - **B**one formation ↓ (osteoblasts أقل)
        page: 340
        quote: "Cortisol is A BIG FIB."
      - kind: explain
        title: "الـ cortisol والمناعة"
        text: |-
          - بيوقف الـ leukotrienes والـ prostaglandins.
          - بيوقف الـ WBC adhesion ← الـ neutrophils تفضل في الدم ← ==neutrophilia==.
          - بيوقف الـ histamine من الـ mast cells.
          - ==eosinopenia و lymphopenia==.
          - بيوقف الـ **IL-2** ← عشان كده الـ steroids من برّه ممكن ترجّع **TB** و **candidiasis**.

          والـ chronic stress ممكن يعمل cortisol عالي طول الوقت و cortisol resistance ومناعة ضعيفة.
        page: 340
        quote: "Inhibits production of leukotrienes and prostaglandins Inhibits WBC adhesion → neutrophilia Blocks histamine release from mast cells"
      - kind: check
        question: "A patient on long-term prednisone develops reactivation TB. Which cortisol effect explains it?"
        options:
          - "Blocks IL-2 production"
          - "Inhibits WBC adhesion"
          - "Upregulates α1 receptors"
          - "Blocks histamine release"
        answer: 0
        why:
          - "صح: الكتاب بيربط إعادة نشاط الـ TB والـ candidiasis بوقف الـ IL-2."
          - "ده بيعمل neutrophilia، مش TB."
          - "دي بتعلّي الضغط."
          - "ده بيقلل الحساسية، مش بيرجّع TB."
        page: 340
        quote: "Exogenous glucocorticoids can cause reactivation of TB and candidiasis (blocks IL-2 production)."
      - kind: try
        items: [endo.L03.076, endo.L03.077, endo.L03.078, endo.L03.082, endo.L03.084]
