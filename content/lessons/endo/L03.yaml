  - id: endo.L03.lesson5
    title: "الـ CAH بقاعدة واحدة، والـ cortisol بـ A BIG FIB"
    hook: "3 إنزيمات و 7 خانات في الجدول؟ لأ: قاعدة الرقم 1 بتحلهم كلهم"
    minutes: 10
    pages: [339, 340]
    topics: [adrenal-steroids-and-cah, cortisol]
    goals:
      - "تعرف الـ cholesterol بيمشي في أنهي طريق في كل طبقة"
      - "تتنبأ بأعراض أي نقص إنزيم من مكانه في الطريق"
      - "تعدّ أفعال الـ cortisol"
    status: unverified
    steps:
      - kind: explain
        title: "طريق واحد بيتفرّع لـ 3"
        text: |-
          كله بيبتدي من **cholesterol** (يدخل بالـ StAR، وده الـ rate-limiting step) ← **pregnenolone**. ومن هنا 3 طرق:
          - **Glomerulosa**: progesterone ← 11-deoxycorticosterone ← corticosterone ← ==aldosterone== (بالـ aldosterone synthase، تحت أمر الـ angiotensin II).
          - **Fasciculata**: يدخل الـ ==17α-hydroxylase== ← 17-OH progesterone ← 11-deoxycortisol ← **cortisol**.
          - **Reticularis**: 17α-hydroxylase تاني ← **DHEA** و androstenedione ← testosterone.

          الإنزيمين اللي في النص: **21-hydroxylase** (بيشتغل في طريق الـ aldosterone والـ cortisol) و **11β-hydroxylase** (آخر خطوة في الـ cortisol).
        page: 339
        quote: "Cholesterol (via StARa) Pregnenolone Progesterone 11-deoxycorticosterone Corticosterone Aldosterone"
      - kind: figure
        title: "الخريطة"
        svg: |-
