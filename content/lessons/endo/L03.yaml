  - id: endo.L03.lesson6
    title: "الجوع والشبع، وكل هرمون بيكلّم الخلية إزاي"
    hook: "ghrelin بيجوّعك و leptin بيشبّعك. وبعدين جدول الـ second messengers بالـ mnemonics بتاعة الكتاب"
    minutes: 8
    pages: [340, 341]
    topics: [appetite-regulation, signaling-pathways-of-endocrine-hormones, signaling-pathways-of-steroid-hormones]
    goals:
      - "تفرّق بين ghrelin و leptin ومكان شغل كل واحد"
      - "تعرف الـ pathway بتاع أي هرمون من الـ mnemonic"
      - "تفهم ليه الـ SHBG بيغيّر الـ free testosterone"
    status: unverified
    steps:
      - kind: table
        title: "هرمونات الأكل"
        columns: ["Hormone", "From", "Effect", "Hypothalamus area"]
        rows:
          - ["Ghrelin", "Stomach", "↑ hunger, ↑ GH", "Lateral (hunger center)"]
          - ["Leptin", "Adipose tissue", "Satiety, ↓ appetite", "Ventromedial (satiety center)"]
          - ["Endocannabinoids", "—", "↑ appetite", "Hypothalamus + nucleus accumbens"]
        hide: [[0, 1], [0, 3], [1, 1], [1, 3]]
        page: 340
        quote: "Ghrelin makes you ghrow hunghry. Acts on lateral area of hypothalamus (hunger center) to ↑ appetite."
      - kind: explain
        title: "الاتنين ومين بيغيّرهم"
        text: |-
          - **Ghrelin** (Ghrelin makes you ghrow hunghry): بيعلى مع ==قلة النوم== والصيام و **Prader-Willi syndrome**.
          - **Leptin** (Leptin keeps you thin): الدهن بيطلّعه، فالسمين عنده leptin ==عالي== بس جسمه مش سامع (resistance). لو جين الـ leptin نفسه باظ ← سمنة شديدة. وقلة النوم والجوع بيوطّوه.

          والـ **endocannabinoids** بيعلّوا الشهية من الـ hypothalamus والـ nucleus accumbens، وده سبب "the munchies" مع الـ cannabis.
        page: 340
        quote: "Sleep deprivation, fasting, or Prader-Willi syndrome → ↑ ghrelin production."
      - kind: reveal
        prompt: "ليه السهر بيخليك جعان؟"
        answer: "قلة النوم بتعمل ضربتين: ==↑ ghrelin== (الجوع) و ==↓ leptin== (الشبع). فالجوع يعلى والفرامل تضعف."
        page: 340
        quote: "Sleep deprivation or starvation → ↓ leptin production."
      - kind: explain
        title: "الـ second messengers بالـ mnemonics بتاعة الكتاب"
        text: |-
          - **cAMP**: ==FLAT ChAMPs CHuGG== = FSH و LH و ACTH و TSH، CRH و hCG و ADH (V2) و MSH و PTH، Calcitonin و Histamine (H2) و Glucagon و GHRH.
          - **cGMP**: **BAD GraMPa** = BNP و ANP و EDRF (NO). فكّر vasodilation و diuresis.
          - **IP3**: **GOAT HAG** = GnRH و Oxytocin و ADH (V1) و TRH، Histamine (H1) و Angiotensin II و Gastrin.
        page: 341
        quote: "FLAT ChAMPs CHuGG cGMP BNP, ANP, EDRF (NO) BAD GraMPa Think vasodilation and diuresis"
      - kind: explain
        title: "والباقيين"
        text: |-
          - **Intracellular receptor**: ==PET CAT in TV== = Progesterone و Estrogen و Testosterone، Cortisol و Aldosterone و T3/T4، Vitamin D.
          - **Receptor tyrosine kinase** (MAP kinase): **Get Found In the MAP** = IGF-1 و FGF و PDGF و EGF و Insulin.
          - **Nonreceptor tyrosine kinase** (JAK/STAT): **GET a JAKed PIG** = G-CSF و Erythropoietin و Thrombopoietin، Prolactin و Immunomodulators (IL-2 و IL-6 و IFN) و GH. فكّر acidophils و cytokines.
        page: 341
        quote: "Progesterone, Estrogen, Testosterone, Cortisol, Aldosterone, T3/T4, Vitamin D PET CAT in TV"
      - kind: sort
        prompt: "حط كل هرمون في الـ pathway بتاعه"
        bins: ["cAMP", "IP3", "JAK/STAT"]
        cards:
          - { text: "PTH", bin: 0 }
          - { text: "Glucagon", bin: 0 }
          - { text: "ADH (V2)", bin: 0 }
          - { text: "ADH (V1)", bin: 1 }
          - { text: "Oxytocin", bin: 1 }
          - { text: "Angiotensin II", bin: 1 }
          - { text: "GH", bin: 2 }
          - { text: "Prolactin", bin: 2 }
          - { text: "Erythropoietin", bin: 2 }
        why: "FLAT ChAMPs CHuGG للـ cAMP، و GOAT HAG للـ IP3، و GET a JAKed PIG للـ JAK/STAT. لاحظ الـ ADH: V2 (الكلية) cAMP و V1 (الأوعية) IP3."
        page: 341
        quote: "GnRH, Oxytocin, ADH (V1-receptor), TRH, Histamine (H1-receptor), Angiotensin II, Gastrin GOAT HAG"
      - kind: figure
        title: "الـ steroid بيدخل لحد النواة"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="en3f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="70" y="10" width="280" height="140" rx="16"/>
            <text x="80" y="28" class="t-sm t-mut">Cytoplasm</text>
            <rect class="fg-good" x="210" y="40" width="130" height="100" rx="14"/>
            <text x="222" y="58" class="t-sm t-mut">Nucleus</text>
            <circle class="fg-dot-acc" cx="30" cy="80" r="10"/>
            <text x="10" y="110" class="t-sm">H + SHBG</text>
            <line class="fg-arrow-acc" x1="42" y1="80" x2="110" y2="80" marker-end="url(#en3f)"/>
            <text x="116" y="76" class="t-sm">H binds R</text>
            <line class="fg-arrow-acc" x1="160" y1="86" x2="230" y2="96" marker-end="url(#en3f)"/>
            <text x="220" y="84" class="t-sm">H-R on DNA</text>
            <text x="220" y="104" class="t-sm">→ mRNA</text>
            <text x="220" y="124" class="t-sm">→ protein</text>
          </svg>
        caption: "الـ steroid بيعدّي الـ membrane لوحده، يمسك الـ receptor في الـ cytoplasm أو النواة، والاتنين يقعدوا على الـ DNA ويغيّروا الجينات. عشان هو lipophilic، بيمشي في الدم مربوط بـ binding globulin."
        alt: "A steroid hormone carried by a binding globulin enters the cell, binds its receptor in the cytoplasm or nucleus, and the hormone-receptor complex binds DNA to change transcription into mRNA and protein."
        page: 341
        quote: "Steroid hormones are lipophilic and therefore must circulate bound to specific binding globulins, which ↑ their solubility."
      - kind: explain
        title: "الـ SHBG: نفس فكرة الـ TBG"
        text: |-
          الـ **SHBG** شايل الـ testosterone، والمربوط مش شغّال:
          - راجل عنده ==↑ SHBG== ← free testosterone يقل ← **gynecomastia**.
          - ست عندها ==↓ SHBG== ← free testosterone يعلى ← **hirsutism**.
          - الـ estrogen (OCPs و الحمل) بيعلّي الـ SHBG.
        page: 341
        quote: "In males, ↑ sex hormone–binding globulin (SHBG) lowers free testosterone → gynecomastia. In females, ↓ SHBG raises free testosterone → hirsutism."
      - kind: check
        question: "Which hormone signals through cGMP?"
        options:
