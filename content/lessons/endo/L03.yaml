  - id: endo.L03.lesson4
    title: "الـ insulin والـ glucagon: الشبعان والجعان"
    hook: "هرمونين بيشدّوا الحبل في اتجاهين. والسؤال اللي الامتحان بيحبه: الـ C-peptide بيكشف مين حقن نفسه"
    minutes: 10
    pages: [337, 338]
    topics: [glucagon, insulin]
    goals:
      - "تعرف شغل الـ glucagon ومين بيوقفه"
      - "تفهم ليه الـ C-peptide بيفرّق بين insulin من جوه ومن برّه"
      - "تفرّق الـ GLUTs وتعدّ BRICK LIPS"
      - "تمشي خطوات طلوع الـ insulin من الـ β cell"
    status: unverified
    steps:
      - kind: explain
        title: "الـ glucagon: هرمون الجوع"
        text: |-
          الـ **glucagon** طالع من الـ ==α cells==. بيطلع لما السكر يقل (الصيام)، ووظيفته يرجّع السكر:
          - **glycogenolysis** و **gluconeogenesis**
          - **lipolysis** و **ketogenesis**

          اللي بيوقفه: **insulin** و **amylin** و **somatostatin** والسكر العالي.
        page: 337
        quote: "Promotes glycogenolysis, gluconeogenesis, lipolysis, ketogenesis."
      - kind: explain
        title: "الـ insulin بيتعمل إزاي"
        text: |-
          في الـ RER بتاع الـ β cell بيتعمل **preproinsulin** ← يتشال الـ presignal ← **proinsulin** يتخزن في granules ← يتقطع ← يطلع ==insulin و C-peptide بكميات متساوية==.

          يعني أي insulin جسمك عمله، معاه C-peptide. الـ insulin اللي في الحقنة ما فيهوش C-peptide.

          والـ insulin بيتشال من الدم بالكبد والكلية الاتنين.
        page: 338
        quote: "cleavage of proinsulin → exocytosis of insulin and C-peptide equally."
      - kind: table
        title: "مين عامل الـ hypoglycemia؟"
        columns: ["Cause", "Insulin", "C-peptide"]
        rows:
          - ["Exogenous insulin (factitious)", "↑", "Low / absent"]
          - ["Insulinoma", "↑", "↑"]
          - ["Insulin secretagogue (sulfonylurea)", "↑", "↑"]
        hide: [[0, 2], [1, 2], [2, 2]]
        page: 338
        quote: "Both insulin and C-peptide are ↑ in endogenous insulin secretion (eg, type 2 DM, insulin secretagogues, insulinoma), whereas exogenous insulin lacks C-peptide (helps differentiate factitious hypoglycemia)."
      - kind: aside
        tone: exam
        text: "ممرضة أو قريب مريض سكر، سكره واطي جداً، الـ insulin عالي والـ ==C-peptide واطي==؟ ده insulin محقون من برّه. لو الـ C-peptide عالي، فكّر insulinoma أو sulfonylurea (اطلب drug screen)."
        page: 338
        quote: "whereas exogenous insulin lacks C-peptide (helps differentiate factitious hypoglycemia)."
      - kind: explain
        title: "الـ insulin بيعمل إيه"
        text: |-
          بيمسك receptor فيه **tyrosine kinase** ويشغّل دخول السكر وكتابة الجينات. كله **anabolic** (تخزين):
          - ↑ دخول السكر للعضل والدهن، ↑ glycogen، ↑ triglycerides، ↑ protein.
          - ↑ دخول ==K+== والـ amino acids للخلايا (عشان كده الـ insulin بيعالج الـ hyperkalemia).
          - ↑ Na+ retention في الكلية.
          - ↓ glucagon و ↓ lipolysis.

          الـ insulin ما بيعدّيش الـ placenta، بس السكر بيعدّي: أم عندها سكر ← الجنين يعمل ==insulin كتير== جداً.
        page: 338
        quote: "Unlike glucose, insulin does not cross placenta. In mothers with diabetes, excess glucose can cross placenta and ↑↑ fetal insulin."
      - kind: explain
        title: "الـ GLUTs: مين محتاج إذن"
        text: |-
          نسيجين بس محتاجين insulin عشان يدخّلوا السكر: ==العضل والدهن==، عن طريق **GLUT4** (والرياضة كمان بتزوّد الـ GLUT4).

          الباقي ما بيستناش:
          - **GLUT1**: RBCs و brain و cornea و placenta
          - **GLUT2** (في الاتجاهين، two-way street): β cells و liver و kidney و GI
          - **GLUT3**: brain و placenta
          - **GLUT5** (fructose): spermatocytes و GI
          - **SGLT1/SGLT2**: kidney و small intestine
        page: 338
        quote: "Insulin-dependent glucose transporters: GLUT4: adipose tissue, striated muscle (exercise can also ↑ GLUT4 expression)"
      - kind: mnemonic
        word: "BRICKLIPS"
        parts:
          - { key: "B", text: "Brain" }
          - { key: "R", text: "RBCs" }
          - { key: "I", text: "Intestine" }
          - { key: "C", text: "Cornea" }
          - { key: "K", text: "Kidney" }
          - { key: "L", text: "Liver" }
          - { key: "I", text: "Islet (β) cells" }
          - { key: "P", text: "Placenta" }
          - { key: "S", text: "Spermatocytes" }
        hook: "BRICK LIPS من الكتاب: دول بياخدوا السكر من غير insulin. منطقي: المخ والـ RBCs ما ينفعش يستنّوا، والـ β cell لازم تحس بالسكر الحقيقي."
        page: 338
        quote: "BRICK LIPS (insulin-independent glucose uptake): Brain, RBCs, Intestine, Cornea, Kidney, Liver, Islet (β) cells, Placenta, Spermatocytes."
      - kind: reveal
        prompt: "ليه الـ RBCs لازم تاخد glucose بس، والمخ لأ؟"
        answer: "الـ RBCs ==ما عندهاش mitochondria==، فمش هتعرف تحرق ketones أو دهون؛ الـ glycolysis هو كل اللي عندها. المخ بيفضّل الـ glucose بس في الجوع الطويل ممكن يحرق **ketone bodies**."
        page: 338
        quote: "Brain prefers glucose, but may use ketone bodies during starvation. RBCs utilize only glucose, as they lack mitochondria for aerobic metabolism."
      - kind: order
        prompt: "رتّب خطوات طلوع الـ insulin من الـ β cell"
        steps:
          - "الـ glucose بيدخل من GLUT2"
          - "الـ metabolism بيعلّي الـ ATP"
          - "الـ ATP بيقفل الـ K+ channels"
          - "الـ membrane بيعمل depolarization"
          - "الـ voltage-gated Ca2+ channels تفتح ← Ca2+ يدخل"
          - "الـ insulin granules تطلع (exocytosis)"
        why: "الـ K+ channel ده نفسه هو target الـ ==sulfonylureas==: بتقفله من غير ما السكر يعلى، فالـ insulin يطلع."
        page: 338
        quote: "Glucose enters β cells → ↑ ATP generated from glucose metabolism closes K+ channels (target of sulfonylureas) and depolarizes β cell membrane"
      - kind: explain
        title: "ليه السكر في البق أحسن من الوريد؟"
        text: |-
          نفس كمية السكر لو بلعتها، الـ insulin بيطلع أكتر من لو اتدّت IV. السبب الـ ==incretins== (**GLP-1** و **GIP**): الأمعاء بتطلّعهم بعد الأكل فيخلّوا الـ β cell أحسّ للسكر.

          وكمان الأعصاب: **α2** بيقلل الـ insulin، و **β2** بيزوّده (2 = regulates insulin).
        page: 338
        quote: "↑ insulin response with oral vs IV glucose due to incretins"
      - kind: check
        question: "Which tissue needs insulin to take up glucose?"
        options:
          - "Skeletal muscle"
          - "Brain"
          - "Liver"
          - "Red blood cells"
          - "β islet cells"
        answer: 0
        why:
          - "صح: العضل والدهن بس بيستخدموا GLUT4 اللي محتاج insulin."
          - "المخ في BRICK LIPS (GLUT1 و GLUT3)."
          - "الكبد في BRICK LIPS (GLUT2)."
          - "الـ RBCs في BRICK LIPS (GLUT1)."
          - "الـ β cells بتستخدم GLUT2 عشان تحس بالسكر من غير insulin."
        page: 338
        quote: "Insulin-dependent glucose transporters: GLUT4: adipose tissue, striated muscle"
      - kind: try
        items: [endo.L03.059, endo.L03.062, endo.L03.066, endo.L03.068, endo.L03.071]
    recap:
      - "Glucagon من α cells: glycogenolysis و gluconeogenesis و lipolysis و ketogenesis؛ بيوقفه insulin و amylin و somatostatin."
      - "Insulin و C-peptide بيطلعوا بالتساوي؛ insulin عالي و C-peptide واطي = حقن من برّه."
      - "GLUT4 (عضل ودهن) بس محتاج insulin؛ الباقي BRICK LIPS."
      - "Glucose ← ATP ← K+ channel يتقفل (sulfonylureas) ← depolarization ← Ca2+ ← insulin."
      - "Incretins (GLP-1 و GIP) ← oral أقوى من IV. α2 بيوطّي، β2 بيعلّي."
