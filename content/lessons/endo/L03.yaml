  - id: endo.L03.lesson2
    title: "الـ thyroid: من الـ iodine للـ 7 B's"
    hook: "مصنع صغير بياخد iodine ويطلّع T4، والجسم هو اللي بيحوّله لـ T3. اعرف كل خطوة مين بيوقفها وهتحل أسئلة الأدوية"
    minutes: 9
    pages: [335, 335]
    topics: [thyroid-hormones]
    goals:
      - "تمشي خطوات صناعة الـ T3 و T4 وتعرف مين بيوقف كل خطوة"
      - "تعدّ الـ 7 B's"
      - "تفهم ليه الحامل عندها total T4 عالي وهي طبيعية"
    status: unverified
    steps:
      - kind: figure
        title: "المصنع جوه الـ follicle"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="en3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="4" y="30" width="70" height="120" rx="8"/>
            <text x="20" y="22" class="t-sm t-b">Blood</text>
            <text x="14" y="70" class="t-sm">I⁻ in</text>
            <text x="14" y="130" class="t-sm">T4, T3 out</text>
            <rect class="fg-acc" x="84" y="30" width="130" height="120" rx="8"/>
            <text x="100" y="22" class="t-sm t-b">Follicular cell</text>
            <line class="fg-arrow-acc" x1="74" y1="66" x2="214" y2="66" marker-end="url(#en3c)"/>
            <text x="94" y="86" class="t-sm">TPO: oxidation,</text>
            <text x="94" y="102" class="t-sm">organification, coupling</text>
            <line class="fg-arrow-acc" x1="214" y1="126" x2="74" y2="126" marker-end="url(#en3c)"/>
            <text x="94" y="144" class="t-sm t-mut">endocytosis, proteases</text>
            <rect class="fg-good" x="224" y="30" width="130" height="120" rx="8"/>
            <text x="240" y="22" class="t-sm t-b">Follicle lumen</text>
            <text x="234" y="60" class="t-sm">TG + iodine</text>
            <text x="234" y="84" class="t-sm">MIT, DIT</text>
            <text x="234" y="108" class="t-sm t-b">DIT + DIT = T4</text>
            <text x="234" y="128" class="t-sm t-b">DIT + MIT = T3</text>
            <text x="4" y="172" class="t-sm t-bad">PTU and methimazole block TPO</text>
          </svg>
        caption: "الـ iodide بيدخل الخلية، والـ thyroid peroxidase (TPO) بيعمل 3 حاجات: oxidation و organification و coupling على الـ thyroglobulin. بعدها الخلية بتبلع الـ TG وتقطعه وتطلّع T4 (أغلبه) و T3."
        alt: "Thyroid follicle: iodide enters the follicular cell from blood; thyroid peroxidase oxidizes and organifies iodine on thyroglobulin in the lumen and couples MIT and DIT; DIT plus DIT gives T4 and DIT plus MIT gives T3; the cell takes back thyroglobulin and releases T4 and T3. PTU and methimazole block thyroid peroxidase."
        page: 335
        quote: "Functions of thyroid peroxidase include oxidation, organification of iodine, and coupling of monoiodotyrosine (MIT) and diiodotyrosine (DIT). Inhibited by PTU and methimazole. DIT + DIT = T4. DIT + MIT = T3."
      - kind: explain
        title: "الـ T4 هو المنتج، والـ T3 هو الشغّال"
        text: |-
          الغدة بتطلّع ==T4== أساساً، والأنسجة بتحوّله لـ **T3** بإنزيم **5′-deiodinase**. الـ T3 هو اللي بيمسك الـ nuclear receptor أقوى.

          الإنزيم ده:
          - بيتشغّل بالـ **growth hormone**.
          - بيتوقف بالـ ==glucocorticoids== والـ **β-blockers** والـ **PTU**.

          وفي طريق جانبي بيطلّع **reverse T3**: مالوش أي شغل، والـ glucocorticoids بتزوّده.
        page: 335
        quote: "5′-deiodinase converts T4 (the major thyroid product) to T3 in peripheral tissue"
      - kind: reveal
        prompt: "ليه الـ PTU بالذات مميز عن الـ methimazole في الـ thyroid storm؟ (من الصفحة دي بس)"
        answer: "الاتنين بيوقفوا الـ ==thyroid peroxidase== جوه الغدة. بس الـ PTU كمان بيوقف الـ **5′-deiodinase** برّه الغدة، فبيقلل تحويل T4 لـ T3 الشغّال. ضربتين بدل ضربة."
        page: 335
        quote: "this pathway is activated by growth hormone and inhibited by glucocorticoids, β-blockers, and propylthiouracil (PTU)."
      - kind: aside
        tone: trap
        text: "الـ ==Wolff-Chaikoff effect==: لو الغدة أخدت iodine كتير فجأة، بتقفل الـ thyroid peroxidase مؤقتاً ← T3 و T4 يقلّوا. حماية ذاتية، مش العكس زي ما ممكن تتوقع."
        page: 335
        quote: "Wolff-Chaikoff effect—protective autoregulation; sudden exposure to excess iodine temporarily turns off thyroid peroxidase → ↓ T3/T4 production."
      - kind: mnemonic
        word: "BBBBBBB"
        parts:
          - { key: "B", text: "Brain maturation" }
          - { key: "B", text: "Bone growth (مع GH و IGF-1)" }
          - { key: "B", text: "β-adrenergic: ↑ β1 في القلب ← ↑ CO و HR و SV و contractility" }
          - { key: "B", text: "BMR ↑ عن طريق ↑ Na+/K+-ATPase ← ↑ O2 consumption و RR و الحرارة" }
          - { key: "B", text: "Blood sugar ↑ (glycogenolysis و gluconeogenesis)" }
          - { key: "B", text: "Break down lipids (lipolysis)" }
          - { key: "B", text: "Babies: surfactant synthesis" }
        hook: "الـ 7 B's من الكتاب. كله بيقول حاجة واحدة: الـ T3 بيدوس بنزين على الجسم كله."
        page: 335
        quote: "T3 functions —7 B’s: Brain maturation Bone growth (synergism with GH and IGF-1)"
      - kind: reveal
        prompt: "ليه الـ β-blocker بيريّح مريض الـ thyrotoxicosis بسرعة حتى قبل ما الهرمون يقل؟"
        answer: "لأن الـ T3 بيكتّر الـ ==β1 receptors== في القلب. الـ β-blocker بيقفل الـ receptors دي فالخفقان والرعشة يهدوا، وكمان بيوقف الـ 5′-deiodinase شوية."
        page: 335
        quote: "↑ β1 receptors in heart → ↑ CO, HR, SV, contractility; β-blockers alleviate adrenergic symptoms in thyrotoxicosis"
      - kind: explain
        title: "التحكم والـ feedback"
        text: |-
          **TRH** ← **TSH** ← الـ follicular cells. وفي **Graves disease** الـ ==TSI== (antibody) بيعمل نفسه TSH ويشغّل الخلايا.

          الـ feedback بيحصل بالـ **free T3/T4**: بيقلل حساسية الـ anterior pituitary للـ TRH، وبيقلل الـ TRH من الـ hypothalamus.
        page: 335
        quote: "TRH → ⊕ TSH release → ⊕ follicular cells. Thyroid-stimulating immunoglobulin (TSI) may ⊕ follicular cells in Graves disease."
      - kind: explain
        title: "الـ TBG: الشيّال"
        text: |-
          معظم الـ T3/T4 في الدم ماسكه **TBG**، والمربوط ده ==inactive==. اللي شغّال بس هو الـ free.

          - ↑ TBG: **الحمل** و **OCPs** (الـ estrogen بيعلّيه) ← total T3/T4 يعلى.
          - ↓ TBG: **steroids** و **nephrotic syndrome** و **cirrhosis** ← total يقل.

          في الحالتين الـ free بيفضل طبيعي والمريض ==euthyroid==، لأن الغدة بتعوّض.

          ونقطة صغيرة: الـ T3 و T4 lipophilic بس فيهم amino acids مشحونة، فمحتاجين transporters عشان يدخلوا الخلية (facilitated diffusion).
        page: 335
        quote: "↑ TBG in pregnancy, OCP use (↑ estrogen → ↑ TBG) → ↑ total T3/T4 ↓ TBG in steroid use, nephrotic syndrome, cirrhosis → ↓ total T3/T4"
      - kind: aside
        tone: analogy
