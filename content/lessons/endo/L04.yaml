        title: "آليتين للمضاعفات"
        text: |-
          **1. Nonenzymatic glycation** (السكر بيلزق في البروتينات):
          - أوعية صغيرة (==hyaline arteriolosclerosis==) ← retinopathy و neuropathy و nephropathy.
          - أوعية كبيرة (atherosclerosis) ← CAD و stroke و PVD. والـ ==MI أشهر سبب للوفاة==.

          **2. Osmotic damage**: الـ **aldose reductase** بيحوّل السكر لـ **sorbitol**، وفي أنسجة الـ sorbitol dehydrogenase فيها قليل أو مش موجود، فالـ sorbitol يتراكم ويشد ماية ← neuropathy (motor و sensory glove-and-stocking و autonomic: GERD و gastroparesis و diabetic diarrhea) و ==cataracts==.
        page: 350
        quote: "Osmotic damage (sorbitol accumulation in organs with aldose reductase and ↓ or absent sorbitol dehydrogenase)"
      - kind: table
        title: "التشخيص"
        columns: ["Test", "Cutoff", "Note"]
        rows:
