      - kind: explain
        title: "Type 1 و type 2"
        text: |-
          - **Type 1**: ==T cells بتدمّر الـ β cells== (antibodies ضد islet cell cytoplasm و GAD65 و insulin). insulin دايماً، غالباً أقل من 30، مش سمين، **HLA-DR4 و DR3** (4 – 3 = type 1)، ketoacidosis شائعة، histology: leukocytic infiltrate. الوراثة أضعف (50% في التوائم).
          - **Type 2**: insulin resistance ثم β-cell failure. أكبر من 40، سمين، وراثة أقوى (==90% في التوائم==)، ما لوش HLA، الـ insulin عالي في الأول وبعدين يقل، histology: ==islet amyloid polypeptide==.
        page: 351
        quote: "Relatively weak (50% concordance in identical twins), polygenic Relatively strong (90% concordance in identical twins), polygenic"
      - kind: check
        question: "Which is true of type 2 rather than type 1 DM?"
