      - kind: explain
        title: "Primary hyperparathyroidism"
        text: |-
          غالباً **adenoma** أو hyperplasia. Labs: Ca ↑ و PO4 ↓ و PTH ↑ و ALP ↑ و urinary cAMP ↑ و hypercalciuria. ==أغلبهم مالهمش أعراض==.

          لما يبقى فيه أعراض: **"Stones, thrones, bones, groans, and psychiatric overtones"**:
          - **Stones**: حصاوي كلى
          - **Thrones**: polyuria
          - **Bones**: ألم عضم
          - **Groans**: constipation، ضعف، ألم بطن (حصاوي أو pancreatitis)
          - **Psychiatric overtones**

          وفي العضم: ==osteitis fibrosa cystica== (brown tumor: osteoclasts و hemosiderin).
        page: 349
        quote: "“Stones, thrones, bones, groans, and psychiatric overtones.”"
      - kind: explain
        title: "2° و 3° و FHH"
        text: |-
          - **Secondary**: الغدة بتكبر عشان تعوّض Ca واطي، غالباً من **CKD** (vitamin D قليل و PO4 عالي). والـ **renal osteodystrophy** هي آثار ده على العضم.
          - **Tertiary**: بعد سنين في الـ ESRD الغدة بقت ==autonomous== ← PTH ↑↑ و Ca ↑.
          - **FHH**: autosomal dominant، الـ **Ca-sensing receptor** معيوب، فالغدة محتاجة Ca أعلى عشان تسكت، والكلية بتمسك Ca ← hypercalcemia خفيفة مع ==hypocalciuria== و PTH طبيعي أو عالي شوية.
        page: 349
        quote: "Higher than normal Ca2+ levels required to suppress PTH. Excessive renal Ca2+ reabsorption → mild hypercalcemia and hypocalciuria with normal to ↑ PTH levels."
      - kind: check
