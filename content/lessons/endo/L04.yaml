          - "الـ tertiary محتاج ESRD و PTH ↑↑."
          - "هنا الـ PTH مش مكتوم."
        page: 349
        quote: "Excessive renal Ca2+ reabsorption → mild hypercalcemia and hypocalciuria with normal to ↑ PTH levels."
