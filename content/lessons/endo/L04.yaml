        caption: "Ca واطي و PTH عالي = الغدة بتعوّض (2°). Ca عالي و PTH عالي = الغدة نفسها هي المشكلة (1°، و 3° أعلى). Ca عالي و PTH مكتوم = حاجة تانية بتعلّي الـ Ca. Ca واطي و PTH واطي = الغدة مش شغالة."
        alt: "Plot of calcium on the x-axis and PTH on the y-axis. Low calcium with high PTH is secondary hyperparathyroidism; high calcium with high PTH is primary, and very high PTH is tertiary; normal in the middle; low calcium with low PTH is hypoparathyroidism; high calcium with low PTH is PTH-independent hypercalcemia."
        page: 348
        quote: "PTH-independent hypercalcemia (excess Ca2+ intake, cancer, ↑ vitamin D)"
      - kind: explain
        title: "Hypoparathyroidism"
        text: |-
          السبب غالباً ==إصابة الـ parathyroids أو دمها في عملية الـ thyroid==، أو autoimmune، أو **DiGeorge**.

          النتيجة: **tetany** و hypocalcemia و ==hyperphosphatemia== (الـ PTH مش موجود يرمي الـ PO4).

          علامتين:
          - **Chvostek**: تخبط على الـ facial nerve (tap the Cheek) ← عضلات الوش تنقبض.
          - **Trousseau**: تنفخ الـ BP cuff على الدراع (cuff the Triceps) ← carpal spasm.
        page: 348
        quote: "Chvostek sign—tapping of facial nerve (tap the Cheek) → contraction of facial muscles. Trousseau sign—occlusion of brachial artery with BP cuff (cuff the Triceps) → carpal spasm."
      - kind: explain
        title: "Pseudohypo: الـ PTH موجود بس محدش سامع"
        text: |-
          **Pseudohypoparathyroidism type 1A**: autosomal dominant، جاي ==من الأم== (GNAS gene عليه imprinting). الـ mutation في الـ **Gs α subunit** اللي مربوطة بالـ PTH receptor، فالـ PTH يمسك الـ receptor والـ adenylate cyclase ما يشتغلش ← الكلية والعضم مش سامعين.

          Labs: ==PTH ↑== و Ca ↓ و PO4 ↑.

          وشكل **Albright hereditary osteodystrophy**: صوابع 4 و 5 قصيرة، قصر، وش مدوّر، subcutaneous calcifications، developmental delay.
        page: 348
        quote: "GNAS1-inactivating mutation (coupled to PTH receptor) that encodes the Gs protein α subunit → inactivation of adenylate cyclase when PTH binds to its receptor → end-organ resistance (kidney and bone) to PTH."
      - kind: reveal
        prompt: "Pseudopseudohypoparathyroidism: نفس الشكل بالظبط، بس الـ labs طبيعية. إزاي؟"
        answer: "نفس الـ GNAS mutation بس جاية ==من الأب==. في الكلية الـ allele بتاع الأم هو اللي شغال، وهو سليم، فالكلية سامعة الـ PTH كويس ← PTH و Ca و PO4 طبيعيين، والشكل (Albright) موجود."
        page: 348
        quote: "Pseudopseudohypoparathyroidism—autosomal dominant, paternally transmitted mutations (imprinted GNAS gene) but without end-organ resistance to PTH due to normal maternal allele maintaining renal responsiveness to PTH."
