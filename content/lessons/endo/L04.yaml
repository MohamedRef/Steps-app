        text: |-
          بتحصل مع **insulin** أو secretagogues (sulfonylureas و meglitinides) لو الجرعة عالية، أو ما أكلش، أو عمل رياضة.
          - **Neurogenic (autonomic)**: عرق و tachycardia و رعشة و قلق و جوع. دي ==الإنذار== اللي بيخليه يحس.
          - **Neuroglycopenic**: لخبطة و seizures وممكن موت، لأن المخ مش لاقي glucose.

          مع **β-blockers** الإنذار بيختفي، فممكن يجيله seizure من غير ما يحس: ==hypoglycemia unawareness==.

          العلاج: سكر بسيط (tablets أو عصير)، IM glucagon، IV dextrose.
        page: 352
        quote: "May occur in the absence of preceding neurogenic symptoms in patients with attenuated autonomic response, eg, β-blocker use (ie, hypoglycemia unawareness)."
