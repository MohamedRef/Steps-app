  - id: endo.L04.lesson7
    title: "الـ adrenal: cortisol زيادة، cortisol ناقص، و aldosterone زيادة"
    hook: "الـ ACTH هو اللي بيقولك المشكلة فين: في الغدة، ولا في الـ pituitary، ولا في حقنة الـ steroid"
    minutes: 10
    pages: [352, 354]
    topics: [cushing-syndrome, adrenal-insufficiency, hyperaldosteronism]
    goals:
      - "تعرف أسباب الـ Cushing وتمشي في الـ algorithm بتاعه"
      - "تفرّق primary عن secondary/tertiary adrenal insufficiency"
      - "تفرّق primary عن secondary hyperaldosteronism بالـ renin"
    status: unverified
    steps:
      - kind: explain
        title: "Cushing syndrome: 3 طرق للـ cortisol الزيادة"
        text: |-
          - **Exogenous glucocorticoids**: ==أشهر سبب==. الـ ACTH ↓ ← الغدتين يضمروا.
          - **Primary adrenal** (adenoma أو hyperplasia أو carcinoma): ACTH ↓ ← الغدة التانية تضمر.
          - **ACTH زيادة**: من **pituitary adenoma** (Cushing disease) أو **ectopic** (small cell lung cancer و bronchial carcinoids) ← الغدتين يكبروا (bilateral hyperplasia).

          وأغلب الحالات اللي من جوه الجسم (endogenous) سببها ==Cushing disease==.
        page: 352
        quote: "Exogenous glucocorticoids → ↓ ACTH → bilateral adrenal atrophy. Most common cause."
      - kind: mnemonic
        word: "MOONFACIES"
        parts:
          - { key: "M", text: "Metabolic syndrome (HTN, hyperglycemia, hyperlipidemia)" }
          - { key: "O", text: "Obesity: truncal، moon face، buffalo hump، أطراف رفيعة" }
          - { key: "O", text: "Osteoporosis" }
          - { key: "N", text: "Neuropsychiatric (depression, anxiety, irritability)" }
          - { key: "F", text: "Facial plethora" }
          - { key: "A", text: "Androgen excess (acne, hirsutism)" }
          - { key: "C", text: "Cataract" }
          - { key: "I", text: "Immunosuppression" }
          - { key: "E", text: "Ecchymoses (easy bruising)" }
          - { key: "S", text: "Skin: thinning, striae, hyperpigmentation" }
        hook: "MOON FACIES من الكتاب: وش المريض بيقولك العلامات."
        page: 352
        quote: "MOON FACIES: Metabolic syndrome (hypertension, hyperglycemia, hyperlipidemia), Obesity"
      - kind: order
        prompt: "رتّب خطوات تشخيص الـ Cushing"
        steps:
          - "Screening: 24-hr urine free cortisol أو late night salivary cortisol أو 1 mg overnight dexamethasone"
          - "Measure serum ACTH"
          - "ACTH عالي ← high-dose dexamethasone و/أو CRH stimulation test"
          - "اتكتم (أو علي مع CRH) ← pituitary MRI؛ ما اتكتمش ← CT chest/abdomen/pelvis"
        why: "لو الـ ACTH مكتوم يبقى exogenous أو adrenal tumor (adrenal CT). لو عالي: الـ pituitary adenoma لسه بيسمع شوية للـ feedback فبيتكتم بالجرعة العالية، والـ ectopic ما بيسمعش."
        page: 352
        quote: "Screening tests include: ↑ free cortisol on 24-hr urinalysis, ↑ late night salivary cortisol, and no suppression with overnight low-dose dexamethasone test."
      - kind: check
        question: "Cushing features, high ACTH, no suppression with high-dose dexamethasone. Next step?"
        options:
          - "CT of chest, abdomen and pelvis"
          - "MRI of the pituitary"
          - "Adrenal CT"
          - "Stop prednisone"
        answer: 0
        why:
          - "صح: ACTH عالي وما اتكتمش ← ectopic ACTH، ندوّر على الـ tumor (small cell أو carcinoid)."
          - "الـ pituitary MRI لو اتكتم."
          - "الـ adrenal CT لو الـ ACTH مكتوم."
          - "الـ steroids من برّه بتكتم الـ ACTH، وهنا عالي."
        page: 352
        quote: "CT of the chest/abdomen/pelvis (to identify tumor)"
      - kind: explain
        title: "Adrenal insufficiency"
        text: |-
          الغدة مش بتطلّع glucocorticoids كفاية (+/- mineralocorticoids): ضعف و تعب و orthostatic hypotension و آلام عضلات ونقص وزن و GI و ==نفسه في الملح أو السكر==. العلاج: glucocorticoid +/- mineralocorticoid.

          - **Primary**: الغدة نفسها ← cortisol ↓ و aldosterone ↓ ← hypotension و hyperkalemia و metabolic acidosis. والـ ACTH بيعلى، ومعاه الـ MSH ← ==hyperpigmentation== (أماكن الضغط والـ buccal mucosa). Primary pigments.
          - **Addison**: الـ primary المزمن؛ autoimmune في البلاد الغنية، **TB** في البلاد الفقيرة.
          - **Secondary** (ACTH ↓) و **tertiary** (CRH ↓): الـ aldosterone سليم (الـ RAAS شغال) ← ما فيش hyperkalemia ولا hyperpigmentation. الـ tertiary غالباً من ==وقف الـ steroids فجأة== (Tertiary from treatment).
        page: 353
        quote: "2° adrenal insufficiency is due to pituitary pathologies, 3° adrenal insufficiency is most commonly due to abrupt cessation of chronic glucocorticoid therapy (HPA suppression). Tertiary from treatment."
      - kind: sort
        prompt: "Primary ولا secondary/tertiary؟"
        bins: ["Primary", "Secondary/tertiary"]
        cards:
          - { text: "Hyperkalemia", bin: 0 }
          - { text: "Hyperpigmentation", bin: 0 }
          - { text: "↑ ACTH", bin: 0 }
          - { text: "Waterhouse-Friderichsen", bin: 0 }
          - { text: "Abrupt stop of chronic prednisone", bin: 1 }
          - { text: "Pituitary pathology", bin: 1 }
          - { text: "Low or inappropriately normal ACTH", bin: 1 }
        why: "الـ primary بيضرب الغدة كلها (aldosterone كمان) وبيعلّي الـ ACTH والـ MSH. الـ secondary/tertiary بيقلل الـ ACTH، والـ aldosterone سليم."
        page: 353
        quote: "No hyperkalemia (aldosterone synthesis preserved due to functioning adrenal gland, intact RAAS), no hyperpigmentation."
      - kind: explain
        title: "الأزمة"
        text: |-
          **Adrenal (addisonian) crisis**: مريض عنده insufficiency أو على steroids، وجاله stress زي infection زوّد احتياجه ← ألم بطن حاد و ترجيع و لخبطة و ==shock==.

          و **Waterhouse-Friderichsen**: نزيف في الـ adrenals الاتنين مع sepsis (زي ==meningococcemia==) ← primary insufficiency حادة.
        page: 353
        quote: "Waterhouse-Friderichsen syndrome—bilateral adrenal hemorrhage in the setting of sepsis (eg, meningococcemia) → acute 1° adrenal insufficiency."
      - kind: explain
        title: "Hyperaldosteronism"
        text: |-
          aldosterone زيادة ← hypertension و K+ ↓ أو طبيعي و ==metabolic alkalosis==.

          - **Primary**: bilateral hyperplasia أو adenoma (**Conn syndrome**). aldosterone ↑ و ==renin ↓== ← hypertension مقاومة للعلاج. ما بيعملش edema بسبب الـ **aldosterone escape**.
          - **Secondary**: renovascular hypertension، juxtaglomerular tumor (renin)، أو edema (cirrhosis و heart failure و nephrotic). aldosterone ↑ و ==renin ↑==. وبعضهم (زي HF) بيبوّظ الـ escape فالـ edema بيزيد.
        page: 354
        quote: "1° hyperaldosteronism does not directly cause edema due to aldosterone escape mechanism."
      - kind: check
        question: "Resistant hypertension, K 2.9, HCO3 31, high aldosterone, low renin. Diagnosis?"
        options:
          - "Primary hyperaldosteronism"
          - "Renovascular hypertension"
          - "Heart failure"
          - "Juxtaglomerular tumor"
        answer: 0
        why:
          - "صح: aldosterone عالي والـ renin مكتوم = المصدر الغدة نفسها (Conn أو hyperplasia)."
          - "الـ renovascular بيعلّي الـ renin."
          - "الـ heart failure secondary بـ renin عالي ومعاه edema."
          - "الـ JG tumor بيطلّع renin."
        page: 354
        quote: "↑ aldosterone, ↓ renin. Leads to treatment-resistant hypertension."
      - kind: figure
        title: "شاكك في adrenal insufficiency؟"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
