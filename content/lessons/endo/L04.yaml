        caption: "أكّد الأول إن الـ cortisol واطي، وبعدين الـ ACTH يقولك فين المشكلة: عالي يبقى الغدة نفسها، واطي أو طبيعي يبقى فوق."
        alt: "Algorithm: check AM cortisol or an ACTH stimulation test; if cortisol is low, measure random serum ACTH. High ACTH means primary adrenal insufficiency; low or inappropriately normal ACTH means secondary or tertiary insufficiency."
