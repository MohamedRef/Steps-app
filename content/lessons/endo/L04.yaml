  - id: endo.L04.lesson6
    title: "السكر: المضاعفات والتشخيص والطوارئ"
    hook: "السكر بيلزق في البروتين وبيتحول لـ sorbitol، وفي الطوارئ الـ K+ في الدم بيكدب عليك"
    minutes: 10
