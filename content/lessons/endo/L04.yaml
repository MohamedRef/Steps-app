      - "Primary insufficiency: aldosterone ↓ (K+ ↑) و ACTH ↑ (pigmentation)؛ secondary/tertiary لأ."
      - "Tertiary from treatment؛ Waterhouse-Friderichsen مع meningococcemia."
      - "Primary hyperaldo: renin ↓، ما فيش edema؛ secondary: renin ↑."
