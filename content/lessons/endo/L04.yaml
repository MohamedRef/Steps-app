        answer: "الـ K+ ده ==كدّاب==: نقص الـ insulin والحمض طلّعوا الـ K+ من جوه الخلايا للدم، والـ osmotic diuresis رمت منه كتير في البول. فالـ total body K+ ناقص. أول ما الـ insulin يشتغل الـ K+ هيرجع جوه الخلايا وينزل فجأة. عشان كده العلاج: **IV fluids و IV insulin و K+**، ونضيف glucose لو السكر نزل."
