schema: steps.lesson/v1
lecture: endo.L04
lessons:
  - id: endo.L04.lesson1
    title: "الماية: SIADH بيحبسها، والـ DI بيسيبها تنزل"
    hook: "مريض بيشرب كتير وبيتبول كتير: هل العيب في الحنفية، ولا في الماسورة، ولا هو بيشرب بزيادة؟ اختبار واحد بيفرّق"
    minutes: 9
    pages: [342, 342]
    topics: [siadh, primary-polydipsia-and-diabetes-insipidus]
    goals:
      - "تفهم ليه الـ SIADH بيعمل hyponatremia من غير edema"
      - "تعدّ أسباب الـ SIADH وعلاجه"
      - "تفرّق بين primary polydipsia و central DI و nephrogenic DI بالـ water restriction والـ desmopressin"
    status: unverified
    steps:
      - kind: explain
        title: "SIADH: ADH شغال من غير لزمة"
        text: |-
          في الـ **SIADH** الـ ADH بيطلع وهو مش مطلوب، فالكلية بتمسك ==free water== زيادة. النتيجة:
          - **Hyponatremia euvolemic**: المريض مش منفوخ.
          - البول **مركّز** أكتر من الدم (urine osm > serum osm).
          - والـ **Na+ بيفضل نازل في البول**.

          ليه مش منفوخ؟ الجسم بيحس بالماية الزيادة فيقلل الـ **aldosterone** ويعلّي الـ **ANP و BNP** ← يرمي Na+ ومعاه ماية ← الـ volume يرجع طبيعي، بس الـ Na+ يفضل واطي.
        page: 342
        quote: "Body responds to water retention with ↓ aldosterone and ↑ ANP and BNP → ↑ urinary Na+ secretion → normalization of extracellular fluid volume → euvolemic hyponatremia."
      - kind: mnemonic
        word: "HEELD"
        parts:
          - { key: "H", text: "Head trauma / CNS disorders" }
          - { key: "E", text: "Ectopic ADH (small cell lung cancer)" }
          - { key: "E", text: "Exogenous hormones (vasopressin, desmopressin, oxytocin)" }
          - { key: "L", text: "Lung disease" }
          - { key: "D", text: "Drugs (SSRIs, carbamazepine, cyclophosphamide)" }
        hook: "HEELD-up water من الكتاب: الماية محبوسة."
        page: 342
        quote: "SIADH causes include (HEELD-up water): Head trauma/CNS disorders Ectopic ADH (eg, small cell lung cancer)"
      - kind: explain
        title: "العلاج"
        text: |-
          أول خطوة: ==fluid restriction==. لو مش كفاية: salt tablets، أو **IV hypertonic saline**، أو diuretics، أو ==ADH antagonists== (conivaptan و tolvaptan و demeclocycline).
        page: 342
        quote: "Treatment: fluid restriction (first line), salt tablets, IV hypertonic saline, diuretics, ADH antagonists (eg, conivaptan, tolvaptan, demeclocycline)."
      - kind: check
        question: "A smoker with a hilar mass has Na 121, euvolemia, urine osm 500 and urine Na 45. First-line treatment?"
        options:
          - "Fluid restriction"
          - "Desmopressin"
          - "Water loading"
          - "Fludrocortisone"
        answer: 0
        why:
          - "صح: ده SIADH من ectopic ADH (small cell)، وأول علاج تقليل السوايل."
          - "الـ desmopressin هو ADH، هيزوّد المشكلة."
          - "ماية زيادة هتنزّل الـ Na+ أكتر."
          - "الـ aldosterone أصلاً واطي، ومش هو العلاج في الكتاب."
        page: 342
        quote: "Treatment: fluid restriction (first line)"
      - kind: figure
        title: "3 أسباب لبول كتير خفيف"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="6" y="10" width="110" height="170" rx="10"/>
            <text x="14" y="30" class="t-sm t-b">Primary</text>
            <text x="14" y="46" class="t-sm t-b">polydipsia</text>
            <text x="14" y="72" class="t-sm">drinks too much</text>
            <text x="14" y="96" class="t-sm">serum osm ↓</text>
            <text x="14" y="120" class="t-sm">ADH ↓/normal</text>
            <text x="14" y="148" class="t-sm t-good">water restriction:</text>
            <text x="14" y="164" class="t-sm t-good">urine osm ↑↑</text>
            <rect class="fg-acc" x="125" y="10" width="110" height="170" rx="10"/>
            <text x="133" y="30" class="t-sm t-b">Central DI</text>
            <text x="133" y="72" class="t-sm">no ADH made</text>
            <text x="133" y="96" class="t-sm">serum osm ↑</text>
            <text x="133" y="120" class="t-sm">ADH ↓</text>
            <text x="133" y="148" class="t-sm t-good">desmopressin:</text>
            <text x="133" y="164" class="t-sm t-good">urine osm ↑ >50%</text>
            <rect class="fg-bad" x="244" y="10" width="110" height="170" rx="10"/>
            <text x="252" y="30" class="t-sm t-b">Nephrogenic DI</text>
            <text x="252" y="72" class="t-sm">kidney deaf</text>
            <text x="252" y="96" class="t-sm">serum osm ↑</text>
            <text x="252" y="120" class="t-sm">ADH normal/↑</text>
            <text x="252" y="148" class="t-sm t-bad">desmopressin:</text>
            <text x="252" y="164" class="t-sm t-bad">minimal change</text>
          </svg>
        caption: "الـ serum osmolality بتفرّق الأول: واطية لو هو بيشرب زيادة، وعالية لو بيخسر ماية. وبعدين الـ desmopressin بيقولك العيب في الهرمون (central) ولا في الكلية (nephrogenic)."
        alt: "Three columns. Primary polydipsia: drinks too much, low serum osmolality, low or normal ADH, urine concentrates with water restriction. Central DI: no ADH, high serum osmolality, urine concentrates by over 50 percent with desmopressin. Nephrogenic DI: kidney unresponsive, high serum osmolality, normal or high ADH, minimal change with desmopressin."
        page: 342
        quote: "SERUM OSMOLALITY ↓ ↑ ↑ ADH LEVEL ↓ or normal ↓ Normal or ↑"
      - kind: explain
        title: "الأسباب والعلاج"
        text: |-
          البول في الحالات دي: specific gravity أقل من **1.006** و osmolality غالباً أقل من **300**.
          - **Primary polydipsia**: أمراض نفسية أو lesion في مركز العطش ← العلاج ==water restriction==.
          - **Central DI** (AVP deficiency): idiopathic أو إصابة مخ (trauma و hypoxia و tumor و surgery و infiltrative) ← ==desmopressin (DDAVP)==.
          - **Nephrogenic DI** (AVP resistance): وراثي (V2-receptor mutation)، أدوية (**lithium** و demeclocycline)، **hypercalcemia** و **hypokalemia** ← عالج السبب، و low-solute diet و ==HCTZ== و amiloride و indomethacin.
        page: 342
        quote: "Hereditary (V2-receptor mutation), drugs (eg, lithium, demeclocycline), hypercalcemia, hypokalemia"
      - kind: reveal
        prompt: "الـ central DI بعد عملية في الـ posterior pituitary ممكن يخف لوحده. إزاي والـ ADH مكانه اتشال؟"
        answer: "الـ ADH بيتعمل فوق في الـ hypothalamus. لو الضرر ==تحت الـ median eminence== أو في الـ posterior pituitary بس، الـ ADH لسه يقدر يطلع للدم من الـ portal capillaries في الـ median eminence، فالـ DI يبقى transient."
        page: 342
        quote: "Central DI may be transient if damage is below hypothalamic median eminence or in the posterior pituitary"
      - kind: explain
        title: "الـ water restriction test"
        text: |-
          المريض ما يشربش **2-3 ساعات**، وكل ساعة نقيس حجم البول والـ osmolality والـ Na+ والـ plasma osmolality.

          بنديله **desmopressin** لو: الـ serum osm بقت أكتر من **295-300**، أو الـ Na+ وصل **145** أو أكتر، أو البول ما اتركزش رغم إن الدم اتركّز.
        page: 342
        quote: "Desmopressin (ADH analog) is administered if serum osmolality >295-300 mOsm/kg, plasma Na+ ≥145 mEq/L, or urine osmolality does not increase despite ↑ plasma osmolality."
      - kind: case
        stem: "ست عندها bipolar على lithium من 10 سنين، بتتبول كل ساعة. Na 146 و serum osm 302 و urine osm 150."
        steps:
          - question: "After water restriction urine osm barely rises; after desmopressin it rises 5%. Diagnosis?"
            options: ["Nephrogenic DI", "Central DI", "Primary polydipsia"]
            answer: 0
            why: "الكلية مش سامعة حتى للـ desmopressin، والـ lithium سبب كلاسيكي. الـ central كان هيستجيب أكتر من 50%، والـ polydipsia كان الـ serum osm هيبقى واطي."
          - question: "Which treatment fits?"
            options: ["Hydrochlorothiazide", "Desmopressin", "Tolvaptan"]
            answer: 0
            why: "علاج الـ nephrogenic: السبب، و low-solute diet و HCTZ و amiloride و indomethacin. الـ desmopressin مش هيفيد، والـ tolvaptan بيعمل عكس المطلوب."
        page: 342
        quote: "Manage the underlying cause; low-solute diet, HCTZ, amiloride, indomethacin"
      - kind: try
        items: [endo.L04.001, endo.L04.003, endo.L04.007, endo.L04.009]
    recap:
      - "SIADH: euvolemic hyponatremia، urine osm > serum osm، Na+ مستمر في البول."
      - "HEELD-up water؛ أول علاج fluid restriction، والـ ADH antagonists (conivaptan و tolvaptan و demeclocycline)."
      - "Polydipsia: serum osm ↓، تستجيب للـ water restriction."
      - "Central DI: ADH ↓، الـ desmopressin يعلّي البول أكتر من 50%."
      - "Nephrogenic DI (lithium، hypercalcemia، hypokalemia): مش بتستجيب؛ HCTZ و amiloride و indomethacin."
    practice: [endo.L04.001, endo.L04.002, endo.L04.003, endo.L04.004, endo.L04.005, endo.L04.006, endo.L04.007, endo.L04.008, endo.L04.009, endo.L04.010]
  - id: endo.L04.lesson2
    title: "الـ pituitary: لما تقل ولما الـ GH يزيد"
    hook: "ست ولدت ونزفت ومش عارفة ترضع، وراجل خاتمه مبقاش داخل صباعه. نفس الغدة، مشكلتين عكس بعض"
    minutes: 8
    pages: [343, 343]
    topics: [hypopituitarism, acromegaly]
    goals:
      - "تعدّ أسباب الـ hypopituitarism وتعرف Sheehan"
      - "تعرف علامات الـ acromegaly وسبب الوفاة"
      - "تعرف ليه بنشخص بالـ IGF-1 مش بالـ GH"
    status: unverified
    steps:
      - kind: explain
        title: "Hypopituitarism"
        text: |-
          الـ pituitary بتطلّع هرمونات أقل بسبب:
          - مرض في الـ **hypothalamus** (mass أو radiation أو infiltrative)
          - **عملية** في الـ pituitary
          - مشاكل الـ pituitary نفسها: **mass effect** من nonsecreting adenoma أو craniopharyngioma
          - **Empty sella**
          - ==Sheehan syndrome==

          العلاج: نعوّض الهرمونات (glucocorticoids و thyroxine و sex steroids و GH).
        page: 343
        quote: "Undersecretion of pituitary hormones due to: Hypothalamic disease (ie, mass lesion, radiation, infiltrative lesions) Pituitary surgery"
      - kind: reveal
        prompt: "ليه الـ pituitary بالذات بتموت بعد نزيف الولادة؟"
        answer: "في الحمل الـ pituitary ==بتكبر== (pregnancy-induced growth)، فبتبقى محتاجة دم أكتر. نزيف شديد بعد الولادة ← hypoperfusion ← ischemic infarct. ده **Sheehan syndrome**."
        page: 343
        quote: "Sheehan syndrome—ischemic infarct of pituitary following severe postpartum hemorrhage; pregnancy-induced pituitary growth → ↑ susceptibility to hypoperfusion."
      - kind: explain
        title: "شكل Sheehan"
        text: |-
          أغلب الضرر في الـ **anterior pituitary**، فالأعراض كلها هرموناتها:
          - ==مش قادرة ترضع== (prolactin)
          - **amenorrhea** (FSH و LH)
          - **cold intolerance** (TSH)
        page: 343
        quote: "Usually presents with failure to lactate, amenorrhea, cold intolerance (anterior pituitary hormones mainly affected)."
      - kind: explain
        title: "Acromegaly: الـ GH الزيادة عند الكبير"
        text: |-
          الـ GH الزيادة عند الكبار = **acromegaly**، وغالباً سببها pituitary adenoma. عند الأطفال = **gigantism** لأن الـ epiphysis لسه مفتوحة فالعضم يطول (Acromegaly in adults, gigantism in j(g)uniors).

          العلامات:
          - **لسان كبير** فيه تجاعيد عميقة، frontal bossing، ملامح بتتخشن مع السن، صوت تخين
          - **diaphoresis** (عرق كتير)، hypertrophic arthropathy
          - **impaired glucose tolerance** (insulin resistance)، hypertension، **LVH**
          - ==HFpEF==: أشهر سبب للوفاة
        page: 343
        quote: "Large tongue with deep furrows, frontal bossing, coarsening of facial features with aging A , deep voice, diaphoresis (excessive sweating), hypertrophic arthropathy"
      - kind: figure
        title: "الـ GH بيعمل إيه في الكبير"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="en4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="130" y="8" width="100" height="30" rx="8"/>
            <text x="146" y="28" class="t-sm t-b">GH ↑ → IGF-1 ↑</text>
            <line class="fg-arrow-acc" x1="150" y1="38" x2="60" y2="70" marker-end="url(#en4a)"/>
            <line class="fg-arrow-acc" x1="180" y1="38" x2="180" y2="70" marker-end="url(#en4a)"/>
            <line class="fg-arrow-acc" x1="210" y1="38" x2="300" y2="70" marker-end="url(#en4a)"/>
            <rect class="fg-box" x="4" y="72" width="112" height="100" rx="8"/>
            <text x="12" y="90" class="t-sm t-b">Face, body</text>
            <text x="12" y="108" class="t-sm">large tongue</text>
            <text x="12" y="124" class="t-sm">frontal bossing</text>
            <text x="12" y="140" class="t-sm">deep voice</text>
            <text x="12" y="156" class="t-sm">sweating, joints</text>
            <rect class="fg-box" x="124" y="72" width="112" height="100" rx="8"/>
            <text x="132" y="90" class="t-sm t-b">Metabolic</text>
            <text x="132" y="108" class="t-sm">insulin resistance</text>
            <text x="132" y="124" class="t-sm">glucose intolerance</text>
            <rect class="fg-bad" x="244" y="72" width="112" height="100" rx="8"/>
            <text x="252" y="90" class="t-sm t-b">Heart</text>
            <text x="252" y="108" class="t-sm">hypertension</text>
            <text x="252" y="124" class="t-sm">LVH</text>
            <text x="252" y="140" class="t-sm t-b">HFpEF</text>
            <text x="252" y="156" class="t-sm t-bad">top cause of death</text>
          </svg>
        caption: "الـ GH الزيادة بيكبّر الأنسجة الرخوة والعضم، وبيعمل insulin resistance، وبيتعب القلب لحد HFpEF، وده اللي بيموّت المريض."
        alt: "Excess GH and IGF-1 lead to soft tissue and bone changes (large tongue, frontal bossing, deep voice, sweating, joints), metabolic changes (insulin resistance, glucose intolerance) and heart changes (hypertension, LVH, HFpEF, the top cause of death)."
        page: 343
        quote: "hypertension, LVH, HFpEF (most common cause of death)."
      - kind: check
        question: "Best initial test for suspected acromegaly?"
        options:
          - "Serum IGF-1"
          - "Random serum GH"
          - "Serum prolactin"
          - "Fasting insulin"
        answer: 0
        why:
          - "صح: الـ IGF-1 ثابت، والـ GH بيتذبذب طول اليوم فما ينفعش نعتمد عليه."
          - "الـ GH العشوائي unreliable لأنه بيطلع pulses."
          - "الـ prolactin للـ prolactinoma."
          - "الـ insulin مش هو التشخيص."
        page: 343
        quote: "↑ serum IGF-1 (GH levels unreliable as they fluctuate throughout the day)"
      - kind: explain
        title: "التشخيص والعلاج"
        text: |-
          التشخيص: ==↑ IGF-1==، والـ GH ==ما بيقلّش بعد OGTT== (المفروض السكر يكتمه)، و pituitary mass في الـ MRI.

          العلاج: نشيل الـ adenoma. لو ما خفش:
          - **octreotide** (somatostatin analog)
          - **pegvisomant** (GH receptor antagonist)
          - **dopamine agonists** (cabergoline)
        page: 343
        quote: "failure to suppress serum GH following oral glucose tolerance test; pituitary mass seen on brain MRI."
      - kind: match
        prompt: "وصّل كل دوا بطريقته في الـ acromegaly"
        pairs:
          - ["Octreotide", "Somatostatin analog"]
          - ["Pegvisomant", "GH receptor antagonist"]
          - ["Cabergoline", "Dopamine agonist"]
        why: "التلاتة بعد الجراحة لو ما خفش. الـ pegvisomant الوحيد اللي بيقفل الـ receptor نفسه."
        page: 343
        quote: "treat with octreotide (somatostatin analog), pegvisomant (GH receptor antagonist), or dopamine agonists (eg, cabergoline)."
      - kind: try
        items: [endo.L04.011, endo.L04.012, endo.L04.016, endo.L04.018]
    recap:
      - "Hypopituitarism: hypothalamus، surgery، mass، empty sella، Sheehan."
      - "Sheehan: pituitary كبيرة في الحمل + نزيف ← infarct ← مش بترضع و amenorrhea و cold intolerance."
      - "Acromegaly: لسان كبير، frontal bossing، عرق، insulin resistance، LVH؛ HFpEF أشهر سبب وفاة."
      - "التشخيص بالـ IGF-1 و الـ GH ما بيقلّش بعد OGTT."
      - "العلاج: جراحة، ثم octreotide أو pegvisomant أو cabergoline."
    practice: [endo.L04.011, endo.L04.012, endo.L04.013, endo.L04.014, endo.L04.015, endo.L04.148, endo.L04.016, endo.L04.017, endo.L04.018, endo.L04.019, endo.L04.020]
  - id: endo.L04.lesson3
    title: "الـ thyroid الكسلانة والـ thyroid المتهورة"
    hook: "كل عَرَض في الـ hypothyroidism عكسه موجود في الـ hyperthyroidism. وبعدين: مين اللي بيبوّظ الغدة؟"
    minutes: 10
    pages: [344, 345]
    topics: [hypothyroidism-vs-hyperthyroidism, hypothyroidism]
    goals:
      - "تقارن الـ hypo بالـ hyper في كل جهاز وتفهم السبب"
      - "تفرّق بين Hashimoto و de Quervain و Riedel"
      - "تعرف الـ 6 P's والأسباب التانية"
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة: الـ T3 بنزين"
        text: |-
          افتكر الـ 7 B's من الـ physiology (ص 335): الـ T3 بيعلّي الـ BMR والـ β-adrenergic والـ lipolysis. فالـ **hypo** كل حاجة فيه بطيئة وباردة، والـ **hyper** كل حاجة سريعة وسخنة:
          - **Hypo**: برد، عرق أقل، وزن بيزيد، constipation، bradycardia، reflexes بطيئة، اكتئاب.
          - **Hyper**: حر، عرق كتير، وزن بيقل (↑ Na+/K+-ATPase)، إسهال، tachycardia و AF، fine tremor، reflexes سريعة، قلق وأرق.
        page: 344
        quote: "Heat intolerance, ↑ sweating, weight loss (↑ synthesis of Na+ /K+ -ATPase → ↑ basal metabolic rate → ↑ calorigenesis)"
      - kind: sort
        prompt: "ده hypo ولا hyper؟"
        bins: ["Hypothyroidism", "Hyperthyroidism"]
        cards:
          - { text: "Myoedema", bin: 0 }
          - { text: "Hyponatremia", bin: 0 }
          - { text: "Hypercholesterolemia", bin: 0 }
          - { text: "Carpal tunnel syndrome", bin: 0 }
          - { text: "Onycholysis", bin: 1 }
          - { text: "Lid lag", bin: 1 }
          - { text: "Osteoporosis", bin: 1 }
          - { text: "Gynecomastia", bin: 1 }
        why: "الـ hypo: الماية بتتحبس (hyponatremia)، والـ LDL receptors تقل (cholesterol ↑)، و myoedema و carpal tunnel. الـ hyper: الـ sympathetic بيشد الـ superior tarsal (lid lag)، والـ T3 بيشغّل الـ osteoclasts، و onycholysis و gynecomastia."
        page: 344
        quote: "Hypercholesterolemia (due to ↓ LDL receptor expression)"
      - kind: explain
        title: "تفاصيل بيحبها الامتحان"
        text: |-
          - **Myxedema** في الـ hypo: nonpitting، لأن ==GAGs== بتتجمع في الـ interstitium وبتشد ماية. (أما الـ **pretibial myxedema** فده Graves.)
          - **Myopathy**: الاتنين proximal weakness، بس الـ ==CK عالي في الـ hypo== وطبيعي في الـ hyper.
          - **Myoedema**: كورة صغيرة بتطلع في العضلة لما تخبطها بالـ hammer (hypo).
          - **القلب في الـ hyper**: ↑ عدد وحساسية الـ β receptors، ↑ sarcolemmal ATPase، ↓ phospholamban.
          - **Labs**: الـ hypo (1°) TSH ↑ و free T4 ↓ و cholesterol ↑؛ الـ hyper (1°) TSH ↓ و T3/T4 ↑ و cholesterol ↓.
        page: 344
        quote: "puffy facies and generalized nonpitting edema (myxedema) due to ↑ GAGs in interstitial spaces → ↑ osmotic pressure → water retention"
      - kind: explain
        title: "Hashimoto: أشهر سبب"
        text: |-
          **Hashimoto** (chronic autoimmune thyroiditis) هو ==أشهر سبب للـ hypothyroidism== في الأماكن اللي فيها iodine كفاية.
          - غدة كبيرة شوية و **مش بتوجع**.
          - ممكن يبتدي بـ hyper مؤقت (**Hashitoxicosis**) لأن الـ follicles بتنفجر وتطلّع هرمون.
          - **Anti-TPO** (antimicrosomal) و **antithyroglobulin**.
          - Histology: ==Hürthle cells== و lymphoid aggregates بـ germinal centers.
          - **HLA-DR3**، و ↑ خطر **primary thyroid lymphoma** (DLBCL).

          والـ **postpartum thyroiditis** نسخة خفيفة منه في أول سنة بعد الولادة: hyper ← hypo ← يرجع طبيعي.
        page: 345
        quote: "Also called chronic autoimmune thyroiditis. Most common cause of hypothyroidism in iodine sufficient regions."
      - kind: table
