        text: "الـ PO4 بيفرّق: في نقص الـ vitamin D الـ PO4 ==طبيعي أو واطي== (الأمعاء مش بتمتص، والـ PTH بيرمي). في الـ CKD الـ PO4 ==عالي== لأن الكلية مش قادرة ترميه. وفي الـ hypopara والـ pseudo الـ PO4 عالي لأن الـ PTH مش شغال."
