  - id: endo.L04.lesson8
    title: "الأورام الـ neuroendocrine: من الـ adrenal للبنكرياس"
    hook: "كل ورم هنا ليه رقم: rule of 10's، و 5 P's، و 6 D's، و rule of thirds. احفظ الرقم وهتفتكر الورم"
    minutes: 10
    pages: [354, 357]
    topics: [neuroendocrine-tumors, neuroblastoma, pheochromocytoma, multiple-endocrine-neoplasias, pancreatic-islet-cell-tumors, carcinoid-tumors, zollinger-ellison-syndrome]
    goals:
      - "تفرّق الـ neuroblastoma عن الـ Wilms وعن الـ pheochromocytoma"
      - "تعرف تحضير الـ pheochromocytoma للعملية (A before B)"
      - "تحفظ أنواع الـ MEN بالـ P's و M's"
      - "تعرف insulinoma و glucagonoma و somatostatinoma و carcinoid و ZES"
    status: unverified
    steps:
      - kind: explain
        title: "عيلة واحدة"
        text: |-
          الـ **neuroendocrine cells** شبه الأعصاب وشبه الغدد في نفس الوقت، وبيشتركوا في ==APUD== (amine precursor uptake decarboxylase). أماكن الأورام: الـ GI (carcinoid و gastrinoma)، البنكرياس (insulinoma و glucagonoma)، الرئة (small cell)، والـ thyroid (medullary) والـ adrenal (pheochromocytoma).

          الـ markers: **chromogranin A** و **NSE** و **synaptophysin**. العلاج: جراحة و somatostatin analogs.
        page: 354
        quote: "Neuroendocrine cells (eg, pancreatic β cells, enterochromaffin cells) share a common biologic function through amine precursor uptake decarboxylase (APUD)"
      - kind: explain
        title: "Neuroblastoma: الطفل الصغير"
        text: |-
          ==أشهر solid tumor برّه المخ في الأطفال== (غالباً أقل من 4 سنين). من الـ **neural crest**، في الـ adrenal medulla أو أي حتة على الـ sympathetic chain.
          - كتلة ناشفة متعرّجة ==بتعدّي الـ midline== (الـ Wilms ناعم وفي ناحية واحدة).
          - الضغط غالباً **طبيعي** (عكس الـ pheo).
          - **Opsoclonus-myoclonus**: dancing eyes-dancing feet.
          - ↑ **HVA و VMA** في البول، **Homer-Wright rosettes**، bombesin و NSE، و ==N-myc amplification==.
        page: 354
        quote: "Most common presentation is abdominal distension and a firm, irregular mass that can cross the midline (vs Wilms tumor, which is smooth and unilateral)."
      - kind: explain
        title: "Pheochromocytoma"
        text: |-
          ==أشهر ورم في الـ adrenal medulla في الكبار==، من الـ chromaffin cells. مرتبط بـ **NF-1** و **VHL** و **RET** (MEN 2A و 2B).

          بيطلّع epinephrine و NE و dopamine في ==نوبات== (spells)، وممكن EPO ← polycythemia. الـ 5 P's: **P**ressure و **P**ain (صداع) و **P**erspiration و **P**alpitations و **P**allor.

          التشخيص: ↑ catecholamines و ==metanephrines== في البول والدم.

          Rule of 10's: 10% malignant، bilateral، extra-adrenal (paraganglioma، زي bladder wall أو organ of Zuckerkandl)، calcify، kids.
        page: 355
        quote: "Episodic hyperadrenergic symptoms (5 P’s): Pressure (↑ BP) Pain (headache) Perspiration Palpitations (tachycardia) Pallor"
      - kind: reveal
        prompt: "ليه ما ينفعش ندّي β-blocker الأول لمريض الـ pheochromocytoma؟"
        answer: "الـ catecholamines بتشتغل على α (تضييق الأوعية) و β2 (توسيع). لو قفلت الـ β الأول، الـ ==α يفضل لوحده== من غير حاجة تعادله ← hypertensive crisis. عشان كده **phenoxybenzamine** (irreversible α-antagonist) الأول، وبعدين β-blocker: A before B."
        page: 355
        quote: "α-blockade must be achieved before giving β-blockers to avoid a hypertensive crisis. A before B."
      - kind: figure
        title: "الـ MEN بالـ P's و M's"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="4" y="8" width="112" height="154" rx="10"/>
            <text x="14" y="28" class="t-sm t-b">MEN1 = 3 P's</text>
            <text x="14" y="52" class="t-sm">Pituitary</text>
            <text x="14" y="72" class="t-sm">Pancreas</text>
            <text x="14" y="92" class="t-sm">Parathyroid</text>
            <text x="14" y="122" class="t-sm t-mut">MEN1 gene, menin</text>
            <text x="14" y="140" class="t-sm t-mut">chromosome 11</text>
            <rect class="fg-good" x="124" y="8" width="112" height="154" rx="10"/>
            <text x="134" y="28" class="t-sm t-b">MEN2A</text>
            <text x="134" y="44" class="t-sm t-b">= 2 P's, 1 M</text>
            <text x="134" y="68" class="t-sm">Parathyroid</text>
            <text x="129" y="88" class="t-sm">Pheochromocytoma</text>
            <text x="134" y="108" class="t-sm">Medullary thyroid</text>
            <text x="134" y="140" class="t-sm t-mut">RET, chromosome 10</text>
            <rect class="fg-bad" x="244" y="8" width="112" height="154" rx="10"/>
            <text x="254" y="28" class="t-sm t-b">MEN2B</text>
            <text x="254" y="44" class="t-sm t-b">= 1 P, 2 M's</text>
            <text x="249" y="68" class="t-sm">Pheochromocytoma</text>
            <text x="254" y="88" class="t-sm">Medullary thyroid</text>
            <text x="254" y="108" class="t-sm">Mucosal neuromas</text>
            <text x="254" y="140" class="t-sm t-mut">RET, marfanoid</text>
          </svg>
        caption: "كلهم autosomal dominant (The X-MEN are dominant over villains). MEN1 فيه 3 P's، و MEN2A فيه 2 P's و M، و MEN2B فيه P واحدة و 2 M's، ومعاه marfanoid habitus."
        alt: "Three columns. MEN1 with 3 Ps: pituitary, pancreas, parathyroid; MEN1 gene, menin, chromosome 11. MEN2A with 2 Ps and 1 M: parathyroid, pheochromocytoma, medullary thyroid carcinoma; RET, chromosome 10. MEN2B with 1 P and 2 Ms: pheochromocytoma, medullary thyroid carcinoma, mucosal neuromas; RET, marfanoid habitus."
        page: 356
        quote: "MEN1 = 3 P’s MEN2A = 2 P’s, 1 M MEN2B = 1 P, 2 M’s"
      - kind: aside
        tone: exam
        text: "في MEN 2A و 2B الـ medullary thyroid carcinoma شبه أكيد، عشان كده ==prophylactic thyroidectomy== مطلوبة. والـ MEN1 فيه كمان angiofibromas و collagenomas و meningiomas."
        page: 356
        quote: "Medullary thyroid carcinoma—neoplasm of parafollicular C cells; secretes calcitonin; prophylactic thyroidectomy required"
      - kind: table
        title: "أورام الـ islets"
        columns: ["Tumor", "Cell", "Clue"]
        rows:
          - ["Insulinoma", "β", "Whipple triad; ↓ glucose with ↑ C-peptide; ~10% MEN1"]
          - ["Glucagonoma", "α", "6 D's: dermatitis (necrolytic migratory erythema), diabetes, DVT, declining weight, depression, diarrhea"]
          - ["Somatostatinoma", "δ", "Diabetes, steatorrhea, gallstones, achlorhydria"]
        hide: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
        page: 357
        quote: "Presents with 6 D’s: dermatitis (necrolytic migratory erythema), diabetes (hyperglycemia), DVT, declining weight, depression, diarrhea."
      - kind: reveal
        prompt: "الـ somatostatinoma بيعمل gallstones و steatorrhea و achlorhydria. إزاي هرمون واحد يعمل كل ده؟"
        answer: "الـ somatostatin ==فرامل عامة==: بيقلل secretin و CCK (فالمرارة ما بتفضاش ← حصاوي، والبنكرياس ما بيفرزش ← steatorrhea)، و gastrin (← achlorhydria)، و insulin (← سكر)، و glucagon و GIP."
        page: 357
        quote: "Tumor of pancreatic δ cells → overproduction of somatostatin → ↓ secretion of secretin, cholecystokinin, glucagon, insulin, gastrin, gastric inhibitory peptide (GIP)."
      - kind: explain
        title: "Carcinoid: الـ serotonin لازم يهرب من الكبد"
        text: |-
          الـ carcinoid (غالباً أمعاء أو رئة) بيطلّع **5-HT**، والكبد بيكسّره (first-pass) والرئة كمان بالـ **MAO**. فالـ ==carcinoid syndrome بيظهر لما الـ 5-HT يوصل الدورة== (غالباً بعد liver metastasis):
          - flushing في نوبات، diarrhea، wheezing
          - ==right-sided== valve disease (tricuspid regurgitation و pulmonic stenosis)
          - ↑ urinary **5-HIAA**
          - الـ 5-HT بيستهلك الـ tryptophan ← نقص niacin (**pellagra**).

          العلاج: جراحة، octreotide، أو **telotristat** (tryptophan hydroxylase inhibitor). Rule of thirds: 1/3 metastasize، 1/3 معاهم ورم تاني، 1/3 multiple.
        page: 357
        quote: "If 5-HT reaches the systemic circulation (eg, after liver metastasis), carcinoid tumor may present with carcinoid syndrome"
      - kind: explain
        title: "Zollinger-Ellison"
        text: |-
          **Gastrinoma** (أشهر مكان ==الـ duodenum==، أو البنكرياس) ← حمض كتير جداً ← قرح كتير ومتكررة في الـ duodenum والـ jejunum، مش بتخف بجرعة الـ PPI العادية، و malabsorption (الحمض بيبوّظ إنزيمات البنكرياس).

          التشخيص: ==secretin stimulation test== موجب: الـ gastrin يعلى بعد الـ secretin، مع إن الطبيعي الـ secretin يكتمه. ومرتبط بـ MEN1. العلاج: PPI بجرعة عالية وجراحة.
        page: 357
        quote: "Positive secretin stimulation test (↑ gastrin levels after secretin administration, which normally inhibits gastrin release)."
      - kind: check
        question: "Flushing, diarrhea, wheezing and tricuspid regurgitation with an ileal mass. What must have happened for symptoms to appear?"
        options:
          - "Liver metastasis"
          - "Lung metastasis only"
          - "Tryptophan excess"
          - "MEN1 mutation"
        answer: 0
        why:
          - "صح: الكبد كان بيكسّر الـ 5-HT؛ لما الورم وصل الكبد، الـ 5-HT بقى يدخل الدورة على طول."
          - "الرئة نفسها بتكسّر الـ 5-HT بالـ MAO."
          - "بالعكس، الـ tryptophan بيقل ← pellagra."
          - "الـ MEN1 مش شرط للـ carcinoid syndrome."
        page: 357
        quote: "If 5-HT reaches the systemic circulation (eg, after liver metastasis), carcinoid tumor may present with carcinoid syndrome"
      - kind: try
        items: [endo.L04.115, endo.L04.119, endo.L04.121, endo.L04.124, endo.L04.131]
