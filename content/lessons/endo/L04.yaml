        alt: "Low insulin leads to lipolysis, free fatty acids and ketones, then anion gap metabolic acidosis, Kussmaul breathing and fruity breath; and to hyperglycemia and osmotic diuresis, then loss of water, sodium and potassium, dehydration and total body potassium depletion."
