            <text x="252" y="142" class="t-sm">(glucocorticoids)</text>
          </svg>
        caption: "الـ antibody نفسه بيشغّل الـ TSH receptor في 3 أماكن: الغدة (hyperthyroidism و goiter)، وجلد الساق (pretibial myxedema)، والعين (orbitopathy)."
        alt: "Thyroid-stimulating immunoglobulin, an IgG causing type II hypersensitivity, stimulates the TSH receptor on thyroid cells (hyperthyroidism, diffuse goiter), dermal fibroblasts (pretibial myxedema) and orbital fibroblasts (Graves orbitopathy, treated with glucocorticoids)."
