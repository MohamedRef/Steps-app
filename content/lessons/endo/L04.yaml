  - id: endo.L04.lesson4
    title: "Graves والـ storm والعُقد والسرطان"
    hook: "antibody واحد بيعمل 3 حاجات في 3 أماكن. وبعدين: العقدة دي حميدة ولا لأ؟"
    minutes: 10
    pages: [346, 347]
    topics: [hyperthyroidism, causes-of-goiter, thyroid-adenoma, thyroid-cancer]
    goals:
      - "تفهم الـ TSI بيعمل إيه في الغدة والجلد والعين"
      - "تعالج الـ thyroid storm بالـ 4 P's"
      - "تفرّق بين أنواع سرطان الـ thyroid ومضاعفات العملية"
    status: unverified
    steps:
      - kind: explain
        title: "Graves: antibody بيعمل نفسه TSH"
        text: |-
          **Graves** هو ==أشهر سبب للـ hyperthyroidism==. الـ **TSI** (IgG، **type II hypersensitivity**) بيشغّل الـ TSH receptor في 3 أماكن:
          - **الغدة** ← hyperthyroidism و diffuse goiter
          - **dermal fibroblasts** ← ==pretibial myxedema==
          - **orbital fibroblasts** ← Graves orbitopathy (بنعالجها بـ glucocorticoids)

          ولأنه IgG بيعدّي الـ placenta، ممكن يعمل **hyperthyroidism مؤقت في المولود**. بيظهر مع الـ stress (زي الحمل)، و HLA-DR3 و HLA-B8. Histology: خلايا طويلة متزاحمة و **scalloped colloid**.
        page: 346
        quote: "stimulates TSH receptors on thyroid (hyperthyroidism, diffuse goiter), dermal fibroblasts (pretibial myxedema), and orbital fibroblasts (Graves orbitopathy; treat with glucocorticoids)."
      - kind: order
        prompt: "رتّب إزاي العين بتطلع لبرّه في Graves"
        steps:
          - "T cells تتنشّط"
          - "Lymphocytes تدخل ورا العين (retroorbital)"
          - "Cytokines تعلى (TNF-α و IFN-γ)"
          - "الـ fibroblasts تطلّع hydrophilic GAGs"
          - "العضلات تنتفخ وتلتهب والدهن يزيد"
          - "Exophthalmos"
        why: "الـ GAGs بتشد ماية (زي الـ myxedema)، فالعضلات والدهن ورا العين يكبروا ويزقّوا العين لقدام."
        page: 346
        quote: "Activation of T-cells → lymphocytic infiltration of retroorbital space → ↑ cytokines (eg, TNF-α, IFN-γ) → ↑ fibroblast secretion of hydrophilic GAGs → ↑ osmotic muscle swelling, muscle inflammation, and adipocyte count → exophthalmos A ."
      - kind: explain
        title: "Toxic multinodular goiter والأسباب التانية"
        text: |-
          - **Toxic multinodular goiter**: حتت من الـ follicles شغالة ==لوحدها من غير TSH== (TSH receptor mutation في 60%). الـ hot nodules نادراً ما تبقى خبيثة.
          - **Exogenous thyrotoxicosis**: حد بياخد thyroid hormone عشان يخس.
          - **Struma ovarii**: thyroid tissue في المبيض.
          - **Jod-Basedow**: thyroiditis بعد الـ contrast (iodine).
          - **أدوية**: amiodarone و lithium.
        page: 346
        quote: "Focal patches of hyperfunctioning follicular cells distended with colloid working independently of TSH (due to TSH receptor mutations in 60% of cases)."
      - kind: explain
        title: "Thyroid storm"
        text: |-
          hyperthyroidism مش متعالج كويس + **stress حاد** (infection أو trauma أو surgery) = **thyroid storm**: agitation و delirium و fever و diarrhea و coma، و ==tachyarrhythmia== (سبب الوفاة). ممكن الـ LFTs تعلى.

          العلاج بالـ **4 P's**:
          - **P**ropranolol (β-blocker)
          - **P**TU
          - **P**rednisolone (glucocorticoids)
          - **P**otassium iodide (Lugol): الـ iodide الكتير بيوقف الـ T4 بالـ ==Wolff-Chaikoff==.
        page: 346
        quote: "Treat with the 4 P’s: β-blockers (eg, propranolol), propylthiouracil, glucocorticoids (eg, prednisolone), potassium iodide (Lugol iodine). Iodide load → ↓ T4 synthesis → Wolff-Chaikoff effect."
      - kind: reveal
        prompt: "3 من الـ 4 P's بيشتركوا في حاجة واحدة اتعلمناها في الـ physiology. إيه هي؟"
        answer: "الـ propranolol والـ PTU والـ prednisolone ==كلهم بيوقفوا الـ 5′-deiodinase==، فالـ T4 ما يتحولش لـ T3 الشغّال (زي ما اتعلمنا في الـ physiology، ص 335؛ هنا ص 346 فيها الـ 4 P's بس). والـ PTU كمان بيوقف الـ TPO، والـ iodide بيوقف الإنتاج بالـ Wolff-Chaikoff."
        page: 346
        quote: "Treat with the 4 P’s: β-blockers (eg, propranolol), propylthiouracil, glucocorticoids (eg, prednisolone), potassium iodide (Lugol iodine)."
      - kind: table
        title: "Goiter: ناعم ولا عُقد؟"
        columns: ["Type", "Causes"]
        rows:
          - ["Smooth/diffuse", "Graves, Hashimoto, iodine deficiency, TSH-secreting pituitary adenoma"]
          - ["Nodular", "Toxic multinodular goiter, thyroid adenoma, thyroid cancer, thyroid cyst"]
        hide: [[0, 1], [1, 1]]
        page: 346
        quote: "Smooth/diffuse: Graves disease, Hashimoto thyroiditis, iodine deficiency, TSH-secreting pituitary adenoma. Nodular: toxic multinodular goiter, thyroid adenoma, thyroid cancer, thyroid cyst."
      - kind: explain
        title: "Adenoma: العقدة الحميدة"
        text: |-
          **Thyroid adenoma**: عقدة واحدة حميدة. أغلبها ==cold== في الـ scan (مش شغالة)، ونادراً hot.

          أغلبها **follicular**، والفرق بينه وبين الـ follicular carcinoma: ==ما فيش capsular أو vascular invasion==. والـ FNA (cytology) لوحدها مش بتقدر تفرّق؛ لازم الـ capsule كلها تتشاف.
        page: 346
        quote: "Most common histology is follicular (arrows in A ); absence of capsular or vascular invasion (unlike follicular carcinoma)."
      - kind: table
        title: "سرطانات الـ thyroid"
        columns: ["Type", "Clue", "Genes", "Course"]
        rows:
          - ["Papillary (most common)", "Orphan Annie nuclei, psammoma bodies, nuclear grooves", "RET/PTC, BRAF; childhood irradiation", "Lymph nodes; good prognosis"]
          - ["Follicular", "Invades capsule and vessels; uniform follicles", "RAS, PAX8-PPAR-γ", "Hematogenous spread; good prognosis"]
          - ["Medullary", "C cells, calcitonin, amyloid (Congo red)", "RET (MEN 2A, 2B)", "—"]
          - ["Anaplastic", "Pleomorphic, many mitoses; older patients", "From dedifferentiated papillary/follicular", "Rapid compressive mass; very poor"]
        hide: [[0, 1], [1, 2], [2, 1], [3, 3]]
        page: 347
        quote: "Empty-appearing nuclei with central clearing (“Orphan Annie” eyes) A , psamMoma bodies, nuclear grooves (Papi and Moma adopted Orphan Annie)."
      - kind: aside
        tone: tip
        text: "الكتاب: ==Papi and Moma adopted Orphan Annie== (Papillary، psamMoma، Orphan Annie nuclei). و الـ medullary (MEN2llary) مع MEN 2."
        page: 347
        quote: "From parafollicular “C cells”; produces calcitonin, sheets of polygonal cells in an amyloid stroma C (stains with Congo red). Associated with MEN 2A and 2B (RET mutations; MEN2llary carcinoma)."
      - kind: explain
        title: "مضاعفات العملية"
        text: |-
          - **Hypocalcemia**: لو الـ parathyroids اتشالت.
          - **Recurrent laryngeal nerve**: بيتقطع وهو بيربط الـ ==inferior thyroid artery== ← dysphagia و ==hoarseness==.
          - **External branch of the superior laryngeal nerve**: بيتأذي وهو بيربط الـ superior thyroid pedicle ← المريض يفقد الـ tenor (المغنيين بيلاحظوا).
        page: 347
        quote: "injury to the external branch of the superior laryngeal nerve during ligation of superior thyroid vascular pedicle (may lead to loss of tenor usually noticeable in professional voice users)."
      - kind: check
        question: "Thyroid nodule FNA: sheets of polygonal cells in amyloid stroma; calcitonin is high. Gene?"
        options:
          - "RET"
          - "BRAF"
          - "RAS"
          - "PAX8-PPAR-γ"
        answer: 0
        why:
          - "صح: ده medullary من الـ C cells، مع RET و MEN 2."
          - "الـ BRAF للـ papillary."
          - "الـ RAS للـ follicular."
          - "الـ PAX8-PPAR-γ للـ follicular."
        page: 347
        quote: "Associated with MEN 2A and 2B (RET mutations; MEN2llary carcinoma)."
      - kind: figure
        title: "الـ TSI بيضرب 3 أماكن"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="en4tsi" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="110" y="8" width="140" height="36" rx="8"/>
