      - kind: explain
        title: "Q fever و Mycoplasma"
        text: |-
          **Q fever** (Coxiella): ==مالوش vector== ومالوش rash؛ بتتنفسه من الـ amniotic fluid بتاع البقر والغنم. headache و cough و pneumonia وممكن hepatitis، وسبب مشهور للـ ==culture ⊝ endocarditis==. بيعيش بره في شكل endospore (Quite Complicated).

          **Mycoplasma pneumoniae**: walking pneumonia في الأقل من 30 سنة (عساكر، سجون، جامعات). الـ CXR ==أوحش من المريض==. مالوش cell wall فالـ penicillin ما بيشتغلش، والـ membrane فيها sterols. وعنده **cold agglutinins** (IgM). العلاج macrolides أو doxycycline أو fluoroquinolone.
        page: 148
        quote: "CXR appears more severe than patient presentation. High titer of cold agglutinins (IgM), which can agglutinate RBCs."
