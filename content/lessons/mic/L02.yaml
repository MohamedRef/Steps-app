  - id: mic.L02.lesson7
    title: "الـ spirochetes: Lyme و Leptospira و Syphilis"
    hook: "3 بكتيريا ملفوفة، كل واحدة ليها حشرة أو مية أو علاقة"
    minutes: 10
    pages: [144, 146]
    topics: [spirochetes, lyme-disease, leptospira-interrogans, syphilis, diagnosing-syphilis]
    status: unverified
    steps:
      - kind: explain
        title: "مين يتشاف وإزاي"
        text: |-
          الـ spirochetes: **Leptospira و Treponema و Borrelia** (Little Twirling Bacteria). حلزونية وعندها axial filaments.

          - ==Borrelia بس== كبيرة كفاية تتشاف بالـ Wright أو Giemsa.
          - الـ Treponema محتاجة **dark-field** أو DFA microscopy.
        page: 144
        quote: "Only Borrelia can be visualized using aniline dyes (Wright or Giemsa stain) in light microscopy due to size. Treponema is visualized by dark-field microscopy or direct fluorescent antibody (DFA) microscopy."
      - kind: aside
        tone: trap
        text: "مريض اتعالج من syphilis وبعد ساعات جاله fever و chills و myalgia؟ ده مش allergy: ده ==Jarisch-Herxheimer reaction==، الجسم بيرد على الـ antigens اللي اتفرجت فجأة لما البكتيريا ماتت."
        page: 144
        quote: "Jarisch-Herxheimer reaction—flulike symptoms (fever, chills, headache, myalgia) after antibiotics are started due to host response to sudden release of bacterial antigens."
      - kind: explain
        title: "Lyme: القرادة والفار والغزال"
        text: |-
          **Borrelia burgdorferi**، بتنقلها ==Ixodes deer tick== (نفس القرادة بتنقل Anaplasma و Babesia). الـ reservoir هو **الفار**؛ الغزال مهم لحياة القرادة بس مش شايل البكتيريا. منتشر في الـ northeastern US.

          - **Stage 1**: erythema migrans (bulls-eye) و flulike.
          - **Stage 2**: lesions تانية، carditis و ==AV block==، facial (Bell) palsy، arthritis متنقل.
          - **Stage 3**: encephalopathy، chronic arthritis، peripheral neuropathy.
        page: 144
        quote: "Stage 1—early localized: erythema migrans (typical “bulls-eye” configuration B is pathognomonic but not always present), flulike symptoms."
      - kind: mnemonic
        word: "FACE"
        parts:
          - { key: "F", text: "Facial nerve palsy (typically bilateral)" }
          - { key: "A", text: "Arthritis" }
          - { key: "C", text: "Cardiac block" }
          - { key: "E", text: "Erythema migrans" }
        hook: "A Key Lyme pie to the FACE (الكتاب)"
        page: 144
        quote: "A Key Lyme pie to the FACE: Facial nerve palsy (typically bilateral) Arthritis Cardiac block Erythema migrans"
      - kind: check
        question: "A pregnant woman has erythema migrans. Which drug?"
        options:
          - "Amoxicillin"
          - "Doxycycline"
          - "Ciprofloxacin"
          - "Penicillin G benzathine"
        answer: 0
        why:
          - "صح: في الحمل والأطفال تحت 8 سنين: amoxicillin."
          - "الـ doxycycline الأول عادةً، بس مش في الحمل."
          - "مش علاج Lyme في الكتاب."
          - "ده علاج الـ syphilis."
        page: 144
        quote: "Treatment: doxycycline (1st line); amoxicillin (pregnant patients, children <8 years old); ceftriaxone if IV therapy required"
      - kind: update
        text: "الـ guidelines الأحدث بتسمح بكورس doxycycline قصير للـ erythema migrans في أي سن، حتى الأطفال تحت 8 سنين. بس في الامتحان جاوب زي الكتاب: amoxicillin للطفل تحت 8 وللحامل."
        ref: "IDSA, American Academy of Neurology and ACR Lyme disease guideline, 2020; American Academy of Pediatrics Red Book, 2021"
      - kind: explain
        title: "Leptospira: الميه وبول الحيوانات"
        text: |-
          spirochete بأطراف زي ==الشنكل==، في الميه الملوّثة ببول الحيوانات. منتشر في الـ surfers والمناطق الاستوائية (Hawaii).

          **Leptospirosis**: flulike، ألم في ==السمانة== بالذات، jaundice، photophobia مع **conjunctival suffusion** (عين حمرا من غير صديد).

          **Weil disease** (الشكل الشديد): jaundice و azotemia (كبد وكلى)، fever، نزيف، و anemia.
        page: 145
        quote: "Leptospirosis—flulike symptoms, myalgias (classically of calves), jaundice, photophobia with conjunctival suffusion (erythema without exudate)."
      - kind: figure
        title: "مراحل الـ syphilis"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL02s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
