        why: "القراد: Lyme و Anaplasma (Ixodes)، RMSF (Dermacentor)، Ehrlichia (Amblyomma). القمل: R prowazekii و B recurrentis. البراغيث: R typhi و Y pestis."
        page: 147
        quote: "Rickettsia prowazekii Epidemic typhus Human to human via human body louse Rickettsia rickettsii Rocky Mountain spotted fever Dermacentor (dog tick) Rickettsia typhi Endemic typhus Fleas"
      - kind: explain
        title: "الـ rickettsial: الـ rash بيبدأ منين؟"
        text: |-
          كلهم علاجهم ==doxycycline==.

          - **RMSF** (R rickettsii، قرادة؛ غالباً في الـ South Atlantic زي North Carolina): الـ rash ==بيبدأ من الرسغ والكاحل== ويطلع للجذع والكفوف. Triad: headache و fever و rash (vasculitis).
          - **Typhus** (R typhi بالبراغيث، R prowazekii بالقمل): الـ rash ==بيبدأ من الجذع== ويطلع لبره، ومش بيوصل للكفوف.

          الكتاب: Rickettsii on the wrists، typhus on the trunk.
        page: 148
        quote: "Rickettsii on the wrists, typhus on the trunk."
      - kind: aside
        tone: tip
        text: "Rash على الكفوف والرجلين: ==CARS== (you drive CARS using your palms and soles): Coxsackievirus A، Rocky Mountain spotted fever، و 2° Syphilis."
        page: 148
        quote: "Palms and soles rash is seen in Coxsackievirus A infection (hand, foot, and mouth disease), Rocky Mountain spotted fever, and 2° Syphilis (you drive CARS using your palms and soles)."
