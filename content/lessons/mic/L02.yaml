            answer: 0
            why: "الـ nontreponemal بيرجع ⊝ بعد العلاج، والـ treponemal بيفضل ⊕."
        page: 146
        quote: "Nontreponemal tests (VDRL, RPR) and direct testing revert to negative after treatment."
