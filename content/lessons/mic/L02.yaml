  - id: mic.L02.lesson5
    title: "الـ gram ⊝: Neisseria و Haemophilus والـ coccobacilli و Pseudomonas"
    hook: "الـ meningococcus في العنابر، الـ Legionella في التكييف، والـ Pseudomonas في الميه"
    minutes: 10
    pages: [139, 141]
    topics: [gram-negative-lab-algorithm, neisseria, haemophilus-influenzae, burkholderia-cepacia, bordetella-pertussis, brucella, legionella-pneumophila, pseudomonas-aeruginosa]
    status: unverified
    steps:
      - kind: explain
        title: "شجرة الـ gram ⊝ في دقيقة"
        text: |-
          - **diplococci**: N meningitidis، N gonorrhoeae، Moraxella.
          - **curved rods**: Campylobacter (==42°C==)، H pylori (==urease==)، V cholerae (==alkaline media==).
          - **coccobacilli**: H influenzae، Pasteurella، Brucella، B pertussis، Francisella، Acinetobacter.
          - **bacilli**: نبدأ بالـ **lactose**. fast fermenters: Klebsiella، E coli، Enterobacter. slow: Citrobacter، Serratia. non-fermenters: oxidase ⊕ = Pseudomonas؛ oxidase ⊝ والـ H2S ⊕ = Proteus و Salmonella، H2S ⊝ = Shigella و Yersinia.
        page: 139
        quote: "Grows in 42°C Produces urease Grows in alkaline media Campylobacter jejuni Helicobacter pylori Vibrio cholerae"
      - kind: explain
        title: "Neisseria: أخين مختلفين"
        text: |-
          الاتنين gram ⊝ diplococci، بيعملوا IgA protease، وعندهم **LOS** بـ endotoxin قوي.

          - **Meningococcus**: عنده ==capsule==، بيخمّر maltose و glucose، فيه vaccine، بينتقل بالرذاذ في الأماكن الزحمة (عنابر، dorms). بيعمل meningococcemia (petechiae)، meningitis، و **Waterhouse-Friderichsen** (نزيف في الـ adrenal).
          - **Gonococcus**: من غير capsule، glucose بس، ==مافيش vaccine== بسبب antigenic variation في الـ pili. بيعمل gonorrhea، septic arthritis، PID، Fitz-Hugh–Curtis، و neonatal conjunctivitis.
        page: 140
        quote: "No polysaccharide capsule Polysaccharide capsule No maltose acid detection Maltose acid detection No vaccine due to antigenic variation of pilus proteins"
      - kind: aside
        tone: analogy
        text: "**M**eningococcus بيخمّر **M**altose: الحرفين زي بعض. والـ gonococcus اسمه **G**، بيخمّر **G**lucose بس."
        page: 140
        quote: "Acid production: meningococci—maltose and glucose; gonococci—glucose."
      - kind: table
        title: "الوقاية والعلاج"
        columns: ["", "Gonococci", "Meningococci"]
        rows:
          - ["Prevent", "Condoms; erythromycin eye ointment for neonates", "Rifampin, ciprofloxacin or ceftriaxone for close contacts"]
          - ["Treat", "Single IM ceftriaxone (+ doxycycline if chlamydia not excluded)", "Ceftriaxone or penicillin G"]
        hide: [[0, 2], [1, 1]]
        page: 140
        quote: "Treatment: single dose IM ceftriaxone; if chlamydial coinfection not excluded by molecular testing, add doxycycline Treatment: ceftriaxone or penicillin G"
      - kind: explain
        title: "H influenzae"
        text: |-
          coccobacillus صغير، بالرذاذ. بعد الـ type b vaccine، ==الـ nontypeable (من غير capsule)== بقى أشهر سبب للـ otitis media والـ conjunctivitis والـ bronchitis، وكمان للـ invasive.

          بيعمل **epiglottitis** (cherry red، و ==thumb sign== على الـ lateral neck x-ray)، meningitis، otitis media، pneumonia. ومش بيعمل الإنفلونزا.

          الـ vaccine: PRP (type b capsule) مربوط في diphtheria toxoid، من 2 لـ 18 شهر. العلاج: amoxicillin ± clavulanate للـ mucosal، ceftriaxone للـ meningitis، rifampin للمخالطين.
        page: 140
        quote: "Haemophilus causes epiglottitis (endoscopic appearance can be “cherry red” in children; “thumb sign” on lateral neck x-ray A ), meningitis, otitis media, and pneumonia."
      - kind: check
        question: "A 20-year-old student dies of meningococcemia. What should her roommate get?"
        options:
          - "Rifampin, ciprofloxacin or ceftriaxone"
          - "Penicillin G for 10 days"
          - "Nothing, since there is no person-to-person spread"
          - "Erythromycin"
        answer: 0
        why:
          - "صح: المخالطين القريبين ياخدوا rifampin أو ciprofloxacin أو ceftriaxone."
          - "Penicillin G علاج مش prophylaxis."
          - "الـ meningococcus بينتقل بالرذاذ؛ اللي مالوش person-to-person هو Legionella."
          - "الـ erythromycin للـ pertussis أو eye ointment للمواليد."
        page: 140
        quote: "Rifampin, ciprofloxacin, or ceftriaxone prophylaxis in close contacts"
      - kind: explain
        title: "Pertussis و Brucella و Burkholderia"
        text: |-
          **B pertussis**: pertussis toxin (بيطفي Gi)، adenylate cyclase toxin، و tracheal cytotoxin (بيكسّر الـ cilia). 3 مراحل: catarrhal ← paroxysmal (whoop و vomiting) ← convalescent. ==Lymphocytosis== (غريبة على بكتيريا). العلاج macrolides، أو TMP-SMX.

          **Brucella**: من اللبن مش مبستر. بتعيش في الـ macrophages وتعمل noncaseating granulomas. ==undulant fever== و night sweats و arthralgia. doxycycline + rifampin أو streptomycin.

          **Burkholderia cepacia**: pneumonia في الـ cystic fibrosis، multidrug resistant، وبتعتبر relative contraindication للـ lung transplant.
        page: 141
        quote: "Produces lymphocytosis (unlike most acute bacterial infections)."
      - kind: explain
        title: "Legionella"
        text: |-
          gram ⊝ rod ما بياخدش Gram كويس (==silver stain==)، بيتزرع على charcoal yeast extract بـ iron و cysteine، وبنكشفه بـ **urinary antigen**.

          بينتقل بالـ aerosol من الميه (التكييف، سخانات)؛ outbreaks في الـ cruise ships والـ nursing homes، و ==مافيش person-to-person==.

          - **Legionnaires' disease**: pneumonia شديدة (lobar)، fever، أعراض GI و CNS، و ==hyponatremia== و ↑ transaminases.
          - **Pontiac fever**: flulike خفيف.

          العلاج: macrolide أو quinolone.
        page: 141
