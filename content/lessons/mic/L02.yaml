      - kind: explain
        title: "Pseudomonas: فين وإزاي نعالجه"
        text: |-
          aerobic، oxidase ⊕، non-lactose fermenter، ريحته زي ==العنب==، وعايش في الميه.

          اسمه نفسه هو اللستة: **PSEUDOMONAS**: Pneumonia، Sepsis، Ecthyma gangrenosum، UTIs، Diabetes (otitis externa الخبيثة)، Osteomyelitis، Mucoid capsule (cystic fibrosis)، Otitis externa، Nosocomial، Addiction، Skin (hot tub، حروق).

          العلاج: piperacillin-tazobactam، ceftazidime أو cefepime، monobactams، fluoroquinolones، carbapenems. و ==ما نديش aminoglycoside لوحده== لأنه بيشتغل وحش في الـ acidic environment.
        page: 141
        quote: "Despite antipseudomonal activity, aminoglycoside monotherapy is avoided due to poor performance in acidic environments."
