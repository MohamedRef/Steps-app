  - id: mic.L02.lesson8
    title: "Chlamydia و Gardnerella والحيوانات والقراد و Mycoplasma"
    hook: "مين جه من بغبغان، مين من قطة، ومين من قرادة: الجدول ده لوحده كذا سؤال"
