        caption: "الـ primary TB في معظم الناس بيلم نفسه ويتكلّس. لو المناعة وقعت بعدين، يحصل reactivation في القمة (cavity). ولو انتشر في الدم يبقى miliary في أي حتة."
        alt: "Primary tuberculosis forms a Ghon focus in the mid or lower lobe with hilar nodes. Over 90% heal with fibrosis and calcification and a positive PPD; under 10% progress, as in AIDS or malnutrition. Healed disease can reactivate as an apical cavity, and bacteremia gives miliary tuberculosis in the meninges, vertebrae, adrenals and other organs."
