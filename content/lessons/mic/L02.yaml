        caption: "الـ morulae كتل شبه التوت جوه الـ cytoplasm. في الـ monocytes يبقى Ehrlichiosis، في الـ granulocytes يبقى Anaplasmosis (MEGA). والاتنين من القراد ومن غير rash غالباً."
