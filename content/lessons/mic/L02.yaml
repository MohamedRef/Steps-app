    status: unverified
    steps:
      - kind: explain
        title: "Salmonella و Shigella: الشبه"
        text: |-
          الاتنين gram ⊝ rods، ==non-lactose fermenters==، oxidase ⊝، وبيدخلوا من الـ **M cells** بتاعة الـ Peyer patches.

          الفرق الكبير في الحاجات اللي بتتحرك وبتعمل غاز: الـ Salmonella عندها **flagella** (salmon swim) وبتعمل **H2S**؛ الـ Shigella لأ.
        page: 142
        quote: "Both Salmonella and Shigella are gram ⊝ rods, non-lactose fermenters, oxidase ⊝, and can invade the GI tract via M cells of Peyer patches."
      - kind: table
        title: "الفروق اللي بتيجي في الامتحان"
        columns: ["", "S typhi", "Other Salmonella", "Shigella"]
        rows:
          - ["Reservoir", "Humans only", "Humans and animals", "Humans only"]
          - ["Infectious dose", "High (acid-labile)", "High", "Low (acid stable)"]
          - ["Antibiotics", "Prolong excretion", "Prolong excretion", "Shorten excretion"]
          - ["Immune cells", "Monocytes", "PMNs if disseminated", "PMNs"]
          - ["GI", "Constipation, then diarrhea", "Diarrhea ± blood", "Tenesmus, bloody mucoid stools"]
        hide: [[1, 1], [1, 3], [2, 3], [4, 3]]
        page: 142
        quote: "INFECTIOUS DOSE (ID50) High—large inoculum required; acid-labile (inactivated by gastric acids) High Low—very small inoculum required; acid stable (resistant to gastric acids)"
      - kind: reveal
        prompt: "ليه الـ Shigella بتنتشر بسهولة في الحضانة، والـ Salmonella محتاجة أكل ملوّث كتير؟"
        answer: "الـ Shigella ==acid stable==، فعدد قليل جداً بيعدّي المعدة ويعمل مرض (low ID50) ← بتنتقل بالـ 4 F's: fingers، flies، food، feces. الـ Salmonella acid-labile فمحتاجة inoculum كبير."
        page: 142
        quote: "4 F’s: fingers, flies, food, feces"
      - kind: explain
        title: "Typhoid و الـ carrier"
        text: |-
          **S typhi** (الـ Vi capsule): fever مع ==pulse-temperature dissociation== (حرارة عالية ونبض بطيء)، rose spots (salmon-colored macules على الجذع)، ألم في البطن، وبعدين ulceration ونزيف. العلاج ceftriaxone أو fluoroquinolone. وممكن يفضل **carrier** في الـ gallbladder.

          الـ Salmonella التانية (فراخ، بيض، **turtles**): العلاج ==supportive==، والمضاد الحيوي بيطوّل الإخراج في الـ immunocompetent.
        page: 142
        quote: "Causes typhoid fever (salmon- colored truncal macular rash, abdominal pain, fever [pulse-temperature dissociation]; later GI ulceration and hemorrhage); treat with ceftriaxone or fluoroquinolone"
      - kind: explain
        title: "E coli: 4 سلالات"
        text: |-
          - **EIEC**: ==Invasive== ← dysentery زي الـ Shigella.
          - **ETEC**: heat-labile و heat-stable toxins، مافيش invasion ← Traveler's diarrhea مائي.
          - **EPEC**: مافيش toxin؛ بيلزق ويفرطح الـ villi ← إسهال في الأطفال (==P==ediatrics).
          - **EHEC (O157:H7)**: Shiga toxin ← dysentery و ==HUS==، من اللحمة الني والخضار الورقي. ما بيخمّرش **sorbitol**.

          وعوامل الـ E coli عموماً: P pili (cystitis و pyelonephritis)، K capsule (pneumonia و neonatal meningitis)، LPS (septic shock).
        page: 143
        quote: "Produces heat-labile and heat-stable enteroToxins. No inflammation or invasion. ETEC; Traveler’s diarrhea (watery)."
      - kind: figure
        title: "الـ HUS: 3 حاجات من جلطة صغيرة"
