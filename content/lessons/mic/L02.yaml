        why: "الجدول بتاع الـ zoonoses: الطيور ← psittaci، القطة بتخربش ← Bartonella وبتعض ← Pasteurella، والـ amniotic fluid ← Coxiella."
        page: 147
        quote: "Chlamydophila psittaci Psittacosis Parrots, other birds Coxiella burnetii Q fever Aerosols of cattle/sheep amniotic fluid"
