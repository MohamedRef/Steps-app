        quote: "Treatment is a SNAP: Sulfonamides—Nocardia; Actinomyces—Penicillin"
      - kind: explain
        title: "الـ Mycobacteria وأسلحة الـ TB"
        text: |-
          acid-fast rods بطيئة في الـ culture:
          - **M tuberculosis**: TB، غالباً multidrug resistant.
          - **M avium–intracellulare**: disseminated في الـ AIDS.
          - **M scrofulaceum**: cervical lymphadenitis في الأطفال.
          - **M marinum**: جلد بتوع الـ aquarium.

          أسلحة الـ TB: ==cord factor== (serpentine cord، بيشغّل الـ macrophages ← granuloma، وبيطلّع TNF-α)، و **sulfatides** (بتمنع الـ phagolysosomal fusion).
        page: 138
        quote: "Cord factor creates a “serpentine cord” appearance in virulent M tuberculosis strains; activates macrophages (promoting granuloma formation) and induces release of TNF-α. Sulfatides (surface glycolipids) inhibit phagolysosomal fusion."
      - kind: figure
        title: "طريق الـ TB"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
