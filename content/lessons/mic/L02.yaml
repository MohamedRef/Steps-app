    steps:
      - kind: explain
        title: "Chlamydia: بتعيش على حساب الخلية"
        text: |-
          ==ما تقدرش تعمل ATP==، فهي obligate intracellular. ليها شكلين:

          - **elementary body**: صغير وتقيل، هو اللي ==enfectious== وبيدخل الخلية بالـ endocytosis.
          - **reticulate body**: بيتكاثر جوه الخلية بالـ fission، وبعدين يرجع elementary bodies.

          وحيطتها ناقصها peptidoglycan (muramic acid قليل) ← ==β-lactams ما بتشتغلش==.
        page: 146
        quote: "Chlamydial cell wall lacks classic peptidoglycan (due to reduced muramic acid), rendering β-lactam antibiotics ineffective."
      - kind: table
        title: "الـ serotypes"
        columns: ["Serotypes", "Disease", "Hook"]
        rows:
          - ["A, B, C", "Chronic follicular conjunctivitis → blindness", "Africa, Blindness, Chronic"]
          - ["D–K", "Urethritis/PID, neonatal pneumonia (staccato cough, eosinophilia), neonatal conjunctivitis (1-2 weeks)", "Everything else"]
          - ["L1–L3", "Lymphogranuloma venereum: painless ulcer → painful buboes", ""]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 146
        quote: "Types L1, L2, and L3 Lymphogranuloma venereum—small, painless ulcers on genitals → swollen, painful inguinal lymph nodes that ulcerate (buboes). Treat with doxycycline."
      - kind: aside
        tone: exam
        text: "conjunctivitis في مولود: لو في ==2-5 أيام== فكّر gonococcus، لو في ==1-2 أسبوع== فكّر Chlamydia D–K."
        page: 146
        quote: "Types D–K Urethritis/PID, neonatal pneumonia (staccato cough) with eosinophilia, neonatal conjunctivitis (1-2 weeks after birth)."
      - kind: check
        question: "A woman with chlamydial cervicitis is 20 weeks pregnant. Treatment?"
        options:
          - "Azithromycin"
          - "Doxycycline"
          - "Amoxicillin-clavulanate"
          - "Ceftriaxone alone"
        answer: 0
        why:
          - "صح: الـ azithromycin للحوامل."
          - "الـ doxycycline العلاج العادي بس مش في الحمل."
          - "الـ β-lactams ما بتشتغلش على Chlamydia."
          - "الـ ceftriaxone بيتضاف بس لو gonorrhea ⊕."
        page: 146
        quote: "Treatment: doxycycline, azithromycin (for pregnant patients)."
      - kind: explain
        title: "Bacterial vaginosis"
        text: |-
          **Gardnerella vaginalis** (pleomorphic، gram-variable). إفرازات رمادي بريحة ==سمك==، ومن غير ألم. مرتبطة بالـ sexual activity بس ==مش STI==. السبب إن الـ lactobacilli قلّت فالـ anaerobes كترت.

          - **clue cells**: خلايا الـ vagina مغطية بالـ Gardnerella.
          - **whiff test**: الإفراز + 10% KOH ← الريحة تزيد.
          - **pH >4.5**.

          العلاج: metronidazole أو clindamycin.
        page: 147
        quote: "Amine whiff test—mixing discharge with 10% KOH enhances fishy odor. Vaginal pH >4.5 during infection. Treatment: metronidazole or clindamycin."
      - kind: match
        prompt: "وصّل كل حيوان أو حشرة بالمرض"
