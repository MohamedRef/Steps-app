schema: steps.lesson/v1
lecture: mic.L02
lessons:
  - id: mic.L02.lesson1
    title: "الـ gram ⊕ cocci: شجرة القرارات والـ Staph"
    hook: "3 أسئلة بس (catalase، coagulase، hemolysis) بيعرّفوك أي coccus في المعمل"
    minutes: 9
    pages: [132, 133]
    topics: [gram-positive-lab-algorithm, hemolytic-bacteria, staphylococcus-aureus, staphylococcus-epidermidis, staphylococcus-saprophyticus]
    goals:
      - "تمشي في الـ algorithm من الـ Gram لحد اسم الميكروب"
      - "تعرف أمراض الـ S aureus الالتهابية والـ toxin-mediated"
      - "تفرّق الـ S epidermidis من الـ S saprophyticus"
    status: unverified
    steps:
      - kind: explain
        title: "أول سؤال: cocci ولا bacilli؟"
        text: |-
          الـ gram ⊕ cocci بيتقسموا بالـ **catalase**:

          - catalase ⊕ وعناقيد (clusters) ← ==Staphylococcus==. بعدين **coagulase**: ⊕ يبقى S aureus، ⊝ يبقى S epidermidis أو S saprophyticus (ونفرّقهم بالـ novobiocin).
          - catalase ⊝ وأزواج أو سلاسل ← ==Streptococcus==، ونقسمهم بالـ hemolysis.
        page: 132
        quote: "Hemolysis Coagulase Catalase"
      - kind: figure
        title: "شجرة الـ gram ⊕ cocci"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL02a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="130" y="5" width="100" height="26" rx="6" fill="none"/>
            <text x="142" y="23" class="t-sm t-b">Gram ⊕ cocci</text>
            <line class="fg-arrow" x1="160" y1="31" x2="80" y2="55" marker-end="url(#micL02a)"/>
            <line class="fg-arrow" x1="200" y1="31" x2="270" y2="55" marker-end="url(#micL02a)"/>
            <text x="70" y="45" class="t-sm t-mut">catalase ⊕</text>
            <text x="235" y="45" class="t-sm t-mut">catalase ⊝</text>
            <rect class="fg-acc" x="20" y="58" width="120" height="26" rx="6"/>
            <text x="30" y="76" class="t-sm">Staphylococcus</text>
            <rect class="fg-good" x="215" y="58" width="130" height="26" rx="6"/>
            <text x="225" y="76" class="t-sm">Streptococcus</text>
            <text x="10" y="105" class="t-sm">coagulase ⊕ → S aureus</text>
            <text x="10" y="123" class="t-sm">coagulase ⊝, novobiocin S →</text>
            <text x="20" y="139" class="t-sm">S epidermidis</text>
            <text x="10" y="157" class="t-sm">novobiocin R → S saprophyticus</text>
            <text x="190" y="105" class="t-sm">α: optochin → pneumo/viridans</text>
            <text x="200" y="125" class="t-sm">β: bacitracin → group A/B</text>
            <text x="200" y="145" class="t-sm">γ: 6.5% NaCl →</text>
            <text x="210" y="161" class="t-sm">Enterococcus / gallolyticus</text>
          </svg>
        caption: "الـ catalase بيفصل الـ Staph عن الـ Strep. الـ Staph بنكمّل بالـ coagulase والـ novobiocin، والـ Strep بالـ hemolysis وبعدين optochin أو bacitracin أو الملح."
        alt: "Decision tree. Gram-positive cocci split by catalase: positive is Staphylococcus, split by coagulase (positive S aureus) then novobiocin (sensitive S epidermidis, resistant S saprophyticus). Negative is Streptococcus, split by hemolysis: alpha by optochin, beta by bacitracin, gamma by growth in 6.5% NaCl."
        page: 132
        quote: "Optochin sensitiVity and bile solubility Bacitracin sensitiVity and PYR status GroWth in 6.5% NaCl and PYR Status NoVobiocin sensitiVity"
      - kind: explain
        title: "الـ hemolysis على الـ blood agar"
        text: |-
          - **α**: hemoglobin بيتأكسد جزئياً ← لون أخضر أو بني ==من غير ما يبقى شفاف==. S pneumoniae و viridans.
          - **β**: الـ RBCs بتتكسر خالص ← ==هالة شفافة==. S aureus، S pyogenes (A)، S agalactiae (B)، و **Listeria** (الـ bacillus الوحيد في اللستة).
          - **γ**: مافيش hemolysis.
        page: 133
        quote: "Include Staphylococcus aureus, Streptococcus pyogenes (group A strep), Streptococcus agalactiae (group B strep), Listeria monocytogenes."
      - kind: check
        question: "A β-hemolytic gram-positive organism is catalase negative. Which test comes next?"
        options:
          - "Bacitracin sensitivity"
          - "Optochin sensitivity"
          - "Coagulase"
          - "Novobiocin sensitivity"
        answer: 0
        why:
          - "صح: الـ β-hemolytic strep بنفصلهم بالـ bacitracin (A حساس، B مقاوم)."
          - "الـ optochin للـ α-hemolytic."
          - "الـ coagulase للـ Staph (catalase ⊕)."
          - "الـ novobiocin للـ coagulase ⊝ Staph."
        page: 132
        quote: "Bacitracin sensitiVity and PYR status"
      - kind: explain
        title: "S aureus: نوعين أمراض"
        text: |-
          **Inflammatory**: skin infections، abscesses، pneumonia (غالباً ==بعد الإنفلونزا==)، endocarditis، septic arthritis، osteomyelitis.

          **Toxin-mediated**:
          - TSST-1 ← toxic shock syndrome.
          - exfoliative toxin ← scalded skin syndrome.
          - enterotoxins ← food poisoning سريع.

          وسلاحه الخاص: **coagulase** بيلف حوالين نفسه fibrin clot ← ==abscess==. و **Protein A** بيمسك الـ Fc بتاع الـ IgG.
        page: 133
        quote: "Toxin-mediated disease—toxic shock syndrome (TSST-1), scalded skin syndrome (exfoliative toxin), rapid-onset food poisoning (enterotoxins)."
      - kind: explain
        title: "TSS و MRSA"
        text: |-
          **Toxic shock syndrome**: fever، vomiting، diarrhea، rash، desquamation، shock، و end-organ failure (↑ AST و ALT و bilirubin). مرتبط بالـ ==tampons أو nasal packing== لفترة طويلة. الـ TSST-1 superantigen بيربط MHC II بالـ TCR ← polyclonal T-cell activation.

          **MRSA**: الـ PBPs اتغيّرت بسبب جين ==mecA==. وبعض السلالات بتطلّع **PVL** اللي بيقتل الـ leukocytes ويعمل necrosis.
        page: 133
        quote: "Resistance due to altered penicillin- binding proteins (conferred by mecA gene)."
      - kind: reveal
        prompt: "أكل S aureus food poisoning: ليه الأعراض بتبدأ بعد 2-6 ساعات بس، وليه تسخين الأكل ما بيحميش؟"
        answer: "لأن الـ toxin ==جاهز في الأكل== (preformed)، مش محتاج البكتيريا تكبر جوه الجسم. والـ enterotoxin **heat stable**، فالطبخ ما بيبوظوش. والنتيجة: vomiting وإسهال من غير دم."
        page: 133
        quote: "S aureus food poisoning due to ingestion of preformed toxin → short incubation period (2-6 hr) followed by nonbloody diarrhea and emesis. Enterotoxin is heat stable → not destroyed by cooking."
      - kind: table
        title: "الـ coagulase ⊝ Staph"
        columns: ["", "S epidermidis", "S saprophyticus"]
        rows:
          - ["Novobiocin", "Sensitive", "Resistant"]
          - ["Lives on", "Skin", "Female genital tract, perineum"]
          - ["Causes", "Prosthetic device and IV catheter infections (biofilm)", "Uncomplicated UTI in young females (2nd after E coli)"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
        page: 133
        quote: "Gram ⊕, catalase ⊕, coagulase ⊝, urease ⊕ cocci in clusters. Novobiocin resistant. Normal microbiota of female genital tract and perineum."
      - kind: aside
        tone: tip
        text: "عشان تفتكر: ==saprophyticus is resistant== (S و R جنب بعض في الأبجدية تقريباً)، والـ epidermidis حساس. والـ S epidermidis بيلوّث الـ blood cultures، فلازم تفكّر: هل هو contaminant ولا عنده valve صناعي؟"
        page: 133
        quote: "Normal microbiota of skin; contaminates blood cultures."
      - kind: check
        question: "A woman 4 months after a prosthetic hip has a painful joint. Culture: catalase ⊕, coagulase ⊝, novobiocin sensitive cocci. How does the organism cause this?"
        options:
          - "An adherent biofilm on the prosthesis"
          - "TSST-1 superantigen"
          - "Urease-induced struvite"
          - "Protein A binding IgG"
        answer: 0
        why:
          - "صح: الـ S epidermidis بيعمل biofilm على الأجهزة الصناعية."
          - "الـ TSST-1 بتاع S aureus."
          - "الـ struvite في الكلى، مش في المفصل."
          - "الـ Protein A بتاع S aureus (coagulase ⊕)."
        page: 133
        quote: "Infects prosthetic devices (eg, hip implant, heart valve) and IV catheters by producing adherent biofilms."
      - kind: try
        items: [mic.L02.001, mic.L02.005, mic.L02.009, mic.L02.010, mic.L02.016]
    recap:
      - "Catalase ⊕ = Staph؛ coagulase ⊕ = S aureus؛ novobiocin R = saprophyticus."
      - "β-hemolytic: S aureus و group A و group B و Listeria."
      - "S aureus: abscess بالـ coagulase، TSS بالـ TSST-1، food poisoning سريع وheat stable، MRSA بالـ mecA."
    practice: [mic.L02.001, mic.L02.002, mic.L02.003, mic.L02.004, mic.L02.005, mic.L02.006, mic.L02.007, mic.L02.008, mic.L02.009, mic.L02.010, mic.L02.011, mic.L02.012, mic.L02.013, mic.L02.014, mic.L02.015, mic.L02.016, mic.L02.017, mic.L02.018, mic.L02.019]
  - id: mic.L02.lesson2
    title: "الـ Streptococci والـ Enterococci: كل واحد ومكانه"
    hook: "الـ pneumococcus في الرئة، الـ viridans في البق، الـ group B في البيبي، والـ gallolyticus بيقولك افحص القولون"
    minutes: 10
    pages: [134, 135]
    topics: [streptococcus-pneumoniae, viridans-streptococci, streptococcus-pyogenes, streptococcus-agalactiae, streptococcus-gallolyticus, enterococci]
    status: unverified
    steps:
      - kind: explain
        title: "الـ α-hemolytic: pneumococcus ولا viridans؟"
        text: |-
          الاتنين أخضر على الـ blood agar. الفرق في ==optochin والـ bile==:

          - **S pneumoniae**: optochin sensitive و bile soluble. lancet-shaped diplococci، encapsulated، وعنده IgA protease. ==No virulence without capsule==.
          - **viridans**: optochin resistant و bile insoluble. عايشين في الـ oropharynx. الكتاب: مش خايفين من الـ "chin" (op-to-chin)، فقاعدين في البق.
        page: 134
        quote: "Gram ⊕, α-hemolytic cocci. Optochin resistant and bile insoluble. Normal microbiota of the oropharynx."
      - kind: mnemonic
        word: "MOPS"
        parts:
          - { key: "M", text: "Meningitis" }
          - { key: "O", text: "Otitis media (in children)" }
          - { key: "P", text: "Pneumonia (rusty sputum)" }
          - { key: "S", text: "Sinusitis" }
        hook: "الـ pneumococcus أشهر سبب للـ MOPS (الكتاب)"
        page: 134
        quote: "Most commonly causes MOPS: ▘ Meningitis ▘ Otitis media (in children) ▘ Pneumonia ▘ Sinusitis"
      - kind: explain
        title: "الـ viridans: سنان وصمامات"
        text: |-
          - **S mutans و S mitis** ← ==dental caries==.
          - **S sanguinis** بيعمل **dextrans** بتلزق في الـ fibrin-platelet aggregates اللي على صمام متعوّر ← ==infective endocarditis== (الكتاب: Sanguinis = blood، والقلب مليان دم).
        page: 134
        quote: "S sanguinis makes dextrans that bind to fibrin- platelet aggregates on damaged heart valves, causing infective endocarditis."
      - kind: explain
        title: "الـ group A strep: 3 أنواع أمراض"
        text: |-
          **S pyogenes**: β-hemolytic، bacitracin sensitive، PYR ⊕. عنده **hyaluronic acid capsule** و **M protein** ضد الـ phagocytosis.

          - **Pyogenic**: pharyngitis، cellulitis، impetigo (honey-crusted)، erysipelas.
          - **Toxigenic**: scarlet fever، toxic shock–like syndrome، necrotizing fasciitis.
          - **Immunologic**: ==rheumatic fever و glomerulonephritis==.
        page: 134
        quote: "Bacitracin sensitive, β-hemolytic, pyrrolidonyl arylamidase (PYR) ⊕. Hyaluronic acid capsule and M protein inhibit phagocytosis."
      - kind: aside
        tone: trap
        text: "الـ pharyngitis ممكن تجيب rheumatic fever و glomerulonephritis، بس الـ ==impetigo بتجيب glomerulonephritis بس==. الكتاب: Ph-yogenes pharyngitis → rheumatic phever."
        page: 134
        quote: "“Ph”yogenes pharyngitis can result in rheumatic “phever” and glomerulonephritis. Strains causing impetigo can induce glomerulonephritis."
      - kind: check
        question: "A boy has a sandpaper rash sparing palms and soles, strawberry tongue and circumoral pallor after a sore throat. Which antibody test confirms a recent infection?"
        options:
          - "ASO titer or anti-DNase B"
          - "Heterophile antibody"
          - "FTA-ABS"
          - "Cold agglutinins"
        answer: 0
        why:
          - "صح: scarlet fever من group A strep، والـ ASO أو anti-DNase B بيبينوا الـ infection الحديثة."
          - "الـ heterophile للـ EBV."
          - "الـ FTA-ABS للـ syphilis."
          - "الـ cold agglutinins للـ Mycoplasma."
        page: 134
        quote: "ASO titer or anti-DNase B antibodies indicate recent S pyogenes infection."
      - kind: explain
        title: "group B: للبيبيهات"
        text: |-
          **S agalactiae**: β-hemolytic بس ==bacitracin resistant==، بيستعمر الـ vagina، وبيعمل pneumonia و meningitis و sepsis في المواليد. الـ capsule هو الـ virulence.

          في المعمل: **CAMP factor** بيكبّر منطقة الـ hemolysis بتاعة الـ S aureus (CAMP اسم المؤلفين، مش cyclic AMP)، hippurate ⊕، PYR ⊝.

          الوقاية: swab من الـ rectum والـ vagina في أسبوع ==35-37==، ولو ⊕ تاخد penicillin/ampicillin وقت الولادة.
        page: 135
        quote: "Screen pregnant patients at 35-37 weeks of gestation with rectal and vaginal swabs. Patients with ⊕ culture receive intrapartum penicillin/ampicillin prophylaxis."
      - kind: figure
        title: "الـ γ-hemolytic: ملح ولا لأ"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="120" y="10" width="120" height="30" rx="6"/>
            <text x="130" y="30" class="t-sm t-b">γ-hemolytic strep</text>
            <line class="fg-arrow" x1="150" y1="40" x2="80" y2="70"/>
            <line class="fg-arrow" x1="210" y1="40" x2="280" y2="70"/>
            <text x="30" y="62" class="t-sm t-mut">grows in 6.5% NaCl + bile</text>
            <text x="250" y="62" class="t-sm t-mut">does not</text>
            <rect class="fg-acc" x="10" y="75" width="150" height="65" rx="8"/>
            <text x="20" y="95" class="t-sm t-b">Enterococcus</text>
            <text x="20" y="113" class="t-sm">PYR ⊕, penicillin G R</text>
            <text x="20" y="130" class="t-sm">UTI, biliary, IE</text>
            <rect class="fg-bad" x="200" y="75" width="150" height="65" rx="8"/>
            <text x="210" y="95" class="t-sm t-b">S gallolyticus</text>
            <text x="210" y="113" class="t-sm">bacteremia, IE</text>
            <text x="210" y="130" class="t-sm">→ look for colon cancer</text>
          </svg>
        caption: "الاتنين ساكنين في الأمعاء. الـ Enterococcus أجمد فبيكبر في الملح والـ bile، ومقاوم للـ penicillin G. الـ S gallolyticus لو طلع في الدم يبقى لازم colonoscopy."
        alt: "Gamma-hemolytic streptococci split by growth in 6.5% NaCl and bile. Grows: Enterococcus, PYR positive, resistant to penicillin G, causing UTI, biliary infection and endocarditis. Does not grow: S gallolyticus, causing bacteremia and endocarditis, linked to colon cancer."
        page: 135
        quote: "Enterococci are more resilient than streptococci, can grow in 6.5% NaCl and bile (lab test)."
      - kind: aside
        tone: exam
        text: "==Bovis in the blood = cancer in the colon==. أي endocarditis بـ S gallolyticus (اللي كان اسمه S bovis) ← colonoscopy."
        page: 135
        quote: "Patients with S gallolyticus endocarditis have ↑ incidence of colon cancer."
      - kind: explain
        title: "الـ Enterococci"
        text: |-
          **E faecalis و E faecium**: جزء من الـ colon microbiota، و ==intrinsically resistant to penicillin G==. بيعملوا UTI، biliary tract infections، و endocarditis (بعد إجراءات في الـ GI أو الـ GU).

          catalase ⊝، PYR ⊕، غالباً nonhemolytic. والـ **VRE** (vancomycin-resistant) سبب مهم للـ healthcare-associated infection.
        page: 135
        quote: "VRE (vancomycin-resistant enterococci) are an important cause of healthcare-associated infection."
      - kind: match
        prompt: "وصّل الـ strep بالمريض النموذجي"
        pairs:
          - ["S pneumoniae", "Sickle cell patient with rusty sputum"]
          - ["S sanguinis", "Endocarditis after dental work"]
          - ["S agalactiae", "Septic newborn"]
          - ["S gallolyticus", "Endocarditis with occult colon cancer"]
          - ["Enterococcus", "Endocarditis after a GU procedure"]
        why: "الطحال يشيل الـ pneumococcus، الـ viridans في البق، group B for Babies، bovis = colon، والـ Enterococcus من الأمعاء والمسالك."
        page: 135
        quote: "Group B for Babies!"
      - kind: try
        items: [mic.L02.021, mic.L02.026, mic.L02.028, mic.L02.037, mic.L02.041]
    recap:
      - "Pneumococcus: optochin S، capsule، MOPS. Viridans: optochin R، سنان وصمامات (dextrans)."
      - "Group A: bacitracin S، M protein، pharyngitis ← rheumatic fever و GN."
      - "Group B: bacitracin R، CAMP ⊕، screening 35-37 أسبوع."
      - "Enterococcus: 6.5% NaCl، penicillin G R. Gallolyticus ← colon cancer."
    practice: [mic.L02.020, mic.L02.021, mic.L02.022, mic.L02.023, mic.L02.024, mic.L02.025, mic.L02.026, mic.L02.027, mic.L02.028, mic.L02.029, mic.L02.030, mic.L02.031, mic.L02.032, mic.L02.033, mic.L02.034, mic.L02.035, mic.L02.036, mic.L02.037, mic.L02.038, mic.L02.039, mic.L02.040, mic.L02.041, mic.L02.042, mic.L02.043]
  - id: mic.L02.lesson3
    title: "الـ Bacillus والـ Clostridia: spores وtoxins"
    hook: "anthrax، رز بايت، colitis بعد مضاد حيوي، lockjaw، وطفل floppy: كلهم gram ⊕ rods بيعملوا spores"
    minutes: 10
    pages: [135, 136]
    topics: [bacillus-anthracis, bacillus-cereus, clostridioides-difficile, clostridia]
    status: unverified
    steps:
      - kind: explain
        title: "الـ anthrax toxin: 3 قطع"
        text: |-
          **B anthracis** عنده capsule غريبة: ==polypeptide== (poly D-glutamate)، مش polysaccharide. ومستعمراته شكلها **medusa head**.

          الـ toxin 3 أجزاء:
          - **protective antigen**: بيدخّل الباقي.
          - **lethal factor**: بيوقّف الـ MAP kinase ← macrophage apoptosis.
          - **edema factor**: هو نفسه ==adenylyl cyclase== ← ↑ cAMP ← edema و necrosis.
        page: 135
        quote: "lethal factor (inhibits MAP kinase → macrophage apoptosis), and edema factor (acts as adenylyl cyclase → ↑ intracellular cAMP, upsetting homeostasis → edema, necrosis)."
      - kind: table
        title: "شكلين للـ anthrax"
        columns: ["Form", "Features"]
        rows:
          - ["Cutaneous", "Painless papule with vesicles → ulcer with painless black eschar"]
          - ["Pulmonary (woolsorter's)", "Inhaled spores → flulike → pulmonary hemorrhage, mediastinitis (widened mediastinum), shock"]
        hide: [[0, 1], [1, 1]]
        page: 135
        quote: "Pulmonary anthrax—inhalation of spores, most commonly from contaminated animals or animal products, although also a potential bioweapon → flulike symptoms that rapidly progress to fever, pulmonary hemorrhage, mediastinitis (CXR may show widened mediastinum), and shock."
      - kind: aside
        tone: exam
        text: "الـ eschar في الـ anthrax ==مش بيوجع==. واللي اتعرّض يشرب ciprofloxacin أو doxycycline كـ prophylaxis."
        page: 135
        quote: "Prophylaxis with ciprofloxacin or doxycycline when exposed."
      - kind: explain
        title: "B cereus: الرز اللي بايت"
        text: |-
          الـ spores بتستحمل طبخ الرز. لو الرز اتساب **دافي**، الـ spores تصحى وتعمل toxin.

          - **Emetic**: vomiting بعد ==1-5 ساعات==، من **cereulide** (toxin جاهز).
          - **Diarrheal**: إسهال مائي من غير دم بعد ==8-18 ساعة==.

          العلاج supportive، لأن المضادات الحيوية ما بتعملش حاجة في الـ toxins.
        page: 136
        quote: "Spores survive cooking rice (reheated rice syndrome). Keeping rice warm results in germination of spores and enterotoxin formation."
      - kind: explain
        title: "C difficile: المضاد الحيوي فتح له الباب"
        text: |-
          المضاد الحيوي بيموّت الـ microbiota الطبيعية، فالـ C difficile يكبر ويطلّع ==toxins A و B== ← تكسير الـ enterocytes ← إسهال مائي ← **pseudomembranous colitis**.

          أشهر الأدوية: clindamycin، ampicillin، cephalosporins، fluoroquinolones. وكمان مرتبط بالـ **PPIs**.

          التشخيص: PCR أو antigen للـ toxins في البراز. العلاج: ==oral vancomycin أو fidaxomicin==، وللمتكرر: نكرر نفس العلاج أو fecal microbiota transplant.
        page: 136
        quote: "Treatment: oral vancomycin or fidaxomicin. For recurrent cases, consider repeating prior regimen or fecal microbiota transplant."
      - kind: check
        question: "Why must vancomycin be given orally, not IV, for C difficile colitis?"
        options:
          - "The organism and its toxins are in the colonic lumen, which oral drug reaches"
          - "IV vancomycin causes C difficile"
          - "C difficile is gram negative"
          - "Oral vancomycin neutralizes toxin A directly"
        answer: 0
        why:
          - "صح: الـ oral vancomycin بيوصل للـ lumen بتاع القولون، والـ IV لأ."
          - "الـ IV vancomycin مش في لستة الأدوية اللي بتسببه."
          - "الـ C difficile gram ⊕."
          - "الدوا بيقتل البكتيريا، مش بيعادل الـ toxin."
        page: 136
        quote: "Treatment: oral vancomycin or fidaxomicin."
      - kind: figure
        title: "Tetanus قصاد botulism"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL02t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="18" class="t-sm t-b">Tetanus toxin</text>
            <rect class="fg-bad" x="20" y="28" width="120" height="28" rx="6"/>
            <text x="28" y="46" class="t-sm">Renshaw cell ✕</text>
            <line class="fg-arrow" x1="80" y1="56" x2="80" y2="82" marker-end="url(#micL02t)"/>
            <rect class="fg-box" x="20" y="85" width="120" height="28" rx="6"/>
            <text x="28" y="103" class="t-sm">motor neuron fires</text>
            <text x="20" y="135" class="t-sm t-bad">unopposed → spastic</text>
            <text x="200" y="18" class="t-sm t-b">Botulinum toxin</text>
            <rect class="fg-box" x="200" y="28" width="140" height="28" rx="6"/>
            <text x="208" y="46" class="t-sm">motor neuron</text>
            <line class="fg-arrow" x1="270" y1="56" x2="270" y2="82" marker-end="url(#micL02t)"/>
            <rect class="fg-bad" x="200" y="85" width="140" height="28" rx="6"/>
            <text x="208" y="103" class="t-sm">no ACh at NMJ ✕</text>
            <text x="200" y="135" class="t-sm t-bad">no stimulation → flaccid</text>
            <text x="60" y="162" class="t-sm t-mut">both cleave SNARE proteins</text>
          </svg>
        caption: "الاتنين بيقصّوا الـ SNARE، بس في مكانين مختلفين. الـ tetanus بيشيل الفرامل (Renshaw cells) فالعضلة تتشنج. الـ botulinum بيقطع الإشارة عن العضلة نفسها فتبقى مرخية."
        alt: "Left: tetanus toxin knocks out the inhibitory Renshaw cell, so the motor neuron fires unopposed and gives spastic paralysis. Right: botulinum toxin stops acetylcholine release at the neuromuscular junction, so there is no stimulation and paralysis is flaccid. Both cleave SNARE proteins."
        page: 136
        quote: "Tetanus toxin and botulinum toxin are proteases that cleave SNARE proteins involved in neurotransmission."
      - kind: explain
        title: "Tetanus"
        text: |-
          الـ C tetani نفسه ==بيفضل في الجرح==. الـ tetanospasmin هو اللي بيمشي **retrograde** في الـ axon لحد الـ CNS ويوقّف الـ GABA والـ glycine من الـ Renshaw cells.

          النتيجة: spastic paralysis، trismus (lockjaw)، risus sardonicus (حواجب مرفوعة وابتسامة مفتوحة)، opisthotonos.

          العلاج: **antitoxin** ± vaccine booster، antibiotics، **diazepam** للتشنجات، و wound debridement.
        page: 136
        quote: "Tetanospasmin spreads by retrograde axonal transport to CNS and blocks release of GABA and glycine from Renshaw cells in spinal cord."
      - kind: explain
        title: "Botulism: الـ 5 D's"
        text: |-
          الـ toxin heat-labile بيمنع إفراز الـ **ACh** عند الـ NMJ. الأعراض الـ ==5 D's==: diplopia، dysarthria، dysphagia، dyspnea، و **descending flaccid paralysis**، ومن غير sensory deficits.

          - الرضيع: بلع **spores** (عسل) ← floppy baby syndrome.
          - الكبير: أكل **toxin جاهز** (معلبات).

          العلاج: ==human botulinum immunoglobulin==. والـ Botox نفسه بيعالج focal dystonia و hyperhidrosis و muscle spasms والتجاعيد.
        page: 136
        quote: "Symptoms of botulism (the 5 D’s): diplopia, dysarthria, dysphagia, dyspnea, descending flaccid paralysis. Does not present with sensory deficits."
      - kind: explain
        title: "C perfringens و C septicum"
        text: |-
          - **α-toxin** (lecithinase، phospholipase) ← ==gas gangrene== (crepitus تحت الجلد) و hemolysis.
          - **food poisoning**: أكل فيه spores كتير، اتطبخ واتساب أقل من 60°C ← الـ spores تصحى ← enterotoxin ← أعراض متأخرة (==10-12 ساعة==) وبتخلص في 24 ساعة.
          - **spontaneous** gas gangrene من غير جرح ← غالباً **C septicum** عن طريق الدم، ومرتبط بـ ==colonic malignancy==.
        page: 136
        quote: "Spontaneous gas gangrene (via hematogenous seeding; associated with colonic malignancy) is most commonly caused by Clostridium septicum."
      - kind: sort
        prompt: "رتّب الـ food poisoning حسب بداية الأعراض"
        bins: ["Hours 1-6", "Hours 8-18"]
        cards:
          - { text: "S aureus enterotoxin (2-6 hr)", bin: 0 }
          - { text: "B cereus emetic (1-5 hr)", bin: 0 }
          - { text: "B cereus diarrheal (8-18 hr)", bin: 1 }
          - { text: "C perfringens (10-12 hr)", bin: 1 }
        why: "اللي toxin بتاعه جاهز في الأكل (S aureus و cereulide) بيبدأ بسرعة. اللي محتاج البكتيريا تعمل toxin جوه الأمعاء بيتأخر."
        page: 136
        quote: "Emetic type causes nausea and vomiting within 1-5 hours. Caused by cereulide, a preformed toxin."
      - kind: try
        items: [mic.L02.046, mic.L02.048, mic.L02.050, mic.L02.055, mic.L02.057]
    recap:
      - "Anthrax: polypeptide capsule، edema factor = adenylyl cyclase، eschar مش بيوجع."
      - "B cereus: رز دافي؛ emetic 1-5 hr، diarrheal 8-18 hr."
