      - kind: explain
        title: "Diphtheria"
        text: |-
          الـ toxin (جيناته على **β-prophage**) بيعطّل الـ EF-2 ← necrosis في الزور والقلب والـ CNS.

          - **الزور**: pseudomembranous pharyngitis (==غشا رمادي-أبيض==) و bull's neck.
          - **لو انتشر**: myocarditis، arrhythmias، neuropathies.

          المعمل: gram ⊕ rods فيها **metachromatic granules** (أزرق وأحمر)، و ==Elek test ⊕== للـ toxin، ومستعمرات سودا على الـ cystine-tellurite.

          العلاج: antitoxin ± erythromycin أو penicillin. والوقاية: toxoid vaccine.
        page: 137
        quote: "Lab diagnosis based on gram ⊕ rods with metachromatic (blue and red) granules and ⊕ Elek test for toxin."
      - kind: explain
        title: "Listeria: بتحب التلاجة"
        text: |-
          gram ⊕ rod، facultative intracellular. بتيجي من ==unpasteurized dairy و cold deli meats==، أو عبر الـ placenta، أو وقت الولادة. وبتكبر كويس في التلاجة (cold enrichment).

          حيلها:
          - **rocket tails** من الـ actin ← تنط من خلية لخلية من غير ما تطلع بره ← ==تهرب من الـ antibodies==.
          - **listeriolysin** بيخرم الـ phagosome فتطلع للـ cytoplasm.
          - tumbling motility في الـ broth.
        page: 137
        quote: "Listeriolysin generates pores in phagosomes, allowing its escape into cytoplasm. Characteristic tumbling motility in broth."
      - kind: check
        question: "A pregnant woman who ate soft unpasteurized cheese has fever; her neonate has meningitis with gram-positive rods. Which drug treats it?"
