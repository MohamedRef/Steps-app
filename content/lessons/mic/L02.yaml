            <text x="12" y="157" class="t-sm">Hutchinson teeth, mulberry molars, saber shins, CN VIII deafness</text>
          </svg>
        caption: "الـ syphilis بيبدأ بقرحة مش بتوجع، وبعدين بينتشر (rash في الكفوف والرجلين)، وبعد سنين يضرب الأوعية والأعصاب. واللي بيتولد بيه ليه شكل مميز."
        alt: "Three stages of syphilis left to right: primary with a painless chancre seen on dark-field microscopy, secondary with a palms and soles rash and condylomata lata, tertiary with gummas, aortitis, tabes dorsalis and Argyll Robertson pupil. Latent syphilis has only positive serology. Below, congenital syphilis features."
        page: 145
        quote: "Gummas E (chronic granulomas), aortitis (vasa vasorum destruction), neurosyphilis (tabes dorsalis, “general paresis”), Argyll Robertson pupil (constricts with accommodation but is not reactive to light)."
      - kind: aside
        tone: tip
        text: "الـ ==Argyll Robertson pupil==: بيضيق مع الـ accommodation بس ما بيستجيبش للنور (constricts with accommodation but is not reactive to light). وعلامات الـ tertiary كمان: ataxia بقاعدة واسعة، Romberg ⊕، Charcot joint، stroke من غير ضغط."
        page: 145
        quote: "Signs: broad-based ataxia, ⊕ Romberg, Charcot joint, stroke without hypertension."
      - kind: explain
        title: "تشخيص الـ syphilis"
        text: |-
          - **Nontreponemal** (VDRL، RPR): antibody ضد ==beef cardiolipin==. رخيص، quantitative، sensitive بس مش specific. ==بيرجع ⊝ بعد العلاج==.
          - **Treponemal** (FTA-ABS، TP-PA): specific، و ==بيفضل ⊕ طول العمر==.
          - **Direct**: dark-field أو PCR.

          الـ VDRL ⊕ في ~80% من الـ primary. والعلاج كله: **penicillin G**. وفي الحمل: عالج بدري، لأن الـ placenta بتنقل غالباً بعد الـ first trimester.
        page: 146
        quote: "Nontreponemal tests (VDRL, RPR) and direct testing revert to negative after treatment. Antibodies detected by treponemal tests (FTA- ABS, TP-PA) will remain positive."
      - kind: mnemonic
        word: "PVDRL"
        parts:
          - { key: "P", text: "Pregnancy" }
          - { key: "V", text: "Viral infection (EBV, hepatitis)" }
          - { key: "D", text: "Drugs (chlorpromazine, procainamide)" }
          - { key: "R", text: "Rheumatic fever (rare)" }
          - { key: "L", text: "Lupus (anticardiolipin) and Leprosy" }
        hook: "False-Positive VDRL (الكتاب)"
        page: 146
        quote: "False-Positive results on VDRL with: Pregnancy Viral infection (eg, EBV, hepatitis) Drugs (eg, chlorpromazine, procainamide) Rheumatic fever (rare) Lupus (anticardiolipin antibody) and Leprosy"
      - kind: case
