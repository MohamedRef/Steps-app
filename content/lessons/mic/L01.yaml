      - kind: explain
        title: "الـ endotoxin: 3 زراير، كل واحد ليه نتيجة"
        text: |-
          الـ LPS = O-antigen + core polysaccharide + ==lipid A== (الجزء السام). الـ Neisseria عندها lipooligosaccharide. بيطلع لما البكتيريا تموت، أو من فقاقيع (blebs) بتنفصل من البكتيريا وهي عايشة.

          - **macrophage activation** (TLR4/CD14) ← IL-1 و IL-6 و TNF-α و nitric oxide ← fever و hypotension.
          - **complement activation** ← C3a (histamine: hypotension و edema)، C5a (neutrophil chemotaxis).
          - **tissue factor activation** ← coagulation cascade ← ==DIC==.
        page: 131
        quote: "Three main effects: macrophage activation (TLR4/CD14), complement activation, and tissue factor activation."
