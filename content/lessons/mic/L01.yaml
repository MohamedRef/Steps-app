      - kind: explain
        title: "toxins بتخرم الـ membrane، و superantigens"
        text: |-
          - **C perfringens alpha toxin**: phospholipase (lecithinase) ← myonecrosis (==gas gangrene==)، و "double zone" hemolysis على الـ blood agar.
          - **Streptolysin O** (S pyogenes): بيخرم الـ RBCs (β-hemolysis). الـ antibodies ضده (**ASO**) بتشخّص الـ rheumatic fever.
          - **Superantigens**: TSST-1 (S aureus) و erythrogenic exotoxin A (S pyogenes). بيربطوا الـ TCR بالـ MHC II ==بره مكان الـ antigen== ← T cells كتير جداً تشتغل مرة واحدة ← cytokines ← fever، rash، shock.
        page: 131
        quote: "Cross-links β region of TCR to MHC class II on APCs outside of the antigen binding site"
      - kind: reveal
        prompt: "ليه الـ superantigen بيعمل shock، والـ antigen العادي لأ؟"
        answer: "الـ antigen العادي بيشغّل الـ T cells القليلة اللي عندها receptor مخصوص ليه. الـ superantigen بيربط الـ TCR والـ MHC II من بره مكان الـ antigen، فبيشغّل نسبة ضخمة من الـ T cells مرة واحدة ← overwhelming release of IL-1 و IL-2 و IFN-γ و TNF-α ← shock."
