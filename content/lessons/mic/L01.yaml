        title: "Tetanus و botulism: نفس المقص، مكانين"
        text: |-
          الاتنين ==proteases بتقص الـ SNARE== (البروتينات اللي بتخلي الـ vesicle تفرّغ الـ neurotransmitter).

          - **Tetanospasmin**: بيوقّف إفراز الـ **inhibitory** neurotransmitters (GABA و glycine) من الـ Renshaw cells في الـ spinal cord ← مافيش فرامل ← **spastic paralysis**، risus sardonicus، trismus (lockjaw)، opisthotonos.
          - **Botulinum toxin**: بيوقّف إفراز الـ neurotransmitter عند العضلة ← flaccid paralysis.
