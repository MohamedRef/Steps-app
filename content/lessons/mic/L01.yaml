            <text x="12" y="31" class="t-sm">cholera: Gs on</text>
            <rect class="fg-box" x="245" y="10" width="110" height="34" rx="6"/>
            <text x="252" y="31" class="t-sm">pertussis: Gi off</text>
            <rect class="fg-box" x="5" y="145" width="110" height="34" rx="6"/>
            <text x="12" y="166" class="t-sm">ETEC LT: overactive</text>
            <rect class="fg-box" x="245" y="145" width="110" height="34" rx="6"/>
            <text x="252" y="166" class="t-sm">anthrax: mimics it</text>
            <line class="fg-arrow-acc" x1="80" y1="44" x2="140" y2="80" marker-end="url(#micL01t)"/>
            <line class="fg-arrow-acc" x1="280" y1="44" x2="220" y2="80" marker-end="url(#micL01t)"/>
            <line class="fg-arrow-acc" x1="80" y1="145" x2="140" y2="116" marker-end="url(#micL01t)"/>
            <line class="fg-arrow-acc" x1="280" y1="145" x2="220" y2="116" marker-end="url(#micL01t)"/>
