        quote: "Loa loa Swelling in skin, worm in conjunctiva. Deer fly, horse fly, mango fly. Diethylcarbamazine."
      - kind: explain
        title: "الـ tissue nematodes"
        text: |-
          - **Onchocerca**: black skin nodules و ==river blindness==. العلاج ivermectin.
          - **Loa loa**: swelling في الجلد، ودودة في الـ conjunctiva. ==Diethylcarbamazine==.
          - **Wuchereria، Brugia**: lymphatic filariasis (==elephantiasis==)، والأعراض بتبدأ بعد 9 شهور لسنة. Diethylcarbamazine.
        page: 156
        quote: "Wuchereria bancrofti, Brugia malayi Lymphatic filariasis (elephantiasis)— worms invade lymph nodes →  inflammation →  lymphedema E ; symptom onset after 9 mo-1 yr."
