schema: steps.lesson/v1
lecture: mic.L04
lessons:
  - id: mic.L04.lesson1
    title: "Protozoa الأمعاء والمخ"
    hook: "مية ملوثة، لحمة نيّة، قطة في البيت، وحمام سباحة دافي: كل واحدة ليها بروتوزوا"
    minutes: 9
    pages: [152, 153]
    topics: [protozoa-gi, protozoa-cns]
    goals:
      - "تفرّق Giardia و Entamoeba و Cryptosporidium من شكل الإسهال والـ stool"
      - "تعرف الـ Toxoplasma في الشخص السليم وفي الـ AIDS وفي الجنين"
      - "تعرف Naegleria و Trypanosoma brucei وعلاجهم"
    status: unverified
    steps:
      - kind: explain
        title: "تلاتة في المية"
        text: |-
          التلاتة دول بيتنقلوا بـ ==cysts (أو oocysts) في المية==، بس كل واحد إسهاله شكل:

          - **Giardia**: إسهال ==fatty==، ريحته وحشة، من غير دم، ومعاه bloating و flatulence. غالباً campers و hikers.
          - **Entamoeba histolytica**: إسهال ==بدم== (dysentery) و liver abscess.
          - **Cryptosporidium**: إسهال مية خفيف في السليم، وشديد في الـ AIDS.
        page: 152
        quote: "Giardiasis—bloating, flatulence, foul-smelling, nonbloody, fatty diarrhea (often seen in campers/hikers)"
      - kind: aside
        tone: tip
        text: "تحشيشة الكتاب: ==fat-rich Ghirardelli chocolates== for fatty stools of Giardia. وللـ Entamoeba: ==Entamoeba Eats Erythrocytes==، يعني الـ trophozoite جواه RBCs."
        page: 152
        quote: "think fat-rich Ghirardelli chocolates for fatty stools of Giardia"
      - kind: explain
        title: "Entamoeba: من القولون للكبد"
        text: |-
          - في القولون: ==flask-shaped ulcers== في الـ biopsy.
          - في الكبد: abscess فيه exudate شكله ==anchovy paste==، مع ألم RUQ.
          - في الـ stool: trophozoites بلعت RBCs، أو cysts فيها لحد 4 nuclei.

          العلاج: **metronidazole**، و **paromomycin** للي شايل cysts من غير أعراض.
        page: 152
        quote: "liver abscess (“anchovy paste” exudate), RUQ pain; histology of colon biopsy shows flask-shaped ulcers"
      - kind: table
        title: "التشخيص والعلاج"
        columns: ["", "Diagnosis", "Treatment"]
        rows:
          - ["Giardia", "Multinucleated trophozoites or cysts, antigen, PCR", "Tinidazole, nitazoxanide, or metronidazole"]
          - ["Entamoeba", "Trophozoites with RBCs, cysts with up to 4 nuclei", "Metronidazole; paromomycin for cyst passers"]
          - ["Cryptosporidium", "Oocysts on acid-fast stain", "Prevention (filtering); nitazoxanide"]
        hide: [[0, 2], [1, 2], [2, 1]]
        page: 152
        quote: "Oocysts on acid-fast stain F , antigen detection, PCR Prevention (eg, filtering); nitazoxa- nide (severe disease and/or immuno- compromised)"
      - kind: check
        question: "A hiker has 2 weeks of greasy, foul-smelling, nonbloody diarrhea with bloating after drinking stream water. Which organism?"
        options:
          - "Giardia lamblia"
          - "Entamoeba histolytica"
          - "Cryptosporidium"
          - "Trichomonas vaginalis"
        answer: 0
        why:
          - "صح: fatty، foul-smelling، nonbloody، وفي campers و hikers."
          - "الـ Entamoeba إسهالها بدم."
          - "الـ Cryptosporidium إسهاله مية، وشديد في الـ AIDS."
          - "الـ Trichomonas بيعمل vaginitis مش إسهال."
        page: 152
        quote: "nonbloody, fatty diarrhea (often seen in campers/hikers)"
      - kind: explain
        title: "Toxoplasma: تلات صور"
        text: |-
          - **السليم**: أعراض زي الـ mono، بس ==heterophile antibody test ⊝==.
          - **الـ AIDS** (reactivation): brain abscesses، غالباً ==multiple ring-enhancing lesions== على الـ MRI.
          - **Congenital**: chorioretinitis و hydrocephalus و intracranial calcifications.

          بيتنقل بالـ cysts في اللحمة (الأشهر)، والـ oocysts في براز القطط، وبيعدي الـ placenta.
        page: 153
        quote: "Reactivation in AIDS →  brain abscesses usually seen as multiple ring-enhancing lesions on MRI"
      - kind: figure
        title: "دورة الـ Toxoplasma"
        svg: |-
          <svg viewBox="0 0 360 192" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL04a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="90" height="30" rx="6"/>
            <text x="20" y="40" class="t-sm">cysts in meat</text>
            <rect class="fg-box" x="10" y="70" width="90" height="30" rx="6"/>
            <text x="18" y="90" class="t-sm">cat feces</text>
            <line class="fg-arrow" x1="100" y1="35" x2="140" y2="60" marker-end="url(#micL04a)"/>
            <line class="fg-arrow" x1="100" y1="85" x2="140" y2="68" marker-end="url(#micL04a)"/>
            <rect class="fg-acc" x="145" y="48" width="70" height="30" rx="6"/>
            <text x="158" y="68" class="t-sm t-b">human</text>
            <line class="fg-arrow" x1="215" y1="56" x2="250" y2="30" marker-end="url(#micL04a)"/>
            <line class="fg-arrow" x1="215" y1="64" x2="250" y2="75" marker-end="url(#micL04a)"/>
            <line class="fg-arrow" x1="215" y1="72" x2="250" y2="122" marker-end="url(#micL04a)"/>
            <text x="254" y="30" class="t-sm">healthy:</text>
            <text x="254" y="45" class="t-sm t-mut">mono-like</text>
            <text x="254" y="80" class="t-sm">AIDS:</text>
            <text x="254" y="95" class="t-sm t-mut">ring lesions</text>
            <text x="254" y="128" class="t-sm">fetus:</text>
            <text x="254" y="143" class="t-sm t-mut">chorioretinitis,</text>
            <text x="254" y="158" class="t-sm t-mut">hydrocephalus,</text>
            <text x="254" y="173" class="t-sm t-mut">calcifications</text>
          </svg>
        caption: "العدوى من اللحمة أو براز القطط. السليم بياخد mono-like، الـ AIDS بيعمل ring-enhancing lesions، والجنين بياخد الـ triad."
        alt: "Toxoplasma: cysts in meat and oocysts in cat feces infect a human. A healthy host gets a mononucleosis-like illness, a patient with AIDS gets ring-enhancing brain lesions, and a fetus gets chorioretinitis, hydrocephalus and intracranial calcifications."
        page: 153
        quote: "Cysts in meat (most common); oocysts in cat feces; crosses placenta (pregnant patients should avoid cats)"
      - kind: explain
        title: "علاج الـ Toxo والوقاية"
        text: |-
          - العلاج: ==sulfadiazine + pyrimethamine==.
          - الوقاية في الـ HIV: **TMP-SMX** لما الـ ==CD4+ تحت 100==. (قارن بالـ PCP اللي حده 200.)
          - التشخيص: serology، biopsy (tachyzoite)، و PCR للـ amniotic fluid لو شاكّين في الجنين.
        page: 153
        quote: "Sulfadiazine + pyrimethamine Prophylaxis with TMP-SMX when CD4+ cell count <100 cells/mm3"
      - kind: reveal
        prompt: "ولد عام في بحيرة دافية في الصيف، وبعد كام يوم جاله meningoencephalitis سريع جداً، والـ CSF فيه amoebas. وصل للمخ إزاي؟"
        answer: "ده ==Naegleria fowleri==. دخل من الأنف ومشي على الـ ==olfactory nerve== عن طريق الـ cribriform plate. والمرض rapidly fatal، والـ amphotericin B نفع مع قليلين بس."
        page: 153
        quote: "Swimming in warm freshwater; enters CNS through olfactory nerve via cribriform plate"
      - kind: explain
        title: "Trypanosoma brucei: مرض النوم الأفريقي"
        text: |-
          من عضة ==tsetse fly== اللي بتوجع. بيعمل lymph nodes كبيرة، و ==recurring fever== بسبب الـ antigenic variation، وبعدين somnolence و coma. والتشخيص trypomastigote في الـ blood smear.

          العلاج: **suramin** للدم، و **melarsoprol** لو دخل الـ CNS. "I sure am mellow when I'm sleeping".
        page: 153
        quote: "African sleeping sickness— enlarged lymph nodes, recurring fever (due to antigenic variation), somnolence, coma"
      - kind: check
        question: "A patient with HIV has a CD4+ count of 80 cells/mm3 and a positive Toxoplasma IgG. Which drug is used to prevent reactivation?"
        options:
          - "TMP-SMX"
          - "Sulfadiazine + pyrimethamine"
          - "Fluconazole"
          - "Azithromycin alone"
        answer: 0
        why:
          - "صح: الـ prophylaxis بالـ TMP-SMX لما الـ CD4+ تنزل تحت 100."
          - "ده العلاج لما المرض يحصل، مش الوقاية."
          - "الـ fluconazole للفطريات."
          - "مش هو الـ prophylaxis بتاع الـ Toxo في الكتاب."
        page: 153
        quote: "Prophylaxis with TMP-SMX when CD4+ cell count <100 cells/mm3"
      - kind: try
        items: [mic.L04.001, mic.L04.004, mic.L04.008, mic.L04.013, mic.L04.018]
    recap:
      - "Giardia: fatty، campers. Entamoeba: دم، flask ulcers، anchovy paste، metronidazole + paromomycin. Crypto: acid-fast oocysts، AIDS."
      - "Toxo: لحمة وقطط؛ ring lesions في الـ AIDS؛ triad في الجنين؛ sulfadiazine + pyrimethamine؛ TMP-SMX تحت 100."
      - "Naegleria: مية دافية، cribriform plate. T brucei: tsetse، antigenic variation، suramin أو melarsoprol."
    practice: [mic.L04.001, mic.L04.002, mic.L04.003, mic.L04.004, mic.L04.005, mic.L04.006, mic.L04.007, mic.L04.008, mic.L04.009, mic.L04.010, mic.L04.011, mic.L04.012, mic.L04.013, mic.L04.014, mic.L04.015, mic.L04.016, mic.L04.017, mic.L04.018, mic.L04.019]
  - id: mic.L04.lesson2
    title: "Protozoa الدم والأحشاء والـ STI"
    hook: "ناموسة، قرادة، بقة بتبوس، وذبابة رمل: كل حشرة ومرضها"
    minutes: 9
    pages: [154, 155]
    topics: [protozoa-hematologic, protozoa-others]
    goals:
      - "تفرّق أنواع الـ Plasmodium وتختار العلاج"
      - "تعرف الـ Babesia والـ asplenia"
      - "تعرف Chagas و Leishmania و Trichomonas"
    status: unverified
    steps:
      - kind: explain
        title: "Malaria"
        text: |-
          من الـ ==Anopheles mosquito==. بيعمل cyclic fevers و headache و anemia و splenomegaly، و hypoglycemia لو شديد.

          التشخيص: ==peripheral blood smear==، وبيحدد النوع كمان.
        page: 154
        quote: "Malaria—cyclic fevers, headache, anemia, splenomegaly; hypoglycemia in severe disease Anopheles mosquito"
      - kind: table
        title: "الأنواع"
        columns: ["", "Fever", "Smear", "Special"]
        rows:
          - ["P malariae", "72 hr (quartan)", "Ring in RBC", "-"]
          - ["P vivax/ovale", "48 hr (tertian)", "Schüffner stippling", "Hypnozoite in liver"]
          - ["P falciparum", "Severe, irregular", "Headphone ring, crescent gametocytes", "Occludes capillaries"]
        hide: [[0, 1], [1, 1], [1, 3], [2, 2], [2, 3]]
        page: 154
        quote: "P vivax/ovale 48-hr fever cycle (tertian); dormant form (hypnozoite) in liver"
      - kind: explain
        title: "ليه الـ falciparum بيقتل"
        text: |-
          الـ RBCs المصابة بتسد الـ ==capillaries== في المخ (==cerebral malaria==)، والكلى، والرئة. والحمى مش منتظمة.

          وفي الـ smear: ring شكله ==headphone== و gametocytes شكلها هلال.
        page: 154
        quote: "parasitized RBCs may occlude capillaries in brain (cerebral malaria), kidneys, lungs"
      - kind: explain
        title: "العلاج"
        text: |-
          - sensitive ← ==chloroquine==.
          - resistant ← mefloquine أو doxycycline أو atovaquone/proguanil.
          - life threatening ← IV quinine أو artesunate.
          - vivax/ovale ← زوّد ==primaquine== للـ hypnozoites.

          وقبل الـ primaquine أو الـ quinine: اعمل test للـ ==G6PD deficiency==.
        page: 154
        quote: "If life threatening, use intravenous quinine or artesunate (test for G6PD deficiency)"
      - kind: check
        question: "A traveler had P ovale malaria treated with chloroquine. Which drug prevents relapse?"
        options:
          - "Primaquine"
          - "Mefloquine"
          - "Artesunate"
          - "Atovaquone + azithromycin"
        answer: 0
        why:
          - "صح: الـ primaquine بيضرب الـ hypnozoites في الكبد، بعد test الـ G6PD."
          - "الـ mefloquine للـ chloroquine-resistant."
          - "الـ artesunate للـ life threatening."
          - "ده علاج الـ Babesia."
        page: 154
        quote: "Add primaquine to target hypnozoites"
      - kind: explain
        title: "Babesia"
        text: |-
          نفس قرادة الـ ==Ixodes== اللي بتنقل Lyme و Anaplasma. بتعمل fever و hemolytic anemia، في شمال شرق أمريكا.

          الـ smear: ring form أو ==Maltese cross==. والـ ==asplenia== بتخلّي المرض شديد لأن الطحال هو اللي بينضّف الـ RBCs المصابة.

          العلاج: atovaquone + azithromycin.
        page: 154
        quote: "asplenia ↑ risk of severe disease due to inability to clear infected RBCs"
      - kind: explain
        title: "Chagas: T cruzi causes big problems"
        text: |-
          الـ ==kissing bug== (triatomine) بيعض ويعمل براز جنب البق أو العين، والبراز يدخل الجرح.

          - **Acute**: ورم حوالين عين واحدة (==Romaña sign==).
          - **Chronic**: dilated cardiomyopathy مع apical atrophy، و megacolon، و megaesophagus. كله "big".

          في South America. العلاج benznidazole أو nifurtimox.
        page: 155
        quote: "Triatomine insect (kissing bug) bites and defecates around the mouth or eyes →  fecal transmission into bite site or mucosa"
      - kind: figure
        title: "الحشرة والطفيل"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="10" width="160" height="28" rx="6"/>
            <text x="20" y="29" class="t-sm">Anopheles mosquito</text>
            <text x="185" y="29" class="t-sm">→ Plasmodium</text>
            <rect class="fg-box" x="10" y="44" width="160" height="28" rx="6"/>
            <text x="20" y="63" class="t-sm">Ixodes tick</text>
            <text x="185" y="63" class="t-sm">→ Babesia</text>
            <rect class="fg-box" x="10" y="78" width="160" height="28" rx="6"/>
            <text x="20" y="97" class="t-sm">Tsetse fly</text>
            <text x="185" y="97" class="t-sm">→ T brucei</text>
            <rect class="fg-box" x="10" y="112" width="160" height="28" rx="6"/>
            <text x="20" y="131" class="t-sm">Kissing bug / sandfly</text>
            <text x="185" y="131" class="t-sm">→ T cruzi / Leishmania</text>
          </svg>
        caption: "كل vector وطفيله: الناموسة للملاريا، القرادة للـ Babesia، الـ tsetse للـ T brucei، الـ kissing bug للـ T cruzi، والـ sandfly للـ Leishmania."
        alt: "Vectors and protozoa: Anopheles mosquito carries Plasmodium, Ixodes tick carries Babesia, tsetse fly carries Trypanosoma brucei, kissing bug carries Trypanosoma cruzi, and sandfly carries Leishmania."
        page: 155
        quote: "Sandfly Macrophages containing amastigotes"
      - kind: explain
        title: "Leishmania"
        text: |-
          من الـ ==sandfly==. نوعين:

          - **Visceral (kala-azar)**: spiking fevers، hepatosplenomegaly، pancytopenia.
          - **Cutaneous**: skin ulcers.

          التشخيص: ==macrophages فيها amastigotes==. العلاج amphotericin B أو sodium stibogluconate.
        page: 155
        quote: "Visceral leishmaniasis (kala-azar)—spiking fevers, hepatosplenomegaly, pancytopenia"
      - kind: explain
        title: "Trichomonas vaginalis"
        text: |-
          vaginitis بإفرازات ==خضرا== ريحتها وحشة، مع حكة وحرقان. وعنق الرحم فيه نقط نزيف (==strawberry cervix==)، والـ wet mount فيه trophozoites بتتحرك.

          ==sexual بس==، لأنه ما بيعملش cysts فما يعيشش برّه الإنسان. وما تلخبطوش مع الـ Gardnerella (bacterial vaginosis).

          العلاج: metronidazole للمريضة **والـ partner**، وافحص باقي الـ STIs.
        page: 155
        quote: "Sexual (cannot exist outside human because it cannot form cysts)"
      - kind: check
        question: "A man from Brazil has heart failure from a dilated cardiomyopathy with apical thinning and a megacolon. How was he infected?"
        options:
          - "Feces of a triatomine bug rubbed into a bite"
          - "The bite of a sandfly"
          - "The bite of a tsetse fly"
          - "Eating undercooked pork"
        answer: 0
        why:
          - "صح: Chagas، والـ kissing bug بيعمل براز جنب العضة."
          - "الـ sandfly للـ Leishmania."
          - "الـ tsetse للـ sleeping sickness."
          - "الخنزير للـ Taenia و Trichinella."
        page: 155
        quote: "fecal transmission into bite site or mucosa"
      - kind: try
        items: [mic.L04.021, mic.L04.024, mic.L04.027, mic.L04.028, mic.L04.034]
    recap:
      - "Malaria: Anopheles، smear. malariae 72 hr، vivax/ovale 48 hr + hypnozoite (primaquine)، falciparum يسد الـ capillaries."
      - "Babesia: Ixodes، Maltese cross، أسوأ مع الـ asplenia، atovaquone + azithromycin."
      - "Chagas: kissing bug، Romaña، cardiomyopathy و mega-organs، benznidazole."
      - "Leishmania: sandfly، amastigotes في الـ macrophages. Trich: strawberry cervix، metronidazole للاتنين."
    practice: [mic.L04.020, mic.L04.021, mic.L04.022, mic.L04.023, mic.L04.024, mic.L04.025, mic.L04.026, mic.L04.027, mic.L04.028, mic.L04.029, mic.L04.030, mic.L04.031, mic.L04.032, mic.L04.033, mic.L04.034, mic.L04.035, mic.L04.036]
  - id: mic.L04.lesson3
    title: "الـ Nematodes: الديدان الأسطوانية"
    hook: "اسأل الأول: الدودة دخلت من البق، من الرجل، ولا من عضة؟"
    minutes: 9
    pages: [155, 156]
    topics: [nematode-routes, nematodes]
    goals:
      - "تقسم الـ nematodes حسب طريقة الدخول"
      - "تعرف المرض المميز لكل دودة"
      - "تختار بين bendazoles و ivermectin و diethylcarbamazine"
    status: unverified
    steps:
      - kind: mnemonic
        word: "EATTT"
        parts:
          - { key: "E", text: "Enterobius" }
          - { key: "A", text: "Ascaris" }
          - { key: "T", text: "Toxocara" }
          - { key: "T", text: "Trichinella" }
          - { key: "T", text: "Trichuris" }
        hook: "You'll get sick if you EATTT these! (الكتاب)"
        page: 155
        quote: "Ingested—Enterobius, Ascaris, Toxocara, Trichinella, Trichuris"
      - kind: explain
        title: "من الجلد ومن العضة"
        text: |-
          - **من الجلد** (==SANd==): Strongyloides، Ancylostoma، Necator. بيدخلوا من الرجل الحافية.
          - **من العضة** (==Lay LOW==): Loa loa، Onchocerca volvulus، Wuchereria bancrofti.
        page: 155
        quote: "Cutaneous—Strongyloides, Ancylostoma, Necator Bites—Loa loa, Onchocerca volvulus, Wuchereria bancrofti"
      - kind: explain
        title: "Enterobius و Ascaris"
        text: |-
          - **Enterobius (pinworm)**: حكة في الشرج ==بالليل==، أكتر في الأطفال 5-10 سنين. التشخيص بالـ ==tape test==.
          - **Ascaris (giant roundworm)**: ممكن يسد الـ ileocecal valve أو القنوات المرارية أو يثقب الأمعاء. ولما الـ larvae تعدي على الـ alveoli ← ==Löeffler syndrome== (pulmonary eosinophilia). البيض knobby-coated.
        page: 156
        quote: "Migration of larvae to alveoli →  Löeffler syndrome (pulmonary eosinophilia)."
      - kind: explain
        title: "Strongyloides والـ hyperinfection"
        text: |-
          الـ larvae في التراب بتخترق الجلد. أعراض GI (duodenitis)، ورئة (dry cough، hemoptysis)، وجلد (pruritus). وفي الـ stool: ==rhabditiform larvae==.

          الخطر: في الـ immunocompromised (زي اللي بياخد steroids) بيحصل ==hyperinfection syndrome== من autoinfection سريعة.

          العلاج: **ivermectin** أو bendazoles.
        page: 156
        quote: "Larvae in soil penetrate skin; rhabditiform larvae seen in feces under microscope. Ivermectin or bendazoles."
      - kind: explain
        title: "Hookworms: Ancylostoma و Necator"
        text: |-
          بيدخلوا من الرجل الحافية على البحر أو التراب، ويعملوا ==cutaneous larva migrans==: rash بيحك وشكله متعرّج.

          وفي الأمعاء بيمصوا الدم من الجدار ← ==microcytic anemia==.
        page: 156
        quote: "Cutaneous larva migrans—pruritic, serpiginous rash C . Larvae penetrate skin from walking barefoot on contaminated beach/soil."
      - kind: check
        question: "A patient on high-dose steroids develops sepsis, cough and diarrhea, and stool shows rhabditiform larvae. Which drug?"
        options:
          - "Ivermectin"
          - "Praziquantel"
          - "Diethylcarbamazine"
          - "Metronidazole"
        answer: 0
        why:
          - "صح: Strongyloides hyperinfection، والعلاج ivermectin أو bendazoles."
          - "الـ praziquantel للـ flukes والـ tapeworms."
          - "الـ diethylcarbamazine للـ Loa loa والـ filariasis."
          - "الـ metronidazole للـ protozoa."
        page: 156
        quote: "Hyperinfection syndrome can be caused by accelerated autoinfection in the immunocompromised."
      - kind: explain
        title: "Trichinella و Trichuris و Toxocara"
        text: |-
          - **Trichinella**: من اللحمة الني (خصوصاً الخنزير). الـ larvae بتعمل cysts في الـ ==striated muscle== ← myositis، و fever و periorbital edema و myalgia.
          - **Trichuris (whipworm)**: غالباً من غير أعراض، أو إسهال و anemia و ==rectal prolapse== في الأطفال.
          - **Toxocara canis**: ==visceral larva migrans== في الكبد والعين والمخ والقلب.
        page: 156
        quote: "Trichinosis—fever, vomiting, nausea, periorbital edema, myalgia. Undercooked meat (especially pork)"
      - kind: figure
        title: "الـ filariae: عضة ← مكان"
        svg: |-
