  - id: mic.L04.lesson4
    title: "Tapeworms و flukes و ectoparasites"
    hook: "سمك، خنزير، كلاب، وحلزون في الترعة: والـ praziquantel بيحل أغلبهم"
    minutes: 9
    pages: [157, 158]
    topics: [cestodes, trematodes, ectoparasites, parasite-hints]
    goals:
      - "تفرّق الـ Taenia اللي من اللحمة من اللي من البيض"
      - "تعرف Diphyllobothrium و Echinococcus و Schistosoma و Clonorchis"
      - "تعالج الـ scabies والقمل والبق"
    status: unverified
    steps:
      - kind: explain
        title: "Taenia solium: لحمة ولا بيض؟"
        text: |-
          - تاكل ==larvae== في لحمة خنزير مش مستوية ← tapeworm في الأمعاء. Praziquantel.
          - تاكل ==eggs== في أكل متلوث ببراز بني آدم ← cysticercosis و ==neurocysticercosis== (cysts في المخ و seizures). Praziquantel، و albendazole للـ neurocysticercosis.
        page: 157
        quote: "Ingestion of eggs in food contaminated with human feces Praziquantel; albendazole for neurocysticercosis"
      - kind: explain
        title: "Diphyllobothrium و Echinococcus"
        text: |-
          - **Diphyllobothrium latum** ("DiphylloB12 latum"): من السمك الني (fresh water)، بينافس على الـ ==B12== ← megaloblastic anemia. Praziquantel أو niclosamide.
          - **Echinococcus granulosus**: بيض في أكل متلوث ببراز ==الكلاب==، والخروف intermediate host. يعمل hydatid cysts (==eggshell calcification==) في الكبد والرئة، ولو اتفتحت ← anaphylaxis. Albendazole، والجراحة للمعقدة.
        page: 157
        quote: "Vitamin B12 deficiency (“DiphylloB12 latum”; tapeworm competes for B12 in intestine) →  megaloblastic anemia"
      - kind: reveal
        prompt: "ليه بنحذر جداً قبل ما نبزل hydatid cyst بإبرة؟"
        answer: "لأن ==cyst rupture can cause anaphylaxis==. السائل اللي جوه antigenic جداً، ولو نزل في الدم أو البريتون ممكن يعمل صدمة."
        page: 157
        quote: "cyst rupture can cause anaphylaxis"
      - kind: check
        question: "A man who eats raw lake fish has a macrocytic anemia with hypersegmented neutrophils. Which worm?"
        options:
          - "Diphyllobothrium latum"
          - "Clonorchis sinensis"
          - "Ancylostoma duodenale"
          - "Taenia solium"
        answer: 0
        why:
          - "صح: بينافس على الـ B12 ← megaloblastic anemia."
          - "الـ Clonorchis من السمك كمان، بس بيعمل مرض صفراوي."
          - "الـ hookworm بيعمل microcytic anemia."
          - "الـ Taenia من الخنزير."
        page: 157
        quote: "Ingestion of larvae in raw freshwater fish"
      - kind: explain
        title: "Schistosoma: الحلزون والترعة"
        text: |-
          الـ snails هي الـ intermediate host، والـ cercariae بتخترق جلد اللي بيعوم أو يستحمى في مية عذبة ملوثة.

          - **S mansoni** (lateral spine) و **S japonicum**: الكبد والطحال، fibrosis، ==portal hypertension==، وإسهال و iron deficiency.
          - **S haematobium** (==terminal spine==): hematuria من غير ألم و ==squamous cell carcinoma== of the bladder، و pulmonary hypertension.

          العلاج: praziquantel.
        page: 157
        quote: "Snails are intermediate host; cercariae penetrate skin of humans in contact with contaminated fresh water (eg, swimming or bathing)"
      - kind: figure
        title: "البيضة بتقولك النوع"
        svg: |-
          <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fg-acc" cx="80" cy="60" rx="45" ry="25"/>
            <path class="fg-ink" d="M95,36 L110,12" fill="none" stroke-width="4"/>
            <text x="30" y="110" class="t-sm t-b">S mansoni</text>
            <text x="30" y="126" class="t-sm t-mut">lateral spine → liver</text>
            <ellipse class="fg-good" cx="250" cy="60" rx="45" ry="25"/>
            <path class="fg-ink" d="M295,60 L322,60" fill="none" stroke-width="4"/>
            <text x="200" y="110" class="t-sm t-b">S haematobium</text>
            <text x="200" y="126" class="t-sm t-mut">terminal spine → bladder</text>
          </svg>
        caption: "الشوكة على الجنب = S mansoni (الكبد و portal hypertension). الشوكة في الطرف = S haematobium (المثانة و SCC)."
        alt: "Two schistosome eggs. Left, S mansoni egg with a lateral spine, linked to liver disease. Right, S haematobium egg with a terminal spine, linked to bladder disease."
        page: 157
        quote: "Chronic infection with S haematobium (egg with terminal spine B ) can lead to squamous cell carcinoma of the bladder (painless hematuria)"
      - kind: explain
        title: "Clonorchis sinensis"
        text: "من السمك المش مستوي. بيعمل التهاب في القنوات المرارية ← ==pigmented gallstones==، ومرتبط بالـ ==cholangiocarcinoma==. العلاج praziquantel."
        page: 157
        quote: "Biliary tract inflammation →  pigmented gallstones Associated with cholangiocarcinoma"
      - kind: explain
        title: "Scabies"
        text: |-
          الـ mite بيحفر في الـ ==stratum corneum==: حكة ==بالليل== و burrows متعرّجة بين الصوابع. في الأطفال والأماكن الزحمة (سجون، دور مسنين)، بالـ skin-to-skin غالباً.

          العلاج: permethrin cream أو oral ivermectin، واغسل الهدوم والملايات، وعالج المخالطين.
        page: 158
        quote: "Common in children, crowded populations (jails, nursing homes); transmission through skin-to-skin contact (most common) or via fomites."
      - kind: explain
        title: "القمل والبق"
        text: |-
          **القمل** بيمص دم ويعمل حكة شديدة: الراس والرقبة، الوسط والإبط، أو العانة. وقمل الجسم بينقل ==R prowazekii== (epidemic typhus)، و B recurrentis (relapsing fever)، و ==B quintana== (trench fever). العلاج pyrethroids أو malathion أو ivermectin lotion، ومشط للـ nits. والطفل يكمّل مدرسته عادي.

          **البق (Cimex)**: عضات من غير ألم، papules فيها نقطة نزيف في النص، على شكل خط أو مجموعة لما تصحى. بتخف لوحدها في أسبوع، والمهم نتخلص من البق.
        page: 158
        quote: "Body lice can transmit Rickettsia prowazekii (epidemic typhus), Borrelia recurrentis (relapsing fever), Bartonella quintana (trench fever)."
      - kind: sort
        prompt: "رتّب كل علامة تحت الطفيل بتاعها"
        bins: ["Schistosoma haematobium", "Clonorchis sinensis", "Echinococcus granulosus"]
        cards:
          - { text: "Painless hematuria", bin: 0 }
          - { text: "Squamous cell bladder cancer", bin: 0 }
          - { text: "Pigmented gallstones", bin: 1 }
          - { text: "Cholangiocarcinoma", bin: 1 }
          - { text: "Hydatid liver cyst", bin: 2 }
          - { text: "Exposure to infected dogs", bin: 2 }
        why: "الـ haematobium في المثانة، الـ Clonorchis في القنوات المرارية، والـ Echinococcus من الكلاب في الكبد."
        page: 158
        quote: "Biliary tract disease, cholangiocarcinoma Clonorchis sinensis"
      - kind: try
        items: [mic.L04.055, mic.L04.058, mic.L04.064, mic.L04.071, mic.L04.072]
    recap:
      - "T solium: larvae في الخنزير ← دودة؛ eggs في براز آدمي ← neurocysticercosis (albendazole)."
      - "Diphyllobothrium: سمك ← B12. Echinococcus: كلاب وخرفان ← hydatid cyst، anaphylaxis لو اتفتح."
      - "Schisto: حلزون ومية عذبة؛ mansoni ← portal HTN؛ haematobium ← bladder SCC. Clonorchis ← cholangiocarcinoma. Praziquantel."
      - "Scabies: permethrin ومخالطين. قمل الجسم: typhus و trench fever. البق: يخف في أسبوع."
