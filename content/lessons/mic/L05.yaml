  - id: mic.L05.lesson7
    title: "الـ Hepatitis viruses"
    hook: "خمس حروف، والفرق بينهم في طريق العدوى والـ carrier والـ serology"
    minutes: 10
    pages: [170, 171]
    topics: [hepatitis-viruses, hepatitis-extrahepatic, hepatitis-serology]
    goals:
      - "تقارن A و B و C و D و E"
      - "تقرا الـ HBV serology"
      - "تعرف الـ extrahepatic manifestations للـ B والـ C"
    status: unverified
    steps:
      - kind: explain
        title: "الحروف المتحركة في الأمعاء"
        text: |-
          كلهم: fever، jaundice، ↑ ALT و AST.

          الـ ==HAV و HEV naked== (من غير envelope)، فالأمعاء ما بتدمرهمش، وبيتنقلوا fecal-oral: ==the vowels hit your bowels==.
        page: 170
        quote: "NAkEd viruses (HAV and HEV) lack an envelope and are not destroyed by the gut: the vowels hit your bowels."
      - kind: table
        title: "المقارنة"
        columns: ["", "Spread", "Carrier / chronic", "HCC"]
        rows:
          - ["HAV", "Fecal-oral", "No carrier", "No"]
          - ["HBV", "Blood, Bedroom, Birthing", "Carrier common", "Yes"]
          - ["HCV", "Mainly blood (IDU)", "Most become chronic", "Yes"]
          - ["HDV", "Parenteral, sexual, perinatal", "Needs HBV", "Yes"]
          - ["HEV", "Waterborne", "No carrier; deadly in pregnancy", "No"]
        hide: [[0, 1], [1, 1], [2, 2], [4, 2], [0, 3], [4, 3]]
        page: 170
        quote: "Parenteral (Blood), sexual (Bedroom), perinatal (Birthing)"
      - kind: explain
        title: "ليه الـ HCV بيفضل؟"
        text: "الـ HCV ما عندوش ==3′-5′ exonuclease==، يعني مافيش proofreading، فالـ envelope proteins بتتغيّر طول الوقت، والـ antibodies ==دايماً متأخرة== عن الـ strains الجديدة. عشان كده أغلب المرضى بيبقوا chronic."
        page: 170
        quote: "Host antibody production lags behind production of new mutant strains of HCV."
      - kind: explain
        title: "HDV: superinfection ولا coinfection؟"
        text: |-
          الـ HDV defective، محتاج الـ ==HBsAg== من الـ HBV عشان يدخل الخلايا.

          - **Coinfection** (الاتنين مع بعض): incubation طويلة.
          - **Superinfection** (الـ D على B موجود): incubation قصيرة و ==prognosis أسوأ==.
        page: 170
        quote: "Defective virus, Depends on HBV HBsAg coat for entry into hepatocytes"
      - kind: explain
        title: "الـ biopsy"
        text: |-
          - **HAV**: hepatocyte swelling و ==Councilman bodies==.
          - **HBV**: ==ground glass== من تراكم الـ surface antigen، والـ cytotoxic T cells هي اللي بتعمل الضرر.
          - **HCV**: lymphoid aggregates مع macrovesicular steatosis.
          - **HEV**: patchy necrosis.
        page: 170
        quote: "Lymphoid aggregates with focal areas of macrovesicular steatosis"
      - kind: check
        question: "A pregnant woman develops fulminant hepatitis after an outbreak from contaminated water in Asia. Which virus?"
        options:
          - "HEV"
          - "HAV"
          - "HBV"
          - "HDV"
        answer: 0
        why:
          - "صح: Fulminant hepatitis in Expectant patients، waterborne، epidemic في آسيا."
          - "الـ HAV fecal-oral بس مش ده الـ classic في الحمل."
          - "الـ HBV بالدم والجنس."
          - "الـ HDV محتاج HBV."
        page: 170
        quote: "Fulminant hepatitis in Expectant (pregnant) patients"
      - kind: table
        title: "برّه الكبد"
        columns: ["", "Hepatitis B", "Hepatitis C"]
        rows:
          - ["Renal", "Membranous > MPGN", "MPGN > membranous"]
          - ["Vascular", "Polyarteritis nodosa", "Leukocytoclastic vasculitis"]
          - ["Blood", "Aplastic anemia", "Mixed cryoglobulinemia, B-cell NHL, ITP"]
          - ["Skin, endocrine", "-", "Porphyria cutanea tarda, lichen planus, diabetes, hypothyroidism"]
        hide: [[0, 1], [0, 2], [1, 1], [2, 2]]
        page: 171
        quote: "Polyarteritis nodosa Leukocytoclastic vasculitis"
      - kind: explain
        title: "الـ markers"
        text: |-
          - ==HBsAg== ← فيه infection.
          - ==Anti-HBs== ← مناعة (تطعيم أو شفا).
          - **Anti-HBc**: IgM = حاد، IgG = قديم أو chronic.
          - ==HBeAg== ← replication نشط، عدوى عالية، prognosis أسوأ. وanti-HBe ← عدوى قليلة.
        page: 171
        quote: "Anti-HBs Antibody to HBsAg; indicates immunity to hepatitis B due to vaccination or recovery from infection."
      - kind: figure
        title: "الـ HBV مع الوقت"
        svg: |-
          <svg viewBox="0 0 360 176" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="140" x2="345" y2="140"/>
            <path class="fg-acc" d="M30,140 C70,40 120,40 160,140" fill="none" stroke-width="3"/>
            <text x="70" y="40" class="t-sm">HBsAg</text>
            <path class="fg-bad" d="M90,140 C120,60 230,60 340,95" fill="none" stroke-width="3"/>
            <text x="230" y="58" class="t-sm">anti-HBc</text>
            <path class="fg-good" d="M200,140 C240,90 290,80 340,75" fill="none" stroke-width="3"/>
            <text x="270" y="100" class="t-sm">anti-HBs</text>
            <rect class="fg-box" x="160" y="142" width="40" height="10"/>
            <text x="150" y="166" class="t-sm t-mut">window</text>
            <text x="30" y="166" class="t-sm t-mut">acute</text>
            <text x="270" y="166" class="t-sm t-mut">recovery</text>
          </svg>
        caption: "الـ HBsAg بيطلع الأول وبينزل، والـ anti-HBs بيطلع متأخر. الفترة اللي بينهم هي الـ window، وفيها الـ IgM anti-HBc بس."
        alt: "Hepatitis B serology over months. HBsAg rises and falls during acute infection. Anti-HBc rises and stays. Anti-HBs appears later in recovery. Between HBsAg falling and anti-HBs rising is the window period, when only anti-HBc is detectable."
        page: 171
        quote: "IgM anti-HBc may be the sole ⊕ marker of infection during window period."
      - kind: check
        question: "HBsAg ⊝, anti-HBs ⊝, IgM anti-HBc ⊕. What does this mean?"
        options:
          - "Window period of acute infection"
          - "Immunized by vaccine"
          - "Chronic infection with high infectivity"
          - "Recovered long ago"
        answer: 0
        why:
          - "صح: الـ IgM anti-HBc لوحده = window."
          - "التطعيم: anti-HBs بس."
          - "الـ chronic فيه HBsAg ⊕."
          - "الشفا القديم: anti-HBs و IgG anti-HBc."
        page: 171
        quote: "IgM = acute/recent infection; IgG = prior exposure or chronic infection."
