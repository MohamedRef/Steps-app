  - id: mic.L05.lesson4
    title: "الـ RNA viruses: الخريطة الكبيرة"
    hook: "كلهم في الـ cytoplasm إلا اتنين، والجدول ده بيتسأل منه حتة كل امتحان"
    minutes: 9
    pages: [164, 165]
    topics: [rna-viruses, picornavirus, rhinovirus, rotavirus]
    goals:
      - "تعرف الاستثناءات (retro و flu في النواة)"
      - "تربط كل عائلة بأمراضها"
      - "تفهم الـ picorna والـ rhino والـ rota"
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة والاستثناء"
        text: |-
          كل الـ RNA viruses بتتكاثر في الـ ==cytoplasm==، ما عدا الـ ==retrovirus والـ influenza== (في النواة).

          "Retro flu is outta cyt (sight)".
        page: 164
        quote: "All replicate in the cytoplasm (except retrovirus and influenza virus)."
      - kind: explain
        title: "الـ naked RNA viruses"
        text: |-
          أربعة بس من غير envelope:
          - **Reo** (ds، segmented): ==rotavirus==.
          - **Picorna**: polio، echo، rhino، coxsackie، HAV (==PERCH==).
          - **Hepe**: HEV.
          - **Calici**: ==norovirus==.

          والباقي كله enveloped.
        page: 164
        quote: "Caliciviruses No SS ⊕ linear Norovirus—viral gastroenteritis"
      - kind: explain
        title: "الـ ⊕ enveloped"
        text: |-
          - **Flavi**: HCV، yellow fever، dengue، ==West Nile== (meningoencephalitis و asymmetric flaccid paralysis)، Zika.
          - **Toga CREW**: Chikungunya، Rubella (كان toga، دلوقتي matonavirus)، Eastern و Western equine encephalitis.
          - **Retro**: reverse transcriptase؛ HTLV (T-cell leukemia) و HIV.
          - **Corona**: common cold، SARS، COVID-19، MERS.
        page: 164
        quote: "West Nile virusa —meningoencephalitis, acute asymmetric flaccid paralysis"
      - kind: explain
        title: "الـ ⊝ enveloped"
        text: |-
          - **Orthomyxo** (segmented): influenza.
          - **Paramyxo** (==PaRaMyxovirus==): Parainfluenza (croup)، RSV، Measles، Mumps.
          - **Rhabdo**: rabies. **Filo**: Ebola و Marburg.
          - **Arena** (segmented، circular): LCMV و Lassa (من القوارض).
          - **Bunya** (segmented): California encephalitis، Rift Valley، Crimean-Congo، و ==hantavirus==.
          - **Delta**: HDV "Defective"، محتاج HBV.
        page: 164
        quote: "PaRaMyxovirus: Parainfluenza—croup RSV—bronchiolitis in babies Measles, Mumps"
      - kind: check
        question: "Which RNA virus replicates in the nucleus?"
        options:
          - "Influenza virus"
          - "Rabies virus"
          - "Poliovirus"
          - "Measles virus"
        answer: 0
        why:
          - "صح: retro و flu بس في النواة."
          - "الـ rabies في الـ cytoplasm."
          - "الـ polio في الـ cytoplasm."
          - "الـ measles في الـ cytoplasm."
        page: 164
        quote: "“Retro flu is outta cyt (sight).”"
      - kind: explain
        title: "Picornavirus: pico = صغير"
        text: |-
          الـ RNA بيتترجم لـ ==polypeptide واحد كبير== وبعدين proteases بتاعة الفيروس تقطّعه.

          الـ polio والـ echo والـ coxsackie ==enteroviruses== وبيعملوا aseptic meningitis. والـ coxsackie كمان: herpangina، hand-foot-and-mouth، myocarditis، pericarditis.
        page: 165
        quote: "RNA is translated into 1 large polypeptide that is cleaved by virus-encoded proteases into functional viral proteins."
      - kind: reveal
        prompt: "الـ rhinovirus picornavirus زي الـ polio والـ coxsackie، طب ليه ما بيعملش إسهال؟"
        answer: |-
          لأنه ==acid labile==، الحمض في المعدة بيدمّره، فما بيوصلش الأمعاء. عشان كده بيفضل في الأنف (common cold)، وعنده أكتر من 100 serotype. "Rhino has a runny nose".
        page: 165
        quote: "Acid labile—destroyed by stomach acid; therefore, does not infect the GI tract (unlike the other picornaviruses)."
      - kind: explain
        title: "Rotavirus: right out the anus"
        text: |-
          reovirus، segmented dsRNA. ==أهم سبب لإسهال الأطفال في العالم==، وفي أمريكا في الشتا في الحضانات.

          الآلية: ==villous destruction== مع atrophy ← ↓ امتصاص Na+ وفقد K+.
        page: 165
        quote: "Villous destruction with atrophy leads to ↓ absorption of Na+ and loss of K+"
      - kind: figure
        title: "الـ RNA viruses حسب الـ envelope والـ strand"
        svg: |-
          <svg viewBox="0 0 360 182" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">naked</text>
            <text x="10" y="36" class="t-sm">Reo (ds) · Picorna · Hepe · Calici</text>
            <text x="10" y="66" class="t-sm t-b">enveloped ⊕</text>
            <text x="10" y="84" class="t-sm">Flavi · Toga · Retro · Corona</text>
            <text x="10" y="114" class="t-sm t-b">enveloped ⊝</text>
            <text x="10" y="132" class="t-sm">Orthomyxo · Paramyxo · Rhabdo</text>
            <text x="10" y="150" class="t-sm">Filo · Arena · Bunya · Delta</text>
            <text x="10" y="170" class="t-sm t-mut">segmented: BOAR</text>
          </svg>
        caption: "أربعة naked (reo، picorna، hepe، calici). الـ enveloped ⊕: flavi، toga، retro، corona. الـ enveloped ⊝: الباقي."
        alt: "RNA virus families grouped. Naked: Reoviruses (double stranded, multisegmented), picorna, hepe, calici. Enveloped positive sense: flavi, toga, retro, corona. Enveloped negative sense: orthomyxo, paramyxo, rhabdo, filo, arena, bunya, delta. Segmented: bunya, orthomyxo, arena, reo."
        page: 164
        quote: "Reoviruses No DS linear Multisegmented"
      - kind: check
