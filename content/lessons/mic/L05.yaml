  - id: mic.L05.lesson5
    title: "الإنفلونزا وفيروسات الأطفال"
    hook: "flu، croup، حصبة، حصبة ألماني، نكاف: كل واحد ليه علامة لو شفتها تعرفه"
    minutes: 10
    pages: [166, 167]
    topics: [influenza, antigenic-shift-drift, rubella, paramyxoviruses, croup, measles, mumps]
    goals:
      - "تفهم الـ HA والـ NA والـ shift والـ drift"
      - "تفرّق الـ rubella من الـ measles وتعرف congenital rubella"
      - "تعرف الـ F protein والـ croup والـ mumps"
    status: unverified
    steps:
      - kind: explain
        title: "Influenza"
        text: |-
          orthomyxovirus: enveloped، ⊝ ssRNA، segmented. عليه:
          - **Hemagglutinin**: بيمسك ==sialic acid== ويدخّل الفيروس ("lets the virus in").
          - **Neuraminidase**: بيطلّع الـ virions الجديدة ("Neuraminidaways").

          العلاج supportive، و ±==oseltamivir أو zanamivir== (neuraminidase inhibitors).
        page: 166
        quote: "Treatment: supportive +/– neuraminidase inhibitor (eg, oseltamivir, zanamivir)."
      - kind: aside
        tone: trap
        text: "المريض اللي خف من الإنفلونزا ورجع تعب تاني بحرارة وبلغم صديدي: فكّر في ==bacterial superinfection==، وأشهرهم S aureus و S pneumoniae و H influenzae."
        page: 166
        quote: "Patients at risk for fatal bacterial superinfection, most commonly S aureus, S pneumoniae, and H influenzae."
      - kind: table
        title: "Shift ولا drift؟"
        columns: ["", "Shift", "Drift"]
        rows:
          - ["Mechanism", "2 segmented viruses in 1 cell reassort", "Random mutation in HA or NA"]
          - ["Change", "Dramatically different virus", "Minor change"]
          - ["Outcome", "Pandemics", "Seasonal epidemics"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
        page: 166
        quote: "Random mutation in hemagglutinin (HA) or neuraminidase (NA) genes →  minor changes in HA or NA protein (drift) occur frequently →  local seasonal outbreaks (epidemics)."
      - kind: explain
        title: "التطعيم"
        text: |-
          بيتغيّر كل سنة لأن الفيروس بيتغيّر بسرعة. الـ ==killed vaccine== هو الأكتر استخداماً.

          والـ live attenuated بيتاخد في الأنف: mutant ==temperature-sensitive== بيتكاثر في الأنف (البارد) بس مش في الرئة.
        page: 166
        quote: "Killed viral vaccine is most frequently used."
      - kind: explain
        title: "Rubella (German 3-day measles)"
        text: |-
          matonavirus. في الأطفال خفيف: fever، ==postauricular lymphadenopathy==، arthralgias، و rash ناعم يبدأ من الوش وينزل.

          بس في الحمل خطير (TORCH): ==sensorineural deafness، cataracts، PDA==، وممكن blueberry muffin من الـ extramedullary hematopoiesis في الجلد.
        page: 166
        quote: "Fever, postauricular and other lymphadenopathy, arthralgias, and fine, maculopapular rash that starts on face and spreads centrifugally to involve trunk and extremities"
      - kind: explain
        title: "Paramyxoviruses والـ F protein"
        text: |-
          parainfluenza، mumps، measles، RSV، و human metapneumovirus. كلهم ممكن يعملوا bronchiolitis أو pneumonia في الرُضّع.

          كلهم عليهم ==F (fusion) protein== بيلزّق خلايا الـ respiratory epithelium في بعض ← multinucleated cells. و ==palivizumab== (antibody ضد الـ F) بيحمي الـ preemies من RSV pneumonia.
        page: 166
        quote: "Palivizumab for paramyxovirus (RSV) prophylaxis in preemies."
      - kind: explain
        title: "Croup"
        text: "parainfluenza (عليه HA و NA زي الـ flu). كحة زي ==seal== و inspiratory stridor. الـ trachea والـ subglottis بيضيقوا ← ==steeple sign== على الـ x-ray."
        page: 167
        quote: "Narrowing of upper trachea and subglottis leads to characteristic steeple sign on x-ray"
      - kind: explain
        title: "Measles (rubeola)"
        text: |-
          prodrome: fever مع الـ 3 C's (cough، coryza، conjunctivitis)، وبعدين ==Koplik spots== (نقط حمرا نصها أزرق أبيض في الـ buccal mucosa)، وبعد يوم أو اتنين rash يبدأ من الراس وينزل.

          وفي الـ lymph nodes: ==Warthin-Finkeldey== giant cells.
        page: 167
        quote: "then eventually Koplik spots (bright red spots with blue-white center on buccal mucosa A ), followed 1-2 days later by a maculopapular rash that starts at the head/neck and spreads downward."
      - kind: check
        question: "Which intervention reduces measles mortality in malnourished children?"
        options:
          - "Vitamin A"
          - "Palivizumab"
          - "Oseltamivir"
          - "Vitamin D"
        answer: 0
        why:
          - "صح: الـ vitamin A بيقلل الـ morbidity والـ mortality، خصوصاً في سوء التغذية."
          - "الـ palivizumab للـ RSV في الـ preemies."
          - "الـ oseltamivir للـ influenza."
          - "مش مذكور للحصبة."
        page: 167
        quote: "Vitamin A supplementation can reduce morbidity and mortality from measles, particularly in malnourished children."
      - kind: explain
        title: "مضاعفات الحصبة"
        text: |-
          - ==SSPE==: تغيّر شخصية، dementia، autonomic dysfunction، وموت، بعد ==سنين==.
          - encephalitis (1:1000) بعد الـ rash بكام يوم.
          - giant cell pneumonia (في الـ immunosuppressed).
          - ADEM.

          و ==pneumonia أشهر سبب وفاة== من الحصبة في الأطفال.
        page: 167
        quote: "Pneumonia is the most common cause of measles-associated death in children."
      - kind: mnemonic
        word: "POMP"
        parts:
          - { key: "P", text: "Parotitis" }
          - { key: "O", text: "Orchitis" }
          - { key: "M", text: "aseptic Meningitis" }
          - { key: "P", text: "Pancreatitis" }
        hook: "Mumps makes your parotid glands and testes as big as POM-Poms. وممكن يعمل sterility بعد البلوغ."
        page: 167
        quote: "Symptoms: Parotitis A , Orchitis (inflammation of testes), aseptic Meningitis, and Pancreatitis."
      - kind: try
        items: [mic.L05.057, mic.L05.060, mic.L05.062, mic.L05.071, mic.L05.075]
    recap:
      - "Flu: HA يدخل، NA يطلّع، oseltamivir. Superinfection بـ S aureus. Shift = reassortment = pandemic، drift = mutation = epidemic."
      - "Rubella: postauricular nodes؛ congenital: deafness، cataracts، PDA، blueberry muffin."
      - "Paramyxo: F protein، palivizumab. Croup: steeple sign."
      - "Measles: 4 C's، Koplik، SSPE، vitamin A. Mumps: POM-Poms."
