  - id: mic.L05.lesson8
    title: "HIV: الفيروس والتشخيص والعدوى الانتهازية"
    hook: "رقم الـ CD4 بيقولك أنهي عدوى تستنى"
    minutes: 10
    pages: [172, 173]
    topics: [hiv, hiv-diagnosis, hiv-diseases]
    goals:
      - "تعرف جينات الـ HIV والـ coreceptors"
      - "ترتب خطوات التشخيص وتعرف تعريف الـ AIDS"
      - "تربط العدوى الانتهازية بحد الـ CD4+"
    status: unverified
    steps:
      - kind: explain
        title: "شكل الـ HIV"
        text: |-
          genome ==diploid== (نسختين RNA). وفيه 3 structural genes:
          - **env**: gp160 بيتقطع لـ ==gp120== (يمسك الـ CD4) و ==gp41== (fusion و entry).
          - **gag**: p24 (capsid) و p17 (matrix).
          - **pol**: Reverse transcriptase، Integrase، Protease: RIP "Pol" (Paul).
        page: 172
        quote: "gp41 (forty-one)—fusion and entry."
      - kind: explain
        title: "الـ coreceptors"
        text: |-
          مع الـ CD4، الفيروس محتاج coreceptor:
          - ==CCR5== على الـ macrophages (بدري).
          - ==CXCR4== على الـ T cells (متأخر).

          واللي عنده CCR5 mutation homozygous ← ==مناعة==، و heterozygous ← المرض أبطأ.
        page: 172
        quote: "Virus binds CD4 as well as a coreceptor, either CCR5 on macrophages (early infection) or CXCR4 on T cells (late infection)."
      - kind: order
        prompt: "رتّب خطوات تشخيص الـ HIV"
        steps:
          - "HIV-1/2 Ag/Ab combination immunoassay (p24 + antibodies)"
          - "If positive: HIV-1/HIV-2 antibody differentiation immunoassay"
          - "If differentiation is negative or indeterminate: HIV-1 NAT"
        why: "الـ screening الأول بالـ Ag/Ab، ولو ⊕ نأكد بالـ differentiation assay، ولو مش واضح (ممكن acute HIV) نعمل NAT."
        page: 172
        quote: "A positive screening test is followed by a confirmatory HIV-1/2 differentiation immunoassay."
      - kind: explain
        title: "حدود الـ tests"
        text: |-
          - الـ Ag/Ab ممكن ==يفوّت أول أسبوعين==، فهنا الـ ==NAAT== (qualitative) هو اللي يلقط الـ viremia.
          - الـ viral load (quantitative) لمتابعة العلاج والعدوى.
          - الـ Western blot خلاص ==مش recommended==.
          - الرضيع: ما ينفعش Ag/Ab بسبب antibodies الأم ← viral load.
        page: 172
        quote: "Western blot tests are no longer recommended by the CDC for confirmatory testing."
      - kind: explain
        title: "تعريف الـ AIDS"
        text: "==CD4+ ≤200== cells/mm3 (الطبيعي 500-1500)، أو HIV ⊕ مع ==AIDS-defining condition== زي الـ Pneumocystis pneumonia."
        page: 172
        quote: "AIDS diagnosis: ≤200 CD4+ cells/mm3"
      - kind: check
        question: "Which test is used to diagnose HIV in a 2-month-old born to a mother with HIV?"
        options:
          - "HIV viral load"
          - "HIV-1/2 Ag/Ab immunoassay"
          - "Western blot"
          - "CD4+ count"
        answer: 0
        why:
          - "صح: الـ viral load، لأن antibodies الأم بتبوّظ الـ Ag/Ab."
          - "الـ antibodies اللي هيلاقيها ممكن تكون من الأم."
          - "مش recommended."
          - "الـ CD4 مش تشخيص."
        page: 172
        quote: "HIV-1/2 Ag/Ab testing is not recommended in babies with suspected HIV due to maternally transferred antibody. Use HIV viral load instead."
      - kind: table
        title: "العدوى حسب الـ CD4+"
        columns: ["CD4+", "Think of"]
        rows:
          - ["<500", "Oral thrush, oral hairy leukoplakia, localized Kaposi, HPV cancer, TB reactivation"]
          - ["<200", "Histoplasma, HIV dementia/nephropathy, PML, disseminated Kaposi, Pneumocystis"]
          - ["<100", "Bartonella, Candida esophagitis, CMV, Cryptococcus, Cryptosporidium, EBV lymphoma, MAC (most common if <50), Toxoplasma"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 173
        quote: "Toxoplasma gondii Brain abscesses Multiple ring-enhancing lesions on MRI"
      - kind: aside
        tone: trap
        text: "الجدول فيه 3 مستويات بس: <500 و <200 و <100. الـ Toxoplasma تحت ==<100==. أما «<50» فدي ملاحظة على ==MAC== بس: أعراض عامة (fever، night sweats، weight loss، diarrhea) أو lymphadenitis، وأشهر ما يكون لما الـ CD4+ يبقى تحت 50."
        page: 173
        quote: "Most common if CD4+ cell count <50/mm"
      - kind: explain
        title: "أبيض في البق"
        text: |-
          - **Oral thrush** (Candida): ==بيتكشط==، و pseudohyphae.
          - **Oral hairy leukoplakia** (EBV): ==ما بيتكشطش==، على جنب اللسان.
        page: 173
        quote: "Candidaalbicans Oral thrush Scrapable white plaque, pseudohyphae on microscopy"
      - kind: explain
        title: "CMV تحت 100: CREEP"
        text: |-
          ==Colitis، Retinitis، Esophagitis، Encephalitis، Pneumonitis==.

          - الـ endoscopy: linear ulcers. الـ fundoscopy: cotton-wool spots.
          - الـ biopsy: owl eye inclusions.
        page: 173
        quote: "Colitis, Retinitis, Esophagitis, Encephalitis, Pneumonitis (CREEP)"
      - kind: explain
        title: "ring lesions في المخ"
        text: |-
          - **Toxoplasma** (تحت 100): ==multiple== ring-enhancing lesions.
          - **CNS lymphoma** (EBV، تحت 100): ring enhancing بس ممكن تبقى ==solitary==.
          - **PML** (JC، تحت 200): ==nonenhancing== demyelination.
        page: 173
        quote: "JC virus (reactivation) Progressive multifocal leukoencephalopathy Nonenhancing areas of demyelination on MRI"
      - kind: check
        question: "A patient with HIV has red-purple papules on the skin; biopsy shows neutrophilic inflammation, not spindle cells. Which organism?"
        options:
          - "Bartonella"
          - "HHV-8"
          - "Mycobacterium avium complex"
          - "Cryptococcus"
        answer: 0
        why:
          - "صح: bacillary angiomatosis، biopsy فيها neutrophils."
          - "الـ Kaposi فيه perivascular spindle cells."
          - "الـ MAC بيعمل أعراض عامة أو lymphadenitis."
          - "الـ Crypto بيعمل meningitis."
        page: 173
        quote: "Bartonella spp Bacillary angiomatosis Multiple red to purple papules or nodules Biopsy with neutrophilic inflammation"
      - kind: try
