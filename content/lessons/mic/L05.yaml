      - kind: reveal
        prompt: "ليه الـ dengue المرة التانية ممكن تبقى أخطر من الأولى؟"
        answer: "لو اتعديت بـ ==serotype مختلف==، الـ antibodies القديمة بتساعد الفيروس يدخل الخلايا بدل ما تحميك: ==antibody-dependent enhancement==. والنتيجة dengue hemorrhagic fever (نزيف و plasma leakage) وممكن dengue shock syndrome."
        page: 168
