      - kind: explain
        title: "Yellow fever"
        text: |-
          flavivirus من الـ Aedes، والـ reservoir قرود أو بني آدمين. flavi = أصفر.

          high fever، ==black vomitus==، jaundice، hemorrhage، backache. وفي الـ liver biopsy: ==Councilman bodies==. وفيه live attenuated vaccine للمسافرين.
        page: 168
        quote: "Symptoms: high fever, black vomitus, jaundice, hemorrhage, backache."
      - kind: explain
        title: "Zika"
        text: |-
          flavivirus من الـ Aedes، وكمان sexual و vertical. في الكبار: conjunctivitis و حرارة خفيفة و rash بيحك، وممكن ==Guillain-Barré==.

          في الحمل: congenital Zika: ==microcephaly==، ocular anomalies، motor abnormalities، والأشعة فيها ventriculomegaly و subcortical calcifications.
        page: 168
        quote: "May be complicated by Guillain-Barré syndrome."
      - kind: check
        question: "A newborn has microcephaly and subcortical calcifications. The mother had an itchy rash and red eyes in Brazil. Which virus?"
        options:
          - "Zika virus"
          - "Rubella virus"
          - "Dengue virus"
          - "Yellow fever virus"
        answer: 0
        why:
          - "صح: congenital Zika syndrome."
          - "الـ rubella: deafness، cataracts، PDA."
          - "الـ dengue مش بيعمل الصورة دي."
          - "الـ yellow fever بيعمل jaundice و black vomitus."
        page: 168
        quote: "brain imaging shows ventriculomegaly, subcortical calcifications A . Clinical features in the affected newborn include ▘ Microcephaly"
      - kind: explain
        title: "Rabies"
        text: |-
          فيروس شكله ==رصاصة==. بيمسك الـ ACh receptors ويطلع ==retrograde== على الـ axons (بالـ dynein) لحد الـ CNS، فالـ incubation طويلة.

          المرض: fever ← agitation، photophobia، hydrophobia، hypersalivation ← paralysis و coma وموت. والـ ==Negri bodies== في الـ Purkinje cells والـ hippocampus.
        page: 169
        quote: "Progression of disease: fever, malaise →  agitation, photophobia, hydrophobia, hypersalivation →  paralysis, coma →  death."
      - kind: figure
        title: "الـ rabies طالع على العصب"
