schema: steps.lesson/v1
lecture: mic.L05
lessons:
  - id: mic.L05.lesson1
    title: "الفيروس من جوه: الشكل والجينات"
    hook: "لو عرفت الـ genome والـ envelope، هتعرف نص الأسئلة من غير ما تحفظ أمراض"
    minutes: 8
    pages: [159, 160]
    topics: [viral-structure, viral-genetics, viral-genomes, viral-envelopes]
    goals:
      - "تفرّق recombination و reassortment و complementation و phenotypic mixing"
      - "تعرف ليه بعض الـ nucleic acids معدية لوحدها"
      - "تحفظ استثناءات الـ DNA والـ RNA viruses بالتحشيشات"
    status: unverified
    steps:
      - kind: explain
        title: "تلات أشكال"
        text: |-
          الفيروس capsid جواه nucleic acid، وساعات عليه **envelope** (lipid bilayer):

          - naked مع icosahedral capsid.
          - enveloped مع icosahedral capsid.
          - enveloped مع ==helical capsid==.
        page: 159
        quote: "Naked (nonenveloped) virus with icosahedral capsid Enveloped virus with icosahedral capsid Enveloped virus with helical capsid"
      - kind: table
        title: "أربع طرق الفيروسات بتتبادل بيها"
        columns: ["", "What happens", "Example"]
        rows:
          - ["Recombination", "Crossing over between homologous regions", "-"]
          - ["Reassortment", "Segmented genomes swap segments", "2009 H1N1; antigenic shift"]
          - ["Complementation", "One virus makes a protein the other lacks", "HDV uses HBsAg from HBV"]
          - ["Phenotypic mixing", "Genome A in coat B for one generation", "Coat B sets tropism"]
        hide: [[1, 1], [2, 2], [3, 1]]
        page: 159
        quote: "Reassortment When viruses with segmented genomes (eg, influenza virus) exchange genetic material."
      - kind: reveal
        prompt: "في الـ phenotypic mixing، الفيروس الهجين (genome A جوه coat B) هيصيب أنهي خلايا؟ وولاده هيبقى شكلهم إيه؟"
        answer: "هيصيب حسب ==coat B== (هو اللي بيحدد الـ tropism). بس ولاده هيبقى عليهم ==coat A==، لأن الـ genetic material بتاعه A، والتغيير ده مش بيتورث."
        page: 159
        quote: "Type B protein coat determines the tropism (infectivity) of the hybrid virus. Progeny from subsequent infection of a cell by progeny 1 will have a type A coat that is encoded by its type A genetic material."
      - kind: explain
        title: "ليه شوية nucleic acids معدية لوحدها؟"
        text: |-
          - **⊕ ssRNA** زي الـ mRNA، الخلية تترجمه على طول ← ==معدي==.
          - **dsDNA** أغلبه معدي (ما عدا الـ pox والـ HBV).
          - **⊝ ssRNA و dsRNA** ← ==مش معديين لوحدهم== لأن الخلية ما عندهاش الـ polymerase اللي يقلبهم. عشان كده الـ virion بتاع الـ ⊝ ssRNA شايل معاه RNA-dependent RNA polymerase.
        page: 160
        quote: "Virions of ⊝ strand ssRNA viruses carry RNA-dependent RNA polymerases to transcribe ⊝ strand to ⊕."
      - kind: explain
        title: "استثناءات الـ DNA والـ RNA"
        text: |-
          - كل الـ DNA viruses **ds** ما عدا ==Parvoviridae== (ss): "Part of a virus".
          - كلهم **linear** ما عدا papilloma و polyoma و hepadna (circular).
          - كل الـ RNA viruses **ss** ما عدا ==Reoviridae== (dsRNA): "Repeato-virus".
        page: 160
        quote: "All have ssRNA genomes except Reoviridae (dsRNA)."
      - kind: aside
        tone: tip
        text: |-
          تحشيشات الكتاب:
          - ⊕: ==While at a retro toga party, I drank flavored Corona and ate hippie California pickles== (retro، toga، flavi، corona، hepe، calici، picorna).
          - ⊝: Always bring polymerase or fail replication (arena، bunya، paramyxo، orthomyxo، filo، rhabdo).
          - Segmented: **BOAR** (Bunya، Orthomyxo، Arena، Reo).
        page: 160
        quote: "While at a retro toga party, I drank flavored Corona and ate hippie California pickles."
      - kind: check
        question: "Purified genomic RNA of which virus would be infectious if injected into a cell?"
        options:
          - "Poliovirus"
          - "Influenza virus"
          - "Rabies virus"
          - "Rotavirus"
        answer: 0
        why:
          - "صح: الـ polio picornavirus، ⊕ ssRNA، بيتترجم على طول."
          - "الـ influenza ⊝ ssRNA، محتاج الـ polymerase بتاعه."
          - "الـ rabies ⊝ ssRNA."
          - "الـ rotavirus dsRNA، مش معدي لوحده."
        page: 160
        quote: "Naked nucleic acids of most dsDNA viruses (except poxviruses and HBV) and ⊕ strand ssRNA viruses are infectious."
      - kind: figure
        title: "الـ envelope جاي منين"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="10" y="10" width="200" height="140" rx="16" fill="none"/>
            <circle class="fg-box" cx="80" cy="80" r="38"/>
            <text x="52" y="84" class="t-sm">nucleus</text>
            <circle class="fg-acc" cx="140" cy="60" r="8"/>
            <line class="fg-arrow" x1="120" y1="70" x2="133" y2="64"/>
            <circle class="fg-good" cx="225" cy="105" r="10"/>
            <line class="fg-arrow" x1="210" y1="105" x2="215" y2="105"/>
            <text x="222" y="40" class="t-sm t-b">herpes:</text>
            <text x="222" y="56" class="t-sm">nuclear membrane</text>
            <text x="222" y="132" class="t-sm t-b">most others:</text>
            <text x="222" y="148" class="t-sm">plasma membrane</text>
          </svg>
        caption: "أغلب الفيروسات بتاخد الـ envelope وهي طالعة من الـ plasma membrane. الـ herpesviruses بتاخده من الـ nuclear membrane."
        alt: "A cell with a nucleus. A herpesvirus particle buds from the nuclear membrane; most other enveloped viruses bud from the plasma membrane on their way out."
        page: 160
        quote: "Exceptions include herpesviruses, which acquire envelopes from nuclear membrane."
      - kind: explain
        title: "الـ DNA viruses اللي ليها envelope"
        text: |-
          تلاتة بس: ==herpes و hepadna و pox==. "have helpful protection". وأي DNA virus تاني (adeno، papilloma، polyoma، parvo) naked.
        page: 160
        quote: "Enveloped DNA viruses (herpesvirus, hepadnavirus, poxvirus) have helpful protection."
      - kind: try
        items: [mic.L05.002, mic.L05.006, mic.L05.009, mic.L05.011, mic.L05.013]
    recap:
      - "Reassortment = segmented = shift. Complementation = HDV مع HBV. Phenotypic mixing = coat مؤقت."
      - "⊕ ssRNA و أغلب الـ dsDNA معديين لوحدهم؛ ⊝ و dsRNA لأ."
      - "Parvo ss، Reo ds، papilloma/polyoma/hepadna circular. Segmented = BOAR."
      - "Herpes بياخد الـ envelope من النواة. Enveloped DNA = herpes، hepadna، pox."
    practice: [mic.L05.001, mic.L05.002, mic.L05.003, mic.L05.004, mic.L05.005, mic.L05.006, mic.L05.007, mic.L05.008, mic.L05.009, mic.L05.010, mic.L05.011, mic.L05.012, mic.L05.013, mic.L05.198, mic.L05.199, mic.L05.200, mic.L05.127, mic.L05.128, mic.L05.129, mic.L05.130, mic.L05.211]
  - id: mic.L05.lesson2
    title: "الـ DNA viruses"
    hook: "سبع عائلات بس، وكل واحدة ليها مرض أو اتنين بيتسألوا كل سنة"
    minutes: 8
    pages: [161, 161]
    topics: [dna-viruses]
    goals:
      - "تعرف الاستثناءات: pox برّه النواة، parvo ss"
      - "تعرف أمراض adeno و HPV و JC/BK و B19"
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة"
        text: |-
          كل الـ DNA viruses ==icosahedral== وبيتكاثروا ==في النواة==، ما عدا الـ poxvirus اللي بيتكاثر في الـ cytoplasm: "Pox is out of the box (nucleus)".
        page: 161
        quote: "All are icosahedral and replicate in the nucleus (except poxvirus)."
      - kind: explain
        title: "Pox و Hepadna"
        text: |-
          - **Poxvirus**: أكبر DNA virus. Smallpox اتمسح من العالم بالـ live attenuated vaccine. Cowpox (milkmaid blisters). و **molluscum contagiosum**: papule بلون الجلد في نصها ==umbilication==، والـ keratinocytes فيها molluscum bodies.
          - **Hepadnavirus (HBV)**: partially ds و circular، وهو ==مش retrovirus بس عنده reverse transcriptase==.
        page: 161
        quote: "Molluscum contagiosum—flesh-colored papule with central umbilication; keratinocytes contain molluscum bodies"
      - kind: explain
        title: "Adenovirus"
        text: |-
          naked و ds و linear. بيعمل:
          - febrile pharyngitis
          - ==acute hemorrhagic cystitis==
          - pneumonia
          - conjunctivitis (==pink eye==)
          - gastroenteritis
          - myocarditis
        page: 161
        quote: "Febrile pharyngitis B —sore throat Acute hemorrhagic cystitis Pneumonia Conjunctivitis—“pink eye” Gastroenteritis Myocarditis"
      - kind: explain
        title: "HPV و Polyoma"
        text: |-
          - **HPV**: warts (==1، 2، 6، 11==) و cancer (==16، 18==): cervical، anal، penile، oropharyngeal.
          - **JC virus**: PML في الـ immunocompromised. "Junky Cerebrum".
          - **BK virus**: في الـ transplant، بيضرب الكلية. "Bad Kidney".
        page: 161
        quote: "serotypes 1, 2, 6, 11 associated with warts; serotypes 16, 18 associated with cancer"
      - kind: check
        question: "A kidney transplant recipient has rising creatinine, and biopsy shows viral inclusions in tubular cells. Which virus?"
        options:
          - "BK virus"
          - "JC virus"
          - "Adenovirus"
          - "Parvovirus B19"
        answer: 0
        why:
          - "صح: BK = Bad Kidney في الـ transplant."
          - "الـ JC بيعمل PML في المخ."
          - "الـ adeno بيعمل hemorrhagic cystitis، مش ده الـ classic في الكلية المزروعة."
          - "الـ B19 بيضرب الـ RBC precursors."
        page: 161
        quote: "BK virus—transplant patients, commonly targets kidney"
      - kind: explain
        title: "Parvovirus B19: أصغر DNA virus"
        text: |-
          ss و linear (parvus = small). بيصيب ==RBC precursors== والـ endothelial cells ← تكسير RBCs:

          - أطفال: ==slapped cheek== (erythema infectiosum، fifth disease).
          - sickle cell: ==aplastic crisis==.
          - جنين: hydrops fetalis وموت.
          - كبار: pure RBC aplasia وأعراض شبه الـ rheumatoid arthritis.
        page: 161
        quote: "B19 virus—aplastic crises in sickle cell disease, “slapped cheek” rash in children (erythema infectiosum, or fifth disease)"
      - kind: figure
        title: "الـ DNA viruses على خريطة"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">enveloped</text>
            <rect class="fg-acc" x="10" y="26" width="100" height="26" rx="6"/>
            <text x="18" y="44" class="t-sm">Herpes</text>
            <rect class="fg-acc" x="120" y="26" width="100" height="26" rx="6"/>
            <text x="128" y="44" class="t-sm">Hepadna ○</text>
            <rect class="fg-acc" x="230" y="26" width="100" height="26" rx="6"/>
            <text x="238" y="44" class="t-sm">Pox (cyto)</text>
            <text x="10" y="80" class="t-sm t-b">naked</text>
            <rect class="fg-box" x="10" y="88" width="100" height="26" rx="6"/>
            <text x="18" y="106" class="t-sm">Adeno</text>
            <rect class="fg-box" x="120" y="88" width="100" height="26" rx="6"/>
            <text x="128" y="106" class="t-sm">Papilloma ○</text>
            <rect class="fg-box" x="230" y="88" width="100" height="26" rx="6"/>
            <text x="238" y="106" class="t-sm">Polyoma ○</text>
            <rect class="fg-good" x="10" y="122" width="100" height="26" rx="6"/>
            <text x="18" y="140" class="t-sm">Parvo (ss)</text>
            <text x="120" y="162" class="t-sm t-mut">○ = circular</text>
          </svg>
        caption: "تلاتة enveloped (herpes، hepadna، pox) وأربعة naked. الـ circular: hepadna و papilloma و polyoma. الـ pox في الـ cytoplasm، والـ parvo ss."
        alt: "DNA virus families. Enveloped: herpes, hepadna (circular), pox (replicates in cytoplasm). Naked: adeno, papilloma (circular), polyoma (circular), parvo (single stranded)."
        page: 161
        quote: "VIRAL FAMILY ENVELOPE DNA STRUCTURE MEDICAL IMPORTANCE Herpesviruses Yes DS and linear"
      - kind: check
        question: "A pregnant teacher is exposed to a child with a slapped cheek rash. Which fetal complication is the concern?"
        options:
          - "Hydrops fetalis"
          - "Cataracts and PDA"
          - "Microcephaly with subcortical calcifications"
          - "Chorioretinitis and hydrocephalus"
        answer: 0
        why:
          - "صح: B19 بيكسر الـ RBCs في الجنين ← hydrops fetalis."
          - "ده congenital rubella."
          - "ده congenital Zika."
          - "ده congenital Toxo."
        page: 161
        quote: "RBC destruction →  hydrops fetalis and death in fetus"
      - kind: try
        items: [mic.L05.014, mic.L05.016, mic.L05.018, mic.L05.020, mic.L05.021]
    recap:
      - "كلهم في النواة ما عدا pox. Parvo أصغرهم و ss، و pox أكبرهم."
      - "HBV مش retrovirus بس عنده reverse transcriptase."
      - "Adeno: pharyngitis، hemorrhagic cystitis، pink eye. HPV 6/11 warts، 16/18 cancer."
      - "JC = Junky Cerebrum (PML)، BK = Bad Kidney. B19: slapped cheek، aplastic crisis، hydrops."
    practice: [mic.L05.014, mic.L05.015, mic.L05.016, mic.L05.017, mic.L05.018, mic.L05.019, mic.L05.020, mic.L05.021, mic.L05.022, mic.L05.023, mic.L05.181, mic.L05.182, mic.L05.183, mic.L05.155, mic.L05.156, mic.L05.157, mic.L05.158, mic.L05.212, mic.L05.213]

  - id: mic.L05.lesson3
    title: "الـ Herpesviruses"
    hook: "تمن فيروسات بتستخبى جوه جسمك للأبد، وكل واحد عارف مكانه"
    minutes: 10
    pages: [162, 163]
    topics: [herpesviruses, hsv-identification, viral-receptors]
    goals:
      - "تعرف مكان الـ latency لكل herpesvirus"
      - "تشخّص الـ mono وتعرف أورام الـ EBV"
      - "تعرف CMV و roseola و HHV-8، وطرق تشخيص الـ HSV، والـ receptors"
    status: unverified
    steps:
      - kind: explain
        title: "HSV-1 و HSV-2"
        text: |-
          **HSV-1** (لعاب وإفرازات): gingivostomatitis، keratoconjunctivitis، cold sores، herpetic whitlow، ==temporal lobe encephalitis==، esophagitis، erythema multiforme. كامن في الـ ==trigeminal ganglia==.

          **HSV-2** (جنسي وولادة): herpes genitalis و neonatal herpes، والـ viral meningitis أكتر معاه. كامن في الـ ==sacral ganglia==.
        page: 162
        quote: "Herpes genitalis, neonatal herpes C Most commonly latent in sacral ganglia"
      - kind: aside
        tone: exam
        text: "الـ HSV-1 هو ==أشهر سبب للـ sporadic encephalitis==: altered mental status و seizures و aphasia. والكتاب بيقول إن الاتنين ممكن يصيبوا الأعضاء التناسلية وغيرها."
        page: 162
        quote: "Most common cause of sporadic encephalitis, can present as altered mental status, seizures, and/or aphasia"
      - kind: explain
        title: "VZV (HHV-3)"
        text: |-
          chickenpox وبعدين shingles، وممكن encephalitis و pneumonia. أشهر مضاعفة للـ shingles: ==post-herpetic neuralgia==.

          كامن في الـ dorsal root أو trigeminal ganglia، ولو مسك فرع ==CN V1== ← herpes zoster ophthalmicus.
        page: 162
        quote: "Most common complication of shingles is post- herpetic neuralgia"
      - kind: explain
        title: "EBV (HHV-4): kissing disease"
        text: |-
          **Mono**: fever، hepatosplenomegaly، pharyngitis، و lymphadenopathy (خصوصاً ==posterior cervical==). ممنوع contact sports لحد ما يخف بسبب خطر ==splenic rupture==.

          بيدخل الـ B cells من ==CD21==: "Must be 21 to drink Beer in a Barr".
        page: 162
        quote: "Infects B cells through CD21, “Must be 21 to drink Beer in a Barr”"
      - kind: reveal
        prompt: "مراهق عنده التهاب حلق اتعالج بـ amoxicillin على إنه strep، وطلعله rash في جسمه كله. إيه اللي حصل، والـ atypical lymphocytes في الـ smear إيه؟"
        answer: "ده mono من الـ EBV، والـ ==amoxicillin بيعمل maculopapular rash== فيه. والـ atypical lymphocytes ==مش B cells مصابة==، دي cytotoxic T cells بتتفاعل. والـ Monospot ⊕ (heterophile antibodies بتلزّق RBCs الخروف أو الحصان)."
        page: 162
        quote: "Use of amoxicillin (eg, for presumed strep pharyngitis) can cause maculopapular rash"
      - kind: explain
        title: "أورام الـ EBV"
        text: |-
          - lymphomas، زي ==endemic Burkitt lymphoma==.
          - ==nasopharyngeal carcinoma== (خصوصاً كبار آسيويين).
          - lymphoproliferative disease في الـ transplant.
        page: 162
        quote: "Associated with lymphomas (eg, endemic Burkitt lymphoma), nasopharyngeal carcinoma (especially Asian adults), lymphoproliferative disease in transplant patients"
      - kind: explain
        title: "CMV (HHV-5)"
        text: |-
          بيتنقل بكل طريقة: congenital، نقل دم، جنسي، لعاب، بول، transplant.

          - السليم: mono بس ==Monospot ⊝==.
          - الـ immunocompromised: pneumonia (transplant)، esophagitis، colitis، و ==AIDS retinitis== ("sightomegalovirus").
          - الخلايا فيها ==owl eye== intranuclear inclusions، وكامن في الـ mononuclear cells.
        page: 162
        quote: "Infected cells have characteristic “owl eye” intranuclear inclusions H Latent in mononuclear cells"
      - kind: check
        question: "A 19-year-old with mononucleosis-like illness has a negative Monospot test. Which virus is likely?"
        options:
          - "Cytomegalovirus"
          - "Epstein-Barr virus"
          - "HHV-8"
          - "HSV-2"
        answer: 0
        why:
          - "صح: الـ CMV بيعمل mono بـ Monospot ⊝ في السليم."
          - "الـ EBV Monospot ⊕."
          - "الـ HHV-8 بيعمل Kaposi sarcoma."
          - "الـ HSV-2 بيعمل herpes genitalis."
        page: 162
        quote: "Mononucleosis (⊝ Monospot) in immunocompetent patients"
      - kind: explain
        title: "HHV-6/7 و HHV-8"
        text: |-
          - **HHV-6** (و 7 أقل): ==roseola infantum==، حرارة عالية كام يوم ممكن تعمل تشنجات، وبعدها rash يبدأ من الجذع. تحت سنتين. "fever first, Rosy (rash) later".
          - **HHV-8** (جنسي): ==Kaposi sarcoma==، ورم من الـ endothelial cells، plaques بنفسجية، في الـ HIV والـ transplant.
        page: 162
        quote: "Kaposi sarcoma (neoplasm of endothelial cells). Seen in HIV/AIDS and transplant patients."
      - kind: figure
        title: "الـ latency"
        svg: |-
          <svg viewBox="0 0 360 176" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-box" cx="70" cy="40" r="28"/>
            <text x="55" y="45" class="t-sm">head</text>
            <rect class="fg-box" x="55" y="70" width="30" height="80" rx="8"/>
            <circle class="fg-acc" cx="95" cy="48" r="6"/>
            <circle class="fg-good" cx="70" cy="142" r="6"/>
            <circle class="fg-bad" cx="92" cy="100" r="6"/>
            <text x="130" y="40" class="t-sm">trigeminal: HSV-1 (VZV)</text>
            <text x="130" y="104" class="t-sm">dorsal root: VZV</text>
            <text x="130" y="146" class="t-sm">sacral: HSV-2</text>
            <text x="130" y="166" class="t-sm t-mut">CMV: mononuclear cells</text>
          </svg>
        caption: "الـ HSV-1 في الـ trigeminal، الـ HSV-2 في الـ sacral، الـ VZV في الـ dorsal root أو الـ trigeminal، والـ CMV في الـ mononuclear cells."
        alt: "Body outline with ganglia marked. Trigeminal ganglion holds latent HSV-1 and sometimes VZV, dorsal root ganglia hold VZV, sacral ganglia hold HSV-2, and CMV is latent in mononuclear cells."
        page: 162
        quote: "Latent in dorsal root or trigeminal ganglia; CN V1 branch involvement can cause herpes zoster ophthalmicus"
      - kind: explain
        title: "تشخيص الـ HSV"
        text: |-
          - ==PCR of skin lesions== هو الـ test of choice، و CSF PCR للـ encephalitis.
          - الـ **Tzanck test** (قديم): multinucleated giant cells في HSV-1 و HSV-2 و VZV.
          - ==Cowdry A== inclusions (intranuclear eosinophilic) في نفس التلاتة.
        page: 163
        quote: "Intranuclear eosinophilic Cowdry A inclusions also seen with HSV-1, HSV-2, VZV."
      - kind: match
        prompt: "وصّل الفيروس بالـ receptor"
        pairs:
          - ["EBV", "CD21"]
          - ["Parvovirus B19", "P antigen on RBCs"]
          - ["Rabies", "Nicotinic AChR"]
          - ["Rhinovirus", "ICAM-1"]
          - ["SARS-CoV-2", "ACE2"]
        why: "Beer in a Barr عند 21، الـ B19 بيمسك P antigen، الـ rabies بيمسك الـ AChR ويطلع على الأعصاب، I CAMe to see the rhino، والـ spike بيمسك ACE2."
        page: 163
        quote: "Rhinovirus ICAM-1 (I CAMe to see the rhino)"
      - kind: try
        items: [mic.L05.030, mic.L05.031, mic.L05.036, mic.L05.033, mic.L05.041]
    recap:
      - "HSV-1 trigeminal و encephalitis؛ HSV-2 sacral و meningitis؛ VZV dorsal root و post-herpetic neuralgia."
      - "EBV: CD21، posterior cervical nodes، splenic rupture، amoxicillin rash، atypical = T cells، Burkitt و nasopharyngeal."
      - "CMV: Monospot ⊝، retinitis، owl eye. HHV-6: roseola. HHV-8: Kaposi."
      - "HSV: PCR، Tzanck قديم، Cowdry A. Receptors: CD21، P antigen، AChR، ICAM-1، ACE2، CD4/CCR5/CXCR4."
