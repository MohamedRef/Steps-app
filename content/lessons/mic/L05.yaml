        alt: "Rabies virus enters at a bite, binds acetylcholine receptors, and travels retrograde up the nerve axon by dynein motors to the central nervous system."
        page: 169
        quote: "Travels to the CNS by migrating in a retrograde fashion (via dynein motors) up nerve axons after binding to ACh receptors."
      - kind: explain
        title: "الوقاية بعد التعرّض"
        text: |-
          نضّف الجرح، وادّي ==killed vaccine + rabies immunoglobulin== (passive-active immunity).

          وفي أمريكا الـ ==bat، raccoon، skunk== أكتر من الكلاب، وممكن aerosol في كهوف الخفافيش.
        page: 169
        quote: "Infection more commonly from bat, raccoon, and skunk bites than from dog bites in the United States"
      - kind: explain
        title: "Ebola"
        text: |-
          filovirus. بعد incubation لحد ==21 يوم==: أعراض زي الإنفلونزا فجأة، إسهال وترجيع، حرارة عالية، myalgia، وممكن DIC ونزيف و shock.

          RT-PCR في أول 48 ساعة. العدوى بالـ ==body fluids== والـ fomites (حتى الجثث) والخفافيش والقرود، وكتير في المستشفيات. الوقاية: تطعيم المخالطين، عزل، و barrier practices.
        page: 169
        quote: "Transmission requires direct contact with bodily fluids, fomites (including dead bodies), infected bats or primates (apes/monkeys); high incidence of healthcare-associated infection."
      - kind: explain
        title: "SARS-CoV-2"
        text: |-
          ⊕ ssRNA، بيتنقل بالـ droplets والـ aerosols والـ fomites. من الأعراض المميزة: ==anosmia و dysgeusia==.

          بيدخل بالـ ==spike protein على ACE2== (الرئة والأمعاء والقلب والكلى). والمضاعفات: pneumonia و hypercoagulability (DVT و PE و stroke) و myocardial injury.

          التشخيص NAAT، أو antigen test أسرع بس أقل sensitivity. والـ vaccines (mRNA و viral vector) بتعرض الـ spike.
        page: 169
        quote: "Host cell entry occurs by attachment of viral spike protein to ACE2 receptor on cell membranes"
      - kind: try
        items: [mic.L05.078, mic.L05.079, mic.L05.082, mic.L05.085, mic.L05.086]
    recap:
      - "Chikungunya: polyarthritis. Dengue: retro-orbital pain، ADE مع serotype تاني، hemorrhagic fever."
      - "Yellow fever: black vomitus، Councilman bodies. Zika: GBS و microcephaly."
      - "Rabies: bullet، Negri bodies، retrograde على الأعصاب، PEP = vaccine + immunoglobulin."
      - "Ebola: 21 يوم، DIC، body fluids. SARS-CoV-2: spike على ACE2."
