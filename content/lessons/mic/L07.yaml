      - kind: explain
        title: "Rifamycins"
        text: |-
          rifampin و rifabutin و rifapentine بيمنعوا الـ DNA-dependent RNA polymerase. الـ ==monotherapy بتعمل resistance بسرعة==.

          السمّية: hepatotoxicity بسيطة، ==CYP450 induction==، و ==red-orange== في سوايل الجسم (مش خطر).
        page: 192
        quote: "Minor hepatotoxicity, drug interactions (CYP450 induction), red-orange discoloration of body fluids"
      - kind: reveal
        prompt: "مريض HIV على protease inhibitor جاله TB. ليه بنختار rifabutin بدل rifampin؟"
        answer: "لأن الـ rifabutin ==CYP450 induction بتاعه أقل==، فما بيوطّيش مستوى الـ protease inhibitor زي الـ rifampin."
        page: 192
        quote: "Rifabutin favored over rifampin in patients with HIV infection due to less CYP450 induction"
      - kind: explain
        title: "Isoniazid: INH Injures Neurons and Hepatocytes"
        text: |-
          بيمنع الـ mycolic acid synthesis، ومحتاج ==katG== (catalase-peroxidase البكتيري) عشان يتفعّل، والمقاومة بـ mutations في katG.

          السمّية: نقص B6 (==peripheral neuropathy، sideroblastic anemia==)، hepatotoxicity، CYP450 inhibition، و drug-induced lupus. فلازم معاه pyridoxine. والـ overdose بيعمل seizures مش بتستجيب للـ benzodiazepines.
        page: 192
        quote: "Vitamin B6 deficiency (peripheral neuropathy, sideroblastic anemia), hepatotoxicity, drug interactions (CYP450 inhibition), drug-induced lupus"
      - kind: explain
        title: "Pyrazinamide و Ethambutol"
        text: |-
          **Pyrazinamide**: mechanism مش معروف، شغّال أحسن في الـ ==acidic pH== (الـ phagolysosomes). سمّيته hepatotoxicity و ==hyperuricemia==.

          **Ethambutol**: بيمنع arabinosyltransferase. سمّيته optic neuropathy (red-green color blindness)، "==eyethambutol==".
        page: 192
        quote: "Optic neuropathy (red-green color blindness or ↓ visual acuity, typically reversible)"
