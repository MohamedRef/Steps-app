  - id: mic.L07.lesson8
    title: "التعقيم، الحمل، الـ HIV والـ HCV"
    hook: "Safe children take really good care: تمن أدوية ممنوعة في الحمل في جملة واحدة"
    minutes: 10
    pages: [197, 200]
    topics: [disinfection, pregnancy-antimicrobials, hiv-therapy, hiv-prophylaxis, hcv-therapy]
    goals:
      - "تعرف المطهرات ومين فيهم sporicidal"
      - "تحفظ الأدوية الممنوعة في الحمل"
      - "ترتّب أدوية الـ HIV على دورة حياته، وأدوية الـ HCV على بروتيناته"
    status: unverified
    steps:
      - kind: explain
        title: "Disinfection و sterilization"
        text: |-
          الـ disinfection بيقلّل الميكروبات لمستوى آمن، والـ ==sterilization== بيقتل كل حاجة حتى الـ spores.

          الـ sporicidal: ==autoclave== (بخار مضغوط >120°C، وممكن ما يقتلش الـ prions)، chlorine، ethylene oxide، و hydrogen peroxide. والـ iodine "may be sporicidal".
        page: 197
        quote: "Pressurized steam at >120°C. May not reliably inactivate prions."
      - kind: sort
        prompt: "sporicidal ولا لأ؟"
        bins: ["Sporicidal", "Not sporicidal"]
        cards:
          - { text: "Ethylene oxide", bin: 0 }
          - { text: "Hydrogen peroxide", bin: 0 }
          - { text: "Chlorine", bin: 0 }
          - { text: "Alcohols", bin: 1 }
          - { text: "Chlorhexidine", bin: 1 }
          - { text: "Quaternary amines", bin: 1 }
        why: "الـ autoclave والـ chlorine والـ ethylene oxide والـ H2O2 عليهم علامة sporicidal. الكحول والـ chlorhexidine والـ quaternary amines بيضربوا الـ membrane بس."
        page: 197
        quote: "Quaternary amines Impair permeability of cell membranes."
      - kind: mnemonic
        word: "SAFCTRGC"
        parts:
          - { key: "S", text: "Sulfonamides: kernicterus" }
          - { key: "A", text: "Aminoglycosides: ototoxicity" }
          - { key: "F", text: "Fluoroquinolones: cartilage damage" }
          - { key: "C", text: "Clarithromycin: embryotoxic" }
          - { key: "T", text: "Tetracyclines: teeth, bone" }
          - { key: "R", text: "Ribavirin: teratogenic" }
          - { key: "G", text: "Griseofulvin: teratogenic" }
          - { key: "C", text: "Chloramphenicol: gray baby" }
        hook: "Safe children take really good care."
        page: 197
        quote: "Safe children take really good care."
      - kind: explain
        title: "ART"
        text: |-
          بيبدأ غالباً وقت التشخيص، وأقوى indication: AIDS-defining illness، CD4+ <500، أو viral load عالي.

          النظام ==3 أدوية==: ==2 NRTIs + integrase inhibitor== غالباً. والـ tenofovir + emtricitabine ينفعوا pre-exposure prophylaxis.
        page: 198
        quote: "Regimen consists of 3 drugs to prevent resistance: 2 NRTIs and preferably an integrase inhibitor."
      - kind: check
        question: "Which combination can be given as HIV pre-exposure prophylaxis?"
        options:
          - "Tenofovir + emtricitabine"
          - "Zidovudine + efavirenz"
          - "Ritonavir + darunavir"
          - "Maraviroc + enfuvirtide"
        answer: 0
        why:
          - "صح: الـ tenofovir + emtricitabine ينفعوا pre-exposure prophylaxis."
          - "الـ zidovudine للـ prophylaxis العامة وفي الحمل، مش ده."
          - "دي protease inhibitor مع booster."
          - "دول entry inhibitors."
        page: 198
        quote: "Tenofovir + emtricitabine can be administered as pre-exposure prophylaxis."
      - kind: figure
        title: "دورة الـ HIV والأدوية"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="20" width="160" height="150" rx="20"/>
            <text x="22" y="44" class="t-sm">Attachment</text>
            <text x="22" y="66" class="t-sm">Penetration</text>
            <text x="22" y="92" class="t-sm">Reverse transcription</text>
            <text x="22" y="118" class="t-sm">DNA integration</text>
            <text x="22" y="146" class="t-sm">Proteolytic processing</text>
            <text x="186" y="44" class="t-sm t-bad">✕ maraviroc (CCR5)</text>
            <text x="186" y="66" class="t-sm t-bad">✕ enfuvirtide (gp41)</text>
            <text x="186" y="92" class="t-sm t-bad">✕ NRTIs, NNRTIs</text>
            <text x="186" y="118" class="t-sm t-bad">✕ -tegravir</text>
            <text x="186" y="146" class="t-sm t-bad">✕ -navir</text>
          </svg>
        caption: "Maraviroc بيقفل الـ docking على الـ CCR5، و enfuvirtide بيقفل الـ fusion بالـ gp41، والـ NRTIs والـ NNRTIs على الـ reverse transcriptase، والـ -tegravir على الـ integrase، والـ -navir على الـ protease."
        alt: "HIV life cycle with drug targets: attachment blocked by maraviroc (CCR5), penetration blocked by enfuvirtide (gp41), reverse transcription blocked by NRTIs and NNRTIs, DNA integration blocked by integrase inhibitors (bictegravir, dolutegravir), proteolytic processing blocked by protease inhibitors (atazanavir, darunavir)."
        page: 199
        quote: "Reverse transcription DNA integration Transcription Translation Proteolytic processing"
      - kind: explain
        title: "NRTIs و NNRTIs"
        text: |-
          **NRTIs** (abacavir، emtricitabine، lamivudine، tenofovir، zidovudine): بيوقفوا الـ DNA chain لأن ==ما عندهمش 3′ OH==، ولازم يتعملهم phosphorylation. السمّية myelosuppression و nephrotoxicity.

          **NNRTIs** (doravirine، efavirenz، rilpivirine): بيمسكوا الـ reverse transcriptase في مكان تاني ومش محتاجين phosphorylation. rash و hepatotoxicity، والـ efavirenz vivid dreams.
        page: 198
        quote: "Bind to reverse transcriptase at site different from NRTIs. Do not require phosphorylation to be active or compete with nucleotides."
      - kind: reveal
        prompt: "قبل ما تكتب abacavir لمريض HIV، لازم تعمل تحليل إيه؟"
        answer: "==HLA-B*5701==. لو موجود، الـ abacavir ممنوع عشان خطر الـ ==hypersensitivity==."
        page: 198
        quote: "Abacavir contraindicated if patient has HLA-B*5701 mutation due to ↑ risk of hypersensitivity."
      - kind: explain
        title: "Integrase و protease و entry"
        text: |-
          **Integrase inhibitors** (bictegravir، dolutegravir): ↑ creatine kinase و weight gain.

          **Protease inhibitors** (-navir): كلهم محتاجين boosting بـ ritonavir أو cobicistat. السمّية ==hyperglycemia، dyslipidemia، lipodystrophy==. والـ rifampin بيقلّلهم، فاستعمل rifabutin.

          **Entry**: enfuvirtide على gp41 (fusion)، و maraviroc على CCR5 (docking).
        page: 198
        quote: "Hyperglycemia, dyslipidemia, lipodystrophy syndrome, GI intolerance (nausea, diarrhea)."
      - kind: check
        question: "A patient on ART develops lipodystrophy and new hyperglycemia. Which drug class is most likely?"
        options:
          - "Protease inhibitors"
          - "NRTIs"
          - "Integrase inhibitors"
          - "Fusion inhibitors"
        answer: 0
        why:
          - "صح: الـ -navir بيعملوا hyperglycemia و dyslipidemia و lipodystrophy."
          - "الـ NRTIs: myelosuppression و nephrotoxicity."
          - "الـ integrase inhibitors: CK و weight gain."
          - "الـ enfuvirtide: skin reaction مكان الحقنة."
        page: 198
        quote: "Navir (never) tease a protease."
      - kind: aside
        tone: exam
        text: "الـ prophylaxis في الـ HIV: CD4+ <200 = TMP-SMX للـ ==Pneumocystis==، و <100 = TMP-SMX للـ Pneumocystis والـ ==toxoplasmosis== كمان."
        page: 199
        quote: "CD4+ <100 cells/mm TMP-SMX Pneumocystis pneumonia and toxoplasmosis"
      - kind: match
        prompt: "وصّل دوا الـ HCV بهدفه"
        pairs:
          - ["Ledipasvir", "NS5A phosphoprotein"]
          - ["Sofosbuvir", "NS5B RNA polymerase"]
          - ["Glecaprevir", "NS3/4A protease"]
          - ["Ribavirin", "IMP dehydrogenase"]
        why: "-asvir على NS5A، -buvir على NS5B (polymerase، chain terminator)، -previr على الـ protease، والـ ribavirin بيقلّل الـ guanine nucleotides، وبيعمل hemolytic anemia و severe teratogen."
        page: 200
        quote: "Sofosbuvir Inhibits NS5B, an RNA-dependent RNA polymerase acting as a chain terminator"
      - kind: try
        items: [mic.L07.101, mic.L07.102, mic.L07.104, mic.L07.136, mic.L07.191]
    recap:
      - "Sporicidal: autoclave، chlorine، ethylene oxide، H2O2. الـ autoclave ممكن ما يقتلش الـ prions."
      - "الحمل: Safe children take really good care."
      - "ART = 2 NRTIs + integrase inhibitor. Abacavir و HLA-B*5701. PIs: hyperglycemia و lipodystrophy. CD4+ <200 TMP-SMX، <100 كمان toxo."
      - "HCV: -asvir NS5A، sofosbuvir NS5B، -previr NS3/4A، ribavirin IMP dehydrogenase."
