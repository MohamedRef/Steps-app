        alt: "Fungal sterol pathway: squalene to lanosterol (blocked by terbinafine at squalene epoxidase), lanosterol to ergosterol (blocked by azoles), ergosterol bound by amphotericin B and nystatin, and cell wall β-glucan synthesis blocked by echinocandins."
        page: 195
        quote: "Inhibit fungal sterol (ergosterol) synthesis by inhibiting the cytochrome P-450 enzyme that converts lanosterol to ergosterol."
      - kind: explain
        title: "Amphotericin B: amphoterrible"
        text: |-
          بيمسك الـ ==ergosterol== ويعمل pores. للـ serious systemic mycoses: Cryptococcus، Blastomyces، Coccidioides، Histoplasma، Candida، Mucor.

          السمّية: fever/chills ("shake and bake")، hypotension، ==nephrotoxicity==، arrhythmias، anemia. والـ hydration والـ liposomal بيقلّلوا السمّية.
        page: 194
        quote: "Fever/chills (“shake and bake”), hypotension, nephrotoxicity, arrhythmias, anemia, IV phlebitis (“amphoterrible”)."
      - kind: reveal
        prompt: "مريض على amphotericin B بقاله أسبوع، والـ potassium والـ magnesium نازلين. ليه، وتعمل إيه؟"
        answer: "الـ amphotericin بيغيّر ==renal tubule permeability== فبيضيّع K و Mg. لازم ==تعوّضهم==."
        page: 194
        quote: "because of altered renal tubule permeability."
      - kind: explain
        title: "Nystatin و Flucytosine"
        text: |-
          **Nystatin**: زي الـ amphotericin بس ==topical بس== لأنه سام. "swish and swallow" للـ thrush، وللـ diaper rash والـ vaginal candidiasis.

          **Flucytosine**: بيتحوّل لـ ==5-fluorouracil== بالـ cytosine deaminase. مع الـ amphotericin للـ cryptococcal meningitis، وسمّيته myelosuppression.
        page: 194
        quote: "“Swish and swallow” for oral candidiasis (thrush); topical for diaper rash or vaginal candidiasis."
      - kind: check
        question: "Which antifungal causes gynecomastia by inhibiting testosterone synthesis?"
        options:
          - "Ketoconazole"
          - "Terbinafine"
          - "Caspofungin"
          - "Nystatin"
        answer: 0
        why:
          - "صح: الـ azoles بيمنعوا الـ testosterone synthesis، خصوصاً الـ ketoconazole."
          - "الـ terbinafine سمّيته hepatotoxicity وتغيّر الطعم."
          - "الـ echinocandins: GI و flushing."
          - "الـ nystatin topical."
        page: 195
        quote: "Testosterone synthesis inhibition (gynecomastia, especially with ketoconazole)"
      - kind: table
        title: "مين لإيه"
        columns: ["Drug", "Use"]
        rows:
          - ["Fluconazole", "Cryptococcal suppression in HIV; Candida"]
          - ["Itraconazole", "Blastomyces, Coccidioides, Histoplasma, Sporothrix"]
          - ["Voriconazole", "Aspergillus, some Candida"]
          - ["Terbinafine", "Onychomycosis"]
          - ["Echinocandins", "Invasive aspergillosis, Candida"]
          - ["Griseofulvin", "Dermatophytes (tinea)"]
        hide: [[0, 1], [2, 1], [3, 1], [5, 1]]
        page: 195
        quote: "Voriconazole for Aspergillus and some Candida."
      - kind: explain
        title: "Griseofulvin"
        text: |-
          بيبوّظ الـ microtubules ويوقف الـ mitosis، وبيترسب في الـ ==keratin== (الضوافر). للـ dermatophytes بالبُق.

          سمّيته: ==teratogenic==، carcinogenic، disulfiram-like، وبيرفع الـ cytochrome P-450 فيسرّع كسر الـ warfarin.
        page: 195
        quote: "Interferes with microtubule function; disrupts mitosis. Deposits in keratin-containing tissues (eg, nails)."
      - kind: match
        prompt: "وصّل الطفيلي بالعلاج"
        pairs:
          - ["Toxoplasmosis", "Pyrimethamine-sulfadiazine"]
          - ["T brucei", "Suramin, melarsoprol"]
          - ["T cruzi", "Nifurtimox"]
          - ["Leishmaniasis", "Sodium stibogluconate"]
          - ["Scabies, lice", "Permethrin, malathion, ivermectin"]
        why: "Toxo بالـ pyrimethamine، النوم الأفريقي بالـ suramin، Chagas بالـ nifurtimox، الـ leishmania بالـ stibogluconate، والجرب والقمل بالـ permethrin."
        page: 195
        quote: "Pyrimethamine-sulfadiazine (toxoplasmosis), suramin and melarsoprol (Trypanosoma brucei), nifurtimox (T cruzi), sodium stibogluconate (leishmaniasis)."
      - kind: explain
        title: "Chloroquine"
        text: |-
          بيمنع تحويل الـ heme لـ ==hemozoin==، فالـ heme بيتراكم ويسمّم الـ plasmodium.

          لكل الأنواع ==ما عدا P falciparum== (عنده membrane pump بيطلّع الدوا). وسمّيته retinopathy (حسب الجرعة الكلية) و pruritus.
        page: 195
        quote: "Treatment of plasmodial species other than P falciparum (due to drug resistance from membrane pump that ↓ intracellular concentration of drug)."
      - kind: try
        items: [mic.L07.077, mic.L07.078, mic.L07.121, mic.L07.128, mic.L07.173]
    recap:
      - "Amphotericin و nystatin يمسكوا ergosterol، azoles يمنعوا lanosterol ← ergosterol، terbinafine يمنع squalene epoxidase، echinocandins يمنعوا β-glucan."
      - "Amphotericin: nephrotoxic و shake and bake. Azoles: gynecomastia و P-450. Griseofulvin: keratin، teratogenic، يسرّع الـ warfarin."
      - "Chloroquine: heme ← hemozoin، مش للـ falciparum، retinopathy. Nifurtimox للـ T cruzi."
