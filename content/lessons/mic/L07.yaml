  - id: mic.L07.lesson7
    title: "الديدان، الـ flu، والـ herpes"
    hook: "الـ acyclovir ذكي: ما بيشتغلش غير في الخلية المصابة، وده سر أمانه"
    minutes: 9
    pages: [196, 197]
    topics: [antihelminthic-therapy, neuraminidase-inhibitors, baloxavir, remdesivir, acyclovir, ganciclovir, foscarnet, cidofovir]
    goals:
      - "تعرف أدوية الديدان والـ influenza والـ COVID-19"
      - "تفهم ليه الـ acyclovir آمن ومش بيشتغل على الـ CMV"
      - "تفرّق الـ ganciclovir والـ foscarnet والـ cidofovir"
    status: unverified
    steps:
      - kind: explain
        title: "Antihelminthic therapy"
        text: |-
          pyrantel pamoate، ivermectin، ==mebendazole== (للـ "bendy worms"، بيبوّظ الـ microtubules)، praziquantel (بيرفع نفاذية الـ Ca)، و diethylcarbamazine.
        page: 196
        quote: "mebendazole (treats “bendy worms” by disrupting microtubules and cellular motility)"
      - kind: explain
        title: "الـ influenza"
        text: |-
          **Oseltamivir و zanamivir**: بيمنعوا الـ ==neuraminidase== فالفيروس الجديد ما يعرفش يطلع. للعلاج والوقاية من A و B، وأحسن في أول 48 ساعة.

          **Baloxavir**: بيمنع الـ ==cap snatching== endonuclease بتاع الـ RNA polymerase.
        page: 196
        quote: "Inhibit influenza neuraminidase →  ↓ release of progeny virus."
      - kind: check
        question: "Which influenza drug blocks cap snatching by the viral RNA polymerase?"
        options:
          - "Baloxavir"
          - "Oseltamivir"
          - "Zanamivir"
          - "Remdesivir"
        answer: 0
        why:
          - "صح: الـ baloxavir بيمنع الـ endonuclease اللي بيسرق الـ 5′ cap."
          - "الـ oseltamivir على الـ neuraminidase."
          - "الـ zanamivir على الـ neuraminidase."
          - "الـ remdesivir للـ COVID-19."
        page: 196
        quote: "Inhibits the “cap snatching” (transfer of the 5′ cap from cell mRNA onto viral mRNA) endonuclease activity"
      - kind: aside
        tone: tip
        text: "الـ remdesivir: prodrug لـ ==ATP analog==، بيمنع الـ RNA-dependent RNA polymerase وبيهرب من الـ proofreading بتاع الـ ExoN. لـ COVID-19 اللي محتاج مستشفى."
        page: 196
        quote: "Prodrug of an ATP analog. The active metabolite inhibits viral RNA-dependent RNA polymerase"
      - kind: figure
        title: "الـ acyclovir بيتفعّل إزاي"
        svg: |-
          <svg viewBox="0 0 360 184" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL07h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="30" class="t-sm t-b">Acyclovir</text>
            <line class="fg-arrow" x1="44" y1="38" x2="44" y2="70" marker-end="url(#micL07h)"/>
            <text x="60" y="58" class="t-sm t-acc">viral thymidine kinase</text>
            <text x="20" y="88" class="t-sm t-b">Acyclovir monophosphate</text>
            <line class="fg-arrow" x1="44" y1="96" x2="44" y2="128" marker-end="url(#micL07h)"/>
            <text x="60" y="116" class="t-sm t-mut">cellular enzymes</text>
            <text x="20" y="146" class="t-sm t-b">Acyclovir triphosphate</text>
            <text x="20" y="168" class="t-sm t-bad">✕ viral DNA polymerase</text>
          </svg>
        caption: "أول phosphate من الـ thymidine kinase بتاعة الفيروس بس، فالخلية السليمة ما بتفعّلوش. بعدين الخلية تكمّل الـ triphosphate، اللي بيوقف الـ viral DNA polymerase بالـ chain termination."
        alt: "Acyclovir is monophosphorylated by HSV or VZV thymidine kinase, then converted to the triphosphate by cellular enzymes; the triphosphate inhibits viral DNA polymerase by chain termination."
        page: 196
        quote: "Monophosphorylated by HSV/VZV thymidine kinase and not phosphorylated in uninfected cells →  few adverse effects."
      - kind: reveal
        prompt: "ليه الـ acyclovir ما بيشتغلش على الـ CMV؟"
        answer: "لأن الـ CMV ==ما عندوش الـ thymidine kinase== اللي بتعمل أول phosphate. عشان كده الـ CMV بياخد ganciclovir، اللي بيتفعّل بـ CMV viral kinase تانية."
        page: 196
        quote: "No activity against CMV because CMV lacks the thymidine kinase necessary to activate guanosine analogs."
      - kind: explain
        title: "Acyclovir: الاستخدام والسمّية"
        text: |-
          للـ HSV في الجلد والأعضاء التناسلية والـ ==encephalitis==، و prophylaxis. ==ما بيأثرش على الـ latent== HSV و VZV. الـ valacyclovir أحسن بالبُق، والـ famciclovir للـ zoster.

          السمّية: ==crystalline nephropathy== لو المريض مش متروّي. والمقاومة: thymidine kinase متغيرة.
        page: 196
        quote: "Obstructive crystalline nephropathy and acute kidney injury if not adequately hydrated."
      - kind: table
        title: "أدوية الـ CMV"
        columns: ["Drug", "Activation", "Key toxicity"]
        rows:
          - ["Ganciclovir", "CMV viral kinase", "Myelosuppression"]
          - ["Foscarnet", "None (pyrophosphate analog)", "Nephrotoxicity, electrolytes → seizures"]
          - ["Cidofovir", "No viral kinase", "Nephrotoxicity (give probenecid + saline)"]
        hide: [[0, 2], [1, 1], [2, 2]]
        page: 197
        quote: "Does not require any kinase activation. Foscarnet = pyrofosphate analog."
      - kind: check
        question: "HSV becomes resistant to acyclovir by mutating its thymidine kinase. Which drug still works?"
        options:
          - "Foscarnet"
          - "Valacyclovir"
          - "Famciclovir"
          - "Oseltamivir"
        answer: 0
        why:
          - "صح: الـ foscarnet ما محتاجش أي kinase، فهو للـ acyclovir-resistant HSV."
          - "الـ valacyclovir prodrug للـ acyclovir، نفس المشكلة."
          - "الـ famciclovir برضه محتاج الـ thymidine kinase."
          - "الـ oseltamivir للـ influenza."
        page: 197
        quote: "CMV retinitis in immunocompromised patients when ganciclovir fails; acyclovir-resistant HSV."
      - kind: try
        items: [mic.L07.089, mic.L07.090, mic.L07.130, mic.L07.133, mic.L07.184]
    recap:
      - "Mebendazole = bendy worms. Oseltamivir = neuraminidase. Baloxavir = cap snatching. Remdesivir = ATP analog."
      - "Acyclovir بيتفعّل بالـ thymidine kinase الفيروسية بس؛ مش للـ CMV ولا الـ latent؛ crystalline nephropathy."
      - "Ganciclovir: CMV kinase، myelosuppression. Foscarnet: pyrophosphate analog، من غير kinase. Cidofovir: nephrotoxic، مع probenecid."
