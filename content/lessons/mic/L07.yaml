  - id: mic.L07.lesson4
    title: "Polymyxins، الـ folate، والـ DNA"
    hook: "دواين بيقفلوا خط إنتاج الـ folate من الناحيتين، وتلاتة بيضربوا الـ DNA والـ membrane"
    minutes: 9
    pages: [189, 191]
    topics: [polymyxins, sulfonamides, dapsone, trimethoprim, fluoroquinolones, daptomycin, metronidazole]
    goals:
      - "ترتّب خط الـ folate وتعرف مين بيقفل فين"
      - "تحفظ سمّية الـ sulfa والـ TMP والـ FQ"
      - "تعرف الـ daptomycin والـ metronidazole بيستخدموا فين وما بيستخدموش فين"
    status: unverified
    steps:
      - kind: explain
        title: "Polymyxins"
        text: |-
          colistin (polymyxin E) و polymyxin B: cation polypeptides بتمسك الـ phospholipids في membrane الـ ==gram ⊝== وتخرمها.

          دول ==salvage therapy== للـ multidrug-resistant gram ⊝، وسمّيتهم nephrotoxicity، neurotoxicity، و respiratory failure.
        page: 189
        quote: "Salvage therapy for multidrug-resistant gram ⊝ bacteria (eg, P aeruginosa, E coli, K pneumoniae)."
      - kind: figure
        title: "خط الـ folate"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="micL07f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="24" class="t-sm t-b">PABA + pteridine</text>
            <line class="fg-arrow" x1="60" y1="32" x2="60" y2="62" marker-end="url(#micL07f)"/>
            <text x="20" y="80" class="t-sm t-b">Dihydropteroic acid</text>
            <line class="fg-arrow" x1="60" y1="88" x2="60" y2="112" marker-end="url(#micL07f)"/>
            <text x="20" y="130" class="t-sm t-b">Dihydrofolic acid</text>
            <line class="fg-arrow" x1="60" y1="138" x2="60" y2="166" marker-end="url(#micL07f)"/>
            <text x="20" y="184" class="t-sm t-b">Tetrahydrofolic acid</text>
            <text x="200" y="44" class="t-sm t-bad">✕ Sulfonamides,</text>
            <text x="214" y="60" class="t-sm t-bad">dapsone</text>
            <text x="200" y="146" class="t-sm t-bad">✕ Trimethoprim,</text>
            <text x="214" y="162" class="t-sm t-bad">pyrimethamine</text>
          </svg>
        caption: "الـ sulfonamides والـ dapsone بيقفلوا dihydropteroate synthase فوق، والـ trimethoprim والـ pyrimethamine بيقفلوا dihydrofolate reductase تحت. قفل الاتنين = sequential block."
        alt: "Folate pathway: PABA plus pteridine to dihydropteroic acid (blocked by sulfonamides and dapsone at dihydropteroate synthase), to dihydrofolic acid, to tetrahydrofolic acid (blocked by trimethoprim and pyrimethamine at dihydrofolate reductase)."
        page: 190
        quote: "Sulfonamides, dapsone Trimethoprim, pyrimethamine"
      - kind: check
        question: "Which enzyme do sulfonamides inhibit?"
        options:
          - "Dihydropteroate synthase"
          - "Dihydrofolate reductase"
          - "DNA gyrase"
          - "Transpeptidase"
        answer: 0
        why:
          - "صح: الـ sulfa والـ dapsone فوق، على dihydropteroate synthase."
          - "ده الـ trimethoprim والـ pyrimethamine."
          - "ده الـ fluoroquinolones."
          - "ده الـ β-lactams."
        page: 190
        quote: "Inhibit dihydropteroate synthase, thus inhibiting folate synthesis."
      - kind: explain
        title: "Sulfonamides"
        text: |-
          بيمنعوا ==dihydropteroate synthase==. bacteriostatic، وبيبقوا bactericidal مع الـ trimethoprim. للـ gram ⊕ و ⊝ و Nocardia، والـ TMP-SMX للـ simple UTI.

          السمّية كتير: Stevens-Johnson، ==hemolysis في G6PD deficiency==، ==kernicterus في الرضع==، nephrotoxicity، agranulocytosis، و optic neuritis.
        page: 190
        quote: "Inhibit dihydropteroate synthase, thus inhibiting folate synthesis."
      - kind: explain
        title: "Dapsone و Trimethoprim"
        text: |-
          **Dapsone**: زي الـ sulfa بس شكله مختلف. للـ ==leprosy== والـ Pneumocystis prophylaxis. وبيعمل hemolysis في G6PD و methemoglobinemia.

          **Trimethoprim**: بيمنع ==dihydrofolate reductase== البكتيري. والسمّية: hyperkalemia، megaloblastic anemia، leukopenia. "TMP Treats Marrow Poorly"، والـ leucovorin بيحمي.
        page: 190
        quote: "Inhibits bacterial dihydrofolate reductase."
      - kind: check
        question: "A patient on high-dose TMP-SMX develops hyperkalemia. Which drug class acts similarly?"
        options:
          - "Potassium-sparing diuretics"
          - "Loop diuretics"
          - "Thiazides"
          - "β-agonists"
        answer: 0
        why:
          - "صح: الـ trimethoprim بيعمل hyperkalemia بنفس طريقة الـ potassium-sparing diuretics."
          - "الـ loop بيقلّل البوتاسيوم."
          - "الـ thiazides بيقلّلوا البوتاسيوم."
          - "الـ β-agonists بيدخّلوا البوتاسيوم الخلايا."
        page: 190
        quote: "Hyperkalemia (at high doses; similar mechanism as potassium-sparing diuretics)"
      - kind: explain
        title: "Fluoroquinolones"
        text: |-
          بيمنعوا ==topoisomerase II (DNA gyrase) و topoisomerase IV==. bactericidal. والـ dairy والـ antacids بيقلّلوا الامتصاص جامد.

          للـ gram ⊝ rods في البول والـ GI (بما فيهم Pseudomonas)، والـ otitis externa، والـ community-acquired pneumonia.
        page: 191
        quote: "Inhibit prokaryotic enzymes topoisomerase II (DNA gyrase) and topoisomerase IV."
      - kind: reveal
        prompt: "راجل 70 سنة على prednisone أخد ciprofloxacin، وفجأة حس بفرقعة وألم ورا الكعب. إيه اللي حصل؟"
        answer: "==Tendon rupture== (الـ Achilles). الـ fluoroquinolones بتعمل tendonitis و tendon rupture فوق 60 سنة ومع الـ prednisone (Fluoroquinolones hurt attachments to your bones). وكمان ==ممنوعة تحت 18 سنة وفي الحمل== عشان الغضاريف."
        page: 191
        quote: "May cause tendonitis or tendon rupture in people >60 years old and in patients taking prednisone."
      - kind: explain
        title: "Daptomycin: Dapto-myo-skin"
        text: |-
          lipopeptide بيعمل channels في membrane الـ gram ⊕ cocci. للـ S aureus في الجلد (خصوصاً MRSA)، bacteremia، endocarditis، و VRE.

          وسمّيته ==myopathy و rhabdomyolysis==.
        page: 191
        quote: "is used for skin infections but can cause myopathy."
      - kind: reveal
        prompt: "الـ daptomycin بيقتل الـ MRSA في الدم والجلد. طب ليه ما بنستخدموش في الـ MRSA pneumonia؟"
        answer: "لأن الـ ==surfactant== في الرئة بيمسكه ويعطّله (inactivated by surfactant)."
        page: 191
        quote: "Not used for pneumonia (avidly binds to and is inactivated by surfactant)."
      - kind: mnemonic
        word: "GET GAP"
        parts:
          - { key: "G", text: "Giardia" }
          - { key: "E", text: "Entamoeba" }
          - { key: "T", text: "Trichomonas" }
          - { key: "G", text: "Gardnerella vaginalis" }
          - { key: "A", text: "Anaerobes (Bacteroides, C difficile)" }
          - { key: "P", text: "H Pylori triple therapy if penicillin allergic" }
        hook: "GET GAP on the Metro with metronidazole: free radicals بتضرب الـ DNA، تحت الـ diaphragm. ومع الكحول disulfiram-like reaction، وطعم معدني."
        page: 191
        quote: "GET GAP on the Metro with metronidazole!"
      - kind: try
        items: [mic.L07.049, mic.L07.050, mic.L07.056, mic.L07.057, mic.L07.058]
    recap:
      - "Polymyxins: salvage للـ gram ⊝، nephro و neurotoxic."
      - "Sulfa و dapsone على dihydropteroate synthase، TMP على DHF reductase. G6PD hemolysis، kernicterus، TMP Treats Marrow Poorly."
