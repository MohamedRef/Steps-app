schema: steps.lesson/v1
lecture: mic.L07
lessons:
  - id: mic.L07.lesson1
    title: "خريطة المضادات والـ penicillins"
    hook: "كل مضاد حيوي ليه هدف واحد في البكتيريا، اعرف الهدف تعرف نص الدوا"
    minutes: 9
    pages: [183, 184]
    topics: [antimicrobial-therapy, penicillin-g-v, aminopenicillins, antistaph-penicillins, piperacillin]
    goals:
      - "تحفظ خريطة الأهداف: cell wall، membrane، ribosome، DNA، folate"
      - "تفهم الـ penicillin بيقتل إزاي وبيتقاوم إزاي"
      - "تفرّق الـ aminopenicillins والـ antistaph والـ antipseudomonal"
    status: unverified
    steps:
      - kind: figure
        title: "البكتيريا والأهداف"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="90" y="30" width="180" height="140" rx="40"/>
            <rect class="fg-acc" x="102" y="42" width="156" height="116" rx="32"/>
            <text x="8" y="24" class="t-sm t-b">cell wall</text>
            <text x="8" y="40" class="t-sm t-mut">β-lactams, vanco</text>
            <text x="272" y="24" class="t-sm t-b">membrane</text>
            <text x="272" y="40" class="t-sm t-mut">polymyxin ⊝</text>
            <text x="272" y="56" class="t-sm t-mut">dapto ⊕</text>
            <text x="120" y="70" class="t-sm">30S / 50S</text>
            <text x="120" y="86" class="t-sm t-mut">ribosomes</text>
            <text x="120" y="112" class="t-sm">DNA</text>
            <text x="120" y="128" class="t-sm t-mut">FQ: gyrase</text>
            <text x="120" y="144" class="t-sm t-mut">metro: free radicals</text>
            <text x="8" y="186" class="t-sm t-b">folate: sulfa, TMP</text>
            <text x="250" y="186" class="t-sm t-b">RNA pol: rifampin</text>
          </svg>
        caption: "الجدار من بره (β-lactams و vancomycin)، الـ membrane (polymyxins للـ ⊝ و daptomycin للـ ⊕)، والريبوسوم، والـ DNA (الـ FQ على الـ gyrase، والـ metronidazole بالـ free radicals)، والـ folate، والـ RNA polymerase."
        alt: "Bacterial cell map: cell wall synthesis (β-lactams, vancomycin), membrane integrity (polymyxins gram negative, daptomycin gram positive), 30S and 50S ribosomes, DNA gyrase (fluoroquinolones) and DNA integrity (metronidazole), folic acid synthesis (sulfonamides, trimethoprim), mRNA synthesis (rifampin)."
        page: 183
        quote: "Daptomycin (gram ⊕) Polymyxins (gram ⊝)"
      - kind: explain
        title: "Penicillin G و V"
        text: |-
          الـ G بيتاخد IV أو IM، والـ V بالبُق. الاتنين ==prototype β-lactam==.

          الـ penicillin شبه الـ ==D-Ala-D-Ala==، فبيمسك الـ penicillin-binding proteins (الـ transpeptidases) ويوقف الـ cross-linking بتاع الـ peptidoglycan، وكمان بيشغّل الـ autolytic enzymes. الجدار بيضعف والبكتيريا بتنفجر.
        page: 183
        quote: "D-Ala-D-Ala structural analog. Bind penicillin-binding proteins (transpeptidases)."
      - kind: check
        question: "A child with strep throat gets oral penicillin. Which bacterial protein does the drug bind?"
        options:
          - "Transpeptidase (penicillin-binding protein)"
          - "D-Ala-D-Ala of cell wall precursors"
          - "DNA gyrase"
          - "30S ribosomal subunit"
        answer: 0
        why:
          - "صح: الـ penicillin بيمسك الـ PBPs (transpeptidases)."
          - "الـ D-Ala-D-Ala ده هدف الـ vancomycin. الـ penicillin نفسه شبه الـ D-Ala-D-Ala."
          - "الـ gyrase بتاع الـ fluoroquinolones."
          - "الـ 30S بتاع الـ aminoglycosides والـ tetracyclines."
        page: 183
        quote: "Bind penicillin-binding proteins (transpeptidases)."
      - kind: explain
        title: "بيعالج إيه"
        text: |-
          أغلبه للـ ==gram ⊕==: S pneumoniae، S pyogenes، Actinomyces. وكمان gram ⊝ cocci (أهمها N meningitidis) والـ spirochetes (أهمها ==T pallidum==).

          وهو sensitive للـ β-lactamase.
        page: 183
        quote: "Mostly used for gram ⊕ organisms (S pneumoniae, S pyogenes, Actinomyces). Also used for gram ⊝ cocci (mainly N meningitidis) and spirochetes (mainly T pallidum)."
      - kind: aside
        tone: exam
        text: "الـ adverse effects: hypersensitivity، ==direct Coombs ⊕ hemolytic anemia==، و drug-induced interstitial nephritis. والمقاومة: β-lactamase بيكسر الحلقة، أو mutations في الـ PBPs."
        page: 183
        quote: "Hypersensitivity reactions, direct Coombs ⊕ hemolytic anemia, drug-induced interstitial nephritis."
      - kind: check
        question: "A man on high-dose IV penicillin G develops fever, rash and rising creatinine with WBC casts. What is the most likely cause?"
        options:
          - "Drug-induced interstitial nephritis"
          - "Acute tubular necrosis from aminoglycosides"
          - "Crystalline nephropathy"
          - "Rhabdomyolysis"
        answer: 0
        why:
          - "صح: الـ penicillin بيعمل drug-induced interstitial nephritis."
          - "ما خدش aminoglycoside."
          - "دي بتاعة الـ acyclovir."
          - "دي بتاعة الـ daptomycin."
        page: 183
        quote: "drug-induced interstitial nephritis."
      - kind: explain
        title: "Aminopenicillins: amped-up penicillin"
        text: |-
          الـ ampicillin والـ amoxicillin: نفس الـ mechanism، بس ==spectrum أوسع==، ولسه penicillinase sensitive، عشان كده بنضيفلهم clavulanic acid.

          والـ amoxicillin الـ oral bioavailability بتاعته أحسن من الـ ampicillin.
        page: 184
        quote: "Amoxicillin has greater oral bioavailability than ampicillin."
      - kind: mnemonic
        word: "HHEELPSS"
        parts:
          - { key: "H", text: "H influenzae" }
          - { key: "H", text: "H pylori" }
          - { key: "E", text: "E coli" }
          - { key: "E", text: "Enterococci" }
          - { key: "L", text: "Listeria monocytogenes" }
          - { key: "P", text: "Proteus mirabilis" }
          - { key: "S", text: "Salmonella" }
          - { key: "S", text: "Shigella" }
        hook: "Ampicillin/amoxicillin HHEELPSS kill enterococci."
        page: 184
        quote: "Coverage: ampicillin/amoxicillin HHEELPSS kill enterococci."
      - kind: reveal
        prompt: "طفل عنده otitis media ما اتحسنش على amoxicillin لوحده. البكتيريا عملت إيه، وإيه الحل؟"
        answer: "البكتيريا عندها ==penicillinase== (نوع من الـ β-lactamase) بيكسر الـ β-lactam ring. الحل: نضيف ==clavulanic acid== يحمي الـ amoxicillin."
        page: 184
        quote: "Penicillinase (a type of β-lactamase) cleaves β-lactam ring."
      - kind: explain
        title: "Antistaph: naf for staph"
        text: |-
          الـ dicloxacillin والـ nafcillin والـ oxacillin: ==narrow spectrum==، بس penicillinase resistant لأن الـ ==bulky R group== بيمنع الـ β-lactamase يوصل للحلقة.

          للـ S aureus، ما عدا الـ MRSA، لأن الـ MRSA غيّر الـ PBP نفسه.
        page: 184
        quote: "penicillinase resistant because bulky R group blocks access of β-lactamase to β-lactam ring."
      - kind: explain
        title: "Piperacillin: الـ antipseudomonal"
        text: |-
          extended spectrum، بس penicillinase sensitive، فلازم ==مع β-lactamase inhibitor== (piperacillin-tazobactam).

          بيغطي ==Pseudomonas==، gram ⊝ rods، و anaerobes.
        page: 184
        quote: "Pseudomonas spp., gram ⊝ rods, anaerobes."
      - kind: sort
        prompt: "حط كل دوا في مجموعته"
        bins: ["Penicillinase sensitive", "Penicillinase resistant"]
        cards:
          - { text: "Amoxicillin", bin: 0 }
          - { text: "Piperacillin", bin: 0 }
          - { text: "Penicillin G", bin: 0 }
          - { text: "Nafcillin", bin: 1 }
          - { text: "Dicloxacillin", bin: 1 }
          - { text: "Oxacillin", bin: 1 }
        why: "الـ antistaph بس (diclox، naf، oxa) عندهم الـ bulky R group. الباقي محتاج clavulanate أو tazobactam."
        page: 184
        quote: "Penicillinase-resistant penicillins Dicloxacillin, nafcillin, oxacillin."
      - kind: try
        items: [mic.L07.004, mic.L07.106, mic.L07.107, mic.L07.108, mic.L07.109]
    recap:
      - "Penicillin = D-Ala-D-Ala analog، بيمسك الـ PBPs ويوقف الـ cross-linking."
      - "Penicillin G/V: gram ⊕، N meningitidis، T pallidum. Coombs ⊕ hemolysis و interstitial nephritis."
      - "Amoxicillin/ampicillin: HHEELPSS. Naf for staph (مش MRSA). Piperacillin + tazobactam للـ Pseudomonas."
    practice: [mic.L07.001, mic.L07.002, mic.L07.003, mic.L07.004, mic.L07.005, mic.L07.006, mic.L07.007, mic.L07.008, mic.L07.105, mic.L07.106, mic.L07.107, mic.L07.108, mic.L07.109]

  - id: mic.L07.lesson2
    title: "Cephalosporins لحد الـ vancomycin"
    hook: "خمس أجيال، كل جيل بيكسب حاجة ويخسر حاجة، والـ vancomycin واقف لوحده"
    minutes: 9
    pages: [185, 186]
    topics: [cephalosporins, beta-lactamase-inhibitors, carbapenems, aztreonam, vancomycin]
    goals:
      - "تعرف كل جيل cephalosporin بيغطي إيه، و LAME اللي ما بيغطوهاش"
      - "تفهم ليه الـ imipenem مع cilastatin، والـ aztreonam لمين"
      - "تفهم الـ vancomycin وإزاي الـ Enterococcus بيقاومه"
    status: unverified
    steps:
      - kind: explain
        title: "Cephalosporins"
        text: |-
          β-lactams بتوقف الـ cell wall synthesis، بس ==أقل تأثراً بالـ penicillinases==، و bactericidal.

          واللي الأجيال 1-4 ما بتغطيهوش: ==LAME==: Listeria، Atypicals (Chlamydia، Mycoplasma)، MRSA، Enterococci.
        page: 185
        quote: "Organisms typically not covered by 1st-4th generation cephalosporins are LAME"
      - kind: table
        title: "الأجيال"
        columns: ["", "Example", "Key coverage"]
        rows:
          - ["1st", "Cefazolin", "PEcK + gram ⊕ cocci; surgical prophylaxis"]
          - ["2nd", "Cefoxitin", "HENS PEcK + gram ⊕ cocci"]
          - ["3rd", "Ceftriaxone", "Serious gram ⊝; crosses BBB"]
          - ["4th", "Cefepime", "Gram ⊝ with ↑ Pseudomonas"]
          - ["5th", "Ceftaroline", "MRSA, E faecalis; no Pseudomonas"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
        page: 185
        quote: "unlike 1st-4th generation cephalosporins, ceftaroline covers MRSA, and Enterococcus faecalis—does not cover Pseudomonas."
      - kind: aside
        tone: tip
        text: "الـ 3rd generation: ==ceftriaxone== للـ meningitis والـ gonorrhea والـ disseminated Lyme، و ==ceftazidime for pseudomonaz==."
        page: 185
        quote: "Ceftriaxone—meningitis, gonorrhea, disseminated Lyme disease. Ceftazidime for pseudomonaz."
      - kind: explain
        title: "Adverse effects"
        text: |-
          hypersensitivity، autoimmune hemolytic anemia، ==disulfiram-like reaction==، و vitamin K deficiency. والـ cross-reactivity مع حساسية الـ penicillin قليلة.

          وبيزوّد ==nephrotoxicity الـ aminoglycosides==.
        page: 185
        quote: "↑ nephrotoxicity of aminoglycosides."
      - kind: check
        question: "Which cephalosporin covers MRSA?"
        options:
          - "Ceftaroline"
          - "Cefepime"
          - "Ceftriaxone"
          - "Cefazolin"
        answer: 0
        why:
          - "صح: الـ 5th generation بيغطي MRSA و E faecalis، بس مش Pseudomonas."
          - "الـ cefepime قوي على Pseudomonas، مش MRSA."
          - "الـ ceftriaxone مش بيغطي MRSA (LAME)."
          - "الـ cefazolin للـ MSSA قبل العمليات."
        page: 185
        quote: "ceftaroline covers MRSA"
      - kind: mnemonic
        word: "CAST"
        parts:
          - { key: "C", text: "Clavulanic acid" }
          - { key: "A", text: "Avibactam" }
          - { key: "S", text: "Sulbactam" }
          - { key: "T", text: "Tazobactam" }
        hook: "β-lactamase inhibitors: amoxicillin-clavulanate، ceftazidime-avibactam، ampicillin-sulbactam، piperacillin-tazobactam."
        page: 185
        quote: "Include Clavulanic acid, Avibactam, Sulbactam, Tazobactam."
      - kind: explain
        title: "Carbapenems"
        text: |-
          imipenem و meropenem و ertapenem: broad spectrum و β-lactamase resistant. الـ imipenem ==دايماً مع cilastatin== اللي بيمنع renal dehydropeptidase I: "the kill is lastin' with cilastatin".

          الـ ertapenem ما بيغطيش Pseudomonas. والسمّية: GI، rash، و ==seizures== في الجرعات العالية (الـ meropenem أقل).
        page: 186
        quote: "Always administered with cilastatin (inhibitor of renal dehydropeptidase I) to ↓ inactivation of drug in renal tubules."
      - kind: reveal
        prompt: "مريض على imipenem جرعة عالية جاله تشنجات، ولسه محتاج carbapenem. تختار إيه؟"
        answer: "==Meropenem==: الـ seizure risk بتاعه أقل، وكمان stable للـ dehydropeptidase I."
        page: 186
        quote: "Meropenem has a ↓ risk of seizures and is stable to dehydropeptidase I."
      - kind: explain
        title: "Aztreonam"
        text: |-
          monobactam، بيمسك PBP 3. ==gram ⊝ rods بس==، ما لوش دعوة بالـ gram ⊕ ولا الـ anaerobes.

          ==No cross-allergenicity with penicillins==، فهو للي عنده حساسية penicillin، أو renal insufficiency ومش هيستحمل aminoglycosides.
        page: 186
        quote: "Prevents peptidoglycan cross-linking by binding to penicillin-binding protein 3. Synergistic with aminoglycosides. No cross-allergenicity with penicillins."
      - kind: explain
        title: "Vancomycin"
        text: |-
          بيمسك الـ ==D-Ala-D-Ala== نفسه في الـ cell wall precursors (مش الـ PBP). gram ⊕ بس: MRSA، S epidermidis، Enterococcus الحساس، و C difficile (بالبُق).

          السمّية: nephrotoxicity، ototoxicity، thrombophlebitis، والـ ==vancomycin infusion reaction== (flushing، بيتمنع بـ antihistamines وتبطيء الـ infusion)، و DRESS.
        page: 186
        quote: "Inhibits cell wall peptidoglycan formation by binding D-Ala-D-Ala portion of cell wall precursors."
      - kind: reveal
        prompt: "الـ Enterococcus بقى مقاوم للـ vancomycin. غيّر إيه في نفسه؟"
        answer: "غيّر الـ ==D-Ala-D-Ala== لـ ==D-Ala-D-Lac==، فالـ vancomycin ما بقاش لاقي حاجة يمسكها. \"If you Lack a D-Ala (dollar), you can't ride the van.\""
        page: 186
        quote: "via amino acid modification of D-Ala-D-Ala to D-Ala-D-Lac."
      - kind: try
        items: [mic.L07.014, mic.L07.022, mic.L07.110, mic.L07.111, mic.L07.140]
    recap:
      - "LAME مش متغطية بالأجيال 1-4. الـ 5th (ceftaroline) بيغطي MRSA، مش Pseudomonas."
      - "CAST = β-lactamase inhibitors. Imipenem + cilastatin؛ seizures."
      - "Aztreonam: gram ⊝ rods بس، مافيش cross-allergy. Vancomycin: D-Ala-D-Ala، المقاومة D-Ala-D-Lac."
    practice: [mic.L07.009, mic.L07.010, mic.L07.011, mic.L07.012, mic.L07.013, mic.L07.014, mic.L07.015, mic.L07.016, mic.L07.017, mic.L07.018, mic.L07.019, mic.L07.020, mic.L07.021, mic.L07.022, mic.L07.110, mic.L07.111, mic.L07.112]

  - id: mic.L07.lesson3
    title: "الـ protein synthesis inhibitors"
    hook: "Buy at 30, ccel at 50: نص البيع والشرا في الريبوسوم"
    minutes: 10
    pages: [187, 189]
    topics: [protein-synthesis-inhibitors, aminoglycosides, tetracyclines, tigecycline, chloramphenicol, clindamycin, linezolid, macrolides]
    goals:
      - "تحفظ مين على الـ 30S ومين على الـ 50S"
      - "تعرف سمّية كل واحد، اللي بيتسأل عليها كل سنة"
      - "تفرّق الـ clindamycin فوق الـ diaphragm عن الـ metronidazole تحته"
    status: unverified
    steps:
      - kind: explain
        title: "ليه الريبوسوم هدف آمن"
        text: |-
          البكتيريا عندها ==70S== (30S + 50S)، والإنسان ==80S==، فالأدوية دي بتضرب البكتيريا بس.

          كلهم bacteriostatic، ما عدا الـ ==aminoglycosides== (bactericidal) والـ linezolid (variable).
        page: 187
        quote: "All are bacteriostatic, except aminoglycosides (bactericidal) and linezolid (variable)."
      - kind: figure
        title: "30S و 50S"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fg-acc" cx="120" cy="60" rx="80" ry="38"/>
            <ellipse class="fg-good" cx="120" cy="128" rx="66" ry="26"/>
            <text x="98" y="56" class="t-sm t-b">50S</text>
            <text x="98" y="132" class="t-sm t-b">30S</text>
            <text x="222" y="30" class="t-sm">Chloramphenicol</text>
            <text x="222" y="48" class="t-sm">Clindamycin</text>
            <text x="222" y="66" class="t-sm">Erythromycin</text>
            <text x="222" y="84" class="t-sm">Linezolid</text>
            <text x="222" y="122" class="t-sm">Aminoglycosides</text>
            <text x="222" y="140" class="t-sm">Tetracyclines</text>
          </svg>
        caption: "تحت (30S): aminoglycosides و tetracyclines. فوق (50S): chloramphenicol، clindamycin، erythromycin (macrolides)، linezolid."
        alt: "Bacterial ribosome with the 50S subunit on top and the 30S subunit below. 30S inhibitors are aminoglycosides and tetracyclines; 50S inhibitors are chloramphenicol, clindamycin, erythromycin (macrolides) and linezolid."
        page: 187
        quote: "30S inhibitors Aminoglycosides Tetracyclines “Buy at 30, ccel (sell) at 50.” 50S inhibitors Chloramphenicol, Clindamycin Erythromycin (macrolides) Linezolid"
      - kind: check
        question: "Which of these drugs binds the 30S subunit?"
        options:
          - "Doxycycline"
          - "Azithromycin"
          - "Clindamycin"
          - "Linezolid"
        answer: 0
        why:
          - "صح: الـ tetracyclines والـ aminoglycosides على الـ 30S (Buy at 30)."
          - "الـ macrolides على الـ 50S."
          - "الـ clindamycin على الـ 50S."
          - "الـ linezolid على الـ 50S."
        page: 187
        quote: "30S inhibitors Aminoglycosides Tetracyclines"
      - kind: explain
        title: "Aminoglycosides: Mean GNATS"
        text: |-
          gentamicin، neomycin، amikacin، tobramycin، streptomycin. بيمسكوا الـ 30S ويوقفوا الـ initiation complex، ويعملوا misreading.

          محتاجين ==O2 عشان يدخلوا==، فما بيقتلوش الـ anaerobes. للـ gram ⊝ rods الشديدة، و synergistic مع الـ β-lactams، والـ neomycin للـ bowel surgery.
        page: 187
        quote: "Require O2 for uptake; therefore ineffective against anaerobes."
      - kind: aside
        tone: trap
        text: "السمّية: ==nephrotoxicity==، ==neuromuscular blockade== (ممنوع تماماً مع الـ myasthenia gravis)، ototoxicity (خصوصاً مع الـ loop diuretics)، و teratogenicity."
        page: 187
        quote: "Nephrotoxicity, neuromuscular blockade (absolute contraindication with myasthenia gravis), ototoxicity (especially with loop diuretics), teratogenicity."
      - kind: reveal
        prompt: "مريض عنده heart failure على furosemide واتعالج بـ gentamicin. بعد أسبوع بيشتكي إن سمعه قل. ليه هو بالذات؟"
        answer: "الـ aminoglycosides بيعملوا ==ototoxicity==، والخطر بيزيد ==مع الـ loop diuretics== زي الـ furosemide."
        page: 187
        quote: "ototoxicity (especially with loop diuretics)"
      - kind: explain
        title: "Tetracyclines"
        text: |-
          بيمسكوا الـ 30S ويمنعوا الـ aminoacyl-tRNA يقعد. بيتجمعوا جوه الخلايا، فممتازين للـ ==Rickettsia و Chlamydia==، وكمان Borrelia، M pneumoniae، acne، والـ doxycycline للـ community-acquired MRSA.

          ما تاخدهمش مع لبن أو antacids أو حديد (الـ divalent cations بتمنع الامتصاص). والـ doxycycline بيطلع في البراز، فينفع في الـ renal failure.
        page: 188
        quote: "Drugs’ ability to accumulate intracellularly makes them very effective against Rickettsia and Chlamydia."
      - kind: check
        question: "A 7-year-old child should not get tetracycline. Why?"
        options:
          - "Teeth discoloration and inhibited bone growth"
          - "Gray baby syndrome"
          - "Cartilage damage"
          - "Ototoxicity"
        answer: 0
        why:
          - "صح: بيصبغ السنان ويوقف نمو العضم، ما عدا الـ doxycycline."
          - "ده الـ chloramphenicol."
          - "ده الـ fluoroquinolones."
          - "ده الـ aminoglycosides."
        page: 188
        quote: "discoloration of teeth and inhibition of bone growth in children, photosensitivity."
      - kind: explain
        title: "Tigecycline و Chloramphenicol"
        text: |-
          **Tigecycline**: من عيلة الـ tetracycline، على الـ 30S، broad spectrum، للـ MRSA والـ VRE. سمّيته nausea و vomiting.

          **Chloramphenicol**: بيوقف الـ peptidyltransferase على الـ 50S. للـ meningitis والـ RMSF، ورخيص. سمّيته anemia، ==aplastic anemia== (مش مرتبطة بالجرعة)، و ==gray baby syndrome== (المبتسرين ما عندهمش UDP-glucuronosyltransferase).
        page: 188
        quote: "Anemia (dose dependent), aplastic anemia (dose independent), gray baby syndrome (in premature infants because they lack liver UDP-glucuronosyltransferase)."
      - kind: explain
        title: "Clindamycin: فوق الـ diaphragm"
        text: |-
          بيوقف الـ translocation على الـ 50S. للـ anaerobes في ==aspiration pneumonia==، lung abscess، والبُق، وكمان invasive group A strep.

          ==فوق الـ diaphragm clindamycin، تحته metronidazole==. وأشهر سمّية: pseudomembranous colitis.
        page: 188
        quote: "Treats anaerobic infections above the diaphragm vs metronidazole (anaerobic infections below diaphragm)."
      - kind: reveal
        prompt: "مريض عنده lung abscess بعد aspiration، ومريض تاني عنده abscess في البطن بعد ثقب في القولون. الاتنين anaerobes. تدّي كل واحد إيه؟"
        answer: "اللي في الرئة (==فوق الـ diaphragm==) ياخد ==clindamycin==. واللي في البطن (تحت الـ diaphragm) ياخد ==metronidazole==."
        page: 188
        quote: "Treats anaerobic infections above the diaphragm vs metronidazole (anaerobic infections below diaphragm)."
      - kind: explain
        title: "Linezolid"
        text: |-
          بيمسك الـ 23S rRNA في الـ 50S ويمنع الـ initiation complex. للـ gram ⊕ بما فيهم ==MRSA و VRE==.

          السمّية: myelosuppression (خصوصاً thrombocytopenia)، peripheral neuropathy، و ==serotonin syndrome== لأنه partial MAO inhibitor.
        page: 189
        quote: "Myelosuppression (especially thrombocytopenia), peripheral neuropathy, serotonin syndrome (due to partial MAO inhibition)."
      - kind: mnemonic
