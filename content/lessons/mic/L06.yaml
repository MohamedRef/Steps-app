            <text x="197" y="140" class="t-sm">ETEC (travelers)</text>
            <text x="197" y="158" class="t-sm">Giardia, Cryptosporidium</text>
            <text x="197" y="176" class="t-sm">V cholerae (rice-water)</text>
            <text x="197" y="194" class="t-sm">Norovirus, rotavirus,</text>
            <text x="197" y="212" class="t-sm">enteric adenovirus</text>
          </svg>
        caption: "أول سؤال: فيه دم؟ اللي بيغزو الـ mucosa أو بيعمل Shiga toxin بيدّي دم. اللي بيشتغل بـ toxin من غير غزو أو فيروس بيدّي مية."
        alt: "Tree splitting diarrhea into bloody causes (Campylobacter, E histolytica, EHEC, EIEC, nontyphoidal Salmonella, Shigella, Yersinia) and watery causes (C difficile, C perfringens, ETEC, Giardia, Cryptosporidium, V cholerae, norovirus, rotavirus, enteric adenovirus)."
        page: 175
        quote: "Bloody diarrhea Campylobacter Comma- or S-shaped organisms; growth at 42°C"
      - kind: check
        question: "A traveler to Mexico has watery diarrhea on day 3 of the trip. What is the most likely cause?"
        options:
          - "Enterotoxigenic E coli"
          - "Shigella"
          - "Enterohemorrhagic E coli"
          - "Yersinia enterocolitica"
        answer: 0
        why:
          - "صح: الـ ETEC هو travelers' diarrhea، watery بالـ LT و ST."
          - "الـ Shigella بتعمل dysentery بدم."
          - "الـ EHEC إسهال بدم و HUS."
          - "الـ Yersinia في الحضانات و pseudoappendicitis."
        page: 175
        quote: "Enterotoxigenic E coli Travelers’ diarrhea"
      - kind: try
        items: [mic.L06.001, mic.L06.005, mic.L06.007, mic.L06.011, mic.L06.012]
    recap:
      - "Prion: α-helix ← β-sheet، مقاوم للـ autoclave؛ CJD و variant CJD و kuru."
      - "Colon: B fragilis > E coli. Vagina: Lactobacillus. Plaque: S mutans."
      - "رز = B cereus، عسل = botulinum، deli = Listeria، مايونيز = S aureus."
      - "بدم: Campylobacter (42°C)، EHEC (HUS)، Shigella، Yersinia. مية: C diff، ETEC، cholera، noro."
