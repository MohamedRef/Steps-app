        text: |-
          ما تحفظش الجدول صمّ؛ اسأل: الجهاز ده عدّى من أنهي حاجز، ومين ساكن جنبه؟

          - **IV catheter** بيعدّي من الجلد ← ميكروبات الجلد: ==S aureus== (وMRSA)، و **S epidermidis** لو القسطرة قعدت كتير (بيعمل biofilm على البلاستيك).
