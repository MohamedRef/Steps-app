            <line class="fg-arrow-bad" x1="60" y1="190" x2="60" y2="168" marker-end="url(#micL06u)"/>
            <line class="fg-arrow-bad" x1="60" y1="115" x2="60" y2="64" marker-end="url(#micL06u)"/>
