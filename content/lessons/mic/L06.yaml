          - **Urinary catheter**: ميكروبات الـ perineum والأمعاء بتطلع على القسطرة ← PEcK.
          - **Antibiotics و PPIs**: بيقتلوا الفلورا الطبيعية ← C difficile يكبر.
        page: 181
        quote: "Decubitus ulcers, surgical wounds, drains S aureus (including MRSA), gram ⊝ anaerobes (Bacteroides, Prevotella, Fusobacterium) Erythema, tenderness, induration, drainage from surgical wound sites"
