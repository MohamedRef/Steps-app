  - id: renal.L04.lesson5
    title: "الكلية بتفشل: AKI و ATN والـ CKD"
    hook: "الـ FENa والـ BUN/Cr هيقولولك الكلية نفسها تعبانة ولا ناشفة بس. وبعدين MAD HUNGER لما الفشل يطوّل"
    minutes: 10
    pages: [620, 622]
    topics: [acute-kidney-injury, acute-interstitial-nephritis, acute-tubular-necrosis, diffuse-cortical-necrosis, renal-papillary-necrosis, consequences-of-renal-failure, renal-osteodystrophy]
    goals:
      - "تفرّق prerenal عن intrinsic من أرقام البول"
      - "تعرف مراحل الـ ATN وأسبابه"
      - "تحفظ DRAINS و SAAD papa و MAD HUNGER"
    status: unverified
    steps:
      - kind: explain
        title: "Prerenal: الكلية سليمة بس عطشانة"
        text: |-
          في الـ **prerenal** (hypovolemia، ↓ CO، heart failure، liver failure) الـ RBF يقل ← GFR يقل، بس ==الـ tubules شغالة كويس== فبتمسك Na+ ومية و urea. فالبول:
          - **Osmolality > 500** (مركّز)
          - **Urine Na+ < 20**، **FENa < 1%**
          - **BUN/Cr > 20** (الـ urea بيترجع)

          في الـ **intrinsic** (زي ATN) الـ tubules نفسها ميتة ومش قادرة تمسك حاجة: osmolality < 350، Na+ > 40، FENa > 2%، BUN/Cr < 15.

          وفي الـ **postrenal** (stones، BPH، tumor) الانسداد لازم يبقى في الناحيتين، والأرقام بتتغير.
        page: 620
        quote: "↓ RBF → ↓ GFR → ↑ reabsorption of Na+ /H2 O and urea"
      - kind: table
        title: "AKI بالأرقام"
        columns: ["", "Prerenal", "Intrinsic"]
        rows:
          - ["Urine osmolality", "> 500", "< 350"]
          - ["Urine Na+", "< 20", "> 40"]
          - ["FENa", "< 1%", "> 2%"]
          - ["BUN/Cr", "> 20", "< 15"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
        page: 620
        quote: "URINE OSMOLALITY (mOsm/kg) >500 <350 Varies"
      - kind: mnemonic
        word: "AEIOU"
        parts:
          - { key: "A", text: "Acidosis" }
          - { key: "E", text: "Electrolyte abnormalities (eg, hyperkalemia)" }
          - { key: "I", text: "Intoxication (eg, lithium)" }
          - { key: "O", text: "Overload (fluid)" }
          - { key: "U", text: "Uremia" }
        hook: "إمتى الـ AKI يحتاج dialysis؟ الحروف المتحركة الإنجليزي بالترتيب."
        page: 620
        quote: "Indications for dialysis in AKI: Acidosis, Electrolyte abnormalities (eg, hyperkalemia), Intoxication (eg, lithium), Overload (fluid), Uremia (AEIOU)."
      - kind: explain
        title: "AIN: حساسية من دوا"
        text: |-
          **Acute interstitial nephritis**: الدوا بيشتغل ==hapten== ويعمل hypersensitivity في الـ interstitium. pyuria (==eosinophils== كلاسيكياً) و azotemia، وممكن fever و rash و hematuria و CVA tenderness، أو ولا حاجة.

          الأدوية: «to your **DRAINS**»: **D**iuretics، **R**ifampin، **A**ntibiotics (penicillins و cephalosporins)، **I** = Proton pump **I**nhibitors، NSAIDs، **S**ulfa. وأقل: infections (Mycoplasma)، أو Sjögren و SLE و sarcoidosis.
        page: 620
        quote: "Remember the causes of inflammation to your DRAINS: ▘ Diuretics ▘ Rifampin ▘ Antibiotics (penicillins and cephalosporins) ▘ Proton pump Inhibitors ▘ NSAIDs ▘ Sulfa drugs"
      - kind: explain
        title: "ATN: 3 مراحل"
        text: |-
          ==أشهر سبب لـ intrinsic AKI في المستشفى==. علامته **muddy brown granular casts**، و ↑ FENa. كتير بيخف لوحده بس ممكن يموّت، خصوصاً في الـ oliguric phase.

          1. **Inciting event**
          2. **Maintenance** (oliguric، 1-3 أسابيع): ==hyperkalemia== و metabolic acidosis و uremia.
          3. **Recovery** (polyuric): الـ BUN والـ creatinine ينزلوا، بس الـ tubules لسه بتضيّع أملاح ← ==hypokalemia==.

          النوعين:
          - **Ischemic** (↓ RBF): الخلايا الميتة بتقع في الـ lumen؛ الـ PT والـ thick ascending limb أكتر ناس بيتأذوا.
          - **Nephrotoxic**: aminoglycosides، radiocontrast، lead، cisplatin، ethylene glycol، uric acid (tumor lysis)، myoglobin (rhabdomyolysis)، hemoglobin. الـ PTs أكتر حاجة.
        page: 621
        quote: "Recovery phase—polyuric; BUN and serum creatinine fall; risk of hypokalemia and renal wasting of other electrolytes and minerals"
      - kind: check
        question: "Two weeks into post-op ATN, urine output jumps to 4 L/day while creatinine falls. Main risk now?"
        options:
          - "Hypokalemia"
          - "Hyperkalemia"
          - "Metabolic alkalosis"
          - "Hypernatremia"
        answer: 0
        why:
          - "صح: الـ recovery phase polyuric، والـ tubules بتضيّع K+."
          - "الـ hyperkalemia في الـ maintenance (oliguric)."
          - "الـ ATN بيعمل acidosis مش alkalosis."
          - "مش دي المشكلة المذكورة."
        page: 621
        quote: "Recovery phase—polyuric; BUN and serum creatinine fall; risk of hypokalemia and renal wasting of other electrolytes and minerals"
      - kind: explain
        title: "نوعين necrosis تانيين"
        text: |-
          - **Diffuse cortical necrosis**: infarction للـ cortex في الكليتين، غالباً من vasospasm + ==DIC==. بيجي مع كوارث الولادة (زي placental abruption) والـ septic shock.
          - **Renal papillary necrosis**: الـ papillae بتموت وتقع ← gross hematuria. مرتبطة بـ «==SAAD papa==»: **S**ickle cell disease أو trait، **A**cute pyelonephritis، **A**nalgesics (NSAIDs)، **D**iabetes.
        page: 621
        quote: "Associated with: ▘ Sickle cell disease or trait ▘ Acute pyelonephritis ▘ Analgesics (eg, NSAIDs) ▘ Diabetes mellitus SAAD papa with papillary necrosis."
      - kind: mnemonic
        word: "MADHUNGER"
        parts:
          - { key: "M", text: "Metabolic" }
          - { key: "A", text: "Acidosis" }
          - { key: "D", text: "Dyslipidemia (especially ↑ triglycerides)" }
          - { key: "H", text: "High potassium" }
          - { key: "U", text: "Uremia" }
          - { key: "N", text: "Na+/H2O retention (HF, pulmonary edema, hypertension)" }
          - { key: "G", text: "Growth retardation and developmental delay" }
          - { key: "E", text: "Erythropoietin deficiency (anemia)" }
          - { key: "R", text: "Renal osteodystrophy" }
        hook: "الكتاب بيكتبها MAD HUNGER: الكلية لما تفشل بتبقى «جعانة ومجنونة»."
        page: 621
        quote: "Consequences (MAD HUNGER): ▘ Metabolic Acidosis ▘ Dyslipidemia (especially ↑ triglycerides) ▘ High potassium ▘ Uremia"
      - kind: explain
        title: "Uremia و FGF23"
        text: |-
          - **Uremia** (urea عالي): «==Ure-PEAN==»: **P**ericarditis، **E**ncephalopathy (مع asterixis)، **A**norexia، **N**ausea.
          - في أول الـ CKD الـ phosphate بيفضل طبيعي لأن **FGF23** بيعلى ويطلّع الـ phosphate في البول («==FGF23 fights f(ph)osphate==»).
        page: 621
        quote: "Normal phosphate levels are maintained during early stages of CKD due to ↑ levels of fibroblast growth factor 23 (FGF23), which promotes renal excretion of phosphate."
      - kind: explain
        title: "Renal osteodystrophy: العظم"
        text: |-
          - ومع الوقت: **renal osteodystrophy**: Ca2+ واطي، phosphate عالي، والكلية مش بتعمل 1,25-(OH)2 D3 ← ==2° hyperparathyroidism== ← ولو ما اتعالجش ← 3°. الـ phosphate بيلزق في الـ Ca2+ ويترسّب، والـ vitamin D القليل بيقلل امتصاص الـ Ca2+. والنتيجة **subperiosteal thinning** في العظم.
        page: 622
        quote: "Hypocalcemia, hyperphosphatemia, and failure of vitamin D hydroxylation associated with chronic kidney disease → 2° hyperparathyroidism → 3° hyperparathyroidism (if 2° poorly managed)."
      - kind: check
        question: "A patient with untreated ESRD has positional chest pain, a friction rub and asterixis. Cause of the chest pain?"
        options:
          - "Uremic pericarditis"
          - "Myocardial infarction"
          - "Pulmonary embolism"
          - "Aortic dissection"
        answer: 0
        why:
          - "صح: Ure-PEAN: pericarditis و encephalopathy (asterixis)."
          - "الـ MI ما بيتحسنش لما يميل لقدام، وما يفسرش الـ asterixis."
          - "مفيش سبب للجلطة هنا."
          - "الـ dissection ألمه بيشق للضهر."
        page: 621
        quote: "Uremia—syndrome resulting from high serum urea. Can present with Pericarditis, Encephalopathy (seen with asterixis), Anorexia, Nausea"
      - kind: figure
        title: "الـ AKI: 3 أماكن"
        svg: |-
