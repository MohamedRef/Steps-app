        prompt: "ليه الـ Proteus بيعمل حصوة staghorn ضخمة؟"
        answer: "الـ Proteus (ومعاه S saprophyticus و Klebsiella) فيه ==urease== بيكسّر الـ urea لـ **ammonia** ← البول يبقى قلوي ← الـ ammonium magnesium phosphate (**struvite**) يترسّب بسرعة ويملا الـ calyces كلها (staghorn). العلاج: تخلص من الـ infection وتشيل الحصوة جراحياً."
        page: 617
        quote: "Caused by infection with urease ⊕ bugs (eg, Proteus mirabilis, Staphylococcus saprophyticus, Klebsiella) that hydrolyze urea to ammonia → urine alkalinization. Commonly form staghorn calculi C ."
      - kind: aside
        tone: tip
        text: "الـ **cystinuria**: autosomal recessive، الـ transporter في الـ PCT اللي بيرجّع ==COLA== باظ: Cystine، Ornithine، Lysine، Arginine. الكريستال ==hexagonal== («Sixtine» ليها 6 جوانب)، والـ sodium cyanide nitroprusside test ⊕."
        page: 617
        quote: "Transporter defect also results in poor reabsorption of Ornithine, Lysine, Arginine (COLA)."
      - kind: check
        question: "A patient with gout and leukemia on chemotherapy has a radiolucent stone and acidic urine. Treatment?"
