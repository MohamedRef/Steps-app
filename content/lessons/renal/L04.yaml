  - id: renal.L04.lesson4
    title: "انسداد، تسريب، وعدوى"
    hook: "hydronephrosis، والأنواع الـ 3 للـ incontinence، و cystitis ضد pyelonephritis: كله سؤال «المكان فين؟»"
    minutes: 9
    pages: [618, 619]
    topics: [hydronephrosis, urinary-incontinence, acute-cystitis, pyelonephritis]
    goals:
      - "تعرف إمتى الـ hydronephrosis يرفع الـ creatinine"
      - "تفرّق stress و urgency و overflow وتعرف علاج كل واحد"
      - "تفرّق cystitis عن pyelonephritis وتعرف الـ labs"
    status: unverified
    steps:
      - kind: explain
        title: "Hydronephrosis"
        text: |-
          تمدد الـ renal pelvis و/أو الـ calyces، ==فوق== مكان المشكلة. غالباً من انسداد: stones، BPH شديد، انسداد خلقي، cervical cancer متقدم، إصابة في الـ ureter. وكمان retroperitoneal fibrosis و vesicoureteral reflux.

          الـ creatinine ==بيعلى بس== لو الانسداد في الناحيتين، أو المريض عنده كلية واحدة واتسدت. ومع الوقت الضغط بيضغط الـ cortex والـ medulla وممكن يعمل atrophy.
        page: 618
        quote: "Dilation occurs proximal to site of pathology. Serum creatinine becomes elevated if obstruction is bilateral or if patient has an obstructed solitary kidney. Leads to compression and possible atrophy of renal cortex and medulla."
      - kind: table
        title: "Urinary incontinence"
        columns: ["", "Stress", "Urgency", "Overflow"]
        rows:
          - ["Mechanism", "Outlet incompetence → leak with ↑ abdominal pressure", "Detrusor overactivity → sudden urge", "Incomplete emptying → leak when overfilled, ↑ postvoid residual"]
          - ["Associations", "Obesity, pregnancy, vaginal delivery, prostate surgery", "UTI, stones, tumors, pelvic radiation", "BPH, neurogenic bladder, anticholinergics, polyuria"]
          - ["Treatment", "Kegel, weight loss, pessaries", "Bladder training, oxybutynin, mirabegron, botulinum toxin", "Catheterization, relieve obstruction (α-blockers)"]
        hide: [[0, 1], [0, 2], [0, 3], [2, 1], [2, 2], [2, 3]]
        page: 618
        quote: "Detrusor overactivity → leak with urge to void immediately"
      - kind: aside
        tone: analogy
        text: "الـ bladder زي ==خزان بحنفية==: stress = الحنفية سايبة فتنقّط لما تكح أو تشيل حاجة. urgency = الخزان نفسه بيتقلص لوحده فجأة. overflow = الخزان مش بيفضى، فيتملي لحد ما يفيض. و**mixed** = stress و urgency مع بعض."
        page: 618
        quote: "Mixed incontinence has features of both stress and urgency incontinence."
      - kind: check
        question: "A diabetic man with neuropathy dribbles constantly and has a postvoid residual of 450 mL. Management?"
        options:
          - "Catheterization"
          - "Oxybutynin"
          - "Mirabegron"
          - "Pessary"
        answer: 0
        why:
          - "صح: overflow من detrusor ضعيف ← فضّي الـ bladder بالـ catheter."
          - "الـ antimuscarinic هيزوّد الاحتباس؛ ده للـ urgency."
          - "الـ β3-agonist بيرخّي الـ detrusor، برضه للـ urgency."
          - "الـ pessary للـ stress في الستات."
        page: 618
        quote: "Incomplete emptying (detrusor underactivity or outlet obstruction) → leak with overfilling, ↑ postvoid residual on catheterization or ultrasound"
      - kind: explain
        title: "Acute cystitis: الـ bladder بس"
        text: |-
          suprapubic pain و dysuria و frequency و urgency، ومن غير fever عالي أو رعشة (==مفيش systemic signs==).

          الأسباب: **E coli** (الأشهر)، **S saprophyticus** (ستات صغيرين نشيطين جنسياً، والـ E coli برضه أشهر فيهم)، Klebsiella، **Proteus** (ريحة نشادر)، Enterococcus.

          الـ labs:
          - **Leukocyte esterase ⊕**: فيه WBCs.
          - **Nitrites ⊕**: Enterobacteriaceae.
          - ==Sterile pyuria== (pyuria والـ culture سلبي): فكّر في urethritis من **N gonorrhoeae** أو **C trachomatis**.

          العلاج: antibiotics (TMP-SMX، nitrofurantoin).
        page: 619
        quote: "Labs: ⊕ leukocyte esterase. ⊕ nitrites (indicates presence of Enterobacteriaceae). Sterile pyuria (pyuria with ⊝ urine cultures) could suggest urethritis by Neisseria gonorrhoeae or Chlamydia trachomatis."
      - kind: explain
        title: "Pyelonephritis: العدوى طلعت للكلية"
        text: |-
          **Acute**: neutrophils في الـ interstitium (الـ cortex، والـ glomeruli والأوعية سليمين نسبياً). fever و flank pain (==CVA tenderness==) و nausea و رعشة، و WBCs في البول ± ==WBC casts==. الـ CT: striated parenchymal enhancement.

          عوامل الخطر: catheter، انسداد، reflux، diabetes، و**الحمل** (الـ progesterone بيرخّي الـ ureter، والرحم بيضغط).

          المضاعفات: chronic pyelonephritis، renal papillary necrosis، perinephric abscess (ممكن يوصل للـ psoas)، urosepsis.

          **Chronic**: من عدوى بتتكرر (غالباً reflux أو حصوات): ندبات خشنة مش متساوية فوق calyces مفلطحة، و ==thyroidization of kidney== (casts شبه الـ thyroid).
        page: 619
        quote: "Coarse, asymmetric corticomedullary scarring, blunted calyces. Tubules can contain eosinophilic casts resembling thyroid tissue B (thyroidization of kidney)."
      - kind: check
        question: "A young woman has dysuria with pyuria, nitrite-negative urine, and no growth on culture. Most likely organism?"
        options:
          - "Chlamydia trachomatis"
          - "E coli"
          - "Proteus mirabilis"
          - "Klebsiella"
        answer: 0
        why:
          - "صح: sterile pyuria ← urethritis من Chlamydia أو gonorrhea (مش بيطلعوا في الـ culture العادي)."
          - "الـ E coli هيطلع في الـ culture."
          - "الـ Proteus هيطلع، وريحته نشادر."
          - "الـ Klebsiella هيطلع في الـ culture."
        page: 619
        quote: "Sterile pyuria (pyuria with ⊝ urine cultures) could suggest urethritis by Neisseria gonorrhoeae or Chlamydia trachomatis."
      - kind: figure
        title: "العدوى طالعة لفوق"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rL4u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <ellipse class="fg-acc" cx="80" cy="40" rx="35" ry="25"/>
            <text x="58" y="44" class="t-sm t-b">Kidney</text>
            <line class="fg-ink" x1="80" y1="65" x2="80" y2="130" stroke-width="3"/>
            <ellipse class="fg-box" cx="80" cy="150" rx="40" ry="22"/>
            <text x="60" y="154" class="t-sm t-b">Bladder</text>
            <line class="fg-ink" x1="80" y1="172" x2="80" y2="195" stroke-width="3"/>
            <line class="fg-arrow" x1="135" y1="190" x2="135" y2="30" marker-end="url(#rL4u)" stroke-width="2"/>
            <text x="140" y="110" class="t-sm t-mut">ascending (E coli)</text>
            <text x="170" y="30" class="t-sm t-b">Pyelonephritis</text>
            <text x="170" y="46" class="t-sm">fever, flank pain (CVA)</text>
            <text x="170" y="62" class="t-sm">WBCs ± WBC casts</text>
            <text x="170" y="145" class="t-sm t-b">Cystitis</text>
            <text x="170" y="161" class="t-sm">dysuria, frequency, urgency</text>
            <text x="170" y="177" class="t-sm">usually no fever, no casts</text>
          </svg>
        caption: "الـ E coli بتطلع من الـ urethra للـ bladder (cystitis: حرقان من غير سخونية)، ولو كملت لفوق للكلية تبقى pyelonephritis: سخونية، ألم في الجنب، و WBC casts."
        alt: "Urinary tract drawn from bladder up to kidney with an upward arrow for ascending infection, mostly E coli. At the bladder: cystitis with dysuria, frequency and urgency, usually no fever and no casts. At the kidney: pyelonephritis with fever, flank (costovertebral angle) pain, white cells and possibly white cell casts."
        page: 619
        quote: "Causes include ascending UTI (E coli is most common), hematogenous spread to kidney."
      - kind: try
        items: [renal.L04.041, renal.L04.043, renal.L04.048, renal.L04.050, renal.L04.053]
    recap:
      - "Hydronephrosis فوق الانسداد؛ الـ creatinine يعلى لو الناحيتين أو كلية واحدة."
      - "Stress: Kegel. Urgency: oxybutynin أو mirabegron. Overflow: catheter."
      - "Cystitis: مفيش fever. Nitrites = Enterobacteriaceae. Sterile pyuria = Chlamydia أو gonorrhea."
      - "Pyelonephritis: fever و CVA و WBC casts. Chronic: ندبات و thyroidization."
