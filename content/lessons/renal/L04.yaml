schema: steps.lesson/v1
lecture: renal.L04
lessons:
  - id: renal.L04.lesson1
    title: "البول بيحكي: الـ casts، وnephritic ولا nephrotic"
    hook: "الـ cast هو صورة للـ tubule اللي اتعمل فيه. اعرف الـ cast، تعرف المكان"
    minutes: 8
    pages: [612, 613]
    topics: [casts-in-urine, nomenclature-of-glomerular-disorders, glomerular-diseases]
    goals:
      - "تربط كل cast بالمرض بتاعه"
      - "تفهم أسماء الـ glomerular diseases (focal و diffuse و membranous)"
      - "تفرّق nephritic عن nephrotic من الآلية"
    status: unverified
    steps:
      - kind: explain
        title: "ليه الـ cast مهم؟"
        text: |-
          الـ cast بيتعمل جوه الـ tubule، من بروتين اسمه ==Tamm-Horsfall mucoprotein== (uromodulin) اللي الـ tubular cells بتفرزه (وشغلته الأصلية إنه يمنع الـ UTI). أي خلايا بتتحبس فيه بتاخد شكل الـ tubule.

          فلو لقيت cast، يبقى الـ hematuria أو الـ pyuria ==جاية من الكلية نفسها== (glomerulus أو tubule). أما bladder cancer والـ stones فبيعملوا hematuria من غير casts، والـ cystitis بيعمل pyuria من غير casts.
        page: 612
        quote: "Presence of casts indicates that hematuria/pyuria is of glomerular or renal tubular origin. Bladder cancer, kidney stones → hematuria, no casts. Acute cystitis → pyuria, no casts. All casts contain a matrix composed primarily of Tamm-Horsfall mucoprotein (uromodulin), secreted by renal tubular cells to prevent UTIs."
      - kind: match
        prompt: "وصّل كل cast بالمرض بتاعه"
        pairs:
          - ["RBC casts", "Glomerulonephritis, hypertensive emergency"]
          - ["WBC casts", "Acute pyelonephritis, interstitial inflammation"]
          - ["Muddy brown granular casts", "Acute tubular necrosis"]
          - ["Fatty casts (Maltese cross)", "Nephrotic syndrome"]
          - ["Waxy casts", "End-stage or chronic kidney disease"]
          - ["Hyaline casts", "Nonspecific: dehydration, exercise, diuretics"]
        why: "الـ RBC بتعدّي من glomerulus ملتهب، والـ WBC من interstitium ملتهب، والخلايا الميتة بتعمل granular في الـ ATN، والدهون في الـ nephrotic، والـ waxy في كلية قديمة تعبانة."
        page: 612
        quote: "RBC casts A Glomerulonephritis, hypertensive emergency. WBC casts Tubulointerstitial inflammation, acute pyelonephritis, transplant rejection. Granular casts B Acute tubular necrosis (ATN)."
      - kind: explain
        title: "الأسامي بتقولك إيه"
        text: |-
          - **Focal**: أقل من 50% من الـ glomeruli. **Diffuse**: أكتر من 50%.
          - **Proliferative**: الـ glomeruli مليانة خلايا (hypercellular).
          - **Membranous**: الـ GBM تخين.
          - **Primary**: مرض الكلية نفسها (زي minimal change). **Secondary**: مرض في الجسم وصل للـ glomeruli (زي SLE و diabetic nephropathy).
        page: 612
        quote: "Focal <50% of glomeruli are involved Focal segmental glomerulosclerosis Diffuse >50% of glomeruli are involved Diffuse proliferative glomerulonephritis"
      - kind: figure
        title: "Nephritic ولا nephrotic"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-bad" x="10" y="10" width="165" height="180" rx="10"/>
            <text x="20" y="32" class="t-sm t-b">Nephritic</text>
            <text x="20" y="55" class="t-sm">inflammation</text>
            <text x="20" y="72" class="t-sm">→ GBM damage</text>
            <text x="20" y="95" class="t-sm">hematuria, RBC casts</text>
            <text x="20" y="112" class="t-sm">↓ GFR, oliguria</text>
            <text x="20" y="129" class="t-sm">azotemia</text>
            <text x="20" y="146" class="t-sm">hypertension</text>
            <text x="20" y="168" class="t-sm t-mut">protein &lt; 3.5 g/day</text>
            <rect class="fg-acc" x="185" y="10" width="165" height="180" rx="10"/>
            <text x="195" y="32" class="t-sm t-b">Nephrotic</text>
            <text x="195" y="55" class="t-sm">podocyte damage</text>
            <text x="195" y="72" class="t-sm">→ charge barrier lost</text>
            <text x="195" y="95" class="t-sm">protein &gt; 3.5 g/day</text>
            <text x="195" y="112" class="t-sm">edema, ↓ albumin</text>
            <text x="195" y="129" class="t-sm">↑ cholesterol</text>
            <text x="195" y="146" class="t-sm">fatty casts</text>
            <text x="195" y="168" class="t-sm t-mut">clots, infections</text>
          </svg>
        caption: "الـ nephritic «التهاب» بيخرّم الـ GBM فالـ RBCs تعدّي. الـ nephrotic «تسريب» من الـ podocytes فالبروتين يعدّي."
        alt: "Two columns comparing nephritic syndrome (inflammation, GBM damage, hematuria, RBC casts, low GFR, oliguria, azotemia, hypertension, proteinuria under 3.5 g/day) and nephrotic syndrome (podocyte damage, loss of charge barrier, proteinuria over 3.5 g/day, edema, hypoalbuminemia, hypercholesterolemia, fatty casts, clots and infections)."
        page: 613
        quote: "Podocyte damage → impaired charge barrier → proteinuria Massive proteinuria (>3.5 g/day) with edema, hypoalbuminemia"
      - kind: reveal
        prompt: "ليه مريض الـ nephrotic بيعمل جلطات وبيلقط infections بسهولة؟"
        answer: |-
          لأنه بيخسر بروتينات مهمة في البول:
          - ==Antithrombin== (مانع التجلط الطبيعي) ← hypercoagulable، زي **renal vein thrombosis**.
          - ==IgGs== ← مناعة أقل، وكمان الـ edema بيضعف الجلد والأنسجة.

          والـ albumin الواطي بيخلي الكبد يشتغل زيادة فيطلع **cholesterol** عالي.
        page: 613
        quote: "Associated with hypercoagulable state (eg, renal vein thrombosis) due to antithrombin loss in urine and ↑ risk of infection (loss of IgGs in urine and soft tissue compromise by edema)"
      - kind: sort
        prompt: "حط كل مرض في مكانه"
        bins: ["Nephritic", "Nephrotic"]
        cards:
          - { text: "Infection-associated GN", bin: 0 }
          - { text: "Goodpasture syndrome", bin: 0 }
          - { text: "IgA nephropathy", bin: 0 }
          - { text: "Alport syndrome", bin: 0 }
          - { text: "Minimal change disease", bin: 1 }
          - { text: "FSGS", bin: 1 }
          - { text: "Membranous nephropathy", bin: 1 }
          - { text: "Amyloidosis", bin: 1 }
          - { text: "Diabetic glomerulonephropathy", bin: 1 }
        why: "والـ DPGN والـ MPGN ممكن يعملوا الاتنين مع بعض (nephritic-nephrotic)، لأن الضرر في الـ GBM شديد لدرجة إن الـ RBCs والبروتين يعدّوا."
        page: 613
        quote: "Can occur with any form of nephritic syndrome, but is most common with: ▘ Diffuse proliferative glomerulonephritis ▘ Membranoproliferative glomerulonephritis"
      - kind: check
        question: "A man with 6 g/day proteinuria develops sudden flank pain and a renal vein clot. Urinary loss of what?"
        options:
          - "Antithrombin"
          - "Fibrinogen"
          - "Factor VIII"
          - "von Willebrand factor"
        answer: 0
        why:
          - "صح: الـ antithrombin بيضيع في البول ← hypercoagulable."
          - "الـ fibrinogen كبير ومش بيضيع، ولو ضاع هيعمل نزيف."
          - "الـ factor VIII كبير، وضياعه يعمل نزيف."
          - "الـ vWF كبير جداً."
        page: 613
        quote: "Associated with hypercoagulable state (eg, renal vein thrombosis) due to antithrombin loss in urine"
      - kind: try
        items: [renal.L04.001, renal.L04.003, renal.L04.007, renal.L04.010]
    recap:
      - "Casts = المصدر من الكلية. RBC ← GN، WBC ← pyelonephritis، muddy brown ← ATN، fatty ← nephrotic، waxy ← CKD."
      - "Focal < 50%، diffuse > 50%، proliferative = خلايا كتير، membranous = GBM تخين."
      - "Nephritic: التهاب، دم، ضغط، GFR يقل. Nephrotic: podocytes، بروتين > 3.5 g، edema، cholesterol."
      - "Nephrotic: antithrombin يضيع ← جلطات؛ IgG يضيع ← infections."
    practice: [renal.L04.001, renal.L04.002, renal.L04.003, renal.L04.004, renal.L04.005, renal.L04.006, renal.L04.007, renal.L04.008, renal.L04.009, renal.L04.010, renal.L04.011, renal.L04.012]
  - id: renal.L04.lesson2
    title: "الـ nephritic syndromes: كل واحد له بصمة على الميكروسكوب"
    hook: "سؤال الـ biopsy في الامتحان بيدّيك صورة واحدة: humps، crescents، linear، wire loops، basket-weave. كل صورة لها مرض"
    minutes: 10
    pages: [614, 615]
    topics: [nephritic-syndrome]
    goals:
      - "تعرف الـ timing بين الـ infection-related GN والـ IgA nephropathy"
      - "تقرأ الـ IF في الـ RPGN: linear، negative، granular"
      - "تعرف Alport و MPGN"
    status: unverified
    steps:
      - kind: explain
        title: "Infection-related GN: بعد الالتهاب بأسابيع"
        text: |-
          ده ==type III hypersensitivity==: immune complexes بتترسّب وتاكل الـ complement (consumptive **hypocomplementemia**).

          - في الأطفال: ==2-4 أسابيع بعد== strep pharyngitis أو skin infection (group A).
          - في الكبار: الـ **Staphylococcus** سبب إضافي.

          - **LM**: glomeruli كبيرة ومليانة خلايا.
          - **IF**: granular («starry sky»، «lumpy-bumpy») من IgG و IgM و C3.
          - **EM**: ==subepithelial humps==.
        page: 614
        quote: "Type III hypersensitivity reaction with consumptive hypocomplementemia Children: seen ~2-4 weeks after group A streptococcal pharyngitis or skin infection Adults: Staphylococcus is additional causative agent"
      - kind: explain
        title: "IgA nephropathy: في نفس وقت الالتهاب"
        text: |-
          الـ **IgA** بيتفرز من الأغشية المخاطية، فلما يحصل infection في الصدر أو الـ GI، الـ IgA يعلى ==في نفس الوقت== ويترسّب في الـ **mesangium**.

          - LM: mesangial proliferation. IF و EM: IgA immune complexes في الـ mesangium.
          - وهو نفسه الكلية بتاعة ==IgA vasculitis==.
        page: 614
        quote: "Occurs concurrently with respiratory or GI tract infections (IgA is secreted by mucosal linings) Renal pathology of IgA vasculitis Mesangial proliferation IgA-based IC deposits in mesangium"
      - kind: aside
        tone: trap
        text: "أهم سؤال: ==الهيماتوريا جت إمتى؟== بعد الـ sore throat بـ 2-4 أسابيع ← infection-related GN. في نفس أيام الـ sore throat ← IgA nephropathy."
        page: 614
        quote: "Occurs concurrently with respiratory or GI tract infections"
      - kind: check
        question: "A boy has cola-colored urine 3 weeks after impetigo. Which EM finding?"
        options:
          - "Subepithelial immune complex humps"
          - "Mesangial IgA deposits"
          - "Basket-weave GBM"
          - "Foot process effacement only"
        answer: 0
        why:
          - "صح: infection-related GN بعد strep جلد بـ 3 أسابيع ← subepithelial humps."
          - "الـ IgA بيجي مع الـ infection مش بعدها بأسابيع."
          - "الـ basket-weave ده Alport."
          - "الـ effacement لوحده ده minimal change."
        page: 614
        quote: "Subepithelial IC humps"
      - kind: explain
        title: "RPGN: crescents وتشخيص بالـ IF"
        text: |-
          **Rapidly progressive (crescentic) GN** بيمشي بسرعة والـ prognosis وحش. الـ ==crescents== من fibrin وبروتينات (C3b) و parietal cells و monocytes و macrophages.

          والتشخيص من الـ **IF**:
          - **Linear** ← ==Goodpasture== (type II HSR): antibodies ضد الـ GBM والـ alveolar basement membrane ← hematuria و hemoptysis.
          - **Negative (pauci-immune)** ← granulomatosis with polyangiitis (PR3-ANCA/c-ANCA)، eosinophilic GPA، microscopic polyangiitis (MPO-ANCA/p-ANCA).
          - **Granular** ← PSGN أو DPGN.
        page: 614
        quote: "Linear IF due to antibodies to GBM and alveolar basement membrane: Goodpasture syndrome hematuria/ hemoptysis"
      - kind: figure
        title: "الـ IF في الـ RPGN"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="10" width="105" height="130" rx="10"/>
            <text x="20" y="32" class="t-sm t-b">Linear</text>
            <path class="fg-ink" d="M25 60 C 45 45, 75 75, 100 55" stroke-width="3" fill="none"/>
            <text x="20" y="100" class="t-sm">anti-GBM</text>
            <text x="20" y="118" class="t-sm">Goodpasture</text>
            <rect class="fg-box" x="127" y="10" width="105" height="130" rx="10"/>
            <text x="137" y="32" class="t-sm t-b">Negative</text>
            <text x="137" y="65" class="t-sm t-mut">no deposits</text>
            <text x="137" y="100" class="t-sm">pauci-immune</text>
            <text x="137" y="118" class="t-sm">ANCA</text>
            <rect class="fg-good" x="244" y="10" width="105" height="130" rx="10"/>
            <text x="254" y="32" class="t-sm t-b">Granular</text>
            <circle class="fg-dot-good" cx="265" cy="58" r="4"/><circle class="fg-dot-good" cx="285" cy="66" r="4"/><circle class="fg-dot-good" cx="305" cy="55" r="4"/><circle class="fg-dot-good" cx="325" cy="64" r="4"/>
            <text x="254" y="100" class="t-sm">immune</text>
            <text x="254" y="118" class="t-sm">complexes</text>
          </svg>
        caption: "Linear: الـ antibody لازق على الـ GBM نفسه بطوله (Goodpasture). Negative: مفيش رواسب، والـ ANCA هو السبب. Granular: كتل immune complexes (PSGN أو DPGN)."
        alt: "Three immunofluorescence patterns in crescentic glomerulonephritis: a continuous linear line (anti-GBM, Goodpasture), no staining (pauci-immune, ANCA), and granular dots (immune complexes)."
        page: 614
        quote: "Negative IF/Pauci immune (no IgC3 deposition): granulomatosis with polyangiitis—PR3 ANCA/c-ANCA, eosinophilic granulomatosis with polyangiitis, or Microscopic polyangiitis—MPO ANCA/p-ANCA"
      - kind: explain
        title: "DPGN: wire lupus"
        text: |-
          **Diffuse proliferative GN** غالباً من ==SLE== (افتكر «wire lupus»): الـ capillaries شكلها ==wire loops== على الـ LM، والـ IF granular، والـ EM فيه subendothelial IgG immune complexes ومعاهم C3.

          والـ DPGN والـ MPGN كتير بيطلعوا nephritic و nephrotic مع بعض.
        page: 614
        quote: "Often due to SLE (think “wire lupus”); DPGN and MPGN often present as nephritic and nephrotic syndromes concurrently “Wire looping” of capillaries D"
      - kind: explain
        title: "Alport و MPGN"
        text: |-
          **Alport syndrome**: mutation في ==type IV collagen== (غالباً X-linked dominant). الـ GBM بيترقق ويتخن ويتشق، والـ EM شكله ==basket-weave==، والـ IF negative. ومعاه مشاكل عين (retinopathy، anterior lenticonus) و sensorineural hearing loss: «can't see, can't pee, can't hear a bee».

          **MPGN**: الـ GBM بيتشق فيبان ==tram-track== على H&E و PAS. نوعين:
          - **Immune complex**: ممكن secondary لـ HBV أو HCV أو autoimmune. IgG و C3 granular، و subendothelial deposits.
          - **Complement-mediated**: الـ alternative pathway شغال على طول (زي dense deposit disease). C3 أو C4 granular، و intramembranous و/أو subendothelial.
        page: 615
        quote: "Type IV collagen mutation → GBM alterations; mostly X-linked dominant; eye problems (eg, retinopathy, anterior lenticonus), glomerulonephritis, sensorineural hearing loss (“can’t see, can’t pee, can’t hear a bee”)"
      - kind: match
        prompt: "وصّل الصورة بالمرض"
        pairs:
          - ["Subepithelial humps", "Infection-related GN"]
          - ["Mesangial IgA", "IgA nephropathy"]
          - ["Linear IF", "Goodpasture syndrome"]
          - ["Wire loops", "Lupus DPGN"]
          - ["Basket-weave GBM", "Alport syndrome"]
          - ["Tram-track GBM", "MPGN"]
        why: "كل مرض له علامة: humps للـ strep، mesangium للـ IgA، linear للـ anti-GBM، wire للـ lupus، basket للـ collagen، tram-track للـ MPGN."
        page: 615
        quote: "May demonstrate mesangial ingrowth; GBM splitting “tram- track” on H&E and PAS E stains"
      - kind: check
        question: "A young man has hemoptysis and RBC casts; biopsy shows crescents. Which IF pattern points to anti-GBM disease?"
        options:
          - "Linear IgG along the GBM"
          - "Granular lumpy-bumpy"
          - "Negative"
          - "Mesangial IgA"
        answer: 0
        why:
          - "صح: Goodpasture، antibodies على الـ GBM والـ alveolar membrane ← linear."
          - "الـ granular ده immune complexes (PSGN أو DPGN)."
          - "الـ negative ده pauci-immune ANCA، وده برضه بيعمل رئة وكلية، بس السؤال عن anti-GBM."
          - "الـ IgA مفيهوش hemoptysis."
        page: 614
        quote: "Linear IF due to antibodies to GBM and alveolar basement membrane: Goodpasture syndrome hematuria/ hemoptysis"
      - kind: try
        items: [renal.L04.013, renal.L04.014, renal.L04.016, renal.L04.018]
    recap:
      - "Infection-related GN: 2-4 أسابيع بعد strep، ↓ complement، subepithelial humps."
      - "IgA nephropathy: مع الالتهاب نفسه، mesangial IgA."
      - "RPGN: crescents. Linear = Goodpasture، negative = ANCA، granular = PSGN/DPGN."
      - "DPGN = wire lupus. Alport = type IV collagen، basket-weave، عين وودن. MPGN = tram-track."
    practice: [renal.L04.013, renal.L04.014, renal.L04.015, renal.L04.016, renal.L04.017, renal.L04.018, renal.L04.019, renal.L04.020, renal.L04.021, renal.L04.022, renal.L04.142, renal.L04.180]
  - id: renal.L04.lesson3
    title: "الـ nephrotic syndromes، والحصوات"
    hook: "طفل ورمان بعد دور برد؟ minimal change. راجل diabetic؟ Kimmelstiel-Wilson. وبعدين الحصوات: كل نوع له شكل كريستال"
    minutes: 10
    pages: [616, 617]
    topics: [nephrotic-syndrome, kidney-stones]
    goals:
      - "تعرف الـ 5 nephrotic diseases وبصمة كل واحد"
      - "تعرف كل حصوة بتتكوّن في pH إيه وشكل كريستالها وعلاجها"
    status: unverified
    steps:
      - kind: table
        title: "Nephrotic syndromes"
        columns: ["Disease", "Clue", "Key finding"]
        rows:
          - ["Minimal change disease", "Children; after infection, immunization, immune stimulus (4 Is)", "Normal LM; effacement of foot processes on EM"]
          - ["FSGS", "HIV, sickle cell, obesity; more common in Black people", "Segmental sclerosis and hyalinosis"]
          - ["Membranous nephropathy", "Anti-PLA2 receptor; NSAIDs, penicillamine, gold; HBV, HCV, syphilis; SLE; solid tumors", "Spike and dome subepithelial deposits"]
          - ["Amyloidosis", "AL, AA, prolonged dialysis", "Congo red apple-green birefringence"]
          - ["Diabetic glomerulonephropathy", "Most common cause of ESRD in the US", "Kimmelstiel-Wilson nodules"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2]]
        page: 616
        quote: "Often 1° (idiopathic), triggered by recent infection, immunization, immune stimulus (4 Is); rarely 2° to lymphoma (eg, cytokine-mediated damage). More common in children."
      - kind: explain
        title: "Minimal change و FSGS: الـ podocyte نفسه"
        text: |-
          الاتنين الضرر فيهم في الـ ==podocyte==، والـ EM فيه **effacement of foot processes**.

          - **Minimal change**: الـ LM ==طبيعي== (ممكن تشوف lipid في الـ PT cells)، والـ IF negative. أشهر في الأطفال، وبيجي بعد infection أو تطعيم (4 Is)، ونادراً مع lymphoma.
          - **FSGS**: sclerosis في جزء من بعض الـ glomeruli، ممكن primary أو secondary (HIV، sickle cell، obesity)، وممكن يوصل لـ CKD. أشهر في الـ Black people.
        page: 616
        quote: "Can be 1° (idiopathic) or 2° (eg, HIV infection, sickle cell disease, obesity, or congenital malformations); may progress to CKD. More common in Black people."
      - kind: explain
        title: "Membranous و amyloid"
        text: |-
          **Membranous nephropathy**: الـ GBM والـ capillaries تخان، والـ IF granular، والـ EM ==spike and dome== (subepithelial). الـ primary فيه antibodies ضد ==phospholipase A2 receptor==. والـ secondary من أدوية أو infections أو SLE أو tumors. وخطر الجلطات فيه عالي (DVT و renal vein thrombosis).

          **Amyloidosis**: الكلية أكتر عضو بيتأثر. الـ ==Congo red== بيدّي **apple-green birefringence** تحت الـ polarized light، والـ amyloid في الـ mesangium.
        page: 616
        quote: "Congo red stain shows apple-green birefringence (polarized light) due to amyloid deposition in the mesangium"
      - kind: order
        prompt: "رتّب إزاي السكر بيبوّظ الـ glomerulus"
        steps:
          - "Hyperglycemia"
          - "Nonenzymatic glycation of tissue proteins"
          - "Mesangial expansion"
          - "GBM thickening and ↑ permeability"
        why: "وفي نفس الوقت فيه hyperfiltration (ضغط عالي جوه الـ glomerulus و ↑ GFR) بيعمل hypertrophy وبعدين glomerulosclerosis. عشان كده الـ ACE inhibitors والـ ARBs بيحموا الكلية: بيفتحوا الـ efferent ويقللوا الضغط."
        page: 616
        quote: "Hyperglycemia → nonenzymatic glycation of tissue proteins → mesangial expansion → GBM thickening and ↑ permeability."
      - kind: aside
        tone: exam
        text: "الـ diabetic nephropathy هي ==أشهر سبب لـ ESRD في أمريكا==. اكتشفها بدري بالـ **albuminuria** (urine albumin-to-creatinine ratio)، وعلامتها على الـ LM الـ ==Kimmelstiel-Wilson== nodules (eosinophilic nodular glomerulosclerosis)."
        page: 616
        quote: "Look for albuminuria with ↑ urine albumin-to-creatinine ratio. ACE inhibitors and ARBs are renoprotective."
      - kind: check
        question: "A 4-year-old has edema and heavy proteinuria 10 days after a cold. What would EM show?"
        options:
          - "Effacement of podocyte foot processes"
          - "Spike and dome deposits"
          - "Subendothelial wire loops"
          - "Amyloid fibrils"
        answer: 0
        why:
          - "صح: minimal change في طفل بعد infection: LM طبيعي و effacement على الـ EM."
          - "الـ spike and dome ده membranous، في الكبار."
          - "الـ wire loops ده lupus."
          - "الـ amyloid محتاج مرض مزمن قبله."
        page: 616
        quote: "Normal glomeruli (lipid may be seen in PT cells) ⊝ Effacement of podocyte foot processes A"
      - kind: explain
        title: "الحصوات: القواعد العامة"
        text: |-
          الحصوة اللي سادة بتعمل ==ألم colicky من الجنب للـ groin==، و flank tenderness في ناحية، و hematuria. وممكن تعمل hydronephrosis و pyelonephritis و AKI. والعلاج والوقاية: **اشرب مية كتير**.

          - **Calcium** (80%): oxalate أكتر من phosphate.
          - **Struvite**: 15%. **Uric acid**: حوالي 5%.
          - Radiolucent: «==I can't c (see) u (you)==»: cystine و uric acid.
        page: 617
        quote: "Obstructed stone presents with unilateral flank tenderness, colicky pain radiating to groin, hematuria. Treat and prevent by encouraging fluid intake. Radiolucent stones: I can’t c (see) u (you) (cystine and uric acid)."
