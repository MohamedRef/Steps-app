          - ["Calcium phosphate", "↑", "Wedge-shaped prism", "Low-sodium diet, thiazides"]
          - ["Struvite", "↑", "Coffin lid", "Treat infection, remove stone"]
          - ["Uric acid", "↓", "Rhomboid or rosettes", "Alkalinize urine, allopurinol"]
          - ["Cystine", "↓", "Hexagonal", "Low sodium, alkalinize, chelators"]
        hide: [[0, 2], [2, 2], [3, 2], [4, 2], [1, 1], [3, 1]]
