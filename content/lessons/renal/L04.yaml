  - id: renal.L04.lesson6
    title: "الأكياس، الشرايين، والأورام"
    hook: "ADPKD بـ berry aneurysm، RAS اللي بيتعب مع الـ ACE inhibitor، و RCC اللي بيعمل كل الهرمونات"
    minutes: 10
    pages: [622, 624]
    topics: [renal-cyst-disorders, renovascular-disease, renal-cell-carcinoma, renal-oncocytoma, nephroblastoma, urothelial-carcinoma-of-the-bladder, squamous-cell-carcinoma-of-the-bladder]
    goals:
      - "تفرّق ADPKD عن ARPKD عن ADTKD"
      - "تفرّق atherosclerosis عن fibromuscular dysplasia في الـ RAS"
      - "تعرف كل ورم: RCC و oncocytoma و Wilms و bladder"
    status: unverified
    steps:
      - kind: table
        title: "Renal cyst disorders"
        columns: ["", "ADPKD", "ARPKD"]
        rows:
          - ["Gene", "PKD1 (85%, chr 16) or PKD2 (15%, chr 4): polycystin", "PKHD1: fibrocystin"]
          - ["Kidneys", "Many cysts in cortex and medulla, bilateral enlargement", "Cystic dilation of collecting ducts"]
          - ["Presents", "Flank pain, hematuria, hypertension, infection; renal failure in ~50%", "Infancy or prenatal ultrasound; Potter sequence if severe"]
          - ["Associations", "Berry aneurysms, MVP, hepatic cysts, diverticulosis", "Congenital hepatic fibrosis → portal hypertension"]
        hide: [[0, 1], [0, 2], [3, 1], [3, 2]]
        page: 622
        quote: "Mutation in genes encoding polycystin protein: PKD1 (85% of cases, chromosome 16) or PKD2 (15% of cases, chromosome 4)."
      - kind: explain
        title: "أكياس تانية"
        text: |-
          - الـ hypertension في الـ ADPKD من ==↑ renin==، والعلاج لو جه hypertension أو proteinuria: **ACE inhibitors أو ARBs**.
          - **ADTKD** (medullary cystic kidney disease): fibrosis في الـ tubulointerstitium وفشل كلوي بيزيد، والكلية ==مش بتعرف تركّز البول==. الأكياس عادة مش باينة، والكلى ==أصغر== على الـ ultrasound. الـ prognosis وحش.
          - **Simple cyst**: مليان ultrafiltrate (anechoic)، شائع جداً وبيتلاقي صدفة. **Complex cyst** (septated، enhancing، فيه solid): لازم follow-up أو استئصال لأنه ممكن RCC.
        page: 622
        quote: "Causes tubulointerstitial fibrosis and progressive renal insufficiency with inability to concentrate urine. Medullary cysts usually not visualized; smaller kidneys on ultrasound. Poor prognosis."
      - kind: explain
        title: "Renal artery stenosis"
        text: |-
          الـ RAS ← ↓ perfusion ← ↑ renin ← ↑ angiotensin ← hypertension. وده ==أشهر سبب لـ 2° hypertension في الكبار==.

          - **Atherosclerosis**: الـ ==proximal 1/3==، راجل كبير بيدخّن.
          - **Fibromuscular dysplasia**: الـ ==distal 2/3== أو الفروع، ست صغيرة أو في نص العمر.

          لو ناحية واحدة: الكلية المصابة بتضمر (حجم مختلف)، والـ renal vein renin عالي من المصابة وواطي من السليمة. لو الناحيتين: الـ creatinine ممكن يعلى فجأة مع ACE inhibitor أو ARB أو renin inhibitor، لأن الكلية كانت عايشة على الـ AT II اللي بيقفل الـ efferent.

          بيظهر بـ hypertension صعب، أو flash pulmonary edema، أو bruit في البطن أو الجنب.
        page: 623
        quote: "For bilateral RAS, patients can have a sudden rise in creatinine after starting an ACE inhibitor, ARB, or renin inhibitor, due to their interference on RAAS-mediated renal perfusion."
      - kind: check
        question: "A 29-year-old woman has refractory hypertension and a bruit; angiography shows a beaded distal renal artery. Diagnosis?"
        options:
          - "Fibromuscular dysplasia"
          - "Atherosclerotic RAS"
          - "Primary hyperaldosteronism"
          - "Coarctation of the aorta"
        answer: 0
        why:
          - "صح: ست صغيرة والإصابة في الـ distal 2/3 ← fibromuscular dysplasia."
          - "الـ atherosclerosis في الـ proximal 1/3 عند راجل كبير مدخّن."
          - "مفيش lesion في الشريان في الـ hyperaldosteronism."
          - "الـ coarctation فرق ضغط بين الإيد والرجل."
        page: 623
        quote: "Fibromuscular dysplasia: distal 2/3 of renal artery or segmental branches, usually young or middle-aged females"
      - kind: explain
        title: "Renal cell carcinoma"
        text: |-
          ==أشهر ورم primary في الكلية==، أكتر في الرجالة 50-70، ويزيد مع التدخين والسمنة. طالع من الـ **PCT**: clear cells مليانة lipids و carbohydrate، ولونه golden-yellow.

          - الـ triad: flank pain و palpable mass و hematuria.
          - بيدخل الـ renal vein (لو شمال ممكن يعمل varicocele) ← IVC ← lung و bone و liver.
          - Paraneoplastic «==PEAR==»: PTHrP، **E**ctopic EPO (polycythemia)، ACTH، **R**enin.
          - الـ clear cell: deletion في ==chromosome 3== (VHL). الكتاب: RCC 3 حروف = chromosome 3 = VHL 3 حروف.
          - العلاج: جراحة أو ablation لو محلي؛ immunotherapy أو targeted لو انتشر. مقاوم للـ radiation والـ chemo.
        page: 623
        quote: "Clear cell (most common subtype) associated with gene deletion on chromosome 3 (sporadic, or inherited as von Hippel-Lindau syndrome). RCC = 3 letters = chromosome 3 = associated with VHL (also 3 letters)."
      - kind: explain
        title: "Oncocytoma و Wilms"
        text: |-
          **Renal oncocytoma**: ورم ==benign== من الـ collecting ducts، محدد كويس وفيه central scar. خلايا eosinophilic كبيرة مليانة mitochondria ومن غير perinuclear clearing (بعكس الـ chromophobe RCC). بيتشال عادة عشان نتأكد إنه مش RCC.

          **Nephroblastoma (Wilms)**: أشهر ورم كلية في الأطفال (2-4 سنين)، فيه embryonic glomerular structures. كتلة كبيرة في جنب واحد ± hematuria و hypertension. ==WT1 أو WT2 على chromosome 11== («W11ms»). Syndromes:
          - **WAGR**: Wilms، Aniridia، Genitourinary، Range of developmental delays (WT1 deletion).
          - **Denys-Drash**: Wilms، Diffuse mesangial sclerosis، Dysgenesis of gonads (WT1 mutation).
          - **Beckwith-Wiedemann**: Wilms، organomegaly، macroglossia، hemihyperplasia، omphalocele (WT2).
        page: 624
        quote: "Can be associated with loss-of-function mutations of tumor suppressor genes WT1 or WT2 on chromosome 11 (W11ms tumor)."
      - kind: explain
        title: "أورام الـ bladder"
        text: |-
          الاتنين بيظهروا بـ ==painless hematuria (no casts)==.

          - **Urothelial (transitional cell) carcinoma**: أشهر ورم في الجهاز البولي كله (calyces و pelvis و ureters و bladder). مشاكل في الـ «Pee **SAC**»: tobacco **S**moking، **A**romatic amines (الصبغات)، **C**yclophosphamide.
          - **Squamous cell carcinoma**: تهيج مزمن ← squamous metaplasia ← dysplasia ← carcinoma. الـ ==4 S's==: **S**chistosoma haematobium (الشرق الأوسط)، chronic cystitis («systitis»)، **s**moking، **s**tones.
        page: 624
        quote: "Risk factors include 4 S’s: Schistosoma haematobium infection (Middle East), chronic cystitis (“systitis”), smoking, chronic nephrolithiasis (stones). Presents with painless hematuria (no casts)."
      - kind: aside
        tone: exam
        text: "فلاح من الدلتا كان بيعوم في الترع وهو صغير وعنده hematuria من غير ألم؟ ده ==Schistosoma haematobium== ← squamous cell carcinoma of the bladder. السؤال ده بيحبه امتحان Step 1 وإحنا عارفينه أكتر من أي حد."
        page: 624
        quote: "Schistosoma haematobium infection (Middle East)"
      - kind: match
        prompt: "وصّل كل ورم بعلامته"
        pairs:
          - ["Renal cell carcinoma", "Chromosome 3, VHL, PEAR"]
          - ["Renal oncocytoma", "Central scar, mitochondria-packed cells"]
          - ["Wilms tumor", "WT1/WT2 on chromosome 11"]
          - ["Urothelial carcinoma", "Smoking, aromatic amines, cyclophosphamide"]
          - ["Squamous cell carcinoma of bladder", "Schistosoma haematobium"]
        why: "RCC = 3، Wilms = 11، oncocytoma benign بـ scar، والـ bladder: SAC للـ urothelial و 4 S's للـ squamous."
        page: 624
        quote: "Can be associated with loss-of-function mutations of tumor suppressor genes WT1 or WT2 on chromosome 11 (W11ms tumor)."
      - kind: check
        question: "A smoker with a left renal mass into the renal vein has a hemoglobin of 18.9 g/dL. What is the tumor making?"
        options:
          - "Erythropoietin"
          - "Renin"
          - "PTHrP"
          - "ACTH"
        answer: 0
        why:
          - "صح: RCC بيعمل ectopic EPO ← polycythemia (الـ E في PEAR)."
          - "الـ renin بيعمل hypertension."
          - "الـ PTHrP بيعمل hypercalcemia."
          - "الـ ACTH بيعمل Cushing."
        page: 623
        quote: "Associated with paraneoplastic syndromes, eg, PTHrP, Ectopic EPO, ACTH, Renin (“PEAR”-aneoplastic)."
      - kind: figure
        title: "ليه الـ RCC الشمال بيعمل varicocele؟"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="150" y="5" width="16" height="190" rx="6"/>
            <text x="122" y="20" class="t-sm t-b">IVC</text>
            <ellipse class="fg-acc" cx="300" cy="70" rx="35" ry="45"/>
            <circle class="fg-bad" cx="300" cy="60" r="18"/>
