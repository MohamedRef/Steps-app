            <text x="10" y="120" class="t-sm t-mut">right gonadal vein</text>
            <text x="10" y="136" class="t-sm t-mut">goes straight</text>
            <text x="10" y="152" class="t-sm t-mut">into the IVC</text>
            <text x="300" y="130" class="t-sm t-mut">left</text>
          </svg>
        caption: "الـ RCC بيدخل الـ renal vein. والـ left gonadal vein بيصب في الـ left renal vein، فلو الورم سدّه الدم يرجع للخصية ← varicocele في الناحية الشمال بس."
        alt: "Front view: the inferior vena cava in the middle, the left kidney on the viewer's right with a renal cell carcinoma growing into the left renal vein, which crosses to the vena cava. The left gonadal vein drains into the left renal vein, so the blockage backs up into it and causes a left varicocele; the right gonadal vein drains directly into the vena cava."
        page: 623
        quote: "(may develop varicocele if left sided)"
