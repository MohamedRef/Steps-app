      - kind: aside
        tone: tip
        text: "ترتيب الشرايين بالحروف: ==S I A I== (Segmental، Interlobar، Arcuate، Interlobular). افتكر إن الـ **arcuate** هي اللي «بتقوّس» على الحدود بين الـ cortex والـ medulla، وقبلها interlobar وبعدها interlobular."
        page: 598
        quote: "Renal artery Segmental artery Interlobar artery Interlobar vein Arcuate artery Arcuate vein Interlobular artery Afferent arteriole"
      - kind: order
        prompt: "رتّب الشرايين من الـ renal artery لحد الـ glomerulus"
        steps:
          - "Renal artery"
          - "Segmental artery"
          - "Interlobar artery"
          - "Arcuate artery"
          - "Interlobular artery"
          - "Afferent arteriole"
        why: "Segmental ثم Interlobar ثم Arcuate ثم Interlobular ثم الـ afferent اللي بيدخل الـ glomerulus."
        page: 598
        quote: "Renal artery Segmental artery Interlobar artery Interlobar vein Arcuate artery Arcuate vein Interlobular artery Afferent arteriole"
      - kind: explain
        title: "الـ medulla: نصيبها من الدم قليل"
        text: |-
          الـ ==medulla بتاخد دم أقل بكتير من الـ cortex==. يعني الـ flow اللي بيوصلها قليل.

          عشان كده الـ medulla حساسة جداً للـ hypoxia، وأول حتة بتتعب في الـ ischemia: زي الـ ==ATN== بعد hypotension طويل.
        page: 598
        quote: "Renal medulla receives significantly less blood flow than the renal cortex. This makes medulla very sensitive to hypoxia and vulnerable to ischemic damage (eg, ATN)."
      - kind: explain
        title: "الـ left renal vein: الوريد اللي بيلم من الكل"
        text: |-
          الـ **left renal vein** بتستقبل وريدين زيادة: ==left suprarenal== و ==left gonadal==. (اليمين بيصبّوا في الـ IVC على طول.)

          وعشان هي ماشية من الشمال لحد الـ IVC اللي على اليمين، فهي ==أطول==. فالـ **left kidney** هي اللي بتتاخد عادة في الـ living donor transplant، والكتاب بيسميها **rule of Ls**: Left kidney، Living donor transpLantation، Longer renal vein.
        page: 598
        quote: "Left renal vein receives two additional veins: left suprarenal and left gonadal veins. Renal medulla receives significantly less blood flow than the renal cortex. This makes medulla very sensitive to hypoxia and vulnerable to ischemic damage (eg, ATN). Left kidney is most commonly taken during Living donor transpLantation because it has a Longer renal vein (rule of Ls)."
      - kind: reveal
        prompt: "راجل عنده left renal cell carcinoma داخلة في الـ left renal vein، وظهر عنده فجأة varicocele شمال. ليه؟"
        answer: "لأن الـ **left gonadal vein** بتصب في الـ left renal vein. لما الورم يسد الـ renal vein، الدم يرجع في الـ gonadal vein ← ==varicocele== شمال."
        page: 598
        quote: "Left renal vein receives two additional veins: left suprarenal and left gonadal veins."
      - kind: explain
        remind: [renal.L02.010]
        title: "الـ glomerulus: فلتر بـ 3 طبقات"
        text: |-
          الدم في الـ glomerular capillaries بيتفلتر لـ Bowman space من خلال ==glomerular filtration barrier==:
          - **Fenestrated capillary endothelium** (شبابيك)
          - **Basement membrane**
          - **Podocytes**: دول الـ ==visceral layer== بتاع Bowman capsule، ورجليهم (foot processes) قاعدة على الـ basement membrane.

          والـ **parietal layer** هو الحيطة اللي برّه لـ Bowman capsule. وبين الـ capillaries فيه **mesangial cells**.

          وعند المدخل: الـ **afferent arteriole** فيها **juxtaglomerular cells**، وجنبها الـ **macula densa** في الـ DCT. (هنرجع للاتنين دول في الـ physiology مع الـ renin.)
        page: 598
        quote: "Endothelial cells Distal convoluted tubule Macula densa Juxtaglomerular cells Afferent arteriole Efferent arteriole Mesangial cells Bowman capsule (parietal layer) Basement membrane Podocytes (visceral layer) Glomerular filtration barrier Fenestrated capillary endothelium"
      - kind: match
        prompt: "وصّل كل خلية بمكانها"
        pairs:
          - ["Podocytes", "Visceral layer of Bowman capsule"]
          - ["Juxtaglomerular cells", "Wall of the afferent arteriole"]
          - ["Macula densa", "Distal convoluted tubule"]
          - ["Fenestrated endothelium", "Blood side of the basement membrane"]
        why: "الفلتر من جوه لبرّه: endothelium ثم basement membrane ثم podocytes. والـ JG cells والـ macula densa عند الـ vascular pole."
        page: 598
        quote: "Distal convoluted tubule Macula densa Juxtaglomerular cells Afferent arteriole Efferent arteriole Mesangial cells Bowman capsule (parietal layer) Basement membrane Podocytes (visceral layer)"
