          - "الـ cortex فيه peritubular capillaries، وهو اللي بياخد أغلب الدم."
          - "الـ podocytes قاعدة على الـ basement membrane؛ مالهاش علاقة بالـ ischemia."
          - "طول الـ vein ميزة في الـ transplant، مش سبب للـ ATN."
        page: 598
        quote: "This makes medulla very sensitive to hypoxia and vulnerable to ischemic damage (eg, ATN)."
