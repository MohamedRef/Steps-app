    title: "الدم بيدخل الكلية إزاي، وليه الـ medulla بتتعب الأول"
    hook: "صفحة واحدة فيها reflux، وطريق الدم، وقاعدة الـ Ls، والفلتر بتاع الـ glomerulus"
    minutes: 7
    pages: [598, 598]
    topics: [vesicoureteral-reflux, renal-blood-flow, glomerular-anatomy]
    goals:
      - "تفرّق بين الـ reflux الـ primary والـ secondary"
      - "ترتّب شرايين الكلية من الـ renal artery لحد الـ peritubular capillaries"
      - "تعرف ليه الـ left renal vein مهمة في الامتحان"
    status: unverified
    steps:
      - kind: explain
        title: "Vesicoureteral reflux: البول راجع لفوق"
        text: |-
          الطبيعي إن الـ ureter بيدخل في حيطة الـ bladder بشكل مايل، فلما الـ bladder يتملي ويعصر، الحيطة نفسها تقفل الـ ureter زي الـ valve.

          الـ ==reflux== هو إن البول يرجع من الـ bladder لفوق. ليه سببين:
          - **1° (primary)**: الـ ureter مركّب غلط أو قصير في حيطة الـ bladder (عند الـ **UVJ**).
          - **2° (secondary)**: ضغط الـ bladder عالي جداً فيزق البول لفوق من الـ UVJ.

          والنتيجة: ↑ ==recurrent UTIs==.
        page: 598
        quote: "Retrograde flow of urine from bladder toward upper urinary tract. Can be 1° due to abnormal/ insufficient insertion of the ureter within the vesicular wall (ureterovesical junction [UVJ]) or 2° due to abnormally high bladder pressure resulting in retrograde flow via the UVJ. ↑ risk of recurrent UTIs."
      - kind: check
        question: "A boy with a high-pressure trabeculated bladder after posterior urethral valves has reflux into both ureters. What type of reflux?"
        options:
          - "Secondary, from high bladder pressure"
          - "Primary, from abnormal ureteral insertion"
          - "Ureteropelvic junction obstruction"
          - "Duplex collecting system"
        answer: 0
        why:
          - "صح: السبب ضغط الـ bladder العالي اللي بيزق البول من الـ UVJ."
          - "الـ primary لما الـ ureter نفسه مركّب غلط، وهنا فيه سبب واضح للضغط."
          - "الـ UPJ obstruction بيمنع البول ينزل، مش بيرجّعه من الـ bladder."
          - "مفيش في السؤال ureter مشقوق."
        page: 598
        quote: "2° due to abnormally high bladder pressure resulting in retrograde flow via the UVJ."
