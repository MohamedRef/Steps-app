schema: steps.lesson/v1
lecture: renal.L01
lessons:
  - id: renal.L01.lesson1
    title: "الكلية بتتبني من حتتين بيكلموا بعض"
    hook: "الـ ureteric bud والـ metanephric mesenchyme: لو فهمت الحوار اللي بينهم، كل عيوب الكلية الخلقية هتبقى منطقية"
    minutes: 8
    pages: [596, 596]
    topics: [kidney-embryology, potter-sequence]
    goals:
      - "تعرف الـ 3 كلاوي اللي الجنين بيعملهم وإمتى"
      - "تعرف مين بيبني إيه في الكلية النهائية"
      - "تفهم Potter sequence من أوله لآخره وليه الطفل بيموت من الرئة"
    status: unverified
    steps:
      - kind: explain
        title: "3 كلاوي، واحدة بس اللي بتفضل"
        text: |-
          الجنين بيجرّب الكلية على 3 مراحل:

          - **Pronephros**: في الأسبوع 4، وبعدين بيختفي.
          - **Mesonephros**: برضه الأسبوع 4، وبيشتغل ==كلية مؤقتة== طول الـ 1st trimester في الولد والبنت. الـ duct بتاعه بيفضل في الولد (Wolffian duct) ويعمل الـ ductus deferens والـ epididymis، وفي البنت بيختفي.
          - **Metanephros**: هو ==الكلية النهائية==، بيظهر في الأسبوع 5، والـ nephrogenesis بيخلص عادة في الأسبوع **36**.
        page: 596
        quote: "Pronephros—week 4 of development; then degenerates. Mesonephros—week 4 of development; functions as interim kidney for 1st trimester in both sexes. Mesonephric ducts persist in the male genital system as Wolffian duct, forming ductus deferens and epididymis. Mesonephric ducts degenerate in females. Metanephros—permanent; first appears in week 5 of development; nephrogenesis is normally completed by week 36 of gestation."
      - kind: figure
        title: "مين بيبني إيه"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rL1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="10" y="15" width="160" height="70" rx="10"/>
            <text x="20" y="38" class="t-sm t-b">Ureteric bud</text>
            <text x="20" y="56" class="t-sm t-mut">from mesonephric duct</text>
            <text x="20" y="74" class="t-sm">collecting side</text>
            <rect class="fg-good" x="190" y="15" width="160" height="70" rx="10"/>
            <text x="200" y="38" class="t-sm t-b">Metanephric mesenchyme</text>
            <text x="200" y="56" class="t-sm t-mut">(metanephric blastema)</text>
            <text x="200" y="74" class="t-sm">filtering side</text>
            <path class="fg-arrow-acc" d="M170 50 L188 50" marker-end="url(#rL1a)"/>
            <text x="140" y="104" class="t-sm t-acc">bud induces mesenchyme</text>
            <rect class="fg-box" x="10" y="115" width="160" height="75" rx="10"/>
            <text x="20" y="137" class="t-sm">ureter</text>
            <text x="20" y="154" class="t-sm">pelvis, calyces</text>
            <text x="20" y="171" class="t-sm">collecting ducts</text>
            <rect class="fg-box" x="190" y="115" width="160" height="75" rx="10"/>
            <text x="200" y="137" class="t-sm">glomerulus</text>
            <text x="200" y="154" class="t-sm">→ PCT → loop</text>
            <text x="200" y="171" class="t-sm">→ DCT</text>
          </svg>
        caption: "الـ ureteric bud بيعمل السكة اللي البول بيمشي فيها (من الـ collecting duct لحد الـ ureter)، والـ mesenchyme بيعمل الـ nephron نفسه من الـ glomerulus لحد الـ DCT. والـ bud هو اللي لازم «يكلّم» الـ mesenchyme عشان يبدأ."
        alt: "Two boxes: ureteric bud from the mesonephric duct forms ureter, pelvis, calyces and collecting ducts; metanephric mesenchyme, induced by the bud, forms glomerulus through distal convoluted tubule."
        page: 596
        quote: "Ureteric bud (metanephric diverticulum) fully canalized by week 10 of development; derived from mesonephric duct to form ureters, pelvises, calyces, and collecting ducts. Metanephric mesenchyme (ie, metanephric blastema)—ureteric bud interacts with this tissue to induce differentiation and formation of glomerulus through distal convoluted tubule (DCT)"
      - kind: aside
        tone: analogy
        text: "الـ ureteric bud زي ==السبّاك== اللي بيمد المواسير ويخبط على باب المقاول (الـ mesenchyme) يقوله «ابدأ ابني». لو السبّاك ما جاش خالص: لا مواسير ولا بيت (agenesis). لو جه وخبط غلط: البيت يطلع خرابة مليانة أكياس (multicystic dysplastic kidney)."
        page: 596
        quote: "Aberrant interaction between these 2 tissues may result in several congenital malformations of the kidney (eg, renal agenesis, multicystic dysplastic kidney)"
      - kind: explain
        title: "آخر حتة بتتفتح"
        text: |-
          الـ ureter بيبدأ مصمت وبعدين بيتفتح (canalization)، وبيخلص في الأسبوع **10**.

          آخر حتة بتتفتح هي ==ureteropelvic junction== (UPJ). لو ما اتفتحتش كويس ← انسداد خلقي، في ناحية أو الناحيتين. البول يتحجز فوقها فالـ pelvis يتنفخ.

          وده ==أشهر سبب مرضي لـ prenatal hydronephrosis==، وبيتشاف في الـ prenatal ultrasound.
        page: 596
        quote: "Ureteropelvic junction → last part of ureter to canalize; if doesn’t fully canalize → congenital obstruction. Can be unilateral or bilateral. Most common pathologic cause of prenatal hydronephrosis. Detected by prenatal ultrasound."
      - kind: check
        question: "Fetal ultrasound shows a dilated left renal pelvis with a normal ureter, a normal bladder and normal amniotic fluid. Most likely cause?"
        options:
          - "Incomplete canalization of the ureteropelvic junction"
          - "Posterior urethral valves"
          - "Multicystic dysplastic kidney"
          - "Bilateral renal agenesis"
        answer: 0
        why:
          - "صح: الـ UPJ آخر حتة بتتفتح، والـ pelvis بيتنفخ فوقها والـ ureter تحتها سليم."
          - "الـ valves تحت الـ bladder، فالـ bladder نفسه يبقى تخين ومنفوخ والاتنين hydronephrosis."
          - "الـ MCDK أكياس مش pelvis منفوخ."
          - "مفيش كلاوي خالص يعني مفيش بول ← oligohydramnios، والمية هنا طبيعية."
        page: 596
        quote: "Ureteropelvic junction → last part of ureter to canalize; if doesn’t fully canalize → congenital obstruction."
      - kind: explain
        title: "Potter: الحكاية كلها من المية"
        text: |-
          من الشهر الرابع تقريباً الـ ==amniotic fluid== أغلبه بول الجنين. يعني لو الجنين مش بيعمل بول، المية تقل (**oligohydramnios**).

          ومن غير مية:
          - الرحم يضغط على الجنين ← رجلين ملتوية (**club feet**)، ووش متضغوط (**low-set ears**، **retrognathia**، مناخير مفلطحة).
          - الصدر متضغوط، والجنين مش بيشفط مية في رئته ← ==pulmonary hypoplasia==، وده سبب الوفاة.
        page: 596
        quote: "Oligohydramnios → compression of developing fetus → limb deformities (eg, club feet), facial anomalies (eg, low-set ears and retrognathia, flattened nose), compression of chest and lack of amniotic fluid aspiration into fetal lungs → pulmonary hypoplasia (cause of death)."
      - kind: order
        prompt: "رتّب سلسلة Potter sequence"
        steps:
          - "Reduced fetal urine output"
          - "Oligohydramnios"
          - "Compression of the fetus and its chest"
          - "Pulmonary hypoplasia"
        why: "المية هي الـ trigger. من غيرها الصدر ما بيتمددش والرئة ما بتكبرش، والطفل بيموت من الرئة مش من الكلية."
        page: 596
        quote: "Oligohydramnios → compression of developing fetus → limb deformities (eg, club feet), facial anomalies (eg, low-set ears and retrognathia, flattened nose), compression of chest and lack of amniotic fluid aspiration into fetal lungs → pulmonary hypoplasia (cause of death)."
      - kind: reveal
        prompt: "إيه الحاجات اللي ممكن تقلل بول الجنين أو المية وتعمل Potter؟"
        answer: |-
          الكتاب بيعدّ 6:
          - **Chronic placental insufficiency**
          - **ARPKD** (الكلاوي نفسها بايظة)
          - **Obstructive uropathy**، زي **posterior urethral valves** (السكة مسدودة)
          - **Bilateral renal agenesis** (مفيش كلاوي)
          - **Preterm premature rupture of membranes** (المية نزلت)
          - **Maternal ACE inhibitor use** (الدوا بيوقف الـ GFR بتاع الجنين)
        page: 596
        quote: "Caused by chronic placental insufficiency or reduced fetal urine output, including ARPKD, obstructive uropathy (eg, posterior urethral valves), bilateral renal agenesis, preterm premature rupture of membranes, maternal ACE inhibitor use."
      - kind: mnemonic
        word: "POTTER"
        parts:
          - { key: "P", text: "Pulmonary hypoplasia" }
          - { key: "O", text: "Oligohydramnios (the trigger)" }
          - { key: "T", text: "Twisted face" }
          - { key: "T", text: "Twisted skin" }
          - { key: "E", text: "Extremity defects" }
          - { key: "R", text: "Renal failure (in utero)" }
        hook: "والكتاب بيقولها كمان: الطفل اللي مش بيعرف «Pee» جوه الرحم بيعمل Potter."
        page: 596
        quote: "POTTER sequence associated with: Pulmonary hypoplasia Oligohydramnios (trigger) Twisted face Twisted skin Extremity defects Renal failure (in utero)"
      - kind: check
        question: "A newborn of a mother who took lisinopril throughout pregnancy has club feet, low-set ears and severe respiratory distress. Cause of the respiratory failure?"
        options:
          - "Pulmonary hypoplasia from oligohydramnios"
          - "Meconium aspiration"
          - "Surfactant deficiency alone"
          - "Persistent ductus arteriosus"
        answer: 0
        why:
          - "صح: الـ ACE inhibitor قلل بول الجنين ← oligohydramnios ← الصدر اتضغط ← pulmonary hypoplasia."
          - "عشان يشفط meconium لازم يبقى فيه مية أصلاً."
          - "الـ surfactant ما يفسرش الـ club feet والوش."
          - "الـ ductus مش هو اللي بيربط المية بالرئة."
        page: 596
        quote: "maternal ACE inhibitor use"
      - kind: try
        items: [renal.L01.004, renal.L01.008, renal.L01.011, renal.L01.013]
    recap:
      - "Pronephros و mesonephros في أسبوع 4، والـ metanephros (النهائي) في أسبوع 5، والـ nephrogenesis بيخلص في أسبوع 36."
      - "Ureteric bud ← ureter لحد الـ collecting duct. Mesenchyme ← glomerulus لحد الـ DCT."
      - "UPJ آخر حتة بتتفتح، وأشهر سبب مرضي لـ prenatal hydronephrosis."
      - "Potter: بول قليل ← oligohydramnios ← pulmonary hypoplasia (سبب الوفاة)."
    practice: [renal.L01.001, renal.L01.002, renal.L01.003, renal.L01.004, renal.L01.005, renal.L01.006, renal.L01.007, renal.L01.008, renal.L01.009, renal.L01.010, renal.L01.011, renal.L01.012, renal.L01.013, renal.L01.014, renal.L01.015]
  - id: renal.L01.lesson2
    title: "عيوب الكلية الخلقية: حدوة، كلية واحدة، وأكياس"
    hook: "كل عيب هنا هو غلطة في خطوة معينة من الحوار بين الـ bud والـ mesenchyme. اعرف الخطوة، تعرف العيب"
    minutes: 8
    pages: [597, 597]
    topics: [horseshoe-kidney, congenital-solitary-functioning-kidney, unilateral-renal-agenesis, multicystic-dysplastic-kidney, duplex-collecting-system, posterior-urethral-valves]
    status: unverified
    steps:
      - kind: explain
        title: "Horseshoe kidney: الحدوة اللي اتزنقت"
        text: |-
          الكلاوي بتتكوّن في الحوض وبتطلع لفوق. لو الـ ==inferior poles== اتلحموا في بعض، الكلية تبقى شكل حدوة (U).

          وهي طالعة، الحتة اللي في النص بتخبط في ==inferior mesenteric artery== وتتزنق تحتها، فتفضل واطية في البطن.

          الكلية ممكن تشتغل عادي، بس البول بيمشي بصعوبة، فبتيجي معاها **hydronephrosis** (زي UPJ obstruction) و **stones** و **infection**، وكمان ↑ خطر **renal cancer**.
        page: 597
        quote: "Inferior poles of both kidneys fuse abnormally A . As they ascend from pelvis during fetal development, horseshoe kidneys get trapped under inferior mesenteric artery and remain low in the abdomen. Kidneys can function normally, but associated with hydronephrosis (eg, ureteropelvic junction obstruction), renal stones, infection, ↑ risk of renal cancer."
      - kind: figure
        title: "الحدوة تحت الـ IMA"
        svg: |-
          <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="140" y="10" width="20" height="185" rx="8"/>
            <text x="166" y="24" class="t-sm t-mut">Aorta</text>
            <line class="fg-ink" x1="150" y1="80" x2="240" y2="70" stroke-width="3"/>
            <text x="200" y="62" class="t-sm t-b">IMA</text>
            <path class="fg-acc" d="M60 40 C 40 70, 50 130, 100 150 L 200 150 C 250 130, 260 70, 240 40 L 215 40 C 225 80, 215 115, 190 120 L 110 120 C 85 115, 75 80, 85 40 Z"/>
            <text x="20" y="34" class="t-sm">left</text>
            <text x="250" y="34" class="t-sm">right</text>
            <text x="98" y="140" class="t-sm t-acc">fused inferior poles</text>
            <text x="80" y="185" class="t-sm t-mut">trapped low, below the IMA</text>
          </svg>
        caption: "الـ inferior poles ملحومين قدّام الـ aorta، والحدوة ما قدرتش تعدّي الـ IMA فوقفت واطية."
        alt: "A U-shaped kidney with fused lower poles lying across the front of the aorta, just below the origin of the inferior mesenteric artery."
        page: 597
        quote: "horseshoe kidneys get trapped under inferior mesenteric artery and remain low in the abdomen."
      - kind: aside
        tone: exam
        text: "بنت قصيرة، رقبتها webbed، ومفيش period؟ ده **Turner**. ولو في السؤال كلية، فكّر في ==horseshoe kidney==. الكتاب بيقول نسبتها أعلى في الـ aneuploidy: Turner و trisomies 13 و 18 و 21."
        page: 597
        quote: "Higher incidence in chromosomal aneuploidy (eg, Turner syndrome, trisomies 13, 18, 21)."
      - kind: explain
        title: "كلية واحدة: agenesis ولا dysplasia؟"
        text: |-
          **Congenital solitary functioning kidney**: الطفل اتولد بكلية واحدة شغالة. معظمهم كويسين لأن الكلية التانية بتعمل ==compensatory hypertrophy==، بس عيوب الكلية التانية دي شائعة. غالباً بيتعرف من الـ prenatal ultrasound. ولو العيب في الناحيتين ← Potter.

          وفيه طريقتين توصلك لكلية واحدة، والفرق كله في الـ ureteric bud:
          - **Unilateral renal agenesis**: الـ bud ==ما اتكوّنش أصلاً== ← لا كلية ولا ureter.
          - **Multicystic dysplastic kidney**: الـ bud اتكوّن بس ما عرفش يحفّز الـ mesenchyme ← كلية مش شغالة، كلها أكياس و connective tissue. مش وراثية (بس ممكن تتكرر في العيلة)، وغالباً في ناحية واحدة.
        page: 597
        quote: "Ureteric bud fails to develop and induce differentiation of metanephric mesenchyme → complete absence of kidney and ureter."
      - kind: sort
        prompt: "حط كل وصف تحت العيب بتاعه"
        bins: ["Unilateral renal agenesis", "Multicystic dysplastic kidney"]
        cards:
          - { text: "Ureteric bud fails to develop", bin: 0 }
          - { text: "No kidney and no ureter", bin: 0 }
          - { text: "Ureteric bud forms but fails to induce", bin: 1 }
          - { text: "Cysts and connective tissue", bin: 1 }
          - { text: "Nongenetic, though runs in families", bin: 1 }
        why: "السؤال اللي يفرق: الـ bud اتكوّن ولا لأ؟ لو لأ، مفيش أي حاجة (agenesis). لو آه بس ما حفّزش، فيه كلية بس خرابة (MCDK)."
        page: 597
        quote: "Ureteric bud develops, but fails to induce differentiation of metanephric mesenchyme → nonfunctional kidney consisting of cysts and connective tissue. Nongenetic inheritance, though tends to run in families; usually unilateral."
      - kind: explain
        title: "Duplex collecting system: ureter على شكل Y"
        text: |-
          لو الـ ureteric bud اتقسم لاتنين ==قبل ما يدخل الـ metanephric blastema==، يطلع ureter مشقوق على شكل **Y** (bifid ureter). أو ممكن يوصل ==اتنين buds== للـ blastema.

          النتيجة: سكتين بدل سكة، وغالباً واحدة منهم مركّبة غلط في الـ bladder. فبيجي معاه بقوة **vesicoureteral reflux** و/أو **ureteral obstruction**، و ↑ UTIs، وكتير بيظهر بـ hydronephrosis.
        page: 597
        quote: "Bifurcation of ureteric bud before it enters the metanephric blastema creates a Y-shaped bifid ureter. Duplex collecting system can alternatively occur through two ureteric buds reaching and interacting with metanephric blastema. Strongly associated with vesicoureteral reflux and/or ureteral obstruction, ↑ risk for UTIs. Frequently presents with hydronephrosis."
      - kind: explain
        title: "Posterior urethral valves: الانسداد تحت الـ bladder"
        text: |-
          غشاء فاضل في الـ ==posterior (prostatic) urethra== في **الولاد**. لما يفضل، يسد مخرج البول.

          ولأن الانسداد تحت الـ bladder، كل اللي فوقه بيتأثر: الـ bladder بيبقى ==dilated أو thick-walled==، والكليتين الاتنين hydronephrosis. لو الانسداد شديد في الجنين ← oligohydramnios (يعني ممكن يوصل لـ Potter).

          وده **أشهر سبب لـ bladder outlet obstruction في الولاد الرضّع**.
        page: 597
        quote: "Membrane remnant in posterior (prostatic) urethra in males; its persistence can lead to urethral obstruction. Diagnosed prenatally by bilateral hydronephrosis and dilated or thick-walled bladder on ultrasound. Severe obstruction in fetus associated with oligohydramnios. Most common cause of bladder outlet obstruction in male infants."
      - kind: aside
        tone: trap
        text: "ركّز على مكان الانسداد: hydronephrosis في ==ناحية واحدة== و bladder سليم ← فوق الـ bladder (UPJ). hydronephrosis في ==الناحيتين== و bladder تخين ← تحت الـ bladder (posterior urethral valves في ولد)."
        page: 597
        quote: "Diagnosed prenatally by bilateral hydronephrosis and dilated or thick-walled bladder on ultrasound."
      - kind: match
        prompt: "وصّل كل عيب بالغلطة اللي عملته"
        pairs:
          - ["Horseshoe kidney", "Inferior poles fuse, trapped under the IMA"]
          - ["Unilateral renal agenesis", "Ureteric bud never develops"]
          - ["Multicystic dysplastic kidney", "Bud forms but fails to induce the mesenchyme"]
          - ["Duplex collecting system", "Bud bifurcates before reaching the blastema"]
          - ["Posterior urethral valves", "Membrane remnant in the prostatic urethra"]
        why: "كل واحد غلطة في خطوة: الطلوع (horseshoe)، الـ bud نفسه (agenesis)، الحوار (MCDK)، التقسيم (duplex)، والمخرج (valves)."
        page: 597
        quote: "Ureteric bud fails to develop and induce differentiation of metanephric mesenchyme → complete absence of kidney and ureter."
      - kind: check
        question: "A newborn boy has bilateral hydronephrosis and a thick-walled bladder on ultrasound, and there was oligohydramnios. Most likely cause?"
        options:
          - "Posterior urethral valves"
          - "Bilateral ureteropelvic junction obstruction"
          - "Duplex collecting system"
          - "Horseshoe kidney"
        answer: 0
        why:
          - "صح: الانسداد تحت الـ bladder في ولد، وده أشهر سبب لـ bladder outlet obstruction عند الرضّع."
          - "الـ UPJ فوق الـ bladder، فالـ bladder هيبقى صغير مش تخين."
          - "الـ duplex غالباً ناحية واحدة ومعاه reflux، والـ bladder طبيعي."
          - "الـ horseshoe ممكن يعمل hydronephrosis بس مش bladder تخين و oligohydramnios."
        page: 597
        quote: "Most common cause of bladder outlet obstruction in male infants."
      - kind: try
        items: [renal.L01.016, renal.L01.017, renal.L01.027, renal.L01.030, renal.L01.034]
    recap:
      - "Horseshoe: الـ inferior poles ملحومين ومتزنقين تحت الـ IMA؛ مع Turner و trisomies؛ hydronephrosis و stones و infection و cancer."
      - "Agenesis: الـ bud ما اتكوّنش. MCDK: اتكوّن وما حفّزش."
      - "Duplex system: bud اتقسم بدري ← Y ureter ← reflux و UTIs."
      - "Posterior urethral valves: ولد، hydronephrosis في الناحيتين و bladder تخين."
