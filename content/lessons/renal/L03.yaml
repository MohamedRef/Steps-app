        title: "مين بيطلّع الـ renin؟"
        text: |-
          الـ **JG cells** بتطلّع renin في 3 حالات:
          - ==↓ renal perfusion pressure== (بتحسه في الـ afferent arteriole)
          - ↑ renal sympathetic discharge (**β1**)
          - ↓ NaCl واصل للـ **macula densa**

          والـ renin بيحوّل angiotensinogen لـ angiotensin I، والـ **ACE** بيحوّله لـ angiotensin II. والـ ACE موجود في أنسجة كتير، بس أغلب التحويل في ==الرئة== (من الـ endothelial cells هناك). والـ ACE كمان بيكسر الـ **bradykinin**.
        page: 606
        quote: "Catalyzes conversion of angiotensin I to angiotensin II. Located in many tissues but conversion occurs most extensively in the lung. Produced by vascular endothelial cells in the lung."
