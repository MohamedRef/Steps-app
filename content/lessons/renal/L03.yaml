        page: 607
        quote: "NSAIDs block renal-protective prostaglandin synthesis → constriction of afferent arteriole and ↓ GFR; this may result in acute kidney injury in low renal blood flow states."
      - kind: sort
        prompt: "الحاجات دي بتدخّل الـ K+ الخلايا ولا بتطلّعه؟"
