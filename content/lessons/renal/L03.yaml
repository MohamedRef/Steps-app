      - kind: explain
        title: "مين اتغيّر الأول؟"
        text: |-
          القاعدة: ==metabolic== بيغيّر الـ **HCO3–**، و==respiratory== بيغيّر الـ **PCO2**.

          والتعويض دايماً في **نفس الاتجاه**:
          - Metabolic acidosis (HCO3– ↓) ← hyperventilation فوراً ← PCO2 ↓.
          - Metabolic alkalosis (HCO3– ↑) ← hypoventilation ← PCO2 ↑.
          - Respiratory acidosis (PCO2 ↑) ← الكلية ترجّع HCO3– أكتر (بياخد وقت).
          - Respiratory alkalosis (PCO2 ↓) ← الكلية ترجّع HCO3– أقل.

          والـ pH = 6.1 + log [HCO3–] / (0.03 × PCO2).
        page: 609
        quote: "Metabolic acid-base disorders cause HCO – 3 alterations. Respiratory acid-base disorders cause PCO2 alterations."
      - kind: explain
        title: "Winters: الرئة عوّضت صح؟"
        text: |-
          في الـ metabolic acidosis، الـ PCO2 المتوقع = ==1.5 × HCO3– + 8 ± 2==.
          - الـ PCO2 الفعلي **أعلى** من المتوقع ← فيه كمان respiratory acidosis (الرئة مش ملاحقة).
          - **أقل** ← فيه كمان respiratory alkalosis.
        page: 609
        quote: "If measured Pco2 > predicted Pco2 → concomitant respiratory acidosis; if measured Pco2 < predicted Pco2 → concomitant respiratory alkalosis"
      - kind: check
