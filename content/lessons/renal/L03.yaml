            <text x="10" y="195" class="t-sm t-mut">water-impermeable: TAL and early DCT</text>
          </svg>
        caption: "كل segment والنسبة اللي بيرجّعها من الـ Na+، والـ diuretic اللي بيشتغل عليه. الـ PCT بيشيل الحمل الأكبر، والـ collecting tubule بيضبط في الآخر."
        alt: "Nephron segments with sodium reabsorption share and the diuretics acting there: PCT 65-80% acetazolamide and SGLT-2 inhibitors; thin descending limb water only; thick ascending limb 10-20% loop diuretics; early DCT 5-10% thiazides; collecting tubule 3-5% amiloride, triamterene, spironolactone, eplerenone."
        page: 603
