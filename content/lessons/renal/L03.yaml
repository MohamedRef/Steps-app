          - { key: "G", text: "Gitelman: DCT" }
          - { key: "L", text: "Liddle: collecting tubule" }
          - { key: "S", text: "SAME (syndrome of apparent mineralocorticoid excess): collecting tubule" }
        hook: "والكتاب بيقولها كاملة: Fanconi's BaGeLS. الـ Fanconi الأول في الـ PCT، وبعدين BaGeLS على الترتيب لحد الآخر."
