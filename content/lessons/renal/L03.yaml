      - kind: explain
        title: "الـ respiratory والـ alkalosis"
        text: |-
          - **Respiratory acidosis** (hypoventilation): airway obstruction، lung disease حاد أو مزمن، opioids و sedatives، ضعف عضلات التنفس.
          - **Respiratory alkalosis** (hyperventilation): anxiety، hypoxemia (زي الأماكن العالية)، salicylates (في الأول)، tumor، pulmonary embolism، pregnancy.
          - **Metabolic alkalosis**: شوف ==urine Cl–==:
            - **< 20** ← saline-responsive: vomiting، diuretics اتاخدت من فترة، antacids.
            - **> 20** ← saline-resistant: hyperaldosteronism، Bartter، Gitelman، diuretics لسه بياخدها.
        page: 610
