schema: steps.lesson/v1
lecture: renal.L03
lessons:
  - id: renal.L03.lesson1
    title: "المية فين في الجسم، والكلية بتفلتر إزاي"
    hook: "60-40-20، وفلتر بيصد الـ albumin بالشحنة، وكلمة واحدة اسمها clearance هتحل نص مسائل الكلية"
    minutes: 9
    pages: [599, 600]
    topics: [course-of-ureters, fluid-compartments, glomerular-filtration-barrier, renal-clearance, glomerular-filtration-rate]
    goals:
      - "تعرف مسار الـ ureter وفين بيتعوّر في العمليات"
      - "تحفظ 60-40-20 وتعرف كل compartment بيتقاس بإيه"
      - "تفهم الـ clearance وتقارنه بالـ GFR"
    status: unverified
    steps:
      - kind: explain
        title: "الـ ureter: المية تحت الكوبري"
        text: |-
          الـ ureter بيطلع من الـ renal pelvis وينزل **retroperitoneal**:
          - **تحت** الـ gonadal arteries
          - **فوق** الـ common iliac artery
          - **تحت** الـ uterine artery (في الست) أو الـ vas deferens (في الراجل)

          والكتاب بيقولها: ==Water (ureters) flows over the iliacs and under the bridge==. عشان كده في عمليات الرحم، لما الجراح يربط الـ uterine أو ovarian vessels، ممكن يمسك الـ ureter معاهم ← انسداد أو تسريب.
        page: 599
        quote: "Course of ureter A : arises from renal pelvis, travels under gonadal arteries → over common iliac artery → under uterine artery/vas deferens (retroperitoneal). Gynecologic procedures (eg, ligation of uterine or ovarian vessels) may damage ureter → ureteral obstruction or leak."
      - kind: aside
        tone: exam
        text: "الحصوة بتقف في ==3 أماكن ضيقة==: الـ ureteropelvic junction، والـ pelvic inlet (وهو بيعدّي فوق الـ iliac)، والـ ureterovesical junction. وانقباض الـ bladder بيضغط الحتة اللي جوه الحيطة من الـ ureter، وده اللي بيمنع الـ reflux."
        page: 599
        quote: "Bladder contraction compresses the intramural ureter, preventing urine reflux. 3 common points of ureteral obstruction: ureteropelvic junction, pelvic inlet, ureterovesical junction."
      - kind: explain
        title: "60-40-20"
        text: |-
          من وزن الجسم:
          - **60%** مية (total body water)
          - **40%** جوه الخلايا (ICF): غالباً **K+** و Mg2+ و organic phosphates زي ATP. والكتاب بيقول ==HIKIN’: HI K+ INtracellularly==.
          - **20%** برّه الخلايا (ECF): غالباً **Na+** و Cl– و HCO3– و albumin.

          والـ ECF نفسه: 75% interstitial و 25% plasma. يعني الـ ICF ثلثين المية، والـ ECF ثلث.
        page: 599
        quote: "60–40–20 rule (% of body weight for average person): ▘ 60% total body water ▘ 40% ICF, mainly composed of K+ , Mg2+ , organic phosphates (eg, ATP) ▘ 20% ECF, mainly composed of Na+ , Cl– ,"
      - kind: reveal
        prompt: "لو عايز تقيس الـ plasma volume لوحده، والـ ECF كله، تحقن إيه في كل مرة؟ وليه؟"
        answer: |-
          - **Plasma volume**: ==radiolabeled albumin==، لأن الـ albumin كبير ومش بيخرج من الأوعية.
          - **ECF**: ==inulin أو mannitol==، لأنهم بيعدّوا الـ capillaries بس مش بيدخلوا الخلايا.

          وافتكر: plasma volume = TBV × (1 – Hct)، والـ serum osmolality الطبيعي 275-295 mOsm/kg.
        page: 599
        quote: "Plasma volume can be measured by radiolabeling albumin."
      - kind: explain
        title: "الفلتر: بالحجم وبالشحنة"
        text: |-
          الـ **glomerular filtration barrier** بيفلتر الـ plasma على أساس ==الحجم والشحنة==، وفيه 3 طبقات:
          - **Fenestrated capillary endothelium**: بيمنع خلايا الدم (حجم).
          - **GBM**: فيه type IV collagen و heparan sulfate.
          - **Podocyte foot processes** وبينهم الـ **slit diaphragms**: الـ SD بيمنع الجزيئات الأصغر زي البروتينات.

          و**الشحنة**: الفلتر فيه glycoproteins ==سالبة== بتطرد أي حاجة سالبة، وأهمها الـ **albumin**. لو الشحنة دي راحت، الـ albumin يعدّي.
        page: 599
        quote: "Charge barrier—glomerular filtration barrier contains ⊝ charged glycoproteins that prevent entry of ⊝ charged molecules (eg, albumin). Size barrier—fenestrated capillary endothelium (prevents entry of blood cells); SD (prevents entry of smaller molecules, eg, proteins). Podocyte FPs interpose with GBM—both charge and size barrier."
      - kind: figure
        title: "الـ 3 طبقات"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="20" class="t-sm t-b">Blood (capillary lumen)</text>
            <rect class="fg-acc" x="10" y="30" width="340" height="24" rx="4"/>
            <text x="20" y="47" class="t-sm">Fenestrated endothelium: stops blood cells</text>
            <rect class="fg-box" x="10" y="60" width="340" height="28" rx="4"/>
            <text x="20" y="79" class="t-sm">GBM: type IV collagen, heparan sulfate (⊝)</text>
            <rect class="fg-good" x="10" y="94" width="160" height="24" rx="4"/>
            <rect class="fg-good" x="190" y="94" width="160" height="24" rx="4"/>
            <text x="20" y="111" class="t-sm">podocyte foot process</text>
            <text x="200" y="111" class="t-sm">podocyte foot process</text>
            <text x="150" y="134" class="t-sm t-acc">slit diaphragm: stops proteins</text>
            <text x="10" y="160" class="t-sm t-b">Bowman space (filtrate)</text>
          </svg>
        caption: "الدم فوق والـ filtrate تحت. الشبابيك بتمنع الخلايا، والـ slit diaphragm بيمنع البروتين، والشحنة السالبة في الفلتر كله بتطرد الـ albumin."
        alt: "Layers from blood to Bowman space: fenestrated endothelium, glomerular basement membrane with type IV collagen and negatively charged heparan sulfate, podocyte foot processes with slit diaphragms between them."
        page: 599
        quote: "Composed of ▘ Fenestrated capillary endothelium ▘ Glomerular basement membrane (GBM) with type IV collagen chains and heparan sulfate ▘ Visceral epithelial layer consisting of podocyte foot processes (FPs) A and the specialized junctions between them, slit diaphragms (SDs)"
      - kind: check
        question: "A child has heavy albuminuria with no hematuria and a normal light-microscopy biopsy. Loss of what best explains albumin crossing the barrier?"
        options:
          - "The negative charge of the barrier"
          - "The endothelial fenestrations"
          - "Type IV collagen strength"
          - "The parietal layer of Bowman capsule"
        answer: 0
        why:
          - "صح: الـ albumin سالب، والفلتر بيطرده بشحنته السالبة. الشحنة راحت ← الـ albumin عدّى."
          - "الـ fenestrations بتمنع خلايا الدم، ومفيش hematuria."
          - "مشكلة الـ collagen بتعمل hematuria."
          - "الـ parietal layer مش جزء من الفلتر."
        page: 599
        quote: "Charge barrier—glomerular filtration barrier contains ⊝ charged glycoproteins that prevent entry of ⊝ charged molecules (eg, albumin)."
      - kind: explain
        title: "Clearance: كام ml plasma اتنضفوا في الدقيقة"
        text: |-
          الـ ==clearance== هو حجم الـ plasma اللي اتشال منه المادة دي خالص في البول في وحدة الزمن: **Cx = (Ux × V) / Px**.

          قارنه بالـ GFR:
          - **Cx < GFR**: المادة بتترجع (reabsorption)، أو مش بتتفلتر بحرية.
          - **Cx > GFR**: المادة بتتفرز (secretion).
          - **Cx = GFR**: لا بتترجع ولا بتتفرز.
        page: 600
        quote: "volume of plasma from which the substance is completely cleared in the urine per unit time."
      - kind: explain
        title: "الـ GFR: inulin والـ creatinine"
        text: |-
          الـ ==inulin== بيتفلتر بحرية، ولا بيترجع ولا بيتفرز، فالـ clearance بتاعه = الـ GFR بالظبط. والـ GFR الطبيعي حوالي **100 mL/min**.

          الـ **creatinine** بيدّيك رقم قريب، بس ==بيزوّد الـ GFR شوية== لأن الـ proximal tubule بيفرز منه شوية زيادة.

          والـ GFR نفسه = Kf [(PGC – PBS) – (πGC – πBS)]، والـ πBS عادة صفر (مفيش بروتين في Bowman space).
        page: 600
        quote: "Inulin clearance can be used to calculate GFR because it is freely filtered and is neither reabsorbed nor secreted."
      - kind: check
        question: "A drug's clearance is 250 mL/min while inulin clearance is 100 mL/min. How does the kidney handle the drug?"
        options:
          - "Filtered plus net tubular secretion"
          - "Filtered plus net reabsorption"
          - "Filtered only"
          - "Not freely filtered"
        answer: 0
        why:
          - "صح: الـ clearance أكبر من الـ GFR، يعني فيه حاجة اتفرزت فوق اللي اتفلتر."
          - "الـ reabsorption بيخلي الـ clearance أقل من الـ GFR."
          - "لو اتفلتر بس، الـ clearance = GFR زي الـ inulin."
          - "لو مش بيتفلتر بحرية، الـ clearance يقل."
        page: 600
        quote: "> GFR: net tubular secretion of X."
      - kind: try
        items: [renal.L03.002, renal.L03.006, renal.L03.015, renal.L03.019, renal.L03.025]
    recap:
      - "الـ ureter فوق الـ iliacs وتحت الكوبري (uterine artery أو vas deferens)."
      - "60-40-20؛ الـ K+ جوه والـ Na+ برّه. albumin للـ plasma، inulin/mannitol للـ ECF."
      - "الفلتر بالحجم (fenestrations و SD) وبالشحنة السالبة (يصد الـ albumin)."
      - "Inulin clearance = GFR. الـ creatinine بيزوّده شوية لأنه بيتفرز."
    practice: [renal.L03.001, renal.L03.002, renal.L03.003, renal.L03.004, renal.L03.005, renal.L03.006, renal.L03.007, renal.L03.008, renal.L03.009, renal.L03.010, renal.L03.011, renal.L03.012, renal.L03.013, renal.L03.014, renal.L03.015, renal.L03.016, renal.L03.017, renal.L03.018, renal.L03.019, renal.L03.020, renal.L03.021, renal.L03.022, renal.L03.023, renal.L03.024, renal.L03.025, renal.L03.026]
  - id: renal.L03.lesson2
    title: "الـ afferent والـ efferent: حنفيتين بيتحكموا في الـ GFR"
    hook: "افهم الحنفيتين، وجدول الـ glomerular dynamics كله هيطلع لوحده"
    minutes: 10
    pages: [600, 602]
    topics: [renal-blood-flow-autoregulation, effective-renal-plasma-flow, filtration, reabsorption-and-secretion-rate, glucose-clearance]
    goals:
      - "تفرّق بين الـ myogenic والـ tubuloglomerular feedback"
      - "تحسب RPF و RBF و FF"
      - "تعرف NSAIDs و ACE inhibitors بيعملوا إيه في الحنفيتين"
      - "تفهم منحنى الـ glucose والـ splay"
    status: unverified
    steps:
      - kind: explain
        title: "الكلية بتحمي نفسها: autoregulation"
        text: |-
          الكلية عايزة الـ RBF والـ GFR ثابتين مهما الضغط اتهز. فيه طريقتين، والاتنين بيقفلوا ==الـ afferent arteriole==:
          - **Myogenic**: الضغط يعلى ← الـ afferent يتمط ← العضلة نفسها تنقبض ← RBF يقل.
          - **Tubuloglomerular feedback**: ملح كتير (NaCl) يوصل للـ ==macula densa== ← إشارة paracrine ← الـ afferent يقفل ← RBF يقل. ولو الملح قليل يحصل العكس.
        page: 600
        quote: "Myogenic: ↑ arterial pressure → stretch of afferent arteriole→ mechanical activation of vascular smooth muscle → vasoconstriction of afferent arteriole → ↓ RBF."
      - kind: explain
        title: "الـ PAH: مادة الكلية بتشيلها كلها"
        text: |-
          الـ ==PAH== بيتفلتر حوالي 20% منه، والـ 80% الباقيين بيتفرزوا في الـ PT، يعني تقريباً **100% بيخرج** من أول لفة. فالـ PAH clearance = الـ plasma اللي دخل الكلية = **eRPF**، وهو بيقلل الـ RPF الحقيقي شوية.

          ومن الـ plasma للدم: **RBF = RPF / (1 − Hct)**، والكلية بتاخد **20%-25% من الـ cardiac output**.
        page: 600
        quote: "Effective renal plasma flow (eRPF) can be estimated using para-aminohippuric acid (PAH) clearance. Between filtration and secretion, there is nearly complete excretion of all PAH that enters the kidney."
      - kind: reveal
        prompt: "الـ PAH clearance طلع 600 mL/min والـ Hct 40%. الـ RBF كام؟"
        answer: "RBF = 600 / (1 − 0.4) = 600 / 0.6 = ==1000 mL/min==."
        page: 600
        quote: "Renal blood flow (RBF) = RPF/(1 − Hct). Usually 20%-25% of cardiac output."
      - kind: explain
        title: "الـ filtration fraction"
        text: |-
          **FF = GFR / RPF**، والطبيعي ==20%==: يعني من كل 100 ml plasma داخلين الـ glomerulus، 20 بيتفلتروا.

          و**filtered load** = GFR × تركيز المادة في الـ plasma.
        page: 601
        quote: "Filtration fraction (FF) = GFR/RPF. Normal FF = 20%. Filtered load (mg/min) = GFR (mL/min) × plasma concentration (mg/mL)."
      - kind: figure
        title: "الحنفيتين"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rL3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <line class="fg-arrow" x1="10" y1="80" x2="125" y2="80" marker-end="url(#rL3a)" stroke-width="6"/>
            <text x="15" y="65" class="t-sm t-b">Afferent</text>
            <text x="15" y="105" class="t-sm t-good">PG dilate</text>
            <text x="15" y="122" class="t-sm t-bad">NSAIDs → constrict</text>
            <circle class="fg-acc" cx="180" cy="80" r="45"/>
            <text x="150" y="84" class="t-sm t-b">Glomerulus</text>
            <line class="fg-arrow" x1="225" y1="80" x2="350" y2="80" marker-end="url(#rL3a)" stroke-width="3"/>
            <text x="240" y="65" class="t-sm t-b">Efferent</text>
            <text x="240" y="105" class="t-sm t-bad">AT II constricts</text>
            <text x="240" y="122" class="t-sm t-good">ACEi → dilate</text>
            <text x="90" y="160" class="t-sm t-mut">pressure in the glomerulus = GFR</text>
          </svg>
        caption: "الـ glomerulus بين حنفيتين. الـ prostaglandins بتفتح اللي داخلة (afferent)، والـ angiotensin II بيقفل اللي خارجة (efferent). الاتنين بيحافظوا على الضغط جوه."
        alt: "Afferent arteriole into the glomerulus and efferent arteriole out. Prostaglandins dilate the afferent, NSAIDs constrict it; angiotensin II constricts the efferent, ACE inhibitors dilate it."
        page: 601
        quote: "Prostaglandins Dilate Afferent arteriole (PDA). Angiotensin II Constricts Efferent arteriole (ACE)."
      - kind: explain
        title: "PDA و ACE"
        text: |-
          الكتاب بيدّيك كلمتين:
          - ==PDA==: **P**rostaglandins **D**ilate **A**fferent ← RPF و GFR يعلوا مع بعض، فالـ FF ثابت.
          - ==ACE==: **A**ngiotensin II **C**onstricts **E**fferent ← RPF يقل والـ GFR يعلى ← FF يعلى.

          عشان كده ==NSAIDs + ACE inhibitors مع بعض خطر==: الحنفية الداخلة اتقفلت والخارجة اتفتحت، فالضغط جوه الـ glomerulus يقع والـ GFR يقع.
        page: 601
        quote: "Prostaglandins Dilate Afferent arteriole (PDA). Angiotensin II Constricts Efferent arteriole (ACE). RPF is best estimated with PAH clearance. NSAIDs and ACE inhibitors should not be given together → constriction of afferent and dilation of efferent arterioles."
      - kind: table
        title: "Changes in glomerular dynamics"
        columns: ["Change", "GFR", "RPF", "FF"]
        rows:
          - ["Afferent constriction", "↓", "↓", "—"]
          - ["Efferent constriction", "↑", "↓", "↑"]
          - ["↑ plasma protein", "↓", "—", "↓"]
          - ["↓ plasma protein", "↑", "—", "↑"]
          - ["Ureter constriction", "↓", "—", "↓"]
          - ["Dehydration", "↓", "↓↓", "↑"]
        hide: [[1, 1], [1, 3], [2, 1], [4, 1], [5, 2], [5, 3]]
        page: 601
        quote: "Changes in glomerular dynamics GFR RPF FF (GFR/RPF) Afferent arteriole constriction ↓ ↓ — Efferent arteriole constriction ↑ ↓ ↑"
      - kind: aside
        tone: tip
        text: "متحفظش الجدول، افهمه: الـ **plasma protein** بيشد المية جوه الـ capillary (πGC)، فلو زاد الـ GFR يقل. و**ureter مسدود** يرفع الضغط في Bowman space (PBS) فالـ GFR يقل. والـ RPF في الاتنين ثابت لأن الأوعية ما اتلمستش."
        page: 601
        quote: "Net filtration pressure = (PGC + πBS ) – (PBS + πGC )"
      - kind: check
        question: "A man on lisinopril takes ibuprofen for a week and his creatinine doubles. What happened to his arterioles?"
        options:
          - "Afferent constriction and efferent dilation"
          - "Afferent dilation and efferent constriction"
          - "Both dilated"
          - "Both constricted"
        answer: 0
        why:
          - "صح: الـ NSAID شال الـ prostaglandins فالـ afferent قفل، والـ ACE inhibitor شال الـ AT II فالـ efferent اتفتح."
          - "ده العكس، وكان هيرفع الـ GFR."
          - "لو الاتنين اتفتحوا الـ RPF يعلى من غير وقعة GFR كبيرة."
          - "قفل الـ efferent كان هيحافظ على الـ GFR شوية."
        page: 601
        quote: "NSAIDs and ACE inhibitors should not be given together → constriction of afferent and dilation of efferent arterioles."
      - kind: explain
        title: "Reabsorption ولا secretion؟ احسبها"
        text: |-
          - **Filtered load** = GFR × Px
          - **Excretion** = V × Ux
          - لو اللي خرج ==أقل== من اللي اتفلتر: reabsorption = filtered − excreted.
          - لو اللي خرج ==أكتر==: secretion = excreted − filtered.

          ونفس الفكرة في الـ **FENa**: Na+ اللي خرج على Na+ اللي اتفلتر = (UNa × PCr) / (UCr × PNa).
        page: 602
        quote: "Filtered load = GFR × Px . Excretion rate = V × Ux . Reabsorption rate = filtered – excreted. Secretion rate = excreted – filtered."
      - kind: explain
        title: "الـ glucose: لحد 200 والكلية بتلحق"
        text: |-
          في المستوى الطبيعي (60-120 mg/dL) كل الـ glucose بيترجع في الـ **PCT** بالـ Na+/glucose cotransport.

          - عند حوالي ==200 mg/dL== في البلازما يبدأ الـ glucosuria (**threshold**).
          - عند حوالي **375 mg/min** كل الـ transporters مليانة (**Tm**).
          - بين الاتنين المنحنى بيلف بالراحة (==splay==)، لأن الـ nephrons مش زي بعض: كل واحد له Tm مختلف.

          و**SGLT2 inhibitors** (الـ -flozins) بيعملوا glucosuria تحت 200. والـ glucosuria علامة مهمة للـ diabetes.
        page: 602
        quote: "In adults, at plasma glucose of ∼200 mg/dL, glucosuria begins (threshold). At rate of ∼375 mg/min, all transporters are fully saturated"
      - kind: check
        question: "A pregnant woman at 26 weeks has glucosuria with a normal fasting glucose and a normal glucose challenge. Why?"
        options:
          - "↑ GFR, so more glucose is filtered and the threshold is reached at lower plasma glucose"
          - "Gestational diabetes"
          - "Fanconi syndrome"
          - "↓ renal plasma flow"
        answer: 0
        why:
          - "صح: الحمل بيرفع الـ GFR، فالـ glucose المفلتر يزيد ويعدّي الـ threshold وهو طبيعي في الدم."
          - "تحاليل السكر طبيعية."
          - "الـ Fanconi بيضيع amino acids و phosphate و HCO3– كمان."
          - "الحمل بيرفع الـ flow مش بيقلله."
        page: 602
        quote: "Normal pregnancy is associated with ↑ GFR. With ↑ filtration of all substances, including glucose, the glucose threshold occurs at lower plasma glucose concentrations → glucosuria at normal plasma glucose levels."
      - kind: try
        items: [renal.L03.028, renal.L03.031, renal.L03.037, renal.L03.040, renal.L03.049]
    recap:
      - "Autoregulation: myogenic و tubuloglomerular، الاتنين بيقفلوا الـ afferent."
      - "PAH clearance = eRPF؛ RBF = RPF/(1 − Hct)؛ FF = GFR/RPF = 20%."
      - "PDA: prostaglandins تفتح الـ afferent. ACE: AT II يقفل الـ efferent. NSAIDs + ACEi ← GFR يقع."
      - "Glucose: threshold ~200 mg/dL، Tm ~375 mg/min، والـ splay من اختلاف الـ nephrons."
    practice: [renal.L03.027, renal.L03.028, renal.L03.029, renal.L03.030, renal.L03.031, renal.L03.032, renal.L03.033, renal.L03.034, renal.L03.035, renal.L03.036, renal.L03.037, renal.L03.038, renal.L03.039, renal.L03.040, renal.L03.041, renal.L03.042, renal.L03.043, renal.L03.044, renal.L03.045, renal.L03.046, renal.L03.047, renal.L03.048, renal.L03.049, renal.L03.050, renal.L03.051, renal.L03.052, renal.L03.053]
  - id: renal.L03.lesson3
    title: "رحلة على الـ nephron: كل حتة بتعمل إيه"
    hook: "لو عرفت كل segment بيشيل إيه، هتعرف كل diuretic وكل syndrome من غير حفظ"
    minutes: 9
    pages: [603, 603]
    topics: [nephron-transport-physiology]
    goals:
      - "تعرف الـ PCT بيرجّع إيه وقد إيه"
      - "تفهم ليه الـ thick ascending limb بيرجّع Mg2+ و Ca2+"
      - "تعرف الـ aldosterone والـ ADH بيشتغلوا إزاي في الـ collecting tubule"
    status: unverified
    steps:
      - kind: explain
        title: "الـ PCT: الشغيل"
        text: |-
          الـ **early PCT** عنده brush border، وبيرجّع ==كل الـ glucose والـ amino acids==، ومعظم الـ HCO3– و Na+ و Cl– و PO43– و K+ والمية والـ uric acid. والرجوع ده **isotonic** (ملح ومية بنفس النسبة). وبيرجّع **65%-80%** من الـ Na+ والمية.

          وكمان بيعمل **NH3** ويفرزه، وده اللي بيخلي الكلية تقدر تطلّع H+ أكتر.

          والهرمونات هنا:
          - **PTH** بيمنع الـ Na+/PO43– cotransport ← الـ phosphate يخرج في البول.
          - **AT II** بيشغّل الـ Na+/H+ exchange ← Na+ ومية و HCO3– يرجعوا (وده سبب الـ ==contraction alkalosis==).
        page: 603
        quote: "PTH—inhibits Na+/PO 3– 4 cotransport → ↑ PO 3– 4 excretion. AT II—stimulates Na+/H+ exchange → ↑ Na+, H2O, and HCO −"
      - kind: explain
        title: "الـ loop: نازل مية، طالع ملح"
        text: |-
          - **Thin descending limb**: بيرجّع ==مية بس== (مش بيعدّي Na+)، لأن الـ medulla حواليه مالحة. فالبول يبقى **hypertonic**. ده الـ concentrating segment.
          - **Thick ascending limb**: بيرجّع Na+ و K+ و Cl– (بالـ Na+/K+/2Cl–)، و==مش بيعدّي مية==، فالبول بيخف وهو طالع. بيرجّع **10%-20%** من الـ Na+.
        page: 603
        quote: "Thin descending loop of Henle—passively reabsorbs H2O via medullary hypertonicity (impermeable to Na+). Concentrating segment. Makes urine hypertonic."
      - kind: reveal
        prompt: "الـ thick ascending limb مفيهوش transporter للـ Mg2+ ولا للـ Ca2+. أمال بيرجّعهم إزاي؟"
        answer: "الـ K+ اللي دخل بيرجع يهرب للـ lumen (**K+ backleak**)، فالـ lumen يبقى ==⊕ موجب==. الشحنة الموجبة دي بتزق الـ Mg2+ والـ Ca2+ (موجبين) **بين الخلايا** (paracellular) للدم. عشان كده الـ loop diuretics لما توقف الـ transporter، الشحنة دي تروح والـ Mg2+ والـ Ca2+ يضيعوا في البول."
        page: 603
        quote: "Indirectly induces paracellular reabsorption of Mg2+ and Ca2+ through ⊕ lumen potential generated by K+ backleak. Impermeable to H2O. Makes urine less concentrated as it ascends."
      - kind: explain
        title: "الـ early DCT: أخف بول"
        text: |-
          بيرجّع Na+ و Cl– (ده مكان الـ **thiazides**)، و==مش بيعدّي مية==، فالبول بيبقى **fully dilute (hypotonic)**. بيرجّع **5%-10%** من الـ Na+.

          والـ **PTH** هنا بيزوّد الـ Ca2+/Na+ exchange ← ==Ca2+ يرجع==.
        page: 603
        quote: "Early DCT—reabsorbs Na+, Cl−. Impermeable to H2O. Makes urine fully dilute (hypotonic). PTH—↑ Ca2+/Na+ exchange → ↑ Ca2+ reabsorption. 5%-10% Na+ reabsorbed."
      - kind: explain
        title: "الـ collecting tubule: الضبط النهائي"
        text: |-
          بيرجّع Na+ قصاد إنه يفرز K+ و H+، والـ **aldosterone** هو اللي بيتحكم (على الـ mineralocorticoid receptor ← mRNA ← بروتين جديد):
          - في الـ **principal cells**: ↑ ENaC و ↑ Na+/K+ pump و ↑ K+ conductance ← الـ Na+ يدخل والـ lumen يبقى ==سالب== ← الـ K+ يخرج.
          - في الـ **α-intercalated cells**: الـ lumen السالب ← ↑ H+ ATPase ← H+ يخرج ← ↑ HCO3–/Cl– exchanger.

          والـ **ADH** على الـ ==V2 receptor== ← aquaporins تتركّب على الناحية الـ apical ← مية ترجع. والـ urea بيرجع في الـ **medullary** collecting duct بس. الـ segment ده بيرجّع **3%-5%** من الـ Na+.
        page: 603
        quote: "Aldosterone—acts on mineralocorticoid receptor → mRNA → protein synthesis. In principal cells: ↑ apical K+ conductance, ↑ Na+/K+ pump, ↑ epithelial Na+ channel (ENaC) activity → lumen negativity → K+ secretion."
      - kind: figure
        title: "الـ nephron ومكان كل diuretic"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="15" width="110" height="60" rx="8"/>
