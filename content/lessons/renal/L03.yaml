        caption: "3 إشارات بتطلّع الـ renin، والـ AT II بيرد بكل الطرق اللي ترجّع الضغط والحجم: يقفل الأوعية، يحافظ على الـ GFR، يرجّع ملح ومية، ويطلّع aldosterone و ADH ويعطّشك."
