      - kind: explain
        title: "Fanconi: الـ PCT كله وقع"
        text: |-
          عيب ==عام== في الـ PCT ← كل اللي الـ PCT بيرجّعه يضيع في البول: amino acids و glucose و HCO3– و PO43–.

          فالمريض عنده: **metabolic acidosis** (proximal RTA)، و **hypophosphatemia**، و **hypokalemia**. ومن الـ hypophosphatemia: ==growth restriction و rickets==. والـ volume depletion شائع.

          الأسباب: وراثية (Wilson، tyrosinemia، glycogen storage disease)، ischemia، **multiple myeloma**، أدوية (**ifosfamide**، **cisplatin**، **tenofovir**)، و lead poisoning.
        page: 604
        quote: "Hereditary defects (eg, Wilson disease, tyrosinemia, glycogen storage disease), ischemia, multiple myeloma, drugs (eg, ifosfamide, cisplatin, tenofovir, lead poisoning"
      - kind: explain
        title: "Bartter و Gitelman: الـ diuretic اللي جوه الجسم"
        text: |-
          الاتنين **autosomal recessive**، والاتنين metabolic alkalosis و hypokalemia و hypochloremia، والضغط ==طبيعي==.

          - **Bartter**: الـ Na+/K+/2Cl– في الـ thick ascending loop بايظ ← شبه ==loop diuretic== مزمن ← **hypercalciuria** (لأن شحنة الـ lumen الموجبة راحت).
          - **Gitelman**: الـ NaCl في الـ DCT بايظ ← شبه ==thiazide== مزمن ← **hypomagnesemia**، والـ urine Ca2+ قليل. وأخف من Bartter.
        page: 604
        quote: "Bartter syndrome Reabsorption defect in thick ascending loop of Henle (affects Na+ /K+ /2Cl– cotransporter) Metabolic alkalosis, hypochloremia, hypokalemia, hypercalciuria Autosomal recessive Presents similarly to chronic loop diuretic use"
      - kind: aside
        tone: trap
        text: "الفرق بين Bartter و Gitelman في سؤال واحد: ==الـ urine calcium==. عالي ← Bartter (زي الـ loop). واطي مع Mg2+ واطي ← Gitelman (زي الـ thiazide)."
        page: 605
        quote: "Gitelman syndrome — — ↑ ↑ ↓ ↓"
      - kind: explain
        title: "Liddle و SAME: aldosterone من غير aldosterone"
        text: |-
          الاتنين: **hypertension** و hypokalemia و metabolic alkalosis، بس الـ ==aldosterone واطي==.

          - **Liddle** (autosomal dominant): gain of function ← الـ Na+ channel مش بيتكسر ← Na+ يرجع زيادة في الـ collecting tubules. شبه hyperaldosteronism والـ aldosterone تقريباً صفر. العلاج: ==amiloride== (بيقفل الـ channel نفسه).
          - **SAME** (autosomal recessive): الـ cortisol يقدر يشغّل الـ mineralocorticoid receptor، والـ **11β-HSD** هو اللي بيحوّله لـ cortisone عشان ما يعملش كده. لو الإنزيم ناقص (وراثي، أو من **licorice** اللي فيه glycyrrhetinic acid) ← الـ cortisol يشتغل aldosterone. العلاج: K+-sparing diuretics، أو corticosteroids (تقلل الـ cortisol الداخلي).
        page: 604
        quote: "Can acquire disorder from glycyrrhetinic acid (present in licorice), which blocks activity of 11β-hydroxysteroid dehydrogenase"
      - kind: check
        question: "A teenager with severe hypertension, hypokalemia, and very low renin and aldosterone doesn't respond to spironolactone. Best drug?"
        options:
          - "Amiloride"
          - "Eplerenone"
          - "Hydrochlorothiazide"
          - "Dexamethasone"
        answer: 0
        why:
          - "صح: Liddle، الـ channel نفسه شغال زيادة، فلازم تقفله بالـ amiloride."
          - "الـ eplerenone زي الـ spironolactone، بيقفل الـ receptor اللي مش هو المشكلة."
          - "الـ thiazide هيزوّد الـ hypokalemia."
          - "الـ steroids لـ SAME مش Liddle."
        page: 604
        quote: "Presents similarly to hyperaldosteronism, but aldosterone is nearly undetectable Treatment: amiloride"
      - kind: table
        title: "Features of renal disorders"
        columns: ["Condition", "BP", "Renin", "Aldosterone"]
        rows:
          - ["Bartter / Gitelman", "—", "↑", "↑"]
          - ["Renin-secreting tumor", "↑", "↑", "↑"]
          - ["Primary hyperaldosteronism", "↑", "↓", "↑"]
          - ["Liddle / SAME", "↑", "↓", "↓"]
        hide: [[1, 2], [2, 2], [2, 3], [3, 2], [3, 3]]
        page: 605
        quote: "Primary hyperaldosteronism ↑ ↓ ↑"
      - kind: aside
        tone: tip
        text: "اقرا الـ renin الأول: ==renin عالي== يبقى الكلية حاسة إنها ناشفة (Bartter/Gitelman) أو فيه tumor بيعمله. ==renin واطي مع ضغط عالي== يبقى في حاجة تانية شغالة لوحدها: aldosterone عالي ← primary hyperaldosteronism؛ aldosterone واطي ← Liddle أو SAME."
        page: 605
        quote: "Renin-secreting tumor ↑ ↑ ↑"
      - kind: explain
        title: "[TF/P] على طول الـ PT"
        text: |-
          الـ [TF/P] = تركيز المادة في الـ tubular fluid على تركيزها في الـ plasma:
          - **> 1**: المادة بترجع أبطأ من المية، أو بتتفرز. أعلاهم ==PAH== (بيتفرز)، وبعده creatinine و inulin و urea و Cl–.
          - **= 1**: المادة والمية بيرجعوا بنفس السرعة: Na+ والـ osmolarity (و K+ تقريباً).
          - **< 1**: المادة بترجع أسرع من المية: HCO3– و amino acids و ==glucose== (أقلهم).

          الـ inulin تركيزه بيعلى (مش كميته) لأن المية بتمشي وهو قاعد. والـ Cl– بيرجع أبطأ من الـ Na+ في الأول، فتركيزه بيعلى وبعدين يثبت.
        page: 605
        quote: "Tubular inulin ↑ in concentration (but not amount) along the PT as a result of water reabsorption."
