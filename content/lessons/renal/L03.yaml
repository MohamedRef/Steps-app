      - kind: explain
        title: "ANP و BNP و ADH و aldosterone"
        text: |-
          - **ANP** (من الـ atria) و **BNP** (من الـ ventricles): بيطلعوا لما ==الحجم يزيد==. بيفتحوا الـ afferent (عن طريق cGMP) ← ↑ GFR، ويقللوا الـ renin، ويعملوا natriuresis. يعني عكس الـ RAAS.
          - **ADH**: أساساً بيظبط ==الـ osmolality==، وبيرد كمان على نقص الحجم. بيرجّع مية في الـ collecting ducts، و urea في الـ medullary ducts عشان الـ gradient.
          - **Aldosterone**: أساساً بيظبط ==حجم الـ ECF والـ Na+==، ويطلع في الـ hypovolemia، ويرد على الـ hyperkalemia بإنه يطلّع K+.

          والـ PTH بيطلع لما الـ Ca2+ يقل أو الـ PO43– يعلى أو الـ 1,25-(OH)2 D3 يقل: يرجّع Ca2+ في الـ DCT، ويطلّع PO43– من الـ PCT، ويزوّد الـ vitamin D.
        page: 606
        quote: "Primarily regulates serum osmolality; also responds to low blood volume states. Stimulates reabsorption of water in collecting ducts."
      - kind: explain
        title: "الـ JGA: 3 خلايا بيتكلموا"
        text: |-
          الـ **juxtaglomerular apparatus** = **mesangial cells** + **JG cells** (smooth muscle متعدّل في الـ afferent) + **macula densa** (حسّاس الـ NaCl في الـ DCT). والـ JG والـ macula densa بيتكلموا بـ ==gap junctions==.

          الـ macula densa تحس NaCl قليل ← renin ← الـ efferent يقفل ← ↑ GFR.

          والـ JGA بيحمي الـ GFR على المدى القصير بالـ autoregulation، وعلى المدى الطويل بالـ RAAS. و==β-blockers== بتنزّل الضغط بإنها تقلل الـ CO وتقفل الـ β1 على الـ JGA ← renin يقل.
        page: 607
        quote: "Consists of mesangial cells, JG cells (modified smooth muscle of afferent arteriole), and the macula densa (NaCl sensor located at the DCT)."
      - kind: table
        title: "الكلية كغدة"
        columns: ["Product", "Made by / when", "Does"]
        rows:
          - ["Erythropoietin", "Peritubular interstitial cells, in hypoxia", "↑ RBC production; given in CKD anemia (risk: hypertension)"]
          - ["Calcitriol", "PCT 1α-hydroxylase (↑ by PTH)", "↑ gut Ca2+ absorption"]
          - ["Prostaglandins", "Paracrine", "Dilate afferent → ↑ RBF"]
          - ["Dopamine", "PT cells", "Natriuresis; low dose ↑ RBF, high dose vasoconstricts"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 2]]
        page: 607
        quote: "Released by interstitial cells in peritubular capillary bed in response to hypoxia. Stimulates RBC proliferation in bone marrow. Administered for anemia secondary to chronic kidney disease. Adverse effect: ↑ risk of hypertension in some individuals."
      - kind: aside
        tone: exam
