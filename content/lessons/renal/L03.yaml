        page: 606
        quote: "Secreted by JG cells in response to ↓ renal perfusion pressure (detected in afferent arteriole)"
      - kind: check
        question: "A man on lisinopril gets a dry cough and lip swelling. Which substance built up?"
        options:
          - "Bradykinin"
