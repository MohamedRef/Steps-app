        quote: "Homocysteine Methionine Cystathionine synthase Methionine synthase Serine Cystathionine Methyl B12"
      - kind: aside
        tone: exam
        text: "Homocystinuria شكلها زي Marfan (طويل ورفيع)، بس العدسة بتتخلع ==لتحت وجوه== (Marfan: لفوق وبره)، وفيها ==thrombosis== و intellectual disability."
        page: 83
        quote: "In homocystinuria, lens subluxes “down and in” (vs Marfan, “up and fans out”)."
      - kind: check
        question: "A tall boy with lens dislocated down and in has DVT; homocysteine and methionine are both high. Diet?"
        options: ["↓ methionine, ↑ cysteine", "↑ methionine", "↓ phenylalanine", "↓ branched-chain amino acids"]
        answer: 0
        why:
          - "صح: cystathionine synthase deficiency."
          - "ده لنقص methionine synthase، والـ methionine فيه واطي."
          - "ده الـ PKU."
          - "ده الـ MSUD."
        page: 83
        quote: "Cystathionine synthase deficiency (treatment: ↓ methionine, ↑ cysteine, ↑ B6, B12, and folate in diet)"
      - kind: explain
        title: "Cystinuria"
        text: |-
          - Transporter في الـ PCT والأمعاء بايظ لـ ==COLA==: Cystine و Ornithine و Lysine و Arginine.
          - الـ cystine بيترسب ← ==حصوات سداسية== متكررة.
          - العلاج: urinary ==alkalinization== (potassium citrate، acetazolamide)، penicillamine، مية كتير، وأكل قليل الـ methionine.
        page: 83
        quote: "Excess cystine in the urine can lead to recurrent precipitation of hexagonal cystine stones."
      - kind: explain
        title: "Organic acidemias"
        text: |-
          - رضيع: رضاعة ضعيفة، ترجيع، hypotonia، و ==high anion gap acidosis==، مع hypoglycemia و hyperammonemia.
          - **Propionic**: propionyl-CoA carboxylase (biotin) ← ↑ propionyl-CoA، ↓ methylmalonic acid.
          - **Methylmalonic**: methylmalonyl-CoA mutase أو ==B12== ناقص.
          - الأكل: قليل في ==VOMIT==: Valine، Odd-chain fatty acids، Methionine، Isoleucine، Threonine.
        page: 83
        quote: "Inhibits gluconeogenesis → ↓ fasting blood glucose levels, ↑ ketoacidosis → high anion gap metabolic acidosis ▘ Inhibits urea cycle → hyperammonemia"
      - kind: try
