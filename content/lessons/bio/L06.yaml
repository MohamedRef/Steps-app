  - id: bio.L06.lesson9
    title: "الدهون والـ ketones والصيام"
    hook: "طفل جاله نزلة معوية وما أكلش من امبارح: سكره واطي، ومفيش ketones في البول. الجسم مش عارف يحرق الدهون"
    minutes: 10
    pages: [87, 89]
    topics: [fatty-acid-metabolism, ketone-bodies, fasted-vs-fed-lipid, metabolic-fuel-use, fasting-and-starvation]
    goals:
      - "تفرّق بين بناء الدهون وحرقها"
      - "تعرف نقص الـ carnitine والـ MCAD"
      - "تفهم الـ ketone bodies ومين بيستخدمها"
      - "تعرف الوقود في كل مرحلة من الصيام"
    status: unverified
    steps:
      - kind: explain
        title: "بناء ضد حرق"
        text: |-
          - **البناء** في الـ cytoplasm: الـ ==citrate== بيطلع من الـ mitochondria ("Sytrate" = synthesis). الكبد والثدي والدهون.
          - **الحرق**: الـ long-chain fatty acids محتاجة ==carnitine== تدخل الـ mitochondria ("carnitine = carnage").
        page: 87
        quote: "Long-chain fatty acid (LCFA) degradation requires carnitine-dependent transport into the mitochondrial matrix."
      - kind: explain
        title: "امشي على رسمة الدهون"
        text: |-
          **البناء** (cytoplasm): الـ citrate يطلع من الـ mitochondria ← **ATP citrate lyase** يطلّع acetyl-CoA ← ==acetyl-CoA carboxylase== (biotin؛ الـ insulin بيشغّله والـ glucagon بيقفله) ← malonyl-CoA ← **palmitate** (fatty acid فيه 16 كربونة).

          **الحرق** (mitochondria): fatty acid + CoA ← fatty acyl-CoA (fatty acyl-CoA synthetase) ← ==carnitine shuttle== (carnitine palmitoyl transferase I، والـ malonyl-CoA بيقفله عشان مانبنيش ونحرق في نفس الوقت) ← β-oxidation (acyl-CoA dehydrogenases) ← acetyl-CoA ← TCA أو ketones.

          لو الـ carnitine مش داخل الخلية، الـ LCFAs بتتراكم في الـ cytosol بشكل سام. والـ MCAD deficiency كمان ممكن يعمل hyperammonemia.
        page: 87
        quote: "Fatty acid synthesis (palmitate, a 16C FA)"
      - kind: table
        title: "مرضين في حرق الدهون"
        columns: ["", "1° carnitine deficiency", "MCAD deficiency"]
        rows:
          - ["Problem", "LCFAs can't enter mitochondria", "Fatty acids not broken to acetyl-CoA"]
          - ["Sugar and ketones", "Hypoketotic hypoglycemia", "Hypoketotic hypoglycemia"]
          - ["Clue", "Cardiomyopathy, hypotonia", "↑ acyl carnitines, sudden death"]
          - ["Advice", "—", "Avoid fasting"]
        hide: [[2, 1], [2, 2], [3, 2]]
        page: 87
        quote: "Medium-chain acyl-CoA dehydrogenase deficiency—↓ ability to break down fatty acids into acetyl-CoA → accumulation of fatty acyl carnitines and dicarboxylic acids in the blood with hypoketotic hypoglycemia."
      - kind: check
        question: "A 2-year-old fasted 18 hours and seized. Glucose low, no urine ketones, high acylcarnitines. Advice?"
        options: ["Avoid fasting", "Avoid fruit", "Lactose-free diet", "Restrict leucine"]
        answer: 0
        why:
          - "صح: MCAD deficiency."
          - "ده للـ fructose intolerance."
          - "ده للـ galactosemia."
          - "ده للـ MSUD."
        page: 87
        quote: "Treat by avoiding fasting."
      - kind: explain
        title: "الـ ketone bodies"
        text: |-
          - الكبد بيعمل acetoacetate و ==β-hydroxybutyrate== للعضلات والمخ. والـ acetone بيطلع في النفس (ريحة فاكهة).
          - في الجوع والـ DKA، الـ oxaloacetate بيروح للـ gluconeogenesis، فالـ acetyl-CoA بيروح ketones.
          - الـ urine test بيشوف الـ acetoacetate ==بس==، مش الـ β-hydroxybutyrate.
          - الـ RBC (مفيهاش mitochondria) والـ ==الكبد== (ناقصه β-ketoacyl-CoA transferase) مش بيستخدموها.
        page: 88
        quote: "In prolonged starvation and diabetic ketoacidosis, oxaloacetate is depleted for gluconeogenesis."
      - kind: explain
        title: "الـ ketones من الكبد للعضلة، والكحول"
        text: |-
          - **في الكبد**: 2 acetyl-CoA ← acetoacetyl-CoA ← ==HMG-CoA== ← acetoacetate ⇄ β-hydroxybutyrate. جزء من الـ acetoacetate يبقى **acetone** ويطلع مع النَفَس.
          - **في الأنسجة التانية** (زي العضلة): بتاخد الاتنين وترجّعهم acetyl-CoA وتحرقه في الـ TCA. الكبد نفسه ما يقدرش.
          - **الكحول**: الـ NADH العالي بيحوّل الـ oxaloacetate لـ malate ← الـ TCA يهدى ← الـ gluconeogenesis تقل ← ==fasting hypoglycemia==.
        page: 88
        quote: "In chronic alcohol overuse, ↑ NADH → shunting of oxaloacetate to malate → TCA cycle downregulation → ↓ gluconeogenesis → fasting hypoglycemia."
      - kind: table
        title: "السكر والـ ketones بيقولولك المرض"
        columns: ["Deficiency", "Ketones", "Glucose"]
        rows:
          - ["OTC", "Normal", "Normal"]
          - ["MCAD", "Low", "Low"]
          - ["Propionic, methylmalonic", "High", "Low"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 88
        quote: "DEFICIENCY OTC (urea cycle) MCAD deficiency Methylmalonic acidemia, propionic acidemia"
      - kind: aside
        tone: tip
        text: "**HMG-CoA lyase** ← ketones. **HMG-CoA reductase** ← cholesterol (ده اللي الـ statins بتوقفه)."
        page: 88
        quote: "HMG-CoA lyase for ketone body production. HMG-CoA reductase for cholesterol synthesis."
      - kind: explain
        title: "الدهون في الجوع والشبع"
        text: |-
          - **صايم**: epinephrine و glucagon ← cAMP ← PKA ← ==hormone-sensitive lipase== ← FFA و glycerol.
          - **شبعان**: insulin ← ==lipoprotein lipase== (مع apo CII) ← الـ FFA تدخل الخلية وتتخزن.
        page: 88
        quote: "Protein kinase A TG cAMP HSL-P ATP FFA Glycerol Epinephrine Glucagon"
      - kind: figure
        title: "الوقود مع الوقت"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b6e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <line class="fg-arrow" x1="10" y1="30" x2="350" y2="30" marker-end="url(#b6e)"/>
            <text x="10" y="20" class="t-sm t-mut">Exercise</text>
            <text x="10" y="50" class="t-sm">2 s: ATP</text>
            <text x="90" y="50" class="t-sm">10 s: creatine-P</text>
            <text x="210" y="50" class="t-sm">1 min+: aerobic</text>
            <line class="fg-arrow" x1="10" y1="90" x2="350" y2="90" marker-end="url(#b6e)"/>
            <text x="10" y="80" class="t-sm t-mut">Starvation</text>
            <text x="10" y="112" class="t-sm">Day 1: glycogen</text>
            <text x="120" y="112" class="t-sm">Days 1-3: FFA, gluconeo</text>
            <text x="10" y="135" class="t-sm t-acc">After day 3: ketones feed the brain</text>
            <text x="10" y="158" class="t-sm t-bad">Then protein breakdown → organ failure</text>
          </svg>
        caption: "في المجهود: ATP ثانيتين، creatine phosphate لحد 10 ثواني، وبعدين aerobic. في الجوع: الـ glycogen بيخلص بعد يوم، وبعد اليوم التالت الـ ketones بتأكّل المخ، ولما الدهون تخلص البروتين بيتكسر."
        alt: "Exercise timeline: stored ATP for 2 seconds, creatine phosphate to 10 seconds, then aerobic metabolism. Starvation timeline: glycogen on day 1, free fatty acids and gluconeogenesis on days 1 to 3, ketone bodies feed the brain after day 3, then protein breakdown and organ failure."
        page: 89
        quote: "Glycogen reserves depleted after day 1."
      - kind: aside
        tone: tip
        text: "السعرات: carb و protein ==4==، alcohol ==7==، fat ==9==. عدد الحروف = عدد السعرات (carb، alcohol، fatty acid بالإنجليزي)."
        page: 89
        quote: "1g carb/protein = 4 kcal 1g alcohol = 7 kcal 1g fatty acid = 9 kcal (# letters = # kcal)"
      - kind: aside
        tone: tip
        text: "الهرمونات: بعد الأكل الـ ==insulin== بيخزّن TG و glycogen وكمان بيبني بروتين. بين الوجبات الـ ==glucagon و epinephrine== بيصرفوا من المخزون."
        page: 89
        quote: "Glucagon and epinephrine stimulate use of fuel reserves."
      - kind: check
        question: "A man on day 10 of a hunger strike. Main fuel for his brain?"
        options: ["Ketone bodies", "Liver glycogen", "Fatty acids directly", "Muscle protein"]
        answer: 0
        why:
          - "صح: بعد اليوم التالت، الـ ketones."
          - "الـ glycogen خلص بعد يوم."
          - "الـ fatty acids مش بتغذي المخ مباشرة."
          - "البروتين بيتحافظ عليه لحد ما الدهون تخلص."
        page: 89
        quote: "Adipose stores (ketone bodies become the main source of energy for the brain)."
      - kind: try
        items: [bio.L06.129, bio.L06.130, bio.L06.134, bio.L06.132, bio.L06.135]
    recap:
      - "Citrate للبناء، carnitine للحرق."
      - "Carnitine و MCAD: hypoketotic hypoglycemia؛ MCAD: ابعد عن الصيام."
      - "Urine test بيشوف acetoacetate بس. الكبد والـ RBC مش بيستخدموا ketones."
      - "HSL في الصيام، LPL في الشبع."
      - "Glycogen يوم، بعد اليوم التالت ketones للمخ."
