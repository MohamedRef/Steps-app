schema: steps.lesson/v1
lecture: bio.L06
lessons:
  - id: bio.L06.lesson1
    title: "خريطة الـ metabolism: مين بيتحكم ومين بيشيل إيه"
    hook: "قبل ما تدخل في أي مسار: كل مسار ليه enzyme واحد بيتحكم فيه، ومكان بيحصل فيه، وحاجة بتشيل الطاقة"
    minutes: 10
    pages: [71, 73]
    topics: [enzyme-terminology, rate-determining-enzymes, metabolic-compartmentation, summary-of-pathways, activated-carriers, universal-electron-acceptors, hexokinase-vs-glucokinase]
    goals:
      - "تفهم أسامي الـ enzymes من وظيفتها"
      - "تحفظ الـ rate-limiting enzymes ومين بيشغّلها"
      - "تعرف المسار بيحصل فين، والـ NADPH بيروح فين"
      - "تفرّق بين hexokinase و glucokinase"
    status: unverified
    steps:
      - kind: explain
        title: "الاسم بيقولك الشغلانة"
        text: |-
          - **Kinase**: بيحط phosphate من ==ATP==. **Phosphorylase**: بيحط phosphate من غير ATP (glycogen phosphorylase). **Phosphatase**: بيشيل الـ phosphate.
          - **Carboxylase**: بيحط carboxyl بمساعدة ==biotin==. **Mutase**: بينقل group جوه نفس الجزيء (methylmalonyl-CoA mutase، B12).
          - **Synthase**: بيبني من غير ATP.
        page: 71
        quote: "Carboxylase Transfers carboxyl groups (−COOH) with the help of biotin (eg, pyruvate carboxylase)."
      - kind: table
        title: "الـ rate-limiting enzymes"
        columns: [Process, Enzyme]
        rows:
          - ["Glycolysis", "PFK-1"]
          - ["Gluconeogenesis", "Fructose-1,6-bisphosphatase 1"]
          - ["TCA cycle", "Isocitrate dehydrogenase"]
          - ["Urea cycle", "CPS I"]
          - ["Fatty acid synthesis", "Acetyl-CoA carboxylase"]
          - ["Fatty acid oxidation", "Carnitine acyltransferase I"]
          - ["Cholesterol synthesis", "HMG-CoA reductase"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
        page: 71
        quote: "Cholesterol synthesis HMG-CoA reductase Insulin ⊕, thyroxine ⊕, estrogen ⊕ Glucagon ⊝, cholesterol ⊝"
      - kind: reveal
        prompt: "بعد الأكل، ليه الكبد مش بيحرق الدهون اللي لسه عاملها؟"
        answer: "الـ insulin والـ citrate بيشغّلوا ==acetyl-CoA carboxylase== فيطلع malonyl-CoA. والـ malonyl-CoA ده نفسه بيوقف ==carnitine acyltransferase I==، فالدهون الجديدة مش بتدخل الـ mitochondria تتحرق."
        page: 71
        quote: "Fatty acid oxidation Carnitine acyltransferase I Malonyl-CoA ⊝"
      - kind: check
        question: "Which molecule activates the rate-limiting enzyme of the urea cycle?"
        options: ["N-acetylglutamate", "Malonyl-CoA", "Citrate", "PRPP", "AMP"]
        answer: 0
        why:
          - "صح: N-acetylglutamate بيشغّل CPS I."
          - "ده بيوقف carnitine acyltransferase I."
          - "ده بيشغّل acetyl-CoA carboxylase."
          - "ده بيشغّل CPS II والـ purine synthesis."
          - "ده بيشغّل PFK-1 و glycogen phosphorylase."
        page: 71
        quote: "Urea cycle Carbamoyl phosphate synthetase I N-acetylglutamate ⊕"
      - kind: sort
        prompt: "المسار ده بيحصل فين؟"
        bins: ["Mitochondria", "Cytoplasm", "Both"]
        cards:
          - { text: "β-oxidation", bin: 0 }
          - { text: "Ketogenesis", bin: 0 }
          - { text: "TCA cycle", bin: 0 }
          - { text: "Glycolysis", bin: 1 }
          - { text: "HMP shunt", bin: 1 }
          - { text: "Fatty acid synthesis", bin: 1 }
          - { text: "Heme synthesis", bin: 2 }
          - { text: "Urea cycle", bin: 2 }
          - { text: "Gluconeogenesis", bin: 2 }
        why: "الحرق في الـ mitochondria، والبناء في الـ cytoplasm. و Hugs take two: Heme و Urea و Gluconeogenesis في المكانين."
        page: 72
        quote: "Both Heme synthesis, urea cycle, gluconeogenesis. Hugs take two (both)."
      - kind: explain
        title: "الخريطة الكبيرة في سطور"
        text: |-
          اسم الإنزيم غالباً بيقولك بيعمل إيه: **gluco-kinase** = بيحط phosphate على الـ glucose من ATP.

          خط الـ **glycolysis** في رسمة الكتاب: glucose-6-P ← fructose-6-P ← fructose-1,6-BP ← (aldolase) glyceraldehyde-3-P + DHAP ← 1,3-BPG ← 3-PG ← 2-PG ← ==PEP== ← pyruvate.
          - الـ **aldolase B** في الكبد، والـ **aldolase A** في العضل.
          - الـ **triose phosphate isomerase** بيحوّل الـ DHAP لـ glyceraldehyde-3-P عشان الاتنين يكمّلوا.

          وحاملين الإلكترونات (universal electron acceptors): الـ NAD+ و NADP+ من ==B3==، والـ FAD من ==B2==.
        page: 72
        quote: "Aldolase B (liver), A (muscle)"
      - kind: explain
        title: "مين بيشيل إيه"
        text: |-
          - ATP ← phosphoryl. NADH و NADPH و FADH2 ← electrons. CoA ← acyl. ==Biotin== ← CO2. THF ← 1-carbon. ==SAM== ← CH3. TPP ← aldehydes.
          - الـ **NAD+** للهدم (catabolic)، والـ **NADPH** للبناء (anabolic، زي الـ steroids والـ fatty acids).
          - الـ NADPH جاي من ==HMP shunt==، وبيستخدم في: البناء، الـ respiratory burst، الـ P-450، والـ glutathione reductase.
        page: 73
        quote: "NADPH is used in: ▘ Anabolic processes ▘ Respiratory burst ▘ Cytochrome P-450 system ▘ Glutathione reductase"
      - kind: figure
        title: "Hexokinase ضد glucokinase"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="40" y1="150" x2="340" y2="150"/>
            <line class="fg-ink" x1="40" y1="150" x2="40" y2="20"/>
            <text x="250" y="170" class="t-sm t-mut">Glucose</text>
            <text x="44" y="16" class="t-sm t-mut">Rate</text>
            <path class="fg-arrow-acc" d="M40,150 C55,90 70,80 340,78" fill="none"/>
            <path class="fg-arrow" d="M40,150 C140,140 220,60 340,32" fill="none"/>
            <text x="200" y="96" class="t-sm t-acc">Hexokinase: low Km, low Vmax</text>
            <text x="150" y="40" class="t-sm t-b">Glucokinase: high Km, high Vmax</text>
            <text x="60" y="130" class="t-sm t-mut">works even at low glucose</text>
          </svg>
        caption: "الـ hexokinase بيمسك الـ glucose حتى لو قليل (affinity عالية) بس سعته صغيرة. الـ glucokinase في الكبد والـ β cells بيشتغل لما الـ glucose يعلى، وسعته كبيرة، والـ insulin بيزوّده."
        alt: "Two saturation curves. Hexokinase rises steeply at low glucose and flattens at a low maximum (low Km, low Vmax). Glucokinase rises slowly and reaches a much higher maximum (high Km, high Vmax)."
        page: 73
        quote: "Hexokinase sequesters glucose in tissues, where it is used even when glucose concentrations are low."
      - kind: aside
        tone: exam
        text: "نقص الـ ==glucokinase== = الـ β cell مش بتحس بالسكر غير لما يعلى أوي ← insulin أقل ← **MODY** (و gestational diabetes). عيلة فيها سكر خفيف ثابت في كل جيل، والـ antibodies سلبية."
        page: 73
        quote: "is a cause of maturity onset diabetes of the young (MODY) and gestational diabetes."
      - kind: check
        question: "A 19-year-old, her father and her grandmother all have mild, stable fasting hyperglycemia without insulin need. Which enzyme is likely deficient?"
        options: ["Glucokinase", "Hexokinase", "Glucose-6-phosphatase", "Pyruvate kinase"]
        answer: 0
        why:
          - "صح: MODY من نقص الـ glucokinase."
          - "الـ hexokinase مش سبب MODY."
          - "ده von Gierke، hypoglycemia مش hyperglycemia."
          - "ده hemolytic anemia."
        page: 73
        quote: "Glucokinase deficiency (→ ↑↑ glucose needed for activation → impaired insulin release [vs. diabetes mellitus])"
      - kind: try
        items: [bio.L06.001, bio.L06.002, bio.L06.013, bio.L06.006, bio.L06.014]
    recap:
      - "PFK-1 للـ glycolysis، FBPase-1 للـ gluconeogenesis، isocitrate DH للـ TCA، CPS I للـ urea."
      - "Malonyl-CoA بيوقف carnitine acyltransferase I."
      - "Hugs take two: Heme، Urea، Gluconeogenesis في المكانين."
      - "NADPH من HMP shunt: بناء، respiratory burst، P-450، glutathione."
      - "Glucokinase: Km و Vmax عاليين؛ نقصه MODY."
    practice: [bio.L06.001, bio.L06.002, bio.L06.003, bio.L06.004, bio.L06.005, bio.L06.006, bio.L06.007, bio.L06.008, bio.L06.009, bio.L06.010, bio.L06.011, bio.L06.012, bio.L06.013, bio.L06.014, bio.L06.183, bio.L06.016, bio.L06.017, bio.L06.018, bio.L06.019, bio.L06.020, bio.L06.021, bio.L06.022, bio.L06.023, bio.L06.196, bio.L06.197, bio.L06.198, bio.L06.199, bio.L06.200, bio.L06.235]
  - id: bio.L06.lesson2
    title: "Glycolysis والـ PDH والـ TCA"
    hook: "رضيع عنده lactic acidosis بتزيد كل ما ياكل نشويات. الـ pyruvate واقف على باب الـ mitochondria ومش عارف يدخل"
    minutes: 10
    pages: [74, 75]
    topics: [glycolysis-regulation, fructose-2-6-bisphosphate, pyruvate-dehydrogenase-complex, pdh-complex-deficiency, pyruvate-metabolism, tca-cycle]
    goals:
      - "تعرف الـ enzymes المتحكمة في الـ glycolysis"
      - "تفهم الـ fructose-2,6-BP في الصيام والأكل"
      - "تحفظ الـ 5 cofactors بتوع الـ PDH وتعرف نقصه"
      - "تعرف مصير الـ pyruvate وناتج الـ TCA"
    status: unverified
    steps:
      - kind: explain
        title: "Glycolysis في سطرين"
        text: |-
          - في الـ cytoplasm: glucose ← ==2 pyruvate + 2 ATP + 2 NADH==.
          - بيصرف ATP عند hexokinase و ==PFK-1== (الـ rate-limiting)، وبيكسب ATP عند phosphoglycerate kinase و pyruvate kinase.
          - الـ **pyruvate kinase** بيشغّله fructose-1,6-BP، وبيوقفه ATP و alanine و glucagon.
        page: 74
        quote: "Net glycolysis (cytoplasm): Glucose + 2 Pi + 2 ADP + 2 NAD+ → 2 pyruvate + 2 ATP + 2 NADH + 2 H+ + 2 H2O."
      - kind: figure
        title: "مفتاح واحد بوشّين"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b6a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-good" x="10" y="15" width="150" height="50" rx="8"/>
            <text x="20" y="35" class="t-sm t-b">Fed: insulin</text>
            <text x="20" y="55" class="t-sm">↑ PFK-2 → ↑ F-2,6-BP</text>
            <rect class="fg-bad" x="200" y="15" width="150" height="50" rx="8"/>
            <text x="210" y="35" class="t-sm t-b">Fasting: glucagon</text>
            <text x="210" y="55" class="t-sm">cAMP → PKA → ↑ FBPase-2</text>
            <line class="fg-arrow" x1="85" y1="65" x2="85" y2="105" marker-end="url(#b6a)"/>
            <line class="fg-arrow" x1="275" y1="65" x2="275" y2="105" marker-end="url(#b6a)"/>
            <rect class="fg-box" x="10" y="108" width="150" height="40" rx="8"/><text x="20" y="133" class="t-sm">PFK-1 on: glycolysis</text>
            <rect class="fg-box" x="200" y="108" width="150" height="40" rx="8"/><text x="210" y="133" class="t-sm">FBPase-1 on: gluconeo</text>
          </svg>
        caption: "الـ PFK-2 والـ FBPase-2 enzyme واحد. الـ insulin يشغّل وش الـ PFK-2 فيعلى الـ fructose-2,6-BP ويشغّل الـ glycolysis. الـ glucagon يفسفره فيقلب للـ FBPase-2 ويشغّل الـ gluconeogenesis."
        alt: "Fed state: insulin raises PFK-2 and fructose-2,6-bisphosphate, turning on PFK-1 and glycolysis. Fasting: glucagon raises cAMP and protein kinase A, raising FBPase-2, turning on FBPase-1 and gluconeogenesis."
        page: 74
        quote: "Fed state: ↑ insulin → ↑ PFK-2 → more glycolysis, less gluconeogenesis."
      - kind: aside
        tone: tip
        text: "**FaBian the Peasant** (FBP) بيشتغل جامد وهو جعان. **Prince FredericK** (PFK) بيشتغل بس وهو شبعان."
        page: 74
        quote: "FaBian the Peasant (FBP) has to work hard when starving."
      - kind: mnemonic
        remind: [bio.L06.029]
        word: "TLCFN"
        parts:
          - { key: "T", text: "Thiamine pyrophosphate (B1)" }
          - { key: "L", text: "Lipoic acid" }
          - { key: "C", text: "CoA (B5)" }
          - { key: "F", text: "FAD (B2)" }
          - { key: "N", text: "NAD+ (B3)" }
        hook: "The Lovely Coenzymes For Nerds: نفس الـ 5 بتوع ==α-ketoglutarate dehydrogenase== كمان."
        page: 74
        quote: "The lovely coenzymes for nerds."
      - kind: check
        question: "A worker with garlic breath, vomiting, diarrhea, skin pigmentation and long QT. Which PDH cofactor is blocked?"
        options: ["Lipoic acid", "TPP", "FAD", "CoA", "NAD+"]
        answer: 0
        why:
          - "صح: الـ arsenic بيوقف الـ lipoic acid."
          - "الـ TPP بيقل في نقص B1."
          - "الـ arsenic مش بيضرب الـ FAD."
          - "الـ arsenic مش بيضرب الـ CoA."
          - "الـ arsenic مش بيضرب الـ NAD+."
        page: 74
        quote: "Arsenic inhibits lipoic acid."
      - kind: explain
        title: "نقص الـ PDH complex"
        text: |-
          - **X-linked**. الـ pyruvate مش بيدخل الـ TCA، فبيروح ==lactate== (LDH) و ==alanine== (ALT).
          - من الطفولة: مشاكل أعصاب، lactic acidosis، و ↑ alanine.
          - العلاج: أكل ==ketogenic== (دهون، lysine و leucine) لأنه بيتجاوز الـ pyruvate، مع B1 و lipoic acid.
        page: 75
        quote: "Neurologic defects, lactic acidosis, ↑ serum alanine starting in infancy."
      - kind: table
        title: "الـ pyruvate بيروح فين"
        columns: [Enzyme, Cofactor, Product]
        rows:
          - ["ALT", "B6", "Alanine (to liver)"]
          - ["Pyruvate carboxylase", "B7", "Oxaloacetate"]
          - ["PDH", "B1, B2, B3, B5, lipoic acid", "Acetyl-CoA"]
          - ["LDH", "B3", "Lactate"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 75
        quote: "Pyruvate dehydrogenase (B1, B2, B3, B5, lipoic acid): transition from glycolysis to the TCA cycle"
      - kind: check
        question: "An infant has lactic acidosis and high alanine that worsen with carbohydrate feeds. Best diet?"
        options: ["High fat, ↑ lysine and leucine", "High carbohydrate", "Low phenylalanine", "Fructose-free"]
        answer: 0
        why:
          - "صح: نقص PDH؛ الـ ketogenic nutrients بتتجاوز الـ pyruvate."
          - "النشويات بتعمل pyruvate أكتر ← lactate أكتر."
          - "ده للـ PKU."
          - "ده للـ hereditary fructose intolerance."
        page: 75
        quote: "↑ intake of ketogenic nutrients (eg, high fat content or ↑ lysine and leucine), B1 and lipoic acid."
      - kind: explain
        title: "الـ TCA: الحسبة"
        text: |-
          - كل acetyl-CoA ← ==3 NADH + 1 FADH2 + 2 CO2 + 1 GTP== = 10 ATP. ضاعف كل حاجة لكل glucose.
          - الـ pyruvate ← acetyl-CoA بيدّي NADH واحد و CO2 واحد زيادة.
          - Citrate is Krebs’ starting substrate for making oxaloacetate: citrate، isocitrate، α-KG، succinyl-CoA، succinate، fumarate، malate، oxaloacetate.
        page: 75
        quote: "The TCA cycle produces 3 NADH, 1 FADH2, 2 CO2, 1 GTP per acetyl-CoA = 10 ATP/ acetyl-CoA (2× everything per glucose)."
      - kind: aside
        tone: exam
        text: "في رسمة الـ TCA، 3 إنزيمات ==irreversible==: **citrate synthase** و **isocitrate dehydrogenase** (الـ rate-limiting) و **α-ketoglutarate dehydrogenase**. دول نقط التحكم، زي الـ PFK-1 في الـ glycolysis."
        page: 75
        quote: "* Enzymes are irreversible"
      - kind: try
        items: [bio.L06.024, bio.L06.025, bio.L06.031, bio.L06.033, bio.L06.029]
    recap:
      - "PFK-1 هو الـ rate-limiting؛ AMP و F-2,6-BP بيشغّلوه."
      - "Insulin ← PFK-2 ← glycolysis. Glucagon ← FBPase-2 ← gluconeogenesis."
      - "PDH: 5 cofactors (TLCFN)، والـ arsenic بيوقف الـ lipoic acid."
      - "نقص PDH: X-linked، lactate و alanine عاليين، أكل ketogenic."
      - "TCA: 3 NADH، 1 FADH2، 1 GTP = 10 ATP لكل acetyl-CoA."
    practice: [bio.L06.024, bio.L06.025, bio.L06.026, bio.L06.027, bio.L06.028, bio.L06.029, bio.L06.030, bio.L06.031, bio.L06.032, bio.L06.033, bio.L06.034, bio.L06.035, bio.L06.036, bio.L06.037, bio.L06.038, bio.L06.039, bio.L06.040, bio.L06.161, bio.L06.162, bio.L06.185, bio.L06.186, bio.L06.201]
  - id: bio.L06.lesson3
    title: "الـ ETC، والـ gluconeogenesis، والـ HMP shunt"
    hook: "واحد واخد aspirin كتير سخن 40 درجة، وواحد واخد primaquine بوله بقى غامق. الاتنين أصلهم في الـ mitochondria والـ NADPH"
    minutes: 10
    pages: [76, 77]
    topics: [electron-transport-chain, gluconeogenesis, pentose-phosphate-pathway, g6pd-deficiency]
    goals:
      - "تعرف NADH و FADH2 بيدخلوا فين، وكام ATP"
      - "تفرّق بين inhibitor و uncoupler"
      - "تحفظ الـ 4 enzymes بتوع الـ gluconeogenesis"
      - "تفهم الـ G6PD deficiency من الـ NADPH للـ bite cells"
    status: unverified
    steps:
      - kind: figure
        title: "سلسلة نقل الإلكترونات"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="50" width="55" height="40" rx="6"/><text x="22" y="75" class="t-sm t-b">I</text>
            <rect class="fg-box" x="75" y="50" width="55" height="40" rx="6"/><text x="87" y="75" class="t-sm t-b">II</text>
            <rect class="fg-box" x="140" y="50" width="55" height="40" rx="6"/><text x="152" y="75" class="t-sm t-b">III</text>
            <rect class="fg-bad" x="205" y="50" width="55" height="40" rx="6"/><text x="217" y="75" class="t-sm t-b">IV</text>
            <rect class="fg-good" x="275" y="50" width="75" height="40" rx="6"/><text x="282" y="75" class="t-sm t-b">V: ATP</text>
            <text x="10" y="110" class="t-sm">NADH</text>
            <text x="75" y="110" class="t-sm">FADH2</text>
            <text x="200" y="110" class="t-sm t-bad">Cyanide, CO</text>
            <text x="200" y="125" class="t-sm">O2 → H2O</text>
            <text x="10" y="35" class="t-sm t-mut">Proton gradient builds across the inner membrane</text>
            <text x="10" y="155" class="t-sm t-bad">Uncouplers (brown fat, aspirin): gradient leaks → heat</text>
          </svg>
        caption: "الـ NADH بيدخل من complex I (2.5 ATP)، والـ FADH2 من complex II (1.5 ATP). الـ cyanide والـ CO بيقفلوا complex IV. الـ uncoupler بيخرّم الغشا: الإلكترونات ماشية بس مفيش ATP، والطاقة بتطلع حرارة."
        alt: "Complexes I to V in a row. NADH enters at complex I, FADH2 at complex II. Cyanide and carbon monoxide block complex IV, where oxygen becomes water. Complex V makes ATP. Uncouplers such as brown fat proteins and aspirin let the proton gradient leak as heat."
        page: 76
        quote: "NADH electrons are transferred to complex I. FADH2 electrons are transferred to complex II (at a lower energy level than NADH)."
      - kind: explain
        title: "الإلكترونات ماشية فين؟"
        text: |-
          - الـ NADH بيدّي إلكتروناته لـ **complex I**، والـ FADH2 لـ **complex II** (وهو نفسه ==succinate dehydrogenase== بتاع الـ TCA).
          - الاتنين بيسلّموا لـ **CoQ** ← complex III ← **cytochrome c** ← complex IV ← ==O2== (هو الـ final electron acceptor) ← H2O.
          - مرور الإلكترونات بيضخ H+ ويعمل **proton gradient**، والـ H+ وهو راجع من **complex V** (ATP synthase) بيلف التوربينة ويعمل ATP.

          الـ uncoupling (brown fat أو aspirin overdose) = خرم في السد: الـ gradient يضيع حرارة بدل ATP.
        page: 76
        quote: "Oxygen acts as an electron acceptor to provide energy. The passage of electrons results in the formation of a proton gradient that, coupled to oxidative phosphorylation, drives ATP production."
      - kind: explain
        title: "الحسبة النهائية"
        text: |-
          - 1 NADH ← 2.5 ATP، و 1 FADH2 ← 1.5 ATP.
          - glucose واحدة aerobic ← ==32 ATP== (malate-aspartate shuttle: قلب وكبد) أو ==30 ATP== (glycerol-3-phosphate shuttle: عضلات).
          - Anaerobic ← ==2 ATP== بس.
        page: 76
        quote: "1 NADH → 2.5 ATP; 1 FADH2 → 1.5 ATP"
      - kind: check
        question: "A girl took an aspirin overdose and has a temperature of 39.8 °C. What happens in her mitochondria?"
        options: ["Electron transport continues but ATP synthesis stops", "Electron transport stops at complex IV", "ATP synthase runs faster", "NADH can't enter complex I"]
        answer: 0
        why:
          - "صح: uncoupling؛ الـ gradient بيضيع والطاقة بتطلع حرارة."
          - "ده cyanide أو CO."
          - "الـ ATP بيقل مش بيزيد."
          - "الـ NADH بيدخل عادي."
        page: 76
        quote: "ATP synthesis stops, but electron transport continues."
      - kind: table
