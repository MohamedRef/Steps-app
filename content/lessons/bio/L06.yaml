          الـ **cherry-red spot**: الدهون بتتراكم في الـ ganglion cell layer فالـ retina حوالين الـ macula تبقى معتمة، والـ fovea (مفيهاش ganglion cells) تفضل حمرا في النص.

          رسمة الكتاب بتوريك إن كله بيوصل لـ ==ceramide==:
          - GM2 ← GM3 ← glucocerebroside ← ceramide.
          - Ceramide trihexoside ← glucocerebroside.
          - Sulfatide ← galactocerebroside ← ceramide.
