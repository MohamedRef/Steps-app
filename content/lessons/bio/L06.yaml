        title: "الـ HMP shunt"
        text: |-
          - بيعمل ==NADPH== (للـ glutathione في الـ RBC، والدهون والـ cholesterol) و ==ribose== للـ nucleotides. مفيش ATP.
          - **Oxidative** (مش بيرجع): G6PD ← NADPH. **Nonoxidative** (بيرجع): transketolase (B1).
          - أنشط مكان: الثدي وقت الرضاعة، الكبد، الـ adrenal cortex، والـ RBCs.
        page: 77
        quote: "Additionally, this pathway yields ribose for nucleotide synthesis."
      - kind: explain
        title: "G6PD deficiency"
        text: |-
          - NADPH قليل ← الـ glutathione مش بيرجع reduced ← الـ RBC مش بيستحمل الـ oxidants ← ==hemolysis==.
          - المحفزات: ==infection== (الأشهر)، fava beans، sulfonamides، nitrofurantoin، primaquine.
          - X-linked recessive، أشهر نقص enzyme في البشر، وكتير في مناطق الـ malaria.
          - **Heinz bodies** (globin متكسر) و **bite cells** (الطحال قضمها).
        page: 77
        quote: "Infection (most common cause) can also precipitate hemolysis; inflammatory response produces free radicals that diffuse into RBCs, causing oxidative damage."
      - kind: explain
        title: "الـ glutathione: الإسفنجة اللي بتتعصر وتتملي"
        text: |-
          في رسمة الكتاب: **G6PD** (glucose-6-P ← 6-phosphogluconolactone) بيعمل ==NADPH==. الـ **glutathione reductase** بيستعمل الـ NADPH عشان يرجّع الـ glutathione المؤكسد لـ 2 GSH (reduced). والـ **glutathione peroxidase** بيستعمل الـ GSH عشان يكسّر الـ peroxides.

          يعني من غير G6PD مفيش NADPH، فالإسفنجة تفضل ناشفة والـ RBC يتأكسد.

          وأشهر حاجة بتفجّر الـ hemolysis مش الأدوية: ==الـ infection==. الالتهاب بيطلّع free radicals بتدخل الـ RBC.
        page: 77
        quote: "Infection (most common cause) can also precipitate hemolysis; inflammatory response produces free radicals that diffuse into RBCs, causing oxidative damage."
