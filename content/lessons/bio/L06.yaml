          - العضلة بتكسّره لنفسها وقت المجهود. الكبد بيكسّره عشان سكر الدم.
        page: 84
        quote: "Hepatocytes Glycogen is stored and undergoes glycogenolysis to maintain blood sugar at appropriate levels."
