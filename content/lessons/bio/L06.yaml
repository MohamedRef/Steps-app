      - kind: explain
        title: "الـ homocysteine عنده مخرجين"
        text: |-
          - **مخرج 1**: homocysteine + serine ← cystathionine (==cystathionine synthase==، B6) ← cysteine (B6).
          - **مخرج 2**: homocysteine ← methionine (==methionine synthase==، بالـ methyl-B12 اللي جاي من methyl folate + B12).

          اقفل أي مخرج ← الـ homocysteine يتراكم. وده سبب إن الأسباب الأربعة كلها بتدّي نفس المرض، والعلاج بيختلف حسب المخرج المقفول.

          وعلى الهامش: الـ **cystine** = 2 cysteine مربوطين بـ disulfide bond (ده اللي بيترسب في الـ cystinuria).
