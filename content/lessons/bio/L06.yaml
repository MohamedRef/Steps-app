    title: "أمراض الـ amino acids: ريحة ولون وحصوات"
    hook: "ريحة musty، بول بريحة السكر المحروق، بول بيسودّ في الهوا، وحصوات سداسية. كل علامة بتقولك اسم المرض"
    minutes: 10
    pages: [82, 83]
    topics: [phenylketonuria, maple-syrup-urine-disease, alkaptonuria, homocystinuria, cystinuria, organic-acidemias]
    goals:
      - "تعرف الـ PKU وعلاجه وليه الـ aspartame ممنوع"
      - "تفرّق MSUD و alkaptonuria من العلامة"
      - "تحفظ أسباب الـ homocystinuria وعلاج كل واحد"
      - "تفرّق propionic عن methylmalonic acidemia"
    status: unverified
    steps:
      - kind: explain
        title: "PKU"
        text: |-
          - ↓ ==phenylalanine hydroxylase== (أو ↓ BH4، الـ cofactor بتاعه). AR.
          - الـ tyrosine بيبقى ==essential==، والـ phenyl ketones بتطلع في البول.
          - Intellectual disability، microcephaly، seizures، جلد فاتح، eczema، و ==musty odor==.
          - الـ screening بعد 2–3 أيام (عند الولادة طبيعي بفضل enzyme الأم).
        page: 82
        quote: "Caused by ↓ phenylalanine hydroxylase (PAH). Tyrosine becomes essential. ↑ phenylalanine → ↑ phenyl ketones in urine."
      - kind: figure
        title: "الـ phenylalanine رايح فين"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b6d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="10" y="20" width="110" height="30" rx="6"/><text x="18" y="40" class="t-sm">Phenylalanine</text>
            <line class="fg-arrow" x1="120" y1="35" x2="220" y2="35" marker-end="url(#b6d)"/>
            <text x="135" y="28" class="t-sm t-mut">PAH + BH4</text>
            <rect class="fg-good" x="222" y="20" width="90" height="30" rx="6"/><text x="235" y="40" class="t-sm">Tyrosine</text>
            <line class="fg-arrow" x1="60" y1="50" x2="60" y2="90" marker-end="url(#b6d)"/>
            <rect class="fg-bad" x="10" y="92" width="120" height="30" rx="6"/><text x="18" y="112" class="t-sm">Phenyl ketones</text>
            <text x="150" y="80" class="t-sm t-bad">Block: PKU</text>
            <text x="140" y="104" class="t-sm">Musty odor, fair skin,</text><text x="140" y="120" class="t-sm">intellectual disability</text>
            <text x="10" y="150" class="t-sm t-mut">Aspartame → phenylalanine: avoid</text>
          </svg>
        caption: "لما الـ PAH أو الـ BH4 يقل، الـ phenylalanine مش بيبقى tyrosine، فبيتحول لـ phenyl ketones. الـ tyrosine بقى essential، والـ aspartame ممنوع لأنه بيبقى phenylalanine."
        alt: "Phenylalanine normally becomes tyrosine via phenylalanine hydroxylase with BH4. When blocked in PKU, it becomes phenyl ketones, causing musty odor, intellectual disability and fair skin. Aspartame is converted to phenylalanine and should be avoided."
        page: 82
        quote: "Patients with PKU must avoid the artificial sweetener aspartame, which is converted to phenylalanine."
      - kind: explain
        title: "الـ phenylalanine جاي منين، والـ BH4 بيتجدد إزاي"
        text: |-
          الـ phenylalanine جاي من 3 مصادر: ==dietary protein== و **aspartame** و البروتين الداخلي في الجسم. عشان كده مريض الـ PKU يقلل البروتين ويبعد عن الـ aspartame.

          الـ phenylalanine hydroxylase وهو شغال بيحوّل الـ BH4 لـ BH2، والـ ==dihydropteridine reductase== (بالـ NADH) بيرجّعه BH4. لو أي حلقة في الدايرة دي ناقصة ← BH4 deficiency ← phenylalanine يعلى.
        page: 82
        quote: "Dietary protein Aspartame Endogenous protein Phenylalanine BH4"
      - kind: aside
        tone: trap
        text: "أم عندها PKU ومش ماشية على الـ diet ← ==phenylalanine embryopathy==: growth restriction، microcephaly، intellectual disability، وعيوب قلب في الجنين، حتى لو الجنين نفسه سليم. بيتمنع بالأكل."
        page: 82
        quote: "Phenylalanine embryopathy—↑ phenylalanine levels in pregnant patients with untreated phenylketonuria (PKU) can cause fetal growth restriction, microcephaly, intellectual disability, congenital heart defects."
