        quote: "Think of “going APE”: A site = incoming Aminoacyl-tRNA. P site = accommodates growing Peptide. E site = holds Empty tRNA as it Exits."
      - kind: explain
        title: "خطوات الـ translation"
        text: |-
          - **Initiation**: الـ eIFs يتعرفوا على الـ 5′ cap، يجمّعوا الـ 40S مع الـ initiator tRNA، وبعدين الـ 60S يركب (GTP).
          - **Elongation**: الـ aminoacyl-tRNA يدخل الـ A (إلا الـ initiator بيدخل الـ P)، الـ ==rRNA== (ribozyme) يعمل الـ peptide bond، والريبوسوم يتحرك (translocation).
          - **Termination**: الـ eRFs يتعرفوا على الـ stop codon (GTP).

          eukaryotes: 40S + 60S = 80S (even). prokaryotes: 30S + 50S = 70S (prime). والطاقة: ATP للشحن، GTP للمسك والحركة.
        page: 43
        quote: "Aminoacyl-tRNA binds to A site (except for initiator methionine, which binds the P site), requires an elongation factor and GTP."
