  - id: bio.L01.lesson4
    title: "الطفرات، والجين بيتشغل ويتقفل إزاي"
    hook: "من حرف واحد بيتغير لحد بكتيريا بتقرر تاكل lactose: كله منطق"
    minutes: 9
    pages: [38, 40]
    topics: [dna-mutations, lac-operon, eukaryotic-gene, gene-expression-regulation]
    goals:
      - "ترتب الطفرات من الأخف للأتقل بالأمثلة"
      - "تحل أي سؤال lac operon بجدول واحد"
      - "تعرف الـ promoter والـ enhancer والـ silencer"
    status: unverified
    steps:
      - kind: explain
        title: "الطفرة بتأذي قد إيه؟"
        text: |-
          الترتيب: ==silent << missense < nonsense < frameshift==.
          - **Silent**: نفس الـ amino acid (غالباً الحرف التالت، الـ wobble).
          - **Missense**: amino acid تاني. مثال: **sickle cell** (glutamic acid ← valine).
          - **Nonsense**: stop codon بدري ← بروتين مش شغال. «Stop the nonsense!».
          - **Frameshift**: إضافة أو حذف مش من مضاعفات الـ 3 ← كل اللي بعده يتقرا غلط. أمثلة: **Duchenne** و **Tay-Sachs**.
        page: 38
        quote: "Degree of change: silent << missense < nonsense < frameshift."
      - kind: aside
        tone: analogy
        text: "تخيّل جملة كل كلمة فيها 3 حروف: «THE CAT ATE THE RAT». لو غيرت حرف (missense) كلمة واحدة بتبوظ. لو شلت حرف واحد (frameshift) الجملة كلها بعدها بتبقى كلام فارغ: «THE ATA TET HER AT»."
        page: 38
        quote: "Deletion or insertion of any number of nucleotides not divisible by 3 (or if divisible by 3 split across adjacent codons) → misreading of all nucleotides downstream."
      - kind: explain
        title: "Transition و transversion، و splice site، و slipped strand"
        text: |-
          - **Transition**: purine ← purine أو pyrimidine ← pyrimidine. **Transversion**: من نوع للتاني.
          - **Splice site**: intron بيفضل في الـ mRNA. أمثلة: بعض الـ β-thalassemia، Gaucher، Marfan.
          - **Slipped strand mispairing**: الـ polymerase بيتزحلق على repeats ويزود، فالـ repeats تكبر من جيل لجيل (==anticipation==)، زي الـ CAG في **Huntington**.
        page: 38
        quote: "Anticipation occurs secondary to insertion of increased repeats across generations. Example: CAG repeat expansion in Huntington disease."
      - kind: check
        question: "Sickle cell disease is caused by which type of mutation?"
        options: ["Missense", "Nonsense", "Frameshift", "Silent"]
        answer: 0
        why:
          - "صح: glutamic acid اتغير لـ valine، amino acid بدل amino acid."
          - "Nonsense كان هيعمل stop codon."
          - "Frameshift زي Duchenne و Tay-Sachs."
          - "Silent ما بيغيرش الـ amino acid."
        page: 38
        quote: "Examples: sickle cell disease (substitution of glutamic acid with valine)."
      - kind: explain
        title: "الـ lac operon: البكتيريا بتختار أكلها"
        text: |-
          الـ E coli بتحب الـ ==glucose==. لو مفيش glucose وفيه lactose، بتشغل جينات الـ lactose. محتاجة شرطين:
          - **Glucose قليل** ← adenylate cyclase يزيد ← **cAMP** يعلى ← ينشّط الـ ==CAP== ← transcription يزيد (دوّاسة البنزين).
          - **Lactose موجود** ← يشيل الـ **repressor** من الـ operator (يشيل الفرامل).
        page: 39
        quote: "Low glucose → ↑ adenylate cyclase activity → ↑ generation of cAMP from ATP → activation of catabolite activator protein (CAP) → ↑ transcription."
      - kind: table
        title: "الـ 4 حالات"
        columns: ["Glucose", "Lactose", "Lac genes"]
        rows:
          - ["Low", "Available", "Strongly expressed"]
          - ["High", "Available", "Very low (basal)"]
          - ["High", "Unavailable", "Not expressed"]
          - ["Low", "Unavailable", "Not expressed"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2]]
        page: 39
        quote: "Lac genes strongly expressed Low glucose Lactose available High glucose Lactose unavailable High glucose Lactose available Low glucose Lactose unavailable"
      - kind: aside
        tone: trap
        text: "لو مفيش lactose، الـ repressor قاعد على الـ operator، فمفيش expression حتى لو الـ glucose قليل والـ CAP شغال. الفرامل بتغلب البنزين."
        page: 39
        quote: "High lactose → unbinds repressor protein from repressor/operator site → ↑ transcription."
      - kind: explain
        title: "الجين في الـ eukaryotes"
        text: |-
          - **Promoter**: قبل الجين (upstream)، غني بـ AT (==TATA== و CAAT boxes). هنا الـ RNA polymerase II يقعد. طفرة فيه ← transcription يقل جامد.
          - **Enhancer**: بيقعد عليه activators ← يزود. **Silencer**: بيقعد عليه repressors ← يقلل. الاتنين ممكن يبقوا قريبين أو بعيد أو جوه intron.
          - **Epigenetics**: تغيير وراثي في التعبير من غير تغيير الـ sequence: DNA methylation، histone modification، noncoding RNA.
        page: 40
        quote: "Promoter mutation commonly results in dramatic ↓ in level of gene transcription."
      - kind: check
        question: "A point mutation in the TATA box of a globin gene most likely causes:"
        options:
          - "Much less mRNA of that gene"
          - "Normal mRNA but no protein"
          - "A longer protein"
          - "A retained intron"
        answer: 0
        why:
          - "صح: الـ TATA box جزء من الـ promoter، وطفرته بتقلل الـ transcription جامد."
          - "ده يحصل لو المشكلة في الـ translation (زي الـ Kozak)."
          - "ده ممكن مع frameshift أو stop codon ضايع."
          - "ده splice site mutation."
        page: 40
        quote: "Promoter mutation commonly results in dramatic ↓ in level of gene transcription."
      - kind: try
        items: [bio.L01.063, bio.L01.065, bio.L01.071, bio.L01.076, bio.L01.078]
    recap:
      - "Silent << missense (sickle) < nonsense < frameshift (Duchenne، Tay-Sachs)."
      - "Slipped strand ← anticipation (CAG في Huntington)."
      - "Lac operon: glucose قليل ← cAMP و CAP (بنزين)، lactose ← يشيل الـ repressor (فرامل)."
      - "Promoter (TATA) طفرته تقلل الـ transcription. Enhancer يزود، silencer يقلل."
    practice: [bio.L01.063, bio.L01.064, bio.L01.065, bio.L01.066, bio.L01.067, bio.L01.068, bio.L01.069, bio.L01.070, bio.L01.071, bio.L01.072, bio.L01.073, bio.L01.074, bio.L01.075, bio.L01.076, bio.L01.077, bio.L01.078, bio.L01.079]
  - id: bio.L01.lesson5
    title: "من hnRNA لـ mRNA: الطاقية والديل والقص"
    hook: "الـ mRNA ما بيخرجش من النواة غير لما يلبس ويتظبط. وفي الطريق: مشروم سام، وطفل floppy، و SLE"
    minutes: 8
    pages: [40, 41]
    topics: [rna-processing, rna-polymerases, introns-exons, pre-mrna-splicing]
    goals:
      - "تعرف الـ 3 تعديلات في النواة"
      - "تفرّق بين RNA polymerase I و II و III والسموم بتاعتهم"
      - "تربط الـ splicing بـ SMA و SLE"
    status: unverified
    steps:
      - kind: explain
        title: "3 تعديلات قبل الخروج"
        text: |-
          أول نسخة اسمها **hnRNA**. في النواة بيحصلها 3 حاجات:
          - **5′ cap**: 7-methylguanosine (وهو بيتنسخ).
          - **Poly-A tail**: حوالي 200 A على الـ 3′ end. والـ poly-A polymerase ==مش محتاج template==.
          - **Splicing**: شيل الـ introns.

          بعدها يبقى mRNA ويخرج للـ cytosol.
        page: 40
        quote: "Capping of 5′ end (addition of 7-methylguanosine cap; cotranscriptional) ▘ Polyadenylation of 3′ end (∼200 A’s → poly-A tail; posttranscriptional) ▘ Splicing out of introns (posttranscriptional)"
      - kind: explain
        title: "إشارات صغيرة، أثرها كبير"
        text: |-
          - **AAUAAA**: إشارة الـ polyadenylation. طفرتها ← الـ mRNA يتكسر بدري قبل ما يتترجم.
          - **Kozak sequence**: مكان البداية في معظم الـ mRNA، بيساعد الـ small subunit يمسك. طفرته ← الـ translation يقل (والـ mRNA نفسه طبيعي).
          - **P-bodies** في الـ cytoplasm: ==quality control== للـ mRNA (exonucleases، decapping، microRNAs): يكسّر أو يخزّن.
        page: 40
        quote: "AAUAAA = polyadenylation signal. Mutation in polyadenylation signal → early degradation prior to translation."
      - kind: mnemonic
        word: "RMT"
        parts:
          - { key: "R", text: "RNA polymerase I: rRNA (rampant)، في الـ nucleolus بس" }
          - { key: "M", text: "RNA polymerase II: mRNA (massive)، و miRNA و snRNA" }
          - { key: "T", text: "RNA polymerase III: tRNA (tiny) و 5S rRNA" }
        hook: "I و II و III بنفس ترتيب استخدامهم في عمل البروتين: rRNA، mRNA، tRNA"
        page: 40
        quote: "I, II, and III are numbered in the same order that their products are used in protein synthesis: rRNA, mRNA, then tRNA."
      - kind: figure
        title: "مين بيقفل مين"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="15" width="100" height="40" rx="8"/><text x="22" y="40" class="t-sm">RNA pol II</text>
            <rect class="fg-box" x="130" y="15" width="100" height="40" rx="8"/><text x="138" y="40" class="t-sm">All RNA pols</text>
