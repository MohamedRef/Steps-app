            <rect class="fg-bad" x="10" y="85" width="100" height="40" rx="8"/><text x="20" y="110" class="t-sm">α-amanitin</text>
            <rect class="fg-bad" x="130" y="85" width="100" height="40" rx="8"/><text x="134" y="110" class="t-sm">Dactinomycin</text>
            <rect class="fg-bad" x="250" y="85" width="100" height="40" rx="8"/><text x="264" y="110" class="t-sm">Rifampin</text>
            <line class="fg-arrow-bad" x1="60" y1="85" x2="60" y2="55"/>
            <line class="fg-arrow-bad" x1="180" y1="85" x2="180" y2="55"/>
            <line class="fg-arrow-bad" x1="300" y1="85" x2="300" y2="55"/>
          </svg>
        caption: "الـ α-amanitin (مشروم death cap) بيقفل الـ RNA polymerase II في الإنسان. الـ dactinomycin بيقفل الاتنين، بكتيريا وإنسان. الـ rifamycins بتقفل بتاع البكتيريا بس."
        alt: "Three inhibitors and their targets: alpha-amanitin blocks RNA polymerase II, dactinomycin blocks RNA polymerases of both prokaryotes and eukaryotes, rifampin blocks bacterial RNA polymerase."
        page: 40
        quote: "Rifamycins (rifampin, rifabutin) inhibit DNA- dependent RNA polymerase in prokaryotes."
      - kind: check
        question: "A man ate wild mushrooms; he has bloody diarrhea and then severe hepatotoxicity. Which RNA is not being made?"
        options: ["mRNA", "rRNA", "tRNA", "Bacterial RNA"]
        answer: 0
        why:
          - "صح: الـ α-amanitin بيقفل الـ RNA polymerase II اللي بيعمل الـ mRNA؛ dysentery و hepatotoxicity."
          - "الـ rRNA من الـ polymerase I."
          - "الـ tRNA من الـ polymerase III."
          - "ده شغل الـ rifamycins."
        page: 40
        quote: "α-amanitin, found in Amanita phalloides (death cap mushrooms), inhibits RNA polymerase II. Causes dysentery and severe hepatotoxicity if ingested."
      - kind: explain
        title: "Introns و exons والـ alternative splicing"
        text: |-
          - **Exons**: فيها الكود؛ بتخرج وبتتعبّر (==ex==it و ==ex==pressed).
          - **Introns**: ما بتكوّدش، بس بتنظم التعبير، وبتفضل في النواة.

          الـ **alternative splicing**: نفس الـ hnRNA يتقص بطرق مختلفة فيدّي بروتينات مختلفة. أمثلة الكتاب: Ig على السطح ولا Ig متفرز، tropomyosin variants، dopamine receptors، وهروب الأورام من المناعة.
        page: 41
        quote: "Introns are intervening sequences and stay in the nucleus, whereas exons exit and are expressed."
      - kind: order
        prompt: "رتّب خطوات الـ splicing"
        steps:
          - "Primary transcript + snRNPs form the spliceosome"
          - "Cleavage at the 5′ splice site (GU) makes a lariat"
          - "Cleavage at the 3′ splice site (AG) releases the lariat"
          - "The 2 exons are joined"
        why: "الـ intron بيبدأ بـ GU وبيخلص بـ AG، والـ spliceosome بيقص من الأول ويعمل لفة (lariat)، وبعدين يقص من الآخر ويرمي اللفة."
        page: 41
        quote: "Cleavage at 5′ splice site; lariat- shaped (loop) intermediate is generated. Cleavage at 3′ splice site; lariat is released to precisely remove intron and join 2 exons."
      - kind: explain
        title: "لما الـ spliceosome يبوظ"
        text: |-
          - **Spinal muscular atrophy**: ==SMN protein== قليل ← تجميع الـ snRNPs يبوظ ← الـ anterior horn cells تموت ← ضعف متماثل و hypotonia («floppy baby»).
          - الـ snRNPs = snRNA + بروتينات (زي **Smith [Sm]**). الـ **anti-U1 snRNP** antibodies بتيجي مع SLE و mixed connective tissue disease.
        page: 41
        quote: "in spinal muscular atrophy, snRNP assembly is affected due to ↓ SMN protein → congenital degeneration of anterior horns of spinal cord → symmetric weakness (hypotonia, or “floppy baby syndrome”)."
      - kind: check
        question: "Anti-U1 snRNP antibodies are most associated with:"
        options: ["Mixed connective tissue disease", "Lynch syndrome", "Bloom syndrome", "Fragile X syndrome"]
        answer: 0
        why:
          - "صح: anti-U1 snRNP مع MCTD و SLE وأمراض روماتيزمية تانية."
          - "Lynch = mismatch repair."
          - "Bloom = helicase."
          - "Fragile X = DNA methylation."
        page: 41
        quote: "Anti-U1 snRNP antibodies are associated with SLE, mixed connective tissue disease, other rheumatic diseases."
      - kind: try
        items: [bio.L01.080, bio.L01.083, bio.L01.085, bio.L01.087, bio.L01.095]
    recap:
      - "hnRNA ← cap و poly-A tail و splicing ← mRNA."
      - "AAUAAA طفرتها ← تكسير بدري. Kozak طفرتها ← translation يقل."
      - "Pol I rRNA، pol II mRNA (α-amanitin)، pol III tRNA. Rifamycins للبكتيريا، dactinomycin للاتنين."
      - "Intron: GU…AG. SMA = SMN قليل. Anti-U1 snRNP = SLE و MCTD."
