  - id: bio.L01.lesson6
    title: "الكود والـ tRNA والريبوسوم: البروتين بيتعمل"
    hook: "AUG بيبدأ، و UGA بيقول U Go Away، والـ diphtheria بتقفل الخط في النص"
    minutes: 9
    pages: [35, 43]
    topics: [genetic-code, trna, start-stop-codons, protein-synthesis, posttranslational-modifications]
    goals:
      - "تعرف صفات الـ genetic code والاستثناءات"
      - "تفهم الـ tRNA بيتشحن إزاي وليه الـ mischarging خطر"
      - "تمشي مع الريبوسوم من الـ initiation للـ termination"
    status: unverified
    steps:
      - kind: explain
        title: "صفات الكود"
        text: |-
          - **Unambiguous**: كل codon = amino acid واحد بس.
          - **Degenerate**: معظم الـ amino acids لها أكتر من codon، والحرف التالت بيتهز (==wobble==). الاستثناء: methionine (AUG) و tryptophan (UGG) لهم codon واحد.
          - **Commaless، nonoverlapping**: بيتقرا متصل من نقطة ثابتة (إلا بعض الفيروسات).
          - **Universal**: ثابت عبر التطور (استثناءات نادرة زي الـ mitochondria).
        page: 35
        quote: "Exceptions: methionine (AUG) and tryptophan (UGG) are encoded by only 1 codon."
      - kind: explain
        title: "الـ tRNA: الشيّال"
        text: |-
          - كل الـ tRNAs في آخرها ==CCA== عند الـ 3′، والـ amino acid بيتربط هناك. «CCA Can Carry Amino acids».
          - **T-arm** (TΨC): يمسك في الريبوسوم (Tethers).
          - **D-arm** (dihydrouridine): الـ synthetase الصح يتعرف عليه (Detection).
        page: 42
        quote: "T-arm: contains the TΨC (ribothymidine, pseudouridine, cytidine) sequence necessary for tRNA ribosome binding. T-arm Tethers tRNA molecule to ribosome."
      - kind: reveal
        prompt: "لو الـ tRNA شال amino acid غلط، الريبوسوم هيكتشفه؟"
        answer: "لأ. الـ tRNA بيقرا الـ codon بالـ anticodon بتاعه، مش بالـ amino acid. فالـ mischarged tRNA بيحط ==الـ amino acid الغلط== في المكان العادي. الفحص الوحيد بيحصل عند الـ **aminoacyl-tRNA synthetase** (قبل وبعد الربط، وبيكسر الربطة لو غلط)."
        page: 42
        quote: "If an incorrect amino acid is attached, the bond is hydrolyzed. A mischarged tRNA reads the usual codon but inserts the wrong amino acid."
      - kind: explain
        title: "البداية والنهاية"
        text: |-
          - **AUG** («inAUGurates»): في الـ eukaryotes = methionine. في الـ prokaryotes = ==fMet==، والـ fMet بيجذب الـ neutrophils (chemotaxis).
          - **Stop**: UGA (U Go Away)، UAA (U Are Away)، UAG (U Are Gone)، والـ release factors بتتعرف عليهم.
        page: 42
        quote: "Codes for N-formylmethionine (fMet). fMet stimulates neutrophil chemotaxis."
