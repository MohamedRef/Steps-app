          - **Chaperones**: بتساعد البروتين يتطبق صح. الـ heat shock proteins (HSP60) بتزيد مع الحرارة والـ acidic pH والـ hypoxia عشان تمنع الـ misfolding.
        page: 43
        quote: "Removal of N- or C-terminal propeptides from zymogen to generate mature protein (eg, trypsinogen to trypsin)."
