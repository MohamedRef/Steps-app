        alt: "Collagen synthesis in six steps with diseases beside them: hydroxylation needs vitamin C (scurvy), triple helix formation (osteogenesis imperfecta), cleavage by procollagen peptidase (a form of Ehlers-Danlos), cross-linking by copper-dependent lysyl oxidase (Menkes)."
        page: 48
        quote: "Problems with cross-linking → Menkes disease."
      - kind: explain
        title: "ليه glycine تلت الكولاجين؟"
        text: |-
          السلسلة بتتكرر **Gly-X-Y**: X غالباً proline أو lysine، و Y غالباً hydroxyproline أو hydroxylysine. فكل تالت amino acid ==glycine==، يعني الكولاجين 1/3 glycine.

          والـ hydroxylation («hydroxCylation») محتاجة ==vitamin C==، ومن غيرها: **scurvy**.
        page: 48
        quote: "Hydroxylation—hydroxylation (“hydroxCylation”) of specific proline and lysine residues. Requires vitamin C; deficiency → scurvy."
      - kind: check
        question: "Which step needs a copper-containing enzyme?"
        options: ["Cross-linking by lysyl oxidase", "Hydroxylation of proline", "Triple helix formation", "Translation on the RER"]
        answer: 0
        why:
          - "صح: الـ lysyl oxidase فيه نحاس، وده اللي بيبوظ في Menkes."
          - "الـ hydroxylation محتاجة vitamin C."
          - "الـ triple helix بيتمسك بـ hydrogen و disulfide bonds."
          - "الـ translation مالهاش علاقة بالنحاس."
        page: 48
        quote: "Cross-linking—reinforcement of staggered tropocollagen molecules by covalent lysine- hydroxylysine cross-linkage (by copper- containing lysyl oxidase) to make collagen fibers."
      - kind: mnemonic
        word: "BITE"
