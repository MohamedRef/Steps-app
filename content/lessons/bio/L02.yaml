          - "COL1A1 للـ osteogenesis imperfecta."
          - "COL5A1 للـ classical EDS (جلد ومفاصل)."
          - "ATP7A للـ Menkes."
        page: 49
        quote: "Vascular type (fragile tissues including vessels [eg, aorta], muscles, and organs that are prone to rupture [eg, gravid uterus]): mutations in type III procollagen (eg, COL3A1)."
