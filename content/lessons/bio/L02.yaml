schema: steps.lesson/v1
lecture: bio.L02
lessons:
  - id: bio.L02.lesson1
    title: "الخلية بتقرر تتقسم إزاي، ومين بيمسك الفرامل؟"
    hook: "p53 و Rb هما الفرامل. افهم السلسلة مرة وهتحل أسئلة Li-Fraumeni والـ chemo"
    minutes: 7
    pages: [44, 44]
    topics: [cell-cycle-phases, cell-types]
    goals:
      - "ترتب سلسلة p53 ← p21 ← CDK ← Rb"
      - "تفرّق بين الخلايا permanent و stable و labile"
    status: unverified
    steps:
      - kind: explain
        title: "دورة الخلية في سطرين"
        text: |-
          G1 ← S (الـ DNA بيتنسخ) ← G2 ← M (mitosis + cytokinesis). الـ ==M أقصر مرحلة==، والـ ==G1 مدته بتتغير== من خلية للتانية.

          الانتقال من مرحلة للتانية بيعدّي على **checkpoints** بتتحكم فيها الـ cyclins والـ CDKs والـ tumor suppressors.
        page: 44
        quote: "M phase (shortest phase of cell cycle) includes mitosis (prophase, prometaphase, metaphase, anaphase, telophase) and cytokinesis (cytoplasm splits in two). G1 is of variable duration."
      - kind: aside
        tone: analogy
        text: "الـ **CDK** عربية موجودة دايماً في الجراج بس من غير مفتاح. الـ **cyclin** هو المفتاح، وبيتعمل بس في مرحلة معينة لما growth factor ييجي. العربية تدور ← تعمل phosphorylation للـ ==Rb== ← الخلية تعدّي."
        page: 44
        quote: "Constitutively expressed but inactive when not bound to cyclin."
      - kind: figure
        title: "الفرامل: p53"
        svg: |-
          <svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-bad" x="5" y="20" width="60" height="34" rx="6"/><text x="22" y="42" class="t-sm t-b">p53</text>
            <line class="fg-arrow" x1="65" y1="37" x2="85" y2="37" marker-end="url(#b2a)"/>
            <rect class="fg-box" x="87" y="20" width="55" height="34" rx="6"/><text x="102" y="42" class="t-sm">p21</text>
            <line class="fg-arrow-bad" x1="142" y1="37" x2="162" y2="37"/><text x="146" y="30" class="t-sm t-bad">⊣</text>
            <rect class="fg-box" x="164" y="20" width="55" height="34" rx="6"/><text x="177" y="42" class="t-sm">CDK</text>
            <line class="fg-arrow" x1="219" y1="37" x2="239" y2="37" marker-end="url(#b2a)"/>
            <rect class="fg-good" x="241" y="20" width="110" height="34" rx="6"/><text x="248" y="42" class="t-sm">Rb active</text>
            <text x="200" y="85" class="t-sm t-bad">G1 → S blocked</text>
            <text x="5" y="85" class="t-sm t-mut">DNA damage</text>
            <text x="5" y="105" class="t-sm t-mut">HPV E6 blocks p53</text>
          </svg>
        caption: "لما الـ DNA يتضرب، الـ p53 يشغّل p21، والـ p21 يقفل الـ CDK، فالـ Rb يفضل من غير phosphate (شغّال) ويمسك الخلية في G1."
        alt: "Chain: DNA damage activates p53, which induces p21; p21 inhibits CDK, so Rb stays hypophosphorylated and active, blocking G1 to S. HPV E6 blocks p53."
        page: 44
        quote: "p53 → p21 induction → CDK inhibition → Rb hypophosphorylation (activation) → G1-S progression inhibition."
      - kind: reveal
        prompt: "لو الـ p53 ضايع من الولادة (germline)، تتوقع إيه؟"
        answer: "الخلايا المضروبة تكمل تتقسم ← سرطانات كتير وبدري في نفس العيلة: ده ==Li-Fraumeni syndrome== (loss of function في p53)."
        page: 44
        quote: "Mutations in tumor suppressor genes can result in unrestrained cell division (eg, Li-Fraumeni syndrome)."
      - kind: check
        question: "In which form is Rb active as a brake on G1-S?"
        options: ["Hypophosphorylated", "Hyperphosphorylated", "Bound to cyclin", "Acetylated"]
        answer: 0
        why:
          - "صح: الـ Rb من غير phosphate هو الشغّال، والـ CDK لما يعمله phosphorylation يفك الفرامل."
          - "الـ phosphorylation بيعطّله فالخلية تعدّي."
          - "الـ cyclin بيرتبط بالـ CDK مش الـ Rb."
          - "الكتاب ما ربطش الـ acetylation بالـ Rb."
        page: 44
        quote: "p53 → p21 induction → CDK inhibition → Rb hypophosphorylation (activation) → G1-S progression inhibition."
      - kind: explain
        title: "مين بيتقسم ومين لأ"
        text: |-
          - **Permanent**: قاعدين في G0 للأبد (neurons، skeletal و cardiac muscle، RBCs).
          - **Stable**: في G0 بس بيرجعوا G1 لو اتنبهوا (hepatocytes، lymphocytes، PCT، periosteal cells).
          - **Labile**: ==عمرهم ما بيروحوا G0== وبيتقسموا بسرعة (bone marrow، gut، skin، hair follicles، germ cells). ودول ==أكتر حاجة بتتضرب بالـ chemo==.
        page: 44
        quote: "Labile Never go to G0, divide rapidly with a short G1. Most affected by chemotherapy."
      - kind: sort
        prompt: "حط كل خلية في نوعها"
        bins: ["Permanent", "Stable", "Labile"]
        cards:
          - { text: "Neurons", bin: 0 }
          - { text: "Cardiac muscle", bin: 0 }
          - { text: "Hepatocytes", bin: 1 }
          - { text: "Lymphocytes", bin: 1 }
          - { text: "Gut epithelium", bin: 2 }
          - { text: "Hair follicles", bin: 2 }
        why: "الـ chemo بيوقّع الشعر ويعمل mucositis و neutropenia عشان دول labile، وما بيأثرش على القلب والأعصاب بنفس الطريقة لأنهم permanent."
        page: 44
        quote: "Permanent Remain in G0, regenerate from stem cells. Neurons, skeletal and cardiac muscle, RBCs. Stable (quiescent) Enter G1 from G0 when stimulated. Hepatocytes, lymphocytes, PCT, periosteal cells."
      - kind: try
        items: [bio.L02.002, bio.L02.005, bio.L02.006, bio.L02.010]
    recap:
      - "M أقصر مرحلة، G1 متغير."
      - "CDK موجود دايماً بس محتاج cyclin."
      - "p53 ← p21 ← CDK يتقفل ← Rb شغّال ← G1 يقف. Li-Fraumeni = p53."
      - "Labile (marrow، gut، skin، hair) أكتر حاجة تتضرب بالـ chemo."
    practice: [bio.L02.001, bio.L02.002, bio.L02.003, bio.L02.004, bio.L02.005, bio.L02.006, bio.L02.007, bio.L02.008, bio.L02.009, bio.L02.010, bio.L02.011]
  - id: bio.L02.lesson2
    title: "مصنع البروتين ومكتب البريد"
    hook: "الـ RER بيصنع، والـ Golgi بيلزق الطوابع، ولو طابع واحد وقع يبقى I-cell disease"
    minutes: 9
    pages: [45, 46]
    topics: [rough-er, smooth-er, cell-trafficking, peroxisome, proteasome]
    goals:
      - "تفرّق بين RER و SER وأي خلايا غنية بكل واحد"
      - "تفهم I-cell disease خطوة خطوة"
      - "تفرّق بين Zellweger و Refsum و adrenoleukodystrophy"
    status: unverified
    steps:
      - kind: explain
        title: "RER ولا SER؟"
        text: |-
          - **RER**: عليه ribosomes، فبيعمل ==البروتين اللي هيخرج== من الخلية وبروتينات الـ organelles، وبيضيف الـ N-linked sugars (eNdoplasmic). غني فيه: **plasma cells** و **goblet cells**. وفي الأعصاب اسمه **Nissl bodies**.
          - **Free ribosomes**: البروتين اللي هيفضل جوه (cytosol، peroxisome، mitochondria).
          - **SER**: من غير ribosomes: ==steroids== و detox، وفيه **glucose-6-phosphatase**. غني فيه: hepatocytes والـ adrenal cortex والـ gonads.
        page: 45
        quote: "Site of steroid synthesis and detoxification of drugs and poisons. Lacks surface ribosomes. Location of glucose-6-phosphatase (last step in both glycogenolysis and gluconeogenesis)."
      - kind: check
        question: "Which cell is richest in SER?"
        options: ["Adrenal cortex cell", "Plasma cell", "Goblet cell", "Neuron cell body (Nissl)"]
        answer: 0
        why:
          - "صح: الـ adrenal cortex بيعمل steroids، والـ steroids بتتعمل في الـ SER."
          - "الـ plasma cell بيفرز antibodies فهو RER."
          - "الـ goblet cell بيفرز mucus فهو RER."
          - "الـ Nissl bodies هي RER."
        page: 45
        quote: "Hepatocytes and steroid hormone–producing cells of the adrenal cortex and gonads are rich in SER."
      - kind: explain
        title: "الـ Golgi: مكتب البريد"
        text: |-
          الـ Golgi بيستلم من الـ ER ويوزّع. بيعدّل الـ N-oligosaccharides على الـ asparagine، ويحط O-oligosaccharides على الـ serine والـ threonine، والأهم: بيلزق ==mannose-6-phosphate== على الإنزيمات اللي رايحة الـ lysosome. ده العنوان.

          والـ **SRP** هو اللي بيوصّل الريبوسوم والبروتين اللي بيتعمل من الـ cytosol للـ RER أصلاً.
        page: 45
        quote: "Posttranslational events in GOlgi include modifying N-oligosaccharides on asparagine, adding O-oligosaccharides on serine and threonine, and adding mannose-6-phosphate to proteins for targeting to lysosomes"
      - kind: reveal
        prompt: "لو الـ Golgi ما عرفش يلزق الـ mannose-6-phosphate، الإنزيمات هتروح فين، والـ lysosome هيحصله إيه؟"
        answer: "من غير عنوان، الإنزيمات ==بتتفرز بره الخلية== (فتلاقيها عالية في الـ plasma)، والـ lysosome يفضل فاضي من الإنزيمات، فالزبالة تتراكم جواه (inclusion bodies). ده **I-cell disease** (AR): coarse face، gingival hyperplasia، corneal clouding، مفاصل ناشفة، زي Hurler بس أوحش."
        page: 45
        quote: "failure of the Golgi to phosphorylate mannose residues (↓ mannose-6-phosphate) on glycoproteins → enzymes secreted extracellularly rather than delivered to lysosomes"
      - kind: mnemonic
        word: "COP"
        parts:
          - { key: "C", text: "COPII: ER ← cis-Golgi، anterograde. «Two steps forward»" }
          - { key: "O", text: "COPI: Golgi ← Golgi و cis-Golgi ← ER، retrograde. «One step back»" }
          - { key: "P", text: "Plus clathrin: trans-Golgi ← lysosomes، و plasma membrane ← endosomes (LDL receptor)" }
        hook: "الكتاب: Two (COPII) steps forward; one (COPI) step back"
        page: 45
        quote: "COPII: ER → cis-Golgi (anterograde). “Two (COPII) steps forward (anterograde); one (COPI) step back (retrograde).”"
      - kind: figure
        title: "رحلة البروتين من الـ RER لحد الـ lysosome"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b2f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="b2f2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="80" width="70" height="40" rx="8"/><text x="28" y="104" class="t-sm t-b">RER</text>
            <rect class="fg-box" x="135" y="80" width="70" height="40" rx="8"/><text x="145" y="98" class="t-sm t-b">cis-Golgi</text><text x="145" y="113" class="t-sm t-mut">↓</text>
            <rect class="fg-box" x="135" y="140" width="70" height="40" rx="8"/><text x="142" y="164" class="t-sm t-b">trans-Golgi</text>
            <line class="fg-arrow-acc" x1="82" y1="90" x2="132" y2="90" marker-end="url(#b2f2)"/>
            <text x="86" y="82" class="t-sm t-acc">COPII</text>
            <line class="fg-arrow-bad" x1="132" y1="112" x2="84" y2="112" marker-end="url(#b2f2b)"/>
            <text x="90" y="130" class="t-sm t-bad">COPI</text>
            <rect class="fg-acc" x="265" y="140" width="85" height="40" rx="8"/><text x="276" y="164" class="t-sm t-b">Lysosome</text>
            <line class="fg-arrow-acc" x1="207" y1="160" x2="262" y2="160" marker-end="url(#b2f2)"/>
            <text x="212" y="152" class="t-sm">clathrin</text>
            <rect class="fg-thin" x="129" y="74" width="82" height="112" rx="10"/>
            <text x="10" y="202" class="t-sm t-acc">Golgi (dashed box): mannose-6-phosphate tag added</text>
            <text x="230" y="70" class="t-sm t-mut">Also clathrin:</text>
            <text x="230" y="86" class="t-sm t-mut">membrane → endosome</text>
            <text x="230" y="102" class="t-sm t-mut">(eg, LDL receptor)</text>
            <text x="10" y="30" class="t-sm t-acc">COPII = forward (anterograde)</text>
            <text x="10" y="48" class="t-sm t-bad">COPI = back (retrograde)</text>
          </svg>
        caption: "البروتين بيتعمل في الـ RER، والـ COPII بيوديه قدام للـ cis-Golgi، والـ COPI بيرجّع اللي اتبعت غلط لورا. في الـ Golgi بيتلزق طابع mannose-6-phosphate، والـ clathrin بيوصّل من الـ trans-Golgi للـ lysosome، ومن الـ membrane للـ endosomes."
        alt: "Diagram: RER sends vesicles forward to the cis-Golgi by COPII, and COPI carries vesicles back from the cis-Golgi to the RER. The Golgi adds the mannose-6-phosphate tag and clathrin vesicles carry enzymes from the trans-Golgi to the lysosome. A note adds that clathrin also carries material from the plasma membrane to endosomes, as with the LDL receptor."
        page: 45
        quote: "COPI: Golgi → Golgi (retrograde); cis-Golgi → ER. ▘ COPII: ER → cis-Golgi (anterograde)."
      - kind: explain
        title: "الـ peroxisome: بيكسّر الدهون الغريبة"
        text: |-
          حاجتين ==بيعملهم لوحده== ومحدش غيره: β-oxidation للـ **VLCFA** و α-oxidation للـ **branched-chain** fatty acids. وكمان بيكسّر amino acids و ethanol، وبيبني bile acids و **plasmalogens** (مهمة في الـ white matter).

          والـ **proteasome** حاجة تانية خالص: برميل بيكسّر البروتينات اللي عليها polyubiquitin، وبيخدم الـ MHC I.
        page: 46
        quote: "β-oxidation of very-long-chain fatty acids (VLCFA) (strictly peroxisomal process) ▘ α-oxidation of branched-chain fatty acids (strictly peroxisomal process)"
      - kind: table
        title: "التلاتة بتوع الـ peroxisome"
        columns: ["Disease", "Defect", "Builds up"]
        rows:
          - ["Zellweger (AR)", "Peroxisome biogenesis (PEX)", "VLCFA + pipecolic acid"]
          - ["Refsum (AR)", "α-oxidation", "Phytanic acid"]
          - ["Adrenoleukodystrophy (XR)", "β-oxidation (ABCD1)", "VLCFA in adrenals, white matter, testes"]
        hide: [[0, 1], [1, 2], [2, 1], [2, 2]]
        page: 46
        quote: "Refsum disease—autosomal recessive disorder of α-oxidation → buildup of phytanic acid due to inability to degrade it."
      - kind: aside
        tone: exam
        text: "ولد صغير سلوكه اتغير ومستواه في المدرسة نزل، وجلده غامق (adrenal insufficiency)، وخاله مات بنفس الحكاية؟ ده ==adrenoleukodystrophy==: X-linked، ABCD1، VLCFA عالي."
        page: 46
        quote: "Adrenoleukodystrophy—X-linked recessive disorder of β-oxidation due to mutation in ABCD1 gene → VLCFA buildup in adrenal glands, white (leuko) matter of brain, testes."
      - kind: check
        question: "Retinitis pigmentosa, anosmia, ataxia, ichthyosis and high phytanic acid. Treatment?"
        options: ["Diet and plasmapheresis", "Bisphosphonates", "Allopurinol", "Copper injections"]
        answer: 0
        why:
          - "صح: Refsum disease، والعلاج diet و plasmapheresis."
          - "Bisphosphonates للـ osteogenesis imperfecta."
          - "Allopurinol للـ uric acid."
          - "النحاس بيتكلم عنه في Menkes."
        page: 46
        quote: "Vision loss (retinitis pigmentosa), anosmia, hearing loss, ataxia, peripheral neuropathy, ichthyosis, and cardiac conduction defects. Treatment: diet, plasmapheresis."
      - kind: try
        items: [bio.L02.017, bio.L02.020, bio.L02.022, bio.L02.025, bio.L02.029]
    recap:
      - "RER: بروتين بيخرج (plasma و goblet cells). SER: steroids و detox و glucose-6-phosphatase."
      - "Golgi يلزق mannose-6-phosphate. لو باظ ← I-cell disease والإنزيمات في الدم."
      - "COPII قدام، COPI ورا، clathrin للـ lysosomes والـ endocytosis."
      - "Zellweger (PEX)، Refsum (phytanic acid)، ALD (ABCD1، XR)."
    practice: [bio.L02.012, bio.L02.013, bio.L02.014, bio.L02.015, bio.L02.016, bio.L02.017, bio.L02.018, bio.L02.019, bio.L02.020, bio.L02.021, bio.L02.022, bio.L02.023, bio.L02.024, bio.L02.025, bio.L02.026, bio.L02.027, bio.L02.028, bio.L02.029, bio.L02.030, bio.L02.031, bio.L02.032, bio.L02.033, bio.L02.073, bio.L02.075, bio.L02.076, bio.L02.077, bio.L02.078]
  - id: bio.L02.lesson3
    title: "الهيكل والقطارات والشعيرات"
    hook: "الـ tetanus بيركب dynein، والـ HSV بيرجع على kinesin، و Kartagener قلبه في اليمين"
    minutes: 8
    pages: [46, 47]
    topics: [cytoskeletal-elements, cilia-structure, primary-ciliary-dyskinesia, sodium-potassium-pump]
    goals:
      - "تعرف الـ 3 أنواع filaments وأمثلتهم"
      - "تفرّق بين dynein و kinesin"
      - "تشرح Kartagener والـ digoxin"
    status: unverified
    steps:
      - kind: table
        title: "الهيكل: 3 أنواع"
        columns: ["Filament", "Job", "Examples"]
        rows:
          - ["Microfilaments", "Contraction, cytokinesis, phagocytosis", "Actin, microvilli"]
          - ["Intermediate", "Cell structure", "Vimentin, desmin, cytokeratin, lamins, GFAP"]
          - ["Microtubules", "Movement, cell division", "Cilia, flagella, spindle, axonal transport"]
        hide: [[0, 2], [1, 1], [2, 2]]
        page: 46
        quote: "Microtubules Movement, cell division Cilia, flagella, mitotic spindle, axonal trafficking, centrioles"
      - kind: explain
        title: "الـ microtubule: سكة قطر"
        text: |-
          أنبوبة من α و β tubulin. الطرف ==السالب جنب النواة== والموجب ناحية الأطراف.

          عليها قطرين:
          - **Dynein**: من + لـ − يعني ==retrograde== (راجع للـ cell body).
          - **Kinesin**: من − لـ + يعني anterograde (رايح للأطراف).
        page: 46
        quote: "Retrograde to microtubule (+ → −)—dynein. ▘ Anterograde to microtubule (− → +)—kinesin."
      - kind: figure
        title: "مين راكب أنهي قطر"
        svg: |-
          <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="b2c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <circle class="fg-acc" cx="40" cy="70" r="30"/><text x="18" y="74" class="t-sm">Cell body</text>
            <line class="fg-ink" x1="70" y1="70" x2="340" y2="70" stroke-width="3"/>
            <text x="74" y="62" class="t-sm">−</text><text x="330" y="62" class="t-sm">+</text>
            <line class="fg-arrow-bad" x1="330" y1="40" x2="80" y2="40" marker-end="url(#b2c)"/>
            <text x="110" y="30" class="t-sm t-bad">Dynein: tetanus, polio, rabies, HSV</text>
            <line class="fg-arrow-acc" x1="80" y1="100" x2="330" y2="100" marker-end="url(#b2b)"/>
            <text x="110" y="125" class="t-sm t-acc">Kinesin: HSV reactivation</text>
          </svg>
        caption: "الـ tetanus toxin والـ polio والـ rabies والـ HSV بيدخلوا من الأطراف ويركبوا الـ dynein راجعين للـ cell body. والـ HSV لما يصحى بيركب الـ kinesin طالع للجلد."
        alt: "An axon from cell body (minus end) to periphery (plus end). Dynein carries tetanus toxin, poliovirus, rabies and HSV toward the cell body; kinesin carries HSV outward on reactivation."
        page: 46
        quote: "Clostridium tetani toxin, poliovirus, rabies virus, and herpes simplex virus (HSV) use dynein for retrograde transport to the neuronal cell body. HSV reactivation occurs via anterograde transport from cell body (kinesin mediated)."
      - kind: check
        question: "Which drug does NOT act on microtubules?"
        options: ["Digoxin", "Mebendazole", "Griseofulvin", "Vinca alkaloids", "Taxanes"]
        answer: 0
        why:
          - "صح: الـ digoxin بيقفل الـ Na+/K+-ATPase."
          - "Mebendazole (antihelminthic) على الـ microtubules."
          - "Griseofulvin (antifungal) على الـ microtubules."
          - "Vinca alkaloids (anticancer) على الـ microtubules."
          - "Taxanes (anticancer) على الـ microtubules."
        page: 46
        quote: "Drugs that act on microtubules (microtubules get constructed very terribly): ▘ Mebendazole (antihelminthic) ▘ Griseofulvin (antifungal) ▘ Vinca alkaloids (anticancer) ▘ Taxanes (anticancer)"
      - kind: explain
        title: "الـ cilia"
        text: |-
          - الـ **motile cilium**: ==9 doublets + 2 singlets== (axoneme)، والـ **axonemal dynein** (ATPase) بيزحلق الـ doublets على بعض فالـ cilium يتني.
          - الـ **basal body**: 9 triplets ومفيش حاجة في النص.
          - الـ **primary (nonmotile) cilia**: حساسات. لو اتعملت غلط: polycystic kidney، mitral valve prolapse، retinal degeneration.
        page: 47
        quote: "Motile cilia consist of 9 doublet + 2 singlet arrangement of microtubules (axoneme) A . Basal body (base of cilium below cell membrane) consists of 9 microtubule triplets B with no central microtubules."
      - kind: reveal
        prompt: "لو الـ dynein arm بايظ والـ cilia واقفة، إيه اللي هيبوظ في الجسم؟"
        answer: "كل مكان فيه cilia: ==situs inversus== (الـ cilia بتوجّه الأعضاء في الجنين)، sinusitis و ear infections و bronchiectasis (مفيش تنضيف)، hearing loss (eustachian tube)، و ==infertility== (sperm مش بيتحرك، والـ fallopian tube ← ectopic). ده **primary ciliary dyskinesia**، وأشهر نوع **Kartagener**. والـ screening: nasal nitric oxide واطي."
        page: 47
        quote: "Autosomal recessive. Dynein arm defect → immotile cilia → dysfunctional ciliated epithelia. Most common type is Kartagener syndrome (PCD with situs inversus)."
      - kind: explain
        title: "الـ Na+/K+ pump"
        text: |-
          لكل ATP: ==3 Na+ بره و 2 K+ جوه==. «2 strikes? K, you're still in. 3 strikes? Nah, you're out!».

          الـ **digoxin** بيقفل الـ pump ← الـ Na+ يتراكم جوه ← الـ Na+/Ca2+ exchanger يشتغل أقل (مش لاقي gradient) ← ==Ca2+ يعلى== جوه ← contractility تزيد.
        page: 47
        quote: "2 strikes? K, you’re still in. 3 strikes? Nah, you’re out!"
      - kind: check
        question: "Digoxin raises contractility because intracellular ___ rises."
        options: ["Ca2+", "K+", "cAMP", "ATP"]
        answer: 0
        why:
          - "صح: الـ pump يتقفل ← الـ Na+/Ca2+ exchange يقل ← Ca2+ يعلى."
          - "الـ K+ جوه بيقل مش بيزيد لما الـ pump يتقفل."
          - "ده ميكانيزم الـ β agonists والـ PDE inhibitors."
          - "الـ ATP مش هو الوسيط."
        page: 47
        quote: "Digoxin directly inhibits Na+/K+-ATPase → indirect inhibition of Na+/Ca2+ exchange → ↑ [Ca2+]i → ↑ cardiac contractility."
      - kind: try
        items: [bio.L02.034, bio.L02.036, bio.L02.041, bio.L02.047, bio.L02.050]
    recap:
      - "Microfilaments (actin)، intermediate (vimentin، desmin، GFAP)، microtubules (cilia، spindle)."
      - "Dynein راجع (tetanus، polio، rabies، HSV). Kinesin رايح (HSV reactivation)."
