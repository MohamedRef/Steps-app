      - kind: explain
        title: "كل type ومرضه"
        text: |-
          - **Type I** (bone، tendone): بيقل في ==osteogenesis imperfecta==.
          - **Type II** (cartwolage).
          - **Type III**: ناقص في الـ ==vascular Ehlers-Danlos== (threE D).
          - **Type IV** (under the floor): بايظ في **Alport**، وعليه antibodies في **Goodpasture**.
        page: 48
        quote: "Type III: deficient in vascular type of Ehlers- Danlos syndrome (threE D)."
      - kind: figure
        title: "خط إنتاج الكولاجين"
        svg: |-
