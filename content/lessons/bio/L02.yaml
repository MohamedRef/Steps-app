      - kind: explain
        title: "Ehlers-Danlos و Menkes"
        text: |-
          **Ehlers-Danlos**: جلد بيتمط ورقيق، مفاصل hypermobile، وكدمات بسهولة. ومعاه aneurysms و rupture.
          - **Hypermobility**: الأشهر.
          - **Classical**: type ==V== (COL5A1/2).
          - **Vascular**: type ==III== (COL3A1): الـ aorta والـ uterus الحامل يتقطعوا.

          **Menkes** (XR): ATP7A (Absent copper) ← lysyl oxidase ضعيف ← شعر «kinky» وتأخر نمو و hypotonia و cerebral aneurysms. عكس Wilson: ATP7B (copper Buildup).
        page: 49
        quote: "X-linked recessive connective tissue disease caused by impaired copper absorption and transport due to defective Menkes protein ATP7A (Absent copper), vs ATP7B in Wilson disease (copper Buildup)."
      - kind: check
        question: "A pregnant woman with thin translucent skin has a uterine rupture; her brother died of aortic dissection. Which gene?"
        options: ["COL3A1", "COL1A1", "COL5A1", "ATP7A"]
        answer: 0
