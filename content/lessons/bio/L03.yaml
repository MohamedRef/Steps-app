  - id: bio.L03.lesson2
    title: "تقنيات المعمل: كل سؤال وتقنيته"
    hook: "السؤال دايماً: عايز تشوف DNA ولا RNA ولا بروتين ولا خلية ولا كروموسوم؟"
    minutes: 10
    pages: [50, 53]
    topics: [pcr, crispr-cas9, blotting, flow-cytometry, microarrays, elisa, karyotyping, molecular-cloning]
    goals:
      - "ترتب خطوات الـ PCR"
      - "تفرّق بين الـ blots بـ SNoW DRoP"
      - "تختار التقنية الصح لكل سؤال"
    status: unverified
    steps:
      - kind: explain
        title: "PCR: آلة تصوير للـ DNA"
        text: |-
          بتكبّر حتة DNA معينة. محتاج: template و primers و ==heat-stable== DNA polymerase و dNTPs.
          - **Denaturation**: سخّن ← الـ strands تنفصل.
          - **Annealing**: برّد ← الـ primers تمسك في المكان المطلوب.
          - **Elongation**: سخّن تاني ← الـ polymerase يبني.

          وتعيد لحد ما الـ DNA يكفي. استخدامات الكتاب: ==neonatal HIV== و herpes encephalitis.
        page: 50
        quote: "Denaturation—DNA template, DNA primers, a heat-stable DNA polymerase, and deoxynucleotide triphosphates (dNTPs) are heated to separate the DNA strands."
      - kind: reveal
        prompt: "ليه الـ DNA polymerase في الـ PCR لازم يكون heat-stable؟ وإمتى نبطّل الـ cycles؟"
        answer: |-
          لأن كل cycle بنسخّن لحد ما الـ strands تنفصل (denaturation)؛ أي polymerase عادي هيبوظ من أول cycle. الـ heat-stable بيستحمل التسخين والتبريد كل مرة.

          والـ cycles بتتكرر (كل مرة الكمية بتتضاعف) ==لحد ما كمية الـ DNA تبقى كفاية==.
        page: 50
        quote: "Heating and cooling cycles continue until the amount of DNA is sufficient."
      - kind: explain
        title: "CRISPR/Cas9: مقص بـ GPS"
        text: |-
          - **gRNA**: الـ GPS، مكمّل للـ DNA اللي عايزه.
          - **Cas9**: المقص (endonuclease).

          بعد القص: لو سبت الخلية تلزق بـ ==NHEJ== ← frameshift (knock-out). لو اديتها donor DNA و ==HDR== ← تعديل (knock-in)، زي تصليح الـ sickle cell.
        page: 51
        quote: "Consists of a guide RNA (gRNA), which is complementary to a target DNA sequence, and an endonuclease (Cas9), which makes a single- or double-strand break at the target site."
      - kind: mnemonic
        word: "SNOW"
        parts:
          - { key: "S", text: "Southern = DNA (مقاس الـ sequences، CGG في fragile X)" }
          - { key: "N", text: "Northern = RNA (مستوى ومقاس الـ mRNA، splicing errors)" }
          - { key: "O", text: "O = ولا حاجة (مفيش blot للـ O)" }
          - { key: "W", text: "Western = Protein (antibody)" }
        hook: "الكتاب: SNoW DRoP. الحروف الكبيرة في الكلمتين بتتقابل: S-D و N-R و W-P"
        page: 51
        quote: "SNoW DRoP: Southern = DNA Northern = RNA Western = Protein"
      - kind: explain
        title: "والـ Southwestern؟"
        text: "بيجمع الاتنين: ==بروتين== على الـ membrane و probe من ==dsDNA==. بيدوّر على البروتينات اللي بتمسك في الـ DNA، زي الـ transcription factors."
        page: 51
        quote: "Combines Southern and Western blots. Protein is probed with labeled dsDNA. Detects DNA- binding proteins (eg, transcription factors)."
      - kind: explain
        title: "Northern و Western بالتفصيل"
        text: |-
          - **Northern**: نفس الـ Southern بالظبط بس العينة ==RNA==. بيقيس كمية الـ mRNA وحجمه (يعني الجين شغال قد إيه)، وبيلقط الـ **splicing errors** (mRNA أطول أو أقصر من الطبيعي).
          - **Western**: البروتين يتفصل بـ gel electrophoresis ويتنقل على membrane، وبعدين ==labeled antibody== يمسك البروتين المطلوب. بيعرّفك البروتين ده موجود ولا لأ و**كميته** قد إيه.
        page: 51
        quote: "Sample protein is separated via gel electrophoresis and transferred to a membrane. Labeled antibody is used to bind relevant protein. This helps identify specific protein and determines quantity."
      - kind: check
        question: "You want to know if a transcript has a splicing error. Which blot?"
        options: ["Northern", "Southern", "Western", "Southwestern"]
        answer: 0
        why:
          - "صح: الـ Northern بيشغّل RNA فيشوف مقاس الـ mRNA وأخطاء الـ splicing."
          - "الـ Southern بيشوف الـ DNA، والـ intron لسه موجود فيه أصلاً."
          - "الـ Western بيشوف البروتين."
          - "الـ Southwestern بيدوّر على DNA-binding proteins."
        page: 51
        quote: "Useful for studying mRNA levels and size, which are reflective of gene expression. Detects splicing errors."
      - kind: explain
        title: "Flow cytometry و ELISA و microarrays"
        text: |-
          - **Flow cytometry**: ==خلية خلية==: antibodies بـ fluorescent dye والـ laser يقرا. الحجم والـ granularity والبروتينات. للـ leukemia، PNH، fetal RBCs في دم الأم، و ==CD4+ count== في HIV.
          - **ELISA**: antibody مربوط بـ enzyme يدّي لون. Direct = antigen، indirect = antibody. للـ screening (HIV)، وأقل specific من الـ Western.
          - **Microarrays**: تقارن transcription آلاف الجينات بين عينتين RNA، ومع الـ DNA تلاقي SNPs و CNVs.
        page: 52
        quote: "Can have high sensitivity and specificity, but is less specific than Western blot. Often used to screen for HIV infection."
      - kind: figure
        title: "قراية الـ flow plot"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="60" y1="20" x2="60" y2="170"/>
            <line class="fg-ink" x1="60" y1="170" x2="300" y2="170"/>
            <line class="fg-thin" x1="180" y1="20" x2="180" y2="170"/>
            <line class="fg-thin" x1="60" y1="95" x2="300" y2="95"/>
            <text x="20" y="100" class="t-sm">CD3</text>
            <text x="165" y="192" class="t-sm">CD8</text>
            <text x="70" y="55" class="t-sm">CD3+ CD8−</text>
            <text x="190" y="55" class="t-sm t-good">CD3+ CD8+</text>
            <text x="70" y="140" class="t-sm t-mut">CD3− CD8−</text>
            <text x="190" y="140" class="t-sm t-bad">empty</text>
            <circle class="fg-dot-acc" cx="100" cy="70" r="4"/><circle class="fg-dot-acc" cx="115" cy="62" r="4"/><circle class="fg-dot-acc" cx="90" cy="78" r="4"/>
            <circle class="fg-dot-good" cx="230" cy="70" r="4"/><circle class="fg-dot-good" cx="250" cy="62" r="4"/>
            <circle class="fg-dot-acc" cx="100" cy="150" r="4"/><circle class="fg-dot-acc" cx="120" cy="155" r="4"/>
          </svg>
        caption: "كل نقطة خلية. الـ quadrant اللي تحت على اليمين (CD8+ و CD3−) فاضي، عشان كل خلية عليها CD8 عليها CD3 كمان."
        alt: "Flow cytometry scatter plot with CD8 on the x-axis and CD3 on the y-axis split into four quadrants; the lower right quadrant, CD8 positive and CD3 negative, is empty."
        page: 52
        quote: "In this example, right lower quadrant is empty because all CD8-expressing cells also express CD3."
      - kind: table
        title: "الـ 4 quadrants في رسمة الكتاب"
        columns: ["Quadrant", "CD8", "CD3"]
        rows:
          - ["Left lower", "−", "−"]
          - ["Right lower (empty)", "+", "−"]
          - ["Left upper", "−", "+"]
          - ["Right upper", "+", "+"]
        hide: [[1, 1], [1, 2], [3, 1], [3, 2]]
        page: 52
        quote: "Cells in left lower quadrant ⊝ for both CD8 and CD3."
      - kind: explain
        title: "ليه الـ quadrant ده فاضي؟"
        text: |-
          الـ data بتترسم **histogram** لو بنقيس حاجة واحدة، أو ==scatter plot== لو بنقارن حاجتين (زي CD3 قصاد CD8).

          كل الـ CD8 T cells هي T cells أصلاً، يعني عليها ==CD3== (علامة كل الـ T cells). فمفيش خلية CD8+ و CD3− ← الـ right lower quadrant فاضي. الـ left upper هي الـ T cells اللي مش CD8 (زي الـ CD4)، والـ left lower خلايا مش T خالص.
        page: 52
        quote: "Data are plotted either as histogram (one measure) or scatter plot (any two measures, as shown)."
      - kind: explain
        title: "الكروموسومات"
        text: |-
          - **Karyotyping**: ==colchicine== يكسّر الـ spindle ← الخلايا تقف في **metaphase** ← Giemsa ونرتب. من الدم أو الـ marrow أو الـ amniotic fluid أو الـ placenta. للـ trisomies والـ sex chromosome disorders.
          - **Spectral karyotyping**: كل كروموسوم بلون ← translocations و duplications و microdeletions.
          - **FISH**: probe على جين معين ← مكانه بالظبط.

          و **molecular cloning**: DNA بشري جوه بكتيريا ← insulin و growth hormone.
        page: 53
        quote: "Colchicine is added to cultured cells to disrupt the assembly of mitotic spindles and arrest cells at metaphase of mitosis."
      - kind: explain
        title: "الـ spectral karyotyping: كل كروموسوم بلونه"
        text: |-
          في الـ karyotype العادي بنفرّق الكروموسومات بالشكل والحجم والـ banding. في الـ **spectral karyotyping** كل كروموسوم ==بيتلوّن== بـ fluorescent probes مختلفة، فأي حتة في غير مكانها تبان فوراً:
          - **Translocation**: حتة بلون كروموسوم لازقة في كروموسوم تاني (مثال الكتاب: unbalanced بين 17 و 19).
          - **Duplication**: نسخة زيادة ← trisomy أو tetrasomy (مثال الكتاب: chromosome 8).
          - **Microdeletion**: مكان ==مافيهوش لون== قصاد نفس المكان منوّر في النسخة التانية.

          يعني بيكشف الـ ==aneuploidies== والـ translocations.
        page: 53
        quote: "Chromosomes are “painted” by hybridization with fluorescent probes that distinguish each chromosome from the others. Used to identify aneuploidies and translocations in a karyotype."
      - kind: match
        prompt: "وصّل كل سؤال بالتقنية"
        pairs:
          - ["Is this newborn infected with HIV?", "PCR"]
          - ["How many CD4+ cells does he have?", "Flow cytometry"]
          - ["How many CGG repeats in FMR1?", "Southern blot"]
          - ["Is the fetus trisomic?", "Karyotyping"]
          - ["Make human insulin in bacteria", "Molecular cloning"]
        why: "الطفل عنده antibodies من أمه، فلازم نشوف الفيروس نفسه بالـ PCR. العدد في الخلايا = flow. مقاس DNA = Southern. عدد الكروموسومات = karyotype."
        page: 51
        quote: "Useful to identify size of specific sequences (eg, determination of heterozygosity [as seen in image], # of CGG repeats in FMR1 to diagnose fragile X syndrome)."
      - kind: check
        question: "An indirect ELISA detects:"
        options: ["An antibody in the patient's blood", "An antigen in the patient's blood", "Viral RNA", "A DNA-binding protein"]
        answer: 0
        why:
          - "صح: الـ indirect بيدوّر على الـ antibody باستخدام secondary antibody عليه enzyme."
          - "ده الـ direct ELISA."
          - "ده PCR."
          - "ده Southwestern blot."
        page: 52
        quote: "Immunologic test used to detect the presence of either a specific antigen (in direct ELISA) or antibody (in indirect ELISA) in a patient’s blood sample."
      - kind: try
        items: [bio.L03.013, bio.L03.019, bio.L03.029, bio.L03.034, bio.L03.016]
    recap:
      - "PCR: denature ← anneal ← elongate. Neonatal HIV."
      - "CRISPR: gRNA + Cas9. NHEJ knock-out، HDR knock-in."
      - "SNoW DRoP. Southwestern = DNA-binding proteins."
      - "Flow = خلية خلية (CD4+). ELISA screening. Karyotype بالـ colchicine في metaphase."
