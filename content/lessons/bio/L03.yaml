lessons:
  - id: bio.L03.lesson1
    title: "الـ elastin، و Marfan ضد homocystinuria"
    hook: "اتنين طوال وصوابعهم طويلة: واحد الـ lens بتاعه طالع لفوق، والتاني نازل لتحت. مين مين؟"
    minutes: 7
    pages: [50, 50]
    topics: [elastin]
    goals:
      - "تعرف الـ elastin بيتعمل ويتكسر إزاي"
      - "تفرّق بين Marfan و homocystinuria في 4 نقط"
    status: unverified
    steps:
      - kind: explain
        title: "الـ elastin: الأستك"
        text: |-
          بروتين بيتمط ويرجع: في الـ skin والـ lungs والـ large arteries والـ vocal cords والـ ligamenta flava.

          فيه proline و glycine و lysine ==من غير hydroxylation== (عكس الكولاجين). الـ tropoelastin بيتبني على سقالة من ==fibrillin==، والـ lysyl oxidase بيعمل الـ cross-links بره الخلية.
        page: 50
        quote: "Rich in nonhydroxylated proline, glycine, and lysine residues, vs the hydroxylated residues of collagen."
      - kind: reveal
        prompt: "الـ elastase بيكسّر الـ elastin، والـ α1-antitrypsin بيمسكه. لو الـ α1-antitrypsin ناقص؟"
        answer: "الـ elastase يشتغل من غير فرامل ← يكسّر الـ elastin في الرئة ← ==COPD==."
        page: 50
        quote: "α1-Antitrypsin deficiency results in unopposed elastase activity, which can cause COPD."
      - kind: explain
        title: "Marfan: الـ fibrillin بايظ"
        text: |-
          **FBN1** على chromosome ==15== (fifteen) ← fibrillin-1 بايظ (وهو كمان بيحبس الـ TGF-β). AD.

          - هيكل: طويل، أطراف طويلة، pectus، مفاصل hypermobile، arachnodactyly.
          - قلب: cystic medial necrosis، **aortic root aneurysm/dissection** (==أشهر سبب وفاة==)، MVP.
          - رئة: spontaneous pneumothorax.
        page: 50
        quote: "aortic root aneurysm rupture or dissection (most common cause of death); mitral valve prolapse; ↑ risk of spontaneous pneumothorax."
      - kind: figure
        title: "الـ lens: لفوق ولا لتحت؟"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="b3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <circle class="fg-box" cx="80" cy="80" r="50"/>
            <ellipse class="fg-acc" cx="100" cy="60" rx="22" ry="14"/>
            <line class="fg-arrow-acc" x1="80" y1="80" x2="110" y2="50" marker-end="url(#b3a)"/>
            <text x="30" y="145" class="t-sm t-acc">Marfan: up/temporal</text>
            <circle class="fg-box" cx="270" cy="80" r="50"/>
            <ellipse class="fg-bad" cx="250" cy="100" rx="22" ry="14"/>
            <line class="fg-arrow-bad" x1="270" y1="80" x2="245" y2="108" marker-end="url(#b3b)"/>
            <text x="200" y="145" class="t-sm t-bad">Homocystinuria: down/nasal</text>
          </svg>
        caption: "في Marfan الـ lens بيطلع لفوق وبره (Marfan fans out). في الـ homocystinuria بينزل لتحت وجوه."
        alt: "Two eyes. Left, Marfan syndrome: the lens is displaced upward and temporally. Right, homocystinuria: the lens is displaced downward and nasally."
        page: 50
        quote: "LENS DISLOCATION Upward/temporal (Marfan fans out) Downward/nasal"
      - kind: table
        title: "Marfan ضد homocystinuria"
        columns: ["", "Marfan", "Homocystinuria"]
        rows:
          - ["Inheritance", "AD", "AR"]
          - ["Intellect", "Normal", "Decreased"]
          - ["Vascular", "Aortic root dilatation", "Thrombosis"]
          - ["Lens", "Up/temporal", "Down/nasal"]
        hide: [[0, 2], [1, 2], [2, 1], [2, 2], [3, 2]]
        page: 50
        quote: "INHERITANCE Autosomal dominant Autosomal recessive INTELLECT Normal Decreased VASCULAR COMPLICATIONS Aortic root dilatation Thrombosis"
      - kind: aside
        tone: tip
        text: "الـ homocystinuria سببها الأشهر ==cystathionine-β-synthase deficiency==، وشكلها زي Marfan بالظبط بس بشرة فاتحة (fair complexion). لو لقيت ذكاء أقل أو جلطة: homocystinuria."
        page: 50
        quote: "Homocystinuria—most commonly due to cystathionine‐β‐synthase deficiency leading to homocysteine buildup."
      - kind: check
        question: "A tall boy with arachnodactyly has a DVT and learning difficulties. Most likely?"
        options: ["Homocystinuria", "Marfan syndrome", "Ehlers-Danlos syndrome", "α1-antitrypsin deficiency"]
        answer: 0
        why:
          - "صح: الجلطة و الذكاء الأقل بيفرقوها عن Marfan."
          - "Marfan الذكاء طبيعي والمشكلة الوعائية aortic root dilatation."
          - "EDS جلد بيتمط ومفاصل hypermobile، مش thrombosis و learning difficulties."
          - "ده COPD من الـ elastase."
        page: 50
        quote: "INHERITANCE Autosomal dominant Autosomal recessive INTELLECT Normal Decreased VASCULAR COMPLICATIONS Aortic root dilatation Thrombosis"
      - kind: try
        items: [bio.L03.004, bio.L03.005, bio.L03.006, bio.L03.009]
    recap:
      - "Elastin: non-hydroxylated، fibrillin scaffold، lysyl oxidase. Elastase ← α1-antitrypsin."
      - "Marfan: FBN1 على 15، AD، dissection أشهر سبب وفاة، lens لفوق."
      - "Homocystinuria: CBS، AR، ذكاء أقل، thrombosis، lens لتحت."
