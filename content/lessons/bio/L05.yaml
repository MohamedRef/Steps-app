  - id: bio.L05.lesson5
    title: "الكحول بيعمل إيه في الكبد"
    hook: "مدمن كحول صايم: سكره واطي، الـ lactate عالي، والكبد دهني. كل ده من رقم واحد: NADH/NAD+"
    minutes: 8
