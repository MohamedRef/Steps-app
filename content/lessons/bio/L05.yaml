            <text x="20" y="158" class="t-sm t-mut">B9 low: ↑ homocysteine only. B12 low: both ↑</text>
          </svg>
        caption: "الـ folate بيشتغل في المسار الأول بس. الـ B12 في الاتنين، فنقصه بيعلّي الـ homocysteine والـ methylmalonic acid، والـ MMA ده اللي بيفرّق."
        alt: "Two reactions. Methionine synthase turns homocysteine into methionine using B12 and folate. Methylmalonyl-CoA mutase turns methylmalonyl-CoA into succinyl-CoA using B12 only. Folate deficiency raises homocysteine only; B12 deficiency raises both homocysteine and methylmalonic acid."
        page: 67
        quote: "Cofactor for methionine synthase (transfers CH3 groups as methylcobalamin) and methylmalonyl-CoA mutase."
      - kind: explain
        title: "الـ B12 في المكانين بالتفصيل"
        text: |-
          **1. Methionine synthase** (B12 + folate مع بعض):
          - الـ THF–CH3 بيدّي الـ CH3 للـ homocysteine ← ==methionine== + THF.
          - الـ methionine بيبقى **SAM**، اللي بيوزّع CH3 على الـ anabolic pathways، ويرجع S-adenosylhomocysteine ← homocysteine تاني.
          - والـ homocysteine ممكن يروح cysteine بالـ B6.
          - عشان كده نقص B12 **أو** folate ← ↑ homocysteine.

          **2. Methylmalonyl-CoA mutase** (B12 بس):
          - الـ odd-chain fatty acids والـ branched-chain amino acids ← methylmalonyl-CoA ← ==succinyl-CoA== ← TCA cycle أو heme.
          - عشان كده ↑ methylmalonic acid في B12 بس، مش في الـ folate. والـ B12 كمان مهم للـ DNA synthesis، وبيتعمل بس بالبكتيريا في الأمعاء بعد مكان امتصاصه.
        page: 67
        quote: "Protein Fatty acids with odd number of carbons, branched-chain amino acids Methylmalonyl-CoA mutase Methylmalonyl-CoA Succinyl-CoA TCA cycle"
      - kind: explain
        remind: [neuro.L03.187]
        title: "B12: الأعصاب هي الفرق"
        text: |-
          - موجود في المنتجات الحيوانية بس (البكتيريا بتعمله بعد مكان الامتصاص)، ومخزونه سنين في الكبد.
          - النقص: megaloblastic anemia + ==subacute combined degeneration== (dorsal columns و lateral corticospinal و spinocerebellar) من myelin بايظ.
          - الأسباب: ==pernicious anemia== (مفيش intrinsic factor)، gastric bypass، شيل الـ terminal ileum (Crohn)، Diphyllobothrium latum، ==metformin==، و الـ vegan.
        page: 67
        quote: "lack of intrinsic factor (eg, pernicious anemia, gastric bypass surgery), absence of terminal ileum (surgical resection, eg, for Crohn disease), certain drugs (eg, metformin), or insufficient intake (eg, veganism)."
      - kind: aside
        tone: trap
        text: "لو اديت ==folate== لواحد عنده نقص B12، الـ anemia هتتحسن بس الأعصاب ==هتفضل تبوظ==. عشان كده لازم تتأكد من الـ B12 قبل ما تدي folate."
        page: 67
        quote: "B9 (folate) supplementation can mask the hematologic symptoms of B12 deficiency, but not the neurologic symptoms."
      - kind: check
        question: "A 60-year-old on long-term metformin has macrocytic anemia and loss of vibration sense in both feet. Which lab pattern fits?"
        options: ["↑ Homocysteine, ↑ methylmalonic acid", "↑ Homocysteine, normal methylmalonic acid", "Normal homocysteine, ↑ methylmalonic acid", "Both normal", "↓ Homocysteine, ↑ methylmalonic acid"]
