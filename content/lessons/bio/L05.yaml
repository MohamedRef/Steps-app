        page: 70
        quote: "Alcohol dehydrogenase Acetaldehyde dehydrogenase"
      - kind: explain
        title: "دوايين على نفس الخط"
        text: |-
          - **Fomepizole**: competitive inhibitor للـ ==alcohol dehydrogenase== ← العلاج المفضل لتسمم الـ methanol و ethylene glycol. (والإيثانول نفسه ينفع، لأن الـ enzyme بيحبه أكتر.)
          - **Disulfiram**: بيوقف ==acetaldehyde dehydrogenase== ← acetaldehyde يتراكم ← أعراض hangover ← المريض يبطّل يشرب.
        page: 70
        quote: "Disulfiram—blocks acetaldehyde dehydrogenase → ↑ acetaldehyde → ↑ hangover symptoms → discouraging drinking."
      - kind: check
        question: "A man drank antifreeze 2 hours ago and has a high anion gap acidosis. Which drug acts on the same enzyme as the first step of ethanol metabolism?"
        options: ["Fomepizole", "Disulfiram", "Metronidazole", "Naltrexone", "Acamprosate"]
        answer: 0
        why:
          - "صح: بيوقف الـ alcohol dehydrogenase فالـ ethylene glycol مش بيتحول لمواد سامة."
          - "ده بيوقف الخطوة التانية (acetaldehyde dehydrogenase)."
          - "بيعمل disulfiram-like reaction بس مش العلاج."
          - "ده opioid antagonist لتقليل الرغبة."
          - "ده NMDA modulator للـ craving."
        page: 70
        quote: "Fomepizole—competitive inhibitor of alcohol dehydrogenase; preferred antidote for overdoses of methanol or ethylene glycol."
      - kind: aside
        tone: tip
        text: "الـ ==NAD+ هو الـ limiting reagent==، فالـ alcohol dehydrogenase شغال ==zero-order==: كمية ثابتة في الساعة مهما شربت. والستات بيتأثروا أكتر: gastric alcohol dehydrogenase أقل، جسم أصغر، ومية أقل."
        page: 70
        quote: "NAD+ is the limiting reagent. Alcohol dehydrogenase operates via zero-order kinetics."
