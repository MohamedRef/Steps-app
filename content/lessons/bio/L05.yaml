    status: unverified
    steps:
      - kind: order
        prompt: "رتّب تكسير الإيثانول"
        steps: ["Ethanol", "Acetaldehyde (alcohol dehydrogenase)", "Acetate (acetaldehyde dehydrogenase)", "Acetyl-CoA"]
