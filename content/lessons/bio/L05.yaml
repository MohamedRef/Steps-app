  - id: bio.L05.lesson4
    title: "C و D و E و K، والزنك، وسوء التغذية"
    hook: "لثة بتنزف، رجل مقوّسة، طفل بطنه منفوخة: كل واحد فيهم ناقصه حاجة مختلفة"
    minutes: 10
    pages: [67, 69]
    topics: [vitamin-c, vitamin-d, vitamin-e, vitamin-k, zinc, protein-energy-malnutrition]
    goals:
      - "تربط الـ scurvy بالـ collagen hydroxylation"
      - "تعرف تنشيط فيتامين D ونقصه وزيادته"
      - "تفرّق نقص E عن B12، ونقص K في المولود"
      - "تفرّق kwashiorkor عن marasmus"
    status: unverified
    steps:
      - kind: explain
        title: "فيتامين C"
        text: |-
          - Antioxidant، وبيحوّل الحديد لـ ==Fe2+== فيساعد امتصاصه (وبيعالج الـ methemoglobinemia).
          - لازم لـ ==hydroxylation الـ proline و lysine== في الـ collagen، ولـ dopamine β-hydroxylase.
          - النقص = **scurvy**: لثة منفوخة، كدمات، perifollicular hemorrhages، و "corkscrew" hair (tea and toast diet).
          - الزيادة: calcium oxalate stones، وبيزوّد الحديد في الـ hemochromatosis.
        page: 67
        quote: "Vitamin C deficiency causes sCurvy due to a Collagen hydroCylation defect."
      - kind: figure
        title: "تنشيط فيتامين D"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="90" height="40" rx="6"/><text x="20" y="38" class="t-sm">Skin (sun): D3</text><text x="20" y="53" class="t-sm">Diet: D2, D3</text>
            <line class="fg-arrow" x1="100" y1="40" x2="135" y2="40" marker-end="url(#b5c)"/>
            <rect class="fg-acc" x="137" y="20" width="90" height="40" rx="6"/><text x="147" y="38" class="t-sm t-b">Liver</text><text x="147" y="53" class="t-sm">25-OH D3</text>
            <line class="fg-arrow" x1="227" y1="40" x2="262" y2="40" marker-end="url(#b5c)"/>
            <rect class="fg-good" x="264" y="20" width="90" height="40" rx="6"/><text x="274" y="38" class="t-sm t-b">Kidney</text><text x="274" y="53" class="t-sm">1,25-(OH)2 D3</text>
            <text x="150" y="85" class="t-sm t-mut">storage form</text>
            <text x="196" y="85" class="t-sm t-mut">1α-hydroxylase ↑ by PTH</text>
            <text x="20" y="120" class="t-sm">Active form: ↑ gut Ca2+ and PO4 absorption</text>
            <text x="20" y="145" class="t-sm t-bad">Granulomas: macrophages make 1,25 → hypercalcemia</text>
          </svg>
        caption: "الجلد والأكل بيدّوا D، الكبد يعمل 25-OH (المخزن)، والكلية تعمل الشكل النشط بالـ 1α-hydroxylase. الـ PTH وقلة الكالسيوم والفوسفات بيعلّوه."
        alt: "Vitamin D from skin and diet goes to the liver, which makes 25-hydroxy D3, the storage form, then to the kidney, which makes 1,25-dihydroxy D3 by 1-alpha-hydroxylase, raised by PTH. The active form raises gut calcium and phosphate absorption. Granulomas make it too and cause hypercalcemia."
        page: 68
        quote: "Both converted to 25-OH D3 (storage form) in liver and to the active form 1,25-(OH)2 D3 (calcitriol) in kidney."
      - kind: explain
        title: "خط تنشيط D خطوة خطوة"
        text: |-
          - **الجلد**: الـ cholesterol ← ==7-dehydrocholesterol== ← (sun/UV) ← D3 (cholecalciferol). والأكل بيدّي D2 (ergocalciferol) و D3.
          - **الكبد**: ==25-hydroxylase== ← 25-OH D3 (شكل التخزين، وده اللي بنقيسه).
          - **الكلية**: ==1α-hydroxylase== ← 1,25-(OH)2 D3 (calcitriol، الشكل الشغال)، والـ PTH بيزوّده.

          والـ calcitriol بيرفع الـ Ca2+ والـ PO4 3– من 3 أماكن: العضم بيطلّع، الأمعاء بتمتص أكتر، والـ renal tubules بتعيد امتصاص أكتر.
        page: 68
        quote: "1α-hydroxylase Bone Intestines Renal tubular cells"
      - kind: explain
        title: "نقص D وزيادته"
        text: |-
          - النقص: ==rickets== في الأطفال (genu varum)، و osteomalacia في الكبار، و hypocalcemic tetany.
          - أسبابه: malabsorption، قلة الشمس، CKD، الكبد. البشرة الغامقة والـ prematurity بيزوّدوه.
          - الرضيع على ==الرضاعة الطبيعية== ياخد D بالبق.
          - الزيادة: hypercalcemia و hypercalciuria. شوفها في الـ ==granulomatous diseases== (sarcoidosis).
        page: 68
        quote: "Seen in granulomatous diseases (↑ activation of vitamin D by epithelioid macrophages)."
      - kind: check
        question: "A 40-year-old with bilateral hilar lymphadenopathy and noncaseating granulomas has hypercalcemia. What is the mechanism?"
        options: ["Macrophage 1α-hydroxylase activates vitamin D", "PTHrP secretion", "Excess hepatic 25-hydroxylation", "Bone metastasis", "Primary hyperparathyroidism"]
        answer: 0
        why:
          - "صح: الـ epithelioid macrophages بتنشّط فيتامين D."
          - "الـ PTHrP مع squamous cell carcinoma."
          - "الـ 25-hydroxylation مش متحكم فيه هنا."
          - "مفيش دليل على metastasis."
          - "الـ sarcoidosis مش بيعلّي الـ PTH، ده بيقل."
        page: 68
        quote: "Hypercalcemia, hypercalciuria, loss of appetite, stupor."
      - kind: explain
        title: "فيتامين E: شبه B12 من غير الدم"
        text: |-
          - Antioxidant بيحمي غشا الـ RBC والأعصاب.
          - النقص: ==hemolytic anemia== و acanthocytosis، و demyelination في الـ posterior columns و spinocerebellar tract (زي ==Friedreich ataxia==).
          - الفرق عن B12: ==مفيش megaloblastic anemia== ولا hypersegmented neutrophils ولا ↑ MMA.
          - الجرعات العالية بتزوّد مفعول الـ warfarin.
        page: 68
        quote: "Neurologic presentation may appear similar to vitamin B12 deficiency, but without megaloblastic anemia, hypersegmented neutrophils, or ↑ serum methylmalonic acid levels."
      - kind: explain
        title: "فيتامين K: الـ Koagulation"
        text: |-
          - Cofactor للـ ==γ-carboxylation== بتاع factors ==II و VII و IX و X== و proteins C و S. الـ warfarin بيوقفه.
          - المولود أمعاؤه sterile، ومفيش K في لبن الأم ← ↑ PT و ↑ aPTT و ==bleeding time طبيعي==. عشان كده حقنة K عند الولادة.
          - في الكبار: antibiotics لمدة طويلة أو مرض كبد.
        page: 69
        quote: "Neonatal hemorrhage with ↑ PT and ↑ aPTT but normal bleeding time (neonates have sterile intestines and are unable to synthesize vitamin K)."
      - kind: explain
        title: "أسامي E و K، وجملة الرضاعة"
        text: |-
          - فيتامين **E** = ==tocopherol== و tocotrienol.
          - فيتامين **K** = phytomenadione و phylloquinone و phytonadione و menaquinone.

          ولبن الأم فقير في الاتنين D و K: «breast-fed infants ==Don't Know== about vitamins D and K». عشان كده المولود بياخد K حقنة عند الولادة، والرضيع على الرضاعة بياخد D بالبق.
        page: 69
        quote: "Not in breast milk; “breast-fed infants Don’t Know about vitamins D and K”. Neonates are given vitamin K injection at birth to prevent hemorrhagic disease of the newborn."
      - kind: check
        question: "A 5-day-old born at home with no postnatal care has bleeding from the umbilical stump. PT and aPTT are prolonged; platelets and bleeding time are normal. What was missed?"
        options: ["Vitamin K injection at birth", "Oral vitamin D", "Iron supplementation", "Vitamin B12", "Factor VIII screening"]
        answer: 0
        why:
          - "صح: hemorrhagic disease of the newborn، يتمنع بحقنة K."
          - "الـ D مش بيأثر على التجلط."
          - "الحديد مش ليه علاقة بالـ PT."
          - "الـ B12 بيعمل anemia مش نزيف."
          - "نقص VIII بيطوّل الـ aPTT بس، مش الـ PT."
        page: 69
        quote: "Neonates are given vitamin K injection at birth to prevent hemorrhagic disease of the newborn."
      - kind: explain
        title: "الزنك"
        text: |-
          - لازم لأكتر من 100 enzyme، وللـ ==zinc fingers== (transcription factors).
          - النقص: جروح بطيئة، مناعة ضعيفة، male hypogonadism، شعر قليل، وفقد الطعم والشم (==dysgeusia و anosmia==).
          - **Acrodermatitis enteropathica**: عيب خلقي في امتصاص الزنك: شعر بيقع، إسهال، و rash حوالين الفتحات وأطراف الصوابع.
        page: 69
        quote: "Associated with acrodermatitis enteropathica A —congenital defect in intestinal zinc absorption manifesting with triad of hair loss, diarrhea, and inflammatory skin rash"
      - kind: aside
        tone: exam
        text: "الزنك كمان: الكتاب بيقول إن نقصه ممكن ==يهيّئ لـ alcoholic cirrhosis==. ففي مريض كحول عنده جروح مابتلمش وفقد طعم، فكّر في الزنك."
        page: 69
        quote: "May predispose to alcoholic cirrhosis."
      - kind: table
