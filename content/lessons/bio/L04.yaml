          </svg>
        caption: "الـ miRNA بتلزق لزقة خفيفة في mRNAs كتير شبه بعض وتمنع ترجمتها. الـ siRNA بتلزق لزقة كاملة في mRNA واحد بالاسم وتقطعه قبل ما يتترجم."
        alt: "Two panels. Left: a microRNA made by the cell pairs loosely with three related mRNAs and blocks their translation. Right: a small interfering RNA from exogenous double-stranded RNA pairs completely with one mRNA and cleaves it before translation."
        page: 54
        quote: "Once inside a cell, siRNA requires complete nucleotide pairing, leading to highly specific mRNA targeting. Results in mRNA cleavage prior to translation."
      - kind: try
        items: [bio.L04.004, bio.L04.007, bio.L04.009, bio.L04.010, bio.L04.013]
    recap:
      - "miRNA شبكة (loose، تمنع translation). siRNA سنارة (complete، تقطع)."
      - "Expressivity = شدة. Penetrance = موجود ولا لأ (BRCA1)."
      - "Loss of heterozygosity للـ tumor suppressors بس."
      - "McCune-Albright = mosaicism. Recessive وأب واحد carrier = isodisomy."
    practice: [bio.L04.001, bio.L04.002, bio.L04.003, bio.L04.004, bio.L04.005, bio.L04.006, bio.L04.007, bio.L04.008, bio.L04.009, bio.L04.010, bio.L04.011, bio.L04.012, bio.L04.013, bio.L04.014, bio.L04.015, bio.L04.016, bio.L04.084, bio.L04.107, bio.L04.108, bio.L04.109, bio.L04.110]
  - id: bio.L04.lesson2
    title: "Hardy-Weinberg و الـ imprinting"
    hook: "معادلة واحدة بتحل كل أسئلة الـ carrier frequency، وكروموسوم 15 بيحكي حكاية الأب والأم"
    minutes: 8
    pages: [55, 56]
    topics: [population-genetics, hardy-weinberg, imprinting]
    goals:
      - "تحسب carrier frequency من الـ prevalence"
      - "تفرّق بين Prader-Willi و Angelman"
    status: unverified
    steps:
      - kind: explain
        title: "الجينات في المجتمع"
        text: |-
          - **Natural selection**: الأصلح بيتنقل أكتر.
          - **Genetic drift**: تغيير بالصدفة. منه **bottleneck** (كارثة شالت ناس بالصدفة) و **founder effect** (مجموعة صغيرة اتفصلت).
        page: 55
        quote: "Founder effect and bottleneck effect are both examples of genetic drift."
      - kind: explain
        title: "المعادلة"
        text: |-
          p = تكرار الـ allele السليم، q = البايظ. p + q = 1، و ==p² + 2pq + q² = 1==.
          - q² = المرضى (في الـ AR).
          - 2pq = ==الـ carriers==.
          - في الـ X-linked recessive: الرجالة = q، الستات = q².

          ولو المرض نادر، p ≈ 1 فالـ carriers ≈ 2q.
        page: 56
        quote: "2pq = frequency of heterozygosity (carrier frequency, if an autosomal recessive disease)"
      - kind: reveal
        prompt: "الـ CF عند 1 من 3200. نسبة الـ carriers كام؟"
        answer: "q² = 1/3200 ← q ≈ 0.017. p ≈ 1، فـ 2pq ≈ 2 × 0.017 ≈ ==0.035 (3.5%)==."
        page: 56
        quote: "q2 = 1/3200, with q ≈ 0.017 or 1.7% of the population."
      - kind: check
        question: "An AR disease affects 1 in 40,000. Carrier frequency?"
        options: ["1 in 100", "1 in 200", "1 in 400", "1 in 20,000"]
        answer: 0
        why:
          - "صح: q = 1/200، و 2q = 1/100."
          - "ده q نفسه، مش 2pq."
          - "ده نص q."
          - "ده مضاعف q² مش 2q."
        page: 56
        quote: "In rare autosomal recessive diseases, p ≈ 1."
      - kind: aside
        tone: trap
        text: "المعادلة شغالة بس لو: مفيش ==mutation== ولا selection، الجواز عشوائي، مفيش migration، والمجتمع كبير."
        page: 56
        quote: "Hardy-Weinberg law assumptions include: ▘ No mutation occurring at the locus ▘ Natural selection is not occurring ▘ Completely random mating ▘ No net migration ▘ Large population"
      - kind: explain
        title: "المعادلة ثابتة ليه؟"
        text: |-
          لو الشروط اتحققت (population في **Hardy-Weinberg equilibrium**)، قيم الـ p والـ q ==بتفضل ثابتة== من جيل للجيل: مفيش حاجة بتزق allele على حساب التاني.

          والـ **natural selection** هو بالظبط اللي بيكسر الشرط ده: الـ allele اللي بيزوّد الـ fitness بيتنقل أكتر، والعكس صحيح، وده مثال الكتاب: ==human evolution==.

          وفي الأمراض الـ AR النادرة p ≈ 1، فالـ carriers ≈ 2q.
        page: 56
        quote: "If a population is in Hardy-Weinberg equilibrium, then the values of p and q remain constant from generation to generation."
      - kind: explain
        title: "الـ imprinting: نسخة واحدة بس شغالة"
        text: |-
          في جينات معينة، نسخة بتتقفل بالـ ==methylation== حسب جاية من مين. فلو النسخة الشغالة ضاعت، المرض يطلع.

          على **chromosome 15**:
          - **Prader-Willi**: نسخة الأم مقفولة أصلاً، فلو ==نسخة الأب== ضاعت (deletion أو maternal UPD 25%) ← المرض.
          - **Angelman**: الـ UBE3A بتاع الأب مقفول، فلو ==UBE3A بتاع الأم== ضاع ← المرض.
        page: 56
        quote: "One gene copy is silenced by methylation, and only the other copy is expressed → parent-of-origin effects."
      - kind: figure
        title: "مين ساكت ومين ضاع"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <text x="20" y="20" class="t-sm t-b">Prader-Willi</text>
            <rect class="fg-bad" x="20" y="35" width="60" height="22" rx="5"/><text x="30" y="51" class="t-sm">P lost</text>
            <rect class="fg-thin" x="90" y="35" width="70" height="22" rx="5"/><text x="96" y="51" class="t-sm t-mut">M silent</text>
            <text x="20" y="80" class="t-sm">obesity, hyperphagia</text>
            <text x="200" y="20" class="t-sm t-b">Angelman</text>
            <rect class="fg-thin" x="200" y="35" width="70" height="22" rx="5"/><text x="206" y="51" class="t-sm t-mut">P silent</text>
            <rect class="fg-bad" x="280" y="35" width="60" height="22" rx="5"/><text x="288" y="51" class="t-sm">M lost</text>
            <text x="200" y="80" class="t-sm">laughter, seizures</text>
            <text x="20" y="120" class="t-sm t-acc">Both: chromosome 15</text>
          </svg>
        caption: "في الاتنين نسخة ساكتة بالـ imprinting والتانية ضاعت، فمفيش ولا نسخة شغالة. Prader-Willi: نسخة الأب ضاعت. Angelman: نسخة الأم ضاعت."
        alt: "Two panels for chromosome 15. Prader-Willi: paternal copy lost, maternal copy silent, leading to obesity and hyperphagia. Angelman: paternal copy silent, maternal copy lost, leading to laughter and seizures."
        page: 56
        quote: "CHROMOSOMES INVOlVED Chromosome 15 of paternal origin UBE3A on maternal copy of chromosome 15"
      - kind: mnemonic
        word: "POP"
        parts:
          - { key: "P", text: "Prader-Willi" }
          - { key: "O", text: "Obesity/overeating" }
          - { key: "P", text: "Paternal allele deleted" }
        hook: "والتاني MAMAS: Maternal deleted، Angelman، Mood، Ataxia، Seizures (mnemonics الكتاب)"
        page: 56
        quote: "POP: Prader-Willi, Obesity/overeating, Paternal allele deleted MAMAS: Maternal allele deleted, Angelman syndrome, Mood, Ataxia, Seizures"
      - kind: check
        question: "A child with hand-flapping, ataxia, seizures and inappropriate laughter lost which copy?"
        options: ["Maternal UBE3A", "Paternal chromosome 15", "Maternal FMR1", "Paternal UBE3A"]
        answer: 0
        why:
          - "صح: Angelman (HAILS) = UBE3A بتاع الأم ضاع."
          - "ده Prader-Willi."
          - "FMR1 ده fragile X."
          - "الـ paternal UBE3A ساكت طبيعي أصلاً."
        page: 56
        quote: "Hand-flapping, Ataxia, severe Intellectual disability, inappropriate Laughter, Seizures. HAILS the Angels."
      - kind: try
        items: [bio.L04.017, bio.L04.019, bio.L04.020, bio.L04.025]
    recap:
      - "Founder و bottleneck = genetic drift."
      - "q² = المرضى، 2pq ≈ 2q = الـ carriers. XR: رجالة q، ستات q²."
      - "Prader-Willi: الأب ضاع (POP). Angelman: UBE3A الأم ضاع (MAMAS)."
    practice: [bio.L04.017, bio.L04.018, bio.L04.019, bio.L04.020, bio.L04.021, bio.L04.022, bio.L04.023, bio.L04.024, bio.L04.025, bio.L04.026, bio.L04.027, bio.L04.111, bio.L04.112]
  - id: bio.L04.lesson3
    title: "أنماط الوراثة، والـ cystic fibrosis"
    hook: "شجرة العيلة بتقولك كل حاجة: مين اتصاب، ومين نقل لمين"
    minutes: 10
    pages: [57, 59]
    topics: [modes-of-inheritance, autosomal-dominant-diseases, autosomal-recessive-diseases, cystic-fibrosis, x-linked-recessive-diseases]
    goals:
      - "تقرا الـ pedigree وتعرف النمط"
      - "تحفظ قوايم AD و AR و XR"
      - "تفهم الـ CF من الـ ΔF508 للعلاج"
    status: unverified
    steps:
      - kind: table
        title: "5 أنماط"
        columns: ["Mode", "Clue"]
        rows:
          - ["AD", "Every generation, both sexes, 50% of children"]
          - ["AR", "One generation, 25% with 2 carriers, consanguinity"]
          - ["XR", "Sons of carrier mothers, no male-to-male, skips generations"]
          - ["XD", "Affected father → all daughters, no sons"]
          - ["Mitochondrial", "Only through mothers, variable (heteroplasmy)"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
        page: 57
        quote: "Transmitted through both parents. Children of affected mothers each have a 50% chance of being affected. 100% of daughters and 0% of sons of affected fathers will be affected."
      - kind: explain
        title: "ليه AD غالباً structural و AR غالباً enzymes؟"
        text: |-
          الإنزيم لو نصه شغال، غالباً كفاية، فلازم النسختين يبوظوا ← ==recessive==. البروتين الـ structural لو نصه بايظ ممكن يبوّظ البناء كله ← ==dominant==.

          ولو عندك أخ عنده مرض AR وانت سليم، احتمال تكون carrier = ==2/3== (لأن الـ AA و Aa و aA بس هما الاحتمالات الباقية).
        page: 57
        quote: "Unaffected individual with affected sibling has 2/3 probability of being a carrier."
      - kind: check
        question: "An affected father with an X-linked dominant disease. His sons?"
        options: ["None affected", "All affected", "Half affected", "All carriers"]
        answer: 0
        why:
          - "صح: الولد بياخد الـ Y من أبوه، فمستحيل ياخد الـ X البايظ."
          - "البنات هما اللي كلهم بيتصابوا."
          - "النص ده لو الأم هي المصابة."
          - "الولاد مش بيبقوا carriers للـ X من الأب."
        page: 57
        quote: "100% of daughters and 0% of sons of affected fathers will be affected."
      - kind: explain
        title: "القوايم: الاستثناءات أهم من القاعدة"
        text: |-
          - الـ **sphingolipidoses** كلها AR ==ما عدا Fabry== (XR).
          - الـ **mucopolysaccharidoses** كلها AR ==ما عدا Hunter== (XR).
        page: 58
        quote: "sphingolipidoses (except Fabry disease), hemochromatosis, glycogen storage diseases, thalassemia, mucopolysaccharidoses (except Hunter syndrome)"
      - kind: explain
        title: "قايمة الـ XR، وإمتى البنت تتعب"
        text: |-
          - الـ XR: Bruton، Duchenne/Becker، Fabry، G6PD، hemophilia A و B، Hunter، Lesch-Nyhan، ocular albinism، OTC deficiency، Wiskott-Aldrich.
          - بنت عندها مرض XR؟ فكر في **Turner** (45,XO) أو **skewed lyonization**.
        page: 59
        quote: "If skewed inactivation occurs, XX individuals may express X-linked recessive diseases (eg, G6PD)"
      - kind: explain
        title: "الـ CF: من حذف واحد لمخاط تقيل"
        text: |-
          **CFTR** على chromosome 7، والطفرة الأشهر **ΔF508**: البروتين بيتطبق غلط فـ ==مش بيوصل للـ membrane==.
          - في الرئة والأمعاء: الـ Cl− مش بيخرج ← الـ Na+ بيتشد أكتر (ENaC) ← المية تتشد ← مخاط ناشف.
          - في العرق: الـ Cl− مش بيترجع ← ==sweat chloride عالي==.

          وفي الـ newborn screening: immunoreactive trypsinogen عالي.
        page: 58
        quote: "Phe508 deletion → misfolded protein → improper protein trafficking → protein absent from cell membrane"
      - kind: figure
        title: "الـ CFTR في مكانين"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
