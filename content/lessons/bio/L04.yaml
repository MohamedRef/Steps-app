        caption: "الـ ribosome بيقرا 3 حروف 3 حروف. لو اتشال مضاعف 3، باقي الجملة سليم فالبروتين أقصر بس شغال (Becker). لو اتشال حرف واحد، كل اللي بعده بيتقري غلط، فالبروتين يتقطع أو يختفي (Duchenne)."
