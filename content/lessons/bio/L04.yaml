      - kind: explain
        title: "نفس القناة، نتيجتين"
        text: |-
          - **Sweat duct**: الـ CFTR بيرجّع الـ Cl− من العرق. في الـ CF مابيرجعش ← العرق ==مالح== (ده أساس الـ sweat test).
          - **Airway**: الـ CFTR بيطلّع Cl− للـ lumen ومعاه مية. في الـ CF الـ Cl− مابيطلعش، والـ **ENaC** بيشد Na+ ومية أكتر ← المخاط ==dehydrated== وتقيل.

          والـ CFTR modulators مفعولها بيختلف حسب الطفرة نفسها (**pharmacogenomics**)، ممكن تتاخد لوحدها أو مع بعض.
        page: 58
        quote: "CFTR modulators can be used alone or in combination. Efficacy varies by different genetic mutations (pharmacogenomics)."
      - kind: explain
