  - id: bio.L04.lesson4
    title: "العضلات والميتوكوندريا والـ repeats"
    hook: "Duchenne و Becker نفس الجين، بس واحد frame بايظ والتاني لأ. والـ repeats كل جيل بتطول"
    minutes: 9
    pages: [59, 60]
    topics: [muscular-dystrophies, mitochondrial-diseases, rett-syndrome, fragile-x, trinucleotide-repeats]
    goals:
      - "تفرّق بين Duchenne و Becker و myotonic"
      - "تعرف شكل الـ mitochondrial disease في الـ biopsy"
      - "تحفظ جدول الـ trinucleotide repeats"
    status: unverified
    steps:
      - kind: explain
        title: "Duchenne ضد Becker"
        text: |-
          نفس الجين (dystrophin، أكبر جين بيكوّد بروتين، فبيتطفّر كتير)، و X-linked recessive.
          - **Duchenne**: ==frameshift== أو nonsense ← مفيش dystrophin. قبل 5 سنين. ضعف من الحوض لفوق، calf pseudohypertrophy، Gowers sign. بيموت غالباً بـ dilated cardiomyopathy.
          - **Becker**: deletion ==in-frame== ← dystrophin ناقص بس شغال. في المراهقة. أخف (Becker is better).
        page: 59
        quote: "X-linked recessive disorder typically due to frameshift deletions or nonsense mutations → truncated or absent dystrophin protein → progressive myofiber damage."
      - kind: reveal
        prompt: "ليه deletion في نفس الجين (dystrophin) ممكن تعمل Duchenne مرة و Becker مرة؟"
        answer: "لو الـ deletion عدد nucleotides مش مضاعف 3 ← ==frameshift== ← كل اللي بعده غلط ← مفيش بروتين (Duchenne). لو مضاعف 3 ← الـ frame سليم ← بروتين أقصر بس شغال (Becker)."
        page: 59
        quote: "X-linked recessive disorder typically due to non-frameshift deletions in dystrophin gene (partially functional instead of truncated)."
      - kind: explain
        title: "Myotonic dystrophy"
        text: |-
          AD، (CTG)n في الـ DMPK. بين 20 و 30 سنة. مش قادر يسيب إيدك بعد السلام (==myotonia==)، cataracts، صلع بدري، testicular atrophy، arrhythmia. «Cataracts، Toupee، Gonadal atrophy».
        page: 59
        quote: "Autosomal dominant. Onset 20-30 years. CTG trinucleotide repeat expansion in the DMPK gene"
      - kind: check
        question: "A man can't release his grip after shaking hands and has early cataracts and frontal balding. Repeat?"
        options: ["CTG", "CAG", "CGG", "GAA"]
        answer: 0
        why:
          - "صح: myotonic dystrophy = CTG في الـ DMPK."
          - "CAG = Huntington."
          - "CGG = fragile X."
          - "GAA = Friedreich ataxia."
        page: 60
        quote: "Myotonic dystrophy (CTG)n AD Cataracts, Toupee (early balding in males)"
      - kind: explain
        title: "الميتوكوندريا: البطارية"
        text: |-
          لو الـ oxidative phosphorylation بايظة، أكتر الأماكن اللي بتتعب هي اللي ==محتاجة طاقة كتير==: المخ والعضل.
          - **MELAS** و **MERRF**: في الـ biopsy ==ragged red fibers== (الخلية بتعمل ميتوكوندريا زيادة تعويض).
          - **Leber hereditary optic neuropathy**: complex I ← فقد نظر في العينين، شباب، رجالة أكتر.
        page: 60
        quote: "Light microscopy with stain: ragged red fibers due to compensatory proliferation of mitochondria. Electron microscopy: mitochondrial crystalline inclusions."
      - kind: explain
        title: "شكل الولد، وعين الـ LHON"
        text: |-
          رسمة الكتاب للـ **Duchenne** ولد بيقوم من الأرض: ==lordosis==، بيزق على رجله عشان يقف (Gowers)، الفخد ضامر (thigh atrophy)، والسمانة كبيرة على الفاضي (**calf pseudohypertrophy**، دهون وألياف مكان العضل).

          والـ **LHON** مش عين بس: ممكن يبقى معاه neurologic dysfunction زي ==tremors== أو مرض شبه الـ multiple sclerosis. ونفس منطق الميتوكوندريا: الأعصاب أكتر نسيج محتاج طاقة.

          وفي الـ myotonic dystrophy حرف الـ G معناه gonadal atrophy في الرجالة و reduced fertility في الستات.
        page: 59
        quote: "Lordosis Pushing on leg to stand Thigh atrophy Calf pseudohypertrophy"
      - kind: explain
        title: "Rett و fragile X"
        text: |-
          - **Rett**: MECP2 de novo على الـ X، بنات (الولاد بيموتوا جنين). طبيعية 6-18 شهر وبعدين ==بترجع لورا== («retturn»)، hand-wringing، seizures، ataxia.
          - **Fragile X**: CGG في FMR1 ← hypermethylation ← الجين يسكت. ==أشهر سبب وراثي== للـ intellectual disability. الـ expansion بيحصل في الـ oogenesis («Fragile EGG»). Full mutation (>200): macroorchidism، وش طويل، ودان كبيرة، autism. Premutation (50-200): tremor و ataxia و ovarian insufficiency.
        page: 60
        quote: "Trinucleotide repeat expansion [(CGG)n] occurs during oogenesis. Fragile EGG (think CGG and oogenesis)."
      - kind: table
        title: "جدول الـ repeats"
        columns: ["Disease", "Repeat", "Inheritance"]
        rows:
          - ["Huntington", "CAG", "AD"]
          - ["Myotonic dystrophy", "CTG", "AD"]
          - ["Fragile X", "CGG", "XD"]
          - ["Friedreich ataxia", "GAA", "AR"]
        hide: [[0, 1], [1, 1], [2, 1], [2, 2], [3, 1], [3, 2]]
        page: 60
        quote: "Fragile X syndrome (CGG)n XD Chin (protruding), Giant Gonads Friedreich ataxia (GAA)n AR Ataxic GAAit"
      - kind: aside
        tone: tip
        text: "الحيلة: كل repeat ليه mnemonic في الكتاب. **C**AG = **C**audate (Huntington). C**T**G = Cataracts، **T**oupee، Gonads. C**G**G = Chin، **G**iant **G**onads. **GAA** = Ataxic **GAA**it."
        page: 60
        quote: "Huntington disease (CAG)n AD Caudate has ↓ ACh and GABA"
      - kind: figure
        title: "الـ reading frame: Duchenne ضد Becker"
        svg: |-
