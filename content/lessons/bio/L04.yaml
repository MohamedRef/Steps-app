            <text x="20" y="144" class="t-sm t-acc">Blocks translation</text>
            <line class="fg-thin" x1="180" y1="10" x2="180" y2="190"/>
            <text x="195" y="20" class="t-sm t-b">siRNA</text>
            <text x="195" y="36" class="t-sm t-mut">exogenous dsRNA</text>
            <rect class="fg-bad" x="195" y="48" width="40" height="16" rx="4"/>
            <line class="fg-arrow-bad" x1="237" y1="56" x2="273" y2="56" marker-end="url(#b4f1)"/>
