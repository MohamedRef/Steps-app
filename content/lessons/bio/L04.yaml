  - id: bio.L04.lesson5
    title: "الـ trisomies، وكل كروموسوم وأمراضه"
    hook: "21 سن الشرب، 18 سن الانتخاب، 13 سن البلوغ. والـ markers بتقولك مين"
    minutes: 10
    pages: [61, 62]
    topics: [autosomal-trisomies, disorders-by-chromosome, robertsonian-translocation, cri-du-chat]
    goals:
      - "تفرّق بين Down و Edwards و Patau بالشكل والـ screening"
      - "تعرف أسباب Down"
      - "تربط الأمراض بالكروموسومات"
    status: unverified
    steps:
      - kind: explain
        title: "Down (21): الأشهر"
        text: |-
          أشهر chromosomal disorder بيعيش، وأشهر سبب genetic للـ intellectual disability.

          - **95%** nondisjunction (غالباً meiosis I، بيزيد مع ==سن الأم==).
          - **4%** Robertsonian translocation (غالباً 14 و 21).
          - **1%** mitotic error بعد الإخصاب.
        page: 61
        quote: "95% of cases due to meiotic nondisjunction, most commonly during meiosis I (↑ with advanced maternal age: from 1:1500 in females <20 to 1:25 in females >45)."
      - kind: mnemonic
        word: "AAAAAA"
        parts:
          - { key: "A", text: "Atlantoaxial instability" }
          - { key: "A", text: "Advanced maternal age" }
          - { key: "A", text: "Atresia (duodenal)" }
          - { key: "A", text: "Atrioventricular septal defect" }
          - { key: "A", text: "Alzheimer disease (early onset): chromosome 21 فيه الـ amyloid precursor protein" }
          - { key: "A", text: "AML (أقل من 5 سنين) / ALL (أكبر من 5)" }
        hook: "الـ 6 As بتوع الكتاب"
        page: 61
        quote: "The 6 As of Down syndrome: ▘ Atlantoaxial instability ▘ Advanced maternal age ▘ Atresia (duodenal) ▘ Atrioventricular septal defect ▘ Alzheimer disease (early onset) ▘ AML (<5 years of age)/ALL (>5 years of age)"
      - kind: explain
        title: "Edwards (18) و Patau (13)"
        text: |-
          - **Edwards**: PRINCE Edward: Prominent occiput، Rocker-bottom feet، Intellectual disability، Nondisjunction، ==Clenched fists== بصوابع فوق بعض، low-set Ears. وكمان micrognathia، VSD، omphalocele. بيموت قبل سنة.
          - **Patau**: عيب في fusion الـ prechordal mesoderm ← ==midline defects==: holoprosencephaly، cleft lip/palate، cutis aplasia، polydactyly، microphthalmia. بيموت قبل سنة.
        page: 61
        quote: "Defect in fusion of prechordal mesoderm → midline defects."
      - kind: explain
        title: "الـ nondisjunction: في أنهي قسمة؟"
        text: |-
          رسمة الكتاب بتوريك الفرق:
          - **Meiosis I**: الزوج كله راح ناحية واحدة ← ==الـ 4 gametes بايظين==: اتنين n + 1 (هيدّوا trisomy) واتنين n − 1 (هيدّوا monosomy).
          - **Meiosis II**: الـ sister chromatids بس اللي ما اتفصلوش ← ==اتنين طبيعيين== (n)، وواحد n + 1 وواحد n − 1.

          وليه الـ **monosomy** الـ autosomal مابتعيشش؟ لأن مفيش نسخة تانية تغطّي، فأي ==recessive trait== على الكروموسوم ده هيظهر.
        page: 61
        quote: "Autosomal monosomies are incompatible with life (high chance of recessive trait expression)."
      - kind: table
        title: "الـ screening"
        columns: ["Trisomy", "hCG", "Inhibin A", "Estriol", "AFP"]
        rows:
          - ["21", "↑", "↑", "↓", "↓"]
          - ["18", "↓", "— or ↓", "↓", "↓"]
          - ["13", "—", "—", "—", "—"]
        hide: [[0, 1], [0, 2], [0, 3], [0, 4], [1, 1], [1, 4]]
        page: 61
        quote: "2nd trimester (quadruple) screening Trisomy hCG Inhibin A Estriol AFP"
      - kind: aside
        tone: tip
        text: "Down: «Markers are ==hi up==» (hCG و inhibin بيطلعوا). Edwards: كل حاجة بتنزل. وفي الـ ultrasound بتاع Down: nuchal translucency عالي و nasal bone صغير."
        page: 61
        quote: "First-trimester ultrasound commonly shows ↑ nuchal translucency and hypoplastic nasal bone. Markers are hi up: ↑ hCG, ↑ inhibin."
      - kind: check
        question: "Quad screen: ↑ hCG, ↑ inhibin A, ↓ estriol, ↓ AFP. Most likely?"
        options: ["Trisomy 21", "Trisomy 18", "Trisomy 13", "Normal pregnancy"]
        answer: 0
        why:
          - "صح: Down، الـ markers hi up."
          - "Edwards كلها بتنزل."
          - "Patau الـ quad screen مش بيتغير بشكل ثابت."
          - "النمط ده مش طبيعي."
        page: 61
        quote: "2nd trimester (quadruple) screening Trisomy hCG Inhibin A Estriol AFP"
      - kind: match
        prompt: "وصّل الكروموسوم بمرضه"
        pairs:
          - ["Chromosome 5", "Cri-du-chat, FAP"]
          - ["Chromosome 7", "Cystic fibrosis, Williams"]
          - ["Chromosome 13", "Retinoblastoma, Wilson, BRCA2"]
          - ["Chromosome 17", "NF1, BRCA1, TP53"]
          - ["Chromosome 22", "NF2, DiGeorge"]
        why: "اتنين محتاجين انتباه: NF1 على 17 (كلمة neurofibromatosis فيها 17 حرف) و NF2 على 22. و BRCA1 على 17 و BRCA2 على 13."
        page: 62
        quote: "17 Neurofibromatosis type 1, BRCA1, TP53 (Li-Fraumeni syndrome) 18 Edwards syndrome 21 Down syndrome 22 Neurofibromatosis type 2, DiGeorge syndrome (22q11)"
      - kind: explain
        title: "Robertsonian و cri-du-chat"
        text: |-
          - **Robertsonian**: كروموسومين acrocentric (13، 14، 15، 21، 22) الـ long arms بتاعتهم ==بتلزق في بعض== والـ short arms بتضيع. الـ balanced carrier سليم، بس ممكن يجيله miscarriages أو طفل Down.
          - **Cri-du-chat**: ==5p−==. microcephaly، intellectual disability، عياط زي القطة، epicanthal folds، VSD. «I cry when I am Very SaD».
        page: 62
        quote: "Occurs when the long arms of 2 acrocentric chromosomes (chromosomes with centromeres near their ends) fuse at the centromere and the 2 short arms are lost."
      - kind: figure
        title: "Robertsonian 14;21"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b4f5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="18" class="t-sm t-b">Two acrocentric chromosomes</text>
            <rect class="fg-thin" x="30" y="30" width="16" height="10" rx="3"/>
            <circle class="fg-dot-acc" cx="38" cy="46" r="5"/>
            <rect class="fg-box" x="30" y="52" width="16" height="90" rx="5"/>
