schema: steps.lesson/v1
lecture: bio.L04
lessons:
  - id: bio.L04.lesson1
    title: "قاموس الوراثة: كلمات بتتسأل كل سنة"
    hook: "penetrance ولا expressivity؟ locus ولا allelic؟ لو فرّقت بينهم، نص أسئلة الـ genetics خلصت"
    minutes: 9
    pages: [54, 55]
    topics: [gene-expression-modifications, rna-interference, genetic-terms]
    goals:
      - "تفرّق بين miRNA و siRNA"
      - "تفرّق بين الكلمات اللي شبه بعض بالأمثلة"
      - "تفهم mosaicism و uniparental disomy"
    status: unverified
    steps:
      - kind: explain
        title: "نتحكم في الجين إزاي في المعمل"
        text: |-
          - في الفيران: **random insertion** ← expression ==constitutive== (دايماً). **Targeted insertion** (homologous recombination) ← expression ==conditional==.
          - Knock-out = شيل الجين. Knock-in = حط جين.
        page: 54
        quote: "Random insertion—constitutive expression. Targeted insertion—conditional expression."
      - kind: table
        title: "miRNA ضد siRNA"
        columns: ["", "miRNA", "siRNA"]
        rows:
          - ["Source", "The cell (hairpins)", "Exogenous dsRNA (virus) or made in the lab"]
          - ["Pairing", "Loose: many related mRNAs", "Complete: one mRNA"]
          - ["Effect", "Blocks translation", "Cleaves the mRNA"]
        hide: [[1, 1], [1, 2], [2, 2]]
        page: 54
        quote: "Once inside a cell, siRNA requires complete nucleotide pairing, leading to highly specific mRNA targeting. Results in mRNA cleavage prior to translation."
      - kind: aside
        tone: analogy
        text: "الـ **miRNA** زي شبكة صيد: بتمسك سمك كتير شبه بعض. الـ **siRNA** زي سنارة على سمكة واحدة بالاسم: دقيقة جداً وبتقطعها. ولو الـ miRNA كتمت mRNA بتاع ==tumor suppressor==، ممكن يطلع سرطان."
        page: 54
        quote: "Abnormal expression of miRNAs contributes to certain malignancies (eg, by silencing an mRNA from a tumor suppressor gene)."
      - kind: explain
        title: "الكلمات اللي بتتلخبط"
        text: |-
          - **Codominance**: الاتنين باينين (blood group AB، α1-antitrypsin، HLA).
          - **Variable expressivity**: نفس الجين، شدة مختلفة (اتنين عندهم NF1).
          - **Incomplete penetrance**: مش كل اللي شايل الجين بيتعب (==BRCA1==).
          - **Pleiotropy**: جين واحد، آثار كتير (CF: رئة وبنكرياس و infertility).
          - **Anticipation**: أشد أو أبدر في الجيل اللي بعده (trinucleotide repeats).
          - **Epistasis**: جين بيأثر على تعبير جين تاني (albinism، alopecia).
        page: 54
        quote: "Variable expressivity Patients with the same genotype have varying phenotypes. Two patients with neurofibromatosis type 1 (NF1) may have varying disease severity."
      - kind: check
        question: "Two siblings have NF1; one has a few café-au-lait spots, the other has hundreds of neurofibromas. Term?"
        options: ["Variable expressivity", "Incomplete penetrance", "Pleiotropy", "Anticipation"]
        answer: 0
        why:
          - "صح: الاتنين عندهم المرض بس بشدة مختلفة، ده مثال الكتاب."
          - "الـ penetrance لو واحد شايل الجين ومش عيان خالص."
          - "الـ pleiotropy جين واحد بأعضاء كتير."
          - "الـ anticipation بين الأجيال، مش بين الإخوات."
        page: 54
        quote: "Two patients with neurofibromatosis type 1 (NF1) may have varying disease severity."
      - kind: explain
        title: "Loss of heterozygosity"
        text: |-
          - **Loss of heterozygosity**: في الـ ==tumor suppressor==، نسخة بايظة مش كفاية؛ لازم التانية تبوظ كمان (two-hit: retinoblastoma، Lynch، Li-Fraumeni). ده مش صحيح في الـ oncogenes.
        page: 54
        quote: "If a patient inherits or develops a mutation in a tumor suppressor gene, the wild type allele must be deleted/mutated/eliminated before cancer develops. This is not true of oncogenes."
      - kind: explain
        title: "Dominant negative"
        text: |-
          - **Dominant negative**: النسخة البايظة مش بس مش شغالة، دي ==بتعطّل السليمة== كمان (p53 البايظ يمسك الـ DNA ويمنع السليم).
        page: 55
        quote: "Exerts a dominant effect. A heterozygote produces a nonfunctional altered protein that also prevents the normal gene product from functioning."
      - kind: match
        prompt: "وصّل كل مصطلح بمثاله"
        pairs:
          - ["Locus heterogeneity", "Albinism from different genes"]
          - ["Allelic heterogeneity", "β-thalassemia"]
          - ["Heteroplasmy", "Leber hereditary optic neuropathy"]
          - ["Linkage disequilibrium", "HLA and CFTR genes"]
        why: "Locus = أماكن مختلفة. Allelic = نفس المكان بطفرات مختلفة. Heteroplasmy = mtDNA سليم وبايظ مع بعض."
        page: 55
        quote: "Locus heterogeneity Mutations at different loci result in the same disease. Albinism, retinitis pigmentosa, familial hypercholesteremia. Allelic heterogeneity Different mutations in the same locus result in the same disease. β-thalassemia."
      - kind: explain
        title: "Mosaicism و uniparental disomy"
        text: |-
          - **Somatic mosaicism**: غلطة mitosis بعد الإخصاب. مثال: ==McCune-Albright== (GNAS): café-au-lait بحواف مقطّعة على جنب واحد، polyostotic fibrous dysplasia، و endocrinopathy زي precocious puberty. لو في كل الخلايا يموت، فبيعيش بس كـ mosaic.
          - **Germline mosaicism**: الطفرة في البويضات أو الحيوانات المنوية بس. الأهل سليمين وعندهم كذا طفل عيان.
          - **UPD**: النسختين من أب واحد. Heterodisomy = غلطة meiosis I، isodisomy = meiosis II. لو طفل عنده مرض recessive وأب واحد بس carrier: فكر في ==isodisomy==.
        page: 55
        quote: "Consider isodisomy in an individual manifesting a recessive disorder when only one parent is a carrier."
      - kind: explain
        title: "تعريفات صغيرة بتتسأل"
        text: |-
          - **RNA interference**: RNA صغيرة ==non-coding== بتستهدف الـ mRNA وتمنع الـ gene expression (الـ miRNA والـ siRNA).
          - **Mosaicism**: خلايا ==مختلفة جينياً== في نفس الشخص.
          - **Aneuploidy**: عدد كروموسومات غلط من nondisjunction في الـ mitosis أو الـ meiosis، ومنها الـ oncogenesis (خلايا السرطان).
          - **Linkage disequilibrium**: بيتقاس في population مش في عيلة، وبيختلف من population للتانية.
        page: 54
        quote: "Process whereby small non-coding RNA molecules target mRNAs to inhibit gene expression."
      - kind: figure
        title: "الشبكة والسنارة"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="b4f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="20" class="t-sm t-b">miRNA</text>
            <text x="20" y="36" class="t-sm t-mut">made by the cell</text>
            <rect class="fg-acc" x="20" y="48" width="40" height="16" rx="4"/>
            <line class="fg-arrow-acc" x1="62" y1="56" x2="98" y2="40" marker-end="url(#b4f1)"/>
            <line class="fg-arrow-acc" x1="62" y1="56" x2="98" y2="62" marker-end="url(#b4f1)"/>
            <line class="fg-arrow-acc" x1="62" y1="56" x2="98" y2="84" marker-end="url(#b4f1)"/>
            <rect class="fg-box" x="100" y="32" width="70" height="14" rx="3"/><text x="106" y="43" class="t-sm">mRNA 1</text>
            <rect class="fg-box" x="100" y="54" width="70" height="14" rx="3"/><text x="106" y="65" class="t-sm">mRNA 2</text>
            <rect class="fg-box" x="100" y="76" width="70" height="14" rx="3"/><text x="106" y="87" class="t-sm">mRNA 3</text>
            <text x="20" y="112" class="t-sm">Loose pairing</text>
