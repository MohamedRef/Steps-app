          - رئة: S aureus في الصغر، ==P aeruginosa== في الكبر، ABPA، bronchiectasis، nasal polyps، clubbing.
          - بنكرياس: steatorrhea، نقص A و D و E و K، CF-related diabetes.
          - Meconium ileus، و infertility عند الرجالة (absent vas deferens).
          - العلاج: physiotherapy، dornase alfa، hypertonic saline، azithromycin، pancrelipase. والـ **modulators**: ==potentiators== (ivacaftor) بتفتح البوابة، و **correctors** (lumacaftor، tezacaftor) بتصلّح الشكل.
        page: 58
        quote: "Are either potentiators (hold gate of CFTR channel open → Cl− flows through cell membrane; eg, ivaCaFToR) or correctors (help CFTR protein to form right 3-D shape → moves to the cell surface; eg, lumaCaFToR, tezaCaFToR)."
