schema: steps.lesson/v1
lecture: resp.L03
lessons:
  - id: resp.L03.lesson1
    title: "أحجام الرئة، والـ dead space، والـ compliance"
    hook: "4 volumes و4 capacities، ومعادلة واحدة للـ dead space، وليه مريض الـ fibrosis بيتنفس سريع وسطحي"
    minutes: 9
    pages: [682, 683]
    topics: [lung-volumes-and-capacities, work-of-breathing, physiologic-dead-space, ventilation, lung-and-chest-wall-properties]
    goals:
      - "تبني كل capacity من الـ volumes بتاعتها، وتعرف إيه اللي الـ spirometry مش بتقيسه"
      - "تحسب الـ physiologic dead space والـ alveolar ventilation"
      - "تفهم الـ FRC والـ compliance والـ hysteresis"
    status: unverified
    steps:
      - kind: figure
        title: "الأحجام والسعات"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="20" y="10" width="90" height="70" rx="4"/>
            <text x="44" y="50" class="t-sm t-b">IRV</text>
            <rect class="fg-acc" x="20" y="80" width="90" height="30" rx="4"/>
            <text x="50" y="100" class="t-sm t-b">VT</text>
            <rect class="fg-box" x="20" y="110" width="90" height="50" rx="4"/>
            <text x="46" y="140" class="t-sm t-b">ERV</text>
            <rect class="fg-bad" x="20" y="160" width="90" height="50" rx="4"/>
            <text x="50" y="190" class="t-sm t-b">RV</text>
            <line class="fg-arrow" x1="130" y1="10" x2="130" y2="110"/>
            <text x="136" y="64" class="t-sm">IC</text>
            <line class="fg-arrow" x1="170" y1="110" x2="170" y2="210"/>
            <text x="176" y="164" class="t-sm">FRC</text>
            <line class="fg-arrow" x1="220" y1="10" x2="220" y2="160"/>
            <text x="226" y="90" class="t-sm">VC</text>
            <line class="fg-arrow" x1="270" y1="10" x2="270" y2="210"/>
            <text x="276" y="114" class="t-sm">TLC</text>
            <text x="20" y="226" class="t-sm t-mut">RV and anything with RV: not by spirometry</text>
          </svg>
        alt: "Stacked lung volumes (IRV, tidal volume, ERV, residual volume) with brackets for inspiratory capacity, functional residual capacity, vital capacity and total lung capacity."
        caption: "IC = IRV + VT. FRC = ERV + RV. VC = IRV + VT + ERV. TLC = الكل."
        page: 682
        quote: "Air in lung after maximal expiration; RV and any lung capacity that includes RV cannot be measured by spirometry"
      - kind: explain
        title: "كل سعة معناها إيه"
        text: |-
          - **IC**: اللي تقدر تاخده بعد زفير عادي.
          - **FRC**: اللي فاضل بعد زفير عادي، وده المكان اللي ==شد الـ chest wall لبرّه بيساوي شد الرئة لجوّه==.
          - **VC**: أقصى حاجة تطلّعها بعد أقصى شهيق.
          - **TLC**: كل اللي في الرئة بعد أقصى شهيق.
          - **VT** الطبيعي ==6-8 mL/kg== (~500 mL).
        page: 682
        quote: "Volume of gas in lungs after normal expiration; outward pulling force of chest wall is balanced with inward collapsing force of lungs"
      - kind: check
        question: "Which of these can be measured by simple spirometry?"
        options:
          - "Vital capacity"
          - "Residual volume"
          - "Functional residual capacity"
          - "Total lung capacity"
        answer: 0
        why:
          - "صح: الـ VC = IRV + VT + ERV، مفيهاش RV."
          - "الـ RV نفسه مش بيتقاس بالـ spirometry."
          - "الـ FRC فيها RV."
          - "الـ TLC فيها RV."
        page: 682
        quote: "RV and any lung capacity that includes RV cannot be measured by spirometry"
      - kind: explain
        title: "Work of breathing"
        text: |-
          الشغل = ضغط × حجم، وبيتصرف على حاجتين: الـ elastic recoil والـ airway resistance. والجسم بيختار rate و VT يقللوا الشغل:
          - **Restrictive** (رئة ناشفة): ==↑ RR و ↓ VT== (سريع وسطحي).
          - **Obstructive** (مجاري ضيقة): ==↓ RR و ↑ VT== (بطيء وعميق).
        page: 682
        quote: "↑ in restrictive diseases (↑ work to overcome elastic recoil resistance achieved with ↑ RR and ↓ VT) and obstructive diseases (↑ work to overcome airway resistance achieved with ↓ RR and ↑ VT)."
      - kind: explain
        title: "Dead space والـ ventilation"
        text: |-
          الـ **physiologic dead space** = الـ anatomic (المجاري) + الـ alveolar dead space، وأكبر مساهم في الـ alveolar dead space هو ==الـ apex== في الرئة السليمة.

          ==VD = VT × (PaCO2 − PECO2) / PaCO2==

          - **VE = VT × RR** (كل الهوا في الدقيقة).
          - **VA = (VT − VD) × RR** (اللي وصل للـ alveoli فعلاً).
          - الطبيعي: RR 12-20، VT 500، VD 150.
        page: 682
        quote: "anatomic dead space of conducting airways plus alveolar dead space; apex of healthy lung is largest contributor of alveolar dead space."
      - kind: check
        question: "VT 600 mL, PaCO2 40, PECO2 30 mm Hg. What is VD?"
        options:
          - "150 mL"
          - "200 mL"
          - "450 mL"
          - "600 mL"
        answer: 0
        why:
          - "صح: 600 × (40 − 30)/40 = 150 mL."
          - "ده لو الفرق كان 13.3 تقريباً."
          - "ده VT − VD، الجزء اللي بيعمل gas exchange."
          - "ده الـ VT كله."
        page: 682
        quote: "VD = volume of inspired air that does not take part in gas exchange."
      - kind: aside
        tone: trap
        text: "نفس الـ minute ventilation ممكن تدّي alveolar ventilation مختلفة خالص. 30 نفس × 200 mL = 6 L، بس (200 − 150) × 30 = ==1.5 L بس== وصلت للـ alveoli. النفس السطحي السريع بيضيع على الـ dead space."
        page: 683
        quote: "VA = (VT − VD) × RR"
      - kind: explain
        title: "الرئة والـ chest wall"
        text: |-
          - **Elastic recoil**: الرئة عايزة تقفل لجوّه، والـ chest wall عايز يفتح لبرّه.
          - عند الـ **FRC**: ضغط الـ airway والـ alveoli = صفر (atmospheric)، والـ ==intrapleural سالب== (بيمنع الـ atelectasis)، والـ ==PVR في أقل حاجة==.
          - **Hysteresis**: الشهيق بياخد curve غير الزفير لأن لازم تتغلب على الـ surface tension وانت بتنفخ.
          - الضغوط بتتكتب بالـ cm H2O.
        page: 683
        quote: "At FRC, airway and alveolar pressures equal atmospheric pressure (PB; called zero), and intrapleural pressure is negative (preventing atelectasis)."
      - kind: sort
        prompt: "الـ compliance زادت ولا قلّت؟"
        bins: ["↑ compliance", "↓ compliance"]
        cards:
          - { text: "Emphysema", bin: 0 }
          - { text: "Older adults", bin: 0 }
          - { text: "Pulmonary fibrosis", bin: 1 }
          - { text: "Pneumonia", bin: 1 }
          - { text: "ARDS", bin: 1 }
          - { text: "Pulmonary edema", bin: 1 }
        why: "الـ compliance = ΔV/ΔP، عكس الـ stiffness، والـ surfactant بيزوّدها. الـ emphysema رئة رخوة سهل تتملي، والـ fibrosis والمية والالتهاب بيخلوها ناشفة."
        page: 683
        quote: "↑ compliance = lung easier to fill (eg, emphysema, older adults) ▘ ↓ compliance = lung more difficult to fill (eg, pulmonary fibrosis, pneumonia, ARDS, pulmonary edema)"
      - kind: try
        items: [resp.L03.016, resp.L03.001, resp.L03.006, resp.L03.008]
    recap:
      - "FRC = RV + ERV، والـ RV وأي سعة فيها RV مش بالـ spirometry."
      - "Restrictive: سريع وسطحي. Obstructive: بطيء وعميق."
      - "VD = VT × (PaCO2 − PECO2)/PaCO2. VA = (VT − VD) × RR."
      - "FRC: intrapleural سالب، PVR في الأقل. Compliance ↑ في emphysema، ↓ في fibrosis و ARDS و edema."
    practice: [resp.L03.001, resp.L03.002, resp.L03.003, resp.L03.004, resp.L03.005, resp.L03.006, resp.L03.007, resp.L03.008, resp.L03.009, resp.L03.010, resp.L03.011, resp.L03.012, resp.L03.013, resp.L03.014, resp.L03.015, resp.L03.016, resp.L03.017, resp.L03.018, resp.L03.019, resp.L03.077, resp.L03.088, resp.L03.089, resp.L03.090, resp.L03.091, resp.L03.092, resp.L03.093]
  - id: resp.L03.lesson2
    title: "الدورة الرئوية، والـ V/Q، والـ A-a gradient"
    hook: "الرئة الوحيدة اللي بتقفل الأوعية لما الأكسجين يقل، ومعادلة واحدة تفرّق بها بين أسباب الـ hypoxemia"
    minutes: 9
    pages: [684, 685]
    topics: [pulmonary-circulation, pulmonary-vascular-resistance, ventilation-perfusion-mismatch, alveolar-gas-equation]
    goals:
      - "تفرّق بين perfusion limited و diffusion limited"
      - "تحسب الـ PVR والـ A-a gradient"
      - "تعرف الـ V/Q في الـ apex والـ base، والفرق بين الـ shunt والـ dead space"
    status: unverified
    steps:
      - kind: explain
        title: "Hypoxic vasoconstriction"
        text: |-
          الدورة الرئوية ==low resistance، high compliance==. ولما الـ PAO2 يقل في حتة، الأوعية هناك ==تقفل== وتبعت الدم للحتت اللي فيها هوا. ده عكس الـ systemic circulation اللي بتوسّع لما الـ PO2 يقل.

          ولو الـ vasoconstriction ده بقى مزمن ← pulmonary hypertension ± cor pulmonale.
        page: 684
        quote: "causes hypoxic vasoconstriction that shifts blood away from poorly ventilated regions of lung to well-ventilated regions of lung"
      - kind: explain
        title: "Perfusion limited ولا diffusion limited؟"
        text: |-
          - **Perfusion limited**: O2 (في الصحة)، CO2، N2O. الغاز بيتوازن بدري في أول الـ capillary، فمش هتزوّد التبادل غير لو ==زوّدت الدم==.
          - **Diffusion limited**: O2 في الـ emphysema والـ fibrosis، والـ CO. الغاز ==ما بيتوازنش== لحد آخر الـ capillary.

          الـ O2 بطيء والـ CO2 سريع جداً، فالـ fibrosis بتعمل ==hypoxia قبل الـ hypercapnia==.
        page: 684
        quote: "Disease states that lead to diffusion limitation (eg, pulmonary fibrosis) are more likely to cause early hypoxia than hypercapnia."
      - kind: aside
        tone: exam
        text: "قانون Fick: J = A × Dk × (P1 − P2)/Δx. الـ ==emphysema بتقلل الـ A== (المساحة)، والـ ==fibrosis بتزوّد الـ Δx== (التخانة). والـ DLCO بيقيس قد إيه الـ CO بيعدّي من الـ alveoli للدم."
        page: 684
        quote: "A ↓ in emphysema. ▘ Δx ↑ in pulmonary fibrosis."
      - kind: check
        question: "A patient with fibrosis has low PaO2 but normal PaCO2. Why?"
        options:
          - "O2 diffuses slowly; CO2 diffuses very rapidly"
          - "CO2 is diffusion limited"
          - "Fibrosis increases surface area"
          - "Hypoxic vasodilation"
        answer: 0
        why:
          - "صح: الـ O2 بطيء فيتأثر بالتخانة الأول."
          - "الـ CO2 perfusion limited وسريع."
          - "الـ fibrosis بتزوّد التخانة، مش المساحة."
          - "الرئة بتعمل vasoconstriction مع الـ hypoxia."
        page: 684
        quote: "O2 diffuses slowly, while CO2 diffuses very rapidly across the alveolar membrane."
      - kind: explain
        title: "Pulmonary vascular resistance"
        text: |-
          ==PVR = (Ppulm artery − PL atrium) / Q̇==

          والـ PL atrium بنقيسه بالـ ==wedge pressure== (pulmonary artery occlusion pressure). ومن ΔP = Q̇ × R: R = ΔP/Q̇.

          والـ resistance = 8ηl/πr⁴، يعني لو الـ radius قلّ للنص، الـ resistance تزيد 16 مرة.
        page: 684
        quote: "PL atrium ≈ pulmonary artery occlusion pressure (also called pulmonary capillary wedge pressure)"
      - kind: figure
        title: "الـ V/Q من فوق لتحت"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <path class="fg-box" d="M90,20 C40,40 30,120 40,210 L150,210 C160,120 140,40 90,20 Z"/>
            <text x="70" y="60" class="t-sm t-b">apex</text>
            <text x="70" y="196" class="t-sm t-b">base</text>
            <rect class="fg-bad" x="180" y="30" width="170" height="44" rx="6"/>
            <text x="190" y="48" class="t-sm t-b">V/Q = 3</text>
            <text x="190" y="66" class="t-sm">wasted ventilation, TB</text>
            <rect class="fg-acc" x="180" y="92" width="170" height="44" rx="6"/>
            <text x="190" y="110" class="t-sm t-b">V and Q both ↑ at base</text>
            <text x="190" y="128" class="t-sm">exercise: ratio → 1</text>
            <rect class="fg-good" x="180" y="154" width="170" height="44" rx="6"/>
            <text x="190" y="172" class="t-sm t-b">V/Q = 0.6</text>
            <text x="190" y="190" class="t-sm">wasted perfusion</text>
          </svg>
        alt: "Lung outline with the apex labeled V/Q 3, wasted ventilation and TB, and the base labeled V/Q 0.6, wasted perfusion; both ventilation and perfusion are higher at the base and exercise brings the ratio toward 1."
        caption: "فوق: هوا كتير ودم قليل. تحت: الاتنين أكتر، بس الدم أكتر."
        page: 685
        quote: "at apex of lung = 3 (wasted ventilation) ▘ at base of lung = 0.6 (wasted perfusion)"
      - kind: table
        title: "الطرفين"
        columns: ["V/Q", "يعني إيه", "100% O2", "مثال"]
        rows:
          - ["0", "Airway obstruction (shunt)", "لا يحسّن PaO2", "Foreign body"]
          - ["∞", "Blood flow obstruction (dead space)", "يحسّن PaO2", "Pulmonary embolus"]
        hide: [[0, 2], [1, 2]]
        page: 685
        quote: "In shunt, 100% O2 does not improve PaO2 (eg, foreign body aspiration)."
      - kind: check
        question: "Which hypoxemia does not improve with 100% O2?"
        options:
          - "Shunt (V/Q = 0)"
          - "Pulmonary embolus (V/Q → ∞)"
          - "High altitude"
          - "Hypoventilation"
        answer: 0
        why:
          - "صح: الدم بيعدّي على alveoli مفيهاش هوا خالص، فزيادة الـ O2 مش بتوصله."
          - "في الـ PE الـ 100% O2 بيحسّن الـ PaO2 طالما الـ dead space أقل من 100%."
          - "الـ altitude بتتحسن بالـ O2."
          - "الـ hypoventilation بتتحسن بالـ O2."
        page: 685
        quote: "Assuming <100% dead space, 100% O2 improves PaO2 (eg, pulmonary embolus)."
      - kind: explain
        title: "Alveolar gas equation والـ A-a gradient"
        text: |-
          ==PAO2 = PIO2 − PaCO2/RQ==. على مستوى البحر وهوا عادي: PAO2 ≈ 150 − PaCO2/0.8.

          الـ ==A-a gradient = PAO2 − PaO2==، والطبيعي (age/4) + 4، يعني تحت 40 سنة أقل من 14.

          الـ zones: Zone 1 PA ≥ Pa > Pv، Zone 2 Pa > PA > Pv، Zone 3 Pa > Pv > PA.
        page: 685
        quote: "Normal A-a gradient estimated as (age/4) + 4 (eg, for a person <40 years old, gradient should be <14)."
      - kind: try
        items: [resp.L03.020, resp.L03.027, resp.L03.030, resp.L03.036]
    recap:
      - "الرئة: hypoxia ← vasoconstriction. الجسم: hypoxia ← vasodilation."
      - "Perfusion limited: O2 صحي، CO2، N2O. Diffusion limited: O2 في fibrosis و emphysema، CO."
      - "Emphysema ↓ A، fibrosis ↑ Δx. PVR = (PA − wedge)/Q̇."
      - "Apex V/Q 3 (TB)، base 0.6. Shunt = 0 ومش بيتحسن بالـ O2؛ PE = ∞ وبيتحسن."
      - "PAO2 = 150 − PaCO2/0.8. A-a طبيعي = age/4 + 4."
    practice: [resp.L03.020, resp.L03.021, resp.L03.022, resp.L03.023, resp.L03.024, resp.L03.025, resp.L03.026, resp.L03.027, resp.L03.028, resp.L03.029, resp.L03.030, resp.L03.031, resp.L03.032, resp.L03.033, resp.L03.034, resp.L03.035, resp.L03.036, resp.L03.037, resp.L03.038, resp.L03.078, resp.L03.094]
  - id: resp.L03.lesson3
    title: "الـ CO2 بيتشال إزاي، وأسباب الـ hypoxemia، والهيموجلوبين"
    hook: "90% من الـ CO2 بيمشي bicarbonate، والـ anemia بتقلل الـ O2 content من غير ما تلمس الـ saturation"
    minutes: 9
    pages: [686, 687]
    topics: [carbon-dioxide-transport, hypoxia-and-hypoxemia, hemoglobin, oxygen-content-of-blood, oxyhemoglobin-dissociation-curve]
    goals:
      - "تعرف التلات طرق اللي الـ CO2 بيتشال بيها، والـ Haldane effect"
      - "تفرّق أسباب الـ hypoxemia بالـ A-a gradient"
      - "تقرا جدول الـ O2 content، وتعرف إيه اللي بيزق الـ ODC يمين أو شمال"
    status: unverified
    steps:
      - kind: explain
        title: "الـ CO2 في الدم"
        text: |-
          1. ==90%== بيتحوّل لـ HCO3− جوه الـ RBC بالـ carbonic anhydrase، ويتشال في الـ plasma للرئة.
          2. 5% carbamino: مع بروتينات الـ plasma ومع الـ N-terminus بتاع الـ globin في الـ Hb غير المؤكسج (HbCO2).
          3. 5% دايب في الـ plasma.

          وفي الرئة، الـ O2 لما يركب الـ Hb بيطلّع H+، فالـ CO2 يطلع من الـ RBC: ده ==Haldane effect==.
        page: 686
        quote: "In the lungs, Hb oxygenation promotes dissociation of H+ → equilibrium shifts towards CO2 production → CO2 is released from RBCs (Haldane effect)."
      - kind: explain
        title: "Hypoxia ولا hypoxemia؟"
        text: |-
          **Hypoxia** = ↓ O2 delivery للأنسجة: ↓ cardiac output، hypoxemia، ischemia، anemia، CO أو cyanide.

          **Hypoxemia** = ↓ PaO2. والـ ==A-a gradient== هو اللي بيفرّق:
          - **Normal**: ↓ PIO2 (==high altitude==)، و hypoventilation (opiates، obesity hypoventilation، neuromuscular weakness).
          - **Increased**: diffusion limitation (fibrosis)، V/Q mismatch (pulmonary edema، PE)، و right-to-left shunt.
        page: 686
        quote: "Commonly due to ↓ cardiac output, hypoxemia (insufficient oxygenation of blood with ↓ PaO2 ), ischemia, anemia, CO/cyanide poisoning."
      - kind: sort
        prompt: "الـ A-a gradient طبيعي ولا عالي؟"
        bins: ["Normal A-a", "Increased A-a"]
        cards:
          - { text: "High altitude", bin: 0 }
          - { text: "Opiate overdose", bin: 0 }
          - { text: "Neuromuscular weakness", bin: 0 }
          - { text: "Pulmonary fibrosis", bin: 1 }
          - { text: "Pulmonary embolism", bin: 1 }
          - { text: "Intracardiac shunt", bin: 1 }
        why: "لو المشكلة في الهوا الداخل أو في الـ ventilation، الرئة نفسها سليمة فالـ gradient طبيعي. لو المشكلة جوه الرئة (جدار تخين، V/Q، shunt)، الـ gradient يعلى."
        page: 686
        quote: "CNS depression from opiate overdose, obesity hypoventilation syndrome, neuromuscular weakness"
      - kind: explain
        title: "الهيموجلوبين والـ myoglobin"
        text: |-
          - **Hb**: 4 وحدات (2 α + 2 β)، كل واحدة بتشيل O2. ==positive cooperativity==: المؤكسج affinity عالية (300×)، وغير المؤكسج affinity واطية فيسيب الـ O2. والبروتين بيعمل buffer للـ H+ والـ CO2.
          - **Myoglobin**: سلسلة واحدة و heme واحد، ==affinity أعلى من الـ Hb==، ومفيهوش cooperativity فالـ curve مش sigmoidal. مهم للعضلات الشغالة aerobic.
        page: 687
        quote: "Myoglobin is composed of a single polypeptide chain associated with one heme moiety. Higher affinity for oxygen than Hb."
      - kind: explain
        title: "O2 content"
        text: |-
          ==O2 content = (1.34 × Hb × SaO2) + (0.003 × PaO2)==

          الطبيعي Hb 15 g/dL، والـ capacity ≈ 20 mL O2/dL. والـ O2 delivery = cardiac output × O2 content.

          لو الـ Hb قلّ: الـ content يقل، بس ==الـ saturation والـ PaO2 طبيعيين==.
        page: 687
        quote: "With ↓ Hb there is ↓ O2 content of arterial blood, but no change in O2 saturation and Pao2 ."
      - kind: table
        title: "مين بيغيّر إيه"
        columns: ["State", "Hb", "SaO2", "PaO2", "O2 content"]
        rows:
          - ["CO poisoning", "Normal", "↓", "Normal", "↓"]
          - ["Anemia", "↓", "Normal", "Normal", "↓"]
          - ["Polycythemia", "↑", "Normal", "Normal", "↑"]
          - ["Methemoglobinemia", "Normal", "↓", "Normal", "↓"]
          - ["Cyanide", "Normal", "Normal", "Normal", "Normal"]
        hide: [[0, 2], [1, 2], [3, 2], [4, 4]]
        page: 687
        quote: "Anemia ↓ Normal Normal ↓ Polycythemia ↑ Normal Normal ↑"
      - kind: check
        question: "Which state lowers SaO2 but leaves PaO2 normal?"
        options:
          - "CO poisoning"
          - "Anemia"
          - "Polycythemia"
          - "Cyanide toxicity"
        answer: 0
        why:
          - "صح: الـ CO بينافس الـ O2 على الـ Hb، والـ PaO2 (الدايب) طبيعي. ونفس الكلام في الـ methemoglobinemia."
          - "الـ anemia الـ saturation فيها طبيعي."
          - "الـ polycythemia الـ saturation طبيعي والـ content عالي."
          - "الـ cyanide كله طبيعي على الورق."
        page: 687
        quote: "CO poisoning Normal ↓ (CO competes with O ) 2 Normal ↓"
      - kind: figure
