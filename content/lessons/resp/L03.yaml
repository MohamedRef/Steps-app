  - id: resp.L03.lesson4
    title: "الجبل، والتمرين، والتسمم: MetHb و cyanide و CO"
    hook: "دم لونه شوكولاتة، نفَس ريحته لوز، وعيلة كاملة صاحية بصداع في الشتا"
    minutes: 9
    pages: [688, 689]
    topics: [response-to-high-altitude, response-to-exercise, methemoglobin, cyanide-vs-carbon-monoxide-poisoning]
    goals:
      - "تتبّع الجسم وهو بيتأقلم مع الارتفاع"
      - "تعرف إيه اللي بيتغيّر وإيه اللي ثابت في التمرين"
      - "تفرّق بين الـ MetHb والـ cyanide والـ CO في الأسباب والصورة والعلاج"
    status: unverified
    steps:
      - kind: order
        prompt: "رتّب اللي بيحصل أول ما تطلع جبل عالي"
        steps:
          - "↓ PB (FIO2 ثابت)"
          - "↓ PIO2 ثم ↓ PaO2"
          - "↑ ventilation"
          - "↓ PaCO2 ← respiratory alkalosis"
          - "Altitude sickness: صداع، غثيان، تعب، دوخة، نوم متقطع"
        why: "الـ FIO2 نفسه ثابت، بس الضغط الجوي أقل، فكل حاجة بعده بتنزل، والـ hyperventilation بيطيّر الـ CO2."
        page: 688
        quote: "respiratory alkalosis → altitude sickness (headaches, nausea, fatigue, lightheadedness, sleep disturbance)."
      - kind: explain
        title: "التأقلم المزمن"
        text: |-
          - ventilation عالي على طول.
          - ==↑ EPO== من الكلى ← ↑ Hct و Hb.
          - ==↑ 2,3-BPG== ← ODC يمين ← O2 بينزل أكتر.
          - ↑ mitochondria.
          - الكلى بتطلّع HCO3− تعادل الـ alkalosis (وممكن تساعدها بالـ ==acetazolamide==).
          - الـ hypoxic vasoconstriction المزمن ← ↑ PVR ← pulmonary hypertension و RVH.
        page: 688
        quote: "↑ erythropoietin (primarily from kidneys) → ↑ Hct and Hb (due to chronic hypoxemia)."
      - kind: explain
        title: "التمرين"
        text: |-
          ↑ HR و SV ← ↑ Q̇ ← ↑ pulmonary blood flow ← الـ V/Q من الـ base للـ apex ==يبقى أكتر uniform==.

          الأنسجة بتطلّع CO2 وتحمّض ← ODC يمين ← O2 بينزل أكتر ← الفرق الـ arteriovenous يكبر.

          بس الـ ==PaO2 والـ PaCO2 ثابتين==. اللي بيتغيّر الـ venous: الـ PvO2 يقل والـ PvCO2 يزيد.
        page: 688
        quote: "PaO2 and PaCO2 are maintained by homeostatic mechanisms."
      - kind: check
        question: "During heavy exercise, which stays the same?"
        options:
          - "Arterial PaCO2"
          - "Venous PO2"
          - "Cardiac output"
          - "Venous PCO2"
        answer: 0
        why:
          - "صح: الـ arterial gases بتتظبط بالـ homeostasis."
          - "الـ venous PO2 يقل لأن العضلات بتسحب O2 أكتر."
          - "الـ Q̇ يزيد."
          - "الـ venous PCO2 يزيد."
        page: 688
        quote: "PaO2 and PaCO2 are maintained by homeostatic mechanisms."
      - kind: explain
        title: "Methemoglobin"
        text: |-
          الحديد الطبيعي ==Fe2+== («just the 2 of us»). لما يتأكسد لـ ==Fe3+== يبقى methemoglobin: ما بيشيلش O2 كويس، وكمان بيخلي الـ Fe2+ الباقي يمسك الـ O2 جامد (left shift)، وعنده affinity للـ cyanide.

          - **الأسباب**: dapsone، local anesthetics (benzocaine)، nitrites (أكل أو مية ملوثة).
          - **الصورة**: cyanosis ==مش بيتحسن بالـ O2==، ودم لونه chocolate.
          - **العلاج**: methylene blue و vitamin C.
        page: 688
        quote: "Dapsone, local anesthetics (eg, benzocaine), and nitrites (eg, from dietary intake or polluted water sources) cause poisoning by oxidizing Fe2+ to Fe3+ ."
      - kind: check
        question: "Cyanosis after benzocaine spray, unchanged on 100% O2, brown blood. Treatment?"
        options:
          - "Methylene blue"
          - "Hydroxocobalamin"
          - "Hyperbaric O2"
          - "Sodium nitrite"
        answer: 0
        why:
          - "صح: methemoglobinemia ← methylene blue و vitamin C."
          - "ده للـ cyanide."
          - "ده للـ CO الشديد."
          - "الـ nitrites بتعمل methemoglobin أصلاً."
        page: 688
        quote: "Methemoglobinemia can be treated with methylene blue and vitamin C."
      - kind: explain
        title: "Cyanide و CO: نفس الهدف"
        text: |-
          الاتنين بيقفلوا ==complex IV== (cytochrome c oxidase)، فالـ hypoxia مش بتتصلح كويس بالـ O2، والـ anaerobic metabolism يزيد.
        page: 689
        quote: "Both inhibit aerobic metabolism via inhibition of complex IV of ETC (cytochrome c oxidase) → hypoxia that does not fully correct with supplemental O2 and ↑ anaerobic metabolism."
      - kind: figure
        title: "Cyanide قصاد CO"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-bad" x="10" y="10" width="165" height="210" rx="8"/>
            <text x="20" y="32" class="t-sm t-b">Cyanide</text>
            <text x="20" y="56" class="t-sm">fires, nitroprusside,</text>
            <text x="20" y="72" class="t-sm">apricot seeds</text>
            <text x="20" y="96" class="t-sm">bitter almond breath</text>
            <text x="20" y="120" class="t-sm">↑ lactate, AG acidosis</text>
            <text x="20" y="144" class="t-sm">ODC normal</text>
            <text x="20" y="168" class="t-sm">hydroxocobalamin,</text>
            <text x="20" y="184" class="t-sm">nitrites, thiosulfate</text>
            <rect class="fg-acc" x="185" y="10" width="165" height="210" rx="8"/>
            <text x="195" y="32" class="t-sm t-b">CO</text>
            <text x="195" y="56" class="t-sm">furnaces, heaters,</text>
            <text x="195" y="72" class="t-sm">exhaust, smoke</text>
            <text x="195" y="96" class="t-sm">many victims</text>
            <text x="195" y="120" class="t-sm">co-oximetry CO-Hb</text>
            <text x="195" y="144" class="t-sm">ODC left shift</text>
            <text x="195" y="168" class="t-sm">100% O2,</text>
            <text x="195" y="184" class="t-sm">hyperbaric if severe</text>
          </svg>
        alt: "Side-by-side comparison of cyanide (sources, bitter almond breath, lactic anion gap acidosis, normal curve, three antidotes) and carbon monoxide (sources, multiple victims, CO-Hb on co-oximetry, left-shifted curve, 100% or hyperbaric oxygen)."
        caption: "الاتنين ممكن يعملوا جلد cherry red، والاتنين الـ PaO2 طبيعي."
        page: 689
        quote: "Synthetic product combustion, amygdalin ingestion (found in apricot seeds), cyanide ingestion (eg, in suicide attempts), fires."
      - kind: explain
        title: "CO بالتفصيل"
        text: |-
          عديم اللون والريحة والطعم، وأكتر سبب وفاة بالتسمم في العالم. صداع، ترجيع، لخبطة، مشاكل في النظر، coma، وأحياناً cherry-red مع bullae. وغالباً ==أكتر من ضحية== (عيلة وسخان بايظ).

          - بيمسك الـ Hb بـ affinity أكتر من 200× ← ↓ %O2 saturation و left shift.
          - الـ ==pulse oximetry مش بيشوفه==، لازم co-oximetry. وعلى الـ MRI: bilateral ==globus pallidus== lesions.
          - العلاج 100% O2: الـ half-life من ~300 دقيقة لـ ~80، ولـ ~20 في الـ hyperbaric.
        page: 689
        quote: "Normal Pao2 . ↑ carboxyhemoglobin (CO-Hb) on co-oximetry (cannot be distinguished with pulse oximetry)."
      - kind: aside
        tone: trap
        text: "ضحية حريق ممكن يكون عنده CO و cyanide مع بعض: ادّيله ==hydroxocobalamin أو sodium thiosulfate==، و ==بلاش nitrites== لأنها هتعمل methemoglobin فوق الـ CO."
        page: 689
        quote: "If concurrent CO and cyanide poisoning are suspected (eg, in victims of a fire), give hydroxocobalamin or sodium thiosulfate. Avoid nitrates to prevent ↑ methemoglobin."
      - kind: check
        question: "A man on prolonged nitroprusside develops confusion and lactic acidosis with normal PaO2. Which antidote?"
        options:
          - "Hydroxocobalamin"
          - "Methylene blue"
          - "100% O2 alone"
          - "Naloxone"
        answer: 0
        why:
          - "صح: الـ nitroprusside ممكن يعمل cyanide toxicity، والـ hydroxocobalamin بيمسك الـ cyanide ويطلع في البول cyanocobalamin."
          - "الـ methylene blue للـ MetHb."
          - "الـ 100% O2 مالوش فايدة في الـ cyanide."
          - "الـ naloxone للـ opioids."
        page: 689
        quote: "Risk of cyanide toxicity with use of nitroprusside in hypertensive emergencies."
      - kind: try
