        page: 697
        quote: "Nocturnal hypoxia systemic and pulmonary hypertension, arrhythmias (atrial fibrillation/flutter), sudden death."
      - kind: explain
        title: "Pulmonary hypertension"
        text: |-
          ==Mean PA pressure > 20 mm Hg== وقت الراحة ← ↑ PVR ← ↑ RV pressure ← RVH (parasternal heave) ← RV failure.

          - **Group 1 (PAH)**: غالباً idiopathic، ستات أكتر. الـ heritable من ==BMPR2== (بيمنع الـ smooth muscle يزيد). ↑ endothelin و ↓ NO و prostacyclin. وكمان drugs، CTD، HIV، portal HTN، CHD، schistosomiasis.
          - **Group 2**: القلب الشمال. **Group 3**: COPD، ILD، OSA، altitude. **Group 4**: chronic thromboembolic. **Group 5**: multifactorial.
        page: 698
        quote: "Heritable PAH can be due to an inactivating mutation in BMPR2 gene (normally inhibits vascular smooth muscle proliferation); poor prognosis."
      - kind: table
