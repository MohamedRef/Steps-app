      - kind: aside
        tone: trap
        text: "**Aspiration pneumonia** بتظهر بعد ==أيام== في الـ segment الواطي (RLL قاعد، RUL نايم)، وممكن تعمل abscess. أما الـ **chemical pneumonitis** فبعد ==ساعات==، من حمض المعدة، وبتخف لوحدها. والـ **cryptogenic organizing pneumonia** cultures سلبية وبتستجيب للـ steroids مش الـ antibiotics."
