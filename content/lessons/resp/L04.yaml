            <rect class="fg-box" x="190" y="110" width="160" height="44" rx="6"/>
            <text x="200" y="128" class="t-sm t-b">Gray hep. (5-7)</text>
            <text x="200" y="146" class="t-sm">WBCs, lysed RBCs</text>
            <rect class="fg-good" x="10" y="110" width="160" height="44" rx="6"/>
            <text x="20" y="128" class="t-sm t-b">Resolution (8+)</text>
            <text x="20" y="146" class="t-sm">macrophages digest</text>
            <line class="fg-arrow" x1="170" y1="42" x2="188" y2="42" marker-end="url(#pL4a)"/>
            <line class="fg-arrow" x1="270" y1="64" x2="270" y2="108" marker-end="url(#pL4a)"/>
