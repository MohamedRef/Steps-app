          </svg>
        alt: "Cycle of lobar pneumonia stages: congestion days 1 to 2 with mostly bacteria, red hepatization days 3 to 4 with fibrin, RBCs and WBCs, gray hepatization days 5 to 7 with WBCs and lysed RBCs, and resolution from day 8 with macrophages digesting the exudate."
        caption: "الأحمر من الـ RBCs، والرمادي لما الـ RBCs تتكسر ويفضل الـ WBCs والـ fibrin."
        page: 700
        quote: "Congestion Red hepatization Gray hepatization Resolution DAYS 1-2 3-4 5-7 8+"
      - kind: table
        title: "أنواع الـ pneumonia"
        columns: ["Type", "Organisms", "Pattern"]
        rows:
