      - kind: explain
        title: "SVC syndrome"
        text: |-
          الـ SVC اتقفل (جلطة أو ورم) ← وش أحمر منفوخ (==facial plethora==)، JVD، edema في الحنجرة والإيدين. أشهر سبب: ==malignancy== (mediastinal mass، Pancoast) والجلطة من الـ catheters. ==Emergency==، وممكن يرفع الـ intracranial pressure.
        page: 702
