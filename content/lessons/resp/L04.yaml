  - id: resp.L04.lesson4
    title: "ARDS، والنوم، والـ pulmonary hypertension، والكشف"
    hook: "رئة بيضا من غير قلب تعبان، شخير بيرفع الـ hematocrit، وسماعة بتقولك فين المشكلة"
    minutes: 9
