  - id: resp.L04.lesson5
    title: "الـ pleura والـ pneumonia"
    hook: "سايل، هوا، أو صديد: كل واحد بيتصرف غير التاني"
    minutes: 9
    pages: [699, 701]
    topics: [atelectasis, pleural-effusions, pneumothorax, natural-history-of-lobar-pneumonia, pneumonia]
    goals:
      - "تفرّق أنواع الـ atelectasis والـ exudate من الـ transudate"
      - "تتعامل مع الـ tension pneumothorax"
      - "ترتّب مراحل الـ lobar pneumonia وتعرف أنواع الـ pneumonia"
    status: unverified
    steps:
      - kind: match
        prompt: "وصّل كل نوع atelectasis بمثاله"
        pairs:
          - ["Obstructive", "Mucous plug or tumor"]
          - ["Compressive", "Pleural effusion"]
          - ["Contraction", "Sarcoidosis scarring"]
          - ["Adhesive", "NRDS (no surfactant)"]
        why: "الـ obstructive الهوا القديم بيتمص؛ الـ compressive حاجة ضاغطة من برّه؛ الـ contraction scar بيشد؛ الـ adhesive مفيش surfactant. والوقاية: incentive spirometry أو ↑ PEEP."
        page: 699
        quote: "Adhesive—due to lack of surfactant (eg, NRDS in premature infants)"
      - kind: explain
        title: "Pleural effusion"
        text: |-
          **Light's criteria** للـ exudate (أي واحد يكفي): protein سايل/دم ==> 0.5==، LDH سايل/دم ==> 0.6==، أو LDH السايل > 2/3 من أعلى طبيعي.

          - **Exudate** (cloudy): infection (pneumonia، TB)، malignancy، CTD، chylothorax، trauma. غالباً محتاج drainage.
          - **Transudate** (clear): ↑ hydrostatic (HF، Na+ retention) أو ↓ oncotic (==nephrotic، cirrhosis==).
        page: 699
        quote: "fluid is consistent with an exudate if pleural fluid protein/serum protein >0.5, pleural fluid LDH/serum LDH >0.6, or pleural fluid LDH >2/3 upper limit of normal serum LDH."
      - kind: check
        question: "Effusion in nephrotic syndrome. Exudate or transudate?"
        options:
          - "Transudate, from ↓ oncotic pressure"
          - "Exudate, from infection"
          - "Exudate, from ↑ permeability"
          - "Chylothorax"
        answer: 0
        why:
          - "صح: البروتين بيضيع في البول فالـ oncotic pressure تقل."
          - "مفيش infection هنا."
          - "الـ permeability بتعمل exudate."
          - "الـ chylothorax lymphatic exudate."
        page: 699
        quote: "Due to hydrostatic pressure (eg, HF, Na+ retention) and/or oncotic pressure (eg, nephrotic syndrome, cirrhosis)."
      - kind: explain
        title: "Pneumothorax"
        text: |-
          هوا في الـ pleural space: dyspnea، ↓ fremitus، hyperresonance، و ↓ breath sounds في نفس الناحية.

          - **Primary spontaneous**: ==apical bleb== بيفرقع؛ شاب طويل ورفيع، تدخين و vaping.
          - **Secondary**: emphysema bullae، Marfan، barotrauma.
          - **Traumatic**: rib fracture، طلقة، central line أو biopsy.
          - **Tension**: الهوا بيدخل وما يخرجش ← الـ ==trachea تروح بعيد== ← الـ IVC يتلوي ← ↓ venous return ← obstructive shock و JVD. ==Needle decompression فوراً== وبعدين chest tube.
        page: 700
        quote: "Due to rupture of apical subpleural bleb or cysts. Occurs most frequently in tall, thin, young males."
      - kind: figure
        title: "مراحل الـ lobar pneumonia"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="pL4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
