    status: unverified
    steps:
      - kind: explain
        title: "ARDS"
        text: |-
          إصابة في الـ alveoli ← cytokines ← neutrophils ← الـ endothelium يتأذي ← سايل مليان بروتين في الـ alveoli ← ==hyaline membranes== و noncardiogenic edema (==PCWP طبيعي==) ← ↓ compliance و V/Q mismatch ← ↑ PVR.

          الأسباب: ==sepsis (الأشهر)==، aspiration، burns، trauma، pancreatitis، drowning.
        page: 697
        quote: "Sepsis (most common), aspiration pneumonia, burns, trauma, pancreatitis, drowning injuries."
      - kind: mnemonic
        word: "ARDS"
        parts:
          - { key: "A", text: "Abnormal CXR (bilateral opacities)" }
          - { key: "R", text: "Respiratory failure within 1 week" }
          - { key: "D", text: "Decreased PaO2/FIO2 (< 300)" }
          - { key: "S", text: "Symptoms not due to HF/fluid overload" }
        hook: "معايير Berlin بتتهجّى الاسم نفسه. والتنفس الصناعي: ↓ VT و ↑ PEEP."
        page: 697
        quote: "Respiratory failure within 1 week of alveolar insult"
      - kind: check
        question: "ARDS ventilation strategy?"
        options:
          - "Low tidal volume, high PEEP"
          - "High tidal volume, low PEEP"
          - "High tidal volume, no PEEP"
          - "100% O2 only"
        answer: 0
        why:
          - "صح: ↓ VT عشان ما تأذيش الرئة، و ↑ PEEP يفضل يفتح الـ alveoli في الزفير."
          - "العكس."
          - "الـ PEEP مهم."
          - "الـ shunt مش بيتحل بالـ O2 لوحده."
        page: 697
        quote: "PEEP (keeps alveoli open during expiration)."
      - kind: table
        title: "Sleep-disordered breathing"
        columns: ["Type", "Why", "Treatment"]
        rows:
