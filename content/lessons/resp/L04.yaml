schema: steps.lesson/v1
lecture: resp.L04
lessons:
  - id: resp.L04.lesson1
    title: "الأنف والحنجرة، والـ emboli، والـ mediastinum"
    hook: "الـ maxillary sinus بيصرّف لفوق، والـ embolus بيمشي زي FAT BAT، والـ anterior mediastinum فيه 4 T's"
    minutes: 9
    pages: [690, 691]
    topics: [rhinosinusitis, epistaxis, head-and-neck-cancer, pulmonary-emboli, mediastinal-masses, mediastinitis, pneumomediastinum]
    goals:
      - "تعرف ليه الـ maxillary sinus بيلتهب أكتر، ومنين النزيف الخطير في الأنف"
      - "تفرّق أنواع الـ emboli وتعرف إزاي الـ saddle embolus بيعمل shock"
      - "تحط كل mass في الـ mediastinum في مكانها"
    status: unverified
    steps:
      - kind: explain
        title: "Rhinosinusitis"
        text: |-
          الصرف بيتقفل ← التهاب وألم. أكتر واحد بيتعب الـ ==maxillary== لأن فتحته فوق (superomedial)، فبيصرّف ضد الجاذبية.

          - Superior meatus: posterior ethmoid و sphenoid. Middle: frontal و maxillary و anterior ethmoid. Inferior: الـ nasolacrimal duct.
          - السبب الأول ==فيروسات== (rhinovirus)، وبعدين ممكن bacteria: nontypeable H influenzae، S pneumoniae، M catarrhalis.
          - ممكن يمتد للـ orbit أو الـ cavernous sinus أو المخ.
        page: 690
        quote: "Typically affects maxillary sinuses, which drain against gravity due to ostia located superomedially"
      - kind: explain
        title: "Epistaxis"
        text: |-
          - **Anterior** (الأشهر): ==Kiesselbach plexus== في الـ caudal septum. «Kiesselbach drives his Lexus with his LEGS»: superior Labial، Ethmoidal (anterior و posterior)، Greater palatine، Sphenopalatine.
          - **Posterior** (الخطير): الـ ==sphenopalatine artery== (فرع من الـ maxillary).
          - الأسباب: foreign body، trauma، allergic rhinitis، و nasal angiofibroma (ولد مراهق).
        page: 690
        quote: "Life-threatening hemorrhages occur in posterior segment (sphenopalatine artery, a branch of maxillary artery)."
      - kind: aside
        tone: exam
        text: "Head and neck cancer أغلبه ==squamous cell==: tobacco، alcohol، HPV-16 (oropharynx)، EBV (nasopharynx). والـ laryngeal papillomatosis حميد، على الـ vocal cords في الأطفال، من ==HPV-6 و HPV-11==، وبيعمل بحّة."
        page: 690
        quote: "Mostly squamous cell carcinoma. Risk factors include tobacco, alcohol, HPV-16 (oropharyngeal), EBV (nasopharyngeal)."
      - kind: check
        question: "Which artery causes life-threatening posterior epistaxis?"
        options:
          - "Sphenopalatine artery"
          - "Superior labial artery"
          - "Anterior ethmoidal artery"
          - "Greater palatine artery"
        answer: 0
        why:
          - "صح: الـ posterior segment = sphenopalatine، فرع من الـ maxillary."
          - "الـ superior labial جزء من الـ Kiesselbach قدام."
          - "الـ anterior ethmoidal بيغذي الـ Kiesselbach."
          - "الـ greater palatine في الـ Kiesselbach."
        page: 690
        quote: "Most commonly occurs in anterior segment of nostril (Kiesselbach plexus at caudal septum)."
      - kind: explain
        title: "Pulmonary embolus"
        text: |-
          الـ alveoli فيها هوا بس مفيهاش دم (==↑ V/Q==). Dyspnea مفاجئ، pleuritic chest pain، tachypnea، tachycardia، hypoxemia، respiratory alkalosis.

          - الـ ==saddle embolus==: الـ RV يكبر ويضغط على الـ LV فما يتملاش ← obstructive shock وموت مفاجئ.
          - التشخيص: ==CT pulmonary angiography== (filling defect). الـ ECG: sinus tachycardia، وأقل S1Q3T3.
          - الـ lines of Zahn: طبقات بلاتلت وفيبرين ودم، بتتعمل بس في جلطة قبل الموت.
          - العلاج: anticoagulation، أو IVC filter لو ممنوع.
        page: 691
        quote: "Large emboli or saddle embolus (arrows in A ) may cause sudden death due to restricted LV filling and ↑ RV size → further ↓ in LV filling → obstructive shock."
      - kind: mnemonic
        word: "FATBAT"
        parts:
          - { key: "F", text: "Fat (long bone fracture, liposuction)" }
          - { key: "A", text: "Air (divers, central lines)" }
          - { key: "T", text: "Thrombus (surgery, immobility)" }
          - { key: "B", text: "Bacteria" }
          - { key: "A", text: "Amniotic fluid (labor; DIC)" }
          - { key: "T", text: "Tumor" }
        hook: "An embolus moves like a FAT BAT. الـ fat: hypoxemia + أعراض عصبية + petechial rash."
        page: 691
        quote: "Types: Fat, Air, Thrombus, Bacteria, Amniotic fluid, Tumor. An embolus moves like a FAT BAT."
      - kind: figure
        title: "الـ mediastinum"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="20" width="105" height="190" rx="8"/>
            <text x="20" y="42" class="t-sm t-b">Anterior</text>
            <text x="20" y="70" class="t-sm">Thyroid</text>
            <text x="20" y="90" class="t-sm">Thymic</text>
            <text x="20" y="110" class="t-sm">Teratoma</text>
            <text x="20" y="130" class="t-sm">"Terrible"</text>
            <text x="20" y="146" class="t-sm">lymphoma</text>
            <rect class="fg-box" x="125" y="20" width="105" height="190" rx="8"/>
            <text x="135" y="42" class="t-sm t-b">Middle</text>
            <text x="135" y="70" class="t-sm">Metastases</text>
            <text x="135" y="90" class="t-sm">Hiatal hernia</text>
            <text x="135" y="110" class="t-sm">Bronchogenic</text>
            <text x="135" y="126" class="t-sm">cysts</text>
            <rect class="fg-box" x="240" y="20" width="110" height="190" rx="8"/>
            <text x="250" y="42" class="t-sm t-b">Posterior</text>
            <text x="250" y="70" class="t-sm">Esophageal</text>
            <text x="250" y="86" class="t-sm">cancer</text>
            <text x="250" y="106" class="t-sm">Neurogenic</text>
            <text x="250" y="122" class="t-sm">tumor</text>
            <text x="250" y="142" class="t-sm">Myeloma</text>
          </svg>
        alt: "Three mediastinal compartments: anterior with the 4 T's (thyroid, thymic neoplasm, teratoma, terrible lymphoma), middle with metastases, hiatal hernia and bronchogenic cysts, posterior with esophageal cancer, neurogenic tumor and multiple myeloma."
        caption: "قدام: 4 T's. النص: metastases و hiatal hernia و bronchogenic cyst. ورا: esophagus و أعصاب و myeloma."
        page: 691
        quote: "Anterior—4 T’s: thyroid (substernal goiter), thymic neoplasm, teratoma, “terrible” lymphoma."
      - kind: sort
        prompt: "Mediastinitis ولا pneumomediastinum؟"
        bins: ["Mediastinitis", "Pneumomediastinum"]
        cards:
          - { text: "Sternal wound drainage after surgery", bin: 0 }
          - { text: "Histoplasma (fibrosing)", bin: 0 }
          - { text: "Ruptured bleb", bin: 1 }
          - { text: "Hamman sign", bin: 1 }
          - { text: "Subcutaneous emphysema", bin: 1 }
        why: "الـ mediastinitis التهاب (بعد عمليات القلب، perforation، أو عدوى الأسنان)، والمزمن fibrosing من الـ Histoplasma. الـ pneumomediastinum هوا: bleb أو Boerhaave، و crepitus مع ضربات القلب."
        page: 691
        quote: "Clinical features: chest pain, dyspnea, voice change, subcutaneous emphysema, ⊕ Hamman sign (crepitus on cardiac auscultation)."
      - kind: check
        question: "A man with a femur fracture develops confusion, hypoxemia and petechiae. Which embolus?"
        options:
          - "Fat"
          - "Air"
          - "Amniotic fluid"
          - "Thrombus"
        answer: 0
        why:
          - "صح: الـ triad بتاع الـ fat embolism بعد كسر عظمة طويلة."
          - "الـ air من الغطس أو الـ central line."
          - "الـ amniotic fluid في الولادة."
          - "الـ thrombus مش بيعمل petechiae ولخبطة."
        page: 691
        quote: "Fat emboli—associated with long bone fractures and liposuction; classic triad of hypoxemia, neurologic abnormalities, petechial rash."
      - kind: try
        items: [resp.L04.007, resp.L04.012, resp.L04.020, resp.L04.026, resp.L04.008]
    recap:
      - "Maxillary بيصرّف ضد الجاذبية؛ فيروس الأول، وبعدين H influenzae و S pneumoniae و M catarrhalis."
      - "Anterior epistaxis: Kiesselbach (LEGS). Posterior الخطير: sphenopalatine."
      - "Head and neck: SCC؛ HPV-16 oropharynx، EBV nasopharynx؛ papillomatosis HPV-6/11."
      - "PE: ↑ V/Q، CTPA، saddle ← obstructive shock. FAT BAT."
      - "Anterior mediastinum = 4 T's. Pneumomediastinum = Hamman sign."
    practice: [resp.L04.001, resp.L04.002, resp.L04.003, resp.L04.004, resp.L04.005, resp.L04.006, resp.L04.007, resp.L04.008, resp.L04.009, resp.L04.010, resp.L04.011, resp.L04.012, resp.L04.013, resp.L04.014, resp.L04.015, resp.L04.016, resp.L04.017, resp.L04.018, resp.L04.019, resp.L04.020, resp.L04.021, resp.L04.022, resp.L04.023, resp.L04.024, resp.L04.025, resp.L04.026, resp.L04.119, resp.L04.120, resp.L04.121, resp.L04.122, resp.L04.123]
  - id: resp.L04.lesson2
    title: "الـ obstructive diseases: الهوا داخل بس مش عارف يخرج"
    hook: "FEV1/FVC واطي، الـ loop رايح شمال، والهوا محبوس جوه"
    minutes: 9
    pages: [692, 693]
    topics: [flow-volume-loops, obstructive-lung-diseases, chronic-obstructive-pulmonary-disease, asthma, bronchiectasis]
    goals:
      - "تقرا الـ PFTs وتفرّق obstructive من restrictive"
      - "تفرّق chronic bronchitis من emphysema (centriacinar و panacinar)"
      - "تعرف علامات الـ asthma والـ bronchiectasis"
    status: unverified
    steps:
      - kind: table
        title: "Obstructive قصاد restrictive"
        columns: ["Parameter", "Obstructive", "Restrictive"]
        rows:
          - ["RV, FRC, TLC", "↑", "↓"]
          - ["FEV1", "↓↓", "↓"]
          - ["FVC", "—/↓", "↓"]
          - ["FEV1/FVC", "↓", "—/↑"]
          - ["Loop", "Shifts left", "Shifts right"]
        hide: [[0, 1], [0, 2], [3, 1], [3, 2]]
        page: 692
        quote: "FEV1 decreased more than FVC"
      - kind: explain
        title: "ليه الهوا بيتحبس؟"
        text: |-
          في الـ obstructive، المجاري ==بتقفل بدري وهي لسه الرئة مليانة== (premature airway closure at high lung volumes)، فالهوا يتحبس: ↑ RV و FRC و TLC. والـ FEV1 يقع أكتر من الـ FVC، فالـ ratio يقل.

          بيشمل: COPD (chronic bronchitis و emphysema)، ==asthma==، و ==bronchiectasis==.
        page: 692
        quote: "due to premature airway closure at high lung volumes. Includes COPD (chronic bronchitis and emphysema), asthma, and bronchiectasis."
      - kind: check
        question: "FEV1 55%, FVC 60%, FEV1/FVC 85%, low TLC. Which pattern?"
        options:
          - "Restrictive"
          - "Obstructive"
          - "Normal"
          - "Mixed with air trapping"
        answer: 0
        why:
          - "صح: الاتنين نازلين بنفس النسبة، والـ ratio طبيعي أو عالي، والـ TLC واطي."
          - "الـ obstructive الـ ratio يقل والـ TLC يعلى."
          - "الأرقام دي مش طبيعية."
          - "الـ TLC واطي، يعني مفيش air trapping."
        page: 692
        quote: "FEV1 decreased proportionately to FVC"
      - kind: explain
        title: "COPD: chronic bronchitis"
        text: |-
          أهم risk factor ==التدخين==. والـ exacerbation غالباً مع URI.

          **Chronic bronchitis** تشخيص إكلينيكي: ==كحة ببلغم ≥ 3 شهور في ≥ 2 سنين ورا بعض==. الغدد بتاعة الـ mucus بتكبر وتزيد، والـ ==Reid index > 50%==. ممكن cyanosis (shunting) و 2° polycythemia، والـ epithelium بيتحول squamous metaplasia.
        page: 692
        quote: "Criteria: productive cough for ≥3 months in ≥2 consecutive years."
      - kind: explain
        title: "Emphysema"
        text: |-
          الجدران بتتكسر ← ↑ compliance، ↓ recoil، ↓ DLCO، و ↑ air space. على الـ CXR: barrel chest، ↑ AP diameter، diaphragm مفرود، ورئة شفافة.

          - **Centriacinar**: بيسيب الـ alveoli البعيدة، في الـ ==upper lobes==، مع التدخين.
          - **Panacinar**: كله، في الـ ==lower lobes==، مع ==α1-antitrypsin deficiency== (الـ elastase بيشتغل من غير ما حد يوقفه).
        page: 692
        quote: "Centriacinar—spares distal alveoli, frequently in upper lobes. Associated with tobacco smoking"
      - kind: figure
        title: "Centriacinar ولا panacinar"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <path class="fg-box" d="M70,20 C30,40 20,130 30,210 L140,210 C150,130 130,40 70,20 Z"/>
            <path class="fg-box" d="M290,20 C330,40 340,130 330,210 L220,210 C210,130 230,40 290,20 Z"/>
            <ellipse class="fg-bad" cx="80" cy="70" rx="40" ry="30"/>
            <text x="56" y="74" class="t-sm t-b">upper</text>
            <ellipse class="fg-bad" cx="280" cy="170" rx="44" ry="30"/>
            <text x="256" y="174" class="t-sm t-b">lower</text>
            <text x="20" y="226" class="t-sm">Centriacinar: smoking</text>
            <text x="200" y="226" class="t-sm">Panacinar: α1-antitrypsin</text>
          </svg>
        alt: "Two lungs: centriacinar emphysema shaded in the upper lobe and labeled smoking, panacinar emphysema shaded in the lower lobe and labeled alpha-1 antitrypsin deficiency."
        caption: "التدخين فوق، والـ α1-antitrypsin تحت."
        page: 692
        quote: "Panacinar—affects respiratory bronchioles and alveoli, frequently in lower lobes. Associated with α -antitrypsin deficiency"
      - kind: explain
        title: "Asthma"
        text: |-
          متقطع، بيجي مع allergens أو URI أو تمرين أو stress، ومع الـ atopy. ==Type I hypersensitivity== ← smooth muscle hypertrophy ← bronchoconstriction reversible، و mucus plugs.

          - الـ spirometry: obstructive مع bronchodilator response (وممكن طبيعي بين النوبات) ± methacholine challenge.
          - في البلغم: ==Curschmann spirals== (epithelium ملفوف)، و ==Charcot-Leyden crystals== (من الـ eosinophils).
          - **Samter's triad**: asthma + nasal polyps + حساسية من الـ aspirin/NSAIDs (leukotrienes كتير).
        page: 693
        quote: "May present with Curschmann spirals F (shed epithelium forms whorled mucus plugs) and/or Charcot-Leyden crystals G"
      - kind: check
        question: "Wheezing after ibuprofen in a woman with nasal polyps. Mechanism?"
        options:
          - "Leukotriene overproduction"
          - "IgE against ibuprofen"
          - "Unopposed elastase"
          - "Bradykinin excess"
        answer: 0
        why:
          - "صح: الـ COX اتقفل فالـ arachidonic acid يروح للـ leukotrienes ← bronchoconstriction."
          - "مش IgE."
          - "الـ elastase في الـ emphysema."
          - "الـ bradykinin مع الـ ACE inhibitors."
        page: 693
        quote: "NSAID- or aspirin-exacerbated respiratory disease—asthma, nasal polyps, and COX-inhibitor sensitivity"
      - kind: explain
        title: "Bronchiectasis"
        text: |-
          مجاري ==متوسعة على طول==: كحة مزمنة وبلغم صديدي كل يوم و infections متكررة. التأكيد بالأشعة (airway dilation و bronchial thickening)، والـ PFT obstructive.

          أشهر ارتباط: ==cystic fibrosis==. وكمان: obstruction (foreign body، mass)، ciliary motility ضعيفة (smoking، ==Kartagener==)، ABPA، و Mycobacterium avium.
        page: 693
        quote: "Characterized by chronic cough and daily purulent sputum production. Often have recurrent pulmonary infections."
      - kind: try
        items: [resp.L04.029, resp.L04.039, resp.L04.044, resp.L04.047, resp.L04.028]
    recap:
      - "Obstructive: FEV1/FVC ↓، RV و TLC ↑، loop شمال. Restrictive: الكل ↓، الـ ratio طبيعي أو ↑، loop يمين."
      - "Chronic bronchitis: كحة 3 شهور × سنتين، Reid > 50%."
      - "Emphysema: ↑ compliance، ↓ DLCO؛ centriacinar فوق (تدخين)، panacinar تحت (α1-antitrypsin)."
      - "Asthma: type I، reversible، Curschmann و Charcot-Leyden، Samter's triad."
      - "Bronchiectasis: CF، Kartagener، ABPA؛ بلغم صديدي كل يوم."
    practice: [resp.L04.027, resp.L04.028, resp.L04.029, resp.L04.030, resp.L04.031, resp.L04.032, resp.L04.033, resp.L04.034, resp.L04.035, resp.L04.036, resp.L04.037, resp.L04.038, resp.L04.039, resp.L04.040, resp.L04.041, resp.L04.042, resp.L04.043, resp.L04.044, resp.L04.045, resp.L04.046, resp.L04.047, resp.L04.124, resp.L04.125, resp.L04.126, resp.L04.139]
  - id: resp.L04.lesson3
    title: "الـ restrictive diseases: رئة ناشفة"
    hook: "رئة مش عايزة تتنفخ، والتراب نفسه بيحدد أنهي lobe هيتعب"
    minutes: 9
    pages: [694, 696]
    topics: [restrictive-lung-diseases, idiopathic-pulmonary-fibrosis, hypersensitivity-pneumonitis, sarcoidosis, mesothelioma, pneumoconioses]
    goals:
      - "تفرّق restriction من برّه الرئة ومن جوّاها بالـ DLCO والـ A-a"
      - "تعرف الـ IPF والـ hypersensitivity pneumonitis والـ sarcoidosis"
      - "تحفظ الـ pneumoconioses: مين فوق ومين تحت"
    status: unverified
    steps:
      - kind: explain
        title: "نوعين restriction"
        text: |-
          ↓ FVC و TLC، والـ FEV1/FVC طبيعي أو ↑. المريض بيتنفس قصير وسطحي، و crackles زي الـ ==velcro==.

          - **من برّه الرئة** (==normal DLCO و normal A-a==): عضلات ضعيفة (polio، myasthenia gravis، Guillain-Barré، ALS) أو chest wall (scoliosis، obesity شديدة).
          - **Interstitial (جوّه)** (==↓ DLCO و ↑ A-a==): pneumoconioses، sarcoidosis، IPF، GPA، Langerhans cell histiocytosis، hypersensitivity pneumonitis، أدوية، ARDS، radiation، connective tissue disease.
        page: 694
        quote: "Altered respiratory mechanics (extrapulmonary, normal DLCO , normal A-a gradient)"
      - kind: aside
        tone: exam
        text: "الأدوية اللي بتعمل ILD: ==bleomycin، busulfan، amiodarone، methotrexate==. والـ radiation: pneumonitis بعد 3–12 أسبوع، و fibrosis بعد 6–12 شهر."
        page: 694
        quote: "Drug toxicity (eg, bleomycin, busulfan, amiodarone, methotrexate)"
      - kind: check
        question: "Restrictive PFTs with normal DLCO. Which cause?"
        options:
          - "Guillain-Barré syndrome"
          - "Idiopathic pulmonary fibrosis"
          - "Sarcoidosis"
          - "Asbestosis"
        answer: 0
        why:
          - "صح: الـ GBS عضلات ضعيفة، الرئة نفسها سليمة فالـ DLCO طبيعي."
          - "الـ IPF جوّه الرئة، الـ DLCO يقل."
          - "الـ sarcoidosis interstitial."
          - "الـ asbestosis fibrosis جوّه الرئة."
        page: 694
        quote: "Respiratory muscle weakness—polio, myasthenia gravis, Guillain-Barré syndrome, ALS"
      - kind: explain
        title: "IPF و hypersensitivity pneumonitis"
        text: |-
          **IPF**: fibrosis بيزيد من غير سبب معروف (مع التدخين والتلوث والجينات). Dyspnea و dry cough و crackles و ==clubbing==. الأشعة: reticular opacities طرفية و ==honeycomb==. الـ histology: usual interstitial pneumonia. العلاج antifibrotics (==nintedanib، pirfenidone==) بتبطّأه بس.

          **Hypersensitivity pneumonitis**: type III/IV لحاجة بتتشم: farmer's lung، bird fancier's lung، hot-tub lung. المزمن: fibrosis مع noncaseating granulomas. العلاج: ابعد عن السبب، و steroids لو شديد.
        page: 694
        quote: "Imaging shows peripheral reticular opacities with traction bronchiectasis +/– “honeycomb” appearance of lung (advanced disease). Histologic pattern: usual interstitial pneumonia."
      - kind: mnemonic
        word: "SARCOIDS"
        parts:
          - { key: "S", text: "Schaumann bodies (in noncaseating epithelioid granulomas)" }
          - { key: "A", text: "Asteroid bodies" }
          - { key: "R", text: "Rheumatoid arthritis–like arthropathy" }
          - { key: "C", text: "↑ Calcium" }
          - { key: "O", text: "Ocular uveitis" }
          - { key: "I", text: "Interstitial fibrosis" }
          - { key: "D", text: "vitamin D activation (1α-hydroxylase in macrophages)" }
          - { key: "S", text: "Skin changes (lupus pernio, erythema nodosum)" }
        hook: "وكمان Bell palsy و parotid enlargement. Sarcoidosis: noncaseating granulomas، ↑ ACE، ↑ CD4/CD8 في الـ BAL، bilateral hilar adenopathy، أكتر في الستات السمر. العلاج glucocorticoids لو فيه أعراض."
        page: 695
        quote: "Ocular uveitis, Interstitial fibrosis, vitamin D activation (due to 1α-hydroxylase in macrophages), Skin changes (eg, lupus pernio, erythema nodosum) (SARCOIDS)."
      - kind: explain
        title: "Mesothelioma"
        text: |-
          ورم خبيث في الـ ==pleura== مع الـ asbestos. Hemorrhagic exudative effusion و pleural thickening. Psammoma bodies، والـ EM: microvilli و desmosomes و tonofilaments.

          ==Calretinin و cytokeratin 5/6 ⊕==. والـ ==تدخين مش risk factor==.
        page: 695
        quote: "Calretinin and cytokeratin 5/6 ⊕ in almost all mesotheliomas, ⊝ in most carcinomas. Tobacco smoking is not a risk factor."
      - kind: figure
        title: "التراب من فين، وبيتعب فين"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <path class="fg-box" d="M180,20 C120,40 100,130 110,210 L250,210 C260,130 240,40 180,20 Z"/>
