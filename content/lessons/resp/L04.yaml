        text: |-
          صديد في الـ parenchyma، من ==aspiration== (alcohol، epilepsy) أو انسداد (cancer). Air-fluid level على الـ CXR. البكتيريا: ==anaerobes== (Bacteroides، Fusobacterium، Peptostreptococcus) أو S aureus. العلاج: antibiotics، drainage، أو جراحة.

          المكان: الرئة اليمين. ==RLL لو واقف==، و RUL أو RML لو نايم.
        page: 702
