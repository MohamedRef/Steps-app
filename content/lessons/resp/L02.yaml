schema: steps.lesson/v1
lecture: resp.L02
lessons:
  - id: resp.L02.lesson1
    title: "شجرة الهوا، والرئتين، والحجاب الحاجز"
    hook: "الهوا بيمشي في أنابيب بتتغيّر بطانتها خطوة خطوة، والفول السوداني دايماً بيروح يمين"
    minutes: 8
    pages: [680, 681]
    topics: [respiratory-tree, lung-anatomy, diaphragm-structures]
    goals:
      - "تفرّق بين الـ conducting zone والـ respiratory zone"
      - "تعرف كل حاجة في الـ airway بتخلص فين: cartilage، goblet، cilia، smooth muscle"
      - "تحدد مكان الـ aspiration حسب الوضع، والـ thoracentesis الصح، ومستويات الحجاب الحاجز"
    status: unverified
    steps:
      - kind: explain
        title: "منطقتين: توصيل وتبادل"
        text: |-
          - **Conducting zone**: من الأنف لحد الـ ==terminal bronchioles==. بتدفّي الهوا وترطّبه وتفلتره، بس ما فيهاش gas exchange، فهي الـ ==anatomic dead space==.
          - **Respiratory zone**: الـ respiratory bronchioles والـ alveolar ducts والـ alveoli. هنا الـ gas exchange.

          والـ resistance؟ أعلاها في الـ ==large- to medium-sized bronchi==، وأقلها في الـ terminal bronchioles لأنها كتير جداً وماشية parallel.
        page: 680
        quote: "Warms, humidifies, and filters air but does not participate in gas exchange → “anatomic dead space.”"
      - kind: figure
        title: "كل حاجة بتخلص فين"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="pL2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="10" y="20" class="t-sm t-b">Bronchi</text>
            <text x="100" y="20" class="t-sm t-b">Term. br.</text>
            <text x="195" y="20" class="t-sm t-b">Resp. br.</text>
            <text x="290" y="20" class="t-sm t-b">Alveoli</text>
            <line class="fg-arrow" x1="10" y1="50" x2="80" y2="50"/>
            <text x="10" y="44" class="t-sm">cartilage, goblet</text>
            <line class="fg-arrow" x1="10" y1="90" x2="110" y2="90"/>
            <text x="10" y="84" class="t-sm">pseudostratified ciliated</text>
            <line class="fg-arrow" x1="10" y1="130" x2="170" y2="130"/>
            <text x="10" y="124" class="t-sm">smooth muscle</text>
            <line class="fg-arrow" x1="10" y1="170" x2="250" y2="170"/>
            <text x="10" y="164" class="t-sm">cilia</text>
            <rect class="fg-acc" x="185" y="190" width="165" height="30" rx="6"/>
            <text x="195" y="210" class="t-sm t-b">Respiratory zone</text>
            <rect class="fg-box" x="10" y="190" width="165" height="30" rx="6"/>
            <text x="20" y="210" class="t-sm">Conducting zone</text>
          </svg>
        alt: "Bars showing how far each airway feature extends: cartilage and goblet cells to the end of the bronchi, pseudostratified ciliated epithelium to the start of the terminal bronchioles, smooth muscle to the end of the terminal bronchioles, and cilia into the respiratory bronchioles."
        caption: "الـ cartilage والـ goblet بيخلصوا الأول، وبعدين الـ pseudostratified، وبعدين الـ smooth muscle، والـ cilia آخر واحد."
        page: 680
        quote: "Cartilage and goblet cells extend to the end of bronchi."
      - kind: explain
        title: "البطانة بتتغيّر"
        text: |-
          - الـ **pseudostratified ciliated columnar** في الـ bronchi لحد أول الـ terminal bronchioles، وبعدين cuboidal. دي الـ ==mucociliary escalator== اللي بتطلّع الـ mucus والوساخة.
          - الـ smooth muscle لحد آخر الـ terminal bronchioles (بعدها قليل).
          - في الـ respiratory zone: cuboidal في الـ respiratory bronchioles، وبعدين ==simple squamous== لحد الـ alveoli. والـ ==cilia بتخلص في الـ respiratory bronchioles==.
        page: 680
        quote: "Mostly cuboidal cells in respiratory bronchioles, then simple squamous cells up to alveoli. Cilia terminate in respiratory bronchioles."
      - kind: check
        question: "Which is the last airway generation that has goblet cells and cartilage?"
        options:
          - "Bronchi"
          - "Terminal bronchioles"
          - "Respiratory bronchioles"
          - "Alveolar ducts"
        answer: 0
        why:
          - "صح: الـ cartilage والـ goblet cells بيخلصوا مع آخر الـ bronchi."
          - "الـ terminal bronchioles فيها smooth muscle لحد آخرها، بس مفيهاش cartilage."
          - "الـ respiratory bronchioles آخر مكان فيه cilia."
          - "الـ alveolar ducts مفيهاش أي حاجة من دول."
        page: 680
        quote: "Cartilage and goblet cells extend to the end of bronchi."
      - kind: explain
        title: "الرئتين"
        text: |-
          - اليمين ==3 lobes==، والشمال 2 lobes + ==lingula== (المقابل للـ right middle lobe)، ومكان الـ middle lobe الشمال فيه القلب.
          - الـ pulmonary artery قصاد الـ bronchus في الـ hilum: **RALS** = ==Right Anterior، Left Superior==.
          - الـ carina ورا الـ ascending aorta و anteromedial للـ descending aorta.
        page: 681
        quote: "Relation of the pulmonary artery to the bronchus at each lung hilum is described by RALS—Right Anterior; Left Superior."
      - kind: explain
        title: "الفول السوداني بيروح فين؟"
        text: |-
          الـ right main bronchus ==أعرض وأكتر vertical وأقصر==، فأي حاجة بتتشفط بتروح يمين غالباً. والوضع بيحدد الـ segment:
          - **نايم على ضهره (supine)**: الـ ==superior segment of RLL==، أو أحياناً الـ posterior segment of RUL.
          - **نايم على جنبه اليمين أو على بطنه**: الـ RUL.
          - **واقف أو قاعد**: الـ RLL.
        page: 681
        quote: "Right lung is a more common site for inhaled foreign bodies because right main stem bronchus is wider, more vertical, and shorter than the left."
      - kind: sort
        prompt: "حط كل وضع تحت الـ lobe اللي الحاجة المشفوطة بتروحله غالباً"
        bins: ["Right lower lobe", "Right upper lobe"]
        cards:
          - { text: "Upright", bin: 0 }
          - { text: "Supine (superior segment)", bin: 0 }
          - { text: "Lying on right side", bin: 1 }
          - { text: "Prone", bin: 1 }
        why: "الـ supine بيروح الـ superior segment of RLL (وأحياناً الـ RUL)، والـ upright بيروح الـ RLL، والجنب اليمين أو البطن بيروح الـ RUL."
        page: 681
        quote: "While lying on right side or prone—usually enters RUL. ▘ While upright—usually enters RLL."
      - kind: aside
        tone: tip
        text: "الـ **thoracentesis**: الإبرة ==فوق الضلع== عشان الـ neurovascular bundle تحت كل ضلع، وما تنزلش ==تحت الضلع التاسع== عشان ما تخبطش الكبد (يمين) أو الطحال (شمال)."
        page: 681
        quote: "Needle above the rib → avoid neurovascular bundle below each rib. Avoid below 9th rib → risk of injuring abdominal structures (eg, right hepatic lobe, spleen)."
      - kind: check
        question: "Where should the needle go during thoracentesis?"
        options:
          - "Just above a rib, not below the 9th rib"
          - "Just below a rib, to follow the bundle"
          - "Below the 10th rib, for gravity"
          - "Through the visceral pleura into the lung"
        answer: 0
        why:
          - "صح: فوق الضلع (الـ bundle تحت الضلع)، وفوق الضلع التاسع."
          - "تحت الضلع هو مكان الـ neurovascular bundle."
          - "تحت الضلع التاسع خطر على الكبد والطحال."
          - "الـ thoracentesis بيشيل سايل من الـ pleural space، مش من الرئة."
        page: 681
        quote: "Thoracentesis—removal of fluid or air from pleural space between visceral and parietal pleura."
      - kind: table
        title: "Structures perforating the diaphragm"
        columns: ["Level", "Structures", "Mnemonic"]
        rows:
          - ["T8", "IVC, right phrenic nerve", "I ate (8)"]
          - ["T10", "Esophagus, vagus (2 trunks)", "ten eggs"]
          - ["T12", "Aorta, thoracic duct, azygos vein", "at twelve; red, white, and blue"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 681
        quote: "At T8: IVC, right phrenic nerve ▘ At T10: esophagus, vagus (CN 10; 2 trunks) ▘ At T12: aorta (red), thoracic duct (white), azygos vein (blue)"
      - kind: aside
        tone: exam
        text: "«I ate (8) ten eggs at twelve.» و «==C3، 4، 5 keeps the diaphragm alive==». الألم من الحجاب بيروح للـ ==shoulder (C5)== والـ trapezius ridge (C3، 4). والـ phrenic injury بترفع الـ hemidiaphragm نفس الناحية على الأشعة."
        page: 681
        quote: "Pain from diaphragm irritation can be referred to shoulder (C5) and trapezius ridge (C3, 4). Phrenic nerve injury causes elevation of the ipsilateral hemidiaphragm on x-ray."
      - kind: check
        question: "A chest x-ray after neck surgery shows a raised right hemidiaphragm. Which nerve was injured?"
        options:
          - "Right phrenic nerve"
          - "Left phrenic nerve"
          - "Right vagus nerve"
          - "Right recurrent laryngeal nerve"
        answer: 0
        why:
          - "صح: الـ phrenic injury بترفع الـ hemidiaphragm في نفس الناحية."
          - "الشمال كان هيرفع الناحية الشمال."
          - "الـ vagus بيعدّي مع الـ esophagus عند T10، ومش بيحرّك الحجاب."
          - "الـ recurrent laryngeal مالوش علاقة بالحجاب."
        page: 681
        quote: "Phrenic nerve injury causes elevation of the ipsilateral hemidiaphragm on x-ray."
      - kind: aside
        tone: tip
        text: "تفرّعات تانية بنفس الرقم 4: الـ common carotid عند ==C4==، والـ trachea عند ==T4==، والـ abdominal aorta عند ==L4==."
        page: 681
        quote: "The Common Carotid bifourcates at C4. ▘ The Trachea bifourcates at T4. ▘ The abdominal aorta bifourcates at L4."
      - kind: try
        items: [resp.L02.001, resp.L02.012, resp.L02.015, resp.L02.017, resp.L02.002]
    recap:
      - "Conducting zone = dead space لحد الـ terminal bronchioles؛ respiratory zone = gas exchange."
      - "أعلى resistance في الـ large/medium bronchi."
      - "Cartilage و goblet لآخر الـ bronchi؛ smooth muscle لآخر الـ terminal bronchioles؛ cilia لحد الـ respiratory bronchioles."
      - "RALS. الـ right bronchus أعرض وأقصر وأكتر vertical. Supine ← superior RLL؛ upright ← RLL؛ جنب يمين أو prone ← RUL."
      - "Thoracentesis فوق الضلع وفوق التاسع. T8 IVC، T10 esophagus + vagus، T12 aorta + thoracic duct + azygos. C3-5."
