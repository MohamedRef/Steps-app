    recap:
      - "Efficacy = ارتفاع المنحنى (Emax). Potency = مكانه على x (EC50). مالهمش علاقة ببعض."
      - "Competitive antagonist: potency ↓، يتغلب (flumazenil). Noncompetitive: efficacy ↓، ما يتغلبش (phenoxybenzamine)."
      - "Partial agonist: نفس المكان، efficacy أقل (buprenorphine). Inverse agonist: efficacy سالب (H1 antihistamines)."
