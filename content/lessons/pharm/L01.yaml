          - "الجرعة بتغيّر مستوى الـ steady state، مش الوقت ليه."
          - "عدد المرات ما بيغيّرش الوقت للـ steady state."
          - "برضه تغيير جرعة، والوقت ثابت."
        page: 231
        quote: "Time to steady state depends primarily on t1/2 and is independent of dose and dosing frequency."
      - kind: try
        items: [pharm.L01.029, pharm.L01.031, pharm.L01.034, pharm.L01.038, pharm.L01.039]
    recap:
