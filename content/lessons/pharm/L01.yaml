          - "Drug X is more potent than drug Y"
        answer: 0
        why:
          - "صح: 400/20 = 20 و 60/20 = 3. الـ TI الأعلى أأمن، والواطي محتاج monitoring."
          - "التسمم بجرعة أقل معناه أخطر، مش أأمن."
          - "الـ TI = TD50/ED50، والـ TD50 مختلف."
          - "نفس الـ ED50 يعني نفس الـ potency تقريباً."
        page: 233
        quote: "TITE: Therapeutic Index = TD50 / ED50. Safer drugs have ↑ TI"
      - kind: try
