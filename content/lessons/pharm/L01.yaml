  - id: pharm.L01.lesson4
    title: "Potency ولا efficacy؟ والـ antagonists بيعملوا إيه في المنحنى"
    hook: "منحنى واحد بيتحرك يمين أو بيقصر لتحت، وده كل اللي محتاجه في الـ pharmacodynamics"
    minutes: 8
    pages: [232, 233]
    topics: [efficacy-vs-potency, receptor-binding, therapeutic-index]
    goals:
      - "تفرّق بين potency (محور x) و efficacy (محور y)"
      - "تعرف أثر competitive و noncompetitive antagonist و partial و inverse agonist"
      - "تعرف الـ therapeutic index والأدوية اللي محتاجة monitoring"
    status: unverified
    steps:
      - kind: explain
        title: "محور y = efficacy، محور x = potency"
        text: |-
          - **Efficacy**: ==أقصى أثر== الدوا يقدر يعمله (Emax)، وبتقراه من **ارتفاع** المنحنى. الـ partial agonists عندهم efficacy أقل من الـ full agonists.
          - **Potency**: ==كمية الدوا== اللي محتاجها لأثر معيّن (EC50)، وبتقراه من **مكان** المنحنى على محور x. المنحنى يروح شمال ← EC50 أقل ← potency أعلى.

          والاتنين ==مالهمش علاقة ببعض==: دوا potent ممكن يكون efficacy بتاعه واطي، والعكس.
        page: 232
        quote: "Amount of drug needed for a given effect. Represented by the x-value (EC50). Left shifting = ↓ EC50 = ↑ potency = ↓ drug needed."
      - kind: aside
        tone: analogy
        text: "الـ **potency** زي عربية بتوصل 100 بسرعة بدواسة بنزين خفيفة. الـ **efficacy** زي أقصى سرعة العربية. عربية صغيرة ممكن تتحرك بلمسة (potent) بس أقصاها 120، وعربية كبيرة محتاجة دوسة جامدة بس توصل 250 (efficacious)."
        page: 232
        quote: "Maximal effect a drug can produce (intrinsic activity). Represented by the y-value (Emax). ↑ y-value = ↑ Emax = ↑ efficacy. Unrelated to potency"
      - kind: figure
        title: "إيه اللي بيحصل للمنحنى"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="30" y1="170" x2="350" y2="170"/>
            <line class="fg-ink" x1="30" y1="15" x2="30" y2="170"/>
            <text x="250" y="190" class="t-sm t-mut">log (agonist dose)</text>
            <text x="34" y="14" class="t-sm t-mut">% effect</text>
            <path class="fg-arrow" d="M40 165 C 90 165, 100 40, 150 35 L 340 35" fill="none" stroke-width="3"/>
            <text x="150" y="28" class="t-sm">Agonist</text>
            <path class="fg-arrow-acc" d="M100 165 C 150 165, 160 40, 210 35 L 340 35" fill="none" stroke-width="3"/>
            <text x="220" y="55" class="t-sm t-acc">+ competitive (right shift)</text>
            <path class="fg-arrow-bad" d="M40 165 C 90 165, 100 100, 150 95 L 340 95" fill="none" stroke-width="3"/>
            <text x="200" y="115" class="t-sm t-bad">+ noncompetitive (lower max)</text>
          </svg>
        caption: "الـ competitive antagonist بيزق المنحنى يمين (potency ↓) بس بتوصل لنفس القمة لو زودت الـ agonist. الـ noncompetitive بيقصّر القمة (efficacy ↓) ومهما زودت مش هتوصل."
        alt: "Dose-response curves: the agonist alone, the agonist with a competitive antagonist shifted to the right with the same maximum, and the agonist with a noncompetitive antagonist reaching a lower maximum."
        page: 233
        quote: "Competitive antagonist ↓ No change Can be overcome by ↑ agonist concentration"
      - kind: match
        prompt: "وصّل كل نوع بالمثال بتاع الكتاب"
        pairs:
          - ["Competitive antagonist", "Flumazenil with diazepam at GABA-A"]
          - ["Noncompetitive antagonist", "Phenoxybenzamine with norepinephrine at α-receptors"]
          - ["Partial agonist", "Buprenorphine vs morphine at μ-opioid receptors"]
          - ["Inverse agonist", "Diphenhydramine (H1 antihistamine)"]
        why: "الـ flumazenil بيقعد مكان الـ diazepam ويتغلب لو زودت الـ agonist. الـ phenoxybenzamine ما بيتغلبش. الـ buprenorphine بيقعد في نفس مكان الـ morphine بس أثره أقل. الـ diphenhydramine بيقلل نشاط receptor شغال لوحده."
        page: 233
        quote: "Morphine (full agonist) vs buprenorphine (partial agonist) at opioid μ-receptors."
      - kind: reveal
        prompt: "يعني إيه inverse agonist؟ وإيه الفرق بينه وبين الـ antagonist؟"
        answer: "الـ inverse agonist بيرتبط بـ receptor ==constitutively active== (شغال لوحده من غير agonist) و**بيقلل** نشاطه، فأثره عكس الـ agonist (efficacy سالب). الـ antagonist لوحده ما بيعملش حاجة، بيمنع الـ agonist بس."
        page: 233
        quote: "Binds to a constitutively active receptor, thereby reducing its activity; has the opposite effect of an agonist"
      - kind: check
        question: "A man on high-dose morphine is given buprenorphine and his pain worsens. Why?"
        options:
          - "Buprenorphine is a partial agonist at the same μ site, with lower efficacy than morphine"
          - "Buprenorphine is a noncompetitive antagonist"
          - "Buprenorphine is an inverse agonist"
          - "Buprenorphine has higher efficacy than morphine"
        answer: 0
        why:
          - "صح: partial agonist بيقعد في نفس مكان الـ full agonist وأثره الأقصى أقل، فبيزيح الـ morphine ويقلل الأثر الكلي."
          - "الكتاب مثاله للـ noncompetitive هو phenoxybenzamine."
          - "مثال الـ inverse agonist هو الـ H1 antihistamines."
          - "بالعكس: الـ partial agonist efficacy بتاعه أقل."
        page: 233
        quote: "Acts at same site as full agonist Morphine (full agonist) vs buprenorphine (partial agonist) at opioid μ-receptors."
      - kind: explain
        title: "Therapeutic index: الدوا آمن قد إيه"
        text: |-
          الـ **TI = TD50 / ED50**. يعني الجرعة اللي بتسمم نص الناس ÷ الجرعة اللي بتعالج نصهم. ==TI أعلى = دوا أأمن==. وفي الحيوانات بيستخدموا LD50 بدل TD50.

          والـ **therapeutic window** هو مدى التركيزات اللي بتعالج من غير ما تسمم.

          الأدوية اللي ==TI بتاعها واطي== لازم تتعمل لها monitoring كتير.
        page: 233
        quote: "TITE: Therapeutic Index = TD50 / ED50. Safer drugs have ↑ TI; drugs with ↓ TI require frequent monitoring (eg, warfarin, theophylline, digoxin, antiepileptic drugs, lithium; Warning! These drugs are lethal!)."
      - kind: mnemonic
