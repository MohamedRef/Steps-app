        quote: "Examples of drugs—Phenytoin, Ethanol, and Aspirin (at high or toxic concentrations → ↑ salicylate saturation → zero-order elimination)."
      - kind: check
        question: "A patient on phenytoin has his dose raised by 10%. His level rises by 60% and he becomes ataxic. Why?"
        options:
          - "Phenytoin is eliminated at a constant amount per unit time once enzymes are saturated"
          - "Phenytoin is eliminated at a constant fraction per unit time"
          - "Phenytoin has 100% bioavailability"
          - "Phenytoin is trapped in alkaline urine"
        answer: 0
        why:
          - "صح: zero-order. الإنزيمات saturated، فأي زيادة فوق قدرتها بتتراكم كلها."
          - "ده first-order، واللي فيه التركيز بيزيد بنفس نسبة الجرعة."
          - "الـ bioavailability مش هي اللي بتعمل الزيادة غير المتناسبة."
          - "الـ urine trapping بيخص الـ weak acids زي phenobarbital و aspirin، ومش ده السبب هنا."
        page: 230
        quote: "Examples of drugs—Phenytoin, Ethanol, and Aspirin"
      - kind: explain
        title: "الـ urine pH بيحبس الدوا"
        text: |-
          القاعدة: الشكل ==المشحون (ionized) بيتحبس في البول== ويخرج، والشكل المتعادل بيرجع يتمص.

          - **Weak acids** (phenobarbital و methotrexate و aspirin): بتتشحن في الوسط القلوي، فنعالج الـ overdose بـ ==sodium bicarbonate== عشان نقلّي البول.
          - **Weak bases** (TCAs و amphetamines): بتتحبس في الوسط الحمضي؛ والكتاب بيقول ammonium chloride يحمّض البول (في الـ severe alkalosis).
        page: 231
        quote: "Ionized species are trapped in urine and cleared quickly. Neutral forms can be reabsorbed."
      - kind: aside
        tone: trap
        text: "فخ مشهور: الـ **bicarbonate في TCA toxicity** مش عشان يطلّع الدوا! ده عشان يغلب الـ ==sodium channel blockade== اللي على القلب. بيعالج الـ cardiac toxicity، ومش بيسرّع الـ elimination."
        page: 231
        quote: "TCA toxicity is initially treated with sodium bicarbonate to overcome the sodium channel-blocking activity of TCAs. This treats cardiac toxicity, but does not accelerate drug elimination."
      - kind: reveal
        prompt: "يعني إيه pKa؟"
        answer: "الـ pH اللي عنده الـ weak acid أو base يبقى **50% ionized و 50% nonionized**. وبيعبّر عن قوة الـ acid أو الـ base."
        page: 231
        quote: "pH at which drugs (weak acid or base) are 50% ionized and 50% nonionized. The pKa represents the strength of the weak acid or base."
      - kind: explain
        title: "Loading و maintenance dose"
        text: |-
          - **Loading dose** = Cp × Vd / F. بنملا "الحجم" اللي الدوا بيتوزع فيه مرة واحدة، فبيعتمد على ==Vd==.
          - **Maintenance dose** = Cp × CL × τ / F. بنعوّض اللي بيخرج كل جرعة، فبيعتمد على ==CL==.

          (Cp = التركيز اللي عايزه، τ = الوقت بين الجرعات.)

          في مرض الكلى أو الكبد الـ CL بيقل، فالـ ==maintenance dose ↓== والـ loading dose غالباً زي ما هو.
        page: 231
        quote: "In renal or liver disease, maintenance dose ↓ and loading dose is usually unchanged."
      - kind: aside
        tone: analogy
        text: "زي ما تملا حمام سباحة فيه خرم. الـ **loading** = تملاه أول مرة، وده على قد حجمه (Vd). الـ **maintenance** = تفضل تصب على قد اللي بيخرّ من الخرم (CL). لو الخرم صغر (مرض كلى)، تصب أقل، بس حجم الحمام زي ما هو."
        page: 231
        quote: "In renal or liver disease, maintenance dose ↓ and loading dose is usually unchanged."
      - kind: check
        question: "To reach steady state faster with a first-order drug, which change works?"
        options:
          - "None of these: time to steady state depends on half-life"
          - "Double the maintenance dose"
          - "Give the same daily dose more often"
          - "Give a larger tablet once a day"
        answer: 0
        why:
