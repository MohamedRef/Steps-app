schema: steps.lesson/v1
lecture: pharm.L01
lessons:
  - id: pharm.L01.lesson1
    title: "الـ Km والـ Vmax: ارسم الخط وإنت تفهم الـ inhibitor"
    hook: "سؤال الـ Lineweaver-Burk بيبان صعب، بس هو سؤالين: الخط قطع فين في y وفين في x"
    minutes: 7
    pages: [228, 228]
    topics: [enzyme-kinetics]
    goals:
      - "تعرف الـ Km بيقول إيه عن الـ affinity"
      - "تقرا الـ Lineweaver-Burk plot من غير ما تحفظ"
      - "تفرّق بين competitive و noncompetitive inhibitor وأثر كل واحد على potency و efficacy"
    status: unverified
    steps:
      - kind: explain
        title: "Km و Vmax بالبلدي"
        text: |-
          الـ **Vmax** هو أقصى سرعة الـ enzyme يوصلها لما كل الـ enzyme يبقى مشغول. فطبيعي إنه ==بيتناسب طردي مع كمية الـ enzyme==: إنزيم أكتر = سرعة قصوى أعلى.

          الـ **Km** هو تركيز الـ substrate اللي يخلي السرعة توصل **نص الـ Vmax**. الـ enzyme اللي بيحب الـ substrate بيوصل للنص بتركيز قليل، فالـ ==Km بيتناسب عكسي مع الـ affinity==.
        page: 228
        quote: "Km is the substrate concentration needed for an enzyme to reach a rate of 1/2 Vmax and is inversely related to the affinity of the enzyme for its substrate."
      - kind: aside
        tone: analogy
        text: "تخيّل الـ enzyme كاشير والـ substrate زباين. الـ **Vmax** = أقصى عدد زباين في الساعة، وده يزيد لو جبت كاشيرات أكتر. الـ **Km** = كام زبون لازم يبقوا في المحل عشان الكاشير يشتغل بنص طاقته؛ الكاشير النشيط (affinity عالية) يوصل لنص طاقته بزباين قليلين."
        page: 228
        quote: "Vmax is directly proportional to the enzyme concentration."
      - kind: reveal
        prompt: "معظم الـ enzymes بتدي curve شكله hyperbola. لو لقيت curve شكله S (sigmoidal)، يبقى ده معناه إيه؟"
        answer: "**Positive cooperativity**: ارتباط أول substrate بيسهّل ارتباط اللي بعده، فالسرعة تقوم فجأة. مثال الكتاب: **aspartate transcarbamoylase**."
        page: 228
        quote: "enzymatic reactions that exhibit a sigmoidal curve usually indicate positive cooperativity in substrate binding (eg, aspartate transcarbamoylase)."
      - kind: figure
        title: "الـ Lineweaver-Burk plot"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="180" x2="350" y2="180"/>
            <line class="fg-ink" x1="150" y1="10" x2="150" y2="200"/>
            <text x="320" y="198" class="t-sm">1/[S]</text>
            <text x="156" y="22" class="t-sm">1/V</text>
            <line class="fg-arrow" x1="90" y1="180" x2="340" y2="80"/>
            <text x="300" y="75" class="t-sm">Uninhibited</text>
            <line class="fg-arrow-acc" x1="90" y1="180" x2="340" y2="30"/>
            <text x="250" y="28" class="t-sm t-acc">Noncompetitive</text>
            <line class="fg-arrow-bad" x1="120" y1="180" x2="340" y2="40"/>
            <text x="262" y="110" class="t-sm t-bad">Competitive</text>
            <circle class="fg-dot-acc" cx="150" cy="144" r="4"/>
            <text x="156" y="160" class="t-sm t-mut">1/Vmax</text>
            <circle class="fg-dot-good" cx="90" cy="180" r="4"/>
            <text x="40" y="212" class="t-sm t-mut">−1/Km</text>
          </svg>
        caption: "التقاطع مع محور y = 1/Vmax، ومع محور x = −1/Km. الـ competitive خطه بيقطع الخط الأصلي على محور y (نفس الـ Vmax) وبيقرّب من الصفر على x (Km أعلى). الـ noncompetitive بيطلع لفوق على y (Vmax أقل) وبيقابل نفس النقطة على x."
        alt: "A Lineweaver-Burk plot with 1/[S] on the x-axis and 1/V on the y-axis. The uninhibited line, a competitive-inhibitor line meeting it on the y-axis with an x-intercept closer to zero, and a noncompetitive-inhibitor line with a higher y-intercept sharing the same x-intercept."
        page: 228
        quote: "The closer to 0 on the Y-axis, the higher the Vmax. The closer to 0 on the X-axis, the higher the Km. The higher the Km, the lower the affinity."
      - kind: explain
        title: "اقرا الخط في 3 ثواني"
        text: |-
          - **محور y**: كل ما الخط يقطع ==أقرب للصفر، الـ Vmax أعلى==.
          - **محور x**: كل ما الخط يقطع أقرب للصفر، الـ **Km أعلى** (يعني affinity أقل).
          - الـ reversible **competitive** inhibitors خطوطها بتقطع الخط الأصلي، والـ noncompetitive لأ.

          ومن الكتاب: ==Kompetitive inhibitors increase Km== (الـ K في الأول عشان تفتكر).
        page: 228
        quote: "Reversible competitive inhibitors cross each other, whereas noncompetitive inhibitors do not. Kompetitive inhibitors increase Km."
      - kind: check
        question: "With a new inhibitor, the Lineweaver-Burk line has the same y-intercept but its x-intercept moves closer to zero. What happened?"
        options:
          - "Km rose, Vmax unchanged: a reversible competitive inhibitor"
          - "Vmax fell, Km unchanged: a noncompetitive inhibitor"
          - "Km fell: the enzyme's affinity increased"
          - "Vmax rose because more enzyme was added"
        answer: 0
        why:
          - "صح: نفس الـ y يعني نفس الـ Vmax، والـ x قرّب من الصفر يعني Km أعلى. ده الـ competitive."
          - "الـ noncompetitive بيغيّر الـ y (Vmax أقل) ويسيب الـ x زي ما هو."
          - "الـ x قرّب من الصفر يعني Km زاد مش قلّ، والـ affinity قلّت."
          - "الـ y intercept ما اتحركش، فالـ Vmax زي ما هو."
        page: 228
        quote: "The closer to 0 on the X-axis, the higher the Km."
      - kind: table
        title: "الـ inhibitors التلاتة"
        columns: ["", "Competitive, reversible", "Competitive, irreversible", "Noncompetitive"]
        rows:
          - ["Resembles substrate", "Yes", "Yes", "No"]
          - ["Overcome by ↑ [S]", "Yes", "No", "No"]
          - ["Binding site", "Active", "Active", "Allosteric"]
          - ["Vmax", "Unchanged", "↓", "↓"]
          - ["Km", "↑", "Unchanged", "Unchanged"]
          - ["Pharmacodynamics", "↓ potency", "↓ efficacy", "↓ efficacy"]
        hide: [[1, 1], [3, 2], [4, 1], [5, 1], [5, 3]]
        page: 228
        quote: "Resemble substrate Yes Yes No Overcome by ↑ [S] Yes No No Bind site Active Active Allosteric Effect on Vmax Unchanged ↓ ↓ Effect on Km ↑ Unchanged Unchanged Pharmacodynamics ↓ potency ↓ efficacy ↓ efficacy"
      - kind: reveal
        prompt: "ليه الـ competitive irreversible بيقلل الـ Vmax وهو بيقعد في الـ active site زي الـ reversible؟"
        answer: "لأنه **مش بيسيب** الـ enzyme. كأنك شلت إنزيمات من اللعبة، وزيادة الـ substrate مش هتطرده. فالـ Vmax يقل، والإنزيمات اللي فاضلة شغالة عادي فالـ Km زي ما هو، والأثر الدوائي ↓ efficacy."
        page: 228
        quote: "Effect on Vmax Unchanged ↓ ↓ Effect on Km ↑ Unchanged Unchanged Pharmacodynamics ↓ potency ↓ efficacy ↓ efficacy"
      - kind: aside
        tone: exam
        text: "الربط اللي الامتحان بيحبه: الـ competitive reversible ← ==↓ potency== (محتاج دوا أكتر لنفس الأثر بس توصل لنفس القمة). أي حاجة بتقلل الـ Vmax ← ↓ efficacy."
        page: 228
        quote: "Pharmacodynamics ↓ potency ↓ efficacy ↓ efficacy"
      - kind: try
        items: [pharm.L01.001, pharm.L01.004, pharm.L01.005, pharm.L01.006]
    recap:
      - "Km = [S] عند نص الـ Vmax، وبيتناسب عكسي مع الـ affinity. الـ Vmax بيتناسب مع كمية الـ enzyme."
      - "Sigmoidal curve = positive cooperativity (aspartate transcarbamoylase)."
      - "Competitive reversible: Km ↑، Vmax ثابت، ↓ potency. Noncompetitive: Vmax ↓، Km ثابت، ↓ efficacy."
    practice: [pharm.L01.001, pharm.L01.002, pharm.L01.003, pharm.L01.004, pharm.L01.005, pharm.L01.006, pharm.L01.007]
  - id: pharm.L01.lesson2
    title: "الدوا بيروح فين في الجسم؟ F و Vd و CL و t1/2"
    hook: "4 أرقام بس بيوصفوا رحلة الدوا كلها، وكل سؤال pharmacokinetics بيلعب بيهم"
    minutes: 9
    pages: [229, 230]
    topics: [pharmacokinetics, age-related-pharmacokinetics, drug-metabolism]
    goals:
      - "تفهم الـ bioavailability والـ Vd والـ clearance والـ half-life وعلاقتهم ببعض"
      - "تعرف السن بيغيّر إيه في رحلة الدوا"
      - "تفرّق بين phase I و phase II"
    status: unverified
    steps:
      - kind: explain
        title: "Bioavailability: كام في المية وصل"
        text: |-
          الـ **bioavailability (F)** هي نسبة الدوا اللي وصلت الـ systemic circulation. الحقنة في الوريد ==F = 100%==.

          بالبُق الـ F غالباً أقل من 100% لسببين: الامتصاص مش كامل، و ==first-pass metabolism== (الكبد بياكل حتة من الدوا قبل ما يوصل الدورة الدموية). وبنحسبها من الـ AUC: مساحة تحت منحنى التركيز مع الوقت، بالبق مقسومة على الوريد.
        page: 229
        quote: "Fraction of administered drug reaching systemic circulation. For an IV dose, F = 100%. Orally: F typically <100% due to incomplete absorption and first-pass metabolism."
      - kind: explain
        title: "الـ Vd: الدوا مستخبي فين؟"
        text: |-
          الـ **Vd** رقم نظري: كمية الدوا في الجسم ÷ تركيزه في البلازما. لو الدوا هرب من البلازما للأنسجة، تركيزه في البلازما يقل فالـ ==Vd يطلع كبير==.

          - **Low Vd**: جوه الأوعية. جزيئات كبيرة أو مشحونة أو مربوطة ببروتينات البلازما.
          - **Medium Vd**: الـ ECF. جزيئات صغيرة hydrophilic.
          - **High Vd**: كل الأنسجة حتى الدهون. جزيئات صغيرة lipophilic، خصوصاً لو مربوطة ببروتينات الأنسجة.
        page: 229
        quote: "Low Intravascular Large/charged molecules; plasma protein bound Medium ECF Small hydrophilic molecules High All tissues including fat Small lipophilic molecules, especially if bound to tissue protein"
      - kind: reveal
        prompt: "مريض شرب overdose. إمتى الـ hemodialysis يفيد؟ ولو عنده مرض كبد أو كلى، الـ Vd بيتغيّر إزاي؟"
        answer: "الـ dialysis بينضّف البلازما، فبيفيد ==لما الـ Vd يكون low== (الدوا قاعد في الدم). ومرض الكبد والكلى بيقلل الـ protein binding ← دوا حر أكتر بيخرج للأنسجة ← **Vd ↑**."
        page: 229
        quote: "Liver and kidney disease increase Vd (↓ protein binding, ↑ Vd). Drugs may be distributed in more than one compartment. Hemodialysis is most effective for drugs with a low Vd."
      - kind: explain
        title: "Clearance و half-life"
        text: |-
          الـ **clearance (CL)** = حجم البلازما اللي بيتنضّف من الدوا في وحدة الزمن = Vd × Ke. بيبوظ لو القلب أو الكبد أو الكلى تعبانين.

          الـ **half-life** هو الوقت اللي نص الدوا يخرج فيه، وفي الـ first-order: ==t1/2 = 0.7 × Vd / CL==. يعني Vd أكبر أو CL أقل ← الدوا يقعد أطول.

          وعشان توصل **steady state** (الداخل = الخارج) بتسريب ثابت محتاج ==4-5 half-lives==، و 3.3 half-lives توصل 90% منه.
        page: 229
        quote: "In first-order kinetics, a drug infused at a constant rate takes 4-5 half-lives to reach steady state. It takes 3.3 half-lives to reach 90% of the steady-state level."
      - kind: figure
        title: "كل half-life بيقسم الباقي على 2"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="40" y1="160" x2="340" y2="160"/>
            <line class="fg-ink" x1="40" y1="10" x2="40" y2="160"/>
            <rect class="fg-acc" x="60" y="20" width="40" height="140"/>
            <rect class="fg-acc" x="120" y="90" width="40" height="70"/>
            <rect class="fg-acc" x="180" y="125" width="40" height="35"/>
            <rect class="fg-acc" x="240" y="142" width="40" height="18"/>
            <rect class="fg-acc" x="300" y="151" width="30" height="9"/>
            <text x="64" y="15" class="t-sm">100%</text>
            <text x="126" y="85" class="t-sm">50%</text>
            <text x="186" y="120" class="t-sm">25%</text>
            <text x="238" y="137" class="t-sm">12.5%</text>
            <text x="292" y="146" class="t-sm">6.25%</text>
            <text x="76" y="178" class="t-sm t-mut">0</text>
            <text x="136" y="178" class="t-sm t-mut">1</text>
            <text x="196" y="178" class="t-sm t-mut">2</text>
            <text x="256" y="178" class="t-sm t-mut">3</text>
            <text x="311" y="178" class="t-sm t-mut">4</text>
          </svg>
        caption: "بعد half-life واحدة يفضل 50%، اتنين 25%، تلاتة 12.5%، أربعة 6.25%. فبعد 4-5 half-lives الدوا تقريباً خلص، وبنفس المنطق بتوصل steady state بعد 4-5 half-lives."
        alt: "Bar chart of drug remaining after 0 to 4 half-lives: 100%, 50%, 25%, 12.5%, 6.25%."
        page: 229
        quote: "# of half-lives 1 2 3 4 % remaining 50% 25% 12.5% 6.25%"
      - kind: check
        question: "A drug has a half-life of 6 hours and is given by constant infusion. About how long until it reaches steady state?"
        options:
          - "24-30 hours"
          - "6 hours"
          - "12 hours"
          - "It depends on the infusion rate"
        answer: 0
        why:
          - "صح: 4-5 half-lives × 6 ساعات = 24-30 ساعة."
          - "بعد half-life واحدة بتوصل نص الـ steady state بس."
          - "بعد 2 half-lives بتوصل 75% بس."
          - "الوقت للـ steady state بيعتمد على الـ t1/2 مش على الجرعة أو معدل التسريب."
        page: 229
        quote: "In first-order kinetics, a drug infused at a constant rate takes 4-5 half-lives to reach steady state."
      - kind: explain
        title: "الكبار في السن: نفس الجرعة، تركيز أعلى"
        text: |-
          - **Absorption**: تقريباً زي ما هو.
          - **Distribution**: مية الجسم ↓ ← الأدوية الـ hydrophilic الـ Vd بتاعها يقل فتركيزها ==يعلى==. ودهون الجسم ↑ ← الأدوية الـ lipophilic الـ Vd بتاعها يزيد فالـ ==half-life يطول==.
          - **Metabolism**: الكبد أصغر ودمه أقل ← first-pass أقل و hepatic clearance أقل. Phase I بيقل، و phase II محفوظ نسبياً.
          - **Excretion**: GFR ↓ ← renal clearance ↓.

          عشان كده الكبار غالباً محتاجين ==جرعات أقل==.
        page: 229
        quote: "Distribution—↓ total body water (↓ Vd of hydrophilic drugs → ↑ concentration), ↑ total body fat (↑ Vd of lipophilic drugs → ↑ half-life)."
      - kind: explain
        title: "Phase I و phase II"
        text: |-
          الكبد بيحوّل الدوا الـ lipophilic لحاجة polar عشان تخرج في البول أو الصفرا.

          - **Phase I** (معظمه CYP450): ==Reduction و Oxidation و Hydrolysis==. بيطلع metabolite **slightly polar** (ممكن active أو inactive).
          - **Phase II** (conjugation): Methylation و Glucuronidation و Acetylation و Sulfation. بيطلع metabolite **very polar**، ما عدا الـ acetylated.

          والاتنين مش لازم يمشوا بالترتيب. والكبار بيخسروا ==phase I الأول==.
        page: 230
        quote: "Geriatric patients lose phase I first. Patients who are slow acetylators have ↑ adverse effects from certain drugs because of ↓ rate of metabolism (eg, isoniazid)."
      - kind: sort
        prompt: "حط كل reaction في الـ phase بتاعها"
        bins: ["Phase I", "Phase II"]
        cards:
          - { text: "Oxidation", bin: 0 }
          - { text: "Reduction", bin: 0 }
          - { text: "Hydrolysis", bin: 0 }
          - { text: "Glucuronidation", bin: 1 }
          - { text: "Acetylation", bin: 1 }
          - { text: "Sulfation", bin: 1 }
          - { text: "Methylation", bin: 1 }
        why: "Phase I بيغيّر في الدوا نفسه (Reduction و Oxidation و Hydrolysis). Phase II بيلزق فيه جزيء (conjugation)."
        page: 230
        quote: "Methylation Glucuronidation Acetylation Sulfation"
      - kind: aside
        tone: exam
        text: "مريض على **isoniazid** جاله peripheral neuropathy أو آثار جانبية أكتر من التانيين؟ فكّر في ==slow acetylator==: الـ acetylation (phase II) بطيء فالدوا بيتراكم."
        page: 230
        quote: "Patients who are slow acetylators have ↑ adverse effects from certain drugs because of ↓ rate of metabolism (eg, isoniazid)."
      - kind: try
        items: [pharm.L01.011, pharm.L01.012, pharm.L01.016, pharm.L01.020, pharm.L01.024]
    recap:
      - "F: نسبة اللي وصل الدم؛ IV = 100%، بالبق أقل (امتصاص + first-pass)."
      - "Vd عالي = الدوا في الأنسجة؛ الـ dialysis بيفيد مع الـ Vd الواطي. مرض الكبد والكلى ← Vd ↑."
      - "t1/2 = 0.7 × Vd / CL. Steady state بعد 4-5 half-lives."
      - "الكبار: دهون ↑ (lipophilic t1/2 ↑)، مية ↓، phase I ↓، GFR ↓ ← جرعات أقل."
      - "Phase I = Reduction و Oxidation و Hydrolysis (CYP450). Phase II = conjugation. Slow acetylators ← isoniazid toxicity."
    practice: [pharm.L01.008, pharm.L01.009, pharm.L01.010, pharm.L01.011, pharm.L01.012, pharm.L01.013, pharm.L01.014, pharm.L01.015, pharm.L01.016, pharm.L01.017, pharm.L01.018, pharm.L01.019, pharm.L01.020, pharm.L01.021, pharm.L01.022, pharm.L01.023, pharm.L01.024, pharm.L01.025, pharm.L01.026, pharm.L01.027]
  - id: pharm.L01.lesson3
    title: "الدوا بيخرج إزاي، والجرعة بتتحسب إزاي"
    hook: "ليه زيادة صغيرة في جرعة الـ phenytoin بتعمل تسمم؟ وليه بنعطي bicarbonate في الـ aspirin overdose؟"
    minutes: 8
    pages: [230, 231]
    topics: [elimination-of-drugs, urine-ph-drug-elimination, dosage-calculations]
    goals:
      - "تفرّق بين zero-order و first-order elimination وتعرف أمثلة الـ zero-order"
      - "تعرف إزاي الـ urine pH بيحبس الدوا في البول"
      - "تحسب الـ loading والـ maintenance dose وتعرف إيه اللي يتغيّر في مرض الكلى"
    status: unverified
    steps:
      - kind: explain
        title: "Zero-order: كمية ثابتة كل ساعة"
        text: |-
          في الـ **zero-order elimination** الجسم بيطلّع ==كمية ثابتة== (constant amount per unit time) من الدوا كل ساعة مهما كان التركيز، لأن الإنزيمات **saturated** (capacity-limited). فالتركيز بينزل في **خط مستقيم**.

          في الـ **first-order** الجسم بيطلّع ==نسبة ثابتة== (مثلاً نص الموجود كل half-life)، فالتركيز بينزل **exponential**، وده حال معظم الأدوية (flow-dependent).
        page: 230
        quote: "Rate of elimination is constant regardless of Cp (ie, constant amount of drug eliminated per unit time). Cp ↓ linearly with time."
      - kind: figure
        title: "خط مستقيم ولا منحنى؟"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="10" width="165" height="150" rx="8"/>
            <rect class="fg-box" x="185" y="10" width="165" height="150" rx="8"/>
            <text x="40" y="30" class="t-sm t-b">Zero-order</text>
            <text x="215" y="30" class="t-sm t-b">First-order</text>
            <line class="fg-ink" x1="30" y1="140" x2="160" y2="140"/>
            <line class="fg-ink" x1="30" y1="40" x2="30" y2="140"/>
            <line class="fg-arrow-acc" x1="30" y1="45" x2="150" y2="135" stroke-width="3"/>
            <text x="60" y="155" class="t-sm t-mut">2 U/h every hour</text>
            <line class="fg-ink" x1="205" y1="140" x2="335" y2="140"/>
            <line class="fg-ink" x1="205" y1="40" x2="205" y2="140"/>
            <path class="fg-arrow-acc" d="M205 45 Q 230 115, 330 135" fill="none" stroke-width="3"/>
            <text x="225" y="155" class="t-sm t-mut">4 → 2 → 1 → 0.5 U/h</text>
          </svg>
        caption: "الـ zero-order بيطلّع نفس الكمية كل ساعة فالخط مستقيم. الـ first-order بيطلّع نسبة ثابتة، فكل ما التركيز يقل الكمية اللي بتطلع تقل والمنحنى يفرش."
        alt: "Two plots of drug plasma concentration over time. Left, zero-order: a straight falling line, eliminating 2 units per hour. Right, first-order: an exponential curve, eliminating 4, then 2, then 1, then 0.5 units per hour."
        page: 230
        quote: "Rate of first-order elimination is directly proportional to the drug concentration (ie, constant fraction of drug eliminated per unit time). Cp ↓ exponentially with time. Applies to most drugs."
      - kind: mnemonic
        word: "PEA"
        parts:
          - { key: "P", text: "Phenytoin" }
          - { key: "E", text: "Ethanol" }
          - { key: "A", text: "Aspirin (at high or toxic concentrations)" }
        hook: "من الكتاب: الـ pea مدوّرة زي الـ 0 بتاع zero-order"
