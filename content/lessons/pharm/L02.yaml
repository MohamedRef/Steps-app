        why: "الـ α1 بيقبض الأوعية فبيعلّي الضغط (norepinephrine، phenylephrine، midodrine). الـ β1 بيقوّي القلب (dobutamine). الـ epinephrine بيجمع β2 (يفتح الشعب) و α (يرفع الضغط) فهو دوا الـ anaphylaxis."
