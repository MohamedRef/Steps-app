        page: 242
        quote: "NE ↑ systolic and diastolic pressures as a result of α1 -mediated vasoconstriction → ↑ mean arterial pressure → reflex bradycardia."
      - kind: check
        question: "A drug raises blood pressure. After an α-blocker, the same drug's pressor effect is suppressed but not reversed. Which drug?"
        options:
          - "Phenylephrine"
          - "Epinephrine"
          - "Isoproterenol"
          - "Dobutamine"
        answer: 0
        why:
          - "صح: الـ phenylephrine pure α-agonist، مفيش β2 يبان بعد الـ blockade."
          - "الـ epinephrine أثره بيتقلب (reversal) عشان الـ β2."
          - "الـ isoproterenol بيوطّي الضغط من الأول."
          - "الـ dobutamine أثره على الضغط قليل أو بيوطيه (β1 > β2)."
        page: 242
        quote: "Phenylephrine response is suppressed but not reversed because it is a “pure” α-agonist (lacks β-agonist properties)."
      - kind: explain
        title: "3 منحنيات تحفظ منها كل حاجة"
        text: |-
          - **Norepinephrine (α > β)**: ==unopposed α1== ← المقاومة تعلى ← MAP ↑↑ و PP ↑ ← الـ baroreceptors تعمل **reflex bradycardia**.
          - **Epinephrine (β > α)**: في الأوعية β2 > α1، والـ β1 بيعلّي الـ HR ← CO ↑ و HR ↑ و MAP ↑ و PP ↑.
          - **Isoproterenol (β1 ≈ β2)**: ==unopposed β2== ← المقاومة تقع ← MAP ↓، والـ HR يطلع من β1 ومن الـ reflex tachycardia ← CO ↑↑ و HR ↑↑ و PP ↑↑.

          القاعدة: اسأل نفسك «الـ α1 أكبر ولا الـ β2 في الأوعية؟». ده بيحدد الـ MAP، والـ MAP بيحدد الـ reflex.
        page: 242
        quote: "NE ↑ systolic and diastolic pressures as a result of α1 -mediated vasoconstriction → ↑ mean arterial pressure → reflex bradycardia."
