      - kind: explain
        title: "الجرعة بتغيّر الـ receptor"
        text: |-
          - **Dopamine**: جرعة قليلة ← β (inotropic و chronotropic)؛ جرعة عالية ← ==α (vasoconstriction)==.
          - **Epinephrine**: الـ α بتسيطر في الجرعات العالية، وأثره على الـ β2 أقوى من الـ norepinephrine.

          والـ **indirect** agonists: الـ amphetamine (reuptake inhibitor + بيطلّع المخزون) ← narcolepsy و obesity و ADHD. الـ ephedrine بيطلّع المخزون ← decongestion. الـ **cocaine** reuptake inhibitor + local anesthetic، وبيوسّع الحدقة لو الـ sympathetic سليم ← بيأكد الـ ==Horner syndrome==.
        page: 241
        quote: "inotropic and chronotropic effects at lower doses via β effects; vasoconstriction at high doses via α effects."
      - kind: aside
