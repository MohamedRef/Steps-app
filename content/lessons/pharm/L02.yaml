  - id: pharm.L02.lesson5
    title: "الـ sympatholytics والـ β-blockers والـ PDE inhibitors"
    hook: "من A لـ M selective ومن N لـ Z لأ: حروف الأبجدية هتحفظك الـ β-blockers"
    minutes: 10
    pages: [243, 245]
    topics: [alpha2-agonists, alpha-blockers, beta-blockers, phosphodiesterase-inhibitors]
    goals:
      - "تعرف الـ α2-agonists والـ α-blockers واستخداماتهم وآثارهم"
      - "تعرف استخدامات الـ β-blockers وآثارها الجانبية والـ selectivity"
      - "تفرّق بين أنواع الـ PDE inhibitors"
    status: unverified
    steps:
      - kind: explain
        title: "الـ α2-agonists: بيقفلوا الـ sympathetic من المخ"
        text: |-
          الـ α2 بيقلل الـ sympathetic outflow، فالـ agonist بيوطّي الضغط والنبض.

          - **Clonidine و guanfacine**: hypertensive urgency، ADHD، Tourette، و opioid withdrawal. آثارهم: CNS depression و bradycardia و miosis، و==rebound hypertension== لو اتوقفوا فجأة.
          - **α-methyldopa**: الضغط في ==الحمل==. آثاره: Coombs ⊕ hemolysis و drug-induced lupus و hyperprolactinemia.
          - **Tizanidine**: الـ spasticity.
        page: 243
        quote: "Clonidine, guanfacine Hypertensive urgency (limited situations), ADHD, Tourette syndrome, symptom control in opioid withdrawal"
      - kind: explain
        title: "الـ α-blockers"
        text: |-
          - **Phenoxybenzamine** (irreversible): قبل عملية الـ ==pheochromocytoma== عشان يمنع الـ hypertensive crisis. آثاره: orthostatic hypotension و reflex tachycardia.
          - **Phentolamine** (reversible): مريض على ==MAO inhibitors== أكل tyramine، الـ cocaine hypertension الشديد (2nd line)، و NE extravasation.
          - **α1-selective (-osin)**: prazosin و terazosin و doxazosin و tamsulosin ← BPH، والـ prazosin للـ PTSD، والضغط (ما عدا tamsulosin). أشهر عرض: ==1st-dose orthostatic hypotension==.
          - **Mirtazapine** (α2 antagonist): depression، وبيعمل نوم وجوع و ↑ cholesterol.
        page: 243
        quote: "Phenoxybenzamine Irreversible. Pheochromocytoma (used preoperatively) to prevent catecholamine (hypertensive) crisis."
      - kind: check
        question: "A 70-year-old man faints after his first dose of a drug for benign prostatic hyperplasia. Which drug?"
        options:
          - "Terazosin"
          - "Phenoxybenzamine"
          - "Clonidine"
          - "Mirtazapine"
        answer: 0
        why:
          - "صح: الـ α1 blockers (-osin) بيعملوا 1st-dose orthostatic hypotension."
          - "الـ phenoxybenzamine للـ pheochromocytoma."
          - "الـ clonidine α2 agonist مش للـ BPH."
          - "الـ mirtazapine للـ depression."
        page: 243
        quote: "Urinary symptoms of BPH; PTSD (prazosin); hypertension (except tamsulosin). 1st-dose orthostatic hypotension, dizziness, headache."
      - kind: table
        title: "الـ β-blockers بتتستخدم في إيه"
        columns: ["Use", "Why", "Example"]
        rows:
          - ["Glaucoma", "↓ aqueous humor production", "Timolol"]
          - ["Heart failure", "Prevents remodeling → ↓ mortality", "Bisoprolol, carvedilol, metoprolol"]
          - ["Hypertension", "↓ CO, ↓ renin (β1 on JG cells)", "—"]
          - ["Thyroid storm", "↓ HR, ↓ tremor", "Propranolol"]
          - ["Hypertrophic cardiomyopathy", "↓ HR → ↑ filling time", "—"]
          - ["SVT", "↓ AV conduction (class II)", "Metoprolol, esmolol"]
          - ["Variceal bleeding", "↓ portal hypertension (prophylaxis)", "Nadolol, propranolol, carvedilol"]
        hide: [[0, 2], [1, 2], [3, 2], [6, 2]]
        page: 244
        quote: "Heart failure Blockade of neurohormonal stress → prevention of deleterious cardiac remodeling → ↓ mortality Bisoprolol, carvedilol, metoprolol (β-blockers curb mortality)"
      - kind: aside
        tone: tip
        text: "الـ mnemonic بتاعة الكتاب للـ selectivity: ==A لـ M = β1-selective== (atenolol، betaxolol، bisoprolol، esmolol، metoprolol). ==N لـ Z = nonselective== (nadolol، propranolol، timolol). والـ carvedilol والـ labetalol بيقفلوا α1 كمان، وآخرهم مش -olol. والـ **nebivolol** β1-selective وبيشغّل β3 ← NO ← ↓ SVR («NebivOlol increases NO»)."
        page: 244
        quote: "Selective antagonists mostly go from A to M (β1 with 1st half of alphabet)"
      - kind: reveal
        prompt: "مريض diabetic على propranolol، ليه السكر بيوقع من غير ما يحس؟"
        answer: "الـ β-blockers بتعمل ==masked hypoglycemia==: الرعشة وسرعة القلب اللي بتنبهه بيتقفلوا. وباقي الآثار: erectile dysfunction، bradycardia و AV block و HF، seizures ومشاكل نوم، dyslipidemia (metoprolol)، و asthma/COPD exacerbation."
        page: 244
        quote: "Erectile dysfunction, cardiovascular (bradycardia, AV block, HF), CNS (seizures, sleep alterations), dyslipidemia (metoprolol), masked hypoglycemia, asthma/COPD exacerbations"
      - kind: check
        question: "Which β-blocker is β1-selective?"
        options:
          - "Metoprolol"
          - "Propranolol"
          - "Nadolol"
          - "Labetalol"
        answer: 0
        why:
          - "صح: M في النص الأول من الأبجدية ← β1-selective."
          - "الـ propranolol P ← nonselective."
          - "الـ nadolol N ← nonselective."
          - "الـ labetalol nonselective β ومعاه α1 blockade."
        page: 244
        quote: "β1 -selective antagonists (β1 > β2 )—atenolol, betaxolol, bisoprolol, esmolol, metoprolol"
      - kind: explain
        title: "الـ PDE inhibitors"
        text: |-
          الـ PDE بيكسّر الـ cAMP والـ cGMP. لو قفلته، ==cAMP أو cGMP يعلوا==، وكل نوع PDE في نسيج مختلف.

          - **Theophylline** (nonspecific): COPD/asthma نادراً. سمّيته في القلب (arrhythmia) والمخ (seizures).
          - **PDE-5** (sildenafil و tadalafil...): ↑ cGMP ← ED و pulmonary hypertension (و BPH للـ tadalafil). ممنوع مع ==nitrates== (هبوط ضغط).
          - **PDE-4** (roflumilast): severe COPD.
          - **PDE-3** (milrinone): inotrope للـ cardiogenic shock.
          - **Cilostazol و dipyridamole**: platelet inhibitors ← claudication و stroke/TIA prevention.
        page: 245
        quote: "Phosphodiesterase (PDE) inhibitors inhibit PDE, which catalyzes the hydrolysis of cAMP and/or cGMP, and thereby increase cAMP and/or cGMP."
      - kind: figure
        title: "milrinone: القلب أقوى والأوعية أوسع"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="ph2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="130" y="55" width="100" height="40" rx="8"/>
            <text x="148" y="80" class="t-sm t-b">PDE-3 ⊝ → ↑ cAMP</text>
            <line class="fg-arrow-acc" x1="180" y1="55" x2="100" y2="25" marker-end="url(#ph2b)"/>
            <line class="fg-arrow-acc" x1="180" y1="95" x2="100" y2="125" marker-end="url(#ph2b)"/>
            <rect class="fg-good" x="5" y="5" width="95" height="40" rx="8"/>
            <text x="12" y="22" class="t-sm">Heart: ↑ Ca2+</text>
            <text x="12" y="38" class="t-sm">↑ inotropy</text>
            <rect class="fg-good" x="5" y="105" width="95" height="40" rx="8"/>
            <text x="12" y="122" class="t-sm">Vessels: MLCK ⊝</text>
            <text x="12" y="138" class="t-sm">vasodilation</text>
            <text x="240" y="40" class="t-sm t-mut">↓ preload</text>
            <text x="240" y="120" class="t-sm t-mut">↓ afterload</text>
          </svg>
        caption: "نفس الـ cAMP بيعمل حاجتين عكس بعض في نسيجين: في القلب بيزوّد الـ Ca2+ فيقوّي الانقباض، وفي الأوعية بيقفل الـ MLCK فيرخّيها. فالـ milrinone بيقوّي القلب ويخفف الحمل عليه."
        alt: "PDE-3 inhibition raises cAMP: in cardiomyocytes this increases calcium influx and inotropy; in vascular smooth muscle it inhibits MLCK, causing vasodilation and lower preload and afterload."
        page: 245
        quote: "In vascular smooth muscle: ↑ cAMP → MLCK inhibition → vasodilation → ↓ preload and afterload"
      - kind: check
        question: "A man taking sildenafil develops blue-tinted vision. Why?"
        options:
          - "Inhibition of PDE-6 in the retina"
          - "Inhibition of PDE-3 in the retina"
          - "Excess cAMP in the lens"
          - "Interaction with nitrates"
        answer: 0
        why:
          - "صح: الـ sildenafil بس بيعمل cyanopia عشان بيقفل PDE-6 (six) في الشبكية."
          - "الـ PDE-3 بتاع الـ milrinone والـ cilostazol."
          - "مش ده الـ mechanism اللي الكتاب بيقوله."
          - "الـ nitrates بتعمل هبوط ضغط، مش رؤية زرقا."
        page: 245
        quote: "Sildenafil only: cyanopia (blue- tinted vision) via inhibition of PDE-6 (six) in retina"
      - kind: aside
        tone: tip
        text: "جملتين من الكتاب: الـ β-blockers للـ variceal bleeding هما ==nadolol و propranolol و carvedilol «for no portal circulation»== (أوائل حروفهم NPC). والـ PDE-5 inhibitors: الـ cGMP يعلى ← الـ smooth muscle ترتخي ← الدم يملا الـ corpus cavernosum، والـ adverse effects «hot and sweaty، then headache، heartburn، hypotension»."
        page: 244
        quote: "Nadolol, propranolol, carvedilol for no portal circulation"
