      - kind: match
        prompt: "وصّل الـ sympathomimetic بالاستخدام"
        pairs:
          - ["Dobutamine (β1 > β2, α)", "Cardiac stress test, cardiogenic shock (inotrope)"]
          - ["Norepinephrine (α1 > α2 > β1)", "Septic shock"]
          - ["Epinephrine (β > α)", "Anaphylaxis"]
          - ["Phenylephrine (α1 > α2)", "Decongestant, mydriasis, ischemic priapism"]
          - ["Midodrine (α1)", "Postural hypotension, autonomic insufficiency"]
