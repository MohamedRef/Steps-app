        text: |-
          الـ **atropine** muscarinic antagonist: بيتستخدم في الـ ==bradycardia== وفي العين. بيوسّع الحدقة ويعمل cycloplegia، بيوسّع الشعب ويقلل الإفرازات، بيسرّع القلب، يقلل الحمض وحركة الأمعاء، ويقلل الـ urgency.

          وزي ما قلنا: بيوقف الـ **muscarinic** effects بتاعة الـ anticholinesterases بس، ==مش الـ nicotinic==.
