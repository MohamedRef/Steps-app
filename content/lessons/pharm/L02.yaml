        answer: 0
        why:
          - "صح: الـ ipratropium والـ tiotropium للـ COPD، والـ tiotropium أطول."
          - "الـ scopolamine للـ motion sickness."
          - "الـ benztropine للـ Parkinson والـ acute dystonia."
