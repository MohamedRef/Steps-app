schema: steps.lesson/v1
lecture: pharm.L02
lessons:
  - id: pharm.L02.lesson1
    title: "الأدوية بتتجمع إزاي، وخريطة الأعصاب الـ autonomic"
    hook: "2 + 2 ممكن تطلع 4 أو أكتر أو أقل، وعصب الـ sweat glands بيكسر القاعدة"
    minutes: 8
    pages: [234, 235]
    topics: [drug-effect-modifications, autonomic-receptors, acetylcholine-receptors, pain-transmission]
    goals:
      - "تفرّق بين additive و synergistic و potentiation و antagonistic و tachyphylaxis"
      - "تعرف مين بيفرز إيه على أنهي receptor في الـ sympathetic والـ parasympathetic"
      - "تعرف الـ nicotinic من الـ muscarinic، والـ pain بيتنقل ويتوقف إزاي"
    status: unverified
    steps:
      - kind: explain
        title: "لما دوائين يتقابلوا"
        text: |-
          - **Additive**: الاتنين مع بعض = مجموعهم (2 + 2 = 4)، زي aspirin مع acetaminophen.
          - **Synergistic**: أكتر من مجموعهم (2 + 2 > 4)، زي clopidogrel مع aspirin.
          - **Potentiation**: الدوا التاني ==لوحده ما بيعملش حاجة== بس بيقوّي الأول (2 + 0 > 2): الـ carbidopa بيمنع تحويل الـ levodopa برّه المخ.
          - **Antagonistic**: أقل من مجموعهم (2 + 2 < 4)، زي morphine مع naloxone.
          - **Permissive**: الأول لازم يكون موجود عشان التاني يشتغل كويس: الـ cortisol بيخلي الأوعية تستجيب للـ catecholamines.
        page: 234
        quote: "Similar to synergism, but drug B (with no therapeutic action alone) enhances the therapeutic action of drug A"
      - kind: reveal
        prompt: "واحدة بتستخدم nasal spray (oxymetazoline) كل يوم، ومفعوله بيقل، ولما توقفه مناخيرها تتسد أكتر. اسم ده إيه؟"
        answer: "**Tachyphylaxis**: نقص حاد في الاستجابة بعد التكرار، ومعاه **rebound congestion**."
        page: 234
        quote: "Repeat use of intranasal decongestant (eg, oxymetazoline) → ↓ therapeutic response (with rebound congestion)"
      - kind: figure
        title: "مين بيفرز إيه"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="ph2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="8" y="20" class="t-sm t-b">Parasympathetic</text>
            <line class="fg-arrow" x1="10" y1="35" x2="170" y2="35" marker-end="url(#ph2a)"/>
            <text x="40" y="30" class="t-sm t-mut">long pre: ACh → Nn</text>
            <line class="fg-arrow" x1="175" y1="35" x2="230" y2="35" marker-end="url(#ph2a)"/>
            <text x="236" y="39" class="t-sm">ACh → M (organs)</text>
            <text x="8" y="70" class="t-sm t-b">Sympathetic</text>
            <line class="fg-arrow" x1="10" y1="85" x2="60" y2="85" marker-end="url(#ph2a)"/>
            <text x="12" y="80" class="t-sm t-mut">ACh → Nn</text>
            <line class="fg-arrow-acc" x1="65" y1="85" x2="230" y2="85" marker-end="url(#ph2a)"/>
            <text x="236" y="89" class="t-sm t-acc">NE → α, β (organs)</text>
            <line class="fg-arrow" x1="65" y1="110" x2="230" y2="110" marker-end="url(#ph2a)"/>
            <text x="236" y="114" class="t-sm">ACh → M3 (sweat)</text>
            <line class="fg-arrow" x1="65" y1="135" x2="230" y2="135" marker-end="url(#ph2a)"/>
            <text x="224" y="139" class="t-sm">D → D1 (renal vessels)</text>
            <line class="fg-arrow-acc" x1="10" y1="165" x2="100" y2="165" marker-end="url(#ph2a)"/>
            <text x="104" y="169" class="t-sm">adrenal medulla (Nn) → Epi in blood</text>
            <text x="8" y="200" class="t-sm t-b">Somatic</text>
            <line class="fg-arrow" x1="10" y1="215" x2="230" y2="215" marker-end="url(#ph2a)"/>
            <text x="236" y="219" class="t-sm">ACh → Nm (muscle)</text>
          </svg>
        caption: "أي ganglion بيشتغل بـ ACh على Nn. الـ parasympathetic بيوصل للعضو بـ ACh على M. الـ sympathetic غالباً بـ NE، ما عدا الـ sweat glands (ACh) والـ renal vessels (dopamine). والـ adrenal medulla بيوصلها preganglionic على طول. والـ somatic بيروح للعضلة بـ ACh على Nm."
        alt: "Diagram of autonomic and somatic pathways: parasympathetic long preganglionic neuron with ACh on Nn then ACh on muscarinic receptors; sympathetic short preganglionic with ACh on Nn then NE on alpha and beta receptors, ACh on M3 at sweat glands, dopamine on D1 at renal vessels; preganglionic fiber to the adrenal medulla releasing epinephrine; somatic motor nerve with ACh on Nm."
        page: 234
        quote: "Adrenal medulla is directly innervated by preganglionic sympathetic fibers."
      - kind: aside
        tone: exam
        text: "الاستثناء اللي بيتسأل: الـ ==sweat glands== جزء من الـ sympathetic بس عصبها **cholinergic** (ACh على M3). الكتاب بيسميه «chold» sweat. يعني الـ antimuscarinic بيوقف العرق، والـ α-blocker لأ. والـ parasympathetic = CNs III و VII و IX و X والـ pelvic splanchnic nerves."
        page: 234
        quote: "Sweat glands are part of the sympathetic pathway but are innervated by cholinergic fibers (sympathetic nervous system results in a “chold” sweat)."
      - kind: explain
        title: "Nicotinic و muscarinic"
        text: |-
          - **Nicotinic**: ==ligand-gated channel==. الـ ACh يفتحه على طول فيدخل Na+ ويخرج K+ (وأحياناً Ca2+). نوعين: **NN** في الـ autonomic ganglia والـ adrenal medulla، و **NM** في الـ neuromuscular junction.
          - **Muscarinic**: ==G-protein–coupled== وبيشتغل بـ 2nd messengers. 5 أنواع (M1–5) في القلب والـ smooth muscle والمخ والـ exocrine glands والـ sweat glands.
        page: 235
        quote: "Nicotinic ACh receptors are ligand-gated channels allowing efflux of K+ and influx of Na+ and in some cases Ca2+."
      - kind: check
        question: "Which receptor is found in autonomic ganglia and the adrenal medulla?"
        options:
          - "NN nicotinic receptor"
          - "NM nicotinic receptor"
          - "M3 muscarinic receptor"
          - "α1-adrenergic receptor"
        answer: 0
        why:
          - "صح: الـ NN في الـ ganglia والـ adrenal medulla."
          - "الـ NM في الـ neuromuscular junction بتاع الـ skeletal muscle."
          - "الـ M3 على الأعضاء والـ sweat glands، مش في الـ ganglia."
          - "الـ α1 على الـ smooth muscle بتاع الأوعية والأحشاء."
        page: 235
        quote: "Two subtypes: NN (found in autonomic ganglia, adrenal medulla) and NM (found in neuromuscular junction of skeletal muscle)."
      - kind: explain
        title: "الألم بيتنقل إزاي"
        text: |-
          **Nociceptive pain**: مؤثر ميكانيكي أو حراري أو كيميائي ← الـ ==TRPV receptors== تدخّل Ca2+ ← Na+ channels تفتح. الإشارة بتمشي على **Aδ** (ألم حاد سريع) أو **C fibers** (ألم ممل نابض مزمن).

          **Neuropathic pain**: العصب نفسه بايظ (CNS أو PNS)، والـ ==voltage-gated Na+ channels== بتزيد وتفضل شغالة. مثال: diabetic peripheral neuropathy.
        page: 235
        quote: "Transient receptor potential vanilloid ligand receptors cause Ca2+ influx–induced Na+ channel activation. Signals transmitted by Aδ fibers (sharp, acute pain) or C fibers (dull, throbbing, chronic pain)."
      - kind: sort
        prompt: "الدوا ده بيوقف أنهي مرحلة؟ (الكتاب بيحط بعض الأدوية في أكتر من مرحلة؛ هنا كل دوا في مرحلة ينفع فيها)"
        bins: ["Transduction", "Modulation"]
        cards:
          - { text: "NSAIDs", bin: 0 }
          - { text: "Acetaminophen", bin: 0 }
          - { text: "Glucocorticoids", bin: 0 }
          - { text: "TCAs", bin: 1 }
          - { text: "SSRIs", bin: 1 }
          - { text: "SNRIs", bin: 1 }
        why: "الـ NSAIDs والـ acetaminophen والـ glucocorticoids بيوقفوا الـ transduction عند الطرف. الـ TCAs والـ SSRIs والـ SNRIs بيشتغلوا في الـ modulation (وكمان الـ perception). الـ local anesthetics والـ α2-agonists والـ gabapentinoids بيظهروا في أكتر من مرحلة."
        page: 235
        quote: "Modulation—blocked by TCAs, SSRIs, SNRIs, gabapentinoids"
      - kind: explain
        title: "ليه الـ sympathetic preganglionic قصير والـ parasympathetic طويل؟"
        text: |-
          بص على رسمة الكتاب:

          - **Parasympathetic**: preganglionic ==طويل== وpostganglionic قصير، لأن الـ ganglion قاعد جنب العضو أو جوّاه. الاتنين ACh: الأول على Nn، والتاني على M1 أو M2 أو M3.
          - **Sympathetic**: preganglionic ==قصير== بيروح للـ **sympathetic chain** جنب الـ spinal cord، وبعدين postganglionic طويل لحد العضو، وبيفرز NE على α1 و α2 و β1 و β2.

          المنطق: الـ sympathetic لازم يشتغل في الجسم كله مرة واحدة (fight or flight)، فالـ chain بتوزّع الإشارة على أعضاء كتير. والـ parasympathetic أدق، كل عضو لوحده.

          والاستثناءات: الـ sweat glands (ACh على M3)، والـ renal vasculature (dopamine على D1)، والـ adrenal medulla (preganglionic على طول ← epinephrine في الدم). والـ **somatic** (voluntary motor nerve) مفيهوش ganglion أصلاً: ACh على Nm في الـ neuromuscular junction.

          وتعريف الـ **nociceptive pain**: إشارات ألم رايحة للـ CNS رداً على مؤثر mechanical أو thermal أو chemical.
        page: 234
        quote: "Brainstem Spinal cord Preganglionic neuron (long) Postganglionic neuron (short) Preganglionic neuron (short) Postganglionic neuron (long) Sweat glands Sympathetic chain"
      - kind: try
        items: [pharm.L02.001, pharm.L02.006, pharm.L02.010, pharm.L02.013, pharm.L02.015]
    recap:
      - "Synergistic 2 + 2 > 4 (clopidogrel + aspirin)، potentiation 2 + 0 > 2 (carbidopa)، antagonistic (morphine + naloxone)، tachyphylaxis (oxymetazoline)."
      - "Sweat glands: sympathetic بس cholinergic. Adrenal medulla: preganglionic على طول. Renal vessels: dopamine على D1."
      - "Nicotinic = ligand-gated (NN ganglia/adrenal، NM عضلة). Muscarinic = GPCR، M1–5."
      - "Aδ حاد، C مزمن. Neuropathic = voltage-gated Na+ channels شغالة على طول."
    practice: [pharm.L02.001, pharm.L02.002, pharm.L02.003, pharm.L02.004, pharm.L02.005, pharm.L02.006, pharm.L02.007, pharm.L02.008, pharm.L02.009, pharm.L02.010, pharm.L02.011, pharm.L02.012, pharm.L02.013, pharm.L02.014, pharm.L02.015, pharm.L02.016, pharm.L02.017, pharm.L02.100, pharm.L02.101]
  - id: pharm.L02.lesson2
    title: "المثانة والـ receptors والـ G-proteins: جدول واحد يحل نص الفارما"
    hook: "لو حفظت كل receptor شغال بأنهي G-protein، هتتوقع أثر أي دوا من غير ما تحفظه"
    minutes: 9
    pages: [236, 237]
    topics: [micturition-control, adrenergic-receptor-distribution, g-protein-second-messengers]
    goals:
      - "تعرف الأعصاب والـ receptors اللي بتتحكم في المثانة والأدوية اللي بتشتغل عليها"
      - "تعرف كل adrenergic receptor فين وبيعمل إيه"
      - "تحفظ Gq و Gs و Gi بالـ mnemonic"
    status: unverified
    steps:
      - kind: explain
        title: "المثانة: مين بيقفل ومين بيفتح"
        text: |-
          مركز التبول في الـ ==pons== بينسّق بين الاتنين:
          - **Sympathetic** (hypogastric nerve) ← ==احتباس==: β3 بيرخّي الـ detrusor، و α1 بيقفل الـ internal sphincter.
          - **Parasympathetic** (pelvic nerve) ← ==تبول==: M3 بيقلّص الـ detrusor.
          - **Somatic** (pudendal nerve): nicotinic على الـ external sphincter (اللي إنت بتتحكم فيه).
        page: 236
        quote: "Micturition center in pons regulates involuntary bladder function via coordination of sympathetic and parasympathetic nervous systems. ⊕ sympathetic → ↑ urinary retention. ⊕ parasympathetic → ↑ urine voiding."
      - kind: aside
        tone: analogy
        text: "افتكرها كده: الـ **sympathetic** وإنت بتجري من أسد، مش وقت تدخل الحمام، فبيقفل. الـ **parasympathetic** وإنت مرتاح بعد الأكل، فبيفضّي. (الكتاب بيكتب جنبها «Baby one more time».)"
        page: 236
        quote: "⊕ sympathetic → ↑ urinary retention. ⊕ parasympathetic → ↑ urine voiding."
      - kind: match
        prompt: "وصّل الدوا بالاستخدام بتاعه في المثانة"
        pairs:
          - ["Bethanechol (⊕ M3)", "Urinary retention"]
          - ["Oxybutynin (⊝ M3)", "Urgency incontinence, by ↓ detrusor overactivity"]
          - ["Mirabegron (⊕ β3)", "Urgency incontinence, by ↑ bladder capacity"]
          - ["Tamsulosin (⊝ α1)", "BPH"]
        why: "الـ bethanechol بيقلّص الـ detrusor فيفضّي المثانة. الـ oxybutynin والـ mirabegron الاتنين بيرخّوه بطريقتين (يوقف M3 أو ينشّط β3). الـ tamsulosin بيرخّي الـ prostate وعنق المثانة فيقلل الانسداد."
        page: 236
        quote: "α1 -antagonists (eg, tamsulosin) ⊝ α1 -receptor → relaxation of smooth muscle (eg, bladder, neck, prostate) → ↓ urinary obstruction BPH"
      - kind: table
        title: "الـ adrenergic receptors فين وبيعملوا إيه"
        columns: ["Receptor", "Tissue", "Effect"]
        rows:
          - ["α1", "Vascular and visceral smooth muscle", "Vasoconstriction, smooth muscle contraction"]
          - ["α2", "Pancreas, presynaptic terminals, salivary glands", "↓ insulin, ↓ neurotransmitter release, ↓ saliva"]
          - ["β1", "Heart, kidney", "↑ HR and contractility, ↑ renin"]
          - ["β2", "Bronchioles, heart, liver, arteries, pancreas", "Bronchodilation, ↑ HR, glycogenolysis, vasodilation, ↑ insulin"]
          - ["β3", "Adipose", "↑ lipolysis"]
        hide: [[0, 2], [1, 2], [2, 2], [4, 2]]
        page: 236
        quote: "β1 Heart Kidney ↑ heart rate, contractility ↑ renin secretion"
      - kind: reveal
        prompt: "ليه الـ β-blocker بيقلل الضغط حتى من غير ما يأثر على القلب بس؟"
        answer: "لأن ==β1 في الكلى بيزوّد الـ renin==. لما تقفله، الـ renin يقل فالـ angiotensin II يقل."
        page: 236
        quote: "β1 Heart Kidney ↑ heart rate, contractility ↑ renin secretion"
      - kind: figure
        title: "الـ G-proteins التلاتة"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="10" width="340" height="55" rx="8"/>
            <text x="20" y="30" class="t-sm t-b">Gq: H1, α1, V1, M1, M3</text>
            <text x="20" y="52" class="t-sm">phospholipase C → IP3 (↑ Ca2+) + DAG (PKC)</text>
            <rect class="fg-good" x="10" y="75" width="340" height="55" rx="8"/>
            <text x="20" y="95" class="t-sm t-b">Gs: β1, β2, β3, D1, H2, V2</text>
            <text x="20" y="117" class="t-sm">adenylyl cyclase → ↑ cAMP → protein kinase A</text>
            <rect class="fg-bad" x="10" y="140" width="340" height="55" rx="8"/>
            <text x="20" y="160" class="t-sm t-b">Gi: M2, α2, D2</text>
            <text x="20" y="182" class="t-sm">inhibits adenylyl cyclase → ↓ cAMP</text>
          </svg>
        caption: "Gq بيعلّي الـ Ca2+ (عن طريق IP3) فبيقلّص العضلات الملساء. Gs بيعلّي الـ cAMP. Gi بيقلله. والـ mnemonic: «HAVe 1 M&M» لـ Gq، و «MAD 2s» لـ Gi، والباقي Gs."
        alt: "Three boxes: Gq receptors H1, alpha1, V1, M1, M3 act through phospholipase C, IP3, calcium and DAG; Gs receptors beta1, beta2, beta3, D1, H2, V2 raise cAMP; Gi receptors M2, alpha2, D2 lower cAMP."
        page: 237
        quote: "H1, α1, V1, M1, or M3 receptor Ligand Phospholipase C Gq protein PIP2 Smooth muscle contraction IP3 DAG Protein kinase C"
      - kind: check
        question: "Which receptor works through Gi?"
        options:
          - "α2"
          - "α1"
          - "β1"
          - "H2"
          - "V2"
        answer: 0
        why:
          - "صح: Gi = M2 و α2 و D2 (MAD 2s)."
          - "α1 بيشتغل بـ Gq."
          - "β1 بيشتغل بـ Gs."
          - "H2 بيشتغل بـ Gs وبيعلّي الحمض في المعدة."
          - "V2 بيشتغل بـ Gs وبيعلّي الـ aquaporin-2."
        page: 237
        quote: "B1 , B2 , B3 , D1 , H2 , or V2 receptor Gi protein M2 , α2 , or D2 receptor"
      - kind: explain
        title: "أهم الوظايف اللي بتتسأل"
        text: |-
          - **α1**: انقباض الأوعية، ==mydriasis== (pupillary dilator)، وقفل الـ sphincters بتاعة الأمعاء والمثانة.
          - **α2**: ↓ sympathetic outflow، ↓ insulin، ↑ platelet aggregation، ↓ aqueous humor.
          - **β1**: ↑ HR والـ contractility ("one heart")، ↑ renin.
          - **β2**: bronchodilation ("two lungs")، vasodilation، ↓ uterine tone (tocolysis)، ↑ ==K+ uptake== جوه الخلايا.
          - **M2**: ↓ HR والـ AV conduction. **M3**: إفرازات، حركة الأمعاء، تقلص المثانة، bronchoconstriction، miosis.
          - **V2**: ↑ aquaporin-2 في الـ collecting tubules و ↑ vWF.
        page: 237
        quote: "Vasodilation, bronchodilation (two lungs), ↑ lipolysis, ↑ insulin release, ↑ glycogenolysis, ↓ uterine tone (tocolysis), ↑ aqueous humor production, ↑ cellular K+ uptake"
      - kind: aside
        tone: tip
        text: "الـ β2 بيدخّل K+ جوه الخلايا، وده سبب إن الـ albuterol بيتستخدم مع الـ hyperkalemia. والـ M3 بيعمل miosis، والـ α1 بيعمل mydriasis: عضلتين مختلفتين في العين."
        page: 237
        quote: "↑ pupillary sphincter muscle contraction (miosis), ciliary muscle contraction (accommodation)"
      - kind: try
        items: [pharm.L02.019, pharm.L02.020, pharm.L02.022, pharm.L02.025, pharm.L02.027]
    recap:
      - "Sympathetic ← احتباس (β3 + α1). Parasympathetic ← تبول (M3). Somatic ← nicotinic على الـ external sphincter."
      - "Bethanechol للاحتباس؛ oxybutynin و mirabegron للـ urgency؛ tamsulosin للـ BPH."
      - "Gq: HAVe 1 M&M. Gi: MAD 2s. الباقي Gs."
      - "β1 ← renin. β2 ← K+ uptake و tocolysis. α2 ← ↓ sympathetic outflow."
    practice: [pharm.L02.018, pharm.L02.019, pharm.L02.020, pharm.L02.021, pharm.L02.022, pharm.L02.023, pharm.L02.024, pharm.L02.025, pharm.L02.026, pharm.L02.079, pharm.L02.098, pharm.L02.080, pharm.L02.081, pharm.L02.027, pharm.L02.095, pharm.L02.028, pharm.L02.082, pharm.L02.099, pharm.L02.083, pharm.L02.084, pharm.L02.029, pharm.L02.030, pharm.L02.031, pharm.L02.111]
  - id: pharm.L02.lesson3
    title: "الـ cholinergic drugs والفلاح اللي اتسمم بالمبيد"
    hook: "سؤال الـ organophosphate بيجي كل سنة تقريباً: atropine الأول، وبعدين pralidoxime ليه؟"
    minutes: 9
    pages: [238, 239]
    topics: [autonomic-drugs, cholinomimetic-agents, anticholinesterase-poisoning]
    goals:
      - "تعرف الـ NE بيوقف نفسه إزاي، والـ amphetamine بيطلّعه إزاي"
      - "تفرّق بين الـ direct والـ indirect cholinergic agonists ومين بيدخل المخ"
      - "تعالج organophosphate poisoning وتعرف ليه"
    status: unverified
    steps:
      - kind: explain
        title: "الـ NE بيفرمل نفسه"
        text: |-
          الـ NE اللي بيخرج من الطرف العصبي بيرجع يقعد على ==α2-autoreceptors== على نفس الطرف ← negative feedback ← إفراز أقل.

          والـ **amphetamine** بيدخل الطرف من الـ **NET**، وبعدين يدخل الـ vesicles من الـ **VMAT** ويطرد الـ NE منها. لما الـ NE جوه الطرف يكتر قوي، الـ NET ==بيشتغل بالعكس== ويطلّع الـ NE برّه.
        page: 238
        quote: "Amphetamines use the NE transporter (NET) to enter the presynaptic terminal, where they utilize the vesicular monoamine transporter (VMAT) to enter neurosecretory vesicles. This displaces NE from the vesicles."
      - kind: order
        prompt: "رتّب خطوات الـ amphetamine في الطرف العصبي"
        steps:
          - "Enters the terminal through NET"
          - "Enters vesicles through VMAT"
          - "Displaces NE from the vesicles"
          - "NE in the terminal reaches a threshold"
          - "NET reverses and expels NE into the cleft"
        why: "الـ amphetamine بيستخدم نفس البوابات بتاعة الـ NE، بس في الآخر بيقلب الـ NET يشتغل للخارج."
        page: 238
        quote: "Once NE reaches a concentration threshold within the presynaptic terminal, the action of NET is reversed, and NE is expelled into the synaptic cleft"
      - kind: aside
        tone: tip
        text: "من نفس الرسمة: **botulinum toxin** بيمنع خروج الـ ACh، و **tetrabenazine** بيقفل الـ VMAT (فالـ monoamines ما تدخلش الـ vesicles)، و **donepezil** AChE inhibitor."
        page: 238
        quote: "Cholinergic stimulant AChE inhibitors eg, Donepezil Cholinergic inhibitor Botulinum toxin Vesicular monoamine transporter (VMAT) inhibitor Tetrabenazine"
      - kind: explain
        title: "الـ direct agonists"
        text: |-
          - **Bethanechol**: muscarinic بس، مقاوم للـ AChE، بيشغّل المثانة ← urinary retention («Bethany, call me to activate your bladder»).
          - **Carbachol**: carbon copy من الـ ACh ← miosis أثناء العمليات.
          - **Methacholine**: بالاستنشاق ← ==challenge test للـ asthma==.
          - **Pilocarpine**: بيقلّص الـ ciliary muscle والـ pupillary sphincter ← glaucoma (open و closed angle)، وبيزود العرق والدموع والريق ← xerostomia في **Sjögren**.

          وخلي بالك: الـ cholinomimetics ممكن تزوّد الـ COPD والـ asthma والـ peptic ulcers.
        page: 239
        quote: "Methacholine Stimulates muscarinic receptors in airway when inhaled. Challenge test for diagnosis of asthma."
      - kind: explain
        title: "الـ indirect agonists: الشحنة بتحدد المخ"
        text: |-
          كلهم بيمنعوا الـ AChE فالـ ACh يزيد. الفرق المهم: ==مين بيعدّي الـ BBB==.

          - **Neostigmine**: مشحون موجب ← ما بيدخلش المخ («Neo = no BBB») ← ileus واحتباس بعد العمليات، myasthenia، وعكس الـ NMJ blockade.
          - **Pyridostigmine**: ما بيدخلش المخ، طويل المفعول ← myasthenia gravis («gets rid of myasthenia»).
          - **Physostigmine**: مش مشحون ← بيدخل المخ («Phreely») ← ==antidote للـ anticholinergic toxicity==.
          - **Donepezil و rivastigmine و galantamine**: 1st line للـ Alzheimer («Dona Riva forgot the gala»).
        page: 239
        quote: "Neo = no blood-brain barrier penetration due to positive charge."
      - kind: check
        question: "A delirious child with dilated pupils and hot dry skin after eating jimson weed needs an antidote that reaches the brain. Which one?"
        options:
          - "Physostigmine"
          - "Neostigmine"
          - "Pyridostigmine"
          - "Bethanechol"
        answer: 0
        why:
          - "صح: الـ physostigmine مش مشحون فبيدخل المخ ويعكس الـ delirium؛ بيـ phyxes الـ atropine overdose."
          - "الـ neostigmine مشحون وما بيدخلش المخ."
          - "الـ pyridostigmine ما بيدخلش الـ CNS."
          - "الـ bethanechol muscarinic agonist للمثانة، مش antidote ومش بيدخل المخ."
        page: 239
        quote: "Physostigmine ↑ ACh. Phreely (freely) crosses blood-brain barrier as not charged → CNS. Antidote for anticholinergic toxicity"
      - kind: explain
        title: "الـ organophosphate poisoning"
        text: |-
          الـ **organophosphates** (parathion و malathion و fenthion) مبيدات حشرية ==بتقفل الـ AChE بشكل irreversible==، فالـ ACh بيغرق كل الـ receptors. المريض الكلاسيكي **فلاح**.

          - **Muscarinic**: DUMBBELSS.
          - **Nicotinic**: neuromuscular blockade (زي الـ succinylcholine): fasciculations وضعف.
          - **CNS**: respiratory depression و lethargy و seizures و coma.
        page: 239
        quote: "Often due to organophosphates (eg, fenthion, parathion, malathion) that irreversibly inhibit AChE. Organophosphates commonly used as insecticides; poisoning usually seen in farmers."
      - kind: mnemonic
        word: "DUMBBELSS"
        parts:
          - { key: "D", text: "Diarrhea" }
          - { key: "U", text: "Urination" }
          - { key: "M", text: "Miosis" }
          - { key: "B", text: "Bronchospasm" }
          - { key: "B", text: "Bradycardia" }
          - { key: "E", text: "Emesis" }
          - { key: "L", text: "Lacrimation" }
          - { key: "S", text: "Sweating" }
          - { key: "S", text: "Salivation" }
        hook: "المريض بيغرق من كل حتة، وعينه نقطة وقلبه بطيء"
        page: 239
        quote: "Diarrhea, Urination, Miosis, Bronchospasm, Bradycardia, Emesis, Lacrimation, Sweating, Salivation."
      - kind: reveal
        prompt: "ليه بنعطي atropine و pralidoxime مع بعض، مش واحد بس؟"
        answer: "الـ **atropine** competitive inhibitor على الـ ==muscarinic== بس (وبيدخل المخ)، فبيوقف الـ DUMBBELSS بس مش بيصلّح ضعف العضلات. الـ **pralidoxime** بيرجّع الـ AChE يشتغل (dephosphorylation) لو اتدّى بدري، فبيصلّح الـ ==nicotinic== effects. ولازم يتدّى مع الـ atropine عشان يمنع إن الأعراض تزيد مؤقتاً، وهو ما بيعدّيش الـ BBB بسهولة."
        page: 239
        quote: "Reversed by pralidoxime, regenerates AChE via dephosphorylation if given early. Must be coadministered with atropine to prevent transient worsening of symptoms."
      - kind: check
        question: "After atropine, a farmer with organophosphate poisoning stops wheezing and drooling but still has fasciculations and weakness. What is missing?"
        options:
          - "Pralidoxime, to regenerate AChE"
          - "More atropine, to block nicotinic receptors"
          - "Physostigmine"
          - "Neostigmine"
        answer: 0
        why:
          - "صح: الضعف nicotinic، والـ pralidoxime هو اللي بيرجّع الـ AChE."
          - "الـ atropine ما بيقفلش nicotinic receptors مهما زودته."
          - "الـ physostigmine AChE inhibitor، هيزوّد التسمم."
          - "الـ neostigmine برضه AChE inhibitor."
        page: 239
        quote: "Nicotinic effects Neuromuscular blockade (mechanism similar to succinylcholine). Reversed by pralidoxime"
      - kind: figure
        title: "المبيد قفل الـ AChE: مين بيصلّح إيه"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-bad" x="90" y="6" width="180" height="44" rx="8"/>
            <text x="100" y="24" class="t-sm t-b">Organophosphate</text>
            <text x="100" y="42" class="t-sm">AChE blocked → ↑↑ ACh</text>
            <text x="172" y="66" class="t-sm t-mut">↓</text>
            <rect class="fg-box" x="4" y="76" width="170" height="70" rx="8"/>
            <text x="12" y="94" class="t-sm t-b">Muscarinic</text>
            <text x="12" y="112" class="t-sm">DUMBBELSS</text>
            <text x="12" y="130" class="t-sm t-mut">(diarrhea, miosis, bradycardia)</text>
            <rect class="fg-box" x="186" y="76" width="170" height="70" rx="8"/>
            <text x="194" y="94" class="t-sm t-b">Nicotinic</text>
            <text x="194" y="112" class="t-sm">Neuromuscular blockade</text>
            <text x="194" y="130" class="t-sm t-mut">(like succinylcholine)</text>
            <rect class="fg-good" x="4" y="154" width="170" height="40" rx="8"/>
            <text x="12" y="179" class="t-sm t-b">Atropine</text>
            <rect class="fg-good" x="186" y="154" width="170" height="40" rx="8"/>
            <text x="194" y="172" class="t-sm t-b">Pralidoxime</text>
            <text x="194" y="188" class="t-sm">regenerates AChE (early)</text>
          </svg>
        caption: "الـ ACh بيتراكم فبيضرب ناحيتين. الـ muscarinic (DUMBBELSS) بيوقفها الـ atropine، بس الـ atropine مالوش دعوة بالـ nicotinic. الضعف والشلل محتاجين ==pralidoxime== يرجّع الـ AChE لو اتدّى بدري، ودايمًا مع الـ atropine."
        alt: "Organophosphate blocks AChE so ACh builds up. Left: muscarinic effects (DUMBBELSS) treated by atropine. Right: nicotinic neuromuscular blockade treated by pralidoxime, which regenerates AChE if given early."
        page: 239
        quote: "Reversed by pralidoxime, regenerates AChE via dephosphorylation if given early. Must be coadministered with atropine to prevent transient worsening of symptoms."
      - kind: explain
        title: "مصنع الـ neurotransmitters والمكانس بتاعتها (رسمة الكتاب)"
        text: |-
          **التصنيع**:
          - Tyrosine ← L-DOPA ← ==dopamine== ← NE (في الـ noradrenergic terminal).
          - Tryptophan ← 5-hydroxytryptophan ← **5-HT**.
          - Choline + acetyl-CoA ← ACh (بالـ ChAT)، والـ AChE يكسّره تاني لـ choline و acetate.

          **الـ reuptake** (المكانس): ==NET== للـ NE، و DAT للـ dopamine، و SERT للـ 5-HT. والـ VMAT بيدخّلهم الـ vesicles.

          **فرامل الإفراز**: الـ α2 على الـ terminal بيعمل negative feedback، والـ angiotensin II (AT II) بيعلّي الإفراز. وفي الرسمة amphetamine و ephedrine كـ noradrenergic stimulants بيطلّعوا الـ NE المخزّن.

          ولو اتلخبطت في الـ cholinergic agonists، الكتاب مدّيك 3 جمل: «Bethany, call me to activate your bladder» (bethanechol)، «You cry, drool, and sweat on your pilow» (pilocarpine)، و«Pyridostigmine gets rid of myasthenia gravis».
        page: 238
        quote: "Tyrosine L-DOPA Dopamine Tryptophan 5-Hydroxytryptophan 5-HT Choline + Acetyl-CoA ACh"
      - kind: try
        items: [pharm.L02.036, pharm.L02.038, pharm.L02.042, pharm.L02.043, pharm.L02.044]
    recap:
      - "الـ NE بيفرمل نفسه بـ α2-autoreceptors. الـ amphetamine: NET ← VMAT ← يطرد NE ← NET يشتغل بالعكس."
      - "Bethanechol للمثانة، methacholine للـ asthma test، pilocarpine للـ glaucoma و Sjögren."
      - "Neostigmine و pyridostigmine مشحونين (برّه المخ). Physostigmine بيدخل المخ ← antidote."
      - "Organophosphates: DUMBBELSS + ضعف. Atropine للـ muscarinic، pralidoxime للـ nicotinic، مع بعض."
