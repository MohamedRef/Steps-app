          - { key: "I", text: "Isoniazid" }
          - { key: "C", text: "Cimetidine" }
          - { key: "K", text: "Ketoconazole" }
          - { key: "F", text: "Fluconazole" }
          - { key: "A", text: "Acute alcohol overuse" }
          - { key: "C", text: "Chloramphenicol" }
          - { key: "E", text: "Erythromycin/clarithromycin" }
          - { key: "S", text: "Sulfonamides" }
        hook: "الـ inhibitors: SICK FACES come when I am really drinking grapefruit juice (Ciprofloxacin و Omeprazole و Amiodarone و Ritonavir و grapefruit juice)"
        page: 251
        quote: "SICK FACES come when I am really drinking grapefruit juice"
