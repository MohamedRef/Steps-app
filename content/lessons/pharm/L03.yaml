      - kind: explain
        title: "الـ CYP450: inducers و inhibitors"
        text: |-
          الـ **inducer** بيزوّد الإنزيم ← الـ substrate يتكسر أسرع ← ==مستواه يقل== (الدوا ما يشتغلش).
          الـ **inhibitor** بيقفل الإنزيم ← الـ substrate يتراكم ← ==مستواه يعلى== (toxicity).

          والـ **substrates** اللي الكتاب بيختارها: theophylline و OCPs و anti-epileptics و warfarin («The OCPs are anti-war»).
        page: 251
        quote: "Theophylline OCPs Anti-epileptics Warfarin"
      - kind: mnemonic
        word: "SICKFACES"
        parts:
