  - id: rr.L04.lesson7
    title: "الكلى والتناسلي والرئة: آخر صفحة في الـ Key associations"
    hook: "حصوة مش باينة في الأشعة؟ ورم مبيض على الناحيتين؟ نزيف من الحلمة؟ كل واحد ليه إجابة واحدة"
    minutes: 9
    pages: [735, 735]
    topics: [renal, reproductive, respiratory]
    status: unverified
    steps:
      - kind: explain
        title: "الكلى"
        text: |-
          - **Nephrotic syndrome في الأطفال** ← ==minimal change disease==.
          - **Renal malignancy في الرجالة** ← ==renal cell carcinoma==: مع التدخين و VHL (clear cell)، وممكن يعمل paraneoplastic syndromes (EPO و renin و PTHrP و ACTH).
        page: 735
        quote: "Renal malignancy (in males) Renal cell carcinoma: associated with tobacco smoking and VHL (clear cell subtype); may present with paraneoplastic syndromes (EPO, renin, PTHrP, ACTH)"
      - kind: figure
        title: "الحصوة باينة في الأشعة ولا لأ؟"
        svg: |-
          <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="20" width="160" height="110" rx="10"/>
