          - "الـ calcium radiopaque، والأشهر."
          - "الـ struvite (ammonium) radiopaque."
          - "الـ cystine faintly radiopaque."
        page: 735
        quote: "Kidney stones (radiolucent on x-ray) Uric acid"
      - kind: explain
        title: "الـ amenorrhea والـ hypogonadism"
        text: |-
          - **1° amenorrhea** ← ==Turner syndrome== (45,XO أو mosaic 45,XO/46,XX).
          - **Hypogonadotropic hypogonadism + anosmia** ← ==Kallmann syndrome==: الـ neurons اللي بتطلّع GnRH بتهاجر مع neurons الشم، فلو الهجرة فشلت يضيع الاتنين.
          - **Clear cell adenocarcinoma of the vagina** ← DES exposure in utero.
        page: 735
        quote: "Hypogonadotropic hypogonadism with anosmia Kallmann syndrome (neuron migration failure)"
      - kind: table
        title: "أشهر ورم في كل حتة"
        columns: ["Setting", "Most common"]
