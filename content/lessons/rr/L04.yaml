schema: steps.lesson/v1
lecture: rr.L04
lessons:
  - id: rr.L04.lesson1
    title: "الوراثة والـ HLA والميكروبات: مين بيمشي مع مين"
    hook: "الـ Key associations هي «لو شفت كذا، فكّر في كذا». افهم ليه، وهتفتكرها من غير ما تحفظها"
    minutes: 9
    pages: [731, 731]
    topics: [biochemistry, immunology, microbiology]
    goals:
      - "تعرف ليه المرض الـ mitochondrial بيوصل لكل ولاد الأم"
      - "تفرّق بين HLA-DR3 و HLA-DR4"
      - "تعرف الميكروب حسب السن والمكان والمريض"
    status: unverified
    steps:
      - kind: explain
        title: "الـ mitochondria جاية من الأم"
        text: |-
          الـ sperm ما بيدّيش الجنين mitochondria، كلها جاية من البويضة. فالمرض الـ mitochondrial ==بيوصل لكل ولاد الأم المصابة== (maternal inheritance)، والأب المصاب ما بيورّثهوش.

          بس شدته بتختلف من ابن لابن بسبب **heteroplasmy**: كل خلية فيها خليط من mitochondria سليمة وبايظة بنسب مختلفة.
        page: 731
        quote: "Mitochondrial inheritance Disease occurs in all offspring of affected females (maternal inheritance pattern), heteroplasmy"
      - kind: explain
        title: "أربع «أشهر» في الـ biochemistry"
        text: |-
          - **Intellectual disability**: أشهر سبب sporadic هو ==Down syndrome==، وأشهر سبب inherited هو **fragile X**.
          - **أشهر vitamin deficiency في أمريكا**: ==folate==. الحوامل أكتر ناس معرّضين، والجسم بيخزّن منه 3–4 شهور بس (عكس الـ B12 اللي بيقعد سنين).
          - **أشهر lysosomal storage disease**: Gaucher.
        page: 731
        quote: "Vitamin deficiency (USA) Folate (pregnant women are at ↑ risk; body stores only a 3–4 month supply)"
      - kind: table
        title: "DR3 ولا DR4؟"
        columns: ["HLA", "Diseases"]
        rows:
          - ["HLA-DR3", "Type I DM, SLE, Graves, Hashimoto, Addison"]
          - ["HLA-DR4", "Rheumatoid arthritis, type I DM, Addison"]
        hide: [[0, 1], [1, 1]]
        page: 731
        quote: "HLA-DR3 Type I DM, SLE, Graves disease, Hashimoto thyroiditis, Addison disease"
      - kind: aside
        tone: tip
        text: "الـ **DR3** و **DR4** الاتنين فيهم ==type I DM و Addison==. الفرق: الـ DR4 فيه **RA** (فكّر: 4 أرجل = مفاصل)، والـ DR3 فيه الغدة الدرقية (Graves و Hashimoto) والـ SLE."
        page: 731
        quote: "HLA-DR4 Rheumatoid arthritis, type I DM, Addison disease"
      - kind: figure
        title: "الـ bacterial meningitis حسب السن"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <line class="fg-arrow" x1="10" y1="40" x2="350" y2="40" marker-end="url(#rr4a)"/>
            <text x="10" y="28" class="t-sm t-mut">birth</text>
            <line class="fg-ink" x1="150" y1="30" x2="150" y2="50"/>
            <text x="128" y="24" class="t-sm t-b">6 months</text>
            <text x="320" y="28" class="t-sm t-mut">age</text>
            <rect class="fg-acc" x="10" y="60" width="135" height="76" rx="8"/>
            <text x="18" y="80" class="t-sm t-b">0–6 months</text>
            <text x="18" y="98" class="t-sm">Group B strep</text>
            <text x="18" y="114" class="t-sm">E coli</text>
            <text x="18" y="130" class="t-sm">Listeria</text>
            <rect class="fg-good" x="160" y="60" width="190" height="50" rx="8"/>
            <text x="168" y="80" class="t-sm t-b">&gt; 6 months</text>
            <text x="168" y="100" class="t-sm">S pneumoniae</text>
          </svg>
        caption: "في أول 6 شهور الميكروبات جاية من الأم وقت الولادة (vaginal flora: GBS و E coli، و Listeria). بعد كده الـ S pneumoniae هو اللي بيسيطر."
        alt: "Timeline from birth with a mark at 6 months. Before 6 months: group B streptococcus, E coli, Listeria. After 6 months: S pneumoniae."
        page: 731
        quote: "Bacterial meningitis (0–6 months old) Group B streptococcus, E coli, Listeria"
      - kind: explain
        title: "الميكروب حسب المكان"
        text: |-
          - **H pylori** ← gastritis و peptic ulcer و gastric cancers (adenocarcinoma و MALToma).
          - **Opportunistic respiratory infection في AIDS** ← ==Pneumocystis jirovecii==.
          - **Viral encephalitis في الـ temporal lobe** ← HSV-1.
          - **فيروس بعد نقل دم** ← ==hepatitis C==.
          - **Food poisoning (exotoxin)** ← S aureus و B cereus: التوكسين جاهز في الأكل فالأعراض بتيجي بسرعة.
          - **Healthcare-associated pneumonia** ← S aureus و Pseudomonas و enteric gram ⊝ rods.
        page: 731
        quote: "Opportunistic respiratory infection in AIDS Pneumocystis jirovecii"
      - kind: check
        question: "A 30-year-old man has fever, confusion and bizarre behavior. MRI shows edema of the left temporal lobe. Most likely cause?"
        options:
          - "HSV-1"
          - "Hepatitis C"
          - "Pneumocystis jirovecii"
          - "S pneumoniae"
        answer: 0
        why:
          - "صح: viral encephalitis في الـ temporal lobe = HSV-1."
          - "الـ hepatitis C هو الفيروس بتاع نقل الدم، مش encephalitis."
          - "الـ Pneumocystis عدوى رئوية في الـ AIDS."
          - "الـ S pneumoniae بيعمل bacterial meningitis بعد 6 شهور، مش temporal encephalitis."
        page: 731
        quote: "Viral encephalitis affecting temporal lobe HSV-1"
      - kind: explain
        title: "العضم والبول والـ STIs"
        text: |-
          - **Osteomyelitis**: ==S aureus== أشهر حاجة عموماً. في الـ **sickle cell**: Salmonella > S aureus. مع **injection drug use**: S aureus و Pseudomonas و Candida.
          - **UTI** ← E coli و S saprophyticus.
          - **Bacterial STI** ← C trachomatis (D–K).
          - **PID** ← C trachomatis (subacute) و N gonorrhoeae (acute).
        page: 731
        quote: "Osteomyelitis in sickle cell disease Salmonella > S aureus"
      - kind: aside
        tone: trap
        text: "سؤال sickle cell و osteomyelitis: الإجابة الأشهر في العموم (S aureus) هي الـ distractor. الكتاب بيقول ==Salmonella > S aureus== في الـ sickle cell."
        page: 731
        quote: "Osteomyelitis in sickle cell disease Salmonella > S aureus"
      - kind: try
        items: [rr.L04.001, rr.L04.006, rr.L04.015, rr.L04.020, rr.L04.023]
    recap:
      - "Mitochondrial: كل ولاد الأم المصابة، و heteroplasmy."
      - "Down (sporadic) و fragile X (inherited). Folate أشهر deficiency. Gaucher أشهر lysosomal."
      - "DR3: DM1 و SLE و Graves و Hashimoto و Addison. DR4: RA و DM1 و Addison."
      - "Meningitis: 0–6 شهور GBS و E coli و Listeria؛ بعد كده S pneumoniae. Osteomyelitis في sickle cell: Salmonella."
    practice: [rr.L04.001, rr.L04.002, rr.L04.003, rr.L04.004, rr.L04.005, rr.L04.006, rr.L04.007, rr.L04.008, rr.L04.009, rr.L04.010, rr.L04.011, rr.L04.012, rr.L04.013, rr.L04.014, rr.L04.015, rr.L04.016, rr.L04.017, rr.L04.018, rr.L04.019, rr.L04.020, rr.L04.021, rr.L04.022, rr.L04.023, rr.L04.024]
  - id: rr.L04.lesson2
    title: "Metastases وأصوات القلب والـ shunts"
    hook: "S3 ولا S4؟ ventricle واسع ولا ناشف؟ وده يجيب نص أسئلة القلب"
    minutes: 10
    pages: [731, 732]
    topics: [pathology, cardiovascular]
    status: unverified
    steps:
      - kind: table
        title: "الـ metastases بتروح فين وجاية منين"
        columns: ["Site", "Most common primaries"]
        rows:
          - ["Bone", "Prostate, breast >> lung > kidney, colon"]
          - ["Liver", "Colon > breast >> pancreas, lung, prostate"]
          - ["Brain", "Lung > breast >> melanoma > colon, prostate"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 731
        quote: "Metastases to bone Prostate, breast >> lung > kidney, colon"
      - kind: aside
        tone: tip
        text: "الـ **colon** أول واحد في الكبد لأن دمه بيروح للكبد على طول من الـ ==portal vein==. والـ **lung** أول واحد في المخ لأن دمه بيروح على الشريان على طول من غير ما يعدّي على فلتر الرئة."
        page: 731
        quote: "Metastases to liver Colon > breast >> pancreas, lung, prostate"
      - kind: figure
        title: "S3 و S4 فين في الدورة"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="10" y1="70" x2="350" y2="70"/>
            <rect class="fg-dot-acc" x="40" y="45" width="10" height="50"/>
            <text x="34" y="112" class="t-sm t-b">S1</text>
            <rect class="fg-dot-acc" x="140" y="50" width="8" height="40"/>
            <text x="134" y="112" class="t-sm t-b">S2</text>
            <rect class="fg-dot-good" x="185" y="58" width="6" height="24"/>
            <text x="178" y="112" class="t-sm t-good t-b">S3</text>
            <text x="160" y="132" class="t-sm t-mut">early diastole</text>
            <rect class="fg-dot-bad" x="305" y="58" width="6" height="24"/>
            <text x="298" y="112" class="t-sm t-bad t-b">S4</text>
            <text x="260" y="132" class="t-sm t-mut">late diastole</text>
            <text x="70" y="30" class="t-sm">systole</text>
            <text x="200" y="30" class="t-sm">diastole</text>
          </svg>
        caption: "الـ S3 بعد الـ S2 على طول: دم كتير بيقع في ventricle واسع (↑ filling pressure). الـ S4 قبل الـ S1 على طول: الـ atrium بيزق دم في ventricle ناشف."
        alt: "Timeline of one cardiac cycle: S1, then S2, then S3 shortly after S2 in early diastole, and S4 just before the next S1 in late diastole."
        page: 731
        quote: "S3 heart sound ↑ ventricular filling pressure (eg, MR, AR, HF, thyrotoxicosis), common in dilated ventricles"
      - kind: explain
        title: "S3 ضد S4"
        text: |-
          - **S3** ← ==↑ ventricular filling pressure== (MR و AR و HF و thyrotoxicosis)، وشائع في الـ dilated ventricles.
          - **S4** ← ==stiff/hypertrophic ventricle== (aortic stenosis و restrictive cardiomyopathy).

          وباقي الأصوات: **holosystolic** ← VSD و tricuspid regurgitation و mitral regurgitation. **Ejection click** ← aortic stenosis. **Opening snap** ← mitral stenosis. والـ **mitral stenosis** نفسها سببها الأشهر rheumatic heart disease. وأشهر congenital murmur ← MVP.
        page: 731
        quote: "S4 heart sound Stiff/hypertrophic ventricle (aortic stenosis, restrictive cardiomyopathy)"
      - kind: check
        question: "A 70-year-old man with long-standing aortic stenosis has an extra sound just before S1. What does it reflect?"
        options:
          - "A stiff, hypertrophic left ventricle"
          - "Increased filling of a dilated ventricle"
          - "A ventricular septal defect"
          - "Rheumatic mitral stenosis"
        answer: 0
        why:
          - "صح: صوت قبل الـ S1 = S4 = ventricle ناشف و hypertrophic (aortic stenosis)."
          - "دي S3، وبتيجي بعد الـ S2."
          - "الـ VSD بيعمل holosystolic murmur."
          - "الـ mitral stenosis بتعمل opening snap."
        page: 731
        quote: "S4 heart sound Stiff/hypertrophic ventricle (aortic stenosis, restrictive cardiomyopathy)"
      - kind: explain
        title: "الـ shunts"
        text: |-
          - **Early cyanosis (right-to-left)** ← ==tetralogy of Fallot== الأشهر، و D-TGA و truncus arteriosus و TAPVR و tricuspid atresia.
          - **Left-to-right** ← VSD > ASD > PDA.
          - لو الـ left-to-right ما اتصلحش، الضغط في الرئة يعلى لحد ما الـ shunt يقلب right-to-left ← ==Eisenmenger== (late cyanosis).
        page: 732
        quote: "Late cyanotic shunt (uncorrected left-to-right shunt becomes right-to-left) Eisenmenger syndrome (caused by VSD, ASD, PDA)"
      - kind: order
        prompt: "رتّب أماكن الـ atherosclerosis من الأكتر للأقل"
        steps:
          - "Abdominal aorta"
          - "Coronary artery"
          - "Popliteal artery"
          - "Carotid artery"
          - "Circle of Willis"
        why: "الكتاب بيرتبها كده: abdominal aorta > coronary > popliteal > carotid > circle of Willis."
        page: 732
        quote: "Sites of atherosclerosis Abdominal aorta > coronary artery > popliteal artery > carotid artery > circle of Willis"
      - kind: explain
        title: "الـ aorta والـ rhythm"
        text: |-
          - **Thoracic aneurysm** ← Marfan (cystic medial degeneration) و 3° syphilis (endarteritis للـ vasa vasorum).
          - **Abdominal aneurysm** ← atherosclerosis و tobacco.
          - **Aortic dissection** ← ==hypertension== أهم risk factor.
          - **2° hypertension** ← renal/renovascular (fibromuscular dysplasia و renal artery stenosis)، 1° hyperaldosteronism، OSA.
          - **Irregularly irregular من غير P waves** ← AF، و ↑ risk of emboli. **Right HF من سبب رئوي** ← cor pulmonale.
        page: 732
        quote: "Aortic dissection Hypertension (most important risk factor)"
      - kind: match
        prompt: "وصّل الميكروب بقصة الـ endocarditis"
        pairs:
          - ["S aureus", "Acute, injection drug use, tricuspid"]
          - ["Viridans streptococci", "Subacute, dental procedure"]
          - ["S gallolyticus", "Colon cancer"]
          - ["Coxiella, Bartonella", "Culture ⊝"]
        why: "والـ valve: ==mitral > aortic==، والـ tricuspid مع الـ injection drug use لأن الحقنة بتدخل الـ venous side الأول. والـ gram ⊝ هي HACEK."
        page: 732
        quote: "S aureus (acute, injection drug use, tricuspid valve), viridans streptococci (subacute, dental procedure), S gallolyticus (colon cancer)"
      - kind: explain
        title: "أورام القلب و Virchow"
        text: |-
          - **Adults**: أشهر ورم في القلب ==metastasis==؛ والـ primary الأشهر **myxoma** (75%–80% في الـ left atrium، وبيعمل «ball valve»).
          - **Children**: rhabdomyoma، مع ==tuberous sclerosis==.
          - **Hypercoagulability + endothelial damage + stasis** ← Virchow triad (↑ risk of thrombosis).
        page: 732
        quote: "Cardiac tumor (adults) Metastasis, myxoma (75%–80% in left atrium; “ball valve”)"
      - kind: try
        items: [rr.L04.027, rr.L04.029, rr.L04.036, rr.L04.040, rr.L04.047]
    recap:
      - "Bone: prostate و breast. Liver: colon. Brain: lung."
      - "S3 = ventricle واسع و filling عالي. S4 = ventricle ناشف. Opening snap = mitral stenosis، ejection click = aortic stenosis."
      - "Early cyanosis = TOF. Left-to-right: VSD > ASD > PDA. Eisenmenger = shunt قلب."
      - "Dissection = HTN. S gallolyticus = colon cancer. Myxoma في الـ LA، rhabdomyoma مع tuberous sclerosis."
    practice: [rr.L04.025, rr.L04.026, rr.L04.027, rr.L04.028, rr.L04.029, rr.L04.030, rr.L04.031, rr.L04.032, rr.L04.033, rr.L04.034, rr.L04.035, rr.L04.036, rr.L04.037, rr.L04.038, rr.L04.039, rr.L04.040, rr.L04.041, rr.L04.042, rr.L04.043, rr.L04.044, rr.L04.045, rr.L04.046, rr.L04.047, rr.L04.048, rr.L04.049, rr.L04.050, rr.L04.051]
  - id: rr.L04.lesson3
    title: "الغدد: أشهر سبب لكل خلل"
    hook: "الـ hypoparathyroidism أشهر سببه الجرّاح، والـ Cushing syndrome أشهر سببه الدوا. الكتاب بيحب الإجابات العملية دي"
    minutes: 8
    pages: [732, 733]
    topics: [endocrine]
    status: unverified
    steps:
      - kind: explain
        title: "الغدة الدرقية والـ parathyroid"
        text: |-
          - **CAH** ← ==21-hydroxylase deficiency==.
          - **Hypopituitarism** ← pituitary adenoma: الكتلة بتضغط على باقي الغدة فتقل إفرازاتها (mass effect).
          - **Congenital hypothyroidism** ← thyroid dysgenesis/dyshormonogenesis و iodine deficiency.
          - **Thyroid cancer** ← ==papillary carcinoma== (RET rearrangements و BRAF mutations و childhood irradiation).
        page: 732
        quote: "Thyroid cancer Papillary carcinoma (RET/PTC rearrangements, BRAF mutations, childhood irradiation)"
      - kind: reveal
        prompt: "إيه أشهر سبب للـ hypoparathyroidism، وليه؟"
        answer: "==Accidental excision during thyroidectomy==. الـ parathyroid glands صغيرة جداً ولازقة في ضهر الـ thyroid، فالجرّاح ممكن يشيلها من غير ما ياخد باله."
        page: 732
        quote: "Hypoparathyroidism Accidental excision during thyroidectomy"
      - kind: explain
        title: "1° ولا 2° hyperparathyroidism؟"
        text: |-
          - **1°** ← adenomas أو hyperplasia: الغدة نفسها هي المشكلة.
          - **2°** ← ==hypocalcemia of CKD==: الكلية مش قادرة تمسك الكالسيوم وتعمل vitamin D، فالـ Ca²⁺ يقل والـ parathyroid تشتغل زيادة كرد فعل.
        page: 732
        quote: "2° hyperparathyroidism Hypocalcemia of chronic kidney disease"
      - kind: figure
        title: "ACTH بيقولك المصدر فين"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="110" y="8" width="140" height="30" rx="8"/>
            <text x="122" y="28" class="t-sm t-b">↑ cortisol + ACTH?</text>
            <line class="fg-arrow" x1="140" y1="38" x2="70" y2="68" marker-end="url(#rr4b)"/>
            <line class="fg-arrow" x1="220" y1="38" x2="280" y2="68" marker-end="url(#rr4b)"/>
            <rect class="fg-box" x="10" y="70" width="130" height="56" rx="8"/>
            <text x="18" y="88" class="t-sm t-b">↓ ACTH</text>
            <text x="18" y="104" class="t-sm">Exogenous steroids</text>
            <text x="18" y="120" class="t-sm">Adrenal adenoma</text>
            <rect class="fg-acc" x="200" y="70" width="150" height="30" rx="8"/>
            <text x="210" y="90" class="t-sm t-b">↑ ACTH: high-dose dex</text>
            <line class="fg-arrow" x1="240" y1="100" x2="220" y2="130" marker-end="url(#rr4b)"/>
            <line class="fg-arrow" x1="320" y1="100" x2="320" y2="130" marker-end="url(#rr4b)"/>
            <rect class="fg-good" x="160" y="132" width="110" height="56" rx="8"/>
            <text x="166" y="150" class="t-sm t-b">Suppresses</text>
            <text x="166" y="166" class="t-sm">Cushing disease</text>
            <text x="166" y="182" class="t-sm t-mut">(pituitary)</text>
            <rect class="fg-bad" x="276" y="132" width="78" height="56" rx="8"/>
            <text x="282" y="150" class="t-sm t-b">No</text>
            <text x="282" y="166" class="t-sm">Ectopic</text>
            <text x="282" y="182" class="t-sm">ACTH</text>
          </svg>
        caption: "الـ pituitary adenoma لسه بيسمع شوية للـ feedback، فالجرعة العالية من الـ dexamethasone بتنزّل الـ ACTH والـ cortisol. الـ ectopic ACTH ما بيسمعش."
        alt: "Decision tree: high cortisol. Low ACTH means exogenous steroids or adrenal adenoma. High ACTH leads to a high-dose dexamethasone test: suppression means Cushing disease (pituitary), no suppression means ectopic ACTH."
        page: 732
        quote: "Cushing disease ↓ ACTH and ↓ cortisol in high-dose dexamethasone suppression test, ↑ ACTH and ↑ cortisol in CRH stimulation test"
      - kind: explain
        title: "أسباب الـ Cushing syndrome"
        text: |-
          1. ==Exogenous glucocorticoids== (الأشهر).
          2. Adrenocortical adenoma (بيطلّع cortisol زيادة).
          3. ACTH-secreting pituitary adenoma = **Cushing disease**.
          4. Paraneoplastic: ACTH من ورم.

          والـ **Cushing disease** في التحاليل: ↓ ACTH و ↓ cortisol مع الـ high-dose dexamethasone، و ↑ ACTH و ↑ cortisol مع الـ ==CRH stimulation==.
        page: 732
        quote: "Cushing syndrome (↑ cortisol) Exogenous glucocorticoids; adrenocortical adenoma (secretes excess cortisol); ACTH-secreting pituitary adenoma (Cushing disease); paraneoplastic (due to ACTH secretion by tumors)"
      - kind: check
        question: "A 4-year-old has an abdominal mass arising from the adrenal medulla. Most likely tumor?"
        options:
          - "Neuroblastoma"
          - "Pheochromocytoma"
          - "Adrenocortical adenoma"
          - "Bilateral adrenal hyperplasia"
        answer: 0
        why:
          - "صح: ورم الـ adrenal medulla في الأطفال = neuroblastoma (malignant)."
          - "الـ pheochromocytoma هو ورم الـ medulla في الكبار (usually benign)."
          - "الـ adrenocortical adenoma من الـ cortex، مش الـ medulla، وبيعمل Cushing أو Conn."
          - "الـ bilateral adrenal hyperplasia سبب للـ 1° hyperaldosteronism."
        page: 732
        quote: "Tumor of the adrenal medulla (children) Neuroblastoma (malignant)"
      - kind: explain
        title: "Conn و Zollinger-Ellison"
        text: |-
          - **1° hyperaldosteronism** ← bilateral adrenal hyperplasia أو adenoma (==Conn syndrome==).
          - **Refractory peptic ulcers + ↑ gastrin (حتى بعد الـ secretin test)** ← ==Zollinger-Ellison==: ورم بيطلّع gastrin في الـ duodenum أو الـ pancreas، ومرتبط بـ **MEN1**.
        page: 733
        quote: "Refractory peptic ulcers and gastrin levels (even after the secretin test) Zollinger-Ellison syndrome (due to gastrin-secreting tumor of the duodenum or pancreas), associated with MEN1"
      - kind: aside
        tone: exam
