        text: |-
          - **Bladder outlet obstruction في الرجالة** ← BPH.
          - **Pulmonary hypertension** ← idiopathic، left heart disease، lung disease/hypoxia، chronic thromboembolism، multifactorial.
          - **SIADH** ← ==small cell carcinoma of the lung==: الورم نفسه بيطلّع ADH، فالمية بتتحبس والصوديوم يقل.
        page: 735
        quote: "SIADH Small cell carcinoma of the lung"
