          - ["Ovarian tumor, malignant", "Serous carcinoma"]
          - ["Benign myometrium tumor", "Leiomyoma (estrogen sensitive, not precancerous)"]
          - ["Gynecologic malignancy", "Endometrial (resource-rich); cervical (worldwide)"]
          - ["Breast tumor, benign, young woman", "Fibroadenoma"]
