        caption: "الـ silicosis بتصيب الـ upper lobes (ومعاها ↑ TB risk)، والـ asbestosis الـ lower lobes (ferruginous bodies). والـ foreign body بيروح الـ right main bronchus لأنه أكتر vertical."
        alt: "Sketch of the trachea and both lungs. Silicosis is marked in the upper lobe with silica exposure and higher TB risk; asbestosis in the lower lobe with ferruginous bodies; a foreign body lodges in the more vertical right main bronchus."
