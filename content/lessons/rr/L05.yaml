  - id: rr.L05.lesson6
    title: "الكلى والـ reproductive والرئة: آخر الـ pivots"
    hook: "Calcium gluconate قبل Kayexalate، و silicosis فوق و asbestosis تحت، والطفل اللي بيـ wheeze من ناحية واحدة"
    minutes: 10
    pages: [742, 743]
    topics: [renal, reproductive, respiratory]
    status: unverified
    steps:
      - kind: explain
        title: "Renal: الـ creatinine بيعلى"
        text: |-
          - **creatinine بيعلى بعد عملية**: مش ATN؛ ده ==prerenal azotemia==: BUN:Cr >20:1 و FENa <1% وبيستجيب للـ fluids. الكلية سليمة وبتمسك الصوديوم، فالـ FENa واطي.
          - **AKI على NSAIDs**: acute interstitial nephritis: drug exposure (penicillins، cephalosporins) و eosinophilia و WBC casts.
          - **طفل عنده nephrotic syndrome مفاجئ**: ==minimal change disease==: age <10، foot process effacement على الـ EM، و steroid responsive، مش FSGS.
        page: 742
        quote: "BUN:Cr ratio >20:1 + FeNa <1% + fluid responsive"
      - kind: check
        question: "Euvolemic hyponatremia with urine osmolality of 450 mOsm/kg. Which answer over psychogenic polydipsia?"
        options:
          - "SIADH"
          - "Psychogenic polydipsia"
          - "Prerenal azotemia"
          - "Fanconi syndrome"
        answer: 0
        why:
          - "صح: الـ urine concentrated (UOsm >300)، يعني الـ ADH شغال غلط."
          - "ده الـ distractor: الـ psychogenic polydipsia بتعمل dilute urine."
          - "Prerenal مش euvolemic hyponatremia."
          - "Fanconi = proximal tubule defects."
        page: 742
        quote: "Concentrated urine (UOsm >300; vs dilute urine in psychogenic polydipsia)"
      - kind: aside
        tone: exam
        text: "Severe hyperkalemia مع ECG changes؟ أول حاجة ==calcium gluconate==: الـ arrhythmia محتاجة membrane stabilization فوراً، وبعدين نعالج الـ hyperkalemia. الـ Kayexalate هو الـ distractor."
        page: 742
        quote: "Presence of cardiac arrhythmia requires immediate membrane stabilization first, then treat hyperkalemia"
      - kind: explain
        title: "3 pivots كلوية كمان"
        text: |-
          - **شاب عنده hemoptysis و hematuria**: ==anti-GBM disease== (Goodpasture): anti-GBM Ab+، linear IgG على الـ IF، type II hypersensitivity. الـ GPA هو الـ distractor.
          - **طفل عنده MAHA و thrombocytopenia و AKI بعد إسهال**: ==HUS== من Shiga toxin (S dysenteriae أو E coli O157:H7)، مش TTP.
          - **طفل عنده growth failure و rickets**: Fanconi syndrome: multiple PT defects (acidosis، hypokalemia، hypovolemia من polyuria)، مش vitamin D deficiency بس.
        page: 742
        quote: "Infection with a Shiga toxin–producing organism (eg, S dysenteriae or some serotypes of E coli, eg, O157:H7)"
      - kind: explain
        title: "Reproductive: صفحة 742"
        text: |-
          - **irregular periods و obesity و ↑ androgens**: ==PCOS== (insulin resistance، LH:FSH >2:1، polycystic ovaries على الـ US)، مش Cushing.
          - **hypertension و proteinuria جديدة في الحمل** مع hemolysis (↑ LDH، schistocytes) و ↑ LFTs و ↓ platelets: **HELLP**، مش preeclampsia بس.
          - **↓ libido و ↓ sperm count**: pituitary tumor (prolactinoma): ↑ prolactin، visual field changes، mass على الـ MRI، مش Klinefelter.
          - سطرين AIS و MRKH: الجواب AIS معاه 46,XY و functioning gonads و ↑ testosterone و blind vaginal pouch؛ و MRKH معاه normal ovarian function و absent uterus و upper vagina. خد بالك: خانات الـ shared features في السطرين دول شكلها متبدلة في الكتاب. AIS دايمًا 46,XY ومعاه testes؛ «46,XX with functioning ovaries» ده وصف MRKH؛ والـ streak gonads مش بتاعة الاتنين، دي Turner / gonadal dysgenesis.
        page: 742
        quote: "Insulin resistance, LH:FSH >2:1, polycystic ovaries on ultrasound"
      - kind: check
        question: "A pregnant woman has new hypertension and proteinuria plus ↑ LDH, schistocytes, ↑ LFTs and low platelets. Answer?"
        options:
          - "HELLP syndrome"
          - "Preeclampsia alone"
          - "PCOS"
          - "Pituitary tumor"
        answer: 0
        why:
          - "صح: Hemolysis و Elevated Liver enzymes و Low Platelets."
          - "الـ preeclampsia هي الـ distractor: بتفسر الضغط والبروتين بس."
          - "PCOS مالهاش علاقة بالحمل والـ hemolysis."
          - "الـ pituitary tumor بيعمل ↑ prolactin و visual field changes."
        page: 742
        quote: "Hemolysis (↑ LDH, schistocytes), ↑ LFTs, ↓ platelets"
      - kind: explain
        title: "Reproductive: صفحة 743"
        text: |-
          - **anovulation في ست obese**: لو ↑ FSH و LH و ↓ estrogen (menopausal pattern) يبقى ==premature ovarian failure==، مش PCOS.
          - **clomiphene و spotting**: مش miscarriage؛ ده ovarian hyperstimulation syndrome: ovaries كبيرة، ascites، hemoconcentration.
          - **breast lumps بتتغير**: fibrocystic change (multiple bilateral، الوجع مع الـ cycle، green discharge)، مش fibroadenoma.
          - **dysmenorrhea**: endometriosis (chocolate cysts، dyspareunia)، مش PID.
          - **painless testicular mass**: ==testicular cancer== لو ما بيعملش transillumination (↑ AFP في nonseminoma، ↑ β-hCG في choriocarcinoma)، والعلاج radical orchiectomy، مش varicocele.
        page: 743
        quote: "↑ FSH and LH, ↓ estrogen, menopausal gonadotropin pattern"
