      - kind: explain
        title: "5 pivots كمان في 741"
        text: |-
          - **dementia بتنزل steps مع focal deficits**: ==vascular dementia==، مش AD.
          - **back pain و bladder و saddle anesthesia**: cauda equina = unilateral، asymmetric، radicular pain، LMN. الـ conus medullaris = sudden، bilateral، symmetric، LMN/UMN.
          - **ست عندها ↑ ICP و papilledema**: idiopathic intracranial hypertension: ↑ opening pressure و imaging **normal** (مش brain tumor).
          - **café-au-lait و tumors في طفل**: NF1 (neurofibromas، optic gliomas، Lisch nodules). الـ NF2 = bilateral vestibular schwannomas.
          - **movement disorder و psychiatric symptoms في شاب**: ==Wilson disease== (hepatic disease، Kayser-Fleischer rings، ↓ ceruloplasmin)، مش Huntington.
        page: 741
        quote: "Cauda equina = unilateral, asymmetric + radicular pain, LMN signs; Conus medullaris = sudden, bilateral, symmetric, LMN/UMN signs"
      - kind: reveal
        prompt: "مريض عنده deficits شديدة بعد ما صلّحوا الـ Na+ بسرعة. إمتى osmotic demyelination وإمتى cerebral edema؟"
        answer: "الاتجاه هو اللي بيحسم: رفع الـ Na+ بسرعة (↑) = **central pontine myelinolysis** (osmotic demyelination). نزول الـ Na+ بسرعة (↓) = **cerebral edema**، لأن المية بتدخل خلايا المخ."
        page: 741
        quote: "Rapid ↑ Na+ = central pontine myelinolysis; rapid ↓ Na+ = cerebral edema"
      - kind: order
        prompt: "رتّب الـ extrapyramidal adverse effects زي ما الكتاب كاتبها"
        steps:
          - "Acute dystonia"
          - "Akathisia"
          - "Parkinsonism"
          - "Tardive dyskinesia"
        why: "مريض على antipsychotics عنده restlessness و rigid movements: الجواب acute extrapyramidal adverse effects، والـ parkinsonism مجرد خطوة واحدة في الـ spectrum ده."
        page: 741
        quote: "Spectrum: acute dystonia → akathisia → parkinsonism → tardive dyskinesia"
      - kind: explain
        title: "Psychiatry: الدوا عمل إيه؟"
        text: |-
          - **galactorrhea على antipsychotic**: ==risperidone==: dopamine antagonism ← ↑ prolactin ← galactorrhea و gynecomastia. الـ olanzapine شهرته weight gain.
          - **fever و mental status بعد psych meds مع hyperreflexia و clonus**: serotonin syndrome، وقف الأدوية و ممكن cyproheptadine.
        page: 741
        quote: "Dopamine receptor antagonism → ↑ prolactin → galactorrhea, gynecomastia"
      - kind: check
        question: "Fever, lead-pipe rigidity and ↑ CK after a neuroleptic. Which answer and treatment?"
        options:
          - "NMS; dantrolene or bromocriptine"
          - "Serotonin syndrome; cyproheptadine"
          - "TCA overdose; supportive care only"
          - "Acute dystonia; nothing needed"
        answer: 0
        why:
          - "صح: NMS: lead-pipe rigidity و ↑ CK، وعلاجه dantrolene أو bromocriptine."
          - "ده الـ distractor: الـ serotonin syndrome فيه hyperreflexia و clonus مش lead-pipe."
          - "TCA overdose: dry mouth و urinary retention و arrhythmias (anticholinergic و cardiotoxic)."
          - "الـ dystonia مش بتعمل fever و ↑ CK."
        page: 742
        quote: "Lead-pipe rigidity, ↑ CK, treat with dantrolene or bromocriptine"
      - kind: try
