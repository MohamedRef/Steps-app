        text: |-
          - **كبير في السن عنده joint pain و stiffness**: ==osteoarthritis==: asymmetric، DIP +/– PIP، و**بيتحسن بالراحة**. الـ rheumatoid arthritis هو الـ distractor.
          - **شاب عنده chronic back pain**: ==ankylosing spondylitis== (HLA-B27): **بيتحسن بالحركة**، و sacroiliitis على الأشعة (bamboo spine). الـ mechanical back pain بالعكس.

          القاعدة: الألم الـ inflammatory بيتحسن بالحركة، والـ mechanical/degenerative بيتحسن بالراحة.
