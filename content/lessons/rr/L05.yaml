  - id: rr.L05.lesson4
    title: "الدم والعضم والجلد: الـ clue اللي بيقلب الإجابة"
    hook: "نزيف في المفصل ولا في اللثة؟ ألم بيتحسن بالراحة ولا بالحركة؟ سؤال واحد بيحسم"
