        text: |-
          - **chest pain جامد بعد vomiting**: Mallory-Weiss ده tear سطحي. لو فيه crepitus (==Hamman sign==) و هوا في الـ mediastinum يبقى **Boerhaave** (transmural rupture) وخطر sepsis.
          - **epigastric pain مرتبط بالأكل**: لو الألم ↓ مع الأكل والوزن بيزيد يبقى ==duodenal ulcer==؛ والـ posterior duodenal ulcer بينزف من الـ gastroduodenal artery.
          - **chronic diarrhea**: Crohn لو فيه transmural skip lesions و noncaseating granulomas و creeping fat و fistulas.
          - **ست في منتصف العمر عندها pruritus و cholestasis**: PBC (anti-mitochondrial Ab ⊕، Sjögren)، مش PSC.
          - **RUQ pain مع fever**: لو Charcot triad (ومعاها hypotension و confusion = Reynolds pentad) يبقى ascending cholangitis، مش cholecystitis.
