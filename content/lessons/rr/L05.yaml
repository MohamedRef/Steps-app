      - kind: explain
        title: "Respiratory"
        text: |-
          - **dyspnea و tachycardia مفاجئة**: مش asthma؛ ده ==PE==: respiratory alkalosis، V/Q mismatch، و risk factors (عملية، immobilization، hypercoagulable state).
          - **راجل عنده chest pain مفاجئ**: spontaneous pneumothorax لو طويل ورفيع، hyperresonance، و absent breath sounds، مش MI.
          - **post-stroke مع fever و cough**: aspiration pneumonia: dependent lobes (الـ RLL واقف)، anaerobes، sputum ريحته وحشة، مش influenza.
          - **dyspnea مع wheezing**: HFrEF لو ↑ BNP و pulmonary edema و orthopnea، مش asthma.
          - **chronic cough و hemoptysis**: bronchiectasis (cystic fibrosis، Kartagener، copious purulent sputum)، مش lung cancer.
          - الكتاب كاتب «CGD with skin findings» وجوابه ==sarcoidosis== (bilateral hilar lymphadenopathy، ↑ ACE، hypercalcemia)، والـ distractor TB. «CGD» هنا مش chronic granulomatous disease (دي مرض immunology مالوش علاقة)؛ الأرجح المقصود granulomatous disease (noncaseating granulomas) مع skin findings زي erythema nodosum و lupus pernio.
        page: 743
        quote: "Tall, thin body habitus; hyperresonance; absent breath sounds"
