        title: "Hematology/Oncology"
        text: |-
          - **microcytosis مع low ferritin و ↑ TIBC**: ==iron deficiency anemia==. الـ ferritin الواطي هو المفتاح. الـ ACD: iron واطي و TIBC **واطي** و ferritin normal أو ↑ (الـ ferritin acute phase reactant).
          - **bite cells و Heinz bodies**: G6PD deficiency، مش thalassemia: oxidant stress (sulfa، fava، infection) و hemolysis على نوبات.
          - **owl-eye nuclei**: ==Hodgkin lymphoma==: CD15+ CD30+، bimodal age، B symptoms، و EBV.
        page: 739
        quote: "Low ferritin is key; ACD = low iron + low TIBC + normal/↑ ferritin"
      - kind: figure
        title: "النزيف فين؟"
        svg: |-
