lessons:
  - id: rr.L05.lesson1
    title: "Exam pivots: Biochemistry و Immunology"
    hook: "السؤال بيحطلك إجابة شبه الصح بالظبط. الفرق في clue واحد، ولو عرفته مش هتقع تاني"
    minutes: 9
    pages: [735, 736]
    topics: [biochemistry, immunology]
    goals:
      - "تفهم فكرة الـ exam pivot: نفس الصورة، إجابتين، وclue واحد بيفرق"
      - "تفرّق بين أشهر أمراض الـ biochemistry اللي بتتشابه"
      - "تعرف ليه CGD هو الـ distractor المفضل في الـ immunology"
    status: unverified
    steps:
      - kind: explain
        title: "يعني إيه exam pivot؟"
        text: |-
          الجدول ده جديد في طبعة 2026: كل سطر فيه **shared clinical features** (الصورة اللي بتتشابه)، و**common distractor** (الإجابة اللي بتشدك)، و**correct answer**، والـ ==differentiating clues== اللي بتفرق.

          أول مثال: hemolytic anemia مع ↑ reticulocytes و↑ indirect bilirubin. عقلك هيقول G6PD deficiency على طول. بس لو السؤال قال ↑ 2,3-BPG أو echinocytes، يبقى ==pyruvate kinase deficiency==.

          ليه؟ الـ PK بيعمل ATP في الـ glycolysis. الـ RBC مالهاش mitochondria، فلو الـ ATP قل، الـ Na+/K+-ATPase يقف، الخلية تبوظ وتتكسر. والـ 2,3-BPG بيتراكم قبل الخطوة الواقفة، فيقلل الـ O2 affinity. وهو autosomal recessive فبيجي للبنات والولاد (G6PD بيجي للولاد أكتر لأنه X-linked).
        page: 735
        quote: "Involves ↓ ATP → ↓ Na+/K+-ATPase function → echinocytes/hemolysis; hallmark is ↑ 2,3-BPG (→ ↓ O2 affinity); autosomal recessive (affects both sexes)"
      - kind: figure
        title: "شكل كل pivot"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="90" y="8" width="180" height="50" rx="8"/>
            <text x="180" y="28" text-anchor="middle" class="t-sm t-b">Hemolytic anemia</text>
            <text x="180" y="46" text-anchor="middle" class="t-sm">↑ retics, ↑ indirect bili</text>
            <line class="fg-arrow" x1="150" y1="58" x2="85" y2="95" marker-end="url(#rr5a)"/>
            <line class="fg-arrow" x1="210" y1="58" x2="275" y2="95" marker-end="url(#rr5a)"/>
            <rect class="fg-bad" x="8" y="98" width="160" height="94" rx="8"/>
            <text x="88" y="118" text-anchor="middle" class="t-sm t-bad t-b">Distractor</text>
            <text x="88" y="138" text-anchor="middle" class="t-sm">G6PD deficiency</text>
            <text x="88" y="158" text-anchor="middle" class="t-sm t-mut">X-linked</text>
            <text x="88" y="176" text-anchor="middle" class="t-sm t-mut">oxidant triggers</text>
            <rect class="fg-good" x="192" y="98" width="160" height="94" rx="8"/>
            <text x="272" y="118" text-anchor="middle" class="t-sm t-good t-b">Correct answer</text>
            <text x="272" y="138" text-anchor="middle" class="t-sm">Pyruvate kinase def.</text>
            <text x="272" y="158" text-anchor="middle" class="t-sm">↑ 2,3-BPG, echinocytes</text>
            <text x="272" y="176" text-anchor="middle" class="t-sm">AR: both sexes</text>
          </svg>
        caption: "كل سطر في الجدول بالشكل ده: صورة مشتركة فوق، الـ distractor على الشمال، والإجابة الصح على اليمين ومعاها الـ clue اللي بيحسم."
        alt: "Diagram: hemolytic anemia with high reticulocytes and indirect bilirubin branches to the distractor G6PD deficiency (X-linked, oxidant triggers) and to the correct answer pyruvate kinase deficiency (high 2,3-BPG, echinocytes, autosomal recessive)."
        page: 735
        quote: "Involves ↓ ATP → ↓ Na+/K+-ATPase function → echinocytes/hemolysis; hallmark is ↑ 2,3-BPG"
      - kind: reveal
        prompt: "مراهق طويل ورفيع (Marfanoid) وعنده lens dislocation. إمتى تقول homocystinuria مش Marfan؟"
        answer: "لما الـ lens تنزل **inferomedial** (في Marfan بتطلع **superotemporal**)، ولما يكون فيه ↑ risk of **thrombosis**. وكمان homocystinuria بتستجيب لـ vitamin B6 و B12."
        page: 735
        quote: "↑ risk of thrombosis and inferomedial lens dislocation (vs Marfan: superotemporal dislocation); responsive to vitamin B6 and B12 supplementation"
      - kind: check
        question: "A toddler has fasting hypoglycemia and hepatomegaly. Which single finding points to von Gierke rather than Cori disease?"
        options:
          - "Lactic acidosis"
          - "Hepatomegaly"
          - "Fasting hypoglycemia"
          - "Onset in early childhood"
        answer: 0
        why:
          - "صح: von Gierke هو الـ «super-sick» kid، فيه lactic acidosis. Cori هو الـ «not-so-sick» kid من غيرها."
          - "الاتنين عندهم hepatomegaly، دي الصورة المشتركة مش الـ clue."
          - "الـ fasting hypoglycemia في الاتنين."
          - "الاتنين بيبانوا في الطفولة."
        page: 736
        quote: "Lactic acidosis present (“super-sick” kid); absent in Cori (“not-so-sick” kid)"
      - kind: explain
        title: "باقي الـ Biochemistry"
        text: |-
          - **I-cell disease** مش Hurler: الـ Golgi مش بيحط mannose-6-phosphate على الـ lysosomal enzymes، فبدل ما تروح الـ lysosome بتطلع برا الخلية ← ==↑↑ plasma lysosomal enzymes== و gingival hyperplasia.
          - **DNA repair**: لو الـ defect بيخلي الـ UV dimers ما تتشالش (pyrimidine dimers) يبقى **nucleotide-excision repair** ← xeroderma pigmentosum و skin cancer، مش base-excision.
          - **colorectal cancer في عيلة كاملة**: ==Lynch syndrome== (defective MMR) مع microsatellite instability، مش FAP.
        page: 736
        quote: "Golgi apparatus fails to tag lysosomal"
      - kind: aside
        tone: exam
        text: "خد بالك: في الـ Immunology الـ ==CGD== هو الـ distractor في 3 سطور. الامتحان عارف إنك حافظه، فبيحطه جنب أي recurrent infections. اسأل نفسك: الـ infection نوعها إيه؟ Neisseria؟ mycobacteria؟ skin مع retained teeth؟"
        page: 736
        quote: "Infection with Neisseria (to which patients with terminal complement defects are uniquely susceptible)"
      - kind: table
        title: "لما الـ distractor يكون CGD"
        columns: ["Presentation", "Correct answer", "Clue"]
        rows:
          - ["Teen with recurrent infections", "C5-C9 (MAC) deficiency", "Neisseria infections"]
          - ["Infant with disseminated mycobacterial/BCG infection", "IL-12 receptor deficiency", "Defective Th1 → ↓ IFN-γ"]
          - ["Child with recurrent skin infection", "Job syndrome (hyper-IgE)", "Coarse facies, retained teeth, ↓ Th17"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 736
        quote: "Defective Th1 response → ↓ IFN-γ → severe mycobacterial infections"
      - kind: check
        question: "A boy has recurrent sinopulmonary infections with low IgG and IgA. What finding points to CD40L deficiency rather than CVID?"
        options:
          - "↑ IgM"
          - "Low IgA"
          - "Recurrent sinusitis"
          - "Male sex alone"
        answer: 0
        why:
          - "صح: الـ T cell مش بيكلم الـ B cell (CD40L)، فمفيش class switching، فالـ IgM بيعلى. الـ CVID مفيهوش ↑ IgM."
          - "الـ IgA واطي في الاتنين."
          - "الـ sinopulmonary infections هي الصورة المشتركة."
          - "الولد لوحده مش clue كفاية، الـ IgM هو اللي بيحسم."
        page: 736
        quote: "Defective T-cell interaction with B cells → impaired class switching → ↑ IgM, ↓ IgG/IgA (vs no ↑ IgM in CVID)"
      - kind: explain
        title: "4 pivots كمان"
        text: |-
          - **ورم في الوش والشفايف من غير urticaria**: ==hereditary angioedema== (bradykinin)، مش anaphylaxis. وممكن الـ ACE inhibitors تفجّرها لأنها بتزود الـ bradykinin.
          - **rash بعد دوا مع systemic reaction**: type III hypersensitivity، مش type I (والـ Arthus reaction local بس).
          - **ولد عنده immunodeficiency و ↑ malignancy**: Wiskott-Aldrich لو فيه thrombocytopenia و eczema؛ ataxia-telangiectasia لو فيه ataxia و ↑ AFP و telangiectasias.
          - **infections مع autoimmune و allergy**: ==selective IgA deficiency== (↓ IgA بس، و giardiasis)، مش CVID.
        page: 736
        quote: "Mediated by bradykinin; lacks urticaria; can be precipitated by ACE inhibitors"
      - kind: check
        question: "A boy with recurrent infections has eczema and thrombocytopenia. Which is the answer the table wants, over ataxia-telangiectasia?"
        options:
          - "Wiskott-Aldrich syndrome"
          - "Selective IgA deficiency"
          - "Hereditary angioedema"
          - "IL-12 receptor deficiency"
        answer: 0
        why:
          - "صح: X-linked recessive مع thrombocytopenia و eczema."
          - "IgA deficiency فيها ↓ IgA و giardiasis، مش eczema مع thrombocytopenia."
          - "HAE بيعمل swelling بالـ bradykinin، مش infections."
          - "IL-12 receptor بيعمل mycobacterial infections."
        page: 736
        quote: "X-linked recessive; thrombocytopenia, eczema (vs ataxia-telangiectasia: ataxia, ↑ AFP, telangiectasias, café-au-lait spots)"
      - kind: try
        items: [rr.L05.001, rr.L05.005, rr.L05.009, rr.L05.011, rr.L05.016]
    recap:
      - "كل pivot: صورة مشتركة، distractor، إجابة صح، و clue بيحسم."
      - "PK deficiency: ↑ 2,3-BPG و autosomal recessive. von Gierke: lactic acidosis."
      - "CGD distractor: Neisseria = MAC، mycobacteria = IL-12R، retained teeth = Job."
      - "↑ IgM = CD40L. ↓ IgA بس = selective IgA deficiency."
    practice: [rr.L05.001, rr.L05.002, rr.L05.003, rr.L05.004, rr.L05.005, rr.L05.006, rr.L05.007, rr.L05.008, rr.L05.009, rr.L05.010, rr.L05.011, rr.L05.012, rr.L05.013, rr.L05.014, rr.L05.015, rr.L05.016, rr.L05.017, rr.L05.018]

  - id: rr.L05.lesson2
    title: "Microbiology و Pathology و Pharmacology: مين الحقيقي؟"
    hook: "C tetani ولا C perfringens؟ CMV ولا EBV؟ و p = 0.06 significant ولا لأ؟"
    minutes: 9
    pages: [736, 738]
    topics: [microbiology, pathology, pharmacology, public-health]
    status: unverified
    steps:
      - kind: explain
        title: "meningitis بـ gram ⊝"
        text: |-
          الـ CSF فيه gram ⊝ organism، فعقلك يروح لـ Hib. بس لو فيه ==epidemics== و **petechial rash** و capsule يبقى ==N meningitidis==.

          والـ clue الشكلي: الـ H influenzae **coccobacillus**، والـ meningococcus diplococcus. والـ vaccines بتغطي types A و C و Y و W-135.
        page: 736
        quote: "Epidemics + petechial rash + capsule; vaccines cover types A, C, Y, W-135; H influenzae is a coccobacillus"
      - kind: table
        title: "Microbiology pivots في صفحة واحدة"
        columns: ["Presentation", "Distractor", "Correct answer", "Clue"]
        rows:
          - ["Wound infection, gram ⊕ anaerobic spore-forming bacillus", "C tetani", "C perfringens", "Alpha toxin → gas gangrene + bullae"]
          - ["Mono-like illness", "CMV", "EBV", "⊕ heterophile (Monospot)"]
          - ["Systemic budding yeast", "B dermatitidis", "C neoformans", "Mucicarmine capsule, pigeon droppings"]
          - ["Giemsa stain in blood or tissue", "Chlamydia or Rickettsia", "Trypanosomes/Plasmodium", "Blood smear parasites"]
          - ["Acid-fast on Ziehl-Neelsen", "M tuberculosis", "Nocardia", "Branching filaments, brain abscess"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2]]
        page: 737
        quote: "Alpha toxin (phospholipase) → gas gangrene + bullae, rapid spread"
      - kind: check
        question: "A child with sickle cell disease has fever and focal bone pain from osteomyelitis. Which organism does the table want?"
        options:
          - "Salmonella"
          - "S aureus"
          - "Nocardia"
          - "C perfringens"
        answer: 0
        why:
          - "صح: Salmonella هو الأشهر في الـ sickle cell disease."
          - "S aureus هو الأشهر overall، وده بالظبط الـ distractor."
          - "Nocardia بيعمل brain abscesses و lung disease."
          - "C perfringens بيعمل gas gangrene في الجروح."
        page: 737
        quote: "Salmonella most common in sickle cell disease; S aureus most common overall"
      - kind: reveal
        prompt: "مريض HIV عنده ring-enhancing lesions في المخ. إيه اللي يخليك تقول toxoplasmosis مش primary CNS lymphoma؟"
        answer: "**Multiple lesions** مع ↓ **CD4+** count. الـ lymphoma غالباً **solitary lesion**."
        page: 737
        quote: "Multiple lesions and ↓ CD4+ cell count (vs solitary lesion in lymphoma)"
      - kind: explain
        title: "Pathology: 3 سطور"
        text: |-
          - **gross hematuria وقت الـ URI**: ==IgA nephropathy== (Berger). الـ hematuria **مع** الـ infection. الـ PSGN بييجي بعدها بأسابيع.
          - **esophageal mass في upper/middle third** مع EtOH و hot beverages: **squamous cell carcinoma**. الـ adenocarcinoma في الـ distal third ومرتبط بـ Barrett.
          - **breast حمرا ووارمة فجأة في ست مش بترضع** من غير fever: ==inflammatory breast carcinoma== (dermal lymphatic invasion ← peau d'orange)، مش acute mastitis.
        page: 737
        quote: "Location: upper/middle third (vs adenocarcinoma: distal third); associated with EtOH and hot beverage consumption (vs adenocarcinoma: associated with Barrett metaplasia)"
      - kind: aside
        tone: trap
        text: "مريض UTI اتعالج وجاله hearing loss؟ الـ ciprofloxacin مش الجواب (الـ fluoroquinolones بتعمل tendinopathy و prolonged QT). الجواب ==ampicillin + gentamicin==: الـ aminoglycoside بيعمل ototoxicity و nephrotoxicity."
        page: 737
        quote: "Ototoxicity and nephrotoxicity (vs fluoroquinolones: tendinopathy and prolonged QT)"
      - kind: explain
        title: "Pharmacology: 3 pivots كمان"
        text: |-
          - **nausea مع أعراض عامة**: لو فيه ==xanthopsia== (بيشوف كل حاجة صفرا) و ↑ K+ يبقى **digoxin toxicity**. الـ hyperbilirubinemia بتصفّر الجلد مش النظر.
          - **anticoagulation في الحمل**: **heparin** لأنه ما بيعديش الـ placenta. الـ warfarin teratogenic.
          - **gout attack دلوقتي**: colchicine أو NSAID. الـ ==allopurinol للـ prevention بس==.
        page: 738
        quote: "Xanthopsia (yellow vision) and ↑ K+ (vs hyperbilirubinemia: jaundice [yellow skin])"
      - kind: check
        question: "A pregnant woman needs anticoagulation. Why heparin rather than warfarin, per the table?"
        options:
          - "Heparin does not cross the placenta; warfarin is teratogenic"
          - "Heparin can be taken by mouth"
          - "Warfarin acts too fast"
          - "Heparin does not need monitoring in any form"
        answer: 0
        why:
          - "صح: heparin آمن في الحمل لأنه ما بيعديش الـ placenta."
          - "الـ heparin بيتاخد injection، مش بالبُق."
          - "الـ warfarin بالعكس بطيء، والمشكلة إنه teratogenic."
          - "ده مش الـ clue اللي في الجدول."
        page: 738
        quote: "Safe in pregnancy, does not cross placenta (vs warfarin: teratogenic)"
      - kind: figure
        title: "الـ cutoff عند .05"
        svg: |-
          <svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="70" x2="340" y2="70"/>
            <rect class="fg-good" x="20" y="55" width="120" height="30" rx="4"/>
            <rect class="fg-bad" x="140" y="55" width="200" height="30" rx="4"/>
            <line class="fg-ink" x1="140" y1="40" x2="140" y2="100" stroke-width="3"/>
            <text x="140" y="32" text-anchor="middle" class="t-sm t-b">p = .05</text>
            <text x="80" y="115" text-anchor="middle" class="t-sm t-good">significant</text>
            <text x="250" y="115" text-anchor="middle" class="t-sm t-bad">not significant</text>
            <circle class="fg-dot-acc" cx="164" cy="70" r="6"/>
            <text x="172" y="50" class="t-sm t-acc">p = 0.06</text>
            <text x="20" y="32" class="t-sm t-mut">0</text>
            <text x="330" y="32" class="t-sm t-mut">1</text>
          </svg>
        caption: "الـ 0.06 قريبة من الـ .05، بس قريبة مش كفاية: أي P > .05 يبقى not significant."
        alt: "Number line from 0 to 1 with a cutoff at p = .05. Values below are significant; values above, including p = 0.06, are not significant."
        page: 738
        quote: "Standard cutoff is .05; P > .05 = not significant"
      - kind: check
        question: "A study reports p = 0.06 with the standard cutoff. Interpretation?"
        options:
          - "Not significant"
          - "Significant"
          - "Borderline significant, so accept the result"
          - "The null hypothesis is proven"
        answer: 0
        why:
          - "صح: P > .05 = not significant."
          - "ده الـ distractor: الرقم قريب بس فوق الـ cutoff."
          - "مفيش «borderline» في الامتحان: يا تحت .05 يا لأ."
          - "عدم رفض الـ null مش معناه إنه اتثبت."
        page: 738
        quote: "Standard cutoff is .05; P > .05 = not significant"
      - kind: try
        items: [rr.L05.019, rr.L05.021, rr.L05.026, rr.L05.029, rr.L05.034]
    recap:
      - "Epidemics و petechial rash و capsule = N meningitidis. H influenzae coccobacillus."
      - "Sickle cell osteomyelitis = Salmonella. HIV مع lesions كتير = toxo."
      - "Hematuria مع الـ URI = IgA nephropathy. Esophagus upper/middle = SCC."
      - "Xanthopsia و ↑ K+ = digoxin. الحمل = heparin. الـ attack = colchicine/NSAID."
      - "p = 0.06 = not significant."
    practice: [rr.L05.019, rr.L05.020, rr.L05.021, rr.L05.022, rr.L05.023, rr.L05.024, rr.L05.025, rr.L05.026, rr.L05.027, rr.L05.028, rr.L05.029, rr.L05.030, rr.L05.031, rr.L05.032, rr.L05.033, rr.L05.034, rr.L05.035, rr.L05.036, rr.L05.037, rr.L05.038, rr.L05.039]

  - id: rr.L05.lesson3
    title: "القلب والغدة والجهاز الهضمي: الـ distractor الأقرب"
    hook: "ألم في الصدر بعد وقعة؟ ممكن يكون MI مش عضلة. وdysphagia؟ أول سؤال: solids بس ولا الاتنين؟"
    minutes: 10
    pages: [738, 739]
    topics: [cardiovascular, endocrine, gastrointestinal]
    status: unverified
    steps:
      - kind: explain
        title: "Cardiovascular: ما تستسهلش"
        text: |-
          - **راجل كبير وقع وعنده chest pain**: سهل تقول musculoskeletal. بس لو فيه ==new LBBB== مع ischemic symptoms يبقى MI لحد ما يثبت العكس: ↑ troponin و wall motion abnormality على الـ echo.
          - **dyspnea مع crackles**: COPD ولا left HF؟ الـ ==orthopnea و PND== بيرجّحوا LHF، ومعاهم S3 و pulmonary edema و cardiomegaly و ↑ PCWP.
          - **مريض بياخد IV drugs مع fever**: مش pneumonia؛ ده infective endocarditis: ⊕ blood cultures و Osler nodes (painful) و Janeway lesions (painless)، وغالباً الـ tricuspid ← TR.
        page: 738
        quote: "New left bundle branch block + ischemic symptoms = MI until proven otherwise → ↑ troponin; wall motion abnormality on echocardiogram"
      - kind: reveal
        prompt: "مريض عنده dyspnea و loud P2. ليه الـ PCWP بيفرق بين primary pulmonary hypertension و left HF؟"
        answer: "الـ PCWP بيعكس ضغط الـ left atrium. في **left HF** الضغط بيرجع لورا فالـ PCWP يعلى. في **primary pulmonary hypertension** المشكلة في الشرايين نفسها (↑ endothelin-1، ↓ NO)، فالـ **PCWP normal**."
        page: 738
        quote: "↑ endothelin-1, ↓ NO; PCWP normal"
      - kind: check
        question: "A 10-year-old has hypertension. Which finding makes coarctation of the aorta the answer over essential hypertension?"
        options:
          - "Arm-leg blood pressure difference with rib notching on CXR"
          - "Family history of hypertension"
          - "Obesity"
          - "Headache"
        answer: 0
        why:
          - "صح: الضغط في الدراع أعلى من الرجل، والـ collaterals بتحفر الضلوع (rib notching)."
          - "الـ family history مع الـ essential hypertension، الـ distractor."
          - "الـ obesity بتروح ناحية الـ essential hypertension."
          - "الصداع ممكن في الاتنين."
        page: 738
        quote: "Arm–leg BP difference; rib notching on CXR"
      - kind: explain
        title: "2 pivots فيهم ACE inhibitor و strep"
        text: |-
          - **cough عند مريض على ACE inhibitor**: الكحة **dry** ومفيش fever، وسببها ==↑ bradykinin== (الـ ACE هو اللي بيكسّر الـ bradykinin). الـ angioedema هو الـ distractor.
          - **مهاجر عنده murmur جديد بعد strep infection**: مش infective endocarditis؛ ده ==rheumatic carditis==: Aschoff bodies و Anitschkow cells، بسبب molecular mimicry.
        page: 738
        quote: "Dry cough due to ↑ bradykinin, without fever"
      - kind: explain
        title: "Endocrine: thyrotoxicosis بعد عيا"
        text: |-
          أعراض thyrotoxic مؤقتة بعد illness قريب. الـ distractor هو Hashimoto. الصح: ==subacute granulomatous (de Quervain) thyroiditis==.

          الـ clues: الغدة **بتوجع** (painful thyroid)، و ↑ ESR، و granulomatous inflammation في الـ histology، وغالباً self-limited.
        page: 738
        quote: "Typically presents with painful thyroid, ↑ ESR, and granulomatous inflammation on histology; often self-limited"
      - kind: check
        question: "Transient thyrotoxicosis 2 weeks after a viral illness. Which feature points to de Quervain thyroiditis rather than Hashimoto?"
        options:
          - "Painful thyroid with ↑ ESR"
          - "Painless goiter"
          - "Female sex"
          - "Low TSH"
        answer: 0
        why:
          - "صح: de Quervain بيوجع ومعاه ↑ ESR و granulomas."
          - "الـ painless goiter أقرب لـ Hashimoto، الـ distractor."
          - "الستات أكتر في الاتنين."
          - "الـ TSH واطي في أي thyrotoxic phase."
        page: 738
        quote: "Typically presents with painful thyroid, ↑ ESR, and granulomatous inflammation on histology"
      - kind: explain
        title: "طفل صغير عنده lower GI bleeding"
        text: |-
          الـ distractor: intussusception. الصح: ==Meckel diverticulum==.

          الـ clue: الـ **99mTc pertechnetate** (Meckel scan) بيتمسك في الـ heterotopic gastric mucosa، لأن الـ pertechnetate بيتاخد في خلايا المعدة. والـ Meckel ليه ==«rule of 2s»==.
