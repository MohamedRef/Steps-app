  - id: rr.L02.lesson4
    title: "العضم والأعصاب والكلى والتناسلي والصدر"
    hook: "Lucid interval، worst headache of my life، waiter's tip: جمل لو قريتها في السؤال يبقى خلصت"
    minutes: 10
    pages: [724, 726]
    topics: [musculoskeletal, neurology, psychiatry, renal, reproductive, respiratory]
    goals:
      - "تقرا أشهر صور العضم والروماتيزم من سطر"
      - "تحدد مكان الـ lesion في الجهاز العصبي من العلامات"
      - "تخلص آخر صفحة في الجدول: كلى وتناسلي وصدر"
    status: unverified
    steps:
      - kind: explain
        title: "العضم والمفاصل"
        text: |-
          - **Erb palsy**: مولود بعد ولادة صعبة، دراعه في وضع ==waiter's tip== (superior trunk C5-C6).
          - **Anterior drawer** موجب: الـ tibia بتتزحلق لقدام = ACL.
          - **Paget disease of bone**: osteoblasts و osteoclasts شغالين أكتر ← عضم mosaic و chalk-stick fractures وجمجمة تخينة و hearing loss.
          - **Osteoarthritis**: كبير في السن، مفاصل صوابع جامدة بتوجع مع الحركة (Bouchard على PIP، Heberden على DIP).
          - **Gout**: صباع رجل كبير وارم فجأة و tophi.
          - **Sjögren**: عيون وبق ناشفين و parotid كبيرة. **Reactive arthritis**: urethritis و conjunctivitis و arthritis (HLA-B27). **SLE**: butterfly rash في ست في سن الإنجاب.
          - **Kawasaki**: حرارة ≥ 5 أيام و coronary aneurysms، والعلاج ==IVIG و aspirin==.
        page: 724
        quote: "Neonate with arm in “waiter’s tip” position following difficult birth"
      - kind: explain
        title: "الجلد والأوعية"
        text: |-
          - **IgA vasculitis (HSP)**: طفل، palpable purpura على المؤخرة والرجلين، ألم مفاصل وبطن و hematuria.
          - **Raynaud**: صوابع بتبقى أبيض ← أزرق ← أحمر مع البرد أو التوتر (vasospasm).
          - **Kaposi sarcoma**: nodules بنفسجي في مريض AIDS = HHV-8.
          - **Lichen planus**: الـ 6 Ps (pruritic و purple و polygonal و planar papules و plaques).
        page: 725
        quote: "Painful fingers/toes changing color from white to blue to red with cold or stress Raynaud phenomenon (vasospasm in extremities)"
      - kind: figure
        title: "فين الـ lesion؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="8" y="8" width="168" height="74" rx="8"/>
            <text x="18" y="28" class="t-b">Cerebellum</text>
            <text x="18" y="46" class="t-sm">intention tremor, ataxia</text>
            <text x="18" y="64" class="t-sm">falls toward the lesion</text>
            <rect class="fg-good" x="184" y="8" width="168" height="74" rx="8"/>
            <text x="194" y="28" class="t-b">Basal ganglia</text>
            <text x="194" y="46" class="t-sm">resting tremor</text>
            <text x="194" y="64" class="t-sm">athetosis, chorea</text>
            <rect class="fg-bad" x="8" y="90" width="168" height="74" rx="8"/>
            <text x="18" y="110" class="t-b">UMN</text>
            <text x="18" y="128" class="t-sm">hyperreflexia, hypertonia</text>
            <text x="18" y="146" class="t-sm">Babinski sign</text>
            <rect class="fg-box" x="184" y="90" width="168" height="74" rx="8"/>
            <text x="194" y="110" class="t-b">LMN</text>
            <text x="194" y="128" class="t-sm">hyporeflexia, hypotonia</text>
            <text x="194" y="146" class="t-sm">atrophy, fasciculations</text>
          </svg>
        caption: "الرعشة وانت بتتحرك (intention) = cerebellum، والرعشة وانت مرتاح (resting) = basal ganglia. الـ UMN بيشيل الفرامل من الـ reflexes فتعلى، والـ LMN بيقطع السلك نفسه فالعضلة تضمر وترفرف."
        alt: "Four boxes: cerebellar lesion (intention tremor, ataxia, falls toward the lesion), basal ganglia lesion (resting tremor, athetosis, chorea), upper motor neuron lesion (hyperreflexia, hypertonia, Babinski sign), lower motor neuron lesion (hyporeflexia, hypotonia, atrophy, fasciculations)."
        page: 725
        quote: "Hyperreflexia, hypertonia, ⊕ Babinski sign"
      - kind: explain
        title: "نزيف ومخ"
        text: |-
          - **Lucid interval** بعد خبطة = ==epidural hematoma==: الـ middle meningeal artery (فرع من الـ maxillary)، شكله lentiform ومش بيعدّي الـ sutures.
          - **«Worst headache of my life»** = subarachnoid hemorrhage.
          - **Wallenberg (PICA)**: dysphagia و hoarseness و gag reflex ضعيف و nystagmus و Horner في نفس الناحية.
          - **Klüver-Bucy**: hyperphagia و hypersexuality و hyperorality: الـ amygdala الاتنين (HSV-1).
          - **Parkinson**: resting tremor و rigidity و akinesia و postural instability (substantia nigra). **Huntington**: chorea و dementia و caudate degeneration (CAG repeats).
          - **NPH**: ==wet، wobbly، wacky== (incontinence و gait apraxia و dementia).
          - **MS**: nystagmus و intention tremor و optic neuritis و scanning speech و INO في الناحيتين، relapsing-remitting.
          - **Guillain-Barré**: ضعف بيطلع من تحت لفوق بعد infection في الـ GI أو الـ upper respiratory.
        page: 725
        quote: "Urinary incontinence, gait apraxia, cognitive dysfunction"
      - kind: check
        question: "A 30-year-old woman has had two episodes of blurred vision in one eye and now has scanning speech and an intention tremor. On lateral gaze, neither eye adducts and the abducting eye shows nystagmus. Which is the most likely diagnosis?"
        options: ["Multiple sclerosis", "Guillain-Barré syndrome", "Friedreich ataxia", "Lateral medullary syndrome", "Huntington disease"]
        answer: 0
        why:
          - "صح: relapsing-remitting + optic neuritis + scanning speech + intention tremor + bilateral INO = MS."
          - "Guillain-Barré ضعف صاعد و hyporeflexia بعد infection، مش optic neuritis."
          - "Friedreich بيبدأ في الطفولة مع hammer toes و cardiomyopathy."
          - "Wallenberg مفاجئ (stroke) و dysphagia و Horner."
          - "Huntington chorea و dementia."
        page: 725
        quote: "Relapsing and remitting nystagmus, intention tremor, optic neuritis, scanning speech, bilateral internuclear ophthalmoplegia"
      - kind: explain
        title: "الـ neurocutaneous والأعصاب الدماغية"
        text: |-
          - **NF1**: café-au-lait و Lisch nodules و neurofibromas و pheo و optic gliomas. **NF2**: ==vestibular schwannomas في الناحيتين==.
          - **Port-wine stain** على الوش = nevus flammeus (مع Sturge-Weber).
          - **VHL** (3p): renal cell carcinomas في الناحيتين و hemangioblastomas و pheo.
          - **Friedreich ataxia**: مشية مترنحة و hammer toes و diabetes و hypertrophic cardiomyopathy.
          - **وش مايل بالجبهة** = LMN facial palsy. الـ UMN بيسيب الجبهة لأن ليها innervation من الناحيتين.
          - **Ménière**: vertigo بنوبات و tinnitus و sensorineural hearing loss (endolymph زيادة).
          - **Horner**: ptosis و miosis و anhidrosis. **INO**: MLF lesion.
        page: 725
        quote: "Bilateral vestibular schwannomas Neurofibromatosis type II"
      - kind: reveal
        prompt: "ست كبيرة بعد عملية: مرة صاحية ومرة نايمة، ومش مركزة. ده dementia؟"
        answer: "لأ، ده **delirium**: بداية حادة، بيتحسن، الوعي بيروح ويجي (waxing and waning)، والـ attention والـ arousal قليلين. وغالباً سببه حاجة تانية (infection، أدوية...)، فدوّر على السبب."
        page: 726
        quote: "Acute onset, reversible “waxing and waning” level of consciousness"
      - kind: explain
        title: "الكلى والتناسلي والصدر"
        text: |-
          - **Fanconi syndrome**: الـ PCT مش بيعمل reabsorption ← polyuria و RTA type II و hypophosphatemic rickets.
          - **Nephrotic**: edema و proteinuria > 3.5 g/day و hypoalbuminemia و hypercholesterolemia (podocytes).
          - **Alport**: nephritis وراثي + hearing loss + anterior lenticonus = ==type IV collagen==.
          - **Beckwith-Wiedemann**: Wilms و macroglossia و organomegaly و omphalocele (WT2).
          - **Turner**: streak ovaries و coarctation وغيرها و horseshoe kidney و cystic hygroma و webbed neck.
          - **Meigs**: ovarian fibroma + ascites + pleural effusion. **Paget of the breast**: rash على الحلمة = cancer تحتها. **Peyronie**: plaques في الـ tunica albuginea ← انحناء.
          - **Chronic bronchitis**: hypoxemia و polycythemia و hypercapnia. **Emphysema**: pink و dyspnea و hyperventilation.
          - **Sarcoidosis**: bilateral hilar adenopathy و uveitis و مفاصل وجلد = ==noncaseating granulomas==.
        page: 726
        quote: "Bilateral hilar adenopathy, uveitis, arthropathy, skin changes"
      - kind: try
        items: [rr.L02.112, rr.L02.131, rr.L02.135, rr.L02.154, rr.L02.164]
    recap:
      - "Lucid interval = epidural (middle meningeal)"
      - "Intention tremor = cerebellum، resting = basal ganglia"
      - "الجبهة متأثرة = LMN facial palsy"
      - "Alport = type IV collagen"
