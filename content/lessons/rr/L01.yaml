  - id: rr.L01.lesson7
    title: "الأعصاب الطرفية والعظم والمناعة الذاتية والجلد"
    hook: "إصابة واحدة في الكورة أو حقنة في المكان الغلط، والعلامة بتقولك أنهي عصب"
    minutes: 10
    pages: [713, 715]
    topics: [musculoskeletal]
    status: unverified
    steps:
      - kind: explain
        title: "أعصاب الدراع"
        text: |-
          - **Axillary**: كسر الـ surgical neck أو anterior dislocation ← deltoid مفلطح والدراع جنبه وإحساس الكتف يقل.
          - **Radial** (Saturday night palsy): ضغط الـ axilla (العكاكيز) أو كسر midshaft humerus ← ==wrist drop==.
          - **Median**: supracondylar fracture (proximal) ← hand of benediction؛ و distal = carpal tunnel.
          - **Ulnar**: medial epicondyle (proximal) ← radial deviation؛ hook of hamate (distal) ← ==ulnar claw==.
        page: 713
        quote: "Axilla compression (use of crutches), midshaft humerus fracture, repetitive pronation/supination of forearm → wrist drop, ↓ grip strength"
      - kind: match
        prompt: "وصّل كل إصابة بالجذور أو العصب"
        pairs:
          - ["Erb palsy (waiter's tip)", "C5-C6 roots"]
          - ["Klumpke palsy (claw hand)", "C8-T1 roots"]
          - ["Winged scapula after mastectomy", "Long thoracic nerve"]
          - ["Foot drop after fibular neck fracture", "Common peroneal nerve"]
          - ["Perineal numbness after long cycling", "Pudendal nerve"]
        why: "Erb = رقبة الطفل بتتشد وقت الولادة (فوق). Klumpke = الدراع بيتشد لفوق (تحت: C8-T1)."
        page: 714
        quote: "Traction/tear of C8-T1 roots on infant’s arm during delivery, or on trying to grab a branch in adults"
      - kind: explain
        title: "الـ Trendelenburg sign: ليه الناحية التانية؟"
        text: |-
          الـ **superior gluteal nerve** ممكن يتأذي من حقنة IM في الـ gluteal region ← الـ abductors (gluteus medius و minimus) تضعف.

          لما تقف على رجل واحدة، الـ abductors **بتاعة الرجل اللي واقف عليها** هي اللي بتشيل الحوض. لو ضعيفة ← الحوض يقع من ==الناحية التانية==. فالـ lesion **contralateral** للناحية اللي بتقع.
        page: 714
        quote: "Iatrogenic injury during IM injection in gluteal region → Trendelenburg sign: lesion contralateral to side of hip that drops due to abductor weakness"
      - kind: figure
        title: "Trendelenburg sign: الحوض بيقع من الناحية السليمة"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="110" y1="70" x2="250" y2="100"/>
            <circle class="fg-ink" cx="110" cy="70" r="6"/>
            <circle class="fg-ink" cx="250" cy="100" r="6"/>
            <line class="fg-ink" x1="110" y1="70" x2="110" y2="180"/>
            <line class="fg-ink" x1="250" y1="100" x2="270" y2="160"/>
            <line class="fg-bad" x1="70" y1="66" x2="110" y2="76"/>
            <text x="20" y="40" class="t-sm t-bad">Right gluteus medius weak</text>
            <text x="20" y="56" class="t-sm t-bad">(right superior gluteal nerve)</text>
            <text x="78" y="196" class="t-sm">Stands on right leg</text>
            <text x="220" y="128" class="t-sm t-b">Left hip drops</text>
            <line class="fg-ink" x1="110" y1="70" x2="250" y2="70" stroke-dasharray="4 4"/>
            <text x="200" y="62" class="t-sm t-mut">level pelvis</text>
          </svg>
        caption: "الـ lesion في الـ superior gluteal nerve اليمين. وهو واقف على رجله اليمين، الـ abductors اليمين مش قادرة تشيل الحوض، فالحوض يقع من الشمال: الـ lesion عكس الناحية اللي بتقع."
        alt: "A pelvis seen from the front, standing on the right leg. The right gluteus medius is marked weak from a right superior gluteal nerve injury. The pelvis tilts down on the left, below a dotted level line, labelled left hip drops."
        page: 714
        quote: "Iatrogenic injury during IM injection in gluteal region → Trendelenburg sign: lesion contralateral to side of hip that drops due to abductor weakness"
      - kind: explain
        title: "العضم: بيتبني ولا بيتهد؟"
        text: |-
          - **Achondroplasia**: FGFR3 ==شغال على طول== ← chondrocytes ما تتكاثرش ← endochondral ossification يفشل ← أطراف قصيرة.
          - **Osteoporosis**: osteoclasts أكتر ← bone mass أقل (estrogen قليل، السن، steroids).
          - **Osteopetrosis**: carbonic anhydrase II ← الـ osteoclasts مش قادرة تعمل حمض ← العضم ما يتهدش ← عضم كثيف بس بيتكسر، و pancytopenia لأن مكان النخاع ضاق.
          - **Paget**: osteoclasts وبعدين osteoblasts ← عضم كتير بس ==رديء==.
          - **SCFE**: مراهق تخين، الضغط على رأس الـ femur ← الـ epiphysis تتزحلق. **Nursemaid's elbow**: شدة مفاجئة ← رأس الـ radius يطلع من الـ annular ligament.
        page: 714
        quote: "Carbonic anhydrase II mutations → ↓ ability of osteoclasts to generate acidic environment → ↓ bone resorption"
      - kind: check
        question: "A 6-year-old has frequent fractures, anemia and recurrent infections. X-ray shows diffusely dense bones. Why the pancytopenia?"
        options:
          - "Dense bone reduces marrow space"
          - "Autoimmune destruction of marrow"
          - "Excess osteoclast activity"
          - "Copper deficiency"
        answer: 0
        why:
          - "صح: osteopetrosis ← العضم ما يتهدش ← المكان اللي فيه النخاع يضيق ← pancytopenia."
          - "مافيش autoimmunity في الجدول للحالة دي."
          - "العكس: الـ osteoclasts مش قادرة تشتغل."
          - "ده Menkes، مالوش دعوة بالعضم الكثيف."
        page: 714
        quote: "dense bones prone to fracture, pancytopenia (↓ marrow space)"
      - kind: table
        title: "MG ولا LEMS؟"
        columns: ["", "Myasthenia gravis", "Lambert-Eaton"]
        rows:
          - ["Autoantibody target", "Postsynaptic nicotinic ACh receptors", "Presynaptic calcium channels"]
          - ["Effect", "ACh can't act on the muscle", "↓ ACh release"]
        hide: [[0, 1], [0, 2]]
        page: 714
        quote: "Autoantibodies to presynaptic calcium channels → ↓ ACh release"
      - kind: explain
        title: "المفاصل والمناعة الذاتية"
        text: |-
          - **OA**: تآكل ميكانيكي للـ cartilage ← osteophytes. **RA**: autoimmune ← ==pannus== ← cartilage وعضم يتآكل.
          - **Sjögren**: lymphocytes بتدمر الـ exocrine glands.
          - **SLE**: أساساً ==Type III== (الـ immune complexes ما بتتشالش)، بس الـ hematologic manifestations ==Type II==.
          - **GCA**: العمى من انسداد الـ ophthalmic artery.
        page: 714
        quote: "Predominantly a type III hypersensitivity reaction with ↓ clearance of immune complexes; hematologic manifestations are a type II hypersensitivity reaction"
      - kind: explain
        title: "الجلد"
        text: |-
          - **Albinism**: melanocytes عددها طبيعي بس الـ melanin قليل. **Vitiligo**: الـ melanocytes نفسها بتتدمر (autoimmune).
          - **Atopic dermatitis**: barrier بايظ (filaggrin FLG)، immune dysregulation، microbiome متغير.
          - **Allergic contact dermatitis**: Type IV.
          - **Pemphigus vulgaris**: IgG ضد ==desmoglein 1 و 3== (desmosomes) ← الخلايا تفك من بعض فوق الـ basale ← Nikolsky ⊕.
          - **Bullous pemphigoid**: IgG ضد ==hemidesmosomes== ← الـ epidermis تفك من الـ dermis ← Nikolsky ⊝.
        page: 715
        quote: "IgG autoantibodies form against desmoglein 1 and 3 in desmosomes → separation of keratinocytes in stratum spinosum from stratum basale"
      - kind: aside
        tone: tip
        text: "**desmo**some بيمسك الخلايا في **بعض** ← لو اتفك، الجلد يقشر بسهولة لما تحك عليه (Nikolsky ⊕). **hemi**desmosome نص مسمار بيمسك الطبقة في **الأرضية** ← الفقاعة تحت الـ epidermis كلها، تخينة ومش بتتقشر (Nikolsky ⊝)."
        page: 715
        quote: "IgG autoantibodies against hemidesmosomes → separation of epidermis from dermis; Nikolsky sign ⊝"
      - kind: try
        items: [rr.L01.138, rr.L01.145, rr.L01.152, rr.L01.160, rr.L01.165]
    recap:
      - "Radial ← wrist drop؛ ulnar distal ← claw؛ axillary ← deltoid مفلطح."
      - "Erb = C5-C6؛ Klumpke = C8-T1؛ long thoracic ← winged scapula."
