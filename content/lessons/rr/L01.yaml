schema: steps.lesson/v1
lecture: rr.L01
lessons:
  - id: rr.L01.lesson1
    title: "الـ Rapid Review: الآلية ورا كل مرض (Biochemistry)"
    hook: "جدول واحد فيه سبب كل مرض. لو فهمت السهم، مش هتحتاج تحفظ السطر"
    minutes: 9
    pages: [707, 709]
    topics: [biochemistry]
    goals:
      - "تعرف الجداول دي معمولة لإيه وتستخدمها إزاي قبل الامتحان"
      - "تفهم ليه Becker أخف من Duchenne، وليه Prader-Willi عكس Angelman"
      - "تفرّق بين hereditary fructose intolerance و essential fructosuria، وتفهم الـ sorbitol في الـ DM"
    status: unverified
    steps:
      - kind: explain
        title: "الجدول ده بتاع إيه؟"
        text: |-
          آخر جزء في First Aid اسمه **Rapid Review**: جداول بتلم أهم الأمراض مع ==الآلية== (mechanism) والعلامات والـ associations.

          أول جدول هو **Pathophysiology of important diseases**: عمود فيه المرض (Condition)، وعمود فيه السلسلة اللي بتوصّل للمرض (Mechanism)، وعمود **Page** بيرجّعك للصفحة اللي فيها الشرح الكامل.

          الـ Step 1 بيحب يسأل **خطوة بعد التشخيص**: عرفت إنه Lesch-Nyhan؟ طب الـ enzyme إيه وإيه اللي بيعلى؟ الجدول ده هو الخطوة دي بالظبط.
        page: 707
        quote: "The following tables represent a collection of high-yield information about diseases and their pathophysiological mechanisms, clinical findings, and key associations."
      - kind: aside
        tone: tip
        text: "اقرا كل سطر كـ **سلسلة أسهم**: سبب ← خلل ← نتيجة. الجداول دي بتلم الـ high-yield diseases مع الـ pathophysiological mechanisms والـ clinical findings والـ key associations. لو حفظت أول حلقة (الـ gene أو الـ enzyme) وفهمت ليه كل سهم بيجيب اللي بعده، السطر كله هيفضل في دماغك."
        page: 707
        quote: "The following tables represent a collection of high-yield information about diseases and their pathophysiological mechanisms"
      - kind: explain
        title: "الـ dystrophin: الـ reading frame هو الفرق"
        text: |-
          - **Duchenne**: ==frameshift== أو nonsense mutation ← الـ dystrophin بيضيع خالص، وده البروتين اللي بيربط العضلة بالـ ECM ← myonecrosis.
          - **Becker**: deletion من غير frameshift ← بروتين ==partially functional== ← المرض أخف.

          الـ trinucleotide repeats كمان هنا: **Myotonic dystrophy** = CTG في الـ DMPK ← myotonia، و **Fragile X** = CGG في الـ FMR1 ← hypermethylation ← الـ expression بيقل.
        page: 708
        quote: "Non-frameshift deletion of dystrophin gene → partially functional protein → less severe than Duchenne"
      - kind: reveal
        prompt: "ليه الـ deletion اللي ما بيعملش frameshift بيدي مرض أخف، مع إنه بيشيل حتة من الـ gene؟"
        answer: "الـ ribosome بيقرا الـ codons تلاتة تلاتة. الـ frameshift بيبوّظ كل القراية بعده، فالبروتين يضيع. لكن الـ deletion اللي مضروب في 3 بيشيل كام amino acid بس والباقي يتقري صح، فيطلع **dystrophin أقصر بس شغال جزئياً** ← Becker."
        page: 708
        quote: "Dystrophin gene frameshift or nonsense mutations → loss of anchoring protein to ECM (dystrophin) → myonecrosis"
      - kind: table
        title: "Imprinting على chromosome 15"
        columns: ["Syndrome", "Uniparental disomy", "Allele lost"]
        rows:
          - ["Prader-Willi", "Maternal (25%)", "Paternal allele"]
          - ["Angelman", "Paternal (5%)", "UBE3A on maternal chromosome"]
        hide: [[0, 2], [1, 2]]
        page: 708
        quote: "Imprinting or maternal uniparental disomy (25%) → deletion or mutated expression of paternal allele on chromosome 15"
      - kind: aside
        tone: tip
        text: "الـ disomy دايماً من **عكس** الأب أو الأم اللي نسخته ضاعت: لو الاتنين جايين من الأم (maternal disomy) يبقى نسخة الأب مش موجودة ← ==Prader-Willi==. لو الاتنين من الأب ← نسخة الأم (UBE3A) ضاعت ← Angelman."
        page: 708
        quote: "Imprinting or paternal uniparental disomy (5%) → deletion or mutated expression of UBE3A on maternal chromosome 15"
      - kind: explain
        title: "الـ collagen: 4 أمراض في سطور ورا بعض"
        text: |-
          - **Osteogenesis imperfecta**: COL1A1 و COL1A2 ← type 1 collagen ما يعرفش يعمل ==triple helix==.
          - **Ehlers-Danlos**: collagen synthesis غلط ← جلد بيتمط، مفاصل hypermobile، كدمات بسهولة.
          - **Menkes**: ATP7A بايظ ← النحاس ما بيتمتصش ← الـ ==lysyl oxidase== (محتاج copper) يقل ← cross-linking يقل.
          - **Marfan**: FBN1 على chromosome 15 ← fibrillin-1 بايظ ← aortic root dilation و aneurysm و dissection.
        page: 708
        quote: "Defective ATP7A protein → impaired copper absorption and transport → ↓ lysyl oxidase activity → ↓ collagen cross-linking"
      - kind: check
        question: "A 3-month-old boy has sparse, brittle, kinky hair, hypotonia and seizures. Serum copper is low. Which enzyme's reduced activity explains his weak connective tissue?"
        options:
          - "Lysyl oxidase"
          - "HGPRT"
          - "Aldolase B"
          - "Fructokinase"
        answer: 0
        why:
          - "صح: ATP7A بايظ ← copper قليل ← lysyl oxidase (بيحتاج copper) يقل ← collagen cross-linking يقل."
          - "HGPRT ده Lesch-Nyhan: purine salvage و uric acid، مالوش دعوة بالـ collagen."
          - "Aldolase B ده hereditary fructose intolerance."
          - "Fructokinase ده essential fructosuria، مرض benign."
        page: 708
        quote: "Menkes disease Defective ATP7A protein → impaired copper absorption and transport"
      - kind: explain
        title: "الفيتامينات والـ metabolism"
        text: |-
          - **Wernicke**: thiamine ناقص ← الجلوكوز ما بيتكسرش ← ATP يخلص. لو اديت ==glucose== قبل الـ thiamine، الخلية تحاول تحرق أكتر وهي مش قادرة فالـ ATP يقع أكتر.
          - **Pellagra في carcinoid**: الورم بيسحب الـ tryptophan يعمل serotonin، والـ B3 أصلاً بيتعمل من tryptophan ← B3 deficiency.
          - **Kwashiorkor**: بروتين قليل ← oncotic pressure يقل (edema) و apolipoprotein يقل (fatty liver).
          - **Bitot spots**: vitamin A ناقص ← squamous metaplasia في الـ conjunctiva ← keratin.
          - **Aspirin**: بيخرّم الـ inner mitochondrial membrane ← الـ proton gradient يضيع (==uncoupling==) ← الطاقة تطلع حرارة.
        page: 708
        quote: "Tryptophan is diverted towards serotonin synthesis by tumor → B3 deficiency"
      - kind: figure
        title: "الـ fructose: enzyme ناقص ولا enzyme تاني شغال؟"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="130" y="10" width="100" height="30" rx="8"/>
            <text x="157" y="30" class="t-sm t-b">Fructose</text>
            <line class="fg-arrow" x1="150" y1="40" x2="80" y2="80" marker-end="url(#rr1a)"/>
            <text x="40" y="60" class="t-sm">fructokinase</text>
            <line class="fg-arrow" x1="210" y1="40" x2="280" y2="80" marker-end="url(#rr1a)"/>
            <text x="250" y="60" class="t-sm">hexokinase</text>
            <rect class="fg-bad" x="10" y="82" width="150" height="30" rx="8"/>
            <text x="20" y="102" class="t-sm">Fructose-1-phosphate</text>
            <rect class="fg-good" x="210" y="82" width="140" height="30" rx="8"/>
            <text x="218" y="102" class="t-sm">Fructose-6-phosphate</text>
            <text x="20" y="132" class="t-sm t-bad">Aldolase B missing:</text>
            <text x="20" y="150" class="t-sm t-bad">F-1-P traps phosphate</text>
            <text x="20" y="168" class="t-sm t-bad">→ no glycogenolysis or</text>
            <text x="20" y="184" class="t-sm t-bad">gluconeogenesis</text>
            <text x="212" y="132" class="t-sm t-good">Fructokinase missing:</text>
            <text x="212" y="150" class="t-sm t-good">fructose rises, goes</text>
            <text x="212" y="168" class="t-sm t-good">the hexokinase way</text>
            <text x="212" y="184" class="t-sm t-good">→ benign</text>
          </svg>
        caption: "لو الـ aldolase B ناقص، الـ fructose-1-phosphate بيتراكم ويحبس الـ phosphate، فالكبد ما يقدرش يطلع جلوكوز ← hypoglycemia. لو الـ fructokinase هو اللي ناقص، الـ hexokinase بياخد الـ fructose طريق تاني ومافيش مشكلة."
        alt: "Fructose at the top with two arrows. Left: fructokinase makes fructose-1-phosphate, which accumulates when aldolase B is missing and traps phosphate, stopping glycogenolysis and gluconeogenesis. Right: hexokinase makes fructose-6-phosphate, the benign route in essential fructosuria."
        page: 708
        quote: "Aldolase B deficiency → Fructose-1-phosphate accumulation → ↓ available phosphate → inhibition of glycogenolysis and gluconeogenesis"
      - kind: explain
        title: "الـ galactose والـ sorbitol"
        text: |-
          - **Essential fructosuria**: fructokinase ناقص ← الـ hexokinase بيحوّل الـ fructose لـ fructose-6-phosphate.
          - **Classic galactosemia**: galactose-1-phosphate uridyltransferase ناقص ← مواد سامة بتتراكم (galactitol في العدسة ← cataracts).
          - **Galactokinase deficiency**: الـ galactose يعلى والـ aldose reductase يحوله galactitol.
          - **DM**: الجلوكوز الزيادة ← sorbitol (aldose reductase). العدسة والـ retina والكلية والـ Schwann cells ==ما عندهاش sorbitol dehydrogenase== ← الـ sorbitol يتحبس جوه الخلية ← osmotic damage.
        page: 709
        quote: "Excess glucose → sorbitol (via aldose reductase) and sorbitol → fructose (via sorbitol dehydrogenase); lens, retina, kidney, and Schwann cells lack sorbitol dehydrogenase"
      - kind: check
        question: "A 55-year-old man with poorly controlled diabetes has burning feet and cataracts. Why does sorbitol accumulate in his Schwann cells and lens?"
        options:
          - "These cells lack sorbitol dehydrogenase"
          - "These cells lack aldose reductase"
          - "These cells lack galactokinase"
          - "These cells lack hexokinase"
        answer: 0
        why:
          - "صح: aldose reductase بيعمل sorbitol، ومافيش sorbitol dehydrogenase يكمّله لـ fructose ← يتحبس ← osmotic damage."
          - "لو مافيش aldose reductase ما كانش هيتعمل sorbitol أصلاً."
          - "Galactokinase مالوش دعوة بالجلوكوز."
          - "Hexokinase موجود ومش هو اللي بيعمل الـ sorbitol."
        page: 709
        quote: "Excess glucose → sorbitol (via aldose reductase) and sorbitol → fructose (via sorbitol dehydrogenase)"
      - kind: try
        items: [rr.L01.011, rr.L01.006, rr.L01.017, rr.L01.020, rr.L01.025]
    recap:
      - "الجدول = سلسلة أسهم: gene أو enzyme ← خلل ← مرض. عمود Page بيرجعك للشرح."
      - "Duchenne = frameshift؛ Becker = من غير frameshift فأخف."
      - "Maternal disomy ← Prader-Willi؛ paternal disomy ← Angelman."
      - "Aldolase B ناقص ← phosphate محبوس ← hypoglycemia. Fructokinase ناقص ← benign."
      - "Lens و retina والكلية و Schwann cells ما عندهاش sorbitol dehydrogenase."
    practice: [rr.L01.001, rr.L01.002, rr.L01.003, rr.L01.004, rr.L01.005, rr.L01.006, rr.L01.007, rr.L01.008, rr.L01.009, rr.L01.010, rr.L01.011, rr.L01.012, rr.L01.013, rr.L01.014, rr.L01.015, rr.L01.016, rr.L01.017, rr.L01.018, rr.L01.019, rr.L01.020, rr.L01.021, rr.L01.022, rr.L01.023, rr.L01.024, rr.L01.025, rr.L01.304]

  - id: rr.L01.lesson2
    title: "المناعة: complement و hypersensitivity و immunodeficiency"
    hook: "كل immunodeficiency بتقولك هي ناقصها إيه من نوع العدوى اللي بتجيلها"
    minutes: 9
    pages: [709, 709]
    topics: [immunology]
    status: unverified
    steps:
      - kind: explain
        title: "الـ complement: 3 أمراض من نفس المكان"
        text: |-
          - **Terminal complement deficiency** (C5–C9): الـ ==MAC== ما بيتكونش. الـ MAC هو اللي بيخرّم البكتيريا اللي غشاها رفيع زي **Neisseria** ← bacteremia بتتكرر.
          - **Hereditary angioedema**: C1 inhibitor ناقص ← الـ kallikrein شغال من غير فرامل ← ==bradykinin== يعلى ← تورم.
          - **PNH**: PIGA mutation ← الـ GPI anchors قليلة، فـ DAF/CD55 و MIRL/CD59 (اللي بيحموا الـ RBC من الـ complement) ما بيتثبتوش ← intravascular hemolysis ← haptoglobin يقل.
        page: 709
        quote: "PIGA gene mutation → ↓ GPI anchors for complement inhibitors (DAF/ CD55, MIRL/CD59) → complement-mediated intravascular hemolysis → ↓ haptoglobin"
      - kind: reveal
        prompt: "ليه الـ haptoglobin بيقل في الـ PNH؟"
        answer: "الـ hemolysis هنا **intravascular**: الـ RBC بتنفجر جوه الأوعية فالـ hemoglobin يطلع حر في البلازما، والـ haptoglobin بيمسكه ويتشال معاه ← مستواه يقع."
        page: 709
        quote: "complement-mediated intravascular hemolysis → ↓ haptoglobin"
      - kind: figure
        title: "الـ hypersensitivity: 4 أنواع"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="10" width="165" height="85" rx="8"/>
            <text x="20" y="30" class="t-b">Type I</text>
            <text x="20" y="50" class="t-sm">IgE on mast cells</text>
            <text x="20" y="68" class="t-sm">→ histamine, tryptase,</text>
            <text x="20" y="86" class="t-sm">leukotrienes (minutes)</text>
            <rect class="fg-bad" x="185" y="10" width="165" height="85" rx="8"/>
            <text x="195" y="30" class="t-b">Type II</text>
            <text x="195" y="50" class="t-sm">Antibody on cell surface</text>
            <text x="195" y="68" class="t-sm">or ECM → destruction,</text>
            <text x="195" y="86" class="t-sm">dysfunction</text>
            <rect class="fg-good" x="10" y="105" width="165" height="85" rx="8"/>
            <text x="20" y="125" class="t-b">Type III</text>
            <text x="20" y="145" class="t-sm">Immune complexes</text>
            <text x="20" y="163" class="t-sm">→ complement →</text>
            <text x="20" y="181" class="t-sm">neutrophils, enzymes</text>
            <rect class="fg-box" x="185" y="105" width="165" height="85" rx="8"/>
            <text x="195" y="125" class="t-b">Type IV</text>
            <text x="195" y="145" class="t-sm">T cells, no antibody</text>
            <text x="195" y="163" class="t-sm">CD4+ → cytokines</text>
            <text x="195" y="181" class="t-sm">CD8+ → kill cells</text>
          </svg>
        caption: "الـ 3 الأوائل فيهم antibodies: IgE على الـ mast cell، أو antibody على سطح الخلية، أو immune complex بيترسب. الرابع بس هو اللي T cells من غير antibodies."
        alt: "Four boxes. Type I: IgE on mast cells releases histamine, tryptase and leukotrienes within minutes. Type II: antibody binds a cell surface or ECM antigen. Type III: immune complexes activate complement, neutrophils release enzymes. Type IV: T cells without antibody; CD4+ release cytokines, CD8+ kill cells."
        page: 709
        quote: "Type III hypersensitivity Antigen-antibody complexes activate complement → attract neutrophils → release of lysosomal enzymes"
      - kind: explain
        title: "الـ Type I ليه مرحلتين؟"
        text: |-
          في **الدقايق الأولى**: الـ antigen بيربط الـ IgE اللي على الـ mast cell ← degranulation ← histamine و tryptase و leukotrienes.

          بعد **ساعات**: الـ mast cells بتفرز chemokines تنده خلايا التهاب تانية ← ==late phase== من inflammation و tissue damage. وده سبب إن الأعراض ممكن ترجع بعد ما تهدى.
        page: 709
        quote: "Late (hours): mast cells secrete chemokines (attract inflammatory cells and other mediators) → inflammation, tissue damage"
      - kind: sort
        prompt: "حط كل حالة تحت نوع الـ hypersensitivity بتاعها (حسب الجدول)"
        bins: ["Type II", "Type IV"]
        cards:
          - { text: "Acute hemolytic transfusion reaction", bin: 0 }
          - { text: "Graft-versus-host disease", bin: 1 }
          - { text: "Rheumatic fever", bin: 0 }
          - { text: "Allergic contact dermatitis", bin: 1 }
          - { text: "Pemphigus vulgaris", bin: 0 }
        why: "الـ Type II فيه antibody على antigen على الخلية (ABO على الـ RBC، M protein، desmoglein). الـ GVHD والـ contact dermatitis T cells من غير antibody (Type IV). الصفحات: transfusion و GVHD ص 709، rheumatic fever ص 711، contact dermatitis ص 714، pemphigus ص 715."
        page: 709
        quote: "Acute hemolytic transfusion reaction Type II hypersensitivity reaction against donor RBCs (usually ABO antigens)"
      - kind: explain
        title: "الـ immunodeficiencies: كل واحد ناقصه حاجة"
        text: |-
          - **Bruton (X-linked)**: BTK بايظ ← الـ B cells ما بتنضجش ← مافيش B cells في الدم و ==كل الـ Ig قليلة==.
          - **DiGeorge**: 22q11 microdeletion ← الـ pouches 3 و 4 ما بتتكونش ← مافيش thymus ولا parathyroid.
          - **Hyper-IgM**: CD40L على الـ Th cells بايظ ← ==class switching== ما بيحصلش ← IgM بس.
          - **LAD type 1**: LFA-1 integrin (CD18) ← الـ phagocytes مش عارفة تطلع من الأوعية.
          - **Chédiak-Higashi**: LYST ← microtubules بايظة ← الـ phagosome ما يلتحمش بالـ lysosome.
        page: 709
        quote: "Hyper-IgM syndrome Defective CD40L on Th cells → class switching defect"
      - kind: explain
        title: "الـ CGD: ليه الـ catalase ⊕ بالذات؟"
        text: |-
          في الـ **CGD** الـ NADPH oxidase بايظ ← مافيش ROS ولا respiratory burst في الـ neutrophils.

          بس الـ neutrophil لسه يقدر يستعمل الـ hydrogen peroxide اللي **البكتيريا نفسها** بتعمله، ويحوله بالـ myeloperoxidase system لمواد بتقتل. البكتيريا ==catalase ⊕== (S aureus، Serratia، B cepacia) بتكسر الـ peroxide بتاعها قبل ما الخلية تستعمله ← هي دي اللي بتعدي.
        page: 709
        quote: "Catalase ⊕ organisms degrade H2O2 before it can be converted to microbicidal products by the myeloperoxidase system"
      - kind: check
        question: "A 2-year-old boy has had recurrent S aureus abscesses and Serratia pneumonia. Which defect is most likely?"
        options:
          - "NADPH oxidase"
          - "CD40L"
          - "LFA-1 integrin (CD18)"
          - "BTK"
          - "C5–C9"
        answer: 0
        why:
          - "صح: CGD ← مافيش respiratory burst، فالـ catalase ⊕ organisms بتعدي."
          - "Hyper-IgM: مشكلة class switching، مش catalase ⊕ بالذات."
          - "LAD: الـ phagocytes ما بتوصلش، والعدوى من غير صديد."
          - "Bruton: عدوى بكتيريا encapsulated مع مافيش B cells."
          - "Terminal complement: Neisseria بتتكرر."
        page: 709
        quote: "NADPH oxidase defect → ↓ ROS, ↓ respiratory burst in neutrophils → ↑ susceptibility to catalase ⊕ organisms"
      - kind: aside
        tone: exam
        text: "**Candida** في الـ immunodeficiency: لو الـ granulocytes قليلة ← ==systemic== Candida. لو الـ T cells قليلة ← Candida local (mucocutaneous). والـ **GVHD** = Type IV: HLA mismatch ← الـ T cells بتاعة المتبرع بتهاجم الجسم."
        page: 709
        quote: "↓ granulocytes (systemic), ↓ T cells (local)"
      - kind: try
        items: [rr.L01.026, rr.L01.027, rr.L01.035, rr.L01.040, rr.L01.043]
    recap:
      - "C5–C9 ← Neisseria. C1 inhibitor ← bradykinin. PIGA ← CD55/CD59 ← hemolysis."
      - "Types I–III فيهم antibodies؛ Type IV بس T cells."
      - "BTK ← مافيش B cells. CD40L ← مافيش class switching. CD18 ← الـ phagocytes ما بتهاجرش."
      - "CGD = NADPH oxidase ← catalase ⊕ organisms."
    practice: [rr.L01.026, rr.L01.027, rr.L01.028, rr.L01.029, rr.L01.030, rr.L01.031, rr.L01.032, rr.L01.033, rr.L01.034, rr.L01.035, rr.L01.036, rr.L01.037, rr.L01.038, rr.L01.039, rr.L01.040, rr.L01.041, rr.L01.042, rr.L01.043, rr.L01.273]

  - id: rr.L01.lesson3
    title: "الميكروبات بتأذي إزاي؟ toxins و virulence و الـ cancer"
    hook: "toxin واحد بيقطع الـ SNARE يعمل شلل مرتخي، وتاني بيقطعه يعمل تشنج. الفرق في مكانه"
    minutes: 9
    pages: [710, 710]
    topics: [microbiology, pathology]
    status: unverified
    steps:
      - kind: explain
        title: "نفس المقص، نتيجة عكسية"
        text: |-
          الاتنين **proteases** بتقطع الـ ==SNARE== (البروتين اللي بيخلي الـ vesicle تلزق في الغشاء وتفرّغ الـ neurotransmitter):

          - **Botulism**: بيقطع الـ SNARE عند الـ NMJ ← ACh مش بيطلع ← ==شلل مرتخي==.
          - **Tetanus**: tetanospasmin بيقطع الـ SNARE في الـ **Renshaw cells** ← GABA و glycine (الفرامل) مش بيطلعوا ← الـ motor neurons شغالة من غير فرامل ← تشنج.
        page: 710
