            <line class="fg-ink" x1="180" y1="10" x2="180" y2="65" stroke-width="3"/>
            <text x="10" y="22" class="t-sm t-b">Basilar</text>
            <text x="10" y="38" class="t-sm">→ locked-in</text>
            <text x="250" y="30" class="t-sm t-b">AICA</text>
            <text x="250" y="46" class="t-sm">→ lateral pontine</text>
            <text x="250" y="110" class="t-sm t-b">PICA</text>
            <text x="250" y="126" class="t-sm">→ lateral medullary</text>
            <text x="250" y="142" class="t-sm">(Wallenberg)</text>
            <text x="10" y="120" class="t-sm t-b">Anterior spinal</text>
            <text x="10" y="136" class="t-sm">→ medial medullary</text>
          </svg>
        caption: "الـ basilar في النص فوق ← locked-in. الـ AICA على جنب الـ pons، والـ PICA على جنب الـ medulla. والـ anterior spinal في نص الـ medulla من قدام ← medial medullary."
        alt: "Sketch of the pons above the medulla. Basilar artery in the midline of the pons causes locked-in syndrome. AICA supplies the lateral pons (lateral pontine syndrome). PICA supplies the lateral medulla (Wallenberg syndrome). The anterior spinal artery supplies the medial medulla (medial medullary syndrome)."
        page: 715
        quote: "Lateral pontine syndrome Stroke of the anterior inferior cerebellar artery"
      - kind: check
        question: "A 58-year-old man is fully awake but can only blink and move his eyes up and down after a stroke. Which artery?"
        options:
          - "Basilar artery"
          - "Posterior inferior cerebellar artery"
          - "Anterior spinal artery"
          - "Middle meningeal artery"
        answer: 0
        why:
          - "صح: locked-in = basilar؛ الحركة الأفقية بتضيع والرأسية بتفضل."
          - "PICA ← Wallenberg."
          - "Anterior spinal ← medial medullary."
          - "ده شريان الـ epidural hematoma."
        page: 715
        quote: "Stroke of the basilar artery; loss of horizontal, but not vertical, eye movements"
