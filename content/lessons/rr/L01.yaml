          - **Anemia of chronic disease**: الالتهاب ← ==hepcidin يعلى== ← الحديد يتحبس في الـ macrophages والامتصاص يقل.
          - **G6PD**: NADPH يقل ← reduced glutathione يقل ← الـ RBC ما تستحملش الـ oxidant stress.
          - **Sickle cell**: valine مكان glutamic acid في الـ β chain؛ الـ O2 القليل والارتفاع والـ acidosis بيخلوا الـ HbS يعمل polymers.
        page: 713
        quote: "Inflammation → ↑ hepcidin → ↓ release of iron from macrophages, ↓ iron absorption from gut"
      - kind: reveal
        prompt: "الـ hepcidin عالي في الـ anemia of chronic disease وقليل في الـ hemochromatosis. ليه ده منطقي؟"
        answer: "الـ hepcidin هو **قفل الحديد**: بيمنع الامتصاص وبيحبس الحديد في الـ macrophages. في الالتهاب الجسم بيقفل (عشان يحرم البكتيريا من الحديد) ← anemia. في الـ hemochromatosis القفل مش موجود ← الحديد يدخل من غير حساب ← overload."
