        text: |-
          - **Biofilm**: S epidermidis على الأجهزة الصناعية، و S sanguinis بيعمل dextrans ← fibrin-platelet aggregates على الصمامات البايظة.
          - **M tuberculosis**: cord factor بيشغّل الـ macrophages (granuloma) و TNF-α، والـ sulfatides بتمنع الـ phagolysosomal fusion.
          - **Leprosy**: ==Th1== ← tuberculoid خفيف؛ ==Th2== ← lepromatous ممكن يموّت.
          - **E coli**: fimbriae (P pili) ← cystitis و pyelonephritis؛ K capsule ← pneumonia و neonatal meningitis.
          - **N gonorrhoeae**: antigenic variation في الـ pilus ← مافيش vaccine.
          - **Chlamydiae**: الـ peptidoglycan ناقص (muramic acid قليل) ← الـ β-lactams ما بتشتغلش.
        page: 710
        quote: "Cord factor activates macrophages (promoting granuloma formation), induces release of TNF-α; sulfatides (surface glycolipids) inhibit phagolysosomal fusion"
      - kind: match
        prompt: "وصّل كل حاجة بالآلية بتاعتها"
        pairs:
          - ["Influenza pandemic", "RNA segment reassortment (antigenic shift)"]
          - ["Influenza epidemic", "Hemagglutinin/neuraminidase mutations (antigenic drift)"]
          - ["Rabies reaching the CNS", "Retrograde transport by dynein"]
          - ["Early HIV infection", "CD4 with CCR5 on macrophages"]
          - ["Late HIV infection", "CD4 with CXCR4 on T cells"]
        why: "**shift** = تغيير كبير (genes كاملة بتتبادل) ← pandemic. **drift** = mutations صغيرة ← epidemics كل سنة."
        page: 710
        quote: "Influenza pandemics RNA segment reassortment → antigenic shift"
      - kind: explain
        title: "الـ granuloma والـ cancer"
        text: |-
          **Granuloma**: الـ macrophage بيقدّم الـ antigen للـ CD4+ ويفرز ==IL-12== ← CD4+ يبقى Th1 ← IFN-γ ← الـ macrophage يتشغّل أكتر. دايرة بتقوّي نفسها.

          **الـ cancer**:
          - تكرار من غير حدود: ==telomerase== بيرجع يشتغل ← الـ telomeres ما بتقصرش.
          - الغزو: E-cadherin يقل ← الخلايا تفك من بعض ← metalloproteinases تكسر الـ basement membrane والـ ECM ← تلزق في laminin و fibronectin ← تتحرك ← تنتشر في الأوعية.
        page: 710
        quote: "Macrophages present antigens to CD4+ and secrete IL-12 → CD4+ differentiation into Th1 → IFN-γ secretion → macrophage activation"
      - kind: reveal
        prompt: "ليه الـ E-cadherin لازم يقل الأول قبل أي حاجة في الغزو؟"
        answer: "الـ E-cadherin هو اللي ماسك الخلايا في بعض (intercellular junctions). طول ما الخلية ماسكة في جيرانها مش هتعرف تمشي، فأول خطوة إنها ==تفك==، وبعدها تكسر الـ basement membrane وتمشي."
        page: 710
        quote: "↓ E-cadherin function → ↓ intercellular junctions → basement membrane and ECM degradation by metalloproteinases"
