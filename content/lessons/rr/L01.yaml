          الـ warfarin بيوقّف factors كتير، بس الـ ==protein C== (anticoagulant) **نص عمره أقصر** فبيقع الأول. في الأيام الأولى الـ procoagulant factors لسه موجودة والـ protein C راح ← فترة hypercoagulable ← microthrombi ← الجلد يموت.
