      - kind: explain
        title: "الكبد والمرارة"
        text: |-
          - **Cirrhosis fibrosis**: الـ ==stellate cells== هي اللي بتعمل الـ ECM.
          - **Reye**: الـ aspirin بيعطّل الـ β-oxidation (inhibition reversible لـ mitochondrial enzymes).
          - **Hepatic encephalopathy**: portosystemic shunts ← الـ NH3 ما بيتكسرش.
          - **α1-antitrypsin**: في الكبد بروتين misfolded بيتكدس في الـ ER ← cirrhosis؛ في الرئة الـ elastase من غير فرامل ← panacinar emphysema.
          - **Wilson**: ATP7B (chromosome 13) ← النحاس ما يدخلش الـ ceruloplasmin وما يطلعش في الصفرا.
          - **Hemochromatosis**: HFE (chromosome 6) ← ==hepcidin يقل== ← امتصاص الحديد يزيد ← ferritin و iron و transferrin saturation يعلوا و TIBC يقل.
          - **Gallstone ileus**: fistula ← الحصوة تنزل الأمعاء وتقف عند الـ ileocecal valve (أضيق نقطة).
          - **Cholangitis**: انسداد ← stasis ← بكتيريا. **Pancreatitis**: الـ enzymes بتهضم البنكرياس نفسه.
