          - **Gram ⊝ shock و DIC**: lipid A بتاع الـ LPS ← macrophages (TLR4/CD14) و complement و tissue factor.
        page: 710
        quote: "TSST-1 and erythrogenic exotoxin A cross-link β region of TCR to MHC class II on APCs outside of antigen binding site"
