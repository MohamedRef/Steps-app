  - id: rr.L01.lesson9
    title: "الـ myelin والـ motor neurons والودن والعين"
    hook: "مين اللي بيعمل الـ myelin؟ اعرفه وانت تعرف المرض central ولا peripheral"
    minutes: 10
    pages: [717, 718]
    topics: [neurology]
    status: unverified
    steps:
      - kind: explain
        title: "الـ demyelination: central ولا peripheral؟"
        text: |-
          - **ODS**: تصحيح الـ hyponatremia بسرعة (أو shifts تانية زي الجلوكوز) ← demyelination كبير في الـ ==pons==.
          - **AIDP (Guillain-Barré)**: الـ ==Schwann cells== بتتدمر autoimmune، غالباً molecular mimicry بعد تطعيم أو stress.
          - **Charcot-Marie-Tooth**: بروتينات الأعصاب الطرفية أو الـ myelin بايظة.
          - **PML**: الـ JC virus بيصحى ← الـ ==oligodendrocytes== بتتدمر ← CNS demyelination.
        page: 717
        quote: "Destruction of oligodendrocytes 2° to reactivation of latent JC virus infection → demyelination of CNS"
      - kind: sort
        prompt: "الخلية اللي بتتأذي: oligodendrocytes (CNS) ولا Schwann cells (PNS)؟"
        bins: ["CNS myelin", "Peripheral nerve"]
        cards:
          - { text: "Progressive multifocal leukoencephalopathy", bin: 0 }
          - { text: "Acute inflammatory demyelinating polyneuropathy", bin: 1 }
          - { text: "Osmotic demyelination syndrome", bin: 0 }
          - { text: "Charcot-Marie-Tooth disease", bin: 1 }
        why: "الـ oligodendrocytes بتعمل myelin الـ CNS (PML، ODS في الـ pons). الـ Schwann cells بتعمل myelin الأعصاب الطرفية (AIDP، CMT)."
        page: 717
        quote: "Autoimmune destruction of Schwann cells via inflammation and demyelination of motor and sensory fibers and peripheral nerves"
      - kind: explain
        title: "الـ motor neurons والـ cord"
        text: |-
          - **Polio**: من الـ oropharynx للأمعاء للدم للـ CNS ← الـ anterior horn بيموت (==LMN==).
          - **SMA**: SMN1 ← snRNP assembly بايظ ← LMN apoptosis.
          - **ALS**: ==UMN و LMN== مع بعض؛ الـ familial مع SOD1.
          - **Tabes dorsalis** (3° syphilis): dorsal columns و roots ← proprioception تضيع ← sensory ataxia.
          - **Friedreich**: GAA على chromosome 9 في الـ frataxin ← mitochondria ← tracts كتير تضمر.
          - **Sturge-Weber**: GNAQ mosaicism ← neural crest ← leptomeningeal angioma و episcleral hemangioma. **Pituitary adenoma**: نوع خلية واحد، غالباً lactotrophs.
        page: 717
        quote: "Combined UMN and LMN degeneration; familial form associated with SOD1 mutation"
      - kind: check
        question: "A 55-year-old man has weak, wasted hands with fasciculations, plus brisk reflexes and upgoing toes. Sensation is normal. What is degenerating?"
        options:
          - "Both upper and lower motor neurons"
          - "Dorsal columns and roots"
          - "Anterior horns only, from SMN1 mutation"
          - "Schwann cells"
        answer: 0
        why:
          - "صح: ALS ← UMN (reflexes عالية و Babinski) و LMN (ضمور و fasciculations) مع بعض."
          - "ده tabes dorsalis، والإحساس هنا سليم."
          - "SMA بيبقى LMN بس، ومن الصغر."
          - "AIDP بيبقى ضعف مع reflexes قليلة."
        page: 717
        quote: "Combined UMN and LMN degeneration"
      - kind: explain
        title: "الودن"
        text: |-
          - **Noise**: الـ stereociliated cells في الـ organ of Corti ← ==high frequency== تضيع الأول.
          - **Presbycusis**: السن ← hair cells في قاعدة الـ cochlea ← sensorineural ثنائي.
          - **Cholesteatoma**: keratinized squamous epithelium في الودن الوسطى؛ 1° من retraction pocket و 2° من perforation.
          - **Ménière**: ==endolymph== زيادة ← vertigo و hearing loss و tinnitus وإحساس امتلاء.
        page: 717
        quote: "Damage to stereociliated cells in organ of Corti → loss of high-frequency hearing first"
      - kind: figure
        title: "الصورة بتقع فين؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fg-box" cx="120" cy="45" rx="70" ry="30"/>
            <line class="fg-ink" x1="190" y1="20" x2="190" y2="70" stroke-width="3"/>
            <circle class="fg-dot-bad" cx="165" cy="45" r="5"/>
            <text x="210" y="40" class="t-sm t-b">Myopia</text>
            <text x="210" y="56" class="t-sm">eye too long → focus</text>
            <text x="210" y="72" class="t-sm">in front of retina</text>
            <ellipse class="fg-box" cx="110" cy="125" rx="55" ry="30"/>
            <line class="fg-ink" x1="165" y1="100" x2="165" y2="150" stroke-width="3"/>
            <circle class="fg-dot-bad" cx="185" cy="125" r="5"/>
            <text x="210" y="120" class="t-sm t-b">Hyperopia</text>
            <text x="210" y="136" class="t-sm">eye too short → focus</text>
            <text x="210" y="152" class="t-sm">behind retina</text>
          </svg>
        caption: "الخط التخين هو الـ retina والنقطة الحمرا مكان الـ focus. العين الطويلة (myopia) الصورة تقع قبل الـ retina، والقصيرة (hyperopia) تقع وراها."
        alt: "Two eye outlines. Top: a long eye with the focal point in front of the retina, labelled myopia. Bottom: a short eye with the focal point behind the retina, labelled hyperopia."
        page: 717
        quote: "Eye too long for refractive power of cornea and lens → light focused in front of retina"
      - kind: explain
        title: "الـ glaucoma والـ retina"
        text: |-
          - **Glaucoma**: optic neuropathy ← النظر يضيع من الأطراف للنص، غالباً مع IOP عالي.
          - **Open-angle**: مقاومة في الـ trabecular meshwork.
          - **Angle-closure**: الزاوية ضيقة ← الـ aqueous مش بيعدي من الـ pupil ← الضغط ورا يعلى ← الـ iris يتزق لقدام ويقفل الـ drainage.
          - **Diabetic retinopathy**: permeability وانسداد ← microaneurysms و hemorrhages (nonproliferative)؛ hypoxia ← ==neovascularization== (proliferative).
          - **Retinal artery occlusion**: embolism غالباً (carotid > قلب). **Vein**: central = 1° thrombosis، branch = عند الـ arteriovenous crossings.
          - **Retinal detachment**: الـ retina تفك من الـ RPE ← تفقد دم الـ choroid.
        page: 718
        quote: "Associated with ↑ resistance to aqueous humor drainage through trabecular meshwork"
      - kind: explain
        title: "الـ pupil والـ Horner"
        text: |-
          - **Papilledema**: ICP عالي ← الـ axoplasmic flow في الـ optic nerve يقف ← disc يتورم (غالباً الاتنين).
          - **Marcus Gunn (RAPD)**: lesion في الـ ==afferent limb== (retina أو optic nerve) من ناحية واحدة.
          - **Horner**: neuron 1 (pontine hemorrhage، Wallenberg، cord فوق T1)؛ neuron 2 (==Pancoast== على الـ stellate ganglion)؛ neuron 3 (carotid dissection).
          - **Cavernous sinus**: pituitary tumor، carotid-cavernous fistula، أو thrombosis من عدوى (الـ dural sinuses ما فيهاش valves).
        page: 718
        quote: "Lesions along sympathetic chain: 1st neuron (pontine hemorrhage, lateral medullary syndrome, spinal cord lesion above T1 like Brown-Sequard syndrome or late-stage syringomyelia); 2nd neuron (stellate ganglion compression by Pancoast tumor); 3rd neuron (carotid dissection)"
      - kind: try
        items: [rr.L01.209, rr.L01.212, rr.L01.217, rr.L01.224, rr.L01.240]
    recap:
      - "Oligodendrocytes ← PML و ODS؛ Schwann cells ← AIDP."
      - "ALS = UMN + LMN؛ polio و SMA = LMN."
      - "Noise ← high frequency الأول؛ Ménière ← endolymph زيادة."
      - "Myopia = عين طويلة؛ hyperopia = قصيرة."
      - "Horner: Wallenberg (1)، Pancoast (2)، carotid dissection (3)."
    practice: [rr.L01.209, rr.L01.210, rr.L01.211, rr.L01.212, rr.L01.213, rr.L01.214, rr.L01.215, rr.L01.216, rr.L01.217, rr.L01.218, rr.L01.219, rr.L01.220, rr.L01.221, rr.L01.222, rr.L01.223, rr.L01.224, rr.L01.225, rr.L01.226, rr.L01.227, rr.L01.228, rr.L01.229, rr.L01.230, rr.L01.231, rr.L01.232, rr.L01.233, rr.L01.234, rr.L01.235, rr.L01.236, rr.L01.237, rr.L01.238, rr.L01.239, rr.L01.240, rr.L01.241, rr.L01.282, rr.L01.283, rr.L01.294, rr.L01.295, rr.L01.296, rr.L01.297, rr.L01.301]

  - id: rr.L01.lesson10
    title: "الكلية والـ reproductive والرئة: آخر صفحتين"
    hook: "الـ RTA بأنواعها التلاتة بتتفهم من سؤال واحد: الحمض بيقف فين؟"
    minutes: 10
    pages: [718, 719]
    topics: [psychiatry, renal, reproductive, respiratory]
    status: unverified
    steps:
      - kind: explain
        title: "Psychiatry: سطرين"
        text: |-
          - **Delirium**: غالباً ==ثانوي== لمرض (عدوى، trauma، electrolytes، احتباس بول) أو دوا (زي الـ anticholinergics).
          - **Schizophrenia**: dopaminergic activity متغير، serotonergic أعلى، dendritic branching أقل.
        page: 718
        quote: "Usually 2° to illness (eg, CNS disease, infection, trauma, substance use, metabolic/electrolyte imbalance, hemorrhage, urinary/fecal retention) or medication (eg, anticholinergics)"
      - kind: figure
        title: "الـ RTA: الخلل فين في الـ nephron؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <path class="fg-ink" d="M20 40 H150 Q170 40 170 60 V110 Q170 130 190 130 H340" fill="none" stroke-width="3"/>
            <text x="30" y="30" class="t-sm t-b">PCT</text>
            <text x="250" y="120" class="t-sm t-b">Distal / collecting</text>
            <rect class="fg-acc" x="20" y="55" width="130" height="50" rx="8"/>
            <text x="28" y="74" class="t-sm t-b">Type 2 (proximal)</text>
            <text x="28" y="92" class="t-sm">HCO3- not reabsorbed</text>
            <rect class="fg-bad" x="190" y="20" width="160" height="40" rx="8"/>
            <text x="198" y="37" class="t-sm t-b">Type 1 (distal)</text>
            <text x="198" y="53" class="t-sm">α-intercalated: no H+</text>
            <rect class="fg-good" x="190" y="140" width="160" height="28" rx="8"/>
            <text x="198" y="159" class="t-sm">Type 4: ↓ aldosterone → ↑ K+</text>
          </svg>
        caption: "Type 2 في الـ PCT: الـ bicarbonate بيضيع في البول. Type 1 في الـ distal: الـ α-intercalated cells مش قادرة تطلع H+. Type 4: الـ aldosterone قليل ← K+ يعلى ← الـ NH3 يقل ← الـ NH4+ ما يطلعش."
        alt: "A nephron tube from the proximal tubule to the collecting duct. Type 2 RTA at the proximal tubule: bicarbonate is not reabsorbed. Type 1 RTA at the distal nephron: alpha-intercalated cells cannot secrete hydrogen ions. Type 4: low aldosterone raises potassium."
        page: 718
        quote: "Defective PCT HCO3– reabsorption → ↑ urinary excretion of HCO3– → metabolic acidosis"
      - kind: reveal
        prompt: "ليه الـ hyperkalemia في الـ type 4 بتعمل acidosis؟"
        answer: "الـ K+ العالي بيقلل تصنيع الـ **NH3** في الـ PCT. والـ NH3 هو اللي بيمسك الـ H+ ويطلعه كـ **NH4+** في البول. NH3 أقل ← NH4+ أقل ← الحمض يفضل جوه ← metabolic acidosis."
        page: 718
        quote: "Hypoaldosteronism/aldosterone resistance → ↑ K+ → ↓ NH3 synthesis in PCT → ↓ NH4+ excretion → metabolic acidosis"
      - kind: explain
        title: "Nephritic ولا nephrotic؟"
        text: |-
          - **Nephritic**: التهاب في الـ glomerulus ← الـ GBM يتأذى ← ==dysmorphic RBCs== و hematuria؛ الـ GFR يقل ← oliguria و azotemia و renin يعلى.
          - **Nephrotic**: الـ podocytes ← الـ ==charge barrier== يضيع ← proteinuria؛ الـ albumin يقل ← الكبد يعمل lipids أكتر؛ antithrombin يضيع ← جلطات؛ IgG يضيع ← عدوى.
          - **Nephritic-nephrotic**: GBM damage شديد ← الاتنين.
          - **Infection-related GN**: Type III مع complement قليل. **Alport**: type IV collagen (X-linked dominant) ← الـ GBM يتقسم.
        page: 719
        quote: "Podocyte damage → impaired charge barrier → proteinuria"
      - kind: check
        question: "A 6-year-old with nephrotic syndrome develops a renal vein thrombosis. Which loss explains it?"
        options:
          - "Antithrombin lost in the urine"
          - "IgG lost in the urine"
          - "Dysmorphic RBCs in the urine"
          - "Increased renin release"
        answer: 0
        why:
          - "صح: الـ antithrombin بيضيع في البول ← hypercoagulability."
          - "الـ IgG loss بيعمل infections، مش جلطات."
          - "ده nephritic، ومالوش دعوة بالجلطة."
          - "الـ renin في الـ nephritic مع ↓ GFR."
        page: 719
        quote: "antithrombin loss → hypercoagulability"
      - kind: table
        title: "الـ incontinence والـ azotemia"
        columns: ["Condition", "Mechanism"]
        rows:
          - ["Stress incontinence", "Outlet incompetence → leak with ↑ intra-abdominal pressure"]
          - ["Urgency incontinence", "Detrusor overactivity"]
          - ["Overflow incontinence", "Incomplete emptying → leak with overfilling"]
          - ["Prerenal azotemia", "↓ RBF → ↓ GFR → ↑ Na⁺/H2O and urea reabsorption"]
          - ["Intrinsic renal failure", "Patchy necrosis → tubule debris, backflow → ↓ GFR"]
          - ["Postrenal azotemia", "Bilateral outflow obstruction"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 719
        quote: "Detrusor overactivity → leak with urge to void immediately"
      - kind: explain
        title: "الـ reproductive"
        text: |-
          - **Adnexal torsion**: الوريد والـ lymph يتقفلوا الأول والشريان لسه بيضخ ← edema ← الشريان يتقفل ← necrosis.
          - **Preeclampsia**: الـ spiral arteries مش طبيعية ← endothelial dysfunction ← HTN جديد مع proteinuria.
          - **Supine hypotensive**: الرحم بيضغط على الـ aorta والـ IVC وهي نايمة على ضهرها.
          - **PCOS**: insulin resistance ← ==LH:FSH يعلى== و androgens تعلى ← follicles ما تنفجرش ← anovulation.
          - **Functional hypothalamic amenorrhea**: أكل قليل أو مجهود أو stress ← الـ GnRH pulses تتلخبط ← LH و FSH و estrogen يقلوا.
          - **Varicocele**: ضغط وريدي ← الـ pampiniform plexus يوسع ← bag of worms.
        page: 719
        quote: "Abnormal placental spiral arteries → endothelial dysfunction, vasoconstriction, ischemia → new-onset HTN with proteinuria"
      - kind: explain
        title: "الرئة"
        text: |-
          - **Methemoglobin**: Fe3+ (dapsone، local anesthetics، nitrites) ← الـ O2 ما يتربطش، بس الـ ==cyanide== affinity يعلى ← tissue hypoxia.
          - **Sarcoidosis**: الـ macrophages في الـ granulomas فيها ==1α-hydroxylase== ← vitamin D يتفعّل ← Ca يعلى.
          - **ARDS**: alveolar injury ← endothelial damage ← سايل غني بالبروتين ← hyaline membranes و noncardiogenic edema ← compliance يقل و V/Q mismatch.
          - **Sleep apnea**: obstructive (مجهود ضد سدة)، central (CNS، CHF، opioids)، والـ obesity hypoventilation ← PaCO2 عالي وهو صاحي.
        page: 719
        quote: "Noncaseating granulomas → ↑ macrophage activity → ↑ 1α-hydroxylase activity in macrophages → vitamin D activation → ↑ Ca2+"
      - kind: aside
        tone: tip
        text: "الـ **methemoglobin** بيتستخدم علاج: الـ nitrites بتعمل methemoglobin عمداً عشان يشفط الـ cyanide، لأن الـ Fe3+ ==بيحب الـ cyanide==. نفس السطر في الجدول بيشرح الاتنين."
        page: 719
        quote: "↑ oxidized Hb (Fe3+) 2° to dapsone, local anesthetics, nitrites → ↓ O2 binding but ↑ cyanide affinity → tissue hypoxia"
