          </svg>
        caption: "أول يوم: arrhythmia. بعدها الـ macrophages بتلين الحيطة: الـ papillary muscle من يوم 2 لـ 7، الـ septum من 3 لـ 5، والـ free wall من 5 لـ 14."
        alt: "Timeline from day 0 to 14 after MI. Ventricular arrhythmia in the first 24 hours. Bars for papillary muscle rupture days 2 to 7, interventricular septum rupture days 3 to 5, and free wall rupture days 5 to 14."
        page: 711
        quote: "Death within 0-24 hours post-MI Ventricular arrhythmia"
      - kind: check
        question: "Four days after an MI, a 60-year-old man suddenly develops acute pulmonary edema and a new holosystolic murmur at the apex. What most likely happened?"
        options:
          - "Papillary muscle rupture"
          - "Free wall rupture"
          - "Ventricular arrhythmia"
          - "New plaque rupture"
        answer: 0
        why:
          - "صح: يوم 2–7 ← papillary muscle ← mitral regurgitation حادة."
          - "الـ free wall بيتقطع من يوم 5 لـ 14، وبيعمل tamponade مش murmur."
          - "الـ arrhythmia هي موت أول 24 ساعة."
          - "مش هيعمل murmur جديد بالشكل ده."
        page: 711
        quote: "Macrophage-mediated ruptures: papillary muscle (2–7 days)"
      - kind: explain
        title: "WPW و HOCM"
        text: |-
          **WPW**: مسار إضافي من الـ atria للـ ventricle بيعدّي الـ AV node ← الـ ventricle يبدأ يـ depolarize بدري ← ==delta wave==. ولو عمل reentrant circuit ← SVT.

          **HOCM**: mutation في بروتين الـ sarcomere ← asymmetric septal hypertrophy (sarcomeres in parallel)؛ الموت من arrhythmia. والـ syncope والـ dyspnea من الـ outflow obstruction: الـ septum التخين مع ==systolic anterior motion== للـ mitral valve.
        page: 711
        quote: "Asymmetric septal hypertrophy, systolic anterior motion of mitral valve → outflow obstruction"
      - kind: table
        title: "أنواع الـ shock"
        columns: ["Shock", "Mechanism"]
        rows:
          - ["Hypovolemic", "↓ preload → ↓ SV → ↓ CO"]
          - ["Cardiogenic", "↓ CO from left heart dysfunction"]
          - ["Obstructive", "↓ CO from blockage outside the heart"]
          - ["Distributive", "↓ systemic vascular resistance (afterload)"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 711
        quote: "Obstructive shock ↓ CO due to blockage of vessels/structures outside the heart"
      - kind: aside
        tone: analogy
        text: "الـ shock زي مضخة مية: يا إما **المية خلصت** (hypovolemic)، يا **المضخة بايظة** (cardiogenic)، يا **الماسورة مسدودة** برا المضخة (obstructive)، يا **المواسير وسعت** فالضغط وقع (==distributive==)."
        page: 711
        quote: "Distributive shock ↓ SVR (afterload)"
      - kind: explain
        title: "الباقي في الصفحة"
        text: |-
          - **Thoracic aortic aneurysm**: cystic medial degeneration؛ مرتبط بالـ ==3° syphilis==.
          - **Rheumatic fever**: antibodies ضد الـ M protein بتهاجم أنسجة الجسم (cross-react) ← Type II.
          - **DVT**: ==Virchow triad== (stasis و hypercoagulability و endothelial damage) ← جلطة في وريد عميق.
        page: 711
        quote: "Stasis, hypercoagulability, endothelial damage (Virchow triad) → blood clot within deep vein"
      - kind: try
        items: [rr.L01.071, rr.L01.073, rr.L01.080, rr.L01.084, rr.L01.088]
    recap:
      - "Septum ما اتكوّنش ← truncus؛ ما لفّش ← D-TGA."
      - "Eisenmenger: L→R ← pulmonary HTN ← RVH ← R→L."
      - "أول 24 ساعة arrhythmia؛ 3–14 يوم ruptures بالـ macrophages."
      - "HOCM: septum + systolic anterior motion ← obstruction. WPW: accessory pathway ← delta wave."
      - "Distributive = ↓ systemic vascular resistance؛ الباقي ↓ CO."
