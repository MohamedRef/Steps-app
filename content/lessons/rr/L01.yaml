        hide: [[0, 1], [1, 1], [3, 1]]
        page: 715
        quote: "Rupture of middle meningeal artery, often 2° to skull fracture involving the pterion"
      - kind: explain
        title: "الـ dementias والحركة"
        text: |-
          - **Parkinson**: الـ dopaminergic neurons في الـ ==substantia nigra pars compacta== بتموت.
          - **Huntington**: CAG في الـ HTT (chromosome 4) ← caudate و putamen يضمروا؛ dopamine يعلى و GABA و ACh يقلوا.
          - **Alzheimer**: β-amyloid plaques و tau tangles ← ACh يقل في الـ nucleus basalis of Meynert.
          - **Pick (FTD)**: frontotemporal ← executive function و الـ inhibition يقلوا.
          - **Vascular**: infarcts متعددة. **HIV**: atrophy في الـ gray matter.
        page: 716
        quote: "Trinucleotide (CAG) repeat expansion in huntingtin (HTT) gene on chromosome 4 → toxic gain of function → atrophy of caudate and putamen"
      - kind: explain
        title: "الـ hydrocephalus بأنواعه"
        text: |-
          - **Communicating**: الـ arachnoid granulations مش بتمتص ← ICP يعلى.
          - **Noncommunicating**: سدة جوه الـ ventricles (aqueductal stenosis، colloid cyst عند الـ foramen of Monro، tumor).
          - **Normal pressure hydrocephalus**: الـ ventricles بتوسع وتشد ألياف الـ ==corona radiata== ← wobbly و wacky و wet.
          - **Ex vacuo**: المخ ضمر ← الـ CSF شكله أكتر في الصورة (من غير ضغط عالي).
          - **IIH**: ICP عالي مع dural venous sinus stenosis ← papilledema.
        page: 716
        quote: "expansion of ventricles distorts the fibers of the corona radiata"
      - kind: aside
        tone: trap
        text: "الـ **ex vacuo** مش hydrocephalus حقيقي: الـ ventricles كبيرة لأن ==المخ صغر==، مش لأن الـ CSF محبوس. فمافيش papilledema."
        page: 716
        quote: "↓ brain tissue and neuronal atrophy → appearance of ↑ CSF on imaging"
