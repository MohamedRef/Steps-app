  - id: rr.L01.lesson5
    title: "الغدد والجهاز الهضمي: hormone زيادة أو أنبوبة اتسدت"
    hook: "الـ SIADH بيحبس مية، فإزاي الصوديوم بيطلع في البول؟"
    minutes: 10
    pages: [711, 712]
    topics: [endocrine, gastrointestinal]
    status: unverified
    steps:
      - kind: explain
        title: "الـ CAH والـ SIADH"
        text: |-
          **أشهر CAH**: ==21-hydroxylase== ناقص ← mineralocorticoids و cortisol يقلوا، والـ precursors تتحول sex hormones ← تعلى، والـ 17-hydroxyprogesterone يعلى.

          **SIADH**: ADH عالي ← مية تتحبس. الجسم يحس إن الـ volume زاد ← aldosterone يقل و ANP و BNP يعلوا ← ==صوديوم يطلع في البول== ← الـ hyponatremia تفضل euvolemic.
        page: 711
        quote: "↑ ADH → water retention → ↓ aldosterone, ↑ ANP, ↑ BNP → ↑ urinary Na+ secretion"
      - kind: reveal
        prompt: "ليه الـ hyperthyroidism بيعمل heat intolerance؟ وليه الـ hypothyroidism بيعمل myxedema؟"
        answer: "الـ thyroid hormone بيزوّد الـ **Na⁺/K⁺-ATPase** ← الـ basal metabolic rate يعلى ← حرارة أكتر (calorigenesis) ووزن ينزل. في الـ hypothyroidism الـ **GAGs** بتتراكم في الـ interstitium وتشد مية (osmotic pressure) ← myxedema."
        page: 711
        quote: "↑ Na+/K+-ATPase → ↑ basal metabolic rate → ↑ calorigenesis"
      - kind: explain
        title: "الـ parathyroid والـ diabetes"
        text: |-
          - **1° hyperparathyroidism**: adenoma أو hyperplasia ← PTH عالي.
          - **2° hyperparathyroidism**: Ca قليل و/أو PO4 عالي ← الغدة تكبر ← PTH و ALP يعلوا.
          - **DKA**: insulin قليل أو الاحتياج ليه زاد ← lipolysis ← free fatty acids تتأكسد ← ==ketogenesis==.
          - **HHS**: السكر عالي جداً ← osmolality عالية و osmotic diuresis.
          - **Vascular disease في الـ DM**: nonenzymatic glycation، hyaline arteriosclerosis في الصغيرة، atherosclerosis في الكبيرة.
          - **Zollinger-Ellison**: gastrinoma ← ulcers في الـ duodenum/jejunum و malabsorption.
        page: 712
        quote: "↓ insulin or ↑ insulin requirement → ↑ lipolysis → ↑ free fatty acid oxidation → ↑ ketogenesis"
      - kind: explain
        title: "الأنبوبة: atresia و SMA syndrome و achalasia"
        text: |-
          - **Duodenal atresia**: الـ ==recanalization== فشل (الـ duodenum بيتسد في الجنين وبيرجع يتفتح).
          - **Jejunal/ileal atresia**: الأوعية (غالباً SMA) اتقطعت ← ischemic necrosis للأمعاء.
          - **SMA syndrome**: الدهن حوالين الـ SMA قل ← الزاوية تضيق ← الجزء التالت من الـ duodenum يتزنق بين الـ SMA والـ aorta.
          - **Achalasia**: الـ inhibitory neurons في الـ myenteric plexus بتموت ← الـ LES ==ما بيرتخيش==.
          - **Hirschsprung**: RET loss of function ← الـ neural crest ما هاجرش ← مافيش ganglion cells في الـ distal colon.
          - **Meckel**: الـ vitelline duct ما اتقفلش.
        page: 712
        quote: "Degeneration of inhibitory neurons in myenteric plexus of esophageal wall → failure of LES relaxation"
      - kind: check
        question: "A 1-day-old with Down syndrome has bilious vomiting; x-ray shows a double bubble. What is the embryologic mechanism?"
        options:
          - "Failure of recanalization"
          - "Disruption of mesenteric vessels"
          - "Failure of neural crest migration"
          - "Persistence of the vitelline duct"
        answer: 0
        why:
          - "صح: duodenal atresia = recanalization failure."
          - "ده jejunal/ileal atresia."
          - "ده Hirschsprung."
          - "ده Meckel diverticulum."
        page: 712
        quote: "Duodenal atresia Recanalization failure"
      - kind: explain
        title: "الـ mucosa والالتهاب"
        text: |-
          - **Barrett**: GERD مزمن ← الـ squamous يتحول ==intestinal epithelium== (columnar فيه goblet cells).
          - **NSAID gastritis**: PGE2 يقل ← حماية الـ mucosa تقل.
          - **Celiac**: autoimmune ضد الـ gliadin (القمح) ← malabsorption في الـ distal duodenum و proximal jejunum ← steatorrhea.
          - **Crohn fistulas**: لأن الالتهاب ==transmural== (بياخد الحيطة كلها).
        page: 712
        quote: "Chronic GERD → metaplasia of nonkeratinized stratified squamous epithelium to intestinal epithelium (nonciliated columnar with goblet cells)"
      - kind: figure
        title: "Adenoma-carcinoma sequence"
