        caption: "الترتيب مهم: APC الأول (الخلايا تفك وتتكاثر)، بعدين KRAS (signaling من غير ضابط)، وفي الآخر tumor suppressors زي TP53 و DCC بتضيع."
        alt: "Sequence of four boxes: normal mucosa, loss of APC with decreased adhesion and increased proliferation, KRAS mutation with unregulated signaling, then loss of TP53 and DCC leading to carcinoma."
