  - id: rr.L01.lesson6
    title: "الدم: RBCs بتتكسر وصفايح بتلزق أو ما بتلزقش"
    hook: "كل مرض صفايح هنا ناقصه حاجة واحدة: GpIb ولا GpIIb/IIIa ولا ADAMTS13؟"
