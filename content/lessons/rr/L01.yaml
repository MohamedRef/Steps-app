  - id: rr.L01.lesson8
    title: "المخ: التكوين والـ strokes والنزيف والـ dementia"
    hook: "كل شريان بيقفل بيسيب توقيع: اعرف التوقيع تعرف الشريان"
    minutes: 10
    pages: [715, 716]
    topics: [neurology]
    status: unverified
    steps:
      - kind: explain
        title: "الـ neural tube والمخ وهو بيتكوّن"
        text: |-
          - **Caudal neuropore** ما اتقفلش بأسبوع 4 ← spina bifida occulta و meningocele و myelomeningocele و myeloschisis.
          - **Rostral neuropore** ما اتقفلش ← ==anencephaly== (مافيش forebrain والجمجمة مفتوحة).
          - **Holoprosencephaly**: الـ forebrain ما اتقسمش لـ 2 hemispheres (أسبوع 3–4)، مع SHH mutations.
          - **Lissencephaly**: الـ neurons ما هاجرتش ← مخ أملس من غير gyri.
          - **Chiari I**: الـ tonsils بس نازلة. **Chiari II**: الـ vermis والـ tonsils والـ medulla.
          - **Dandy-Walker**: مافيش vermis ← الـ 4th ventricle يبقى cyst كبير.
          - **Syringomyelia**: cavity في الحبل بتقطع الألياف ==اللي بتعدي== ← cape-like loss للـ pain والـ temperature.
        page: 715
        quote: "Fluid-filled, gliosis-lined cavity within spinal cord; damages crossing spinothalamic tract fibers → cape-like loss of pain and temperature"
      - kind: reveal
        prompt: "ليه الـ syrinx بيضيّع الـ pain والـ temperature بس، ومن غير الـ touch؟"
        answer: "ألياف الـ pain والـ temperature (spinothalamic) بتعدّي الناحية التانية **قدام الـ central canal** في نفس مستوى دخولها، فالـ cavity اللي في النص بتقطعها. الـ dorsal columns (touch و vibration) بتطلع في نفس الناحية ومش بتعدي من النص."
        page: 715
        quote: "Fluid-filled, gliosis-lined cavity within spinal cord; damages crossing spinothalamic tract fibers → cape-like loss of pain and temperature"
      - kind: explain
        title: "القشرة: dominant ولا nondominant؟"
        text: |-
          - **Dominant parietal** ← ==Gerstmann==: agraphia و acalculia و finger agnosia و left-right disorientation.
          - **Nondominant parietal** ← hemispatial neglect للناحية التانية.
          - **Bilateral amygdala** (HSV-1) ← Klüver-Bucy: hyperphagia و hypersexuality و hyperorality.
          - **Dorsal midbrain** (pineal tumor) ← Parinaud: upward gaze palsy و light-near dissociation.
          - **Aphasia**: Wernicke (superior temporal) receptive؛ Broca (inferior frontal) expressive؛ ==conduction== = arcuate fasciculus؛ global = الاتنين.
        page: 715
        quote: "Lesion in the dominant parietal cortex → agraphia, acalculia, finger agnosia, left-right disorientation"
      - kind: figure
        title: "شرايين الـ brainstem والـ syndrome بتاع كل واحد"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="120" y="10" width="120" height="55" rx="10"/>
