  - id: rr.L01.lesson4
    title: "القلب: من الـ septum للـ shock"
    hook: "بعد الـ MI، اليوم اللي المريض فيه بيقولك إيه اللي اتقطع"
    minutes: 9
    pages: [711, 711]
    topics: [cardiovascular]
    status: unverified
    steps:
      - kind: explain
        title: "الـ aorticopulmonary septum: اتعمل؟ لفّ؟"
        text: |-
          - ما اتكوّنش خالص ← ==persistent truncus arteriosus==.
          - اتكوّن بس ما لفّش (spiral) ← ==D-transposition== of great arteries.

          **Tet spells**: البكا أو السخونية أو المجهود ← الـ RV outflow obstruction يزيد ← دم أكتر يعدي right-to-left من الـ VSD ← الطفل يزرق.

          **Eisenmenger**: left-to-right shunt ما اتصلحش ← دم كتير للرئة ← الأوعية تتغير ← pulmonary hypertension ← RVH ← الـ shunt يقلب right-to-left.
        page: 711
        quote: "Uncorrected left-to-right shunt → ↑ pulmonary blood flow → remodeling of vasculature → pulmonary hypertension → RVH → right-to-left shunting"
      - kind: order
        prompt: "رتّب خطوات الـ atherosclerosis"
        steps:
          - "Endothelial cell dysfunction"
          - "Macrophage and LDL accumulation"
          - "Foam cell formation"
          - "Fatty streaks"
          - "Smooth muscle cell migration, ECM deposition"
          - "Fibrous plaque"
          - "Complex atheromas"
        why: "البطانة لازم تتأذى الأول عشان الـ LDL والـ macrophages يدخلوا. الـ macrophage اللي يبلع LDL يبقى foam cell، ودول يعملوا fatty streak، وبعدها العضلات الملسا تيجي تغطيها فتبقى plaque."
        page: 711
        quote: "Endothelial cell dysfunction → macrophage and LDL accumulation → foam cell formation → fatty streaks → smooth muscle cell migration, ECM deposition → fibrous plaque → complex atheromas"
      - kind: explain
        title: "الـ MI وموت المريض بعده"
        text: |-
          الـ **MI**: plaque في الـ coronary بتتفتح ← thrombosis حاد. الـ **NSTEMI** = subendocardial، والـ **STEMI** = ==transmural==.

          - أول **24 ساعة**: الموت غالباً من ==ventricular arrhythmia==.
          - من **3 لـ 14 يوم**: الـ macrophages بتنضّف العضلة الميتة فالحيطة تبقى طرية ← ruptures.
        page: 711
        quote: "Macrophage-mediated ruptures: papillary muscle (2–7 days), interventricular septum (3–5 days), free wall (5–14 days)"
      - kind: figure
        title: "post-MI ruptures على خط الزمن"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="140" x2="340" y2="140"/>
