            <rect class="fg-bad" x="40" y="142" width="80" height="44" rx="6"/>
            <text x="46" y="158" class="t-sm t-bad">Resistant</text>
            <text x="46" y="176" class="t-sm">viridans</text>
            <rect class="fg-good" x="130" y="82" width="100" height="40" rx="6"/>
            <text x="136" y="98" class="t-sm t-good">Sensitive</text>
            <text x="136" y="114" class="t-sm">S epidermidis</text>
