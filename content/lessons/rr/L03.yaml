            <rect class="fg-good" x="250" y="82" width="100" height="40" rx="6"/>
            <text x="256" y="98" class="t-sm t-good">Sensitive</text>
            <text x="256" y="114" class="t-sm">S pyogenes (A)</text>
            <rect class="fg-bad" x="262" y="142" width="92" height="44" rx="6"/>
            <text x="268" y="158" class="t-sm t-bad">Resistant</text>
            <text x="268" y="176" class="t-sm">S agalactiae (B)</text>
          </svg>
        caption: "كل disk بيفرّق بين اتنين شبه بعض: الحساس بيموت حوالين الـ disk، والـ resistant بيكمّل يكبر."
        alt: "Three disk tests. Optochin: sensitive S pneumoniae, resistant viridans streptococci. Novobiocin: sensitive S epidermidis, resistant S saprophyticus. Bacitracin: sensitive S pyogenes group A, resistant S agalactiae group B."
        page: 727
        quote: "Optochin sensitivity Sensitive: S pneumoniae; resistant: viridans streptococci (S mutans, S sanguis, S mitis)"
      - kind: aside
        tone: tip
        text: "حيلة الحفظ: الحرف الأول يمشي مع بعض. **O**ptochin ← pneum**O**niae حساس. **N**ovobiocin: الـ ==S**a**prophyticus== هو اللي **مقاوم** (resistant). **B**acitracin: group **A** حساس و group **B** مقاوم."
        page: 727
        quote: "Novobiocin response Sensitive: S epidermidis; resistant: S saprophyticus"
      - kind: explain
        title: "علامات الأشعة والشريحة في الميكروبيولوجي"
        text: |-
          - **Thumb sign** على lateral neck x-ray ← ==epiglottitis== (H influenzae): الـ epiglottis وارمة فشكلها زي الصباع الكبير.
          - **Steeple sign** (ضيق الـ upper trachea والـ subglottis) ← ==croup== (parainfluenza): الضيق تحت الـ glottis بيخلي الهوا شكله زي برج الكنيسة.
          - **Branching gram ⊕ rods مع sulfur granules** ← Actinomyces israelii.
          - **Hilar lymphadenopathy + granuloma في الـ middle أو lower lobe** ← Ghon complex (1° TB).
          - **Clue cells مع ⊕ whiff test** ← Gardnerella vaginalis.
        page: 727
        quote: "“Thumb sign” on lateral neck x-ray Epiglottitis (Haemophilus influenzae)"
      - kind: check
        question: "A 2-year-old has a barking cough and stridor. Neck x-ray shows narrowing of the upper trachea and subglottis. Most likely organism?"
        options:
          - "Parainfluenza virus"
          - "Haemophilus influenzae"
          - "Gardnerella vaginalis"
          - "Actinomyces israelii"
        answer: 0
        why:
          - "صح: steeple sign = croup، والسبب parainfluenza virus."
          - "H influenzae بيعمل epiglottitis، وعلامتها thumb sign مش steeple."
          - "Gardnerella بتعمل clue cells في الـ vagina."
          - "Actinomyces: branching gram ⊕ rods مع sulfur granules."
        page: 727
        quote: "Narrowing of upper trachea and subglottis (Steeple sign) on x-ray Croup (parainfluenza virus)"
      - kind: explain
        title: "AIDS وطفيليات وفيروسات"
        text: |-
          - **Ring-enhancing brain lesion في AIDS**: لو ==multiple== ← Toxoplasma gondii؛ لو ممكن تكون solitary ← CNS lymphoma.
          - **Dilated cardiomyopathy مع apical atrophy و megacolon و megaesophagus** ← Chagas (Trypanosoma cruzi): الطفيلي بيدمّر الأعصاب والعضلة، فكل أنبوبة عضلية بتوسع.
          - **Atypical lymphocytes + heterophile antibodies** ← infectious mononucleosis (EBV).
          - **Cytoplasmic inclusions في Purkinje cells والـ hippocampus** ← ==Negri bodies== (rabies).
        page: 727
        quote: "Ring-enhancing brain lesion on CT/MRI in AIDS Toxoplasma gondii (multiple), CNS lymphoma (may be solitary)"
      - kind: try
        items: [rr.L03.001, rr.L03.004, rr.L03.007, rr.L03.014, rr.L03.019]
    recap:
      - "CF: ↑ sweat Cl⁻ و ↑ trypsinogen و Pseudomonas، ونقص الـ fat-soluble vitamins."
      - "↑ homocysteine + ↑ MMA = B12. ↓ AFP في الـ second trimester = Down أو Edwards."
      - "Optochin يفرّق pneumoniae عن viridans، novobiocin يفرّق epidermidis عن saprophyticus، bacitracin يفرّق group A عن B."
      - "Thumb sign = epiglottitis، steeple sign = croup، multiple ring-enhancing في AIDS = Toxoplasma."
    practice: [rr.L03.001, rr.L03.002, rr.L03.003, rr.L03.004, rr.L03.005, rr.L03.006, rr.L03.007, rr.L03.008, rr.L03.009, rr.L03.010, rr.L03.011, rr.L03.012, rr.L03.013, rr.L03.014, rr.L03.015, rr.L03.016, rr.L03.017, rr.L03.018, rr.L03.019, rr.L03.020, rr.L03.021, rr.L03.022, rr.L03.023, rr.L03.024]
  - id: rr.L03.lesson2
    title: "Psammoma والقلب والغدد: علامات بتتشاف في الشريحة والـ ECG"
    hook: "Boot-shaped heart و electrical alternans و Orphan Annie: أسماء غريبة بس كل واحدة بتوصف اللي بتشوفه بالظبط"
    minutes: 8
    pages: [727, 727]
    topics: [pathology, cardiovascular, endocrine]
    status: unverified
    steps:
      - kind: explain
        title: "Psammoma bodies: كرات كالسيوم بطبقات"
        text: |-
          **Concentrically laminated calcified spherules** يعني كرات كالسيوم ملفوفة طبقات زي البصلة: دي ==psammoma bodies==.

          بتطلع في 6 أورام: papillary thyroid carcinoma، somatostatinoma، meningioma، mesothelioma، ovarian serous papillary cystadenocarcinoma، و prolactinoma.
        page: 727
        quote: "Concentrically laminated calcified spherules (psammoma Papillary thyroid carcinoma, somatostatinoma"
      - kind: mnemonic
        word: "PSMM"
        parts:
          - { key: "P", text: "Papillary thyroid carcinoma و Prolactinoma" }
          - { key: "S", text: "Somatostatinoma و Serous papillary cystadenocarcinoma of the ovary" }
          - { key: "M", text: "Meningioma" }
          - { key: "M", text: "Mesothelioma" }
        hook: "الكلمة psammoma نفسها فيها الحروف دي: P و S و M و M"
        page: 727
        quote: "meningioma, mesothelioma, ovarian serous papillary cystadenocarcinoma, prolactinoma"
      - kind: explain
        title: "القلب في الأشعة والـ ECG"
        text: |-
          - **Boot-shaped heart** ← tetralogy of Fallot، والشكل ده ==due to RVH==: الـ RV المتضخم بيرفع الـ apex لفوق فيبقى شكل الجزمة.
          - **Rib notching** (الحافة السفلية للضلوع) ← ==coarctation of the aorta==: الدم بيلف حوالين الضيق من الـ intercostal arteries فتوسع وتاكل في الضلع.
          - **Delta wave + short PR** ← WPW: الـ bundle of Kent بيعدّي الـ AV node، فالـ ventricle بيبدأ يتنشّط بدري.
        page: 727
        quote: "Boot-shaped heart on x-ray Tetralogy of Fallot (due to RVH)"
      - kind: reveal
        prompt: "ليه الـ cardiac tamponade بيعمل electrical alternans (R waves طولها بيتغير كل دقة)؟"
        answer: "القلب سايب جوه كيس مليان سوائل، فبيتمرجح يمين وشمال مع كل دقة. لما يقرب من الـ electrode الـ R تطلع كبيرة، ولما يبعد تطلع صغيرة: ==electrical alternans==."
        page: 727
        quote: "Electrical alternans (alternating amplitude of R waves on ECG) Cardiac tamponade"
      - kind: explain
        title: "Aschoff و D-dimer"
        text: |-
          - **Granuloma with giant cells بعد pharyngeal infection** ← ==Aschoff bodies== (rheumatic fever).
          - **↑ fibrin degradation products (D-dimer)** ← DVT أو DIC: الاتنين فيهم جلطة اتكوّنت واتكسّرت، فنواتج تكسير الـ fibrin بتعلى.
        page: 727
        quote: "Granuloma with giant cells after pharyngeal infection Aschoff bodies (rheumatic fever)"
      - kind: check
        question: "A 5-year-old has had a sore throat 3 weeks ago and now has fever, migratory arthritis and a new murmur. A cardiac biopsy would most likely show which finding?"
        options:
          - "Granulomas with giant cells (Aschoff bodies)"
          - "Concentrically laminated calcified spherules"
          - "Interdigitating layers of platelets and RBCs"
          - "Empty-appearing nuclei with central clearing"
        answer: 0
        why:
          - "صح: granuloma with giant cells بعد pharyngeal infection = Aschoff bodies في الـ rheumatic fever."
          - "دي psammoma bodies، في أورام زي papillary thyroid و meningioma."
          - "دي lines of Zahn في جلطة اتكوّنت قبل الوفاة."
          - "دي Orphan Annie eyes في papillary thyroid carcinoma."
        page: 727
        quote: "Granuloma with giant cells after pharyngeal infection Aschoff bodies (rheumatic fever)"
      - kind: figure
        title: "ليه الـ renin بينزل في الـ Conn؟"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker>
            <marker id="rr3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-bad" x="10" y="14" width="120" height="40" rx="8"/>
            <text x="20" y="32" class="t-sm t-b">Adrenal adenoma</text>
            <text x="20" y="47" class="t-sm">↑ aldosterone</text>
            <line class="fg-arrow-acc" x1="130" y1="34" x2="200" y2="34" marker-end="url(#rr3b)"/>
            <rect class="fg-box" x="202" y="14" width="148" height="40" rx="8"/>
            <text x="212" y="32" class="t-sm">Na⁺ and water kept</text>
            <text x="212" y="47" class="t-sm t-b">Hypertension</text>
            <line class="fg-arrow-acc" x1="276" y1="54" x2="276" y2="100" marker-end="url(#rr3b)"/>
            <rect class="fg-good" x="202" y="102" width="148" height="34" rx="8"/>
            <text x="212" y="124" class="t-sm t-b">↓ renin (suppressed)</text>
            <line class="fg-arrow-acc" x1="70" y1="54" x2="70" y2="100" marker-end="url(#rr3b)"/>
            <rect class="fg-box" x="10" y="102" width="150" height="56" rx="8"/>
            <text x="20" y="120" class="t-sm">K⁺ lost → hypokalemia</text>
            <text x="20" y="138" class="t-sm">H⁺ lost → metabolic</text>
            <text x="20" y="152" class="t-sm">alkalosis</text>
            <path class="fg-arrow-bad" d="M276 136 C 276 176, 140 180, 120 160" marker-end="url(#rr3c)" stroke-dasharray="4 3"/>
            <text x="128" y="184" class="t-sm t-mut">autonomous source: renin can't fix it</text>
          </svg>
        caption: "الغدة بتطلّع aldosterone لوحدها. الضغط يعلى فالكلية تقفل الـ renin، والـ K⁺ والـ H⁺ بيتفقدوا في البول."
        alt: "Flow: adrenal adenoma raises aldosterone, which retains sodium and water causing hypertension, which suppresses renin; aldosterone also wastes potassium and hydrogen ions causing hypokalemia and metabolic alkalosis."
        page: 727
        quote: "Hypertension, hypokalemia, metabolic alkalosis, ↑ aldosterone, ↓ renin 1° hyperaldosteronism (eg, Conn syndrome)"
      - kind: explain
        title: "الغدد: Orphan Annie و brown tumor"
        text: |-
          - **Empty-appearing nuclei with central clearing** في خلايا الـ thyroid ← ==Orphan Annie eyes== (papillary thyroid carcinoma). نفس الورم اللي فيه psammoma bodies.
          - **Brown tumor of bone** ← hyperparathyroidism أو osteitis fibrosa cystica. اللون البني جاي من ==hemosiderin== من نزيف قديم جوه العضمة.
        page: 727
        quote: "“Brown” tumor of bone Hyperparathyroidism or osteitis fibrosa cystica (deposited hemosiderin from hemorrhages causes brown color)"
      - kind: aside
        tone: trap
        text: "**Aldosterone عالي** لوحده مش كفاية. لو الـ renin **عالي** معاه يبقى حاجة بتزق الـ adrenal من برّه. الـ ==1° hyperaldosteronism== لازم يبقى ↑ aldosterone مع ↓ renin."
        page: 727
        quote: "Hypertension, hypokalemia, metabolic alkalosis, ↑ aldosterone, ↓ renin 1° hyperaldosteronism (eg, Conn syndrome)"
      - kind: try
        items: [rr.L03.026, rr.L03.028, rr.L03.031, rr.L03.036, rr.L03.037]
    recap:
      - "Psammoma bodies: papillary thyroid، somatostatinoma، meningioma، mesothelioma، serous ovarian، prolactinoma."
      - "Boot-shaped heart = TOF (RVH). Rib notching = coarctation. Delta wave = WPW. Electrical alternans = tamponade."
      - "Aschoff = rheumatic fever. D-dimer = DVT أو DIC."
      - "Conn: HTN و ↓ K⁺ و alkalosis مع ↑ aldosterone و ↓ renin."
    practice: [rr.L03.025, rr.L03.026, rr.L03.027, rr.L03.028, rr.L03.029, rr.L03.030, rr.L03.031, rr.L03.032, rr.L03.033, rr.L03.034, rr.L03.035, rr.L03.036, rr.L03.037, rr.L03.038]
  - id: rr.L03.lesson3
    title: "الجهاز الهضمي: من الـ signet ring للـ nutmeg liver"
    hook: "الأسماء دي كلها وصف لشكل: string و lead pipe و apple core و nutmeg. شوف الشكل وانت هتفتكر"
    minutes: 9
    pages: [727, 728]
    topics: [gastrointestinal]
    status: unverified
    steps:
      - kind: explain
        title: "المعدة والأمعاء الدقيقة"
        text: |-
          - **Mucin-filled cell with peripheral nucleus** ← ==signet ring cells== (diffuse gastric carcinoma): الـ mucin مالي الخلية وزاق النواة على جنب، فشكلها خاتم بفص.
          - **Anti-transglutaminase / anti-deamidated gliadin / anti-endomysial antibodies** ← ==celiac disease== (diarrhea و weight loss).
        page: 727
        quote: "Mucin-filled cell with peripheral nucleus “Signet ring” cells (diffuse gastric carcinoma)"
      - kind: figure
        title: "تلات أشكال للأمعاء في الأشعة"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
