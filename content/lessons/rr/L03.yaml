schema: steps.lesson/v1
lecture: rr.L03
lessons:
  - id: rr.L03.lesson1
    title: "من الـ sweat test لحد الـ Negri body: المعمل بيقولك التشخيص"
    hook: "كل lab finding هنا ليه سبب منطقي. افهم السبب، والتشخيص ييجي لوحده"
    minutes: 9
    pages: [726, 727]
    topics: [biochemistry, immunology, microbiology]
    goals:
      - "تعرف ليه الـ cystic fibrosis بيرفع الـ sweat chloride والـ trypsinogen"
      - "تفرّق بين B12 والـ folate بالـ methylmalonic acid"
      - "تحفظ اختبارات الـ optochin والـ novobiocin والـ bacitracin بمنطق"
    status: unverified
    steps:
      - kind: explain
        title: "Cystic fibrosis: قناة كلور بايظة"
        text: |-
          الـ ==CFTR== قناة بتطلّع الـ Cl⁻ برّه الخلية. لو باظت (autosomal recessive):

          - في **الغدد العرقية**: الكلور ما بيرجعش يتمص، فيطلع في العرق عالي ← **↑ Cl⁻ on sweat test**.
          - في **البنكرياس**: الإفرازات تتقل وتسد القنوات، فالـ trypsinogen يرجع للدم ← **↑ immunoreactive trypsinogen** (ده اللي بيتشاف في الـ newborn screen).
          - في **الرئة**: mucous plugs تقيلة، والـ ==Pseudomonas== بتحب تعشش فيها.

          ومن غير إنزيمات البنكرياس، الدهون ما بتتمصش ← **fat-soluble vitamin deficiency**.
        page: 726
        quote: "Colonies of Pseudomonas in lungs, ↑ Cl– on sweat test, ↑ immunoreactive trypsinogen Cystic fibrosis (autosomal recessive mutation in CFTR gene → fat-soluble vitamin deficiency and mucous plugs)"
      - kind: explain
        title: "الـ prenatal screening في سطرين"
        text: |-
          - **الـ second trimester**: ==↓ AFP== ← Down syndrome أو Edwards syndrome.
          - **الـ first trimester**: ==↑ β-hCG مع ↓ PAPP-A== ← Down syndrome.

          خلي بالك: الـ AFP **العالي** في دم الأم ليه معنى تاني خالص (dating error أو open neural tube defect)، وهنشوفه مع الـ neurology.
        page: 726
        quote: "↓ AFP on second trimester screening Down syndrome, Edwards syndrome"
      - kind: reveal
        prompt: "↑ homocysteine و ↑ methylmalonic acid مع بعض: ليه ده بيقول B12 بالذات مش folate؟"
        answer: "الـ B12 cofactor لإنزيمين: واحد بيحوّل الـ homocysteine لـ methionine، والتاني بيحوّل الـ methylmalonyl-CoA لـ succinyl-CoA. الـ folate بيشارك في الأول بس. فلو الاتنين عاليين يبقى ==vitamin B12 deficiency==؛ لو الـ homocysteine لوحده عالي فكّر في الـ folate."
        page: 726
        quote: "↑ homocysteine, ↑ methylmalonic acid Vitamin B12 deficiency"
      - kind: explain
        title: "أربع علامات في المناعة"
        text: |-
          - **Anti-histone antibodies** ← ==drug-induced lupus==.
          - **↓ T cells و ↓ PTH و ↓ Ca²⁺ و absent thymic shadow** ← thymic aplasia (==22q11 microdeletion==: DiGeorge). الـ thymus والـ parathyroid جايين من نفس الـ pharyngeal pouches، فالاتنين بيضيعوا مع بعض.
          - **Recurrent infections و eczema و thrombocytopenia، ↑ IgE و IgA** ← Wiskott-Aldrich (WAS gene).
          - **Giant granules in phagocytes و pancytopenia** ← Chédiak-Higashi (LYST gene: الـ phagolysosome ما بيتكوّنش).
        page: 726
        quote: "↓ T cells, ↓ PTH, ↓ Ca , absent thymic shadow on CXR Thymic aplasia (22q11 microdeletion: DiGeorge syndrome, velocardiofacial syndrome)"
      - kind: check
        question: "A 1-year-old boy has recurrent otitis media, eczema and petechiae. Labs show thrombocytopenia with high IgE and IgA. Which gene is mutated?"
        options:
          - "WAS"
          - "LYST"
          - "CFTR"
          - "22q11 deletion"
        answer: 0
        why:
          - "صح: infections و eczema و thrombocytopenia مع ↑ IgE و IgA = Wiskott-Aldrich."
          - "LYST = Chédiak-Higashi: giant granules في الـ phagocytes."
          - "CFTR = cystic fibrosis: Pseudomonas و sweat chloride عالي."
          - "22q11 = DiGeorge: ↓ T cells و ↓ Ca²⁺ و مفيش thymic shadow."
        page: 727
        quote: "Recurrent infections, eczema, thrombocytopenia, ↑ IgE and IgA, ↓/normal IgG and IgM"
      - kind: figure
        title: "تلات disks يفرّقوا بين البكتيريا"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rr3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="10" y="10" width="100" height="34" rx="8"/>
            <text x="22" y="32" class="t-sm t-b">Optochin</text>
            <rect class="fg-acc" x="130" y="10" width="100" height="34" rx="8"/>
            <text x="140" y="32" class="t-sm t-b">Novobiocin</text>
            <rect class="fg-acc" x="250" y="10" width="100" height="34" rx="8"/>
            <text x="262" y="32" class="t-sm t-b">Bacitracin</text>
            <line class="fg-arrow" x1="40" y1="44" x2="40" y2="80" marker-end="url(#rr3a)"/>
            <line class="fg-arrow" x1="80" y1="44" x2="80" y2="140" marker-end="url(#rr3a)"/>
            <line class="fg-arrow" x1="160" y1="44" x2="160" y2="80" marker-end="url(#rr3a)"/>
