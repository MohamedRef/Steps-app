  - id: rr.L03.lesson4
    title: "الدم تحت الميكروسكوب: نقط وأجسام وخلايا مدهوسة"
    hook: "الـ smear بيحكي قصة: نقطة جوه الـ RBC ممكن تقولك إن الطحال اتشال"
    minutes: 9
    pages: [728, 729]
    topics: [hematology-oncology]
    status: unverified
    steps:
      - kind: explain
        title: "نقط جوه الـ RBCs"
        text: |-
          - **Basophilic stippling** (نقط كتير صغيرة = ribosomal precipitates) ← ==sideroblastic anemia== و thalassemias.
          - **Basophilic nuclear remnants** (نقطة واحدة كبيرة = بقايا نواة) ← ==Howell-Jolly bodies==. الطحال هو اللي بينضّف البقايا دي، فلو اتشال (splenectomy) أو مش شغال، تفضل في الـ RBC.
        page: 728
        quote: "Basophilic nuclear remnants in RBCs Howell-Jolly bodies (due to splenectomy or nonfunctional spleen)"
      - kind: explain
        title: "الـ anemias في الـ Rapid Review"
        text: |-
          - **Hypochromic, microcytic** ← iron deficiency، lead poisoning، thalassemia، sideroblastic anemia. الأربعة فيهم مشكلة في تصنيع الـ hemoglobin (heme أو globin)، فالخلية بتطلع صغيرة وباهتة.
          - **Hair on end (crew cut) skull** ← β-thalassemia و sickle cell: النخاع بيتمدد (==marrow expansion==) عشان يعوّض، فيزق عضم الجمجمة.
          - **Hypersegmented neutrophils** ← megaloblastic anemia. ==B12 بيعمل neurologic symptoms==، الـ folate لأ.
        page: 728
        quote: "Hypersegmented neutrophils Megaloblastic anemia (vitamin B12 deficiency: neurologic symptoms; folate deficiency: no neurologic symptoms)"
      - kind: check
        question: "A 30-year-old vegan has macrocytic anemia, hypersegmented neutrophils and reduced vibration sense in both feet. Which deficiency?"
        options:
          - "Vitamin B12"
          - "Folate"
          - "Iron"
          - "Lead poisoning"
        answer: 0
        why:
          - "صح: megaloblastic anemia مع neurologic symptoms = B12."
          - "الـ folate بيعمل نفس الـ anemia بس من غير neurologic symptoms."
          - "الـ iron deficiency بتعمل hypochromic microcytic، مش hypersegmented neutrophils."
          - "الـ lead بيعمل microcytic مع basophilic stippling."
        page: 728
        quote: "Hypersegmented neutrophils Megaloblastic anemia (vitamin B12 deficiency: neurologic symptoms; folate deficiency: no neurologic symptoms)"
      - kind: explain
        title: "الـ lymphomas"
        text: |-
          - **Anti-GpIIb/IIIa antibodies** ← immune thrombocytopenia: الـ antibody بيمسك في الـ platelet فالطحال يشيلها.
          - **Giant B cells بنواة bilobed و owl's eye** ← ==Reed-Sternberg cells== (Hodgkin lymphoma).
          - **Starry sky**: sheets of lymphocytes بينهم tingible body macrophages ← ==Burkitt lymphoma==: t(8;14) و c-myc activation، مع EBV.
        page: 728
        quote: "Giant B cells featuring bilobed nuclei with prominent inclusions (“owl’s eye”) Reed-Sternberg cells (Hodgkin lymphoma)"
      - kind: figure
        title: "الـ monoclonal spike في الـ SPEP"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="150" x2="340" y2="150"/>
            <path class="fg-ink" d="M20 150 C 40 150, 45 40, 60 40 C 75 40, 80 150, 100 148 C 120 140, 130 130, 140 140 C 160 130, 170 125, 185 140 C 200 132, 210 128, 225 140 L 250 140 C 262 140, 266 30, 272 30 C 278 30, 282 140, 294 140 L 340 148" fill="none"/>
            <text x="38" y="30" class="t-sm">Albumin</text>
            <text x="250" y="22" class="t-sm t-bad t-b">M spike</text>
            <text x="120" y="168" class="t-sm t-mut">α1   α2   β</text>
            <text x="255" y="168" class="t-sm t-mut">γ</text>
            <text x="150" y="70" class="t-sm">one clone →</text>
            <text x="150" y="86" class="t-sm">one narrow peak</text>
          </svg>
        caption: "Clone واحد من الـ plasma cells بيطلّع نفس الـ immunoglobulin بالظبط، فيطلع peak رفيع وطويل في منطقة الـ γ. ده multiple myeloma (IgG أو IgA)، أو Waldenström (IgM)، أو MGUS."
        alt: "Serum protein electrophoresis curve with a broad albumin peak on the left and a tall narrow monoclonal spike in the gamma region."
        page: 728
        quote: "Monoclonal spike on serum protein electrophoresis Multiple myeloma (usually IgG or IgA); Waldenström macroglobulinemia (IgM); monoclonal gammopathy of undetermined significance"
      - kind: explain
        title: "Multiple myeloma من كل ناحية"
        text: |-
          - **Punched-out lytic lesions** في الـ x-ray ← multiple myeloma.
          - **Stacks of RBCs** ← ==rouleaux== (↑ ESR): الـ protein الكتير بيلزّق الـ RBCs في بعض زي العملات.
          - **M spike** ← myeloma أو Waldenström أو MGUS.
        page: 728
        quote: "Stacks of RBCs Rouleaux formation (↑ ESR, multiple myeloma)"
      - kind: sort
        prompt: "حط كل علامة تحت المرض بتاعها"
        bins: ["APL", "CLL", "Langerhans cell histiocytosis"]
        cards:
          - { text: "Auer rods (MPO ⊕ inclusions)", bin: 0 }
          - { text: "↑↑↑ circulating myeloblasts", bin: 0 }
          - { text: "Smudged WBCs", bin: 1 }
          - { text: "Birbeck granules", bin: 2 }
          - { text: "Tennis racket organelles on EM", bin: 2 }
        why: "الـ ==Auer rods== جوه الـ myeloblasts في الـ APL. الـ CLL خلاياها هشة فبتتهرس على الشريحة (smudge). الـ Birbeck granules شكلها مضرب تنس في الـ Langerhans cells."
        page: 728
        quote: "Myeloperoxidase ⊕ cytoplasmic inclusions in myeloblasts, Auer rods (APL) ↑↑↑ circulating myeloblasts"
      - kind: aside
        tone: trap
        text: "**Stippling** ولا **Howell-Jolly**؟ نقط كتير صغيرة = ribosomes (stippling: sideroblastic أو thalassemia). نقطة واحدة = بقايا نواة (==Howell-Jolly==: مفيش طحال)."
        page: 728
        quote: "Basophilic stippling of RBCs (basophilic ribosomal precipitates) Sideroblastic anemia, thalassemias"
      - kind: try
        items: [rr.L03.055, rr.L03.056, rr.L03.058, rr.L03.061, rr.L03.063]
    recap:
      - "Stippling = sideroblastic أو thalassemia. Howell-Jolly = splenectomy."
      - "Microcytic: iron، lead، thalassemia، sideroblastic. Hair on end = β-thal أو sickle cell."
      - "Hypersegmented = megaloblastic؛ B12 بأعراض عصبية، folate من غيرها."
      - "Reed-Sternberg = Hodgkin، starry sky = Burkitt، Auer rods = APL، smudge = CLL، Birbeck = LCH."
    practice: [rr.L03.054, rr.L03.055, rr.L03.056, rr.L03.057, rr.L03.058, rr.L03.059, rr.L03.060, rr.L03.061, rr.L03.062, rr.L03.063, rr.L03.064, rr.L03.065, rr.L03.066, rr.L03.067, rr.L03.068]
  - id: rr.L03.lesson5
    title: "العضم والمفاصل والمخ: crystals و antibodies و inclusions"
