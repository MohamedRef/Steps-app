        page: 291
        quote: "S4—in late diastole (“atrial kick”). Turbulence caused by blood entering stiffened LV. Best heard at apex with patient in left lateral decubitus position. High atrial pressure. Associated with ventricular noncompliance (eg, hypertrophy)."
