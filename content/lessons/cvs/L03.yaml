        hook: "الـ aortic stenosis بيخلّي المريض SAD (اختصار الكتاب)"
        page: 295
        quote: "Can lead to Syncope, Angina, Dyspnea on exertion (SAD)"
      - kind: explain
        title: "الـ diastolic والـ continuous"
        text: |-
          - **Aortic regurgitation**: early diastolic decrescendo blowing. عند الـ base لو السبب aortic root، وعند الـ left sternal border لو السبب الـ valve. ==wide pulse pressure==، pistol shot femoral pulse، نبض في الضوافر، و head bobbing لو شديد ومزمن. أسبابه **BEAR**: Bicuspid، Endocarditis، Aortic root dilation، Rheumatic fever.
          - **Mitral stenosis**: ==opening snap== وبعده rumble متأخر. كل ما المسافة بين S2 والـ OS تقصر، كل ما الحالة أشد. سببه المميز الـ rheumatic fever، وبيعمل LA كبير و AF و Ortner و hemoptysis و right HF.
          - **PDA**: continuous machinelike تحت الترقوة الشمال، أعلى عند S2. مع الـ congenital rubella والـ prematurity. «You need a patent for that machine».
        page: 295
        quote: "Early diastolic, decrescendo, high-pitched “blowing” murmur best heard at base (aortic root dilation) or left sternal border (valvular disease)"
      - kind: reveal
        prompt: "ليه المسافة بين S2 والـ opening snap بتقصر كل ما الـ mitral stenosis يشتد؟"
        answer: "الـ OS بيحصل لما ضغط الـ LA يغلب ضغط الـ LV والـ valve يفتح. كل ما الـ stenosis يشتد، ==ضغط الـ LA يعلى أكتر== (LA >> LV)، فيغلب الـ LV بدري بعد قفلة الـ aortic، فالـ OS يجي أقرب لـ S2. يعني ↓ interval = ↑ severity."
        page: 295
        quote: "Delayed rumbling mid-to-late murmur (↓ interval between S2 and OS correlates with ↑ severity)"
