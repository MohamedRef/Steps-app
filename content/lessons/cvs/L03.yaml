        caption: "الـ carotid sinus بيبعت على CN IX، والـ aortic arch على CN X، والاتنين للـ nucleus tractus solitarius. لو الضغط وقع: الـ stretch يقل ← الـ firing يقل ← sympathetic يعلى و vagus يقل ← الضغط يرجع."
        alt: "Baroreceptor reflex diagram: carotid sinus via cranial nerve nine and aortic arch via cranial nerve ten send signals to the nucleus tractus solitarius in the medulla, which, when blood pressure falls, raises sympathetic and lowers vagal outflow."
        page: 298
        quote: "Baroreceptors—via aortic arch (CN X) and carotid sinus (CN IX) → nucleus tractus solitarius of medulla; detect arterial pressure changes."
      - kind: explain
        title: "لما الـ reflex يزوّدها"
        text: |-
          - **Carotid sinus hypersensitivity**: حلاقة الرقبة، كرافتة ضيقة، أو carotid massage ← ضغط على الـ carotid sinus ← firing يعلى ← الـ AV node refractory period يطول ← HR يقع + vasodilation ← ==presyncope أو syncope==. بيزيد مع الـ atherosclerosis، عملية قديمة في الرقبة، والسن.
          - **Cushing reflex**: ==hypertension + bradycardia + respiratory depression==. ضغط المخ يعلى ← ischemia ← CO2 يعلى ← الجسم يعلّي الضغط عشان يوصل دم للمخ ← الـ baroreceptors تحس بالضغط العالي فتعمل bradycardia.
        page: 298
        quote: "Component of Cushing reflex (triad of hypertension, bradycardia, and respiratory depression)"
      - kind: check
        question: "An older man nearly faints while shaving his neck. Which nerve carries the afferent signal?"
        options: ["Glossopharyngeal (CN IX)", "Vagus (CN X) from the aortic arch", "Phrenic", "Hypoglossal"]
        answer: 0
        why:
          - "صح: الـ carotid sinus بيبعت على الـ glossopharyngeal للـ nucleus tractus solitarius."
          - "الـ aortic arch على الـ vagus، بس الحلاقة بتضغط على الـ carotid sinus."
          - "الـ phrenic للـ pericardium والـ diaphragm."
          - "الـ hypoglossal motor للسان."
        page: 298
        quote: "Carotid sinus hypersensitivity—elicited by carotid massage, shaving, tight necktie or shirt collar."
