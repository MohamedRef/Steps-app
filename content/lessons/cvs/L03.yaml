  - id: cvs.L03.lesson6
    title: "الضغط بيتظبط إزاي: receptors و autoregulation و Starling forces"
    hook: "ليه مريض الـ COPD بيعيش على الـ hypoxia؟ وليه الرئة بس اللي بتضيّق أوعيتها لما الأكسجين يقل؟"
    minutes: 9
    pages: [298, 299]
    topics: [baroreceptors-chemoreceptors, normal-resting-cardiac-pressures, autoregulation, capillary-fluid-exchange]
    status: unverified
    steps:
      - kind: explain
        title: "الـ chemoreceptors"
        text: |-
          - **Peripheral** (carotid و aortic bodies): بتحس بـ ↑ Pco2، ↓ pH، و ==↓ Po2 (أقل من 60 mm Hg)==.
          - **Central**: بتحس بالـ pH والـ Pco2 في سائل المخ. الـ H+ ما بيعدّيش الـ blood-brain barrier، فاللي بيأثر هو الـ CO2 اللي في الدم. ==ما بتحسش بالـ Po2 خالص==.
        page: 298
        quote: "Peripheral—carotid and aortic bodies are stimulated by ↑ Pco2, ↓ pH of blood, and ↓ Po2 (<60 mm Hg)."
      - kind: reveal
        prompt: "مريض COPD عنده Pco2 عالي من سنين. إيه اللي بقى بيخلّيه يتنفس؟"
        answer: "الـ central chemoreceptors ==اتعودت== على الـ Pco2 العالي وبقت أقل حساسية، فهو بقى معتمد على الـ **peripheral chemoreceptors** اللي بتحس بالـ O2 الواطي عشان تشغّل التنفس."
        page: 298
        quote: "Central chemoreceptors become less sensitive with chronically ↑ Pco2 (eg, COPD) → ↑ dependence on peripheral chemoreceptors to detect ↓ O2 to drive respiration."
      - kind: figure
        title: "الـ baroreceptor reflex"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
