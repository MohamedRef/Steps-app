        why: "كل عضو بيستخدم اللي يناسبه: المخ حساس للـ CO2، والقلب للـ metabolites، والكلية للـ stretch، والجلد للحرارة. والرئة الوحيدة اللي بتضيّق مع الـ hypoxia."
        page: 299
        quote: "Lungs Hypoxia causes vasoconstriction Heart Local metabolites (vasodilatory): NO, CO2, ↓ O2 Brain Local metabolites (vasodilatory): CO2 (pH) Kidneys Myogenic (stretch-dependent response of afferent arteriole) and tubuloglomerular feedback"
      - kind: reveal
        prompt: "ليه الرئة بالذات بتضيّق أوعيتها مع الـ hypoxia، وكل الأعضاء التانية بتوسّع؟"
        answer: "عشان الرئة مش محتاجة أكسجين من الدم، هي اللي بتدّيه. لو حتة من الرئة مش بتتهوّى كويس، مالوش لازمة الدم يروحلها. فبتضيّق أوعيتها ==والدم يروح للحتت اللي بتتهوّى==. باقي الأعضاء لما الأكسجين يقل محتاجة دم أكتر فبتوسّع."
        page: 299
        quote: "The pulmonary vasculature is unique in that alveolar hypoxia causes vasoconstriction so that only well-ventilated areas are perfused. In other organs, hypoxia causes vasodilation"
      - kind: mnemonic
