        hook: "الـ metabolites اللي بتوسّع أوعية العضل في الـ exercise (اختصار الكتاب). وفي الراحة: sympathetic tone."
        page: 299
        quote: "Skeletal muscle Local metabolites during exercise (vasodilatory): CHALK CO2, H+ , Adenosine, Lactate, K+ At rest: sympathetic tone in arteries"
      - kind: explain
        title: "Starling forces والـ edema"
        text: |-
          4 قوى بتحرّك السائل في الـ capillary:
          - **Pc** (hydrostatic جوه): بيزق برا.
          - **Pi** (hydrostatic برا): بيزق جوه.
          - **πc** (oncotic جوه، البروتين): بيشد جوه.
          - **πi** (oncotic برا): بيشد برا.

          ==Jv = Kf [(Pc − Pi) − σ(πc − πi)]==.

          الـ edema بيحصل لما: Pc يعلى (HF)، Kf يعلى (toxins، infections، burns)، πi يعلى (lymphatic blockage)، أو πc يقل (nephrotic، liver failure، malnutrition).
        page: 299
        quote: "Jv = net fluid flow = Kf [(Pc − Pi) − σ(πc − πi)] Kf = capillary permeability to fluid σ = reflection coefficient (measure of capillary impermeability to protein)"
      - kind: check
        question: "A boy with nephrotic syndrome (albumin 1.8 g/dL) has edema. Which Starling force changed?"
        options: ["↓ plasma oncotic pressure (πc)", "↑ capillary hydrostatic pressure (Pc)", "↑ capillary permeability (Kf)", "↑ interstitial oncotic pressure (πi)"]
        answer: 0
        why:
          - "صح: البروتين ضاع في البول ← πc يقل ← السائل ما بيرجعش للـ capillary."
          - "ده الـ HF."
          - "ده الـ burns والـ toxins والـ infections."
          - "ده الـ lymphatic blockage."
        page: 299
        quote: "↓ plasma proteins (↓ πc; eg, nephrotic syndrome, liver failure, protein malnutrition)"
      - kind: explain
        title: "السلك الكهربا بتاع الـ reflex"
        text: |-
          من رسمة الكتاب:

          - **Afferent**: الـ carotid sinus على CN IX، والـ aortic arch على CN X ← الـ **nucleus tractus solitarius** في الـ medulla.
          - **Efferent parasympathetic**: الـ ==dorsal motor nucleus of vagus== والـ ==nucleus ambiguus== ← الـ vagus ← الـ SA و AV nodes (تبطيء).
          - **Efferent sympathetic**: من الـ cardiovascular center ← الـ thoracic spinal cord ← preganglionic ← الـ sympathetic chain ganglion ← postganglionic ← القلب والأوعية.

          وده بالظبط اللي بيشيل المريض في الـ **hypovolemic shock**: الضغط يقع ← الـ firing يقل ← sympathetic يعلى و vagus يهدى ← vasoconstriction و ↑ HR و ↑ contractility. الكتاب بيسميه الـ key compensatory response.
        page: 298
        quote: "Hypotension—key compensatory response in hypovolemic shock."
