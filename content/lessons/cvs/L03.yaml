  - id: cvs.L03.lesson4
    title: "الـ S2 splitting والـ murmurs: اسمع بمخك"
    hook: "كل murmur ليه مكان وتوقيت وحركة بتعلّيه. اعرف الـ 3 دول وهتحل أي سؤال auscultation"
    minutes: 10
    pages: [293, 295]
    topics: [splitting-of-s2, auscultation-of-the-heart, heart-murmurs]
    status: unverified
    steps:
      - kind: explain
        title: "الـ physiologic splitting"
        text: |-
          في الشهيق: الضغط في الصدر يقل ← venous return يزيد ← الـ RV يتملى أكتر ← ==الـ RV ياخد وقت أطول يفضى== ← الـ pulmonic valve يقفل متأخر. كمان الـ pulmonary impedance بيقل في الشهيق، فيأخّر P2 أكتر.

          فـ A2 و P2 بيبعدوا عن بعض في الشهيق، ويرجعوا مع بعض في الزفير.
        page: 293
        quote: "Inspiration → drop in intrathoracic pressure → ↑ venous return → ↑ RV filling → ↑ RV stroke volume → ↑ RV ejection time → delayed closure of pulmonic valve."
      - kind: table
        title: "أنواع الـ splitting"
        columns: ["Type", "Seen in", "Why"]
        rows:
          - ["Wide", "Pulmonic stenosis, RBBB", "RV empties late (exaggerated normal split)"]
          - ["Fixed", "ASD", "L→R shunt keeps RV volume high in both phases"]
          - ["Paradoxical", "Aortic stenosis, LBBB", "A2 delayed after P2; split on expiration only"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 293
        quote: "Wide splitting Seen in conditions that delay RV emptying (eg, pulmonic stenosis, right bundle branch block)."
      - kind: reveal
        prompt: "في الـ paradoxical splitting، ليه الـ split بيختفي في الشهيق؟"
        answer: "الـ A2 متأخر أصلاً (AS أو LBBB)، فبيجي ==بعد== P2. في الشهيق P2 يتأخر زي العادي، فيقرّب من A2 ويلزق فيه ← الـ split يختفي. في الزفير P2 يرجع بدري فتسمع الاتنين. عكس الطبيعي بالظبط."
        page: 293
        quote: "On inspiration, P2 closes later and moves closer to A2, “paradoxically” eliminating the split. On expiration, the split can be heard (opposite to physiologic splitting)."
      - kind: check
        question: "A young woman has a split S2 that doesn't change with breathing. Most likely?"
        options: ["Atrial septal defect", "Left bundle branch block", "Pulmonic stenosis", "Normal finding"]
        answer: 0
        why:
          - "صح: الـ ASD بيعمل fixed splitting، لأن الـ shunt مالي الـ RV في الشهيق والزفير."
          - "الـ LBBB بيعمل paradoxical splitting."
          - "الـ pulmonic stenosis بيعمل wide splitting بيزيد في الشهيق."
          - "الطبيعي بيتغير مع التنفس."
        page: 293
        quote: "Fixed splitting Heard in ASD."
      - kind: figure
        title: "فين تسمع كل murmur (APT M)"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-thin" x="150" y="10" width="40" height="190" rx="6"/>
