        caption: "الـ aortic area على يمين الـ sternum فوق، والـ pulmonic على شماله فوق، والـ tricuspid تحت على الشمال، والـ mitral عند الـ apex. والـ left sternal border للـ HCM والـ AR والـ PR."
        alt: "Diagram of the chest with auscultation points: aortic area right upper sternal border, pulmonic area left upper sternal border, tricuspid area lower left sternal border, mitral area at the apex, and the left sternal border."
        page: 294
        quote: "Systolic murmur Hypertrophic cardiomyopathy Diastolic murmur Aortic regurgitation Pulmonic regurgitation Left sternal border"
      - kind: explain
        title: "الـ maneuvers: كله preload و afterload"
        text: |-
          القاعدة: ==معظم الـ murmurs بتعلى لما الدم يزيد== (passive leg raise، squatting) وتقل لما الدم يقل (standing، Valsalva).

          الاستثناءين: ==HCM و MVP== بيعملوا العكس، لأنهم بيسوءوا لما الـ LV يصغر:
          - LV صغير ← الـ septum يقرّب من الـ outflow (HCM أعلى).
          - LV صغير ← الـ leaflets ترتخي وتـ prolapse بدري (click أبدري).

          الـ **hand grip** (↑↑ afterload) بيعلّي الـ AR والـ MR والـ VSD، ويقلّل الـ AS (الـ gradient يقل) والـ HCM.

          الـ **inspiration** بيعلّي الـ right-sided murmurs، والـ expiration بيعلّي الـ left-sided.
        page: 294
        quote: "Standing, Valsalva (strain phase) ↓ preload (↓ LV volume) MVP (↓ LV volume) with earlier midsystolic click HCM (↓ LV volume) Most murmurs (↓ flow through stenotic or regurgitant valve)"
      - kind: sort
        prompt: "لما المريض يقف من القرفصة (↓ preload)، الـ murmur ده يعلى ولا يوطى؟"
        bins: ["Louder", "Softer"]
        cards:
