            <text x="270" y="160" class="t-sm">4: rest (K+)</text>
          </svg>
        caption: "Phase 0 = الـ Na+ بيدخل بسرعة. Phase 1 = الـ Na+ يقفل. Phase 2 = plateau (الـ Ca2+ داخل والـ K+ طالع بيتعادلوا). Phase 3 = الـ K+ يطلع. Phase 4 = راحة."
        alt: "Ventricular myocyte action potential with phase 0 rapid sodium upstroke, phase 1 brief repolarization, phase 2 calcium plateau, phase 3 potassium repolarization, and phase 4 resting potential near minus 85 millivolts."
        page: 296
        quote: "Phase 0 = rapid upstroke and depolarization— fast voltage-gated Na+ channels open."
      - kind: explain
        title: "الـ plateau هو سر القلب"
        text: |-
          في الـ **phase 2** (الكتاب بيقولها «platwo») الـ Ca2+ داخل من الـ voltage-gated Ca2+ channels وبيعادل الـ K+ الطالع. والـ Ca2+ ده بيشعلل ==Ca2+-induced Ca2+ release== من الـ SR فالخلية تنقبض (excitation-contraction coupling).

          الفرق عن العضل العادي (skeletal) 3 حاجات:
          - فيه **plateau**.
          - محتاج Ca2+ من برا (ECF) عشان يطلّع Ca2+ من الـ SR.
          - الخلايا متوصلة ببعض بـ ==gap junctions== فالكهربا تمشي في القلب كله.
        page: 296
        quote: "Phase 2 = plateau (“platwo”)—Ca2+ influx through voltage-gated Ca2+ channels balances K+ efflux. Ca2+ influx triggers Ca2+ release from SR and myocyte contraction (excitation- contraction coupling)."
      - kind: explain
        title: "الـ pacemaker cells مختلفة"
        text: |-
          في الـ **SA و AV nodes** مافيش phase 1 ولا 2:
          - **Phase 4**: ==funny current (If)== من الـ HCN channels، تيار Na+/K+ داخل ببطء ← الخلية تعلى لوحدها لحد الـ threshold. ده سر الـ automaticity.
          - **Phase 0**: بالـ ==Ca2+ مش الـ Na+==، لأن الـ resting potential أقل سالبية فالـ fast Na+ channels بتبقى ==inactivated== على طول (permanently inactivated) ← conduction بطيء. والـ AV node بيستغل ده عشان يأخّر الكهربا بين الـ atria والـ ventricles.
          - **Phase 3**: الـ Ca2+ يقفل والـ K+ يطلع.
        page: 296
        quote: "Fast voltage-gated Na+ channels are permanently inactivated due to the less negative resting potential of these cells → slow conduction velocity, used by AV node to prolong transmission from atria to ventricles."
      - kind: reveal
        prompt: "إيه اللي بيحدد الـ heart rate؟ وإزاي الـ adenosine والـ catecholamines بيغيّروه؟"
        answer: "==ميل الـ phase 4 في الـ SA node==. الـ ACh والـ adenosine بيقلّلوا الميل ← الخلية تاخد وقت أطول توصل الـ threshold ← HR يقل. الـ catecholamines بيعلّوا الميل (بيفتحوا HCN channels أكتر) ← HR يعلى."
        page: 296
        quote: "The slope of phase 4 in the SA node determines HR. ACh/adenosine ↓ the rate of diastolic depolarization and ↓ HR, while catecholamines ↑ depolarization and ↑ HR."
      - kind: check
        question: "A toxin abolishes the plateau of ventricular myocytes and weakens contraction, but the upstroke is intact. Which channel?"
        options: ["L-type Ca2+ channels", "Fast Na+ channels", "HCN channels", "Delayed-rectifier K+ channels"]
        answer: 0
        why:
          - "صح: الـ plateau هو Ca2+ داخل، والـ Ca2+ ده بيشغّل الانقباض."
          - "الـ Na+ channels بتعمل الـ upstroke، وده سليم."
          - "الـ HCN في الـ pacemaker cells بس."
          - "قفلها كان هيطوّل الـ repolarization مش يلغي الـ plateau."
        page: 296
        quote: "Phase 2 = plateau (“platwo”)—Ca2+ influx through voltage-gated Ca2+ channels balances K+ efflux."
      - kind: order
        prompt: "رتّب طريق الكهربا في القلب"
        steps:
          - "SA node"
          - "Atria (internodal tracts, Bachmann bundle)"
          - "AV node"
          - "Bundle of His"
          - "Right and left bundle branches"
          - "Purkinje fibers"
        why: "الـ SA node في الـ crista terminalis جنب الـ SVC، والـ AV node في الـ interatrial septum جنب فتحة الـ coronary sinus وبيأخّر 100 msec عشان الـ ventricles تتملى."
        page: 297
        quote: "Conduction pathway: SA node → right atrium (via internodal tracts) and left atrium (via interatrial bundle/Bachmann bundle) → AV node → bundle of His → right bundle branch and left bundle branch"
      - kind: aside
        tone: tip
        text: "سرعة التوصيل: His-Purkinje > Atria > Ventricles > AV node. الكتاب: «==He Parks At Ventura AVenue==». والـ pacemaker rates: SA > atria > AV > His/Purkinje/ventricles."
        page: 297
        quote: "Speed of conduction: His-Purkinje > Atria > Ventricles > AV node. He Parks At Ventura AVenue."
      - kind: table
        title: "الـ ECG"
        columns: ["Part", "Meaning", "Normal / clue"]
        rows:
          - ["P wave", "Atrial depolarization", ""]
          - ["PR interval", "Atrial start → ventricular start", "120-200 msec"]
          - ["QRS", "Ventricular depolarization", "≤100 msec"]
          - ["T wave", "Ventricular repolarization", "Inversion: ischemia or recent MI"]
          - ["U wave", "", "Prominent in hypokalemia, bradycardia"]
        hide: [[1, 2], [2, 2], [4, 2]]
        page: 297
        quote: "PR interval—time from start of atrial depolarization to start of ventricular depolarization (normally 120-200 msec). QRS complex—ventricular depolarization (normally ≤100 msec)."
      - kind: explain
        title: "ANP و BNP"
        text: |-
          - **ANP**: من الـ atria لما الحجم والضغط يعلوا. بيشتغل بـ ==cGMP==. بيوسّع الأوعية، ويقلّل امتصاص الـ Na+ في الـ collecting tubule، ويوسّع الـ afferent ويضيّق الـ efferent ← diuresis. وده جزء من الـ «aldosterone escape».
          - **BNP**: من الـ ventricles لما الـ tension يعلى. نفس الشغل بس half-life أطول. التحليل بتاعه ممتاز للـ HF، خصوصاً الـ ==negative predictive value==: لو واطي، الـ HF مستبعد.
        page: 297
        quote: "Released from atrial myocytes in response to ↑ blood volume and atrial pressure. Acts via cGMP."
      - kind: explain
        title: "مين بيشيل كل phase؟"
        text: |-
          **الـ ventricular myocyte** (الرسمة الشمال في الكتاب):
          - Phase 0: ==INa== (Na+ داخل بسرعة)
          - Phase 1: IK (K+ خارج شوية)
          - Phase 2: ICa و IK مع بعض، فالخط ثابت (plateau)
          - Phase 3: IK (K+ خارج فيرجع للسالب)
          - Phase 4: IK غالب، والـ resting حوالي ==−85 mV==

          **الـ pacemaker** (SA و AV node):
          - Phase 4: If (Na+ و K+) ومعاه ICa من نوع **T-type** بيطلّعوا الـ membrane لحد الـ threshold
          - Phase 0: ICa من نوع ==L-type== (مش Na+، عشان كده الطلعة أبطأ)
          - Phase 3: IK

          تحشيشة: T-type = «Tiny/Transient» بيكمّل الـ phase 4، و L-type = «Long-lasting» بيعمل الطلعة والـ plateau.
        page: 296
        quote: "Phase 4 If (Na+ and K+ ) and ICa (T-type) Threshold ICa (L-type) Phase 0 Phase 3 (IK)"
      - kind: try
        items: [cvs.L03.073, cvs.L03.076, cvs.L03.083, cvs.L03.084, cvs.L03.086]
    recap:
