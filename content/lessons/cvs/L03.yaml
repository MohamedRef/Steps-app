        page: 298
        quote: "Pulmonary capillary wedge pressure (PCWP; mm Hg) estimates left atrial pressure and LV end-diastolic pressure (LVEDP), except in mitral stenosis, where PCWP > LVEDP. Measured via Swan-Ganz catheter."
