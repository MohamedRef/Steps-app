        text: |-
          - **S1**: قفلة الـ mitral والـ tricuspid. أعلى حاجة في الـ mitral area.
          - **S2**: قفلة الـ aortic والـ pulmonary. أعلى حاجة في الـ left upper sternal border.
          - **S3**: ==early diastole== (rapid filling). دم من الـ LA بيخبط في ESV كبير. مع ↑ filling pressures (MR، AR، HF، thyrotoxicosis) والـ dilated ventricles. ممكن يبقى طبيعي في الأطفال والشباب والرياضيين والحوامل.
          - **S4**: ==late diastole== (atrial kick). دم داخل LV ناشف. مع الـ hypertrophy. شائع في الكبار، وغير طبيعي لو بيتحس باليد.

          الاتنين (S3 و S4) أحسن حاجة على الـ apex والمريض نايم على جنبه الشمال.
