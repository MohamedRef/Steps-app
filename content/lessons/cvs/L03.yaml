      - kind: explain
        title: "يعني إيه autoregulation؟"
        text: |-
          ==Autoregulation==: قدرة العضو إنه يحافظ على الـ blood flow بتاعه ثابت، حتى لو الـ perfusion pressure طلع ونزل في مدى واسع.

          كل عضو بيعمل ده بطريقته، وده اللي هنوصّله دلوقتي.
        page: 299
        quote: "Autoregulation How blood flow to an organ remains constant over a wide range of perfusion pressures."
      - kind: match
