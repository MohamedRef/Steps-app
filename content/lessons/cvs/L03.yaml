schema: steps.lesson/v1
lecture: cvs.L03
lessons:
  - id: cvs.L03.lesson1
    title: "الـ stroke volume: 3 زراير بيتحكموا في كل حاجة"
    hook: "Contractility و Preload و Afterload. افهمهم صح وأي دوا قلب هتعرف بيعمل إيه من غير حفظ"
    minutes: 10
    pages: [288, 289]
    topics: [cardiac-output-variables, cardiac-output-equations]
    goals:
      - "تعرف إيه اللي بيعلّي ويقلّل الـ SV"
      - "تفهم الـ β1 والـ digoxin بيقوّوا القلب إزاي"
      - "تحفظ معادلات الـ CO والـ EF والـ MAP والـ pulse pressure بالمنطق"
    status: unverified
    steps:
      - kind: explain
        title: "SV CAP"
        text: |-
          الـ **stroke volume** (الدم اللي بيطلع في كل ضربة) بيتحكم فيه 3 حاجات، والكتاب بيقولهم ==SV CAP==:
          - **Contractility**: القلب بيعصر قد إيه. يعلى مع الـ anxiety والـ exercise.
          - **Afterload**: الضغط اللي القلب بيزق ضده. كل ما يقل، الـ SV يزيد.
          - **Preload**: القلب اتملى قد إيه قبل ما يعصر. يعلى مثلاً في أول الحمل.

          والـ **stroke work** = الشغل اللي بيعمله الـ ventricle عشان يطلّع الـ SV، و ==SW ∝ SV × MAP==.
        page: 288
        quote: "Stroke Volume affected by Contractility, Afterload, and Preload. ↑ SV with: ↑ Contractility (eg, anxiety, exercise) ↑ Preload (eg, early pregnancy) ↓ Afterload SV CAP."
      - kind: explain
        title: "الـ β1 بيقوّي القلب إزاي؟"
        text: |-
          الـ catecholamine يركب على **β1** ← cAMP ← ==protein kinase A== تشتغل، وبتعمل حاجتين:
          - تعمل phosphorylation للـ ==phospholamban== ← الـ Ca2+ ATPase بتاعة الـ SR تشتغل ← Ca2+ أكتر متخزن في الـ SR للضربة الجاية.
          - تعمل phosphorylation للـ Ca2+ channels ← Ca2+ يدخل أكتر ← Ca2+-induced Ca2+ release أكبر.

          النتيجة: Ca2+ أكتر جوه الخلية = عصرة أقوى.
        page: 288
        quote: "Catecholamine stimulation via β1 receptor: Activated protein kinase A → phospholamban phosphorylation → active Ca2+ ATPase → ↑ Ca2+ storage in sarcoplasmic reticulum (SR)"
      - kind: reveal
        prompt: "الـ digoxin بيوقف الـ Na+/K+ pump. إزاي ده بيخلّي القلب يعصر أقوى؟"
        answer: "الـ pump وقف ← Na+ يتراكم جوه الخلية ← الـ **Na+/Ca2+ exchanger** (اللي بيطلّع Ca2+ مقابل Na+ داخل) مش لاقي gradient يشتغل بيه ← Ca2+ يفضل جوه ← ==intracellular Ca2+ يعلى== ← contractility تعلى."
        page: 288
        quote: "Digoxin (blocks Na+ /K+ pump → ↑ intracellular Na+ → ↓ Na+ /Ca2+ exchanger activity → ↑ intracellular Ca2+ )"
      - kind: sort
        prompt: "حط كل حاجة في مكانها: بتعلّي ولا بتقلّل الـ contractility؟"
        bins: ["↑ contractility", "↓ contractility"]
        cards:
          - { text: "Digoxin", bin: 0 }
          - { text: "β1 stimulation (catecholamines)", bin: 0 }
          - { text: "↑ intracellular Ca2+", bin: 0 }
          - { text: "β1-blockade", bin: 1 }
          - { text: "Acidosis", bin: 1 }
          - { text: "Hypoxia/hypercapnia", bin: 1 }
          - { text: "Nondihydropyridine Ca2+ channel blockers", bin: 1 }
          - { text: "Systolic heart failure", bin: 1 }
        why: "كل حاجة بتعلّي الـ Ca2+ جوه الخلية بتقوّي العصرة. والـ β-blocker بيقلّل الـ cAMP، والـ verapamil/diltiazem بيقفلوا باب الـ Ca2+، والـ acidosis والـ hypoxia بيتعبوا العضلة."
        page: 288
        quote: "Contractility (and SV) ↓ with: β1-blockade (↓ cAMP) Heart failure (HF) with systolic dysfunction Acidosis Hypoxia/hypercapnia (↓ Po2/↑ Pco2) Nondihydropyridine Ca2+ channel blockers"
      - kind: explain
        title: "Preload و Afterload"
        text: |-
          - **Preload** ≈ ==EDV== (حجم الدم في آخر الـ diastole). بيعتمد على الـ venous tone وحجم الدم، والاتنين بيأثروا على الـ venous return. الـ **nitroglycerin** (venous dilator) بيقلّله.
          - **Afterload** ≈ ==MAP==. ضغط أعلى ← wall tension أعلى (Laplace) ← afterload أعلى. الـ **hydralazine** (arterial dilator) بيقلّله.
          - الـ ACE inhibitors والـ ARBs بيقلّلوا الاتنين.
        page: 288
        quote: "Venous vasodilators (eg, nitroglycerin) ↓ preload."
      - kind: figure
        title: "Laplace: ليه القلب بيتخن؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-box" cx="80" cy="85" r="55"/>
            <circle class="fg-thin" cx="80" cy="85" r="47"/>
            <text x="40" y="160" class="t-sm">thin wall: high stress</text>
            <circle class="fg-good" cx="260" cy="85" r="55"/>
            <circle class="fg-box" cx="260" cy="85" r="35"/>
            <text x="205" y="160" class="t-sm t-good">thick wall: stress falls</text>
            <text x="120" y="20" class="t-sm t-b">stress = P × r / (2 × h)</text>
            <text x="245" y="90" class="t-sm">P ↑</text>
            <text x="68" y="90" class="t-sm">P ↑</text>
          </svg>
        caption: "الـ wall stress = الضغط × نص القطر ÷ (2 × سُمك الحيطة). لو الضغط علي (hypertension)، الطريقة الوحيدة إن الـ stress يرجع طبيعي إن الحيطة تتخن: LV hypertrophy."
        alt: "Two circles representing the left ventricle under high pressure: a thin wall with high stress, and a thick wall where stress falls, with the formula stress equals pressure times radius over twice wall thickness."
        page: 288
        quote: "Wall tension follows Laplace’s law: Wall tension = pressure × radius Wall stress = pressure × radius 2 × wall thickness"
      - kind: aside
        tone: exam
        text: "الـ ==myocardial O2 demand== بيعلى مع 4 حاجات: contractility، afterload، heart rate، وقطر الـ ventricle (wall tension). وأكتر دم ناقص أكسجين في الجسم كله في الـ **coronary sinus**، لأن القلب بيسحب معظم الأكسجين من الدم اللي بيوصله."
        page: 288
        quote: "Myocardial O2 demand is ↑ by: ↑ contractility ↑ afterload (proportional to arterial pressure) ↑ heart rate ↑ diameter of ventricle (↑ wall tension) Coronary sinus contains most deoxygenated blood in body."
      - kind: check
        question: "Which drug lowers both preload and afterload?"
        options: ["Nitroglycerin", "Hydralazine", "Lisinopril (ACE inhibitor)", "Dobutamine"]
        answer: 2
        why:
          - "الـ nitroglycerin venous dilator: بيقلّل الـ preload أساساً."
          - "الـ hydralazine arterial dilator: بيقلّل الـ afterload."
          - "صح: الـ ACE inhibitors والـ ARBs بيقلّلوا الـ preload والـ afterload مع بعض."
          - "الـ dobutamine بيعلّي الـ contractility."
        page: 288
        quote: "ACE inhibitors and ARBs ↓ both preload and afterload."
      - kind: table
        title: "المعادلات"
        columns: ["Quantity", "Equation"]
        rows:
          - ["Stroke volume", "SV = EDV − ESV"]
          - ["Ejection fraction", "EF = SV / EDV (normal 50%-70%)"]
          - ["Cardiac output", "CO = SV × HR"]
          - ["Fick", "CO = O2 consumption / (arterial − venous O2 content)"]
          - ["Pulse pressure", "PP = SBP − DBP"]
          - ["MAP", "MAP = CO × TPR = 2/3 DBP + 1/3 SBP"]
        hide: [[0, 1], [1, 1], [3, 1], [5, 1]]
        page: 289
        quote: "MAP = CO × total peripheral resistance (TPR) MAP (at resting HR) = 2/3 DBP + 1/3 SBP = DBP + 1/3 PP."
      - kind: explain
        title: "ليه الـ MAP مش متوسط عادي؟"
        text: |-
          القلب بيقضي وقت في الـ diastole أكتر من الـ systole (وهو مرتاح)، فالـ MAP أقرب للـ diastolic: ==2/3 DBP + 1/3 SBP==.

          والـ **EF** مقياس للـ contractility: يقل في الـ **systolic HF**، وغالباً طبيعي في الـ diastolic HF.

          ولو الـ HR علي جداً (زي VT)، الـ ==diastole بيقصر== ← وقت ملء أقل ← SV أقل ← CO يقع.
        page: 289
        quote: "Diastole is shortened with ↑↑ HR (eg, ventricular tachycardia) → ↓ diastolic filling time → ↓ SV → ↓ CO."
      - kind: reveal
        prompt: "الـ pulse pressure بيتناسب طردياً مع الـ SV وعكسياً مع الـ arterial compliance. يبقى إمتى يوسع وإمتى يضيق؟"
        answer: "**يوسع** (SV كبير أو شرايين ناشفة): aortic regurgitation، aortic stiffening عند الكبار (isolated systolic hypertension)، obstructive sleep apnea، high-output states (anemia و hyperthyroidism)، و exercise.\n\n**يضيق** (SV صغير): ==aortic stenosis==، cardiogenic shock، cardiac tamponade، advanced HF."
        page: 289
        quote: "↑ PP in aortic regurgitation, aortic stiffening (isolated systolic hypertension in older adults), obstructive sleep apnea (↑ sympathetic tone), high-output state (eg, anemia, hyperthyroidism), exercise (transient). ↓ PP in aortic stenosis, cardiogenic shock, cardiac tamponade, advanced HF."
      - kind: check
        question: "A patient consumes 250 mL O2/min. Arterial O2 content is 20 mL/100 mL, venous is 15 mL/100 mL. Cardiac output?"
        options: ["2.5 L/min", "5 L/min", "1.25 L/min", "50 mL/min"]
        answer: 1
        why:
          - "ده لو حسبت الفرق 10 mL لكل 100 mL بدل 5. الفرق 20 − 15 = 5 mL لكل 100 mL، يعني 0.05 mL لكل mL."
          - "صح: 250 ÷ 0.05 = 5000 mL/min = 5 L/min."
          - "ده لو قسمت على الـ arterial content لوحده (0.20) بدل الفرق: 250 ÷ 0.20 = 1250 mL/min."
          - "ده لو قسمت 250 على 5 ونسيت إن الـ 5 دي لكل 100 mL."
        page: 289
        quote: "Fick principle: CO = rate of O2 consumption (arterial O2 content – venous O2 content)"
      - kind: try
        items: [cvs.L03.001, cvs.L03.005, cvs.L03.009, cvs.L03.021, cvs.L03.022]
    recap:
      - "SV CAP: الـ SV يعلى مع ↑ contractility و ↑ preload و ↓ afterload."
      - "الـ β1 ← PKA ← phospholamban و Ca2+ channels؛ الـ digoxin ← Na+ جوه ← Ca2+ جوه."
      - "Preload ≈ EDV (nitrates)، afterload ≈ MAP (hydralazine)؛ ACEi/ARB الاتنين."
      - "Laplace: ضغط عالي ← الحيطة تتخن عشان الـ stress يقل."
      - "MAP = 2/3 DBP + 1/3 SBP؛ PP يوسع مع SV كبير ويضيق في AS و tamponade."
    practice: [cvs.L03.001, cvs.L03.002, cvs.L03.003, cvs.L03.004, cvs.L03.005, cvs.L03.006, cvs.L03.007, cvs.L03.008, cvs.L03.009, cvs.L03.010, cvs.L03.011, cvs.L03.012, cvs.L03.013, cvs.L03.014, cvs.L03.015, cvs.L03.016, cvs.L03.017, cvs.L03.018, cvs.L03.019, cvs.L03.020, cvs.L03.021, cvs.L03.022, cvs.L03.023, cvs.L03.024, cvs.L03.114, cvs.L03.123, cvs.L03.124, cvs.L03.130, cvs.L03.131]
  - id: cvs.L03.lesson2
    title: "Starling والمقاومة والـ curves اللي بتتقاطع"
    hook: "ليه نص قطر الشريان بيضاعف المقاومة 16 مرة؟ وإيه اللي بيحصل للـ curves في الـ spinal anesthesia؟"
    minutes: 8
    pages: [289, 290]
    topics: [starling-curves, resistance-pressure-flow, cardiac-vascular-function-curves]
    status: unverified
    steps:
      - kind: explain
        title: "Frank-Starling"
        text: |-
          ==قوة الانقباض بتتناسب مع طول الـ fiber في آخر الـ diastole== (الـ preload). يعني كل ما القلب يتملى أكتر، يعصر أجمد، لحد حد معين.

          على الرسمة: الـ x = EDV (preload)، والـ y = SV.
          - **تتحرك على نفس الـ curve**: لما الـ preload يتغير.
          - **الـ curve كله يطلع لفوق**: contractility أعلى (catecholamines، dobutamine، milrinone، digoxin).
          - **الـ curve ينزل لتحت**: contractility أقل (MI، β-blockers acutely، non-DHP CCBs، HF).
        page: 289
        quote: "Force of contraction is proportional to end- diastolic length of cardiac muscle fiber (preload). ↑ contractility with catecholamines, positive inotropes (eg, dobutamine, milrinone, digoxin)."
      - kind: figure
        title: "Starling curves"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="40" y1="170" x2="340" y2="170"/>
            <line class="fg-ink" x1="40" y1="170" x2="40" y2="15"/>
            <text x="150" y="192" class="t-sm">EDV (preload)</text>
            <text x="4" y="30" class="t-sm">SV</text>
            <path class="fg-arrow-acc" d="M45 160 C 100 60, 160 35, 330 30" fill="none"/>
            <text x="250" y="24" class="t-sm t-acc">↑ inotropy</text>
            <path class="fg-arrow" d="M45 165 C 110 90, 170 70, 330 65" fill="none"/>
            <text x="270" y="60" class="t-sm">normal</text>
            <path class="fg-arrow-bad" d="M45 168 C 120 130, 190 115, 330 110" fill="none"/>
            <text x="260" y="105" class="t-sm t-bad">heart failure</text>
          </svg>
        caption: "كل curve بيوصف قلب بـ contractility معينة. الـ preload بيحركك على الـ curve، والـ inotropes بيطلّعوا الـ curve كله لفوق، والـ HF بينزّله."
        alt: "Graph of stroke volume against end-diastolic volume with three curves: positive inotropy highest, normal in the middle, heart failure lowest."
        page: 289
        quote: "↓ contractility with loss of functional myocardium (eg, MI), β-blockers (acutely), nondihydropyridine Ca2+ channel blockers, HF."
      - kind: explain
        title: "المقاومة: الـ r أس 4"
        text: |-
          R = 8η × length / ==πr4==. يعني المقاومة بتتناسب مع **1/r4**.

          نص القطر يقل للنص ← المقاومة تزيد 2⁴ = ==16 مرة==. عشان كده الـ arterioles (اللي بتقدر تضيّق وتوسّع) هي اللي عاملة معظم الـ **TPR**.

          - على التوالي (series): R الكلية = R1 + R2 + R3.
          - على التوازي (parallel): 1/R = 1/R1 + 1/R2 + 1/R3.
          - ΔP = flow × R، زي قانون Ohm.
        page: 290
        quote: "Resistance (R) = driving pressure (ΔP) = 8η (viscosity) × length πr4"
      - kind: match
        prompt: "وصّل كل وعاء بالصفة بتاعته"
        pairs:
          - ["Capillaries", "Highest total cross-sectional area, lowest velocity"]
          - ["Arterioles", "Most of TPR"]
          - ["Veins", "Most of blood storage capacity"]
        why: "الـ capillaries كتير جداً فمساحتها الكلية كبيرة فالدم بيمشي فيها ببطء (وقت للتبادل). الـ arterioles بتتحكم في القطر فبتعمل المقاومة. والـ veins واسعة ومطاطة فبتخزّن الدم."
        page: 290
        quote: "Capillaries have highest total cross-sectional area and lowest flow velocity. Pressure gradient drives flow from high pressure to low pressure. Arterioles account for most of TPR. Veins provide most of blood storage capacity."
      - kind: aside
        tone: tip
        text: "الـ ==viscosity بتعتمد أساساً على الـ hematocrit==. تعلى في الـ polycythemia والـ hyperproteinemia (multiple myeloma)، وتقل في الـ anemia."
        page: 290
        quote: "Viscosity depends mostly on hematocrit. Viscosity ↑ in hyperproteinemic states (eg, multiple myeloma), polycythemia. Viscosity ↓ in anemia."
      - kind: check
        question: "The radius of an artery falls to half. Pressure, viscosity and length are unchanged. Resistance becomes:"
        options: ["2 times higher", "4 times higher", "16 times higher", "Half"]
        answer: 2
        why:
          - "ده لو R ∝ 1/r."
          - "ده لو R ∝ 1/r²."
          - "صح: R ∝ 1/r4، فـ 2⁴ = 16."
          - "قطر أصغر يعني مقاومة أكبر."
        page: 290
        quote: "∝ r4 R ∝ 1/r4"
      - kind: explain
        title: "الـ cardiac والـ vascular function curves"
        text: |-
          فيه curveين على نفس الرسمة، والـ x فيهم = **RAP** (right atrial pressure):
          - **Cardiac function curve**: القلب بيطلّع قد إيه عند كل RAP (Starling).
          - **Vascular function curve**: الدم بيرجع قد إيه عند كل RAP.

          ==نقطة التقاطع هي الـ operating point==: هناك الـ venous return = الـ CO، لأن الدورة مقفولة.
        page: 290
        quote: "Intersection of curves = operating point of heart (ie, venous return and CO are equal, as circulatory system is a closed system)."
      - kind: table
        title: "إيه اللي بيحرّك كل curve"
        columns: ["Change", "↑ by", "↓ by"]
        rows:
          - ["Inotropy (cardiac curve up/down)", "Catecholamines, dobutamine, digoxin, exercise", "HF with reduced EF, narcotic overdose, sympathetic inhibition"]
          - ["Venous return (vascular curve right/left)", "Fluid infusion, sympathetic activity, AV shunt", "Acute hemorrhage, spinal anesthesia"]
          - ["TPR (vascular curve rotates)", "Vasopressors", "Exercise, AV shunt"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
        page: 290
        quote: "Catecholamines, dobutamine, digoxin, exercise ⊕ HF with reduced EF, narcotic overdose, sympathetic inhibition ⊝"
      - kind: aside
        tone: analogy
        text: "الـ exercise بيعمل حاجتين مع بعض في نفس الاتجاه: يعلّي الـ inotropy ويقلّل الـ TPR، فالـ CO يطير (reinforcing). أما الـ HF فبيقلّل الـ inotropy، والجسم يعوّض بـ fluid retention يعلّي الـ preload عشان الـ CO يفضل ماشي (compensatory)."
        page: 290
        quote: "Changes often occur in tandem, and may be reinforcing (eg, exercise ↑ inotropy and ↓ TPR to maximize CO) or compensatory (eg, HF ↓ inotropy → fluid retention to ↑ preload to maintain CO)."
      - kind: check
        question: "A woman's blood pressure falls after spinal anesthesia. Which curve change is primary?"
        options: ["Cardiac curve shifts down", "Vascular curve shifts left (↓ venous return)", "Vascular curve rotates for ↑ TPR", "Cardiac curve shifts up"]
        answer: 1
        why:
          - "الـ spinal anesthesia مش بتضعف الـ contractility أساساً."
          - "صح: الـ spinal anesthesia (زي الـ hemorrhage) بتقلّل الـ venous return، فالـ vascular curve يروح شمال."
          - "بالعكس، الـ sympathetic block بيوسّع الأوعية."
          - "ده يحصل مع catecholamines أو exercise."
        page: 290
        quote: "Acute hemorrhage, spinal anesthesia ⊝"
      - kind: explain
        title: "رسمة Starling: 3 منحنيات"
        text: |-
          في رسمة الكتاب فيه 3 منحنيات للـ SV قدام الـ EDV:

          - **Normal**: فوق.
          - **Heart failure**: تحت، لأن الـ ==contractility قلّت==، فنفس الـ EDV بيدي SV أقل.
          - **HF + positive inotrope**: في النص؛ الدوا رفع الـ contractility فرجّع المنحنى لفوق شوية.

          ولو ماشي على المنحنى الطبيعي نفسه: rest ← walking ← running بتطلع لفوق ولليمين، لأن الـ venous return بيزيد فالـ ==EDV يزيد== والقلب يعصر أكتر (Frank-Starling). يعني الـ inotrope بيغيّر **المنحنى**، والـ preload بيحركك **على** المنحنى.
        page: 289
        quote: "Normal (rest) Heart failure + positive inotrope Heart failure Stroke volume (CO) Ventricular EDV (preload) Running Walking Rest Myocardial contractility"
      - kind: try
        items: [cvs.L03.026, cvs.L03.028, cvs.L03.031, cvs.L03.035]
    recap:
      - "Starling: preload يحركك على الـ curve؛ inotropy يطلّعه أو ينزّله."
      - "R ∝ 1/r4: نص القطر = 16 ضعف المقاومة. الـ arterioles = معظم الـ TPR، الـ veins = المخزن."
      - "الـ viscosity من الـ hematocrit."
      - "تقاطع الـ curves = operating point (CO = venous return)."
      - "Hemorrhage و spinal anesthesia ← venous return يقل؛ vasopressors ← TPR يعلى."
    practice: [cvs.L03.025, cvs.L03.026, cvs.L03.027, cvs.L03.028, cvs.L03.029, cvs.L03.030, cvs.L03.031, cvs.L03.032, cvs.L03.033, cvs.L03.034, cvs.L03.035, cvs.L03.036, cvs.L03.037, cvs.L03.110, cvs.L03.125, cvs.L03.132, cvs.L03.133, cvs.L03.145]
  - id: cvs.L03.lesson3
    title: "الـ cardiac cycle: الـ PV loop والأصوات والـ JVP"
    hook: "رسمة واحدة (الـ PV loop) لو فهمتها هتعرف كل valve disease بيعمل إيه في الـ EDV والـ ESV"
    minutes: 10
    pages: [291, 292]
    topics: [pressure-volume-loops-cardiac-cycle, jugular-venous-pressure-tracings, pressure-volume-loops-valvular-disease]
    status: unverified
    steps:
      - kind: figure
        title: "الـ PV loop"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <line class="fg-ink" x1="40" y1="190" x2="340" y2="190"/>
            <line class="fg-ink" x1="40" y1="190" x2="40" y2="15"/>
            <text x="140" y="212" class="t-sm">LV volume</text>
