schema: steps.lesson/v1
lecture: cvs.L05
lessons:
  - id: cvs.L05.lesson1
    title: "أدوية الضغط والذبحة: مين بيوسّع إيه؟"
    hook: "الـ nitrates بتوسّع الأوردة، والـ hydralazine الشرايين، والـ nitroprusside الاتنين. لو عرفت مين بيوسّع إيه هتعرف الـ side effects لوحدك."
    minutes: 10
    pages: [321, 323]
    topics: [deep-venous-thrombosis, hypertension-treatment, nitrates, calcium-channel-blockers, hydralazine, hypertensive-emergency, antianginal-therapy]
    goals:
      - "تختار دوا الضغط حسب المرض اللي معاه"
      - "تفهم الـ nitrates والـ CCBs شغالين فين في الـ smooth muscle"
      - "تعرف ليه الـ nitrates والـ β-blockers أحسن مع بعض"
    status: unverified
    steps:
      - kind: explain
        remind: [cvs.L05.001]
        title: "الـ DVT في دقيقة"
        text: |-
          جلطة في وريد عميق ← تورم واحمرار وسخونية ووجع. السبب: ==Virchow triad (SHE)==: Stasis، Hypercoagulability، Endothelial damage.

          - الخطر الأكبر للـ PE من الأوردة ==الـ proximal== (femoral و iliac و popliteal)؛ جلطة السمانة أقل وغالباً بتروح لوحدها.
          - الـ D-dimer يستبعد لو الاحتمال قليل أو متوسط (sensitivity عالية). التشخيص: ==compression ultrasound with Doppler==.
          - العلاج: heparin أو LMWH (enoxaparin) للوقاية والحالة الحادة، والـ direct anticoagulants (rivaroxaban, apixaban) للعلاج الطويل.
        page: 321
        quote: "DVT → PE risk highest in proximal veins (femoral, iliac, popliteal). Distal calf DVT less likely to embolize; often resolve spontaneously."
      - kind: table
        title: "الضغط مع مرض تاني"
        columns: ["With", "Use", "Avoid / note"]
        rows:
          - ["Heart failure", "ACEi/ARB, β-blockers (compensated), aldosterone antagonists, diuretics", "β-blockers cautiously in decompensated HF; not in cardiogenic shock"]
          - ["Diabetes", "ACEi/ARB, CCBs, thiazides, β-blockers", "ACEi/ARB protect against nephropathy"]
          - ["Asthma", "ARBs, CCBs, thiazides, cardioselective β-blockers", "No nonselective β-blockers; no ACEi (cough confusion)"]
          - ["Pregnancy", "Hydralazine, methyldopa, labetalol, nifedipine", "Hypertensive moms love nifedipine"]
          - ["Gout", "ACEi, CCBs, ARBs (especially losartan)", "No loop or thiazide diuretics"]
          - ["Osteoporosis", "Thiazides", "They ↑ Ca2+ reabsorption"]
        hide: [[1, 2], [2, 2], [3, 1], [4, 2], [5, 1]]
        page: 321
        quote: "Hydralazine, methyldopa, labetalol, nifedipine. Hypertensive moms love nifedipine."
      - kind: check
        question: "A 30-year-old woman with asthma needs a drug for hypertension. Which should be avoided because it could make her cough hard to interpret?"
        options: ["Lisinopril", "Losartan", "Amlodipine", "Hydrochlorothiazide"]
        answer: 0
        why:
          - "صح: الـ ACE inhibitors بيعملوا كحة، فمش هتعرف الكحة من الدوا ولا من الربو."
          - "الـ ARBs مسموحة في الربو."
          - "الـ CCBs مسموحة."
          - "الـ thiazides مسموحة."
        page: 321
        quote: "Avoid ACE inhibitors to prevent confusion between drug- or asthma-related cough."
      - kind: aside
        tone: trap
        text: "**Pheochromocytoma**: ==α-blockade الأول== (phentolamine أو phenoxybenzamine) قبل الـ β-blocker وقبل العملية. لو بدأت بالـ β-blocker الـ α هيبقى لوحده ← hypertensive crisis."
        page: 321
        quote: "Phentolamine, phenoxybenzamine (α-blockade first) prior to resection and β-blockade. Avoid β-blockade first to mitigate unopposed α-mediated hypertensive crisis."
      - kind: figure
        title: "الـ smooth muscle: الـ Ca2+ بيقلّص والـ cGMP بيرخّي"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvs5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="100" height="36" rx="6"/><text x="22" y="43" class="t-b">L-type Ca2+</text>
            <path class="fg-arrow-bad" d="M60 56 L60 96" marker-end="url(#cvs5b)"/>
            <rect class="fg-bad" x="10" y="98" width="100" height="36" rx="6"/><text x="20" y="121" class="t-b">contraction</text>
            <text x="10" y="160" class="t-sm t-bad">CCBs block here</text>
            <rect class="fg-box" x="200" y="10" width="150" height="30" rx="6"/><text x="210" y="30" class="t-sm">Nitrates, nitroprusside: NO</text>
            <path class="fg-arrow" d="M275 40 L275 62" marker-end="url(#cvs5a)"/>
            <rect class="fg-box" x="200" y="64" width="150" height="30" rx="6"/><text x="210" y="84" class="t-sm">Guanylate cyclase</text>
            <path class="fg-arrow" d="M275 94 L275 116" marker-end="url(#cvs5a)"/>
            <rect class="fg-box" x="200" y="118" width="150" height="30" rx="6"/><text x="235" y="138" class="t-b">↑ cGMP</text>
            <path class="fg-arrow" d="M275 148 L275 170" marker-end="url(#cvs5a)"/>
            <text x="225" y="190" class="t-b">relaxation</text>
            <text x="140" y="78" class="t-sm t-mut">hydralazine</text>
            <text x="140" y="92" class="t-sm t-mut">↑ cGMP too</text>
          </svg>
        caption: "الـ CCBs بتقفل باب الـ Ca2+ فالعضلة ماتنقبضش. الـ nitrates والـ nitroprusside بيدّوا NO ← guanylate cyclase ← cGMP ← العضلة ترتخي. الـ hydralazine كمان بيعلّي الـ cGMP."
        alt: "Smooth muscle cell pathways: on the left, L-type calcium channels lead to contraction and calcium channel blockers act there; on the right, nitrates and nitroprusside give NO, which activates guanylate cyclase, raising cGMP and causing relaxation; hydralazine also raises cGMP."
        page: 322
        quote: "Vasodilate by ↑ NO in vascular smooth muscle → ↑ in cGMP and smooth muscle relaxation."
      - kind: explain
        title: "الـ nitrates: أوردة أكتر بكتير من الشرايين"
        text: |-
          الـ nitroglycerin والـ isosorbide بيوسّعوا ==veins >> arteries== ← الدم يتحوّش في الأوردة ← ==↓ preload== ← القلب يشتغل أقل.

          - الاستخدام: angina و ACS و pulmonary edema.
          - الـ side effects: reflex tachycardia (علاجها β-blocker)، methemoglobinemia، hypotension، flushing، صداع.
          - **Monday disease**: عمال المصانع بيتعودوا طول الأسبوع، والتعوّد يروح في الويك إند، فيوم الاتنين صداع ودوخة وtachycardia.
        page: 322
        quote: "Dilate veins >> arteries. ↓ preload. ClINICAl uSE Angina, ACS, pulmonary edema."
      - kind: reveal
        prompt: "ليه الـ nitrates ممنوعة في الـ RV infarction والـ HCM ومع الـ sildenafil؟"
        answer: "التلاتة ==محتاجين preload==. الـ RV المتعور مايقدرش يضخ غير لو مليان، والـ HCM لو الـ LV فضي الـ obstruction بيزيد، والـ sildenafil (PDE-5 inhibitor) بيعلّي الـ cGMP هو كمان فالضغط يقع جامد."
        page: 322
        quote: "Contraindicated in right ventricular infarction, hypertrophic cardiomyopathy, and with concurrent PDE-5 inhibitor use."
      - kind: explain
        title: "الـ CCBs: شرايين ولا قلب؟"
        text: |-
          كلهم بيقفلوا الـ L-type Ca2+ channels، لكن كل واحد له مكانه:
          - **Dihydropyridines** (amlodipine, nifedipine، ...): ==شرايين==. للضغط والـ angina (حتى الـ vasospastic) والـ Raynaud. الـ nimodipine للـ subarachnoid hemorrhage، والـ nicardipine والـ clevidipine للـ hypertensive emergency.
          - **Non-dihydropyridines** (verapamil, diltiazem): ==قلب==. للضغط والـ angina والـ rate control في الـ AF.

          الترتيب على القلب: verapamil > diltiazem > amlodipine = nifedipine، وعلى الأوعية العكس.
        page: 323
        quote: "Vascular smooth muscle—amlodipine = nifedipine > diltiazem > verapamil. Heart—verapamil > diltiazem > amlodipine = nifedipine."
      - kind: sort
        prompt: "ده side effect الـ dihydropyridine ولا الـ non-dihydropyridine؟"
        bins: ["Dihydropyridine", "Nondihydropyridine"]
        cards:
          - { text: "Peripheral edema", bin: 0 }
          - { text: "Flushing", bin: 0 }
          - { text: "Dizziness", bin: 0 }
          - { text: "AV block", bin: 1 }
          - { text: "Constipation", bin: 1 }
          - { text: "Hyperprolactinemia (verapamil)", bin: 1 }
        why: "الـ dihydropyridine بيوسّع الشرايين فبيعمل edema وflushing ودوخة. الـ non-DHP بيهدّي القلب فبيعمل cardiac depression وAV block، والـ non-DHP كمان بيعملوا إمساك، والـ verapamil بالذات hyperprolactinemia. والاتنين بيعملوا gingival hyperplasia."
        page: 323
        quote: "Dihydropyridine: peripheral edema, flushing, dizziness. Nondihydropyridine: cardiac depression, AV block, hyperprolactinemia (verapamil), constipation."
      - kind: explain
        title: "الـ hydralazine والـ hypertensive emergency"
        text: |-
          **Hydralazine**: ↑ cGMP، بيوسّع ==arterioles > veins== (afterload). آمن في الحمل، ومع nitrate في الـ HF. بيعمل reflex tachycardia فبيتدّي مع β-blocker، وممنوع في الـ angina. وبيعمل ==drug-induced lupus==.

          **Hypertensive emergency**: labetalol أو clevidipine أو fenoldopam أو nicardipine أو nitroprusside.
          - **Nitroprusside**: قصير، arteries = veins، بيطلّع NO مباشرة، وبيطلّع ==cyanide==.
          - **Fenoldopam**: D1 agonist ← توسيع الأوعية الكلوية وغيرها ← ↓ BP و ↑ natriuresis.
        page: 323
        quote: "Short acting vasodilator (arteries = veins); via direct release of NO. Can cause cyanide toxicity (releases cyanide)."
      - kind: check
        question: "A man with a hypertensive emergency gets an IV infusion of a short-acting drug that releases NO and dilates arteries and veins equally. Two days later he is confused with lactic acidosis. Which toxicity?"
        options: ["Cyanide", "Methemoglobinemia only", "Drug-induced lupus", "Hyperkalemia"]
        answer: 0
        why:
          - "صح: الـ nitroprusside بيطلّع cyanide."
          - "الـ methemoglobinemia من الـ nitrates."
          - "الـ lupus من الـ hydralazine."
          - "مش من الـ nitroprusside."
        page: 323
        quote: "Can cause cyanide toxicity (releases cyanide)."
      - kind: table
        title: "الـ nitrates والـ β-blockers: كل واحد بيغطي على عيب التاني"
        columns: ["Component", "Nitrates", "β-blockers", "Both"]
        rows:
          - ["End-diastolic volume", "↓", "No effect or ↑", "No effect or ↓"]
          - ["Contractility", "↑ (reflex)", "↓", "Little/no effect"]
          - ["Heart rate", "↑ (reflex)", "↓", "No effect or ↓"]
          - ["Ejection time", "↓", "↑", "Little/no effect"]
          - ["MVO2", "↓", "↓", "↓↓"]
        hide: [[1, 1], [2, 1], [0, 2], [4, 3]]
        page: 323
        quote: "Goal is reduction of myocardial O2 consumption (MVO2) by 1 or more of the determinants of MVO2: end-diastolic volume, BP, HR, contractility."
      - kind: aside
        tone: exam
        text: "الـ verapamil والـ diltiazem ==زي الـ β-blockers== في الجدول ده (بيقللوا الـ HR والـ contractility)."
        page: 323
        quote: "Nondihydropyridine calcium channel blockers (verapamil, diltiazem) are similar to β-blockers in effect."
      - kind: explain
        title: "الزرار الأخير: الـ myosin متفسفر ولا لأ"
        text: |-
          كل أدوية الأوعية في رسمة الكتاب بتنتهي عند نقطة واحدة:

          - ↑ Ca2+ جوه الخلية ← **Ca2+-calmodulin** ← يشغّل ==MLC kinase== ← الـ myosin يتفسفر (myosin-P) ويمسك الـ actin ← **انقباض**.
          - ==MLC phosphatase== بيشيل الفوسفات ← **ارتخاء**. الـ NO ← cGMP بيقوّيه، والـ Rho kinase بيوقفه.

          فالـ CCBs بتقلل الـ Ca2+ اللي داخل، والـ nitrates والـ sildenafil بيزودوا الـ cGMP، والـ Gq agonists (α1، angiotensin II، endothelin-1، vasopressin) بيرفعوا الـ Ca2+ عن طريق IP3. كله بيرجع لنفس الزرار.
        page: 322
        quote: "Adenylate cyclase MLC phosphatase MLC-kinase NO synthase NO RELAXATION Myosin + actin"
      - kind: try
        items: [cvs.L05.001, cvs.L05.006, cvs.L05.013, cvs.L05.017, cvs.L05.024]
    recap:
      - "DVT: SHE، الـ proximal أخطر، compression US، heparin/LMWH ثم DOAC."
      - "ربو: لا nonselective β ولا ACEi. حمل: hydralazine وmethyldopa وlabetalol وnifedipine. Pheo: α الأول."
      - "Nitrates: أوردة ← ↓ preload، ممنوعة مع RV infarct وHCM وsildenafil."
      - "DHP: شرايين (edema). Non-DHP: قلب (AV block، إمساك)."
      - "Hydralazine: lupus. Nitroprusside: cyanide. Nitrate + β-blocker = ↓↓ MVO2."
    practice: [cvs.L05.001, cvs.L05.002, cvs.L05.003, cvs.L05.004, cvs.L05.005, cvs.L05.006, cvs.L05.007, cvs.L05.008, cvs.L05.009, cvs.L05.010, cvs.L05.011, cvs.L05.012, cvs.L05.013, cvs.L05.014, cvs.L05.015, cvs.L05.016, cvs.L05.017, cvs.L05.018, cvs.L05.019, cvs.L05.020, cvs.L05.021, cvs.L05.022, cvs.L05.023, cvs.L05.024, cvs.L05.025, cvs.L05.026, cvs.L05.027, cvs.L05.028, cvs.L05.029, cvs.L05.106, cvs.L05.107, cvs.L05.108, cvs.L05.109, cvs.L05.110, cvs.L05.111, cvs.L05.113, cvs.L05.114, cvs.L05.115, cvs.L05.116, cvs.L05.117, cvs.L05.118, cvs.L05.119, cvs.L05.120, cvs.L05.127]
  - id: cvs.L05.lesson2
    title: "الكوليسترول: كل دوا بيضرب فين؟"
    hook: "الـ statins والـ resins والـ PCSK9 inhibitors بيوصلوا لنفس النتيجة بطرق مختلفة: كبد عايز LDL receptors أكتر."
    minutes: 9
    pages: [324, 325]
    topics: [ranolazine, sacubitril, lipid-lowering-agents]
    goals:
      - "تعرف الـ ranolazine والـ sacubitril وليه الـ sacubitril مايتاخدش مع ACEi"
      - "تحط كل دوا كوليسترول في مكانه: كبد ولا أمعاء ولا دهون ولا دم"
      - "تربط كل دوا بالـ side effect المميز بتاعه"
    status: unverified
    steps:
      - kind: explain
        title: "الـ ranolazine: ذبحة من غير ما تلمس الضغط"
        text: |-
          بيقفل ==الـ late phase من الـ inward Na+ current== ← توتر جدار القلب في الـ diastole يقل ← استهلاك الـ O2 يقل.

          الميزة: ==مابيغيّرش الـ HR ولا الـ BP==، فبيتدّي في الـ refractory angina لما الـ β-blocker والـ nitrate يكونوا وصلوا آخرهم. الـ side effects: إمساك ودوخة وصداع وغثيان و QT prolongation.
        page: 324
        quote: "Inhibits the late phase of inward sodium current thereby reducing diastolic wall tension and oxygen consumption. Does not affect heart rate or blood pressure."
      - kind: figure
        title: "الـ sacubitril/valsartan"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs5c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvs5d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="130" height="34" rx="6"/><text x="20" y="42" class="t-sm">Natriuretic peptides</text>
            <rect class="fg-box" x="10" y="100" width="130" height="34" rx="6"/><text x="30" y="122" class="t-sm">Angiotensin II</text>
            <rect class="fg-bad" x="170" y="60" width="90" height="34" rx="6"/><text x="180" y="82" class="t-sm">Neprilysin</text>
            <path class="fg-arrow" d="M140 37 L168 70" marker-end="url(#cvs5c)"/>
            <path class="fg-arrow" d="M140 117 L168 86" marker-end="url(#cvs5c)"/>
            <text x="270" y="82" class="t-sm t-mut">inactive</text>
            <text x="170" y="52" class="t-sm t-bad">sacubitril ✕</text>
            <path class="fg-arrow" d="M75 54 L75 70" marker-end="url(#cvs5c)"/>
            <text x="80" y="68" class="t-sm">vasodilation, ↓ ECF</text>
            <path class="fg-arrow-bad" d="M75 134 L75 150" marker-end="url(#cvs5d)"/>
            <text x="80" y="160" class="t-sm t-bad">AT1 ✕ valsartan</text>
          </svg>
        caption: "الـ neprilysin بيكسّر الـ natriuretic peptides والـ angiotensin II (والـ bradykinin). الـ sacubitril بيقفله فالـ peptides تزيد (توسيع، ↓ ECF)، والـ angiotensin II يزيد هو كمان، فالـ valsartan بيقفل الـ receptor بتاعه."
        alt: "Neprilysin breaks down natriuretic peptides and angiotensin II into inactive products. Sacubitril blocks neprilysin, so natriuretic peptides cause vasodilation and lower ECF volume, while valsartan blocks the angiotensin II receptor."
        page: 324
        quote: "A neprilysin inhibitor; prevents degradation of bradykinin, natriuretic peptides, angiotensin II, and substance P"
      - kind: check
        question: "A patient with HFrEF on enalapril is started on sacubitril/valsartan without stopping enalapril. Which complication is most feared?"
        options: ["Angioedema", "Cyanide toxicity", "Torsades de pointes", "Gingival hyperplasia"]
        answer: 0
        why:
          - "صح: الاتنين بيعلّوا الـ bradykinin ← angioedema."
          - "الـ cyanide من الـ nitroprusside."
          - "الـ torsades من الـ drugs اللي بتطوّل الـ QT."
          - "الـ gingival hyperplasia من الـ CCBs."
        page: 324
        quote: "contraindicated with ACE inhibitors due to angioedema (both drugs ↑ bradykinin)"
      - kind: figure
        title: "أدوية الكوليسترول على الخريطة"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="10" width="160" height="80" rx="8"/><text x="70" y="28" class="t-b">Liver</text>
            <text x="18" y="48" class="t-sm">HMG-CoA reductase: statins</text>
            <text x="18" y="64" class="t-sm">LDL receptor ↑: PCSK9 inhibitors</text>
            <text x="18" y="80" class="t-sm">↓ VLDL: niacin, fish oil</text>
            <rect class="fg-box" x="190" y="10" width="160" height="80" rx="8"/><text x="235" y="28" class="t-b">Intestine</text>
            <text x="198" y="48" class="t-sm">Brush border: ezetimibe</text>
            <text x="198" y="64" class="t-sm">Bile acid reabsorption:</text>
            <text x="198" y="80" class="t-sm">resins</text>
            <rect class="fg-box" x="10" y="105" width="160" height="70" rx="8"/><text x="50" y="123" class="t-b">Adipose</text>
            <text x="18" y="143" class="t-sm">↓ lipolysis (HSL): niacin</text>
            <rect class="fg-box" x="190" y="105" width="160" height="70" rx="8"/><text x="245" y="123" class="t-b">Blood</text>
            <text x="198" y="143" class="t-sm">LPL ↑ (PPAR-α): fibrates</text>
            <text x="198" y="159" class="t-sm">→ ↑ TG clearance</text>
          </svg>
        caption: "الـ statins والـ PCSK9 inhibitors في الكبد، والـ ezetimibe والـ resins في الأمعاء، والـ niacin في الدهون، والـ fibrates بتشغّل الـ LPL في الدم."
        alt: "Four boxes: liver (statins inhibit HMG-CoA reductase, PCSK9 inhibitors raise LDL receptors, niacin and fish oil lower VLDL), intestine (ezetimibe at the brush border, resins block bile acid reabsorption), adipose tissue (niacin lowers lipolysis by hormone-sensitive lipase) and blood (fibrates upregulate LPL through PPAR-alpha, raising triglyceride clearance)."
        page: 325
        quote: "Activate PPAR-α → upregulate LPL → ↑ TG clearance"
      - kind: explain
        title: "الـ statins والـ resins والـ ezetimibe"
        text: |-
          - **Statins**: بتقفل ==HMG-CoA reductase== ← كوليسترول الكبد يقل ← الكبد يطلّع LDL receptors أكتر ← LDL الدم يقل (↓↓↓). بتقلل الوفيات في الـ CAD. الـ side effects: ↑ LFTs و ==myopathy== (خصوصاً مع fibrates أو niacin).
          - **Bile acid resins**: بتمسك الـ bile acids في الأمعاء ← الكبد يحرق كوليسترول يعمل bile جديد ← نفس النتيجة. بتعمل GI upset و ==↓ امتصاص الأدوية والـ fat-soluble vitamins==، وبتعلّي الـ TG شوية.
          - **Ezetimibe**: بيمنع امتصاص الكوليسترول عند الـ brush border.
        page: 324
        quote: "Hepatotoxicity (↑ LFTs), myopathy (especially when used with fibrates or niacin)"
      - kind: reveal
        prompt: "الـ statin والـ resin شغالين في أماكن مختلفة. إيه اللي بيخليهم يوصلوا لنفس النتيجة؟"
        answer: "الاتنين بيقللوا ==الكوليسترول جوه خلية الكبد==. الكبد بيعوّض بإنه يعمل LDL receptors أكتر ويسحب الـ LDL من الدم. الـ statin بيمنع التصنيع، والـ resin بيخلي الكبد يصرف كوليسترول في عمل bile."
        page: 324
        quote: "Disrupt enterohepatic bile acid circulation → compensatory ↑ conversion of cholesterol to bile → ↓ intrahepatic cholesterol → ↑ LDL receptor recycling"
      - kind: explain
        title: "الـ fibrates والـ niacin والـ PCSK9 والـ fish oil"
        text: |-
          - **Fibrates**: PPAR-α ← ↑ LPL ← ==الـ TG تنزل أكتر حاجة== (↓↓↓)، و HDL يعلى. بتعمل myopathy وcholesterol gallstones (بتقفل 7α-hydroxylase).
          - **Niacin**: بيقفل الـ lipolysis في الدهون و VLDL الكبد. ==أعلى HDL== (↑↑). بيعمل flushing وhyperglycemia وhyperuricemia.
          - **PCSK9 inhibitors** (alirocumab, evolocumab): بتمنع تكسير الـ LDL receptor ← LDL ↓↓↓. مالهاش CYP، فتداخلاتها قليلة.
          - **Fish oil**: TG تنزل في الجرعات العالية؛ غثيان وطعم سمك.
        page: 325
        quote: "Inhibits lipolysis (hormone-sensitive lipase) in adipose tissue; reduces hepatic VLDL synthesis"
      - kind: match
