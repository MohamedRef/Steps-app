        why: "الـ fibrates بتقفل الـ 7α-hydroxylase فالكوليسترول مابيتحولش لـ bile acid والمرارة تتملي حصوات. والـ niacin flushing بيقل بالـ NSAIDs أو مع الوقت."
        page: 325
