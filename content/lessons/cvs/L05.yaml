  - id: cvs.L05.lesson3
    title: "الديجوكسين والـ class I و II"
    hook: "الديجوكسين بيقفل مضخة صغيرة فيقوّي القلب كله. والـ class I كلها Na+ blockers، بس كل واحد بقوة مختلفة."
    minutes: 10
    pages: [326, 327]
    topics: [digoxin, class-i-antiarrhythmics, class-ii-antiarrhythmics]
    goals:
      - "تفهم الديجوكسين بيعلّي الـ Ca2+ إزاي، وإيه اللي بيخليه يسمّم"
      - "تفرّق بين IA و IB و IC في القوة والاستخدام والـ side effects"
      - "تعرف الـ β-blockers كـ antiarrhythmics وعلاج الـ overdose"
    status: unverified
    steps:
      - kind: explain
        title: "الديجوكسين: اقفل المضخة، يعلى الكالسيوم"
        text: |-
          بيقفل ==Na+/K+-ATPase== مباشرة ← الـ Na+ يتجمع جوه ← الـ Na+/Ca2+ exchanger مايلاقيش فرق يشتغل بيه ← ==الـ Ca2+ يفضل جوه== ← انقباض أقوى.

          وكمان بيشغّل الـ vagus ← ↓ HR. عشان كده بيتدّي في الـ HF (↑ contractility) وفي الـ AF (يبطّأ الـ AV node).
        page: 326
        quote: "Direct inhibition of Na+/K+-ATPase → indirect inhibition of Na+/Ca2+ exchanger"
      - kind: figure
        title: "ليه قفل مضخة الصوديوم بيقوّي القلب؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs5e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="20" y="20" width="320" height="130" rx="20" fill="none"/>
            <rect class="fg-bad" x="40" y="5" width="110" height="30" rx="6"/><text x="48" y="25" class="t-sm">Na+/K+-ATPase ✕</text>
            <text x="40" y="52" class="t-sm t-bad">digoxin</text>
            <rect class="fg-box" x="210" y="5" width="110" height="30" rx="6"/><text x="218" y="25" class="t-sm">Na+/Ca2+ exch ↓</text>
            <text x="60" y="85" class="t-b">↑ Na+ inside</text>
            <path class="fg-arrow" d="M150 80 L210 80" marker-end="url(#cvs5e)"/>
            <text x="220" y="85" class="t-b">↑↑ Ca2+</text>
            <path class="fg-arrow" d="M250 92 L250 118" marker-end="url(#cvs5e)"/>
            <text x="190" y="138" class="t-sm">↑ TnC binding → ↑ contraction</text>
          </svg>
        caption: "المضخة واقفة ← الصوديوم يزيد جوه ← الـ exchanger اللي بيطلّع Ca2+ مقابل Na+ يكسل ← الكالسيوم يزيد ويمسك في الـ troponin C ← انقباض أقوى."
        alt: "A cardiac myocyte: digoxin blocks the Na+/K+-ATPase, intracellular sodium rises, the Na+/Ca2+ exchanger slows, intracellular calcium rises, more calcium binds troponin C, and contraction increases."
        page: 326
        quote: "Direct inhibition of Na+/K+-ATPase → indirect inhibition of Na+/Ca2+ exchanger"
      - kind: explain
        title: "سُمّية الديجوكسين"
        text: |-
          - **الأعراض**: cholinergic (غثيان، ترجيع، إسهال)، ==رؤية صفرا== («van Glow»)، arrhythmias، و atrial tachycardia with AV block. والـ ==hyperkalemia== علامة إن الحالة وحشة.
          - **اللي بيسهّلها**: renal failure، hypokalemia، أدوية بتزقه من أماكنه، وأدوية بتقلل الـ clearance: ==verapamil و amiodarone و quinidine==.
          - **العلاج**: ظبّط الـ K+ بالراحة، pacer، anti-digoxin Fab، و Mg2+.
        page: 326
        quote: "Cholinergic effects (nausea, vomiting, diarrhea), blurry yellow vision (“van Glow”), arrhythmias, atrial tachycardia with AV block."
      - kind: check
        question: "A patient on a stable dose of digoxin, with normal renal function, develops nausea and yellow vision. Serum K+ is 2.9 mEq/L. How does the low K+ cause the toxicity?"
        options: ["Low K+ lets more digoxin bind the pump", "Low K+ lets less digoxin bind the pump", "Low K+ blocks digoxin excretion by the kidney", "Low K+ adds to digoxin's vagal effect"]
        answer: 0
        why:
          - "صح: الـ K+ والديجوكسين بيتنافسوا على نفس المكان (الـ K+-binding site) في الـ Na+/K+-ATPase؛ لو الـ K+ قليل الديجوكسين يمسك أكتر."
          - "العكس: الـ K+ القليل بيفضّي المكان للديجوكسين فيمسك أكتر مش أقل."
          - "الكتاب بيربط قلة الـ excretion بالـ renal failure، وكليته هنا سليمة؛ الـ K+ القليل بيشتغل على المضخة نفسها."
          - "الـ vagal stimulation ده من الديجوكسين نفسه وبيبطّأ الـ HR؛ مش هو اللي بيخلّي الديجوكسين يمسك في المضخة أكتر ويعمل toxicity."
        page: 326
        quote: "hypokalemia (permissive for digoxin binding at K+-binding site on Na+/K+-ATPase)"
      - kind: explain
        title: "الـ class I: Na+ blockers"
        text: |-
          كلهم بيقللوا ==slope الـ phase 0== ويبطّأوا التوصيل، خصوصاً في الخلايا الـ depolarized.

          وشغلهم ==أقوى مع الـ HR العالي== (state dependent): القلب السريع ← diastole أقصر ← الـ Na+ channels تقعد وقت أقل في الـ resting state، وده الوقت الوحيد اللي الدوا بيسيب فيه الـ channel.
        page: 326
        quote: "Slow or block conduction (especially in depolarized cells). ↓ slope of phase 0 depolarization."
      - kind: mnemonic
        word: "CAB"
        parts:
          - { key: "C", text: "IC: أقوى ربط (strong)" }
          - { key: "A", text: "IA: متوسط (moderate)" }
          - { key: "B", text: "IB: أضعف ربط (weak)" }
        hook: "Fast taxi CAB: التأثير أقوى في IC > IA > IB"
        page: 326
        quote: "Effect most pronounced in IC>IA>IB due to relative binding strength. Fast taxi CAB."
      - kind: explain
        remind: [cvs.L05.063]
        title: "IA و IB"
        text: |-
          **IA** (quinidine, procainamide, disopyramide: «The queen proclaims Diso's pyramid»): moderate، ==↑ AP duration و ↑ QT== (فيه K+ block). لـ SVT و VT. الـ side effects: cinchonism (quinidine)، ==SLE-like== (procainamide)، HF (disopyramide)، thrombocytopenia، torsades.

          **IB** (lidocaine, mexiletine: «I'd Buy Liddy's Mexican tacos»): weak، ↓ AP duration، بيحب ==الأنسجة الـ ischemic==. «IB is Best post-MI»، وللـ digitalis-induced arrhythmias. الـ side effects: CNS.
        page: 326
        quote: "Weak Na+ channel blockade. ↓ AP duration. Preferentially affect ischemic or depolarized Purkinje and ventricular tissue."
      - kind: explain
        title: "IC"
        text: |-
          **IC** (flecainide, propafenone: «Can I have fries, please?»): strong، بيطوّل الـ ERP في الـ AV node والـ accessory pathways، وتأثيره قليل على الـ AP duration.

          للـ SVTs والـ AF. لكن ==proarrhythmic==: «IC is Contraindicated» في ==structural and ischemic heart disease==.
        page: 327
        quote: "Strong Na+ channel blockade. Significantly prolongs ERP in AV node and accessory bypass tracts."
      - kind: check
        question: "A man with a prior MI and low ejection fraction develops AF. Which drug is contraindicated?"
        options: ["Flecainide", "Metoprolol", "Amiodarone", "Digoxin"]
        answer: 0
        why:
          - "صح: الـ IC ممنوعة في الـ structural والـ ischemic heart disease."
          - "الـ β-blockers بتتدّي بعد الـ MI وللـ rate control."
          - "الـ amiodarone مسموح."
          - "الديجوكسين مسموح في الـ HF والـ AF."
        page: 327
        quote: "Proarrhythmic, especially post-MI (contraindicated). IC is Contraindicated in structural and ischemic heart disease."
      - kind: explain
        title: "الـ class II: الـ β-blockers"
        text: |-
          ↓ cAMP و ↓ Ca2+ currents ← بيهدّوا الـ SA والـ AV node، وبيقللوا ==slope الـ phase 4== (يكتموا الـ abnormal pacemakers). الـ AV node حساس قوي ← ==↑ PR==. الـ esmolol قصير جداً.

          للـ SVT، والـ rate control في الـ AF والـ flutter، ومنع الـ ventricular arrhythmias بعد الـ MI. الـ side effects: impotence، الربو والـ COPD، brady و AV block و HF، نوم، ==وبيخبّوا الـ hypoglycemia==.
        page: 327
        quote: "Suppress abnormal pacemakers by ↓ slope of phase 4. AV node particularly sensitive—↑ PR interval. Esmolol very short acting."
      - kind: aside
        remind: [cvs.L05.083]
        tone: trap
        text: "الـ β-blocker لوحده في الـ pheochromocytoma ← ==unopposed α1== (إلا الـ carvedilol والـ labetalol). والـ overdose علاجه **GAS**: Glucagon و Atropine و Saline."
        page: 327
        quote: "Treat β-blocker overdose with Glucagon, Atropine, Saline (GAS)."
      - kind: try
        items: [cvs.L05.054, cvs.L05.056, cvs.L05.063, cvs.L05.073, cvs.L05.083]
    recap:
      - "Digoxin: Na+/K+-ATPase ← ↑ Ca2+. سمّية: رؤية صفرا، hypokalemia بتسهّلها، verapamil/amiodarone/quinidine. العلاج Fab."
      - "Class I: phase 0، أقوى مع HR عالي، CAB = IC > IA > IB."
      - "IA: ↑ QT، lupus (procainamide)، cinchonism. IB: post-MI. IC: ممنوع في structural heart disease."
      - "Class II: phase 4، ↑ PR، بيخبّي الـ hypoglycemia، overdose = GAS."
    practice: [cvs.L05.052, cvs.L05.053, cvs.L05.054, cvs.L05.055, cvs.L05.056, cvs.L05.057, cvs.L05.058, cvs.L05.059, cvs.L05.060, cvs.L05.061, cvs.L05.062, cvs.L05.063, cvs.L05.064, cvs.L05.065, cvs.L05.066, cvs.L05.067, cvs.L05.068, cvs.L05.069, cvs.L05.070, cvs.L05.071, cvs.L05.072, cvs.L05.073, cvs.L05.074, cvs.L05.075, cvs.L05.076, cvs.L05.077, cvs.L05.078, cvs.L05.079, cvs.L05.080, cvs.L05.081, cvs.L05.082, cvs.L05.083, cvs.L05.084, cvs.L05.085, cvs.L05.112, cvs.L05.121]
  - id: cvs.L05.lesson4
    title: "الـ class III و IV والأدينوزين والإيفابرادين"
    hook: "الـ class III بيطوّل الـ QT، والـ class IV بيطوّل الـ PR. والأميودارون بيعمل كل حاجة، حتى في الغدة."
    minutes: 8
    pages: [328, 328]
    topics: [class-iii-antiarrhythmics, class-iv-antiarrhythmics, other-antiarrhythmics, ivabradine]
    goals:
      - "تحفظ الـ class III بـ AIDS وتعرف الـ amiodarone toxicity بالمنطق"
      - "تعرف الـ class IV والأدينوزين والماغنسيوم بيتدّوا إمتى"
      - "تفهم الإيفابرادين بيبطّأ القلب إزاي"
    status: unverified
    steps:
      - kind: explain
        remind: [cvs.L05.086]
        title: "الـ class III: K+ blockers"
        text: |-
          **AIDS**: Amiodarone و Ibutilide و Dofetilide و Sotalol. بيقفلوا الـ K+ channels فالـ repolarization تطوّل: ==↑ AP duration و ↑ ERP و ↑ QT==.

          للـ AF والـ flutter، وللـ VT (amiodarone و sotalol). الـ sotalol والـ ibutilide بيعملوا ==torsades de pointes==، والـ sotalol كمان β blockade زيادة.
        page: 328
        quote: "Amiodarone, Ibutilide, Dofetilide, Sotalol. AIDS. MECHANISM ↑ AP duration, ↑ ERP, ↑ QT interval."
      - kind: figure
        title: "الـ class III بيطوّل الـ repolarization"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-mut" x1="20" y1="130" x2="340" y2="130"/>
            <path class="fg-ink" d="M30 130 L40 30 L55 45 C 110 45, 140 50, 165 130" fill="none" stroke-width="2.5"/>
            <path class="fg-bad" d="M30 130 L40 30 L55 45 C 160 45, 220 50, 255 130" fill="none" stroke-width="2.5"/>
            <text x="120" y="150" class="t-sm">normal</text>
            <text x="230" y="150" class="t-sm t-bad">class III</text>
            <text x="150" y="35" class="t-sm t-bad">↑ AP duration, ↑ ERP</text>
            <text x="150" y="52" class="t-sm t-bad">→ ↑ QT</text>
            <text x="30" y="20" class="t-sm t-mut">0 mV</text>
          </svg>
        caption: "الـ upstroke زي ما هو، لكن الـ repolarization (الـ IK) بتطوّل كتير ← الـ ERP يطوّل والـ QT يطوّل. وده نفسه اللي بيفتح الباب للـ torsades."
        alt: "Two ventricular action potentials with the same upstroke; the class III one has a much longer plateau and repolarization, labeled as longer action potential duration, longer ERP and longer QT."
        page: 328
        quote: "Markedly prolonged repolarization (IK)"
      - kind: explain
        title: "الأميودارون: دوا واحد، أعضاء كتير"
        text: |-
          - ==Pulmonary fibrosis==، hepatotoxicity.
          - ==Hypo أو hyperthyroidism==: 40% من وزنه iodine.
          - Hapten: corneal deposits، وجلد أزرق رمادي مع photodermatitis.
          - أعصاب، إمساك، brady و heart block و HF.

          عشان كده ==PFTs و LFTs و TFTs== قبل وأثناء العلاج. وهو lipophilic، وله تأثير class I و II و III و IV.
        page: 328
        quote: "Remember to check PFTs, LFTs, and TFTs when using amiodarone. Amiodarone is lipophilic and has class I, II, III, and IV effects."
      - kind: check
        question: "A man on amiodarone for VT has fatigue, weight gain and a high TSH. Which property of the drug explains this?"
        options: ["It is 40% iodine by weight", "It acts as a hapten", "It is lipophilic", "It blocks Na+ channels"]
        answer: 0
        why:
          - "صح: الـ iodine الكتير بيلخبط الغدة في الاتجاهين."
          - "الـ hapten بيفسّر الـ corneal والجلد."
          - "الـ lipophilic بيفسّر إنه بيتخزن في الأنسجة."
          - "الـ class I effect مالوش دعوة بالغدة."
        page: 328
        quote: "hypothyroidism or hyperthyroidism (amiodarone is 40% iodine by weight)"
      - kind: explain
        title: "الـ class IV: الـ verapamil والـ diltiazem"
        text: |-
          بيقفلوا الـ Ca2+ channels في الـ AV node: ==↓ conduction velocity و ↑ ERP و ↑ PR==.

          للـ rate control في الـ AF والـ flutter، ومنع الـ nodal arrhythmias. الـ side effects: إمساك، ==gingival hyperplasia==، flushing، edema، و HF و AV block و sinus node depression.
        page: 328
        quote: "Decrease conduction velocity, ↑ ERP, ↑ PR interval."
      - kind: match
        prompt: "وصّل كل دوا بالـ side effect المميز"
        pairs:
          - ["Sotalol", "Torsades and excessive β blockade"]
          - ["Amiodarone", "Pulmonary fibrosis, blue/gray skin"]
          - ["Verapamil, diltiazem", "Gingival hyperplasia"]
          - ["Adenosine", "Sense of impending doom"]
          - ["Ivabradine", "Luminous phenomena"]
        why: "الـ sotalol class III وβ في نفس الوقت. الأدينوزين ثواني بس لكن مخيف: flushing وألم صدر وإحساس بالموت وbronchospasm. والإيفابرادين بيعمل أنوار في العين."
        page: 328
        quote: "Adverse effects include flushing, hypotension, chest pain, sense of impending doom, bronchospasm."
      - kind: explain
        title: "الأدينوزين والماغنسيوم"
        text: |-
          **Adenosine**: ↑ خروج الـ K+ ← hyperpolarization، و ↓ الـ Ca2+ current ← ==الـ AV node يقف لحظة==. ده الـ drug of choice لتشخيص وإيقاف أنواع من الـ SVT، ومفعوله حوالي 15 ثانية. ==الـ theophylline والـ caffeine== بيقللوا مفعوله (adenosine receptor antagonists).

          **Magnesium**: للـ ==torsades de pointes== وللـ digoxin toxicity.
        page: 328
        quote: "Effects blunted by theophylline and caffeine (both are adenosine receptor antagonists)."
      - kind: check
        question: "A patient on sotalol has runs of polymorphic VT with a twisting QRS on a long QT. She has a pulse. Which drug first?"
        options: ["Magnesium", "Amiodarone", "Procainamide", "Ibutilide"]
        answer: 0
        why:
          - "صح: الماغنسيوم فعّال في الـ torsades."
          - "الـ amiodarone بيطوّل الـ QT أكتر."
          - "الـ procainamide (IA) بيطوّل الـ QT."
          - "الـ ibutilide بيعمل torsades."
        page: 328
        quote: "Magnesium Effective in torsades de pointes and digoxin toxicity."
      - kind: explain
