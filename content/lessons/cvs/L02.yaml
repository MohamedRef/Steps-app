schema: steps.lesson/v1
lecture: cvs.L02
lessons:
  - id: cvs.L02.lesson1
    title: "القلب من جوه الصدر: مين قدام، مين ورا، ومين بيغذّي مين"
    hook: "صفحة واحدة في الكتاب، بس منها سؤال stab wound وسؤال hoarseness وسؤال heart block في الامتحان"
    minutes: 9
    pages: [287, 287]
    topics: [heart-anatomy, pericardium, coronary-blood-supply]
    goals:
      - "تعرف ليه الـ LA الكبير بيعمل dysphagia و hoarseness"
      - "تعرف ليه الـ RV هو اللي بيتعور في الـ trauma"
      - "تربط كل coronary artery بالحتة اللي بتغذيها وبالـ complication بتاعتها"
    status: unverified
    steps:
      - kind: explain
        title: "القلب مش واقف على وشه"
        text: |-
          القلب في الصدر لافف: الـ apex رايح لتحت وللشمال، فالترتيب من قدام لورا بيبقى غريب شوية.

          - ==الـ RV هو أكتر حاجة قدام==: ورا الـ sternum على طول. فأي طعنة أو حادثة في الصدر من قدام، أول حاجة تتعور هي الـ RV.
          - ==الـ LA هو أكتر حاجة ورا==: لازق في الـ esophagus.
        page: 287
        quote: "LA is the most posterior part of the heart A ; LA enlargement (eg, in mitral stenosis) can lead to: Compression of esophagus → dysphagia"
      - kind: reveal
        prompt: "لو الـ LA كبر جداً (زي في الـ mitral stenosis)، هيدوس على إيه اللي وراه؟ والمريض هيشتكي من إيه؟"
        answer: "على حاجتين:\n- الـ **esophagus** ← dysphagia.\n- الـ **left recurrent laryngeal nerve** (فرع من الـ vagus) ← hoarseness، ودي اسمها ==Ortner syndrome==."
        page: 287
        quote: "Compression of left recurrent laryngeal nerve (branch of vagus nerve → hoarseness (Ortner syndrome)"
      - kind: figure
        title: "مقطع عرضي: مين قدام ومين ورا"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <text x="150" y="16" class="t-sm t-mut">anterior (sternum)</text>
            <line class="fg-ink" x1="120" y1="24" x2="240" y2="24" stroke-width="4"/>
            <rect class="fg-acc" x="130" y="34" width="100" height="40" rx="8"/>
            <text x="166" y="58" class="t-b">RV</text>
            <rect class="fg-box" x="235" y="60" width="80" height="50" rx="8"/>
            <text x="262" y="90" class="t-b">LV</text>
            <rect class="fg-box" x="45" y="70" width="80" height="45" rx="8"/>
            <text x="74" y="97" class="t-b">RA</text>
            <rect class="fg-bad" x="140" y="110" width="100" height="40" rx="8"/>
            <text x="176" y="135" class="t-b">LA</text>
            <circle class="fg-box" cx="160" cy="172" r="12"/>
            <text x="110" y="196" class="t-sm">esophagus</text>
            <circle class="fg-dot-bad" cx="225" cy="168" r="4"/>
            <text x="234" y="172" class="t-sm t-bad">L recurrent laryngeal n.</text>
            <text x="250" y="196" class="t-sm t-mut">posterior</text>
          </svg>
        caption: "الـ RV ورا الـ sternum على طول، والـ LA ورا خالص لازق في الـ esophagus وجنبه الـ left recurrent laryngeal nerve. LA كبير ← يدوس عليهم."
        alt: "Simplified cross-section of the heart: right ventricle just behind the sternum, left atrium most posterior, touching the esophagus and the left recurrent laryngeal nerve."
        page: 287
        quote: "RV is the most anterior part of the heart and most commonly injured in trauma."
      - kind: explain
        title: "الحيطة اللي تحت"
        text: |-
          السطح اللي تحت (الـ inferior أو diaphragmatic surface، اللي قاعد على الـ diaphragm): ==الـ LV حوالي 2/3== والـ RV حوالي 1/3.

          خلّي ده في دماغك لما نيجي للـ inferior MI بعدين: الحيطة دي معظمها LV.
        page: 287
        quote: "LV is about 2/3 and RV is about 1/3 of the inferior (diaphragmatic) cardiac surface"
      - kind: check
        question: "A 22-year-old man has a stab wound left of the sternum, hypotension and distended neck veins. Which chamber was most likely injured?"
        options:
          - "Right ventricle"
          - "Left atrium"
          - "Left ventricle"
          - "Right atrium"
        answer: 0
        why:
          - "صح: الـ RV أكتر حاجة قدام، فهو أكتر chamber بيتعور في الـ trauma."
          - "الـ LA أكتر حاجة ورا، صعب توصله طعنة من قدام."
          - "الـ LV معظمه على الجنب وورا، وبيعمل الـ apex بس."
          - "الـ RA على الحافة اليمين، مش ورا يسار الـ sternum."
        page: 287
        quote: "RV is the most anterior part of the heart and most commonly injured in trauma."
      - kind: explain
        title: "الـ pericardium: 3 طبقات وعصب واحد"
        text: |-
          من برا لجوه:
          - **Fibrous pericardium**: الكيس الناشف.
          - **Parietal pericardium**: البطانة بتاعته من جوه.
          - **Epicardium** (visceral pericardium): لازق على القلب نفسه.

          الـ ==pericardial space== بين الـ parietal والـ epicardium. والعصب اللي بيغذّي الـ pericardium هو الـ ==phrenic nerve==.
        page: 287
        quote: "Consists of 3 layers (from outer to inner): Fibrous pericardium Parietal pericardium Epicardium (visceral pericardium) Pericardial space lies between parietal pericardium and epicardium."
      - kind: reveal
        prompt: "ليه مريض الـ pericarditis ممكن يشتكي من وجع في كتفه الشمال؟"
        answer: "عشان الـ pericardium متغذّي من الـ **phrenic nerve**. والباقي تشريح عادي (مش من First Aid): الـ phrenic جاي من C3-C5، ونفس الـ segments دي بتغذّي جلد الرقبة والكتف، فالمخ بيتلخبط ويحس الوجع في ==الرقبة أو الدراعين أو الكتف== (غالباً الشمال)."
        page: 287
        quote: "Pericardium innervated by phrenic nerve. Pericarditis can cause referred pain to the neck, arms, or one or both shoulders (often left)."
      - kind: explain
        title: "الـ coronaries: مين بيغذّي إيه"
        text: |-
          - **LAD**: الـ anterior 2/3 من الـ septum، والـ ==anterolateral papillary muscle==، والوش القدامي للـ LV. وهو ==أكتر واحد بيتسد==.
          - **Posterior descending artery**: الـ posterior 1/3 من الـ septum، والـ posterior 2/3 من حيطان الـ ventricles، والـ **posteromedial papillary muscle**، والـ **SA و AV nodes** (حسب الـ dominance).
          - **Right (acute) marginal artery**: الـ RV.
        page: 287
        quote: "LAD and its branches supply anterior 2/3 of interventricular septum, anterolateral papillary muscle, and anterior surface of LV. Most commonly occluded."
      - kind: figure
        title: "الـ coronaries من قدام"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="150" y="10" width="60" height="26" rx="6"/>
            <text x="164" y="28" class="t-sm t-b">Aorta</text>
            <path class="fg-arrow" d="M200 36 C 230 50, 250 55, 270 60" marker-end="url(#cvs2a)"/>
            <text x="262" y="54" class="t-sm t-b">LCA (left main)</text>
            <path class="fg-arrow-acc" d="M270 64 C 250 110, 230 150, 205 205" marker-end="url(#cvs2a)"/>
            <text x="238" y="140" class="t-sm t-acc t-b">LAD</text>
            <text x="238" y="156" class="t-sm t-mut">ant. 2/3 septum, ant. LV</text>
            <path class="fg-arrow" d="M280 64 C 320 90, 330 120, 335 150" marker-end="url(#cvs2a)"/>
            <text x="300" y="168" class="t-sm t-b">LCX</text>
            <path class="fg-arrow" d="M160 36 C 120 60, 90 100, 80 150" marker-end="url(#cvs2a)"/>
            <text x="40" y="70" class="t-sm t-b">RCA</text>
            <path class="fg-arrow" d="M82 120 C 110 150, 130 170, 150 180" marker-end="url(#cvs2a)"/>
            <text x="20" y="196" class="t-sm">acute marginal → RV</text>
            <path class="fg-arrow-bad" d="M80 154 C 85 180, 95 200, 110 212" marker-end="url(#cvs2a)"/>
            <text x="114" y="214" class="t-sm t-bad">posterior descending (right-dominant)</text>
          </svg>
        caption: "الـ LCA بيطلع منه الـ LAD (قدام) والـ LCX (على الجنب). الـ RCA بيطلع منه الـ acute marginal (للـ RV)، وفي الـ right-dominant (الأشهر) بيكمّل ورا ويدّي الـ posterior descending artery."
        alt: "Schematic of the coronary arteries: the left coronary artery splits into the left anterior descending and left circumflex arteries; the right coronary artery gives the acute marginal artery to the right ventricle and, in right-dominant hearts, the posterior descending artery."
        page: 287
        quote: "Right-dominant circulation (most common) = PDA arises from RCA"
      - kind: table
        title: "الـ dominance: الـ posterior descending طالع من مين؟"
        columns: ["Circulation", "Posterior descending arises from", "How common"]
        rows:
          - ["Right-dominant", "RCA", "Most common"]
          - ["Left-dominant", "LCX", "~5%-10%"]
          - ["Codominant", "Both LCX and RCA", "~10%-20%"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 287
        quote: "Right-dominant circulation (most common) = PDA arises from RCA Left-dominant circulation = PDA arises from LCX (~5%-10% of patients) Codominant circulation = PDA arises from both LCX and RCA (~10%-20% of patients)"
      - kind: aside
        tone: exam
        text: "السؤال الكلاسيكي: ==inferior MI + bradycardia أو heart block==. المريض غالباً right-dominant، فالـ RCA هو اللي بيدّي الـ posterior descending، وده بيغذّي الـ SA و AV nodes. ولو جاله murmur جديد بعد inferior MI فكّر في الـ posteromedial papillary muscle."
        page: 287
        quote: "and SA and AV nodes (as determined by dominance). Infarct may cause nodal dysfunction (bradycardia or heart block)."
      - kind: case
        stem: "A 63-year-old man has an inferior STEMI (ST elevation in II, III, aVF). His pulse falls to 40/min."
        steps:
          - question: "In the most common coronary pattern, which artery is occluded?"
            options: ["Right coronary artery", "Left anterior descending artery", "Left circumflex artery"]
            answer: 0
            why: "الأغلبية right-dominant، فالـ posterior descending (اللي بيغذّي الحيطة اللي ورا وتحت والـ nodes) طالع من الـ RCA."
          - question: "Why is his heart rate low?"
            options: ["Ischemia of the SA/AV nodes supplied by the posterior descending artery", "Ischemia of the anterolateral papillary muscle", "Compression of the vagus by the left atrium"]
            answer: 0
            why: "الـ posterior descending بيغذّي الـ SA و AV nodes، فالـ infarct ممكن يعمل bradycardia أو heart block. الـ anterolateral papillary تبع الـ LAD."
        page: 287
        quote: "Infarct may cause nodal dysfunction (bradycardia or heart block)."
      - kind: explain
        title: "إمتى الـ LV بيشرب؟"
        text: |-
          ==الـ coronary flow للـ LV والـ septum بيوصل لأعلى حاجة في early diastole==.

          ليه؟ في الـ systole الـ LV بيعصر جامد فبيضغط على الأوعية اللي جوه حيطته ويقفلها تقريباً. أول ما يرتاح في الـ diastole، الأوعية تفتح والدم يجري. عشان كده الـ tachycardia (اللي بتقصّر الـ diastole) بتقلل الـ perfusion.

          والـ **coronary sinus** بيجري في الـ ==left AV groove== ويصب في الـ RA.
        page: 287
        quote: "Coronary blood flow to LV and interventricular septum peaks in early diastole. Coronary sinus runs in the left AV groove and drains into the RA."
      - kind: try
        items: [cvs.L02.002, cvs.L02.010, cvs.L02.012, cvs.L02.013, cvs.L02.016]
    recap:
      - "الـ RV أكتر حاجة قدام (trauma)، والـ LA أكتر حاجة ورا (LA كبير ← dysphagia و hoarseness = Ortner)."
      - "الـ pericardium: fibrous ثم parietal ثم epicardium، ومتغذّي من الـ phrenic (وجع الكتف)."
      - "LAD أكتر واحد بيتسد: anterior septum و anterolateral papillary."
      - "الـ posterior descending: posterior septum و posteromedial papillary و الـ nodes؛ طالع من الـ RCA في الأغلبية."
      - "الـ LV بيشرب في early diastole."
