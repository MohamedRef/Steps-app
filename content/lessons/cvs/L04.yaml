  - id: cvs.L04.lesson5
    title: "بعد الـ MI، وعلاج الـ ACS، والـ cardiomyopathies"
    hook: "ليه الـ posteromedial papillary هو اللي بيتقطع؟ وليه مريض الـ RV infarct ممنوع ياخد nitroglycerin؟"
    minutes: 10
    pages: [313, 315]
    topics: [myocardial-infarction-complications, acute-coronary-syndrome-treatments, cardiomyopathies]
    status: unverified
    steps:
      - kind: order
        prompt: "رتّب مضاعفات الـ MI حسب ميعادها"
        steps:
          - "Peri-infarction pericarditis (1-3 days)"
          - "Papillary muscle rupture (2-7 days)"
          - "Interventricular septal rupture (3-5 days)"
          - "Free wall rupture (5-14 days)"
          - "True ventricular aneurysm (2 weeks to months)"
          - "Postcardiac injury syndrome (weeks to months)"
        why: "الـ arrhythmias ممكن من أول يوم لشهور، وهي أهم سبب وفاة قبل المستشفى وأول 48 ساعة. الـ ruptures كلها في فترة الـ macrophages."
        page: 313
        quote: "Papillary muscle rupture 2-7 days Can result in acute mitral regurgitation → cardiogenic shock, severe pulmonary edema."
      - kind: reveal
        prompt: "ليه الـ posteromedial papillary muscle بيتقطع أكتر بكتير من الـ anterolateral؟"
        answer: "الـ posteromedial ليه ==شريان واحد== بس (الـ posterior descending)، والـ anterolateral ليه اتنين (LAD و LCX). شريان واحد يتسد = العضلة كلها تموت."
        page: 313
        quote: "Posteromedial >> anterolateral papillary muscle rupture A , as the posteromedial has single artery blood supply (posterior descending artery) whereas anterolateral has dual (LAD, LCX)."
      - kind: table
        title: "Pseudoaneurysm ولا true aneurysm؟"
        columns: ["", "Pseudoaneurysm", "True aneurysm"]
        rows:
          - ["Timing", "3-14 days", "2 weeks to months"]
          - ["Wall", "Pericardium/scar only (no myocardium)", "Fibrosed myocardium, dyskinesia"]
          - ["Rupture risk", "Higher", "Lower (mural thrombus risk)"]
        hide: [[1, 1], [2, 1]]
        page: 313
        quote: "Free wall rupture contained by adherent pericardium or scar tissue—does not contain endocardium or myocardium. More likely to rupture than true aneurysm."
      - kind: check
        question: "Day 4 after anterior MI: new harsh murmur, shock, O2 saturation steps up from RA to RV. Diagnosis?"
        options: ["Interventricular septal rupture", "Papillary muscle rupture", "Free wall rupture", "Dressler syndrome"]
        answer: 0
        why:
          - "صح: الـ macrophages كسروا الـ septum ← VSD ← O2 و pressure يعلوا في الـ RV."
          - "ده acute MR من غير step-up في الـ RV."
          - "ده tamponade."
          - "ده pericarditis بعد أسابيع."
        page: 313
        quote: "Macrophage-mediated degradation → VSD → ↑ O2 saturation and ↑ pressure in RV."
      - kind: explain
        title: "علاج الـ ACS"
        text: |-
          **Unstable angina / NSTEMI**: heparin + aspirin + ADP receptor inhibitor (clopidogrel) + β-blocker + ACE inhibitor + statin، و nitroglycerin ± morphine للوجع.

          **STEMI**: كل ده + ==reperfusion== (أهم حاجة؛ PCI أحسن من fibrinolysis).

          لو الـ ==RV متأثر== (RCA): الـ CO معتمد على الـ preload ← IV fluids و ==من غير nitroglycerin==.
        page: 314
        quote: "If RV affected (eg, RCA occlusion), support venous return/ preload to maintain cardiac output (eg, IV fluids, avoiding nitroglycerin)."
      - kind: figure
        title: "Concentric ولا eccentric؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-box" cx="60" cy="80" r="40"/><circle class="fg-thin" cx="60" cy="80" r="28"/>
            <text x="35" y="150" class="t-sm t-b">Normal</text>
            <circle class="fg-acc" cx="180" cy="80" r="48"/><circle class="fg-box" cx="180" cy="80" r="18"/>
            <text x="140" y="145" class="t-sm t-b">Concentric</text><text x="140" y="160" class="t-sm">in parallel (HCM)</text>
            <circle class="fg-bad" cx="300" cy="80" r="55"/><circle class="fg-box" cx="300" cy="80" r="45"/>
            <text x="262" y="150" class="t-sm t-b">Eccentric</text><text x="262" y="165" class="t-sm">in series (DCM)</text>
          </svg>
        caption: "الـ concentric: sarcomeres بتتحط جنب بعض (parallel) ← حيطة تخينة وأوضة صغيرة (HCM، hypertension). الـ eccentric: sarcomeres ورا بعض (series) ← أوضة واسعة وحيطة رفيعة (DCM)."
        alt: "Three cross-sections of the left ventricle: normal; concentric hypertrophy with a thick wall and small cavity from sarcomeres added in parallel; eccentric hypertrophy with a large cavity from sarcomeres added in series."
        page: 315
        quote: "Sarcomeres added in parallel Sarcomeres added in series Cross section Concentric hypertrophy"
      - kind: explain
        title: "Dilated cardiomyopathy"
        text: |-
          ==أشهر cardiomyopathy (90%)==. غالباً idiopathic أو familial (TTN ← titin قصير؛ الكتاب: «Titin is thin, myosin is more»).

          أسبابها: alcohol، cocaine، doxorubicin، coxsackie B، Chagas، CAD، hemochromatosis، sarcoidosis، thyrotoxicosis، wet beriberi، peripartum.

          HF و S3 و systolic murmur وقلب بالونة على الـ CXR. **Systolic dysfunction** و eccentric hypertrophy. والـ **takotsubo**: الـ apex بيتنفخ مؤقتاً بعد stress (sympathetic).
        page: 314
        quote: "Etiologies include drugs (eg, alcohol, cocaine, doxorubicin), infection (eg, coxsackie B, Chagas disease), ischemia (eg, CAD), systemic conditions (eg, hemochromatosis, sarcoidosis, thyrotoxicosis, wet beriberi), peripartum cardiomyopathy."
      - kind: explain
        title: "Hypertrophic cardiomyopathy"
        text: |-
          60%-70% familial ==autosomal dominant== (β-myosin heavy chain، myosin-binding protein C). شاب رياضي يغمى عليه أو يموت فجأة (ventricular arrhythmia).

          S4 و systolic murmur. **Diastolic dysfunction** و concentric hypertrophy (غالباً septal)، و myofibrillar disarray.

          في الـ obstructive: septum تخين + systolic anterior motion للـ mitral ← obstruction.

          العلاج: β-blockers أو non-DHP CCB (mavacamten لو مش نافع)، يبطّل رياضة عنيفة، ICD لو high risk. ==ممنوع أي حاجة تقلّل الـ preload== (diuretics، vasodilators).
        page: 314
        quote: "Treatment: β-blockers or nondihydropyridine CCB (mavacamten if refractory); cessation of high- intensity athletics. ICD if high risk. Avoid drugs that ↓ preload (eg, diuretics, vasodilators)."
