        text: |-
          - أول 6 ساعات: ==الـ ECG هو الـ gold standard==.
          - **Troponin I**: يعلى بعد 4 ساعات، peak عند 24، ويفضل عالي ==7-10 أيام==. الأدق.
          - **CK-MB**: 4-6 ساعات، peak 24، ويرجع طبيعي في 2-3 أيام. عشان كده كان بيتستخدم للـ reinfarction (دلوقتي high-sensitivity troponin).
          - الـ ECG: ST elevation (transmural)، ST depression (subendocardial)، peaked T، T inversion، Q waves (قديم أو بيتطور).
        page: 309
        quote: "Cardiac troponin I rises after 4 hours (peaks at 24 hr) and is ↑ for 7-10 days; more specific than other protein markers. Serial measurements required (if NSTEMI)."
