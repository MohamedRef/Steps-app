          - ["Onset", "Rapid", "Gradual; after dental work"]
        hide: [[0, 1], [0, 2], [1, 1]]
        page: 318
        quote: "Subacute—classically viridans streptococci (low virulence). Smaller vegetations on congenitally abnormal or diseased valves. Sequela of dental procedures. Gradual onset."
      - kind: explain
        title: "العلامات"
        text: |-
          أشهر حاجة ==fever==، وبعدين murmur جديد.

          - **Vascular** (emboli): septic emboli، petechiae، splinter hemorrhages، ==Janeway== (مش بتوجع، على الكفوف والرجلين).
          - **Immunologic**: glomerulonephritis، ==Osler nodes== (بتوجع، «Ouchy»، على أطراف الصوابع)، Roth spots (نزيف في الشبكية بنص أبيض).

          الـ mitral أكتر واحد > الـ aortic. الـ **tricuspid** = IV drug use (الكتاب: don't «tri» drugs)، والـ emboli بتروح الرئة.
        page: 318
        quote: "Vascular phenomena—septic embolism, petechiae, splinter hemorrhages (linear hemorrhagic lesions on nail bed B ), Janeway lesions (painless, flat, erythematous lesions on palms or soles)."
      - kind: match
        prompt: "وصّل الـ setting بالميكروب"
        pairs:
          - ["Prosthetic valve", "S epidermidis"]
          - ["GI/GU procedure", "Enterococcus"]
          - ["Colon cancer", "S gallolyticus"]
          - ["Culture negative", "Coxiella, Bartonella"]
          - ["Injection drug use", "S aureus, Pseudomonas, Candida"]
        why: "والـ gram-negative = HACEK (Haemophilus، Aggregatibacter، Cardiobacterium، Eikenella، Kingella). ولو S gallolyticus، اعمل colonoscopy."
        page: 318
        quote: "Prosthetic valves—S epidermidis GI/GU procedures—Enterococcus Colon cancer—S gallolyticus"
      - kind: aside
        tone: exam
        text: "**Marantic (NBTE)**: vegetations ==sterile== من platelets، على الـ mitral أو aortic، بتطير بسهولة. مع الـ advanced malignancy (خصوصاً ==pancreatic adenocarcinoma==) أو الـ SLE (اسمها Libman-Sacks هناك)."
        page: 318
        quote: "Associated with the hypercoagulable state seen in advanced malignancy (especially pancreatic adenocarcinoma) or SLE (called Libman Sacks endocarditis in this setting)."
      - kind: explain
        title: "الـ rheumatic fever"
        text: |-
          بعد ==strep pharyngitis== (group A). مش البكتيريا نفسها: ==type II hypersensitivity==؛ الأجسام المضادة للـ M protein بتهاجم الـ myosin (molecular mimicry).

          الـ valves: mitral > aortic >> tricuspid (اللي عليها ضغط عالي). في الأول regurgitation، وبعدين stenosis.

          Aschoff bodies و Anitschkow cells، و ASO و anti-DNase B عاليين. العلاج والوقاية: penicillin.
        page: 319
        quote: "Immune mediated (type II hypersensitivity); not a direct effect of bacteria. Antibodies to M protein cross-react with self antigens, often myosin (molecular mimicry). Treatment/prophylaxis: penicillin."
      - kind: mnemonic
        word: "JNES"
        parts:
          - { key: "J", text: "Joint: migratory polyarthritis (+ ♥ pancarditis)" }
          - { key: "N", text: "Nodules in skin (subcutaneous)" }
          - { key: "E", text: "Erythema marginatum" }
          - { key: "S", text: "Sydenham chorea" }
        hook: "الكتاب بيقولها J♥NES، والقلب في النص بين الـ J والـ N"
        page: 319
        quote: "J♥NES (major criteria): Joint (migratory polyarthritis) ♥ (pancarditis) Nodules in skin (subcutaneous) Erythema marginatum (evanescent rash with ring margin) Sydenham chorea (involuntary irregular movements of limbs and face)"
      - kind: check
        question: "A girl with migratory arthritis and a new murmur 3 weeks after a sore throat. Mechanism of carditis?"
        options: ["Anti-M protein antibodies cross-reacting with myosin", "Direct streptococcal invasion", "Immune complexes in glomeruli", "Exotoxin"]
        answer: 0
        why:
