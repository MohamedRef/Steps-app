  - id: cvs.L04.lesson7
    title: "الالتهابات والـ pericardium والـ tumors"
    hook: "Osler بيوجع و Janeway لأ؛ والـ tricuspid مع الـ IV drugs. وفي الآخر الـ tumor plop"
    minutes: 10
    pages: [318, 320]
    topics: [infective-endocarditis, nonbacterial-thrombotic-endocarditis, rheumatic-fever, syphilitic-heart-disease, acute-pericarditis, constrictive-pericarditis, myocarditis, hereditary-hemorrhagic-telangiectasia, cardiac-tumors]
    status: unverified
    steps:
      - kind: table
        title: "Acute ولا subacute endocarditis؟"
        columns: ["", "Acute", "Subacute"]
        rows:
