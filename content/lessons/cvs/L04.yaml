        page: 308
        quote: "Macrophages, then granulation tissue at margins C C Free wall rupture → tamponade; papillary muscle rupture → mitral regurgitation; interventricular septal rupture due to macrophage-mediated structural degradation → left- to-right shunt"
      - kind: check
