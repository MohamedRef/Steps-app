schema: steps.lesson/v1
lecture: cvs.L04
lessons:
  - id: cvs.L04.lesson1
    title: "العيوب الخلقية: أزرق بدري ولا أزرق متأخر؟"
    hook: "سؤال واحد يفرز كل الـ congenital heart disease: الطفل اتولد أزرق ولا ازرقّ بعد سنين؟"
    minutes: 10
    pages: [300, 302]
    topics: [right-to-left-shunts, left-to-right-shunts, coarctation-of-the-aorta, persistent-pulmonary-hypertension-of-the-newborn, congenital-cardiac-defect-associations]
    goals:
      - "تفرّق بين الـ right-to-left والـ left-to-right shunts"
      - "تحفظ الـ 5 T's و PROVe بالمنطق"
      - "تفهم الـ Eisenmenger بيقلب الـ shunt إزاي"
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة الذهبية"
        text: |-
          - **Right-to-left shunt**: دم أزرق بيعدّي للـ aorta من غير ما يروح الرئة ← ==cyanosis بدري== («blue babies»). غالباً بيتشخص قبل الولادة أو أول ما يتولد، ومحتاج عملية بسرعة و/أو prostaglandins تخلّي الـ PDA مفتوح.
          - **Left-to-right shunt**: دم أحمر بيرجع للرئة تاني ← الطفل ==مش أزرق== في الأول؛ الـ cyanosis ممكن تيجي بعد سنين.
        page: 300
        quote: "Early cyanosis—“blue babies.” Often diagnosed prenatally or become evident immediately after birth. Usually require urgent surgical treatment and/or maintenance of a PDA via prostaglandin therapy."
      - kind: mnemonic
        word: "TTTTT"
        parts:
          - { key: "T", text: "Truncus arteriosus: vessel واحد (1)" }
          - { key: "T", text: "Transposition: 2 vessels متبدلين (2)" }
          - { key: "T", text: "Tricuspid atresia: Tri = 3" }
          - { key: "T", text: "Tetralogy of Fallot: Tetra = 4" }
          - { key: "T", text: "TAPVR: 5 حروف" }
        hook: "الـ 5 T's بتوع الكتاب، وكل واحد معاه رقمه"
        page: 300
        quote: "The 5 T’s: 1. Truncus arteriosus (1 vessel) 2. Transposition (2 switched vessels) 3. Tricuspid atresia (3 = Tri) 4. Tetralogy of Fallot (4 = Tetra) 5. TAPVR (5 letters in the name)"
      - kind: explain
        title: "الـ D-TGA: دورتين منفصلين"
        text: |-
          الـ aorta طالعة من الـ RV والـ pulmonary trunk من الـ LV. يعني الدم الأزرق بيلف في الجسم، والأحمر بيلف في الرئة، ==ولا بيتقابلوا==.

          مايعيشش غير لو فيه shunt يخلط (VSD أو PDA أو PFO). السبب: الـ aorticopulmonary septum ==ما لفّش== (spiral). على الـ CXR: «egg on a string».
        page: 300
        quote: "Aorta leaves RV (anterior) and pulmonary trunk leaves LV (posterior) → separation of systemic and pulmonary circulations A . Not compatible with life unless a shunt is present to allow mixing of blood (eg, VSD, PDA, or patent foramen ovale)."
      - kind: explain
        title: "Tetralogy of Fallot = PROVe"
        text: |-
          السبب: الـ infundibular septum اتزق لقدام ولفوق. ده بيعمل 4 حاجات:
          - **P**ulmonary infundibular stenosis (==أهم حاجة في الـ prognosis==)
          - **R**VH: قلب شكل الجزمة (boot-shaped) على الـ CXR
          - **O**verriding aorta: راكبة على الـ VSD
          - **VSD**

          أشهر سبب للـ cyanosis في الطفولة المبكرة، ومرتبط بالـ 22q11.
        page: 300
        quote: "Caused by anterosuperior displacement of the infundibular septum. Most common cause of early childhood cyanosis."
      - kind: reveal
        prompt: "ليه الطفل اللي عنده tetralogy بيقعد القرفصاء بعد ما يجري؟"
        answer: "الـ squatting بيضغط الشرايين في الرجلين ← ==SVR يعلى== ← الضغط في الـ aorta يعلى ← الدم الأزرق من الـ RV يقل عبوره من الـ VSD للـ aorta ← الـ right-to-left shunt يقل ← الـ cyanosis تتحسن. والـ «tet spells» بتيجي مع العياط والحمى والمجهود لأنهم بيزوّدوا الـ RV outflow obstruction."
        page: 300
        quote: "Squatting: ↑ SVR, ↓ right-to-left shunt, improves cyanosis."
      - kind: aside
        tone: exam
        text: "**Ebstein anomaly**: الـ tricuspid leaflets نازلة جوه الـ RV («atrializing»). معاه TR و accessory pathways (يعني WPW) و right HF. والسبب الكلاسيكي في الأسئلة: ==lithium في الحمل==."
        page: 300
        quote: "Displacement of tricuspid valve leaflets downward into RV, artificially “atrializing” the ventricle. Associated with tricuspid regurgitation, accessory conduction pathways, right-sided HF. Rare. Can be caused by lithium exposure in utero."
      - kind: check
        question: "A newborn of a mother with poorly controlled diabetes is deeply cyanotic. CXR shows an 'egg on a string'. Which embryologic failure?"
        options: ["Aorticopulmonary septum failed to spiral", "Aorticopulmonary septum failed to form", "Endocardial cushions failed to fuse", "Septum primum and secundum failed to fuse"]
        answer: 0
        why:
          - "صح: ده D-TGA، والـ septum ما لفّش."
          - "ده الـ persistent truncus arteriosus."
          - "ده AVSD مع Down."
          - "ده PFO."
        page: 300
        quote: "Due to failure of the aorticopulmonary septum to spiral (narrow superior mediastinum causes “egg on a string” appearance on CXR)."
      - kind: table
        title: "الـ left-to-right shunts (VSD > ASD > PDA)"
        columns: ["Lesion", "Key sign", "O2 step-up"]
        rows:
          - ["VSD", "Most small ones self-resolve", "RV and pulmonary artery"]
          - ["ASD", "Systolic ejection murmur, wide fixed split S2", "RA, RV and pulmonary artery"]
          - ["PDA", "Continuous machinelike murmur; late differential cyanosis", "Pulmonary artery"]
        hide: [[0, 2], [1, 1], [1, 2], [2, 1]]
        page: 301
        quote: "O2 saturation ↑ in RA, RV, and pulmonary artery."
      - kind: figure
        title: "الـ Eisenmenger: الـ shunt بيتقلب"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvs4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="70" height="40" rx="6"/><text x="35" y="45" class="t-b">LV</text>
            <rect class="fg-box" x="110" y="20" width="70" height="40" rx="6"/><text x="135" y="45" class="t-b">RV</text>
            <path class="fg-arrow" d="M80 40 L108 40" marker-end="url(#cvs4a)"/>
            <text x="20" y="80" class="t-sm">L→R: ↑ pulmonary flow</text>
            <text x="200" y="30" class="t-sm">→ vascular remodeling</text>
            <text x="200" y="48" class="t-sm">→ pulmonary hypertension</text>
            <text x="200" y="66" class="t-sm">→ RVH</text>
            <rect class="fg-box" x="10" y="100" width="70" height="40" rx="6"/><text x="35" y="125" class="t-b">LV</text>
            <rect class="fg-bad" x="110" y="100" width="70" height="40" rx="6"/><text x="135" y="125" class="t-b">RV</text>
            <path class="fg-arrow-bad" d="M108 120 L82 120" marker-end="url(#cvs4b)"/>
            <text x="200" y="118" class="t-sm t-bad">RV &gt; LV pressure: R→L</text>
            <text x="200" y="136" class="t-sm t-bad">late cyanosis, clubbing,</text>
            <text x="200" y="154" class="t-sm t-bad">polycythemia</text>
          </svg>
        caption: "الدم الزيادة اللي بيروح الرئة سنين بيبوّظ الأوعية ← pulmonary hypertension ← الـ RV يتخن ← لما ضغطه يعدّي الـ LV الـ shunt يتقلب right-to-left."
        alt: "Two panels: first a left-to-right shunt from LV to RV causing pulmonary vascular remodeling, pulmonary hypertension and right ventricular hypertrophy; second the shunt reversed from RV to LV when right pressure exceeds left, causing late cyanosis, clubbing and polycythemia."
        page: 301
        quote: "Uncorrected left-to-right shunt (VSD, ASD, PDA) → ↑ pulmonary blood flow → pathologic remodeling of vasculature → pulmonary arterial hypertension. RVH occurs to compensate → shunt becomes right to left when RV > LV pressure"
      - kind: reveal
        prompt: "مريض PDA عمل Eisenmenger. ليه صوابع رجليه زرقا وصوابع إيديه وردي؟"
        answer: "الـ ductus بيدخل الـ aorta ==بعد== ما الشرايين بتاعة الدراعين والراس طلعت. فلما الـ shunt يتقلب، الدم الأزرق بيروح للنص اللي تحت بس ← **differential cyanosis**."
        page: 301
        quote: "Uncorrected PDA D can eventually result in late cyanosis in the lower extremities (differential cyanosis)."
      - kind: explain
        title: "Coarctation و PPHN"
        text: |-
          - **Coarctation**: ضيق في الـ aorta جنب الـ ductus (juxtaductal). مع الـ ==Turner== والـ bicuspid aortic valve. ضغط عالي في الدراعين، والرجلين باردة ونبضها ضعيف ومتأخر (brachiofemoral delay). مع السن الـ intercostal arteries تكبر كـ collaterals ← ==rib notching==. مضاعفاته: HF، نزيف في المخ (berry aneurysms)، aortic rupture، endocarditis.
          - **PPHN**: الـ pulmonary resistance فضل عالي بعد الولادة (meconium aspiration، pneumonia) ← right-to-left عبر الـ foramen ovale والـ ductus ← الـ preductal saturation أعلى من الـ postductal، بس ==النبض متساوي==.
        page: 302
        quote: "Hypertension in upper extremities. Cyanosis, claudication, coolness, and weak, delayed pulses (brachiofemoral delay) in lower extremities. With age, intercostal arteries enlarge due to collateral circulation → rib-notching on x-ray."
      - kind: match
        prompt: "وصّل كل syndrome بالعيب بتاعه"
        pairs:
          - ["Down syndrome", "AVSD, VSD, ASD"]
          - ["Turner syndrome", "Bicuspid aortic valve, coarctation"]
          - ["Williams syndrome", "Supravalvular aortic stenosis"]
          - ["Prenatal lithium", "Ebstein anomaly"]
          - ["22q11 syndromes", "Truncus arteriosus, tetralogy of Fallot"]
          - ["Maternal diabetes", "TGA, truncus, tricuspid atresia, VSD"]
        why: "والـ congenital rubella: PDA و pulmonary artery stenosis و septal defects. والـ Marfan: MVP و thoracic aneurysm/dissection و AR. والـ fetal alcohol: VSD و PDA و ASD و tetralogy."
        page: 302
        quote: "Turner syndrome Bicuspid aortic valve, aortic coarctation/dissection Williams syndrome Supravalvular aortic stenosis 22q11 syndromes Truncus arteriosus, tetralogy of Fallot"
      - kind: try
        items: [cvs.L04.002, cvs.L04.007, cvs.L04.021, cvs.L04.026, cvs.L04.032]
    recap:
      - "Right-to-left = أزرق بدري (5 T's)؛ left-to-right = أزرق متأخر (VSD > ASD > PDA)."
      - "D-TGA: septum ما لفّش، egg on a string. Tetralogy: PROVe، الـ squatting بيعلّي الـ SVR."
      - "Ebstein مع lithium. ASD: wide fixed split S2. PDA: machinelike، differential cyanosis."
      - "Eisenmenger: pulmonary hypertension ← RVH ← الـ shunt يتقلب."
      - "Coarctation: Turner، ضغط الدراعين عالي، rib notching. PPHN: preductal > postductal، النبض متساوي."
