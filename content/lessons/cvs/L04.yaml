        caption: "أول يوم: wavy fibers و necrosis (والخطر arrhythmia). يوم 1-3: neutrophils و pericarditis. يوم 3-14: الـ macrophages بتاكل ← الحيطة أضعف حاجة ← ruptures. بعد أسبوعين: scar."
