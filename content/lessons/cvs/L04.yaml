  - id: cvs.L04.lesson6
    title: "الـ HF والـ shock والـ tamponade والـ syncope"
    hook: "جدول الـ shock بيتحل بسؤال واحد: إيه الحاجة اللي وقعت الأول؟"
    minutes: 10
    pages: [316, 318]
    topics: [heart-failure, shock, cardiac-tamponade, syncope]
    status: unverified
    steps:
      - kind: explain
        title: "نوعين HF"
        text: |-
          - **HFrEF** (systolic): ==contractility قليلة==، EDV عالي. من الـ MI أو الـ DCM.
          - **HFpEF** (diastolic): ==compliance قليلة== (EDP عالي). من الـ hypertrophy.

          أعراض: dyspnea، orthopnea، fatigue. علامات: S3، rales، JVD، pitting edema. والـ right HF غالباً نتيجة left HF؛ والـ **cor pulmonale** = right HF لوحده من سبب في الرئة.
        page: 316
        quote: "Systolic dysfunction—heart failure with reduced ejection fraction (HFrEF), ↑ EDV; ↓ contractility often 2° to ischemia/MI or dilated cardiomyopathy."
      - kind: sort
        prompt: "علامة left HF ولا right HF؟"
        bins: ["Left HF", "Right HF"]
        cards:
          - { text: "Orthopnea", bin: 0 }
          - { text: "Paroxysmal nocturnal dyspnea", bin: 0 }
          - { text: "Hemosiderin-laden macrophages in lungs", bin: 0 }
          - { text: "Nutmeg liver", bin: 1 }
          - { text: "Jugular venous distention", bin: 1 }
          - { text: "Peripheral edema", bin: 1 }
        why: "الـ left HF بيرجّع الدم للرئة (orthopnea و PND و «HF cells»). الـ right HF بيرجّعه للـ veins (JVD و edema و congestive hepatomegaly بـ nutmeg liver)."
        page: 316
        quote: "Congestive hepatomegaly ↑ central venous pressure → ↑ resistance to portal flow. Rarely, leads to “cardiac cirrhosis.” Associated with nutmeg liver (mottled appearance) on gross exam."
      - kind: reveal
        prompt: "ليه مريض الـ HF بيصحى من النوم مخنوق (PND)؟"
        answer: "وهو نايم الدم بيتوزع من الرجلين للصدر، والـ ==edema اللي في رجليه بيتسحب للدم== تاني ← الـ venous return يزيد ← القلب الضعيف مش ملاحق ← الرئة تتملي."
        page: 316
        quote: "Breathless awakening from sleep: ↑ venous return from redistribution of blood, reabsorption of peripheral edema, etc."
      - kind: table
        title: "أدوية الـ HFrEF"
        columns: ["Drug", "Effect"]
        rows:
          - ["ACEi, ARB, ARNI", "↓ mortality"]
          - ["β-blockers (not in acute decompensation)", "↓ mortality"]
          - ["Aldosterone antagonists", "↓ mortality"]
          - ["Hydralazine + nitrate, SGLT2 inhibitors", "↓ symptoms and mortality"]
          - ["Loop and thiazide diuretics", "Symptoms only"]
        hide: [[2, 1], [4, 1]]
        page: 316
        quote: "ACE inhibitors, ARBs, angiotensin receptor–neprilysin inhibitors, β-blockers (except in acute decompensated HF), and aldosterone receptor antagonists ↓ mortality in HFrEF. Loop and thiazide diuretics are used mainly for symptomatic relief."
      - kind: aside
        tone: trap
        text: "**High-output HF**: الـ CO ==عالي== مش واطي، عشان الـ SVR واطي (vasodilation أو AV shunt). أسبابه: obesity شديدة، cirrhosis، anemia شديدة، hyperthyroidism، wet beriberi، Paget disease of bone."
        page: 317
        quote: "Uncommon form of HF characterized by ↑ CO. High-output state is due to ↓ SVR from either vasodilation or arteriovenous shunting."
      - kind: table
        title: "الـ shock"
        columns: ["Type", "Skin", "CVP", "PCWP", "CO", "SVR"]
        rows:
          - ["Hypovolemic", "Cold", "↓", "↓", "↓", "↑"]
          - ["Cardiogenic", "Cold", "↑", "↑", "↓", "↑"]
          - ["Obstructive (PE)", "Cold", "↑", "↓", "↓", "↑"]
          - ["Distributive (sepsis)", "Warm", "↓", "↓", "↑", "↓"]
        hide: [[0, 2], [1, 3], [2, 3], [3, 4], [3, 5]]
        page: 317
        quote: "Cardiogenic shock MI, HF, valvular dysfunction, arrhythmia Left heart dysfunction ↑ ↑ ↓ ↑ ↓"
      - kind: reveal
        prompt: "إزاي تحل جدول الـ shock من غير حفظ؟"
        answer: "اسأل: إيه اللي وقع ==الأول==؟\n- **Hypovolemic**: الحجم ← كل الضغوط واطية، والجسم يقفل الأوعية (SVR عالي).\n- **Cardiogenic**: الـ pump ← الدم يرجع ورا (CVP و PCWP عاليين).\n- **Obstructive** (PE): السدة بين الـ RV والـ LA ← الـ CVP عالي والـ PCWP واطي (في الـ tamponade الاتنين عاليين).\n- **Distributive**: الـ SVR ← الجلد دافي والـ CO عالي."
        page: 317
        quote: "↓ = 1° disturbance driving the shock."
      - kind: explain
        title: "الـ tamponade"
        text: |-
          سائل بيعصر القلب ← CO يقع، و==الـ diastolic pressures في الـ 4 chambers تتساوى==.

          **Beck triad**: hypotension، رقبة منفوخة، صوت قلب بعيد. ومعاهم tachycardia و **pulsus paradoxus**.

          الـ ECG: low voltage و ==electrical alternans== (القلب بيتمرجح في السائل). الـ echo: effusion، RA بيقع في الـ systole، RV بيقع في الـ diastole، IVC منفوخ. العلاج: pericardiocentesis.
        page: 317
        quote: "Findings: Beck triad (hypotension, distended neck veins, distant heart sounds), ↑ HR, pulsus paradoxus. ECG may show low-voltage QRS and/or electrical alternans (due to “swinging” movement of heart in large effusion)."
      - kind: reveal
        prompt: "الـ pulsus paradoxus بيحصل إزاي؟"
        answer: "في الشهيق الدم الراجع للـ RV يزيد. الـ pericardium مش بيتمط، فالـ RV مالوش مكان غير إنه ==يزق الـ septum ناحية الـ LV== ← الـ LV يتملى أقل ← الـ systolic BP يقع أكتر من 10. بيحصل في الـ tamponade والـ constrictive pericarditis وأمراض الرئة الانسدادية (الكتاب: pea COAT)."
        page: 317
        quote: "↑ venous return during inspiration → ↑ RV filling → interventricular septum bows toward LV (due to ↓ pericardial compliance) → ↓ LV ejection volume → ↓ systolic BP."
      - kind: check
        question: "Pyelonephritis patient: BP 78/40, warm flushed skin. Expected hemodynamics?"
        options: ["↓ SVR, ↑ CO", "↑ SVR, ↓ CO, ↑ PCWP", "↑ SVR, ↓ CO, ↓ PCWP", "↑ CVP, ↓ PCWP"]
        answer: 0
        why:
          - "صح: early septic shock = distributive، الـ SVR وقع الأول والـ CO عالي والجلد دافي."
          - "ده cardiogenic."
          - "ده hypovolemic."
          - "ده obstructive زي الـ PE."
        page: 317
        quote: "Distributive shock Sepsis (early), anaphylaxis Systemic vasodilation Warm, dry ↓ ↓ ↑ ↓ ↑"
      - kind: aside
        tone: tip
        text: "**Syncope**: الـ reflex أشهر نوع (vasovagal بـ prodrome وبيفوق بسرعة، situational، carotid sinus). **Orthostatic** = الـ systolic يقع ==≥20== أو الـ diastolic ≥10 خلال 3 دقايق من الوقوف. **Cardiac** = arrhythmia أو AS أو HCM."
        page: 318
        quote: "Orthostatic hypotension is defined as a drop in systolic BP ≥20 mm Hg and/or diastolic BP ≥10 mm Hg within 3 minutes of standing."
      - kind: try
        items: [cvs.L04.132, cvs.L04.134, cvs.L04.138, cvs.L04.141, cvs.L04.143]
    recap:
      - "HFrEF: contractility ↓؛ HFpEF: compliance ↓. Left HF ← الرئة، right HF ← الـ veins."
      - "اللي بيقلّل الـ mortality: ACEi/ARB/ARNI، β-blockers، aldosterone antagonists، hydralazine-nitrate، SGLT2i. الـ diuretics أعراض بس."
      - "Shock: دوّر على الحاجة اللي وقعت الأول. Distributive = دافي و CO عالي."
      - "Tamponade: Beck triad، pulsus paradoxus، electrical alternans، الضغوط تتساوى."
      - "Orthostatic = ↓20 systolic أو ↓10 diastolic خلال 3 دقايق."
