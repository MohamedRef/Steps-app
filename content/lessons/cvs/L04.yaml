          - "الكتاب بيقول not a direct effect of bacteria."
          - "ده الـ poststreptococcal glomerulonephritis."
          - "مافيش exotoxin هنا."
        page: 319
        quote: "Antibodies to M protein cross-react with self antigens, often myosin (molecular mimicry)."
      - kind: table
        title: "الـ pericardium"
        columns: ["", "Acute pericarditis", "Constrictive pericarditis"]
        rows:
          - ["What", "Inflammation", "Chronic fibrosis ± calcification"]
          - ["Clue", "Pleuritic pain better leaning forward, rub, diffuse ST↑ ± PR↓", "Kussmaul sign, pericardial knock, edema, JVD"]
          - ["Cause", "Idiopathic, coxsackie B, post-MI, SLE, uremia", "Idiopathic, surgery, radiation; TB in resource-limited countries"]
          - ["Treatment", "NSAID + colchicine", ""]
        hide: [[1, 1], [1, 2], [3, 1]]
        page: 319
        quote: "Presents with sharp pleuritic chest pain (↑ with inspiration, ↓ when sitting and leaning forward), friction rub, possible pericardial effusion (between yellow arrows in A ). ECG changes include diffuse ST-segment elevation +/– PR depression."
      - kind: reveal
        prompt: "ليه الـ JVP بيعلى في الشهيق في الـ constrictive pericarditis (Kussmaul sign)، مع إن الطبيعي إنه ينزل؟"
        answer: "الطبيعي: الشهيق يسحب الدم للقلب فالـ JVP ينزل. في الـ constriction الـ RV محبوس ==مش قادر يستوعب== الدم الزيادة ← الدم يرجع للـ vena cava ← الـ JVP يعلى. يحصل كمان مع الـ restrictive cardiomyopathy والـ right HF والـ PE الكبير."
        page: 320
        quote: "Impaired RV filling → RV cannot accommodate ↑ venous return during inspiration → blood backs up into vena cava → Kussmaul sign."
      - kind: explain
        title: "Myocarditis و HHT و syphilis"
        text: |-
          - **Myocarditis**: سبب مهم للـ ==SCD تحت 40 سنة==. علامة مميزة: tachycardia أكبر من الحمى. أشهر سبب viral (coxsackie B وغيره: lymphocytes مع focal necrosis)، وكمان T cruzi، Borrelia، diphtheria، CO، doxorubicin، cocaine، Kawasaki، SLE.
          - **HHT** (Osler-Weber-Rendu): AD، telangiectasias، رعاف متكرر، AVMs في المخ والرئة والكبد، GI bleeding، iron deficiency.
          - **Syphilis** (3°): بتبوّظ الـ vasa vasorum ← ascending aorta بتتوسع، شكل «tree bark»، و aortic insufficiency.
        page: 320
        quote: "Inflammation of myocardium. Major cause of SCD in adults <40 years old. Presentation highly variable, can include dyspnea, chest pain, fever, arrhythmias (persistent tachycardia out of proportion to fever is characteristic)."
