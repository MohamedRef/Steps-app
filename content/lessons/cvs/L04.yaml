  - id: cvs.L04.lesson2
    title: "الأوعية: الضغط والكوليسترول والـ aorta"
    hook: "ليه الـ AAA تحت الكلى؟ وليه الـ type A dissection عملية والـ type B أدوية؟"
    minutes: 10
    pages: [302, 305]
    topics: [hypertension, hyperlipidemia-signs, atherosclerosis, cholesterol-emboli-syndrome, arteriolosclerosis, aortic-aneurysm, traumatic-aortic-rupture, aortic-dissection, subclavian-steal-syndrome]
    status: unverified
    steps:
      - kind: explain
        title: "الـ hypertension"
        text: |-
          التعريف: ضغط ثابت ==≥130/80==. 90% primary (CO أو TPR عالي)، والـ 10% الباقيين أغلبهم كلوي: **fibromuscular dysplasia** («string of beads»، ستات صغيرين أو في منتصف العمر، adult females) أو atherosclerotic renal artery stenosis، أو primary hyperaldosteronism، أو sleep apnea.

          - **Urgency**: ≥180/≥120 ==من غير== end-organ damage.
          - **Emergency**: ضغط عالي جداً ==مع== damage حاد (encephalopathy، stroke، papilledema، MI، HF، dissection، كلى، MAHA، eclampsia). الـ arterioles ممكن يبقى فيها fibrinoid necrosis.
        page: 302
        quote: "Hypertensive urgency—severe (≥180/≥120 mm Hg) hypertension without acute end-organ damage."
      - kind: explain
        title: "الـ atherosclerosis بيتبني إزاي"
        text: |-
          في الشرايين الكبيرة والمتوسطة، في الـ ==tunica intima==. أكتر أماكن: abdominal aorta > coronary > popliteal > carotid > circle of Willis (الكتاب: «A copy cat named Willis»).

          الـ statins بتقلّل الـ LDL ← الـ plaque يكبر أبطأ ويقل احتمال إنه يتفرتك.
        page: 303
        quote: "Abdominal aorta > coronary artery > popliteal artery > carotid artery > circle of Willis. A copy cat named Willis."
      - kind: order
        prompt: "رتّب مراحل الـ atherosclerosis"
        steps:
          - "Endothelial dysfunction"
          - "Macrophage and LDL accumulation"
          - "Foam cells"
          - "Fatty streak"
          - "Smooth muscle migration (PDGF, FGF)"
          - "Fibrous plaque"
          - "Complex atheroma and calcification"
        why: "الالتهاب هو المحرك: الـ endothelium يتعور، الـ macrophages تاكل LDL وتبقى foam cells، وبعدين الـ smooth muscle تيجي من الـ media (بالـ PDGF و FGF) وتبني cap ليفي."
        page: 303
        quote: "endothelial cell dysfunction → macrophage and LDL accumulation → foam cell formation → fatty streaks → smooth muscle cell migration (involves PDGF and FGF), proliferation, and extracellular matrix deposition → fibrous plaque → complex atheromas A → calcification"
      - kind: aside
        tone: trap
        text: "**Cholesterol emboli** بعد قسطرة: صوابع زرقا (blue toe)، livedo reticularis، كلى بتقع. بس ==النبض موجود== (pulses remain palpable)، لأن اللي اتسد شرايين صغيرة والـ larger arteries سليمة. ولو حد حط **tendinous xanthoma** في Achilles = familial hypercholesterolemia."
        page: 304
        quote: "Pulses remain palpable because larger arteries are unaffected. May follow invasive vascular procedures (angiography, angioplasty, endovascular grafting)."
      - kind: table
        title: "الـ arteriolosclerosis"
        columns: ["Type", "Look", "Setting"]
        rows:
          - ["Hyaline", "Pink wall from plasma protein leak", "Hypertension, diabetes"]
          - ["Hyperplastic", "Onion skinning (smooth muscle)", "Severe hypertension"]
        hide: [[0, 2], [1, 1]]
        page: 304
        quote: "Hyaline—vessel wall thickening 2° to plasma protein leak into subendothelium in hypertension or diabetes mellitus A . Hyperplastic—“onion skinning” B in severe hypertension with proliferation of smooth muscle cells."
      - kind: table
        title: "Thoracic ولا abdominal aneurysm؟"
        columns: ["", "Thoracic", "Abdominal"]
        rows:
          - ["Pathology", "Cystic medial degeneration", "Transmural inflammation, matrix degradation"]
          - ["Risk", "Hypertension, bicuspid valve, Marfan, 3° syphilis", "Smoking (strongest), age, male, family"]
          - ["Clue", "Root dilation → AR", "Infrarenal, pulsatile mass"]
        hide: [[0, 1], [0, 2], [1, 2]]
        page: 304
        quote: "Associated with cystic medial degeneration. Risk factors include hypertension, bicuspid aortic valve, connective tissue disease (eg, Marfan syndrome). Also associated with 3° syphilis (obliterative endarteritis of the vasa vasorum)."
      - kind: reveal
        prompt: "ليه الـ AAA غالباً تحت الـ renal arteries؟"
        answer: "عشان الـ ==vasa vasorum== (الأوعية اللي بتغذّي حيطة الـ aorta نفسها) أقل هناك، فالحيطة أضعف. والـ rupture: كتلة نابضة + وجع بطن/ضهر + hypotension مش بيستجيب."
        page: 304
        quote: "Rupture may present as triad of pulsatile abdominal mass, acute abdominal/back pain, and resistant hypotension. Most often infrarenal (distribution of vasa vasorum is reduced)."
      - kind: explain
        title: "Rupture و dissection"
        text: |-
          - **Traumatic rupture**: deceleration (حادثة، وقعة) ← غالباً عند الـ ==aortic isthmus== (بعد الـ left subclavian على طول). الـ x-ray: mediastinum واسع.
          - **Dissection**: شق طولي في الـ intima بيعمل false lumen. أقوى risk factor ==hypertension==. وجع مفاجئ بيقطّع رايح للضهر، وضغط الدراعين مختلف.
            - **Type A**: الـ Ascending ← ممكن AR حاد أو tamponade ← ==surgery==.
            - **Type B**: الـ descending بس (Below الـ subclavian) ← β-blockers ثم vasodilators.
        page: 305
        quote: "Stanford type A (proximal): involves Ascending aorta (red arrow in A ). May extend to aortic arch or descending aorta (blue arrow in A ). May result in acute aortic regurgitation or cardiac tamponade. Treatment: surgery."
      - kind: check
        question: "Sudden tearing chest pain to the back, unequal arm pressures, new diastolic murmur, flap in the ascending aorta. Next step?"
        options: ["Emergency surgery", "β-blockers then vasodilators only", "Thrombolysis", "Heparin"]
        answer: 0
        why:
          - "صح: الـ ascending = Stanford type A ← عملية."
          - "ده علاج الـ type B."
          - "الـ thrombolysis في dissection كارثة."
          - "الـ anticoagulation بيزوّد النزيف في الـ false lumen."
        page: 305
        quote: "May result in acute aortic regurgitation or cardiac tamponade. Treatment: surgery."
      - kind: figure
        title: "الـ subclavian steal"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="cvs4c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker><marker id="cvs4d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <path class="fg-ink" d="M60 170 L60 120 C 60 100, 300 100, 300 120" fill="none" stroke-width="3"/>
            <text x="150" y="98" class="t-sm">aortic arch</text>
            <line class="fg-ink" x1="250" y1="108" x2="340" y2="108" stroke-width="3"/>
            <rect class="fg-dot-bad" x="262" y="102" width="8" height="12"/>
            <text x="250" y="130" class="t-sm t-bad">stenosis</text>
            <text x="300" y="100" class="t-sm">L arm</text>
            <line class="fg-arrow-bad" x1="290" y1="30" x2="290" y2="100" marker-end="url(#cvs4c)"/>
            <text x="296" y="50" class="t-sm t-bad">L vertebral</text>
            <text x="296" y="64" class="t-sm t-bad">(reversed)</text>
            <line class="fg-arrow" x1="110" y1="105" x2="110" y2="30" marker-end="url(#cvs4d)"/>
            <text x="40" y="50" class="t-sm">R vertebral</text>
            <path class="fg-arrow" d="M115 22 C 180 5, 240 5, 285 22" marker-end="url(#cvs4d)"/>
            <text x="150" y="20" class="t-sm t-mut">basilar</text>
          </svg>
        caption: "الـ left subclavian متسد قبل الـ vertebral. لما الدراع يشتغل، يسحب دم من المخ: الدم بينزل في الـ left vertebral بالعكس ← دوخة و vertigo، وفرق ضغط بين الدراعين أكتر من 15."
        alt: "Diagram of the aortic arch with a left subclavian stenosis before the vertebral artery; the right vertebral carries blood up to the basilar, and the left vertebral carries it down in reverse to supply the arm."
        page: 305
        quote: "Stenosis of subclavian artery proximal to origin of vertebral artery → hypoperfusion distal to stenosis → reversed blood flow in ipsilateral vertebral artery → reduced cerebral perfusion on exertion of affected arm."
      - kind: try
        items: [cvs.L04.038, cvs.L04.046, cvs.L04.051, cvs.L04.054, cvs.L04.060]
    recap:
      - "Hypertension ≥130/80؛ urgency من غير damage، emergency مع damage."
      - "Atherosclerosis: abdominal aorta الأول؛ foam cells ← fatty streak ← PDGF/FGF ← fibrous plaque."
      - "Cholesterol emboli: blue toes والنبض موجود. Hyaline (سكر وضغط) و hyperplastic (onion skin)."
      - "Thoracic: cystic medial degeneration. AAA: smoking، infrarenal."
      - "Trauma ← isthmus. Dissection type A ← surgery، type B ← β-blockers."
      - "Subclavian steal: vertebral بالعكس وفرق ضغط > 15."
    practice: [cvs.L04.034, cvs.L04.035, cvs.L04.036, cvs.L04.037, cvs.L04.038, cvs.L04.039, cvs.L04.040, cvs.L04.041, cvs.L04.042, cvs.L04.043, cvs.L04.044, cvs.L04.045, cvs.L04.046, cvs.L04.047, cvs.L04.048, cvs.L04.049, cvs.L04.050, cvs.L04.051, cvs.L04.052, cvs.L04.053, cvs.L04.054, cvs.L04.055, cvs.L04.056, cvs.L04.057, cvs.L04.058, cvs.L04.059, cvs.L04.060, cvs.L04.061, cvs.L04.062, cvs.L04.063, cvs.L04.064, cvs.L04.184, cvs.L04.185]
  - id: cvs.L04.lesson3
    title: "الـ angina والـ MI: من الـ plaque للـ scar"
    hook: "إمتى الـ troponin يعلى؟ وإمتى الحيطة بتتقطع؟ وأنهي lead بيقولك أنهي شريان؟"
    minutes: 10
    pages: [306, 309]
    topics: [coronary-artery-disease, ischemic-heart-disease-manifestations, evolution-of-myocardial-infarction, diagnosis-of-myocardial-infarction, ecg-localization-of-stemi]
    status: unverified
    steps:
      - kind: table
