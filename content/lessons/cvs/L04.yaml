  - id: cvs.L04.lesson4
    title: "الـ arrhythmias: ضيق ولا واسع، منتظم ولا لأ"
    hook: "الـ QRS ضيق يبقى فوق الـ AV node، واسع يبقى تحت. ومن هنا تبتدي"
    minutes: 10
    pages: [310, 312]
    topics: [narrow-complex-tachycardias, wolff-parkinson-white-syndrome, wide-complex-tachycardias, hereditary-channelopathies, sick-sinus-syndrome, conduction-blocks, premature-beats]
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة"
        text: |-
          - **Narrow** (QRS <120 msec): الكهربا نازلة من الطريق الطبيعي ← المشكلة ==فوق أو جوه الـ AV node== (supraventricular).
          - **Wide** (QRS ≥120 msec): الكهربا ماشية خلية لخلية برا الطريق ← المشكلة ==تحت الـ AV node== (ventricular).
        page: 310
        quote: "Narrow QRS complex <120 msec, rapid ventricular activation via normal ventricular conduction system, tachycardia originates within or above AV node (supraventricular arrhythmia)."
      - kind: explain
        title: "الـ AF"
        text: |-
          Irregularly irregular ومافيش P waves. بتبتدي غالباً من foci جنب الـ ==pulmonary veins== في الـ LA. risk factors: hypertension، CAD، السن، atrial dilation.

          الخطر: الدم بيقف في الـ LA ← جلطة (غالباً في الـ ==LA appendage==) ← stroke.

          العلاج **ABCD**: Anticoagulation، Beta-blockers، Calcium channel blockers، Digoxin، وكمان cardioversion و ablation.
        page: 310
        quote: "May predispose to thromboembolic events due to LA blood stasis, particularly stroke. LA appendage is the most common site of thrombus formation in atrial fibrillation."
      - kind: sort
        prompt: "منتظم ولا irregularly irregular؟"
        bins: ["Regular", "Irregularly irregular"]
        cards:
          - { text: "Atrial flutter (sawtooth)", bin: 0 }
          - { text: "Paroxysmal SVT", bin: 0 }
          - { text: "Ventricular tachycardia", bin: 0 }
          - { text: "Atrial fibrillation", bin: 1 }
          - { text: "Multifocal atrial tachycardia (≥3 P shapes)", bin: 1 }
        why: "الـ AF مافيهوش P waves، والـ MAT فيه 3 أشكال P أو أكتر (COPD). الـ flutter reentry حوالين الـ tricuspid annulus (sawtooth)، والـ PSVT reentry غالباً في الـ AV node، والـ VT عادة منتظم."
        page: 310
        quote: "Irregularly irregular rate and rhythm with at least 3 distinct P wave morphologies, due to multiple ectopic foci in atria. Associated with underlying conditions such as COPD, pneumonia, HF."
      - kind: explain
        title: "WPW: طريق مختصر"
        text: |-
          فيه **bundle of Kent** بيوصّل من الـ atria للـ ventricle من غير ما يعدّي على الـ AV node البطيء ← جزء من الـ ventricle يبتدي بدري:
          - ==PR قصير==
          - ==delta wave==
          - QRS واسع

          ممكن يعمل reentry ← SVT. العلاج procainamide أو ibutilide.
        page: 310
        quote: "Abnormal fast accessory conduction pathway from atria to ventricle (bundle of Kent) bypasses rate-slowing AV node → ventricles partially depolarize earlier → characteristic delta wave with widened QRS complex and shortened PR interval."
      - kind: reveal
        prompt: "ليه ممنوع تدّي adenosine أو verapamil أو β-blocker لمريض WPW عنده tachycardia؟"
        answer: "دول ==AV nodal blockers==. لو قفلت الـ AV node، كل الكهربا هتنزل من الـ bundle of Kent اللي مالوش فرامل، فالـ ventricles ممكن تاخد rate عالي جداً. استخدم procainamide أو ibutilide."
        page: 310
        quote: "Treatment: procainamide, ibutilide. Avoid AV nodal–blocking drugs (eg, adenosine, calcium channel blockers, β-blockers)."
      - kind: explain
        title: "الـ wide ones"
        text: |-
          - **VT**: منتظم، فوق 100، غالباً من structural disease (cardiomyopathy، scar بعد MI). خطر sudden death.
          - **Torsades de pointes**: polymorphic VT بتلف حوالين الـ baseline. السبب ==long QT== (أدوية، ↓ K+، ↓ Mg2+، ↓ Ca2+، congenital). العلاج: defibrillation لو unstable، ==magnesium sulfate== لو stable.
          - **VF**: مافيش موجات خالص ← CPR و defibrillation فوراً.
        page: 311
        quote: "Treatment: defibrillation for unstable patients, magnesium sulfate for stable patients."
      - kind: mnemonic
        word: "ABCDEFNO"
        parts:
          - { key: "A", text: "anti-Arrhythmics (Ia, III), Arsenic" }
          - { key: "B", text: "anti-Biotics (macrolides, fluoroquinolones)" }
          - { key: "C", text: "anti-Cychotics (haloperidol), Chloroquine" }
          - { key: "D", text: "anti-Depressants (TCAs), Diuretics (thiazides)" }
          - { key: "E", text: "anti-Emetics (ondansetron)" }
          - { key: "F", text: "anti-Fungals (fluconazole)" }
          - { key: "N", text: "Navir (protease inhibitors)" }
          - { key: "O", text: "Opioids (methadone)" }
        hook: "أدوية الـ long QT بتاعة الكتاب: ABCDEF + NO"
        page: 311
        quote: "Drug-induced long QT (ABCDEF+NO): anti-Arrhythmics (Ia and III), Arsenic anti-Biotics (macrolides, fluoroquinolones) anti-Cychotics (haloperidol), Chloroquine anti-Depressants (TCAs), Diuretics (thiazides) anti-Emetics (ondansetron) anti-Fungals (Fluconazole) Navir (protease inhibitors) Opioids (methadone)"
      - kind: table
        title: "الـ channelopathies و sick sinus"
        columns: ["Condition", "Defect", "Clue"]
        rows:
          - ["Brugada", "Na+ channel loss (AD)", "Asian males; pseudo-RBBB + ST elevation V1–V3; ICD"]
          - ["Romano-Ward", "K+ channel loss (AD)", "Long QT, no deafness"]
          - ["Jervell and Lange-Nielsen", "K+ channel loss (AR)", "Long QT + sensorineural deafness"]
          - ["Sick sinus syndrome", "Age-related SA node degeneration", "Bradycardia, pauses, arrests, junctional escape"]
        hide: [[0, 1], [1, 2], [2, 2], [3, 1]]
        page: 311
        quote: "Romano-Ward syndrome—autosomal dominant, pure cardiac phenotype (no deafness). Jervell and Lange-Nielsen syndrome—autosomal recessive, sensorineural deafness."
      - kind: check
        question: "Constant PR interval with occasional dropped QRS complexes. Most appropriate management?"
        options: ["Pacemaker", "Observation", "Adenosine", "Digoxin"]
        answer: 0
        why:
          - "صح: ده Mobitz II، غالباً structural (ischemia أو fibrosis) وممكن يبقى complete block ← pacemaker."
          - "الـ observation للـ first-degree و Mobitz I (Wenckebach)."
          - "الـ adenosine بيقفل الـ AV node أكتر."
          - "الـ digoxin بيبطّأ الـ AV node."
        page: 312
        quote: "Dropped beats that are not preceded by a change in PR interval. May progress to 3rd-degree block, as it usually indicates a structural abnormality such as ischemia or fibrosis. Treatment: usually a pacemaker."
      - kind: aside
        tone: exam
        text: "الـ **third-degree block**: الـ P والـ QRS كل واحد في حاله، والـ atrial rate أعلى. من أسبابه ==Lyme disease== (الكتاب: «Lym3»). **PAC**: QRS ضيق قبله P (كافيين)؛ **PVC**: QRS واسع من غير P، والـ SV بتاعه أقل."
        page: 312
        quote: "P waves and QRS complexes rhythmically dissociated. Atria and ventricles beat independently of each other. Atrial rate > ventricular rate. May be caused by Lym3 disease. Treatment: pacemaker."
      - kind: try
        items: [cvs.L04.089, cvs.L04.092, cvs.L04.097, cvs.L04.100, cvs.L04.104]
    recap:
      - "Narrow = فوق الـ AV node؛ wide = تحت."
      - "AF: pulmonary veins، LA appendage، ABCD. MAT ≥3 P shapes. Flutter sawtooth."
      - "WPW: PR قصير و delta wave؛ procainamide، وممنوع AV nodal blockers."
      - "Torsades: long QT، magnesium. ABCDEF+NO."
      - "Brugada Na+؛ long QT K+ (JLN مع deafness). Mobitz II ← pacemaker. Lyme ← 3rd-degree."
