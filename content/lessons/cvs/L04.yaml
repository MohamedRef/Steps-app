        page: 306
        quote: "TROPONIN LEVEL No elevation No elevation Elevated Elevated INFARCTION None None Subendocardial"
      - kind: explain
        title: "الفرق بين الـ unstable والـ NSTEMI كلمة واحدة"
        text: |-
          الاتنين thrombus بيسد جزئياً ووجع في الراحة. الفرق: ==الـ troponin==. لو علي يبقى في necrosis = NSTEMI.

          - **Stable**: plaque ثابت ≥70% ← وجع مع المجهود بيروح بالراحة أو الـ nitroglycerin.
          - **Vasospastic** (Prinzmetal): spasm في الراحة، ST changes بتروح. أهم risk factor ==التدخين==. triggers: cocaine، amphetamines، alcohol، triptans. العلاج: CCBs و nitrates ووقف التدخين.
        page: 306
        quote: "Unstable—thrombosis with incomplete coronary artery occlusion; ↑ in frequency or intensity of exertional chest pain or any chest pain at rest. No cardiac biomarker elevation (vs non–ST- segment elevation MI [NSTEMI])."
      - kind: reveal
        prompt: "ليه الـ adenosine أو الـ dipyridamole في الـ stress test ممكن يعمل ischemia، مع إنهم vasodilators؟"
        answer: "الأوعية اللي ورا الـ stenosis ==موسّعة على الآخر أصلاً==. الدوا بيوسّع الأوعية السليمة بس ← الضغط فيها يقل ← الدم يروح للمناطق السليمة ويسيب المنطقة المريضة ← **coronary steal**."
        page: 307
        quote: "Distal to coronary stenosis, vessels are maximally dilated at baseline to compensate for reduced blood flow."
      - kind: aside
        tone: tip
        text: "**Hibernation** = LV ضعيف من ischemia مزمنة، بيرجع لو عملت reperfusion. **Stunning** = ضعف مؤقت بعد ischemia حادة قصيرة. والـ **sudden cardiac death** غالباً من ==VF==، و70% منها CAD، والوقاية ICD."
        page: 307
        quote: "Myocardial hibernation—LV systolic dysfunction in the setting of chronic ischemia. Potentially reversible with myocardial reperfusion. Seen in stable angina, acute MI, or HF. Contrast with myocardial stunning—transient, reversible LV systolic dysfunction after brief, acute ischemia."
      - kind: figure
        title: "الـ MI على الزمن"
