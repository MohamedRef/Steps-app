        hide: [[0, 1], [0, 2], [1, 1], [1, 2]]
        page: 212
        quote: "Th1 cells secrete IFN-γ → macrophage classical activation (proinflammatory) Th2 cells secrete IL-4 and IL-13 → macrophage alternative activation"
      - kind: reveal
        prompt: "الالتهاب المزمن ممكن يخلص على cancer. اذكر مثالين من الكتاب."
        answer: "**HCV مزمن** ← chronic inflammation ← ==hepatocellular carcinoma==. و**H pylori** ← chronic gastritis ← ==gastric adenocarcinoma==. ونهاياته التانية: scarring و amyloidosis."
        page: 212
        quote: "Scarring, amyloidosis, and neoplastic transformation (eg, chronic HCV infection → chronic inflammation → hepatocellular carcinoma; Helicobacter pylori infection → chronic gastritis → gastric adenocarcinoma)."
      - kind: check
        question: "Which cell is dominant in chronic inflammation?"
        options:
          - "Macrophage"
          - "Neutrophil"
          - "Eosinophil"
          - "Mast cell"
        answer: 0
        why:
          - "صح: الكتاب بيقول الـ macrophages هي الـ dominant cells، وتعاملها مع الـ T cells هو اللي بيعمل الـ chronic inflammation."
          - "الـ neutrophil علامة الـ acute inflammation."
          - "الـ eosinophil مش هو الـ dominant cell هنا."
          - "الـ mast cell من mediators الـ acute inflammation."
      - kind: explain
        title: "الـ granuloma: سجن مش إعدام"
        text: |-
          الـ granuloma نوع من الـ chronic inflammation. بيحاوط stimulus مقاوم ==من غير ما يقضي عليه== ← التهاب مستمر ← fibrosis وأذى في العضو.

          الشكل: **epithelioid cells** (activated macrophages بـ cytoplasm وردي كتير) حواليها lymphocytes و **multinucleated giant cells** (macrophages اندمجت في بعض).

          - **Caseating**: فيها central necrosis، في الـ ==infections== (TB، fungi).
          - **Noncaseating**: من غير necrosis، في الأسباب الـ noninfectious (sarcoidosis، Crohn).
        page: 213
        quote: "Granulomas “wall off” a resistant stimulus without completely eradicating or degrading it → persistent inflammation → fibrosis, organ damage."
