        alt: "Flow diagram: an APC secretes IL-12 to drive a Th1 cell, which secretes IFN-γ to activate a macrophage; TNF from the macrophage forms a granuloma of epithelioid cells ringed by lymphocytes and giant cells."
        page: 213
        quote: "APCs present antigens to CD4+ Th cells and secrete IL-12 → CD4+ Th cells differentiate into Th1 cells"
      - kind: reveal
        prompt: "لو الـ TNF هو اللي بيبني الـ granuloma ويمسكها، إيه اللي يحصل لمريض عنده latent TB وبدأ anti-TNF؟"
        answer: "الـ granulomas اللي حابسة الـ TB ==بتتفك== ← disseminated disease (زي الـ miliary TB). عشان كده لازم **test للـ latent TB** قبل أي anti-TNF."
