            <text x="6" y="192" class="t-sm">Ab vs postsynaptic ACh receptors</text>
            <text x="6" y="206" class="t-sm t-mut">Thymoma</text>
            <path class="fg-arrow-bad" d="M126 170 L 194 124" marker-end="url(#pL03n)"/>
          </svg>
        caption: "الاتنين antibodies على الـ neuromuscular junction، بس في مكانين: الـ Lambert-Eaton بيضرب قنوات الـ Ca2+ في الـ nerve terminal قبل الـ synapse (غالباً مع SCLC)، والـ myasthenia gravis بيضرب الـ ACh receptors على العضلة بعد الـ synapse (مع الـ thymoma)."
