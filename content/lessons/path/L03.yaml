  - id: path.L03.lesson5
    title: "نعرف الورم منين، وإزاي بيعمل أعراض بعيد عنه"
    hook: "metastasis في الكبد من غير pigment: S-100 هيكشف إنه melanoma. ومدخّن عضلاته بتقوى لما يحرّكها."
    minutes: 9
    pages: [223, 224]
    topics: [cancer-testing, immunohistochemical-stains, p-glycoprotein, paraneoplastic-syndromes]
    goals:
      - "تعرف الـ cancer tests الحديثة وكل واحد بيتوقّع إيه"
      - "تربط كل immunohistochemical stain بالخلية والأورام"
      - "تعرف الـ P-glycoprotein ودوره في الـ resistance"
      - "تربط الـ paraneoplastic syndromes بأورامها"
    status: unverified
    steps:
      - kind: table
        title: "الـ cancer tests"
        columns: ["Test", "Use"]
        rows:
          - ["Tumor mutational burden", "May predict response to checkpoint inhibitors"]
          - ["Microsatellite instability", "Mismatch repair deficit (Lynch); colorectal, endometrial"]
          - ["PD-L1 expression", "Anti-PD-L1 / anti-PD-1 therapy"]
          - ["Homologous recombination deficiency", "PARP inhibitors (breast, ovarian)"]
          - ["Liquid biopsy", "ctDNA, ctRNA, CTCs: profiling, monitoring, surveillance"]
        hide: [[1, 1], [3, 1], [4, 1]]
        page: 223
        quote: "Identifies cancer types with genetic abnormalities and genomic instability (eg, breast, ovarian) that may respond to certain treatments (eg, PARP inhibitors)."
      - kind: explain
        title: "الـ stains: الورم ده أصله إيه"
        text: |-
          الـ immunohistochemical stains بتحدد ==الـ primary site== للـ metastasis، وبتصنّف الأورام الصعبة.

          - **Cytokeratin**: epithelial. **Desmin**: muscle. **Vimentin**: mesenchymal.
          - **Chromogranin و synaptophysin**: neuroendocrine (small cell، carcinoid، neuroblastoma).
          - **GFAP**: neuroglia (astrocytoma، glioblastoma). **Neurofilament**: neurons.
          - **S-100**: ==neural crest== (melanoma، schwannoma، Langerhans cell histiocytosis).
          - **PECAM-1/CD31**: endothelium (angiosarcoma). **TRAP**: hairy cell leukemia. **PSA**: prostate.
        page: 223
        quote: "Determine primary site of origin for metastatic tumors and characterize tumors that are difficult to classify."
      - kind: sort
        prompt: "أنهي stain للورم ده؟"
        bins: ["S-100", "Desmin", "GFAP", "Chromogranin"]
        cards:
          - { text: "Melanoma", bin: 0 }
          - { text: "Schwannoma", bin: 0 }
          - { text: "Rhabdomyosarcoma", bin: 1 }
          - { text: "Glioblastoma", bin: 2 }
          - { text: "Astrocytoma", bin: 2 }
          - { text: "Small cell lung carcinoma", bin: 3 }
          - { text: "Carcinoid tumor", bin: 3 }
        why: "الـ S-100 للـ neural crest، الـ desmin للعضل، الـ GFAP للـ glia، والـ chromogranin للـ neuroendocrine."
        page: 223
        quote: "S-100 Neural crest cells Melanoma, schwannoma, Langerhans cell histiocytosis"
      - kind: reveal
        prompt: "الورم استجاب للـ chemotherapy في الأول وبعد كام cycle بطّل. إيه أحد الأسباب اللي الكتاب بيقولها؟"
        answer: "الـ ==P-glycoprotein== (MDR1): pump بيشتغل بالـ ATP، وبعض الخلايا الورمية بتعمله عشان ==تطلّع== الـ toxins برّه، ومنها أدوية الـ chemotherapy. فالـ response بيقل مع الوقت."
        page: 223
        quote: "ATP-dependent efflux pump, also called multidrug resistance protein 1 (MDR1). Expressed in some cancer cells to pump out toxins, including chemotherapeutic agents"
      - kind: explain
        title: "الـ paraneoplastic: أعراض بعيد عن الورم"
        text: |-
          **جلد وعضم**: dermatomyositis (adenocarcinomas، خصوصاً ovarian)، acanthosis nigricans (gastric adenocarcinoma)، sign of **Leser-Trélat** = seborrheic keratoses كتير فجأة (GI adenocarcinomas)، و hypertrophic osteoarthropathy = clubbing (adenocarcinoma of the lung).

          **Endocrine**:
          - Hypercalcemia بالـ ==PTHrP== من الـ squamous cell carcinomas (lung، head and neck) وغيرهم، أو بالـ 1,25-(OH)2 vitamin D3 في الـ lymphoma.
          - Cushing (↑ ACTH) و SIADH (↑ ADH) من الـ ==small cell lung cancer==.
        page: 224
        quote: "Abnormal proliferation of skin and bone at distal extremities → clubbing, arthralgia, joint effusions, periostosis of tubular bones Adenocarcinoma of the lung"
      - kind: explain
        title: "الدم والأعصاب"
        text: |-
          **الدم**:
          - Polycythemia (↑ EPO): pheochromocytoma و RCC و HCC و hemangioblastoma و leiomyoma.
          - **Thymoma**: pure red cell aplasia و Good syndrome (hypogammaglobulinemia).
          - Trousseau (migratory thrombophlebitis) و nonbacterial thrombotic endocarditis: adenocarcinomas، خصوصاً ==pancreatic==.

          **الأعصاب**:
          - Anti-NMDA receptor encephalitis: ==ovarian teratoma==.
          - Opsoclonus-myoclonus ("dancing eyes, dancing feet"): neuroblastoma في الأطفال، و SCLC في الكبار.
          - Cerebellar degeneration: anti-Hu (SCLC)، anti-Yo (gynecologic و breast)، anti-Tr (Hodgkin).
          - Lambert-Eaton: presynaptic Ca2+ channels (SCLC). Myasthenia gravis: postsynaptic ACh receptors (thymoma).
        page: 224
        quote: "Antibodies against antigens in Purkinje cells Small cell lung cancer (anti-Hu), gynecologic and breast cancers (anti-Yo), and Hodgkin lymphoma (anti-Tr)"
      - kind: figure
        title: "قبل الـ synapse ولا بعدها"
        svg: |-
