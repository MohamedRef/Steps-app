schema: steps.lesson/v1
lecture: path.L01
lessons:
  - id: path.L01.lesson1
    title: "الخلية تحت الضغط: تتكيّف ولا تتعب ولا تموت"
    hook: "ليه الـ Barrett بيبقى columnar وفي المدخّن بيبقى squamous؟ وإمتى الخلية تعدّي نقطة اللاعودة؟"
    minutes: 9
    pages: [202, 203]
    topics: [cellular-adaptations, cell-injury, ferroptosis]
    goals:
      - "تفرّق بين hypertrophy و hyperplasia و atrophy و metaplasia و dysplasia"
      - "تعرف علامات الـ reversible injury والـ irreversible injury"
      - "تعرف الـ ferroptosis بتحصل إزاي وإيه اللي بيمنعها"
    status: unverified
    steps:
      - kind: explain
        title: "التكيّف قابل للرجوع"
        text: |-
          الخلية لما يجيلها ضغط بتتكيّف، والتكيّف ده ==reversible==.

          - ممكن يبقى **physiologic**: زي الرحم اللي بيكبر في الحمل.
          - وممكن يبقى **pathologic**: زي الـ myocardial hypertrophy بسبب الـ hypertension.

          لو الضغط زاد أوي أو استمر، التكيّف نفسه بيتحوّل لـ **cell injury**. مثال: LV hypertrophy جامد ← myocardial injury ← heart failure.
        page: 202
        quote: "Reversible changes that can be physiologic (eg, uterine enlargement during pregnancy) or pathologic (eg, myocardial hypertrophy 2° to systemic hypertension). If stress is excessive or persistent, adaptations can progress to cell injury"
      - kind: table
        title: "الأربع تكيّفات"
        columns: ["Adaptation", "What changes", "Example"]
        rows:
          - ["Hypertrophy", "↑ cell size (↑ structural proteins and organelles)", "Cardiac hypertrophy"]
          - ["Hyperplasia", "↑ cell number (controlled proliferation)", "Benign prostatic hyperplasia"]
          - ["Atrophy", "↓ size (ubiquitin-proteasome, autophagy) and/or ↓ number (apoptosis)", "Disuse, denervation, ↓ blood supply"]
          - ["Metaplasia", "One cell type replaced by another (stem cell reprogramming)", "Barrett esophagus"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 202
        quote: "Hypertrophy ↑ structural proteins and organelles → ↑ in size of cells. Example: cardiac hypertrophy. Hyperplasia Controlled proliferation of stem cells and differentiated cells → ↑ in number of cells (eg, benign prostatic hyperplasia)."
      - kind: reveal
        prompt: "في الـ Barrett الـ squamous بيتحوّل لـ columnar، وفي مجرى الهوا عند المدخّن الـ columnar بيتحوّل لـ squamous. إزاي نفس الفكرة بتطلع عكس بعض؟"
        answer: "الـ metaplasia بتجيب الخلية اللي ==تستحمل الضغط الجديد==. المريء محتاج يستحمل **الـ acid**، فبيجيب intestinal-type columnar. ومجرى الهوا محتاج **حماية** من الدخان، فبيجيب stratified squamous. ولو الـ insult استمر ← dysplasia ← cancer (Barrett ← esophageal adenocarcinoma)."
        page: 202
        quote: "Esophageal exposure to gastric acid: nonkeratinized stratified squamous → intestinal-type columnar epithelium (acid resistance), called Barrett esophagus. The opposite occurs upon airway exposure to tobacco smoke: pseudostratified ciliated columnar → stratified squamous epithelium (protection)."
      - kind: aside
        tone: exam
        text: "الـ metaplasia ممكن تحصل في الـ connective tissue كمان: **myositis ossificans** = عضم بيتكوّن جوّه العضلة بعد trauma."
        page: 202
        quote: "Metaplasia of connective tissue can also occur (eg, myositis ossificans, the formation of bone within muscle after trauma)."
      - kind: check
        question: "A 55-year-old man who has smoked for 35 years has a bronchial biopsy. The normal lining has been replaced by stratified squamous epithelium without atypia. Which process is this?"
        options:
          - "Metaplasia"
          - "Dysplasia"
          - "Hyperplasia"
          - "Carcinoma in situ"
        answer: 0
        why:
          - "صح: نوع خلية اتبدّل بنوع تاني يستحمل الدخان، والخلايا نفسها من غير atypia."
          - "الـ dysplasia فيها pleomorphism و ↑ N:C ratio، وهنا مفيش atypia."
          - "الـ hyperplasia زيادة في عدد نفس نوع الخلية، مش تبديل نوع بنوع."
          - "الـ carcinoma in situ هي severe dysplasia في كل سُمك الـ epithelium، وهنا مفيش atypia أصلاً."
      - kind: explain
        title: "الـ dysplasia مش تكيّف"
        text: |-
          الـ **dysplasia** نمو epithelial ==مش منظّم== و**precancerous**، والكتاب بيقول إنها مش adaptive response حقيقي.

          - **pleomorphism**: الخلايا مش شبه بعض في الحجم والشكل.
          - الـ tissue فقدت اتجاهها.
          - النواة: ↑ nuclear:cytoplasmic ratio و clumped chromatin.

          الـ mild والـ moderate ممكن ترجع لو السبب اتشال. الـ **severe** غالباً ==irreversible== وبتمشي لـ carcinoma in situ. وعادةً قبلها persistent metaplasia أو pathologic hyperplasia.
        page: 202
        quote: "Disordered, precancerous epithelial cell growth; not considered a true adaptive response. Characterized by loss of uniformity of cell size and shape (pleomorphism); loss of tissue orientation; nuclear changes (eg, ↑ nuclear:cytoplasmic ratio and clumped chromatin)."
      - kind: figure
        title: "من الطبيعي للموت"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="pL01a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="pL01b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="8" y="80" width="70" height="36" rx="6"/>
            <text x="16" y="102" class="t-sm t-b">Normal cells</text>
            <rect class="fg-good" x="110" y="14" width="120" height="70" rx="6"/>
            <text x="118" y="32" class="t-sm t-good">Reversible</text>
            <text x="118" y="50" class="t-sm">Hypertrophy, hyperplasia</text>
            <text x="118" y="66" class="t-sm">Atrophy, metaplasia</text>
            <rect class="fg-acc" x="110" y="110" width="120" height="40" rx="6"/>
            <text x="118" y="128" class="t-sm t-acc">Dysplasia</text>
            <text x="118" y="143" class="t-sm">irritant persists</text>
            <rect class="fg-bad" x="262" y="60" width="92" height="76" rx="6"/>
            <text x="270" y="80" class="t-sm t-bad">Irreversible</text>
            <text x="270" y="98" class="t-sm">necrosis or</text>
            <text x="270" y="114" class="t-sm">apoptosis</text>
            <text x="270" y="130" class="t-sm">or neoplasia</text>
            <path class="fg-arrow-acc" d="M78 92 L 108 56" marker-end="url(#pL01a)"/>
            <path class="fg-arrow-acc" d="M170 84 L 170 108" marker-end="url(#pL01a)"/>
            <path class="fg-arrow-bad" d="M230 50 L 260 80" marker-end="url(#pL01b)"/>
            <path class="fg-arrow-bad" d="M230 130 L 260 112" marker-end="url(#pL01b)"/>
            <text x="12" y="186" class="t-sm t-mut">Severe stress or inability to adapt → irreversible</text>
          </svg>
        caption: "الخلية الطبيعية بتتكيّف (reversible). لو الـ irritant استمر ← dysplasia ← neoplasia، ولو الضغط جامد أو مقدرتش تتكيّف ← irreversible injury ← necrosis أو apoptosis."
        alt: "Flow diagram: normal cells adapt reversibly by hypertrophy, hyperplasia, atrophy or metaplasia; a persistent irritant leads to dysplasia and then neoplasia; severe stress or inability to adapt leads to irreversible injury with necrosis or apoptosis."
        page: 202
        quote: "Severe dysplasia often becomes irreversible and progresses to carcinoma in situ. Usually preceded by persistent metaplasia or pathologic hyperplasia."
      - kind: try
        items: [path.L01.001, path.L01.003, path.L01.005, path.L01.006, path.L01.007]
      - kind: explain
        title: "الـ reversible injury: كله من قلّة الـ ATP"
        text: |-
          ↓ ATP ← الـ Na+/K+-ATPase والـ Ca2+ pumps بتقف ← المية تدخل ← **cellular swelling**، ودي ==أول morphologic manifestation==.

          وبعدها:
          - الـ ribosomes بتنفصل ← ↓ protein synthesis.
          - **blebbing** في الـ plasma membrane.
          - **chromatin clumping** في النواة.
          - **myelin figures** (peroxidized lipids متجمّعة).
          - الوظيفة بتروح بسرعة: الـ myocardium بيبطّل ينقبض بعد 1-2 دقيقة ischemia.
        page: 203
        quote: "cellular swelling (cytosol, mitochondria, endoplasmic reticulum/Golgi), which is the earliest morphologic manifestation"
      - kind: explain
        title: "الـ irreversible injury: الغشا اتكسر"
        text: |-
          - الـ **plasma membrane** بيتكسر ← enzymes زي الـ ==troponin== تخرج برّه، و Ca2+ يدخل ويشغّل degradative enzymes.
          - الـ **mitochondria** بتبوظ ← مفيش electron transport chain ← ↓ ATP أكتر.
          - الـ **lysosomes** بتنفجر ← autolysis.
          - **amorphous densities** جوّه الـ mitochondria.
          - النواة بتتكسّر على 3 مراحل.
        page: 203
        quote: "Breakdown of plasma membrane → cytosolic enzymes (eg, troponin) leak outside of cell, influx of Ca2+ → activation of degradative enzymes"
      - kind: order
        prompt: "رتّب مراحل موت النواة"
        steps:
          - "Pyknosis (condensation)"
          - "Karyorrhexis (fragmentation)"
          - "Karyolysis (dissolution)"
        why: "النواة بتنكمش الأول، وبعدين الـ endonucleases تكسّرها حتت، وفي الآخر بتدوب خالص."
        page: 203
        quote: "Nuclear degradation: pyknosis (nuclear condensation) → karyorrhexis (nuclear fragmentation caused by endonuclease-mediated cleavage) → karyolysis (nuclear dissolution)"
      - kind: reveal
        prompt: "ليه الـ troponin في الدم معناه إن خلايا القلب عدّت مرحلة الـ reversible؟"
        answer: "لأن الـ troponin جوّه الـ cytosol، ومش بيخرج غير لما الـ ==plasma membrane يتكسر==، والكسر ده علامة الـ irreversible injury. الـ swelling والـ blebbing لوحدهم reversible."
        page: 203
        quote: "Irreversible cell injury ▘ Breakdown of plasma membrane → cytosolic enzymes (eg, troponin) leak outside of cell"
      - kind: check
        question: "Minutes after coronary occlusion, which morphologic change appears first in the ischemic myocytes?"
        options:
          - "Cellular swelling"
          - "Karyolysis"
          - "Lysosomal rupture"
          - "Amorphous densities in mitochondria"
          - "Plasma membrane breakdown"
        answer: 0
        why:
          - "صح: ↓ ATP ← الـ pumps تقف ← swelling، ودي أول morphologic manifestation."
          - "الـ karyolysis آخر مرحلة في موت النواة، يعني irreversible ومتأخرة."
          - "انفجار الـ lysosomes ← autolysis، ودي irreversible."
          - "الـ amorphous densities في الـ mitochondria علامة irreversible injury."
          - "كسر الـ plasma membrane هو تعريف الـ irreversible injury، بييجي بعد الـ swelling."
      - kind: explain
        title: "الـ ferroptosis: موت بالحديد"
        text: |-
          **Lipid peroxidation** ← lethal lipid species تتراكم ← موت ==iron-dependent==.

          تحت الميكروسكوب: الـ mitochondria بتنكمش، الـ cristae بتروح، والـ outer membrane بيتقطع.

          ليها دور في **MASLD/MASH** والـ ischemia–reperfusion injury والـ neurodegeneration، وممكن تتمنع بالـ ==iron chelators== (deferiprone، deferoxamine) وبالـ lipophilic antioxidants (ferrostatin، liproxstatin).
        page: 203
        quote: "Lipid peroxidation → accumulation of lethal lipid species → iron-dependent cell death. Results in shrinkage of mitochondria with loss of cristae and mitochondrial outer membrane rupture."
      - kind: try
        items: [path.L01.009, path.L01.010, path.L01.011, path.L01.014, path.L01.015]
    recap:
      - "التكيّف reversible: hypertrophy (حجم)، hyperplasia (عدد)، atrophy (↓)، metaplasia (نوع بنوع)."
      - "الـ dysplasia مش تكيّف، precancerous، والـ severe منها irreversible."
      - "Swelling = أول علامة وهي reversible. كسر الغشا (troponin برّه) = irreversible."
      - "النواة: pyknosis ← karyorrhexis ← karyolysis."
      - "Ferroptosis = lipid peroxidation بالحديد، وبتتمنع بالـ chelators."
    practice: [path.L01.001, path.L01.002, path.L01.003, path.L01.004, path.L01.005, path.L01.006, path.L01.007, path.L01.008, path.L01.009, path.L01.010, path.L01.011, path.L01.012, path.L01.013, path.L01.014, path.L01.015, path.L01.016]
  - id: path.L01.lesson2
    title: "Apoptosis ولا necrosis: موت هادي وموت بفضيحة"
    hook: "ليه الـ follicular lymphoma بيعيش للأبد؟ وليه الـ TB شكلها جبنة والـ pancreatitis شكلها طباشير؟"
    minutes: 9
    pages: [204, 205]
    topics: [apoptosis, necrosis]
    goals:
      - "تعرف الـ 3 طرق للـ apoptosis ومين بيتحكّم في كل واحد"
      - "تفرّق بين الـ apoptosis والـ necrosis في الشكل والـ inflammation"
      - "تربط كل نوع necrosis بسببه وشكله"
    status: unverified
    steps:
      - kind: explain
        title: "الـ apoptosis: موت محتاج طاقة"
        text: |-
          الـ apoptosis موت ==ATP-dependent== مبرمج.

          3 طرق (intrinsic و extrinsic و perforin/granzyme B) كلهم بيشغّلوا الـ **caspases**. والـ caspases بتعمل cell shrinkage و chromatin condensation و blebbing و **apoptotic bodies**، والـ macrophages بتاكل الحتت دي.

          الشكل: cytoplasm **eosinophilic** جداً ونواة basophilic، pyknosis و karyorrhexis. والغشا بيفضل سليم، فـ ==مفيش inflammation== تُذكر.

          وعلامته الحساسة: **DNA laddering** (حتت مضاعفات 180 bp).
        page: 204
        quote: "Cell membrane typically remains intact without significant inflammation (unlike necrosis). DNA laddering (fragments in multiples of 180 bp) is a sensitive indicator of apoptosis."
      - kind: figure
        title: "3 طرق وجلّاد واحد"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="pL01c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="6" y="10" width="110" height="78" rx="6"/>
            <text x="14" y="28" class="t-sm t-acc">Intrinsic</text>
            <text x="14" y="44" class="t-sm">DNA damage, hypoxia</text>
            <text x="14" y="60" class="t-sm">Bax/Bak pores</text>
            <text x="14" y="76" class="t-sm">cytochrome C out</text>
            <rect class="fg-acc" x="125" y="10" width="110" height="78" rx="6"/>
            <text x="133" y="28" class="t-sm t-acc">Extrinsic</text>
            <text x="133" y="44" class="t-sm">FasL → Fas</text>
            <text x="133" y="60" class="t-sm">TNF-α → TNFR</text>
            <rect class="fg-acc" x="244" y="10" width="110" height="78" rx="6"/>
            <text x="252" y="28" class="t-sm t-acc">Perforin</text>
            <text x="252" y="44" class="t-sm">CD8 T cell, NK</text>
            <text x="252" y="60" class="t-sm">pore → granzyme B</text>
            <path class="fg-arrow-acc" d="M60 90 L 150 128" marker-end="url(#pL01c)"/>
            <path class="fg-arrow-acc" d="M180 90 L 180 126" marker-end="url(#pL01c)"/>
            <path class="fg-arrow-acc" d="M300 90 L 210 128" marker-end="url(#pL01c)"/>
            <rect class="fg-bad" x="110" y="130" width="140" height="30" rx="6"/>
            <text x="122" y="150" class="t-sm t-bad">Executioner caspases</text>
            <path class="fg-arrow-acc" d="M180 162 L 180 180" marker-end="url(#pL01c)"/>
            <text x="92" y="200" class="t-sm">Apoptotic bodies → macrophage</text>
            <text x="14" y="104" class="t-sm t-good">Bcl-2 blocks</text>
          </svg>
        caption: "الـ 3 طرق بيوصلوا لنفس الـ executioner caspases، والـ Bcl-2 بيقفل الـ intrinsic pathway عند الـ mitochondria."
        alt: "Three boxes for the intrinsic (Bax/Bak pores release cytochrome C, blocked by Bcl-2), extrinsic (FasL–Fas, TNF-α–TNFR) and perforin/granzyme B pathways converge on the executioner caspases, which produce apoptotic bodies eaten by macrophages."
        page: 204
        quote: "Intrinsic, extrinsic, and perforin/granzyme B pathways → activate caspases (cytosolic proteases)"
      - kind: explain
        title: "الـ intrinsic: معركة الـ Bcl-2"
        text: |-
          بيحصل في تشكيل الأنسجة في الـ embryo، ولما **regulating factor يتشال** (زي ↓ IL-2 بعد ما الـ immune reaction تخلص)، وبعد الـ radiation والـ toxins والـ hypoxia.

          - **Bax و Bak**: ==proapoptotic==. بيعملوا pores في الـ outer mitochondrial membrane ← الـ cytochrome C يخرج ← caspases.
          - **Bcl-2 و Bcl-xL**: ==antiapoptotic==. الـ Bcl-2 بيقفل الـ membrane فالـ cytochrome C ميخرجش.
        page: 204
        quote: "BAX and BAK form pores in the outer mitochondrial membrane → release of cytochrome C from the mitochondrial intermembrane space into the cytoplasm → activation of caspases."
      - kind: aside
        tone: tip
        text: "حيلة الكتاب: **Ba**x و **Ba**k = «**Bad** for survival»، و **Bcl**-2 = «**Be clever, live**»."
        page: 204
        quote: "Bax and Bak are proapoptotic (Bad for survival), while Bcl-2 and Bcl-xL are antiapoptotic (Be clever, live)."
      - kind: reveal
        prompt: "في الـ follicular lymphoma فيه t(14;18). إيه علاقة ده بالـ apoptosis؟"
        answer: "الـ translocation بيعمل **overexpression للـ Bcl-2** ← الـ mitochondria مقفولة ← ↓ caspase activation ← الخلايا ==مبتموتش== ← tumorigenesis. يعني الورم هنا من خلايا مش عارفة تموت، مش من خلايا بتتكاثر بسرعة."
        page: 204
        quote: "Bcl-2 overexpression (eg, follicular lymphoma t[14;18]) → ↓ caspase activation → tumorigenesis."
      - kind: explain
        title: "الـ extrinsic والـ perforin"
        text: |-
          - **Extrinsic (death receptor)**: الـ FasL يمسك الـ Fas (CD95)، أو الـ TNF-α يمسك الـ receptor بتاعه. الـ Fas-FasL ==لازم== للـ negative selection في الـ thymic medulla.
          - **Autoimmune lymphoproliferative syndrome**: Fas-FasL بايظ ← الـ clonal deletion بيفشل ← lymphocytes ضد النفس كتير ← lymphadenopathy و hepatosplenomegaly و autoimmune cytopenias.
          - **Perforin/granzyme B**: الـ cytotoxic T cells والـ NK cells بيطلّعوا granules، الـ perforin يعمل pore والـ granzyme B يدخل منه.
        page: 204
        quote: "Autoimmune lymphoproliferative syndrome—caused by defective Fas-FasL interaction → failure of clonal deletion → ↑ numbers of self-reacting lymphocytes. Presents with lymphadenopathy, hepatosplenomegaly, autoimmune cytopenias."
      - kind: check
        question: "A 6-year-old boy has chronic lymphadenopathy, splenomegaly and autoimmune hemolytic anemia with thrombocytopenia. His lymphocytes do not die when cultured with Fas ligand. Which process failed?"
        options:
          - "Clonal deletion through the death receptor pathway"
          - "Cytochrome C release from mitochondria"
          - "Perforin pore formation by NK cells"
          - "Bcl-2 suppression of caspases"
        answer: 0
        why:
          - "صح: Fas-FasL بايظ ← الـ clonal deletion بيفشل ← autoimmune lymphoproliferative syndrome."
          - "الـ cytochrome C جزء من الـ intrinsic pathway، والخلل هنا في الـ Fas (extrinsic)."
          - "الـ perforin/granzyme B طريق تالت، ومش هو اللي بيعمل الـ clonal deletion."
          - "الـ Bcl-2 بيمنع الـ apoptosis في الـ intrinsic pathway، وده مش اللي بيحصل مع الـ Fas ligand."
      - kind: try
        items: [path.L01.017, path.L01.018, path.L01.019, path.L01.021, path.L01.023]
      - kind: explain
        title: "الـ necrosis: موت بفضيحة"
        text: |-
          **Exogenous injury** ← الـ plasma membrane بيتكسر ← محتويات الخلية تسرّب ← enzymatic degradation و protein denaturation ← ==local inflammatory reaction==.

          ده الفرق الكبير عن الـ apoptosis: هناك الغشا سليم ومفيش inflammation، هنا الغشا مكسور والجسم كله بيعرف.
        page: 205
        quote: "Exogenous injury → plasma membrane damage → intracellular components leak → cell undergoes enzymatic degradation and protein denaturation → local inflammatory reaction (unlike apoptosis)."
      - kind: table
        title: "الـ 6 أنواع"
        columns: ["Type", "Seen in", "Look"]
        rows:
          - ["Coagulative", "Ischemia/infarcts in most tissues (except brain)", "Cell outlines kept, nuclei gone, ↑ eosinophilia"]
          - ["Liquefactive", "Bacterial abscesses, CNS infarcts", "Neutrophil enzymes digest tissue; cystic spaces"]
          - ["Caseous", "TB, systemic fungi, Nocardia", "Granuloma; cheeselike"]
          - ["Fat", "Acute pancreatitis; breast trauma", "Saponification; chalky white, dark blue on H&E"]
          - ["Fibrinoid", "Polyarteritis nodosa; hypertensive emergency, preeclampsia", "Eosinophilic layer in vessel wall"]
          - ["Gangrenous", "Distal extremity, GI tract", "Dry = coagulative; wet = + liquefactive"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 2], [4, 1], [5, 2]]
        page: 205
        quote: "Preserved cellular architecture (cell outlines seen), but nuclei disappear; ↑ cytoplasmic binding of eosin stain"
      - kind: reveal
        prompt: "في الـ fat necrosis بتاعة الـ pancreatitis، ليه المكان بيبان أبيض زي الطباشير؟"
        answer: "الـ pancreatic cells بتطلّع **lipase** ← تكسّر الـ triglycerides ← الـ fatty acids الحرة تمسك ==calcium== ← **saponification** (صابون كالسيوم). والكالسيوم ده نفسه اللي بيدّي اللون الـ dark blue على الـ H&E."
        page: 205
        quote: "Damaged pancreatic cells release lipase, which breaks down triglycerides; liberated fatty acids bind calcium → saponification (chalky- white appearance)"
      - kind: sort
        prompt: "حط كل حالة في نوع الـ necrosis بتاعها"
        bins: ["Coagulative", "Liquefactive", "Caseous", "Fat"]
        cards:
          - { text: "Myocardial infarct", bin: 0 }
          - { text: "Renal infarct", bin: 0 }
          - { text: "Ischemic stroke", bin: 1 }
          - { text: "Bacterial abscess", bin: 1 }
          - { text: "Tuberculosis", bin: 2 }
          - { text: "Histoplasma capsulatum", bin: 2 }
          - { text: "Acute pancreatitis", bin: 3 }
          - { text: "Breast trauma", bin: 3 }
        why: "الـ infarct coagulative في كل مكان ما عدا المخ (liquefactive). الـ TB والـ systemic fungi caseous. والـ pancreatitis والـ trauma للثدي fat."
        page: 205
