  - id: path.L01.lesson3
    title: "الدم مش واصل: ischemia و infarcts و free radicals"
    hook: "ليه الـ hypotension بتموّت zone III في الكبد، وليه الـ infarct في الرئة أحمر وفي الكلية باهت؟"
    minutes: 9
    pages: [206, 207]
    topics: [ischemia, types-of-infarcts, free-radical-injury, ionizing-radiation-toxicity]
    goals:
      - "تعرف أكتر حتة في كل عضو بتتأذي من الـ ischemia وليه"
      - "تفرّق بين الـ red والـ pale infarct"
      - "تعرف الـ free radicals بتيجي منين وبتتشال إزاي"
      - "تعرف مضاعفات الـ ionizing radiation"
    status: unverified
    steps:
      - kind: explain
        title: "الـ ischemia: العرض أقل من الطلب"
        text: |-
          الـ **ischemia** = الدم اللي واصل ==مش كفاية للطلب==. ليها 3 أسباب:

          - ↓ arterial perfusion: زي الـ atherosclerosis.
          - ↓ venous drainage: زي الـ testicular torsion والـ Budd-Chiari syndrome.
          - الـ shock.
        page: 206
        quote: "Inadequate blood supply to meet demand. Mechanisms include ↓ arterial perfusion (eg, atherosclerosis), ↓ venous drainage (eg, testicular torsion, Budd-Chiari syndrome), shock."
      - kind: table
        title: "أضعف حتة في كل عضو"
        columns: ["Organ", "Most vulnerable region"]
        rows:
          - ["Brain", "ACA/MCA/PCA boundary areas"]
          - ["Heart", "Subendocardium of LV"]
          - ["Kidney", "Straight segment of proximal tubule; thick ascending limb (medulla)"]
          - ["Liver", "Area around central vein (zone III)"]
          - ["Colon", "Splenic flexure (Griffith point); rectosigmoid junction (Sudeck point)"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
        page: 206
        quote: "Heart Subendocardium of LV"
      - kind: reveal
        prompt: "الـ splenic flexure والحدود بين الـ ACA والـ MCA بيموتوا الأول لما الضغط يقع. إيه المشترك بينهم؟"
        answer: "دي ==watershed areas==: بتاخد دمّها من **آخر فروع** شريانين، والـ collaterals فيها قليلة. لما الـ perfusion يقل، أطراف الشجرتين هي أول حتة الدم ميوصلهاش."
        page: 206
        quote: "Watershed areas (border zones) receive blood supply from most distal branches of 2 arteries with limited collateral vascularity. These areas are susceptible to ischemia from hypoperfusion."
      - kind: aside
        tone: exam
        text: "أكتر neurons بتتأذي من الـ hypoxia: الـ **Purkinje cells** في الـ cerebellum، والـ **pyramidal cells** في الـ hippocampus والـ neocortex (layers 3، 5، 6)."
        page: 206
        quote: "Neurons most vulnerable to hypoxic-ischemic insults include Purkinje cells of the cerebellum and pyramidal cells of the hippocampus and neocortex (layers 3, 5, 6)."
      - kind: check
        question: "A 68-year-old man has 6 hours of septic shock with a mean arterial pressure of 50 mm Hg. Two days later his transaminases are in the thousands. Where in the hepatic lobule is necrosis most marked?"
        options:
          - "Around the central vein (zone III)"
          - "Around the portal triad (zone I)"
          - "Midzone (zone II)"
          - "Along the bile ducts"
        answer: 0
        why:
          - "صح: الحتة اللي حوالين الـ central vein (zone III) أبعد حتة عن الـ oxygen، فهي الأضعف في الـ ischemia."
          - "الـ zone I جنب الـ portal triad وبتاخد أحسن oxygen، فهي آخر حتة تتأذي."
          - "الـ zone II في النص، أقل حساسية من zone III."
          - "الـ bile ducts مش هي الحتة اللي الكتاب بيقول عليها في الـ ischemia."
      - kind: figure
        title: "أحمر ولا باهت؟"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-bad" x="10" y="12" width="160" height="150" rx="8"/>
            <text x="22" y="34" class="t-b t-bad">Red infarct</text>
            <text x="22" y="56" class="t-sm">Dual blood supply</text>
            <text x="22" y="72" class="t-sm">Liver, lung,</text>
            <text x="22" y="88" class="t-sm">intestine, testes</text>
            <text x="22" y="110" class="t-sm">Venous occlusion</text>
            <text x="22" y="132" class="t-sm">Reperfusion</text>
            <text x="22" y="148" class="t-sm t-mut">(after angioplasty)</text>
            <rect class="fg-box" x="190" y="12" width="160" height="150" rx="8"/>
            <text x="202" y="34" class="t-b">Pale infarct</text>
            <text x="202" y="56" class="t-sm">Single end-artery</text>
            <text x="202" y="72" class="t-sm">supply</text>
            <text x="202" y="96" class="t-sm">Heart, kidney</text>
            <text x="202" y="120" class="t-sm">Solid organ</text>
          </svg>
        caption: "الـ red infarct لما الدم يقدر يوصل تاني للحتة الميتة: dual supply، أو venous occlusion، أو reperfusion. الـ pale في الأعضاء الصلبة اللي ليها end-artery واحد."
        alt: "Two panels: red infarct with dual blood supply (liver, lung, intestine, testes), venous occlusion or reperfusion after angioplasty; pale infarct in solid organs with a single end-arterial supply such as heart and kidney."
        page: 206
        quote: "Pale infarct Occurs in solid organs with a single (end- arterial) blood supply (eg, heart B , kidney)."
      - kind: explain
        title: "الـ reperfusion بيأذي برضه"
        text: |-
          الـ **red infarct** بيحصل في الـ venous occlusion، وفي الأعضاء اللي ليها أكتر من مصدر دم (liver و lung و intestine و testes)، ومع الـ ==reperfusion== زي بعد الـ angioplasty.

          والـ reperfusion injury سببها الـ **free radicals**: الـ oxygen رجع لنسيج متأذي ← radicals.
        page: 206
        quote: "Red infarct Occurs in venous occlusion and tissues with multiple blood supplies (eg, liver, lung A , intestine, testes), and with reperfusion (eg, after angioplasty). Reperfusion injury is due to damage by free radicals."
      - kind: try
        items: [path.L01.030, path.L01.032, path.L01.033, path.L01.035, path.L01.036]
      - kind: explain
        title: "الـ free radicals: بييجوا منين وبيمشوا إزاي"
        text: |-
          بيأذوا بـ ==lipid peroxidation== للغشا، وتعديل الـ proteins، وكسر الـ DNA.

          **بييجوا من**: radiation، الـ phase I drug metabolism، الـ redox reactions، الـ nitric oxide، الـ transition metals (iron و copper بالـ **Fenton reaction**)، والـ oxidative burst بتاع الـ neutrophils والـ macrophages.

          **بيمشوا بـ**: scavenging enzymes (catalase و superoxide dismutase و glutathione peroxidase)، spontaneous decay، antioxidants (vitamins A و C و E)، والـ metal carriers (transferrin و ceruloplasmin).
        page: 206
        quote: "Free radicals can be eliminated by scavenging enzymes (eg, catalase, superoxide dismutase, glutathione peroxidase), spontaneous decay, antioxidants (eg, vitamins A, C, E), and certain metal carrier proteins (eg, transferrin, ceruloplasmin)."
      - kind: reveal
        prompt: "ليه الـ transferrin والـ ceruloplasmin محسوبين antioxidants، والـ hemochromatosis والـ Wilson بيتحسبوا free radical diseases؟"
        answer: "الحديد والنحاس الحرّين بيعملوا free radicals بالـ ==Fenton reaction==. الـ transferrin بيشيل الحديد والـ ceruloplasmin بيشيل النحاس، فبيمنعوهم يتفاعلوا. في الـ hemochromatosis والـ Wilson المعدن بيتراكم ← radicals ← أذى."
        page: 206
        quote: "transition metals (eg, iron, copper; form free radicals via Fenton reaction)"
      - kind: aside
        tone: exam
        text: "الـ **CCl4** بيتحوّل بالـ cytochrome P-450 لـ CCl3 free radical ← cell injury ← ↓ apolipoprotein synthesis ← ==fatty liver==، ومعاها centrilobular necrosis. والـ acetaminophen overdose ← hepatotoxicity."
        page: 206
        quote: "carbon tetrachloride (converted by cytochrome P-450 into CCl3 free radical → fatty liver [cell injury → ↓ apolipoprotein synthesis → fatty change], centrilobular necrosis)"
      - kind: check
        question: "A preterm infant born at 26 weeks received high-concentration oxygen for weeks. At 3 months, screening shows abnormal retinal vascularization. Which mechanism best explains the injury?"
        options:
          - "Free radical damage from oxygen toxicity"
          - "Watershed ischemia of the retina"
          - "Immune complex deposition in retinal vessels"
          - "Ferroptosis from iron overload"
        answer: 0
        why:
          - "صح: retinopathy of prematurity مثال الكتاب على oxygen toxicity، يعني free radicals."
          - "الـ watershed ischemia سببها قلّة perfusion، والطفل هنا أخد oxygen زيادة مش أقل."
          - "الـ immune complexes بتعمل fibrinoid necrosis في الـ vasculitis، مش في الـ retinopathy of prematurity."
          - "الـ ferroptosis بتحتاج حديد، والسبب هنا الـ oxygen."
      - kind: explain
        title: "الـ ionizing radiation"
        text: |-
          بتكسر الـ DNA (double strand breaks) ==مباشرة==، وبشكل غير مباشر بالـ free radicals.

          - مع الجرعات الكبيرة: inflammation و fibrosis في المكان، و neoplasia (leukemia، thyroid cancer).
          - **Acute radiation syndrome** بعد جرعة كبيرة للجسم كله: nausea و vomiting و diarrhea و hair loss و erythema و cytopenias و headache و altered mental status.
          - أكتر حاجة بتتأذي: ==stem cells== الأنسجة اللي بتتجدد بسرعة (skin و bone marrow و GI و gonads).
          - الـ radiotherapy بتضرب الـ cancer أكتر لأن الـ DNA repair فيه بايظ وبيتكاثر بسرعة.
          - **Radiation dermatitis**: الـ acute = erythema و peeling و pain و pruritus. الـ chronic = atrophy و pigmentation و telangiectasia و fibrosis (↑ TGF-β).
        page: 207
        quote: "Stem cells of rapidly regenerating tissues (eg, skin, bone marrow, GI tract, gonads) are the most susceptible to radiation injury."
      - kind: try
        items: [path.L01.037, path.L01.038, path.L01.039, path.L01.042, path.L01.043]
    recap:
      - "Watershed = آخر فروع شريانين. القلب: subendocardium. الكبد: zone III. الكلية: الـ straight proximal tubule والـ TAL."
      - "Red infarct = dual supply أو venous أو reperfusion. Pale = end-artery (قلب، كلية)."
      - "Free radicals: من radiation و Fenton و oxidative burst. بتمشي بالـ catalase والـ SOD والـ glutathione peroxidase والـ vitamins A و C و E."
      - "Radiation بتضرب الـ stem cells في skin و marrow و GI و gonads."
