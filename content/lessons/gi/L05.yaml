    steps:
      - kind: explain
        title: "الـ octreotide"
        text: |-
          ==somatostatin analog== طويل المفعول: بيقفل هرمونات كتير بتوسّع أوعية البطن (splanchnic).
          الاستخدام: **acute variceal bleeds** و acromegaly و VIPoma و carcinoid tumors.
          العيوب: nausea و cramps و steatorrhea، و**حصوة مرارة** لأنه بيقفل الـ CCK فالمرارة مش بتفضى.
        page: 407
        quote: "Octreotide MeCHANISM Long-acting somatostatin analog; inhibits secretion of various splanchnic vasodilatory hormones. CLINICAL USe Acute variceal bleeds, acromegaly, VIPoma, carcinoid tumors. ADVeRSe eFFeCTS Nausea, cramps, steatorrhea. ↑ risk of cholelithiasis due to CCK inhibition."
      - kind: explain
        title: "الـ sulfasalazine والـ loperamide"
        text: |-
          **Sulfasalazine** = sulfapyridine (antibacterial) + 5-ASA (anti-inflammatory)، و==بكتيريا القولون== هي اللي بتفكّه وتشغّله. للـ UC والـ Crohn (الجزء اللي في الـ colon). العيوب: malaise و nausea و sulfonamide toxicity و **oligospermia reversible**.

          **Loperamide و diphenoxylate**: agonists على الـ μ-opioid receptors ← الأمعاء تهدى. مش بيدخلوا المخ كتير، فاحتمال الإدمان قليل. للإسهال، وعيبهم الإمساك.
        page: 407
        quote: "Sulfasalazine MeCHANISM A combination of sulfapyridine (antibacterial) and 5-aminosalicylic acid (anti-inflammatory). Activated by colonic bacteria. CLINICAL USe Ulcerative colitis, Crohn disease (colitis component). ADVeRSe eFFeCTS Malaise, nausea, sulfonamide toxicity, reversible oligospermia. Loperamide, diphenoxylate MeCHANISM Agonists at μ-opioid receptors → ↓ gut motility. Poor CNS penetration (low addictive potential). CLINICAL USe Diarrhea. ADVeRSe eFFeCTS Constipation, nausea."
      - kind: reveal
        prompt: "ليه الـ sulfasalazine بيشتغل في الـ colon بالذات ومش في المعدة؟"
        answer: "لأنه بيوصل سليم لحد ما ==colonic bacteria== تكسّر الرابط بين الـ sulfapyridine والـ 5-ASA، فالـ 5-ASA يتحرر في القولون نفسه، مكان الالتهاب في الـ UC."
        page: 407
        quote: "Activated by colonic bacteria."
      - kind: table
        title: "الـ antiemetics: 3 receptors"
        columns: [Drugs, Receptor, Adverse effects]
        rows:
          - ["Ondansetron, granisetron", 5-HT3 antagonist, "Headache, constipation, QT prolongation, serotonin syndrome"]
          - ["Prochlorperazine, metoclopramide", D2 antagonist, "Extrapyramidal symptoms, hyperprolactinemia, restlessness, depression"]
          - ["Aprepitant, fosaprepitant", NK1 (substance P) antagonist, "Fatigue, GI distress"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1]]
        page: 407
        quote: "Antiemetics All act centrally in chemoreceptor trigger zone of area postrema. DRUG MeCHANISM CLINICAL USe ADVeRSe eFFeCTS Ondansetron, granisetron 5-HT3 -receptor antagonists Also act peripherally (↓ vagal stimulation) Nausea and vomiting after chemotherapy, radiotherapy, or surgery Headache, constipation, QT interval prolongation, serotonin syndrome Prochlorperazine, metoclopramide D2 -receptor antagonists Metoclopramide also causes ↑ gastric emptying and ↑ LES tone Nausea and vomiting Metoclopramide is also used in gastroparesis (eg, diabetic), persistent GERD Extrapyramidal symptoms, hyperprolactinemia, anxiety, drowsiness, restlessness, depression, GI distress Aprepitant, fosaprepitant NK1 (neurokinin-1) receptor antagonists NK1 receptor = substance P receptor Chemotherapy-induced nausea and vomiting Fatigue, GI distress"
      - kind: aside
        tone: exam
        text: "كلهم بيشتغلوا في الـ ==chemoreceptor trigger zone== في الـ area postrema. الـ metoclopramide زيادة كمان بيسرّع تفريغ المعدة ويشد الـ LES، فبيتسأل عليه في الـ **diabetic gastroparesis**، والسؤال الجاي بيكون عن الـ galactorrhea أو الحركات اللاإرادية."
        page: 407
        quote: "Metoclopramide is also used in gastroparesis (eg, diabetic), persistent GERD"
      - kind: check
        question: "A patient on a drug for diabetic gastroparesis develops galactorrhea. Which receptor does the drug block?"
        options:
          - D2
          - 5-HT3
          - NK1
          - μ-opioid
        answer: 0
        why:
          - "صح: metoclopramide = D2 antagonist، فالـ prolactin يعلى."
          - "الـ 5-HT3 (ondansetron): صداع وإمساك و QT."
          - "الـ NK1 (aprepitant): تعب و GI distress."
          - "الـ μ-opioid agonist (loperamide) بيبطّأ الأمعاء، وده عكس المطلوب."
        page: 407
        quote: "Extrapyramidal symptoms, hyperprolactinemia, anxiety, drowsiness, restlessness, depression, GI distress"
      - kind: explain
        title: "الـ orlistat"
        text: |-
          بيقفل ==gastric and pancreatic lipase== ← الدهون مش بتتكسر ولا تتمتص. بيتاخد مع الأكل اللي فيه دهون، للتخسيس.
          العيوب: steatorrhea و flatulence و urgency، و↓ امتصاص الفيتامينات اللي بتدوب في الدهون (A و D و E و K).
        page: 407
        quote: "Orlistat MeCHANISM Inhibits gastric and pancreatic lipase → ↓ breakdown and absorption of dietary fats. Taken with fat-containing meals. CLINICAL USe Weight loss. ADVeRSe eFFeCTS Abdominal pain, flatulence, bowel urgency/frequent bowel movements, steatorrhea; ↓ absorption of fat-soluble vitamins."
      - kind: figure
        title: "الـ laxatives: إزاي كل واحد بيدخّل مية"
        svg: |-
          <svg viewBox="0 0 360 206" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="20" y="70" width="320" height="60" rx="30"/>
            <text x="180" y="105" class="t-sm t-b" text-anchor="middle">Colon lumen: water in → softer stool</text>
            <text x="20" y="30" class="t-sm t-b">Pull water in</text>
            <text x="20" y="48" class="t-sm t-mut">bulk (psyllium), osmotic (lactulose, PEG)</text>
            <text x="20" y="160" class="t-sm t-b">Secrete fluid</text>
            <text x="20" y="178" class="t-sm t-mut">lubiprostone (Cl-), linaclotide (cGMP)</text>
            <text x="200" y="160" class="t-sm t-b">Move it</text>
            <text x="200" y="178" class="t-sm t-mut">senna, bisacodyl,</text>
            <text x="200" y="194" class="t-sm t-mut">prucalopride</text>
            <text x="200" y="30" class="t-sm t-b">Absorb less Na+</text>
            <text x="200" y="48" class="t-sm t-mut">tenapanor (NHE3)</text>
          </svg>
        caption: "4 طرق: تشد مية للـ lumen (bulk و osmotic)، أو تخلي الخلايا تفرز سوائل (lubiprostone و linaclotide)، أو تقلل امتصاص الصوديوم (tenapanor)، أو تحرّك الأمعاء (stimulant و prucalopride). والـ docusate بيخلي المية تدخل البراز نفسه."
        alt: "The colon lumen with four groups of laxatives around it: drugs that pull water in (bulk-forming, osmotic), drugs that make the lining secrete fluid (lubiprostone, linaclotide), a drug that reduces sodium absorption (tenapanor) and drugs that move the bowel (senna, bisacodyl, prucalopride)."
        page: 408
        quote: "Bulk-forming laxatives Methylcellulose, psyllium Soluble fibers that draw water into gut lumen"
      - kind: reveal
        prompt: "الـ lactulose ملين، طب ليه بنديه لمريض cirrhosis مخه مش مظبوط؟"
        answer: "بكتيريا القولون بتكسّر الـ lactulose لـ lactic acid و acetic acid. الحمض ده بيحوّل الـ NH3 لـ ==NH4+== اللي مش بيتمتص، فيفضل محبوس في القولون ويطلع مع البراز. أمونيا أقل في الدم = encephalopathy أحسن، وكمان الإمساك (اللي بيطلّعها) بيتعالج."
        page: 408
        quote: "gut microbiota degrades lactulose into metabolites (lactic acid, acetic acid) that promote nitrogen excretion as NH + 4 by trapping it in colon"
      - kind: match
        prompt: "وصّل كل laxative بالـ mechanism بتاعه"
        pairs:
