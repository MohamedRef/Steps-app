  - id: gi.L05.lesson2
    title: "أدوية الحموضة: كل واحد وعيبه"
    hook: "الـ Step 1 مش بيسألك الدوا بيعمل إيه بس، بيسألك هيعمل إيه في المريض بعد شهور"
    minutes: 9
    pages: [406, 406]
    topics: [h2-blockers, proton-pump-inhibitors, antacids, bismuth-sucralfate, misoprostol]
    goals:
      - "تعرف عيوب الـ cimetidine اللي بتميّزه عن باقي الـ H2 blockers"
      - "تحفظ مضاعفات الـ PPI على المدى الطويل"
      - "تفرق بين الـ antacids التلاتة بالأعراض"
      - "تعرف شروط الـ sucralfate والـ misoprostol"
    status: unverified
    steps:
      - kind: explain
        title: "الـ H2 blockers"
        text: |-
          cimetidine و famotidine و nizatidine: بيقفلوا الـ H2 receptor ==reversibly== ← H+ أقل.
          الكتاب بيقولك خدهم **قبل الأكل** ("Take H2 blockers before you dine"، و"table for 2").
          الاستخدام: peptic ulcer و gastritis و reflux **خفيف**.
        page: 406
        quote: "-blockers Cimetidine, famotidine, nizatidine. Take H blockers before you dine. Think “table for 2” to remember H . MeCHANISM Reversible block of histamine H2 -receptors → ↓ H+ secretion by parietal cells. CLINICAL USe Peptic ulcer, gastritis, mild esophageal reflux."
      - kind: explain
        title: "الـ cimetidine: الولد الشقي"
        text: |-
          هو بس اللي عنده المشاكل دي، والباقيين تقريباً نضاف:
          - ==potent P-450 inhibitor== ← تداخلات كتير (warfarin مثلاً)
          - **antiandrogenic**: prolactin و gynecomastia و impotence و ↓ libido في الرجالة
          - بيعدي الـ blood-brain barrier (confusion و dizziness و headache) وبيعدي الـ placenta
          - بيقلل الـ renal excretion بتاع الـ creatinine
        page: 406
        quote: "Cimetidine is a potent inhibitor of cytochrome P-450 (multiple drug interactions); it also has antiandrogenic effects (prolactin release, gynecomastia, impotence, ↓ libido in males); can cross blood-brain barrier (confusion, dizziness, headaches) and placenta. Cimetidine ↓ renal excretion of creatinine. Other H2 blockers are relatively free of these effects."
      - kind: check
        question: "A man on warfarin starts an over-the-counter heartburn drug; his INR rises and he develops gynecomastia. Which drug?"
        options:
          - Cimetidine
          - Famotidine
          - Omeprazole
          - Calcium carbonate
        answer: 0
        why:
          - "صح: P-450 inhibitor (فالـ warfarin يعلى) و antiandrogenic (gynecomastia)."
          - "الـ famotidine H2 blocker بس relatively free من العيوب دي."
          - "الـ omeprazole مش بيعمل gynecomastia."
          - "الـ calcium carbonate بيعمل hypercalcemia و chelation، مش ده."
        page: 406
        quote: "Other H2 blockers are relatively free of these effects."
      - kind: explain
        title: "الـ PPIs ومشاكل المدى الطويل"
        text: |-
          omeprazole وإخواته: بيقفلوا الـ H+/K+-ATPase **irreversibly**.
          الاستخدام: ulcer و gastritis و reflux و **Zollinger-Ellison** وعلاج الـ **H pylori** و stress ulcer prophylaxis.

          العيوب (الحمض كان بيحمي وبيساعد الامتصاص):
          - ↑ ==C difficile== و pneumonia
          - acute interstitial nephritis
          - B12 malabsorption
          - ↓ Mg2+ و ↓ امتصاص Ca2+ ← كسور في كبار السن
        page: 406
        quote: "Proton pump inhibitors Omeprazole, lansoprazole, esomeprazole, pantoprazole, dexlansoprazole. MeCHANISM Irreversibly inhibit H+ /K+ -ATPase in stomach parietal cells. CLINICAL USe Peptic ulcer, gastritis, esophageal reflux, Zollinger-Ellison syndrome, component of therapy for H pylori, stress ulcer prophylaxis. ADVeRSe eFFeCTS ↑ risk of C difficile infection, pneumonia, acute interstitial nephritis. Vitamin B12 malabsorption; ↓ serum Mg2+ /Ca2+ absorption (potentially leading to increased fracture risk in older adults)."
      - kind: reveal
        prompt: "ست كبيرة على omeprazole من سنين، جت بكسر في الفخذ. إيه العلاقة؟"
        answer: "الـ PPI بيقلل ==Mg2+ في الدم== وبيقلل امتصاص الـ Ca2+، فالعضم يضعف مع الوقت، والكتاب بيربطه بزيادة خطر الكسور في كبار السن."
        page: 406
        quote: "↓ serum Mg2+ /Ca2+ absorption (potentially leading to increased fracture risk in older adults)."
      - kind: table
        title: "الـ antacids التلاتة"
        columns: [Antacid, Adverse effects, Hook]
        rows:
          - [Aluminum hydroxide, "Constipation, hypophosphatemia, osteodystrophy, proximal muscle weakness, seizures", "CHOPS; aluminimum amount of feces"]
          - [Calcium carbonate, "Hypercalcemia (milk-alkali), rebound acid ↑, chelates tetracycline", "Calcium chelates"]
          - [Magnesium hydroxide, "Diarrhea, hyporeflexia, hypotension, cardiac arrest", "Must go 2 the bathroom"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 406
        quote: "Aluminum hydroxide Constipation, Hypophosphatemia, Osteodystrophy, Proximal muscle weakness, Seizures Aluminimum amount of feces CHOPS Calcium carbonate Hypercalcemia (milk-alkali syndrome), rebound acid ↑ Can chelate and ↓ effectiveness of other drugs (eg, tetracycline) Magnesium hydroxide Diarrhea, hyporeflexia, hypotension, cardiac arrest Mg2+ = Must go 2 the bathroom"
      - kind: aside
        tone: tip
        text: "الـ aluminum بيمسك والـ magnesium بيسهّل، عشان كده بيتخلطوا مع بعض في الأقراص. وكل الـ antacids ممكن تعمل ==hypokalemia==، وممكن تغيّر امتصاص أدوية تانية لأنها بتغيّر الـ pH."
        page: 406
        quote: "Can affect absorption, bioavailability, or urinary excretion of other drugs by altering gastric and urinary pH or by delaying gastric emptying. All can cause hypokalemia."
      - kind: explain
        title: "اللي بيغطوا القرحة: bismuth و sucralfate"
        text: |-
          بيلزقوا في ==قاع القرحة== ويحموها، والـ HCO3- يرجع يعمل الـ pH gradient في الـ mucus.
          الـ **sucralfate محتاج حمض** عشان يشتغل، فمش بيتاخد مع PPI أو H2 blocker.
          الـ **bismuth** كمان للـ travelers' diarrhea وجزء من الـ quadruple therapy للـ H pylori.
        page: 406
        quote: "Bind to ulcer base, providing physical protection and allowing HCO – 3 secretion to reestablish pH gradient in the mucous layer. Sucralfate requires acidic environment, not given with PPIs/H2 blockers. CLINICAL USe ↑ ulcer healing, travelers’ diarrhea (bismuth). Bismuth also used in quadruple therapy for H pylori."
      - kind: explain
        title: "الـ misoprostol"
        text: |-
          PGE1 analog: ↑ الـ mucous barrier و ↓ الحمض.
          الاستخدام: ==منع قرحة الـ NSAIDs== (الـ NSAIDs بتقفل الـ prostaglandins)، و off-label لتحضير عنق الرحم في الولادة.
          العيب: diarrhea. وممنوع لأي حد ممكن يحمل لأنه **abortifacient**.
        page: 406
        quote: "PGE1 analog. ↑ production and secretion of gastric mucous barrier, ↓ acid production. CLINICAL USe Prevention of NSAID-induced peptic ulcers (NSAIDs block PGE1 production). Also used off-label for induction of labor (ripens cervix). ADVeRSe eFFeCTS Diarrhea. Contraindicated in patients of childbearing potential (abortifacient)."
      - kind: figure
        title: "كل دوا بيحمي القرحة من أنهي طبقة"
        svg: |-
          <svg viewBox="0 0 360 232" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="gi5ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-thin" x="6" y="6" width="348" height="44" rx="6"/>
            <text x="14" y="33" class="t-sm t-b">Lumen: H+</text>
            <text x="346" y="33" class="t-sm t-acc" text-anchor="end">Antacids neutralize H+</text>
            <rect class="fg-good" x="6" y="54" width="134" height="30" rx="4"/>
            <rect class="fg-good" x="210" y="54" width="144" height="30" rx="4"/>
            <text x="14" y="73" class="t-sm">Mucus + HCO3–</text>
            <text x="346" y="73" class="t-sm t-acc" text-anchor="end">Misoprostol (PGE1): ↑ mucus</text>
            <path class="fg-box" d="M6,88 L140,88 L155,124 L195,124 L210,88 L354,88 L354,140 L6,140 Z"/>
            <text x="14" y="118" class="t-sm t-mut">Epithelium</text>
            <text x="175" y="104" class="t-sm t-bad t-b" text-anchor="middle">Ulcer</text>
            <rect class="fg-dot-acc" x="156" y="116" width="38" height="7" rx="3"/>
            <path class="fg-arrow-acc" d="M222,116 L194,118" marker-end="url(#gi5ma)"/>
            <text x="226" y="112" class="t-sm t-acc">Sucralfate, bismuth:</text>
            <text x="226" y="127" class="t-sm t-acc">bind the ulcer base</text>
            <rect class="fg-acc" x="6" y="150" width="348" height="56" rx="8"/>
            <path class="fg-arrow-acc" d="M120,150 L120,42" marker-end="url(#gi5ma)"/>
            <text x="14" y="167" class="t-sm t-b">Parietal cell: H+ secretion</text>
            <text x="14" y="183" class="t-sm">H2 blockers: block the H2 receptor (reversible)</text>
            <text x="14" y="199" class="t-sm">PPIs: block the H+/K+ ATPase (irreversible)</text>
            <text x="180" y="224" class="t-sm t-bad" text-anchor="middle">Sucralfate needs acid: not given with PPIs, H2 blockers</text>
          </svg>
        caption: "من فوق لتحت: الـ antacids بتعادل الـ H+ اللي في التجويف، والـ misoprostol (PGE1 analog) بيزوّد طبقة الـ mucus وبيقلل الحمض، والـ sucralfate والـ bismuth بيلزقوا في قاع القرحة نفسها ويسيبوا الـ HCO3- يرجّع الـ pH gradient. والـ H2 blockers والـ PPIs بيقفلوا الحمض من مصدره في الـ parietal cell. وعشان الـ sucralfate محتاج حمض يشتغل، مش بيتاخد مع الـ PPI أو الـ H2 blocker."
        alt: "Cross-section of the stomach wall with an ulcer: the lumen holds H+, which antacids neutralize; the mucus layer with HCO3- is increased by misoprostol (PGE1); sucralfate and bismuth bind the ulcer base in the epithelium; below, the parietal cell secretes H+ upward into the lumen, blocked reversibly at the H2 receptor by H2 blockers and irreversibly at the H+/K+ ATPase by PPIs. Footnote: sucralfate needs acid, so it is not given with PPIs or H2 blockers."
        page: 406
        quote: "Bind to ulcer base, providing physical protection and allowing HCO – 3 secretion to reestablish pH gradient in the mucous layer. Sucralfate requires acidic environment, not given with PPIs/H2 blockers."
      - kind: check
        question: "Which drug should not be combined with a PPI because it needs acid to work?"
        options:
          - Sucralfate
          - Bismuth
          - Misoprostol
          - Magnesium hydroxide
        answer: 0
        why:
          - "صح: الـ sucralfate requires acidic environment."
          - "الـ bismuth بيتاخد مع الـ PPI عادي في الـ quadruple therapy."
          - "الـ misoprostol مش محتاج حمض."
          - "الـ magnesium hydroxide antacid، مش ليه الشرط ده."
        page: 406
        quote: "Sucralfate requires acidic environment, not given with PPIs/H2 blockers."
      - kind: try
        items: [gi.L05.017, gi.L05.023, gi.L05.027, gi.L05.034, gi.L05.037]
    recap:
      - "Cimetidine: P-450 inhibitor، antiandrogenic، بيعدي المخ والـ placenta؛ باقي الـ H2 blockers نضاف."
      - "PPI: C difficile و pneumonia و AIN و B12 و ↓ Mg2+/Ca2+ (كسور)."
      - "Aluminum = CHOPS (إمساك)؛ calcium = milk-alkali و chelation؛ magnesium = إسهال و hyporeflexia."
      - "Sucralfate محتاج حمض؛ misoprostol لقرحة الـ NSAIDs وممنوع في الحمل."
