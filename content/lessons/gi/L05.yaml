          - [Docusate, Surfactant that ↓ stool surface tension]
        why: "كلهم آخرهم مية أكتر في البراز أو حركة أكتر، والفرق في الباب اللي بيفتحوه، وعيبهم المشترك الإسهال."
        page: 408
        quote: "Lubiprostone Chloride channel activator → ↑ intestinal fluid secretion"
