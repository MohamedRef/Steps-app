lecture: gi.L05
lessons:
  - id: gi.L05.lesson1
    title: "سرطان رأس البنكرياس، والخلية اللي بتعمل الحمض"
    hook: "ورم واحد بيتسأل عليه بعلامتين باسم أصحابهم، وخلية واحدة كل أدوية الحموضة بتضرب فيها من ناحية"
    minutes: 8
    pages: [405, 406]
    topics: [pancreatic-adenocarcinoma, acid-suppression-therapy]
    goals:
      - "تعرف الـ pancreatic adenocarcinoma: مكانه وعلامته وعوامل خطورته"
      - "تفرق بين Trousseau و Courvoisier"
      - "ترسم الـ parietal cell وتعرف كل دوا بيقفل أنهي باب"
    status: unverified
    steps:
      - kind: explain
        title: "ورم شرس من القنوات"
        text: |-
          الـ **pancreatic adenocarcinoma** بيطلع من ==pancreatic ducts==، وشرس جداً: غالباً بيكون منتشر وقت التشخيص، ومتوسط العمر بعده حوالي **سنة**.

          أغلبه في الـ **head**، وعشان الـ head لازق في الـ common bile duct، بيقفلها ← **obstructive jaundice**.
          الـ tumor marker: ==CA 19-9== (والـ CEA كمان بس أقل تخصص). وأشهر طفرة: **KRAS**-activating mutation.
        page: 405
        quote: "Very aggressive tumor arising from pancreatic ducts (disorganized glandular structure with cellular infiltration A ); often metastatic at presentation, with average survival ~1 year after diagnosis. Tumors more common in pancreatic head B (lead to obstructive jaundice). Associated with CA 19-9 tumor marker (also CEA, less specific). Most common genomic abnormality is KRAS- activating mutation."
      - kind: explain
        title: "مين معرّض؟"
        text: |-
          4 عوامل خطورة، وأولهم وأقواهم:
          1. ==Tobacco smoking== (strongest risk factor)
          2. **Chronic pancreatitis**، خصوصاً لو بقاله أكتر من 20 سنة
          3. **Diabetes**
          4. السن **فوق 50**
        page: 405
        quote: "Tobacco smoking (strongest risk factor) ▘ Chronic pancreatitis (especially >20 years) ▘ Diabetes ▘ Age >50 years"
      - kind: reveal
        prompt: "مريض صفرا من غير وجع، والمرارة محسوسة ومش بتوجع. ليه ده بيبعدك عن الحصوة وبيقربك من الورم؟"
        answer: "ده الـ ==Courvoisier sign==. الورم بيقفل الـ common bile duct بالراحة، فالصفرا ترجع وتنفخ مرارة **سليمة** فتتحس. الحصوة القديمة بتعمل التهابات متكررة وتليف، فالمرارة بتنكمش ومش بتعرف تتنفخ. يعني palpable nontender gallbladder + jaundice = فكّر في ورم رأس البنكرياس."
        page: 405
        quote: "Obstructive jaundice with palpable, nontender gallbladder (Courvoisier sign)"
      - kind: explain
        title: "الصورة اللي بيجي بيها"
        text: |-
          - وجع في البطن ==بيروح للضهر==
          - نزول وزن (malabsorption و anorexia)
          - **Migratory thrombophlebitis**: احمرار ووجع في الأطراف بيتنقل من مكان لمكان = **Trousseau syndrome**
          - **Obstructive jaundice** مع مرارة محسوسة مش بتوجع = **Courvoisier sign**
        page: 405
        quote: "Migratory thrombophlebitis—redness and tenderness on palpation of extremities (Trousseau syndrome)"
      - kind: check
        question: "A 70-year-old smoker has a new tender red cord in his arm, two weeks after one in his leg, plus weight loss and back pain. Which name fits the vein finding?"
        options:
          - Trousseau syndrome
          - Courvoisier sign
          - Virchow node
          - Cullen sign
        answer: 0
        why:
          - "صح: migratory thrombophlebitis مع ورم البنكرياس = Trousseau."
          - "الـ Courvoisier هو المرارة المحسوسة مع الصفرا، مش الوريد."
          - "الـ Virchow node غدة فوق الترقوة الشمال (ورم المعدة غالباً)."
          - "الـ Cullen sign كدمة حوالين السرة في الـ hemorrhagic pancreatitis."
        page: 405
        quote: "Migratory thrombophlebitis—redness and tenderness on palpation of extremities (Trousseau syndrome)"
      - kind: figure
        title: "الـ parietal cell: 3 أبواب ومضخة واحدة"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="gi5a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="110" y="40" width="150" height="150" rx="16"/>
            <text x="185" y="34" class="t-sm t-b" text-anchor="middle">Parietal cell</text>
            <rect class="fg-acc" x="20" y="50" width="70" height="30" rx="6"/>
            <text x="55" y="70" class="t-sm" text-anchor="middle">ACh: M3</text>
            <rect class="fg-acc" x="20" y="100" width="70" height="30" rx="6"/>
            <text x="55" y="120" class="t-sm" text-anchor="middle">Gastrin</text>
            <rect class="fg-acc" x="20" y="150" width="70" height="30" rx="6"/>
            <text x="55" y="170" class="t-sm" text-anchor="middle">Histamine</text>
            <path class="fg-arrow-acc" d="M90,65 L118,65" marker-end="url(#gi5a)"/>
            <path class="fg-arrow-acc" d="M90,115 L118,115" marker-end="url(#gi5a)"/>
            <path class="fg-arrow-acc" d="M90,165 L118,165" marker-end="url(#gi5a)"/>
            <text x="125" y="69" class="t-sm t-mut">Gq</text>
            <text x="125" y="119" class="t-sm t-mut">Gq</text>
            <text x="125" y="169" class="t-sm t-mut">Gs, cAMP</text>
            <rect class="fg-bad" x="205" y="95" width="50" height="40" rx="8"/>
            <text x="230" y="113" class="t-sm t-b" text-anchor="middle">H+/K+</text>
            <text x="230" y="128" class="t-sm" text-anchor="middle">ATPase</text>
            <path class="fg-arrow-acc" d="M255,115 L300,115" marker-end="url(#gi5a)"/>
            <text x="310" y="112" class="t-sm t-b">H+</text>
            <text x="304" y="130" class="t-sm t-mut">lumen</text>
            <text x="72" y="204" class="t-sm t-mut" text-anchor="middle">atropine, H2 blockers</text>
            <text x="230" y="210" class="t-sm t-mut" text-anchor="middle">PPIs block the pump</text>
          </svg>
        caption: "3 منبّهات جايين من 3 مصادر: الـ ACh من الـ vagus nerve، والـ histamine من الـ ECL cells اللي جنبها، والـ gastrin بس هو اللي جاي من الدم (بتفرزه الـ G cells). وكلهم بيخلصوا على مضخة واحدة بتطلّع H+. الـ atropine بيقفل الـ M3، والـ H2 blockers بيقفلوا باب الـ histamine، والـ PPI بيقفل المضخة نفسها."
        alt: "A parietal cell with three receptors: M3 for acetylcholine from the vagus nerve (Gq), the gastrin receptor for gastrin carried in the blood from G cells (Gq), and H2 for histamine from nearby ECL cells (Gs, cAMP), all driving the H+/K+ ATPase that pumps H+ into the lumen. Atropine and H2 blockers act on receptors; PPIs block the pump."
        page: 405
        quote: "Atropine Vagus nerve Gastric parietal cell Lumen Carbonic anhydrase Gq Gs H2 blockers ECL cells G cells cAMP Sucralfate, bismuth GRP Proton pump inhibitors Antacids Ach M3 receptor Somatostatin Gastrin Histamine HCO3 ”alkaline tide”— ↑ blood pH after gastric acid secretion (eg, after meals, vomiting) – HCO3 H2 CO3 CO O 2 +H2 – + H+ H+ K+ CI– CI– IP3 /Ca2+ Prostaglandins CCKB receptor H2 receptor Gi ATPase Misoprostol"
      - kind: reveal
        prompt: "ليه الـ PPI أقوى من الـ H2 blocker في قفل الحمض؟"
        answer: "الـ H2 blocker بيقفل باب واحد بس (الـ histamine)، والـ ACh والـ gastrin لسه شغالين. الـ PPI بيقفل ==الـ H+/K+ ATPase== نفسها، وده الطريق اللي كل المنبّهات بتخلص عليه، وكمان بيقفلها **irreversibly**."
        page: 406
        quote: "Irreversibly inhibit H+ /K+ -ATPase in stomach parietal cells."
      - kind: aside
        tone: exam
        text: "**Alkaline tide**: كل ما الـ parietal cell تطلّع H+ للمعدة، بتطلّع ==HCO3- للدم==. عشان كده الـ pH بتاع الدم بيعلى شوية بعد الأكل، وبيعلى أكتر مع الـ vomiting (ده أصل الـ metabolic alkalosis في القيء)."
        page: 405
        quote: "”alkaline tide”— ↑ blood pH after gastric acid secretion (eg, after meals, vomiting)"
      - kind: try
        items: [gi.L05.002, gi.L05.005, gi.L05.008, gi.L05.003, gi.L05.011]
    recap:
      - "Pancreatic adenocarcinoma: ducts، head ← jaundice، CA 19-9، KRAS؛ أقوى عامل خطورة السجاير."
      - "Trousseau = migratory thrombophlebitis؛ Courvoisier = مرارة محسوسة مش بتوجع مع jaundice."
      - "الـ parietal cell: M3 و gastrin (Gq)، histamine (Gs)؛ كلهم على الـ H+/K+ ATPase."
      - "Alkaline tide: HCO3- للدم بعد الأكل والقيء."
