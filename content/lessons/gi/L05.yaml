            <text x="230" y="210" class="t-sm t-mut" text-anchor="middle">PPIs block the pump</text>
          </svg>
        caption: "3 منبّهات بتدخل من الدم (ACh والـ gastrin والـ histamine)، وكلهم بيخلصوا على مضخة واحدة بتطلّع H+. الـ atropine بيقفل الـ M3، والـ H2 blockers بيقفلوا باب الـ histamine، والـ PPI بيقفل المضخة نفسها."
        alt: "A parietal cell with three receptors on its blood side, for acetylcholine (M3, Gq), gastrin (Gq) and histamine (Gs, cAMP), all driving the H+/K+ ATPase that pumps H+ into the lumen. Atropine and H2 blockers act on receptors; PPIs block the pump."
        page: 405
        quote: "Atropine Vagus nerve Gastric parietal cell Lumen Carbonic anhydrase Gq Gs H2 blockers ECL cells G cells cAMP"
      - kind: reveal
        prompt: "ليه الـ PPI أقوى من الـ H2 blocker في قفل الحمض؟"
        answer: "الـ H2 blocker بيقفل باب واحد بس (الـ histamine)، والـ ACh والـ gastrin لسه شغالين. الـ PPI بيقفل ==الـ H+/K+ ATPase== نفسها، وده الطريق اللي كل المنبّهات بتخلص عليه، وكمان بيقفلها **irreversibly**."
        page: 406
        quote: "Irreversibly inhibit H+ /K+ -ATPase in stomach parietal cells."
      - kind: aside
        tone: exam
        text: "**Alkaline tide**: كل ما الـ parietal cell تطلّع H+ للمعدة، بتطلّع ==HCO3- للدم==. عشان كده الـ pH بتاع الدم بيعلى شوية بعد الأكل، وبيعلى أكتر مع الـ vomiting (ده أصل الـ metabolic alkalosis في القيء)."
        page: 405
        quote: "”alkaline tide”— ↑ blood pH after gastric acid secretion (eg, after meals, vomiting)"
      - kind: try
        items: [gi.L05.002, gi.L05.005, gi.L05.008, gi.L05.009, gi.L05.011]
    recap:
      - "Pancreatic adenocarcinoma: ducts، head ← jaundice، CA 19-9، KRAS؛ أقوى عامل خطورة السجاير."
      - "Trousseau = migratory thrombophlebitis؛ Courvoisier = مرارة محسوسة مش بتوجع مع jaundice."
      - "الـ parietal cell: M3 و gastrin (Gq)، histamine (Gs)؛ كلهم على الـ H+/K+ ATPase."
      - "Alkaline tide: HCO3- للدم بعد الأكل والقيء."
    practice: [gi.L05.001, gi.L05.002, gi.L05.003, gi.L05.004, gi.L05.005, gi.L05.006, gi.L05.007, gi.L05.008, gi.L05.009, gi.L05.010, gi.L05.011, gi.L05.012, gi.L05.013]
  - id: gi.L05.lesson2
    title: "أدوية الحموضة: كل واحد وعيبه"
    hook: "الـ Step 1 مش بيسألك الدوا بيعمل إيه بس، بيسألك هيعمل إيه في المريض بعد شهور"
    minutes: 9
    pages: [406, 406]
    topics: [h2-blockers, proton-pump-inhibitors, antacids, bismuth-sucralfate, misoprostol]
    goals:
      - "تعرف عيوب الـ cimetidine اللي بتميّزه عن باقي الـ H2 blockers"
      - "تحفظ مضاعفات الـ PPI على المدى الطويل"
      - "تفرق بين الـ antacids التلاتة بالأعراض"
      - "تعرف شروط الـ sucralfate والـ misoprostol"
    status: unverified
    steps:
      - kind: explain
        title: "الـ H2 blockers"
        text: |-
          cimetidine و famotidine و nizatidine: بيقفلوا الـ H2 receptor ==reversibly== ← H+ أقل.
          الكتاب بيقولك خدهم **قبل الأكل** ("Take H2 blockers before you dine"، و"table for 2").
          الاستخدام: peptic ulcer و gastritis و reflux **خفيف**.
        page: 406
        quote: "Reversible block of histamine H2 -receptors → ↓ H+ secretion by parietal cells."
      - kind: explain
        title: "الـ cimetidine: الولد الشقي"
        text: |-
          هو بس اللي عنده المشاكل دي، والباقيين تقريباً نضاف:
          - ==potent P-450 inhibitor== ← تداخلات كتير (warfarin مثلاً)
          - **antiandrogenic**: prolactin و gynecomastia و impotence و ↓ libido في الرجالة
          - بيعدي الـ blood-brain barrier (confusion و dizziness و headache) وبيعدي الـ placenta
          - بيقلل الـ renal excretion بتاع الـ creatinine
        page: 406
        quote: "Cimetidine is a potent inhibitor of cytochrome P-450 (multiple drug interactions); it also has antiandrogenic effects"
      - kind: check
        question: "A man on warfarin starts an over-the-counter heartburn drug; his INR rises and he develops gynecomastia. Which drug?"
        options:
          - Cimetidine
          - Famotidine
          - Omeprazole
          - Calcium carbonate
        answer: 0
        why:
          - "صح: P-450 inhibitor (فالـ warfarin يعلى) و antiandrogenic (gynecomastia)."
          - "الـ famotidine H2 blocker بس relatively free من العيوب دي."
          - "الـ omeprazole مش بيعمل gynecomastia."
          - "الـ calcium carbonate بيعمل hypercalcemia و chelation، مش ده."
        page: 406
        quote: "Other H2 blockers are relatively free of these effects."
      - kind: explain
        title: "الـ PPIs ومشاكل المدى الطويل"
        text: |-
          omeprazole وإخواته: بيقفلوا الـ H+/K+-ATPase **irreversibly**.
          الاستخدام: ulcer و gastritis و reflux و **Zollinger-Ellison** وعلاج الـ **H pylori** و stress ulcer prophylaxis.

          العيوب (الحمض كان بيحمي وبيساعد الامتصاص):
          - ↑ ==C difficile== و pneumonia
          - acute interstitial nephritis
          - B12 malabsorption
          - ↓ Mg2+ و ↓ امتصاص Ca2+ ← كسور في كبار السن
        page: 406
        quote: "↑ risk of C difficile infection, pneumonia, acute interstitial nephritis. Vitamin B12 malabsorption"
      - kind: reveal
        prompt: "ست كبيرة على omeprazole من سنين، جت بكسر في الفخذ. إيه العلاقة؟"
        answer: "الـ PPI بيقلل ==Mg2+ في الدم== وبيقلل امتصاص الـ Ca2+، فالعضم يضعف مع الوقت، والكتاب بيربطه بزيادة خطر الكسور في كبار السن."
        page: 406
        quote: "↓ serum Mg2+ /Ca2+ absorption (potentially leading to increased fracture risk in older adults)."
      - kind: table
        title: "الـ antacids التلاتة"
        columns: [Antacid, Adverse effects, Hook]
        rows:
          - [Aluminum hydroxide, "Constipation, hypophosphatemia, osteodystrophy, proximal muscle weakness, seizures", "CHOPS; aluminimum amount of feces"]
          - [Calcium carbonate, "Hypercalcemia (milk-alkali), rebound acid ↑, chelates tetracycline", "Calcium chelates"]
          - [Magnesium hydroxide, "Diarrhea, hyporeflexia, hypotension, cardiac arrest", "Must go 2 the bathroom"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 406
        quote: "Aluminum hydroxide Constipation, Hypophosphatemia, Osteodystrophy, Proximal muscle weakness, Seizures Aluminimum amount of feces CHOPS"
      - kind: aside
        tone: tip
        text: "الـ aluminum بيمسك والـ magnesium بيسهّل، عشان كده بيتخلطوا مع بعض في الأقراص. وكل الـ antacids ممكن تعمل ==hypokalemia==، وممكن تغيّر امتصاص أدوية تانية لأنها بتغيّر الـ pH."
        page: 406
        quote: "Can affect absorption, bioavailability, or urinary excretion of other drugs by altering gastric and urinary pH or by delaying gastric emptying. All can cause hypokalemia."
      - kind: explain
        title: "اللي بيغطوا القرحة: bismuth و sucralfate"
        text: |-
          بيلزقوا في ==قاع القرحة== ويحموها، والـ HCO3- يرجع يعمل الـ pH gradient في الـ mucus.
          الـ **sucralfate محتاج حمض** عشان يشتغل، فمش بيتاخد مع PPI أو H2 blocker.
          الـ **bismuth** كمان للـ travelers' diarrhea وجزء من الـ quadruple therapy للـ H pylori.
        page: 406
        quote: "Sucralfate requires acidic environment, not given with PPIs/H2 blockers."
      - kind: explain
        title: "الـ misoprostol"
        text: |-
          PGE analog: ↑ الـ mucous barrier و ↓ الحمض.
          الاستخدام: ==منع قرحة الـ NSAIDs== (الـ NSAIDs بتقفل الـ prostaglandins)، و off-label لتحضير عنق الرحم في الولادة.
          العيب: diarrhea. وممنوع لأي حد ممكن يحمل لأنه **abortifacient**.
        page: 406
        quote: "Prevention of NSAID-induced peptic ulcers (NSAIDs block PGE1 production). Also used off-label for induction of labor (ripens cervix)."
      - kind: check
        question: "Which drug should not be combined with a PPI because it needs acid to work?"
        options:
          - Sucralfate
          - Bismuth
          - Misoprostol
          - Magnesium hydroxide
        answer: 0
        why:
          - "صح: الـ sucralfate requires acidic environment."
          - "الـ bismuth بيتاخد مع الـ PPI عادي في الـ quadruple therapy."
          - "الـ misoprostol مش محتاج حمض."
          - "الـ magnesium hydroxide antacid، مش ليه الشرط ده."
        page: 406
        quote: "Sucralfate requires acidic environment, not given with PPIs/H2 blockers."
      - kind: try
        items: [gi.L05.019, gi.L05.025, gi.L05.031, gi.L05.034, gi.L05.039]
    recap:
      - "Cimetidine: P-450 inhibitor، antiandrogenic، بيعدي المخ والـ placenta؛ باقي الـ H2 blockers نضاف."
      - "PPI: C difficile و pneumonia و AIN و B12 و ↓ Mg2+/Ca2+ (كسور)."
      - "Aluminum = CHOPS (إمساك)؛ calcium = milk-alkali و chelation؛ magnesium = إسهال و hyporeflexia."
      - "Sucralfate محتاج حمض؛ misoprostol لقرحة الـ NSAIDs وممنوع في الحمل."
    practice: [gi.L05.014, gi.L05.015, gi.L05.016, gi.L05.017, gi.L05.018, gi.L05.019, gi.L05.020, gi.L05.021, gi.L05.022, gi.L05.023, gi.L05.024, gi.L05.025, gi.L05.026, gi.L05.027, gi.L05.028, gi.L05.029, gi.L05.030, gi.L05.031, gi.L05.032, gi.L05.033, gi.L05.034, gi.L05.035, gi.L05.036, gi.L05.037, gi.L05.038, gi.L05.039]
  - id: gi.L05.lesson3
    title: "أدوية الأمعاء: نقفلها ونسهّلها ونمنع الترجيع"
    hook: "كل دوا هنا فكرته في اسم الـ receptor، ولو عرفت الـ receptor عرفت العيب"
    minutes: 10
    pages: [407, 408]
    topics: [octreotide, sulfasalazine, loperamide-diphenoxylate, antiemetics, orlistat, anticonstipation-drugs]
    goals:
      - "تعرف استخدامات الـ octreotide وليه بيعمل حصوة"
      - "تفرق بين الـ antiemetics التلاتة بالـ receptor والعيب"
      - "تعرف الـ laxatives بالـ mechanism، وإزاي الـ lactulose بيعالج الـ encephalopathy"
    status: unverified
    steps:
      - kind: explain
        title: "الـ octreotide"
        text: |-
          ==somatostatin analog== طويل المفعول: بيقفل هرمونات كتير بتوسّع أوعية البطن (splanchnic).
          الاستخدام: **acute variceal bleeds** و acromegaly و VIPoma و carcinoid tumors.
          العيوب: nausea و cramps و steatorrhea، و**حصوة مرارة** لأنه بيقفل الـ CCK فالمرارة مش بتفضى.
        page: 407
        quote: "Nausea, cramps, steatorrhea. ↑ risk of cholelithiasis due to CCK inhibition."
      - kind: explain
        title: "الـ sulfasalazine والـ loperamide"
        text: |-
          **Sulfasalazine** = sulfapyridine (antibacterial) + 5-ASA (anti-inflammatory)، و==بكتيريا القولون== هي اللي بتفكّه وتشغّله. للـ UC والـ Crohn (الجزء اللي في الـ colon). العيوب: malaise و nausea و sulfonamide toxicity و **oligospermia reversible**.

          **Loperamide و diphenoxylate**: agonists على الـ μ-opioid receptors ← الأمعاء تهدى. مش بيدخلوا المخ كتير، فاحتمال الإدمان قليل. للإسهال، وعيبهم الإمساك.
        page: 407
        quote: "A combination of sulfapyridine (antibacterial) and 5-aminosalicylic acid (anti-inflammatory). Activated by colonic bacteria."
      - kind: reveal
        prompt: "ليه الـ sulfasalazine بيشتغل في الـ colon بالذات ومش في المعدة؟"
        answer: "لأنه بيوصل سليم لحد ما ==colonic bacteria== تكسّر الرابط بين الـ sulfapyridine والـ 5-ASA، فالـ 5-ASA يتحرر في القولون نفسه، مكان الالتهاب في الـ UC."
        page: 407
        quote: "Activated by colonic bacteria."
      - kind: table
        title: "الـ antiemetics: 3 receptors"
        columns: [Drugs, Receptor, Adverse effects]
        rows:
          - ["Ondansetron, granisetron", 5-HT3 antagonist, "Headache, constipation, QT prolongation, serotonin syndrome"]
          - ["Prochlorperazine, metoclopramide", D2 antagonist, "Extrapyramidal symptoms, hyperprolactinemia, restlessness, depression"]
          - ["Aprepitant, fosaprepitant", NK1 (substance P) antagonist, "Fatigue, GI distress"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1]]
        page: 407
        quote: "Ondansetron, granisetron 5-HT3 -receptor antagonists Also act peripherally (↓ vagal stimulation)"
      - kind: aside
        tone: exam
        text: "كلهم بيشتغلوا في الـ ==chemoreceptor trigger zone== في الـ area postrema. الـ metoclopramide زيادة كمان بيسرّع تفريغ المعدة ويشد الـ LES، فبيتسأل عليه في الـ **diabetic gastroparesis**، والسؤال الجاي بيكون عن الـ galactorrhea أو الحركات اللاإرادية."
        page: 407
        quote: "Metoclopramide is also used in gastroparesis (eg, diabetic), persistent GERD"
      - kind: check
        question: "A patient on a drug for diabetic gastroparesis develops galactorrhea. Which receptor does the drug block?"
        options:
          - D2
          - 5-HT3
          - NK1
          - μ-opioid
        answer: 0
        why:
          - "صح: metoclopramide = D2 antagonist، فالـ prolactin يعلى."
          - "الـ 5-HT3 (ondansetron): صداع وإمساك و QT."
          - "الـ NK1 (aprepitant): تعب و GI distress."
          - "الـ μ-opioid agonist (loperamide) بيبطّأ الأمعاء، وده عكس المطلوب."
        page: 407
        quote: "Extrapyramidal symptoms, hyperprolactinemia, anxiety, drowsiness, restlessness, depression, GI distress"
      - kind: explain
        title: "الـ orlistat"
        text: |-
          بيقفل ==gastric and pancreatic lipase== ← الدهون مش بتتكسر ولا تتمتص. بيتاخد مع الأكل اللي فيه دهون، للتخسيس.
          العيوب: steatorrhea و flatulence و urgency، و↓ امتصاص الفيتامينات اللي بتدوب في الدهون (A و D و E و K).
        page: 407
        quote: "Inhibits gastric and pancreatic lipase → ↓ breakdown and absorption of dietary fats."
      - kind: figure
        title: "الـ laxatives: إزاي كل واحد بيدخّل مية"
        svg: |-
          <svg viewBox="0 0 360 206" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="20" y="70" width="320" height="60" rx="30"/>
            <text x="180" y="105" class="t-sm t-b" text-anchor="middle">Colon lumen: water in → softer stool</text>
            <text x="20" y="30" class="t-sm t-b">Pull water in</text>
            <text x="20" y="48" class="t-sm t-mut">bulk (psyllium), osmotic (lactulose, PEG)</text>
            <text x="20" y="160" class="t-sm t-b">Secrete fluid</text>
            <text x="20" y="178" class="t-sm t-mut">lubiprostone (Cl-), linaclotide (cGMP)</text>
