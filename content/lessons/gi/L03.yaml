        caption: "الـ heme ← biliverdin (أخضر) ← bilirubin (أصفر بني). بيمشي في الدم على albumin، الكبد بيعمله conjugation ويطلعه في الصفرا. بكتيريا الأمعاء بتعمله urobilinogen: أغلبه بيخرج في البراز stercobilin (اللون البني)، وجزء بيتمص تاني، ومنه شوية بيخرج في البول urobilin (اللون الأصفر)."
        alt: "Flow: RBC heme in macrophage, unconjugated bilirubin on albumin, liver conjugation by UDP-glucuronosyltransferase, bile to gut bacteria making urobilinogen; 80% excreted in feces as stercobilin, 20% reabsorbed (90% back to liver, 10% to kidney as urobilin in urine)."
        page: 382
        quote: "Heme is metabolized by heme oxygenase to biliverdin (green), which is subsequently reduced to bilirubin (yellow-brown). Unconjugated bilirubin is removed from blood by liver, conjugated with glucuronate, and excreted in bile."
