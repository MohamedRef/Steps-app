  - id: gi.L03.lesson4
    title: "الصفرا والـ bilirubin: ليه البراز بني والبول أصفر"
    hook: "رحلة الـ heme من كرة دم حمرا لحد لون البراز"
    minutes: 8
    pages: [382, 382]
    topics: [bile, bilirubin]
    goals:
      - "تعرف مكونات الصفرا ووظايفها"
      - "تشرح ليه مرض الـ ileum بيعمل oxalate stones"
      - "ترسم رحلة الـ bilirubin وتفرّق direct من indirect"
    status: unverified
    steps:
      - kind: explain
        title: "الصفرا متكونة من إيه"
        text: |-
          bile salts، phospholipids، cholesterol، bilirubin، مية وأملاح.

          الـ **bile salts** = bile acids متوصلة بـ ==glycine أو taurine==، وده اللي بيخليها تدوب في المية.
          الـ rate-limiting step في تصنيعها: ==cholesterol 7α-hydroxylase==.
        page: 382
        quote: "Cholesterol 7α-hydroxylase catalyzes rate-limiting step of bile acid synthesis."
      - kind: explain
        title: "الصفرا بتعمل إيه"
        text: |-
          - **هضم وامتصاص الدهون** والـ fat-soluble vitamins.
          - **إخراج الـ bilirubin والـ cholesterol**: دي الطريقة الأساسية اللي الجسم بيتخلص بيها منهم.
          - **Antimicrobial**: بتكسر الـ membranes.
        page: 382
        quote: "Digestion and absorption of lipids and fat- soluble vitamins Bilirubin and cholesterol excretion (body’s 1° means of elimination) Antimicrobial activity (via membrane disruption)"
      - kind: reveal
        prompt: "مريض Crohn في الـ terminal ileum جاله kidney stone. إيه العلاقة؟"
        answer: |-
          - الـ ileum مش بيمص الـ bile salts ← الدهون مش بتتمص (وممكن bile acid diarrhea).
          - الدهون اللي فاضلة في الـ lumen بتمسك الـ **calcium**.
          - الـ calcium كان المفروض يمسك الـ **oxalate**؛ دلوقتي الـ oxalate حر فبيتمص ← ==calcium oxalate stones==.
        page: 382
        quote: "Calcium, which normally binds oxalate, binds fat instead, so free oxalate is absorbed by gut → ↑ frequency of calcium oxalate kidney stones."
      - kind: figure
        title: "رحلة الـ bilirubin"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="gi3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
