  - id: gi.L02.lesson5
    title: "الفتق: من فين طالع؟"
    hook: "الـ inferior epigastric vessels هي البوصلة: MDs don't lie"
    minutes: 10
    pages: [375, 377]
    topics: [femoral-region, inguinal-canal, hernias, spigelian-hernia, diaphragmatic-hernia, indirect-inguinal-hernia, direct-inguinal-hernia, femoral-hernia]
    goals:
      - "ترتّب الـ femoral region من برّه لجوّه"
      - "تعرف طبقات الـ spermatic cord جاية منين"
      - "تفرّق بين indirect و direct و femoral hernia"
      - "تعرف الـ diaphragmatic hernia في الأطفال والكبار"
    status: unverified
    steps:
      - kind: explain
        title: "الـ femoral region: NAVeL"
        text: |-
          من برّه لجوّه: ==nerve ثم artery ثم vein ثم lymphatics==. الكتاب بيقولك: تمشي من برّه لجوّه عشان تلاقي سرتك (navel).

          - **Femoral triangle**: فيه الـ nerve والـ artery والـ vein.
          - **Femoral sheath**: أنبوبة fascia لحد 3-4 سم تحت الـ inguinal ligament، فيها الـ vein والـ artery والـ canal (deep inguinal lymph nodes)، بس ==من غير الـ femoral nerve==.
        page: 375
        quote: "Femoral sheath Fascial tube 3-4 cm below inguinal ligament. Contains femoral vein, artery, and canal (deep inguinal lymph nodes) but not femoral nerve."
      - kind: match
        prompt: "كل طبقة في الـ spermatic cord جاية من أنهي طبقة في جدار البطن؟"
        pairs:
          - ["External spermatic fascia", "External oblique"]
          - ["Cremasteric muscle and fascia", "Internal oblique"]
          - ["Internal spermatic fascia", "Transversalis fascia"]
        why: "الخصية وهي نازلة بتزق كل طبقة من جدار البطن قدّامها كأنها شراب، فكل طبقة في الـ cord نسخة من طبقة في الجدار. الكتاب بيرتبها ICE من تحت لفوق: Internal و Cremasteric و External."
        page: 376
        quote: "External spermatic fascia (external oblique) Cremasteric muscle and fascia (internal oblique)"
      - kind: explain
        title: "الفتق عموماً"
        text: |-
          الفتق = الـ peritoneum طالع من فتحة، غالباً في مكان ضعيف.
          - **Incarceration**: مش راجع جوّه.
          - **Strangulation**: الدم اتقطع ← ==ischemia و necrosis==. الفتق المعقد بيبان بـ tenderness و erythema و fever.

          **Spigelian hernia**: من بين الـ rectus abdominis والـ semilunar line، وأغلبها تحت لأن مفيش **posterior rectus sheath** هناك. التشخيص ultrasound و CT.
        page: 376
        quote: "Contents may be at risk for incarceration (not reducible back into abdomen/pelvis) and strangulation (ischemia and necrosis). Complicated hernias can present with tenderness, erythema, fever."
      - kind: figure
        title: "البوصلة: الـ inferior epigastric vessels"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="140" x2="340" y2="140" stroke-width="3"/>
            <text x="200" y="158" class="t-sm t-mut">inguinal ligament</text>
            <line class="fg-arrow-bad" x1="180" y1="20" x2="180" y2="135" stroke-width="3"/>
            <text x="186" y="34" class="t-sm t-bad">inferior epigastric vessels</text>
            <rect class="fg-acc" x="90" y="70" width="80" height="60" rx="8"/>
            <text x="130" y="96" class="t-sm t-b" text-anchor="middle">Hesselbach</text>
            <text x="130" y="114" class="t-sm" text-anchor="middle">direct</text>
            <circle class="fg-good" cx="240" cy="105" r="24"/>
            <text x="240" y="101" class="t-sm t-b" text-anchor="middle">deep ring</text>
            <text x="240" y="117" class="t-sm" text-anchor="middle">indirect</text>
            <rect class="fg-box" x="70" y="40" width="20" height="100"/>
            <text x="30" y="34" class="t-sm t-mut">rectus</text>
            <circle class="fg-bad" cx="120" cy="175" r="16"/>
            <text x="145" y="185" class="t-sm t-b">femoral (below ligament)</text>
            <text x="20" y="196" class="t-sm t-mut">medial</text>
            <text x="310" y="196" class="t-sm t-mut">lateral</text>
          </svg>
        caption: "الـ direct جوّه (medial) الـ inferior epigastric vessels في الـ Hesselbach triangle، والـ indirect برّاهم (lateral) من الـ deep ring، والـ femoral تحت الـ inguinal ligament خالص."
        alt: "Diagram of the inner groin: a vertical line for the inferior epigastric vessels; medial to it the Hesselbach triangle (direct hernia) next to the rectus; lateral to it the deep ring (indirect hernia); below the inguinal ligament the femoral hernia."
        page: 377
        quote: "MDs don’t lie: Medial to inferior epigastric vessels = Direct hernia. Lateral to inferior epigastric vessels = indirect hernia."
      - kind: explain
        title: "Indirect: الطريق اللي الخصية مشيته"
        text: |-
          بيدخل من الـ **deep ring** (lateral للـ inferior epigastric vessels)، يمشي في الـ canal، ويطلع من الـ **superficial ring** للـ scrotum.

          السبب: الـ ==processus vaginalis ما اتقفلش== (وممكن يعمل hydrocele). فبيمشي في نفس طريق نزول الخصية، ومتغطي بـ **التلات طبقات** بتوع الـ spermatic fascia. أكتر بكتير في الذكور، وممكن يبان في الرضيع أو يتكشف في الكبر.
        page: 377
        quote: "Caused by failure of processus vaginalis to close (can form hydrocele). May be noticed in infants or discovered in adulthood. Much more common in males B ."
      - kind: explain
        title: "Direct: الحيطة ضعفت"
        text: |-
          بيزق ==على طول من الـ Hesselbach triangle==: medial للـ inferior epigastric vessels و lateral للـ rectus abdominis.

          بيطلع من الـ **superficial ring بس**، ومتغطي بالـ **external spermatic fascia** بس. غالباً في راجل كبير، لأن الـ **transversalis fascia** ضعفت مع السن.
        page: 377
        quote: "Goes through external (superficial) inguinal ring only. Covered by external spermatic fascia. Usually occurs in older males due to acquired weakness of transversalis fascia."
      - kind: check
        question: "At surgery, a hernia sac emerges lateral to the inferior epigastric vessels inside the spermatic cord. Which statement is true?"
        options:
          - "It is covered by all three layers of spermatic fascia"
          - "It is caused by acquired weakness of the transversalis fascia"
          - "It passes through the external ring only"
          - "It lies below the inguinal ligament"
        answer: 0
        why:
          - "صح: lateral يبقى indirect، ماشي جوّه الـ cord فمتغطي بالتلات طبقات."
          - "ضعف الـ transversalis fascia ده الـ direct."
          - "الـ external ring بس ده الـ direct."
          - "تحت الـ inguinal ligament ده الـ femoral."
        page: 377
        quote: "Follows the pathway of testicular descent. Covered by all 3 layers of spermatic fascia."
      - kind: explain
        title: "Femoral: الست الكبيرة والخطر"
        text: |-
          بيطلع ==تحت الـ inguinal ligament== من الـ femoral canal، تحت وبرّه الـ pubic tubercle.

          أكتر في **الستات**، بس خلي بالك: الـ inguinal hernias لسه أشهر نوع عموماً حتى في الستات. والـ femoral ==أكتر عرضة للـ incarceration والـ strangulation== لأن الـ canal ضيق.
        page: 377
        quote: "More common in females, but overall inguinal hernias are the most common. More likely to present with incarceration or strangulation (vs inguinal hernia)."
      - kind: explain
        title: "الـ diaphragmatic hernia"
        text: |-
          حاجات من البطن بتطلع الصدر، وممكن تسمع **bowel sounds في الصدر**.
          - **الأطفال**: عيب خلقي في الـ ==pleuroperitoneal membrane==، غالباً **شمال** لأن الكبد بيحمي اليمين.
          - **الكبار**: ارتخاء في الـ phrenoesophageal membrane ← **hiatal hernia**:
