      - kind: reveal
        prompt: "ليه الـ internal hemorrhoid ما بيوجعش، والـ external لما يعمل thrombosis بيوجع جداً؟"
        answer: "الـ ==internal== فوق الخط، أعصابه visceral (زي الأمعاء: بتحس بالشد بس مش بالوجع الحاد). الـ ==external== تحت الخط، أعصابه somatic من الـ inferior rectal branch بتاع الـ pudendal، زي الجلد بالظبط، فبيوجع لما يتجلط."
        page: 373
        quote: "Receive visceral innervation and are therefore not painful. External hemorrhoids—receive somatic innervation (inferior rectal branch of pudendal nerve) and are therefore painful if thrombosed."
      - kind: explain
        title: "الـ anal fissure"
        text: |-
          شرخ في الـ anoderm ==تحت الخط==، فبيوجع وقت الدخول للحمام، ودم على الـ toilet paper.

          مكانه في الـ **posterior midline** لأن المنطقة دي دمها ضعيف (poorly perfused)، فبتلم ببطء. مرتبط بأكل قليل الألياف والإمساك.
        page: 373
        quote: "Anal fissure—tear in anoderm below pectinate line. Pain while pooping; blood on toilet paper. Located in the posterior midline because this area is poorly perfused. Associated with low-fiber diets and constipation."
      - kind: check
