      - kind: explain
        title: "مين ساكن في الكبد"
        text: |-
          - الـ lobule شكله **hexagon** حوالين **central vein**، والـ portal triads على الأركان (portal vein و hepatic artery و bile ducts ومعاهم lymphatics).
          - الـ hepatocyte وشّه الـ **apical** ناحية الـ bile canaliculi، والـ **basolateral** ناحية الـ sinusoids.
          - ==Kupffer cells==: macrophages في الـ sinusoids، بتشيل البكتيريا وكرات الدم الحمرا القديمة.
          - ==Stellate (Ito) cells== في الـ space of Disse: وهي هادية بتخزن **vitamin A**، ولما تتنشط بتعمل extracellular matrix ← **fibrosis**.
          - الدم: ~80% من الـ portal vein و ~20% من الـ hepatic artery.
        page: 374
        quote: "Kupffer cells (specialized macrophages) located in sinusoids clear bacteria and damaged or senescent RBCs."
