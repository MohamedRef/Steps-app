  - id: gi.L02.lesson4
    title: "الـ pectinate line والكبد من جوّه"
    hook: "خط واحد في الشرج بيقسم كل حاجة نصين، وزون واحدة في الكبد بتموت من الـ acetaminophen"
    minutes: 10
