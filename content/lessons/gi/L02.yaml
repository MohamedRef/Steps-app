          - ["Lymph", "Internal iliac nodes", "Superficial inguinal nodes"]
          - ["Disease", "Internal hemorrhoids, adenocarcinoma", "External hemorrhoids, fissures, squamous cell carcinoma"]
        hide: [[0, 2], [2, 1], [3, 1], [3, 2], [4, 2]]
