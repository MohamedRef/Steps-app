          عشان كده كل حاجة فوقه "جوّانية" (visceral زي الأمعاء)، وكل حاجة تحته "جلد" (somatic).
        page: 373
        quote: "Pectinate line Also called dentate line. Formed where endoderm (hindgut) meets ectoderm."
      - kind: table
