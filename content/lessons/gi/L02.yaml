        page: 374
        quote: "Most sensitive to metabolic toxins (eg, ethanol, CCl4, rifampin, acetaminophen) Site of alcohol-associated hepatitis"
      - kind: explain
        title: "الصفرا والبنكرياس بيتقابلوا في الـ ampulla"
        text: |-
          الـ common bile duct والـ main pancreatic duct بيتقابلوا في الـ **ampulla of Vater**.
          - **Double duct sign**: حصوة واقفة في الـ ampulla بتسد الاتنين ← ==cholangitis و pancreatitis== مع بعض.
          - **Courvoisier sign**: ورم في الـ **head of pancreas** (غالباً ductal adenocarcinoma) بيسد الـ CBD ببطء ← gallbladder كبيرة ==nontender== مع jaundice.
        page: 375
        quote: "Tumors that arise in head of pancreas (usually ductal adenocarcinoma) can cause obstruction of common bile duct → enlarged nontender gallbladder with jaundice (Courvoisier sign)."
      - kind: check
        question: "Painless jaundice, weight loss and a palpable nontender gallbladder. Where is the lesion?"
