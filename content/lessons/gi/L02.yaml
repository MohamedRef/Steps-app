        caption: "الدم داخل من الـ portal triad على الأطراف وماشي ناحية الـ central vein. أول زون بتاخد أحسن أكسجين، وآخر زون بتاخد الفضلة، بس هي اللي فيها الـ P-450."
        alt: "Three bands from portal triad to central vein: zone I periportal, best oxygen, viral hepatitis and cocaine; zone II yellow fever; zone III pericentral, least oxygen, P-450, ischemia and acetaminophen."
        page: 374
