        alt: "Two sketches of the bowel wall: left, a pouch containing all layers including muscle (true diverticulum); right, a pouch of mucosa and submucosa pushing through a gap in the muscle layer (false diverticulum)."
        page: 390
        quote: "“True” diverticulum—all gut wall layers outpouch (eg, Meckel). “False” diverticulum or pseudodiverticulum— only mucosa and submucosa outpouch."
