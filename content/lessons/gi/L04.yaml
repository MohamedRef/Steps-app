    goals:
      - "تعرف criteria الـ IBS"
      - "تشرح ليه وجع الزايدة بيتنقل"
      - "تفرّق بين true و false diverticulum وتعرف Zenker و Meckel"
      - "تشخّص Hirschsprung"
    status: unverified
    steps:
      - kind: explain
        title: "IBS: وجع من غير عيب"
        text: |-
          وجع متكرر **يوم في الأسبوع على الأقل في آخر 3 شهور** (البداية من ≥6 شهور)، مع **اتنين** من: مرتبط بالدخول للحمام، تغير في عدد المرات، تغير في شكل البراز.

          ==مفيش structural abnormality==. أكتر في الستات في منتصف العمر، ومع fibromyalgia والقلق والاكتئاب. العلاج الأول: lifestyle و dietary changes.
        page: 390
        quote: "Recurrent abdominal pain for ≥1 day/week in the last 3 months (with symptom onset ≥6 months prior to diagnosis), associated with ≥2 of the following:"
      - kind: order
        prompt: "رتّب اللي بيحصل في الـ appendicitis"
        steps:
          - "Lumen obstruction (fecalith in adults, lymphoid hyperplasia in children)"
          - "Closed-loop obstruction raises intraluminal pressure"
          - "Visceral afferents (T8-T10) → diffuse periumbilical pain"
          - "Inflammation reaches the serosa and parietal peritoneum"
          - "Pain localizes to McBurney point in the RLQ"
        why: "الـ visceral pain مش بيعرف يحدد المكان، فبيتحس في النص عند الـ dermatome بتاعه. لما الالتهاب يوصل الـ parietal peritoneum (somatic)، الوجع يتحدد في مكانه بالظبط."
        page: 390
        quote: "→ stimulation of visceral afferent nerve fibers at T8-T10 → initial diffuse periumbilical pain → inflammation extends to serosa and irritates parietal peritoneum."
      - kind: aside
        tone: exam
        text: "**Rovsing sign**: تدوس على الـ LLQ فالوجع يطلع في الـ RLQ. ومعاه psoas و obturator signs و guarding و rebound. العلاج: appendectomy."
        page: 390
        quote: "May elicit psoas, obturator, and Rovsing (severe RLQ pain with palpation of LLQ) signs; guarding and rebound tenderness on exam."
      - kind: figure
        title: "True ولا false diverticulum"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="90" y="16" class="t-sm t-b" text-anchor="middle">True (Meckel)</text>
