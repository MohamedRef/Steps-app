  - id: gi.L04.lesson7
    title: "الـ cirrhosis وكل اللي بيطلع منها"
    hook: "الكبد لما يتليف، الدم بيرجع يدوّر على طريق، والميه بتطلع في البطن"
    minutes: 9
    pages: [396, 397]
    topics: [cirrhosis-portal-hypertension, budd-chiari-syndrome, spontaneous-bacterial-peritonitis, serum-liver-markers]
    goals:
      - "تشرح الـ SAAG"
      - "تفرّق بين Budd-Chiari و portal vein thrombosis"
      - "تشخّص وتعالج الـ SBP"
      - "تقرا الـ liver tests"
    status: unverified
    steps:
      - kind: explain
        title: "Cirrhosis و portal hypertension"
        text: |-
          **Cirrhosis**: ==bridging fibrosis== (من الـ stellate cells) و regenerative nodules بيبوظوا شكل الكبد، ومعاها ↑ risk لـ **HCC**. الأسباب: alcohol و MASH و viral و autoimmune و biliary و genetic.

          **Portal hypertension** ← collaterals ← varices (esophageal و gastric و rectal). أسبابها: cirrhosis (الأشهر)، **schistosomiasis**، portal vein thrombosis.
        page: 396
        quote: "Causes: cirrhosis (most common), schistosomiasis, portal vein thrombosis."
      - kind: reveal
        prompt: "إزاي الـ SAAG بيقولك إن الـ ascites من الـ portal hypertension؟"
        answer: "الـ SAAG = serum albumin ناقص ascites albumin. في الـ portal hypertension الضغط العالي في الـ sinusoids بيزق ==مية من غير بروتين كتير==، فالـ albumin في الـ ascites واطي والفرق كبير: ==SAAG ≥ 1.1==. لو السبب التهاب أو ورم في الـ peritoneum، البروتين بيخرج مع المية والفرق يبقى صغير."
        page: 396
        quote: "Serum-to-ascites albumin gradient (SAAG) analysis of ascitic fluid sample determines between etiologies of ascites. SAAG ≥1.1 = portal hypertension."
      - kind: sort
        prompt: "وزّع علامات الـ cirrhosis"
        bins: ["Due to estrogen", "Due to portal hypertension"]
        cards:
          - { text: "Spider angiomas", bin: 0 }
          - { text: "Palmar erythema", bin: 0 }
          - { text: "Gynecomastia", bin: 0 }
          - { text: "Testicular atrophy", bin: 0 }
          - { text: "Caput medusae", bin: 1 }
          - { text: "Splenomegaly", bin: 1 }
          - { text: "Esophageal varices", bin: 1 }
        why: "الكبد هو اللي بيكسّر الـ estrogen، فلما يتليف الـ estrogen يعلى ويعمل العلامات الأولى. الضغط العالي في الـ portal vein هو اللي بيعمل الـ varices وتضخم الطحال."
        page: 396
        quote: "Spider angiomas* Palmar erythema*"
      - kind: table
        title: "Budd-Chiari ولا portal vein thrombosis؟"
        columns: ["", "Budd-Chiari", "Portal vein thrombosis"]
        rows:
          - ["Block", "Hepatic venous outflow", "Portal vein before the liver"]
          - ["Liver", "Centrilobular congestion, hepatomegaly, nutmeg liver", "No hepatomegaly unless prior disease"]
          - ["Causes", "Hypercoagulable, polycythemia vera, postpartum, HCC", "Cirrhosis, malignancy, pancreatitis, sepsis"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
        page: 397
        quote: "Associated with hypercoagulable states, polycythemia vera, postpartum state, HCC. May cause nutmeg liver (mottled appearance)."
      - kind: aside
        tone: trap
        text: "Budd-Chiari شكله زي الـ heart failure (كبد محتقن)، بس ==مفيش JVD==: الانسداد بعد القلب مش في القلب."
        page: 397
        quote: "Absence of JVD."
      - kind: explain
        title: "SBP: عدوى في الـ ascites"
        text: |-
          عدوى شائعة وخطيرة عند مريض cirrhosis و ascites. ممكن من غير أعراض، أو fever ووجع أو ==encephalopathy بتزيد==. غالباً **gram-negative** (E coli و Klebsiella).

          - التشخيص: paracentesis و ==ANC > 250 cells/mm3==.
          - العلاج: **3rd generation cephalosporin** (ceftriaxone).
        page: 397
        quote: "Diagnosis: paracentesis with ascitic fluid absolute neutrophil count (ANC) >250 cells/mm3 . Empiric first-line treatment is 3rd generation cephalosporin (eg, ceftriaxone)."
      - kind: check
        question: "A cirrhotic patient has ascitic ANC of 400 cells/mm3. First-line treatment?"
        options:
          - "Ceftriaxone"
          - "Vancomycin"
          - "Laparotomy"
          - "Lactulose alone"
        answer: 0
        why:
          - "صح: SBP، والعلاج 3rd generation cephalosporin."
          - "الـ vancomycin للـ gram-positive بس، والـ SBP غالباً gram-negative."
          - "الـ SBP مفيهاش perforation."
          - "الـ lactulose للـ encephalopathy مش للعدوى."
        page: 397
        quote: "Empiric first-line treatment is 3rd generation cephalosporin (eg, ceftriaxone)."
      - kind: table
        title: "اقرا الـ liver tests"
        columns: ["Finding", "Think"]
        rows:
          - ["ALT > AST", "Most liver disease"]
          - ["AST > ALT, >2:1, AST < 500", "Alcohol (make a toAST with alcohol)"]
          - ["AST/ALT > 1000", "Acetaminophen, ischemic, acute viral, autoimmune"]
          - ["↑ ALP, normal GGT", "Bone"]
          - ["↑ ALP and ↑ GGT", "Cholestasis, liver"]
        hide: [[1, 1], [2, 1], [3, 1]]
        page: 397
        quote: "↑ in alcohol-associated liver disease: AST > ALT (ratio usually >2:1, AST does not typically exceed 500 U/L in alcohol-associated hepatitis). Make a toAST with alcohol"
      - kind: explain
        title: "الـ function markers"
        text: |-
          الـ AST والـ ALT بيقولولك إن في **ضرر**، لكن مش بيقولولك الكبد لسه شغال ولا لأ. اللي بيقيس ==الشغل الحقيقي==:
          - **Albumin** بيقل (الكبد بيصنعه).
          - **Prothrombin time** بيطول (clotting factors بتقل).
          - **Platelets** بتقل (thrombopoietin بيقل، والطحال الكبير بيحجزها).
        page: 397
        quote: "Prothrombin time ↑ in advanced liver disease (↓ production of clotting factors, thereby measuring the liver’s biosynthetic function)"
      - kind: try
        items: [gi.L04.126, gi.L04.130, gi.L04.134, gi.L04.136, gi.L04.138]
