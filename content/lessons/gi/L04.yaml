  - id: gi.L04.lesson3
    title: "Malabsorption والـ IBD"
    hook: "Celiac و Whipple و Crohn و UC: أربع أسماء بيتكرروا في كل امتحان"
    minutes: 10
    pages: [388, 389]
    topics: [malabsorption-syndromes, inflammatory-bowel-diseases, microscopic-colitis]
    goals:
      - "تعرف الـ celiac من الـ HLA للـ serology للـ histology"
      - "تفرّق بين lactose intolerance و pancreatic insufficiency و tropical sprue و Whipple"
      - "تقارن Crohn بالـ UC في كل حاجة"
    status: unverified
    steps:
      - kind: explain
        title: "Celiac: المناعة ضد القمح"
        text: |-
          Autoimmune intolerance للـ ==gliadin== (بروتين الـ gluten في القمح والشعير والـ rye). مع **HLA-DQ2** و **HLA-DQ8**: الكتاب بيقول "I ate [8] too [2] much gluten at Dairy Queen".

          بيضرب الـ **distal duodenum و proximal jejunum** ← malabsorption و steatorrhea. العلاج gluten-free diet.
        page: 388
        quote: "Autoimmune-mediated intolerance of gliadin (gluten protein found in wheat, barley, rye). Associated with HLA-DQ2, HLA-DQ8"
      - kind: explain
        title: "تشخيص الـ celiac"
        text: |-
          - **Serology**: IgA anti-tTG و anti-endomysial و anti-deamidated gliadin. لو المريض عنده ==selective IgA deficiency== استخدم IgG عشان ما تاخدش false negative.
          - **Histology**: villi راحت، mucosal atrophy، **crypt hyperplasia**، intraepithelial lymphocytes.
          - **D-xylose**: abnormal (الـ mucosa بايظة).
        page: 388
        quote: "IgG-based testing preferred in selective IgA deficiency to avoid false negatives."
      - kind: aside
        tone: exam
        text: "طفح بيهرش فيه vesicles على الكوع والركبة = ==dermatitis herpetiformis== = celiac. وكمان: ↓ bone density، iron deficiency anemia، و ↑ risk لـ T-cell lymphoma."
        page: 388
        quote: "Associated with dermatitis herpetiformis, ↓ bone density, iron deficiency anemia, moderately ↑ risk of malignancy (eg, T-cell lymphoma)."
      - kind: table
        title: "باقي الـ malabsorption"
        columns: ["Disorder", "Key point"]
        rows:
          - ["Lactose intolerance", "Normal villi; osmotic diarrhea, ↓ stool pH; breath H2 >20 ppm"]
          - ["Pancreatic insufficiency", "Fat, ADEK, B12 malabsorbed; ↓ fecal elastase; D-xylose normal"]
          - ["Tropical sprue", "Like celiac but responds to antibiotics; tropics; folate then B12 deficiency"]
          - ["Whipple disease", "T whipplei; PAS+ foamy macrophages; cardiac, arthralgia, neuro; older men"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 388
        quote: "Similar findings as celiac sprue (affects small bowel), but responds to antibiotics."
      - kind: reveal
        prompt: "ليه الـ stool pH بيقل في الـ lactose intolerance؟"
        answer: "الـ lactose اللي ما اتهضمش بيوصل الـ colon، والبكتيريا بتخمّره ← أحماض و gas. الأحماض بتقلل الـ pH، والـ lactose نفسه بيشد مية ← ==osmotic diarrhea==، والـ hydrogen بيطلع في النفس."
        page: 388
        quote: "Osmotic diarrhea, ↓ stool pH (colonic bacteria ferment lactose)."
      - kind: aside
        tone: tip
        text: "Whipple بالكتاب: **PASs the foamy Whipped cream in a CAN**: PAS و foamy macrophages، و Cardiac و Arthralgias و Neurologic. الإسهال بيجي متأخر."
        page: 388
        quote: "PASs the foamy Whipped cream in a CAN."
      - kind: table
        title: "Crohn ولا UC؟"
        columns: ["", "Crohn", "UC"]
        rows:
          - ["Where", "Anywhere, usually terminal ileum; skip lesions, rectal sparing", "Colon, continuous, always rectum"]
          - ["Depth", "Transmural → fistulas", "Mucosa and submucosa only"]
          - ["Gross", "Cobblestone, creeping fat, string sign", "Friable mucosa, lead pipe (no haustra)"]
          - ["Micro", "Noncaseating granulomas", "Crypt abscesses, no granulomas"]
          - ["Special", "Oxalate stones, gallstones, ASCA", "PSC, p-ANCA, toxic megacolon"]
        hide: [[0, 1], [0, 2], [1, 1], [3, 1], [3, 2], [4, 2]]
        page: 389
        quote: "Noncaseating granulomas, lymphoid aggregates. Crypt abscesses/ulcers, bleeding, no granulomas."
      - kind: sort
        prompt: "وزّع كل علامة"
        bins: ["Crohn disease", "Ulcerative colitis"]
        cards:
          - { text: "Enterovesical fistula", bin: 0 }
          - { text: "String sign", bin: 0 }
          - { text: "Rectal sparing", bin: 0 }
          - { text: "Lead pipe colon", bin: 1 }
          - { text: "Primary sclerosing cholangitis", bin: 1 }
          - { text: "Toxic megacolon", bin: 1 }
        why: "الـ Crohn transmural فبيعمل fistulas و strictures (string sign)، وبيتنطط. الـ UC سطحي ومستمر من الـ rectum، ومعاه PSC و toxic megacolon."
        page: 389
        quote: "Fulminant colitis, toxic megacolon, perforation."
      - kind: explain
        title: "المشترك بينهم"
        text: |-
          - **Extraintestinal**: جلد (pyoderma gangrenosum و erythema nodosum)، عين (episcleritis و uveitis)، بق (aphthous stomatitis)، مفاصل (peripheral و spondylitis).
          - الاتنين ممكن يعملوا malabsorption و **colorectal cancer**.
          - **Fecal calprotectin** بيتابع النشاط وبيفرّقهم عن الـ IBS.
          - علاج UC: **5-ASA** (mesalamine) و 6-MP و infliximab و colectomy. Crohn: glucocorticoids و azathioprine و antibiotics و biologics.
        page: 389
        quote: "Fecal calprotectin used to monitor activity and distinguish from noninflammatory diseases (irritable bowel)."
      - kind: check
        question: "An older woman has chronic watery diarrhea; colonoscopy looks normal. What will biopsy show?"
        options:
          - "Lymphocytic infiltrate or a thick subepithelial collagen band"
          - "Crypt abscesses with continuous ulceration"
          - "Noncaseating granulomas"
          - "PAS-positive foamy macrophages"
        answer: 0
        why:
          - "صح: microscopic colitis، المنظار طبيعي والتشخيص بالـ histology."
          - "ده UC، والمنظار مش هيبقى طبيعي."
          - "ده Crohn."
          - "ده Whipple."
        page: 389
        quote: "Colonic mucosa appears normal on endoscopy. Histology shows lymphocytic infiltrate in lamina propria with intraepithelial lymphocytosis or thickened subepithelial collagen band."
      - kind: try
