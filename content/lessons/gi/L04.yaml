        hook: "قاعدة الـ 2 بتاعة الكتاب للـ Meckel: true diverticulum من الـ vitelline duct، وأشهر congenital anomaly في الـ GI."
        page: 391
        quote: "The rule of 2’s: 2 times as likely in males. 2 inches long. 2 feet from the ileocecal valve. 2% of population. Commonly presents in first 2 years of life."
      - kind: reveal
        prompt: "طفل بينزل دم من غير وجع. ليه الـ Meckel scan (99mTc-pertechnetate) بيبيّن الـ Meckel؟"
        answer: "لأن الـ Meckel ممكن يكون فيه ==ectopic gastric mucosa== بتفرز حمض وتعمل قرحة في الـ ileum جنبها فتنزف. الـ pertechnetate بيتمسك في الـ gastric mucosa، فالجيب ينوّر."
        page: 391
        quote: "Diagnosis: 99m Tc-pertechnetate scan (also called Meckel scan) for uptake by heterotopic gastric mucosa."
      - kind: explain
        title: "Hirschsprung: الحتة اللي من غير أعصاب"
        text: |-
          الـ ==neural crest ما هاجرش== لآخر الـ colon ← مفيش ganglion cells (Auerbach و Meissner) ← الحتة دي مقفولة دايماً. مع **RET** mutation (الكتاب: RET mutation in the REcTum)، و ↑ مع Down.

          - المولود ما نزلش **meconium في 48 ساعة**، bilious emesis، انتفاخ.
          - الـ colon اللي قبلها بيتمدد (transition zone).
          - **Squirt sign**: تطلّع صباعك فالبراز ينفجر، والـ rectum فاضي.
          - التشخيص: rectal suction biopsy من غير ganglion cells. العلاج: resection.
        page: 391
        quote: "Explosive expulsion of feces (squirt sign) → empty rectum on digital exam. Diagnosed by absence of ganglion cells on rectal suction biopsy. Treatment: resection."
      - kind: check
        question: "A newborn has not passed meconium by 48 hours; the rectum is empty and an explosive stool follows the exam. Diagnosis test?"
        options:
          - "Rectal suction biopsy"
          - "99mTc-pertechnetate scan"
          - "Sweat chloride test only"
          - "Ultrasound for a target sign"
        answer: 0
        why:
          - "صح: Hirschsprung، والبيوبسي بتبين غياب الـ ganglion cells."
          - "الـ Meckel scan للـ Meckel diverticulum."
          - "الـ meconium ileus في الـ CF سبب تاني، بس الـ squirt sign ده Hirschsprung."
          - "الـ target sign للـ intussusception."
        page: 391
        quote: "Diagnosed by absence of ganglion cells on rectal suction biopsy."
      - kind: try
