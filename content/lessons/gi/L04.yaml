      - kind: explain
        title: "Porcelain gallbladder و cholangiocarcinoma"
        text: |-
          - **Porcelain gallbladder**: مرارة متكلسة من chronic cholecystitis، بتتشال وقائياً عشان ↑ ==gallbladder cancer==.
          - **Cholangiocarcinoma**: ورم من خلايا القنوات، أشهر مكان ==ملتقى الـ right و left hepatic ducts==. الـ risk: **PSC** و liver flukes (**Clonorchis**). بيبان متأخر؛ الـ histology glands مع desmoplastic stroma.
        page: 404
        quote: "Most common location is convergence of right and left hepatic ducts. Risk factors include 1° sclerosing cholangitis, liver fluke infections (eg, Clonorchis)."
      - kind: explain
        title: "Acute pancreatitis"
        text: |-
          البنكرياس بيهضم نفسه. الأسباب **I GET SMASHED**: Idiopathic و Gallstones و Ethanol و Trauma و Steroids و Mumps و Autoimmune و Scorpion sting و Hypercalcemia/Hypertriglyceridemia (>1000) و ERCP و Drugs.

          التشخيص ==2 من 3==: وجع epigastric رايح للضهر، amylase أو lipase (أدق) ≥3× الطبيعي، أو imaging.

          المضاعفات: **pseudocyst** (مبطن بـ ==granulation tissue== مش epithelium)، necrosis، ARDS، و **hypocalcemia** (الكالسيوم بيعمل صابون مع الدهون).
        page: 404
        quote: "Diagnosis by 2 of 3 criteria: acute epigastric pain often radiating to the back, serum amylase or lipase (more specific) to 3× upper limit of normal, or characteristic imaging findings."
      - kind: aside
        tone: exam
        text: "**Chronic pancreatitis**: alcohol و genetic (CF و SPINK1)، تكلسات. لما الوظيفة تقل عن 10% ← steatorrhea و fat-soluble vitamin deficiency و ==diabetes==. والـ amylase والـ lipase ممكن يبقوا طبيعيين."
        page: 404
        quote: "Major risk factors include alcohol use disorder and genetic predisposition (eg, cystic fibrosis, SPINK1 mutations); can be idiopathic. Complications include pancreatic insufficiency and pseudocysts."
