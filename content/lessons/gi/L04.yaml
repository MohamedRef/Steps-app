  - id: gi.L04.lesson8
    title: "دهون الكبد، الـ encephalopathy، والأورام"
    hook: "aspirin لطفل، كاس كل يوم، كرش وسكر: تلات طرق للكبد الدهني"
    minutes: 10
    pages: [398, 399]
    topics: [reye-syndrome, alcohol-associated-liver-disease, steatotic-liver-disease, autoimmune-hepatitis, hepatic-encephalopathy, liver-tumors]
    goals:
      - "تعرف Reye syndrome وليه ممنوع الـ aspirin للأطفال"
      - "ترتّب مراحل الـ alcoholic liver disease"
      - "تعرف MASLD و MASH"
      - "تعالج الـ hepatic encephalopathy"
      - "تفرّق بين أورام الكبد"
    status: unverified
    steps:
      - kind: explain
        title: "Reye syndrome"
        text: |-
          طفل عنده **VZV أو influenza** وأخد ==aspirin== ← hepatic encephalopathy نادرة وغالباً قاتلة.

          الآلية: الـ aspirin metabolites بتوقف الـ **β-oxidation** (reversible inhibition للـ mitochondrial enzymes) ← **microvesicular fatty liver** و hypoglycemia و hyperammonemia و coma و ↑ ICP.

          ممنوع الـ aspirin للأطفال ==ما عدا Kawasaki== (الكتاب: KawASAki).
        page: 398
        quote: "Associated with viral infection (especially VZV and influenza) that has been treated with aspirin. Aspirin metabolites ↓ β-oxidation by reversible inhibition of mitochondrial enzymes."
      - kind: mnemonic
        word: "SHINEE"
        parts:
          - { key: "S", text: "Steatosis of liver (microvesicular)" }
          - { key: "H", text: "Hypoglycemia / Hepatomegaly" }
          - { key: "I", text: "Infection (VZV, influenza)" }
          - { key: "N", text: "Not awake (coma)" }
          - { key: "E", text: "Encephalopathy" }
          - { key: "E", text: "diffuse cerebral Edema" }
        hook: "الكتاب: Salicylates aren't a ray (Reye) of sunSHINEE for kids."
        page: 398
        quote: "Steatosis of liver/hepatocytes Hypoglycemia/Hepatomegaly Infection (VZV, influenza) Not awake (coma) Encephalopathy and diffuse cerebral Edema"
      - kind: order
        prompt: "رتّب مراحل الـ alcohol-associated liver disease"
        steps:
          - "Steatosis: macrovesicular fat, reversible if he stops"
          - "Steatohepatitis: swollen necrotic hepatocytes, neutrophils, Mallory bodies"
          - "Cirrhosis: regenerative nodules with fibrous bands, usually irreversible"
        why: "الكحول بيعمل NADH كتير ← ↓ fatty acid oxidation و ↑ lipogenesis ← دهون. لو كمّل، الخلايا تتورم وتموت ويبان فيها Mallory bodies (keratin filaments بايظة). وفي الآخر fibrosis."
        page: 398
        quote: "Excess NADH production → ↓ fatty acid oxidation and ↑ lipogenesis."
      - kind: explain
        title: "MASLD و MASH"
        text: |-
          **MASLD** (اسمها القديم NAFLD): دهون في الكبد مع ==metabolic syndrome== (obesity و insulin resistance و hypertension و ↑ TG و ↓ HDL)، من غير التهاب أو fibrosis مهم. غالباً من غير أعراض وممكن تتحسن.

          **MASH**: لما يبقى في **lobular inflammation** و **hepatocyte ballooning** ← necrosis ← fibrosis، وممكن توصل cirrhosis و ==HCC==.
        page: 398
        quote: "Metabolic dysfunction–associated steatohepatitis (MASH)—associated with lobular inflammation, hepatocyte ballooning, and eventual necrosis → fibrosis. May progress to cirrhosis and HCC."
      - kind: explain
        title: "Autoimmune hepatitis"
        text: "أكتر في الستات. ممكن من غير أعراض أو تعب و nausea و pruritus. ↑ ALT و AST. الأجسام المضادة: ==anti-smooth muscle== أو **anti-LKM-1**. الـ histology: portal و periportal **lymphoplasmacytic infiltrate**."
        page: 399
        quote: "Often ⊕ for anti-smooth muscle or anti-liver/kidney microsomal-1 antibodies. Labs: ↑ ALT and AST. Histology: portal and periportal lymphoplasmacytic infiltrate."
      - kind: explain
        title: "Hepatic encephalopathy"
        text: |-
          cirrhosis ← portosystemic shunts ← الـ **NH3** مش بيتكسر ← المخ يتلخبط (reversible): من disorientation و **asterixis** لحد الـ coma.

          اسأل نفسك: الـ NH3 زاد ولا مش بيتشال؟
          - ==زاد==: GI bleed (بروتين الدم)، constipation، infection.
          - ==مش بيتشال==: renal failure، diuretics، بعد TIPS.

          العلاج: **lactulose** (بيحوّل NH3 لـ NH4+ يتحبس في الأمعاء) و **rifaximin** (بيقتل البكتيريا اللي بتعمل NH3).
        page: 399
        quote: "Treatment: lactulose (↑ NH + 4 generation) and rifaximin (↓ NH3 -producing gut bacteria)."
      - kind: check
        question: "A cirrhotic patient becomes confused after starting furosemide. Mechanism?"
        options:
          - "Decreased NH3 removal"
          - "Increased NH3 production from a GI bleed"
          - "Constipation raising NH3 absorption"
          - "Microvesicular steatosis"
        answer: 0
        why:
          - "صح: الـ diuretics في قايمة ↓ NH3 removal."
          - "مفيش نزيف هنا."
          - "الإمساك سبب تاني، بس الدوا الجديد هو المشتبه فيه."
          - "ده Reye."
        page: 399
        quote: "↓ NH3 removal (due to renal failure, diuretics, bypassed hepatic blood flow post-TIPS)."
      - kind: table
        title: "أورام الكبد"
        columns: ["Tumor", "Key point"]
        rows:
          - ["Hemangioma", "Most common benign; don't biopsy (bleeds)"]
          - ["Focal nodular hyperplasia", "Women 35-50; central stellate scar"]
          - ["Hepatic adenoma", "OCPs or anabolic steroids; may rupture → shock"]
          - ["Hepatocellular carcinoma", "HBV and any cirrhosis, aflatoxin; AFP; hematogenous"]
          - ["Angiosarcoma", "Arsenic, vinyl chloride"]
          - ["Metastases", "Most common malignant overall (GI, breast, lung)"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
        page: 399
        quote: "Metastases Most common malignant liver tumors overall; 1° sources include GI, breast, lung cancers. Metastases are rarely solitary."
      - kind: aside
        tone: exam
        text: "أشهر ورم **خبيث** في الكبد عموماً = ==metastases==، وأشهر ورم خبيث **primary** في الكبار = **HCC** (most common 1° malignant liver tumor in adults)، وأشهر ورم **حميد** = **hemangioma**. التلاتة بيتسألوا كده بالظبط."
        page: 399
        quote: "Also called hepatoma. Most common 1° malignant liver tumor in adults B . Associated with HBV (+/− cirrhosis)"
      - kind: try
        items: [gi.L04.141, gi.L04.145, gi.L04.148, gi.L04.153, gi.L04.156]
    recap:
      - "Reye: فيروس + aspirin، microvesicular fat، hypoglycemia؛ aspirin للأطفال بس في Kawasaki."
      - "Alcohol: steatosis ← steatohepatitis (Mallory) ← cirrhosis."
      - "MASLD مع metabolic syndrome؛ MASH ballooning ← cirrhosis و HCC."
      - "AIH: ست، anti-smooth muscle. HE: lactulose و rifaximin."
      - "Hemangioma حميد أشهر؛ adenoma مع OCP؛ HCC primary أشهر؛ metastases أشهر خبيث."
