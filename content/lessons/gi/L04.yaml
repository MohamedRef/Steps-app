        text: |-
          اسمه **HNPCC** يعني من غير polyps كتير. autosomal dominant في الـ ==mismatch repair genes== (MLH1 و MSH2) ← microsatellite instability.

          - ~80% بيعملوا CRC، و**الـ proximal colon** دايماً متأثر.
          - ومعاه سرطانات تانية: الكتاب بيقول ==Merrill Lynch has CEOSS==: Colon و Endometrial و Ovarian و Stomach و Skin.
        page: 395
