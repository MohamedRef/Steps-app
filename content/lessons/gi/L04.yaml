  - id: gi.L04.lesson9
    title: "الصفار: direct ولا indirect؟"
    hook: "HOT Liver، وبعدين اسأل نفسك الـ bilirubin اتعمله conjugation ولا لأ"
    minutes: 9
    pages: [400, 401]
    topics: [a1at-deficiency, jaundice, benign-neonatal-hyperbilirubinemia, biliary-atresia, hereditary-hyperbilirubinemias]
    goals:
      - "تعرف α1-antitrypsin deficiency في الكبد والرئة"
      - "تقسم أسباب الـ jaundice حسب النوع"
      - "تفهم صفار المولود والـ breast milk jaundice"
      - "تفرّق بين Gilbert و Crigler-Najjar و Dubin-Johnson و Rotor"
    status: unverified
    steps:
      - kind: explain
        title: "α1-antitrypsin deficiency: مرض واحد في عضوين"
        text: |-
          - **الكبد**: البروتين بيتعمل غلط وبيتكوّم جوّه الـ ==ER== ← cirrhosis و **PAS ⊕ globules**.
          - **الرئة**: البروتين مش واصل ← الـ elastase شغالة من غير فرامل ← ==panacinar emphysema==.

          تخيّل شاب ما بيدخنش عنده emphysema ومشاكل كبد: ده هو. codominant.
        page: 400
        quote: "Misfolded gene product protein aggregates in hepatocellular ER → cirrhosis with PAS ⊕ globules A in liver. Codominant trait."
      - kind: explain
        title: "الـ jaundice: HOT Liver"
        text: |-
          الصفار = bilirubin مترسب في الجلد والعين. يا إما ==بيتعمل كتير== يا إما ==مش بيتشال== (uptake أو conjugation أو excretion).

          أشهر الأسباب **HOT Liver**: Hemolysis و Obstruction و Tumor و Liver disease.
        page: 400
        quote: "HOT Liver—common causes of ↑ bilirubin level: Hemolysis Obstruction Tumor Liver disease"
      - kind: sort
        prompt: "وزّع على نوع الـ hyperbilirubinemia"
        bins: ["Conjugated (direct)", "Unconjugated (indirect)", "Mixed"]
        cards:
          - { text: "Gallstones", bin: 0 }
          - { text: "Dubin-Johnson", bin: 0 }
          - { text: "Primary biliary cholangitis", bin: 0 }
          - { text: "Hemolysis", bin: 1 }
          - { text: "Gilbert", bin: 1 }
          - { text: "Crigler-Najjar", bin: 1 }
          - { text: "Hepatitis", bin: 2 }
        why: "لو المشكلة قبل الـ conjugation (دم بيتكسر كتير أو UGT ضعيف) يبقى indirect. لو بعدها (excretion أو انسداد) يبقى direct. لو الخلية نفسها بايظة (hepatitis و cirrhosis) يبقى الاتنين."
        page: 400
        quote: "Unconjugated (indirect) hyperbilirubinemia Hemolytic, benign (neonates), Crigler-Najjar, Gilbert syndrome."
      - kind: reveal
        prompt: "ليه كل المواليد تقريباً بيصفّروا بعد أول 24 ساعة؟"
        answer: |-
          تلات أسباب:
          - **دم بيتكسر كتير**: hematocrit عالي و RBC عمرها قصير.
