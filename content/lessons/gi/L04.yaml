      - kind: reveal
        prompt: "ليه الـ hemochromatosis بتبان متأخر في الستات؟"
        answer: "الجسم مالوش طريقة يطلّع بيها الحديد غير النزيف. الست بتخسر حديد كل شهر مع ==الـ menstruation==، فالتراكم أبطأ. الأعراض بتبان لما الحديد يعدّي **20 g**، غالباً بعد الـ 40."
        page: 402
        quote: "Presents after age 40 when total body iron >20 g; iron loss through menstruation slows progression in females."
