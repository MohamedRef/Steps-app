          - ["Complications", "Bleeding, diverticulitis", "Abscess, colovesical fistula, obstruction, perforation"]
        hide: [[1, 1], [1, 2], [2, 2]]
        page: 390
        quote: "Inflammation of diverticula with wall thickening (red arrows in C ) classically causing LLQ pain, fever, leukocytosis."
      - kind: explain
        title: "Zenker: جيب في الحلق"
        text: "false diverticulum من نقطة ضعيفة اسمها ==Killian triangle== بين الـ thyropharyngeal والـ cricopharyngeal. راجل كبير بيشتكي من بلع صعب، **gurgling**، aspiration، ==ريحة بق وحشة== (أكل قديم في الجيب)، و neck mass."
        page: 391
        quote: "Presenting symptoms: dysphagia, obstruction, gurgling, aspiration, foul breath, neck mass. Most common in older males."
      - kind: mnemonic
        word: "222222"
        parts:
          - { key: "2", text: "2 times as likely in males" }
          - { key: "2", text: "2 inches long" }
          - { key: "2", text: "2 feet from the ileocecal valve" }
          - { key: "2", text: "2% of population" }
