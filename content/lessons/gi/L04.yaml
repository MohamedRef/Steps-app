  - id: gi.L04.lesson5
    title: "الأمعاء لما تتلف أو تتسد أو تجوع"
    hook: "التفافة، تلسكوب، شريان مسدود، أو بكتيريا في المكان الغلط"
    minutes: 10
    pages: [392, 393]
    topics: [malrotation, intussusception, volvulus, short-bowel-syndrome, other-intestinal-disorders]
    goals:
      - "تعرف الـ malrotation و intussusception و volvulus بالسن"
      - "تفرّق بين أنواع الـ mesenteric ischemia"
      - "تعرف NEC و SIBO و ileus"
    status: unverified
    steps:
      - kind: explain
        title: "Malrotation و volvulus"
        text: |-
          **Malrotation**: الـ midgut ما لفّش صح ← الأمعاء الدقيقة يمين والـ colon شمال، وفي **Ladd bands** ← ممكن تعمل ==volvulus== أو تسد الـ duodenum.

          **Volvulus** = جزء بيلف حوالين المساريقا بتاعته ← انسداد و infarction:
          - **Gastric**: كبار مع paraesophageal hernia؛ وجع جامد، dry heaving، والأنبوبة مش بتعدّي.
          - **Midgut**: الأطفال (minors).
          - **Sigmoid**: الكبار في السن (seniors)، و ==coffee bean sign==.
        page: 392
        quote: "Midgut volvulus more common in infants and children (minors) Sigmoid volvulus (coffee bean sign on x-ray A ) more common in older adults (seniors)"
      - kind: explain
        title: "Intussusception: تلسكوب"
        text: |-
          جزء بيدخل جوّه الجزء اللي بعده، غالباً عند الـ **ileocecal junction**، وغالباً في الرضع.

          - في الأطفال غالباً idiopathic: بعد viral infection (adenovirus) أو **rotavirus vaccine** ← ==Peyer patches بتتضخم== وتبقى lead point. أو Meckel أو hematoma من IgA vasculitis.
          - في الكبار: ==ورم==.

          الصورة: وجع متقطع، قيء، **currant jelly stools**، sausage-shaped mass يمين، والطفل بيشد رجليه لصدره. الـ ultrasound: **target sign**.
        page: 392
        quote: "Causes small bowel obstruction and vascular compromise → intermittent abdominal pain, vomiting, bloody “currant jelly” stools. Sausage-shaped mass in right abdomen on exam."
      - kind: check
        question: "An adult has intussusception. What is the usual lead point?"
        options:
          - "An intraluminal mass or tumor"
          - "Hypertrophied Peyer patches"
          - "Meckel diverticulum"
          - "Ladd bands"
        answer: 0
        why:
          - "صح: في الكبار دوّر على ورم."
          - "الـ Peyer patches في الأطفال بعد فيروس أو rotavirus vaccine."
          - "الـ Meckel lead point في الأطفال."
          - "الـ Ladd bands بتعمل malrotation و volvulus مش تلسكوب."
        page: 392
        quote: "Adults—intraluminal mass/tumor."
      - kind: table
        title: "الأمعاء لما الدم يقل"
        columns: ["", "Acute mesenteric", "Chronic mesenteric", "Colonic ischemia"]
        rows:
          - ["Cause", "Embolic SMA occlusion", "Atherosclerosis (SMA most)", "Watershed hypoperfusion"]
          - ["Clue", "Pain out of proportion to exam", "Postprandial pain → food fear, weight loss", "Crampy pain then hematochezia; thumbprint sign"]
          - ["Who", "AF, PAD, recent MI, CHF", "\"Intestinal angina\"", "Older adults"]
        hide: [[0, 1], [1, 1], [1, 2], [1, 3]]
        page: 393
        quote: "Critical blockage of intestinal blood flow (often embolic occlusion of SMA) → small bowel necrosis A → abdominal pain out of proportion to physical findings."
      - kind: reveal
        prompt: "ليه في الـ acute mesenteric ischemia الوجع جامد والبطن طرية؟"
        answer: "الأمعاء لسه بتموت من جوّه، والـ ischemia بتوجع وجع visceral شديد. الـ ==parietal peritoneum== لسه ما اتأثرش، فمفيش guarding ولا rebound. الكشف بيبان خفيف لحد ما الـ necrosis توصل للـ serosa."
        page: 393
        quote: "Critical blockage of intestinal blood flow (often embolic occlusion of SMA) → small bowel necrosis A → abdominal pain out of proportion to physical findings."
      - kind: explain
        title: "Angiodysplasia و ileus و SBO"
        text: |-
          - **Angiodysplasia**: أوعية متمددة ومتعرجة ← hematochezia، غالباً **يمين الـ colon**، في الكبار؛ مع ESRD و ==von Willebrand== و **aortic stenosis**.
          - **Ileus**: الأمعاء كسلانة من غير انسداد (مفيش transition zone)؛ بعد العمليات، opiates، **hypokalemia**، sepsis. العلاج bowel rest وتصحيح الأملاح و cholinergic drugs.
          - **SBO**: أشهر سبب ==adhesions== من عمليات قديمة، بعدها أورام و hernias. الأشعة: air-fluid levels.
        page: 393
        quote: "Most commonly caused by intraperitoneal adhesions (fibrous band of scar tissue), tumors, and hernias"
      - kind: explain
        title: "NEC و proctitis و SIBO"
        text: |-
          - **NEC**: مولود ==premature و formula-fed==؛ necrosis غالباً في الـ terminal ileum والـ proximal colon؛ الأشعة **pneumatosis intestinalis** وممكن portal venous gas.
          - **Proctitis**: التهاب الـ rectum من عدوى (gonorrhea و Chlamydia و HSV وغيره) أو IBD أو radiation؛ tenesmus ونزيف ووجع.
          - **SIBO**: بكتيريا كتير في الأمعاء الدقيقة؛ achlorhydria أو PPI، blind loop أو bypass، gastroparesis، IgA deficiency؛ انتفاخ وإسهال و B12 malabsorption. التشخيص carbohydrate breath test.
        page: 393
        quote: "Seen in premature, formula-fed infants with immature immune system. Necrosis of intestinal mucosa (most commonly terminal ileum and proximal colon), which can lead to pneumatosis intestinalis"
      - kind: match
        prompt: "وصّل كل حالة بعلامتها"
        pairs:
          - ["Sigmoid volvulus", "Coffee bean sign"]
          - ["Intussusception", "Target sign"]
          - ["Colonic ischemia", "Thumbprint sign"]
          - ["Necrotizing enterocolitis", "Pneumatosis intestinalis"]
          - ["Small bowel obstruction", "Air-fluid levels"]
        why: "العلامات دي بتتسأل كصورة. اربط كل واحدة بالآلية: اللفة شكلها حبة بن، والتلسكوب شكله حلقات، والـ edema بيعمل بصمات، والبكتيريا بتعمل غاز في الحيطة، والانسداد بيعمل مستويات مية وهوا."
        page: 393
        quote: "Thumbprint sign on imaging due to mucosal edema/hemorrhage."
      - kind: aside
        tone: exam
        text: "**Short bowel syndrome** بعد resection كبيرة: الـ bile salts والدهون مش بتتمص في الـ distal ileum ← إسهال كتير بعد الأكل و anemia و ==calcium oxalate stones==، نفس حكاية الـ Crohn."
        page: 392
        quote: "Malabsorption of bile salts and fat at the distal ileum → postprandial voluminous diarrhea, dehydration, weight loss, anemia, calcium oxalate kidney stones."
      - kind: try
        items: [gi.L04.087, gi.L04.090, gi.L04.093, gi.L04.097, gi.L04.100]
    recap:
      - "Malrotation و Ladd bands ← volvulus. Midgut في الأطفال، sigmoid في الكبار (coffee bean)."
      - "Intussusception: ileocecal، Peyer patches بعد rotavirus vaccine، currant jelly، target sign؛ في الكبار ورم."
      - "Acute mesenteric: SMA embolus، وجع أكبر من الكشف. Chronic: intestinal angina. Colonic: watershed و thumbprint."
      - "Angiodysplasia: يمين، von Willebrand و aortic stenosis. SBO: adhesions. NEC: premature و formula."
