      - kind: explain
        title: "الحصوات: نوعين"
        text: |-
          السبب: ↑ cholesterol أو bilirubin، ↓ bile salts، وركود المرارة.
          - **Cholesterol** (==80%==): غالباً radiolucent؛ obesity و estrogen و multiparity وخسارة وزن سريعة و fibrates.
          - **Pigment**: **black** (radiopaque، Ca bilirubinate) مع ==hemolysis== و cirrhosis؛ **brown** (radiolucent) مع العدوى.
        page: 403
        quote: "Pigment stones (black = radiopaque, Ca2+ bilirubinate, hemolysis; brown = radiolucent, infection). Associated with chronic hemolysis, alcohol-associated cirrhosis, biliary infections."
      - kind: aside
