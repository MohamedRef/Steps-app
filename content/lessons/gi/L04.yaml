lecture: gi.L04
lessons:
  - id: gi.L04.lesson1
    title: "البق والمريء: من الـ canker sore لحد الـ Barrett"
    hook: "الـ LES لو ما فتحش يبقى achalasia، ولو فتح زيادة يبقى GERD، والباقي تفاصيل"
    minutes: 10
    pages: [383, 385]
    topics: [oral-pathologies, achalasia, other-esophageal-pathologies, barrett-esophagus, esophageal-cancer]
    goals:
      - "تعرف أورام الغدد اللعابية الأشهر"
      - "تفهم الـ achalasia من الـ NO والـ VIP"
      - "تفرّق بين Mallory-Weiss و Boerhaave"
      - "تربط مكان سرطان المريء بنوعه وأسبابه"
    status: unverified
    steps:
      - kind: explain
        title: "البق في دقيقة"
        text: |-
          - **Aphthous ulcers** (canker sores): قرح صغيرة بتوجع عليها طبقة صفرا. لو بتتكرر فكّر في celiac و IBD و SLE و Behçet و HIV.
          - **Squamous cell carcinoma**: ==أشهر ورم خبيث في البق==، غالباً في اللسان، مع التدخين والكحول و HPV-16. قبله ممكن **leukoplakia** (بقعة بيضا) أو **erythroplakia** (حمرا).
          - **Sialolithiasis**: حصوة في قناة الغدة، الوجع والورم بيجوا مع الأكل.
        page: 383
        quote: "Most common malignancy of oral cavity. Usually affects the tongue. Associated with tobacco, alcohol, HPV-16."
      - kind: table
        title: "أورام الغدد اللعابية"
        columns: ["Tumor", "Key point"]
        rows:
          - ["Pleomorphic adenoma", "Most common; chondromyxoid stroma + epithelium; recurs if incompletely excised"]
          - ["Warthin tumor", "Benign, cystic, germinal centers; bilateral; smokers"]
          - ["Mucoepidermoid carcinoma", "Most common malignant; mucinous + squamous"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 383
        quote: "Pleomorphic adenoma (benign mixed tumor)—most common salivary gland tumor D. Composed of chondromyxoid stroma and epithelium and recurs if incompletely excised or ruptured intraoperatively."
      - kind: aside
        tone: tip
        text: "الكتاب: **Warriors from Germany love smoking** (Warthin = germinal centers = smokers). ولو في ورم غدة لعابية ومعاه facial paralysis أو وجع، فكّر إنه ==malignant==."
        page: 383
        quote: "Typically present as painless mass/ swelling. Facial paralysis or pain suggests malignant involvement."
      - kind: explain
        title: "Achalasia: الباب مش بيفتح"
        text: |-
          الـ LES المفروض يرتخي لما الأكل ييجي، واللي بيرخّيه أعصاب inhibitory فيها **NO** و **VIP** في الـ Auerbach plexus. لو الأعصاب دي ماتت ← الـ LES ==مش بيفتح== والـ peristalsis بايظة.

          - الأسباب: idiopathic، أو **Chagas** (T cruzi)، أو أورام.
          - صعوبة في البلع ==progressive للـ solids والـ liquids== مع بعض (الانسداد الميكانيكي بيبقى أساسًا للـ solids).
          - Manometry: ↑ LES resting pressure. Barium: **bird's beak**. ومعاه ↑ risk لسرطان المريء.
        page: 383
        quote: "Failure of LES to relax due to degeneration of inhibitory neurons (containing NO and VIP) in the myenteric (Auerbach) plexus of esophageal wall."
      - kind: check
        question: "Progressive dysphagia to both solids and liquids, with a bird's beak on barium swallow. What is lost?"
        options:
          - "Inhibitory NO/VIP neurons of the myenteric plexus"
          - "Smooth muscle of the distal esophagus by fibrosis"
          - "Squamous epithelium replaced by columnar"
          - "LES tone, transiently"
        answer: 0
        why:
          - "صح: achalasia، الأعصاب اللي بترخّي الـ LES راحت."
          - "الـ fibrosis ده scleroderma، وبيعمل ↓ LES pressure مش ↑."
          - "ده Barrett."
          - "الـ transient ↓ LES tone ده GERD."
        page: 383
        quote: "Presents with progressive dysphagia to solids and liquids (vs obstruction—primarily solids)."
      - kind: table
        title: "المريء: مين بيعمل إيه"
        columns: ["Condition", "Key feature"]
        rows:
          - ["GERD", "Transient ↓ LES tone; heartburn; may cause cough, hoarseness"]
          - ["Eosinophilic esophagitis", "Atopy; rings and linear furrows"]
          - ["Plummer-Vinson", "Dysphagia + iron deficiency anemia + esophageal webs; ↑ SCC"]
          - ["Distal esophageal spasm", "Corkscrew esophagus, normal LES; nitrates, CCBs"]
          - ["Scleroderma", "Fibrosis → ↓ LES pressure → reflux, stricture, Barrett"]
        hide: [[1, 1], [2, 1], [3, 1], [4, 1]]
        page: 384
        quote: "Triad of dysphagia, iron deficiency anemia, esophageal webs. ↑ risk of esophageal squamous cell carcinoma (\"Plumber dies\")."
      - kind: explain
        title: "Infectious esophagitis: كل واحد ليه شكل"
        text: |-
          - **Candida** (الأشهر): ==white pseudomembranes==.
          - **HSV-1**: قرح **punched-out**.
          - **CMV**: قرح **linear**.

          والدوا كمان ممكن يعمل esophagitis: bisphosphonates و tetracyclines و NSAIDs و ferrous sulfate و potassium chloride (بيقعدوا في المريء ويحرقوه).
        page: 384
        quote: "Infectious esophagitis—Candida (most common; white pseudomembranes A ), HSV-1 (punched-out ulcers), CMV (linear ulcers)."
      - kind: reveal
        prompt: "مريض كحولي رجّع جامد. إمتى تقول Mallory-Weiss وإمتى Boerhaave؟"
        answer: |-
          - **Mallory-Weiss**: شرخ ==partial thickness== طولي عند الـ GE junction (mucosa و submucosa بس) ← **hematemesis**.
          - **Boerhaave**: قطع ==transmural== في المريء من تحت ← هوا في الـ mediastinum و **subcutaneous emphysema** (crepitus في الرقبة). ده طوارئ.
        page: 384
        quote: "Boerhaave syndrome—transmural, usually distal esophageal rupture due to violent retching."
      - kind: figure
        title: "سرطان المريء: فوق ولا تحت؟"
        svg: |-
          <svg viewBox="0 0 360 206" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="150" y="10" width="40" height="180" rx="12"/>
            <rect class="fg-acc" x="150" y="10" width="40" height="120" rx="12"/>
            <rect class="fg-bad" x="150" y="130" width="40" height="60" rx="12"/>
            <text x="140" y="50" class="t-sm t-b" text-anchor="end">Upper 2/3</text>
            <text x="140" y="68" class="t-sm" text-anchor="end">Squamous cell carcinoma</text>
            <text x="140" y="86" class="t-sm t-mut" text-anchor="end">alcohol, hot liquids,</text>
            <text x="140" y="102" class="t-sm t-mut" text-anchor="end">smoking, achalasia,</text>
            <text x="140" y="118" class="t-sm t-mut" text-anchor="end">nitrosamines</text>
            <text x="200" y="150" class="t-sm t-b">Lower 1/3</text>
            <text x="200" y="168" class="t-sm">Adenocarcinoma</text>
            <text x="200" y="184" class="t-sm t-mut">GERD → Barrett,</text>
            <text x="200" y="198" class="t-sm t-mut">obesity, smoking</text>
          </svg>
        caption: "فوق (2/3) squamous، وده الأشهر في العالم. تحت (1/3) adenocarcinoma جاي من الـ GERD والـ Barrett، وده الأشهر في أمريكا."
        alt: "Esophagus drawn vertically: upper two thirds labeled squamous cell carcinoma with its risk factors; lower third labeled adenocarcinoma with GERD, Barrett, obesity and smoking."
        page: 385
        quote: "Squamous cell carcinoma Upper 2/3 Alcohol, hot liquids, caustic strictures, smoking, achalasia, nitrosamine-rich foods More common worldwide"
      - kind: explain
        title: "Barrett: المريء بيلبس لبس الأمعاء"
        text: |-
          الحمض لما يفضل يحرق الـ squamous epithelium سنين، الجسم بيبدّله بـ ==intestinal epithelium== (columnar من غير cilia ومعاه **goblet cells**) يستحمل أكتر. ده **metaplasia**، وبيزوّد الخطر لـ **adenocarcinoma**.

          وسرطان المريء عموماً عدواني لأن المريء ==مالوش serosa==، فالورم بيمتد بسرعة.
        page: 385
        quote: "replacement of nonkeratinized stratified squamous epithelium with intestinal epithelium (nonciliated columnar with goblet cells [arrows in B ]) in distal esophagus. Due to chronic gastroesophageal reflux disease (GERD)."
      - kind: try
        items: [gi.L04.006, gi.L04.011, gi.L04.014, gi.L04.016, gi.L04.026]
    recap:
      - "أشهر ورم خبيث في البق SCC؛ أشهر ورم لعابي pleomorphic adenoma؛ Warthin مع التدخين."
      - "Achalasia: NO/VIP راحوا، solids و liquids، bird's beak، Chagas."
      - "Candida بيضا، HSV punched-out، CMV linear؛ eosinophilic مع atopy."
      - "Mallory-Weiss partial و hematemesis؛ Boerhaave transmural وهوا."
      - "Barrett ← adenocarcinoma تحت؛ SCC فوق."
    practice: [gi.L04.001, gi.L04.002, gi.L04.003, gi.L04.004, gi.L04.005, gi.L04.006, gi.L04.007, gi.L04.008, gi.L04.009, gi.L04.010, gi.L04.011, gi.L04.012, gi.L04.013, gi.L04.014, gi.L04.015, gi.L04.016, gi.L04.017, gi.L04.018, gi.L04.019, gi.L04.020, gi.L04.021, gi.L04.022, gi.L04.023, gi.L04.024, gi.L04.025, gi.L04.026, gi.L04.027]
  - id: gi.L04.lesson2
    title: "المعدة: gastritis وقرح وسرطان"
    hook: "حرق، مخ، دوا، بكتيريا، أو مناعة: كل سبب ليه قرحة بشكل"
    minutes: 10
    pages: [386, 387]
    topics: [gastritis, menetrier-disease, gastric-cancer, peptic-ulcer-disease, ulcer-complications, acute-gi-bleeding]
    goals:
      - "تفرّق بين Curling و Cushing ulcer"
      - "تقارن H pylori بالـ autoimmune gastritis"
      - "تعرف نوعين الـ gastric cancer وأسماء الـ metastases"
      - "تعرف أي شريان بينزف من أي قرحة"
    status: unverified
    steps:
      - kind: table
        title: "Acute gastritis: تلات أسباب"
        columns: ["Cause", "Mechanism"]
        rows:
          - ["NSAIDs", "↓ PGE2 → ↓ mucosal protection"]
          - ["Burns (Curling ulcer)", "Hypovolemia → mucosal ischemia"]
          - ["Brain injury (Cushing ulcer)", "↑ vagal stimulation → ↑ ACh → ↑ H+"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 386
        quote: "Burns (Curling ulcer)—hypovolemia → mucosal ischemia Brain injury (Cushing ulcer)—↑ vagal stimulation → ↑ ACh → ↑ H+ production"
      - kind: aside
        tone: tip
        text: "الكتاب: **Burned by the Curling iron** (الحرق = Curling) و **Always Cushion the brain** (المخ = Cushing)."
        page: 386
        quote: "Burned by the Curling iron Always Cushion the brain"
      - kind: table
        title: "Chronic gastritis: نوعين"
        columns: ["", "H pylori", "Autoimmune"]
        rows:
          - ["Where", "Antrum first → body", "Body/fundus"]
          - ["Mechanism", "Infection (most common)", "Antibodies to H+/K+-ATPase and intrinsic factor"]
          - ["Risk", "Peptic ulcer, MALT lymphoma", "Pernicious anemia"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
        page: 386
        quote: "Autoantibodies (T-cell induced) to the H+ /K+ -ATPase on parietal cells and to intrinsic factor. ↑ risk of pernicious anemia Affects body/fundus of stomach"
      - kind: explain
        title: "Ménétrier: معدة شكلها مخ"
        text: |-
          ==Hyperplasia== في الـ mucosa بتاعة الـ fundus والـ body (الـ antrum سليم) ← rugae ضخمة "wavy" زي تلافيف المخ.

          - mucus كتير ← **protein loss** ← edema.
          - الـ parietal cells بتضمر ← **↓ acid**.
          - precancerous. الأعراض **WAVEE**: Weight loss و Anorexia و Vomiting و Epigastric pain و Edema.
        page: 386
        quote: "Presents with Weight loss, Anorexia, Vomiting, Epigastric pain, Edema (due to protein loss; pronounce “WAVEE”)."
      - kind: table
        title: "Gastric adenocarcinoma: نوعين"
        columns: ["", "Intestinal", "Diffuse"]
        rows:
          - ["H pylori", "Yes", "No"]
          - ["Cause", "Nitrosamines (smoked foods), smoking, achlorhydria, chronic gastritis", "E-cadherin mutation"]
          - ["Look", "Lesser curvature, ulcer with raised margins", "Signet ring cells, linitis plastica (leathery wall)"]
        hide: [[1, 2], [2, 1], [2, 2]]
        page: 386
        quote: "Diffuse—not associated with H pylori; most cases due to E-cadherin mutation; signet ring cells (mucin-filled cells with peripheral nuclei) A ; stomach wall grossly thickened and leathery (linitis plastica)."
      - kind: match
        prompt: "كل metastasis من المعدة راحت فين؟"
        pairs:
          - ["Virchow node", "Left supraclavicular node"]
          - ["Krukenberg tumor", "Both ovaries"]
          - ["Sister Mary Joseph nodule", "Periumbilical skin"]
          - ["Blumer shelf", "Rectouterine pouch"]
          - ["Irish node", "Left axillary node"]
        why: "الـ gastric cancer بيقدّم متأخر بـ WEAPON (Weight loss و Early satiety و Abdominal Pain و Obstruction و acanthosis Nigricans أو Leser-Trélat)، فغالباً بتكتشفه من الـ metastasis."
        page: 386
        quote: "Virchow node—involvement of left supraclavicular node by metastasis from stomach."
      - kind: check
        question: "A rigid, leathery stomach with signet ring cells, H pylori negative. Which gene?"
        options:
          - "E-cadherin"
          - "APC"
          - "KIT"
          - "MLH1"
        answer: 0
        why:
          - "صح: الـ diffuse type، أغلبه E-cadherin mutation."
          - "APC بتاع الـ colon."
          - "KIT بتاع الـ GIST."
          - "MLH1 بتاع الـ Lynch والـ serrated pathway."
        page: 386
        quote: "Diffuse—not associated with H pylori; most cases due to E-cadherin mutation"
      - kind: table
        title: "Gastric ولا duodenal ulcer؟"
        columns: ["", "Gastric", "Duodenal"]
        rows:
          - ["Pain with meals", "Can be worse → weight loss", "Better → weight gain"]
          - ["H pylori", "~70%", "~90%"]
          - ["Other cause", "NSAIDs", "Zollinger-Ellison"]
          - ["Cancer?", "↑ risk; biopsy margins", "Generally benign"]
        hide: [[0, 1], [0, 2], [2, 1], [2, 2]]
        page: 387
        quote: "PAIN Can be greater with meals—weight loss Decreases with meals—weight gain H PYLORI INFeCTION ~70% ~90%"
      - kind: reveal
        prompt: "ليه قرحة الـ duodenum الـ anterior بتخرّم، والـ posterior بتنزف؟"
        answer: |-
          - **Anterior**: قدّامها الـ peritoneal cavity على طول، فلو خرّمت ← ==free air تحت الحجاب== ووجع في الكتف (phrenic nerve).
          - **Posterior**: وراها الـ **gastroduodenal artery**، فلو كلت فيه ← ==نزيف==.
          - على الـ lesser curvature: **left gastric**. ورا المعدة في الـ lesser sac: **short gastric**.
        page: 387
        quote: "Left gastric: lesser curvature of stomach Short gastric: posterior wall of stomach into lesser sac Gastroduodenal: posterior wall of first portion of duodenum"
      - kind: explain
        title: "Upper ولا lower GI bleed؟"
        text: |-
          الحد هو ==ligament of Treitz== (suspensory ligament of duodenum).
          - **Upper** (قبله): hematemesis و/أو **melena**؛ peptic ulcer و varices.
          - **Lower** (بعده): **hematochezia**؛ IBD و diverticulosis و angiodysplasia و hemorrhoids و fissure و cancer.
        page: 387
        quote: "Upper GI bleeding—originates proximal to ligament of Treitz (suspensory ligament of duodenum). Usually presents with hematemesis and/or melena."
      - kind: try
        items: [gi.L04.028, gi.L04.031, gi.L04.036, gi.L04.040, gi.L04.042]
    recap:
      - "Curling = حرق ← ischemia؛ Cushing = مخ ← vagus و حمض؛ NSAIDs ← ↓ PGE2."
      - "H pylori: antrum، ulcer، MALT. Autoimmune: body، pernicious anemia."
      - "Ménétrier: rugae ضخمة، protein loss، ↓ acid، WAVEE."
      - "Diffuse gastric = E-cadherin و signet ring؛ Virchow و Krukenberg و Sister Mary Joseph."
      - "Posterior duodenal ← نزيف GDA؛ anterior ← perforation."
