        why: "الـ type I هو الـ IgE اللي متثبت مسبقاً على الـ mast cells، فالـ allergen بيعمل degranulation في دقايق (anaphylaxis، asthma). في الـ type II الـ antibody بيمسك antigen ثابت على سطح خلية أو في الـ matrix: الـ basement membrane في Goodpasture، والـ RBC في AIHA، والـ receptor في Graves و myasthenia."
        page: 110
        quote: "Example: ▘ Anaphylaxis (eg, food, drug, or bee sting allergies) ▘ Allergic asthma Type II hypersensitivity Fc receptor for IgG Surface antigen NK cell Antibodies bind to cell-surface antigens or extracellular matrix → cellular destruction, inflammation, and cellular dysfunction. Cellular destruction—cell is opsonized (coated) by antibodies, leading to either: ▘ Phagocytosis and/or activation of complement system. ▘ NK cell killing (antibody-dependent cellular cytotoxicity). Inflammation—binding of antibodies to cell surfaces → activation of complement system and Fc receptor-mediated inflammation. Cellular dysfunction—antibodies bind to cell-surface receptors → abnormal blockade or activation of downstream process. Direct Coombs test—detects antibodies attached directly to the RBC surface. Indirect Coombs test—detects presence of unbound antibodies in the serum. Examples: ▘ Autoimmune hemolytic anemia (including drug-induced form) ▘ Immune thrombocytopenia ▘ Transfusion reactions ▘ Hemolytic disease of the newborn Examples: ▘ Goodpasture syndrome ▘ Rheumatic fever ▘ Hyperacute transplant rejection Examples: ▘ Myasthenia gravis ▘ Graves disease ▘ Pemphigus vulgaris"
