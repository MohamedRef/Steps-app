          - { key: "I", text: "Influenza (intranasal)" }
          - { key: "M", text: "MMR" }
          - { key: "R", text: "Rotavirus" }
        hook: "الكتاب: Attention Teachers! Please Vaccinate Small, Beautiful Young Infants with MMR Routinely!"
        page: 109
        quote: "Adenovirus (nonattenuated, given to military recruits), typhoid (Ty21a, oral), polio (Sabin), varicella (chickenpox), smallpox, BCG, yellow fever, influenza (intranasal), MMR, rotavirus."
      - kind: explain
        title: "الباقي"
        text: |-
          - **Killed/inactivated**: آمن، بس ==humoral بس تقريباً== ومحتاج boosters. «**A TRIP** could **K**ill you»: hep A، Typhoid (Vi IM)، Rabies، Influenza (IM)، Polio (Sal**K**).
          - **Subunit/recombinant/polysaccharide/conjugate**: antigens محددة ← side effects أقل، بس غالي وأضعف. HBV (HBsAg)، HPV، aP، N meningitidis، S pneumoniae، Hib، zoster.
          - **Toxoid**: toxin مدمّر بس الـ receptor site سليم: tetanus و diphtheria. محتاج boosters.
          - **mRNA**: lipid nanoparticle بتوصّل mRNA. فعال جداً، cellular و humoral، و ==آمن في الحمل==. نادراً myocarditis في الشباب الذكور. SARS-CoV-2، RSV، CMV، melanoma.
        page: 109
