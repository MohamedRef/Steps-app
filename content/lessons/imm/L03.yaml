        text: |-
          - **Bruton (X-linked) agammaglobulinemia**: ==BTK== بايظ ← الـ B cells ما بتكبرش. ولاد، العدوى (bacterial و enteroviral) تبدأ ==بعد 6 شهور== لما الـ maternal IgG يخلص. مفيش B cells، كل الـ Ig واطي، والـ lymph nodes والـ tonsils تقريباً مش موجودة. الـ live vaccines ممنوعة.
          - **Selective IgA deficiency**: ==أشهر primary immunodeficiency==. أغلبهم Asymptomatic؛ ممكن Airway و GI infections، Autoimmune (celiac)، Atopy، و Anaphylaxis للـ IgA في الدم. ↑ giardiasis، و false-negative celiac test.
          - **CVID**: عيب في الـ B-cell differentiation، غالباً بيتشخص بعد البلوغ. ↓ plasma cells و Ig، و ↑ autoimmune و bronchiectasis و lymphoma.
        page: 114
        quote: "Most common 1° immunodeficiency May also arise 2° to certain viral infections or medications Majority Asymptomatic Can see Airway and GI infections, Autoimmune disease (eg, celiac disease), Atopy, Anaphylaxis to IgA in blood products"
      - kind: reveal
        prompt: "مريض عنده selective IgA deficiency اتنقله دم. ليه ممكن يعمل anaphylaxis؟"
        answer: "جسمه ما شافش IgA قبل كده، فبيعتبره بروتين غريب ويعمل ==anti-IgA (IgE)==. أول ما يتنقله دم فيه IgA، الـ IgE يربط على الـ mast cells ← anaphylaxis. عشان كده بيحتاجوا blood products من غير IgA."
        page: 114
        quote: "Anaphylaxis to IgA in blood products"
      - kind: explain
        title: "T-cell disorders"
        text: |-
          - **DiGeorge (thymic aplasia)**: ==22q11 microdeletion== ← الـ 3rd و 4th pharyngeal pouches ما اتكونوش ← مفيش thymus ولا parathyroids. ↓ T cells، ↓ PTH، ↓ Ca، ومفيش thymic shadow.
          - **IL-12 receptor deficiency** (AR): ↓ Th1 و ↓ IFN-γ ← ==disseminated mycobacteria== و fungi، ممكن بعد الـ BCG. أشهر سبب لـ MSMD.
          - **Hyper-IgE (Job) syndrome** (AD): **STAT3** ← ↓ Th17 ← الـ neutrophils ما بتتجمعش ← abscesses باردة.
          - **Chronic mucocutaneous candidiasis**: T cells مش قادرة على Candida؛ الشكل الكلاسيكي من **AIRE**.
        page: 114
        quote: "22q11 microdeletion; failure to develop 3rd and 4th pharyngeal pouches → absent thymus and parathyroids"
      - kind: mnemonic
        word: "CATCH"
        parts:
          - { key: "C", text: "Cardiac defects (conotruncal: tetralogy, truncus)" }
          - { key: "A", text: "Abnormal facies" }
          - { key: "T", text: "Thymic hypoplasia → viral/fungal infections" }
          - { key: "C", text: "Cleft palate" }
          - { key: "H", text: "Hypocalcemia (parathyroid aplasia) → tetany" }
        hook: "الكتاب: CATCH-22، والـ 22 هو 22q11"
        page: 114
        quote: "CATCH-22: Cardiac defects (conotruncal abnormalities [eg, tetralogy of Fallot, truncus arteriosus]), Abnormal facies, Thymic hypoplasia → T-cell deficiency (recurrent viral/ fungal infections), Cleft palate, Hypocalcemia 2° to parathyroid aplasia → tetany"
      - kind: figure
        title: "Job: ABCDEF"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="imm3d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-bad" x="10" y="15" width="80" height="34" rx="6"/><text x="20" y="37" class="t-b">STAT3</text>
            <path class="fg-arrow-bad" d="M90 32 L 125 32" marker-end="url(#imm3d)"/>
            <rect class="fg-bad" x="127" y="15" width="80" height="34" rx="6"/><text x="137" y="37" class="t-b">↓ Th17</text>
            <path class="fg-arrow-bad" d="M207 32 L 242 32" marker-end="url(#imm3d)"/>
            <rect class="fg-bad" x="244" y="15" width="106" height="34" rx="6"/><text x="250" y="37" class="t-sm t-b">no neutrophils</text>
            <text x="20" y="75" class="t-sm"><tspan class="t-b">A</tspan>: cold staph abscesses</text>
            <text x="20" y="95" class="t-sm"><tspan class="t-b">B</tspan>: retained baby teeth</text>
            <text x="20" y="115" class="t-sm"><tspan class="t-b">C</tspan>: coarse facies</text>
            <text x="190" y="75" class="t-sm"><tspan class="t-b">D</tspan>: dermatologic (eczema)</text>
            <text x="190" y="95" class="t-sm"><tspan class="t-b">E</tspan>: ↑ IgE, eosinophils</text>
            <text x="190" y="115" class="t-sm"><tspan class="t-b">F</tspan>: fractures</text>
          </svg>
        caption: "الـ STAT3 بايظ ← مفيش Th17 ← الـ IL-17 ما بيجيبش neutrophils ← abscesses «باردة» من غير التهاب. الكتاب: Learn the ABCDEF's to get a Job STAT!"
        alt: "STAT3 mutation leads to fewer Th17 cells and no neutrophil recruitment. Features listed A to F: cold staph abscesses, retained baby teeth, coarse facies, dermatologic problems, raised IgE and eosinophils, fractures."
        page: 114
        quote: "Cold (noninflamed) staphylococcal Abscesses, retained Baby teeth, Coarse facies, Dermatologic problems (eczema), ↑ IgE, bone Fractures from minor trauma"
      - kind: check
        question: "An infant develops disseminated mycobacterial infection after BCG vaccination. IFN-γ is low. Which defect?"
        options:
          - "IL-12 receptor deficiency"
          - "BTK deficiency"
          - "Selective IgA deficiency"
          - "C1 inhibitor deficiency"
        answer: 0
        why:
          - "صح: من غير IL-12 receptor مفيش Th1 ولا IFN-γ، فالـ macrophages ما تقدرش على الـ mycobacteria."
          - "BTK = Bruton، bacterial و enteroviral."
          - "IgA deficiency غالباً asymptomatic."
          - "C1 inhibitor = angioedema."
        page: 114
        quote: "Disseminated mycobacterial and fungal infections; may present after administration of BCG vaccine"
      - kind: try
        items: [imm.L03.087, imm.L03.088, imm.L03.091, imm.L03.094, imm.L03.095]
    recap:
      - "Anti-dsDNA/Smith = SLE؛ antihistone = drug-induced؛ anticentromere = CREST؛ c-ANCA = GPA."
      - "Bruton = BTK، ولد بعد 6 شهور، مفيش B cells. IgA deficiency = الأشهر، anaphylaxis للدم."
      - "DiGeorge = 22q11 و CATCH-22؛ IL-12R = mycobacteria؛ Job = STAT3 و ABCDEF."
