schema: steps.lesson/v1
lecture: imm.L03
lessons:
  - id: imm.L03.lesson1
    title: "الـ antibody: إيد بتمسك وديل بيشاور"
    hook: "افهم الـ Fab والـ Fc مرة، وكل isotype هيبقى له شخصية تفتكرها"
    minutes: 9
    pages: [102, 103]
    topics: [antibody-structure-and-function, immunoglobulin-isotypes, antigen-type-and-memory]
    goals:
      - "تعرف مين بيمسك الـ antigen ومين بيشغّل الـ complement"
      - "تفهم الـ diversity بتيجي منين قبل وبعد الـ antigen"
      - "تميّز الـ 5 isotypes من وصف واحد"
      - "تفهم ليه الـ polysaccharide vaccines ضعيفة"
    status: unverified
    steps:
      - kind: explain
        title: "شكل الـ Y"
        text: |-
          الـ antibody شكله **Y**: سلسلتين heavy وسلسلتين light.

          - الـ ==Fab== (الدراعين): فيه heavy و light، وهو اللي بيمسك الـ antigen، وبيحدد الـ **idiotype** (مكان المسك).
          - الـ ==Fc== (الرجل): heavy بس، وهو اللي بيكلّم باقي المناعة. الـ Fc بتاع **IgM و IgG** بيشغّل الـ complement.
          - الـ **hinge** في النص بيدّي مرونة، فالدراعين يمسكوا epitopes كتير في نفس الوقت.
        page: 102
        quote: "Fab fragment consisting of light (L) and heavy (H) chains recognizes antigens. Fc region of IgM and IgG fixes complement. Heavy chain contributes to Fc and Fab regions. Light chain contributes only to Fab region."
      - kind: figure
        title: "Fab و Fc"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="180" y1="110" x2="110" y2="30" stroke-width="10"/>
            <line class="fg-ink" x1="180" y1="110" x2="250" y2="30" stroke-width="10"/>
            <line class="fg-thin" x1="160" y1="110" x2="95" y2="40" stroke-width="6"/>
            <line class="fg-thin" x1="200" y1="110" x2="265" y2="40" stroke-width="6"/>
            <line class="fg-ink" x1="180" y1="110" x2="180" y2="195" stroke-width="12"/>
            <circle class="fg-dot-acc" cx="105" cy="25" r="8"/>
            <circle class="fg-dot-acc" cx="255" cy="25" r="8"/>
            <text x="20" y="30" class="t-sm t-acc">antigen site</text>
            <text x="20" y="80" class="t-sm t-b">Fab: H + L chains</text>
            <text x="190" y="118" class="t-sm">hinge</text>
            <text x="192" y="160" class="t-sm t-b">Fc: H chains only</text>
            <text x="192" y="178" class="t-sm">complement and</text>
            <text x="192" y="194" class="t-sm">macrophage binding</text>
            <text x="276" y="72" class="t-sm t-mut">light chain</text>
            <text x="276" y="88" class="t-sm t-mut">(dashed)</text>
          </svg>
        caption: "الدراعين (Fab) فيهم heavy و light وفي آخرهم مكان مسك الـ antigen. الرجل (Fc) heavy بس، وعليها مكان الـ complement وبتلزق في الـ macrophages."
        alt: "A Y-shaped antibody: two Fab arms made of heavy and light chains with antigen-binding sites at the tips, a hinge in the middle, and an Fc stem made of heavy chains only that binds complement and macrophages."
        page: 102
        quote: "Fab: Fragment, antigen binding Determines idiotype: antigen binding site. Hinge region: provides flexibility between Fab arms, allowing simultaneous binding to multiple epitopes"
      - kind: mnemonic
        word: "CCCCC"
        parts:
          - { key: "C", text: "Constant" }
          - { key: "C", text: "Carboxy terminal" }
          - { key: "C", text: "Complement binding" }
          - { key: "C", text: "Carbohydrate side chains" }
          - { key: "C", text: "Confers isotype (IgM, IgD, etc.)" }
        hook: "الكتاب: الـ Fc فيه 5 C's"
        page: 102
        quote: "Fc (5 C’s): Constant Carboxy terminal Complement binding Carbohydrate side chains Confers (determines) isotype (IgM, IgD, etc)"
      - kind: explain
        title: "الـ diversity بتيجي منين؟"
        text: |-
          **قبل الـ antigen** (antigen independent):
          - ==RAG1 و RAG2== بيعملوا random recombination للـ VJ (light) والـ V(D)J (heavy).
          - الـ **TdT** بيزوّد nucleotides عشوائية في المفاصل.
          - أي heavy ممكن يتجوز أي light.

          **بعد الـ antigen** (antigen dependent):
          - **Somatic hypermutation و affinity maturation** في الـ variable region.
          - **Isotype switching** في الـ constant region.
        page: 102
        quote: "Random recombination of VJ (light-chain) or V(D)J (heavy-chain) genes by RAG1 and RAG2 2. Random addition of nucleotides to DNA during recombination by terminal deoxynucleotidyl transferase (TdT)"
      - kind: check
        question: "Which process happens only after antigen exposure?"
        options:
          - "Somatic hypermutation"
          - "RAG-mediated V(D)J recombination"
          - "TdT nucleotide addition"
          - "Random heavy–light chain pairing"
        answer: 0
        why:
          - "صح: الـ somatic hypermutation والـ isotype switching بيحصلوا بعد ما الـ B cell تقابل الـ antigen."
          - "الـ V(D)J بيحصل أثناء تطوّر الخلية، قبل أي antigen."
          - "الـ TdT برضه antigen independent."
          - "الـ pairing العشوائي قبل الـ antigen."
        page: 102
        quote: "Generation of antibody specificity (antigen dependent) 4. Somatic hypermutation and affinity maturation (variable region) 5. Isotype switching (constant region)"
      - kind: explain
        title: "الـ antibody بيعمل إيه؟"
        text: |-
          3 شغلانات:
          - **Neutralization**: بيمنع الـ bacteria تلزق.
          - **Opsonization**: بيعلّم الجرثومة عشان الـ phagocyte ياكلها.
          - **Complement activation**: يشغّل الـ complement ← C3b (opsonization) و MAC (lysis).

          و**IgMom و IgDad** على الـ naïve B cell، وبعد الـ switch (بالـ cytokines و ==CD40L==) يطلع plasma cells تعمل IgA أو IgG أو IgE: «mature as they **AGE**».
        page: 103
        quote: "Mature, naïve B cells prior to activation express IgM and IgD on their surfaces. They may differentiate in germinal centers of lymph nodes by isotype switching (gene rearrangement; induced by cytokines and CD40L) into plasma cells that secrete IgA, IgG, or IgE."
      - kind: table
        title: "شخصية كل isotype"
        columns: ["Isotype", "Signature"]
        rows:
          - ["IgG", "Most abundant in serum; 2° response; only one to cross placenta; warm AIHA"]
          - ["IgA", "Mucosa; dimer + J chain + secretory component; most produced overall; breast milk"]
          - ["IgM", "First made; pentamer (avid binding); fixes complement; cold AIHA"]
          - ["IgD", "On naïve B cells; low serum level"]
          - ["IgE", "Mast cells and basophils; type I; parasites via eosinophils"]
        hide: [[0, 1], [1, 1], [2, 1], [4, 1]]
        page: 103
        quote: "Main antibody in 2° response to an antigen. Most abundant isotype in serum. Fixes complement, opsonizes bacteria, neutralizes bacterial toxins and viruses. Only isotype that crosses the placenta"
      - kind: aside
        tone: tip
        text: "حيل الكتاب: «==IgG Greets the Growing fetus==» (الوحيد اللي بيعدّي الـ placenta)، و warm AIHA = IgG لأن «warm weather is **G**ood!». والـ cold AIHA بالـ IgM."
        page: 103
        quote: "Only isotype that crosses the placenta (provides infants with passive immunity that starts to wane after birth). “IgG Greets the Growing fetus.” Associated with warm autoimmune hemolytic anemia (“warm weather is Good!”)."
      - kind: reveal
        prompt: "الـ IgA هو أكتر antibody الجسم بيعمله، بس مستواه في الدم أقل من IgG. إزاي؟"
        answer: "لأن معظمه بيتبعت **برّه**: في الـ tears والـ saliva والـ mucus واللبن. بيعدّي الـ epithelium بالـ ==transcytosis== وياخد معاه الـ **secretory component** اللي بيحمي الـ Fc من الـ proteases في الأمعاء. وده اللي بيحمي من **Giardia**."
        page: 103
        quote: "Most produced antibody overall, but has lower serum concentrations. Released into secretions (tears, saliva, mucus) and breast milk. Picks up secretory component from epithelial cells, which protects the Fc portion from luminal proteases."
      - kind: explain
        title: "Affinity و avidity"
        text: |-
          - **Affinity**: قوة مسكة ==واحدة== بين antibody و antigen.
          - **Avidity**: القوة الكلية من ==مسكات كتير== في جزيء multivalent. الـ hinge والـ heavy chain domains بيزوّدوها.

          عشان كده الـ IgM pentamer (10 أدرع) مسكته قوية حتى لو الـ affinity لسه ضعيفة في أول الـ response.
        page: 103
        quote: "Affinity refers to the strength of a single antibody–antigen interaction. Avidity (enhanced by the hinge region and heavy chain domains) describes the overall binding strength resulting from multiple antibody–antigen interactions in a multivalent molecule."
      - kind: explain
        title: "Thymus-independent و thymus-dependent"
        text: |-
          - **Thymus-independent**: antigen ==من غير peptide== (زي الـ LPS أو الـ capsular polysaccharide). مينفعش يتعرض على MHC للـ T cells، فمفيش help ← ضعيف، ومفيش memory كويسة، والـ vaccines محتاجة boosters و adjuvants (زي PPSV23).
          - **Thymus-dependent**: فيه **protein** (زي diphtheria toxoid). الـ B cell بتلمس الـ Th مباشرة ← class switching و ==memory==.
        page: 103
        quote: "Antigens containing a protein component (eg, diphtheria toxoid). Class switching and immunologic memory occur as a result of direct contact of B cells with Th cells."
      - kind: check
        question: "Why does a pure capsular polysaccharide vaccine give weak memory?"
        options:
          - "It cannot be presented by MHC to T cells"
          - "It is destroyed by IgA"
          - "It is a live organism"
          - "It binds only to IgE"
        answer: 0
        why:
          - "صح: من غير peptide مفيش MHC presentation، فمفيش T-cell help للـ class switch والـ memory."
          - "الـ IgA مالوش دعوة بضعف الـ vaccine."
          - "PPSV23 مش live."
          - "مالوش علاقة بالـ IgE."
        page: 103
        quote: "Antigens lacking a peptide component (eg, lipopolysaccharides from gram ⊝ bacteria); cannot be presented by MHC to T cells. Weakly immunogenic"
      - kind: try
        items: [imm.L03.003, imm.L03.004, imm.L03.010, imm.L03.011, imm.L03.017]
    recap:
      - "Fab يمسك (H + L)، Fc يشاور (H بس؛ IgM و IgG بيشغّلوا complement)."
      - "قبل الـ antigen: RAG1/2 و TdT والـ pairing. بعده: hypermutation و switching."
      - "IgG بيعدّي الـ placenta، IgA في الـ mucosa، IgM أول واحد pentamer، IgE للـ mast cells."
      - "Polysaccharide = thymus-independent = ضعيف ومن غير memory."
    practice: [imm.L03.001, imm.L03.002, imm.L03.003, imm.L03.004, imm.L03.005, imm.L03.006, imm.L03.007, imm.L03.008, imm.L03.009, imm.L03.010, imm.L03.011, imm.L03.012, imm.L03.013, imm.L03.014, imm.L03.015, imm.L03.016, imm.L03.017, imm.L03.018, imm.L03.118, imm.L03.119]
  - id: imm.L03.lesson2
    title: "الـ complement: 3 بوابات وطريق واحد"
    hook: "ليه نقص C5-C9 بيجيب Neisseria بالذات؟ وليه نقص C1-C4 بيجيب lupus؟"
    minutes: 9
    pages: [104, 105]
    topics: [complement, complement-disorders, complement-pathway-testing]
    goals:
      - "تعرف الـ 3 pathways ومين بيشغّل كل واحد"
      - "تحفظ وظيفة كل component"
      - "تفرّق بين hereditary angioedema و PNH"
      - "تقرا الـ CH50 والـ AH50"
    status: unverified
    steps:
      - kind: explain
        title: "3 بوابات"
        text: |-
          الـ complement بروتينات بيعملها ==الكبد==، شغالة في الـ innate immunity والالتهاب. 3 طرق يشتغل بيهم:

          - **Classic**: بالـ ==IgG أو IgM== («General Motors makes classic cars»).
          - **Alternative**: بمنتجات الـ bacteria مباشرة.
          - **Lectin**: بالـ mannose أو سكريات تانية على سطح الميكروب.

          التلاتة بيوصلوا لـ C3 convertase ثم C5 convertase ثم الـ MAC.
        page: 104
        quote: "Classic—IgG or IgM mediated. Alternative—bacterial products. Lectin—mannose or other sugars on microbe surface. General Motors makes classic cars."
      - kind: figure
        title: "كله بيوصل لـ C3"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="imm3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="10" width="100" height="30" rx="6"/><text x="18" y="30" class="t-sm">Classic: IgG/IgM</text>
            <rect class="fg-box" x="10" y="50" width="100" height="30" rx="6"/><text x="18" y="70" class="t-sm">Lectin: mannose</text>
            <rect class="fg-box" x="10" y="90" width="100" height="30" rx="6"/><text x="18" y="110" class="t-sm">Alternative</text>
            <path class="fg-arrow-acc" d="M110 25 L 150 60" marker-end="url(#imm3a)"/>
            <path class="fg-arrow-acc" d="M110 65 L 150 65" marker-end="url(#imm3a)"/>
            <path class="fg-arrow-acc" d="M110 105 L 150 72" marker-end="url(#imm3a)"/>
            <rect class="fg-acc" x="152" y="48" width="70" height="34" rx="6"/><text x="162" y="70" class="t-b">C3</text>
            <path class="fg-arrow-acc" d="M222 58 L 255 30" marker-end="url(#imm3a)"/>
            <text x="258" y="28" class="t-sm">C3b: opsonin</text>
            <path class="fg-arrow-acc" d="M222 72 L 255 100" marker-end="url(#imm3a)"/>
            <rect class="fg-acc" x="257" y="88" width="50" height="28" rx="6"/><text x="270" y="107" class="t-b">C5</text>
            <path class="fg-arrow-acc" d="M282 116 L 282 150" marker-end="url(#imm3a)"/>
            <rect class="fg-good" x="230" y="152" width="120" height="34" rx="6"/><text x="238" y="173" class="t-sm t-b">C5b-9 MAC: lysis</text>
            <text x="20" y="160" class="t-sm">C3a, C4a, C5a: anaphylaxis</text>
            <text x="20" y="180" class="t-sm">C5a: neutrophil chemotaxis</text>
          </svg>
        caption: "الـ 3 بوابات بتتقابل عند C3. الـ C3b بيعمل opsonization، والطريق بيكمّل لـ C5 لحد الـ MAC اللي بيخرم الجرثومة. الحتت الصغيرة (C3a و C4a و C5a) بتعمل anaphylaxis، و C5a بيجيب الـ neutrophils."
        alt: "The classic, lectin and alternative pathways converge on C3. C3b acts as an opsonin; the cascade continues to C5 and the C5b-9 membrane attack complex for lysis. C3a, C4a and C5a cause anaphylaxis and C5a attracts neutrophils."
        page: 104
        quote: "C3b—opsonization. C3a, C4a, C5a—anaphylaxis. C5a—neutrophil chemotaxis. C5b-9 (MAC)—cytolysis."
      - kind: aside
        tone: tip
        text: "الـ **MAC** مهم بالذات ضد ==Neisseria==. الكتاب: «Get “Neis” (nice) Big MACs from 5-9 pm» = C5-C9. والـ opsonins الأساسية اتنين: **C3b و IgG**، و C3b كمان بينضّف الـ immune complexes."
        page: 104
        quote: "MAC complex is important for neutralizing Neisseria species. Deficiency results in recurrent infection. Get “Neis” (nice) Big MACs from 5-9 pm."
      - kind: explain
        title: "مين بيحمي خلاياك؟"
        text: |-
          الـ complement مش بيفرّق كويس، فخلاياك محتاجة فرامل:

          - ==DAF (CD55)== على سطح الخلايا زي الـ RBCs.
          - ==C1 inhibitor== في البلازما.

          لو أي فرملة منهم راحت، المرض بيبان على طول.
        page: 104
        quote: "Inhibitors—decay-accelerating factor (DAF, also called CD55) and C1 inhibitor (formerly called C1 esterase inhibitor) help prevent complement activation on self cells (eg, RBCs)."
      - kind: reveal
        prompt: "فكّر: ليه نقص الـ early complement (C1-C4) بيعلّي خطر الـ SLE، بينما نقص الـ late (C5-C9) بيجيب Neisseria؟"
        answer: "الـ early components بيعملوا **C3b**، والـ C3b بيـ clear الـ immune complexes. لو مش موجود، الـ complexes بتتراكم ← ==SLE== (الكتاب: SLEarly)، وكمان pyogenic sinus و respiratory infections. أما الـ late فهم الـ **MAC**، ومن غيره ==Neisseria bacteremia== متكررة."
        page: 105
        quote: "↑ risk of severe, recurrent pyogenic sinus and respiratory tract infections. C3b used in clearance of antigen-antibody complexes → ↑ risk of SLE (think SLEarly)."
      - kind: explain
        title: "Hereditary angioedema"
        text: |-
          نقص **C1 inhibitor** ← الـ kallikrein يشتغل من غير فرامل ← ==↑ bradykinin== ← تورم في الوش والشفايف والأمعاء.

          - علامته في التحاليل: ==↓ C4== (لأن C1 بيستهلكه طول الوقت).
          - **ACE inhibitors ممنوعة** لأنها برضه بتعلّي الـ bradykinin.
          - العلاج: **ecallantide** (kallikrein inhibitor) و **icatibant** (bradykinin B2 receptor antagonist).
        page: 105
        quote: "Causes hereditary angioedema due to unregulated activation of kallikrein → ↑ bradykinin. Characterized by ↓ C4 levels. ACE inhibitors are contraindicated (also ↑ bradykinin)."
      - kind: check
        question: "A woman with recurrent nonpitting swelling of the face has low C4. Which drug class must she avoid?"
        options:
          - "ACE inhibitors"
          - "Antihistamines"
          - "β-blockers"
          - "Statins"
        answer: 0
        why:
          - "صح: الـ ACE inhibitors بتعلّي الـ bradykinin زي المرض نفسه."
          - "الـ antihistamines مش بتفيد بس مش ممنوعة."
          - "مالهاش علاقة بالـ bradykinin في الكتاب."
          - "مالهاش علاقة."
        page: 105
        quote: "ACE inhibitors are contraindicated (also ↑ bradykinin)."
      - kind: explain
        title: "PNH: الـ RBCs من غير فرامل"
        text: |-
          **Acquired PIGA mutation** ← ↓ ==GPI anchors== ← الـ CD55 (DAF) والـ CD59 (MIRL) مش لاقيين حاجة يتعلقوا فيها على سطح الـ RBC.

          - من غير **CD59** ← الـ MAC يتكوّن براحته ← ==intravascular hemolysis== (الأساسي).
          - من غير **CD55** ← C3b كتير ← extravascular hemolysis (أقل).

          النتيجة: ↓ haptoglobin، hemoglobinuria، hemosiderinuria (بول غامق، غالباً الصبح).
        page: 105
        quote: "Loss of CD59 → uninhibited MAC formation → intravascular hemolysis (major) Loss of CD55 → ↑ C3b opsonization → extravascular hemolysis (minor; RBC clearance by reticuloendothelial system)"
      - kind: aside
        tone: exam
        text: "الـ triad: hemolytic anemia + pancytopenia + ==atypical venous thrombosis== (Budd-Chiari، portal، cerebral، dermal). والعلاج **eculizumab** (anti-C5) بيوقف الـ intravascular بس؛ الـ proximal inhibitors (anti-C3، لسه investigational) ممكن تقلّل الـ extravascular."
        page: 105
        quote: "Triad of hemolytic anemia, pancytopenia, atypical venous thrombosis (eg, Budd-Chiari, portal, cerebral, dermal)."
      - kind: table
        title: "CAT: تقرا الـ complement إزاي"
        columns: ["Test", "Pathway", "Low in"]
        rows:
          - ["CH50", "Classical (C1, C2, C4)", "SLE, immune complex disease, C2/C4 deficiency"]
          - ["AH50", "Alternative (factor D, B, properdin)", "Properdin, factor D/B deficiency, Neisseria"]
          - ["Both low", "Terminal (C3, C5-C9)", "C5-C9 defect or consumption (sepsis, autoimmunity)"]
        hide: [[0, 1], [1, 1], [2, 1]]
        page: 105
        quote: "CH50 = Classical, AH50 = Alternative, Together = Terminal (CAT)."
      - kind: check
        question: "CH50 is low and AH50 is normal. Which deficiency fits?"
        options:
          - "C2"
          - "Properdin"
          - "C8"
          - "Factor B"
        answer: 0
        why:
          - "صح: C2 في الـ classical بس، فالـ CH50 بس اللي يقع."
          - "الـ properdin في الـ alternative، فالـ AH50 هو اللي يقع."
          - "C8 terminal، فالاتنين يقعوا."
          - "Factor B في الـ alternative."
        page: 105
        quote: "CH50 tests classical pathway (C1, C2, C4); ↓ in SLE, immune complex diseases, C2/C4 deficiency."
      - kind: explain
        title: "الـ 3 بوابات خطوة خطوة (رسمة الكتاب)"
        text: |-
          - **Classic**: الـ Ag-Ab complex بيمسك الـ **C1 complex** ← يقطّع C4 و C2 ← ==C4b + C2b = C3 convertase==.
          - **Lectin**: الـ **MBL-MASP** بيمسك سكر (sugar moiety) على سطح الميكروب ويشتغل زي C1 بالظبط: يقطّع C4 و C2.
          - **Alternative**: الـ C3b على سطح الميكروب بيمسك **factor B (Bb)** بمساعدة **properdin أو factor D** ← C3 convertase. وكل C3b جديد بيعمل convertase تاني: ده ==C3b amplification loop==، زي كورة التلج.

          بعد كده الطريق واحد: C3 ← C3b ينضم ويعمل **C5 convertase** ← C5b ← مع C6-C9 (C9 بيتبلمر) = ==MAC== يخرم الغشاء.
        page: 104
        quote: "Ag-Ab complex Sugar moiety or Antigen C3 convertase C3 convertase C3b amplification loop Polymerized C9 C2 C4 C3 C2b C4b FactorB (Bb) Properdin or factor D Microbial surface"
      - kind: order
        prompt: "رتّب الـ classic pathway من البداية للـ lysis"
        steps:
          - "Ag-Ab complex + C1 complex"
          - "C4 and C2 cleaved"
          - "C4b2b (C3 convertase) cleaves C3"
          - "C5 convertase cleaves C5"
          - "C5b + C6-C9 = MAC → cytolysis"
        why: "الـ C1 بيبدأ، الـ C4 و C2 بيعملوا الـ ==C3 convertase==، والـ C3b بيحوّلها C5 convertase، والـ C5b بيلم C6-C9 ويخرم الغشاء."
        page: 104
        quote: "Ag-Ab complex Sugar moiety or Antigen C3 convertase C3 convertase C3b amplification loop Polymerized C9 C2 C4 C3 C2b C4b"
      - kind: explain
        title: "الحتت الصغيرة بتعمل التهاب"
        text: |-
          الـ **C3a و C5a** بيخلّوا الـ ==mast cells تفرّغ== (degranulation) ← **histamine** ← ↑ endothelial permeability (تسريب وتورّم). والـ **C5a** كمان بينادي الـ neutrophils (chemotaxis). النتيجة: inflammation.

          وكلمة **opsonin** أصلها يوناني معناها ==«to prepare for eating»==، يعني «بيجهّز الأكل»: الـ C3b بيتبّل الجرثومة عشان الـ phagocyte (اللي عنده complement receptor) ياكلها بسهولة.
        page: 104
        quote: "C3a and C5a stimulate mast-cell degranulation Histamine increases endothelial permeability C5a-mediated neutrophil chemotaxis Inflamation"
      - kind: try
        items: [imm.L03.020, imm.L03.021, imm.L03.026, imm.L03.029, imm.L03.036]
