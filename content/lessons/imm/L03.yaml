  - id: imm.L03.lesson7
    title: "SCID وأخواتها، الـ phagocytes، والـ transplant"
    hook: "WATER و PLAIN و granny's cats: 3 جمل بيحلّوا نص أسئلة الـ immunodeficiency"
    minutes: 10
    pages: [115, 117]
    topics: [immunodeficiencies, infections-in-immunodeficiency, transplant-rejection]
    goals:
      - "تميّز SCID و ataxia-telangiectasia و hyper-IgM و Wiskott-Aldrich"
      - "تفرّق بين LAD و Chédiak-Higashi و CGD"
      - "تعرف كل نقص بيجيب أنهي ميكروب"
      - "تفرّق بين أنواع الـ rejection و GVHD"
    status: unverified
    steps:
      - kind: explain
        title: "B و T مع بعض"
        text: |-
          - **SCID**: أشهر سبب ==IL-2R gamma chain (X-linked)==، وكمان ADA deficiency (AR) و RAG (VDJ defect). failure to thrive، إسهال، thrush، وعدوى من كل نوع. الـ screening بالـ ↓ **TRECs**. مفيش thymic shadow ولا germinal centers ولا T cells.
          - **Ataxia-telangiectasia**: ==ATM== ← الخلية مش بتحس بالـ DNA damage. ataxia + telangiectasias + IgA deficiency، و ↑↑ حساسية للـ radiation، و ↑ AFP، و ↑ lymphoma و leukemia.
          - **Hyper-IgM**: ==CD40L بايظ== ← مفيش class switching. IgM طبيعي أو عالي و IgG و IgA و IgE واطيين جداً. Pneumocystis و Cryptosporidium و CMV.
        page: 115
        quote: "Several types including defective IL-2R gamma chain (most common, X-linked recessive); adenosine deaminase deficiency (autosomal recessive); RAG mutation → VDJ recombination defect"
      - kind: reveal
        prompt: "ليه بنقلّل الـ x-rays لمريض الـ ataxia-telangiectasia؟"
        answer: "الـ **ATM** هو اللي بيحس بالـ DNA damage ويوقف الـ cell cycle عشان تتصلّح. من غيره الخلية تكمّل وهي مكسورة ← mutations تتراكم. والـ radiation بتكسر الـ DNA، فالمريض ==↑↑ sensitivity to radiation== و ↑ lymphoma و leukemia."
        page: 115
        quote: "Defects in ATM gene → failure to detect DNA damage → failure to halt progression of cell cycle → mutations accumulate; autosomal recessive"
      - kind: aside
        tone: exam
        text: "**Wiskott-Aldrich**: ==WATER== = Wiskott-Aldrich: Thrombocytopenia، Eczema، Recurrent pyogenic infections. الـ WAS mutation بتمنع الـ actin يتنظّم، فالـ platelets ==قليلة وصغيرة==. X-linked recessive. ↑ IgE و IgA، و ↑ autoimmunity و malignancy."
        page: 115
        quote: "WATER: Wiskott-Aldrich: Thrombocytopenia, Eczema, Recurrent (pyogenic) infections ↑ risk of autoimmune disease and malignancy"
      - kind: check
        question: "A boy has eczema, recurrent otitis and petechiae. Platelets are few and small. Inheritance?"
        options:
          - "X-linked recessive"
          - "Autosomal dominant"
          - "Autosomal recessive"
          - "Mitochondrial"
        answer: 0
        why:
          - "صح: Wiskott-Aldrich، X-linked recessive."
          - "AD ده Job syndrome."
          - "AR زي ataxia-telangiectasia و Chédiak-Higashi و LAD."
          - "مش mitochondrial."
        page: 115
        quote: "WAS mutation; leukocytes and platelets unable to reorganize actin cytoskeleton → defective antigen presentation; X-linked recessive"
      - kind: explain
        title: "الـ phagocytes"
        text: |-
          - **LAD type 1**: ==CD18 (LFA-1 integrin)== بايظ ← الـ neutrophils ما تعرفش تطلع من الـ vessel. ==الحبل السري يتأخر >30 يوم==، مفيش pus، neutrophils عالية في الدم ومش موجودة في مكان العدوى.
          - **Chédiak-Higashi**: **LYST** ← الـ phagosome ما يندمجش مع الـ lysosome. ==Giant granules==. PLAIN: Progressive neurodegeneration، Lymphohistiocytosis، Albinism جزئي، Infections، Neuropathy.
          - **CGD**: NADPH oxidase ← ↓ ROS. catalase ⊕ («granny's cats keep her positive»)، granulomas. **DHR test** مش طبيعي (↓ green fluorescence).
        page: 115
        quote: "Late separation (>30 days) of umbilical cord, absent pus, dysfunctional neutrophils → recurrent skin and mucosal bacterial infections ↑ neutrophils in blood Absence of neutrophils at infection sites → impaired wound healing"
      - kind: figure
        title: "الـ neutrophil بيقع فين؟"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="imm3e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="95" height="50" rx="8"/><text x="20" y="42" class="t-sm t-b">1. Leave vessel</text><text x="20" y="60" class="t-sm">CD18 integrin</text>
            <path class="fg-arrow-acc" d="M105 45 L 130 45" marker-end="url(#imm3e)"/>
            <rect class="fg-box" x="132" y="20" width="95" height="50" rx="8"/><text x="140" y="42" class="t-sm t-b">2. Fuse lysosome</text><text x="140" y="60" class="t-sm">LYST</text>
            <path class="fg-arrow-acc" d="M227 45 L 252 45" marker-end="url(#imm3e)"/>
            <rect class="fg-box" x="254" y="20" width="96" height="50" rx="8"/><text x="262" y="42" class="t-sm t-b">3. Kill (ROS)</text><text x="262" y="60" class="t-sm">NADPH oxidase</text>
            <rect class="fg-bad" x="10" y="95" width="95" height="60" rx="8"/><text x="20" y="117" class="t-sm t-b">LAD</text><text x="20" y="135" class="t-sm">no pus, late cord</text>
            <rect class="fg-bad" x="132" y="95" width="95" height="60" rx="8"/><text x="140" y="117" class="t-sm t-b">Chédiak-Higashi</text><text x="140" y="135" class="t-sm">giant granules</text>
            <rect class="fg-bad" x="254" y="95" width="96" height="60" rx="8"/><text x="262" y="117" class="t-sm t-b">CGD</text><text x="262" y="135" class="t-sm">catalase ⊕</text>
          </svg>
        caption: "الـ neutrophil لازم يطلع من الـ vessel، وبعدين يدمج الـ lysosome مع اللي بلعه، وبعدين يقتل بالـ ROS. كل مرض بيكسر خطوة."
        alt: "Three steps of neutrophil function with the disease that breaks each: leaving the vessel needs CD18 integrin (leukocyte adhesion deficiency: no pus, late cord separation); fusing the lysosome needs LYST (Chédiak-Higashi: giant granules); killing with ROS needs NADPH oxidase (CGD: catalase-positive infections)."
        page: 115
        quote: "Defect of NADPH oxidase → ↓ reactive oxygen species (eg, superoxide) and ↓ respiratory burst in neutrophils; X-linked form most common"
      - kind: explain
        title: "كل نقص وميكروباته"
        text: |-
          القاعدة: ==↓ B cells ← bacteria==، و ==↓ T cells ← fungi و viruses==.

          - **↓ T**: sepsis، CMV، EBV، JC، VZV، Candida (local)، PCP، Cryptococcus.
          - **↓ B**: encapsulated (Please SHINE my SKiS)، enteroviral encephalitis، polio، giardiasis.
          - **↓ granulocytes**: Staph، Burkholderia، Pseudomonas، Nocardia، Serratia (Some Bacteria Produce No Serious granules)، و Candida systemic، Aspergillus، Mucor.
          - **↓ complement**: encapsulated (early)، Neisseria (late).
        page: 116
        quote: "Note: B-cell deficiencies tend to produce recurrent bacterial infections, whereas T-cell deficiencies produce more fungal and viral infections."
      - kind: match
        prompt: "وصّل النقص بالميكروب"
        pairs:
          - ["↓ T cells", "Pneumocystis (PCP)"]
          - ["↓ B cells", "Enteroviral encephalitis"]
          - ["↓ Granulocytes", "Aspergillus"]
          - ["↓ Late complement (C5-C9)", "Neisseria"]
        why: "الـ T للـ fungi والفيروسات (PCP، Cryptococcus، CMV)، الـ B للـ encapsulated والـ enteroviruses، الـ granulocytes للـ Aspergillus و Staph، والـ MAC للـ Neisseria."
        page: 116
        quote: "Fungi/parasites Candida (local), PCP, Cryptococcus GI giardiasis (no IgA) Candida (systemic), Aspergillus, Mucor N/A"
      - kind: explain
        title: "الـ transplant rejection"
        text: |-
          - **Hyperacute** (==دقايق==): antibodies موجودة قبل كده عند المستقبل (type II) ← complement ← thrombosis في الـ graft. لازم يتشال.
          - **Acute** (أسابيع لشهور): **cellular** = CD8+ و CD4+ ضد الـ donor MHC (type IV)، أو **humoral** = antibodies اتعملت بعد الزرع (C4d). vasculitis و lymphocytic infiltrate. بيترد بالـ immunosuppressants.
          - **Chronic** (شهور لسنين): CD4+ بتشوف donor peptides على APCs المستقبل (II و IV) ← ==arteriosclerosis== و fibrosis. أمثلة: chronic allograft nephropathy، bronchiolitis obliterans، accelerated atherosclerosis، vanishing bile duct syndrome.
        page: 117
        quote: "Dominated by arteriosclerosis C Recipient T cells react and secrete cytokines → proliferation of vascular smooth muscle, parenchymal atrophy, interstitial fibrosis"
      - kind: aside
        tone: trap
        text: "**GVHD** هو العكس: ==T cells المتبرع بتهاجم المستقبل== (type IV). rash و jaundice و diarrhea و hepatosplenomegaly، غالباً بعد bone marrow أو liver (فيهم lymphocytes كتير). في الـ leukemia ممكن يفيد (graft-versus-tumor). وعشان نمنعه في الـ immunocompromised بنعمل ==irradiation للدم== قبل النقل."
        page: 117
        quote: "Usually in bone marrow and liver transplants (rich in lymphocytes) Potentially beneficial in bone marrow transplant for leukemia (graft-versus- tumor effect)"
      - kind: check
        question: "Five years after a heart transplant, a patient has diffuse narrowing of the coronary arteries. Which rejection?"
        options:
          - "Chronic"
          - "Hyperacute"
          - "Acute cellular"
          - "Graft-versus-host disease"
        answer: 0
        why:
          - "صح: chronic rejection بيعمل arteriosclerosis، وفي القلب accelerated atherosclerosis."
          - "Hyperacute في دقايق."
          - "Acute في أسابيع لشهور."
          - "GVHD بيهاجم المستقبل مش الـ graft."
        page: 117
        quote: "Organ-specific examples: Chronic allograft nephropathy Bronchiolitis obliterans Accelerated atherosclerosis (heart) Vanishing bile duct syndrome"
      - kind: try
        items: [imm.L03.097, imm.L03.098, imm.L03.104, imm.L03.107, imm.L03.109]
    recap:
      - "SCID = IL-2Rγ أشهر، و TRECs للـ screening؛ AT = ATM و radiation؛ hyper-IgM = CD40L؛ WAS = WATER."
      - "LAD = CD18 و الحبل متأخر؛ Chédiak-Higashi = LYST و giant granules؛ CGD = catalase ⊕ و DHR."
      - "B ← bacteria، T ← fungi و viruses، granulocytes ← Aspergillus، MAC ← Neisseria."
      - "Hyperacute دقايق (antibodies)، acute أسابيع (T cells)، chronic سنين (arteriosclerosis)، GVHD = المتبرع ضد المستقبل."
    practice: [imm.L03.097, imm.L03.098, imm.L03.099, imm.L03.100, imm.L03.103, imm.L03.104, imm.L03.105, imm.L03.106, imm.L03.107, imm.L03.108, imm.L03.109, imm.L03.110, imm.L03.111, imm.L03.112, imm.L03.113]
