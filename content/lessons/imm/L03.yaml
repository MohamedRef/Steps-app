  - id: imm.L03.lesson5
    title: "الـ hypersensitivity: 4 طرق المناعة تأذيك بيها"
    hook: "سؤال واحد بيفرّق الـ 4 أنواع: مين المتهم، antibody ولا T cell؟ وإمتى؟"
    minutes: 10
    pages: [110, 112]
    topics: [hypersensitivity-types, blood-transfusion-reactions]
    goals:
      - "تفرّق بين الـ 4 types بالـ mechanism والتوقيت"
      - "تحفظ أمثلة كل type"
      - "تفرّق بين transfusion reactions بالحمّى والتوقيت والـ BNP"
    status: unverified
    steps:
      - kind: explain
        title: "الصورة الكبيرة"
        text: |-
          - **Type I**: anaphylactic و atopic (IgE).
          - **Type II**: antibody على سطح الخلية.
          - **Type III**: immune complexes.
          - **Type IV**: cell-mediated (T cells).

          ==التلاتة الأولانيين antibody-mediated==، والرابع T cells بس.
        page: 110
        quote: "Four types: Anaphylactic and atopic (type I), antibody-mediated (type II), immune complex (type III), cell-mediated (type IV). Types I, II, and III are all antibody-mediated."
      - kind: explain
        title: "Type I: First و Fast"
        text: |-
          - **Immediate (دقايق)**: الـ allergen يربط IgE جاهز على mast cells ← degranulation ← ==histamine==، و **tryptase** (علامة إن الـ mast cell اشتغلت)، و leukotrienes.
          - **Late (ساعات)**: chemokines تجيب eosinophils ← inflammation و tissue damage.

          التشخيص: skin test أو ELISA للـ allergen-specific IgE. أمثلة: anaphylaxis (أكل، دوا، نحلة)، allergic asthma.
        page: 110
        quote: "Immediate (minutes): antigen crosslinks preformed IgE on presensitized mast cells → immediate degranulation → release of histamine (a vasoactive amine), tryptase (marker of mast cell activation), and leukotrienes."
      - kind: explain
        title: "Type II: الـ antibody على الخلية نفسها"
        text: |-
          3 نتايج:
          - **Cellular destruction**: الـ antibody يغطي الخلية ← phagocytosis أو complement، أو NK تقتلها بالـ ADCC. أمثلة: AIHA، ITP، transfusion reactions، hemolytic disease of the newborn.
          - **Inflammation**: complement و Fc receptors. أمثلة: ==Goodpasture==، rheumatic fever، hyperacute rejection.
          - **Cellular dysfunction**: الـ antibody يقعد على receptor يقفله أو يشغّله. أمثلة: myasthenia gravis، ==Graves==، pemphigus vulgaris.

          **Direct Coombs**: antibodies لازقة على الـ RBC. **Indirect**: antibodies سايبة في الـ serum.
        page: 110
        quote: "Cellular dysfunction—antibodies bind to cell-surface receptors → abnormal blockade or activation of downstream process."
      - kind: explain
        title: "Type III: 3 حاجات لازقة في بعض"
        text: |-
          antigen + antibody (غالباً IgG) + complement ← الـ complement يجيب ==neutrophils== ← lysosomal enzymes تأذي الـ endothelium ← vasculitis وأعراض systemic.

          أمثلة: SLE، reactive arthritis، PAN، poststreptococcal GN، IgA vasculitis.

          - **Serum sickness**: النموذج الأصلي. بعد ==1-2 أسبوع== من بروتين غريب (أو دوا hapten زي penicillin و monoclonal antibodies، أو hepatitis B): fever، urticaria، arthralgia، proteinuria، lymphadenopathy، و ↓ C3 و C4.
          - **Arthus reaction**: local. حقن antigen في الجلد عند حد عنده IgG ← edema و fibrinoid necrosis (زي رد فعل قوي على booster).
        page: 111
        quote: "Serum sickness—the prototypic immune complex disease. Antibodies to foreign proteins are produced and 1-2 weeks later, antibody- antigen complexes form and deposit in tissues → complement activation → inflammation and tissue damage (↓ serum C3, C4)."
      - kind: check
        question: "Ten days after a new monoclonal antibody, a patient has fever, urticaria, arthralgia and low C3. Which type?"
        options:
          - "Type III"
          - "Type I"
          - "Type II"
          - "Type IV"
        answer: 0
        why:
          - "صح: serum sickness، immune complexes بعد 1-2 أسبوع مع ↓ C3 و C4."
          - "Type I في دقايق."
          - "Type II بيستهدف خلية أو receptor معين."
          - "Type IV T cells من غير complement."
        page: 111
        quote: "Fever, urticaria, arthralgia, proteinuria, lymphadenopathy occur 1-2 weeks after antigen exposure."
      - kind: explain
        title: "Type IV: الأخير والمتأخر"
        text: |-
          T cells بس، ==من غير antibodies==، بطريقتين:
          1. **CD8+** يقتل الخلية مباشرة.
          2. **CD4+** يتعرف على الـ antigen ويطلّع cytokines تعمل التهاب.

          أمثلة: contact dermatitis (poison ivy، nickel)، drug reactions (AGEP، SJS، TEN، DRESS)، GVHD. اختبارات: PPD، patch test، Candida skin test.

          احفظ ==الـ 4T's== من الكتاب: **T** cells، **T**ransplant rejections، **T**B skin tests، **T**ouching (contact dermatitis).
        page: 111
        quote: "Two mechanisms, each involving T cells: 1. Direct cell cytotoxicity: CD8+ cytotoxic T cells kill targeted cells. 2. Inflammatory reaction: effector CD4+ T cells recognize antigen and release inflammation-inducing cytokines"
      - kind: figure
        title: "الـ 4 types في لقطة"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="10" width="165" height="85" rx="8"/>
            <text x="20" y="30" class="t-b">Type I</text>
            <text x="20" y="50" class="t-sm">IgE on mast cell</text>
            <text x="20" y="68" class="t-sm">minutes: histamine</text>
            <text x="20" y="86" class="t-sm t-mut">anaphylaxis, asthma</text>
            <rect class="fg-acc" x="185" y="10" width="165" height="85" rx="8"/>
            <text x="195" y="30" class="t-b">Type II</text>
            <text x="195" y="50" class="t-sm">IgG/IgM on a cell</text>
            <text x="195" y="68" class="t-sm">destroy, inflame, block</text>
            <text x="195" y="86" class="t-sm t-mut">AIHA, Goodpasture, MG</text>
            <rect class="fg-acc" x="10" y="105" width="165" height="85" rx="8"/>
            <text x="20" y="125" class="t-b">Type III</text>
            <text x="20" y="145" class="t-sm">Ag-Ab-complement</text>
            <text x="20" y="163" class="t-sm">neutrophils, ↓ C3</text>
            <text x="20" y="181" class="t-sm t-mut">SLE, PSGN, serum sickness</text>
            <rect class="fg-good" x="185" y="105" width="165" height="85" rx="8"/>
            <text x="195" y="125" class="t-b">Type IV</text>
            <text x="195" y="145" class="t-sm">T cells, no antibody</text>
            <text x="195" y="163" class="t-sm">48-72 h, delayed</text>
            <text x="195" y="181" class="t-sm t-mut">PPD, contact, GVHD</text>
          </svg>
        caption: "التلاتة الأولانيين antibodies (أزرق)، والرابع T cells بس (أخضر). اسأل نفسك: الـ antibody لازق فين؟ على mast cell (I)، على خلية (II)، ولا في complex عايم (III)؟"
        alt: "Four boxes. Type I: IgE on mast cells, minutes, histamine; anaphylaxis and asthma. Type II: IgG or IgM on a cell, destroy, inflame or block; AIHA, Goodpasture, myasthenia gravis. Type III: antigen-antibody-complement complexes, neutrophils, low C3; SLE, poststreptococcal GN, serum sickness. Type IV: T cells without antibody, delayed; PPD, contact dermatitis, GVHD."
        page: 111
        quote: "4T’s: T cells, Transplant rejections, TB skin tests, Touching (contact dermatitis). Fourth (type) and last (delayed)."
      - kind: sort
        prompt: "حط كل مثال في نوعه: III ولا IV؟"
        bins: ["Type III", "Type IV"]
        cards:
          - { text: "SLE", bin: 0 }
          - { text: "Polyarteritis nodosa", bin: 0 }
          - { text: "Poststreptococcal glomerulonephritis", bin: 0 }
          - { text: "Serum sickness", bin: 0 }
          - { text: "Arthus reaction", bin: 0 }
          - { text: "Nickel contact dermatitis", bin: 1 }
          - { text: "DRESS", bin: 1 }
          - { text: "Graft-versus-host disease", bin: 1 }
          - { text: "Positive PPD skin test", bin: 1 }
        why: "complex عايم (antigen + antibody + complement) بيترسب ويجيب neutrophils = III. T cells لوحدها من غير antibodies، ومتأخرة = IV."
        page: 111
        quote: "Examples: SLE Reactive arthritis Polyarteritis nodosa Poststreptococcal glomerulonephritis IgA vasculitis Neutrophils Enzymes from neutrophils damage endothelial cells Serum sickness—the prototypic immune complex disease. Antibodies to foreign proteins are produced and 1-2 weeks later, antibody- antigen complexes form and deposit in tissues → complement activation → inflammation and tissue damage (↓ serum C3, C4). Fever, urticaria, arthralgia, proteinuria, lymphadenopathy occur 1-2 weeks after antigen exposure. Serum sickness–like reactions are associated with some drugs (may act as haptens, eg, penicillin, monoclonal antibodies) and infections (eg, hepatitis B). Arthus reaction—a local subacute immune complex-mediated hypersensitivity reaction. Intradermal injection of antigen into a presensitized (has circulating IgG) individual leads to immune complex formation in the skin (eg, enhanced local reaction to a booster vaccination). Characterized by edema, fibrinoid necrosis, activation of complement. Type IV hypersensitivity Cytokines Sensitized Th1 cell Antigen- presenting cell Antigen Activated macrophage A Delayed-type hypersensitivity Two mechanisms, each involving T cells: 1. Direct cell cytotoxicity: CD8+ cytotoxic T cells kill targeted cells. 2. Inflammatory reaction: effector CD4+ T cells recognize antigen and release inflammation-inducing cytokines (shown in illustration). Response does not involve antibodies (vs types I, II, and III). Examples: Contact dermatitis (eg, poison ivy, nickel allergy) Drug reactions—eosinophilia and severe cutaneous adverse reactions (SCARs) due to acute generalized exanthematous pustulosis, SJS, TEN, or DRESS Graft-versus-host disease Tests: PPD for TB infection"
