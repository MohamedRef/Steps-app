  - id: imm.L03.lesson3
    title: "الـ cytokines والـ respiratory burst والـ interferons"
    hook: "Hot T-bone stEAK هتحفظك أول 6 interleukins في دقيقة"
    minutes: 10
    pages: [106, 107]
    topics: [important-cytokines, respiratory-burst, type-i-interferons]
    goals:
      - "تعرف cytokines الـ macrophage والـ T cells"
      - "تفهم سلسلة الـ respiratory burst وليه CGD بيجيب catalase ⊕"
      - "تعرف الـ interferons بتحمي إزاي واستخداماتها"
    status: unverified
    steps:
      - kind: explain
        title: "الـ macrophage بيصرّخ الأول"
        text: |-
          الترتيب: ==acute (IL-1 و IL-6 و TNF-α)، وبعدين recruit (IL-8 و IL-12)==.

          - **IL-1**: fever و acute inflammation، يشغّل الـ endothelium (adhesion molecules)، ويجيب WBCs. اسمه كمان osteoclast-activating factor.
          - **IL-6**: fever و acute-phase proteins.
          - **TNF-α**: يشغّل الـ endothelium، WBC recruitment، vascular leak، و ==cachexia== في الـ cancer، و**بيحافظ على الـ granuloma في TB**.
          - **IL-8**: أكبر chemotactic للـ neutrophils («clean up on aisle 8»).
          - **IL-12**: يعمل Th1، يشغّل NK، ويساعد الـ granuloma في TB.
        page: 106
        quote: "Tumor necrosis factor-α Activates endothelium. Causes WBC recruitment, vascular leak. Causes cachexia in malignancy. Maintains granulomas in TB."
      - kind: mnemonic
        word: "HTBEAK"
        parts:
          - { key: "H", text: "Hot: IL-1 = fever" }
          - { key: "T", text: "T: IL-2 stimulates T cells" }
          - { key: "B", text: "Bone: IL-3 stimulates bone marrow" }
          - { key: "E", text: "E: IL-4 stimulates IgE" }
          - { key: "A", text: "A: IL-5 stimulates IgA" }
          - { key: "K", text: "aKute: IL-6 stimulates acute-phase proteins" }
        hook: "الكتاب: Hot T-bone stEAK، من IL-1 لـ IL-6 بالترتيب"
        page: 106
        quote: "“Hot T-bone stEAK”: IL-1: fever (hot). IL-2: stimulates T cells. IL-3: stimulates bone marrow. IL-4: stimulates IgE production. IL-5: stimulates IgA production. IL-6: stimulates aKute-phase protein production."
      - kind: check
        question: "A patient on a TNF-α inhibitor develops reactivation tuberculosis. Which TNF-α action was lost?"
        options:
          - "Maintaining granulomas"
          - "Chemotaxis of neutrophils"
          - "Class switching to IgE"
          - "Growth of bone marrow stem cells"
        answer: 0
        why:
          - "صح: الـ TNF-α بيحافظ على الـ granuloma اللي حابس الـ TB."
          - "ده IL-8."
          - "ده IL-4 و IL-13."
          - "ده IL-3."
        page: 106
        quote: "Maintains granulomas in TB."
      - kind: table
        title: "Cytokines الـ T cells"
        columns: ["Cytokine", "Key action"]
        rows:
          - ["IL-2", "Growth of helper, cytotoxic, regulatory T cells and NK cells"]
          - ["IL-3", "Bone marrow stem cells (like GM-CSF)"]
          - ["IFN-γ", "Macrophages kill; ↑ MHC; IgG switch; inhibits Th2; granulomas"]
          - ["IL-4", "Th2; B cells; switch to IgE and IgG (2 BEG 4 help)"]
          - ["IL-5", "B cells; switch to IgA; Eosinophils (5 BAEs)"]
          - ["IL-10", "Attenuates inflammation; ↓ MHC II and Th1 cytokines"]
          - ["IL-13", "IgE production (thirtEEn)"]
        hide: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
        page: 106
        quote: "Interleukin-5 Promotes growth and differentiation of B cells. Enhances class switching to IgA. Stimulates growth and differentiation of Eosinophils. I have 5 BAEs."
      - kind: aside
        tone: trap
        text: "الـ **IFN-γ** مش بس من Th1، ==الـ NK cells كمان بتطلّعه== (رد على antigen أو IL-12 من الـ macrophages). وبيعلّي الـ MHC على كل الخلايا، وبيوقف الـ Th2. وعلى العكس الـ **IL-10** (من Th2 و Tregs) والـ TGF-β بيهدّوا الـ response."
        page: 106
        quote: "Secreted by NK cells and T cells in response to antigen or IL-12 from macrophages; stimulates macrophages to kill phagocytosed pathogens. Inhibits differentiation of Th2 cells."
      - kind: explain
        title: "الـ respiratory burst"
        text: |-
          الـ neutrophil بيقتل الجرثومة اللي بلعها بـ ==ROS==. الـ NADPH oxidase بياخد O2 ويبدأ السلسلة. الكتاب: «**NO S**afe **M**icrobe»:

          1. **NADPH Oxidase**: O2 ← superoxide.
          2. **Superoxide dismutase**: superoxide ← H2O2.
          3. **Myeloperoxidase**: H2O2 + Cl⁻ ← HOCl (bleach). والـ MPO فيه pigment أزرق-أخضر هو اللي بيلوّن البلغم.

          والـ **G6PD** بيعمل NADPH من الـ HMP shunt اللي بيشغّل الـ oxidase ويعادل الـ ROS كمان.
        page: 107
        quote: "Myeloperoxidase contains a blue-green, heme-containing pigment that gives sputum its color. NO Safe Microbe (NADPH Oxidase Superoxide dismutase Myeloperoxidase)."
      - kind: figure
        title: "السلسلة جوه الـ phagolysosome"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="imm3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="imm3c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="10" y="40" class="t-b">O2</text>
            <path class="fg-arrow-acc" d="M35 35 L 90 35" marker-end="url(#imm3b)"/>
            <text x="30" y="22" class="t-sm t-acc">NADPH oxidase</text>
            <text x="95" y="40" class="t-b">O2•−</text>
            <path class="fg-arrow-acc" d="M135 35 L 190 35" marker-end="url(#imm3b)"/>
            <text x="130" y="22" class="t-sm t-acc">SOD</text>
            <text x="195" y="40" class="t-b">H2O2</text>
            <path class="fg-arrow-acc" d="M240 35 L 295 35" marker-end="url(#imm3b)"/>
            <text x="245" y="22" class="t-sm t-acc">MPO + Cl−</text>
            <text x="300" y="40" class="t-b">HOCl</text>
            <rect class="fg-bad" x="10" y="70" width="340" height="66" rx="8"/>
            <text x="20" y="92" class="t-sm t-b">CGD: no NADPH oxidase</text>
            <text x="20" y="110" class="t-sm">uses microbe's own H2O2, unless the microbe</text>
            <path class="fg-arrow-bad" d="M280 105 L 280 50" marker-end="url(#imm3c)"/>
            <text x="20" y="128" class="t-sm">has catalase (S aureus, Aspergillus)</text>
          </svg>
        caption: "في الـ CGD الخطوة الأولى بايظة. الـ neutrophil بيحاول يستلف الـ H2O2 اللي الجرثومة نفسها بتعمله، بس لو الجرثومة catalase ⊕ بتكسّره قبل ما يوصله."
        alt: "Respiratory burst chain: oxygen to superoxide by NADPH oxidase, to hydrogen peroxide by superoxide dismutase, to hypochlorite by myeloperoxidase with chloride. Below: in CGD the first step is missing, so the neutrophil relies on the microbe's own hydrogen peroxide, which catalase-positive organisms destroy."
        page: 107
        quote: "Phagocytes of patients with CGD can utilize generated by invading organisms and convert it to ROS. Patients are at risk for infection by catalase ⊕ species (eg, S aureus, Aspergillus)"
      - kind: check
        question: "Why are CGD patients spared from catalase-negative organisms?"
        options:
          - "Their phagocytes can use the microbe's own H2O2 to make ROS"
          - "They have extra myeloperoxidase"
          - "Their B cells make more IgG"
          - "Catalase-negative organisms lack a capsule"
        answer: 0
        why:
          - "صح: الجرثومة الـ catalase ⊝ بتسيب الـ H2O2 بتاعها، فالـ neutrophil يحوّله ROS."
          - "الـ MPO محتاج H2O2 أصلاً."
          - "مالهاش دعوة بالـ antibodies."
          - "الـ capsule مش هي الفيصل هنا."
        page: 107
        quote: "Phagocytes of patients with CGD can utilize generated by invading organisms and convert it to ROS."
      - kind: explain
        title: "الـ type I interferons: إنذار للجيران"
        text: |-
          الـ **IFN-α و IFN-β** جزء من الـ innate. الخلية اللي اتصابت بفيروس (RNA أو DNA) بتطلّعهم ينبّهوا الخلايا اللي جنبها:

          - ==↓ protein synthesis== عشان الفيروس ما يعرفش يتكاثر.
          - ==↑ MHC== عشان الخلايا المصابة تتشاف.

          وكمان بيشغّلوا الـ antitumor immunity.
        page: 107
        quote: "Cells infected with a virus synthesize these glycoproteins, which act on local cells, priming them for viral defense by downregulating protein synthesis to resist potential viral replication and by upregulating MHC expression to facilitate recognition of infected cells."
      - kind: aside
        tone: exam
        text: "بيستخدموهم في: chronic HBV، Kaposi sarcoma، ==hairy cell leukemia==، condyloma acuminatum، RCC، melanoma، و ==multiple sclerosis==. والـ side effects: flulike، **depression**، neutropenia، myopathy، و autoimmunity."
        page: 107
        quote: "Chronic HBV, Kaposi sarcoma, hairy cell leukemia, condyloma acuminatum, renal cell carcinoma, malignant melanoma, multiple sclerosis."
      - kind: explain
        title: "الـ NADPH بيعمل الـ ROS وبيطفيه كمان"
        text: |-
          الكتاب بيقول ==NADPH plays a role in both the creation and neutralization of ROS==. إزاي؟

          - **الإنتاج**: الـ NADPH oxidase بيستخدم NADPH عشان يحوّل O2 لـ superoxide.
          - **الحماية**: الـ neutrophil نفسه لازم يحمي نفسه من الـ H2O2. الـ **G6PD** (في الـ HMP shunt) بيعمل NADPH ← الـ **glutathione reductase** يرجّع الـ glutathione للشكل الـ reduced (GSH) ← الـ ==glutathione peroxidase== يحوّل H2O2 لـ H2O.

          والجرثومة نفسها عندها **bacterial catalase** بيكسّر الـ H2O2 بتاعها لـ H2O + O2؛ ده بالظبط اللي بيخلّي الـ catalase ⊕ تهرب من الـ CGD.

          عشان كده نقص الـ G6PD الشديد ممكن يقلّد CGD: من غير NADPH مفيش وقود للـ oxidase.
        page: 107
        quote: "NADPH plays a role in both the creation and neutralization of ROS."
      - kind: try
        items: [imm.L03.038, imm.L03.040, imm.L03.041, imm.L03.046, imm.L03.051]
    recap:
      - "Acute: IL-1 و IL-6 و TNF-α؛ recruit: IL-8 (neutrophils) و IL-12 (Th1)."
      - "TNF-α بيحافظ على الـ granuloma، فالـ anti-TNF ممكن يصحّي TB."
      - "NO Safe Microbe: NADPH oxidase ← SOD ← MPO. CGD ← catalase ⊕."
      - "IFN-α/β: ↓ protein synthesis و ↑ MHC؛ side effects أهمها depression و neutropenia."
