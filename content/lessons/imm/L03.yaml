      - kind: explain
        title: "Passive و active"
        text: |-
          - **Passive**: بتاخد ==antibodies جاهزة==. سريعة بس قصيرة (half-life حوالي **3 أسابيع**). أمثلة: IgA في لبن الأم، IgG بيعدّي الـ placenta، antitoxin، humanized monoclonal antibodies، و IVIG.
          - **Active**: جسمك يقابل الـ antigen ويعمل بنفسه. بطيئة بس فيها ==memory==. أمثلة: العدوى الطبيعية، الـ vaccines، الـ toxoids.

          في **hepatitis B و rabies** بنديهم الاتنين مع بعض: passive تحمي دلوقتي، و active تحمي بعدين.
        page: 108
        quote: "Short span of antibodies (half-life = 3 weeks) Long-lasting protection (memory) EXAMPLES IgA in breast milk, maternal IgG crossing placenta, antitoxin, humanized monoclonal antibody"
      - kind: explain
        title: "الـ live attenuated"
        text: |-
          ميكروب اتضعّف بس لسه بيتكاثر شوية في الجسم ← بيعمل ==cellular و humoral==، ومناعة قوية غالباً مدى الحياة.

          العيب: ممكن يرجع virulent، فهو ==ممنوع في الحمل والـ immunodeficiency==. استثناء: MMR و varicella ممكن تتدّي للـ HIV لو الـ CD4+ ≥200 بعد استشارة متخصص.
        page: 109
        quote: "Pros: induces cellular and humoral responses. Induces strong, often lifelong immunity. Cons: may revert to virulent form. Contraindicated in pregnancy and patients with immunodeficiency."
      - kind: mnemonic
        word: "ATPVSBYIMR"
        parts:
          - { key: "A", text: "Adenovirus (military recruits)" }
          - { key: "T", text: "Typhoid (Ty21a, oral)" }
          - { key: "P", text: "Polio (Sabin)" }
          - { key: "V", text: "Varicella" }
          - { key: "S", text: "Smallpox" }
