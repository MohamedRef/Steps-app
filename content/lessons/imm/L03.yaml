        hide: [[0, 2], [2, 2], [3, 2], [4, 2]]
        page: 112
        quote: "Donor anti-HLA or antineutrophil antibodies → neutrophil activation → noncardiogenic pulmonary edema No Symptom onset <6 hr Dyspnea, acute hypoxemia, bilateral infiltrates +/– mild fever, normal BNP, normal cardiac function"
      - kind: aside
        tone: trap
        text: "TRALI ولا TACO؟ الاتنين pulmonary edema بعد نقل دم. الفرق: الـ ==TRALI antibodies من المتبرع== بتشغّل neutrophils المريض (noncardiogenic، ==BNP طبيعي==، ممكن حمّى خفيفة). الـ TACO مياه زيادة (cardiogenic، hypertension، JVD، S3، BNP عالي)."
        page: 112
        quote: "Volume overload → ↑ hydrostatic pressure → cardiogenic pulmonary edema No Symptom onset 6-12 hr after transfusion Dyspnea, pulmonary edema, JVD, hypertension, S3 gallop, ↑ BNP"
