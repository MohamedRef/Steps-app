schema: steps.lesson/v1
lecture: imm.L04
lessons:
  - id: imm.L04.lesson1
    title: "الـ immunosuppressants: كل دوا بيقطع السلك فين"
    hook: "ارسم الـ T cell مرة، وهتعرف كل دوا شغال فين والـ side effect بتاعه منطقي ليه"
    minutes: 10
    pages: [118, 120]
    topics: [immunosuppressants, recombinant-cytokines]
    goals:
      - "تعرف مكان شغل كل immunosuppressant على الـ T cell"
      - "تفرّق بين cyclosporine و tacrolimus و sirolimus في الـ toxicity"
      - "تفهم ليه الـ allopurinol خطر مع الـ azathioprine"
      - "تربط كل recombinant cytokine باستخدامه"
    status: unverified
    steps:
      - kind: explain
        title: "الفكرة"
        text: |-
          الأدوية دي بتوقف ==activation و proliferation الـ lymphocytes==، فبتمنع الـ acute rejection (prophylaxis).

          بنجمعهم مع بعض عشان فعالية أكبر بـ toxicity أقل. والثمن: الـ suppression الطويلة ==↑ infection و malignancy==.
        page: 118
        quote: "Agents that block lymphocyte activation and proliferation. Reduce acute transplant rejection by suppressing cellular immunity (used as prophylaxis). Frequently combined to achieve greater efficacy with ↓ toxicity. Chronic suppression ↑ risk of infection and malignancy."
      - kind: figure
        title: "الـ T cell من جوه"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="imm4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="5" y="5" width="350" height="210" rx="16"/>
            <rect class="fg-box" x="15" y="15" width="70" height="26" rx="5"/><text x="25" y="33" class="t-sm">TCR</text>
            <path class="fg-arrow-acc" d="M50 41 L 50 70" marker-end="url(#imm4a)"/>
            <rect class="fg-acc" x="15" y="72" width="90" height="28" rx="5"/><text x="22" y="91" class="t-sm t-b">Calcineurin</text>
            <text x="15" y="116" class="t-sm t-bad">Cyclosporine, Tacrolimus</text>
            <path class="fg-arrow-acc" d="M60 100 L 60 140" marker-end="url(#imm4a)"/>
            <rect class="fg-box" x="15" y="142" width="100" height="28" rx="5"/><text x="22" y="161" class="t-sm">NFAT → IL-2 gene</text>
            <rect class="fg-box" x="240" y="15" width="100" height="26" rx="5"/><text x="250" y="33" class="t-sm">IL-2R</text>
            <text x="245" y="56" class="t-sm t-bad">Basiliximab</text>
            <path class="fg-arrow-acc" d="M290 60 L 290 78" marker-end="url(#imm4a)"/>
            <rect class="fg-acc" x="250" y="80" width="80" height="28" rx="5"/><text x="265" y="99" class="t-sm t-b">mTOR</text>
            <text x="255" y="124" class="t-sm t-bad">Sirolimus</text>
            <rect class="fg-acc" x="150" y="142" width="190" height="28" rx="5"/><text x="158" y="161" class="t-sm t-b">Purine synthesis → DNA</text>
            <text x="150" y="186" class="t-sm t-bad">Azathioprine (6-MP), Mycophenolate</text>
            <rect class="fg-acc" x="130" y="72" width="80" height="28" rx="5"/><text x="142" y="91" class="t-sm t-b">NF-κB</text>
            <text x="120" y="56" class="t-sm t-bad">Glucocorticoids</text>
            <text x="20" y="205" class="t-sm t-mut">IL-2 made → IL-2R → mTOR → proliferation</text>
          </svg>
        caption: "الـ TCR يشغّل الـ calcineurin، فيعمل IL-2. الـ IL-2 يرجع على الـ IL-2R ويشغّل mTOR فالخلية تتكاثر، ومحتاجة purines عشان تنسخ الـ DNA. كل دوا بيقطع حتة: calcineurin (cyclosporine و tacrolimus)، IL-2R (basiliximab)، mTOR (sirolimus)، purines (azathioprine و mycophenolate)، و NF-κB (glucocorticoids)."
        alt: "Inside a helper T cell: the T-cell receptor activates calcineurin, blocked by cyclosporine and tacrolimus, which drives NFAT and the IL-2 gene. IL-2 acts on the IL-2 receptor, blocked by basiliximab, then mTOR, blocked by sirolimus. Purine synthesis for DNA is blocked by azathioprine and mycophenolate. NF-kB is blocked by glucocorticoids."
        page: 118
        quote: "Sirolimus (Rapamycin) mTOR inhibitor; binds FKBP Blocks T-cell activation and B-cell differentiation by preventing response to IL-2"
      - kind: explain
        title: "الـ calcineurin inhibitors"
        text: |-
          الاتنين بيمنعوا ==IL-2 transcription==، يعني الـ T cell ما تتشغلش.

          - **Cyclosporine**: بيمسك الـ **cyclophilin**. psoriasis و RA. toxicity: nephrotoxicity، hypertension، hyperlipidemia، neurotoxicity، ==gingival hyperplasia و hirsutism==.
          - **Tacrolimus (FK506)**: بيمسك الـ **FKBP**. بعد الـ solid organ transplant. زي cyclosporine بس ==↑ diabetes و neurotoxicity==، ومفيش لثة ولا شعر.

          والاتنين **nephrotoxic جداً**، خصوصاً بجرعات عالية أو لو الكلى ضعيفة.
        page: 118
        quote: "Similar to cyclosporine, ↑ risk of diabetes and neurotoxicity; no gingival hyperplasia or hirsutism"
      - kind: check
        question: "A transplant patient on a calcineurin inhibitor develops new diabetes but no gum or hair changes. Which drug?"
        options:
          - "Tacrolimus"
          - "Cyclosporine"
          - "Sirolimus"
          - "Azathioprine"
        answer: 0
        why:
          - "صح: tacrolimus بيعلّي خطر الـ diabetes ومن غير gingival hyperplasia أو hirsutism."
          - "Cyclosporine بيعمل لثة وشعر."
          - "Sirolimus مش calcineurin inhibitor (mTOR)."
          - "Azathioprine antimetabolite."
        page: 118
        quote: "Tacrolimus (FK506) Calcineurin inhibitor; binds FK506 binding protein (FKBP)"
      - kind: explain
        title: "Sir Basil بيحمي الكلية"
        text: |-
          - **Sirolimus (rapamycin)**: بيمسك الـ FKBP زي tacrolimus، بس بيوقف ==mTOR== فالخلية ما تردش على الـ IL-2. للـ kidney transplant بالذات، و**مش nephrotoxic** (Kidney «sir-vives»). synergistic مع cyclosporine، وموجود في الـ drug-eluting stents. toxicity: ==«Pansirtopenia»==، insulin resistance، hyperlipidemia.
          - **Basiliximab**: monoclonal antibody ضد الـ **IL-2R**. toxicity: edema، hypertension، tremor.

          الكتاب: «Sir Basil's kidney transplant».
        page: 118
        quote: "Kidney transplant rejection prophylaxis specifically Sir Basil’s kidney transplant “Pansirtopenia” (pancytopenia), insulin resistance, hyperlipidemia; not nephrotoxic"
      - kind: aside
        tone: trap
        text: "Tacrolimus و sirolimus ==الاتنين بيمسكوا FKBP==، بس الأول بيقفل calcineurin (قبل الـ IL-2)، والتاني بيقفل mTOR (بعد الـ IL-2). وحاجتين تانيين تحفظهم لوحدهم: sirolimus مش nephrotoxic، وبيعمل pancytopenia."
        page: 118
        quote: "Sirolimus (Rapamycin) mTOR inhibitor; binds FKBP"
      - kind: explain
        title: "الـ antimetabolites"
        text: |-
          - **Azathioprine**: precursor للـ ==6-mercaptopurine==، بيوقف تكاثر الـ lymphocytes بمنع الـ nucleotide synthesis. RA، Crohn، glomerulonephritis. toxicity: **pancytopenia**. (الكتاب: انطقها «azathio-purine».)
          - **Mycophenolate mofetil**: بيوقف ==IMP dehydrogenase== (reversible) فيمنع الـ purine synthesis في الـ B و T. glucocorticoid-sparing في الـ rheumatic disease. GI upset، pancytopenia، hypertension؛ أقل nephrotoxic و neurotoxic؛ ومرتبط بـ **invasive CMV**.
        page: 119
        quote: "Mycophenolate mofetil Reversibly inhibits IMP dehydrogenase, preventing purine synthesis of B and T cells Glucocorticoid-sparing agent in rheumatic disease"
      - kind: reveal
        prompt: "مريض على azathioprine جاله gout واتكتبله allopurinol. ليه ده خطر؟"
        answer: "الـ 6-MP بيتكسر بالـ ==xanthine oxidase==، والـ allopurinol بيوقف الـ xanthine oxidase. فالـ 6-MP يتراكم ← **pancytopenia** شديدة. لازم تقلّل جرعة الـ azathioprine أو تغيّر الخطة."
        page: 119
        quote: "6-MP degraded by xanthine oxidase; toxicity ↑ by allopurinol"
      - kind: explain
        title: "الـ glucocorticoids"
        text: |-
          بيوقفوا ==NF-κB== ← ↓ transcription لـ cytokines كتير في الـ B و T، وبيعملوا T-cell apoptosis. بيتدّوا في autoimmune و inflammatory disorders كتير، adrenal insufficiency، asthma، CLL، non-Hodgkin lymphoma.

          الـ toxicity: Cushing، osteoporosis، hyperglycemia و diabetes، amenorrhea، adrenocortical atrophy، peptic ulcers، psychosis، cataracts، و ==avascular necrosis== للـ femoral head.
        page: 119
        quote: "Cushing syndrome, osteoporosis, hyperglycemia, diabetes, amenorrhea, adrenocortical atrophy, peptic ulcers, psychosis, cataracts, avascular necrosis (femoral head)"
      - kind: aside
        tone: exam
        text: "الـ WBCs بتعلى مع الـ steroids مش عشان عدوى: ده ==demargination== (الـ neutrophils اللي كانت لازقة في جدار الـ vessels بتسيبه). ولو وقفت الدوا فجأة بعد استعمال طويل ← **adrenal insufficiency**."
        page: 119
        quote: "Demargination of WBCs causes artificial leukocytosis Adrenal insufficiency may develop if drug is stopped abruptly after chronic use"
      - kind: match
        prompt: "وصّل الدوا بالـ side effect المميز"
        pairs:
          - ["Cyclosporine", "Gingival hyperplasia, hirsutism"]
          - ["Sirolimus", "Pancytopenia, not nephrotoxic"]
          - ["Mycophenolate", "Invasive CMV"]
          - ["Glucocorticoids", "Avascular necrosis of femoral head"]
          - ["Basiliximab", "Edema, hypertension, tremor"]
        why: "كل واحد ليه بصمة: لثة وشعر = cyclosporine، Pansirtopenia = sirolimus، CMV = mycophenolate، Cushing و AVN = steroids."
        page: 119
        quote: "GI upset, pancytopenia, hypertension Less nephrotoxic and neurotoxic Associated with invasive CMV infection"
      - kind: table
        title: "الـ recombinant cytokines"
        columns: ["Agent", "Use"]
        rows:
          - ["Epoetin alfa (EPO)", "Anemia, especially renal failure; ↑ hypertension, thromboembolism"]
          - ["Filgrastim (G-CSF), sargramostim (GM-CSF)", "Leukopenia; granulocyte and monocyte recovery"]
          - ["Romiplostim, eltrombopag (TPO)", "Autoimmune thrombocytopenia"]
          - ["Aldesleukin (IL-2)", "Renal cell carcinoma, metastatic melanoma"]
          - ["IFN-α", "Chronic hepatitis B (and C, not preferred), RCC"]
          - ["IFN-β", "Multiple sclerosis"]
          - ["IFN-γ", "Chronic granulomatous disease"]
        hide: [[0, 1], [3, 1], [5, 1], [6, 1]]
        page: 119
        quote: "Interleukin-2 Aldesleukin Renal cell carcinoma, metastatic melanoma Interferons IFN-α Chronic hepatitis C (not preferred) and B, renal cell carcinoma IFN-β Multiple sclerosis IFN-γ Chronic granulomatous disease"
      - kind: check
        question: "Which recombinant cytokine is used for chronic granulomatous disease?"
        options:
          - "IFN-γ"
          - "IFN-β"
          - "Aldesleukin"
          - "Filgrastim"
        answer: 0
        why:
          - "صح: الـ IFN-γ بيشغّل الـ macrophages، فبيساعد في الـ CGD."
          - "IFN-β للـ multiple sclerosis."
          - "Aldesleukin (IL-2) للـ RCC والـ melanoma."
          - "Filgrastim للـ leukopenia، والـ CGD عدد الـ neutrophils فيه طبيعي."
        page: 119
        quote: "IFN-γ Chronic granulomatous disease"
      - kind: try
        items: [imm.L04.002, imm.L04.005, imm.L04.009, imm.L04.010, imm.L04.015]
    recap:
      - "Cyclosporine (cyclophilin) و tacrolimus (FKBP): calcineurin، ↓ IL-2، nephrotoxic. لثة وشعر = cyclosporine؛ diabetes = tacrolimus."
      - "Sirolimus: mTOR، مش nephrotoxic، pansirtopenia. Basiliximab: anti-IL-2R."
      - "Azathioprine + allopurinol = pancytopenia. Mycophenolate = IMP dehydrogenase و CMV."
      - "Steroids: NF-κB، demargination، و AVN. IFN-γ = CGD، IFN-β = MS، IL-2 = RCC و melanoma."
