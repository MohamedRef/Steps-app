  - id: imm.L02.lesson3
    title: "إشارتين عشان تشتغل: activation و tolerance"
    hook: "الـ T cell محتاجة مفتاحين زي خزنة البنك، ولو جالها مفتاح واحد بتنام للأبد"
    minutes: 8
    pages: [100, 101]
    topics: [macrophage-lymphocyte-interaction, cytotoxic-t-cells, regulatory-t-cells, t-and-b-cell-activation, peripheral-tolerance, anergy]
    goals:
      - "تفهم الـ Th1 بتقوّي الـ macrophage إزاي"
      - "تعرف الـ Treg markers و IPEX"
      - "تحفظ signal 1 و signal 2 للـ T و B cells"
      - "تفهم الـ anergy والـ peripheral tolerance"
    status: unverified
    steps:
      - kind: explain
        title: "الـ macrophage والـ Th1: شراكة"
        text: |-
          الـ macrophage بيبلع الميكروب ويعرضه على الـ T cell (antigen presentation). الـ Th1 بترد الجميل:

          - بتطلّع ==IFN-γ== يخلّي الـ macrophage يقتل اللي بلعه أحسن.
          - والـ **CD40L** بتاعها يمسك الـ **CD40** على الـ macrophage فيقوّيه أكتر.
        page: 100
        quote: "Th1 cells secrete IFN-γ, which enhances the ability of monocytes and macrophages to kill microbes they ingest. This function is also enhanced by interaction of T cell CD40L with CD40 on macrophages."
      - kind: explain
        title: "الـ CD8+ والـ Treg"
        text: |-
          - **Cytotoxic T cells**: بتقتل خلايا الفيروس والـ tumor وخلايا الـ graft بالـ ==apoptosis==، بـ granules جاهزة (perforin و granzyme B). الـ CD8 بيمسك الـ MHC I.
          - **Regulatory T cells**: بتوقف الـ CD4+ والـ CD8+ عشان الـ tolerance. علامتها ==CD3 و CD4 و CD25 و FOXP3==، وبتطلّع IL-10 و TGF-β.
        page: 100
        quote: "Identified by expression of CD3, CD4, CD25, and FOXP3. Activated regulatory T cells (Tregs) produce anti-inflammatory cytokines (eg, IL-10, TGF-β)."
      - kind: aside
        tone: exam
        text: "**IPEX** = Immune dysregulation، Polyendocrinopathy، Enteropathy، X-linked. مفيش ==FOXP3== ← مفيش Treg ← autoimmunity: إسهال (enteropathy)، endocrinopathy، nail dystrophy، dermatitis. الصورة الكلاسيكية: ==ولد رضيع عنده diabetes== وإسهال و eczema."
        page: 100
        quote: "IPEX (Immune dysregulation, Polyendocrinopathy, Enteropathy, X-linked) syndrome— genetic deficiency of FOXP3 → autoimmunity."
      - kind: check
        question: "A male infant has intractable diarrhea, eczematous dermatitis and insulin-requiring diabetes. Which marker is missing from his regulatory T cells?"
        options:
          - "FOXP3"
          - "AIRE"
          - "CD16"
          - "TAP"
        answer: 0
        why:
          - "صح: ده IPEX، نقص FOXP3."
          - "الـ AIRE في خلايا الـ thymic medulla مش في الـ Treg، ونقصه بيعمل CHAR."
          - "CD16 على الـ NK cells للـ ADCC."
          - "الـ TAP بيحمّل MHC I."
        page: 100
        quote: "Associated with diabetes in male infants."
      - kind: explain
        title: "مفتاحين للخزنة"
        text: |-
          الـ APCs: B cells و dendritic cells و Langerhans cells و macrophages. الـ APC يبلع الـ antigen ويروح الـ **draining lymph node**.

          - ==Signal 1==: الـ antigen على MHC II يقابل الـ TCR بتاع CD4+ (أو على MHC I للـ CD8+).
          - ==Signal 2== (costimulation): **B7 (CD80/86)** على الـ dendritic cell يمسك **CD28** على الـ naïve T cell.

          الاتنين مع بعض ← proliferation و survival: الـ Th تطلّع cytokines، والـ Tc تقدر تقتل.
        page: 101
        quote: "Proliferation and survival (signal 2): costimulatory signal via interaction of B7 protein (CD80/86) on dendritic cell and CD28 on naïve T cell."
      - kind: figure
        title: "Signal 1 و Signal 2"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="20" width="120" height="130" rx="14"/>
            <text x="38" y="40" class="t-sm t-b">APC</text>
            <rect class="fg-good" x="230" y="20" width="120" height="130" rx="14"/>
            <text x="250" y="40" class="t-sm t-b">Naïve T cell</text>
            <rect class="fg-ink" x="130" y="55" width="40" height="22" rx="4"/><text x="134" y="70" class="t-sm">MHC</text>
            <rect class="fg-ink" x="190" y="55" width="40" height="22" rx="4"/><text x="196" y="70" class="t-sm">TCR</text>
            <line class="fg-arrow" x1="170" y1="66" x2="190" y2="66"/>
            <text x="150" y="50" class="t-sm t-acc">signal 1</text>
            <rect class="fg-ink" x="130" y="105" width="40" height="22" rx="4"/><text x="137" y="120" class="t-sm">B7</text>
            <rect class="fg-ink" x="190" y="105" width="40" height="22" rx="4"/><text x="193" y="120" class="t-sm">CD28</text>
            <line class="fg-arrow" x1="170" y1="116" x2="190" y2="116"/>
            <text x="150" y="145" class="t-sm t-acc">signal 2</text>
          </svg>
        caption: "Signal 1 = الـ antigen على الـ MHC بيقابل الـ TCR (مع CD4 أو CD8). Signal 2 = B7 (CD80/86) بيمسك CD28. واحد من غير التاني ← anergy."
        alt: "An antigen-presenting cell on the left and a naive T cell on the right. Top pair: MHC binding the T-cell receptor, labelled signal 1. Bottom pair: B7 binding CD28, labelled signal 2."
        page: 101
        quote: "T-cell activation (signal 1): exogenous antigen is presented on MHC II and recognized by TCR on Th (CD4+) cell."
      - kind: explain
        title: "والـ B cell؟"
        text: |-
          الـ B cell تبلع الـ antigen بالـ **BCR** وتعرضه على MHC II للـ Th (signal 1). بعدين:

          - ==CD40 على الـ B cell يمسك CD40L على الـ Th== (signal 2).
          - الـ Th تطلّع cytokines تحدد الـ B cell هتعمل class switch لأنهي Ig.

          الـ B cell تعمل **IgM** الأول، وبعدين class switching و affinity maturation.
        page: 101
        quote: "CD40 receptor on B cell binds CD40 ligand (CD40L) on Th cell. Th cells secrete cytokines that determine Ig class switching of B cells. B cells are activated and produce IgM. They undergo class switching and affinity maturation."
      - kind: reveal
        prompt: "لو الـ CD40L بايظ، تتوقع الـ immunoglobulins تبقى عاملة إزاي؟"
        answer: "الـ B cells هتعمل **IgM** عادي (ده أول حاجة من غير switch)، بس ==مش هتقدر تعمل class switch== للـ IgG و IgA و IgE. يعني IgM عالي أو طبيعي وكل الباقي واطي."
        page: 101
        quote: "B cells are activated and produce IgM. They undergo class switching and affinity maturation."
      - kind: explain
        title: "Peripheral tolerance"
        text: |-
          الـ thymus مش بيمسك كل حاجة، فبرّه الـ thymus والـ bone marrow فيه 3 خطوط تانية بتوقف الخلايا اللي بتهاجم الـ self:

          - **Anergy**
          - **Treg suppression**
          - **Apoptosis** بالـ ==Fas–FasL pathway==

          لو الـ peripheral tolerance راحت ← **autoimmunity**.
        page: 101
        quote: "Suppression/inactivation of self-reactive T/B cells (outside thymus/bone marrow) → preserves self- tolerance; loss → autoimmunity. Mechanisms: anergy, regulatory T-cell suppression, apoptosis (Fas–FasL pathway)."
      - kind: aside
        tone: analogy
        text: "**Anergy** زي خزنة بمفتاحين: لو حد جه بمفتاح واحد بس (signal 1 من غير signal 2)، الخزنة ==بتقفل نفسها للأبد==. ده منطقي: الـ self antigens بتتعرض عادة من غير التهاب، فمفيش B7، فالـ T cell اللي بتشوفها تنام."
        page: 101
        quote: "T and B cells become anergic when exposed to their antigen without costimulatory signal (signal 2)."
      - kind: check
        question: "A T cell meets its antigen on MHC II, but the presenting cell has no B7. What happens to this T cell?"
        options:
          - "It becomes anergic"
          - "It proliferates and makes IL-2"
          - "It becomes a plasma cell"
          - "It undergoes positive selection"
        answer: 0
        why:
          - "صح: signal 1 من غير signal 2 = anergy."
          - "الـ proliferation محتاجة الإشارتين."
          - "الـ plasma cells جاية من B cells."
          - "الـ positive selection في الـ thymic cortex أثناء التطور."
        page: 101
        quote: "Anergy State during which a cell cannot become activated by exposure to its antigen."
      - kind: try
        items: [imm.L02.044, imm.L02.046, imm.L02.050, imm.L02.051, imm.L02.057]
    recap:
      - "Th1 بتقوّي الـ macrophage بالـ IFN-γ و CD40L-CD40."
      - "Treg: CD3، CD4، CD25، FOXP3؛ نقص FOXP3 = IPEX (ولد رضيع، diabetes، إسهال)."
      - "T: signal 1 = MHC + TCR، signal 2 = B7-CD28. B: CD40-CD40L، وبعدين class switch."
      - "Peripheral tolerance: anergy و Tregs و Fas-FasL."
