            <text x="250" y="15" class="t-sm t-bad">can't swallow → poly</text>
          </svg>
        caption: "المية زي الحوض: الحنفية أساساً بول الجنين، والبلاعة أساساً إنه يبلع. لو الحنفية اتقفلت يبقى oligohydramnios، ولو البلاعة اتسدت يبقى polyhydramnios."
        alt: "Amniotic fluid in the centre. Arrows in from fetal urine (main) and lung liquid; arrows out to fetal swallowing (main) and intramembranous absorption. No urine gives oligohydramnios; inability to swallow gives polyhydramnios."
        page: 634
        quote: "Derived from fetal urine (mainly) and fetal lung liquid. Cleared by fetal swallowing (mainly) and intramembranous absorption."
      - kind: sort
        prompt: "كل سبب ده بيعمل مية كتير ولا قليلة؟"
        bins: ["Polyhydramnios", "Oligohydramnios"]
        cards:
          - { text: "Duodenal atresia", bin: 0 }
          - { text: "Anencephaly", bin: 0 }
          - { text: "Maternal diabetes", bin: 0 }
          - { text: "Multifetal gestation", bin: 0 }
          - { text: "Bilateral renal agenesis", bin: 1 }
          - { text: "Posterior urethral valves", bin: 1 }
          - { text: "Placental insufficiency", bin: 1 }
          - { text: "Fetal anemia", bin: 0 }
        why: "الـ atresia والـ anencephaly الجنين ما بيعرفش يبلع ← poly. الـ renal agenesis والـ urethral valves الجنين ما بيعرفش يطلّع بول ← oligo، ولو شديد يعمل Potter sequence."
        page: 634
        quote: "Associated with placental insufficiency, bilateral renal agenesis, posterior urethral valves (in males); these result in inability to excrete urine. Profound oligohydramnios can cause Potter sequence."
      - kind: explain
        title: "التوائم: الوقت بيحدد الأكياس"
        text: |-
          **Dizygotic** (حوالي 2/3): بويضتين وحيوانين منويين، فدايماً ==2 chorion و 2 amnion==.

          **Monozygotic** (حوالي 1/3): بويضة واحدة اتقسمت. وكل ما القسمة **تتأخر**، كل ما الأغشية تكون اتعملت فيشتركوا فيها أكتر. الكتاب بيقولها: «take separate cars or share a ==CAB==»:
          - 0-4 أيام: كل واحد عربيته (di-di).
          - 4-8 أيام: **C**horion مشترك (mo-di)، وده الأشهر، حوالي 75%.
          - 8-12 يوم: Chorion و **A**mnion (mo-mo).
          - 13+ يوم: و **B**ody كمان: conjoined.
        page: 635
        quote: "Splitting 0-4 days: separate chorion and amnion (di-di) ▘ Splitting 4-8 days: shared Chorion (mo-di) ▘ Splitting 8-12 days: shared chorion and Amnion (mo-mo) ▘ Splitting 13+ days: shared chorion, amnion, and Body (mo-mo; conjoined)"
      - kind: order
        prompt: "رتّب أنواع الـ monozygotic twins من أبدري قسمة لأتأخرها"
        steps:
          - "Dichorionic diamniotic"
          - "Monochorionic diamniotic"
          - "Monochorionic monoamniotic"
          - "Conjoined"
        why: "C ثم A ثم B: الأول بيشتركوا في الـ Chorion، وبعدين الـ Amnion، وبعدين الـ Body."
        page: 635
        quote: "The timing of splitting determines chorionicity (number of chorions) and amnionicity (number of amnions) (take separate cars or share a CAB)"
      - kind: explain
        title: "Twin-twin transfusion"
        text: |-
          بيحصل بس في الـ ==monochorionic== لأن عندهم placenta واحدة. لو فيه **arteriovenous anastomoses** مش متوازنة، الدم يروح من توأم للتاني:

          - **Donor**: hypovolemia ← بول أقل ← oligohydramnios، ويبان ==«stuck twin»== لازق في الحيطة.
          - **Recipient**: hypervolemia ← بول أكتر ← polyhydramnios.
        page: 635
        quote: "Occurs in monochorionic twin gestations. Unbalanced arteriovenous anastomoses between twins in shared placenta → net blood flow from one twin to the other."
      - kind: check
        question: "Ultrasound shows twins in one sac, one placenta, no dividing membrane, not conjoined. When did the zygote split?"
        options:
          - "Days 8-12"
          - "Days 0-4"
          - "Days 4-8"
          - "Day 13 or later"
        answer: 0
        why:
          - "صح: Chorion و Amnion مشتركين من غير Body = mo-mo، يعني 8-12 يوم."
          - "0-4 أيام كل واحد ليه chorion و amnion."
          - "4-8 أيام chorion واحد بس amnion اتنين، فيبقى فيه membrane."
          - "13+ يوم يبقوا conjoined."
        page: 635
        quote: "Splitting 8-12 days: shared chorion and Amnion (mo-mo)"
      - kind: explain
        title: "الحبل السري"
        text: |-
          **2 arteries** و **1 vein**، وكلهم من الـ ==allantois==.

          - الـ arteries بترجّع الدم **الوحش** من الـ internal iliac arteries للـ placenta (عكس الكبار: الـ artery هنا شايلة دم مش مؤكسج).
          - الـ vein بتجيب الدم **الحلو** وتصب في الـ IVC عن طريق الكبد أو الـ ductus venosus.

          لو فيه **artery واحدة** بس (2-vessel cord) ده بيجي مع ==congenital و chromosomal anomalies==.
        page: 636
        quote: "Two umbilical arteries return deoxygenated blood from fetal internal iliac arteries to placenta. One umbilical vein supplies oxygenated blood from placenta to fetus; drains into IVC via liver or via ductus venosus. Single umbilical artery (2-vessel cord) is associated with congenital and chromosomal anomalies."
      - kind: figure
        title: "قناتين بتقفلوا، و3 درجات فشل"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
