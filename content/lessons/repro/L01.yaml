            <text x="312" y="85" class="t-sm">genitalia</text>
            <text x="300" y="102" class="t-sm t-mut">"geneightalia"</text>
          </svg>
        caption: "رقم الأسبوع هو نفسه رقم الحاجة: أسبوع 2 طبقتين، أسبوع 3 تلات طبقات، أسبوع 4 أربع غرف وأربع أطراف، وأسبوع 8 الأعضاء التناسلية («geneightalia»)."
        alt: "A timeline of weeks 1, 2, 3, 4 and 8: implantation on day 6 with hCG, the bilaminar disc, the trilaminar disc by gastrulation, the four-chambered heart and four limb buds, and male or female genitalia by week 8."
        page: 630
        quote: "Week 4 Heart begins to beat (four chambers). Cardiac activity visible by transvaginal ultrasound. Upper and lower limb buds begin to form (four limbs). Week 8 Genitalia have male/female characteristics (pronounce “geneightalia”)."
      - kind: check
        question: "A transvaginal ultrasound first shows embryonic cardiac activity. Which other event starts in the same week of development?"
        options:
          - "Upper and lower limb buds begin to form"
          - "Bilaminar disc forms"
          - "Genitalia show male or female characteristics"
          - "Blastocyst implants"
        answer: 0
        why:
          - "صح: أسبوع 4 أسبوع الأربعات: القلب بأربع غرف بيدق، وأربع limb buds بتبدأ."
          - "الـ bilaminar disc في أسبوع 2."
          - "الأعضاء التناسلية بتبان في أسبوع 8."
          - "الـ implantation يوم 6، يعني أسبوع 1."
        page: 630
        quote: "Week 4 Heart begins to beat (four chambers). Cardiac activity visible by transvaginal ultrasound. Upper and lower limb buds begin to form (four limbs)."
      - kind: explain
        title: "الـ ectoderm: الطبقة اللي برّه"
        text: |-
          الـ ectoderm ليه 3 أنواع، وكل نوع ليه شخصية:

          - **Surface ectoderm**: الجلد (epidermis) وكل حاجة بتبطّن فتحة من برّه: بطانة الفم، الـ anal canal ==تحت الـ pectinate line==، الـ lens، والـ olfactory epithelium. ومعاهم الغدد: parotid و sweat و mammary. والمفاجأة: الـ **adenohypophysis** (من الـ Rathke pouch).
          - **Neural tube** (neuroectoderm): فكّر **CNS**: neurons و oligodendrocytes و astrocytes و ependymal cells و pineal و **neurohypophysis**، والـ retina والـ spinal cord.
          - **Neural crest**: فكّر **PNS** والحاجات اللي جنبه، وكلها **S100 positive**.
        page: 631
        quote: "Surface ectoderm Epidermis; adenohypophysis (from Rathke pouch); lens of eye; epithelial linings of oral cavity, sensory organs of ear, and olfactory epithelium; anal canal below the pectinate line; parotid, sweat, mammary glands."
      - kind: aside
        tone: exam
        text: "ولد صغير عنده صداع و bitemporal hemianopia وفي الـ CT كتلة suprasellar فيها ==calcification==؟ ده **craniopharyngioma**: ورم benign من الـ Rathke pouch، فيه cholesterol crystals. يعني أصله surface ectoderm، مش neural tube."
        page: 631
        quote: "Craniopharyngioma—benign Rathke pouch tumor with cholesterol crystals, calcifications."
      - kind: mnemonic
        word: "EMOPASSES"
        parts:
          - { key: "E", text: "Enterochromaffin cells" }
          - { key: "M", text: "Melanocytes" }
          - { key: "O", text: "Odontoblasts" }
          - { key: "P", text: "PNS ganglia (cranial, dorsal root, autonomic)" }
          - { key: "A", text: "Adrenal medulla" }
          - { key: "S", text: "Schwann cells" }
          - { key: "S", text: "Spiral membrane (aorticopulmonary septum)" }
          - { key: "E", text: "Endocardial cushions (partly mesoderm too)" }
          - { key: "S", text: "Skull bones" }
        hook: "الكتاب بيقولها EMO PASSES: الـ neural crest «إيمو» بس بيعدّي في كل حتة في الجسم"
        page: 631
        quote: "Neural crest Enterochromaffin cells, Melanocytes, Odontoblasts, PNS ganglia (cranial, dorsal root, autonomic), Adrenal medulla, Schwann cells, Spiral membrane (aorticopulmonary septum), Endocardial cushions (also derived partially from mesoderm), Skull bones. EMO PASSES"
      - kind: explain
        title: "الـ mesoderm: اللحمة"
        text: |-
          الكتاب بيسميه الطبقة الـ «meat»: ==عضلات وعظم و connective tissue==، والدم والأوعية والـ lymphatics، والـ serous linings (peritoneum و pericardium و pleura)، وجدار الـ gut tube، والكلى، والـ **adrenal cortex**، والـ dermis، والـ testes والـ ovaries، والـ **proximal vagina**، والـ tracheal cartilage.

          والفخين اللي بيتسألوا: الـ **spleen** (بيطلع جوه الـ foregut mesentery، بس هو mesoderm مش endoderm) والـ ==microglia== (macrophages، يعني من الدم، مش من الـ neural tube زي باقي الـ glia).
        page: 631
        quote: "Mesoderm Muscle, bone, connective tissue, serous linings of body cavities (eg, peritoneum, pericardium, pleura), spleen (develops within foregut mesentery), cardiovascular structures, lymphatics, blood, wall of gut tube, proximal vagina, kidneys, adrenal cortex, dermis, testes, ovaries, microglia, tracheal cartilage."
      - kind: reveal
        prompt: "الـ notochord بيعمل الـ neural plate. طب فاضل منه إيه بعد الولادة؟"
        answer: "حاجة واحدة بس: الـ **nucleus pulposus** في الـ intervertebral disc."
        page: 631
        quote: "its only postnatal derivative is the nucleus pulposus of the intervertebral disc."
      - kind: aside
        tone: tip
        text: "عيوب الـ mesoderm بتيجي مع بعض: ==VACTERL== = Vertebral و Anal atresia و Cardiac و Tracheo-Esophageal fistula و Renal و Limb. كلهم عضلة وعظم وأوعية، يعني «لحمة»."
        page: 631
        quote: "Mesodermal defects = VACTERL association: Vertebral defects Anal atresia Cardiac defects Tracheo-Esophageal fistula Renal defects Limb defects (bone and muscle)"
      - kind: explain
        title: "الـ endoderm: الطبقة اللي جوه"
        text: |-
          الكتاب بيسميه «Enternal»: ==بطانة الـ gut tube== (والـ anal canal **فوق** الـ pectinate line)، وكل حاجة طلعت من الأنبوبة دي كـ epithelium: lungs و liver و gallbladder و pancreas و eustachian tube و thymus و parathyroid و thyroid (follicular و C cells).

          ومن الـ **urogenital sinus**: معظم الـ urethra والـ ==distal vagina==.
        page: 631
        quote: "Endoderm Gut tube epithelium (including anal canal above the pectinate line), most of urethra and distal vagina (derived from urogenital sinus), luminal epithelial derivatives (eg, lungs, liver, gallbladder, pancreas, eustachian tube, thymus, parathyroid, thyroid follicular and parafollicular [C] cells)."
      - kind: sort
        prompt: "حط كل حاجة في الطبقة اللي طلعت منها"
        bins: ["Ectoderm (surface or neural)", "Neural crest", "Mesoderm", "Endoderm"]
        cards:
          - { text: "Adenohypophysis", bin: 0 }
          - { text: "Microglia", bin: 2 }
          - { text: "Spleen", bin: 2 }
          - { text: "Adrenal medulla", bin: 1 }
          - { text: "Adrenal cortex", bin: 2 }
          - { text: "Thyroid follicular cells", bin: 3 }
          - { text: "Melanocytes", bin: 1 }
          - { text: "Distal vagina", bin: 3 }
          - { text: "Oligodendrocytes", bin: 0 }
        why: "الـ adrenal متقسومة: cortex من الـ mesoderm و medulla من الـ neural crest. والـ microglia والـ spleen mesoderm، والـ distal vagina من الـ urogenital sinus (endoderm)."
        page: 631
        quote: "Mesoderm Muscle, bone, connective tissue, serous linings of body cavities (eg, peritoneum, pericardium, pleura), spleen (develops within foregut mesentery)"
      - kind: try
        items: [repro.L01.003, repro.L01.005, repro.L01.011, repro.L01.013, repro.L01.018]
    recap:
      - "يوم 6 implantation و hCG، أسبوع 2 طبقتين، أسبوع 3 تلاتة، أسبوع 4 قلب وأطراف، أسبوع 8 genitalia."
      - "Surface ectoderm فيه الـ adenohypophysis (craniopharyngioma)، والـ neural tube = CNS."
      - "Neural crest = EMO PASSES، وكلها S100."
      - "الـ spleen والـ microglia والـ adrenal cortex mesoderm. الـ notochord يفضل منه nucleus pulposus."
