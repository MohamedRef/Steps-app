  - id: repro.L01.lesson3
    title: "الـ placenta والمية والتوائم والحبل السري"
    hook: "مية كتير ولا قليلة؟ توأم في كيس واحد ولا اتنين؟ كله بيتحل بسؤال واحد: مين بيعمل إيه ومين بيشيل إيه"
    minutes: 10
    pages: [634, 636]
    topics: [placenta, amniotic-fluid, twinning, twin-twin-transfusion, umbilical-cord, urachus, vitelline-duct]
    status: unverified
    steps:
      - kind: explain
        title: "الـ placenta: طبقتين من الجنين وواحدة من الأم"
        text: |-
          الـ placenta هي ==المكان الأساسي لتبادل الغذاء والغازات== بين الأم والجنين.

          - **Cytotrophoblast**: الطبقة الجوانية في الـ chorionic villi، شغلتها ==تعمل خلايا==.
          - **Syncytiotrophoblast**: الطبقة البرانية، بتعمل الهرمونات زي **hCG**. والأهم إنها ما فيهاش **MHC I**، فمناعة الأم ما تشوفهاش وما تهاجمهاش.
          - **Decidua basalis**: الجزء بتاع الأم، من الـ endometrium، ودم الأم في الـ lacunae.
        page: 634
        quote: "Cytotrophoblast Inner layer of chorionic villi; creates cells. Syncytiotrophoblast Outer layer of chorionic villi; synthesizes and secretes hormones, eg, hCG"
      - kind: reveal
        prompt: "الـ hCG شبه أنهي هرمون، وده بيفيد في إيه في أول 3 شهور؟"
        answer: "شبه الـ **LH** في التركيب. فبيكلم الـ **corpus luteum** زي ما الـ LH بيكلمه، ويخليه يكمّل يعمل **progesterone** طول الـ first trimester لحد ما الـ placenta تشيل الشغلة."
        page: 634
        quote: "hCG (structurally similar to LH; stimulates corpus luteum to secrete progesterone during first trimester)"
      - kind: figure
        title: "المية بتيجي منين وبتروح فين"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rp1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp1c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="125" y="60" width="110" height="60" rx="30"/>
