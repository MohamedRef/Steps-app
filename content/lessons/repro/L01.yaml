            <circle class="fg-dot-acc" cx="255" cy="60" r="6"/>
            <circle class="fg-dot-good" cx="335" cy="60" r="6"/>
            <text x="18" y="40" class="t-sm t-b">Wk 1</text>
            <text x="93" y="40" class="t-sm t-b">Wk 2</text>
            <text x="168" y="40" class="t-sm t-b">Wk 3</text>
            <text x="243" y="40" class="t-sm t-b">Wk 4</text>
            <text x="320" y="40" class="t-sm t-b">Wk 8</text>
            <text x="8" y="85" class="t-sm">implants day 6</text>
            <text x="8" y="102" class="t-sm t-mut">hCG starts</text>
            <text x="88" y="85" class="t-sm">2 layers</text>
