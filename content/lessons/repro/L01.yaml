  - id: repro.L01.lesson2
    title: "الـ teratogens: إمتى وإزاي الدوا بيأذي الجنين"
    hook: "الكتاب حاططلك لكل دوا تحشيشة جاهزة. تعالى نربطها بالسبب عشان ما تتلخبطش"
    minutes: 9
    pages: [632, 633]
    topics: [teratogens, errors-in-morphogenesis, fetal-alcohol-syndrome, neonatal-abstinence-syndrome]
    status: unverified
    steps:
      - kind: explain
        title: "التوقيت أهم من الدوا"
        text: |-
          - **قبل الـ implantation**: ==all-or-none==. يا الجنين يموت، يا يكمّل سليم.
          - **من الـ implantation لحد أسبوع 8** (embryonic period): ده وقت الـ ==organogenesis==، وهنا أكتر وقت حساس. الأعضاء بتتبني، فالدوا يعمل **malformation**.
          - **بعد أسبوع 8** (fetal period): الأعضاء خلاص اتبنت، فالضرر بيبقى في **النمو والوظيفة**.
        page: 632
        quote: "Most susceptible during organogenesis in embryonic period (before week 8 of development). Before implantation, “all-or-none” effect. After week 8 (fetal period), growth and function affected."
      - kind: table
        title: "الأدوية وتحشيشات الكتاب"
        columns: ["Drug", "Effect", "Book's hook"]
        rows:
          - ["Aminoglycosides", "Ototoxicity", "A mean guy hit the baby in the ear"]
          - ["Isotretinoin", "Craniofacial, CNS, cardiac, thymic defects", "isoteratinoin"]
          - ["Tetracyclines", "Discolored teeth, inhibited bone growth", "teethracyclines"]
          - ["Thalidomide", "Limb defects (phocomelia)", "thalimbdomide"]
          - ["Warfarin", "Bone/cartilage deformities, optic atrophy, cerebral hemorrhage", "War: strong bones and optics"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
        page: 632
        quote: "Aminoglycosides Ototoxicity. “A mean guy hit the baby in the ear.”"
      - kind: explain
        title: "الباقيين بالمنطق"
        text: |-
          - **ACE inhibitors**: الكلية في الجنين محتاجة الـ angiotensin II عشان تعمل بول، فـ ==renal failure== ← بول أقل ← **oligohydramnios**، ومعاه hypocalvaria.
          - **Antiepileptics** (valproate و carbamazepine و phenytoin و phenobarbital) و **folate antagonists** (trimethoprim و methotrexate): بيلعبوا في الـ folate ← ==neural tube defects==. عشان كده high-dose folate للست اللي على antiepileptics.
          - **Lithium**: ==Ebstein anomaly== (الـ tricuspid نازل جوه الـ RV).
          - **Methimazole**: aplasia cutis congenita، جلد ناقص في الـ scalp.
          - **DES**: clear cell adenocarcinoma في المهبل، و Müllerian anomalies.
          - **Fluoroquinolones**: cartilage damage. **Alkylating agents**: تشوهات متعددة (ودن، وش، صوابع ناقصة).
        page: 632
        quote: "Lithium Ebstein anomaly. Methimazole Aplasia cutis congenita (congenital absence of skin, typically on scalp)."
      - kind: reveal
        prompt: "ست حامل عندها mechanical valve ومحتاجة anticoagulant. ليه مش warfarin، وتاخد إيه؟"
        answer: "الـ warfarin بيعدّي الـ placenta ويعمل bone deformities (stippled epiphyses، nasal hypoplasia) و optic atrophy و نزيف في المخ. فتاخد **heparin** لأنه ما بيعدّيش الـ placenta."
        page: 632
        quote: "Use heparin during pregnancy (does not cross placenta)."
      - kind: check
        question: "A newborn has a downward-displaced tricuspid valve with an atrialized right ventricle. Which maternal drug is the likely cause?"
        options:
          - "Lithium"
          - "Valproate"
          - "Methimazole"
          - "ACE inhibitor"
          - "Warfarin"
        answer: 0
        why:
          - "صح: lithium = Ebstein anomaly."
          - "Valproate بيعمل neural tube defects أساساً."
          - "Methimazole بيعمل aplasia cutis congenita."
          - "ACE inhibitors بتعمل renal failure و oligohydramnios."
          - "Warfarin بيعمل bone deformities و optic atrophy و نزيف."
        page: 632
        quote: "Lithium Ebstein anomaly."
      - kind: explain
        title: "المواد والأم نفسها"
        text: |-
          - **Cocaine** و **tobacco**: الاتنين ==vasoconstriction== ← دم أقل للـ placenta ← preterm و low birth weight و FGR. والتدخين كمان الـ CO بيقلل توصيل الـ O2، وده **أكبر سبب لـ low birth weight** في الدول الغنية، ومعاه SIDS و ADHD.
          - **Maternal diabetes**: السكر بيعدّي للجنين، فالـ islets بتاعته تكبر (hyperplasia) وتعمل insulin كتير ← **macrosomia**، وبعد الولادة السكر يقع (==neonatal hypoglycemia==). ومعاها caudal regression و TGA و VSD و neural tube defects و polycythemia و RDS.
          - **Maternal PKU**: FGR و microcephaly و intellectual disability وعيوب قلب.
          - **Methylmercury**: neurotoxic، وموجود في سمك الـ top-predator (shark و swordfish و king mackerel و tilefish).
          - **X-rays**: microcephaly و intellectual disability، والـ lead shielding بيقلله. **Iodine** ناقص أو زيادة: congenital hypothyroidism.
        page: 632
        quote: "Maternal diabetes Caudal regression syndrome, cardiac defects (eg, transposition of great arteries, VSD), neural tube defects, macrosomia, neonatal hypoglycemia (due to islet cell hyperplasia), polycythemia, respiratory distress syndrome."
      - kind: match
        prompt: "وصّل كل نوع غلط في الـ morphogenesis بمثاله"
        pairs:
          - ["Disruption", "Amniotic band syndrome"]
          - ["Deformation", "Congenital torticollis"]
          - ["Malformation", "Cleft lip/palate"]
          - ["Sequence", "Oligohydramnios → Potter sequence"]
          - ["Field defect", "Holoprosencephaly"]
        why: "**Malformation** عيب جوه النسيج نفسه في الـ embryonic period. **Deformation** ضغط من برّه في الـ fetal period. **Disruption** نسيج كان سليم واتكسر (حبل بيخنق صباع). **Sequence** حدث واحد بيجرّ الباقي."
        page: 633
        quote: "Disruption 2° breakdown of tissue with normal developmental potential (eg, amniotic band syndrome). Deformation Extrinsic mechanical distortion (eg, congenital torticollis); occurs during fetal period. Malformation Intrinsic developmental defect (eg, cleft lip/palate); occurs during embryonic period."
      - kind: aside
        tone: trap
        text: "**Agenesis** ولا **aplasia**؟ الاتنين العضو مش موجود. بس في الـ agenesis ==مفيش primordial tissue أصلاً==، وفي الـ aplasia الـ primordial tissue موجود بس ما كبرش. والـ hypoplasia: موجود بس ناقص."
        page: 633
        quote: "Agenesis Absent organ due to absent primordial tissue. Aplasia Absent organ despite presence of primordial tissue. Hypoplasia Incomplete organ development; primordial tissue present."
      - kind: figure
        title: "وش الـ fetal alcohol syndrome"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rp1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <ellipse class="fg-box" cx="120" cy="105" rx="70" ry="88"/>
            <ellipse class="fg-ink" cx="95" cy="85" rx="10" ry="5"/>
            <ellipse class="fg-ink" cx="145" cy="85" rx="10" ry="5"/>
            <path class="fg-ink" d="M118 92 L112 122 L128 122" fill="none"/>
            <line class="fg-thin" x1="120" y1="126" x2="120" y2="140"/>
            <path class="fg-ink" d="M100 146 Q120 150 140 146" fill="none"/>
            <line class="fg-arrow" x1="200" y1="35" x2="140" y2="60" marker-end="url(#rp1a)"/>
            <text x="205" y="35" class="t-sm">Microcephaly</text>
            <line class="fg-arrow" x1="200" y1="80" x2="158" y2="85" marker-end="url(#rp1a)"/>
            <text x="205" y="84" class="t-sm">Small palpebral fissures</text>
            <line class="fg-arrow" x1="200" y1="108" x2="125" y2="100" marker-end="url(#rp1a)"/>
            <text x="205" y="112" class="t-sm">Flat nasal bridge</text>
            <line class="fg-arrow" x1="200" y1="135" x2="125" y2="133" marker-end="url(#rp1a)"/>
            <text x="205" y="139" class="t-sm">Smooth philtrum</text>
            <line class="fg-arrow" x1="200" y1="160" x2="142" y2="148" marker-end="url(#rp1a)"/>
            <text x="205" y="164" class="t-sm">Thin vermillion border</text>
          </svg>
        caption: "وش «ممسوح»: عين صغيرة، مناخير مفلطحة، philtrum ناعم من غير الخطين، وشفة فوق رفيعة، وراس صغيرة."
        alt: "A simple face drawing with labels for microcephaly, small palpebral fissures, flat nasal bridge, smooth philtrum and thin vermillion border."
        page: 633
        quote: "facial abnormalities (eg, smooth philtrum, thin vermillion border, small palpebral fissures, flat nasal bridge)"
      - kind: explain
        title: "FAS والـ neonatal abstinence"
        text: |-
          الـ **fetal alcohol syndrome** من ==أكبر أسباب الـ intellectual disability اللي ممكن نمنعها== في أمريكا. غير الوش: developmental delay و microcephaly و limb dislocation وعيوب قلب، وفي الحالات الشديدة holoprosencephaly. واحدة من الآليات: الـ neurons والـ glia ما بيعرفوش يهاجروا. العلاج supportive.

          الـ **neonatal abstinence syndrome**: الطفل اتعود على المادة (غالباً ==opioids==) جوه، وبعد الولادة اتقطعت فجأة ← withdrawal: عصبية، عياط عالي، tremors، tachypnea، عطس، إسهال، رضاعة مش متناسقة، وممكن seizures. العلاج: methadone أو morphine أو buprenorphine. وكل حامل تتعمللها screening.
        page: 633
        quote: "Newborns may present with uncoordinated sucking reflexes, irritability, high-pitched crying, tremors, tachypnea, sneezing, diarrhea, and possibly seizures. Treatment (for opioid use): methadone, morphine, buprenorphine."
      - kind: check
        question: "A 2-day-old is irritable with a high-pitched cry, tremors, sneezing and diarrhea. His mother used opioids. Which treatment?"
        options:
          - "Morphine"
          - "Naloxone"
          - "Supportive care only, as for fetal alcohol syndrome"
          - "High-dose folate"
        answer: 0
        why:
