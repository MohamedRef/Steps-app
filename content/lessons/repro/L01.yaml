  - id: repro.L01.lesson5
    title: "ذكر ولا أنثى؟ الـ ducts والهرمونات اللي بتقرر"
    hook: "الأنثى هي الـ default، والذكر محتاج 3 إشارات. شيل واحدة وشوف إيه اللي يحصل"
    minutes: 10
    pages: [639, 641]
    topics: [genital-embryology, sexual-differentiation, uterine-anomalies, genital-homologs, congenital-penile-abnormalities]
    status: unverified
    steps:
      - kind: explain
        title: "الأنثى default"
        text: |-
          من غير أي إشارة، الجنين بيمشي ==female==: الـ **mesonephric (Wolffian)** duct يضمر، والـ **paramesonephric (Müllerian)** duct يكمّل.

          الـ Müllerian duct بيعمل: fallopian tubes و uterus و ==proximal vagina==. الـ distal vagina من الـ urogenital sinus. وباقيه في الذكر: **appendix testis**.
        page: 639
        quote: "Female Default development. Mesonephric duct degenerates and paramesonephric duct develops."
      - kind: explain
        title: "الذكر محتاج 3 إشارات"
        text: |-
          1. **SRY** على الـ Y ← testis-determining factor ← ==testes==.
          2. الـ **Sertoli** cells ← **MIS** (anti-Müllerian hormone) ← تقفل الـ Müllerian duct.
          3. الـ **Leydig** cells ← androgens ← تكبّر الـ Wolffian duct.

          الـ Wolffian بيعمل **SEED**: Seminal vesicles و Epididymis و Ejaculatory duct و Ductus deferens، ==ماعدا الـ prostate==. وباقيه في الأنثى: **Gartner duct**.
        page: 639
        quote: "Male SRY gene on Y chromosome—produces testis- determining factor → testes development. Sertoli cells secrete Müllerian-inhibiting substance (MIS, also called anti-Müllerian hormone) that suppresses development of paramesonephric ducts. Leydig cells secrete androgens that stimulate development of mesonephric ducts."
      - kind: figure
        title: "مين بيعمل إيه"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rp1d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rp1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-ink" x="130" y="8" width="100" height="28" rx="6"/>
            <text x="148" y="27" class="t-sm t-b">XY: SRY → testis</text>
            <rect class="fg-acc" x="20" y="60" width="110" height="34" rx="6"/>
            <text x="30" y="82" class="t-sm t-b">Sertoli → MIS</text>
            <rect class="fg-good" x="230" y="60" width="115" height="34" rx="6"/>
            <text x="238" y="82" class="t-sm t-b">Leydig → testosterone</text>
            <line class="fg-arrow" x1="160" y1="36" x2="90" y2="60" marker-end="url(#rp1d)"/>
            <line class="fg-arrow" x1="200" y1="36" x2="280" y2="60" marker-end="url(#rp1d)"/>
            <rect class="fg-bad" x="20" y="125" width="110" height="40" rx="6"/>
            <text x="28" y="142" class="t-sm">Müllerian duct</text>
            <text x="28" y="157" class="t-sm t-bad">regresses</text>
            <line class="fg-arrow-bad" x1="75" y1="94" x2="75" y2="125" marker-end="url(#rp1e)"/>
            <rect class="fg-good" x="160" y="125" width="90" height="40" rx="6"/>
            <text x="166" y="142" class="t-sm">Wolffian: SEED</text>
            <text x="166" y="157" class="t-sm t-mut">internal</text>
            <rect class="fg-good" x="262" y="125" width="90" height="40" rx="6"/>
            <text x="268" y="142" class="t-sm">5α-reductase</text>
            <text x="268" y="157" class="t-sm">→ DHT</text>
            <line class="fg-arrow" x1="270" y1="94" x2="210" y2="125" marker-end="url(#rp1d)"/>
            <line class="fg-arrow" x1="300" y1="94" x2="305" y2="125" marker-end="url(#rp1d)"/>
            <text x="250" y="190" class="t-sm">penis, scrotum,</text>
            <text x="250" y="204" class="t-sm">prostate</text>
            <line class="fg-arrow" x1="305" y1="165" x2="300" y2="178" marker-end="url(#rp1d)"/>
          </svg>
        caption: "الـ Sertoli بيقفل الأنثى من جوّه، والـ Leydig بيعمل الذكر جوّه (testosterone) وبرّه (عن طريق الـ DHT). الكتاب بيقولها: Leydig leads، Sertoli shuts down."
        alt: "A flow diagram. XY with SRY gives testes. Sertoli cells make MIS, which makes the Müllerian duct regress. Leydig cells make testosterone, which builds the Wolffian duct derivatives (SEED); 5-alpha-reductase converts it to DHT, which builds the penis, scrotum and prostate."
        page: 640
        quote: "In the testes: Leydig leads to male (internal and external) sexual differentiation. Sertoli shuts down female (internal) sexual differentiation."
      - kind: reveal
        prompt: "طفل XY عنده testes و testosterone طبيعي بس ما عندوش MIS. هيطلع شكله إيه؟"
        answer: "الـ Wolffian هيكبر (testosterone موجود) والـ Müllerian **ما اتقفلش** (مفيش MIS). فيبقى عنده ==internal ذكر وأنثى مع بعض==، و external ذكر (الـ DHT شغال)."
        page: 640
        quote: "In XY individuals absence of Sertoli cells or lack of Müllerian-inhibiting substance → develop both male and female internal genitalia and male external genitalia (streak gonads)"
      - kind: explain
        title: "5α-reductase deficiency"
        text: |-
          الـ testosterone موجود بس ==ما بيتحولش DHT==. فالـ internal ذكر عادي (testosterone هو اللي بيعمله)، بس الـ external مش واضح عند الولادة لأنه محتاج DHT.

          في البلوغ الـ testosterone بيعلى جامد، فيعوّض ويعمل ==masculinization==: صوت تخين، عضلات، والـ phallus يكبر.
        page: 640
        quote: "5α-reductase deficiency—inability to convert testosterone into DHT → male internal genitalia, atypical external genitalia until puberty (when ↑ testosterone levels cause masculinization)"
      - kind: check
        question: "A 46,XX girl, 16, has never menstruated. Breasts and pubic hair are normal; ultrasound shows no uterus and normal ovaries. What else should be checked?"
        options:
          - "The kidneys, for renal agenesis"
          - "Serum testosterone, for androgen excess"
          - "Smell, for anosmia"
          - "A karyotype for 45,X"
        answer: 0
        why:
          - "صح: Müllerian agenesis (MRKH) بيجي مع urinary tract anomalies زي renal agenesis."
          - "الـ ovaries شغالة والـ karyotype XX، والـ testosterone مش المشكلة."
          - "الـ anosmia مع Kallmann، وهناك البلوغ نفسه مش بيحصل."
          - "الـ karyotype اتعمل وطلع 46,XX، و Turner عنده streak ovaries."
        page: 639
        quote: "Müllerian agenesis (Mayer-Rokitansky-Küster- Hauser syndrome)—1º amenorrhea with absent uterus, blind vaginal pouch, normal female external genitalia and 2° sexual characteristics (functional ovaries). Associated with urinary tract anomalies (eg, renal agenesis)."
      - kind: figure
        title: "الـ uterus: الدكتين بيتلحموا وبعدين الحيطة تتشال"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <path class="fg-box" d="M15 30 Q50 20 85 30 L75 95 L25 95 Z"/>
            <text x="25" y="120" class="t-sm t-b">Normal</text>
            <path class="fg-box" d="M105 30 Q140 20 175 30 L165 95 L115 95 Z"/>
            <line class="fg-ink" x1="140" y1="27" x2="140" y2="80" stroke-width="3"/>
            <text x="112" y="120" class="t-sm t-b">Septate</text>
            <text x="100" y="136" class="t-sm t-mut">septum stays</text>
            <path class="fg-box" d="M195 30 Q212 22 228 40 Q244 22 262 30 L252 95 L205 95 Z"/>
            <text x="200" y="120" class="t-sm t-b">Bicornuate</text>
            <text x="192" y="136" class="t-sm t-mut">fusion incomplete</text>
            <path class="fg-box" d="M282 30 Q296 22 310 30 L305 95 L287 95 Z"/>
            <path class="fg-box" d="M318 30 Q332 22 346 30 L341 95 L323 95 Z"/>
            <text x="290" y="120" class="t-sm t-b">Didelphys</text>
            <text x="282" y="136" class="t-sm t-mut">no fusion at all</text>
          </svg>
        caption: "الـ Müllerian ducts اتنين بيتلحموا في النص، وبعدين الحيطة اللي بينهم بتتشال. لو الحيطة فضلت: septate (الشكل من برّه عادي). لو اللحام ناقص: bicornuate (قلب). لو ما فيش لحام خالص: didelphys (اتنين من كل حاجة)."
        alt: "Four uterus outlines: normal; septate with a midline septum and normal outer contour; bicornuate with a heart-shaped indented fundus; didelphys with two separate uteri."
        page: 640
        quote: "Septate uterus Incomplete resorption of septum A . Common anomaly. Treat with septoplasty. Bicornuate uterus Incomplete fusion of Müllerian ducts B . Uterus didelphys Complete failure of fusion → double uterus, cervix, vagina C ."
      - kind: aside
        tone: exam
        text: "عيوب الـ uterus بتقلل الخصوبة وبتزوّد ==abortion و prematurity و FGR و malpresentation==. والـ septate هو الشائع، وبيتعالج بـ septoplasty. والـ hysterosalpingogram الطبيعي بيبين cavity عادية والصبغة بتنزل في الـ peritoneum (يعني الـ tubes مفتوحة)."
        page: 640
        quote: "↓ fertility and ↑ risk of complicated pregnancy (eg, spontaneous abortion, prematurity, FGR, malpresentation). Hysterosalpingogram of normal uterus demonstrates normal uterine cavity and intraperitoneal spill of contrast (indicative of patent fallopian tubes)."
      - kind: match
        prompt: "وصّل كل تركيب في الذكر بالمقابل بتاعه في الأنثى"
        pairs:
          - ["Glans penis", "Glans clitoris"]
          - ["Corpus cavernosum and spongiosum", "Vestibular bulbs"]
          - ["Bulbourethral glands (Cowper)", "Greater vestibular glands (Bartholin)"]
          - ["Prostate gland", "Paraurethral glands (Skene)"]
          - ["Ventral shaft of penis", "Labia minora"]
          - ["Scrotum", "Labia majora"]
        why: "الـ genital tubercle بيعمل الـ glans والأجسام الانتصابية. الـ urogenital sinus بيعمل الغدد (Cowper = Bartholin، prostate = Skene). الـ urogenital folds بيعملوا الـ ventral shaft أو الـ labia minora، والـ labioscrotal swelling بيعمل الـ scrotum أو الـ labia majora."
        page: 641
        quote: "Bulbourethral glands (of Cowper) Urogenital sinus Greater vestibular glands (of Bartholin) Prostate gland Urogenital sinus Urethral and paraurethral glands (of Skene)"
      - kind: explain
        title: "Hypospadias و epispadias"
        text: |-
          - **Hypospadias** (hypo = تحت): الفتحة على الـ ==ventral== surface، لأن الـ **urethral folds** ما اتلحموش. أشهر من الـ epispadias، وبتيجي مع inguinal hernia و cryptorchidism و chordee، وممكن تبان في 5α-reductase deficiency (الـ folds محتاجة DHT عشان تتقفل).
          - **Epispadias** (epi = فوق): الفتحة على الـ ==dorsal== surface، لأن الـ **genital tubercle** اتحط في مكان غلط. وبتيجي مع **exstrophy of the bladder**.
        page: 641
        quote: "Hypospadias Abnormal opening of penile urethra on ventral (under) surface due to failure of urethral folds to fuse. Hypospadias is more common than epispadias. Associated with inguinal hernia, cryptorchidism, chordee"
      - kind: check
        question: "A newborn has the urethral opening on the top of the penis and an exposed bladder. What went wrong?"
        options:
          - "Faulty positioning of the genital tubercle"
          - "Failure of the urethral folds to fuse"
          - "5α-reductase deficiency"
          - "Persistent urachus"
        answer: 0
        why:
          - "صح: epispadias = genital tubercle في مكان غلط، ومعاه exstrophy of the bladder."
          - "الـ urethral folds لو ما اتلحموش يبقى hypospadias، والفتحة تحت."
          - "الـ 5α-reductase deficiency ممكن يعمل hypospadias، مش epispadias."
          - "الـ patent urachus بيطلّع بول من السُرّة."
        page: 641
        quote: "Epispadias Abnormal opening of penile urethra on dorsal (top) surface due to faulty positioning of genital tubercle. Exstrophy of the bladder is associated with epispadias."
