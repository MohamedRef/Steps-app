  - id: repro.L01.lesson4
    title: "الـ pharyngeal apparatus: الـ clefts والـ pouches والـ arches"
    hook: "رقبة السمكة اللي جوانا. اعرف الـ CAP والمطعم بتاع الكتاب، والجدول الكبير هيتحفظ لوحده"
    minutes: 10
    pages: [637, 639]
    topics: [pharyngeal-apparatus, pharyngeal-cleft-derivatives, pharyngeal-pouch-derivatives, pharyngeal-arch-derivatives, first-second-arch-syndromes, orofacial-clefts]
    status: unverified
    steps:
      - kind: explain
        title: "CAP: من برّه لجوّه"
        text: |-
          الـ pharyngeal apparatus 3 حاجات، والكتاب بيقولك ==CAP covers outside to inside==:

          - **C**lefts (برّه، grooves): **ectoderm**.
          - **A**rches (في النص): **mesoderm** للعضلات والشرايين، و ==neural crest== للعظم والغضاريف.
          - **P**ouches (جوّه): **endoderm**.
        page: 637
        quote: "CAP covers outside to inside: Clefts = ectoderm Arches = mesoderm + neural crest Pouches = endoderm"
      - kind: figure
        title: "مقطع في الـ arches"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-thin" x="10" y="20" width="340" height="130" rx="10"/>
            <text x="18" y="38" class="t-sm t-mut">outside</text>
            <text x="300" y="38" class="t-sm t-mut">inside</text>
            <path class="fg-acc" d="M20 60 L90 85 L20 110 Z"/>
            <text x="22" y="132" class="t-sm t-acc">Cleft</text>
            <text x="22" y="146" class="t-sm t-mut">ectoderm</text>
            <rect class="fg-good" x="110" y="55" width="120" height="60" rx="30"/>
            <text x="150" y="80" class="t-sm t-b">Arch</text>
            <text x="118" y="98" class="t-sm">mesoderm + crest</text>
            <path class="fg-bad" d="M340 60 L260 85 L340 110 Z"/>
            <text x="290" y="132" class="t-sm t-bad">Pouch</text>
            <text x="285" y="146" class="t-sm t-mut">endoderm</text>
          </svg>
        caption: "الـ cleft من برّه زي ثنية في الجلد، والـ pouch من جوّه زي جيب في الزور، والـ arch بينهم بعضلته وغضروفه."
        alt: "A cross-section of one pharyngeal arch: an ectodermal cleft on the outside, the arch of mesoderm plus neural crest in the middle, and an endodermal pouch on the inside."
        page: 637
        quote: "Pharyngeal clefts—derived from ectoderm. Also called pharyngeal grooves. Pharyngeal arches—derived from mesoderm (muscles, arteries) and neural crest (bones, cartilage). Pharyngeal pouches—derived from endoderm."
      - kind: explain
        title: "الـ clefts: واحد بس بيفضل"
        text: |-
          الـ **1st cleft** بيبقى ==external auditory meatus==. الباقيين (2-4) بيعملوا **cervical sinuses** مؤقتة، والـ mesenchyme بتاع الـ 2nd arch بيكبر ويقفلها.

          لو sinus فضل يبقى **pharyngeal cleft cyst**: كتلة ==lateral== في الرقبة **قدام الـ sternocleidomastoid**، وما بتتحركش مع البلع. عكس الـ thyroglossal duct cyst اللي في النص وبيتحرك.
        page: 637
        quote: "1st cleft develops into external auditory meatus. 2nd through 4th clefts form temporary cervical sinuses, which are obliterated by proliferation of 2nd arch mesenchyme. Pharyngeal cleft cyst—persistent cervical sinus; presents as lateral neck mass anterior to sternocleidomastoid muscle that does not move with swallowing"
      - kind: table
        title: "الـ pouches"
        columns: ["Pouch", "Becomes"]
        rows:
          - ["1st", "Middle ear cavity, eustachian tube, mastoid air cells"]
          - ["2nd", "Epithelial lining of palatine tonsil"]
          - ["3rd dorsal", "Inferior parathyroids"]
          - ["3rd ventral", "Thymus"]
          - ["4th dorsal", "Superior parathyroids"]
          - ["4th ventral", "Ultimopharyngeal body → parafollicular (C) cells"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
        page: 637
        quote: "1st pharyngeal pouch Middle ear cavity, eustachian tube, mastoid air cells 1st pouch contributes to endoderm-lined structures of ear 2nd pharyngeal pouch Epithelial lining of palatine tonsil"
      - kind: reveal
        prompt: "ليه الـ inferior parathyroids جاية من الـ 3rd pouch، يعني «فوق» الـ 4th، وهي في الآخر تحت؟"
        answer: "لأن الـ 3rd pouch بيطلّع الـ **thymus** كمان، والـ thymus بينزل للصدر ويشدّ معاه الـ parathyroids بتوعه لتحت. فـ structures الـ 3rd pouch بتخلص **تحت** الـ 4th. والكتاب بيقولها: 3 dorsal = **bottom**، 3 ventral = **to** (thymus)، 4 = **top**."
        page: 637
        quote: "Ear, tonsils, bottom-to-top: 1 (ear), 2 (tonsils), 3 dorsal (bottom = inferior parathyroids), 3 ventral (to = thymus), 4 (top = superior parathyroids)."
      - kind: check
        question: "A newborn with truncus arteriosus has hypocalcemic seizures and no thymic shadow. Which structures failed to develop?"
        options:
          - "3rd and 4th pharyngeal pouches"
          - "1st and 2nd pharyngeal pouches"
          - "2nd to 4th pharyngeal clefts"
          - "4th and 6th pharyngeal arches"
        answer: 0
        why:
          - "صح: DiGeorge: الـ 3rd والـ 4th pouches، فلا thymus ولا parathyroids."
          - "الـ 1st والـ 2nd بيعملوا الودن الوسطى والـ tonsil."
          - "الـ clefts 2-4 بتعمل sinuses مؤقتة بس."
          - "الـ 4th والـ 6th arches بيعملوا غضاريف وعضلات الـ larynx."
        page: 637
        quote: "Developmental anomalies in 3rd and 4th pharyngeal pouch are present in DiGeorge syndrome"
      - kind: explain
        title: "الـ arches: المطعم"
        text: |-
          الكتاب بيقول: في مطعم الـ golden arches، العيال ==first chew (1)، then smile (2)، then swallow stylishly (3) or simply swallow (4)، and then speak (6)==.

          - **1** ← CN V3 ← chew: عضلات المضغ، mylohyoid، anterior belly of digastric، tensor tympani، tensor veli palatini. وغضروفه **Meckel**: mandible و malleus و incus.
          - **2** ← CN VII ← smile: عضلات الوش، stapedius، stylohyoid، platysma، posterior belly of digastric. وغضروفه **Reichert**: stapes و styloid و lesser horn of hyoid.
          - **3** ← CN IX ← swallow **stylish**ly: **stylopharyngeus** بس، و greater horn of hyoid.
          - **4** ← superior laryngeal ← simply swallow: الـ constrictors، ==cricothyroid==، levator veli palatini.
          - **6** ← recurrent laryngeal ← speak: كل عضلات الـ larynx الداخلية **ماعدا cricothyroid**.

          الـ 4 و 6 مع بعض بيعملوا غضاريف الـ larynx (ACCCT: Arytenoids و Cricoid و Corniculate و Cuneiform و Thyroid). والـ arch 5 ما بيعملش حاجة مهمة. والـ arches 3 و 4 بيعملوا الـ posterior 1/3 of tongue.
        page: 638
        quote: "When at the restaurant of the golden arches, children tend to first chew (1), then smile (2), then swallow stylishly (3) or simply swallow (4), and then speak (6)."
      - kind: aside
        tone: trap
        text: "الأعصاب نفسها ==مش arch derivatives==. هي بتدخل الـ arch من برّه: الـ sensory من الـ neural crest والـ motor من الـ neuroectoderm."
        page: 638
        quote: "Sensory and motor nerves are not pharyngeal arch derivatives. They grow into the arches and are derived from neural crest (sensory) and neuroectoderm (motor)."
      - kind: match
        prompt: "وصّل كل عضلة بالـ arch بتاعها"
        pairs:
          - ["Tensor tympani", "1st arch"]
          - ["Stapedius", "2nd arch"]
          - ["Stylopharyngeus", "3rd arch"]
          - ["Cricothyroid", "4th arch"]
          - ["Posterior cricoarytenoid", "6th arch"]
        why: "عضلتين الودن: tensor tympani من الـ 1st (V3) و stapedius من الـ 2nd (VII). والـ cricothyroid لوحده من الـ 4th، وباقي عضلات الـ larynx من الـ 6th."
        page: 638
        quote: "6th arch: all intrinsic muscles of larynx except cricothyroid"
      - kind: explain
        title: "لما الـ 1st والـ 2nd arch يبوظوا"
        text: |-
          - **Pierre Robin sequence**: الفك صغير (==micrognathia==) ← اللسان يترجع لورا (glossoptosis) ← يمنع الـ palate يقفل (cleft palate) ويسد مجرى الهوا. حدث واحد جرّ الباقي، عشان كده اسمه **sequence**. ومشاكل الرضاعة شائعة.
          - **Treacher Collins**: autosomal dominant، ==neural crest dysfunction== ← zygomatic و mandible صغيرين، hearing loss، و airway compromise.
        page: 638
        quote: "Pierre Robin sequence Mandibular hypoplasia (micrognathia) → posteriorly displaced tongue (glossoptosis) → cleft palate, airway compromise. Feeding difficulties are common. Treacher Collins syndrome Autosomal dominant neural crest dysfunction"
      - kind: explain
        title: "الشفة والسقف"
        text: |-
          الاتنين أسبابهم مختلفة و multifactorial، بس كتير بيجوا مع بعض.

          - **Cleft lip**: الـ ==intermaxillary segment== (الـ medial nasal processes اللي اتلحموا) ما اتلحمش مع الـ **maxillary process**. ده الـ 1° palate.
          - **Cleft palate**: الـ ==lateral palatine shelves== ما اتلحموش مع بعض، أو مع الـ nasal septum أو الـ 1° palate. ده الـ 2° palate.
        page: 639
        quote: "Cleft lip Due to failure of fusion of the intermaxillary segment (merged medial nasal processes) with the maxillary process (formation of 1° palate)."
      - kind: check
        question: "A newborn has a lip gap just lateral to the midline; the palate is intact. Which fusion failed?"
        options:
          - "Intermaxillary segment with the maxillary process"
          - "The two lateral palatine shelves"
          - "Palatine shelf with the nasal septum"
          - "1st with 2nd pharyngeal arch"
        answer: 0
        why:
          - "صح: الـ cleft lip = الـ intermaxillary segment ما اتلحمش مع الـ maxillary process."
          - "الـ palatine shelves بيعملوا cleft palate، والـ palate هنا سليم."
          - "ده كمان 2° palate."
          - "الـ arches ما بتتلحمش في بعض عشان تعمل الشفة."
        page: 639
        quote: "Cleft lip Due to failure of fusion of the intermaxillary segment (merged medial nasal processes) with the maxillary process"
      - kind: try
        items: [repro.L01.073, repro.L01.077, repro.L01.079, repro.L01.086, repro.L01.090]
    recap:
      - "CAP: clefts ectoderm، arches mesoderm + neural crest، pouches endoderm."
      - "1st cleft = external auditory meatus. Cleft cyst lateral قدام الـ SCM وثابت مع البلع."
      - "Pouches: ear، tonsil، 3 = inferior parathyroid + thymus، 4 = superior parathyroid + C cells. DiGeorge = 3 و 4."
      - "Arches: chew (V3)، smile (VII)، stylishly (IX)، simply swallow و speak (X). Cricothyroid بس من الـ 4th."
