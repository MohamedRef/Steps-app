            <text x="10" y="182" class="t-sm t-mut">Total = open tract · Partial = cyst · Slight = pouch on the organ</text>
          </svg>
        caption: "نفس المنطق للقناتين: لو ما اتقفلتش خالص يبقى tract بيطلّع (بول أو meconium من السُرّة). جزئي يبقى cyst. بسيط يبقى جيب في العضو نفسه (المثانة أو الـ ileum)."
        alt: "Two rows of three boxes. Urachus: total failure gives urine at the umbilicus, partial gives a urachal cyst, slight gives a vesicourachal diverticulum. Vitelline duct: total gives meconium at the umbilicus, partial gives a cyst with volvulus risk, slight gives Meckel diverticulum of the ileum."
        page: 636
        quote: "Patent urachus Total failure of urachus to obliterate → urine discharge from umbilicus. Urachal cyst Partial failure of urachus to obliterate"
      - kind: explain
        title: "الـ urachus والـ vitelline duct"
        text: |-
          الـ **urachus** هو باقي الـ allantois جوه البطن، قناة بين المثانة والسُرّة، وبعد الولادة بيبقى ==median umbilical ligament==. لو فضل، ممكن يعمل infection أو حتى **adenocarcinoma**. الـ urachal cyst مبطّن بـ uroepithelium، ولو اتلوّث يبان كتلة بتوجع تحت السُرّة.

          الـ **vitelline duct** (omphalomesenteric) بيوصّل الـ yolk sac بالـ midgut، وبيتقفل في ==أسبوع 7==. الـ **Meckel diverticulum** true diverticulum في الـ ileum، غالباً ساكت، بس لو فيه gastric أو pancreatic tissue يعمل melena أو hematochezia أو ألم.
        page: 636
        quote: "Failure of urachus to involute can lead to anomalies that may increase risk of infection and/or malignancy (eg, adenocarcinoma) if not treated. Obliterated urachus is represented by the median umbilical ligament after birth"
      - kind: check
        question: "A 3-week-old has clear fluid that smells of urine leaking from the umbilicus. What failed?"
        options:
          - "Total failure of the urachus to obliterate"
          - "Partial failure of the urachus to obliterate"
          - "Total failure of the vitelline duct to obliterate"
          - "Slight failure of the vitelline duct to obliterate"
        answer: 0
        why:
