          - "الجزئي يعمل cyst مقفول، ما بيطلّعش بول."
          - "الـ vitelline duct المفتوح بيطلّع meconium، مش بول."
          - "الفشل البسيط في الـ vitelline duct هو Meckel diverticulum."
        page: 636
        quote: "Patent urachus Total failure of urachus to obliterate → urine discharge from umbilicus."
      - kind: try
