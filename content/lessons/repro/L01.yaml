lecture: repro.L01
lessons:
  - id: repro.L01.lesson1
    title: "أول 8 أسابيع: من الـ zygote لحد الـ 3 طبقات"
    hook: "كل عضو في الجسم طالع من طبقة من 3. اعرف مين بيطلع منين، وأسئلة الـ embryology تبقى منطق مش حفظ"
    minutes: 9
    pages: [630, 631]
    topics: [early-embryonic-development, embryologic-derivatives]
    goals:
      - "تحفظ أسابيع النمو بالأرقام اللي الكتاب بيربطها بيها"
      - "تعرف كل طبقة بتطلع إيه، وفين الفخاخ (spleen و microglia و adrenal)"
    status: unverified
    steps:
      - kind: explain
        title: "الأسبوع 1 و 2: يلزق وبعدين طبقتين"
        text: |-
          البويضة بتتخصّب، وبتنزل في الـ fallopian tube لحد ما تبقى **blastocyst**، وبتلزق في الـ endometrium ==يوم 6== («sticks» on day six). مع الـ implantation بيبدأ الـ **hCG** يتفرز، وده اللي بيخلي اختبار الحمل يطلع موجب.

          في **الأسبوع 2** بيبقى عندنا ==bilaminar disc==: طبقتين، **epiblast** و **hypoblast**. افتكرها: أسبوع 2 = طبقتين.
        page: 630
        quote: "Week 1 hCG secretion begins around the time of blastocyst implantation. Blastocyst “sticks” on day six. Week 2 Formation of bilaminar embryonic disc; two layers = epiblast, hypoblast."
      - kind: explain
        title: "الأسبوع 3: 3 طبقات"
        text: |-
          في **الأسبوع 3** بيحصل ==gastrulation==: خلايا الـ epiblast بتدخل من الـ **primitive streak** وتعمل 3 طبقات: endoderm و mesoderm و ectoderm. أسبوع 3 = 3 طبقات.

          وفي نفس الوقت الـ **notochord** (من الـ mesoderm اللي في النص) بيبعت إشارة **SHH** للـ ectoderm اللي فوقه، فيبقى **neural plate** وبعدين **neural tube**.
        page: 630
        quote: "Week 3 Formation of trilaminar embryonic disc via gastrulation (epiblast cell invagination through primitive streak); three layers = endoderm, mesoderm, ectoderm. Notochord arises from midline mesoderm and induces overlying ectoderm (via SHH) to become neural plate"
      - kind: figure
        title: "الأسابيع بالأرقام"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="60" x2="345" y2="60" stroke-width="2"/>
