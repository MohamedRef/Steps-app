          - ["Dysgerminoma", "Fried egg cells; adolescents", "↑ hCG, ↑ LDH"]
          - ["Struma ovarii", "Teratoma with thyroid tissue", "Hyperthyroidism"]
          - ["Granulosa cell tumor", "Call-Exner bodies", "↑ inhibin"]
