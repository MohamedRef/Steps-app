  - id: repro.L04.lesson4
    title: "الـ vulva والـ cervix والـ ovulation اللي مش بتحصل"
    hook: "ليه الـ PCOS بيعلّي risk الـ endometrial cancer؟ وليه الـ HPV بيعمل سرطان؟ بروتينين بس"
    minutes: 9
    pages: [661, 663]
    topics: [gynecologic-tumor-epidemiology, vulvar-pathology, imperforate-hymen, vaginal-tumors, anovulatory-infertility, polycystic-ovary-syndrome, primary-ovarian-insufficiency, functional-hypothalamic-amenorrhea, cervical-pathology, primary-dysmenorrhea, ovarian-cysts]
    status: unverified
    steps:
      - kind: explain
        title: "مين أكتر ومين أخطر"
        text: |-
          في أمريكا: ==endometrial > ovarian > cervical==. بس الـ cervical أكتر في العالم، لأن مفيش screening ولا HPV vaccine.

          الـ prognosis عكس السن: cervical أحسن (أصغر من 45)، endometrial في النص (55)، و ==ovarian الأسوأ== (فوق 65). الكتاب: «CEOs often go from best to worst as they get older».
        page: 661
        quote: "Incidence (US)—endometrial > ovarian > cervical; cervical cancer is more common worldwide due to lack of screening or HPV vaccination."
      - kind: aside
        tone: trap
        text: "**Lichen sclerosus**: plaques بيضا زي البورسلين، وممكن تلف حوالين الـ anus على شكل ==8==. Benign، بس risk بسيط لـ SCC. أما **Paget disease** في الـ vulva فـ carcinoma in situ، ونادراً تحتها سرطان، عكس Paget في الصدر."
        page: 661
        quote: "Intraepithelial adenocarcinoma. Carcinoma in situ, low risk of underlying carcinoma (vs Paget disease of the breast, which is always associated with underlying carcinoma). Presents with pruritus, erythema, crusting, ulcers D ."
      - kind: explain
        title: "الـ vulva: أبيض رفيع ولا جلد تخين؟"
        text: |-
          الـ vulva بتعمل 3 حاجات غير سرطانية، وكل واحدة شكلها بيحكي سببها:

          - **Bartholin cyst/abscess**: قناة الغدة ==اتسدّت== فالسائل اتجمّع، ولو اتلوّث يبقى abscess. في سن الإنجاب.
          - **Lichen sclerosus**: التهاب مزمن بيخلّي الجلد ==رفيع وأبيض زي البورسلين==، ممكن ينزف أو يتقرّح، ويلف حوالين الـ anus كـ 8. بيجي في البنات الصغيرين وحوالين سن اليأس، بحكة شديدة و dyspareunia. Benign بس risk بسيط لـ SCC.
          - **Lichen simplex chronicus**: العكس: من كتر الهرش والحك الجلد ==بيتخن (hyperplasia)== ويبقى leathery بخطوط واضحة. ومفيش risk لـ SCC.

          والـ **vulvar carcinoma** (SCC، بعد سن اليأس) بيبان leukoplakia، فلازم **biopsy** تفرّقه عن الباقيين. ليه نوعين: HPV-related (16، 18)، و non-HPV اللي بيطلع غالباً من lichen sclerosus قديم.
        page: 661
        quote: "Hyperplasia of vulvar squamous epithelium. Presents with leathery, thick vulvar skin with enhanced skin markings due to chronic rubbing or scratching. Benign, no risk of SCC."
      - kind: check
        question: "A 14-year-old girl has never menstruated. She has normal breasts and monthly lower abdominal pain. A bluish bulging membrane is seen at the introitus. What is the diagnosis?"
        options:
          - "Imperforate hymen with hematocolpos"
          - "Müllerian agenesis"
          - "Turner syndrome"
          - "Sarcoma botryoides"
        answer: 0
        why:
          - "صح: الـ hymen ما اتفتحش، فدم الدورة اتحبس في الـ vagina (hematocolpos)."
          - "في Müllerian agenesis مفيش uterus يعمل دورة، فمفيش ألم كل شهر."
          - "Turner مفيش صدر طبيعي."
          - "Sarcoma botryoides في بنات أصغر من 4، كتلة زي العنب."
        page: 662
        quote: "If untreated, leads to 1° amenorrhea, cyclic abdominal pain, hematocolpos (accumulation of menstrual blood in vagina → bulging and bluish hymenal membrane)."
      - kind: explain
        title: "PCOS"
        text: |-
          ==↑ LH:FSH== ← الـ theca بتعمل androgens كتير ← الـ follicles ما بتنضجش ← cysts و anovulation. أشهر سبب للـ anovulatory infertility.

          التشخيص باتنين من تلاتة: ovaries فيها cysts، oligo أو anovulation، و hyperandrogenism (hirsutism و acne). ومعاها obesity و insulin resistance و acanthosis nigricans.
        page: 662
        quote: "Unknown cause; associated with dysregulation of ovarian steroidogenesis. ↑ LH:FSH, ↑ androgens (eg, testosterone) from theca interna cells, ↓ rate of follicular maturation → unruptured follicles (cysts) + anovulation."
      - kind: reveal
        prompt: "مفيش ovulation، يبقى مفيش corpus luteum. وده يعمل إيه في الـ endometrium؟"
        answer: "مفيش progesterone يوقف الـ estrogen، فالـ endometrium ==unopposed estrogen== ← hyperplasia ← ↑ endometrial cancer. عشان كده الـ **OCPs** بتحمي، والتخسيس بيقلل الـ estrone اللي بيتعمل في الدهن."
        page: 662
        quote: "Associated with obesity, insulin resistance, acanthosis nigricans. ↑ risk of endometrial cancer 2° to unopposed estrogen from repeated anovulatory cycles."
      - kind: table
        title: "Amenorrhea (1): المشكلة في المبيض"
        columns: ["Condition", "Mechanism", "FSH and LH"]
        rows:
          - ["Primary ovarian insufficiency", "Premature follicle atresia (Turner, fragile X premutation, autoimmune)", "↑"]
        hide: [[0, 2]]
        page: 662
        quote: "Premature atresia of ovarian follicles in females of reproductive age. Most often idiopathic; associated with chromosomal abnormalities (eg, Turner syndrome, fragile X syndrome premutation), autoimmunity. Need karyotype screening. Patients present with signs of menopause after puberty but before age 40. ↓ estrogen, ↑ LH, ↑ FSH."
      - kind: table
        title: "Amenorrhea (2): المشكلة في الـ hypothalamus"
        columns: ["Condition", "Mechanism", "FSH and LH"]
        rows:
          - ["Functional hypothalamic amenorrhea", "Stress, exercise, low calories → ↓ pulsatile GnRH (↓ leptin, ↑ cortisol)", "↓"]
        hide: [[0, 1], [0, 2]]
        page: 663
        quote: "Severe caloric restriction, ↑ energy expenditure, and/or stress → functional disruption of pulsatile GnRH secretion → ↓ LH, FSH, estrogen. Pathogenesis includes ↓ leptin (due to ↓ fat) and ↑ cortisol (stress, excessive exercise)."
      - kind: figure
        title: "الـ HPV بيشيل الفرامل"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="20" width="90" height="40" rx="6"/>
            <text x="22" y="45" class="t-b">HPV 16/18</text>
            <rect class="fg-box" x="140" y="10" width="70" height="30" rx="6"/>
            <text x="160" y="30" class="t-sm t-b">E6</text>
            <rect class="fg-box" x="140" y="50" width="70" height="30" rx="6"/>
            <text x="160" y="70" class="t-sm t-b">E7</text>
            <rect class="fg-good" x="250" y="10" width="100" height="30" rx="6"/>
            <text x="265" y="30" class="t-sm">TP53 ✗</text>
            <rect class="fg-good" x="250" y="50" width="100" height="30" rx="6"/>
            <text x="265" y="70" class="t-sm">pRb ✗</text>
            <line class="fg-arrow" x1="100" y1="35" x2="138" y2="25"/>
            <line class="fg-arrow" x1="100" y1="45" x2="138" y2="65"/>
            <line class="fg-arrow" x1="210" y1="25" x2="248" y2="25"/>
            <line class="fg-arrow" x1="210" y1="65" x2="248" y2="65"/>
            <text x="20" y="115" class="t-sm t-mut">6 before 7; P before R</text>
            <text x="20" y="138" class="t-sm">koilocytes · transformation zone · CIN 1 → 3</text>
          </svg>
        caption: "الـ E6 بيوقّف الـ TP53، والـ E7 بيوقّف الـ pRb. الترتيب سهل: 6 قبل 7، و P قبل R. والـ dysplasia بتبدأ في الـ transformation zone."
        alt: "HPV 16 and 18 make E6, which inhibits TP53, and E7, which inhibits pRb; dysplasia starts at the transformation zone with koilocytes and is graded CIN 1 to 3."
        page: 663
        quote: "Associated with HPV-16 and HPV-18, which produce both the E6 gene product (inhibits TP53) and E7 gene product (inhibits pRb) (6 before 7; P before R)."
      - kind: explain
        title: "Cervical cancer"
        text: |-
          غالباً **SCC**. الـ Pap smear بيمسك الـ dysplasia قبل ما تبقى سرطان، والتشخيص بالـ colposcopy والـ biopsy.

          ولو انتشر للجنب: يقفل الـ ==ureters== ← hydronephrosis ← renal failure.
        page: 663
        quote: "Often squamous cell carcinoma. Pap smear can detect cervical dysplasia before it progresses to invasive carcinoma. Diagnose via colposcopy and biopsy. Lateral invasion can block ureters → hydronephrosis → renal failure."
      - kind: check
        question: "A 17-year-old has crampy pain with each period, starting on the first day. Exam and ultrasound are normal. Which mediator causes the pain?"
        options:
          - "Prostaglandins"
          - "Histamine"
          - "Bradykinin from endometriosis"
          - "Excess progesterone"
        answer: 0
        why:
          - "صح: primary dysmenorrhea. الرحم بينقبض عشان يقلل النزيف فيعمل ischemia، والـ prostaglandins هي اللي ورا ده. العلاج NSAIDs."
          - "الـ histamine مش في الكتاب هنا."
          - "الفحص طبيعي، يعني primary مش secondary."
          - "الـ progesterone مش هو السبب."
        page: 663
        quote: "Painful menses, caused by uterine contractions to ↓ blood loss → ischemic pain. Mediated by prostaglandins. Treatment: NSAIDs, acetaminophen, hormonal contraceptives."
      - kind: aside
        tone: exam
        text: "**Follicular cyst** أشهر كتلة في الـ ovary في البنات الصغيرين (follicle ما انفجرش). **Theca lutein cyst** ==bilateral== من الـ hCG الكتير، يعني فكّر في mole أو choriocarcinoma."
        page: 663
        quote: "Theca lutein cyst Also called hyperreactio luteinalis. Caused by hCG overstimulation. Often bilateral/multiple. Associated with gestational trophoblastic disease (eg, hydatidiform mole, choriocarcinoma)."
      - kind: try
        items: [repro.L04.077, repro.L04.220, repro.L04.221, repro.L04.222, repro.L04.063]
    recap:
      - "US: endometrial > ovarian > cervical. Prognosis: cervical أحسن، ovarian أسوأ."
      - "Lichen sclerosus أبيض و 8، Paget vulva نادر تحته سرطان، sarcoma botryoides تحت 4 سنين."
