      - "Priapism أكتر من 4 ساعات: sickle cell، طوارئ. Peyronie plaque في الـ tunica albuginea."
      - "Cryptorchidism: sperm يقل، testosterone غالباً طبيعي، ↑ germ cell tumor، orchiopexy قبل سنتين."
      - "Torsion ⊝ Prehn ومفيش cremasteric، 6 ساعات وناحيتين. Epididymitis ⊕ Prehn."
      - "Varicocele شمال (left renal vein)، يمين = IVC مسدود. Hydrocele و spermatocele بينوّروا."
