        quote: "Dysgerminoma Malignant. Most common in adolescents. Equivalent to male seminoma but rarer. Sheets of uniform “fried egg” cells D . Tumor markers: ↑ hCG, ↑ LDH."
      - kind: check
        question: "A 60-year-old woman has postmenopausal bleeding and an ovarian mass. Biopsy shows granulosa cells around pink fluid, like small follicles. Which serum marker is high?"
        options:
          - "Inhibin"
          - "AFP"
          - "CA 125 only"
          - "PLAP"
        answer: 0
        why:
          - "صح: granulosa cell tumor، فيه Call-Exner bodies و inhibin عالي. وبيعمل estrogen فالـ endometrium ينزف. «Give Granny a Call»."
          - "الـ AFP للـ yolk sac tumor."
          - "الـ CA 125 للأورام الـ epithelial."
          - "الـ PLAP للـ seminoma."
        page: 665
        quote: "Histology shows Call-Exner bodies (granulosa cells arranged haphazardly around collections of eosinophilic fluid, resembling primordial follicles; arrow in F ). Tumor marker: ↑ inhibin. “Give Granny a Call.”"
      - kind: explain
        title: "الرحم"
        text: |-
          - **Adenomyosis**: endometrium جوه الـ myometrium ← رحم ==globular وطري وبيوجع==، ونزيف و dysmenorrhea.
          - **Endometriosis**: endometrium برّه الرحم: «powder burn» على الـ peritoneum و «==chocolate cyst==» في الـ ovary.
          - **Leiomyoma** (fibroid): أشهر gynecologic tumor، أكتر في السود.
          - **Endometrial hyperplasia و carcinoma**: estrogen من غير progesterone (obesity، PCOS، tamoxifen)، وبينزف بعد الـ menopause.
        page: 666
        quote: "Abnormal endometrial gland proliferation. Usually caused by excess estrogen unopposed by progesterone. Associated with obesity, chronic anovulation (eg, PCOS), nulliparity, HRT, tamoxifen."
      - kind: aside
        tone: trap
        text: "**Asherman syndrome**: بعد D&C الـ basal layer اتجرح فعمل ==fibrous bands== جوه الرحم. الدورة تقل، infertility، وإجهاض متكرر. و **endometritis** بعد الولادة: أكبر risk factor الـ C-section."
        page: 666
        quote: "Fibrous bands/tissue within endometrial cavity. Caused by damage to basal layer of endometrium, usually after dilation and curettage. Presents with abnormal uterine bleeding (↓ menses), infertility, recurrent pregnancy loss, dysmenorrhea."
      - kind: explain
        title: "الصدر: الحاجات الحميدة"
        text: |-
          - **Fibrocystic changes**: 20 لـ 50 سنة، ألم وكتل قبل الدورة في الناحيتين.
          - **Fibroadenoma**: أقل من 35، صغير و ==بيتحرك==.
          - **Intraductal papilloma**: تحت الـ areola، ==أشهر سبب لإفراز الحلمة== (دم أو serous).
          - **Lactational mastitis**: S aureus من شقوق الحلمة. Antibiotics و ==تكمّل رضاعة==.

          وفي الرجالة: **gynecomastia** = estrogen أكتر من الـ androgen (cirrhosis، Klinefelter، spironolactone).
        page: 667
        quote: "Lactational mastitis—occurs during breastfeeding, ↑ risk of bacterial infection through cracks in nipple. S aureus is most common pathogen. Treat with antibiotics and continue breastfeeding."
      - kind: check
        question: "A 52-year-old man with cirrhosis on spironolactone has tender breast enlargement. What is the shared mechanism?"
        options:
          - "↑ estrogen relative to androgen activity"
          - "↑ prolactin from a pituitary adenoma"
          - "↑ growth hormone"
          - "↓ estrogen"
        answer: 0
        why:
          - "صح: الـ cirrhosis والـ spironolactone الاتنين بيميّلوا الميزان ناحية الـ estrogen."
          - "مفيش دليل على ورم."
          - "الـ GH مش سبب في الكتاب."
          - "العكس."
        page: 667
        quote: "Breast enlargement in males due to ↑ estrogen compared with androgen activity. Physiologic in newborn, pubertal, and older males, but may persist after puberty. Other causes include cirrhosis, hypogonadism (eg, Klinefelter syndrome), testicular tumors, drugs (eg, spironolactone)."
      - kind: explain
        title: "Breast cancer"
        text: |-
          غالباً بعد الـ menopause، كتلة ==ناشفة== في الـ upper outer quadrant. لو ثبتت في الـ Cooper ligaments: الحلمة تنسحب والجلد يتنقّر.

          الـ risk = estrogen أكتر ولمدة أطول، مع السن و BRCA. وفي الرجالة BRCA2 و Klinefelter. وأهم prognostic factor في الأول: ==axillary lymph nodes==.
        page: 668
        quote: "Invasive cancer can become fixed to pectoral muscles, deep fascia, Cooper ligaments, and overlying skin → nipple retraction/skin dimpling."
      - kind: figure
        title: "الـ E-cadherin والـ single file"
        svg: |-
          <svg viewBox="0 0 360 140" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="15" width="160" height="110" rx="10"/>
            <text x="40" y="35" class="t-sm t-b">Invasive ductal</text>
            <circle class="fg-box" cx="60" cy="75" r="22"/>
            <circle class="fg-box" cx="120" cy="80" r="18"/>
            <text x="30" y="118" class="t-sm">ducts in desmoplasia</text>
            <rect class="fg-good" x="190" y="15" width="160" height="110" rx="10"/>
            <text x="215" y="35" class="t-sm t-b">Invasive lobular</text>
            <circle class="fg-box" cx="210" cy="70" r="7"/>
            <circle class="fg-box" cx="230" cy="70" r="7"/>
            <circle class="fg-box" cx="250" cy="70" r="7"/>
            <circle class="fg-box" cx="270" cy="70" r="7"/>
            <circle class="fg-box" cx="290" cy="70" r="7"/>
            <circle class="fg-box" cx="310" cy="70" r="7"/>
            <text x="205" y="118" class="t-sm">↓ E-cadherin · single file</text>
          </svg>
        caption: "الـ ductal بيعمل ducts صغيرة في stroma ناشف (rock-hard)، وهو الأشهر. الـ lobular فقد الـ E-cadherin فالخلايا مش لازقة في بعض، فتمشي في صف واحد، وغالباً في الناحيتين."
        alt: "Invasive ductal carcinoma forms small ducts in desmoplastic stroma; invasive lobular carcinoma has lost E-cadherin and its cells line up in single file."
        page: 668
        quote: "↓ E-cadherin expression → orderly row of cells (“single file” D ) and no duct formation. Often lacks desmoplastic response."
      - kind: check
        question: "A woman has a painful, warm, red breast with peau d'orange and no mass. Antibiotics fail. What explains the skin?"
        options:
          - "Tumor in the dermal lymphatics"
          - "S aureus in the ducts"
          - "DCIS spreading to the nipple"
          - "Fat necrosis"
        answer: 0
        why:
          - "صح: inflammatory breast cancer. الـ prognosis وحش، وبيتلخبط مع الـ mastitis."
          - "الـ mastitis كانت هتتحسن على الـ antibiotics."
          - "ده Paget: eczema على الحلمة بس."
          - "الـ fat necrosis كتلة بعد خبطة."
        page: 668
        quote: "Dermal lymphatic space invasion → breast pain with warm, swollen, erythematous skin around exaggerated hair follicles (peau d’orange) E . Poor prognosis (50% survival at 5 years)."
      - kind: aside
        tone: exam
        text: "**DCIS** بيبان بدري كـ ==microcalcifications== على الـ mammogram. **LCIS** مفيش mass ولا calcifications، وبيعلّي الـ risk في ==الصدرين==، مش نفس الصدر بس زي الـ DCIS."
        page: 668
        quote: "↓ E-cadherin expression. No mass or calcifications → incidental biopsy finding. ↑ risk of cancer in either breast (vs DCIS, same breast and quadrant)."
      - kind: explain
        title: "خريطة الصدر: كل ورم ليه عنوان (رسمة الكتاب)"
        text: |-
          رسمة ص 667 بتحط كل مرض في الحتة اللي بيطلع منها. امشي من الحلمة لجوه:

          - **Nipple**: ==Paget disease== (السرطان اللي تحت طلع لحد جلد الحلمة).
          - **Lactiferous ducts** (تحت الـ areola): **intraductal papilloma**، **abscess/mastitis**، و **mammary duct ectasia**. عشان كده كلهم أعراضهم «عند الحلمة»: إفراز، حلمة مقلوبة، أو كتلة ==periareolar==.
          - **Terminal duct lobular unit**: هنا بيحصل ==أغلب الشغل==: fibrocystic change، DCIS، LCIS، ductal carcinoma، lobular carcinoma.
          - **Stroma**: الـ connective tissue: **fibroadenoma** و **phyllodes tumor**.

          فلو السؤال قالك «كتلة بتتحرك في بنت صغيرة» فكّر stroma، ولو قالك «إفراز دم من الحلمة» فكّر duct تحت الـ areola.
        page: 667
        quote: "Breast pathology Nipple Intraductal papilloma Abscess/mastitis Mammary duct ectasia Paget disease Fibrocystic change DCIS LCIS Ductal carcinoma Lobular carcinoma Fibroadenoma Phyllodes tumor Lactiferous duct Stroma Terminal duct lobular unit"
      - kind: try
        items: [repro.L04.129, repro.L04.223, repro.L04.224, repro.L04.225, repro.L04.226]
