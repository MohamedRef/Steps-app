schema: steps.lesson/v1
lecture: repro.L04
lessons:
  - id: repro.L04.lesson1
    title: "الكروموسومات والهرمونات: مين ولد ومين بنت"
    hook: "ولد طويل وخصيته صغيرة، وبنت قصيرة ومفيش دورة. ومع اتنين أرقام بس (testosterone و LH) تعرف التشخيص"
    minutes: 9
    pages: [655, 656]
    topics: [sex-chromosome-disorders, other-dsd, diagnosing-disorders, aromatase-deficiency, androgen-insensitivity, 5a-reductase-deficiency, kallmann-syndrome]
    status: unverified
    steps:
      - kind: explain
        title: "Klinefelter (47,XXY)"
        text: |-
          ولد ==طويل== بنِسَب eunuchoid (الـ epiphysis بتقفل متأخر)، خصية **صغيرة وناشفة**، azoospermia، gynecomastia، وشعر بتوزيع أنثوي.

          عنده X زيادة متقفّل، يعني ==Barr body== موجود. ومن أشهر أسباب الـ hypogonadism في الـ infertility workup.
        page: 655
        quote: "Small, firm testes; infertility (azoospermia); tall stature with eunuchoid proportions (delayed epiphyseal closure → ↑ long bone length); gynecomastia A ; female hair distribution."
      - kind: reveal
        prompt: "في Klinefelter، ليه الـ FSH عالي، وليه الـ LH عالي كمان؟"
        answer: "اتنين أعطال منفصلين. الـ seminiferous tubules مش متكوّنة ← ==↓ inhibin B== ← الـ FSH يعلى. والـ Leydig cells شغلها بايظ ← ↓ testosterone ← الـ **LH** يعلى."
        page: 655
        quote: "Dysgenesis of seminiferous tubules → ↓ inhibin B → ↑ FSH. Abnormal Leydig cell function → ↓ testosterone → ↑ LH."
      - kind: explain
        title: "Turner (45,XO)"
        text: |-
          ==أشهر سبب للـ 1° amenorrhea==. مفيش Barr body. الكتاب بيقولها: «menopause before menarche»: الـ ovary streak، فالـ estrogen واطي، فالـ LH والـ FSH عاليين.

          الشكل: قصيرة، رقبة webbed، صدر عريض، **bicuspid aortic valve** و **coarctation**، horseshoe kidney، و 4th metacarpal قصير.
        page: 655
        quote: "Most common cause of 1° amenorrhea. No Barr body. B Menopause before menarche. ↓ estrogen leads to ↑ LH, FSH."
      - kind: check
        question: "A 16-year-old girl has never menstruated. She is short, with a broad chest and a weaker femoral than brachial pulse. Which finding fits?"
        options:
          - "↑ FSH and LH with no Barr body"
          - "↓ FSH and LH with anosmia"
          - "Normal FSH with an absent uterus"
          - "↑ testosterone with a 46,XY karyotype"
        answer: 0
        why:
          - "صح: Turner، الـ ovary streak فالـ estrogen واطي والـ gonadotropins عالية، ومفيش Barr body."
          - "ده Kallmann: GnRH واطي ومعاه anosmia."
          - "ده Müllerian agenesis: الـ ovary شغال."
          - "ده androgen insensitivity."
        page: 655
        quote: "coarctation of the aorta (femoral < brachial pulse)"
      - kind: aside
        tone: exam
        text: "**47,XYY**: شكله عادي وطويل جداً، والخصوبة **طبيعية**. ممكن acne شديد و learning disability. وفي Turner، الـ ==45,X/46,XY== mosaic عنده ↑ risk لـ gonadoblastoma."
        page: 655
        quote: "Double Y males 47,XYY. Phenotypically normal (usually undiagnosed), very tall. Normal fertility."
      - kind: table
        title: "اتنين أرقام والتشخيص"
        columns: ["Testosterone", "LH", "Diagnosis"]
        rows:
          - ["↑", "↑", "Androgen insensitivity"]
          - ["↑", "↓", "Testosterone-secreting tumor or exogenous steroids"]
          - ["↓", "↑", "Hypergonadotropic (1°) hypogonadism"]
          - ["↓", "↓", "Hypogonadotropic (2°) hypogonadism"]
        hide: [[0, 2], [1, 2], [2, 2], [3, 2]]
        page: 656
        quote: "Testosterone LH Diagnosis ↑ ↑ Androgen insensitivity syndrome ↑ ↓ Testosterone-secreting tumor, exogenous androgenic steroids ↓ ↑ Hypergonadotropic (1°) hypogonadism ↓ ↓ Hypogonadotropic (2°) hypogonadism"
      - kind: explain
        title: "اقرا الجدول كـ feedback loop"
        text: |-
          الـ pituitary بيبص على الـ testosterone: لو قليل يزوّد الـ **LH**، لو كتير يقلّله. فكل سطر في الجدول بيسأل: ==الـ loop مكسور فين؟==

          - **الاتنين عاليين**: الـ testosterone موجود بكترة بس الجسم «مش سامعه»، لا الأعضاء ولا الـ pituitary. ده ==androgen insensitivity==: الـ receptor بايظ، فالـ pituitary فاكر إن مفيش testosterone ويفضل يزوّد LH.
          - **Testosterone عالي و LH واطي**: الـ loop شغال صح، والـ pituitary سكت لأن فيه testosterone جاي من بره الـ loop: **tumor** أو **steroids** من بره.
          - **Testosterone واطي و LH عالي**: الخصية نفسها بايظة (**1°**، hypergonadotropic)، زي Klinefelter، والـ pituitary بيزعق.
          - **الاتنين واطيين**: المشكلة ==فوق== (hypothalamus أو pituitary، **2°**، hypogonadotropic)، زي Kallmann.
        page: 656
        quote: "Testosterone LH Diagnosis ↑ ↑ Androgen insensitivity syndrome ↑ ↓ Testosterone-secreting tumor, exogenous androgenic steroids ↓ ↑ Hypergonadotropic (1°) hypogonadism ↓ ↓ Hypogonadotropic (2°) hypogonadism"
      - kind: figure
        title: "الهرمون اتعمل، بس حد ما سمعش"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rp4a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="10" y="20" width="100" height="36" rx="6"/>
            <text x="20" y="43" class="t-sm t-b">Testosterone</text>
            <rect class="fg-acc" x="130" y="20" width="90" height="36" rx="6"/>
            <text x="148" y="43" class="t-sm t-b">DHT</text>
            <rect class="fg-good" x="250" y="20" width="100" height="36" rx="6"/>
            <text x="262" y="43" class="t-sm t-b">Estrogen</text>
            <line class="fg-arrow" x1="110" y1="38" x2="128" y2="38" marker-end="url(#rp4a)"/>
            <text x="100" y="75" class="t-sm t-mut">5α-reductase</text>
            <path class="fg-arrow" d="M60,56 C60,110 300,110 300,58" fill="none" marker-end="url(#rp4a)"/>
            <text x="150" y="122" class="t-sm t-mut">aromatase</text>
            <text x="10" y="148" class="t-sm">receptor ✗ → AIS</text>
            <text x="130" y="148" class="t-sm">5α ✗ → atypical till puberty</text>
            <text x="354" y="166" text-anchor="end" class="t-sm">aromatase ✗ → virilization</text>
          </svg>
        caption: "تلات أعطال في نفس السكة: الـ receptor نفسه بايظ (androgen insensitivity)، الـ 5α-reductase مش شغال (مفيش DHT)، أو الـ aromatase مش شغال (مفيش estrogen فالـ androgen يتراكم)."
        alt: "Testosterone converts to DHT by 5α-reductase and to estrogen by aromatase; a receptor defect gives androgen insensitivity, a 5α-reductase defect gives atypical genitalia until puberty, and an aromatase defect gives virilization."
        page: 656
        quote: "Inability to convert testosterone to DHT."
      - kind: explain
        title: "Androgen insensitivity و 5α-reductase"
        text: |-
          - **AIS (46,XY)**: الـ receptor بايظ. شكلها بنت بصدر، شعر قليل، vagina قصيرة، و ==مفيش uterus== لأن الخصية بتعمل anti-Müllerian hormone. الخصية بتتشال (malignancy).
          - **5α-reductase deficiency**: مفيش DHT، فالـ genitalia برّه atypical ==لحد البلوغ==، وبعدين الـ testosterone العالي يعمل masculinization.
        page: 656
        quote: "Defect in androgen receptor resulting in female-appearing genetic male (46,XY DSD); breast development and female external genitalia with scant axillary and pubic hair, rudimentary vagina; uterus and fallopian tubes absent due to persistence of anti-Müllerian hormone from testes."
      - kind: aside
        tone: trap
        text: "**Aromatase deficiency**: الـ DHEA من الـ adrenal بتاع الجنين مش بيتحول estrogen في الـ placenta، فبيبقى testosterone. ==الأم كمان== بيطلعلها acne و hirsutism، لأن الـ androgens بتعدّي الـ placenta."
        page: 656
        quote: "virilization of both female infant (atypical genitalia) and mother (acne, hirsutism; fetal androgens can cross placenta)"
      - kind: check
        question: "A 17-year-old boy has delayed puberty and can't smell coffee. Which levels are expected?"
        options:
          - "↓ GnRH, ↓ FSH, ↓ LH, ↓ testosterone"
          - "↑ FSH and LH, ↓ testosterone"
          - "↑ testosterone and ↑ LH"
          - "Normal LH with ↓ DHT"
        answer: 0
        why:
          - "صح: Kallmann. الـ neurons ما هاجرتش، فالـ olfactory bulb ما اتكوّنش والـ GnRH قليل، فكل حاجة تحته واطية."
          - "ده primary hypogonadism زي Klinefelter."
          - "ده androgen insensitivity."
          - "ده 5α-reductase deficiency."
        page: 656
        quote: "Defective migration of neurons and subsequent failure of olfactory bulbs to develop → ↓ synthesis of GnRH in the hypothalamus; hyposmia/anosmia; ↓ GnRH, FSH, LH, testosterone."
      - kind: try
        items: [repro.L04.015, repro.L04.201, repro.L04.202, repro.L04.203, repro.L04.204]
    recap:
      - "Klinefelter: XXY، Barr body، ↓ inhibin ← ↑ FSH، و ↓ testosterone ← ↑ LH."
      - "Turner: أشهر سبب 1° amenorrhea، مفيش Barr body، coarctation و bicuspid valve."
      - "Testosterone و LH: الاتنين عاليين = AIS، الاتنين واطيين = 2° hypogonadism."
      - "AIS مفيش uterus (AMH)، 5α-reductase atypical لحد البلوغ، aromatase الأم كمان بتسترجل."
      - "Kallmann: مفيش شم، GnRH وكل اللي تحته واطي."
    practice: [repro.L04.001, repro.L04.002, repro.L04.003, repro.L04.004, repro.L04.005, repro.L04.006, repro.L04.007, repro.L04.008, repro.L04.009, repro.L04.010, repro.L04.011, repro.L04.012, repro.L04.013, repro.L04.014, repro.L04.015, repro.L04.016, repro.L04.017, repro.L04.018, repro.L04.019, repro.L04.020, repro.L04.021, repro.L04.022, repro.L04.023, repro.L04.024, repro.L04.025, repro.L04.026, repro.L04.195, repro.L04.201, repro.L04.202, repro.L04.203, repro.L04.204, repro.L04.205, repro.L04.206, repro.L04.207]
  - id: repro.L04.lesson2
    title: "المشيمة والنزيف في الحمل"
    hook: "نزيف من غير ألم ولا نزيف بألم؟ ومشيمة مش راضية تنزل؟ كل واحدة ليها قصة"
    minutes: 8
    pages: [657, 658]
    topics: [placental-disorders, uterine-rupture, postpartum-hemorrhage, ectopic-pregnancy]
    status: unverified
    steps:
      - kind: explain
        title: "Placenta accreta spectrum"
        text: |-
          الـ trophoblast دخل في جدار الرحم أكتر من اللازم. السبب الأهم: ==ندبة قديمة== (C-section)، لأن الـ decidua ما اتكوّنتش كويس مكان الندبة.

          الصورة: بعد الولادة المشيمة **مش راضية تنفصل**، ولما تحاول تشيلها بإيدك: نزيف شديد، وبتطلع حتت. العلاج ==hysterectomy==.
        page: 657
        quote: "Risk factors: prior C-section or other uterine surgery (areas of uterine scarring impair normal decidualization), placenta previa, ↑ maternal age, multiparity."
      - kind: figure
        title: "دخلت لحد فين"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-good" x="10" y="20" width="340" height="24" rx="4"/>
            <text x="20" y="37" class="t-sm">Decidua basalis</text>
            <rect class="fg-acc" x="10" y="44" width="340" height="66"/>
            <text x="20" y="80" class="t-sm">Myometrium</text>
            <rect class="fg-box" x="10" y="110" width="340" height="18" rx="4"/>
            <text x="20" y="123" class="t-sm">Serosa</text>
            <line class="fg-arrow" x1="150" y1="10" x2="150" y2="46"/>
            <text x="120" y="150" class="t-sm t-b">accreta</text>
            <line class="fg-arrow" x1="220" y1="10" x2="220" y2="80"/>
            <text x="200" y="150" class="t-sm t-b">increta</text>
            <line class="fg-arrow" x1="300" y1="10" x2="300" y2="135"/>
            <text x="275" y="150" class="t-sm t-b">percreta</text>
          </svg>
        caption: "Accreta لزقت في الـ myometrium من غير ما تدخله (الأشهر). Increta دخلت جزء. Percreta خرمت لحد الـ serosa، وممكن توصل للمثانة."
        alt: "Layers of decidua basalis, myometrium and serosa, with accreta reaching the myometrium, increta partly invading it, and percreta perforating through to the serosa."
        page: 657
        quote: "Placenta accreta—attaches to myometrium (instead of overlying decidua basalis) without invading it. Most common type. ▪ Placenta increta—partially invades into myometrium. ▪ Placenta percreta—completely invades (“perforates”) through myometrium and serosa"
      - kind: table
        title: "نزيف التلت الأخير"
        columns: ["Condition", "Bleeding", "Key point"]
        rows:
          - ["Placenta previa", "Painless", "Placenta over the internal os"]
          - ["Placental abruption", "Painful", "Separation before delivery; DIC from tissue factor"]
          - ["Vasa previa", "Painless, with fetal distress", "Fetal vessels over the os"]
        hide: [[0, 1], [1, 1], [1, 2], [2, 2]]
        page: 657
        quote: "Placenta previa Attachment of placenta over internal cervical os (a “preview” of the placenta is visible through cervix). Risk factors: prior C-section, multiparity. Presents with painless vaginal bleeding in third trimester."
      - kind: explain
        title: "ليه ده بيوجع وده لأ؟"
        text: |-
          السؤال اللي بيفرّقهم: ==الدم ده دم مين، وجاي منين؟==

          - **Previa**: المشيمة قاعدة على الـ internal os (الكتاب: «preview» للمشيمة من الـ cervix). لما الـ cervix يبدأ يتغير في التلت الأخير، حتة من المشيمة بتنفصل عند الفتحة والدم بيخرج على طول ==من غير ما يتحبس==، فمفيش ألم. والـ **low-lying placenta** قريبة (< 2 cm) بس مش غاطية الفتحة.
          - **Abruption**: المشيمة اتقلعت من حيطة الرحم قبل الولادة، والدم ==بيتحبس ورا المشيمة== ويهيّج الرحم، فبيوجع والرحم ناشف. والمشيمة المجروحة بتطلّع tissue factor ← **DIC**. وأسبابها كلها حاجات بتأذي الأوعية أو بتخبط: hypertension و preeclampsia و smoking و cocaine و trauma.
          - **Vasa previa**: أوعية الجنين نفسها معدّية على الفتحة من غير Wharton jelly يحميها (velamentous insertion). لما الأغشية تتقطع، الأوعية تتقطع، والدم اللي نازل **دم الجنين** ← نزيف من غير ألم بس مع **bradycardia** للجنين، وممكن يموت من النزيف.
        page: 657
        quote: "Presents with painless vaginal bleeding (fetal blood from injured vessels) upon rupture of membranes accompanied by fetal heart rate abnormalities (eg, bradycardia). May lead to fetal death from exsanguination."
      - kind: check
        question: "A woman at 34 weeks with cocaine use has sudden painful bleeding and a rigid, tender uterus. Her platelets drop and fibrinogen falls. Why?"
        options:
          - "Tissue factor released from the injured placenta"
          - "Placenta over the internal os"
          - "Antibodies against platelets"
          - "Atony of the uterus"
        answer: 0
        why:
          - "صح: placental abruption. المشيمة المجروحة بتطلّع tissue factor فيحصل DIC."
          - "Previa نزيفها من غير ألم."
          - "مفيش سبب مناعي هنا."
          - "الـ atony بعد الولادة، مش قبلها."
        page: 657
        quote: "can lead to maternal hypovolemic shock (due to hemorrhage) and DIC (due to release of tissue factor from injured placenta), fetal distress (eg, hypoxia)."
      - kind: explain
        title: "Uterine rupture"
        text: |-
          الجدار كله اتقطع، وغالباً في ==ولادة بعد C-section==. نزيف **بألم**، الـ fetal heart يبطّأ، تحس أجزاء الجنين بسهولة من البطن، والـ station بيروح (الجنين طلع لفوق).
        page: 658
        quote: "Presents with painful vaginal bleeding, fetal heart rate abnormalities (eg, bradycardia), easily palpable fetal parts, loss of fetal station."
      - kind: mnemonic
        word: "TTTT"
        parts:
          - { key: "T", text: "Tone: uterine atony, soft boggy uterus (most common)" }
          - { key: "T", text: "Trauma: lacerations, incisions, uterine rupture" }
          - { key: "T", text: "Tissue: retained products of conception" }
          - { key: "T", text: "Thrombin: coagulopathy" }
        hook: "الـ postpartum hemorrhage أكبر سبب لوفاة الأمهات في العالم، وأسبابه 4 T's. أولها وأشهرها الرحم الطري اللي مش بينقبض."
        page: 658
        quote: "Etiology (4 T’s): Tone (uterine atony → soft, boggy uterus; most common), Trauma (eg, lacerations, incisions, uterine rupture), Tissue (retained products of conception), Thrombin (coagulopathy)."
      - kind: reveal
        prompt: "لو النزيف ما وقفش، بيربطوا الـ internal iliac أو الـ uterine arteries. إزاي الست تفضل تقدر تحمل بعدها؟"
        answer: "الـ ==ovarian arteries== بتعمل collateral circulation للرحم، فالرحم بيعيش. العلاج الأول: uterine massage و **oxytocin**."
        page: 658
        quote: "Treatment: uterine massage, oxytocin. If refractory, surgical ligation of uterine or internal iliac arteries (fertility is preserved since ovarian arteries provide collateral circulation)."
      - kind: explain
        title: "Ectopic pregnancy"
        text: |-
          الحمل زرع برّه الرحم، أغلبه في ==ampulla== الـ fallopian tube. أكبر risk factor: الأنبوبة متبهدلة من قبل (**PID** أو جراحة)، أو ectopic قديم، أو IUD، أو IVF.

          شك فيه: amenorrhea، والـ hCG بيعلى ==أبطأ من المتوقع==. أكّد بالـ ultrasound. العلاج methotrexate أو جراحة.
        page: 658
        quote: "Suspect in patients with history of amenorrhea, lower-than- expected rise in hCG based on dates. Confirm with ultrasound, which may show extraovarian adnexal mass. Treatment: methotrexate, surgery."
      - kind: aside
        tone: exam
        text: "رسمة الكتاب للأنبوبة من الـ ovary للرحم: fimbriae ← infundibulum ← ==ampulla (أشهر مكان)== ← isthmus ← interstitium. والـ **isthmus** هو ==أكتر مكان بيتقطع== (highest risk of tubal rupture) لأنه أضيق حتة، فالحمل بيفرتكه بدري. سؤالين مختلفين، إجابتين مختلفتين."
        page: 658
        quote: "Isthmus (highest risk of tubal rupture) Interstitium Ampulla (most common site)"
      - kind: check
        question: "Which history most raises the risk of a tubal ectopic pregnancy?"
        options:
          - "Prior salpingitis from pelvic inflammatory disease"
          - "Three previous vaginal deliveries"
          - "Use of combined oral contraceptives"
          - "Breastfeeding for 1 year"
        answer: 0
        why:
          - "صح: الندبة في الأنبوبة من الـ PID بتعطّل البويضة وهي ماشية."
          - "الولادات الطبيعية مش risk factor في الكتاب."
          - "الـ OCPs مش في القايمة."
          - "الرضاعة مش risk factor."
        page: 658
        quote: "Risk factors: tubal pathologies (eg, scarring from salpingitis [PID] or surgery), previous ectopic pregnancy, IUD, IVF."
      - kind: try
        items: [repro.L04.039, repro.L04.208, repro.L04.209, repro.L04.210, repro.L04.211]
    recap:
      - "Accreta (ندبة C-section): المشيمة مش بتنفصل، نزيف شديد، hysterectomy."
      - "Previa من غير ألم، abruption بألم و DIC، rupture بألم وأجزاء الجنين تتحس."
      - "PPH: 4 T's، أشهرها Tone. Massage و oxytocin. الـ ovarian arteries بتحمي الخصوبة."
      - "Ectopic: ampulla، PID، hCG بطيء، methotrexate."
    practice: [repro.L04.027, repro.L04.028, repro.L04.029, repro.L04.030, repro.L04.031, repro.L04.032, repro.L04.033, repro.L04.034, repro.L04.035, repro.L04.036, repro.L04.037, repro.L04.038, repro.L04.039, repro.L04.040, repro.L04.041, repro.L04.042, repro.L04.043, repro.L04.044, repro.L04.045, repro.L04.193, repro.L04.194, repro.L04.208, repro.L04.209, repro.L04.210, repro.L04.211, repro.L04.212, repro.L04.213]
  - id: repro.L04.lesson3
    title: "الـ mole والضغط في الحمل"
    hook: "رحم أكبر من الشهور، hCG في السما، وضغط عالي قبل أسبوع 20؟ ده مش حمل عادي"
    minutes: 8
    pages: [659, 661]
    topics: [hydatidiform-mole, choriocarcinoma, hypertension-in-pregnancy, supine-hypotensive-syndrome]
    status: unverified
    steps:
      - kind: explain
        title: "Hydatidiform mole"
        text: |-
          الـ chorionic villi وارمة cysts، والـ trophoblast بيكبر لوحده. الصورة: نزيف، ترجيع، ==رحم أكبر من المفروض==، وضغط في الحوض.

          والـ hCG العالي جداً بيعمل: **hyperthyroidism**، theca lutein cysts، hyperemesis، و ==preeclampsia قبل أسبوع 20==.
        page: 659
        quote: "Associated with hCG-mediated sequelae: hyperthyroidism, theca lutein cysts, hyperemesis gravidarum, early preeclampsia (before 20 weeks of gestation)."
      - kind: figure
        title: "Complete ولا partial"
        svg: |-
          <svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="10" y="15" width="160" height="120" rx="10"/>
            <text x="45" y="38" class="t-b">Complete</text>
            <circle class="fg-box" cx="50" cy="75" r="18"/>
            <text x="38" y="80" class="t-sm t-mut">empty</text>
            <text x="80" y="70" class="t-sm">+ 1 sperm</text>
            <text x="80" y="88" class="t-sm">(duplicates)</text>
            <text x="25" y="122" class="t-sm t-b">46,XX · no fetus</text>
            <rect class="fg-good" x="190" y="15" width="160" height="120" rx="10"/>
            <text x="235" y="38" class="t-b">Partial</text>
            <circle class="fg-box" cx="230" cy="75" r="18"/>
            <text x="222" y="80" class="t-sm">egg</text>
            <text x="260" y="70" class="t-sm">+ 2 sperm</text>
            <text x="205" y="122" class="t-sm t-b">69,XXY · fetal parts</text>
          </svg>
        caption: "الـ complete: بويضة فاضية + sperm واحد بيضاعف نفسه، فكل الـ DNA من الأب و 46,XX. الـ partial: بويضة عادية + 2 sperm، فـ triploid (69) وفيه أجزاء جنين."
        alt: "A complete mole forms from an enucleated egg and one sperm that duplicates, giving 46,XX with no fetus; a partial mole forms from an egg and two sperm, giving a 69 triploid karyotype with fetal parts."
        page: 659
        quote: "Most commonly enucleated egg + single sperm (subsequently duplicates paternal DNA)"
      - kind: check
        question: "A molar pregnancy has a 46,XX karyotype and no fetal tissue. Where did its chromosomes come from?"
        options:
          - "All from the father"
          - "All from the mother"
          - "Half from each parent"
          - "Two sets from the father and one from the mother"
        answer: 0
        why:
          - "صح: complete mole، بويضة من غير nucleus و sperm بيضاعف DNA الأب."
          - "مفيش أي DNA من الأم."
          - "ده الحمل العادي."
          - "ده الـ partial mole (69)."
        page: 659
        quote: "KARYOTYPE 46,XX (most common); 46,XY 69,XXX; 69,XXY; 69,XYY COMPONENTS Most commonly enucleated egg + single sperm (subsequently duplicates paternal DNA) 2 sperm + 1 egg"
      - kind: explain
        title: "ليه الـ complete أوحش من الـ partial؟"
        text: |-
          الـ DNA بتاع الأب هو اللي بيكبّر الـ **trophoblast** (المشيمة)، والـ DNA بتاع الأم هو اللي بيبني الجنين. فخلّيها معادلة:

          - **Complete** = كله أب ← trophoblast بيكبر ==على الآخر== (circumferential و diffuse)، كل الـ villi hydropic، ومفيش جنين. فالرحم أكبر من الشهور، والـ **hCG ↑↑↑↑**، وفي الـ ultrasound «**honeycombed**» أو «clusters of grapes» أو «**snowstorm**». وخطره أعلى: invasive mole 15%-20% و choriocarcinoma 2%.
          - **Partial** = أم + أبين ← فيه **fetal parts**، وبعض الـ villi بس hydropic، والـ hCG أقل، والرحم حجمه عادي، وخطره أقل (< 5%).

          والـ **p57** gene ==paternally imprinted== (الأب بيقفله) ومتشغّل من نسخة الأم بس. فالكتاب بيقولها: «**Complete mole is complete male**» ← p57 سالب؛ «**Partial mole is P57 positive**» ← فيه نسخة من الأم فبيصبغ. العلاج: dilation and curettage ± methotrexate، ونتابع الـ hCG.
        page: 659
        quote: "STAINING FOR P57 PROTEIN ⊝ (paternally imprinted) Complete mole is complete male ⊕ (maternally expressed) Partial mole is P57 positive"
      - kind: explain
        title: "Choriocarcinoma"
        text: |-
          سرطان trophoblast (cyto و syncytio) ==من غير villi==. غالباً بعد حمل مش طبيعي (mole أو abortion).

          بينتشر في الدم للرئة: «==cannonball==» metastases، فتلاقي dyspnea و hemoptysis. العلاج **methotrexate**.
        page: 660
        quote: "Presents with abnormal uterine bleeding, hCG-mediated sequelae, dyspnea, hemoptysis. Hematogenous spread to lungs → “cannonball” metastases B . Treatment: methotrexate."
      - kind: table
        title: "الضغط في الحمل"
        columns: ["Type", "Definition", "Clue"]
        rows:
          - ["Gestational hypertension", ">140/90 after 20 weeks", "No proteinuria or end-organ damage"]
          - ["Preeclampsia", "Hypertension with proteinuria or end-organ damage after 20 weeks", "Abnormal spiral arteries"]
          - ["Eclampsia", "Preeclampsia with seizures", "Death by stroke, hemorrhage, ARDS"]
          - ["HELLP", "Hemolysis, elevated liver enzymes, low platelets", "Schistocytes; may lack hypertension"]
        hide: [[0, 2], [1, 2], [2, 1], [3, 2]]
        page: 660
        quote: "BP >140/90 mm Hg after 20 weeks of gestation. No preexisting hypertension. No proteinuria or end-organ damage. Hypertension prior to 20 weeks of gestation suggests chronic hypertension."
      - kind: reveal
        prompt: "إيه اللي بيبوّظ الدنيا في الـ preeclampsia من الأول؟"
        answer: "الـ ==spiral arteries== في المشيمة ما اتعدلتش ← endothelial dysfunction و vasoconstriction و ischemia. ولو بدأت **قبل أسبوع 20**، فكّر في mole."
        page: 660
        quote: "(onset of preeclampsia <20 weeks of gestation may suggest molar pregnancy). Caused by abnormal placental spiral arteries → endothelial dysfunction, vasoconstriction, ischemia."
      - kind: explain
        title: "الـ preeclampsia مرض endothelium في الجسم كله"
        text: |-
          التعريف: ضغط ==جديد== (new-onset) بعد أسبوع 20 ومعاه **proteinuria** أو **end-organ dysfunction**. الـ spiral arteries البايظة بتخلّي المشيمة ischemic، والمشيمة بتبعت إشارات تبوّظ الـ endothelium في كل حتة. فالمضاعفات كلها «أوعية بتتقفل أو بتسرّب»:

          - المشيمة: **placental abruption** و uteroplacental insufficiency.
          - الكلية: **renal failure**. الرئة: **pulmonary edema**. الدم: **coagulopathy**.
          - المخ: seizures ← **eclampsia** (والموت فيها من stroke و intracranial hemorrhage و ARDS). الكبد: **HELLP**.

          العلاج: antihypertensives، و ==IV magnesium sulfate== عشان يمنع الـ seizures، والعلاج النهائي ==delivery== (لأن المشيمة هي أصل المشكلة). والوقاية: **aspirin**. والـ risk factors: preeclampsia قبل كده، توأم، أول حمل، chronic hypertension، diabetes، CKD، autoimmune (زي antiphospholipid syndrome)، و obesity.
        page: 660
        quote: "Complications: placental abruption, coagulopathy, renal failure, pulmonary edema, uteroplacental insufficiency; may lead to eclampsia and/or HELLP syndrome. Treatment: antihypertensives, IV magnesium sulfate (to prevent seizure); definitive is delivery. Prophylaxis: aspirin."
      - kind: aside
        tone: tip
        text: "الأدوية: «==Hypertensive moms love nifedipine==»: **H**ydralazine، **α-m**ethyldopa، **l**abetalol، **n**ifedipine. والولادة في أسبوع 37 لـ 39."
        page: 660
        quote: "Treatment: antihypertensives (Hydralazine, α-methyldopa, labetalol, nifedipine), deliver at 37-39 weeks. Hypertensive moms love nifedipine."
      - kind: check
        question: "A woman at 34 weeks has right upper quadrant pain. BP is 128/80. Her smear shows schistocytes, platelets are low and liver enzymes are high. What is the treatment?"
        options:
          - "Immediate delivery"
          - "Magnesium and wait until 39 weeks"
          - "Methotrexate"
          - "Platelet transfusion only"
        answer: 0
        why:
          - "صح: HELLP، وممكن يجي من غير ضغط عالي. العلاج إنها تولد فوراً."
          - "الاستنى خطر: ممكن hepatic hematoma يتقطع و DIC."
          - "Methotrexate للـ ectopic والـ choriocarcinoma."
          - "ده مش بيعالج السبب."
        page: 660
        quote: "Low Platelets. May occur in the absence of hypertension and proteinuria. Blood smear shows schistocytes. Can lead to hepatic subcapsular hematomas (rupture → severe hypotension) and DIC (due to release of tissue factor from injured placenta). Treatment: immediate delivery."
      - kind: aside
        tone: exam
        text: "حامل بعد ==أسبوع 20== نامت على ضهرها فدايخة وضغطها وقع؟ الرحم ضاغط على الـ aorta والـ IVC (aortocaval compression). الحل: تنام على ==جنبها الشمال== (left lateral decubitus)."
        page: 661
        quote: "Also called aortocaval compression syndrome. Seen at >20 weeks of gestation. Supine position → compression of abdominal aorta and IVC by gravid uterus → ↓ placental perfusion (can lead to pregnancy loss) and ↓ venous return (hypotension). Relieved by left lateral decubitus position."
      - kind: try
        items: [repro.L04.054, repro.L04.214, repro.L04.215, repro.L04.216, repro.L04.217]
    recap:
      - "Mole: رحم كبير، hCG عالي (thyroid و theca lutein و preeclampsia بدري). Complete = 46,XX من الأب."
      - "Choriocarcinoma: مفيش villi، cannonball في الرئة، methotrexate."
