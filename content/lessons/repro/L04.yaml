  - id: repro.L04.lesson6
    title: "الخصية والبروستاتا"
    hook: "خصية بتوجع فجأة، خصية بتنور، وخصية تقيلة من غير وجع. كل واحدة ليها كلمة سر"
    minutes: 10
    pages: [669, 672]
    topics: [penile-pathology, cryptorchidism, testicular-torsion, varicocele, extragonadal-germ-cell-tumors, benign-scrotal-lesions, testicular-tumors, epididymitis-orchitis, benign-prostatic-hyperplasia, prostatitis, prostatic-adenocarcinoma]
    status: unverified
    steps:
      - kind: explain
        title: "الـ penis"
        text: |-
          - **Peyronie**: plaque ليفي في الـ tunica albuginea ← انحناء. غير الـ penile fracture (الـ tunica اتقطعت).
          - **Ischemic priapism**: انتصاب بيوجع ==أكتر من 4 ساعات==. في الـ sickle cell، الـ RBCs بتسد الـ venous drainage. طوارئ: aspiration و phenylephrine.
          - **SCC**: مع عدم الختان و HPV-16.
        page: 669
        quote: "Painful sustained erection lasting >4 hours. Associated with sickle cell disease (sickled RBCs block venous drainage of corpus cavernosum vascular channels), medications (eg, sildenafil, trazodone)."
      - kind: reveal
        prompt: "في الـ cryptorchidism، ليه الخصوبة بتقل بس الـ testosterone ممكن يفضل طبيعي؟"
        answer: "الـ sperm محتاجة حرارة ==أقل من 37°C==، فالـ spermatogenesis يبوظ. أما الـ Leydig cells فمش بتتأثر بالحرارة. والـ testosterone يقل بس لو الاتنين ما نزلوش. والـ risk بتاع الـ ==germ cell tumors== بيعلى، فالـ orchiopexy قبل سنتين."
        page: 669
        quote: "Impaired spermatogenesis (since sperm develop best at temperatures <37°C) → subfertility. Can have normal testosterone levels (Leydig cells are mostly unaffected by temperature). Associated with ↑ risk of germ cell tumors."
      - kind: figure
        title: "الخصية بتوجع ولا بتنور"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="5" y="10" width="112" height="150" rx="10"/>
            <text x="20" y="32" class="t-sm t-b">Torsion</text>
            <text x="12" y="58" class="t-sm">high-riding</text>
            <text x="12" y="78" class="t-sm">horizontal</text>
            <text x="12" y="98" class="t-sm">no cremasteric</text>
            <text x="12" y="118" class="t-sm t-b">⊝ Prehn</text>
            <text x="12" y="145" class="t-sm t-mut">bell clapper</text>
            <rect class="fg-good" x="124" y="10" width="112" height="150" rx="10"/>
            <text x="134" y="32" class="t-sm t-b">Epididymitis</text>
            <text x="131" y="58" class="t-sm">posterior pain</text>
            <text x="131" y="78" class="t-sm">reflex present</text>
            <text x="131" y="118" class="t-sm t-b">⊕ Prehn</text>
            <text x="131" y="145" class="t-sm t-mut">chlamydia · E coli</text>
            <rect class="fg-box" x="243" y="10" width="112" height="150" rx="10"/>
            <text x="253" y="32" class="t-sm t-b">Varicocele</text>
            <text x="250" y="58" class="t-sm">bag of worms</text>
            <text x="250" y="78" class="t-sm">↑ with Valsalva</text>
            <text x="250" y="98" class="t-sm">left side</text>
            <text x="250" y="118" class="t-sm t-b">no light</text>
            <text x="250" y="145" class="t-sm t-mut">pampiniform</text>
          </svg>
        caption: "الـ Prehn sign: ترفع الصفن والوجع يهدى؟ ده epididymitis (⊕). ما بيهداش؟ torsion (⊝). والـ varicocele مش بيوجع غالباً وما بينورش."
        alt: "Torsion has a high-riding horizontal testis, no cremasteric reflex and a negative Prehn sign; epididymitis has posterior pain, a present reflex and a positive Prehn sign; varicocele is a bag of worms on the left that grows with Valsalva and does not transilluminate."
        page: 669
        quote: "Characterized by acute, severe pain, high-riding testis, and absent cremasteric reflex. ⊝ Prehn sign."
      - kind: check
        question: "A 15-year-old has sudden severe scrotal pain. The testis is high and horizontal, and the cremasteric reflex is absent. What is the plan?"
        options:
          - "Orchiopexy within 6 hours, on both sides"
          - "Antibiotics and scrotal support"
          - "Ultrasound in 2 days"
          - "Radical orchiectomy for tumor"
        answer: 0
        why:
          - "صح: torsion. الجراحة في خلال 6 ساعات، والناحيتين لأن التانية ممكن تلف بعدين."
          - "ده علاج الـ epididymitis."
          - "التأخير بيموّت الخصية."
          - "الأورام مش بتوجع فجأة كده."
        page: 669
        quote: "Orchiopexy, when performed, should be bilateral because the contralateral testis is at risk for subsequent torsion."
      - kind: aside
        tone: trap
        text: "الـ varicocele غالباً ==شمال==، لأن الـ left gonadal vein بيصب في الـ left renal vein. لو لقيته ==يمين== فجأة، فكّر في حاجة سادّة الـ IVC، زي RCC داخل الـ right renal vein."
        page: 669
        quote: "Most often on left side because of ↑ resistance to flow from left gonadal vein drainage into left renal vein. Right-sided varicocele may indicate IVC obstruction (eg, from RCC invading right renal vein)."
      - kind: explain
        title: "اللي بينوّر واللي برّه الخصية"
        text: |-
          الكتل اللي ==بتنوّر== (transilluminate) حميدة:
          - **Hydrocele**: سائل في الـ tunica vaginalis. في الرضيع من الـ processus vaginalis اللي ما اتقفلش، وغالباً بيروح في سنة.
          - **Spermatocele**: cyst من الـ epididymis، nodule جنب الخصية.

          والـ germ cell tumors اللي برّه الـ gonad بتطلع في ==الخط اللي في النص==: retroperitoneum و mediastinum و pineal. وفي الأطفال sacrococcygeal teratoma.
        page: 670
        quote: "Congenital (communicating)—due to incomplete obliteration of processus vaginalis. Common cause of scrotal swelling in infants. Most resolve spontaneously within 1 year."
      - kind: table
        title: "أورام الخصية والـ markers"
        columns: ["Tumor", "Clue", "Marker"]
        rows:
          - ["Seminoma", "Painless, homogenous; fried egg; radiosensitive", "↑ PLAP"]
          - ["Yolk sac", "Children <3 years; Schiller-Duval bodies", "↑↑ AFP"]
          - ["Choriocarcinoma", "Lungs and brain; gynecomastia, hyperthyroidism", "↑↑ hCG"]
          - ["Embryonal", "Painful, hemorrhagic; usually mixed", "↑ hCG"]
          - ["Leydig cell", "Reinke crystals; golden brown", "Androgens or estrogens"]
          - ["Testicular lymphoma", "Males >60; often bilateral; diffuse large B-cell", "–"]
        hide: [[0, 2], [1, 2], [2, 2], [4, 1], [5, 1]]
        page: 671
        quote: "Schiller-Duval bodies resemble primitive glomeruli. ↑ AFP is highly characteristic. Most common testicular tumor in children <3 years old."
      - kind: aside
        tone: tip
        text: "ورم الخصية ==ما بيتعملوش biopsy== (ممكن يزرع في الصفن)، بيتشال بـ radical orchiectomy. والـ germ cell tumors هي ==95%== من أورام الخصية، و risk factors بتاعتها cryptorchidism و Klinefelter."
        page: 670
        quote: "Do not transilluminate. Usually not biopsied (risk of seeding scrotum), removed via radical orchiectomy."
      - kind: check
        question: "Why can a testicular choriocarcinoma cause tremor and weight loss?"
        options:
          - "hCG shares its α subunit with TSH and stimulates the thyroid"
          - "It secretes thyroxine"
          - "It spreads to the thyroid"
          - "It makes estrogen"
        answer: 0
        why:
          - "صح: الـ hCG والـ TSH ليهم نفس الـ α subunit، والـ hCG العالي جداً بيشغّل الـ thyroid."
          - "مش بيعمل thyroxine."
          - "بينتشر للرئة والمخ."
          - "الـ estrogen يعمل gynecomastia، مش hyperthyroidism."
        page: 671
        quote: "May produce gynecomastia, symptoms of hyperthyroidism (hCG and TSH share an identical α subunit and a similar β subunit, which determines their hormonal function)."
      - kind: explain
        title: "BPH"
        text: |-
          فوق 50، الـ ==transition zone== بيكبر (hyperplasia) ويضغط الـ urethra. مش premalignant. Nocturia وصعوبة في البداية والنهاية.

          الـ PSA الكلي عالي، بس الـ ==free PSA نسبته عالية==. العلاج: **α1-blockers** (tamsulosin) ترخّي العضلة، **finasteride**، tadalafil، أو TURP.
        page: 672
        quote: "Characterized by smooth, elastic, firm nodular enlargement (hyperplasia not hypertrophy) of transition zone, which compress the urethra into a vertical slit. Not premalignant."
      - kind: explain
        title: "Prostate cancer"
        text: |-
          بيطلع من الـ ==peripheral zone== (الـ posterior lobe)، فبيتحس في الـ rectal exam. التشخيص: PSA عالي ثم biopsy. والـ Gleason grade على شكل الغدد.

          الـ free PSA نسبته ==واطية==. وفي الآخر: bone metastases **osteoblastic** (ألم ضهر و ALP عالي)، وبتوصل للعمود الفقري عن طريق الـ ==Batson venous plexus==.
        page: 672
        quote: "Osteoblastic metastases in bone may develop in late stages, as indicated by lower back pain and ↑ serum ALP and PSA. Metastasis to the spine often occurs via Batson (vertebral) venous plexus."
      - kind: check
        question: "Two men have the same high total PSA. One has a high free PSA fraction, the other a low one. Which is more likely cancer?"
        options:
          - "The one with the low free PSA fraction"
          - "The one with the high free PSA fraction"
          - "Both equally"
          - "Neither, as PSA rises only in prostatitis"
        answer: 0
        why:
          - "صح: الـ adenocarcinoma ↑ total PSA و ↓ free fraction."
          - "ده شكل الـ BPH."
          - "النسبة بتفرّق بينهم."
          - "الـ PSA بيعلى في BPH وفي السرطان."
        page: 672
        quote: "Prostatic acid phosphatase (PAP) and PSA are useful tumor markers (↑ total PSA, with ↓ fraction of free PSA)."
      - kind: aside
        tone: exam
        text: "**Prostatitis**: dysuria و frequency وألم في الضهر، والبروستاتا ==سخنة وبتوجع==. راجل كبير؟ E coli. شاب؟ فكّر في chlamydia و gonorrhea، زي الـ epididymitis بالظبط."
        page: 672
        quote: "Acute bacterial prostatitis—in older males most common bacterium is E coli; in young males consider C trachomatis, N gonorrhoeae."
      - kind: try
