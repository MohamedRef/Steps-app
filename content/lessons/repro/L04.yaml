  - id: repro.L04.lesson5
    title: "أورام الـ ovary والرحم والصدر"
    hook: "كل ورم ليه علامة: fried egg، Call-Exner، single file، peau d'orange. اعرف العلامة تعرف الورم"
    minutes: 10
