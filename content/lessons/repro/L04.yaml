      - kind: explain
        title: "أورام الـ ovary: منين بتيجي"
        text: |-
          أشهر adnexal mass بعد ==55 سنة==. بتيجي بانتفاخ في البطن أو انسداد أو pleural effusion.

          الـ risk بيعلى مع كل ==ovulation زيادة== (menarche بدري، menopause متأخر، مفيش ولادة)، و BRCA و Lynch. وبيقل مع الحمل والرضاعة والـ OCPs. والـ **CA 125** للمتابعة، مش للـ screening.
        page: 664
        quote: "Risk ↑ with advanced age, ↑ number of lifetime ovulations (early menarche, late menopause, nulliparity), endometriosis, genetic predisposition (eg, BRCA1/BRCA2 mutations, Lynch syndrome). Risk ↓ with previous pregnancy, history of breastfeeding, OCPs, tubal ligation."
