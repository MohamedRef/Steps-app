        caption: "الـ pituitary محتاجة الـ GnRH ييجي على دفعات. دفعات سريعة تطلّع LH أكتر، ودفعات بطيئة تطلّع FSH أكتر. ولو خليته مستمر، الـ receptor يتعب ويقفل، فالاتنين يقلّوا."
