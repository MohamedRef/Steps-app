  - id: repro.L03.lesson4
    title: "سن اليأس، الـ androgens، والبلوغ بدري أو متأخر"
    hook: "الـ FSH العالي بيقولك المبيض خلص. والـ GnRH بيشتغل بالـ pulses، ولو خليته مستمر يقفل كل حاجة"
    minutes: 10
    pages: [653, 654]
    topics: [menopause, androgens, tanner-stages, precocious-puberty, delayed-puberty, gnrh-pulsatility]
    status: unverified
    steps:
      - kind: explain
        title: "Menopause"
        text: |-
          التشخيص: ==12 شهر من غير دورة==. السبب: الـ follicles بتخلص مع السن، فالـ estrogen يقل. متوسط السن **51** (أبدر في المدخنين)، وقبلها 4-5 سنين دورات مش منتظمة.

          بعدها مصدر الـ estrogen (estrone) هو تحويل الـ androgens في الأطراف، والـ androgens العالية ممكن تعمل hirsutism.
        page: 653
        quote: "Diagnosed by amenorrhea for 12 months. ↓ estrogen production due to age-linked decline in number of ovarian follicles. Average age at onset is 51 years (earlier in people who smoke tobacco)."
      - kind: reveal
        prompt: "إيه الـ lab اللي specific لسن اليأس، وليه؟"
        answer: "**↑↑ FSH**. الـ estrogen وقع، فالـ negative feedback على الـ FSH راح. (والـ LH بيعلى من غير surge، والـ GnRH بيعلى.)"
        page: 653
        quote: "↑↑ FSH is specific for menopause (loss of negative feedback on FSH due to ↓ estrogen)."
      - kind: mnemonic
        word: "HAVOCS"
        parts:
          - { key: "H", text: "Hot flashes (most common)" }
          - { key: "A", text: "Atrophy of the" }
          - { key: "V", text: "Vagina" }
          - { key: "O", text: "Osteoporosis (↑ osteoclast activity)" }
          - { key: "C", text: "Coronary artery disease" }
          - { key: "S", text: "Sleep disturbances" }
        hook: "سن اليأس بيعمل havoc"
        page: 653
        quote: "Causes HAVOCS: Hot flashes (most common), Atrophy of the Vagina, Osteoporosis (↑ osteoclast activity), Coronary artery disease, Sleep disturbances."
      - kind: aside
        tone: exam
        text: "الـ HRT بيعالج الأعراض، بس معاه خطر breast و endometrial cancer و CVD و stroke و thromboembolism. ولو سن اليأس جه ==قبل 40== يبقى ovarian insufficiency (premature ovarian failure)، ممكن بعد chemotherapy أو radiation."
        page: 653
        quote: "Menopause before age 40 suggests ovarian insufficiency (premature ovarian failure); may occur in females who have received chemotherapy and/or radiation therapy."
      - kind: explain
        title: "الـ androgens"
        text: |-
          - من الخصية: **DHT** و **testosterone**. من الـ adrenal: **DHEA** و **androstenedione**.
          - القوة: ==DHT > testosterone > androstenedione > DHEA==.

          **Testosterone**: الـ internal genitalia (epididymis و vas و seminal vesicles، ماعدا الـ prostate)، الـ growth spurt (penis، عضلات، RBCs، sperm)، الصوت، الـ libido، وبيقفل الـ epiphyses **عن طريق الـ estrogen** اللي بيتحول منه.

          **DHT**: بدري الـ penis والـ scrotum والـ prostate؛ متأخر ==prostate growth== والصلع (androgenetic alopecia) والـ sebaceous glands. بيتعمل بالـ **5α-reductase**، والـ **finasteride** بيمنعه.
        page: 653
        quote: "Potency: DHT > testosterone > androstenedione > DHEA."
      - kind: case
        stem: "A 24-year-old bodybuilder has back acne, tender breast enlargement and irritability."
        steps:
          - reveal: "Hematocrit 56%. Both testes are small and soft."
            question: "Why are his testes small?"
            options: ["Exogenous testosterone suppresses the HPG axis", "Direct testosterone toxicity", "DHT causes testicular fibrosis", "Varicocele"]
            answer: 0
            why: "Exogenous testosterone → HPG axis inhibition → ↓ intratesticular testosterone → ↓ testicular size, ↓ sperm count, azoospermia."
          - question: "Why does he have gynecomastia?"
            options: ["Aromatase turns the extra androgen into estrogen", "Prolactin excess", "hCG from a tumor", "Low testosterone"]
            answer: 0
            why: "In males, androgens are converted to estrogens by aromatase, mainly in adipose tissue and testes."
        page: 653
        quote: "small testes (exogenous testosterone → hypothalamic- pituitary-gonadal axis inhibition → ↓ intratesticular testosterone → ↓ testicular size, ↓ sperm count, azoospermia)"
      - kind: explain
        title: "الـ Tanner"
        text: |-
          كل حاجة (genitalia و pubic hair و breast) ==بتتقيّم لوحدها==. أول علامة: ==breast bud== في البنت، و **testicular enlargement** في الولد.

          - **II** (~8-11.5): الشعر يبدأ، الخصية تكبر، breast bud.
          - **III** (~11.5-13): الشعر يتقّل، الـ penis يطول، الصدر يكبر.
          - **IV** (~13-15): شعر على الـ pubis من غير الفخذ، الـ penis يتخن، و mound on mound.
          - **V** (>15): الشعر يوصل الفخذ، حجم الكبار، والـ areola تتفرد.
        page: 654
        quote: "Earliest detectable secondary sexual characteristic is breast bud development in females, testicular enlargement in males."
      - kind: explain
        title: "بدري ولا متأخر؟"
        text: |-
          **Precocious**: قبل ==8 سنين للبنت و 9 للولد==. الهرمونات بتطوّل بسرعة بس تقفل الـ epiphyses بدري ← قِصَر في الآخر.
          - **Central** (GnRH عالي): غالباً idiopathic، أو CNS tumor.
          - **Peripheral** (GnRH-independent): CAH، granulosa cell tumor، Leydig cell tumor، McCune-Albright، أو هرمونات من برّه.

          **Delayed**: مفيش علامات لحد ==13 للبنت و 14 للولد==.
          - **Hypergonadotropic** (المشكلة في الـ gonad): Klinefelter، Turner، chemo أو radiation أو infection.
          - **Hypogonadotropic** (المشكلة فوق): constitutional delay («late blooming»)، Kallmann، CNS lesions.
        page: 654
        quote: "Absence of 2° sexual characteristics by age 13 years in females and 14 years in males."
      - kind: check
        question: "A 6-year-old girl has breasts and vaginal bleeding, very high estradiol, and LH/FSH that don't rise with GnRH. An ovarian mass is seen. Diagnosis?"
        options:
          - "Granulosa cell tumor (peripheral)"
          - "Idiopathic central precocious puberty"
          - "Kallmann syndrome"
          - "CNS tumor"
        answer: 0
        why:
          - "صح: LH و FSH مقفولين = peripheral، والـ granulosa cell tumor بيعمل estrogen."
          - "الـ central بيبقى فيه LH و FSH عالي."
          - "Kallmann بيأخّر البلوغ."
          - "الـ CNS tumor بيعمل central."
        page: 654
        quote: "Peripheral precocious puberty (GnRH-independent; ↑ sex hormone production or exposure to exogenous sex steroids): congenital adrenal hyperplasia, estrogen-secreting ovarian tumor (eg, granulosa cell tumor)"
      - kind: explain
        title: "الـ GnRH لازم pulses"
        text: |-
          الـ pituitary محتاجة GnRH ==بيتقطّع== عشان تعمل LH و FSH.

          - **Pulses سريعة** ← LH. **Pulses بطيئة** ← FSH.
          - **مستمر** ← الـ GnRHR يتعب (desensitization) ← ==LH و FSH يقعوا==. وده اللي بنستغله في علاج الـ prostate cancer.

          الـ pulses تقل أو تختفي في: Kallmann، functional hypothalamic amenorrhea، مرض شديد أو سوء تغذية، hyperprolactinemia. وتزيد في **PCOS** (فالـ LH عالي).
        page: 654
        quote: "Pulsatile GnRH required for pituitary function → LH/FSH pulses. High-frequency pulses → ↑ LH; low-frequency pulses → ↑ FSH. Continuous GnRH → GnRHR desensitization → ↓ LH/↓ FSH."
      - kind: check
        question: "Why does continuous leuprolide lower testosterone in prostate cancer?"
        options:
          - "Continuous GnRH desensitizes the GnRH receptor, lowering LH and FSH"
          - "It blocks 5α-reductase"
          - "It blocks the androgen receptor"
          - "Fast pulses raise FSH only"
        answer: 0
        why:
          - "صح: GnRH مستمر ← desensitization ← LH و FSH يقعوا ← testosterone يقع."
          - "الـ 5α-reductase بيمنعه finasteride، وده بيقلل DHT."
          - "ده شغل الـ antiandrogens."
          - "الـ pulses السريعة بتعلّي LH، والبطيئة FSH."
        page: 654
        quote: "Continuous GnRH → GnRHR desensitization → ↓ LH/↓ FSH."
      - kind: figure
        title: "سرعة الـ GnRH pulses بتختار الهرمون"
        svg: |-
