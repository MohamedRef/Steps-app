schema: steps.lesson/v1
lecture: repro.L02
lessons:
  - id: repro.L02.lesson1
    title: "الـ gonads نزلت من البطن، وده بيفسّر كل حاجة"
    hook: "ليه الـ varicocele في الشمال؟ وليه سرطان الخصية بيروح para-aortic؟ الإجابة واحدة: الخصية أصلها في البطن"
    minutes: 9
    pages: [642, 643]
    topics: [descent-of-testes-and-ovaries, drainage-of-reproductive-organs, female-reproductive-anatomy, adnexal-torsion, pelvic-organ-prolapse]
    status: unverified
    steps:
      - kind: explain
        title: "الـ gubernaculum والـ processus vaginalis"
        text: |-
          الـ gonads بتتعمل جنب الكلى، وبتنزل. اللي بيشدّها لتحت ==الـ gubernaculum==: شريط fibrous.

          - في الذكر: بيثبّت الخصية في الـ scrotum.
          - في الأنثى: باقيه هو الـ **ovarian ligament** والـ **round ligament** of uterus.

          والـ **processus vaginalis** جيب من الـ peritoneum بينزل قدّام الخصية. في الذكر بيبقى الـ **tunica vaginalis**، وفي الأنثى بيتقفل. لو فضل مفتوح في الذكر، المية تنزل من البطن حوالين الخصية: ==hydrocele==.
        page: 642
        quote: "Gubernaculum Band of fibrous tissue Anchors testes within scrotum Ovarian ligament + round ligament of uterus Processus vaginalis Evagination of peritoneum Forms tunica vaginalis Persistent patent processus vaginalis → hydrocele"
      - kind: explain
        title: "الوريد بيرجع لمكانه الأصلي"
        text: |-
          الخصية نزلت بس أوعيتها لسه جاية من فوق:

          - **اليمين**: gonadal vein ← ==IVC== على طول.
          - **الشمال**: gonadal vein ← **left renal vein** ← IVC، يعني الطريق الأطول.

          والـ left testicular vein بيدخل الـ renal vein ==بزاوية 90°==، فالـ flow مش laminar زي اليمين، والضغط في الشمال أعلى، فالـ **varicocele أشهر في الشمال**.
        page: 642
        quote: "Left testicular vein enters left renal vein at 90° angle → flow is less laminar on the left than on the right → left venous pressure > right venous pressure → varicocele is more common on the left."
      - kind: figure
        title: "الـ gonadal veins"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="170" y="10" width="20" height="180" rx="6"/>
            <text x="166" y="198" class="t-sm t-b">IVC</text>
            <ellipse class="fg-box" cx="70" cy="45" rx="28" ry="20"/>
            <text x="50" y="25" class="t-sm">R kidney</text>
            <ellipse class="fg-box" cx="290" cy="45" rx="28" ry="20"/>
            <text x="268" y="25" class="t-sm">L kidney</text>
            <line class="fg-ink" x1="190" y1="45" x2="262" y2="45" stroke-width="3"/>
            <text x="200" y="38" class="t-sm">L renal vein</text>
            <path class="fg-arrow-acc" d="M110 175 L170 120" stroke-width="3"/>
            <text x="40" y="180" class="t-sm t-acc">R gonadal → IVC</text>
            <path class="fg-arrow-bad" d="M260 175 L240 45" stroke-width="3"/>
            <text x="255" y="190" class="t-sm t-bad">L gonadal</text>
            <text x="244" y="80" class="t-sm t-bad">90°</text>
          </svg>
        caption: "اليمين بيصب في الـ IVC بزاوية مايلة وسهلة. الشمال بيطلع لحد الـ left renal vein ويدخله بزاوية 90°، فالضغط أعلى والـ varicocele أكتر."
        alt: "The inferior vena cava in the middle. The right gonadal vein joins it obliquely. The left gonadal vein runs up to the left renal vein and joins it at a right angle before the renal vein reaches the IVC."
        page: 642
        quote: "Right ovary/testis → right gonadal vein → IVC. Left ovary/testis → left gonadal vein → left renal vein → IVC (takes the longer way)."
      - kind: explain
        title: "الـ lymph: افتكر الأصل"
        text: |-
          - اللي أصله في البطن (==ovaries و tubes و fundus، والـ testes==) ← **para-aortic**.
          - الحاجات الجوانية في الحوض: superior bladder وجسم الرحم والـ cervix ← **external iliac**؛ inferior bladder والـ cervix والـ proximal vagina والـ prostate والـ corpus cavernosum ← **internal iliac**.
          - الجلد والحاجات اللي برّه (distal anal canal، distal vagina، vulva، ==scrotum==) ← **superficial inguinal**.
          - الـ glans (penis أو clitoris) ← **deep inguinal**.
        page: 642
        quote: "PARA-AORTIC Ovaries, fallopian tubes, uterine fundus Testes EXTERNAL ILIAC Superior part of bladder Body of uterus, cervix INTERNAL ILIAC Inferior part of bladder Cervix, proximal vagina Prostate, corpus cavernosum SUPERFICIAL INGUINAL Distal anal canal Distal vagina, vulva Scrotum DEEP INGUINAL Glans clitoris Glans penis"
      - kind: check
        question: "A testicular tumor and a scrotal skin cancer: which node groups does each spread to first?"
        options:
          - "Testis: para-aortic; scrotum: superficial inguinal"
          - "Both: superficial inguinal"
          - "Testis: internal iliac; scrotum: deep inguinal"
          - "Both: para-aortic"
        answer: 0
        why:
          - "صح: الخصية أصلها في البطن فبتروح para-aortic، والـ scrotum جلد فبيروح superficial inguinal."
          - "الخصية مش بتروح inguinal، ده فخ مشهور."
          - "الـ internal iliac للـ prostate والـ cervix، والـ deep inguinal للـ glans."
          - "الـ scrotum جلد، مش جاي من البطن."
        page: 642
        quote: "PARA-AORTIC Ovaries, fallopian tubes, uterine fundus Testes"
      - kind: table
        title: "أربطة الحوض في الأنثى"
        columns: ["Ligament", "Connects", "Contains"]
        rows:
          - ["Infundibulopelvic (suspensory)", "Ovary → lateral pelvic wall", "Ovarian vessels"]
          - ["Utero-ovarian", "Ovary → uterine horn", "—"]
          - ["Round", "Uterine horn → labia majora", "—"]
          - ["Broad", "Uterus → lateral pelvic wall", "Ovary, tube, round ligament"]
          - ["Cardinal", "Cervix → lateral pelvic wall", "Uterine vessels"]
          - ["Uterosacral", "Cervix → sacrum", "—"]
        hide: [[0, 2], [3, 2], [4, 2], [2, 1]]
        page: 643
        quote: "Infundibulopelvic ligament Ovary to lateral pelvic wall Ovarian vessels Also called suspensory ligament of ovary"
      - kind: aside
        tone: trap
        text: "الحالب بيعدّي جنب الأوعية دي. في الـ **oophorectomy** لما تربط الـ ovarian vessels (infundibulopelvic) ممكن تمسك الحالب، وفي الـ **hysterectomy** لما تربط الـ ==uterine vessels== (cardinal ligament) برضه. والـ round و utero-ovarian هما باقي الـ gubernaculum، والـ round بيعدّي من الـ inguinal canal."
        page: 643
        quote: "Uterine vessel ligation during hysterectomy risks damaging the ureter"
      - kind: explain
        title: "الـ adnexal torsion"
        text: |-
          الـ ovary والـ tube بيلفّوا حوالين الـ infundibulopelvic والـ ovarian ligament، غالباً عشان فيه ==cyst أو mass== مخلّيهم تقال.

          الترتيب مهم: الأوردة والـ lymphatics ضغطها واطي فبتتقفل **الأول**، والشريان لسه بيضخ ← الـ ovary ==يتنفخ (edema)== ← وبعدين الشريان يتقفل ← necrosis ونزيف.

          بتيجي بألم حوضي حاد، mass، و nausea/vomiting. وده **surgical emergency**.
        page: 643
        quote: "Twisting of ovary and fallopian tube around infundibulopelvic ligament and ovarian ligament → compression of ovarian vessels in infundibulopelvic ligament → blockage of lymphatic and venous outflow. Continued arterial perfusion → ovarian edema → complete blockage of arterial inflow → necrosis, local hemorrhage."
      - kind: aside
        tone: analogy
        text: "زي ما تلف خرطوم مية حوالين نفسه وهو لسه مفتوح: المية داخلة ومش لاقية تطلع، فالخرطوم ينفخ الأول قبل ما يتقفل خالص. نفس الحكاية: continued arterial perfusion ← ovarian edema ← وبعدين complete blockage ← necrosis."
        page: 643
        quote: "Continued arterial perfusion → ovarian edema → complete blockage of arterial inflow"
      - kind: sort
        prompt: "الـ prolapse ده في أنهي compartment؟"
        bins: ["Anterior", "Posterior", "Apical"]
        cards:
          - { text: "Cystocele (bladder)", bin: 0 }
          - { text: "Rectocele (rectum)", bin: 1 }
          - { text: "Enterocele (small bowel)", bin: 1 }
          - { text: "Uterus", bin: 2 }
          - { text: "Vaginal vault", bin: 2 }
          - { text: "Cervix", bin: 2 }
        why: "الـ anterior هو المثانة وده الأشهر. الـ posterior الـ rectum أو الـ small bowel. الـ apical الرحم أو الـ cervix أو الـ vault. ولو التلاتة مع بعض يبقى uterine procidentia. وعوامل الخطر: ولادات كتير، السن، والسمنة."
        page: 643
        quote: "Anterior compartment prolapse—bladder (cystocele). Most common type. ▪ Posterior compartment prolapse—rectum (rectocele) or small bowel (enterocele). ▪ Apical compartment prolapse—uterus, cervix, or vaginal vault."
      - kind: try
        items: [repro.L02.001, repro.L02.005, repro.L02.006, repro.L02.009, repro.L02.019]
    recap:
      - "Gubernaculum ← ovarian و round ligaments. Processus vaginalis مفتوح ← hydrocele."
      - "الـ left gonadal ← left renal vein بزاوية 90° ← varicocele في الشمال."
      - "الخصية para-aortic، الـ scrotum superficial inguinal، الـ glans deep inguinal."
      - "الحالب في خطر عند ربط الـ ovarian vessels أو الـ uterine vessels (cardinal)."
      - "Torsion: veins تتقفل الأول ← edema ← necrosis. طوارئ جراحة."
    practice: [repro.L02.001, repro.L02.002, repro.L02.003, repro.L02.004, repro.L02.005, repro.L02.006, repro.L02.007, repro.L02.008, repro.L02.009, repro.L02.010, repro.L02.011, repro.L02.012, repro.L02.013, repro.L02.014, repro.L02.015, repro.L02.016, repro.L02.017, repro.L02.018, repro.L02.019, repro.L02.020]
  - id: repro.L02.lesson2
    title: "الـ epithelium، طريق الحيوان المنوي، وإصابات المسالك"
    hook: "SEVEN UP، والـ high-riding prostate، وليه ما تحطّش قسطرة. حاجات بتيجي في الامتحان كل مرة"
    minutes: 8
    pages: [644, 645]
    topics: [female-epithelial-histology, male-reproductive-anatomy, genitourinary-trauma]
    status: unverified
    steps:
      - kind: explain
        title: "من برّه لجوّه: squamous لحد ما توصل الـ cervix"
        text: |-
          كل اللي بيتعرّض لاحتكاك ==stratified squamous==: الـ vulva، والـ vagina والـ ectocervix (nonkeratinized).

          من الـ endocervix وطالع ==simple columnar==: الـ endocervix، والـ uterus (glands طويلة tubular في الـ proliferative وملفوفة coiled في الـ secretory)، والـ fallopian tube (ciliated عشان يحرّك البويضة).

          وبرّه الـ ovary: **simple cuboidal** (germinal epithelium).
        page: 644
        quote: "Vulva Stratified squamous epithelium Vagina Stratified squamous epithelium, nonkeratinized Ectocervix Stratified squamous epithelium, nonkeratinized"
      - kind: reveal
        prompt: "فين بالظبط بيتعمل الـ Pap test، وليه هناك؟"
        answer: "في الـ **transformation zone**، الـ squamocolumnar junction، لأن ده **أشهر مكان لسرطان الـ cervix**: خلايا بتتحول من نوع لنوع فهي الأكتر عرضة."
        page: 644
        quote: "Transformation zone Squamocolumnar junction (most common area for cervical cancer; sampled in Pap test)"
      - kind: mnemonic
        word: "SEVENUP"
        parts:
          - { key: "S", text: "Seminiferous tubules" }
          - { key: "E", text: "Epididymis" }
          - { key: "V", text: "Vas deferens" }
          - { key: "E", text: "Ejaculatory ducts" }
          - { key: "N", text: "(Nothing)" }
          - { key: "U", text: "Urethra" }
          - { key: "P", text: "Penis" }
        hook: "طريق الحيوان المنوي زي إزازة السفن أب"
        page: 644
        quote: "Pathway of sperm during ejaculation— SEVEN UP: Seminiferous tubules Epididymis Vas deferens Ejaculatory ducts (Nothing) Urethra Penis"
      - kind: figure
        title: "طبقات الـ penis"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-thin" cx="120" cy="100" r="88"/>
            <circle class="fg-box" cx="120" cy="100" r="75"/>
            <circle class="fg-acc" cx="120" cy="100" r="62"/>
            <circle class="fg-good" cx="92" cy="85" r="24"/>
            <circle class="fg-good" cx="148" cy="85" r="24"/>
            <circle class="fg-bad" cx="120" cy="135" r="18"/>
            <circle class="fg-dot-bad" cx="120" cy="135" r="4"/>
            <text x="225" y="25" class="t-sm">Skin</text>
            <text x="225" y="50" class="t-sm">Dartos (superficial) fascia</text>
            <text x="225" y="75" class="t-sm t-acc">Buck (deep) fascia</text>
            <text x="225" y="100" class="t-sm t-good">Corpora cavernosa</text>
            <text x="225" y="125" class="t-sm t-bad">Corpus spongiosum</text>
            <text x="225" y="145" class="t-sm t-bad">+ urethra</text>
            <text x="225" y="168" class="t-sm t-mut">each wrapped in</text>
            <text x="225" y="185" class="t-sm t-mut">tunica albuginea</text>
          </svg>
        caption: "الـ Buck fascia بتلف الأجسام التلاتة. لو الـ spongy urethra اتقطعت والـ Buck fascia سليمة، الدم والبول بيفضلوا جوّاها. لو هي كمان اتقطعت، البول يطلع للـ perineum."
        alt: "A cross-section of the penis: skin, superficial dartos fascia, deep Buck fascia, two dorsal corpora cavernosa and a ventral corpus spongiosum containing the urethra, each erectile body wrapped in tunica albuginea."
        page: 644
        quote: "Skin Superficial (dartos) fascia Deep (Buck’s) fascia Tunica albuginea Corpus cavernosum"
      - kind: explain
        title: "إصابة المثانة: الـ dome ولا الـ neck؟"
        text: |-
          معظم الـ GU trauma من **blunt trauma** (حادثة عربية).

          - **Dome** (أضعف حتة): ضربة على ==مثانة مليانة== (حزام الأمان) ← الضغط يعلى فجأة ← الـ dome ينفجر ← البول في الـ **peritoneum**. والـ peritoneum بيمتص البول، فالـ BUN والـ creatinine يعلوا.
          - **Anterior wall أو neck**: ==كسر الحوض== وحتة عظم تخرمها ← البول **extraperitoneal** في الـ retropubic space.
        page: 645
        quote: "Superior bladder wall (dome) injury—direct trauma to full bladder (eg, seatbelt) → abrupt ↑ intravesical pressure → dome rupture (weakest part) → intraperitoneal urine accumulation. Peritoneal absorption of urine → ↑ BUN, ↑ creatinine."
      - kind: explain
        title: "الـ urethra: straddle ولا pelvic fracture؟"
        text: |-
          تقريباً في الذكور بس: دم على الـ meatus، hematuria، وصعوبة في التبول. والقاعدة: ==ما تحطّش urethral catheter==.

          - **Anterior**: وقع راكب على حاجة (==straddle==) ← الـ bulbar (spongy) urethra تتقطع ← scrotal hematoma. لو الـ Buck fascia اتقطعت، البول في الـ perineal space.
          - **Posterior**: ==pelvic fracture== ← الـ bulbomembranous junction (أضعف حتة) تتقطع ← البول في الـ retropubic space والـ prostate **high-riding**.
        page: 645
        quote: "Urethral injury Occurs almost exclusively in males. Presents with blood at urethral meatus, hematuria, difficulty voiding. Urethral catheterization is relatively contraindicated."
      - kind: case
        stem: "A 30-year-old man fell astride a metal beam at a construction site. He has perineal pain and can't pass urine."
        steps:
          - reveal: "There is blood at the urethral meatus and a large scrotal hematoma. The pelvis is stable on x-ray."
            question: "Which part of the urethra is injured?"
            options: ["Bulbar (spongy) urethra", "Bulbomembranous junction", "Prostatic urethra", "Bladder dome"]
            answer: 0
            why: "Straddle injury tears the anterior urethra at the bulbar (spongy) part, giving a scrotal hematoma. The bulbomembranous junction tears with pelvic fractures."
          - question: "What should be avoided as the first step?"
            options: ["Blind urethral catheterization", "Imaging of the urethra", "Analgesia", "Examination of the perineum"]
            answer: 0
            why: "Urethral catheterization is relatively contraindicated with suspected urethral injury (blood at the meatus)."
        page: 645
        quote: "Anterior urethral injury—perineal straddle injury → disruption of bulbar (spongy) urethra → scrotal hematoma."
      - kind: check
        question: "A driver's full bladder hits the seatbelt. Two days later BUN and creatinine are high. Where is the urine?"
        options:
          - "In the peritoneal cavity, from a dome rupture"
          - "In the retropubic space, from a neck injury"
          - "In the perineum, through torn Buck fascia"
          - "In the scrotum, from a bulbar urethral tear"
        answer: 0
        why:
          - "صح: dome rupture ← البول في الـ peritoneum ← يتمص ← BUN و creatinine يعلوا."
          - "الـ neck بيتخرم بكسر الحوض، والبول برّه الـ peritoneum."
          - "ده anterior urethral injury مع قطع الـ Buck fascia."
          - "ده straddle injury."
        page: 645
        quote: "intraperitoneal urine accumulation. Peritoneal absorption of urine → ↑ BUN, ↑ creatinine."
      - kind: try
        items: [repro.L02.021, repro.L02.025, repro.L02.029, repro.L02.031]
    recap:
      - "Vulva و vagina و ectocervix squamous، ومن الـ endocervix columnar، والـ tube ciliated، والـ ovary cuboidal."
      - "Pap من الـ transformation zone، أشهر مكان لسرطان الـ cervix."
      - "SEVEN UP: Seminiferous، Epididymis، Vas، Ejaculatory، Nothing، Urethra، Penis."
      - "Dome: مثانة مليانة ← intraperitoneal ← BUN يعلى. Neck: كسر حوض ← retropubic."
      - "Straddle ← bulbar urethra. Pelvic fracture ← bulbomembranous و high-riding prostate. ما فيش catheter."
    practice: [repro.L02.021, repro.L02.022, repro.L02.023, repro.L02.024, repro.L02.025, repro.L02.026, repro.L02.027, repro.L02.028, repro.L02.029, repro.L02.030, repro.L02.031, repro.L02.032]
  - id: repro.L02.lesson3
    title: "Point, squeeze, shoot، والـ Sertoli والـ Leydig"
    hook: "مين بيعمل الـ erection ومين بيعمل الـ ejaculation؟ وليه الخصية برّه الجسم أصلاً؟"
    minutes: 8
    pages: [645, 646]
    topics: [male-sexual-response-innervation, seminiferous-tubules]
    status: unverified
    steps:
      - kind: mnemonic
        word: "PSS"
        parts:
          - { key: "P", text: "Point: erection, Parasympathetic (pelvic splanchnic, S2-S4)" }
          - { key: "S", text: "Squeeze: emission, Sympathetic (hypogastric, T11-L2)" }
          - { key: "S", text: "Shoot: expulsion, Somatic and visceral (pudendal)" }
        hook: "الكتاب بيقولها: Point, squeeze, and shoot. و S2, 3, 4 keep the penis off the floor"
        page: 645
        quote: "Emission—sympathetic nervous system (hypogastric nerve, T11-L2). Expulsion—visceral and somatic nerves (pudendal nerve). Point, squeeze, and shoot. S2, 3, 4 keep the penis off the floor."
      - kind: explain
        title: "الـ erection كيميا"
        text: |-
          الـ parasympathetic بيطلّع ==NO== ← يزوّد **cGMP** ← العضلات الملسا ترتخي ← vasodilation ← الدم يملا الـ corpora.

          والـ **norepinephrine** عكسه: يزوّد الـ Ca2+ جوه الخلية ← العضلة تنقبض ← vasoconstriction ← antierectile.

          فهمت دي، تفهم الـ **sildenafil**: ==PDE-5 inhibitor== بيمنع تكسير الـ cGMP، فيفضل عالي.
        page: 645
        quote: "PDE-5 inhibitors (eg, sildenafil) → ↓ cGMP breakdown."
      - kind: figure
        title: "NO و cGMP"
        svg: |-
          <svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="rp2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="5" y="20" width="60" height="30" rx="6"/>
            <text x="25" y="40" class="t-sm t-b">NO</text>
            <rect class="fg-acc" x="90" y="20" width="70" height="30" rx="6"/>
            <text x="102" y="40" class="t-sm t-b">↑ cGMP</text>
            <rect class="fg-good" x="185" y="20" width="80" height="30" rx="6"/>
            <text x="192" y="40" class="t-sm">relaxation</text>
            <rect class="fg-good" x="285" y="20" width="70" height="30" rx="6"/>
            <text x="292" y="40" class="t-sm">erection</text>
            <line class="fg-arrow" x1="65" y1="35" x2="88" y2="35" marker-end="url(#rp2a)"/>
            <line class="fg-arrow" x1="160" y1="35" x2="183" y2="35" marker-end="url(#rp2a)"/>
            <line class="fg-arrow" x1="265" y1="35" x2="283" y2="35" marker-end="url(#rp2a)"/>
            <rect class="fg-bad" x="80" y="80" width="90" height="30" rx="6"/>
            <text x="88" y="100" class="t-sm">PDE-5 breaks</text>
            <line class="fg-arrow-bad" x1="125" y1="80" x2="125" y2="52"/>
            <text x="185" y="100" class="t-sm t-bad">sildenafil blocks PDE-5</text>
          </svg>
        caption: "الـ PDE-5 هو اللي بيكسّر الـ cGMP. الـ sildenafil بيوقّفه، فالـ cGMP يفضل عالي والـ erection يستمر."
        alt: "NO raises cGMP, which relaxes smooth muscle and causes erection. PDE-5 breaks down cGMP; sildenafil blocks PDE-5."
        page: 645
        quote: "NO → ↑ cGMP → smooth muscle relaxation → vasodilation → proerectile."
      - kind: check
        question: "After radical prostatectomy a man can't get an erection. Which nerves were most likely injured?"
