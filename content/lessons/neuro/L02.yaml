schema: steps.lesson/v1
lecture: neuro.L02
lessons:
  - id: neuro.L02.lesson1
    title: "الـ neuron وأصحابه: مين بيعمل إيه"
    hook: "كل خلية في الجهاز العصبي ليها شغلانة واحدة واضحة، ولو عرفتها هتعرف المرض اللي بيضربها"
    minutes: 10
    pages: [503, 505]
    topics: [cells-of-the-nervous-system, cns-glial-cells, pns-glial-cells, neuron-action-potential, sensory-receptors, peripheral-nerve, neuronal-response-to-axonal-injury]
    goals:
      - "تفرّق الـ glial cells وتربط كل واحدة بمرضها"
      - "تفهم الـ action potential بالبوابات"
      - "تعرف كل receptor بيحس بإيه"
      - "تعرف إيه اللي بيحصل لما الـ axon يتقطع"
    status: unverified
    steps:
      - kind: explain
        title: "الـ neuron و Nissl"
        text: |-
          الـ neuron خلية **permanent**: dendrites بتستقبل، cell body، و axon بيبعت.

          صبغة ==Nissl== بتصبغ الـ **RER**، والـ RER موجود في الـ cell body والـ dendrites بس، **مش في الـ axon**. فالـ axon ما بيبانش على Nissl.

          الـ markers: **neurofilament protein** و **synaptophysin**.
        page: 503
        quote: "Dendrites and cell bodies can be seen on Nissl staining (stains rough endoplasmic reticulum [RER]; not present in axons). Markers: neurofilament protein, synaptophysin."
      - kind: explain
        title: "الـ myelin بيخلّي الإشارة تنطّ"
        text: |-
          الـ myelin عازل كهربا ملفوف طبقات حوالين الـ axon. الإشارة بتنطّ من **node of Ranvier** للي بعدها (==saltatory conduction==)، والـ nodes دي مليانة **Na+ channels**. النتيجة: ↑ conduction velocity.
        page: 503
        quote: "→ ↑ conduction velocity of transmitted signals via saltatory conduction of action potentials at nodes of Ranvier (↑↑ Na+ channel density)."
      - kind: table
        title: "الـ glial cells"
        columns: ["Cell", "Job", "Clue / disease"]
        rows:
          - ["Astrocyte", "Support, repair, removes excess neurotransmitter, BBB, glycogen", "GFAP ⊕; most abundant; reactive gliosis"]
          - ["Oligodendrocyte", "Myelinates ~30 CNS axons (incl. CN II)", "Fried egg; MS, leukodystrophies, PML"]
          - ["Ependymal", "Lines ventricles; cilia move CSF, microvilli absorb", "Choroid plexus makes CSF"]
          - ["Microglia", "CNS phagocyte; releases NO, glutamate", "HIV: multinucleated giant cells"]
          - ["Schwann", "Myelinates 1 PNS axon (CN III-XII)", "S100 ⊕; Guillain-Barré"]
          - ["Satellite", "Surrounds cell bodies in ganglia", "Like astrocytes"]
        hide: [[0, 2], [1, 2], [4, 2]]
        page: 503
        quote: "Schwann cells Myelinate axons in PNS (including CN III-XII). S100 ⊕. Each myelinates a single axon (“Schwone”). Injured in Guillain-Barré syndrome."
      - kind: aside
        tone: tip
        text: "حيلتين من الكتاب: ==oleggodendrocytes== (شكلها بيضة مقلية، fried egg)، و **Schwone** (الـ Schwann بيلف على axon واحد بس، one). والـ CN II مش عصب طرفي حقيقي، ده امتداد للمخ، فبيتلف بـ oligodendrocytes، عشان كده الـ MS بيعمل optic neuritis."
        page: 503
        quote: "Oligodendrocytes Myelinate axons in CNS (including CN II). “Fried egg” appearance histologically (“oleggodendrocytes”)."
      - kind: check
        question: "A patient with ascending weakness after a diarrheal illness has demyelination of peripheral nerves. The injured cells are positive for which marker?"
        options:
          - "S100"
          - "GFAP"
          - "Synaptophysin"
          - "Neurofilament protein"
        answer: 0
        why:
          - "صح: Guillain-Barré بيضرب الـ Schwann cells، وهي S100 ⊕."
          - "GFAP بتاع الـ astrocytes في الـ CNS."
          - "Synaptophysin marker للـ neuron نفسه."
          - "Neurofilament برضه marker للـ neuron."
        page: 503
        quote: "Schwann cells Myelinate axons in PNS (including CN III-XII). S100 ⊕."
      - kind: figure
        title: "الـ action potential بالبوابات"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-thin" x1="30" y1="140" x2="350" y2="140"/>
            <text x="2" y="144" class="t-sm t-mut">-70</text>
            <line class="fg-thin" x1="30" y1="40" x2="350" y2="40"/>
            <text x="2" y="44" class="t-sm t-mut">+40</text>
            <path class="fg-arrow-acc" d="M30 140 L90 140 C 110 140, 115 40, 130 40 C 145 40, 160 160, 190 160 C 220 160, 240 140, 350 140"/>
            <circle class="fg-dot-acc" cx="70" cy="140" r="9"/>
            <text x="66" y="144" class="t-sm" fill="var(--surface)">1</text>
            <circle class="fg-dot-good" cx="112" cy="90" r="9"/>
            <text x="108" y="94" class="t-sm" fill="var(--surface)">2</text>
            <circle class="fg-dot-bad" cx="150" cy="90" r="9"/>
            <text x="146" y="94" class="t-sm" fill="var(--surface)">3</text>
            <circle class="fg-dot-acc" cx="190" cy="172" r="9"/>
            <text x="186" y="176" class="t-sm" fill="var(--surface)">4</text>
            <text x="210" y="62" class="t-sm">1 rest: K+ leak, gates shut</text>
            <text x="210" y="80" class="t-sm t-good">2 Na+ activation gate opens</text>
            <text x="210" y="98" class="t-sm t-bad">3 Na+ inactivation shuts;</text>
            <text x="222" y="114" class="t-sm t-bad">K+ gate opens</text>
            <text x="210" y="190" class="t-sm">4 slow K+ gates: undershoot</text>
          </svg>
        caption: "1 في الراحة الغشا بيعدّي K+ أكتر من Na+. 2 بوابة الـ Na+ activation تفتح فالـ Na+ يدخل. 3 عند القمة بوابة الـ inactivation تقفل والـ K+ يخرج. 4 بوابات الـ K+ بطيئة تقفل فيحصل hyperpolarization، والـ Na+/K+ pump يرجّع الأيونات."
        alt: "Action potential curve from about -70 to +40 mV and back with an undershoot. Numbered points: 1 resting with K+ leak, 2 Na+ activation gate opens on the upstroke, 3 Na+ inactivation gate closes at the peak and K+ gate opens, 4 slow K+ gates cause hyperpolarization."
        page: 504
        quote: "Membrane depolarization: Na+ activation gate opens → Na+ flows inward."
      - kind: reveal
        prompt: "ليه بيحصل undershoot (hyperpolarization) بعد كل action potential؟"
        answer: "لأن بوابات الـ **K+ activation** بطيئة تقفل، فالـ K+ يفضل خارج شوية زيادة عن اللزوم ← الغشا ينزل تحت الـ resting لحظة."
        page: 504
        quote: "Membrane hyperpolarization: K+ activation gates are slow to close → excess K+ efflux and brief period of hyperpolarization."
      - kind: match
        prompt: "وصّل كل receptor باللي بيحس بيه"
        pairs:
          - ["Free nerve endings", "Pain, temperature"]
          - ["Meissner corpuscles", "Light touch, low-frequency vibration"]
          - ["Pacinian corpuscles", "High-frequency vibration, pressure"]
          - ["Merkel discs", "Sustained pressure, texture, shape"]
          - ["Ruffini corpuscles", "Stretch, joint angle"]
        why: "Pacinian = **p**ressure cooker (ضغط واهتزاز سريع). الـ Meissner و Pacinian بيـ adapt بسرعة (بيحسوا بالتغيير)، والـ Merkel و Ruffini بيـ adapt ببطء (بيحسوا بالحاجة الثابتة). والـ free nerve endings: Aδ سريعة (A Delta plane is fast) و C بطيئة (taxC is slow)."
        page: 504
        quote: "Pacinian corpuscles Large, myelinated fibers; adapt quickly Deep skin layers, ligaments, joints High-frequency vibration, pressure (pressure cooker)"
      - kind: explain
        title: "أغلفة العصب الطرفي"
        text: |-
          - **Endoneurium** (endo = جوه): حوالين كل fiber لوحدها. ممكن يتأثر في Guillain-Barré.
          - ==Perineurium== (peri = حوالين): حوالين الـ fascicle، وده الـ **blood-nerve barrier**.
          - **Epineurium** (epi = بره): حوالين العصب كله والأوعية.
        page: 505
        quote: "Perineurium (blood-nerve permeability barrier)—surrounds a fascicle of nerve fibers. Epineurium—dense connective tissue that surrounds entire nerve (fascicles and blood vessels)."
      - kind: explain
        title: "لما الـ axon يتقطع"
        text: |-
          3 حاجات بتحصل في نفس الوقت:
          - **Chromatolysis** في الـ cell body: الـ Nissl بيتفرّق، الخلية تنفخ، والـ nucleus يروح على الجنب. ده لأن الخلية بتشتغل ==↑ protein synthesis== عشان تصلّح.
          - **Axonal retraction** في الجزء القريب: بيطلّع براعم تدوّر على neurons. في الـ PNS الـ Schwann cells بتعمل له «سكة» يمشي فيها.
          - ==Wallerian degeneration== في الجزء البعيد: الـ axon والـ myelin يتفككوا والـ macrophages تنضّف. في الـ CNS الـ myelin debris والـ gliosis بيمنعوا الرجوع.
        page: 505
        quote: "Wallerian degeneration—distal axon segment and associated myelin sheath disintegrates with macrophages removing debris. In CNS, persistence of myelin debris and reactive gliosis prevent axonal regeneration."
      - kind: check
        question: "Ten days after a median nerve is cut, what do its motor neuron cell bodies show?"
        options:
          - "Swelling, dispersed Nissl substance, peripheral nucleus"
          - "Shrunken red neurons with pyknosis"
          - "Lewy bodies"
          - "Myelin breakdown cleared by macrophages"
        answer: 0
        why:
          - "صح: chromatolysis، الخلية بتصنع بروتين عشان تصلّح."
          - "ده شكل الـ ischemic injury، مش رد الفعل على قطع الـ axon."
          - "Lewy bodies في Parkinson."
          - "ده Wallerian degeneration، بيحصل في الـ distal axon مش في الـ cell body."
        page: 505
        quote: "Accompanied by round cellular swelling and displacement of nucleus to periphery."
      - kind: try
        items: [neuro.L02.014, neuro.L02.017, neuro.L02.021, neuro.L02.027, neuro.L02.031]
    recap:
      - "Nissl = RER: في الـ cell body والـ dendrites، مش الـ axon."
      - "Astrocyte GFAP، oligodendrocyte fried egg و ~30 axon (MS)، Schwann S100 وواحد (GBS)."
      - "Na+ activation يفتح ← Na+ inactivation يقفل و K+ يفتح ← K+ بطيء ← undershoot."
      - "Pacinian = اهتزاز سريع وضغط؛ Meissner = لمس خفيف."
      - "Perineurium = blood-nerve barrier."
      - "Chromatolysis في الـ cell body، Wallerian في الـ distal axon."
    practice: [neuro.L02.001, neuro.L02.002, neuro.L02.003, neuro.L02.004, neuro.L02.005, neuro.L02.006, neuro.L02.007, neuro.L02.008, neuro.L02.009, neuro.L02.010, neuro.L02.011, neuro.L02.012, neuro.L02.013, neuro.L02.014, neuro.L02.015, neuro.L02.016, neuro.L02.017, neuro.L02.018, neuro.L02.019, neuro.L02.020, neuro.L02.021, neuro.L02.022, neuro.L02.023, neuro.L02.024, neuro.L02.025, neuro.L02.026, neuro.L02.027, neuro.L02.028, neuro.L02.029, neuro.L02.030, neuro.L02.031, neuro.L02.032]
  - id: neuro.L02.lesson2
    title: "الكيميا والأغشية والبوابات: neurotransmitters و BBB والترجيع"
    hook: "ليه مريض الكيماوي بياخد ondansetron ومريض دوار البحر بياخد antihistamine؟ الإجابة في 5 receptors"
    minutes: 9
    pages: [505, 506]
    topics: [neurotransmitter-changes-with-disease, meninges, blood-brain-barrier, vomiting-center]
    goals:
      - "تعرف كل neurotransmitter بيتعمل فين"
      - "تحفظ تغيّرات الـ neurotransmitters في كل مرض بمنطق"
      - "ترتّب الـ meninges والمسافات"
      - "تختار الـ antiemetic الصح لكل سبب"
    status: unverified
    steps:
      - kind: table
        title: "كل neurotransmitter بيتعمل فين"
        columns: ["Neurotransmitter", "Made in"]
        rows:
          - ["Acetylcholine", "Basal nucleus of Meynert (forebrain)"]
          - ["Dopamine", "Ventral tegmentum, SNc (midbrain)"]
          - ["GABA", "Widespread (cortex, cerebellum, basal ganglia)"]
          - ["Histamine", "Tuberomammillary nucleus (posterior hypothalamus)"]
          - ["Norepinephrine", "Locus ceruleus (pons)"]
          - ["Serotonin", "Raphe nuclei (brainstem)"]
        hide: [[0, 1], [1, 1], [4, 1], [5, 1]]
        page: 505
        quote: "Histamine Tuberomammillary nucleus (posterior hypothalamus)"
      - kind: explain
        title: "التغيّرات في الأمراض بمنطق"
        text: |-
          - **Alzheimer**: ==↓ ACh== (عشان كده العلاج acetylcholinesterase inhibitors) و ↓ histamine.
          - **Parkinson**: ==↓ dopamine== (الـ SNc مات) و ↓ serotonin، والـ ACh يبان ↑ نسبياً (عشان كده الـ antimuscarinics بتفيد في الرعشة).
          - **Huntington**: ↑ dopamine و ↑ histamine، و ↓ ACh و ↓ GABA (الـ striatum بيموت).
          - **Schizophrenia**: ↑ dopamine و ↑ histamine.
          - **Depression**: ↓ dopamine و NE و serotonin.
          - **Anxiety**: ↑ NE، و ↓ GABA و ↓ serotonin.
        page: 505
        quote: "Acetylcholine Basal nucleus of Meynert (forebrain)"
      - kind: sort
        prompt: "حط كل تغيير في المرض بتاعه"
        bins: ["Parkinson", "Huntington", "Alzheimer"]
        cards:
          - { text: "↓ dopamine, ↑ ACh", bin: 0 }
          - { text: "↓ serotonin with ↓ dopamine", bin: 0 }
          - { text: "↓ GABA, ↑ dopamine", bin: 1 }
          - { text: "↓ ACh with ↓ GABA", bin: 1 }
          - { text: "↓ ACh, ↓ histamine", bin: 2 }
        why: "Parkinson و Huntington عكس بعض في الـ dopamine (حركة قليلة × حركة زيادة). والـ ↓ ACh موجود في Alzheimer و Huntington، بس Huntington معاه ↓ GABA."
        page: 505
        quote: "Dopamine Ventral tegmentum, SNc (midbrain)"
      - kind: figure
        title: "الـ meninges من بره لجوه"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-ink" x="10" y="10" width="340" height="26" rx="4"/>
            <text x="20" y="28" class="t-sm t-b">Skull</text>
            <rect class="fg-thin" x="10" y="38" width="340" height="18"/>
            <text x="20" y="51" class="t-sm t-bad">Epidural space (potential): middle meningeal a.</text>
            <rect class="fg-acc" x="10" y="58" width="340" height="22"/>
            <text x="20" y="74" class="t-sm">Dura mater</text>
            <rect class="fg-box" x="10" y="82" width="340" height="18"/>
            <text x="20" y="95" class="t-sm">Arachnoid mater</text>
            <rect class="fg-good" x="10" y="102" width="340" height="30"/>
            <text x="20" y="121" class="t-sm t-good">Subarachnoid space: CSF</text>
            <rect class="fg-box" x="10" y="134" width="340" height="12"/>
            <text x="20" y="144" class="t-sm">Pia mater</text>
            <rect class="fg-box" x="10" y="148" width="340" height="44" rx="4"/>
            <text x="20" y="174" class="t-sm t-b">Brain</text>
          </svg>
        caption: "من بره لجوه: skull ← epidural space (مكان نزيف الـ middle meningeal artery) ← dura ← arachnoid ← subarachnoid space (فيه الـ CSF) ← pia اللي لازقة في المخ."
        alt: "Layered diagram from top to bottom: skull, epidural potential space with middle meningeal artery, dura mater, arachnoid mater, subarachnoid space containing CSF, pia mater, brain."
        page: 506
        quote: "Epidural space—potential space between dura mater and skull/vertebral column containing fat and blood vessels. Site of blood collection associated with middle meningeal artery injury."
      - kind: explain
        title: "الـ BBB: 4 حراس"
        text: |-
          الـ BBB بيمنع البكتيريا والأدوية توصل للـ CNS. بيتعمل من 4:
          - **tight junctions** بين endothelium من غير fenestrations
          - **basement membrane**
          - **pericytes**
          - ==astrocyte foot processes==

          الـ glucose والـ amino acids بيعدّوا ببطء بـ carriers، والحاجات الـ ==lipid-soluble== بتعدّي بسرعة بالـ diffusion.
        page: 506
        quote: "Tight junctions between nonfenestrated capillary endothelial cells ▘ Basement membrane ▘ Pericytes ▘ Astrocyte foot processes"
      - kind: explain
        title: "أماكن من غير BBB، بقصد"
        text: |-
          الـ **circumventricular organs** فيها capillaries fenestrated عشان المخ «يحس» بالدم أو يرمي فيه هرمونات:
          - ==area postrema==: الترجيع بعد الكيماوي.
          - **OVLT**: osmoreceptors.
          - **neurohypophysis**: إفراز ADH.

          ولو الـ BBB باظ (stroke) ← **vasogenic edema**. والـ mannitol ممكن يفتحه فيدخّل أدوية أكتر.
        page: 506
        quote: "(eg, area postrema—vomiting after chemotherapy; OVLT [organum vasculosum of the lamina terminalis]—osmoreceptors) or neurosecretory products to enter circulation (eg, neurohypophysis—ADH release)."
      - kind: explain
        title: "مركز الترجيع"
        text: |-
          الـ ==NTS== في الـ medulla هو المنسّق. بيجيله كلام من 4: الـ **CTZ** (جوه الـ area postrema، «puke»-strema)، والـ GI tract عن طريق الـ vagus، والـ vestibular system، والـ CNS.

          وبيستقبل من 5 receptors: **H1، M1، NK-1، D2، 5-HT3**.
        page: 506
        quote: "Coordinated by NTS in the medulla, which receives information from the chemoreceptor trigger zone (CTZ, located within area postrema (pronounce “puke”-strema) at the base of the 4th ventricle), GI tract (via vagus nerve), vestibular system, and CNS."
      - kind: reveal
        prompt: "ليه دوار البحر بيتعالج بـ H1 و M1 blockers، والكيماوي بـ 5-HT3 و D2 و NK-1؟"
        answer: "لأن دوار الحركة جاي من الـ **vestibular system**، وده بيكلّم المركز بـ H1 و M1. أما الكيماوي فبيضرب الـ **CTZ** (من غير BBB) والـ GI tract، ودول بيشتغلوا بـ ==D2 و 5-HT3 و NK-1==. والـ H1 antagonists كمان بتعالج hyperemesis gravidarum."
        page: 506
        quote: "5-HT3 , D2 , and NK-1 antagonists treat chemotherapy-induced vomiting. ▘ H1 and M1 antagonists treat motion sickness; H1 antagonists treat hyperemesis gravidarum."
      - kind: check
        question: "A woman wants something for nausea on a boat trip. Block which receptors?"
        options:
          - "H1 and M1"
          - "5-HT3 and NK-1"
          - "D2 and 5-HT3"
          - "NK-1 only"
        answer: 0
        why:
          - "صح: motion sickness = H1 و M1 antagonists."
          - "دول للكيماوي."
          - "دول للكيماوي برضه."
          - "الـ NK-1 للكيماوي."
        page: 506
        quote: "H1 and M1 antagonists treat motion sickness; H1 antagonists treat hyperemesis gravidarum."
      - kind: try
        items: [neuro.L02.033, neuro.L02.034, neuro.L02.040, neuro.L02.042, neuro.L02.047]
    recap:
      - "ACh: Meynert. DA: VTA و SNc. NE: locus ceruleus. 5-HT: raphe. Histamine: tuberomammillary."
      - "Parkinson ↓ DA؛ Huntington ↑ DA و ↓ GABA/ACh؛ Alzheimer ↓ ACh."
      - "Epidural = بين الـ dura والعظم (middle meningeal)؛ الـ CSF في الـ subarachnoid."
      - "BBB = tight junctions + basement membrane + pericytes + astrocyte feet."
      - "Area postrema و OVLT و neurohypophysis من غير BBB."
      - "كيماوي: 5-HT3 و D2 و NK-1. دوار حركة: H1 و M1."
    practice: [neuro.L02.033, neuro.L02.034, neuro.L02.035, neuro.L02.036, neuro.L02.037, neuro.L02.038, neuro.L02.039, neuro.L02.040, neuro.L02.041, neuro.L02.042, neuro.L02.043, neuro.L02.044, neuro.L02.045, neuro.L02.046, neuro.L02.047, neuro.L02.048]
  - id: neuro.L02.lesson3
    title: "النوم، والـ hypothalamus، والـ thalamus"
    hook: "BATS Drink Blood و TAN HATS و SAD POX: 3 حيل تشيل صفحتين"
    minutes: 10
    pages: [507, 508]
    topics: [sleep-physiology, rem-sleep-behavior-disorder, factors-affecting-sleep-architecture, hypothalamus, thalamus]
    goals:
      - "ترتّب مراحل النوم وموجاتها وإيه اللي بيحصل في كل واحدة"
      - "تعرف إيه اللي بيغيّر شكل النوم"
      - "تربط كل nucleus في الـ hypothalamus بشغلته"
      - "تعرف كل nucleus في الـ thalamus بيوصّل إيه لفين"
    status: unverified
    steps:
      - kind: explain
        title: "الساعة البيولوجية"
        text: |-
          النوم 4-6 دورات كل واحدة حوالي ==90 دقيقة==، والـ REM بيطول كل ما الليل يعدّي.

          المتحكم: الـ **suprachiasmatic nucleus**. الضلمة ← الـ nucleus ده يهدى ← NE من الـ superior cervical ganglion يزيد ← ==melatonin== من الـ pineal gland يزيد.
        page: 507
        quote: "Sleep occurs in 4-6 cycles per night, each lasting ~90 mins and consisting of 2 main stages"
      - kind: table
        title: "مراحل النوم"
        columns: ["Stage", "EEG", "What happens"]
        rows:
          - ["Awake", "Beta (eyes open), alpha (eyes closed)", "Alert"]
          - ["N1 (5%)", "Theta", "Light sleep"]
          - ["N2 (45%)", "Sleep spindles, K complexes", "Bruxism"]
          - ["N3 (25%)", "Delta", "Bedwetting, sleepwalking, night terrors"]
          - ["REM (25%)", "Beta", "Dreams, nightmares, tumescence; atonia except diaphragm and eye muscles"]
        hide: [[1, 1], [2, 1], [3, 1], [2, 2], [3, 2], [4, 2]]
        page: 507
        quote: "Stage N3 (25%) Deepest NREM sleep (slow-wave sleep); delta waves (lowest frequency, highest amplitude). When bedwetting, sleepwalking, and night terrors occur (wee and flee in N3)."
      - kind: mnemonic
        word: "BATSDB"
        parts:
          - { key: "B", text: "Beta: awake, eyes open" }
          - { key: "A", text: "Alpha: awake, eyes closed" }
          - { key: "T", text: "Theta: N1" }
          - { key: "S", text: "Spindles (and K complexes): N2" }
          - { key: "D", text: "Delta: N3" }
          - { key: "B", text: "Beta again: REM" }
        hook: "At night, BATS Drink Blood (حيلة الكتاب)"
        page: 507
        quote: "EEG waveforms: Beta, Alpha, Theta, Sleep spindle, Delta, Beta. At night, BATS Drink Blood."
      - kind: aside
        tone: tip
        text: "حيل الكتاب: «**twoth** grinding in N2» (bruxism)، و ==wee and flee in N3== (التبول وال sleepwalking والـ night terrors)، و «**REM**ember dreams». والـ REM فيه EEG شبه الصاحي (beta) بس الجسم مشلول، ما عدا الـ diaphragm (عشان تتنفس) وعضلات العين (rapid eye movement)."
        page: 507
        quote: "REM sleep (25%) Loss of muscle tone (atonia) except in diaphragm and extraocular muscles"
      - kind: explain
        title: "لما الـ atonia تروح، وحاجات بتغيّر النوم"
        text: |-
          **REM sleep behavior disorder**: الـ atonia بتروح فالمريض يمثّل حلمه (غالباً بعنف) ويتكلم. أشهر حاجة معاه: ==Lewy body dementia و Parkinson==.

          - Alcohol و benzodiazepines و barbiturates: ↓ N3 و ↓ REM (عشان كده الـ benzos بتفيد في الـ sleepwalking والـ night terrors).
          - السن: ↓ N3 و REM، والنوم بياخد وقت أطول، وصحيان بدري.
          - ==Depression==: ↓ N3، ↑ REM، ↓ REM latency، صحيان متكرر وبدري (terminal insomnia).
          - Narcolepsy: ↓ REM latency.
        page: 507
        quote: "Loss of atonia leading to dream enactment (often violent) and vocalization. Most commonly associated with Lewy body dementia and Parkinson disease."
      - kind: check
        question: "A 6-year-old wakes screaming 1 hour after sleep onset, inconsolable, with no memory next morning. Which stage?"
        options:
          - "N3"
          - "N2"
          - "REM"
          - "N1"
        answer: 0
        why:
          - "صح: night terrors في N3 (wee and flee)."
          - "N2 بتاع الـ bruxism."
          - "الـ REM فيه nightmares وبتتفكّر."
          - "N1 نوم خفيف theta."
        page: 507
        quote: "When bedwetting, sleepwalking, and night terrors occur (wee and flee in N3)."
      - kind: explain
        title: "الـ hypothalamus: TAN HATS"
        text: |-
          بيحافظ على الـ homeostasis: **T**hirst، **A**denohypophysis، **N**eurohypophysis، **H**unger، **A**utonomic، **T**emperature، **S**exual urges.

          وبياخد معلومات من أماكن من غير BBB: الـ **OVLT** (osmolarity) والـ **area postrema** (emetics).
        page: 508
        quote: "Inputs (areas not protected by blood-brain barrier): OVLT (senses change in osmolarity), area postrema (found in dorsal medulla, responds to emetics)."
      - kind: table
        title: "الـ hypothalamic nuclei"
        columns: ["Nucleus", "Job", "Trick"]
        rows:
          - ["Lateral", "Hunger (ghrelin +, leptin −)", "Injury makes you lean"]
          - ["Ventromedial", "Satiety (leptin +)", "Injury makes you very massive"]
          - ["Anterior", "Cooling, parasympathetic", "A/C"]
          - ["Posterior", "Heating, sympathetic", "Hot pot"]
          - ["Suprachiasmatic", "Circadian rhythm", "Sun-Censing Nucleus"]
          - ["Supraoptic / paraventricular", "ADH / oxytocin", "SAD POX"]
          - ["Preoptic", "Thermoregulation, sex; GnRH", "Kallmann if neurons fail to migrate"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [5, 1]]
        page: 508
        quote: "Lateral nucleus Hunger. Stimulated by ghrelin, inhibited by leptin. Lateral injury makes you lean."
      - kind: case
        stem: "A 9-year-old boy has headaches, bitemporal field loss and has gained 12 kg in 6 months from constant eating. MRI: calcified suprasellar mass."
        steps:
          - question: "Which nucleus is destroyed?"
            options: ["Ventromedial", "Lateral", "Suprachiasmatic", "Anterior"]
            answer: 0
            why: "الـ ventromedial = satiety؛ لو اتدمر (craniopharyngioma) ← hyperphagia. الـ lateral لو اتدمر ← anorexia."
          - question: "If the tumor also destroys the supraoptic nucleus, what follows?"
            options: ["Central diabetes insipidus", "Hyperthermia", "Kallmann syndrome", "Loss of circadian rhythm"]
            answer: 0
            why: "الـ supraoptic بيعمل ADH (SAD POX)، ولو اتدمر ← central DI."
        page: 508
        quote: "Ventromedial nucleus Satiety. Stimulated by leptin. Ventromedial injury makes you very massive. Destruction (eg, craniopharyngioma) → hyperphagia."
      - kind: figure
        title: "الـ thalamus: محطة ترحيل"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="130" y="10" width="100" height="190" rx="14"/>
            <text x="150" y="30" class="t-sm t-b">Thalamus</text>
            <text x="150" y="58" class="t-sm">VPL</text>
            <text x="150" y="92" class="t-sm">VPM</text>
            <text x="150" y="126" class="t-sm">LGN</text>
            <text x="150" y="160" class="t-sm">Med. genic.</text>
            <text x="150" y="190" class="t-sm">VA / VL</text>
            <text x="4" y="58" class="t-sm">Body touch, pain</text>
            <text x="4" y="92" class="t-sm">Face, taste</text>
            <text x="4" y="126" class="t-sm">CN II, optic tract</text>
            <text x="4" y="160" class="t-sm">Inferior colliculus</text>
            <text x="4" y="190" class="t-sm">Basal ganglia, cbm</text>
            <text x="250" y="58" class="t-sm">Parietal S1</text>
            <text x="250" y="92" class="t-sm">Parietal S1</text>
            <text x="250" y="126" class="t-sm">Occipital V1</text>
            <text x="250" y="160" class="t-sm">Temporal A1</text>
            <text x="250" y="190" class="t-sm">Frontal motor</text>
          </svg>
        caption: "كل الإحساس الطالع بيعدّي على الـ thalamus ما عدا الشم. VPL للجسم، VPM للوش والطعم (Very Pretty Makeup on the face)، LGN للنظر (Lateral = light)، الـ medial geniculate للسمع (Medial = music)، و VA/VL للحركة."
        alt: "Diagram of the thalamus with five nuclei. VPL relays body sensation to the parietal somatosensory cortex; VPM relays face sensation and taste to the same cortex; LGN relays vision to the occipital visual cortex; the medial geniculate nucleus relays hearing to the temporal auditory cortex; VA and VL relay basal ganglia and cerebellar input to frontal motor cortices."
        page: 508
        quote: "Major relay for all ascending sensory information except olfaction."
      - kind: check
        question: "A lacunar infarct causes left face numbness and loss of taste on the left tongue, with normal limbs. Which nucleus?"
        options:
          - "VPM"
          - "VPL"
          - "LGN"
          - "Medial geniculate nucleus"
        answer: 0
        why:
          - "صح: الـ VPM بياخد الـ trigeminal والطعم."
          - "الـ VPL للجسم، والأطراف سليمة."
          - "الـ LGN للنظر."
          - "الـ medial geniculate للسمع."
        page: 508
        quote: "Ventral postero- medial nucleus Trigeminal and gustatory pathway Face sensation, taste"
      - kind: try
        items: [neuro.L02.051, neuro.L02.057, neuro.L02.062, neuro.L02.064, neuro.L02.069]
    recap:
      - "Suprachiasmatic nucleus ← ضلمة ← NE ← melatonin."
      - "Beta ← Alpha ← Theta (N1) ← Spindles (N2) ← Delta (N3) ← Beta (REM)."
      - "N3: wee and flee. REM: أحلام و atonia ما عدا الـ diaphragm والعين."
      - "RBD ← Parkinson و Lewy body. Depression ← ↑ REM و ↓ REM latency."
      - "Lateral = جوع، ventromedial = شبع، anterior = تبريد، posterior = تسخين، SAD POX."
      - "Thalamus بيوصّل كل حاجة ما عدا الشم؛ VPM = وش وطعم."
