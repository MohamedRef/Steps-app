      - kind: explain
        title: "الـ primitive reflexes"
        text: |-
          موجودة في الرضيع وبتختفي في السنة الأولى لأن الـ ==frontal lobe== بيكبر ويمنعها. لو رجعت في الكبير ← lesion في الـ frontal lobe.

          Moro (فتح وضم الدراعين لما يتخض)، rooting، sucking، palmar، plantar، و Galant.

          والـ plantar لو موجود في كبير = ==Babinski sign== ← ممكن UMN lesion.
        page: 523
        quote: "Primitive CNS reflexes present in healthy infants which disappear within 1st year of life due to inhibition from developing frontal lobe. Absent in neurologically intact adult. May reemerge in adults with frontal lobe lesions → loss of inhibition."
