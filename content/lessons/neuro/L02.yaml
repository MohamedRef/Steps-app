        title: "4 + 4 + 4"
        text: |-
          - فوق الـ pons (من الـ midbrain وفوقه): ==I، II، III، IV==.
          - من الـ pons: **V، VI، VII، VIII**.
          - من الـ medulla: **IX، X، XI، XII**.
          - الـ nuclei الـ medial (motor): ==III، IV، VI، XII== = «factors of 12, except 1 and 2».

          والـ CN IV هو الوحيد اللي بيطلع من **الضهر** ويعدّي للناحية التانية على طول.
        page: 515
        quote: "4 CN exit above pons (I, II, III, IV). 4 CN exit the pons (V, VI, VII, VIII). 4 CN exit the medulla (IX, X, XI, XII). 4 CN nuclei are medial (III, IV, VI, XII). “Factors of 12, except 1 and 2.”"
      - kind: explain
        title: "الـ nuclei: sensory بره و motor جوه"
        text: |-
          الـ nuclei في الـ tegmentum. زي الحبل الشوكي بالظبط: الـ ==lateral = sensory (alar plate)== والـ **medial = motor (basal plate)**، وبينهم الـ sulcus limitans.

          وفوق الـ brainstem من ورا: الـ **pineal gland** (melatonin)، الـ **superior colliculi** (نظر)، والـ **inferior colliculi** (سمع): eyes above ears.
        page: 516
        quote: "Lateral nuclei = sensory (alar plate). —Sulcus limitans— Medial nuclei = motor (basal plate)."
      - kind: explain
        title: "3 مقاطع لازم تعرفها"
        text: |-
          الكتاب بيرسم 3 مقاطع، وكل واحد ليه علامة:
          - **Midbrain**: الـ cerebral aqueduct، الـ superior colliculus، الـ ==CN III nucleus== وأليافه، الـ red nucleus، الـ substantia nigra، والـ cerebral peduncle.
          - **Pons**: الـ fourth ventricle، الـ ==locus ceruleus==، الـ superior و middle cerebellar peduncles، الـ MLF، والـ corticospinal tracts، و CN V.
          - **Medulla**: الـ CN XII nucleus، الـ dorsal motor nucleus، الـ NTS، الـ nucleus ambiguus، الـ inferior olivary nucleus، والـ pyramid.
        page: 517
        quote: "Pons Medial lemniscus Locus ceruleus Superior cerebellar peduncle Fourth ventricle Medial longitudinal fasciculus Middle cerebellar peduncle Corticospinal and corticobulbar tracts CN V"
