        caption: "الرجل والقدم على الوش الـ medial من النص (بين الـ hemispheres) وده بتاع الـ anterior cerebral artery. الدراع والإيد والوش على الوش الـ lateral، وده بتاع الـ middle cerebral. والـ posterior cerebral للسطح الخلفي والسفلي (النظر)."
        alt: "Coronal sketch of one hemisphere. The leg and foot area on the medial surface is shaded for the anterior cerebral artery. Arm, hand and face areas on the lateral surface are shaded for the middle cerebral artery. Posterior cerebral artery noted for occipital surface."
        page: 513
        quote: "Anterior cerebral artery (supplies anteromedial surface) Middle cerebral artery (supplies lateral surface) Posterior cerebral artery (supplies posterior and inferior surfaces)"
      - kind: check
        question: "Sudden weakness and numbness of the right leg only. Which artery?"
        options:
          - "Left anterior cerebral"
          - "Left middle cerebral"
          - "Right anterior cerebral"
          - "Left posterior cerebral"
        answer: 0
        why:
          - "صح: منطقة الرجل medial، بتاعة الـ anterior cerebral، في الناحية العكسية."
          - "الـ middle cerebral للوش والدراع."
          - "الإحساس والحركة متعاكسين: رجل يمين = مخ شمال."
          - "الـ posterior cerebral للنظر."
        page: 513
        quote: "Anterior cerebral artery (supplies anteromedial surface)"
      - kind: explain
        title: "الـ watershed: آخر الحنفية"
        text: |-
          الـ border zones بين territory شريانين هي آخر حتة بيوصلها الدم، فلما الضغط يقع كله (cardiac arrest، shock) هي اللي بتموت الأول:
          - بين الـ anterior والـ middle cerebral ← ضعف الـ proximal في الدراعين والرجلين سليمة: ==man-in-a-barrel==.
          - بين الـ posterior والـ middle cerebral ← مشاكل نظر «عالية المستوى».

          وكمان أماكن شائعة للـ brain metastases.
        page: 513
        quote: "ACA-MCA watershed infarct—proximal upper extremity weakness sparing the lower extremities (“man-in-a-barrel syndrome”). ▘ PCA-MCA watershed infarct—higher-order visual dysfunction."
      - kind: explain
        title: "الـ circle of Willis والـ sinuses"
        text: |-
          الـ **circle of Willis** بيربط الـ anterior circulation (ICA و middle و anterior cerebral) بالـ posterior (vertebral ← basilar ← posterior cerebral)، فلو شريان اتسد الدم يلف من الناحية التانية.

          الـ ==dural venous sinuses==: قنوات بين طبقتين الـ dura، بتصرّف الـ cerebral veins، وبتستقبل الـ CSF من الـ arachnoid granulations (أساساً في الـ **superior sagittal sinus**)، وبتصبّ في الـ internal jugular vein.
        page: 514
        quote: "Large venous channels A that run through the periosteal and meningeal layers of the dura mater. Drain blood from cerebral veins (arrow) and receive CSF from arachnoid granulations. Empty into internal jugular vein."
      - kind: aside
        tone: exam
        text: "ست حامل أو بتاخد ==OCP== أو عندها factor V Leiden، وجالها صداع بيزيد، seizure، و papilledema؟ فكّر في **venous sinus thrombosis**. ممكن تعمل venous hemorrhage كمان."
        page: 514
        quote: "papilledema, focal neurologic deficits). May lead to venous hemorrhage. Associated with hypercoagulable states (eg, pregnancy, OCP use, factor V Leiden)."
      - kind: order
