          - "Subarachnoid space"
        why: "الـ choroid plexus بيعمل الـ CSF في الـ ventricles، وبعد الـ subarachnoid space بيتشرب في الـ arachnoid granulations للـ dural sinuses. Luschka = **L**ateral، Magendie = **M**edial."
        page: 515
        quote: "travels from lateral ventricle ➊  3rd ventricle ➌ via interventricular foramina of Monro ➋  4th ventricle ➎ via cerebral aqueduct of Sylvius ➍  subarachnoid space via the foramina of Luschka (lateral) and Magendie (medial) ➏."
      - kind: check
