  - id: neuro.L02.lesson4
    title: "الحركة: limbic و dopamine و cerebellum و basal ganglia"
    hook: "ليه الـ haloperidol بيعمل لبن في الصدر ورعشة؟ وليه Parkinson عكس Huntington بالظبط؟"
    minutes: 10
    pages: [509, 511]
    topics: [limbic-system, dopaminergic-pathways, cerebellum, basal-ganglia]
    goals:
      - "تعرف مكونات الـ limbic system"
      - "تربط كل dopamine pathway بأعراضه ومضاعفات الـ antipsychotics"
      - "تفرّق الـ medial من الـ lateral cerebellum"
      - "ترسم الـ direct والـ indirect pathway وتطلّع منها Parkinson و Huntington"
    status: unverified
    steps:
      - kind: explain
        title: "الـ limbic system: الـ 5 F's"
        text: |-
          مجموعة تراكيب مسؤولة عن العواطف، الذاكرة طويلة المدى، الشم، السلوك، والـ ANS.

          مكوناته: ==hippocampus==، amygdalae، **mammillary bodies**، anterior thalamic nuclei، cingulate gyrus، entorhinal cortex.

          وشغلته بالمختصر: feeding و fleeing و fighting و feeling و sex: ==the famous 5 F's==.
        page: 509
        quote: "Consists of hippocampus (red arrows in A ), amygdalae, mammillary bodies, anterior thalamic nuclei, cingulate gyrus (yellow arrows in A ), entorhinal cortex. Responsible for feeding, fleeing, fighting, feeling, and sex."
      - kind: figure
        title: "الـ 4 dopamine pathways"
        svg: |-
          <svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL02b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nL02c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-acc" x="8" y="80" width="80" height="34" rx="8"/>
            <text x="14" y="102" class="t-sm t-b">VTA</text>
            <rect class="fg-bad" x="8" y="140" width="80" height="34" rx="8"/>
            <text x="14" y="162" class="t-sm t-b">S. nigra</text>
            <rect class="fg-good" x="8" y="20" width="80" height="34" rx="8"/>
            <text x="14" y="42" class="t-sm t-b">Hypothal.</text>
            <line class="fg-arrow-acc" x1="90" y1="88" x2="200" y2="62" marker-end="url(#nL02b)"/>
            <text x="204" y="60" class="t-sm">Prefrontal: mesocortical</text>
            <text x="204" y="74" class="t-sm t-mut">↓ = negative symptoms</text>
            <line class="fg-arrow-acc" x1="90" y1="104" x2="200" y2="108" marker-end="url(#nL02b)"/>
            <text x="204" y="106" class="t-sm">N. accumbens: mesolimbic</text>
            <text x="204" y="120" class="t-sm t-mut">↑ = positive symptoms</text>
            <line class="fg-arrow-bad" x1="90" y1="157" x2="200" y2="157" marker-end="url(#nL02c)"/>
            <text x="204" y="153" class="t-sm">Dorsal striatum: nigrostriatal</text>
            <text x="204" y="167" class="t-sm t-mut">↓ = extrapyramidal</text>
            <line class="fg-arrow-acc" x1="90" y1="37" x2="110" y2="37" marker-end="url(#nL02b)"/>
            <text x="114" y="16" class="t-sm">Pituitary: tuberoinfundibular</text>
            <text x="114" y="30" class="t-sm t-mut">↓ = ↑ prolactin</text>
          </svg>
        caption: "من الـ VTA طريقين: للـ prefrontal (mesocortical، قلته = negative symptoms) وللـ nucleus accumbens (mesolimbic، زيادته = positive symptoms). من الـ substantia nigra للـ striatum (nigrostriatal، قلته = extrapyramidal). ومن الـ hypothalamus للـ pituitary (tuberoinfundibular، قلته = ↑ prolactin)."
        alt: "Diagram of four dopamine pathways. From the ventral tegmental area to prefrontal cortex (mesocortical, decreased activity gives negative symptoms) and to nucleus accumbens (mesolimbic, increased activity gives positive symptoms). From substantia nigra to dorsal striatum (nigrostriatal, decreased activity gives extrapyramidal symptoms). From hypothalamus to pituitary (tuberoinfundibular, decreased activity raises prolactin)."
        page: 509
        quote: "Mesolimbic Ventral tegmental area → nucleus accumbens ↑ activity → positive symptoms 1° therapeutic target of antipsychotics"
      - kind: reveal
        prompt: "الـ antipsychotic بيقفل الـ D2 في كل حتة. توقّع: إيه اللي هيتحسن وإيه الأعراض الجانبية؟"
        answer: "الـ **mesolimbic** هو الهدف ← الـ positive symptoms (hallucinations) تتحسن. بس نفس الدوا بيقفل الـ **nigrostriatal** ← extrapyramidal symptoms، والـ **tuberoinfundibular** ← ↑ prolactin (galactorrhea، amenorrhea). والـ **mesocortical** (negative symptoms) الدوا تأثيره عليه محدود."
        page: 509
        quote: "Tuberoinfundibular Hypothalamus → pituitary Regulation of prolactin secretion"
      - kind: check
        question: "A woman on haloperidol for 3 months now has galactorrhea and amenorrhea. Which pathway?"
        options:
          - "Tuberoinfundibular"
          - "Nigrostriatal"
          - "Mesolimbic"
          - "Mesocortical"
        answer: 0
        why:
          - "صح: الـ dopamine بيمنع الـ prolactin، فلما يتقفل ← ↑ prolactin."
          - "الـ nigrostriatal بيعمل extrapyramidal symptoms."
          - "الـ mesolimbic هو اللي اتعالج (الهلاوس راحت)."
          - "الـ mesocortical مرتبط بالـ negative symptoms."
        page: 509
        quote: "Tuberoinfundibular Hypothalamus → pituitary Regulation of prolactin secretion"
      - kind: explain
        title: "الـ cerebellum: نفس الناحية"
        text: |-
          بيظبط الحركة والتوازن. بياخد proprioception من نفس الناحية عن طريق الـ **inferior cerebellar peduncle**.

          - ==Medial== (vermis): العضلات الـ axial والـ proximal، على الناحيتين ← المشية والجذع.
          - ==Lateral== (hemispheres): العضلات الـ distal على **نفس الناحية** + التخطيط للحركة.

          الـ deep nuclei من بره لجوه: dentate و emboliform و globose و fastigial: «**d**on't **e**at **g**reasy **f**oods».
        page: 510
        quote: "Lateral cerebellum (paravermis and lateral hemisphere) controls distal limb musculature ipsilaterally (lateral structures) and motor planning."
      - kind: aside
        tone: exam
        text: "ورم في الـ **right** cerebellar hemisphere ← intention tremor و dysmetria في الإيد **اليمين** (ipsilateral). ورم في الـ ==vermis== ← المريض مش قادر يقعد أو يمشي ثابت (truncal ataxia) والإيدين ممكن تبقى كويسة. الاختبارات: rapid alternating movements، finger-to-nose، heel-to-shin، gait، intention tremor."
        page: 510
        quote: "Tests: rapid alternating movements (pronation/ supination), finger-to-nose, heel-to-shin, gait, look for intention tremor."
      - kind: figure
        title: "الـ direct والـ indirect pathway"
        svg: |-
          <svg viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL02d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker><marker id="nL02e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-box" x="130" y="6" width="100" height="28" rx="6"/>
            <text x="150" y="25" class="t-sm t-b">Cortex</text>
            <rect class="fg-box" x="130" y="58" width="100" height="28" rx="6"/>
            <text x="150" y="77" class="t-sm t-b">Striatum</text>
            <line class="fg-arrow-acc" x1="180" y1="34" x2="180" y2="56" marker-end="url(#nL02d)"/>
            <rect class="fg-box" x="260" y="110" width="90" height="28" rx="6"/>
            <text x="285" y="129" class="t-sm t-b">GPe</text>
            <rect class="fg-box" x="260" y="160" width="90" height="28" rx="6"/>
            <text x="285" y="179" class="t-sm t-b">STN</text>
            <rect class="fg-box" x="130" y="160" width="100" height="28" rx="6"/>
            <text x="165" y="179" class="t-sm t-b">GPi</text>
            <rect class="fg-box" x="130" y="208" width="100" height="28" rx="6"/>
            <text x="150" y="227" class="t-sm t-b">Thalamus</text>
            <line class="fg-arrow-bad" x1="170" y1="86" x2="170" y2="158" marker-end="url(#nL02e)"/>
            <text x="96" y="125" class="t-sm t-acc">direct</text>
            <line class="fg-arrow-bad" x1="225" y1="86" x2="290" y2="108" marker-end="url(#nL02e)"/>
            <line class="fg-arrow-bad" x1="305" y1="138" x2="305" y2="158" marker-end="url(#nL02e)"/>
            <line class="fg-arrow-acc" x1="260" y1="174" x2="232" y2="174" marker-end="url(#nL02d)"/>
            <text x="290" y="100" class="t-sm t-acc">indirect</text>
            <line class="fg-arrow-bad" x1="180" y1="188" x2="180" y2="206" marker-end="url(#nL02e)"/>
            <rect class="fg-good" x="8" y="58" width="96" height="44" rx="8"/>
            <text x="14" y="76" class="t-sm t-b">SNc dopamine</text>
            <text x="14" y="94" class="t-sm">D1 + / D2 −</text>
            <line class="fg-arrow-acc" x1="104" y1="74" x2="128" y2="72" marker-end="url(#nL02d)"/>
            <text x="8" y="140" class="t-sm t-acc">blue = excites</text>
            <text x="8" y="156" class="t-sm t-bad">red = inhibits</text>
          </svg>
        caption: "الـ GPi هو «الفرامل» على الـ thalamus. الـ direct pathway بيكبس على الفرامل نفسها (striatum يمنع الـ GPi) ← الـ thalamus يتحرر ← حركة. الـ indirect بيشيل الفرامل من على الـ STN، والـ STN يشغّل الـ GPi ← الـ thalamus يتمنع ← حركة أقل. والـ dopamine بيشغّل الـ direct (D1) ويهدّي الـ indirect (D2): الاتنين معناهم حركة أكتر."
        alt: "Basal ganglia circuit. Cortex excites striatum. Direct path: striatum inhibits GPi, which inhibits thalamus. Indirect path: striatum inhibits GPe, which inhibits STN; STN excites GPi. SNc dopamine excites the direct path via D1 and inhibits the indirect path via D2. Blue arrows excite, red arrows inhibit."
        page: 511
        quote: "Direct (excitatory) pathway: cortex (via glutamate) excites striatum → striatum (via GABA) inhibits GPi (↓ GABA) → thalamus disinhibited (activated) → ↑ cortical activation → ↑ motion."
      - kind: order
        prompt: "رتّب الـ indirect pathway"
        steps:
          - "Cortex excites the striatum"
          - "Striatum inhibits the GPe"
          - "STN is disinhibited"
          - "STN excites the GPi"
          - "Thalamus is inhibited"
        why: "عدّ الـ inhibitions: الـ striatum يمنع الـ GPe، فالـ STN يتحرر ويشغّل الـ GPi، والـ GPi يمنع الـ thalamus ← حركة أقل."
        page: 511
        quote: "Indirect (inhibitory) pathway: cortex (via glutamate) excites striatum → striatum (via GABA) inhibits GPe → STN disinhibited → STN (via glutamate) excites GPi (↑ GABA) → thalamus inhibited → ↓ motion."
      - kind: table
        title: "Parkinson عكس Huntington"
        columns: ["", "Parkinson", "Huntington"]
        rows:
          - ["Dopamine", "↓", "↑"]
          - ["Direct pathway", "↓", "↑"]
          - ["Indirect pathway", "↑", "↓"]
          - ["Motion", "↓", "↑"]
        hide: [[1, 1], [2, 1], [1, 2], [2, 2], [3, 1], [3, 2]]
        page: 511
        quote: "↓ dopamine (eg, Parkinson disease) → ↓ direct + ↑ indirect → ↓ motion ▘ ↑ dopamine (eg, Huntington) → ↑ direct + ↓ indirect → ↑ motion"
      - kind: check
        question: "Loss of SNc neurons in Parkinson disease has which net effect?"
        options:
          - "↓ direct, ↑ indirect, ↓ motion"
          - "↑ direct, ↓ indirect, ↑ motion"
          - "↓ both pathways equally"
          - "↑ D1 stimulation"
        answer: 0
        why:
          - "صح: من غير dopamine، الـ D1 مايشغّلش الـ direct والـ D2 ما يهدّيش الـ indirect."
          - "ده نمط ↑ dopamine زي Huntington."
          - "الاتنين بيتحركوا عكس بعض، مش زي بعض."
          - "الـ D1 بيقل لما الـ dopamine يقل."
        page: 511
        quote: "↓ dopamine (eg, Parkinson disease) → ↓ direct + ↑ indirect → ↓ motion"
      - kind: try
        items: [neuro.L02.072, neuro.L02.075, neuro.L02.079, neuro.L02.080, neuro.L02.084]
    recap:
      - "Limbic: hippocampus و amygdala و mammillary bodies و cingulate؛ الـ 5 F's."
      - "Mesolimbic ↑ = positive، mesocortical ↓ = negative، nigrostriatal ↓ = EPS، tuberoinfundibular ↓ = ↑ prolactin."
      - "Cerebellum ipsilateral؛ vermis = axial على الناحيتين، hemisphere = distal نفس الناحية."
      - "Deep nuclei: dentate و emboliform و globose و fastigial."
      - "Dopamine: D1 يشغّل الـ direct، D2 يهدّي الـ indirect ← حركة."
    practice: [neuro.L02.072, neuro.L02.073, neuro.L02.074, neuro.L02.075, neuro.L02.076, neuro.L02.077, neuro.L02.078, neuro.L02.079, neuro.L02.080, neuro.L02.081, neuro.L02.082, neuro.L02.083, neuro.L02.084, neuro.L02.085, neuro.L02.086, neuro.L02.087]
  - id: neuro.L02.lesson5
    title: "الدم والـ CSF في المخ: من الـ cortex للـ sinuses"
    hook: "عارف ليه الـ hyperventilation بينزّل ضغط المخ؟ وليه الـ cardiac arrest بيعمل «man in a barrel»؟"
