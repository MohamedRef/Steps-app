      - "تمشي مع الـ CSF من الـ ventricle للـ sinus"
    status: unverified
    steps:
      - kind: explain
        title: "خريطة الـ cortex"
        text: |-
          - **Frontal**: prefrontal cortex، frontal eye field، premotor، primary motor، و ==Broca area==.
          - **Parietal**: primary somatosensory و somatosensory association cortex.
          - **Temporal**: primary auditory cortex و ==Wernicke area==.
          - **Occipital**: primary visual cortex.

          والـ **arcuate fasciculus** هو الكابل اللي بيوصّل Wernicke بـ Broca.
        page: 512
        quote: "Arcuate fasciculus Primary auditory cortex Primary visual cortex Wernicke area Central sulcus"
      - kind: explain
        title: "الـ perfusion: الـ Pco2 هو المتحكم"
        text: |-
          الـ autoregulation قوي، والمحرك الأساسي هو ==Pco2==: Pco2 يعلى ← الأوعية توسع ← دم أكتر. (لحد Pco2 حوالي 90 mm Hg.)

          الـ Po2 ما بيأثرش غير في الـ hypoxia الشديدة (Po2 أقل من 50 mm Hg)، زي الـ mountain sickness: hypoxia ← vasodilation ← دم أكتر ← cerebral edema.

          والـ perfusion pressure = ==MAP − intracranial pressure==. لو وصل صفر ← مفيش perfusion ← coma أو brain death.
        page: 512
        quote: "CPP = MAP – ICP. If CPP = 0, there is no cerebral perfusion coma or brain death (absent brainstem reflexes, apnea)."
      - kind: reveal
        prompt: "مريض stroke ضغط مخه بيعلى ومفيش حاجة نفعت. ليه الـ hyperventilation بيفيد فوراً؟"
        answer: "Hyperventilation ← ↓ Pco2 ← الأوعية تنقبض (vasoconstriction) ← دم أقل في المخ ← الحجم يقل ← ==↓ intracranial pressure==. بيستخدم في الـ cerebral edema الحادة اللي ما استجابتش لحاجة تانية."
        page: 512
        quote: "Therapeutic hyperventilation → ↓ Pco2 → vasoconstriction → ↓ cerebral blood flow → ↓ ICP."
      - kind: aside
        tone: exam
        text: "**Cushing reflex** = hypertension + ==bradycardia== + respiratory depression، كرد فعل على ↑ intracranial pressure. لو شفت الضغط عالي والنبض واطي في مريض راسه بتوجعه وبيغيب، فكّر فيها."
        page: 512
        quote: "Cushing reflex—triad of hypertension, bradycardia, and respiratory depression in response to ↑ ICP."
      - kind: figure
        title: "مين بيغذّي إيه على الـ homunculus"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
