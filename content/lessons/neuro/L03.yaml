schema: steps.lesson/v1
lecture: neuro.L03
lessons:
  - id: neuro.L03.lesson1
    title: "مكان الإصابة بيقول العَرَض: الـ lesions والـ posturing والـ stroke"
    hook: "لو عرفت كل حتة في المخ بتعمل إيه، هتعرف مكان الإصابة من أول سطر في الـ vignette"
    minutes: 9
    pages: [524, 525]
    topics: [common-brain-lesions, abnormal-motor-posturing, ischemic-brain-disease, ischemic-stroke, transient-ischemic-attack, cerebral-edema]
    goals:
      - "تربط كل منطقة في المخ بالعَرَض اللي بيطلع لما تتضرب"
      - "تفرّق decorticate عن decerebrate بمستوى الـ red nucleus"
      - "ترتّب اللي بيحصل في الخلايا بعد الـ stroke يوم بيوم"
      - "تفرّق الـ cytotoxic عن الـ vasogenic edema"
    status: unverified
    steps:
      - kind: explain
        title: "الـ frontal lobe والعينين"
        text: |-
          الـ **prefrontal cortex** هو «الفرامل» بتاعة الشخصية: لو اتضرب يطلع ==frontal lobe syndrome==: disinhibition، أكل كتير، impulsivity، فقدان الـ empathy، وضعف الـ executive function. ده اللي بتشوفه في **frontotemporal dementia**.

          العينين ليهم قاعدتين عكس بعض:
          - **Frontal eye fields** (زي MCA stroke): العينين ==تبص ناحية الإصابة==، يعني بعيد عن الناحية المشلولة.
          - **PPRF** في الـ pons: العينين تبص بعيد عن الإصابة، يعني ناحية الناحية المشلولة.
        page: 524
        quote: "Frontal eye fields Eyes look toward brain lesion (ie, away from side of hemiplegia). Seen in MCA stroke."
      - kind: check
        question: "A man with a large left MCA stroke has right hemiplegia. Which way do his eyes deviate?"
        options:
          - "To the left, toward the lesion"
          - "To the right, toward the hemiplegia"
          - "Upward"
          - "They stay midline"
        answer: 0
        why:
          - "صح: الـ frontal eye field الشمال مات، فالـ FEF اليمين يزق العينين ناحية الشمال (ناحية الإصابة)."
          - "ده نمط الـ PPRF في الـ pons، مش الـ cortex."
          - "مشكلة البص لفوق بتاعة الـ dorsal midbrain (Parinaud)."
          - "الـ FEF السليم بيزق العينين ناحية واحدة."
        page: 524
        quote: "Frontal eye fields Eyes look toward brain lesion (ie, away from side of hemiplegia). Seen in MCA stroke."
      - kind: table
        title: "إصابات في الناحيتين (bilateral)"
        columns: ["Structure", "Syndrome", "Classic cause"]
        rows:
          - ["Mammillary bodies", "Wernicke-Korsakoff", "Thiamine deficiency"]
          - ["Amygdala", "Klüver-Bucy: hyperphagia, hypersexuality, hyperorality", "HSV-1 encephalitis"]
          - ["Hippocampus", "Anterograde amnesia", "Alzheimer disease"]
        hide: [[0, 1], [1, 2], [2, 1]]
        page: 524
        quote: "Amygdala Bilateral lesions → Klüver-Bucy syndrome—disinhibition (eg, hyperphagia, hypersexuality, hyperorality). Seen in HSV-1 encephalitis."
      - kind: explain
        title: "الـ parietal والـ cerebellum"
        text: |-
          - **Dominant parietal**: ==Gerstmann==: مش عارف يكتب ولا يحسب ولا يعدّ صوابعه ولا يفرّق يمين من شمال.
          - **Nondominant parietal**: **hemispatial neglect**، بياكل نص الطبق ويسيب النص التاني.

          الـ cerebellum بيشتغل على **نفس الناحية** (ipsilateral)، والمريض بيقع ناحية الإصابة:
          - الـ **hemisphere** على الجنب فبيضرب الأطراف: intention tremor و limb ataxia.
          - الـ **vermis** في النص فبيضرب الجسم نفسه: ==truncal ataxia== (مشية «drunken sailor») مع الكحول المزمن.
        page: 524
        quote: "Cerebellar hemisphere Intention tremor, limb ataxia, loss of balance; damage to cerebellum → ipsilateral deficits; fall toward side of lesion."
      - kind: figure
        title: "Decorticate × Decerebrate"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL03a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
            <rect class="fg-box" x="20" y="14" width="150" height="34" rx="8"/>
            <text x="58" y="36" class="t-sm t-b">Cerebral cortex</text>
            <rect class="fg-acc" x="20" y="88" width="150" height="34" rx="8"/>
            <text x="64" y="110" class="t-sm t-b">Red nucleus</text>
            <rect class="fg-box" x="20" y="162" width="150" height="34" rx="8"/>
            <text x="48" y="184" class="t-sm t-b">Vestibular nucleus</text>
            <line class="fg-arrow" x1="95" y1="48" x2="95" y2="86" marker-end="url(#nL03a)"/>
            <line class="fg-arrow" x1="95" y1="122" x2="95" y2="160" marker-end="url(#nL03a)"/>
            <line class="fg-thin" x1="170" y1="105" x2="200" y2="105"/>
            <text x="204" y="102" class="t-sm">Rubrospinal:</text>
            <text x="204" y="117" class="t-sm t-acc">arm flexors</text>
            <line class="fg-thin" x1="170" y1="179" x2="200" y2="179"/>
            <text x="204" y="176" class="t-sm">Vestibulospinal:</text>
            <text x="204" y="191" class="t-sm t-acc">extensors</text>
            <line class="fg-bad" x1="10" y1="68" x2="340" y2="68" stroke-dasharray="6 4"/>
            <text x="204" y="62" class="t-sm t-bad">cut here: decorticate</text>
            <line class="fg-bad" x1="10" y1="142" x2="340" y2="142" stroke-dasharray="6 4"/>
            <text x="204" y="137" class="t-sm t-bad">cut here: decerebrate</text>
          </svg>
        caption: "لو القطع فوق الـ red nucleus، الـ rubrospinal لسه شغال فالدراعات تنثني على الصدر (decorticate، «hands near the cor»). لو القطع تحت الـ red nucleus، مافيش غير الـ vestibulospinal فكل الأطراف تتفرد (decerebrate)، وده أوحش في الـ prognosis."
        alt: "Vertical chain of three boxes: cerebral cortex, red nucleus, vestibular nucleus. The red nucleus sends the rubrospinal tract to arm flexors and the vestibular nucleus sends the vestibulospinal tract to extensors. A dashed line above the red nucleus marks the decorticate lesion; a dashed line below it marks the decerebrate lesion."
        page: 524
        quote: "Above red nucleus (often cerebral cortex) Between red and vestibular nuclei (brainstem)"
      - kind: check
        question: "After a pontine hemorrhage, a comatose patient extends both arms and legs to pain. Which tract still drives this posture?"
        options:
          - "Vestibulospinal tract only"
          - "Rubrospinal and vestibulospinal tracts"
          - "Lateral corticospinal tract"
          - "Spinothalamic tract"
        answer: 0
        why:
          - "صح: decerebrate، الإصابة تحت الـ red nucleus فمافضلش غير الـ vestibulospinal (extensors)."
          - "الاتنين مع بعض = decorticate (فوق الـ red nucleus)."
          - "الـ corticospinal اتقطع فوق."
          - "الـ spinothalamic إحساس مش حركة."
        page: 524
        quote: "Rubrospinal and vestibulospinal tracts Vestibulospinal tract"
      - kind: explain
        title: "5 دقايق بس"
        text: |-
          الـ neuron بيموت موت نهائي بعد ==5 دقايق hypoxia==. أكتر حتت حساسة: **hippocampus (CA1)**، الـ neocortex، الـ **Purkinje cells** في الـ cerebellum، والـ watershed areas («vulnerable hippos need pure water»).

          التصوير: **CT من غير صبغة الأول** عشان تستبعد النزيف قبل الـ tPA. الـ CT بيشوف الـ ischemia بعد 6-24 ساعة، أما الـ ==diffusion-weighted MRI== بيشوفها في 3-30 دقيقة.
        page: 525
        quote: "Irreversible neuronal injury begins after 5 minutes of hypoxia. Most vulnerable: hippocampus (CA1 region), neocortex, cerebellum (Purkinje cells), watershed areas"
      - kind: order
        prompt: "رتّب اللي بيبان تحت الميكروسكوب بعد الـ ischemic stroke"
        steps:
          - "12-24 hr: red neurons (eosinophilic cytoplasm, pyknotic nuclei)"
          - "24-72 hr: necrosis and neutrophils"
          - "3-5 days: macrophages (microglia)"
          - "1-2 weeks: reactive gliosis and vascular proliferation"
          - "Over 2 weeks: glial scar"
        why: "نفس ترتيب أي التهاب: الخلية تموت (حمرا)، الـ neutrophils تيجي، الـ macrophages تنضّف، الـ astrocytes تبني، وفي الآخر ندبة. في المخ النهاية liquefactive necrosis مش fibrosis."
        page: 525
        quote: "Eosinophilic cytoplasm + pyknotic nuclei (red neurons) Necrosis + neutrophils Macrophages (microglia) Reactive gliosis (astrocytes) + vascular proliferation Glial scar"
      - kind: explain
        title: "3 أنواع ischemic stroke والعلاج"
        text: |-
          - **Thrombotic**: جلطة في مكانها فوق plaque مفتوحة، غالباً في الـ MCA.
          - **Embolic**: جاية من بعيد، وممكن تضرب أكتر من منطقة: atrial fibrillation، carotid stenosis، DVT مع patent foramen ovale، endocarditis.
          - **Hypoxic**: ضغط واطي عام (عمليات القلب) فبيضرب الـ **watershed**.

          العلاج: ==tPA لو في خلال 3-4.5 ساعة== ومافيش نزيف، و/أو **thrombectomy** لو شريان كبير مسدود. والوقاية: aspirin أو clopidogrel، والضغط والسكر والدهون، ووقف السجاير.

          الـ **TIA**: عَرَض عصبي بيروح (غالباً أقل من 15 دقيقة) و**MRI سليم**؛ ممكن يجي كـ amaurosis fugax من emboli الـ carotid.
        page: 525
        quote: "Treatment: tPA (if within 3-4.5 hr of onset and no hemorrhage/risk of hemorrhage) and/or thrombectomy (if large artery occlusion)."
      - kind: check
        question: "A 70-year-old woman has right arm and face weakness that began 2 hours ago. What must be done before giving tPA?"
        options:
          - "Noncontrast head CT to exclude hemorrhage"
          - "Diffusion-weighted MRI to confirm infarction"
          - "Lumbar puncture"
          - "Wait 6 hours for CT changes to appear"
        answer: 0
        why:
          - "صح: الـ CT من غير صبغة بيستبعد النزيف، وده الشرط قبل الـ tPA."
          - "الـ MRI أحسن في كشف الـ ischemia بدري، بس مش شرط قبل العلاج."
          - "الـ LP مالهوش دور هنا."
          - "الاستنا هيضيّع نافذة الـ 3-4.5 ساعة."
        page: 525
        quote: "Stroke imaging: noncontrast CT to exclude hemorrhage (before tPA can be given)."
      - kind: sort
        prompt: "حط كل سبب في نوع الـ edema بتاعه"
        bins: ["Cytotoxic (inside cells)", "Vasogenic (outside cells)"]
        cards:
          - { text: "Early ischemia", bin: 0 }
          - { text: "Hyperammonemia", bin: 0 }
          - { text: "SIADH", bin: 0 }
          - { text: "Tumor", bin: 1 }
          - { text: "Late ischemia", bin: 1 }
          - { text: "Trauma, hemorrhage, inflammation", bin: 1 }
        why: "الـ cytotoxic = الـ Na+/K+ pump وقف فالـ Na+ والمية يدخلوا الخلية. الـ vasogenic = الـ BBB اتخرم فالمية تطلع بره الأوعية. الـ ischemia بتبدأ cytotoxic وبعدين تبقى vasogenic."
        page: 525
        quote: "Cytotoxic edema—intracellular fluid accumulation due to osmotic shift (eg, Na+ /K+ -ATPase dysfunction → ↑ intracellular Na+ ). Caused by ischemia (early), hyperammonemia, SIADH."
      - kind: try
        items: [neuro.L03.007, neuro.L03.013, neuro.L03.018, neuro.L03.022]
    recap:
      - "FEF: العينين تبص ناحية الإصابة. PPRF: بعيد عنها."
      - "Bilateral: mammillary = Wernicke-Korsakoff، amygdala = Klüver-Bucy، hippocampus = anterograde amnesia."
      - "Cerebellum ipsilateral: hemisphere = أطراف، vermis = جسم."
      - "فوق الـ red nucleus = decorticate، تحته = decerebrate (أوحش)."
      - "Red neurons ← neutrophils ← macrophages ← gliosis ← scar."
      - "CT الأول، tPA في 3-4.5 ساعة."
    practice: [neuro.L03.001, neuro.L03.002, neuro.L03.003, neuro.L03.004, neuro.L03.005, neuro.L03.006, neuro.L03.007, neuro.L03.008, neuro.L03.009, neuro.L03.010, neuro.L03.011, neuro.L03.012, neuro.L03.013, neuro.L03.014, neuro.L03.015, neuro.L03.016, neuro.L03.017, neuro.L03.018, neuro.L03.019, neuro.L03.020, neuro.L03.021, neuro.L03.022]
  - id: neuro.L03.lesson2
    title: "كل شريان وليه عَرَض: خريطة الـ strokes"
    hook: "الـ vignette بتقولك العَرَض، وإنت تقول اسم الشريان: لعبة بتتكرر في كل امتحان"
    minutes: 10
    pages: [526, 527]
    topics: [effects-of-strokes, neonatal-intraventricular-hemorrhage, extracranial-injuries]
    goals:
      - "تفرّق الـ ACA والـ MCA والـ lenticulostriate بالأعراض"
      - "تعرف علامات الـ PCA والـ basilar"
      - "تفرّق AICA عن PICA عن ASA في جذع المخ"
      - "تفرّق إصابات راس المولود"
    status: unverified
    steps:
      - kind: explain
        title: "الـ anterior circulation"
        text: |-
          افتكر الـ homunculus: الرجل في النص (جوه الـ fissure)، والوش والإيد على الجنب.
          - **ACA**: بيغذّي النص ← ==شلل وفقدان إحساس في الرجل== المقابلة + urinary incontinence.
          - **MCA**: بيغذّي الجنب ← شلل الوش (النص التحتاني) والدراع المقابل. لو في الناحية الـ **dominant** ← aphasia (Wernicke في الـ temporal، Broca في الـ frontal). لو الـ **nondominant** ← hemineglect.
          - **Lenticulostriate**: الـ internal capsule ← ==pure motor stroke== من غير أي علامة cortical (لا aphasia ولا neglect)، وده مكان الـ **lacunar infarcts** من الضغط العالي (lipohyalinosis).
        page: 526
        quote: "Contralateral paralysis and sensory loss—lower limb, urinary incontinence."
      - kind: check
        question: "A woman suddenly develops weakness and numbness of the left leg with urinary incontinence; her arm and face are normal. Which artery is occluded?"
        options:
          - "Right anterior cerebral artery"
          - "Right middle cerebral artery"
          - "Left anterior cerebral artery"
          - "Right lenticulostriate artery"
        answer: 0
        why:
          - "صح: رجل بس + incontinence = ACA، والناحية المقابلة للأعراض (اليمين)."
          - "الـ MCA بيضرب الوش والدراع أكتر من الرجل."
          - "الإصابة دايماً عكس الأعراض: رجل شمال = مخ يمين."
          - "الـ lenticulostriate بيعمل شلل الوش والدراع والرجل مع بعض (internal capsule)."
        page: 526
        quote: "Contralateral paralysis and sensory loss—lower limb, urinary incontinence."
      - kind: explain
        title: "الـ PCA والـ basilar"
        text: |-
          - **PCA** بيغذّي الـ occipital ← ==hemianopia مع macular sparing== (الـ macula ليها دم من الـ MCA كمان). لو الـ dominant ووصل للـ splenium ← **alexia without agraphia** (يكتب بس مش قادر يقرا اللي كتبه). لو الـ nondominant ← **prosopagnosia** (مايعرفش الوشوش).
          - **Weber syndrome**: فروع الـ PCA للـ midbrain ← CN III palsy في نفس الناحية + hemiplegia في الناحية التانية.
          - **Basilar**: ==locked-in syndrome==: شلل الأربع أطراف والوش، بس الوعي سليم (الـ RAS سليم)، والعينين بتتحرك لفوق وتحت بس (بيرمش ويبص لفوق).
        page: 526
        quote: "Contralateral hemianopia with macular sparing; alexia without agraphia (dominant hemisphere, extending to splenium of corpus callosum); prosopagnosia"
      - kind: figure
        title: "جذع المخ: الجنب × النص"
        svg: |-
          <svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fg-box" cx="120" cy="110" rx="100" ry="80"/>
            <rect class="fg-acc" x="100" y="40" width="40" height="140" rx="10"/>
            <ellipse class="fg-bad" cx="50" cy="110" rx="28" ry="50"/>
            <ellipse class="fg-bad" cx="190" cy="110" rx="28" ry="50"/>
            <text x="102" y="22" class="t-sm t-b t-acc">Medial</text>
            <text x="104" y="104" class="t-sm">CST</text>
            <text x="104" y="120" class="t-sm">ML</text>
            <text x="104" y="136" class="t-sm">XII</text>
            <text x="2" y="40" class="t-sm t-b t-bad">Lateral</text>
            <text x="34" y="106" class="t-sm">V, VIII</text>
            <text x="34" y="122" class="t-sm">STT</text>
            <text x="240" y="40" class="t-sm t-b">Lateral = PICA or AICA</text>
            <text x="240" y="58" class="t-sm">vertigo, Horner,</text>
            <text x="240" y="74" class="t-sm">ataxia, crossed</text>
            <text x="240" y="90" class="t-sm">pain/temp loss</text>
            <text x="240" y="120" class="t-sm t-b">PICA adds:</text>
            <text x="240" y="136" class="t-sm">hoarse, dysphagia</text>
            <text x="240" y="160" class="t-sm t-b">AICA adds:</text>
            <text x="240" y="176" class="t-sm">facial palsy, deaf</text>
            <text x="240" y="204" class="t-sm t-b t-acc">Medial = ASA</text>
          </svg>
        caption: "النص (ASA): الـ corticospinal (شلل عكسي)، الـ medial lemniscus (proprioception عكسي)، والـ XII (اللسان يميل ناحية الإصابة). الجنب (PICA أو AICA): vertigo، Horner، ataxia، والإحساس بالألم والحرارة يروح من الوش في نفس الناحية والجسم في الناحية التانية. الفرق بين الاتنين: PICA = nucleus ambiguus (صوت وبلع)، AICA = facial nucleus وودن."
        alt: "Cross-section of the brainstem. A medial strip labeled corticospinal tract, medial lemniscus and hypoglossal nerve is supplied by the anterior spinal artery. Lateral zones containing CN V and VIII nuclei and the spinothalamic tract are supplied by PICA or AICA. Side notes: lateral lesions cause vertigo, Horner syndrome, ataxia and crossed pain and temperature loss; PICA adds hoarseness and dysphagia; AICA adds facial palsy and deafness."
        page: 527
        quote: "Nucleus ambiguus effects are specific to PICA lesions D ."
      - kind: table
        title: "AICA × PICA"
        columns: ["", "AICA (lateral pontine)", "PICA (lateral medullary, Wallenberg)"]
        rows:
          - ["Specific nucleus", "Facial nerve nuclei", "Nucleus ambiguus (CN IX, X)"]
          - ["Specific signs", "LMN facial palsy, ↓ lacrimation, ↓ salivation, ↓ taste", "Dysphagia, hoarseness, ↓ gag reflex, hiccups"]
          - ["Ear", "Ipsilateral sensorineural deafness (labyrinthine artery)", "Spared"]
          - ["Shared", "Vertigo, nystagmus, Horner, ataxia, crossed pain/temp loss", "Same"]
        hide: [[0, 1], [0, 2], [1, 2], [2, 1]]
        page: 526
        quote: "Facial nerve nuclei effects are specific to AICA lesions."
      - kind: check
        question: "A man has vertigo, hoarseness, difficulty swallowing, a left Horner syndrome, and loss of pain sensation on the left face and right body. Which artery is occluded?"
        options:
          - "Left posterior inferior cerebellar artery"
          - "Left anterior inferior cerebellar artery"
          - "Left anterior spinal artery"
          - "Basilar artery"
        answer: 0
        why:
          - "صح: Wallenberg، والبحة والبلع (nucleus ambiguus) خاصين بالـ PICA. «Don't pick a lame horse that can't eat»."
          - "الـ AICA بيعمل facial palsy وصمم بدل البحة."
          - "الـ ASA بيعمل شلل ولسان مايل، مش Horner."
          - "الـ basilar بيعمل locked-in."
        page: 527
        quote: "“Don’t pick a (PICA) lame (lateral medullary syndrome) horse (hoarseness) that can’t eat (dysphagia).”"
      - kind: explain
        title: "الـ medial medullary"
        text: |-
          الـ **ASA** بيغذّي النص، و ==«Ants love M&M's»==: **A**SA ← **M**edial **M**edullary.

          3 حاجات: شلل الدراع والرجل في الناحية التانية (corticospinal)، ↓ proprioception في الناحية التانية (medial lemniscus)، واللسان ==يميل ناحية الإصابة== (hypoglossal).
        page: 527
        quote: "Ipsilateral hypoglossal dysfunction (tongue deviates ipsilaterally)."
      - kind: explain
        title: "نزيف جوه البطينات عند المبتسر"
        text: |-
          الـ **germinal matrix** طبقة مليانة أوعية رفيعة جنب البطينات. في المبتسر وناقص الوزن: الـ glial support ضعيف والـ **autoregulation** للضغط مش شغالة، فالأوعية تفرقع والدم يدخل البطينات.

          الشكل: تغيّر في الوعي، ==fontanelle منفوخة==، hypotension، تشنجات، coma.
        page: 527
        quote: "Originates in germinal matrix, a highly vascularized layer within the subventricular zone."
      - kind: sort
        prompt: "حط كل وصف في إصابة راس المولود بتاعته"
        bins: ["Caput succedaneum", "Subgaleal hemorrhage", "Cephalohematoma"]
        cards:
          - { text: "Edema above periosteum, crosses sutures", bin: 0 }
          - { text: "Prolonged engagement in the birth canal, resolves alone", bin: 0 }
          - { text: "Emissary veins torn, can cause shock", bin: 1 }
          - { text: "Diffuse fluctuant swelling spreading back and sideways", bin: 1 }
          - { text: "Under periosteum, stops at sutures", bin: 2 }
          - { text: "Firm swelling, may cause indirect hyperbilirubinemia", bin: 2 }
        why: "الترتيب من بره لجوه: caput فوق الـ periosteum (ميّة، بريئة)، subgaleal بين الـ periosteum والـ galea (دم كتير وخطر)، و cephalohematoma تحت الـ periosteum فبيقف عند الـ sutures."
        page: 527
        quote: "Blood accumulation between skull and periosteum; does not cross suture lines."
      - kind: check
        question: "A newborn delivered by vacuum has a boggy scalp swelling that grows over hours, falling hemoglobin and tachycardia. Where is the blood?"
        options:
          - "Between periosteum and galeal aponeurosis"
