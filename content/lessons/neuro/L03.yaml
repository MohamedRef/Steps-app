    title: "الـ myelin لما يتضرب، والأمراض اللي بتبان على الجلد"
    hook: "ست شابة مش شايفة بعين واحدة، وطفل عنده بقع على جلده وتشنجات: الاتنين مرض في الـ nervous system"
    minutes: 10
