    steps:
      - kind: explain
        title: "UMN × LMN"
        text: |-
          - **LMN** = ==كل حاجة بتنزل==: العضلة تضمر، الـ tone والـ reflexes تقل، الصباع لتحت، ومعاها **fasciculations** (رفرفة).
          - **UMN** = ==كل حاجة بتطلع==: الـ tone والـ reflexes تزيد، الصباع لفوق (Babinski)، و clasp-knife spasticity.

          الـ Babinski طبيعي عند الرضّع.
        page: 543
        quote: "Fasciculations = muscle twitching Positive Babinski is normal in infants"
      - kind: figure
        title: "كل مرض بياكل حتة"
        svg: |-
          <svg viewBox="0 0 370 230" xmlns="http://www.w3.org/2000/svg">
            <ellipse class="fg-box" cx="110" cy="118" rx="100" ry="80"/>
