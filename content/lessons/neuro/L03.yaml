    steps:
      - kind: explain
        title: "MS: لطشات في أماكن وأوقات مختلفة"
        text: |-
          مرض **autoimmune** بيضرب الـ myelin في الـ CNS (الـ oligodendrocytes)، غالباً ستات بين 20 و 40، وأكتر كل ما تبعد عن خط الاستوا.

          الشكل في 4 أماكن:
          - العين: ==optic neuritis== (فقدان نظر بعين واحدة مع ألم و RAPD).
          - جذع المخ والـ cerebellum: diplopia، ataxia، scanning speech، intention tremor، و **INO** (غالباً في الناحيتين).
          - الـ pyramidal: ضعف و spasticity.
          - الحبل الشوكي: **Lhermitte sign** (كهربا مع ثني الرقبة)، neurogenic bladder.

          بيزيد مع الحر (**Uhthoff**)، وأغلب الحالات relapsing-remitting.
        page: 537
        quote: "Symptoms may be exacerbated by stressors (eg, heat [Uhthoff phenomenon], exercise, or infection). Relapsing and remitting is most common clinical course."
      - kind: explain
        title: "التشخيص والعلاج"
        text: |-
          - الـ CSF: ↑ IgG و myelin basic protein، و ==oligoclonal bands==.
          - الـ **MRI هو الـ gold standard**: plaques حوالين البطينات، متفرقة في المكان والزمان.

          العلاج:
          - الوقاية من النوبات: β-interferon، glatiramer، natalizumab، ofatumumab.
          - النوبة الحادة: ==IV steroids==.
          - الأعراض: المثانة بـ antimuscarinics، الـ spasticity بـ **baclofen**، والألم بـ TCAs.
        page: 537
        quote: "MRI is gold standard. Periventricular plaques A (areas of oligodendrocyte loss and reactive gliosis)."
      - kind: check
