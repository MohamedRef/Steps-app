      - kind: explain
        title: "Trigeminal neuralgia"
        text: |-
          نوبات ألم زي ==الكهربا== لـ **ثواني** في V2 أو V3، بتيجي مع لمس الوش أو المضغ أو الكلام. السبب غالباً **vascular loop** بيضغط على جذر الـ CN V.

          العلاج: ==carbamazepine== أو oxcarbazepine.
        page: 532
        quote: "Most cases are due to compression of CN V root by an aberrant vascular loop."
      - kind: match
        prompt: "وصّل كل حركة بمكان الإصابة أو السبب"
        pairs:
          - ["Hemiballismus", "Contralateral subthalamic nucleus"]
