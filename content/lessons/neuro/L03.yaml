        why: "half-of-body going ballistic = STN في الناحية التانية. الـ resting tremor بيروح مع الحركة (park your car = at rest)، والـ intention tremor بيزيد كل ما يقرب من الهدف (cerebellum)."
        page: 533
        quote: "Caused by lesion to contralateral subthalamic nucleus (eg, due to lacunar stroke)"
      - kind: explain
        title: "Essential tremor و restless legs"
        text: |-
          - **Essential tremor**: رعشة سريعة لما يمد إيده، بتزيد مع القلق، ==وبتقل مع الكحول== (فكتير بيعالجوا نفسهم بالشرب). غالباً في العيلة. العلاج: **propranolol** أو primidone.
          - **Dystonia**: انقباض مستمر (writer's cramp، torticollis، blepharospasm) ← botulinum toxin.
          - **Restless legs**: إحساس مزعج بالليل ورغبة يحرك رجليه، بيرتاح بالمشي. افتكر ==iron deficiency== و CKD والسكر. العلاج: gabapentinoids أو dopamine agonists.
        page: 533
        quote: "Patients often self-medicate with alcohol, which ↓ tremor amplitude"
