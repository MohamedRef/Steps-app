        caption: "الـ dorsal columns (vibration و proprioception)، الـ CST = lateral corticospinal (حركة، UMN)، الـ cb = spinocerebellar، الـ STT = spinothalamic (ألم وحرارة)، والـ anterior horn = LMN. polio و spinal muscular atrophy بياكلوا الـ anterior horn بس. ALS بياكل الـ CST والـ anterior horn. tabes بياكل الـ dorsal columns والـ roots. B12 بياكل الـ dorsal columns والـ CST والـ spinocerebellar. والـ ASA بيموّت كل حاجة ما عدا الـ dorsal columns."
