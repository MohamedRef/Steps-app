        text: "الحيلة: الـ ==spinothalamic بيعدّي على طول== (في نفس المستوى) فهو الوحيد اللي بيتأثر في الناحية التانية. الـ corticospinal والـ dorsal columns بيعدّوا فوق في الـ medulla، فبيتأثروا في نفس الناحية. ولو الإصابة فوق T1 ← Horner في نفس الناحية."
        page: 545
        quote: "Oculosympathetic pathway (if lesion occurs above T1)—ipsilateral Horner syndrome."
      - kind: explain
        title: "Friedreich و cerebral palsy"
        text: |-
          - **Friedreich ataxia**: AR، تكرار ==GAA== في الـ frataxin (chromosome 9) ← الـ mitochondria. بياكل الـ lateral corticospinal والـ spinocerebellar والـ dorsal columns والـ DRG: ataxia و areflexia مع Babinski، pes cavus، kyphoscoliosis، DM، و ==hypertrophic cardiomyopathy== (سبب الوفاة).
          - **Cerebral palsy**: إصابة ثابتة (مش بتزيد) لمخ الجنين أو الرضيع، أكبر خطر **prematurity** و low birth weight، ومعاها periventricular leukomalacia. الوقاية: magnesium sulfate قبل الولادة.
        page: 545
        quote: "Autosomal recessive trinucleotide repeat disorder (GAA)n on chromosome 9 in gene that encodes frataxin (iron-binding protein)."
      - kind: check
        question: "A man stabbed on the left at T8 has which pattern below the lesion?"
        options:
