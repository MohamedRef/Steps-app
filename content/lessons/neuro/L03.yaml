          - ["Dorsal columns", "Ipsilateral", "Vibration, proprioception, fine touch"]
          - ["Spinothalamic", "Contralateral", "Pain, temperature, crude touch"]
          - ["At the level", "Ipsilateral", "All sensation lost, LMN signs"]
