      - kind: explain
        title: "الـ epidural والـ lucid interval"
        text: |-
          ضربة على الـ **pterion** (أرق حتة في جنب الجمجمة) ← كسر ← قطع الـ ==middle meningeal artery== (فرع من الـ maxillary).

          المريض يغمى عليه لحظة، يفوق ويبقى كويس (==lucid interval==)، وبعدين يقع فجأة لأن الدم الشرياني بيكبر بسرعة ← transtentorial herniation و CN III palsy.
        page: 528
        quote: "Might present with transient loss of consciousness → recovery (“lucid interval”) → rapid deterioration due to hematoma expansion."
      - kind: explain
        title: "الـ subdural: حاد ولّا مزمن"
        text: |-
          المصدر: ==bridging veins==.
          - **حاد**: ضربة قوية، والدم على الـ CT أبيض (hyperdense).
          - **مزمن**: ضربة بسيطة عند واحد كبير في السن أو بيشرب كحول، لأن الـ **atrophy** بتشد الأوردة. الدم قديم فبيبان غامق (hypodense).

          وبيحصل كمان في الـ **shaken baby**.
        page: 528
        quote: "Rupture of bridging veins."
      - kind: check
        question: "An 80-year-old man on no anticoagulants has 3 weeks of confusion after bumping his head on a cabinet. CT shows a dark crescent over the left hemisphere crossing suture lines. What bled?"
