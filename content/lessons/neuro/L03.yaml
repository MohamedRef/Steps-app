      - kind: explain
        title: "شلل الوش: الجبهة بتفرّق"
        text: |-
          النص اللي فوق من الوش واخد UMN من ==الناحيتين==، فلو الـ cortex اتضرب (stroke) الجبهة **بتتحرك** والنص التحتاني بس اللي في الناحية التانية يقع.

          لو الـ **LMN** (الـ nucleus أو العصب نفسه) ← ==الوش كله== في نفس الناحية مع الجبهة، ومعاه مشكلة في قفل العين، hyperacusis، وطعم الثلثين الأماميين.

          أشهر سبب **Bell palsy** (HSV) ← glucocorticoids ± acyclovir. وافتكر Lyme، Ramsay Hunt (zoster: شلل + ألم ودن + فقاقيع)، sarcoidosis، parotid tumor، و DM.
        page: 546
        quote: "Bell palsy is the most common cause of peripheral facial palsy A . Usually develops after HSV reactivation."
