  - id: neuro.L03.lesson5
    title: "الأمراض اللي بتاكل المخ بالراحة، والبطينات اللي بتكبر"
    hook: "رعشة ولّا رقص ولّا نسيان؟ وكل واحد وراه بروتين متلخبط باسمه"
    minutes: 10
    pages: [534, 536]
    topics: [neurodegenerative-movement-disorders, dementia, idiopathic-intracranial-hypertension, hydrocephalus]
    goals:
      - "تعرف TRAP بتاعة Parkinson والـ Lewy bodies"
      - "تفهم Huntington بالـ CAG والـ striatum"
      - "تفرّق أنواع الـ dementia بالبروتين والشكل"
      - "تفرّق الـ hydrocephalus بأنواعه عن الـ ex vacuo"
    status: unverified
    steps:
      - kind: explain
        title: "Parkinson: body TRAP"
        text: |-
          الـ dopaminergic neurons في الـ ==substantia nigra pars compacta== بتموت (فتبان باهتة)، وجواها **Lewy bodies** من α-synuclein («Parkinsynuclein»).

          الأعراض بعد الـ 60 (**TRAP**): **T**remor وقت الراحة (pill-rolling)، **R**igidity (cogwheel)، **A**kinesia (مشية قصيرة وخط صغير)، و **P**ostural instability. الـ dementia متأخرة.

          الـ **PSP**: TRAP + ==vertical gaze palsy== + hummingbird sign على الـ MRI.
        page: 534
        quote: "Affected neurons contain Lewy bodies: intracellular eosinophilic inclusions composed of α-synuclein B . Think “Parkinsynuclein.”"
      - kind: explain
        title: "Huntington: CAG على chromosome 4"
        text: |-
          **Autosomal dominant**: تكرار ==CAG== في جين الـ huntingtin على **chromosome 4**، والنتيجة toxic gain of function. التكرار بيزيد مع الأجيال (**anticipation**).

          الـ GABAergic neurons في الـ **striatum** بتموت: الـ caudate والـ putamen يضمروا والبطينات تكبر (ex vacuo). الكيميا: ↑ dopamine، ↓ GABA، ↓ ACh. والموت من الـ NMDA و ==glutamate excitotoxicity==.

          الشكل بين 30 و 50: chorea، athetosis، عدوانية، اكتئاب، dementia.
        page: 534
        quote: "Autosomal dominant trinucleotide (CAG)n repeat expansion in huntingtin (HTT) gene on chromosome 4 (4 letters)"
      - kind: check
        question: "A 42-year-old man has 2 years of jerky, dance-like movements and irritability; his father had the same at an older age. Which change is seen in his brain?"
        options:
          - "Atrophy of the caudate and putamen"
          - "Depigmented substantia nigra"
          - "Atrophy of both hippocampi"
          - "Midbrain atrophy with a hummingbird sign"
        answer: 0
        why:
          - "صح: Huntington، الـ striatum بيضمر والبطينات تكبر. وبدأ بدري عن أبوه = anticipation."
          - "ده Parkinson."
          - "ده Alzheimer."
          - "ده PSP."
        page: 534
        quote: "Atrophy of caudate and putamen with ex vacuo ventriculomegaly."
      - kind: explain
        title: "Alzheimer: plaques بره و tangles جوه"
        text: |-
          أشهر سبب للـ dementia في الكبار، وأكبر عامل خطر **السن**. الـ **Down syndrome** بيجيله بدري لأن الـ ==APP على chromosome 21==.

          - **ApoE-4** بيزوّد الخطر و **ApoE-2** بيحمي («protwoctive»). APP و presenilin-1 و 2 = الأنواع العيلية.
          - **Senile plaques**: Aβ بره الخلية (من تكسير الـ APP)، ممكن تعمل amyloid angiopathy ونزيف.
          - **Neurofibrillary tangles**: tau جوه الخلية، و ==عددهم بيمشي مع شدة الـ dementia==.

          وقبل ما تقول dementia، دوّر على الأسباب اللي بتتعالج: depression، hypothyroidism، B12، neurosyphilis، و NPH.
        page: 534
        quote: "Neurofibrillary tangles B : intracellular, hyperphosphorylated tau protein = insoluble cytoskeletal elements; number of tangles correlates with degree of dementia."
      - kind: table
