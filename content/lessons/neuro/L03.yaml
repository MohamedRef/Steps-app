          - **Pituitary adenoma**: الأشهر **prolactinoma** (galactorrhea و amenorrhea عند الستات، ↓ libido عند الرجالة) ← dopamine agonists (cabergoline). ولو كبير يضغط الـ chiasm ← bitemporal hemianopia.
