        caption: "الـ focal يا إما الوعي سليم يا إما متأثر، وممكن ينتشر ويبقى 2° generalized. الـ generalized من الأول: absence (بصّة فاضية 10 ثواني و 3 Hz spike-and-wave، من غير postictal)، myoclonic (نفضات والوعي سليم)، tonic-clonic (تخشب ونفض و postictal confusion وعض لسان)، tonic، و atonic (يقع زي الإغماء)."
        alt: "Seizure classification tree. Focal seizures split into aware and impaired awareness with automatisms, and can spread to secondary generalized. Generalized seizures list absence with 3 Hz discharges and staring, myoclonic jerks, tonic-clonic with postictal confusion, tonic stiffening, and atonic drop attacks."
        page: 531
        quote: "Absence (petit mal)—3 Hz spike and-wave discharges on EEG; short (usually 10 seconds), frequent episodes of blank stare, possible automatisms; no postictal confusion."
      - kind: check
        question: "A 7-year-old girl has dozens of 10-second staring spells a day; she resumes her sentence afterward and the spells can be provoked by hyperventilation. What does the EEG show?"
        options:
          - "3 Hz spike-and-wave discharges"
          - "Focal temporal spikes"
          - "Periodic sharp waves"
          - "Normal EEG during events"
        answer: 0
        why:
          - "صح: absence seizure."
          - "الـ temporal focus بيعمل focal impaired awareness مع postictal."
          - "الـ periodic sharp waves بتاعة Creutzfeldt-Jakob."
          - "الـ EEG الطبيعي أثناء النوبة بيشاور على psychogenic nonepileptic events."
        page: 531
        quote: "Can be triggered by hyperventilation"
      - kind: explain
        title: "مين بيتشنج من إيه"
        text: |-
          الأسباب حسب السن:
          - أقل من 18: genetic، congenital، metabolic، infection (حتى الـ febrile)، trauma.
          - 18-65: trauma، infection، ==tumor==، stroke.
          - أكبر من 65: ==stroke== الأول، وبعده neurodegenerative و tumor.

          والـ **psychogenic nonepileptic events**: نوبة طويلة من غير postictal ولا عض لسان، مع ==video EEG طبيعي==.

          ملحوظة: الـ febrile seizures مش epilepsy.
        page: 531
        quote: "Adults >65: stroke, neurodegenerative disease, tumor, trauma, metabolic, infection"
