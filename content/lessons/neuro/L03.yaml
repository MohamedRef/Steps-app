      - kind: explain
        title: "Polio و SMA و ALS"
        text: |-
          - **Polio**: fecal-oral ← الـ anterior horn: ضعف LMN ==مش متماثل== مع أعراض meningitis.
          - **Spinal muscular atrophy**: جين SMN1 (AR) ← floppy baby و tongue fasciculations، ضعف ==متماثل==.
          - **ALS**: UMN + LMN من غير إحساس ولا مثانة. الوراثي SOD1. العلاج **riluzole** («riLouzole») و edaravone.
        page: 544
        quote: "LMN signs only (symmetric weakness). “Floppy baby” with marked hypotonia (flaccid paralysis) and tongue fasciculations."
      - kind: table
        title: "Brown-Séquard: نص حبل شوكي"
        columns: ["Tract", "Side", "Loss below the lesion"]
        rows:
