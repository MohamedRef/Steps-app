          - "دي بتنزف جوه المخ نفسه (putamen) مع الضغط العالي."
          - "الـ berry aneurysm بيعمل subarachnoid hemorrhage مع worst headache."
        page: 528
        quote: "Crescent-shaped hemorrhage (red arrows in C and D ) that crosses suture lines."
      - kind: explain
        title: "الـ subarachnoid: أسوأ صداع في حياتي"
        text: |-
          السبب: trauma أو انفجار **aneurysm** (berry) أو AVM. الصداع فجائي «==worst headache of my life==»، والـ LP دموي أو أصفر (**xanthochromia**).

          الخطر بعدين: ==vasospasm== بين يوم 3 و 10 من تكسير الدم ← ischemic infarct، و **nimodipine** بيحسّن النتيجة. وكمان ↑ خطر الـ hydrocephalus.

          الـ **intraparenchymal**: أغلبه من الضغط العالي (Charcot-Bouchard في الـ putamen)، وعند الكبار lobar ومتكرر ← **amyloid angiopathy**.
        page: 528
        quote: "Vasospasm can occur due to blood breakdown or rebleed 3-10 days after hemorrhage → ischemic infarct; nimodipine may improve neurologic outcome."
