        why: "الفك واللسان (LMN) بيتزقوا من الناحية السليمة فيميلوا ناحية الضعيفة («lick your wounds»). الـ uvula بتتشد من الناحية السليمة فتروح بعيد عن الإصابة. والـ UMN للسان بيعدّي فيبقى العكس."
