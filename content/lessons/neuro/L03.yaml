    steps:
      - kind: explain
        title: "الـ seizure على 3 مراحل"
        text: |-
          تفريغ كهربا متزامن وسريع. المراحل: **aura** (ريحة أو طعم غريب)، **ictal**، وبعدين **postictal** (رجوع تدريجي).

          الـ **focal** بيبدأ من حتة واحدة، أغلبها ==medial temporal lobe==:
          - **focal aware**: الوعي سليم.
          - **focal impaired awareness**: الوعي متأثر مع automatisms (لعق الشفايف، لعب في الهدوم).

          الـ **status epilepticus**: تشنج ==5 دقايق أو أكتر== أو تشنجات ورا بعض من غير ما يفوق.
        page: 531
        quote: "Convulsive status epilepticus—continuous (≥5 min) or recurring seizures without interictal return to baseline consciousness that may result in brain injury."
      - kind: figure
        title: "شجرة الـ seizures"
        svg: |-
          <svg viewBox="0 0 360 210" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL03b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
