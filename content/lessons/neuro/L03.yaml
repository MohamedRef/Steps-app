          - **Oligodendroglioma**: بطيء، في الـ frontal، فيه calcification. ==Fried egg== و chicken-wire capillaries.
          - **Meningioma**: ستات أكتر، **extra-axial** مع dural tail، whorls و ==psammoma bodies==.
        page: 540
        quote: "Can cross corpus callosum (“butterfly glioma” A ). Associated with EGFR amplification."
