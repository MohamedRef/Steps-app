      - kind: explain
        title: "Chiari: عدّ الحاجات اللي نزلت"
        text: |-
          الكتاب نفسه بيعدّ لك:
          - **Chiari I** = ==1 structure==: الـ cerebellar tonsils بس نزلت من الـ foramen magnum. غالباً ساكت في الطفولة، ويطلع في الكبر بـ headache وأعراض cerebellar، ومعاه **syringomyelia**.
          - **Chiari II** = ==2 structures==: الـ cerebellum (vermis و tonsils) **و** الـ medulla ← noncommunicating hydrocephalus. أتقل، بيبان بدري بـ dysphagia و stridor و apnea و limb weakness، ومعاه **myelomeningocele** (غالباً lumbosacral).
        page: 502
        quote: "Chiari II malformation Downward displacement of cerebellum (vermis and tonsils) and medulla (2 structures) through foramen magnum noncommunicating hydrocephalus. More severe than Chiari I, usually presents early in life with dysphagia, stridor, apnea, limb weakness. Associated with myelomeningocele (usually lumbosacral)."
      - kind: reveal
        prompt: "طفل Chiari II عنده dysphagia و stridor و apnea. ليه الأعراض دي بالذات؟"
        answer: "لأن الـ **medulla** نفسها نازلة ومضغوطة في الـ foramen magnum، والـ medulla فيها مراكز البلع والتنفس والأعصاب اللي بتحرك الحنجرة. فلما تتضغط: بلع صعب، stridor، وتنفس بيقف. (ربط تشريحي؛ الأعراض نفسها من الكتاب.)"
        page: 502
        quote: "More severe than Chiari I, usually presents early in life with dysphagia, stridor, apnea, limb weakness."
      - kind: explain
        title: "Dandy-Walker: الـ vermis مش موجود أصلاً"
        text: |-
          هنا مفيش حاجة نازلة. الـ ==cerebellar vermis== مش موجود (agenesis)، فالـ **4th ventricle** بيتنفخ ويبقى cyst مالي **posterior fossa** كبيرة.

          ومعاه noncommunicating hydrocephalus و spina bifida.
        page: 502
        quote: "Agenesis of cerebellar vermis cystic enlargement of 4th ventricle (arrow in B ) that fills the enlarged posterior fossa. Associated with noncommunicating hydrocephalus, spina bifida."
