      - kind: explain
        title: "ولما الـ syrinx يكبر"
        text: |-
          ممكن ينزل لتحت (غالباً ==C2-T9==) أو يطلع للـ brainstem ويبقى **syringobulbia**. وبيبدأ ياكل اللي حواليه:
          - **anterior horns** ← LMN weakness و atrophy في الإيدين والدراعات.
          - **lateral corticospinal tracts** ← spasticity أو الرجلين تدخل.
          - الحالات المتقدمة ← scoliosis و ==Charcot joints== ومشاكل في المثانة والأمعاء.
          - لو وصل الـ medulla ← dysphagia ومشاكل في التنفس.

          وأشهر حاجة معاه: **Chiari I**؛ وأقل: عيوب خلقية تانية، trauma، infection أو tumor.
        page: 502
        quote: "Anterior horns → LMN weakness/atrophy (hands, arms) ▘ Lateral corticospinal tracts → spasticity or leg involvement Advanced cases → scoliosis, Charcot joints, bladder/bowel dysfunction. If syrinx reaches medulla → dysphagia, respiratory compromise."
