schema: steps.lesson/v1
lecture: neuro.L05
lessons:
  - id: neuro.L05.lesson1
    title: "الدوخة والعين من قدّام: من الـ conjunctiva للـ glaucoma"
    hook: "عين حمرا ممكن تبقى حاجة بسيطة تخف لوحدها، وممكن تبقى طوارئ هتعمي المريض لو اديته القطرة الغلط"
    minutes: 10
    pages: [549, 551]
    topics: [vertigo, normal-eye-anatomy, conjunctivitis, lens-disorders, refractive-errors, aqueous-humor-pathway, glaucoma]
    goals:
      - "تفرّق الـ vertigo الطرفي عن المركزي"
      - "تعرف نوع الـ conjunctivitis من الإفرازات والسن"
      - "تفهم طريق الـ aqueous humor وأدوية الـ glaucoma"
      - "تفرّق open-angle عن acute angle-closure"
    status: unverified
    steps:
      - kind: explain
        remind: [neuro.L05.003]
        title: "الدوخة: من الودن ولّا من المخ؟"
        text: |-
          الـ vertigo = إحساس إن الدنيا بتلف وإنت واقف.

          - **طرفي** (الأشهر): الودن الداخلية. **BPPV**: فتافيت في الـ semicircular canal، نوبات ==أقل من دقيقة== مع حركة الراس (Dix-Hallpike للتشخيص و Epley للعلاج). **Ménière**: ↑ endolymph ← vertigo و sensorineural loss و tinnitus («men wear vests»).
          - **مركزي**: جذع المخ أو الـ cerebellum (stroke، MS، ورم).

          الفرق في الـ nystagmus: الطرفي horizontal-torsional و ==بيتلم لما يركّز على حاجة==. المركزي أي اتجاه (حتى vertical) ومش بيتلم، ومعاه diplopia أو ataxia.
        page: 549
        quote: "Findings: mixed horizontal-torsional nystagmus (never purely torsional or vertical) that does not change direction and is suppressible with visual fixation."
      - kind: check
        question: "A woman has brief spinning spells only when she rolls over in bed; each lasts 30 seconds. What treats it?"
        options:
          - "Epley maneuver"
          - "Dix-Hallpike maneuver"
          - "Urgent brain MRI and tPA"
          - "Diuretics for endolymphatic hydrops"
        answer: 0
        why:
          - "صح: BPPV، والـ Epley بيرجّع الفتافيت مكانها."
          - "الـ Dix-Hallpike للتشخيص مش للعلاج."
          - "مافيش علامات مركزية."
          - "ده Ménière، معاه صمم وطنين."
        page: 549
        quote: "episodic vertigo lasting ≤1 minute provoked by certain head movements (diagnosed via Dix-Hallpike maneuver, treated via Epley maneuver)"
      - kind: match
        prompt: "وصّل كل نوع conjunctivitis بالـ clue بتاعه"
        pairs:
          - ["Viral", "Adenovirus, preauricular node, self-resolving"]
          - ["Bacterial", "Purulent discharge, antibiotics"]
          - ["Allergic", "Itchy, both eyes"]
          - ["Neonatal chlamydia", "Day 5-14, azithromycin"]
          - ["Neonatal gonorrhea", "Day 2-5, ceftriaxone"]
        why: "الـ viral الأشهر ويخف لوحده. وفي حديثي الولادة الـ gonorrhea أسرع (2-5 أيام) وأخطر، والـ chlamydia أشهر وبتيجي متأخرة (5-14)."
        page: 549
        quote: "C trachomatis serotypes D-K (most common)—onset 5-14 days after birth; treat with erythromycin or azithromycin."
      - kind: explain
        title: "العدسة والنظر"
        text: |-
          - **Presbyopia**: العدسة بتنشف مع السن فمش قادر يقرا قريب.
          - **Cataract**: العدسة تعتّم من غير ألم: glare، الـ red reflex يروح، والنظر يقل بالليل. افتكر الـ congenital: ==galactosemia==، trisomies، rubella، Marfan.
          - **Lens dislocation**: trauma، Marfan، homocystinuria.

          النظر: **myopia** (العين طويلة، الصورة قدّام الشبكية) ← ==concave==. **hyperopia** (قصيرة، ورا) ← convex. **astigmatism** ← cylindrical.
        page: 550
        quote: "Eye too long for refractive power of cornea and lens → light focused in front of retina. Correct with concave (diverging) lens."
      - kind: figure
        title: "الـ aqueous humor: يتعمل فين ويخرج منين"
        svg: |-
          <svg viewBox="0 0 360 232" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL05a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0 0 L10 5 L0 10 z"/></marker></defs>
            <path class="fg-box" d="M60 14 Q4 110 60 206" fill="none"/>
            <text x="2" y="114" class="t-sm t-mut">cornea</text>
            <rect class="fg-ink" x="98" y="16" width="9" height="76" rx="3"/>
            <rect class="fg-ink" x="98" y="128" width="9" height="76" rx="3"/>
            <text x="96" y="226" class="t-sm t-mut">iris</text>
            <ellipse class="fg-box" cx="160" cy="110" rx="24" ry="52"/>
            <text x="146" y="114" class="t-sm t-mut">lens</text>
            <rect class="fg-good" x="114" y="2" width="56" height="22" rx="6"/>
            <text x="120" y="17" class="t-sm">ciliary</text>
            <line class="fg-arrow-acc" x1="124" y1="28" x2="120" y2="96" marker-end="url(#nL05a)"/>
            <line class="fg-arrow-acc" x1="118" y1="110" x2="86" y2="102" marker-end="url(#nL05a)"/>
            <line class="fg-arrow-acc" x1="80" y1="92" x2="80" y2="34" marker-end="url(#nL05a)"/>
            <circle class="fg-dot-bad" cx="82" cy="22" r="6"/>
            <text x="36" y="13" class="t-sm t-bad">angle</text>
            <text x="220" y="30" class="t-sm t-b">Made: ciliary body</text>
            <text x="220" y="46" class="t-sm">↓ by β-blocker,</text>
            <text x="220" y="62" class="t-sm">α2-agonist,</text>
            <text x="220" y="78" class="t-sm">acetazolamide</text>
            <text x="220" y="96" class="t-sm t-b">Out 90%: trabecular</text>
            <text x="220" y="112" class="t-sm">meshwork → Schlemm</text>
            <text x="220" y="128" class="t-sm">↑ by pilocarpine (M3)</text>
            <text x="220" y="162" class="t-sm t-b">Out 10%: uveoscleral</text>
            <text x="220" y="178" class="t-sm">↑ by latanoprost</text>
          </svg>
        caption: "الـ ciliary body بيعمل الـ aqueous في الـ posterior chamber، يعدّي من الـ pupil للـ anterior chamber، ويخرج عند الـ angle (النقطة الحمرا) من الـ trabecular meshwork للـ canal of Schlemm. أي دوا للـ glaucoma يا إما بيقلل التصنيع يا إما بيزوّد الخروج."
        alt: "Side view of the front of the eye: cornea, iris, lens and ciliary body. Arrows show aqueous humor made by the ciliary body flowing between iris and lens, through the pupil into the anterior chamber, and out at the angle. Side notes: production is reduced by beta-blockers, alpha-2 agonists and acetazolamide; 90 percent leaves through the trabecular meshwork to the canal of Schlemm, increased by pilocarpine; 10 percent leaves by the uveoscleral route, increased by latanoprost."
        page: 550
        quote: "Produced by nonpigmented epithelium on ciliary body"
      - kind: check
        question: "Which glaucoma drug lowers pressure by increasing uveoscleral outflow?"
        options:
          - "Latanoprost"
          - "Timolol"
          - "Acetazolamide"
          - "Brimonidine"
        answer: 0
        why:
          - "صح: الـ prostaglandin agonists بتفتح الطريق التاني (uveoscleral)."
          - "Timolol بيقلل التصنيع."
          - "Acetazolamide بيقلل التصنيع."
          - "Brimonidine بيقلل التصنيع."
        page: 550
        quote: "Drainage into uvea and sclera with prostaglandin agonists (eg, latanoprost, bimatoprost)"
      - kind: table
        title: "Open-angle × Acute angle-closure"
        columns: ["", "Open-angle", "Acute angle-closure"]
        rows:
          - ["Angle", "Open; trabecular resistance ↑", "Closed by the iris (pupillary block)"]
          - ["Symptoms", "None; found incidentally, peripheral loss", "Severe pain, halos, headache, vomiting, red eye"]
          - ["Pupil", "Normal", "Fixed, mid-dilated"]
          - ["Treatment", "Prostaglandins or β-blockers", "β-blocker, α2-agonist, pilocarpine, acetazolamide, mannitol; NO mydriatics"]
        hide: [[1, 2], [2, 2], [3, 2]]
        page: 551
        quote: "Presents with severe eye pain, conjunctival erythema C , sudden vision loss, halos around lights, headache, fixed and mid-dilated pupil, nausea and vomiting."
      - kind: aside
        tone: trap
        text: "واحدة كبيرة نزّلوا لها قطرة توسيع للحدقة وبعد ساعة عينها وجعتها وشايفة ==halos== وبترجّع: ده **acute angle-closure**، والـ mydriatic هو اللي فجّره. «Hurts in a hurry with halos, a headache, and a half-dilated pupil». أوعى تدي atropine أو أي موسّع."
        page: 551
        quote: "Mydriatic agents are contraindicated."
      - kind: check
        question: "Why does pilocarpine help in acute angle-closure glaucoma?"
        options:
          - "It constricts the pupil and pulls the iris away from the angle"
          - "It blocks aqueous production by the ciliary body"
          - "It increases uveoscleral outflow"
          - "It dehydrates the vitreous osmotically"
        answer: 0
        why:
          - "صح: M3 agonist، بيقفل الـ pupil فيشد الـ iris بعيد عن الـ angle، وبيفتح الـ trabecular meshwork."
          - "ده شغل الـ β-blockers والـ acetazolamide."
          - "ده الـ latanoprost."
          - "ده الـ mannitol."
        page: 550
        quote: "with M3 agonist (eg, carbachol, pilocarpine)"
      - kind: reveal
        prompt: "كل أدوية وعمليات الـ glaucoma بتعمل حاجة واحدة. إيه هي، وليه؟"
        answer: "==بتنزّل الـ IOP== (pharmacologic أو surgical). الـ glaucoma هو optic neuropathy بيضيّع النظر من الأطراف للنص، والضغط العالي هو اللي بيعصر ألياف الـ optic nerve عند الـ disc (cupping). نزّل الضغط = ==وقف التلف==، بس اللي راح مابيرجعش."
        page: 551
        quote: "Optic neuropathy causing progressive vision loss (peripheral → central). Usually, but not always, accompanied by ↑ intraocular pressure (IOP). Etiology is most often 1°, but can be 2° to an identifiable cause (eg, uveitis, glucocorticoids). Funduscopy: optic disc cupping (normal A vs thinning of outer rim of optic disc B ). Treatment: pharmacologic or surgical lowering of IOP."
      - kind: try
        items: [neuro.L05.002, neuro.L05.004, neuro.L05.009, neuro.L05.015, neuro.L05.018]
    recap:
      - "Vertigo طرفي: nystagmus بيتلم بالتركيز؛ مركزي: vertical ومعاه علامات."
      - "Neonatal gonorrhea 2-5 أيام (ceftriaxone)، chlamydia 5-14 (azithromycin)."
      - "Myopia = concave، hyperopia = convex."
      - "التصنيع ↓ بـ timolol و brimonidine و acetazolamide؛ الخروج ↑ بـ pilocarpine و latanoprost."
      - "Acute angle-closure: halos و pupil نص موسعة، ممنوع الـ mydriatics."
    practice: [neuro.L05.001, neuro.L05.115, neuro.L05.002, neuro.L05.003, neuro.L05.004, neuro.L05.005, neuro.L05.006, neuro.L05.007, neuro.L05.008, neuro.L05.009, neuro.L05.086, neuro.L05.010, neuro.L05.011, neuro.L05.012, neuro.L05.013, neuro.L05.014, neuro.L05.015, neuro.L05.087, neuro.L05.016, neuro.L05.017, neuro.L05.018, neuro.L05.113, neuro.L05.114, neuro.L05.020, neuro.L05.021, neuro.L05.022, neuro.L05.023, neuro.L05.100, neuro.L05.101, neuro.L05.088, neuro.L05.024, neuro.L05.102, neuro.L05.103, neuro.L05.104, neuro.L05.105, neuro.L05.025, neuro.L05.089, neuro.L05.026, neuro.L05.027, neuro.L05.028, neuro.L05.084, neuro.L05.116, neuro.L05.117, neuro.L05.118, neuro.L05.125]
  - id: neuro.L05.lesson2
    title: "الشبكية والـ pupil: اقرا الـ fundus"
    hook: "الـ fundus بيورّيك السكر والضغط والجلطة والورم، كل واحد بشكل"
    minutes: 10
    pages: [552, 554]
    topics: [retinal-disorders, papilledema, leukocoria, uveitis, pupillary-control]
    goals:
      - "تتعرف على أمراض الشبكية من شكل الـ fundus"
      - "تفهم الـ retinopathy of prematurity بالـ VEGF"
      - "تمشي طريق الـ pupil الـ parasympathetic والـ sympathetic"
      - "تفهم الـ RAPD"
    status: unverified
    steps:
      - kind: table
        title: "الـ fundus بيقول إيه"
        columns: ["Disease", "Fundus clue"]
        rows:
          - ["Dry macular degeneration", "Drusen"]
          - ["Nonproliferative diabetic", "Microaneurysms, hemorrhages, cotton-wool spots, hard exudates"]
          - ["Hypertensive", "AV nicking, macular star; papilledema = emergency"]
          - ["Retinal artery occlusion", "Cloudy retina, cherry-red spot"]
          - ["Retinal vein occlusion", "Blood and thunder"]
          - ["Retinitis pigmentosa", "Bone spicules, pale disc, thin vessels"]
        hide: [[0, 1], [3, 1], [4, 1], [5, 1]]
        page: 552
        quote: "Funduscopy: cloudy retina with “cherry-red” spot at fovea D"
      - kind: explain
        title: "ليه الـ cherry-red spot؟"
        text: |-
          الشبكية كلها بتاخد دم من الـ central retinal artery، فلما تتسد تبقى ==باهتة ومنفوخة==. بس الـ fovea رفيعة جداً وبتاخد من الـ choroid اللي تحتها، فالأحمر بتاعه يبان من خلالها كنقطة حمرا.

          السبب غالباً **embolus** من الـ carotid (ممكن تشوف cholesterol crystal أصفر لامع)، وأقل الـ giant cell arteritis. فقدان نظر ==مفاجئ ومن غير ألم== في عين واحدة.
        page: 552
        quote: "Blockage of central or branch retinal artery usually due to embolism (carotid artery atherosclerosis > cardiogenic); less commonly due to giant cell arteritis."
      - kind: check
        question: "A 65-year-old has flashes and floaters for a day, then a dark curtain falling over the vision of one eye. What is it?"
        options:
          - "Retinal detachment"
          - "Retinal artery occlusion"
          - "Acute angle-closure glaucoma"
          - "Optic neuritis"
        answer: 0
        why:
          - "صح: الـ posterior vitreous detachment بيشد الشبكية فتتقطع، وده surgical emergency."
          - "ده فقدان مفاجئ من غير flashes ولا ستارة."
          - "ده بيوجع ومعاه halos."
          - "ده بيوجع مع حركة العين عند الشباب."
        page: 552
        quote: "Commonly presents with symptoms of posterior vitreous detachment (eg, floaters, light flashes) followed by painless monocular vision loss (“dark curtain”)."
      - kind: aside
        tone: exam
        text: "الـ **retinal detachment** في الـ fundus: الشبكية المنفصلة ==معتمة ومكرمشة== (opacification and wrinkling)، والأوعية بتغيّر اتجاهها فجأة عند حافة الانفصال لأنها راكبة على شبكية مرفوعة. وده ==surgical emergency==: الشبكية بعيدة عن الـ choroid ← الـ photoreceptors بتموت من نقص الأكسجين."
        page: 552
        quote: "Funduscopy: opacification and wrinkling of detached retina F , change in vessel direction. Surgical emergency."
      - kind: order
        prompt: "رتّب اللي بيحصل في retinopathy of prematurity"
        steps:
          - "Preterm birth: relative hyperoxia (worse with oxygen)"
          - "↓ VEGF stops normal retinal vessel growth"
          - "The eye grows and the avascular retina becomes hypoxic"
          - "↑ VEGF drives abnormal neovascularization"
          - "Tractional retinal detachment"
        why: "نفس فكرة الـ proliferative diabetic retinopathy: hypoxia ← VEGF ← أوعية جديدة هشة بتشد الشبكية."
        page: 552
        quote: "As the eyes grow → hypoxia of avascular retina → ↑ VEGF → retinal neovascularization (may cause tractional retinal detachment)."
      - kind: explain
        title: "Retinoblastoma"
        text: |-
          أشهر ورم خبيث جوه عين الأطفال. لازم الـ **RB1** الاتنين على ==chromosome 13== يبوظوا (الجين ده طبيعي بيفرمل الخلية من G1 لـ S). ممكن sporadic، أو وراثي: الطفل بيتولد بنسخة بايظة والتانية تبوظ بعدين (loss of heterozygosity).

          بيبان كـ **leukocoria** أو حَوَل أو nystagmus أو عين حمرا.
        page: 552
        quote: "Caused by mutations to both RB1 tumor suppressor genes on chromosome 13, which normally impede G1 → S phase progression. Can be sporadic or familial (loss of heterozygosity)."
      - kind: explain
        title: "Leukocoria و uveitis"
        text: |-
          - **Leukocoria** = الـ red reflex يبقى أبيض (بيبان في صور الفلاش). عند طفل افتكر retinoblastoma أو ==congenital cataract==.
          - **Uveitis**: anterior = iritis، posterior = choroiditis أو retinitis. ممكن hypopyon (صديد في الـ anterior chamber). افتكر sarcoidosis، Behçet، JIA، و ==HLA-B27==.
        page: 553
        quote: "Loss (whitening) of the red reflex. Important causes in children include retinoblastoma A , congenital cataract."
      - kind: check
        question: "Both optic discs are elevated with blurred margins in a woman with morning headaches. What is the mechanism?"
        options:
          - "Raised intracranial pressure impairs axoplasmic flow"
          - "Raised intraocular pressure cups the disc"
          - "Demyelination of the optic nerve"
          - "Central retinal artery embolus"
        answer: 0
        why:
          - "صح: papilledema."
          - "ده glaucoma، الديسك بيتجوّف مش بيتنفخ."
          - "الـ optic neuritis غالباً عين واحدة ومعاها ألم ونظر قليل."
          - "ده cherry-red spot مش ديسك منفوخ."
        page: 553
        quote: "Optic disc swelling (usually bilateral) due to ↑ ICP (eg, 2° to mass effect). Results from impaired axoplasmic flow in optic nerve."
      - kind: figure
        title: "طريق الـ pupil: يقفل ويفتح"
        svg: |-
          <svg viewBox="0 0 360 230" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="nL05b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head" d="M0 0 L10 5 L0 10 z"/></marker></defs>
            <text x="10" y="18" class="t-sm t-b t-good">Constrict (parasympathetic)</text>
            <rect class="fg-good" x="10" y="28" width="96" height="30" rx="6"/>
            <text x="16" y="47" class="t-sm">Edinger-Westphal</text>
            <line class="fg-arrow" x1="106" y1="43" x2="134" y2="43" marker-end="url(#nL05b)"/>
            <text x="108" y="36" class="t-sm t-mut">III</text>
            <rect class="fg-good" x="136" y="28" width="88" height="30" rx="6"/>
            <text x="142" y="47" class="t-sm">Ciliary ganglion</text>
            <line class="fg-arrow" x1="224" y1="43" x2="252" y2="43" marker-end="url(#nL05b)"/>
            <rect class="fg-good" x="254" y="28" width="96" height="30" rx="6"/>
            <text x="260" y="47" class="t-sm">Sphincter (M3)</text>
            <text x="190" y="74" class="t-sm t-mut">short ciliary nn.</text>
            <text x="10" y="108" class="t-sm t-b t-bad">Dilate (sympathetic)</text>
            <rect class="fg-bad" x="10" y="118" width="96" height="30" rx="6"/>
            <text x="16" y="137" class="t-sm">Hypothalamus</text>
            <line class="fg-arrow" x1="106" y1="133" x2="134" y2="133" marker-end="url(#nL05b)"/>
            <rect class="fg-bad" x="136" y="118" width="88" height="30" rx="6"/>
            <text x="142" y="137" class="t-sm">Budge C8-T2</text>
            <line class="fg-arrow" x1="224" y1="133" x2="252" y2="133" marker-end="url(#nL05b)"/>
            <rect class="fg-bad" x="254" y="118" width="96" height="30" rx="6"/>
            <text x="258" y="137" class="t-sm">Sup. cervical gg.</text>
            <line class="fg-arrow" x1="302" y1="148" x2="302" y2="176" marker-end="url(#nL05b)"/>
            <rect class="fg-bad" x="214" y="178" width="136" height="30" rx="6"/>
            <text x="220" y="197" class="t-sm">Dilator (α1) via carotid</text>
            <text x="10" y="176" class="t-sm t-mut">2nd neuron exits T1,</text>
            <text x="10" y="192" class="t-sm t-mut">passes the lung apex</text>
            <text x="10" y="222" class="t-sm t-mut">3rd: carotid, cavernous sinus, long ciliary</text>
          </svg>
        caption: "القفل parasympathetic من نيورونين: Edinger-Westphal ← CN III ← ciliary ganglion ← short ciliary nerves ← sphincter. الفتح sympathetic من 3: الـ hypothalamus ← center of Budge (C8-T2) ← يطلع عند T1 جنب قمة الرئة للـ superior cervical ganglion ← يمشي على الـ internal carotid والـ cavernous sinus ← long ciliary nerves ← dilator. «Short بيقصّر الـ pupil، long بيطوّلها»."
        alt: "Two pathways. Top, parasympathetic constriction: Edinger-Westphal nucleus, through CN III to the ciliary ganglion, then short ciliary nerves to the sphincter pupillae (M3). Bottom, sympathetic dilation: hypothalamus to the ciliospinal center of Budge at C8-T2, then a second neuron exiting at T1 past the lung apex to the superior cervical ganglion, then a third neuron along the internal carotid artery and cavernous sinus to the dilator (alpha-1) via long ciliary nerves."
        page: 554
        quote: "1st neuron: hypothalamus to ciliospinal center of Budge (C8-T2)"
      - kind: explain
        title: "الـ RAPD (Marcus Gunn)"
        text: |-
          النور في أي عين بيقفل ==الاتنين== (direct و consensual)، لأن الـ pretectal nuclei بتشغّل الـ Edinger-Westphal في الناحيتين.

          لو العصب البصري في عين واحدة تعبان (optic neuritis مثلاً): لما تنقل النور بسرعة من السليمة للتعبانة، المخ «يحس» بنور أقل، ==فالاتنين يوسعوا== بدل ما يقفلوا. ده عيب في الطرف الداخل (afferent)، والطرف الخارج سليم.
        page: 554
        quote: "When light shines into a normal eye, constriction of the ipsilateral eye (direct reflex) and contralateral eye (consensual reflex) is observed."
      - kind: check
        question: "Shining light in the left eye constricts only the left pupil; shining it in the right eye also constricts only the left pupil. Where is the lesion?"
        options:
          - "Right oculomotor nerve (efferent)"
