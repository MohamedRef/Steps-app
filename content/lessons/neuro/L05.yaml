        title: "الـ cavernous sinus"
        text: |-
          بيعدّي فيه CN III و IV و ==V1 و V2== و VI والـ sympathetic والـ internal carotid. فالإصابة (ورم pituitary، carotid-cavernous fistula، أو thrombosis من التهاب في الوش) بتعمل ophthalmoplegia + ↓ corneal sensation + Horner.
        page: 557
        quote: "CNs III, IV, V1, V2, and VI plus postganglionic sympathetic pupillary fibers en route to orbit all pass through cavernous sinus."
      - kind: explain
        title: "الـ INO"
        text: |-
          - **INO**: الـ MLF بيربط الـ CN VI بالـ CN III في الناحية التانية. لو اتقطع: العين اللي في ==نفس الناحية مش بتدخل لجوه== (adduction)، والعين التانية بترقص (nystagmus)، والـ convergence سليمة. في الناحيتين = **MS**.
        page: 558
        quote: "Lack of communication such that when CN VI nucleus activates ipsilateral lateral rectus, contralateral CN III nucleus does not stimulate medial rectus to contract."
      - kind: reveal
        prompt: "في الـ INO، العين اللي بتبص للجنب (abducting) بترعش. ليه هي بالذات؟"
        answer: "الـ MLF مقطوع، فالـ CN III مش واصله أمر الـ adduction. الـ CN VI بيحاول يعوّض و==بيـ overfire== علشان يشغّل الـ CN III، فالعين اللي بتعمل abduction بتاخد زيادة وتعمل nystagmus. والـ convergence سليم لأنه مش ماشي في الـ MLF."
        page: 558
        quote: "Abducting eye displays nystagmus (CN VI overfires to stimulate CN III). Convergence normal."
      - kind: check
        question: "Looking left, the right eye stops at the midline and the left eye jerks; convergence is normal. Name it."
