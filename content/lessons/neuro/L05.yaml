      - kind: explain
        title: "Horner: الـ sympathetic مقطوع"
        text: |-
          الثلاثي: ==ptosis خفيفة== (superior tarsal muscle)، **miosis**، و **anhidrosis** في نفس ناحية الوش.

          مكان القطع حسب النيورون:
          - الأول: pons، lateral medullary (Wallenberg)، حبل شوكي فوق T1.
          - التاني: ==Pancoast tumor== بيضغط الـ stellate ganglion.
          - التالت: **carotid dissection** (بيوجع)، وغالباً من غير anhidrosis لأن ألياف العرق بتمشي مع الـ external carotid.
        page: 555
        quote: "3rd neuron: carotid dissection (painful); anhidrosis is usually absent"
      - kind: mnemonic
        word: "LR6SO4R3"
        parts:
          - { key: "LR6", text: "Lateral rectus: CN VI" }
          - { key: "SO4", text: "Superior oblique: CN IV" }
          - { key: "R3", text: "The rest: CN III" }
        hook: "«المعادلة الكيميائية» بتاعة العين: LR6 SO4 R3. والـ obliques بتتختبر بالعكس: الـ left superior و inferior obliques وهو باصص يمين."
        page: 555
        quote: "CN VI innervates the Lateral Rectus. CN IV innervates the Superior Oblique. CN III innervates the Rest."
      - kind: check
        question: "After a punch to the eye, a boy cannot look up with that eye and has a numb cheek. What happened?"
        options:
          - "Orbital floor blowout fracture trapping the inferior rectus"
          - "CN IV palsy"
          - "Medial wall fracture trapping the medial rectus"
          - "Carotid dissection"
        answer: 0
        why:
          - "صح: أرضية الـ orbit (maxillary bone) اتكسرت، الـ inferior rectus اتحبس فالبص لفوق بيعمل diplopia، والـ infraorbital nerve اتأثر."
          - "الـ CN IV palsy بيعمل مشكلة في البص لتحت ومن غير تنميل."
          - "الـ medial rectus بيأثر على الحركة الأفقية."
          - "ده Horner مش مشكلة حركة."
        page: 555
        quote: "diplopia (especially on upward gaze) and enophthalmos due to IR muscle A +/– orbital fat entrapment. May injure infraorbital nerve."
      - kind: explain
        title: "CN III: جوه ولّا بره؟"
        text: |-
          تخيّل الـ CN III سلك: الألياف الـ **motor في النص**، والألياف الـ **parasympathetic (للـ pupil) على السطح**، والأوعية اللي بتغذيه ماشية بره.

          - **Ischemia (السكر)**: النص بيجوع الأول ← ptosis و down-and-out بس ==الـ pupil سليمة==.
          - **ضغط (PCom aneurysm، uncal herniation)**: السطح بيتضغط الأول ← ==blown pupil== (+/− down-and-out).

          والـ **CN IV**: العين أعلى، والراس مايلة للناحية السليمة، ومش قادر ينزل السلم. **CN VI**: العين مش بتطلع بره.
        page: 556
        quote: "Ischemia → pupil sparing (motor fibers affected more than parasympathetic fibers)"
      - kind: check
        question: "A woman with a sudden severe headache has a dilated, unreactive left pupil with ptosis. What must be excluded first?"
        options:
          - "Posterior communicating artery aneurysm"
          - "Diabetic CN III ischemia"
          - "Myasthenia gravis"
          - "Horner syndrome"
        answer: 0
        why:
          - "صح: CN III palsy بالـ pupil = ضغط، وصداع مفاجئ = aneurysm لحد ما يثبت العكس."
          - "الـ ischemia بتسيب الـ pupil سليمة."
          - "الـ myasthenia مش بتأثر على الـ pupil."
          - "الـ Horner بيعمل pupil صغيرة مش موسعة."
        page: 556
        quote: "PCom aneurysm → sudden-onset headache"
