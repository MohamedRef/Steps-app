        caption: "الألياف الـ nasal بتعدّي في الـ chiasm، فقبله الإصابة بتضرب عين واحدة، وفيه بتضرب الـ temporal fields الاتنين، وبعده بتضرب نفس النص من المجال في العينين (homonymous) عكس ناحية الإصابة. الـ Meyer loop (المنقّط) بيلف في الـ temporal وشايل الجزء اللي فوق من المجال («pie in the sky»)، والـ parietal شايل اللي تحت."
