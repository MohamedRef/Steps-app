schema: steps.lesson/v1
lecture: phs.L03
lessons:
  - id: phs.L03.lesson1
    title: "المقابلة اللي المريض فيها هو المحور: الأساليب والـ PEARLS والإعاقة"
    hook: "الإجابة الصح في أسئلة الـ communication غالباً هي اللي بتخلي المريض يتكلم أكتر"
    minutes: 7
    pages: [271, 271]
    topics: [patient-centered-interviewing, establishing-rapport, patients-with-disabilities]
    goals:
      - "تسمّي أسلوب المقابلة من الجملة اللي الدكتور قالها"
      - "تحفظ الـ PEARLS وتطلّع كل عنصر من مثال"
      - "تعرف تتكلم صح مع مريض عنده إعاقة"
    status: unverified
    steps:
      - kind: explain
        title: "أساليب المقابلة"
        text: |-
          - **Introduction**: عرّف نفسك، واسأل المريض عن اسمه وإزاي يحب تناديه، واستخدم الاسم والـ pronouns اللي قالها. ==اقعد في مستوى عينه==، قريب منه، ووشك ليه.
          - **Agenda setting**: agenda مشتركة للمشاكل والأهداف.
          - **Reflection**: سماع نشط وتجميع اللي قاله، خصوصاً الشكوى الأساسية.
          - **Validation**: تأكيد إن وجهة نظره مقبولة.
          - **Recapitulation**: تلخيص اللي قاله لحد دلوقتي عشان تتأكد إنك فهمت صح.
          - **Facilitation**: تشجعه يتكلم بحرية ==من غير leading questions==، وتسيبه يسأل طول المقابلة.
        page: 271
        quote: "Introduce yourself and ask the patient their name and how they would like to be addressed."
      - kind: check
        question: "\"Please go on, tell me more about that.\" Which technique is this?"
        options:
          - "Facilitation"
          - "Recapitulation"
          - "Validation"
          - "Agenda setting"
        answer: 0
        why:
          - "صح: بتشجعه يتكلم بحرية من غير ما توجّه الإجابة."
          - "الـ recapitulation تلخيص للي قاله."
          - "الـ validation تأكيد إن وجهة نظره مقبولة."
          - "الـ agenda setting تحديد المشاكل والأهداف مع بعض."
        page: 271
        quote: "Facilitation Encourage the patient to speak freely without guiding responses or leading questions."
      - kind: mnemonic
        word: "PEARLS"
        parts:
          - { key: "P", text: "Partnership: work together on concerns and preferred solutions" }
          - { key: "E", text: "Empathy: acknowledge emotions and show you understand why" }
          - { key: "A", text: "Apology: take personal responsibility when appropriate" }
          - { key: "R", text: "Respect: commend the patient for coming in or pushing through" }
          - { key: "L", text: "Legitimization: emotional responses are understandable or common" }
          - { key: "S", text: "Support: we'll work through this together; offer resources" }
        hook: "الكتاب بيسميها PEARLS: لؤلؤ بتبني بيه الـ rapport."
        page: 271
        quote: "Establishing rapport PEARLS Partnership Work together with patient to identify primary concerns and develop preferred solutions."
      - kind: match
        prompt: "وصّل الجملة بعنصر الـ PEARLS بتاعها"
        pairs:
          - ["\"Let's figure out a plan together.\"", "Partnership"]
          - ["\"I can see this news has upset you.\"", "Empathy"]
          - ["\"I'm sorry, I should have called you sooner.\"", "Apology"]
          - ["\"It took courage to come in today.\"", "Respect"]
          - ["\"Many people feel angry after a diagnosis like this.\"", "Legitimization"]
          - ["\"I'll be with you through this, and here is a support group.\"", "Support"]
        why: "الفرق الدقيق: الـ Empathy إنك تشوف مشاعره وتفهم سببها، والـ Legitimization إنك تقوله إن المشاعر دي طبيعية وعادية."
        page: 271
        quote: "Empathy Acknowledge the emotions displayed and demonstrate understanding of why the patient is feeling that way."
      - kind: figure
        title: "المريض صاحب الإعاقة: اتكلم معاه هو"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="ph3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <circle class="fg-box" cx="50" cy="60" r="22"/>
            <text x="28" y="105" class="t-sm t-b">Physician</text>
            <circle class="fg-acc" cx="190" cy="60" r="22"/>
            <text x="172" y="105" class="t-sm t-b">Patient</text>
            <circle class="fg-box" cx="310" cy="60" r="18"/>
            <text x="285" y="105" class="t-sm t-mut">Caregiver</text>
            <line class="fg-arrow-acc" x1="75" y1="60" x2="164" y2="60" marker-end="url(#ph3a)"/>
            <text x="85" y="50" class="t-sm t-acc">talk directly</text>
            <line class="fg-thin" x1="290" y1="60" x2="215" y2="60"/>
            <text x="225" y="50" class="t-sm t-mut">adds info</text>
            <text x="10" y="135" class="t-sm">Speech: extra time, write, rephrase, repeat back</text>
            <text x="10" y="152" class="t-sm">Cognitive: concrete words, simple questions, no noise</text>
            <text x="10" y="169" class="t-sm">Lipreading: face them, no noise, speak as usual</text>
          </svg>
        caption: "الكلام بيروح للمريض نفسه، واللي معاه بيضيف معلومات لو احتجنا. وكل نوع إعاقة ليه تعديل بسيط."
        alt: "Physician with an arrow labelled talk directly to the highlighted patient; a caregiver beside the patient with a thin line labelled adds info. Below, three lines of tips for speech difficulty, cognitive impairment and lipreading."
        page: 271
        quote: "Under most circumstances, talk directly to the patient. Do not assume that nonverbal patients do not understand. Accompanying caregivers can add information to any discussion as needed."
      - kind: explain
        title: "قواعد عامة مع الإعاقة"
        text: |-
          - اسأل المريض بيحب **person-first** ("a person with a disability") ولا **identity-first** ("a disabled person").
          - ==اسأل لو محتاج مساعدة== بدل ما تفترض إنه مش قادر، لأن معظم الناس بيقدّروا استقلالهم.
          - الأصم: اسأله يحب يتواصل إزاي، ونبّهه بلمسة خفيفة أو بإشارة، واستخدم interpreter لو لزم.
          - ما تجيبش سيرة الإعاقة لو مالهاش علاقة بالزيارة (مريض على wheelchair جاي بـ ear infection)، بس ==ما تسيبش جزء مهم من الكشف== حتى لو صعب.
        page: 271
        quote: "Do not skip relevant parts of the physical exam even if the disability makes the exam challenging."
      - kind: check
        question: "A deaf patient who lipreads is in a noisy exam room. What should you do?"
        options:
          - "Reduce the noise, face her, and speak normally"
          - "Speak louder and more slowly"
          - "Talk to her companion instead"
          - "Communicate only in writing"
        answer: 0
        why:
          - "صح: شيل الدوشة، وبص لها، وما تغيّرش طريقة كلامك."
          - "الكتاب بيقول do not change your mode of speaking."
          - "الكلام بيكون مع المريضة نفسها."
          - "اسألها هي تحب تتواصل إزاي؛ هي بتفضل الـ lipreading."
        page: 271
        quote: "For patients who prefer to speak and lipread, eliminate background noise, face the patient, and do not change your mode of speaking."
      - kind: try
        items: [phs.L03.001, phs.L03.003, phs.L03.008, phs.L03.009, phs.L03.011]
    recap:
      - "Facilitation: يتكلم بحرية. Recapitulation: تلخيص. Validation: وجهة نظره مقبولة."
      - "PEARLS: Partnership و Empathy و Apology و Respect و Legitimization و Support."
      - "مع الإعاقة: اتكلم معاه هو، واسأل قبل ما تساعد، وما تسيبش الكشف."
    practice: [phs.L03.001, phs.L03.002, phs.L03.003, phs.L03.004, phs.L03.005, phs.L03.006, phs.L03.007, phs.L03.008, phs.L03.009, phs.L03.010, phs.L03.011, phs.L03.012, phs.L03.013, phs.L03.014]
  - id: phs.L03.lesson2
    title: "الثقافة والـ trauma والـ motivational interviewing والـ interpreter والـ SPIKES"
    hook: "كل الأدوات دي ليها نفس الفكرة: ابدأ من المريض هو شايف إيه"
    minutes: 10
    pages: [272, 273]
    topics: [cultural-formulation-interview, trauma-informed-care, motivational-interviewing, inclusive-history-taking, use-of-interpreters, delivering-bad-news]
    goals:
      - "تعرف أسئلة الـ cultural formulation interview والـ trauma-informed care"
      - "تستخدم الـ motivational interviewing وأهداف الـ SMART"
      - "تاخد history شامل من غير افتراضات، وتستخدم الـ interpreter صح، وتبلّغ خبر وحش بالـ SPIKES"
    status: unverified
    steps:
      - kind: explain
        title: "الـ cultural formulation interview"
        text: |-
          خمس حاجات بنحددها:
          1. المشكلة ==من وجهة نظر المريض== وبكلامه (أو هيحكيها لأهله إزاي).
          2. هو شايف إيه اللي سببها.
          3. خلفيته بتأثر إزاي: إيه اللي بيحسّنها أو يزوّدها، ودور العيلة والمجتمع والـ spirituality.
          4. الثقافة هتأثر إزاي على العلاج. ولو مش عايز يمشي على النصيحة، ==دوّر على طريقة تجمع خطته مع العلاج القياسي== (standard medical regimen).
          5. الحواجز اللي ممكن تمنعه من الرعاية.
        page: 272
        quote: "If they do not want to follow medical advice, investigate if there is a way to combine their plans with the standard medical regimen."
      - kind: explain
        title: "الـ trauma-informed care"
        text: |-
          - اعمل behavioral health screening كامل، وتابع الـ mood والـ substance use والـ social supports والـ ==suicide risk==.
          - ركّز على الأعراض اللي بتأثر على حياته وشغله، وخليك empathetic. ==ما تطلبش منه يحكي الـ trauma بالتفصيل==، واستأذن قبل الكلام.
          - قبل الكشف: طمّنه إنه يقدر يوقفه فوراً، واعرض وجود حد من الطاقم معاه.
          - الـ 4 R's: **Realize و Recognize و Respond و Resist retraumatization**.
        page: 272
        quote: "Do not ask invasive questions requiring the patient to describe trauma in detail. Ask permission prior to discussion."
      - kind: check
        question: "A veteran with PTSD comes for back pain. Which approach fits trauma-informed care?"
        options:
          - "Ask permission before discussing the trauma, and screen mood, substance use and suicide risk"
          - "Ask him to describe the worst event in detail"
          - "Avoid any mention of his mental health"
          - "Start the exam without explaining it"
        answer: 0
        why:
          - "صح: استأذن الأول، وتابع الـ mood والـ substance use والـ suicide risk."
          - "ما تطلبش منه يحكي الـ trauma بالتفصيل."
          - "الـ behavioral health screening مطلوب، مش نتجاهله."
          - "قبل الكشف طمّنه إنه يقدر يوقفه."
        page: 272
        quote: "Patients with history of psychological trauma should receive thorough behavioral health screenings. Regularly assess mood, substance use, social supports, and suicide risk."
      - kind: explain
        title: "الـ motivational interviewing"
        text: |-
          أسلوب بيساعد المريض ==يحل الـ ambivalence== (عايز ومش عايز) عشان يغيّر سلوكه، زي التدخين أو الـ obesity. بينفع لما يكون عنده شوية رغبة في التغيير، و==مش لازم يكون ملتزم بالتغيير==.

          بنسأله السلوك ده بيأثر على حياته إزاي، وليه ممكن يحب يغيّره، وبنشوف الحواجز (أكل مش متاح، trauma ما اتعالجتش). وبنحدد استعداده للتغيير، والأهداف تبقى **SMART**: Specific و Measurable و Achievable و Relevant و Time bound.
        page: 272
        quote: "Counseling technique to facilitate behavior modification by helping patients resolve ambivalence about change."
      - kind: aside
        tone: tip
        text: "**History شامل من غير افتراضات**: ما تفترضش الـ orientation أو الـ gender identity أو السلوك (حد بيقول إنه heterosexual ممكن يكون عنده same-sex activity). قول ==partner== مش husband أو wife لحد ما المريض يقولك. ومتجيبش السيرة لو مالهاش علاقة بالزيارة، وطمّنه على الـ confidentiality."
        page: 272
        quote: "Use gender-neutral terms when referring to the patient or the patient’s family (eg, “partner” rather than “husband” or “wife”) upon first meeting the patient"
      - kind: check
        question: "A smoker says he wants to quit someday but isn't ready to set a date. Can motivational interviewing still help?"
        options:
          - "Yes: it needs some desire to change, not commitment"
          - "No: he must be committed first"
          - "No: it is only for alcohol use"
          - "Only after he sets a quit date"
        answer: 0
        why:
          - "صح: عنده شوية رغبة، ودي كفاية؛ الـ MI مش محتاج التزام."
          - "الكتاب بيقول it does not require that the patient be committed."
          - "بينفع لحاجات كتير، زي الـ nicotine dependence والـ obesity."
          - "تحديد ميعاد ممكن يبقى هدف SMART بعدين، مش شرط للبداية."
        page: 272
        quote: "Helpful when patient has some desire to change, but it does not require that the patient be committed to making the change."
      - kind: figure
        title: "الـ interpreter يقعد فين؟"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <text x="10" y="18" class="t-sm t-b">Spoken language</text>
            <circle class="fg-box" cx="40" cy="55" r="18"/>
            <text x="20" y="90" class="t-sm">Physician</text>
            <circle class="fg-box" cx="140" cy="55" r="18"/>
            <text x="125" y="90" class="t-sm">Patient</text>
            <circle class="fg-acc" cx="160" cy="75" r="10"/>
            <text x="120" y="110" class="t-sm t-acc">interpreter by patient</text>
            <line class="fg-thin" x1="180" y1="10" x2="180" y2="150"/>
            <text x="195" y="18" class="t-sm t-b">Sign language</text>
            <circle class="fg-box" cx="225" cy="55" r="18"/>
            <text x="205" y="90" class="t-sm">Physician</text>
            <circle class="fg-acc" cx="205" cy="75" r="10"/>
            <circle class="fg-box" cx="325" cy="55" r="18"/>
            <text x="310" y="90" class="t-sm">Patient</text>
            <text x="190" y="110" class="t-sm t-acc">interpreter by physician</text>
            <text x="10" y="140" class="t-sm t-mut">Either way: eye contact with the patient, no "tell him"</text>
          </svg>
        caption: "في الكلام، الـ interpreter جنب المريض أو وراه شوية، فالمريض يبص لك وهو بيسمع. في لغة الإشارة، الـ interpreter جنب الدكتور أو وراه شوية، فالمريض يشوف الإشارة ووشك مع بعض."
        alt: "Two panels. Spoken language: interpreter dot next to and slightly behind the patient. Sign language: interpreter dot next to and slightly behind the physician. Footer: eye contact with the patient, no tell him."
        page: 273
        quote: "For in-person spoken language interpretation, the interpreter should ideally be next to or slightly behind the patient. For sign language interpretation, the interpreter should be next to or slightly behind the physician."
      - kind: explain
        title: "الـ interpreter: القواعد"
        text: |-
          - مريض إنجليزيته قليلة ← ==professional medical interpreter== (حضوري، أو بالتليفون أو الفيديو)، إلا لو إنت بتتكلم لغته كويس. لو المريض فضّل حد من أهله، اكتبها في الـ chart.
          - ما تفترضش إن إنجليزيته ضعيفة من اسمه أو لونه أو لهجته؛ اسأله يحب أنهي لغة.
          - بص للمريض واتكلم معاه هو، ==من غير "tell him"==، وخد وقت أطول، وسؤال واحد في المرة.
          - في الطوارئ: أي وسيلة متاحة (أصحاب، أهل، رسم، apps).
        page: 273
        quote: "Visits with a patient who speaks little English should utilize a professionally trained medical interpreter unless the physician is conversationally fluent in the patient’s preferred language."
      - kind: mnemonic
        word: "SPIKES"
        parts:
          - { key: "S", text: "Setting: offer a support person in advance, privacy, no distractions, sit down" }
          - { key: "P", text: "Perception: what does the patient understand and expect?" }
          - { key: "I", text: "Invitation: permission to disclose, and how much detail" }
          - { key: "K", text: "Knowledge: small pieces, no jargon, check understanding" }
          - { key: "E", text: "Emotions: acknowledge them, let them be expressed, respond with empathy" }
          - { key: "S", text: "Strategy: if ready, treatment options and goals of care; agenda for next visit" }
        hook: "الخبر الوحش بيوجع زي الـ spikes، فبنقدّمه على ست خطوات بالترتيب."
        page: 273
        quote: "Knowledge Share the information in small pieces without medical jargon, allowing time to process."
      - kind: check
        question: "After sitting down privately, what is the next SPIKES step before giving a cancer diagnosis?"
        options:
          - "Ask what the patient already understands"
          - "Give the diagnosis directly"
          - "Discuss treatment options"
          - "Reassure that it will be fine"
        answer: 0
        why:
          - "صح: بعد الـ Setting يجي الـ Perception: هو فاهم إيه ومتوقع إيه."
          - "الـ Knowledge بعد الـ Perception والـ Invitation."
          - "الـ Strategy آخر خطوة، ولما يبقى جاهز."
          - "الطمأنة الكدابة مش empathy."
        page: 273
        quote: "Perception Determine the patient’s understanding and expectations of the situation."
      - kind: try
        items: [phs.L03.019, phs.L03.022, phs.L03.029, phs.L03.030, phs.L03.034]
    recap:
      - "Cultural interview: المشكلة بكلامه، وسببها في نظره، وادمج خطته مع العلاج."
      - "Trauma: استأذن، وما تطلبش تفاصيل، ويقدر يوقف الكشف. 4 R's."
      - "MI: يحل الـ ambivalence، ومش محتاج التزام. أهداف SMART."
      - "Interpreter: professional، واتكلم مع المريض. الكلام جنب المريض، والإشارة جنب الدكتور."
      - "SPIKES: Setting و Perception و Invitation و Knowledge و Emotions و Strategy."
    practice: [phs.L03.015, phs.L03.016, phs.L03.017, phs.L03.018, phs.L03.019, phs.L03.020, phs.L03.021, phs.L03.022, phs.L03.023, phs.L03.024, phs.L03.025, phs.L03.026, phs.L03.027, phs.L03.028, phs.L03.029, phs.L03.030, phs.L03.031, phs.L03.032, phs.L03.033, phs.L03.034, phs.L03.035, phs.L03.036]
  - id: phs.L03.lesson3
    title: "مواقف صعبة: الإجابة الصح في كل سيناريو"
    hook: "الإجابة الصح نادراً ما تكون refer أو refuse: افهم، واسأل سؤال مفتوح، واحترم المبادئ"
    minutes: 10
    pages: [274, 275]
    topics: [challenging-scenarios]
    goals:
      - "تعرف شكل الإجابة الصح: patient-centered و open-ended و empathetic"
      - "تحفظ التصرف الصح في المواقف اللي First Aid بيذكرها"
      - "تفرّق بين اللي المريض يقرره، واللي الأهل يقرروه، واللي القانون بيفرضه"
    status: unverified
    steps:
      - kind: explain
        title: "شكل الإجابة الصح"
        text: |-
          الإجابة الصح ==patient-centered و open-ended و empathetic==:
          - اعترف بالصعوبة: "I understand this plan may be difficult..."
          - صدّق المشاعر: "It's understandable to feel frustrated..."
          - افتح الكلام: "What concerns you most about...?"

          وتعكس المبادئ الأربعة (autonomy، beneficence، nonmaleficence، justice) وتشوف كل وجهات النظر: المريض، والعيلة، والثقافة، والفريق.
        page: 274
        quote: "Appropriate responses are patient-centered, open-ended, and empathetic."
      - kind: sort
        prompt: "التصرف ده صح ولا غلط؟"
        bins: ["Appropriate", "Not appropriate"]
        cards:
          - { text: "Nonadherent patient: look for cost or access obstacles", bin: 0 }
          - { text: "Nonadherent patient: refer to another physician", bin: 1 }
          - { text: "Unnecessary procedure: explore the underlying concern", bin: 0 }
          - { text: "Unnecessary procedure: perform it to keep the patient happy", bin: 1 }
          - { text: "Angry about waiting: apologize and thank them", bin: 0 }
          - { text: "Angry about waiting: explain why you were late", bin: 1 }
          - { text: "After mastectomy feels ugly: ask why", bin: 0 }
          - { text: "After mastectomy feels ugly: \"You still look good\"", bin: 1 }
        why: "القاعدة: ما تهربش (refer)، وما تضغطش (coerce)، وما تطمّنش طمأنة كدابة، وما تبررش التأخير. افهم السبب، واعتذر لو لازم، وتابع بانتظام."
        page: 274
        quote: "Acknowledge the patient’s anger, but do not take a patient’s anger personally. Thank the patient for being patient and apologize for any inconvenience. Stay away from efforts to explain the delay."
      - kind: explain
        title: "العيلة والمعلومات"
        text: |-
          - الأهل بيسألوا عن الـ prognosis ← ==ما تتكلمش معاهم من غير إذن المريض==.
          - الأهل بيقولوا "ما تقولوش، مش هيستحمل" ← افهم ليه (ومنها الثقافة)، ووضّح إن ==لو المريض عايز يعرف، مش هنخبّي عليه==. الـ therapeutic privilege بس لو شايف إنه ممكن يأذي نفسه أو غيره بجد لو عرف.
          - غلطة: test اتعمل لمريض غلط ← ==لازم تقول له==، مهما كانت النتيجة.
