lecture: phs.L04
lessons:
  - id: phs.L04.lesson1
    title: "الوقاية بمستوياتها الأربعة والـ post-exposure prophylaxis"
    hook: "السكر مثال واحد بيشرح المستويات الأربعة كلها"
    minutes: 8
    pages: [276, 276]
    topics: [disease-prevention, chemoprophylaxis]
    goals:
      - "تفرّق بين primary و secondary و tertiary و quaternary prevention من مثال"
      - "تحفظ الـ prophylaxis لكل exposure في جدول الكتاب"
    status: unverified
    steps:
      - kind: figure
        title: "مستويات الوقاية على مثال السكر"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="10" width="340" height="40" rx="8"/>
            <text x="20" y="28" class="t-sm t-b">Primary: general population</text>
            <text x="20" y="44" class="t-sm t-mut">Healthy diet and exercise</text>
            <rect class="fg-box" x="10" y="57" width="340" height="40" rx="8"/>
            <text x="20" y="75" class="t-sm t-b">Secondary: subclinical</text>
            <text x="20" y="91" class="t-sm t-mut">Glucose screening</text>
            <rect class="fg-box" x="10" y="104" width="340" height="40" rx="8"/>
            <text x="20" y="122" class="t-sm t-b">Tertiary: symptomatic</text>
            <text x="20" y="138" class="t-sm t-mut">HbA1c monitoring to prevent complications</text>
            <rect class="fg-acc" x="10" y="151" width="340" height="40" rx="8"/>
            <text x="20" y="169" class="t-sm t-b">Quaternary: overmedicalized</text>
            <text x="20" y="185" class="t-sm t-mut">Stop sulfonylurea after hypoglycemia</text>
          </svg>
        caption: "Primary بتمنع المرض من الأساس. Secondary بتكشفه بدري قبل الأعراض. Tertiary بتمنع مضاعفاته بعد ما ظهر. Quaternary بتوقف التدخلات الزيادة اللي بتأذي."
        alt: "Four stacked boxes using diabetes: primary prevention in the general population with diet and exercise; secondary in subclinical disease with glucose screening; tertiary in symptomatic disease with HbA1c monitoring; quaternary, highlighted, in overmedicalized patients by stopping a sulfonylurea after hypoglycemia."
        page: 276
        quote: "Prevent disease onset eg, healthy diet and exercise to prevent diabetes"
      - kind: explain
        title: "الأهداف بالترتيب"
        text: |-
          - **Primary**: نمنع المرض يبدأ، بتقليل الـ risks أو زيادة المناعة (زي الـ vaccines).
          - **Secondary**: ==screening== عشان نكشف المرض وهو presymptomatic ونعالجه قبل الأعراض.
          - **Tertiary**: نعالج المرض اللي ليه أعراض ونمنع تطوره والـ morbidity والـ mortality والـ disability.
          - **Quaternary**: نوقف الـ unnecessary interventions ونمنع ==overtreatment و iatrogenic harm==.
        page: 276
        quote: "Prevent disease onset by reducing risks or increasing immunity"
      - kind: check
        question: "A 50-year-old with no symptoms has a screening colonoscopy that removes a polyp. Which level?"
        options:
          - "Secondary"
          - "Primary"
          - "Tertiary"
          - "Quaternary"
        answer: 0
        why:
          - "صح: screening لكشف مبكر وعلاج قبل الأعراض."
          - "الـ primary بتمنع البداية في الناس العادية (diet، exercise، vaccine)."
          - "الـ tertiary للمرض اللي ليه أعراض."
          - "الـ quaternary لوقف التدخلات الزيادة."
        page: 276
        quote: "Screen for early detection and treatment of presymptomatic disease"
      - kind: explain
        title: "الـ post-exposure prophylaxis: HIV والـ meningococcus"
        text: |-
          - **HIV** (جنسي أو مهني): ==tenofovir disoproxil fumarate + emtricitabine + (raltegravir أو dolutegravir) × 28 يوم==. يبدأ في خلال ==72 ساعة==، والـ HIV test في الأول وبعد 6 أسابيع و3 شهور و6 شهور.
          - **Neisseria meningitidis** (close contact أو household): rifampin أو ciprofloxacin أو ceftriaxone.
        page: 276
        quote: "Start ≤72 hr after exposure; test HIV at baseline and 6 wk, 3 mo, 6 mo."
      - kind: explain
        title: "Rabies و HBV والملاريا"
        text: |-
          - **Rabies** (عضة حيوان): wound cleaning + rabies vaccine + ==rabies immune globulin== (لو ما خدش vaccine قبل كده)، على أيام 0 و3 و7 و14.
          - **HBV**: HBV vaccine ± hepatitis B immune globulin (لو المصدر positive والشخص unvaccinated)، ونتابع الـ HBV serology.
          - **Malaria** (سفر): atovaquone-proguanil أو doxycycline أو mefloquine. يبدأ ==قبل السفر== ويكمّل بعد الرجوع.
        page: 276
        quote: "Wound cleaning + rabies vaccine + rabies immune globulin (if not previously immunized). 0, 3, 7, 14 day schedule."
      - kind: check
        question: "A college student's roommate is hospitalized with meningococcal meningitis. What should the student receive?"
        options:
          - "Rifampin, ciprofloxacin, or ceftriaxone"
          - "Rabies immune globulin"
          - "Doxycycline for 28 days"
          - "Nothing unless symptoms appear"
        answer: 0
        why:
          - "صح: close contact لـ N meningitidis ← rifampin أو ciprofloxacin أو ceftriaxone."
          - "الـ immune globulin ده للـ rabies."
          - "الـ doxycycline للملاريا أو الـ STI prevention."
          - "الـ close contact بياخد prophylaxis من غير ما يستنى أعراض."
        page: 276
        quote: "Neisseria meningitidis (close contact) Rifampin, ciprofloxacin, or ceftriaxone. Household or close exposure."
      - kind: aside
        tone: exam
        text: "**Doxycycline PEP للـ STIs**: في خلال ==72 ساعة== بعد العلاقة، لمريض عنده bacterial STI قريب. بيقلل الـ syphilis والـ chlamydia أكتر من 70% والـ gonorrhea حوالي 50%. ومعاه STI/HIV testing منتظم، والـ pre-exposure prophylaxis، والـ vaccines (HPV و hepatitis A/B)، والـ counseling، ومتابعة كل 3 لـ 6 شهور."
        page: 276
        quote: "Give ≤72 hr after sex to prevent syphilis, chlamydia, and gonorrhea in patients with recent bacterial STI."
      - kind: table
        title: "الـ prophylaxis في جدول واحد"
        columns: ["", "Prophylaxis"]
        rows:
          - ["HIV", "TDF + emtricitabine + raltegravir or dolutegravir × 28 d"]
          - ["N meningitidis", "Rifampin, ciprofloxacin or ceftriaxone"]
          - ["Rabies", "Wound care + vaccine + immune globulin"]
          - ["HBV", "Vaccine ± hepatitis B immune globulin"]
          - ["Malaria", "Atovaquone-proguanil, doxycycline or mefloquine"]
          - ["STI after sex", "Doxycycline ≤72 hr"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
        page: 276
        quote: "Malaria (travel prophylaxis) Atovaquone-proguanil, doxycycline, or mefloquine."
      - kind: try
        items: [phs.L04.001, phs.L04.003, phs.L04.006, phs.L04.007, phs.L04.008]
    recap:
      - "Primary: منع البداية. Secondary: screening. Tertiary: منع المضاعفات. Quaternary: وقف الزيادة."
      - "HIV PEP: 3 أدوية × 28 يوم، في خلال 72 ساعة."
      - "Rabies: vaccine + immune globulin لو مش متطعم، أيام 0 و3 و7 و14."
      - "Meningococcus: rifampin أو ciprofloxacin أو ceftriaxone."
    practice: [phs.L04.001, phs.L04.002, phs.L04.003, phs.L04.004, phs.L04.005, phs.L04.006, phs.L04.007, phs.L04.008, phs.L04.009, phs.L04.010, phs.L04.011, phs.L04.012, phs.L04.013, phs.L04.014]
  - id: phs.L04.lesson2
    title: "التأمين والدفع والـ Medicare، والـ palliative care، والأخطاء الطبية"
    hook: "HMO محتاج referral، PPO لأ. والـ near miss ما أذاش حد بس كشف الخطر"
    minutes: 10
    pages: [277, 278]
    topics: [medical-insurance-plans, healthcare-payment-models, medicare-medicaid, palliative-care, types-of-medical-errors, medical-error-analysis, causes-of-medical-errors]
    goals:
      - "تفرّق بين خطط التأمين ونماذج الدفع"
      - "تعرف مين ليه Medicare و Medicaid، وأجزاء الـ Medicare"
      - "تفرّق بين palliative و hospice، وبين أنواع الأخطاء وطرق تحليلها"
    status: unverified
    steps:
      - kind: table
        title: "خطط التأمين"
        columns: ["", "Out of network?", "Referral?"]
        rows:
          - ["HMO", "No (in-network only)", "Yes, for specialists"]
          - ["EPO", "Emergencies only", "—"]
          - ["PoS", "Yes, at higher cost", "Yes"]
          - ["PPO", "Yes, at higher cost", "No"]
        hide: [[0, 2], [2, 2], [3, 2]]
        page: 277
        quote: "Combination of HMO and PPO, allows out-of-network care at higher cost, and requires primary care referrals."
      - kind: explain
        title: "باقي الخطط ونماذج الدفع"
        text: |-
          - **HMO**: premiums أقل و out-of-pocket أقل، بس جوه الـ network بس ومحتاج referral.
          - **HDHP**: premiums قليلة و out-of-pocket عالي، وبيمشي مع الـ **HSA**.
          - **ACO**: مجموعة providers بينسّقوا رعاية مرضى الـ Medicare بإرادتهم.

          ونماذج الدفع:
          - **Fee-for-service**: كل خدمة بتتدفع لوحدها (و **discounted** بسعر متفق عليه، زي الـ PPOs).
          - **Capitation**: مبلغ ثابت ==لكل مريض في فترة==، مهما استخدم (بعض الـ HMOs).
          - **Bundled payment**: مبلغ ثابت ==لكل خدمة== بيتقسم على كل اللي شاركوا.
          - **Global payment**: دفعة واحدة لكل تكاليف حالة واحدة، وأكتر حاجة في الـ elective surgery.
        page: 277
        quote: "Capitation Physicians receive a set amount per patient assigned to them per period of time, regardless of how much the patient uses the healthcare system."
      - kind: check
        question: "A hospital is paid one fixed amount for a knee replacement, which it divides among the surgeon, anesthesiologist and rehab facility. Which model?"
        options:
          - "Bundled payment"
          - "Capitation"
          - "Fee-for-service"
          - "Discounted fee-for-service"
        answer: 0
        why:
          - "صح: مبلغ ثابت لكل خدمة مهما كانت التكلفة، بيتقسم على كل الـ providers والـ facilities."
          - "الـ capitation مبلغ لكل مريض في فترة، مش لكل خدمة."
          - "الـ fee-for-service بيدفع كل خدمة لوحدها."
          - "ده برضه لكل خدمة لوحدها بس بخصم."
        page: 277
        quote: "Bundled payment Healthcare organization receives a set amount per service, regardless of ultimate cost, to be divided among all providers and facilities involved."
      - kind: mnemonic
        word: "ABCD"
        parts:
          - { key: "A", text: "Part A: hospital Admissions, including hospice and skilled nursing" }
          - { key: "B", text: "Part B: Basic medical bills (physician fees, diagnostic testing)" }
          - { key: "C", text: "Part C: A + B Combo, delivered by approved private companies" }
          - { key: "D", text: "Part D: prescription Drugs" }
        hook: "MedicarE للـ Elderly (≥65، أو أقل مع disabilities معينة، أو end-stage renal disease). MedicaiD للـ Disadvantaged (دخل محدود)، وهو federal و state مع بعض."
        page: 277
        quote: "Part A: hospital Admissions, including hospice, skilled nursing Part B: Basic medical bills (eg, physician fees, diagnostic testing)"
      - kind: check
        question: "A 45-year-old on hemodialysis for end-stage renal disease asks if he qualifies for Medicare. Does he?"
        options:
          - "Yes: end-stage renal disease qualifies at any age"
          - "No: Medicare starts at 65"
          - "Only if his income is limited"
          - "Only for Part D"
        answer: 0
        why:
          - "صح: الـ Medicare للـ ≥65، والأقل مع disabilities معينة، واللي عندهم end-stage renal disease."
          - "فيه استثناءات تحت الـ 65، والـ ESRD منها."
          - "الدخل المحدود ده شرط الـ Medicaid."
          - "الأجزاء كلها متاحة."
        page: 277
        quote: "Medicare is available to patients ≥65 years old, <65 with certain disabilities, and those with end-stage renal disease."
      - kind: explain
        title: "Palliative مش hospice"
        text: |-
          - **Palliative care**: راحة وتخفيف معاناة وجودة حياة في أي مرض complex أو life-threatening، ==مهما كان التشخيص أو الـ prognosis==، وغالباً مع العلاج الـ curative في نفس الوقت. بيقدمها فريق (دكاترة، ممرضين، social workers) في المستشفى أو العيادة أو البيت.
          - **Hospice**: نوع من الـ palliative للي الـ prognosis بتاعه ==≤6 شهور== ومش عايز أو مش مستفيد من العلاج الـ curative.
        page: 278
        quote: "Hospice care (end-of-life care)—form of palliative care for patients with prognosis ≤6 months when curative or life-prolonging treatment is no longer wanted or beneficial."
      - kind: figure
        title: "أنواع الأخطاء الطبية"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="10" y="10" width="165" height="80" rx="10"/>
            <text x="20" y="32" class="t-sm t-b">Active error</text>
            <text x="20" y="52" class="t-sm">Frontline operator</text>
            <text x="20" y="70" class="t-sm t-mut">Wrong IV pump dose</text>
            <text x="20" y="84" class="t-sm t-acc">Immediate impact</text>
            <rect class="fg-box" x="185" y="10" width="165" height="80" rx="10"/>
            <text x="195" y="32" class="t-sm t-b">Latent error</text>
            <text x="195" y="52" class="t-sm">Process, not operator</text>
            <text x="195" y="70" class="t-sm t-mut">Different IV pumps</text>
            <text x="195" y="84" class="t-sm t-acc">Accident waiting to happen</text>
            <rect class="fg-acc" x="10" y="100" width="165" height="80" rx="10"/>
            <text x="20" y="122" class="t-sm t-b">Never event</text>
            <text x="20" y="142" class="t-sm">Serious, preventable</text>
            <text x="20" y="160" class="t-sm t-mut">Retained scalpel</text>
            <text x="20" y="174" class="t-sm t-bad">Sentinel: death or severe harm</text>
            <rect class="fg-box" x="185" y="100" width="165" height="80" rx="10"/>
            <text x="195" y="122" class="t-sm t-b">Near miss</text>
            <text x="195" y="142" class="t-sm">No harm, but could have</text>
            <text x="195" y="160" class="t-sm t-mut">Pharmacist cancels order</text>
            <text x="195" y="174" class="t-sm t-acc">Exposes dangers</text>
          </svg>
        caption: "الـ active عند اللي بينفّذ وأثره فوري. الـ latent في النظام نفسه ومستني يحصل. الـ never event ما ينفعش يحصل أبداً، ولو أدى لوفاة أو ضرر شديد يبقى sentinel event. والـ near miss ما أذاش حد بس بيكشف الخطر. وكل الأخطاء بتتقال للمريض، أذت أو ما أذتش."
        alt: "Four boxes. Active error: frontline operator, wrong IV pump dose, immediate impact. Latent error: process not operator, different IV pumps, accident waiting to happen. Never event, highlighted: serious, preventable, retained scalpel; sentinel event if death or severe harm. Near miss: no harm but could have, pharmacist cancels the order, exposes dangers."
        page: 278
        quote: "Active error Occurs at level of frontline operator (eg, wrong IV pump dose programmed). Immediate impact."
      - kind: check
        question: "A nurse programs an infusion pump at 10 times the ordered rate, and the patient becomes hypotensive within minutes. Which error type?"
        options:
          - "Active error"
          - "Latent error"
          - "Near miss"
          - "Never event"
        answer: 0
        why:
          - "صح: الغلطة عند الـ frontline operator وأثرها فوري."
          - "الـ latent في النظام، مش في اللي بينفّذ."
          - "المريض اتأذى، فمش near miss."
          - "الـ never event زي الـ retained scalpel، ودي غلطة جرعة مباشرة."
        page: 278
        quote: "Occurs at level of frontline operator (eg, wrong IV pump dose programmed). Immediate impact."
      - kind: explain
        title: "تحليل الأخطاء وأسبابها"
        text: |-
          - **Root cause analysis**: ==retrospective==، بعد ما الغلطة تحصل، عشان ما تتكررش. بيستخدم السجلات والمقابلات (5 whys، fishbone diagrams، process maps) عشان يلاقي كل المشاكل: process و people و environment و equipment و materials و management.
          - **Failure mode and effects analysis**: ==forward-looking==، قبل ما نطبّق process جديد. بيستخدم inductive reasoning عشان يلاقي كل طرق الفشل ويرتبها حسب الاحتمال والأثر على المرضى.

          والأسباب: **burnout** (ضغط طويل ← emotional exhaustion و depersonalization ← كفاءة أقل)، و **fatigue** (قلة نوم ← cognitive impairment وانتباه أقل للتفاصيل).
        page: 278
        quote: "Root cause analysis Retrospective approach. Applied after failure event to prevent recurrence."
      - kind: try
        items: [phs.L04.015, phs.L04.022, phs.L04.024, phs.L04.027, phs.L04.031]
    recap:
      - "HMO و PoS محتاجين referral؛ PPO لأ؛ EPO جوه الـ network إلا الطوارئ."
      - "Capitation: لكل مريض في فترة. Bundled: لكل خدمة. Global: حالة واحدة (elective surgery)."
      - "Medicare: Admissions و Basic و Combo و Drugs. MedicarE = Elderly، MedicaiD = Disadvantaged."
      - "Palliative مع أي prognosis ومع العلاج؛ hospice ≤6 شهور."
      - "Active فوري، latent في النظام، never event (sentinel لو ضرر شديد)، near miss من غير ضرر."
      - "RCA بعد الغلطة؛ FMEA قبل التطبيق."
    practice: [phs.L04.015, phs.L04.016, phs.L04.017, phs.L04.018, phs.L04.019, phs.L04.020, phs.L04.021, phs.L04.022, phs.L04.023, phs.L04.024, phs.L04.025, phs.L04.026, phs.L04.027, phs.L04.028, phs.L04.029, phs.L04.030, phs.L04.031, phs.L04.032, phs.L04.033, phs.L04.034, phs.L04.035, phs.L04.036, phs.L04.037]
