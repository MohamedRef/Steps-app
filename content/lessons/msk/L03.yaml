      - kind: explain
        title: "كل قرحة بتحكي سببها"
        text: |-
          - **Venous** (الأشهر): الدم بيتجمّع تحت بالجاذبية لما الـ veins تبوظ (chronic venous insufficiency). عشان كده مكانها ==gaiter area== (من الكاحل لنص السمانة، فوق الـ malleoli)، ومعاها edema و varicose veins و telangiectasias و stasis dermatitis. سطحية وبتنز، والوجع خفيف لمتوسط.
          - **Arterial**: الدم مش واصل (peripheral artery disease)، فبتطلع في ==أبعد حتة== (أطراف الصوابع) والـ anterior shin ونقط الضغط. punched-out وموجعة جداً، والجلد بارد وباهت ومن غير شعر ولا نبض.
          - **Neuropathic**: المريض ==مش حاسس== (diabetic foot)، فبيفضل يدوس على نفس العضمة البارزة (metatarsal heads، الكعب) لحد ما تتفتح. الحافة hyperkeratotic من الدوس، ومفيش وجع، ومعاها claw toes و Charcot joints و absent reflexes.
          - **Pressure injury**: ضغط مستمر من غير راحة (immobility) على نقط الشيل: الـ sacrum والـ ischium والـ calcaneus. بتتدرج من احمرار ما بيبهتش (non-blanchable erythema) لحد full-thickness skin loss، وموجعة، وكتير تتعقد بـ soft tissue infection و osteomyelitis.
