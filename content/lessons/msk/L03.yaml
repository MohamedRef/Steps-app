        text: |-
          - **Erythema multiforme**: أنواع كتير من الـ lesions، أشهرها ==target lesions==. مع عدوى (HSV، M pneumoniae) أو أدوية (sulfa، phenytoin).
          - **SJS** و **TEN**: نفس المرض بدرجات، والفرق في مساحة الجلد اللي بتتقشر. السبب غالباً **adverse drug reaction**، ومعاه حرارة والـ mucous membranes. أكتر من 30% من الجلد = TEN، و10-30% = SJS-TEN.
          - **Epidermolysis bullosa**: وراثي، فقاقيع من الصغر ومع الرضاعة بالببرونة، من mutations في جينات الـ keratin.
        page: 490
        quote: "Presents with multiple types of lesions—macules, papules, vesicles, target lesions (look like targets with multiple rings and dusky center showing epithelial disruption) B ."
