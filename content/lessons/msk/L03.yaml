schema: steps.lesson/v1
lecture: msk.L03
lessons:
  - id: msk.L03.lesson1
    title: "الجلد من جوّه: الطبقات والوصلات والمصطلحات"
    hook: "تعرف الطبقة اللي اتفرقت، تعرف المرض. والـ scleroderma هي البداية"
    minutes: 9
    pages: [481, 483]
    topics: [scleroderma, skin-layers, epithelial-cell-junctions, exocrine-glands, dermatologic-macroscopic-terms, dermatologic-microscopic-terms]
    goals:
      - "تفرّق الـ diffuse من الـ limited scleroderma بالأجسام المضادة"
      - "ترتّب طبقات الـ epidermis وتعرف كل junction بمرضه"
      - "تعرف مصطلحات الفحص والـ biopsy اللي بتتكرر في الأسئلة"
    status: unverified
    steps:
      - kind: explain
        title: "Scleroderma: جلد مشدود وأوعية مقفولة"
        text: |-
          الـ systemic sclerosis تلات حاجات: autoimmunity، و vasculopathy من غير التهاب، و ==collagen deposition== بتليّف. الجلد **منفوخ ومشدود ومن غير تجاعيد**، وأطراف الصوابع فيها حُفر.

          ومش جلد بس: الكلية (==scleroderma renal crisis==، علاجها **ACE inhibitors**)، والرئة (fibrosis و pulmonary hypertension)، والمريء (حركة ضعيفة وحرقان).
        page: 481
        quote: "Can involve other systems, eg, renal (scleroderma renal crisis; treat with ACE inhibitors), pulmonary (interstitial fibrosis, pulmonary hypertension), GI (↓ peristalsis and LES tone → dysphagia, heartburn), cardiovascular."
      - kind: table
        title: "Diffuse ولا limited"
        columns: ["", "Diffuse", "Limited"]
        rows:
          - ["Skin", "Widespread, rapid", "Fingers and face"]
          - ["Course", "Rapid, early visceral involvement", "More benign (CREST)"]
          - ["Antibody", "Anti-Scl-70, anti-RNA polymerase III", "Anti-centromere"]
        hide: [[2, 1], [2, 2], [0, 2]]
        page: 481
        quote: "Diffuse scleroderma—widespread skin involvement, rapid progression, early visceral involvement. Associated with anti-Scl-70 antibody (anti-DNA topoisomerase-I antibody) and anti-RNA polymerase III."
      - kind: mnemonic
        word: "CREST"
        parts:
          - { key: "C", text: "Calcinosis cutis (and anti-Centromere)" }
          - { key: "R", text: "Raynaud phenomenon" }
          - { key: "E", text: "Esophageal dysmotility" }
          - { key: "S", text: "Sclerodactyly" }
          - { key: "T", text: "Telangiectasia" }
        hook: "الـ C بتاعة الـ CREST فيها حرفين: Calcinosis والـ anti-Centromere. افتكر الـ C الزيادة دي وانت بتختار الأجسام المضادة."
        page: 481
        quote: "CREST syndrome: Calcinosis cutis C , anti-Centromere antibody, Raynaud phenomenon, Esophageal dysmotility, Sclerodactyly, and Telangiectasia. More benign clinical course."
      - kind: check
        question: "A woman with tight skin spreading over her trunk develops sudden severe hypertension and rising creatinine. What is the best treatment?"
        options:
          - "ACE inhibitor"
          - "High-dose glucocorticoids"
          - "Beta blocker"
          - "Plasmapheresis"
        answer: 0
        why:
          - "صح: الـ scleroderma renal crisis بتتعالج بالـ ACE inhibitors."
          - "مش ده علاج الـ renal crisis في الكتاب."
          - "مش ده علاج الـ renal crisis في الكتاب."
          - "مش ده علاج الـ renal crisis في الكتاب."
        page: 481
        quote: "renal (scleroderma renal crisis; treat with ACE inhibitors)"
      - kind: order
        prompt: "رتّب طبقات الـ epidermis من برّه لجوّه (come, let's get sunburned)"
        steps:
          - "Stratum corneum"
          - "Stratum lucidum"
          - "Stratum granulosum"
          - "Stratum spinosum"
          - "Stratum basale"
        why: "**C**ome **L**et's **G**et **S**un**B**urned: Corneum، Lucidum، Granulosum، Spinosum، Basale. وتحتهم الـ dermis والـ subcutaneous fat."
        page: 481
        quote: "Stratum corneum Stratum lucidum Stratum granulosum Stratum spinosum Stratum basale Dermis"
      - kind: explain
        title: "الوصلات: كل واحدة ليها مرض"
        text: |-
          - **Tight junction** (claudins و occludins): بيمنع المرور بين الخلايا.
          - **Adherens junction**: فيه ==E-cadherin==، ولما يضيع الورم بيعمل metastasis.
          - **Desmosome**: بيربط الخلايا ببعض ← لو اتهاجم = pemphigus vulgaris.
          - **Hemidesmosome**: بيربط الـ basal cells بالـ basement membrane ← لو اتهاجم = ==bullous pemphigoid==.
          - **Integrins**: بتمسك الـ collagen والـ laminin والـ fibronectin في الـ basement membrane.
        page: 482
        quote: "Hemidesmosome E –connects keratin in basal cells to underlying basement membrane. Autoantibodies → bullous pemphigoid."
      - kind: figure
        title: "مين بيمسك مين"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-good" x="40" y="20" width="120" height="90" rx="8"/>
            <rect class="fg-good" x="200" y="20" width="120" height="90" rx="8"/>
            <text x="70" y="70" class="t-sm t-b">Keratinocyte</text>
            <text x="230" y="70" class="t-sm t-b">Keratinocyte</text>
            <line class="fg-arrow-acc" x1="160" y1="55" x2="200" y2="55"/>
            <text x="138" y="45" class="t-sm t-acc">Desmosome</text>
            <rect class="fg-bad" x="20" y="130" width="320" height="12" rx="4"/>
            <text x="110" y="165" class="t-sm t-mut">Basement membrane</text>
            <line class="fg-arrow-acc" x1="100" y1="110" x2="100" y2="130"/>
            <text x="20" y="125" class="t-sm t-acc">Hemidesmosome</text>
          </svg>
        caption: "الـ desmosome بين خلية وخلية: لو اتضرب الخلايا تتفرق جوّه الـ epidermis (pemphigus vulgaris). الـ hemidesmosome بين الخلية والـ basement membrane: لو اتضرب الـ epidermis كله يتقلع (bullous pemphigoid)."
        alt: "Two keratinocytes joined by a desmosome; the lower cell anchored to the basement membrane by a hemidesmosome."
        page: 482
        quote: "Hemidesmosome E –connects keratin in basal cells to underlying basement membrane. Autoantibodies → bullous pemphigoid."
      - kind: match
        prompt: "وصّل نوع الغدة بمثالها"
        pairs:
          - ["Merocrine", "Salivary and sweat glands"]
          - ["Apocrine", "Mammary glands"]
          - ["Holocrine", "Sebaceous glands"]
        why: "التلاتة exocrine: بيطلّعوا منتجهم في ducts لبرّه الجسم، عكس الـ endocrine اللي بتفرز hormones. الـ sebaceous هي المثال الـ holocrine."
        page: 482
        quote: "Can be merocrine (eg, salivary and sweat glands), apocrine (eg, mammary glands), or holocrine (eg, sebaceous glands)."
      - kind: explain
        title: "مصطلحات بالعين"
        text: |-
          - **Macule** مسطح أقل من 1 cm (نمش)، و ==patch== مسطح أكبر من 1 cm (vitiligo).
          - **Papule** بارز أقل من 1 cm، و **plaque** بارز أكبر من 1 cm (psoriasis).
          - **Erosion**: الـ epidermis راح من غير ما الـ basement membrane يبان (HSV، pemphigus vulgaris). **Ulcer**: الخسارة نزلت للـ dermis.
        page: 483
        quote: "Macule Flat lesion with well-circumscribed change in skin color <1 cm Freckle (ephelis), labial macule A Patch Macule >1 cm Vitiligo B"
      - kind: match
        prompt: "وصّل المصطلح الميكروسكوبي بمرضه"
        pairs:
          - ["Parakeratosis", "Psoriasis"]
          - ["Hypergranulosis", "Lichen planus"]
          - ["Acantholysis", "Pemphigus vulgaris"]
        why: "الـ parakeratosis = الأنوية لسه في الـ stratum corneum (الخلايا بتطلع بسرعة). الـ hypergranulosis = الـ granulosum تخنت. الـ acantholysis = الخلايا سابت بعض."
        page: 483
        quote: "Parakeratosis Retention of nuclei in stratum corneum Psoriasis, actinic keratosis Hypergranulosis ↑ thickness of stratum granulosum Lichen planus"
      - kind: try
        items: [msk.L03.001, msk.L03.005, msk.L03.009, msk.L03.013, msk.L03.018]
    recap:
      - "Diffuse: Scl-70 وأعضاء بدري. Limited/CREST: anti-centromere وأهدى."
      - "Scleroderma renal crisis: ACE inhibitors."
      - "Desmosome = pemphigus vulgaris، hemidesmosome = bullous pemphigoid."
      - "Parakeratosis = psoriasis، hypergranulosis = lichen planus، acantholysis = pemphigus."
    practice: [msk.L03.001, msk.L03.002, msk.L03.003, msk.L03.004, msk.L03.005, msk.L03.006, msk.L03.007, msk.L03.008, msk.L03.009, msk.L03.010, msk.L03.011, msk.L03.012, msk.L03.013, msk.L03.014, msk.L03.015, msk.L03.016, msk.L03.017, msk.L03.018, msk.L03.019, msk.L03.020]
  - id: msk.L03.lesson2
    title: "أمراض الجلد اللي في كل عيادة"
    hook: "من البهاق لحب الشباب للـ psoriasis: لكل واحد علامة بتفضحه"
    minutes: 9
    pages: [484, 486]
    topics: [pigmented-skin-disorders, seborrheic-dermatitis, common-skin-disorders, vascular-tumors-of-skin]
    status: unverified
    steps:
      - kind: explain
        title: "اللون: الخلية موجودة ولا لأ؟"
        text: |-
          - **Albinism**: الـ melanocytes **عددها طبيعي** بس الـ melanin قليل (==tyrosinase== ضعيف) ← خطر سرطان جلد.
          - **Vitiligo**: الـ melanocytes **اتدمّرت** (autoimmune) ← بقع بيضا تماماً، ومع أمراض autoimmune تانية.
          - **Melasma**: hyperpigmentation مكتسب مع الحمل ("mask of pregnancy") أو الـ OCP.
        page: 484
        quote: "Normal melanocyte number with ↓ melanin production A due to ↓ tyrosinase activity or defective tyrosine transport. ↑ risk of skin cancer."
      - kind: reveal
        prompt: "راجل عنده Parkinson وعلى فروة راسه وحواجبه قشر أصفر دهني. إيه هو، وإيه علاجه؟"
        answer: "==Seborrheic dermatitis==: plaques حمرا بقشر أصفر دهني في أماكن الغدد الدهنية. مرتبطة بالـ Malassezia، والعلاج antifungal موضعي و glucocorticoids."
        page: 484
        quote: "Possibly associated with Malassezia spp. Treatment: topical antifungals and glucocorticoids."
      - kind: explain
        title: "حب الشباب والـ rosacea والإكزيما"
        text: |-
          - **Acne**: أربع حاجات: hormones، و desquamation غلط، و ==Cutibacterium acnes==، والتهاب. العلاج: retinoids و benzoyl peroxide و antibiotics.
          - **Rosacea**: papules و pustules على الوش، بس **من غير comedones**.
          - **Atopic dermatitis**: على الوش في الرضيع، وبعدين على الـ flexural surfaces.
          - **Allergic contact dermatitis**: type IV من الـ nickel أو poison ivy أو neomycin.
        page: 485
        quote: "Inflammatory facial skin disorder characterized by erythematous papules and pustules J , but no comedones."
      - kind: explain
        title: "الـ psoriasis تحت الميكروسكوب"
        text: |-
          papules و plaques بقشر فضي، خصوصاً على الركب والكوع، والـ **Auspitz sign** نقط دم لما تشيل القشرة.

          جوّه: ==acanthosis== مع parakeratosis (الأنوية لسه في الـ corneum)، و Munro microabscesses. الـ stratum spinosum ↑ والـ stratum granulosum ↓.
        page: 485
        quote: "Acanthosis with parakeratotic scaling (nuclei still in stratum corneum), Munro microabscesses. ↑ stratum spinosum, ↓ stratum granulosum."
      - kind: aside
        tone: exam
        text: "الـ seborrheic keratosis شكلها \"stuck on\" وبريئة. بس لو طلع منها ==كتير فجأة== ده **Leser-Trélat sign**: دوّر على سرطان (GI adenocarcinoma)."
        page: 485
        quote: "Leser-Trélat sign L —rapid onset of multiple seborrheic keratoses, indicates possible malignancy (eg, GI adenocarcinoma)."
      - kind: check
        question: "A wart biopsy shows epidermal hyperplasia with cells that have clear halos around wrinkled nuclei. What causes it?"
        options:
          - "Low-risk HPV strains"
          - "Poxvirus"
          - "EBV"
          - "HHV-8"
          - "Malassezia"
        answer: 0
        why:
          - "صح: الـ verrucae من low-risk HPV، والـ koilocytes هي الخلايا دي."
          - "الـ poxvirus بيعمل molluscum (umbilicated papules)."
          - "الـ EBV بيعمل hairy leukoplakia."
          - "الـ HHV-8 بيعمل Kaposi sarcoma."
          - "الـ Malassezia مع الـ seborrheic dermatitis والـ tinea versicolor."
        page: 485
        quote: "Warts; caused by low-risk HPV strains. Soft, tan-colored, cauliflowerlike papules M. Epidermal hyperplasia, hyperkeratosis, koilocytosis."
      - kind: table
        title: "Bacillary angiomatosis ولا Kaposi"
        columns: ["", "Bacillary angiomatosis", "Kaposi sarcoma"]
        rows:
          - ["Cause", "Bartonella", "HHV-8"]
          - ["Infiltrate", "Neutrophilic", "Lymphocytic"]
        hide: [[0, 1], [1, 1]]
        page: 486
        quote: "Associated with HHV-8 and HIV. Lymphocytic infiltrate, unlike bacillary angiomatosis."
      - kind: explain
        title: "باقي أورام الأوعية"
        text: |-
          - **Angiosarcoma**: خبيث، مع الإشعاع والـ lymphedema بعد استئصال الثدي (==Stewart-Treves==). وفي الكبد مع الـ vinyl chloride والـ arsenic.
          - **Glomus tumor**: موجع وتحت الضافر.
          - **Cherry angioma** ما بيختفيش، و **infantile hemangioma** بيختفي لوحده.
        page: 486
        quote: "Associated with radiation therapy and chronic postmastectomy lymphedema. Stewart-Treves syndrome—cutaneous angiosarcoma developing after chronic lymphedema. Hepatic angiosarcoma associated with vinyl chloride and arsenic exposures."
      - kind: try
        items: [msk.L03.021, msk.L03.022, msk.L03.024, msk.L03.035, msk.L03.036]
    recap:
      - "Albinism: melanocytes موجودة والـ melanin قليل. Vitiligo: الـ melanocytes راحت."
      - "Rosacea من غير comedones."
      - "Psoriasis: parakeratosis و Munro microabscesses."
      - "Leser-Trélat = سرطان GI. Bartonella neutrophils، Kaposi lymphocytes."
    practice: [msk.L03.021, msk.L03.022, msk.L03.023, msk.L03.024, msk.L03.025, msk.L03.026, msk.L03.027, msk.L03.028, msk.L03.029, msk.L03.030, msk.L03.031, msk.L03.032, msk.L03.033, msk.L03.034, msk.L03.035, msk.L03.036, msk.L03.037, msk.L03.038, msk.L03.039, msk.L03.040, msk.L03.041]
  - id: msk.L03.lesson3
    title: "عدوى الجلد: البكتيريا بالعمق، والفطريات بالمكان"
    hook: "كل ما البكتيريا تنزل لتحت، المرض يبقى أخطر"
    minutes: 8
    pages: [487, 488]
    topics: [skin-infections, cutaneous-mycoses]
    status: unverified
    steps:
      - kind: figure
        title: "البكتيريا من فوق لتحت"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-good" x="20" y="15" width="320" height="30" rx="4"/>
            <text x="30" y="35" class="t-sm t-b">Epidermis: impetigo</text>
            <rect class="fg-good" x="20" y="50" width="320" height="30" rx="4"/>
            <text x="30" y="70" class="t-sm t-b">Upper dermis: erysipelas</text>
            <rect class="fg-bad" x="20" y="85" width="320" height="30" rx="4"/>
            <text x="30" y="105" class="t-sm t-b">Deep dermis and fat: cellulitis</text>
            <rect class="fg-bad" x="20" y="120" width="320" height="30" rx="4"/>
            <text x="30" y="140" class="t-sm t-b">Fascia: necrotizing fasciitis</text>
            <text x="230" y="172" class="t-sm t-mut">deeper = worse</text>
          </svg>
        caption: "الـ impetigo على السطح، الـ erysipelas في الـ upper dermis بحدود واضحة، الـ cellulitis أعمق (deeper dermis و subcutaneous)، والـ necrotizing fasciitis في الـ fascia وده طوارئ."
        alt: "Four skin layers stacked from epidermis to fascia, labelled impetigo, erysipelas, cellulitis and necrotizing fasciitis."
        page: 487
        quote: "Infection involving upper dermis and superficial lymphatics, usually from S pyogenes. Presents with well-defined, raised demarcation between infected and normal skin C ."
      - kind: explain
        title: "الـ erysipelas والـ fasciitis"
        text: |-
          - **Erysipelas**: الـ upper dermis، غالباً ==S pyogenes==، وحافة **بارزة وواضحة** بين الجلد المصاب والسليم.
          - **Necrotizing fasciitis** ("flesh-eating bacteria"): bullae و necrosis، وفي الـ fascia: إفراز رمادي زي ميّة المواعين وريحة، و**وجع أكتر بكتير من الفحص**.
        page: 487
        quote: "Fascia: pale, friable, ischemic fascia; dishwater-gray, malodorous exudate of surrounding tissue; severe pain out of proportion to exam."
      - kind: check
        question: "A newborn has fever and peeling skin with a positive Nikolsky sign but no mouth lesions. At which level does the toxin split the skin?"
        options:
          - "Stratum granulosum"
          - "Epidermal-dermal junction"
          - "Stratum basale"
          - "Papillary dermis"
        answer: 0
        why:
          - "صح: الـ SSSS بيفرّق في الـ stratum granulosum بس، ومفيش mucosa."
          - "دي الـ TEN، ومعاها mucosa."
          - "مش مكان الـ exfoliative toxin."
          - "أعمق من اللازم."
        page: 487
        quote: "Exotoxin destroys keratinocyte attachments in stratum granulosum only (vs toxic epidermal necrolysis, which destroys epidermal-dermal junction). No mucosal involvement."
      - kind: aside
        tone: trap
        text: "التلات حاجات البيضا في البق: ==hairy leukoplakia== (EBV، جنب اللسان، **ما بتتكشطش**)، و thrush (بتتكشط)، و leukoplakia (precancerous)."
        page: 487
        quote: "Irregular, white, painless plaques on lateral tongue that cannot be scraped off J . EBV mediated. Occurs in patients living with HIV, organ transplant recipients. Contrast with thrush (scrapable) and leukoplakia (precancerous)."
      - kind: explain
        title: "الفطريات: الـ dermatophytes"
        text: |-
          Microsporum و Trichophyton و Epidermophyton. على الـ KOH: ==branching septate hyphae==، ومعاهم حكة.

          الاسم بيتغيّر بالمكان: tinea capitis (الراس)، corporis (الجسم، ringworm بنص فاضي، ومن الحيوانات الأليفة)، cruris (الأربية)، pedis (الرجل)، unguium (الضوافر).
        page: 488
        quote: "Dermatophytes include Microsporum, Trichophyton, and Epidermophyton. Branching septate hyphae visible on KOH preparation with blue fungal stain A . Associated with pruritus."
      - kind: reveal
        prompt: "ليه الـ tinea versicolor بتعمل بقع فاتحة، وبتبان أكتر بعد الشمس؟"
        answer: "الـ Malassezia بتكسّر الدهون لأحماض بتوقّف الـ ==tyrosinase== ← melanin أقل. فلما الجلد اللي حواليها يسمر في الصيف، البقع تبان أكتر."
        page: 488
        quote: "Degradation of lipids produces acids that inhibit tyrosinase (involved in melanin synthesis) → hypopigmentation G"
      - kind: try
        items: [msk.L03.042, msk.L03.048, msk.L03.049, msk.L03.053]
    recap:
      - "Erysipelas: حافة واضحة. Cellulitis: أعمق."
      - "Necrotizing fasciitis: وجع أكتر من الفحص."
      - "SSSS: الـ granulosum ومن غير mucosa. TEN: الـ junction ومع mucosa."
      - "Tinea versicolor: أحماض توقّف الـ tyrosinase."
