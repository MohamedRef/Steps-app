        title: "الجلد بيقولك على اللي جوّه"
        text: |-
          - **Acanthosis nigricans**: جلد غامق ومتخن في الإبط والرقبة ← ==insulin resistance== (سكر، سمنة، PCOS) أو سرطان معدة.
          - **Erythema nodosum**: عقد موجعة على قصبة الرجل (panniculitis): sarcoidosis، TB، strep، IBD.
          - **Lichen planus**: الـ 6 P's، و Wickham striae في البق، و sawtooth lymphocytes، ومع ==hepatitis C==.
        page: 492
        quote: "Associated with insulin resistance (eg, diabetes, obesity, Cushing syndrome, PCOS), visceral malignancy (eg, gastric adenocarcinoma)."
      - kind: aside
        tone: tip
        text: "UV**B** للـ sunburn (الـ B)، و UV**A** للـ tanning والـ photoaging (الـ A). الاتنين بيعملوا DNA mutations. والـ **pityriasis rosea** بتبدأ بـ herald patch وبعدها بأيام plaques في شكل ==شجرة كريسماس== على الضهر."
        page: 492
        quote: "Causes DNA mutations, inducing apoptosis of keratinocytes. UVB is dominant in sunBurn, UVA in tAnning and photoAging."
      - kind: check
        question: "A patient has burns covering the entire right arm and the entire front of the trunk. Using the rule of 9's, what percentage of body surface is burned?"
        options:
          - "27%"
          - "18%"
          - "36%"
          - "45%"
        answer: 0
        why:
          - "صح: الدراع 9% وقدّام الجسم كله (الصدر والبطن) 18%، فالمجموع 27%."
          - "دي قدّام الجسم بس من غير الدراع."
          - "36% = الجذع كله قدّام وورا من غير الدراع؛ هنا الدراع وقدّام بس."
          - "كتير قوي."
        page: 493
        quote: "Entire thorax 18% Entire arm (L) 9% Entire arm (R) 9% Entire abdomen 18% Perineum 1%"
