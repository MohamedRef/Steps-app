      - kind: explain
        title: "ليه الحرق الأعمق ما بيوجعش؟"
        text: |-
          افتكر حاجتين في الـ dermis: ==نهايات الأعصاب== والـ capillaries.

          - **Superficial** (الـ epidermis بس): زي الـ sunburn؛ الـ ==histamine== بيوسّع الأوعية ← احمرار ناشف بيبهت لما تدوس، من غير فقاقيع، وموجع لأن الأعصاب سليمة ومتهيّجة.
          - **Superficial partial** (لحد الـ papillary dermis): فقاقيع، ولسه بيبهت (الـ capillaries شغالة)، ومنفوخ وسخن، وبيوجع مع الحرارة والهوا.
          - **Deep partial** (لحد الـ reticular dermis): فقاقيع بتتقشر بسهولة، و**ما بيبهتش** (الـ capillaries اتحرقت)، و==مش موجع==: الأعصاب السطحية ماتت، فاضل إحساس الضغط بس.
          - **Full thickness**: أبيض شمعي ناشف زي الجلد المدبوغ (leathery)، مش موجع، والإحساس بالضغط العميق بس.
          - **Deeper injury**: نزل للـ fascia أو العضلة: أبيض ناشف، مش موجع، وفيه شوية إحساس بالضغط العميق.

          الدرس: حرق ما بيوجعش مش علامة كويسة؛ ده معناه إنه عميق.
        page: 493
        quote: "Superficial burn Epidermis only Similar to sunburn; histamine release causes localized, dry, blanching redness without blisters Painful"
      - kind: explain
        title: "الحريق كمان بيحرق من جوّه"
        text: |-
          الـ **inhalation injury**: الحرارة والـ particulates الصغيرة (<1 µm) والـ irritants (زي الـ NH3) بتوصل للمجاري ← chemical tracheobronchitis، edema، pneumonia، و ==ARDS==. في الكشف: ==شعر مناخير محروق== أو soot في الـ oropharynx.

          الـ bronchoscopy (صورة الكتاب): edema شديد واحتقان وsoot بعد 18 ساعة، وبتتحسن بعد 11 يوم.

          وعلى الهامش: الـ **sunburn** نفسه رد فعل التهابي حاد من UV زيادة، والـ UV بيعمل DNA mutations ويموّت الـ keratinocytes (apoptosis). والـ **radiation dermatitis**: acute (≤90 يوم: الـ basal keratinocytes بتموت ← احمرار وتقشير وفقاقيع) أو late (شهور لسنين: fibrosis و telangiectasias).
        page: 493
        quote: "Heat, particulates (<1 µm diameter), or irritants (eg, NH3 ) → chemical tracheobronchitis, edema, pneumonia, acute respiratory distress syndrome. Singed nasal hairs or soot in oropharynx common on exam."
      - kind: explain
        title: "BCC و SCC"
        text: |-
          - **BCC**: الأشهر. فوق الشفة العليا. ==pearly== nodules بـ telangiectasias و rolled borders، بيغزو مكانه ونادراً ما ينتشر.
          - **SCC**: تحت الشفة السفلى. مع الـ immunosuppression والجروح المزمنة (==Marjolin ulcer==) والـ arsenic.
          - **Actinic keratosis**: قبل السرطان، والخطر على قد الـ dysplasia.
        page: 494
        quote: "Basal cell carcinoma (BCC) more common above upper lip. Squamous cell carcinoma (SCC) more common below lower lip. Sun exposure strongly predisposes to skin cancer."
