        answer: "==Arterial ulcer==: الدم مش واصل، فالجلد ضامر وبارد ومن غير شعر، والقرحة punched-out وموجعة."
        page: 491
        quote: "Arterial insufficiency, cold and pale atrophic skin, hair loss, absent pulses"
