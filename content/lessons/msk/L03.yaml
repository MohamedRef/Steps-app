lecture: msk.L03
lessons:
  - id: msk.L03.lesson1
    title: "الجلد من جوّه: الطبقات والوصلات والمصطلحات"
    hook: "تعرف الطبقة اللي اتفرقت، تعرف المرض. والـ scleroderma هي البداية"
    minutes: 9
    pages: [481, 483]
    topics: [scleroderma, skin-layers, epithelial-cell-junctions, exocrine-glands, dermatologic-macroscopic-terms, dermatologic-microscopic-terms]
    goals:
      - "تفرّق الـ diffuse من الـ limited scleroderma بالأجسام المضادة"
      - "ترتّب طبقات الـ epidermis وتعرف كل junction بمرضه"
      - "تعرف مصطلحات الفحص والـ biopsy اللي بتتكرر في الأسئلة"
    status: unverified
    steps:
      - kind: explain
        title: "Scleroderma: جلد مشدود وأوعية مقفولة"
        text: |-
          الـ systemic sclerosis تلات حاجات: autoimmunity، و vasculopathy من غير التهاب، و ==collagen deposition== بتليّف. الجلد **منفوخ ومشدود ومن غير تجاعيد**، وأطراف الصوابع فيها حُفر.

          ومش جلد بس: الكلية (==scleroderma renal crisis==، علاجها **ACE inhibitors**)، والرئة (fibrosis و pulmonary hypertension)، والمريء (حركة ضعيفة وحرقان).
        page: 481
        quote: "Can involve other systems, eg, renal (scleroderma renal crisis; treat with ACE inhibitors), pulmonary (interstitial fibrosis, pulmonary hypertension), GI (↓ peristalsis and LES tone → dysphagia, heartburn), cardiovascular."
      - kind: table
        title: "Diffuse ولا limited"
        columns: ["", "Diffuse", "Limited"]
        rows:
          - ["Skin", "Widespread, rapid", "Fingers and face"]
          - ["Course", "Rapid, early visceral involvement", "More benign (CREST)"]
          - ["Antibody", "Anti-Scl-70, anti-RNA polymerase III", "Anti-centromere"]
        hide: [[2, 1], [2, 2], [0, 2]]
        page: 481
        quote: "Diffuse scleroderma—widespread skin involvement, rapid progression, early visceral involvement. Associated with anti-Scl-70 antibody (anti-DNA topoisomerase-I antibody) and anti-RNA polymerase III."
      - kind: mnemonic
        word: "CREST"
        parts:
          - { key: "C", text: "Calcinosis cutis (and anti-Centromere)" }
          - { key: "R", text: "Raynaud phenomenon" }
          - { key: "E", text: "Esophageal dysmotility" }
          - { key: "S", text: "Sclerodactyly" }
          - { key: "T", text: "Telangiectasia" }
        hook: "الـ C بتاعة الـ CREST فيها حرفين: Calcinosis والـ anti-Centromere. افتكر الـ C الزيادة دي وانت بتختار الأجسام المضادة."
        page: 481
        quote: "CREST syndrome: Calcinosis cutis C , anti-Centromere antibody, Raynaud phenomenon, Esophageal dysmotility, Sclerodactyly, and Telangiectasia. More benign clinical course."
      - kind: check
        question: "A woman with tight skin spreading over her trunk develops sudden severe hypertension and rising creatinine. What is the best treatment?"
        options:
          - "ACE inhibitor"
          - "High-dose glucocorticoids"
          - "Beta blocker"
          - "Plasmapheresis"
        answer: 0
        why:
          - "صح: الـ scleroderma renal crisis بتتعالج بالـ ACE inhibitors."
          - "الكتاب بيقول إن الـ vasculopathy في الـ scleroderma noninflammatory، فالـ steroids مش بتعالج اللي بيحصل في الكلية. وبرّه الكتاب: الجرعات العالية من الـ steroids معروف إنها ممكن تعجّل بالـ renal crisis."
          - "بيوطّي الضغط آه، بس ما بيوقفش تكوين الـ angiotensin II زي الـ ACE inhibitor (علاج الكتاب). وبرّه الكتاب: ممكن يزوّد الـ Raynaud."
          - "الـ plasmapheresis بتشيل antibodies من الدم. الأزمة هنا من أوعية الكلية المقفولة، مش من antibody بيتشال، وعلاج الكتاب ACE inhibitors."
        page: 481
        quote: "renal (scleroderma renal crisis; treat with ACE inhibitors)"
      - kind: order
        prompt: "رتّب طبقات الـ epidermis من برّه لجوّه (come, let's get sunburned)"
        steps:
          - "Stratum corneum"
          - "Stratum lucidum"
          - "Stratum granulosum"
          - "Stratum spinosum"
          - "Stratum basale"
        why: "**C**ome **L**et's **G**et **S**un**B**urned: Corneum، Lucidum، Granulosum، Spinosum، Basale. وتحتهم الـ dermis والـ subcutaneous fat."
        page: 481
        quote: "Stratum corneum Stratum lucidum Stratum granulosum Stratum spinosum Stratum basale Dermis"
      - kind: explain
        title: "الوصلات: كل واحدة ليها مرض"
        text: |-
          - **Tight junction** (zonula occludens؛ claudins و occludins): بيمنع المرور بين الخلايا (paracellular).
          - **Adherens junction** (belt desmosome، zonula adherens): «حزام» بيربط الـ actin بتاع الخلايا اللي جنب بعض بالـ cadherins (Ca2+-dependent). فيه ==E-cadherin==، ولما يضيع الورم بيعمل metastasis: الخلية بتفك من جيرانها فتقدر تمشي.
          - **Desmosome** (spot desmosome، macula adherens): نقطة لحام بالـ intermediate filaments بتربط الخلايا ببعض ← لو اتهاجم = pemphigus vulgaris.
          - **Gap junction**: قنوات من الـ connexons بتعدّي إشارات كهربية وكيميائية بين الخلايا.
          - **Hemidesmosome**: بيربط الـ basal cells بالـ basement membrane ← لو اتهاجم = ==bullous pemphigoid==.
          - **Integrins**: بتمسك الـ collagen والـ laminin والـ fibronectin في الـ basement membrane.
        page: 482
        quote: "Hemidesmosome E –connects keratin in basal cells to underlying basement membrane. Autoantibodies → bullous pemphigoid."
      - kind: figure
        title: "مين بيمسك مين"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-good" x="40" y="20" width="120" height="90" rx="8"/>
            <rect class="fg-good" x="200" y="20" width="120" height="90" rx="8"/>
            <text x="70" y="70" class="t-sm t-b">Keratinocyte</text>
            <text x="230" y="70" class="t-sm t-b">Keratinocyte</text>
            <line class="fg-arrow-acc" x1="160" y1="55" x2="200" y2="55"/>
            <text x="138" y="45" class="t-sm t-acc">Desmosome</text>
            <rect class="fg-bad" x="20" y="130" width="320" height="12" rx="4"/>
            <text x="110" y="165" class="t-sm t-mut">Basement membrane</text>
            <line class="fg-arrow-acc" x1="100" y1="110" x2="100" y2="130"/>
            <text x="20" y="125" class="t-sm t-acc">Hemidesmosome</text>
          </svg>
        caption: "الـ desmosome بين خلية وخلية: لو اتضرب الخلايا تتفرق جوّه الـ epidermis (pemphigus vulgaris). الـ hemidesmosome بين الخلية والـ basement membrane: لو اتضرب الـ epidermis كله يتقلع (bullous pemphigoid)."
        alt: "Two keratinocytes joined by a desmosome; the lower cell anchored to the basement membrane by a hemidesmosome."
        page: 482
        quote: "Hemidesmosome E –connects keratin in basal cells to underlying basement membrane. Autoantibodies → bullous pemphigoid."
      - kind: match
        prompt: "وصّل نوع الغدة بمثالها"
        pairs:
          - ["Merocrine", "Salivary and sweat glands"]
          - ["Apocrine", "Mammary glands"]
          - ["Holocrine", "Sebaceous glands"]
        why: "التلاتة exocrine: بيطلّعوا منتجهم في ducts لبرّه الجسم، عكس الـ endocrine اللي بتفرز hormones. الـ sebaceous هي المثال الـ holocrine."
        page: 482
        quote: "Can be merocrine (eg, salivary and sweat glands), apocrine (eg, mammary glands), or holocrine (eg, sebaceous glands)."
      - kind: explain
        title: "الغدة بتدفع إيه عشان تفرز؟"
        text: |-
          الـ **exocrine gland** بتعمل حاجة غير الـ hormones وبتطلّعها في ==ducts لبرّه الجسم==. الفرق بين الأنواع التلاتة في التمن اللي الخلية بتدفعه:

          - **Merocrine**: ببلاش. الـ secretory vesicles تفضي برّه والخلية زي ما هي (العرق، الريق).
          - **Apocrine**: بتدفع ==حتة من نفسها==: الجزء اللي فوق من الخلية بيتقرص ويطلع مع الإفراز (الثدي).
          - **Holocrine**: بتدفع ==عمرها كله==: الخلية كلها بتتفكك وتبقى هي الإفراز (الـ sebaceous). عشان كده الـ sebum مليان دهون الخلايا نفسها.
        page: 482
        quote: "Secretory vesicle Merocrine secretion Apocrine secretion Holocrine secretion Pinched portion of cell Disintegrating cell"
      - kind: explain
        title: "مصطلحات بالعين"
        text: |-
          - **Macule** مسطح أقل من 1 cm (نمش)، و ==patch== مسطح أكبر من 1 cm (vitiligo).
          - **Papule** بارز أقل من 1 cm، و **plaque** بارز أكبر من 1 cm (psoriasis).
          - نفس قاعدة الـ 1 cm في الفقاقيع: **vesicle** صغيرة فيها سائل (chickenpox، shingles)، و ==bulla== أكبر من 1 cm (bullous pemphigoid)، و **pustule** = vesicle فيها صديد (pustular psoriasis).
          - **Wheal**: بارز ناعم و**بيروح** (hives). **Scale**: الـ stratum corneum بيتقشّر (eczema، psoriasis، SCC). **Crust**: إفراز نشف (impetigo).
          - **Erosion**: الـ epidermis راح من غير ما الـ basement membrane يبان (HSV، pemphigus vulgaris). **Ulcer**: الخسارة نزلت للـ dermis.
        page: 483
        quote: "Macule Flat lesion with well-circumscribed change in skin color <1 cm Freckle (ephelis), labial macule A Patch Macule >1 cm Vitiligo B"
      - kind: match
        prompt: "وصّل المصطلح الميكروسكوبي بمرضه"
        pairs:
          - ["Parakeratosis", "Psoriasis"]
          - ["Hypergranulosis", "Lichen planus"]
          - ["Acantholysis", "Pemphigus vulgaris"]
        why: "الـ parakeratosis = الأنوية لسه في الـ stratum corneum (الخلايا بتطلع بسرعة). الـ hypergranulosis = الـ granulosum تخنت. الـ acantholysis = الخلايا سابت بعض. وكمان: الـ spongiosis = سائل edema بين الخلايا في الـ epidermis (زي الإسفنجة)، وده في الـ eczematous dermatitis."
        page: 483
        quote: "Parakeratosis Retention of nuclei in stratum corneum Psoriasis, actinic keratosis Hypergranulosis ↑ thickness of stratum granulosum Lichen planus"
      - kind: try
        items: [msk.L03.001, msk.L03.002, msk.L03.004, msk.L03.010, msk.L03.019]
    recap:
      - "Diffuse: Scl-70 وأعضاء بدري. Limited/CREST: anti-centromere وأهدى."
      - "Scleroderma renal crisis: ACE inhibitors."
      - "Desmosome = pemphigus vulgaris، hemidesmosome = bullous pemphigoid."
      - "Parakeratosis = psoriasis، hypergranulosis = lichen planus، acantholysis = pemphigus."
    practice: [msk.L03.001, msk.L03.002, msk.L03.003, msk.L03.004, msk.L03.005, msk.L03.006, msk.L03.007, msk.L03.008, msk.L03.009, msk.L03.010, msk.L03.011, msk.L03.012, msk.L03.120, msk.L03.121, msk.L03.013, msk.L03.014, msk.L03.122, msk.L03.123, msk.L03.015, msk.L03.016, msk.L03.017, msk.L03.124, msk.L03.125, msk.L03.126, msk.L03.018, msk.L03.019, msk.L03.127, msk.L03.020]
  - id: msk.L03.lesson2
    title: "أمراض الجلد اللي في كل عيادة"
    hook: "من البهاق لحب الشباب للـ psoriasis: لكل واحد علامة بتفضحه"
    minutes: 9
    pages: [484, 486]
    topics: [pigmented-skin-disorders, seborrheic-dermatitis, common-skin-disorders, vascular-tumors-of-skin]
    status: unverified
    steps:
      - kind: explain
        title: "اللون: الخلية موجودة ولا لأ؟"
        text: |-
          - **Albinism**: الـ melanocytes **عددها طبيعي** بس الـ melanin قليل (==tyrosinase== ضعيف) ← خطر سرطان جلد.
          - **Vitiligo**: الـ melanocytes **اتدمّرت** (autoimmune) ← بقع بيضا تماماً، ومع أمراض autoimmune تانية.
          - **Melasma**: hyperpigmentation مكتسب مع الحمل ("mask of pregnancy") أو الـ OCP.
        page: 484
        quote: "Normal melanocyte number with ↓ melanin production A due to ↓ tyrosinase activity or defective tyrosine transport. ↑ risk of skin cancer."
      - kind: figure
        title: "الـ melanocyte موجودة ولا لأ؟"
        svg: |-
