  - id: msk.L03.lesson3
    title: "عدوى الجلد: البكتيريا بالعمق، والفطريات بالمكان"
    hook: "كل ما البكتيريا تنزل لتحت، المرض يبقى أخطر"
    minutes: 8
    pages: [487, 488]
    topics: [skin-infections, cutaneous-mycoses]
    status: unverified
    steps:
      - kind: figure
        title: "البكتيريا من فوق لتحت"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-good" x="20" y="15" width="320" height="30" rx="4"/>
            <text x="30" y="35" class="t-sm t-b">Epidermis: impetigo</text>
            <rect class="fg-good" x="20" y="50" width="320" height="30" rx="4"/>
            <text x="30" y="70" class="t-sm t-b">Upper dermis: erysipelas</text>
            <rect class="fg-bad" x="20" y="85" width="320" height="30" rx="4"/>
            <text x="30" y="105" class="t-sm t-b">Deep dermis and fat: cellulitis</text>
            <rect class="fg-bad" x="20" y="120" width="320" height="30" rx="4"/>
            <text x="30" y="140" class="t-sm t-b">Fascia: necrotizing fasciitis</text>
            <text x="230" y="172" class="t-sm t-mut">deeper = worse</text>
          </svg>
        caption: "الـ impetigo على السطح، الـ erysipelas في الـ upper dermis بحدود واضحة، الـ cellulitis أعمق (deeper dermis و subcutaneous)، والـ necrotizing fasciitis في الـ fascia وده طوارئ."
        alt: "Four skin layers stacked from epidermis to fascia, labelled impetigo, erysipelas, cellulitis and necrotizing fasciitis."
        page: 487
        quote: "Infection involving upper dermis and superficial lymphatics, usually from S pyogenes. Presents with well-defined, raised demarcation between infected and normal skin C ."
      - kind: explain
        title: "الـ erysipelas والـ fasciitis"
        text: |-
          - **Erysipelas**: الـ upper dermis، غالباً ==S pyogenes==، وحافة **بارزة وواضحة** بين الجلد المصاب والسليم.
          - **Necrotizing fasciitis** ("flesh-eating bacteria"): bullae و necrosis، وفي الـ fascia: إفراز رمادي زي ميّة المواعين وريحة، و**وجع أكتر بكتير من الفحص**.
        page: 487
        quote: "Fascia: pale, friable, ischemic fascia; dishwater-gray, malodorous exudate of surrounding tissue; severe pain out of proportion to exam."
      - kind: explain
        title: "انزل طبقة طبقة"
        text: |-
          القاعدة: كل ما العدوى تنزل لتحت، الحدود تبقى أقل وضوحاً والمرض أخطر.

          - **Impetigo**: الـ superficial epidermis بس، من S aureus أو S pyogenes. ==honey-colored crust== لأن الإفراز بينشف على السطح. معدي جداً. ولو فيه bullae يبقى **bullous impetigo**، وده غالباً S aureus.
          - **Erysipelas**: الـ upper dermis والـ lymphatics السطحية. الالتهاب محصور فوق، فالحافة **بارزة وواضحة**.
          - **Cellulitis**: أعمق: الـ deeper dermis والـ subcutaneous. حاد وموجع وبيفرش، وغالباً بيبدأ من ==جرح في الجلد== (trauma أو عدوى تانية). عشان أعمق، الحدود مش واضحة زي الـ erysipelas.
          - **Abscess**: صديد ==متحاوط بجدار== في الطبقات العميقة، والسبب تقريباً دايماً S aureus.
        page: 487
        quote: "Acute, painful, spreading infection of deeper dermis and subcutaneous tissues. Usually from S pyogenes or S aureus. Often starts with a break in skin from trauma or another infection D ."
      - kind: reveal
        prompt: "ليه الـ necrotizing fasciitis بيعمل crepitus، وليه الوجع أكتر من الفحص؟"
        answer: "البكتيريا (غالباً ==anaerobes==، أو S pyogenes، أو S aureus ومنه MRSA) بتطلّع **methane و CO2** ← غاز تحت الجلد بتحسه طقطقة (crepitus). والعدوى ماشية في الـ fascia تحت الجلد، فالجلد من برّه لسه شكله أهدى من اللي بيحصل تحت ← وجع out of proportion. وده ==surgical emergency==."
        page: 487
        quote: "Deeper tissue injury, usually from anaerobic bacteria, S pyogenes, or S aureus (including MRSA)."
      - kind: explain
        title: "الفيروسات على الجلد"
        text: |-
          - **HSV-1 و HSV-2**: في أي حتة من الـ mucosa للجلد العادي: herpes labialis، herpes genitalis، و ==herpetic whitlow== على الصباع.
          - **Molluscum contagiosum**: papules ==umbilicated== (في نصها سُرّة) من poxvirus. كتير في الأطفال، وفي الكبار ممكن sexually transmitted.
          - **Varicella zoster**: الـ chickenpox بتيجي ==crops== في مراحل مختلفة في نفس الوقت (vesicles جنب crusts). الـ zoster = الفيروس صحي تاني في dermatome واحد (إلا لو disseminated)، لأنه كان نايم في الـ ganglion بتاع العصب ده.
        page: 487
        quote: "Varicella presents with multiple crops of lesions in various stages from vesicles to crusts. Zoster is a reactivation of the virus in dermatomal distribution (unless it is disseminated)."
      - kind: check
        question: "A newborn has fever and peeling skin with a positive Nikolsky sign but no mouth lesions. At which level does the toxin split the skin?"
        options:
          - "Stratum granulosum"
          - "Epidermal-dermal junction"
          - "Stratum basale"
          - "Papillary dermis"
        answer: 0
        why:
          - "صح: الـ SSSS بيفرّق في الـ stratum granulosum بس، ومفيش mucosa."
          - "دي الـ TEN، ومعاها mucosa."
          - "الـ exotoxin بيفك وصلات الخلايا في الـ granulosum بس، فالفصل عالي. الـ basale أعمق بكتير، تحت الـ spinosum، وجنب الـ junction اللي بتتفصل في الـ TEN."
          - "الـ papillary dermis تحت الـ epidermis خالص. الـ SSSS بيقشّر الطبقات العليا من الـ epidermis بس، وعلشان كده الجلد بيلم كله."
        page: 487
        quote: "Exotoxin destroys keratinocyte attachments in stratum granulosum only (vs toxic epidermal necrolysis, which destroys epidermal-dermal junction). No mucosal involvement."
      - kind: aside
        tone: trap
        text: "التلات حاجات البيضا في البق: ==hairy leukoplakia== (EBV، جنب اللسان، **ما بتتكشطش**)، و thrush (بتتكشط)، و leukoplakia (precancerous)."
        page: 487
        quote: "Irregular, white, painless plaques on lateral tongue that cannot be scraped off J . EBV mediated. Occurs in patients living with HIV, organ transplant recipients. Contrast with thrush (scrapable) and leukoplakia (precancerous)."
      - kind: explain
        title: "الفطريات: الـ dermatophytes"
        text: |-
          Microsporum و Trichophyton و Epidermophyton. على الـ KOH: ==branching septate hyphae==، ومعاهم حكة.

          الاسم بيتغيّر بالمكان: tinea capitis (الراس)، corporis (الجسم، ringworm بنص فاضي، ومن الحيوانات الأليفة)، cruris (الأربية)، pedis (الرجل)، unguium (الضوافر).
        page: 488
        quote: "Dermatophytes include Microsporum, Trichophyton, and Epidermophyton. Branching septate hyphae visible on KOH preparation with blue fungal stain A . Associated with pruritus."
      - kind: reveal
        prompt: "ليه الـ tinea versicolor بتعمل بقع فاتحة، وإمتى بتكتر؟"
        answer: "الـ Malassezia بتكسّر الدهون لأحماض بتوقّف الـ ==tyrosinase== ← melanin أقل ← بقع فاتحة. وأحياناً الالتهاب يخلّي البقع أغمق أو بمبي. وبتيجي في أي وقت، بس أكتر في ==الصيف== (حر ورطوبة)، وبتهرش أقل من الـ dermatophytes."
        page: 488
        quote: "Degradation of lipids produces acids that inhibit tyrosinase (involved in melanin synthesis) → hypopigmentation G ; hyperpigmentation and/or pink patches can also occur due to inflammatory response. Less pruritic than dermatophytes. Can occur any time of year, but more common in summer (hot, humid weather)."
      - kind: try
        items: [msk.L03.042, msk.L03.044, msk.L03.047, msk.L03.051, msk.L03.052]
    recap:
