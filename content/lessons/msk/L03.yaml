  - id: msk.L03.lesson4
    title: "الفقاقيع والقرح"
    hook: "الفقاعة الرخوة ولا المشدودة؟ السؤال ده لوحده بيحل نص الأسئلة"
    minutes: 8
    pages: [489, 491]
    topics: [autoimmune-blistering-skin-disorders, other-blistering-skin-disorders, cutaneous-ulcers]
    status: unverified
    steps:
      - kind: table
        title: "Pemphigus vulgaris ولا bullous pemphigoid"
        columns: ["", "Pemphigus vulgaris", "Bullous pemphigoid"]
        rows:
          - ["Target", "Desmosomes", "Hemidesmosomes"]
          - ["Bullae", "Flaccid, intraepidermal", "Tense, subepidermal"]
          - ["Oral mucosa", "Involved", "Spared"]
          - ["Nikolsky", "Positive", "Negative"]
          - ["Immunofluorescence", "Reticular", "Linear"]
        hide: [[1, 1], [2, 2], [4, 1], [4, 2]]
        page: 489
        quote: "Flaccid intraepidermal bullae A caused by acantholysis (separation of keratinocytes, “row of tombstones” on H&E stain); oral mucosa is involved. Nikolsky sign ⊕."
      - kind: aside
        tone: tip
        text: "الـ **P**emphigus **V**ulgaris: الخلايا بتسيب بعض جوّه الـ epidermis، فالفقاعة رخوة وبتتقطع بسهولة والبق بيتصاب. الـ ==pemphigoid== أعمق: الـ epidermis كله بيرفع فالفقاعة مشدودة. الاتنين ==type II== hypersensitivity."
        page: 489
        quote: "Potentially fatal. Most commonly seen in older adults. Type II hypersensitivity reaction."
      - kind: check
        question: "A man with celiac disease has itchy grouped vesicles on his elbows. What does immunofluorescence of his skin show?"
        options:
          - "IgA at the tips of dermal papillae"
          - "Linear IgG at the epidermal-dermal junction"
          - "Reticular IgG around epidermal cells"
          - "No immune deposits"
        answer: 0
        why:
          - "صح: الـ dermatitis herpetiformis = IgA في الـ dermal papillae، والعلاج dapsone وأكل من غير gluten."
          - "ده bullous pemphigoid."
          - "ده pemphigus vulgaris."
          - "فيه deposits، وده المفتاح."
        page: 490
        quote: "Deposits of IgA at tips of dermal papillae. Associated with celiac disease. Treatment: dapsone, gluten-free diet."
      - kind: explain
        title: "من erythema multiforme لـ TEN"
        text: |-
          - **Erythema multiforme**: أنواع كتير من الـ lesions، أشهرها ==target lesions==. مع عدوى (HSV، M pneumoniae) أو أدوية (sulfa، phenytoin).
          - **SJS** و **TEN**: نفس المرض بدرجات، والفرق في مساحة الجلد اللي بتتقشر. السبب غالباً **adverse drug reaction**، ومعاه حرارة والـ mucous membranes. أكتر من 30% من الجلد = TEN، و10-30% = SJS-TEN.
          - **Epidermolysis bullosa**: وراثي، فقاقيع من الصغر ومع الرضاعة بالببرونة، من mutations في جينات الـ keratin.
        page: 490
        quote: "Presents with multiple types of lesions—macules, papules, vesicles, target lesions (look like targets with multiple rings and dusky center showing epithelial disruption) B ."
