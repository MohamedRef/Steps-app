  - id: msk.L02.lesson7
    title: "الـ lupus والعضلات اللي بتوجع"
    hook: "RASH OR PAIN بتلم الـ lupus كله. وبعدها: العضلة بتوجع ولا ضعيفة؟ الـ CK بيفرّق"
    minutes: 10
    pages: [476, 477]
    topics: [systemic-lupus-erythematosus, mixed-connective-tissue-disease, antiphospholipid-syndrome, muscle-wasting, polymyalgia-rheumatica, fibromyalgia, polymyositis-dermatomyositis, myositis-ossificans, igg4-related-disease]
    status: unverified
    steps:
      - kind: explain
        title: "SLE: immune complexes في كل حتة"
        text: |-
          الضرر أساساً **type III** (immune complexes)، وأقل type II. ونقص الـ ==early complement== (C1q و C4 و C2) بيخلّي الـ immune complexes ما تتنضفش.

          الكلاسيك: ست في سن الإنجاب، طفح على الوش ==بيسيب الـ nasolabial folds==، ووجع مفاصل، وحمى.
        page: 476
        quote: "Associated with deficiency of early complement proteins (eg, C1q, C4, C2) → ↓ clearance of immune complexes."
      - kind: mnemonic
        word: "RASHORPAIN"
        parts:
          - { key: "R", text: "Rash (malar or discoid)" }
          - { key: "A", text: "Arthritis (nonerosive)" }
          - { key: "S", text: "Serositis (pleuritis, pericarditis)" }
          - { key: "H", text: "Hematologic disorders (cytopenias)" }
          - { key: "O", text: "Oral/nasopharyngeal ulcers (usually painless)" }
          - { key: "R", text: "Renal disease" }
          - { key: "P", text: "Photosensitivity" }
          - { key: "A", text: "Antinuclear antibodies" }
          - { key: "I", text: "Immunologic disorder (anti-dsDNA, anti-Sm, antiphospholipid)" }
          - { key: "N", text: "Neurologic disorders (seizures, psychosis)" }
        hook: "الكتاب: RASH OR PAIN، والـ arthritis في الـ lupus nonerosive، عكس الـ RA."
        page: 476
        quote: "Rash (malar A or discoid B ) Arthritis (nonerosive) Serositis (eg, pleuritis, pericarditis) Hematologic disorders (eg, cytopenias) Oral/nasopharyngeal ulcers (usually painless) Renal disease Photosensitivity Antinuclear antibodies"
      - kind: aside
        tone: trap
        text: "أشهر سبب **وفاة** في الـ SLE مش الكلى: ده ==cardiovascular disease==. والكلى أشهر نوع فيها diffuse proliferative. والقلب: Libman-Sacks Endocarditis (LSE in SLE)."
        page: 476
        quote: "Common causes of death in SLE: renal disease, infections, cardiovascular disease (most common cause of death)."
      - kind: reveal
        prompt: "ست عندها anti-SSA وحامل. الطفل ممكن يتولد بإيه، وليه؟"
        answer: "==Neonatal lupus==: الـ anti-SSA (IgG) بيعدّي الـ placenta ← congenital heart block، وطفح حوالين العين، و transaminitis، و cytopenias عند الولادة."
        page: 476
        quote: "In an anti-SSA ⊕ pregnant patient, ↑ risk of newborn developing neonatal lupus → congenital heart block, periorbital/diffuse rash, transaminitis, and cytopenias at birth."
      - kind: explain
        title: "MCTD و antiphospholipid"
        text: |-
          - **MCTD**: شوية SLE على شوية systemic sclerosis على شوية polymyositis، مع ==anti-U1 RNP== (speckled ANA).
          - **Antiphospholipid**: جلطات (شرايين أو أوردة) أو إجهاض متكرر + lupus anticoagulant أو anticardiolipin أو anti-β2 glycoprotein I. العلاج: anticoagulation.

          فخّين: الـ anticardiolipin بيعمل ==false-positive VDRL==، والـ lupus anticoagulant بيطوّل الـ PTT ومش بيتصلّح لما تضيف plasma طبيعي.
        page: 476
        quote: "Anticardiolipin antibodies can cause false- positive VDRL/RPR. Lupus anticoagulant can cause prolonged PTT that is not corrected by the addition of normal platelet-free plasma."
      - kind: check
        question: "A woman with SLE has had a DVT and two miscarriages. Her PTT is prolonged and does not correct with normal plasma. What is the treatment?"
        options:
          - "Systemic anticoagulation"
          - "Factor VIII concentrate"
          - "Vitamin K"
          - "Fresh frozen plasma to correct the PTT"
        answer: 0
        why:
          - "صح: ده antiphospholipid syndrome (lupus anticoagulant). الـ PTT طويل في الأنبوبة بس، وفي الجسم بيعمل جلطات، فالعلاج systemic anticoagulation."
          - "الـ factor VIII للـ hemophilia A، وده نزيف بيتصلّح بالـ mixing؛ هي بتجلّط مش بتنزف."
          - "فيتامين K بيصلّح الـ PT في نقصه؛ هنا المشكلة antibodies مش نقص factors."
          - "الـ PTT الطويل artifact في الأنبوبة؛ تصحيحه بالـ plasma ما بيمنعش الجلطات."
        page: 476
        quote: "Treatment: systemic anticoagulation. Anticardiolipin antibodies can cause false- positive VDRL/RPR. Lupus anticoagulant can cause prolonged PTT that is not corrected by the addition of normal platelet-free plasma."
      - kind: table
        title: "العضلة: وجع ولا ضعف؟"
