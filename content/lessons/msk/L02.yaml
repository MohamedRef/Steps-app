  - id: msk.L02.lesson3
    title: "أمراض العضم الأيضية: اقرا التحاليل"
    hook: "4 أرقام (Ca، PO4، ALP، PTH) بيفرّقوا بين 7 أمراض. افهم المنطق ومش هتحفظ الجدول"
    minutes: 10
    pages: [467, 469]
    topics: [osteoporosis, osteopetrosis, osteomalacia-rickets, osteitis-deformans, avascular-necrosis-of-bone, lab-values-in-bone-disorders]
    goals:
      - "تفرّق بين osteoporosis و osteopetrosis و osteomalacia و Paget"
      - "تقرا جدول التحاليل بالمنطق"
      - "تعرف أسباب الـ AVN بـ CASTS Bend LEGS"
    status: unverified
    steps:
      - kind: explain
        title: "Osteoporosis: عضم قليل بس سليم"
        text: |-
          العضم (trabecular و cortical) ==كميته قليلة== بس الـ mineralization سليم، فالتحاليل كلها **طبيعية**.

          السبب الأشهر: هدم زيادة (osteoclasts أكتر وأنشط) مع قلة الـ estrogen والسن والتدخين. أو 2°: steroids و alcohol و anticonvulsants و anticoagulants و thyroid replacement و PPIs، أو hyperparathyroidism و hyperthyroidism و myeloma و malabsorption و anorexia، ووزن قليل، وحتى السفر للفضاء.

          **التشخيص**: DEXA بـ ==T-score ≤ −2.5== أو fragility fracture في الـ hip أو الـ vertebra.
        page: 467
        quote: "Diagnosed by bone mineral density measurement by DEXA (dual-energy x-ray absorptiometry) at the lumbar spine, total hip, and femoral neck, with a T-score of ≤ −2.5 or by a fragility fracture"
      - kind: explain
        title: "Osteopetrosis: الهدّام عطلان"
        text: |-
          العكس بالظبط: الـ osteoclast ==مش قادر يعمل حمض== (mutation في الـ carbonic anhydrase II)، فالعضم ما بيتهدّش ← عضم تخين وكثيف بس **هش**.

          العضم الزيادة بيملا الـ marrow ← **pancytopenia** و extramedullary hematopoiesis، وبيضيّق الفتحات ← cranial nerve palsies. الـ x-ray: "stone bone".

          والعلاج الشافي: ==bone marrow transplant==، لأن الـ osteoclast أصله monocyte.
        page: 468
        quote: "Bone marrow transplant is potentially curative as osteoclasts are derived from monocytes."
      - kind: reveal
        prompt: "في نقص فيتامين D: ليه الـ PO4 بيقل، مع إن فيتامين D بيمتص الاتنين Ca و PO4؟"
        answer: "فيتامين D يقل ← Ca يقل ← الـ ==PTH يعلى== يعوّض. والـ PTH بيرمي الـ phosphate في البول ← PO4 يقل أكتر. والـ osteoblasts بتشتغل زيادة ← ALP يعلى."
        page: 468
        quote: "↓ vitamin D → ↓ serum Ca2+ → ↑ PTH secretion → ↓ serum PO 3− 4 . Hyperactivity of osteoblasts → ↑ ALP."
      - kind: explain
        title: "Paget: هدم وبناء من غير نظام"
        text: |-
          **Osteitis deformans**: في مكان معيّن، osteoclasts نشيطة وبعدها osteoblasts بتبني بسرعة عضم ==وحش== (mosaic من woven و lamellar).

          التحاليل: Ca و PO4 و PTH **طبيعيين**، و ==ALP عالي== لوحده.

          المضاعفات: chalk-stick fractures، high-output heart failure (AV shunts)، **osteosarcoma**، البرنيطة بتضيق (الجمجمة بتتخن)، والسمع بيقل. المراحل: lytic ← mixed ← sclerotic. العلاج: bisphosphonates.
        page: 468
        quote: "Serum Ca2+ , phosphorus, and PTH levels are normal. ↑ ALP. Mosaic pattern of woven and lamellar bone (osteocytes within lacunae in chaotic juxtapositions); long bone chalk-stick fractures."
      - kind: aside
        tone: joke
        text: "مريض Paget بيقولك: «يا دكتور الطاقية بقت ضيقة» (hat size زاد من skull thickening). ما تقولوش يغيّر الطاقية؛ اطلب ==ALP==."
        page: 468
        quote: "Hat size can be increased due to skull thickening A ; hearing loss is common due to skull deformity."
      - kind: table
        title: "جدول التحاليل"
        columns: ["Disorder", "Ca2+", "PO4", "ALP", "PTH"]
        rows:
          - ["Osteoporosis", "—", "—", "—", "—"]
          - ["Paget disease", "—", "—", "↑", "—"]
          - ["1° hyperparathyroidism", "↑", "↓", "↑", "↑"]
          - ["2° hyperparathyroidism (CKD)", "↓", "↑", "↑", "↑"]
          - ["Osteomalacia/rickets", "↓", "↓", "↑", "↑"]
          - ["Hypervitaminosis D", "↑", "↑", "—", "↓"]
        hide: [[2, 2], [3, 1], [3, 2], [4, 2], [5, 2], [5, 4]]
        page: 469
        quote: "Paget disease of bone — — ↑ — Abnormal “mosaic” bone architecture"
      - kind: aside
        tone: tip
        text: "حيلة الجدول: الـ **PTH** بيرمي الـ phosphate، فلما يكون هو السبب (1°) Ca ↑ و PO4 ↓. في الـ CKD الكلية مش قادرة ترمي الـ phosphate، فـ ==PO4 ↑== و Ca ↓. وفي زيادة فيتامين D (sarcoidosis) الاتنين ↑ والـ PTH مكتوم."
        page: 469
        quote: "Hypervitaminosis D ↑ ↑ — ↓ Caused by oversupplementation or granulomatous disease (eg, sarcoidosis)"
      - kind: check
        question: "A patient on dialysis has low Ca2+, high PO4, high ALP and high PTH. Which disorder?"
        options:
          - "Secondary hyperparathyroidism"
          - "Primary hyperparathyroidism"
          - "Hypervitaminosis D"
