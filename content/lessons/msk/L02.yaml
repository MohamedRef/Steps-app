  - id: msk.L02.lesson4
    title: "أورام العضم: المكان بيقول الاسم"
    hook: "epiphysis ولا metaphysis ولا diaphysis؟ اعرف المكان والسن، وهتعرف الورم قبل ما تشوف الـ biopsy"
    minutes: 9
    pages: [470, 471]
    topics: [primary-bone-tumors]
    status: unverified
    steps:
      - kind: explain
        title: "القاعدة الأول"
        text: |-
          - الـ ==metastasis أكتر== من أورام العضم الأولية.
          - الحميد بيخلص بـ -oma، واللي بيبدأ بـ c أو o أكتر في الولاد.
          - الخبيث غالباً بيخلص بـ -sarcoma.
        page: 470
        quote: "Metastatic disease is more common than bone tumors. Benign bone tumors end with -oma, those that start with a c and o are more common in boys. Malignant tumors usually have the ending “-sarcoma”."
      - kind: figure
        title: "خريطة الورم على العضمة"
        svg: |-
          <svg viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-acc" x="40" y="15" width="60" height="35" rx="14"/>
            <rect class="fg-box" x="48" y="50" width="44" height="40" rx="4"/>
            <rect class="fg-box" x="55" y="90" width="30" height="105" rx="4"/>
            <line class="fg-thin" x1="40" y1="50" x2="100" y2="50"/>
            <text x="110" y="28" class="t-sm t-b">Epiphysis</text>
            <text x="110" y="42" class="t-sm t-mut">giant cell tumor</text>
            <text x="110" y="64" class="t-sm t-b">Metaphysis</text>
            <text x="110" y="78" class="t-sm t-mut">osteosarcoma, osteochondroma,</text>
            <text x="110" y="91" class="t-sm t-mut">simple bone cyst</text>
            <text x="110" y="124" class="t-sm t-b">Diaphysis</text>
            <text x="110" y="138" class="t-sm t-mut">round cell lesions: Ewing sarcoma,</text>
            <text x="110" y="151" class="t-sm t-mut">myeloma; fibrous dysplasia;</text>
            <text x="110" y="164" class="t-sm t-mut">osteoid osteoma</text>
            <text x="20" y="214" class="t-sm t-mut">physis = line between epiphysis and metaphysis</text>
          </svg>
        caption: "رسمة الكتاب: الـ epiphysis (الطرف): giant cell tumor. الـ metaphysis: osteosarcoma و osteochondroma و simple bone cyst. الـ diaphysis (الجسم): الـ round cell lesions (Ewing و myeloma)، و fibrous dysplasia، و osteoid osteoma."
        alt: "A long bone with three labelled regions: epiphysis with giant cell tumor; metaphysis with osteosarcoma, osteochondroma and simple bone cyst; diaphysis with round cell lesions (Ewing sarcoma, myeloma), fibrous dysplasia and osteoid osteoma."
        page: 471
        quote: "Diaphysis Round cell lesions Ewing sarcoma Myeloma Fibrous dysplasia Simple bone cyst Osteochondroma Physis Giant cell tumor Osteosarcoma Metaphysis Epiphysis Osteoid osteoma"
      - kind: explain
        title: "الحميد"
        text: |-
          - **Osteochondroma**: ==أشهر ورم حميد==. نتوء عضمي من الـ growth plate، متوصّل بالـ marrow، عليه طاقية cartilage، وبيشاور **بعيد عن المفصل**. EXT1/EXT2 ← multiple exostoses. نادراً ← chondrosarcoma.
          - **Osteoma**: عضم الوش، مع Gardner syndrome.
          - **Osteoid osteoma** (<1.5 cm، cortex): وجع **بالليل** من الـ prostaglandins ← بيروح بالـ ==NSAIDs==. **Osteoblastoma** (>2 cm، vertebrae): الـ NSAIDs ما بتنفعش.
          - **Giant cell tumor** (20-40، ستات): epiphysis، "soap bubble"، الخلايا بتطلّع RANKL ← "osteoclastoma".
        page: 470
        quote: "Classically presents as bone pain (worse at night) caused by prostaglandins; thus relieved by NSAIDs (vs osteoblastoma)."
      - kind: check
        question: "A 30-year-old woman has a lytic 'soap bubble' lesion in the distal femoral epiphysis. What do the tumor cells express?"
        options:
          - "RANKL"
          - "EWS-FLI1"
          - "EXT1 mutation"
          - "Prostaglandins causing night pain"
        answer: 0
        why:
          - "صح: giant cell tumor، الخلايا الـ mononuclear بتطلّع RANKL فتجمّع osteoclastlike giant cells."
          - "ده Ewing (diaphysis، طفل)."
          - "ده osteochondroma."
          - "ده osteoid osteoma، ورم صغير في الـ cortex."
        page: 470
        quote: "Locally aggressive benign tumor neoplastic mononuclear cells that express RANKL and reactive multinucleated giant (osteoclastlike) cells; “osteoclastoma”. “Soap bubble” appearance on x-ray C ."
      - kind: explain
        title: "Osteosarcoma"
        text: |-
          20% من أورام العضم الأولية. ==قمتين==: مراهقين (ولاد <20)، وكبار في السن (غالباً بعد Paget أو radiation أو bone infarcts). الـ familial retinoblastoma و Li-Fraumeni بيزوّدوا الخطر بدري.

          المكان: metaphysis، حوالين الركبة. خلايا بتعمل osteoid. الـ x-ray: ==Codman triangle== (الـ periosteum مرفوع) أو sunburst، والكتاب بيقولها: osteocod بيعوم في الشمس.
        page: 471
        quote: "Codman triangle D (from elevation of periosteum) or sunburst pattern on x-ray E (think of an osteocod [bone fish] swimming in the sun)."
      - kind: explain
        title: "Ewing والـ chondrosarcoma"
        text: |-
          - **Ewing**: ولد أبيض <15، **diaphysis** (femur) والحوض. small blue cells شبه الـ lymphocytes، فبنفرّقه بالـ ==t(11;22)== (EWS-FLI1). "Onion skin". عدواني وبيعمل metastasis بدري، بس بيستجيب للـ chemo. 11 + 22 = 33، رقم فانلة Patrick Ewing.
          - **Chondrosarcoma**: كبار >50، medulla الحوض والـ proximal femur والـ humerus.
        page: 471
        quote: "11 + 22 = 33 (Patrick Ewing’s jersey number)."
      - kind: sort
        prompt: "حط كل ورم حميد في مكانه (جدول الكتاب)"
        bins: ["Epiphysis", "Metaphysis", "Cortex of long bones", "Vertebrae"]
        cards:
          - { text: "Giant cell tumor", bin: 0 }
          - { text: "Chondroblastoma", bin: 0 }
          - { text: "Osteochondroma", bin: 1 }
          - { text: "Osteoid osteoma", bin: 2 }
          - { text: "Osteoblastoma", bin: 3 }
        why: "الاتنين اللي في الطرف: giant cell (بعد ما الـ plate تقفل) و chondroblastoma (قبلها، وبيعدّي الـ physis). الـ osteochondroma نتوء من الـ growth plate فبيطلع في الـ metaphysis. الـ osteoid osteoma في الـ cortex، وأخوه الكبير الـ osteoblastoma في الـ vertebrae."
        page: 470
        quote: "Epiphysis of long bones after skeletal maturation (often in knee region); may extend into metaphysis if large. Locally aggressive benign tumor neoplastic mononuclear cells that express RANKL and reactive multinucleated giant (osteoclastlike) cells; “osteoclastoma”. “Soap bubble” appearance on x-ray C . Chondroblastoma Adolescents. Males > females. Epiphysis of long bones before skeletal maturation (often in knee region)."
      - kind: check
        question: "A 13-year-old boy has a femoral diaphysis lesion with onion-skin periosteal reaction and small round blue cells. Which test confirms it?"
        options:
          - "t(11;22)"
          - "RB1 sequencing"
          - "Serum ALP"
          - "Bone marrow biopsy for plasma cells"
        answer: 0
        why:
          - "صح: Ewing، والـ t(11;22) بيفرّقه عن الـ lymphoma والـ chronic osteomyelitis."
          - "RB1 بيزوّد خطر الـ osteosarcoma، وده metaphysis."
          - "الـ ALP مش تشخيصي."
          - "الـ plasma cells للـ myeloma."
        page: 471
        quote: "Differentiate from conditions with similar morphology (eg, lymphoma, chronic osteomyelitis) by testing for t(11;22) (fusion protein EWS-FLI1)."
      - kind: try
        items: [msk.L02.075, msk.L02.077, msk.L02.078, msk.L02.081, msk.L02.083]
    recap:
      - "Metastasis أكتر. الحميد -oma، الخبيث -sarcoma."
      - "Osteochondroma أشهر حميد؛ osteoid osteoma يروح بالـ NSAIDs؛ giant cell = epiphysis و soap bubble و RANKL."
      - "Osteosarcoma: metaphysis، قمتين، Codman/sunburst، Paget و RB و Li-Fraumeni."
      - "Ewing: diaphysis، onion skin، t(11;22)."
