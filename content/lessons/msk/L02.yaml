schema: steps.lesson/v1
lecture: msk.L02
lessons:
  - id: msk.L02.lesson1
    title: "خلايا العضم وإصابات كل يوم"
    hook: "الـ osteoblast بيبني والـ osteoclast بيهد، والـ RANKL هو المفتاح. وبعدها جولة على الإصابات اللي هتشوفها في أي عيادة"
    minutes: 10
    pages: [462, 465]
    topics: [cell-biology-of-bone, overuse-injuries-of-the-elbow, clavicle-fractures, wrist-and-hand-injuries, psoas-abscess, common-knee-conditions, common-musculoskeletal-conditions]
    goals:
      - "تفهم الـ RANK-RANKL-OPG وإزاي الـ PTH والـ estrogen بيأثروا"
      - "تعرف الـ carpal tunnel وليه الـ thenar حسه سليم"
      - "تعرف الـ compartment syndrome وعلاماته المتأخرة"
    status: unverified
    steps:
      - kind: explain
        title: "البنّا والهدّام"
        text: |-
          - **Osteoblast**: البنّا. بيفرز collagen ويعمل mineralization بالـ ==ALP==. جاي من الـ mesenchymal stem cells. نقيس شغله بالـ bone ALP والـ osteocalcin.
          - **Osteoclast**: الهدّام. بيفرز H+ و collagenases. جاي من اندماج خلايا الـ monocyte/macrophage.

          والاتنين بيكلّموا بعض: الـ osteoblast بيطلّع **RANKL** يشغّل الـ RANK على الـ osteoclast. والـ ==OPG== طُعم بيمسك الـ RANKL فيوقف الهدم.
        page: 462
        quote: "RANK receptors on osteoclasts are stimulated by RANKL (RANK ligand, expressed on osteoblasts). OPG (osteoprotegerin, a RANKL decoy receptor) binds RANKL to prevent RANK-RANKL interaction"
      - kind: figure
        title: "RANKL بيشغّل، OPG بيطفّي"
        svg: |-
          <svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="msk2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-acc" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <rect class="fg-good" x="15" y="55" width="100" height="50" rx="10"/>
            <text x="30" y="85" class="t-sm t-b">Osteoblast</text>
            <line class="fg-arrow-acc" x1="115" y1="80" x2="225" y2="80" marker-end="url(#msk2a)"/>
            <text x="140" y="72" class="t-sm t-acc">RANKL → RANK</text>
            <rect class="fg-bad" x="230" y="55" width="115" height="50" rx="10"/>
            <text x="245" y="85" class="t-sm t-b">Osteoclast</text>
            <circle class="fg-dot-bad" cx="170" cy="125" r="8"/>
            <text x="150" y="150" class="t-sm t-bad">OPG traps RANKL</text>
            <text x="20" y="30" class="t-sm t-mut">builds bone (ALP)</text>
            <text x="235" y="30" class="t-sm t-mut">resorbs bone (H+)</text>
          </svg>
        caption: "الـ osteoblast بيطلّع RANKL يشغّل الـ osteoclast. الـ OPG بيمسك الـ RANKL قبل ما يوصل، فالهدم يقل."
        alt: "An osteoblast sends RANKL to RANK on an osteoclast, activating bone resorption; OPG traps RANKL in between and blocks it."
        page: 462
        quote: "RANK receptors on osteoclasts are stimulated by RANKL (RANK ligand, expressed on osteoblasts)."
      - kind: reveal
        prompt: "الـ PTH هو هرمون رفع الكالسيوم من العضم. إزاي بيبقى دوا للـ osteoporosis (teriparatide)؟"
        answer: "المهم **النمط**: الـ PTH بجرعات قليلة **متقطعة** ← anabolic (بيبني). الـ PTH العالي **على طول** (1° hyperparathyroidism) ← catabolic ← ==osteitis fibrosa cystica==."
        page: 462
        quote: "At low, intermittent levels, exerts anabolic effects (building bone) on osteoblasts and osteoclasts (indirect). Chronically ↑ PTH levels (1° hyperparathyroidism) cause catabolic effects (osteitis fibrosa cystica)."
      - kind: explain
        title: "الـ carpal tunnel: الإبهام بيضمر والحس سليم"
        text: |-
          الـ median بيتزنق بين الـ transverse carpal ligament والـ carpal bones ← تنميل ووجع في توزيعه، والـ ==thenar بيضمر==.

          بس الحس على الـ thenar نفسه **سليم**، لأن الـ palmar cutaneous branch بيدخل الإيد من **فوق** النفق.

          **الفحص**: Tinel (خبطة على الرسغ) و Phalen (ثني الرسغ 90°). **مع إيه؟** حمل، RA، hypothyroidism، سكر، acromegaly، و amyloidosis من الغسيل الكلوي.
        page: 463
        quote: "Thenar eminence atrophies but sensation spared, because palmar cutaneous branch enters hand external to carpal tunnel."
      - kind: check
        question: "Which condition is NOT listed by First Aid as associated with carpal tunnel syndrome?"
        options:
          - "Hyperthyroidism"
          - "Pregnancy"
          - "Acromegaly"
          - "Dialysis-related amyloidosis"
        answer: 0
        why:
          - "صح: الكتاب بيقول hypothyroidism، مش hyperthyroidism."
          - "الحمل موجود (edema)."
          - "الـ acromegaly موجود."
          - "الـ amyloidosis من الغسيل موجود."
        page: 463
        quote: "Associated with pregnancy (due to edema), rheumatoid arthritis, hypothyroidism, diabetes, acromegaly, dialysis-related amyloidosis"
      - kind: aside
        tone: exam
        text: "إصابات سريعة: الـ **clavicle**: أضعف نقطة عند ملتقى الـ middle والـ lateral third، بس ==أكتر كسر بيحصل في الـ middle third== (الكتف يقع). الـ ==boxer's fracture== = الـ 5th metacarpal neck (خبط في حيطة)."
        page: 463
        quote: "Most commonly the 5th metacarpal A (“boxer’s fracture”). Typically occurs in young males due to direct trauma (eg, punching a wall)."
      - kind: aside
        tone: exam
        text: "**Psoas abscess**: صديد في الـ iliopsoas، جاي من الدم أو من حاجة جنبه (vertebral osteomyelitis، Pott disease، pyelonephritis). مع Crohn والسكر ونقص المناعة. أكتر organism: ==S aureus==، وممكن TB. العلامة: ==psoas sign== (فرد الـ hip بيزوّد وجع أسفل البطن)، مع flank pain وحمى و inguinal mass. العلاج: drainage و antibiotics."
        page: 463
        quote: "May spread from blood (hematogenous) or from adjacent structures (eg, vertebral osteomyelitis, tuberculous spondylitis [also called Pott disease], pyelonephritis). Associated with Crohn disease, diabetes, and immunocompromised states. Staphylococcus aureus most commonly isolated, but may also occur 2° to tuberculosis. Findings: flank pain, fever, inguinal mass, ⊕ psoas sign (hip extension exacerbates lower abdominal pain)."
      - kind: aside
        tone: exam
        text: "الكوع: **golfer's** = medial epicondyle (wrist flexion)، **tennis** = lateral epicondyle (wrist extension، backhand)."
        page: 462
        quote: "Repetitive wrist extension (backhand shots) or idiopathic → pain near lateral epicondyle."
      - kind: explain
        title: "الركبة: الثالوث التعيس والـ bursae"
        text: |-
          - **Unhappy triad**: قوة من برّه والرجل ثابتة في الأرض ← ACL و MCL و medial meniscus. بس الكتاب بينبّه: الـ ==lateral meniscus أكتر== مع الـ ACL والـ MCL.
          - **Prepatellar bursitis**: قدّام الرضفة من الركوع الكتير ("housemaid's knee").
          - **Baker cyst**: ورا الركبة في الـ gastrocnemius-semimembranosus bursa، متوصّل بالـ synovial space، مع OA أو RA.
        page: 464
        quote: "However, lateral meniscus involvement is more common than medial meniscus involvement in conjunction with ACL and MCL injury."
      - kind: order
        prompt: "رتّب سلسلة الـ compartment syndrome"
        steps:
          - "↑ pressure in a fascial compartment"
          - "Venous outflow obstruction, arteriolar collapse"
          - "Anoxia, necrosis"
          - "Rhabdomyolysis"
          - "Acute tubular necrosis"
        why: "الضغط بيقفل الوريد الأول (ضغطه واطي)، وبعدين الشرايين الصغيرة، والعضلة تموت وتطلّع myoglobin يبوّظ الكلية. الـ CK العالي والـ motor deficit علامات **متأخرة**: يعني الضرر خلاص حصل."
        page: 465
        quote: "↑ pressure within fascial compartment of a limb → venous outflow obstruction and arteriolar collapse → anoxia, necrosis, rhabdomyolysis → acute tubular necrosis."
      - kind: aside
        tone: trap
        text: "الكتاب بيوصف الـ compartment syndrome كده: ==ألم شديد== و compartment مشدود ومنفوخ، والوجع بيزيد مع الـ passive stretch للعضلات اللي جوّاه. أما الـ CK العالي والـ motor deficit فـ ==علامات متأخرة==: الضرر في العضلة والعصب خلاص بقى irreversible، فما تستناهمش. الـ 5 P's: pain، pallor، paresthesia، pulselessness، paralysis."
        page: 465
        quote: "Presents with severe pain and tense, swollen compartments with passive stretch of muscles in the affected compartment. Increased serum creatine kinase and motor deficits are late signs of irreversible muscle and nerve damage. 5 P’s: pain, pallor, paresthesia, pulselessness, paralysis."
      - kind: match
        prompt: "وصّل كل حالة بأهم حاجة فيها"
        pairs:
          - ["de Quervain tenosynovitis", "Finkelstein test, new mothers"]
          - ["Dupuytren contracture", "Ring and little finger palmar fascia"]
          - ["Ganglion cyst", "Transilluminates, dorsal wrist"]
          - ["Plantar fasciitis", "Heel pain with first morning steps"]
          - ["Iliotibial band syndrome", "Lateral knee friction in runners"]
        why: "كل واحدة ليها علامة واحدة بتفضحها، والسؤال غالباً بيحطها في الـ stem."
        page: 465
        quote: "Mucin-filled swelling overlying joint or tendon sheath, most commonly at dorsal side of wrist. Transilluminates with shining light (tumors lack transillumination)."
      - kind: try
        items: [msk.L02.003, msk.L02.012, msk.L02.014, msk.L02.020, msk.L02.029]
    recap:
      - "RANKL من الـ osteoblast يشغّل الـ osteoclast؛ OPG بيمسكه."
      - "PTH متقطع يبني، مستمر يهد. الـ estrogen بيحمي العضم."
      - "Carpal tunnel: الـ thenar يضمر والحس عليه سليم."
      - "Compartment: ألم شديد وعضلة مشدودة مع الـ passive stretch؛ CK و motor deficit علامات متأخرة."
    practice: [msk.L02.001, msk.L02.002, msk.L02.003, msk.L02.004, msk.L02.005, msk.L02.006, msk.L02.007, msk.L02.008, msk.L02.009, msk.L02.175, msk.L02.010, msk.L02.011, msk.L02.012, msk.L02.013, msk.L02.014, msk.L02.015, msk.L02.016, msk.L02.017, msk.L02.018, msk.L02.019, msk.L02.020, msk.L02.021, msk.L02.022, msk.L02.023, msk.L02.024, msk.L02.025, msk.L02.026, msk.L02.027, msk.L02.028, msk.L02.029, msk.L02.030, msk.L02.191, msk.L02.192, msk.L02.193, msk.L02.031, msk.L02.032, msk.L02.033, msk.L02.034, msk.L02.035]
  - id: msk.L02.lesson2
    title: "عضم الأطفال: كل سن وليه مرضه"
    hook: "طفل بيعرج؟ سنّه ووزنه لوحدهم بيقولولك التشخيص"
    minutes: 8
    pages: [466, 467]
    topics: [childhood-musculoskeletal-conditions, common-pediatric-fractures, achondroplasia]
    status: unverified
    steps:
      - kind: explain
        title: "رتّبهم بالسن"
        text: |-
          - **مولود**: ==DDH==. الـ acetabulum ما اتكوّنش صح (breech). Ortolani و Barlow ("clunk")، والتأكيد بالـ **ultrasound** لأن الغضروف لسه ما بقاش عضم لحد 4-6 شهور.
          - **أقل من 5 سنين**: nursemaid's elbow. حد شد الطفل من إيده.
          - **5-7 سنين، ولد**: ==Legg-Calvé-Perthes==: AVN للـ femoral head من غير سبب، وأول x-ray ممكن يبقى سليم.
          - **مراهق تخين**: SCFE: الـ epiphysis بتتزحلق زي بولة آيس كريم من على البسكوتة.
          - **مراهق رياضي**: Osgood-Schlatter (tibial tuberosity). **بنت رياضية**: patellofemoral.
        page: 466
        quote: "Classically presents in an obese young adolescent with hip/knee pain and altered gait. Increased axial force on femoral head → epiphysis displaces relative to femoral neck (like a scoop of ice cream slipping off a cone)."
      - kind: aside
        tone: trap
        text: "الـ SCFE ممكن ييجي بـ ==وجع في الركبة== بس. مراهق تخين بيشتكي من ركبته والركبة سليمة في الكشف؟ افحص الـ hip."
        page: 466
        quote: "Classically presents in an obese young adolescent with hip/knee pain and altered gait."
      - kind: check
        question: "A 6-year-old boy has a limp and mild hip pain that began slowly 2 months ago. Initial hip x-ray is normal. What is the underlying process?"
        options:
          - "Idiopathic avascular necrosis of the femoral head"
          - "Displacement of the femoral epiphysis relative to the neck"
          - "Abnormal development of the acetabulum"
          - "Chronic avulsion of the tibial tuberosity ossification center"
        answer: 0
        why:
          - "صح: ده Legg-Calvé-Perthes: AVN للـ femoral head من غير سبب معروف، في ولد 5-7 سنين (4:1)، بداية بطيئة، والـ x-ray الأول ممكن يبقى طبيعي."
          - "ده SCFE، في مراهق تخين، والـ x-ray بيشخّصه."
          - "ده DDH، بيتلاقى في المواليد (Ortolani و Barlow)."
          - "ده Osgood-Schlatter: وجع قدّام الركبة في مراهق بعد الـ growth spurt."
        page: 466
        quote: "Idiopathic avascular necrosis of femoral head. Commonly presents between 5-7 years with insidious onset of hip pain that may cause child to limp. More common in males (4:1 ratio). Initial x-ray often normal."
      - kind: reveal
        prompt: "ليه الـ Osgood-Schlatter بيحصل بعد الـ growth spurt بالذات؟"
        answer: "الـ patellar tendon بيشد على الـ **secondary ossification center** بتاع الـ tibial tuberosity، وده لسه طري. مع الجري والنط الكتير الشد بيتكرر ← ==chronic avulsion== (traction apophysitis)."
        page: 466
        quote: "Overuse injury caused by repetitive strain and chronic avulsion of the secondary ossification center of the tibial tuberosity. Occurs in adolescents after growth spurt."
      - kind: figure
        title: "Greenstick ولا torus"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="30" y="20" class="t-sm t-b">Greenstick (bending)</text>
            <path class="fg-box" d="M60 35 Q 90 90 60 150 L 85 150 Q 115 90 85 35 Z"/>
            <line class="fg-arrow-bad" x1="108" y1="80" x2="98" y2="92" stroke-width="3"/>
            <text x="115" y="88" class="t-sm t-bad">breaks: tension side</text>
            <text x="10" y="100" class="t-sm t-good">intact</text>
            <text x="210" y="20" class="t-sm t-b">Torus (axial)</text>
            <rect class="fg-box" x="240" y="35" width="25" height="115" rx="6"/>
            <path class="fg-bad" d="M240 90 L 232 95 L 240 100 Z"/>
            <path class="fg-bad" d="M265 90 L 273 95 L 265 100 Z"/>
            <text x="280" y="98" class="t-sm t-bad">cortex buckles</text>
            <text x="280" y="112" class="t-sm t-mut">(compression)</text>
          </svg>
        caption: "الـ greenstick: عضمة اتثنت زي فرع أخضر، اتكسرت من ناحية الشد وفضلت سليمة من ناحية الضغط. الـ torus: ضغط على طول العضمة، فالقشرة بتنبعج من ناحية الضغط."
        alt: "Left: a bent bone broken on the convex tension side with the concave side intact (greenstick). Right: a straight bone with the cortex bulging outward from axial compression (torus fracture)."
        page: 467
        quote: "Incomplete fracture extending partway through width of bone A following bending stress; bone fails on tension side; compression side intact (compare to torus fracture)."
      - kind: explain
        title: "Achondroplasia: الـ receptor شغال زيادة"
        text: |-
          الغريبة: الـ mutation في ==FGFR3== بتخليه **شغال على طول** (gain of function)، وده بيـ **وقّف** انقسام الـ chondrocytes. فالـ endochondral ossification يقف ← أطراف قصيرة. الـ membranous سليم ← راس كبيرة بالنسبة للأطراف.

          **الوراثة**: autosomal dominant، بس أكتر من 85% sporadic، ومع ==كبر سن الأب==. الـ homozygous بيموت. وده أشهر سبب للـ short-limbed dwarfism.
        page: 467
        quote: "Constitutive activation of fibroblast growth factor receptor (FGFR3) actually inhibits chondrocyte proliferation. >85% of mutations occur sporadically; autosomal dominant with full penetrance (homozygosity is lethal). Associated with ↑ paternal age."
      - kind: check
        question: "Two parents of average height have a child with achondroplasia. What best explains it?"
        options:
          - "A new (sporadic) mutation, more likely with older paternal age"
          - "Both parents are heterozygous carriers"
          - "Incomplete penetrance in one parent"
          - "Maternal mitochondrial inheritance"
        answer: 0
        why:
          - "صح: أكتر من 85% sporadic، ومرتبطة بكبر سن الأب."
          - "لو الاتنين heterozygous كانوا هيبقوا قصيرين؛ ده autosomal dominant."
          - "الـ penetrance كاملة."
          - "مش mitochondrial."
        page: 467
        quote: ">85% of mutations occur sporadically; autosomal dominant with full penetrance (homozygosity is lethal). Associated with ↑ paternal age."
      - kind: try
        items: [msk.L02.036, msk.L02.037, msk.L02.039, msk.L02.040, msk.L02.045]
    recap:
      - "مولود: DDH (ultrasound). أقل من 5: nursemaid's. 5-7: Perthes. مراهق تخين: SCFE."
      - "Osgood-Schlatter = traction على الـ tibial tuberosity بعد الـ growth spurt."
      - "Greenstick: تثني وتنكسر من ناحية الشد. Torus: تنبعج من ناحية الضغط."
      - "Achondroplasia: FGFR3 شغال زيادة ← chondrocytes تقف؛ sporadic مع كبر سن الأب."
