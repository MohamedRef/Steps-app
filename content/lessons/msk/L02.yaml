    steps:
      - kind: explain
        title: "OA: بِلى، RA: هجوم"
        text: |-
          - **OA**: الضغط الميكانيكي بيبوّظ الغضروف، والإصلاح ضعيف. وجع في الـ weight-bearing joints **بعد** المجهود ويهدا بالراحة، مش متماثل، ومفيش أعراض عامة.
          - **RA**: autoimmune. الـ ==pannus== (granulation tissue) بياكل الغضروف والعضم. ==morning stiffness أكتر من ساعة== ويتحسن بالحركة، متماثل، ومعاه حمى وتعب ونزول وزن.
        page: 472
        quote: "Pain in weight-bearing joints after use, improving with rest. Asymmetric involvement. No systemic symptoms. Pain, swelling, and morning stiffness lasting >1 hour, improving with use. Symmetric involvement."
      - kind: figure
        title: "صوابع OA وصوابع RA"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
