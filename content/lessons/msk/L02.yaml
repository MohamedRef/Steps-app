        page: 472
        quote: "Female, HLA-DR4 (4-walled “rheum”), HLA- DRB1, smoking. ⊕ rheumatoid factor (IgM antibody that targets IgG Fc; in 80%), anti- cyclic citrullinated peptide antibody (more specific)."
      - kind: explain
        title: "الـ RA برّه المفصل"
        text: |-
          - **Felty**: RA + neutropenia + splenomegaly (SANTA).
          - **Caplan**: rheumatoid nodules في الرئة + pneumoconiosis.
          - والباقي: cervical subluxation، nodules (fibrinoid necrosis و palisading histiocytes)، ILD، pleuritis، pericarditis، anemia of chronic disease، ==AA amyloidosis==، Sjögren، scleritis، carpal tunnel. والالتهاب المزمن بيزوّد خطر الـ aortic stenosis.
        page: 472
        quote: "AA amyloidosis, Sjögren syndrome, scleritis, carpal tunnel syndrome."
      - kind: check
        question: "A woman with long-standing RA has splenomegaly and recurrent infections with a low neutrophil count. Name?"
        options:
          - "Felty syndrome"
          - "Caplan syndrome"
          - "Sjögren syndrome"
          - "AA amyloidosis"
        answer: 0
        why:
          - "صح: RA + neutropenia + splenomegaly = Felty."
          - "Caplan = nodules في الرئة مع pneumoconiosis."
          - "Sjögren = عين وبق ناشفين."
          - "الـ amyloidosis بيعمل proteinuria، مش neutropenia."
        page: 472
        quote: "neutropenia + splenomegaly (Felty syndrome: SANTA—Splenomegaly, Anemia, Neutropenia, Thrombocytopenia, Arthritis [Rheumatoid])"
      - kind: explain
        title: "Gout: الكلية مش بترمي"
        text: |-
          Monoarthritis من بلورات ==monosodium urate==. أقوى risk factor: الـ hyperuricemia:

          - **Underexcretion (90%)**: غالباً idiopathic، والـ renal failure والـ ==thiazides== بيزوّدوه.
          - **Overproduction (10%)**: Lesch-Nyhan، PRPP زيادة، tumor lysis.
          - **الاتنين**: alcohol و von Gierke.

          الكلاسيك: إصبع القدم الكبير (**podagra**) بعد عزومة لحمة وسمك وبيرة. والـ tophi في الودن والكوع والـ Achilles.
        page: 473
        quote: "Underexcretion of uric acid (90% of patients)—largely idiopathic, potentiated by renal failure; can be exacerbated by certain medications (eg, thiazide diuretics)."
      - kind: reveal
        prompt: "ليه الكحول بيعمل نوبة gout؟"
        answer: "الكحول ← ==lactate يعلى== ← الكلية بتعيد امتصاص الـ uric acid ← hyperuricemia. (والكحول كمان بيزوّد الإنتاج، فهو mechanism مشترك.)"
        page: 473
        quote: "alcohol consumption (↑ blood lactate from metabolism → ↑ resorption of uric acid → hyperuricemia)."
