  - id: msk.L02.lesson6
    title: "مفاصل ملتهبة: عدوى، نشفان، و HLA-B27"
    hook: "مفصل واحد سخن، ولا ضهر بيتيبّس الصبح ويتحسن بالرياضة؟ كل واحد ليه عيلة"
    minutes: 9
