  - id: msk.L02.lesson5
    title: "OA و RA و البلورات"
    hook: "التيبّس الصبح ساعة ولا 10 دقايق؟ إبرة ولا معيّن؟ أصفر ولا أزرق؟ كل سؤال منهم بيقفل تشخيص"
    minutes: 10
    pages: [472, 473]
    topics: [osteoarthritis-vs-rheumatoid-arthritis, gout, calcium-pyrophosphate-deposition-disease]
    status: unverified
    steps:
      - kind: explain
        title: "OA: بِلى، RA: هجوم"
        text: |-
          - **OA**: الضغط الميكانيكي بيبوّظ الغضروف، والإصلاح ضعيف. وجع في الـ weight-bearing joints **بعد** المجهود ويهدا بالراحة، مش متماثل، ومفيش أعراض عامة.
          - **RA**: autoimmune. الـ ==pannus== (granulation tissue) بياكل الغضروف والعضم. ==morning stiffness أكتر من ساعة== ويتحسن بالحركة، متماثل، ومعاه حمى وتعب ونزول وزن.
        page: 472
        quote: "Pain in weight-bearing joints after use, improving with rest. Asymmetric involvement. No systemic symptoms. Pain, swelling, and morning stiffness lasting >1 hour, improving with use. Symmetric involvement."
      - kind: figure
        title: "صوابع OA وصوابع RA"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <text x="30" y="20" class="t-sm t-b">Osteoarthritis</text>
            <rect class="fg-box" x="50" y="30" width="22" height="120" rx="8"/>
            <circle class="fg-dot-bad" cx="61" cy="55" r="9"/>
            <circle class="fg-dot-acc" cx="61" cy="90" r="9"/>
            <text x="80" y="58" class="t-sm">DIP: Heberden</text>
            <text x="80" y="93" class="t-sm">PIP: Bouchard</text>
            <text x="210" y="20" class="t-sm t-b">Rheumatoid arthritis</text>
            <rect class="fg-box" x="230" y="30" width="22" height="120" rx="8"/>
            <circle class="fg-dot-acc" cx="241" cy="90" r="9"/>
            <circle class="fg-dot-acc" cx="241" cy="130" r="9"/>
            <text x="260" y="93" class="t-sm">PIP</text>
            <text x="260" y="133" class="t-sm">MCP, wrist</text>
          </svg>
        caption: "الـ OA بيمسك الـ DIP (Heberden) والـ PIP (Bouchard) والـ 1st CMC. الـ RA بيمسك الـ MCP والـ PIP والرسغ. الـ DIP مش من المفاصل اللي الكتاب بيعدّها للـ RA، فمفصل DIP عليه nodes يشدّك ناحية الـ OA."
        alt: "Two fingers. Osteoarthritis finger with nodes at the DIP (Heberden) and PIP (Bouchard). Rheumatoid finger with the PIP, MCP and wrist marked."
        page: 472
        quote: "Development of Heberden nodes D (at DIP) and Bouchard nodes E (at PIP), and 1st CMC."
      - kind: aside
        tone: tip
        text: "الـ RA: HLA-DR4 («4-walled rheum»، الكتاب). الـ **RF** (IgM ضد الـ Fc بتاع IgG) موجب في 80%، والـ ==anti-CCP أكتر specific==."
        page: 472
        quote: "Female, HLA-DR4 (4-walled “rheum”), HLA- DRB1, smoking. ⊕ rheumatoid factor (IgM antibody that targets IgG Fc; in 80%), anti- cyclic citrullinated peptide antibody (more specific)."
      - kind: explain
        title: "الـ RA برّه المفصل"
        text: |-
          - **Felty**: RA + neutropenia + splenomegaly (SANTA).
          - **Caplan**: rheumatoid nodules في الرئة + pneumoconiosis.
          - والباقي: cervical subluxation، nodules (fibrinoid necrosis و palisading histiocytes)، ILD، pleuritis، pericarditis، anemia of chronic disease، ==AA amyloidosis==، Sjögren، scleritis، carpal tunnel. والالتهاب المزمن بيزوّد خطر الـ aortic stenosis.
        page: 472
        quote: "AA amyloidosis, Sjögren syndrome, scleritis, carpal tunnel syndrome."
      - kind: check
        question: "A woman with long-standing RA is found to have an enlarged spleen. Which blood count finding completes the syndrome she most likely has?"
        options:
          - "Neutropenia"
          - "Eosinophilia"
          - "Polycythemia"
          - "Lymphocytosis"
        answer: 0
        why:
          - "صح: RA + splenomegaly + neutropenia = Felty syndrome (SANTA)."
          - "الـ eosinophilia مع الـ EGPA (asthma)، مش مع الـ RA."
          - "الـ RA بيعمل anemia of chronic disease، يعني كرات حمرا أقل مش أكتر."
          - "الـ Felty بيقلّل الـ neutrophils؛ الـ lymphocytosis مش جزء منه."
        page: 472
        quote: "neutropenia + splenomegaly (Felty syndrome: SANTA—Splenomegaly, Anemia, Neutropenia, Thrombocytopenia, Arthritis [Rheumatoid])"
      - kind: explain
        title: "Gout: الكلية مش بترمي"
        text: |-
          Monoarthritis من بلورات ==monosodium urate==. أقوى risk factor: الـ hyperuricemia:

          - **Underexcretion (90%)**: غالباً idiopathic، والـ renal failure والـ ==thiazides== بيزوّدوه.
          - **Overproduction (10%)**: Lesch-Nyhan، PRPP زيادة، tumor lysis.
          - **الاتنين**: alcohol و von Gierke.

          الكلاسيك: إصبع القدم الكبير (**podagra**) بعد عزومة لحمة وسمك وبيرة. والـ tophi في الودن والكوع والـ Achilles.
        page: 473
        quote: "Underexcretion of uric acid (90% of patients)—largely idiopathic, potentiated by renal failure; can be exacerbated by certain medications (eg, thiazide diuretics)."
      - kind: reveal
        prompt: "ليه الكحول بيعمل نوبة gout؟"
        answer: "الكحول ← ==lactate يعلى== ← الكلية بتعيد امتصاص الـ uric acid ← hyperuricemia. (والكحول كمان بيزوّد الإنتاج، فهو mechanism مشترك.)"
        page: 473
        quote: "alcohol consumption (↑ blood lactate from metabolism → ↑ resorption of uric acid → hyperuricemia)."
      - kind: table
        title: "Gout ولا CPPD"
        columns: ["", "Gout", "CPPD"]
