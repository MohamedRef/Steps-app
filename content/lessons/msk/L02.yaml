    topics: [systemic-juvenile-idiopathic-arthritis, sjogren-syndrome, septic-arthritis, osteomyelitis, seronegative-spondyloarthritis]
    status: unverified
    steps:
      - kind: explain
        title: "Systemic JIA و Sjögren"
        text: |-
          - **Systemic JIA** (<16 سنة): حمى ==بتنط كل يوم== وتنزل، وطفح لونه salmon-pink، وarthritis. ومعاه anterior uveitis.
          - **Sjögren**: الـ lymphocytes بتاكل الغدد الدمعية واللعابية، في ستات 40-60. عين ناشفة (gritty)، بق ناشف، dyspareunia، الـ parotid منفوخة، وANA و RF و ==SS-A (Ro) و SS-B (La)==. والتأكيد: labial salivary gland biopsy.
        page: 474
        quote: "Autoimmune disorder characterized by destruction of exocrine glands (especially lacrimal and salivary) by lymphocytic infiltrates. Predominantly affects females 40-60 years old."
      - kind: aside
        tone: exam
        text: "ست عندها Sjögren من سنين والـ parotid بدأت تكبر بالراحة وناشفة؟ فكّر في ==MALT lymphoma==. وكمان خطر طفل بـ neonatal lupus، وتسوّس سنان."
        page: 474
        quote: "Complications: dental caries; mucosa-associated lymphoid tissue (MALT) lymphoma (may present as parotid enlargement); ↑ risk of giving birth to baby with neonatal lupus."
      - kind: explain
        title: "Septic arthritis و osteomyelitis"
        text: |-
          **Septic arthritis**: S aureus و Strep و ==N gonorrhoeae== (شباب sexually active). مفصل واحد، الـ fluid صديد (WBC >50,000). العلاج: antibiotics و aspiration و drainage بسرعة قبل ما المفصل يبوظ.

          الـ **disseminated gonococcal**: يا إما مفصل صديد (الركبة)، يا إما ==triad==: polyarthralgia و tenosynovitis (الإيد) و dermatitis (pustules).

          **Osteomyelitis**: في الأطفال hematogenous في الـ **metaphysis**، وفي الكبار من جرح أو عملية.
        page: 474
        quote: "Disseminated gonococcal infection—STI that presents as either purulent arthritis (eg, knee) or triad of polyarthralgia, tenosynovitis (eg, hand), dermatitis (eg, pustules, vesiculopustules)."
      - kind: match
        prompt: "وصّل كل حالة بالـ organism بتاع الـ osteomyelitis"
        pairs:
          - ["Most cases overall", "S aureus"]
          - ["Prosthetic joint", "S epidermidis"]
          - ["Sickle cell anemia", "Salmonella"]
          - ["Nail through a sneaker", "P aeruginosa"]
        why: "الـ S aureus هو الأكتر في كل حاجة. الـ prosthesis بتحب الـ S epidermidis (biofilm). الـ sickle cell: Salmonella. والـ plantar puncture: Pseudomonas."
        page: 474
        quote: "S aureus most common (overall), S epidermidis (prosthetics), Salmonella (sickle cell anemia), P aeruginosa (plantar puncture wounds)."
      - kind: explain
