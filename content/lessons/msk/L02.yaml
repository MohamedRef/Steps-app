  - id: msk.L02.lesson5
    title: "OA و RA و البلورات"
    hook: "التيبّس الصبح ساعة ولا 10 دقايق؟ إبرة ولا معيّن؟ أصفر ولا أزرق؟ كل سؤال منهم بيقفل تشخيص"
