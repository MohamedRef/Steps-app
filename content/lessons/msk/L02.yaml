  - id: msk.L02.lesson8
    title: "الـ vasculitis بالحجم، والـ NMJ، و Raynaud"
    hook: "رتّب الـ vasculitis من الأوعية الكبيرة للصغيرة، وكل واحد هيلاقي مكانه لوحده"
    minutes: 10
    pages: [478, 480]
    topics: [vasculitides, neuromuscular-junction-diseases, raynaud-phenomenon]
    status: unverified
    steps:
      - kind: figure
        title: "الـ vasculitis بالحجم (صفحة 478)"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-acc" cx="45" cy="45" r="32"/>
            <text x="25" y="95" class="t-sm t-b">Large</text>
            <text x="90" y="35" class="t-sm">Giant cell (temporal) arteritis</text>
            <text x="90" y="52" class="t-sm">Takayasu arteritis</text>
            <circle class="fg-acc" cx="45" cy="120" r="18"/>
            <text x="20" y="152" class="t-sm t-b">Medium</text>
            <text x="90" y="105" class="t-sm">Kawasaki, polyarteritis nodosa</text>
            <text x="90" y="122" class="t-sm t-mut">Buerger (small/medium)</text>
            <circle class="fg-acc" cx="45" cy="178" r="7"/>
            <text x="90" y="165" class="t-sm t-b">Small, p-ANCA (MPO-ANCA)</text>
            <text x="90" y="182" class="t-sm">MPA, EGPA</text>
          </svg>
        caption: "الكبيرة: giant cell و Takayasu (الاتنين granulomatous). المتوسطة: Kawasaki و PAN، و Buerger بين الصغيرة والمتوسطة. وأول الصغيرة: الـ p-ANCA (MPA و EGPA)."
        alt: "Circles of decreasing size. Large vessels: giant cell arteritis, Takayasu arteritis. Medium: Kawasaki disease, polyarteritis nodosa, with Buerger disease as small/medium. Small, p-ANCA: microscopic polyangiitis, EGPA."
        page: 478
        quote: "Inflammation and necrosis of blood vessels; either idiopathic or immune mediated (type III hypersensitivity)."
      - kind: explain
        title: "الأوعية الكبيرة: ست فوق الخمسين، ولا آسيوية تحت الأربعين؟"
        text: |-
          - **Giant cell (temporal)**: ستات >50. صداع ناحية واحدة، ==jaw claudication==، والخطر الكبير **العمى**. مع الـ PMR. ESR عالي جداً. العلاج: high-dose steroids **قبل** الـ biopsy.
          - **Takayasu**: آسيويات <40. ==Pulseless disease==: نبض الدراع ضعيف. بيمسك الـ aortic arch والأوعية الكبيرة.
        page: 478
        quote: "Unilateral headache, jaw claudication, temporal artery tenderness, blindness risk (due to anterior ischemic optic neuropathy)."
      - kind: explain
        title: "الأوعية المتوسطة"
        text: |-
          - **Kawasaki**: أطفال آسيويين <4. ==CRASH and burn==: Conjunctivitis و Rash و Adenopathy و Strawberry tongue و Hand-foot changes و حمى ≥5 أيام. المضاعفة: **coronary aneurysm**. العلاج: IVIG و aspirin.
          - **PAN**: رجالة، 30% hepatitis B. بيمسك الكلى والأحشاء و==بيسيب الرئة==. fibrinoid necrosis، و"string of pearls". PAN affects the SKIN: Skin و Kidneys و Intestines و Nerves.
          - **Buerger** (small/medium): مدخّن شديد <40، claudication و gangrene. العلاج: يبطّل سجاير.
        page: 478
        quote: "Involves renal and visceral vessels, spares lungs; transmural inflammation with fibrinoid necrosis."
      - kind: check
        question: "A middle-aged man with hepatitis B has fever, weight loss, abdominal pain, hypertension and a foot drop. Mesenteric angiography shows a 'string of pearls'. Which organ does his disease typically spare?"
        options:
          - "Lungs"
          - "Kidneys"
          - "Intestines"
          - "Peripheral nerves"
        answer: 0
        why:
          - "صح: ده PAN، بيمسك الأوعية بتاعة الكلى والأحشاء وبيسيب الرئة. عكس الـ GPA والـ MPA اللي بيمسكوا الرئة."
          - "الكلى من أهم اللي PAN بيضربها (الـ K في SKIN)، ومنها الـ hypertension."
          - "الأمعاء من الأحشاء اللي PAN بيضربها (الـ I في SKIN): ألم بطن و melena."
          - "الأعصاب جزء من SKIN، والـ foot drop هنا mononeuritis منها."
        page: 478
        quote: "Involves renal and visceral vessels, spares lungs; transmural inflammation with fibrinoid necrosis."
      - kind: explain
        title: "الأوعية الصغيرة: الـ p-ANCA"
        text: |-
          - **MPA**: رئة وكلى وجلد، pauci-immune GN، و palpable purpura. ==p-ANCA (MPO)==.
          - **EGPA** (Churg-Strauss): asthma و eosinophilia و vasculitis، والـ eosinophils بتعمل peripheral neuropathy، و ↑ IgE. برضه ==p-ANCA==.
        page: 478
        quote: "Necrotizing vasculitis involving lungs, kidneys, and skin. Pauci-immune glomerulonephritis (GN) G and palpable purpura. MPO-ANCA/p-ANCA (anti- myeloperoxidase). Treatment: cyclophosphamide, glucocorticoids. Eosinophilic granulomatosis with polyangiitis Combination of asthma, eosinophilia, and systemic vasculitis. Eosinophilic infiltration → inflammation → peripheral neuropathy."
      - kind: figure
        title: "الأوعية الصغيرة (صفحة 479)"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <circle class="fg-acc" cx="30" cy="30" r="8"/>
            <text x="50" y="28" class="t-sm t-b">Small, c-ANCA (PR3-ANCA)</text>
            <text x="50" y="45" class="t-sm">Granulomatosis with polyangiitis</text>
            <circle class="fg-acc" cx="30" cy="80" r="8"/>
            <text x="50" y="78" class="t-sm t-b">Small, immune complex</text>
            <text x="50" y="95" class="t-sm">Anti-C1q (urticarial) vasculitis</text>
            <text x="50" y="111" class="t-sm">Mixed cryoglobulinemia</text>
            <text x="50" y="127" class="t-sm">IgA vasculitis</text>
            <text x="50" y="143" class="t-sm">Cutaneous small-vessel vasculitis</text>
            <circle class="fg-thin" cx="30" cy="178" r="12"/>
            <text x="50" y="176" class="t-sm t-b">Variable vessel</text>
            <text x="50" y="192" class="t-sm">Behçet syndrome</text>
          </svg>
        caption: "باقي الصغيرة: الـ c-ANCA (GPA)، وبعدين الـ immune complex: anti-C1q و mixed cryoglobulinemia و IgA vasculitis و cutaneous small-vessel. والـ Behçet حجمه متغيّر."
        alt: "Small-vessel groups. c-ANCA: granulomatosis with polyangiitis. Immune complex: anti-C1q urticarial vasculitis, mixed cryoglobulinemia, IgA vasculitis, cutaneous small-vessel vasculitis. Variable vessel: Behçet syndrome."
        page: 479
        quote: "Small-vessel vasculitis (immune complex mediated) Hypocomplementemic urticarial vasculitis (anti-C1q vasculitis)"
      - kind: explain
        title: "الأوعية الصغيرة: c-ANCA و immune complex"
        text: |-
          **c-ANCA**:
          - **GPA**: الأنف والجيوب (septum perforation)، الرئة (hemoptysis)، الكلى (RPGN). ==c-ANCA (PR3)==.

          **Immune complex**:
          - **IgA vasculitis** (HSP): أشهر vasculitis في الأطفال بعد URI. Hinge pain و stomach pain (intussusception) و purpura على المقعدة والرجلين.
          - **Mixed cryoglobulinemia**: HCV؛ purpura و ضعف و arthralgia.
          - **Anti-C1q**: مع SLE.
        page: 479
        quote: "Classic triad: Hinge pain (arthralgias), stomach pain (abdominal pain associated with intussusception), palpable purpura on buttocks/legs J ."
      - kind: aside
        tone: tip
        text: "**Behçet**: قرح في البق وفي الأعضاء التناسلية تتكرر، uveitis، و erythema nodosum، عند ناس من تركيا وشرق المتوسط (يعني عندنا). مع ==HLA-B51==، وبيتحرك بعد HSV أو parvovirus."
        page: 479
        quote: "Recurrent oral and genital ulcers, uveitis, erythema nodosum. Triggered by HSV or parvovirus. Flares last 1-4 weeks. Associated with HLA-B51."
      - kind: check
        question: "A man has chronic sinusitis, nasal septum perforation, hemoptysis and RPGN. Which antibody?"
        options:
          - "c-ANCA (PR3)"
          - "p-ANCA (MPO)"
          - "Anti-GBM"
          - "Anti-C1q"
        answer: 0
        why:
          - "صح: GPA = أنف ورئة وكلى، c-ANCA."
          - "p-ANCA للـ MPA والـ EGPA."
          - "الـ anti-GBM مفيهوش أنف."
          - "الـ anti-C1q مع الـ SLE."
        page: 479
        quote: "c-ANCA I (PR3-ANCA). Treatment: glucocorticoids combined with rituximab, cyclophosphamide."
      - kind: table
        title: "Myasthenia ولا Lambert-Eaton"
        columns: ["", "Myasthenia gravis", "Lambert-Eaton"]
        rows:
          - ["Antibody", "Postsynaptic ACh receptor", "Presynaptic Ca2+ channel"]
          - ["With use", "Worsens", "Improves"]
          - ["Reflexes", "Spared", "Hyporeflexia"]
          - ["Associated with", "Thymoma, thymic hyperplasia", "Small cell lung cancer"]
          - ["AChE inhibitor", "Reverses (pyridostigmine)", "Minimal effect"]
        hide: [[0, 1], [0, 2], [1, 1], [1, 2], [3, 2]]
        page: 480
        quote: "Autoantibodies to postsynaptic ACh receptor Autoantibodies to presynaptic Ca2+ channel → ↓ ACh release; L comes before M"
      - kind: reveal
        prompt: "ليه الـ Lambert-Eaton بيتحسن مع الاستعمال، والـ myasthenia بيسوء؟"
        answer: "في الـ **Lambert-Eaton** المشكلة إن Ca2+ قليل بيدخل الـ terminal؛ مع الانقباض المتكرر الـ Ca2+ ==بيتراكم== فيطلع ACh أكتر. في الـ **myasthenia** الـ receptors قليلة، ومع التكرار الـ ACh اللي بينزل بيقل، فالضعف يزيد. والكتاب: «L comes before M»: الـ Lambert presynaptic قبل الـ Myasthenia postsynaptic."
        page: 480
        quote: "Autoantibodies to presynaptic Ca2+ channel → ↓ ACh release; L comes before M"
      - kind: explain
        title: "Raynaud: أبيض، أزرق، أحمر"
        text: |-
          Vasospasm في الـ arterioles مع البرد أو التوتر: ==أبيض== (ischemia) ← **أزرق** (hypoxia) ← **أحمر** (reperfusion).

          - **Raynaud disease**: 1° (idiopathic).
          - **Raynaud syndrome**: 2° لـ MCTD أو SLE أو CREST، ومعاه digital ulcers.

          العلاج: ==calcium channel blockers==.
        page: 480
        quote: "↓ blood flow to skin due to arteriolar (small vessel) vasospasm in response to cold or stress: color change from white (ischemia) to blue (hypoxia) to red (reperfusion)."
      - kind: try
        items: [msk.L02.151, msk.L02.153, msk.L02.157, msk.L02.160, msk.L02.169]
    recap:
      - "كبيرة: GCA (ستات >50، عمى، steroids قبل الـ biopsy) و Takayasu (pulseless)."
      - "متوسطة: Kawasaki (CRASH، coronary aneurysm، IVIG و aspirin) و PAN (hep B، بيسيب الرئة)."
      - "صغيرة: GPA c-ANCA؛ MPA و EGPA p-ANCA؛ IgA vasculitis أشهر واحدة في الأطفال."
      - "MG: postsynaptic، بيسوء، thymoma. LEMS: presynaptic، بيتحسن، small cell. Raynaud: CCBs."
