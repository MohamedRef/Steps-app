      - kind: aside
        tone: trap
        text: "مستوى الـ uric acid في الدم ممكن يبقى ==طبيعي== وقت النوبة، فما ينفيش الـ gout. والـ CPPD: «the blue P's» (blue when Parallel، Positive، Pyrophosphate، Pseudogout)، ومعاه hemochromatosis و hyperparathyroidism."
