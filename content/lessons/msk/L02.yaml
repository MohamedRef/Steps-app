        caption: "الـ polymyositis: الـ CD8+ T cells جوه الـ fascicle بين الألياف (endomysial). الـ dermatomyositis: الـ CD4+ T cells برّه، حوالين الـ fascicle (perimysial)، والألياف اللي على الطرف بتضمر (atrophy)."
        alt: "Two muscle fascicles in cross-section. Left: polymyositis with red T-cell dots between the muscle fibers inside the fascicle (endomysial, CD8+). Right: dermatomyositis with red dots around the outside of the fascicle (perimysial, CD4+) and smaller fibers at the edge (atrophy)."
        page: 477
        quote: "Progressive symmetric proximal muscle weakness, characterized by endomysial inflammation with CD8+ T cells. Most often involves shoulders. Dermatomyositis Clinically similar to polymyositis, but also involves Gottron papules A , photodistributed facial erythema (eg, heliotrope [violaceous] edema of the eyelids B ), “shawl and face” rash C , mechanic’s hands (thickening, cracking, irregular “dirty”-appearing marks due to hyperkeratosis of digital skin D). ↑ risk of occult malignancy. Perimysial inflammation and atrophy with CD4+ T cells."
      - kind: aside
        tone: tip
        text: "حاجتين صغيرين: **myositis ossificans** = عضم في العضلة بعد خبطة، eggshell calcification، حميد بس شبه الـ sarcoma. **IgG4-related** = تليف و lymphoplasmacytic infiltrate في أعضاء كتير: الغدد اللعابية، Riedel thyroiditis، autoimmune pancreatitis، aortitis، و ==retroperitoneal fibrosis==."
        page: 477
        quote: "Heterotopic ossification involving skeletal muscle (eg, quadriceps). Associated with blunt muscle trauma. Presents as painful soft tissue mass. Imaging: eggshell calcification."
