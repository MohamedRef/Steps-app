      - kind: explain
        title: "Poly ولا dermato"
        text: |-
          الاتنين: ضعف proximal متماثل، ANA و ↑ CK، والـ specific: ==anti-Jo-1== و anti-SRP و anti-Mi-2.

          - **Polymyositis**: endomysial، **CD8+**.
          - **Dermatomyositis**: perimysial، **CD4+**، ومعاه الجلد: Gottron papules، heliotrope على الجفون، shawl and face rash، mechanic's hands. والأهم: خطر ==occult malignancy==.

          حيلة: Poly = CD8 جوه الـ fascicle (endomysial)، Dermato = CD4 حوالين الـ fascicle (perimysial) ومعاه الجلد.
        page: 477
        quote: "Progressive symmetric proximal muscle weakness, characterized by endomysial inflammation with CD8+ T cells. Most often involves shoulders."
