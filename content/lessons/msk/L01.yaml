        caption: "لما يقف على الرجل اللي فيها الـ superior gluteal nerve متعور، الـ gluteus medius ما يقدرش يشيل الحوض، فالناحية التانية تقع. الإصابة في نفس ناحية الرجل اللي واقف عليها."
        alt: "Left: normal stance with the pelvis level over the standing leg. Right: Trendelenburg sign with the pelvis tilting down on the opposite side; the lesion is marked on the standing leg's side."
