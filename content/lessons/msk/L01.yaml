        page: 457
        quote: "Trauma or compression of lateral aspect of leg, fibular neck fracture PED = Peroneal Everts and Dorsiflexes; if injured, foot dropPED Loss of sensation on dorsum of foot"
      - kind: aside
        tone: joke
        text: "الـ **pudendal** (S2-S4): ولادة، أو عجلة كتير، أو ركوب خيل. يعني لو صاحبك راكب عجلة من القاهرة لإسكندرية واشتكى من تنميل تحت، ده مش دلع: ده ==pudendal==. والـ block بيتعمل عند الـ ischial spine."
