  - id: msk.L01.lesson2
    title: "الـ brachial plexus: فوق Erb وتحت Klumpke"
    hook: "الطفل اتشد من راسه ولا من دراعه؟ الإجابة دي لوحدها بتقولك أنهي trunk اتقطع"
    minutes: 8
    pages: [452, 452]
    topics: [brachial-plexus-lesions]
    goals:
      - "ترتب أجزاء الـ plexus"
      - "تفرّق Erb عن Klumpke من طريقة الشد ومن شكل الدراع"
      - "تعرف الـ thoracic outlet syndrome والـ winged scapula"
    status: unverified
    steps:
      - kind: explain
        title: "الترتيب الأول"
        text: |-
          الـ brachial plexus بيمشي كده: **Roots ← Trunks ← Divisions ← Cords ← Branches**. الكتاب بيقولها: ==Remember To Drink Cold Beer==.

          الـ trunks والـ subclavian artery بيعدّوا بين الـ **anterior و middle scalene**، والـ subclavian vein بيعدّي قدّام (anteromedial) الـ scalene triangle. خلي ده في دماغك عشان الـ thoracic outlet.
        page: 452
        quote: "Trunks of brachial plexus and the subclavian artery pass between anterior and middle scalene muscles. Subclavian vein passes anteromedial to the scalene triangle."
      - kind: figure
        title: "الشد لفوق ولا للجنب؟"
        svg: |-
          <svg viewBox="0 0 360 190" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="msk1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="fg-head-bad" d="M0,0 L10,5 L0,10 z"/></marker></defs>
            <text x="20" y="30" class="t-sm">C5</text>
            <text x="20" y="55" class="t-sm">C6</text>
            <text x="20" y="80" class="t-sm">C7</text>
            <text x="20" y="105" class="t-sm">C8</text>
            <text x="20" y="130" class="t-sm">T1</text>
            <rect class="fg-bad" x="50" y="18" width="120" height="44" rx="8"/>
            <text x="60" y="44" class="t-sm t-b">Upper trunk</text>
            <rect class="fg-box" x="50" y="68" width="120" height="20" rx="6"/>
            <text x="60" y="82" class="t-sm">Middle trunk</text>
            <rect class="fg-acc" x="50" y="93" width="120" height="44" rx="8"/>
            <text x="60" y="119" class="t-sm t-b">Lower trunk</text>
            <line class="fg-arrow-bad" x1="175" y1="40" x2="215" y2="40" marker-end="url(#msk1b)"/>
            <line class="fg-arrow-bad" x1="175" y1="115" x2="215" y2="115" marker-end="url(#msk1b)"/>
            <text x="222" y="36" class="t-sm t-b">Erb (waiter's tip)</text>
            <text x="222" y="52" class="t-sm t-mut">lateral traction on neck</text>
            <text x="222" y="111" class="t-sm t-b">Klumpke (claw hand)</text>
            <text x="222" y="127" class="t-sm t-mut">upward force on arm</text>
            <text x="50" y="170" class="t-sm t-mut">Roots → Trunks → Divisions → Cords → Branches</text>
          </svg>
        caption: "الشد الجانبي للرقبة بيقطع الـ upper trunk (C5-C6) ← Erb. الشد لفوق للدراع بيقطع الـ lower trunk (C8-T1) ← Klumpke."
        alt: "Roots C5 to T1 joined into upper, middle and lower trunks. The upper trunk (C5-C6) is marked Erb palsy from lateral traction on the neck; the lower trunk (C8-T1) is marked Klumpke palsy from upward force on the arm."
        page: 452
        quote: "Erb palsy (“waiter’s tip”) Traction or tear of upper trunk: C5-C6 roots Infants—lateral traction on neck during delivery"
      - kind: table
        title: "كل cord بيطلّع إيه"
        columns: ["Cord", "Branches", "Lesion on the diagram"]
        rows:
          - ["Lateral", "Musculocutaneous", "Difficulty flexing elbow"]
          - ["Lateral + medial", "Median (flexors)", "Decreased thumb function, hand of benediction"]
          - ["Posterior", "Axillary, radial (extensors)", "Deltoid paralysis; wrist drop"]
          - ["Medial", "Ulnar", "Intrinsic muscles of hand, claw hand"]
        hide: [[0, 1], [1, 1], [2, 1], [3, 1]]
        page: 452
        quote: "Erb palsy (“waiter’s tip”) Klumpke palsy (claw hand) Wrist drop Winged scapula Deltoid paralysis “Saturday night palsy” (wrist drop) Difficulty flexing elbow, variable sensory loss Decreased thumb function, “hand of benediction” Intrinsic muscles of hand, claw hand"
      - kind: explain
        title: "Erb: الدراع بيستنى البقشيش"
        text: |-
          في Erb الـ C5-C6 راحوا، فبيضيع 3 حاجات، والكتاب بيقولها: ==Herb gets DIBs on tips==:

          - **D**eltoid و supraspinatus ← مفيش abduction ← الدراع متدلي جنبه
          - **I**nfraspinatus و supraspinatus ← مفيش lateral rotation ← الدراع ملفوف لجوّه
          - **B**iceps ← مفيش flexion و supination ← الكوع مفرود والساعد pronated

          النتيجة: الدراع متدلي جنبه وملفوف لجوّه والكف بيبص لورا، زي جرسون مستني البقشيش: ==waiter's tip==.
        page: 452
        quote: "Deltoid, supraspinatus Abduction (arm hangs by side) Infraspinatus, supraspinatus Lateral rotation (arm medially rotated) Biceps brachii Herb gets DIBs on tips Flexion, supination (arm extended and pronated)"
      - kind: aside
        tone: analogy
        text: "في الكبار نفس الفكرة: موتوسيكل وقع على راسه وكتفه ← الرقبة اتشدت بعيد عن الكتف ← Erb. واحد بيقع ومسك فرع شجرة (grabbing a tree branch) ← الدراع اتشد لفوق ← ==Klumpke==."
        page: 452
        quote: "Adults—trauma (eg, grabbing a tree branch to break a fall)"
      - kind: check
        question: "A newborn after shoulder dystocia holds the right arm at his side, internally rotated, elbow extended, forearm pronated. Grasp is normal. Which roots?"
        options:
          - "C5-C6"
          - "C8-T1"
          - "C5-C7 (long thoracic)"
          - "C7 alone"
        answer: 0
        why:
          - "صح: ده waiter's tip، Erb palsy، الـ upper trunk C5-C6."
          - "C8-T1 كان هيبوّظ الـ grasp (Klumpke، claw hand)."
          - "الـ long thoracic بيعمل winged scapula، مش الوضع ده."
          - "C7 لوحده مش الصورة دي، والـ biceps C5-C6."
        page: 452
        quote: "Traction or tear of upper trunk: C5-C6 roots"
      - kind: explain
        title: "Klumpke: Clawmpke"
        text: |-
          في Klumpke الـ C8-T1 راحوا ← كل الـ **intrinsic hand muscles** (lumbricals و interossei و thenar و hypothenar).

          الـ lumbricals شغلانتها تثني الـ MCP وتفرد الـ PIP والـ DIP. لما تروح، الإيد بتعمل العكس ← ==claw hand== («Clawmpke»).

          ولو الـ T1 root أو الـ sympathetic chain اتعوّر ← ==Horner syndrome== كمان.
        page: 452
        quote: "Claw hand (“Clawmpke” palsy): lumbricals normally flex MCP joints and extend DIP and PIP joints +/– Horner syndrome if T1 root/sympathetic chain involved"
      - kind: explain
        title: "Thoracic outlet: Klumpke + أوعية"
        text: |-
          الـ **thoracic outlet syndrome** = ضغط على الـ lower trunk **والـ subclavian vessels**، غالباً في الـ scalene triangle. السبب: **cervical rib** أو first rib شاذ، أو ==Pancoast tumor==.

          الصورة: نفس Klumpke (ضمور عضلات الإيد) + أعراض أوعية: ischemia و pain و edema.
        page: 452
        quote: "Thoracic outlet syndrome Compression of lower trunk and subclavian vessels, most commonly within the scalene triangle Cervical/ anomalous first ribs (arrows in A ), Pancoast tumor Same as Klumpke palsy Atrophy of intrinsic hand muscles; ischemia, pain, and edema due to vascular compression"
      - kind: reveal
        prompt: "ست عملت mastectomy مع axillary node dissection، ودلوقتي الـ scapula بتطلع لبرّه لما تزق الحيطة، ومش قادرة ترفع دراعها فوق الكتف. ليه؟"
        answer: "اتعور الـ **long thoracic nerve** (C5-C7، «wings of heaven») ← الـ **serratus anterior** مش قادر يثبّت الـ scapula على القفص الصدري ← ==winged scapula== ومفيش abduction فوق الـ horizontal."
        page: 452
        quote: "Winged scapula Lesion of long thoracic nerve, roots C5-C7 (“wings of heaven”) Axillary node dissection after mastectomy, stab wounds Serratus anterior Inability to anchor scapula to thoracic cage"
      - kind: check
        question: "A heavy smoker has wasting of the hand muscles, ptosis and miosis on the same side, and an apical lung mass. What compresses what?"
        options:
          - "Pancoast tumor on the lower trunk and the T1/sympathetic chain"
          - "Cervical rib on the upper trunk"
          - "Axillary lymph nodes on the long thoracic nerve"
          - "Tumor on the musculocutaneous nerve"
        answer: 0
        why:
          - "صح: Pancoast بيضغط على الـ lower trunk (إيد Klumpke)، ولو وصل للـ T1 والـ sympathetic chain ← Horner."
          - "الـ upper trunk بيعمل Erb، ومفيش Horner."
          - "الـ long thoracic بيعمل winged scapula."
          - "الـ musculocutaneous بيشيل الـ elbow flexion، مش عضلات الإيد."
        page: 452
        quote: "+/– Horner syndrome if T1 root/sympathetic chain involved"
      - kind: try
        items: [msk.L01.023, msk.L01.026, msk.L01.027, msk.L01.029, msk.L01.030]
    recap:
      - "Remember To Drink Cold Beer: Roots، Trunks، Divisions، Cords، Branches."
      - "Erb = upper trunk C5-C6، شد جانبي للرقبة، waiter's tip (DIBs)."
      - "Klumpke = lower trunk C8-T1، شد لفوق للدراع، claw hand ± Horner."
      - "Thoracic outlet = Klumpke + أوعية (cervical rib، Pancoast). Winged scapula = long thoracic."
