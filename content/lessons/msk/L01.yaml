          - **Interossei** (ulnar): ==DAB== = Dorsals ABduct، ==PAD== = Palmars ADduct.
          - **Lumbricals**: 1 و 2 من الـ median، 3 و 4 من الـ ulnar. بتثني الـ MCP وتفرد الـ PIP والـ DIP.
