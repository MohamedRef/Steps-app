  - id: msk.L01.lesson4
    title: "الركبة والورك وأعصاب الرجل"
    hook: "PED و TIP: حرفين بيحلّوا معظم أسئلة الـ foot drop"
    minutes: 10
    pages: [454, 457]
    topics: [knee-exam, actions-of-hip-muscles, lower-extremity-nerves]
    goals:
      - "تعرف كل test في الركبة بيكشف إيه"
      - "تعرف عضلات الورك"
      - "تربط كل عصب في الرجل بالسبب والعَرَض"
    status: unverified
    steps:
      - kind: explain
        title: "أربطة الركبة: LAMP"
        text: |-
          الـ **ACL** من الـ lateral femoral condyle للـ anterior tibia، والـ **PCL** من الـ medial condyle للـ posterior tibia. الكتاب بيقولها ==LAMP==: Lateral-Anterior و Medial-Posterior.

          - **Anterior drawer** (ركبة 90°): الـ tibia بتتزحلق لقدّام ← ACL. والـ **Lachman** نفس الفكرة على 30°.
          - **Posterior drawer**: بتتزحلق لورا ← PCL.
          - **Valgus**: قوة من برّه ← المسافة من جوّه بتوسع ← ==MCL==.
          - **Varus**: قوة من جوّه ← المسافة من برّه بتوسع ← LCL.
        page: 454
        quote: "Valgus stress test Abnormal passive abduction. Knee extended or at ~30° angle, lateral (valgus) force → medial space widening of tibia → MCL injury."
      - kind: aside
        tone: tip
        text: "الـ McMurray: ==LIME==. **L**ateral meniscus مع **I**nternal rotation (و varus)، و**M**edial meniscus مع **E**xternal rotation (و valgus)."
        page: 454
        quote: "Pain, “popping” on internal rotation and varus force → Lateral meniscal tear (Internal rotation stresses lateral meniscus)"
      - kind: check
        question: "A skier's knee is struck from the outside. With the knee at 30°, valgus stress widens the joint medially. Which ligament?"
        options:
          - "MCL"
          - "LCL"
          - "ACL"
          - "PCL"
        answer: 0
        why:
          - "صح: القوة من برّه (valgus) بتفتح المسافة من جوّه ← MCL."
          - "الـ LCL بيبان بالـ varus: القوة من جوّه والمسافة من برّه."
          - "الـ ACL بيبان بالـ anterior drawer أو Lachman."
          - "الـ PCL بيبان بالـ posterior drawer."
        page: 454
        quote: "lateral (valgus) force → medial space widening of tibia → MCL injury."
      - kind: table
        title: "عضلات الورك"
        columns: ["Action", "Muscles"]
        rows:
          - ["Abductors", "Gluteus medius, gluteus minimus"]
          - ["Adductors", "Adductor magnus, longus, brevis"]
          - ["Extensors", "Gluteus maximus, semitendinosus, semimembranosus, long head of biceps femoris"]
          - ["Flexors", "Iliopsoas, rectus femoris, tensor fascia lata, pectineus, sartorius"]
          - ["Internal rotation", "Gluteus medius, gluteus minimus, tensor fascia latae"]
          - ["External rotation", "Iliopsoas, gluteus maximus, piriformis, obturator internus and externus"]
        hide: [[0, 1], [2, 1], [4, 1]]
        page: 455
        quote: "Abductors Gluteus medius, gluteus minimus Adductors Adductor magnus, adductor longus, adductor brevis"
      - kind: explain
        title: "أعصاب أعلى الفخذ"
        text: |-
          - **Iliohypogastric** و **ilioinguinal**: بيتعوروا في ==inguinal hernia repair== ← حرقان عند الجرح والـ inguinal region. الـ iliohypogastric بيحس الـ suprapubic region. الـ ilioinguinal بيحس الـ superomedial thigh والـ mons pubis/root of penis والـ anterior scrotum/labia majora، وبيتعور كمان في عمليات أسفل البطن والحوض (Cesarean، appendectomy extension، vasectomy)، والـ nerve block، والـ athletic pubalgia. وهو الـ afferent بتاع الـ **cremasteric reflex**، والـ efferent هو الـ genital branch بتاع الـ genitofemoral.
          - **Genitofemoral**: بيتعور في الـ laparoscopic surgery.
          - **Lateral femoral cutaneous**: حس بس (anterolateral thigh). بيتزنق جنب الـ ASIS مع الهدوم الضيقة والسمنة والحمل وعمليات الحوض ← ==meralgia paresthetica==.
          - **Obturator**: pelvic surgery ← حس medial thigh و adduction.
          - **Femoral**: pelvic fracture أو retroperitoneal hematoma أو psoas abscess ← ↓ leg extension و ↓ patellar reflex.
        page: 456
        quote: "Meralgia paresthetica— entrapment of lateral femoral cutaneous nerve near anterior superior iliac spine/inguinal ligament → ↓ sensation, paresthesia, burning pain in anterolateral thigh; associated with obesity, tight belts, pregnancy"
      - kind: reveal
        prompt: "ست حامل في الشهر الثامن بتشتكي من حرقان وتنميل في الجنب البرّاني من فخذها، والـ reflexes والقوة سليمين. إيه ده، وليه مفيش ضعف؟"
        answer: "==Meralgia paresthetica==: الـ lateral femoral cutaneous nerve اتزنق تحت الـ inguinal ligament جنب الـ ASIS. مفيش ضعف لأن العصب ده **sensory بس**."
        page: 456
        quote: "Lateral femoral cutaneous (L2-L3) A Sensory—anterior and lateral thigh"
      - kind: explain
        title: "الـ sciatic: العصب الكبير"
        text: |-
          الـ ==sciatic== (L4-S3) بيحس الـ posterior knee وكل اللي تحت الركبة (ماعدا شريط رفيع على الـ medial leg)، وبيحرّك الـ hamstrings (semitendinosus و semimembranosus و biceps femoris) والـ adductor magnus.

          بيتعور مع **herniated disc** أو **posterior hip dislocation** أو **piriformis syndrome**، وبيتقسم لاتنين: ==common peroneal== و **tibial**.
        page: 456
        quote: "Sciatic (L4-S3) Sensory—posterior knee and all below knee (except narrow band on medial lower leg) Motor—semitendinosus, semimembranosus, biceps femoris, adductor magnus Herniated disc, posterior hip dislocation, piriformis syndrome Splits into common peroneal and tibial nerves"
      - kind: explain
        title: "تحت الركبة: PED و TIP"
        text: |-
          فرعين الـ sciatic تحت الركبة:

          - **Common peroneal**: بيلف حوالين الـ fibular neck، فبيتعور مع كسره. ==PED==: Peroneal Everts and Dorsiflexes ← إصابته = **foot drop** (الرجل inverted و plantarflexed)، steppage gait، وفقد حس ضهر القدم.
          - **Tibial**: ==TIP==: Tibial Inverts and Plantarflexes ← إصابته = مش قادر يقف على صوابعه ولا يكوّر صوابعه، وفقد حس بطن القدم، ولو الإصابة فوق القدم بتقف everted. السبب: Baker cyst أو knee trauma (فوق)، tarsal tunnel (تحت). وبيحرّك الـ long head of biceps femoris والـ triceps surae والـ plantaris والـ popliteus والـ flexors بتوع القدم.
        page: 457
        quote: "TIP = Tibial Inverts and Plantarflexes; if injured, can’t stand on TIPtoes"
      - kind: figure
        title: "الـ Trendelenburg: الحوض بيقع على الناحية السليمة"
        svg: |-
          <svg viewBox="0 0 360 180" xmlns="http://www.w3.org/2000/svg">
            <text x="30" y="20" class="t-sm t-b">Normal</text>
            <line class="fg-ink" x1="30" y1="60" x2="130" y2="60" stroke-width="5"/>
