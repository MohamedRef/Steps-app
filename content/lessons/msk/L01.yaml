  - id: msk.L01.lesson6
    title: "العضلة بتنقبض إزاي، والعضم بيتبني إزاي"
    hook: "الـ ATP مش بيعمل الانقباض: هو اللي بيفك العضلة. افهم دي وهتفهم الـ rigor mortis"
    minutes: 10
    pages: [459, 461]
    topics: [muscle-contraction, skeletal-muscle-fibers, skeletal-muscle-adaptations, vascular-smooth-muscle, muscle-proprioceptors, bone-formation]
    goals:
      - "ترتب خطوات الانقباض من الـ nerve لحد الـ crossbridge"
      - "تفرّق type I عن type II، والـ spindle عن الـ Golgi tendon organ"
      - "تعرف الـ smooth muscle بيرتاح إزاي بالـ NO"
    status: unverified
    steps:
      - kind: explain
        title: "من العصب للكالسيوم"
        text: |-
          - الـ action potential يفتح الـ voltage-gated Ca2+ channels في الـ presynaptic ← ACh ينزل.
          - الـ ACh يربط ← depolarization في الـ motor end plate، وتنزل جوّه العضلة من الـ ==T-tubules== (امتداد للـ plasma membrane لازق في الـ sarcoplasmic reticulum).
          - الـ depolarization يغيّر شكل الـ **DHPR**، وده مربوط ميكانيكياً بالـ ==ryanodine receptor== ← Ca2+ يطلع من الـ SR (اللي كان مخزّنه مع الـ calsequestrin).
        page: 459
        quote: "Membrane depolarization induces conformational changes in the voltage- sensitive dihydropyridine receptor (DHPR) and its mechanically coupled ryanodine receptor"
      - kind: explain
        title: "من الكالسيوم للـ crossbridge"
        text: |-
          - الـ tropomyosin قاعد على أماكن ربط الـ myosin في الـ actin. الـ Ca2+ يربط **troponin C** ← الـ tropomyosin يتزحزح.
          - رأس الـ myosin يمسك الـ actin (crossbridge)، والـ Pi يطلع ← ==power stroke==، وفي آخره الـ ADP يطلع.
          - ATP جديد يربط ← الرأس ==يسيب== الـ actin. تكسير الـ ATP يرجّع الرأس cocked.
          - الـ SERCA يرجّع الـ Ca2+ للـ SR ← relaxation.
        page: 459
        quote: "Binding of new ATP molecule causes detachment of myosin head from actin filament."
      - kind: reveal
        prompt: "بعد الوفاة العضلات بتتخشب (rigor mortis). ليه، مع إن مفيش أعصاب شغالة؟"
        answer: "لأن الـ **ATP خلص**. الـ ATP هو اللي بيفك رأس الـ myosin من الـ actin. من غيره الـ crossbridges بتفضل ==مقفولة==."
        page: 459
        quote: "Binding of new ATP molecule causes detachment of myosin head from actin filament."
      - kind: figure
        title: "الـ sarcomere وهو بيقصر"
        svg: |-
          <svg viewBox="0 0 360 170" xmlns="http://www.w3.org/2000/svg">
            <line class="fg-ink" x1="20" y1="20" x2="20" y2="70" stroke-width="3"/>
            <line class="fg-ink" x1="340" y1="20" x2="340" y2="70" stroke-width="3"/>
            <line class="fg-arrow" x1="20" y1="35" x2="140" y2="35"/>
            <line class="fg-arrow" x1="340" y1="35" x2="220" y2="35"/>
            <rect class="fg-acc" x="100" y="45" width="160" height="14" rx="3"/>
            <text x="12" y="85" class="t-sm">Z</text>
            <text x="335" y="85" class="t-sm">Z</text>
            <text x="150" y="85" class="t-sm t-acc">A band</text>
            <text x="150" y="18" class="t-sm t-mut">H band</text>
            <line class="fg-ink" x1="80" y1="100" x2="80" y2="150" stroke-width="3"/>
            <line class="fg-ink" x1="280" y1="100" x2="280" y2="150" stroke-width="3"/>
            <line class="fg-arrow" x1="80" y1="115" x2="175" y2="115"/>
            <line class="fg-arrow" x1="280" y1="115" x2="185" y2="115"/>
            <rect class="fg-acc" x="100" y="125" width="160" height="14" rx="3"/>
            <text x="100" y="162" class="t-sm t-good">Contracted: H, I shorter; A same</text>
          </svg>
        caption: "فوق: sarcomere مرتاح. تحت: منقبض. الـ actin بيتزحلق على الـ myosin، فالـ H والـ I bands والمسافة بين الـ Z lines بيقصروا، والـ A band (طول الـ myosin) ثابت."
        alt: "Two sarcomeres. Top, relaxed: Z lines far apart with actin from each side and a myosin A band in the middle. Bottom, contracted: Z lines closer, H and I bands shorter, the A band the same length."
        page: 459
        quote: "Muscle shortening occurs, with shortening of H and I bands and between Z lines (HI, I’m wearing shortZ). The A band remains the same length (A band is Always the same length)."
      - kind: check
        question: "During skeletal muscle contraction, which band stays the same length?"
        options:
          - "A band"
          - "H band"
          - "I band"
          - "Distance between Z lines"
        answer: 0
        why:
          - "صح: الـ A band هو طول الـ myosin نفسه، وده ما بيتغيرش: A band is Always the same."
          - "الـ H band بيقصر (HI, I'm wearing shortZ)."
          - "الـ I band بيقصر."
          - "الـ Z lines بيقربوا من بعض."
        page: 459
        quote: "The A band remains the same length (A band is Always the same length)."
      - kind: table
        title: "Type I ولا Type II"
        columns: ["", "Type I", "Type II"]
        rows:
          - ["Velocity", "Slow", "Fast"]
          - ["Color", "Red", "White"]
          - ["Metabolism", "Oxidative phosphorylation", "Anaerobic glycolysis"]
          - ["Mitochondria, myoglobin", "↑", "↓"]
          - ["Training", "Endurance", "Weight/resistance, sprinting"]
        hide: [[2, 1], [2, 2], [4, 1], [4, 2]]
        page: 460
        quote: "ContRaCtion VEloCity Slow Fast FiBER ColoR Red White pREdominant mEtaBolism Oxidative phosphorylation → sustained contraction Anaerobic glycolysis"
      - kind: aside
        tone: tip
        text: "الكتاب: «==1 slow red ox==» و «2 fast white antelopes». الأحمر من الـ myoglobin والـ mitochondria. وفي العضلة الطبيعية الأنواع مخلوطة عشوائي؛ لو لقيتها **متجمّعة** (fiber type grouping) يبقى في reinnervation بعد إصابة عصب. وفي الـ hypertrophy الـ **satellite cells** بتضيف nuclei (ومش موجودة في القلب)."
        page: 460
        quote: "Two types, normally distributed randomly within muscle. Muscle fiber type grouping commonly occurs due to reinnervation of denervated muscle fibers in peripheral nerve damage."
      - kind: explain
        title: "الـ smooth muscle: kinase يقفل، phosphatase يفتح"
        text: |-
          - انقباض: depolarization ← L-type Ca2+ channels ← Ca2+ يعلى ← Ca2+-calmodulin ← ==MLCK== يعمل phosphorylation للـ myosin ← contraction.
          - ارتخاء: ACh أو bradykinin على الـ endothelium ← NO synthase يعمل NO من L-arginine ← الـ NO يدخل الـ smooth muscle ← GTP يبقى cGMP ← ==MLCP== يشيل الـ phosphate ← relaxation.
        page: 460
        quote: "Acetylcholine, bradykinin, etc NO GTP cGMP Myosin–light-chain phosphatase (MLCP)"
      - kind: check
        question: "Nitric oxide relaxes vascular smooth muscle mainly by which step?"
        options:
          - "↑ cGMP activating myosin light-chain phosphatase"
          - "↑ Ca2+-calmodulin activating myosin light-chain kinase"
          - "Opening L-type Ca2+ channels"
          - "Binding troponin C"
        answer: 0
        why:
          - "صح: NO ← cGMP ← MLCP ← myosin من غير phosphate ← ارتخاء."
          - "ده طريق الانقباض."
          - "فتح الـ Ca2+ channels بيعمل انقباض."
          - "الـ smooth muscle مفيهوش troponin؛ ده في الـ skeletal."
        page: 460
        quote: "Acetylcholine, bradykinin, etc NO GTP cGMP Myosin–light-chain phosphatase (MLCP)"
      - kind: table
        title: "Spindle ولا Golgi tendon organ"
        columns: ["", "Muscle spindle", "Golgi tendon organ"]
        rows:
          - ["Where / fibers", "Body of muscle; Ia and II", "Tendon; Ib"]
          - ["Senses", "↑ stretch (deep tendon reflexes)", "↑ tension"]
          - ["Result", "Agonist contracts, antagonist inhibited", "Agonist inhibited"]
        hide: [[0, 2], [1, 1], [2, 2]]
        page: 461
        quote: "Body of muscle/type Ia and II sensory axons Tendons/type Ib sensory axons"
      - kind: explain
        title: "العضم: بالكارتيلاج ولا من غيره"
        text: |-
          - **Endochondral**: الـ axial و appendicular skeleton وقاعدة الجمجمة. الـ chondrocytes يعملوا موديل cartilage، وبعدين الـ osteoblasts والـ osteoclasts يحطّوا woven bone ← lamellar. ده اللي ==بايظ في الـ achondroplasia==.
          - **Membranous**: الـ calvarium وعضم الوش والـ ==clavicle==. woven bone على طول من غير cartilage، وبعدين lamellar.

          والـ woven bone في الكبير معناه كسر بيلم أو **Paget disease**.
        page: 461
        quote: "Membranous ossification Bones of calvarium, facial bones, and clavicle. Woven bone formed directly without cartilage. Later remodeled to lamellar bone."
      - kind: try
        items: [msk.L01.082, msk.L01.086, msk.L01.088, msk.L01.094, msk.L01.096]
    recap:
      - "DHPR مربوط بالـ ryanodine ← Ca2+ ← troponin C ← crossbridge. ATP بيفك الرأس."
      - "H و I بيقصروا، A ثابت."
      - "Type I = slow red ox (endurance). Fiber type grouping = reinnervation."
      - "MLCK يقبض، NO ← cGMP ← MLCP يرخّي. Spindle = stretch (Ia)، Golgi = tension (Ib)."
      - "Endochondral (بايظ في achondroplasia) ضد membranous (calvarium، الوش، الـ clavicle)."
