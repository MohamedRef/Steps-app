        quote: "pelvis tilts because weight- bearing leg cannot maintain alignment of pelvis through hip abduction Lesion located on side of raised hip, ipsilateral to standing leg"
      - kind: aside
        tone: exam
        text: "الـ superior gluteal بيحرّك الـ gluteus medius و minimus و tensor fascia latae. سبب إصابته المشهور: ==حقنة في العضل== في الربع الـ superomedial. الوقاية: الربع الـ superolateral (والأحسن الـ anterolateral). والـ **inferior gluteal** (gluteus maximus) بيتعور مع posterior hip dislocation ← صعوبة طلوع السلم والقيام من الكرسي."
        page: 457
        quote: "Iatrogenic injury during intramuscular injection to superomedial gluteal region (prevent by choosing superolateral quadrant, preferably anterolateral region)"
      - kind: check
