lecture: msk.L01
lessons:
  - id: msk.L01.lesson1
    title: "أعصاب الدراع: كل كسر بيقطع عصب"
    hook: "اعرف الكسر فين في الـ humerus، تعرف العصب اللي اتعور من غير ما تحفظ جدول"
    minutes: 9
    pages: [450, 451]
    topics: [upper-extremity-nerves, rotator-cuff-muscles, arm-abduction]
    goals:
      - "تربط كل مكان كسر في الـ humerus بالعصب اللي جنبه"
      - "تفرّق بين إصابة الـ median فوق وتحت، والـ ulnar فوق وتحت"
      - "تعرف مين بيرفع الدراع في كل درجة"
    status: unverified
    steps:
      - kind: explain
        title: "الـ humerus زي سلّم عليه 3 أعصاب"
        text: |-
          امشي على الـ humerus من فوق لتحت، هتلاقي 3 أعصاب لازقين في العضمة، وكل واحد بيتعور مع كسر في مكانه:

          - **surgical neck** (أو anterior dislocation للكتف) ← ==axillary==
          - **midshaft** (الـ spiral groove) ← ==radial==
          - **supracondylar** ← ==median==

          الكتاب بيقولها ARM: Axillary ← Radial ← Median، من فوق لتحت.
        page: 450
        quote: "Humerus fractures, proximally to distally, follow the ARM (Axillary → Radial → Median) nerves"
      - kind: figure
        title: "ARM على طول الـ humerus"
        svg: |-
          <svg viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
            <rect class="fg-box" x="150" y="15" width="40" height="170" rx="18"/>
            <circle class="fg-dot-acc" cx="170" cy="45" r="6"/>
            <circle class="fg-dot-acc" cx="170" cy="100" r="6"/>
            <circle class="fg-dot-acc" cx="170" cy="160" r="6"/>
            <line class="fg-arrow" x1="176" y1="45" x2="215" y2="45"/>
            <line class="fg-arrow" x1="176" y1="100" x2="215" y2="100"/>
            <line class="fg-arrow" x1="176" y1="160" x2="215" y2="160"/>
            <text x="220" y="42" class="t-sm t-b">Axillary</text>
            <text x="220" y="56" class="t-sm t-mut">flattened deltoid</text>
            <text x="220" y="97" class="t-sm t-b">Radial</text>
            <text x="220" y="111" class="t-sm t-mut">wrist drop, triceps OK</text>
            <text x="220" y="157" class="t-sm t-b">Median</text>
            <text x="220" y="171" class="t-sm t-mut">hand of benediction</text>
            <text x="20" y="48" class="t-sm">Surgical neck</text>
            <text x="20" y="103" class="t-sm">Midshaft</text>
            <text x="20" y="163" class="t-sm">Supracondylar</text>
          </svg>
        caption: "من فوق لتحت: كسر الـ surgical neck بيعور الـ axillary، كسر النص بيعور الـ radial، والـ supracondylar بيعور الـ median."
        alt: "A humerus drawn vertically with three dots: surgical neck to axillary nerve (flattened deltoid), midshaft to radial nerve (wrist drop, triceps spared), supracondylar to median nerve (hand of benediction)."
        page: 450
        quote: "Humerus fractures, proximally to distally, follow the ARM (Axillary → Radial → Median) nerves"
      - kind: explain
        title: "الـ radial: عصب الفرد"
        text: |-
          الـ **radial** (C5-T1) بيفرد الكوع والرسغ والصوابع. بيتعور في 3 أماكن: الإبط (عكاز، أو نوم والدراع على ضهر كرسي: ==Saturday night palsy==)، النص (midshaft)، والساعد (مفك وحركة pronation/supination: finger drop).

          إصابة فوق الكوع ← **wrist drop** وتنميل في ضهر الدراع والإيد، والـ grip بيضعف لأن الـ flexors محتاجة الرسغ مفرود عشان تقفل بقوة.
        page: 450
        quote: "Injuries above the elbow cause loss of sensation over posterior arm/forearm and dorsal hand, wrist drop (due to loss of elbow, wrist, and finger extension) with ↓ grip strength (wrist extension necessary for maximal action of flexors)"
      - kind: reveal
        prompt: "مريض كسر نص الـ humerus وعنده wrist drop. ليه لسه بيفرد كوعه كويس؟"
        answer: "لأن فروع الـ **triceps** وحس ضهر الدراع بيطلعوا من الـ radial **قبل** الـ spiral groove. فالكسر في النص بيعدّيهم: ==triceps سليم==."
        page: 450
        quote: "Tricep function and posterior arm sensation spared in midshaft fracture"
      - kind: explain
        title: "الـ median والـ ulnar: فوق ولا تحت؟"
        text: |-
          **Median** (C5-T1): فوق = supracondylar fracture، تحت = carpal tunnel أو جرح في الرسغ. بيشيل الـ wrist flexion والـ ==LOAF== (الـ 2 lumbricals اللي برّه، Opponens، Abductor و Flexor pollicis brevis)، والحس على الـ thenar والـ 3.5 صوابع اللي برّه.

          **Ulnar** (C8-T1): فوق = كسر الـ medial epicondyle، تحت = كسر الـ hook of hamate أو ضغط الـ handlebar في العجلة. بيعمل ==ulnar claw== والحس بيروح من الـ 1.5 صباع اللي جوّه والـ hypothenar.

          و**الـ recurrent branch** بتاع الـ median: جرح سطحي في كف الإيد ← ape hand (الـ thenar باظ) ومن غير أي فقد حس.
        page: 450
        quote: "Loss of wrist flexion and function of the lateral two Lumbricals, Opponens pollicis, Abductor pollicis brevis, Flexor pollicis brevis (LOAF)"
      - kind: check
        question: "A man cuts the base of his thumb superficially on glass. He cannot oppose his thumb, but sensation of the whole hand is normal. Which nerve?"
        options:
          - "Recurrent branch of the median nerve"
          - "Median nerve at the elbow"
          - "Deep branch of the ulnar nerve"
          - "Superficial radial nerve"
        answer: 0
        why:
          - "صح: جرح سطحي في الكف ← ape hand ومن غير فقد حس، لأن الفرع ده motor بس."
          - "الـ median فوق كان هيشيل الحس كمان وكمان الـ wrist flexion."
          - "الـ deep ulnar بيشيل الـ interossei والـ adductor pollicis، مش الـ opposition."
          - "الـ superficial radial حسي بس على ضهر الإيد."
        page: 450
        quote: "Superficial laceration of palm “Ape hand” Loss of thenar muscle group: opposition, abduction, and flexion of thumb No loss of sensation"
      - kind: mnemonic
        word: "SItS"
        parts:
          - { key: "S", text: "Supraspinatus (suprascapular): أول 15° من الـ abduction، وأكتر واحدة بتتعور" }
          - { key: "I", text: "Infraspinatus (suprascapular): external rotation، إصابة الـ pitching" }
          - { key: "t", text: "teres minor (axillary): adduction و external rotation" }
          - { key: "S", text: "Subscapularis (upper و lower subscapular): internal rotation و adduction" }
        hook: "الـ t صغيرة عشان teres minor. والـ 4 أساساً C5-C6."
        page: 451
        quote: "Innervated primarily by C5-C6. SItS (small t is for teres minor)."
      - kind: aside
        tone: exam
        text: "دهّان أو لاعب سباحة عنده وجع في الكتف وهو بيرفع الدراع لفوق، والـ ==empty can test== موجب؟ ده **supraspinatus**: أشهر إصابة في الـ rotator cuff (impingement ← tendinopathy أو tear)."
        page: 451
        quote: "most common rotator cuff injury (trauma or degeneration and impingement → tendinopathy or tear [arrow in A ]), assessed by “empty/full can” test"
      - kind: table
        title: "مين بيرفع الدراع لحد فين"
        columns: ["Degree", "Muscle", "Nerve"]
        rows:
          - ["0°-15°", "Supraspinatus", "Suprascapular"]
          - ["15°-90°", "Deltoid", "Axillary"]
          - [">90°", "Trapezius", "Accessory"]
          - [">90°", "Serratus anterior", "Long thoracic"]
        hide: [[0, 1], [1, 1], [2, 2], [3, 2]]
        page: 451
        quote: "0°-15° Supraspinatus Suprascapular 15°-90° Deltoid Axillary >90° Trapezius Accessory >90° Serratus Anterior Long Thoracic (SALT)"
      - kind: check
        question: "After a surgical neck fracture of the humerus, a patient can start lifting the arm sideways but cannot continue past about 15°. Which nerve?"
        options:
          - "Axillary"
          - "Suprascapular"
          - "Long thoracic"
          - "Radial"
        answer: 0
        why:
          - "صح: الـ supraspinatus بيبدأ أول 15°، وبعدها الـ deltoid (axillary) هو اللي بيكمّل لحد 90°."
          - "الـ suprascapular شغال: هو اللي بيعمل أول 15°."
          - "الـ long thoracic (serratus anterior) بيشتغل فوق 90°."
          - "الـ radial مالوش دعوة بالـ abduction."
        page: 451
        quote: "15°-90° Deltoid Axillary"
      - kind: try
        items: [msk.L01.013, msk.L01.008, msk.L01.003, msk.L01.016, msk.L01.021]
    recap:
      - "ARM: surgical neck ← axillary، midshaft ← radial (triceps سليم)، supracondylar ← median."
      - "Median = LOAF والحس على 3.5 صوابع برّه. Ulnar = claw والحس على 1.5 جوّه."
      - "Recurrent branch: ape hand من غير فقد حس."
      - "SItS، والـ supraspinatus أشهر إصابة. Abduction: supraspinatus ← deltoid ← trapezius و serratus."
