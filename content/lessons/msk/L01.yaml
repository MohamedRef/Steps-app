  - id: msk.L01.lesson3
    title: "الرسغ والإيد: الـ scaphoid والـ claw"
    hook: "ليه الـ scaphoid بيموت، وليه الـ claw بيبان أكتر لما العصب يتعور تحت مش فوق؟"
    minutes: 9
    pages: [453, 454]
    topics: [wrist-region, hand-muscles, distortions-of-the-hand]
    goals:
      - "تعرف ليه كسر الـ scaphoid بيعمل avascular necrosis"
      - "تعرف عضلات الإيد وأعصابها"
      - "تفهم الـ claw paradox وتفرّق الـ 4 أشكال"
    status: unverified
    steps:
      - kind: explain
        title: "8 عضمات في سطرين"
        text: |-
          الكتاب بيعدّهم: Scaphoid، lunate، triquetrum، pisiform، hamate، capitate، trapezoid، trapezium، بجملة ==So long to pinky, here comes the thumb==: الصف الأول من الإبهام للخنصر، والتاني راجع من الخنصر للإبهام.
        page: 453
        quote: "Scaphoid, lunate, triquetrum, pisiform, hamate, capitate, trapezoid, trapezium A . (So long to pinky, here comes the thumb)"
      - kind: explain
        title: "الـ scaphoid: الدم بيدخل من الباب الغلط"
        text: |-
          الـ **scaphoid** هو ==أكتر carpal bone بيتكسر==، عادة من وقعة على إيد مفرودة (FOOSH)، وبتحسّه في الـ **anatomic snuff box**.

          الدم بتاعه **retrograde**: داخل من الطرف البعيد (فرع من الـ radial artery) وماشي لورا للـ proximal pole. فلو الكسر proximal، الحتة دي بتفضل من غير دم ← ==avascular necrosis== و nonunion.

          والفخ: الكسر ممكن **ما يبانش** في أول x-ray.
        page: 453
        quote: "Complications of proximal scaphoid fractures include avascular necrosis and nonunion due to retrograde blood supply from a branch of the radial artery. Occult fracture not always seen on initial x-ray."
