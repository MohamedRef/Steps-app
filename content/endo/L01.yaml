  - id: endo.L01.006
    kind: cloze
    topic: thyroid-development
    text: Thyroid follicular cells are derived from {{c1::endoderm}}; parafollicular (C) cells arise from the {{c2::4th pharyngeal pouch}}.
    src: { page: 330, quote: "Thyroid follicular cells B derived from endoderm. Parafollicular cells arise from 4th pharyngeal pouch." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.007
    kind: mcq
    topic: thyroid-development
    stem: >-
      A 6-year-old girl is brought to the clinic because of a painless lump in the front of her neck
      that her mother noticed 2 months ago. Examination shows a 1.5-cm smooth, nontender mass in the
      midline just below the hyoid bone. The mass moves upward when she sticks out her tongue.
      Thyroid function tests are normal. The mass most likely arose from persistence of which
      embryologic structure?
    options:
      - Thyroglossal duct
      - Cervical sinus
      - 4th pharyngeal pouch
      - Rathke pouch
      - 2nd pharyngeal arch cartilage
    answer: 0
    why:
      - "Right. A midline neck mass that moves with swallowing or tongue protrusion is a thyroglossal duct cyst: the duct that tied the descending thyroid to the tongue failed to disappear."
      - "A persistent cervical sinus gives a pharyngeal cleft cyst in the lateral neck, and it does not move with the tongue."
      - "The 4th pharyngeal pouch gives the parafollicular (C) cells, not a midline cyst."
      - "Rathke pouch (oral ectoderm) forms the anterior pituitary; its remnant gives a craniopharyngioma in the sella."
      - "The 2nd arch cartilage forms the stapes, styloid process and lesser horn of the hyoid; it does not form a mobile midline cyst."
    src: { page: 330, quote: "Thyroglossal duct cyst A presents as an anterior midline neck mass that moves with swallowing or protrusion of the tongue" }
    status: unverified
  - id: endo.L01.008
    kind: mcq
    topic: thyroid-development
    stem: >-
      A 24-year-old woman comes to the physician because of a sensation of a lump in her throat and
      mild difficulty swallowing for 1 year. Examination shows a smooth, reddish mass at the base of
      the tongue in the midline. No thyroid tissue is palpable in the neck. A radionuclide scan shows
      uptake only in the tongue mass. Surgical excision of this mass would most likely cause which
      of the following?
    options:
      - Hypothyroidism
      - Hypocalcemia
      - Recurrent laryngeal nerve palsy
      - Medullary thyroid carcinoma
      - Thyrotoxicosis
    answer: 0
    why:
      - "Right. A lingual thyroid is the most common ectopic thyroid site; when it is the only thyroid tissue, removing it leaves her hypothyroid."
      - "Hypocalcemia follows loss of the parathyroids, which come from the 3rd and 4th pouches and sit in the neck, not in the tongue."
      - "The recurrent laryngeal nerve runs beside the thyroid in the neck; tongue surgery does not reach it."
      - "Removing tissue does not cause a cancer; medullary carcinoma arises from parafollicular C cells."
      - "Taking away the only thyroid tissue lowers thyroid hormone, the opposite of thyrotoxicosis."
    src: { page: 330, quote: "Most common ectopic thyroid tissue site is the tongue (lingual thyroid). Removal may result in hypothyroidism if it is the only thyroid tissue present." }
    status: unverified
