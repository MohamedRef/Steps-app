  # ---------- p330: thyroid development ----------
  - id: endo.L01.001
    kind: cloze
    topic: thyroid-development
    text: The thyroid diverticulum arises from the {{c1::floor of the primitive pharynx}} and descends into the neck.
    src: { page: 330, quote: "Thyroid diverticulum arises from floor of primitive pharynx and descends into neck." }
    status: unverified
  - id: endo.L01.002
    kind: card
    topic: thyroid-development
    front: Which duct connects the developing thyroid to the tongue, and what can it leave behind if it persists?
    back: The thyroglossal duct. It normally disappears but may persist as cysts or as the pyramidal lobe of the thyroid.
    src: { page: 330, quote: "Connected to tongue by thyroglossal duct, which normally disappears but may persist as cysts or the pyramidal lobe of thyroid." }
    status: unverified
  - id: endo.L01.003
    kind: card
    topic: thyroid-development
    front: What is the normal remnant of the thyroglossal duct?
    back: The foramen cecum (at the base of the tongue).
    src: { page: 330, quote: "Foramen cecum is normal remnant of thyroglossal duct." }
    status: unverified
  - id: endo.L01.004
    kind: card
    topic: thyroid-development
    front: What is the most common site of ectopic thyroid tissue, and what is the risk of removing it?
    back: The tongue (lingual thyroid). Removal may cause hypothyroidism if it is the only thyroid tissue present.
    src: { page: 330, quote: "Most common ectopic thyroid tissue site is the tongue (lingual thyroid). Removal may result in hypothyroidism if it is the only thyroid tissue present." }
    status: unverified
    tags: [high-yield]
  - id: endo.L01.005
    kind: table
    topic: thyroid-development
    title: Thyroglossal duct cyst vs pharyngeal cleft cyst
    columns: [Lesion, Position in neck, Origin]
    rows:
      - [Thyroglossal duct cyst, "Anterior midline; moves with swallowing or protrusion of the tongue", Persistent thyroglossal duct]
      - [Pharyngeal cleft cyst, Lateral neck, Persistent cervical sinus]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 330, quote: "Thyroglossal duct cyst A presents as an anterior midline neck mass that moves with swallowing or protrusion of the tongue (vs persistent cervical sinus leading to pharyngeal cleft cyst in lateral neck)." }
    status: unverified
