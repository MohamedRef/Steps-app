  - id: endo.L03.123
    kind: table
    topic: growth-hormone
    title: GH and IGF-1 target effects (book figure)
    columns: [Target, Acting hormone, Effects]
    rows:
      - [Bone, IGF-1, "↑ amino acid uptake, ↑ protein synthesis, ↑ DNA and RNA synthesis, ↑ chondroitin sulfate, ↑ collagen, ↑ cell size and number"]
      - [Muscle, IGF-1, "↑ amino acid uptake, ↑ protein synthesis"]
      - [Adipose tissue, GH directly, "↓ glucose uptake, ↑ lipolysis"]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2]]
    src: { page: 333, quote: "Glucose uptake Lipolysis DNA and RNA synthesis Chondroitin sulfate Collagen Cell size and number" }
