    tags: [high-yield]
  - id: endo.L03.022
    kind: card
    topic: antidiuretic-hormone
    front: What is desmopressin used for?
    back: It mimics ADH, so it treats central DI and bedwetting at night (nocturnal enuresis).
    src: { page: 333, quote: "Desmopressin (ADH analog) is a treatment for central DI and nocturnal enuresis." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.106
    kind: card
    topic: antidiuretic-hormone
    front: How is vasopressin used in septic shock?
    back: As a potent vasopressor to ↑ organ perfusion.
    src: { page: 333, quote: "Vasopressin is a potent vasopressor that can be used to increase organ perfusion in septic shock." }
    status: unverified
  - id: endo.L03.023
    kind: cloze
    topic: antidiuretic-hormone
    text: ADH is regulated mainly by {{c1::plasma osmolality}}, and also by {{c2::hypovolemia}}.
    src: { page: 333, quote: "Plasma osmolality (1°); hypovolemia." }
    status: unverified
  - id: endo.L03.024
    kind: mcq
    topic: antidiuretic-hormone
    stem: >-
      A 30-year-old man comes to the physician because of excessive thirst and passing large
      volumes of dilute urine since a motorcycle accident with head trauma 3 weeks ago. Serum
      sodium is 147 mEq/L; urine osmolality is 110 mOsm/kg. After desmopressin, urine osmolality
      rises to 480 mOsm/kg. The drug acts on which receptor to correct his urine concentration?
    options:
      - V2 receptors on collecting duct principal cells
      - V1 receptors on vascular smooth muscle
      - Mineralocorticoid receptors in the collecting duct
      - Dopamine receptors on lactotrophs
      - Oxytocin receptors on myoepithelial cells
    answer: 0
    why:
      - "Right. Low ADH after head trauma is central DI. Desmopressin (ADH analog) acts on V2 receptors, inserting aquaporins in collecting duct principal cells."
      - "V1 receptors regulate blood pressure, not urine concentration."
      - "Aldosterone receptors handle sodium and potassium, not water permeability."
      - "Dopamine receptors on lactotrophs control prolactin, not urine."
      - "Oxytocin acts on breast and uterus; desmopressin works through ADH receptors."
    src: { page: 333, quote: "Regulates b1ood pressure (V1-receptors) and serum osmolality (V2-receptors)." }
    status: unverified
