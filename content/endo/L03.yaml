  - id: endo.L03.017
    kind: mcq
    topic: growth-hormone
    stem: >-
      A 44-year-old man comes to the physician because his rings and shoes no longer fit. He has
      had headaches and excessive sweating for 2 years. Examination shows coarse facial features,
      a prominent jaw and large hands. Fasting glucose is 138 mg/dL. MRI shows a pituitary
      macroadenoma. His raised glucose is best explained by which effect of the excess hormone?
    options:
      - Increased insulin resistance
      - Destruction of pancreatic β cells
      - Increased glucagon secretion from α cells
      - Increased renal glucose reabsorption by SGLT2
      - Increased cortisol secretion by the adrenal
    answer: 0
    why:
      - "Right. Excess GH causes acromegaly, and GH ↑ insulin resistance (diabetogenic)."
      - "Autoimmune β-cell destruction is type 1 DM, not a GH effect."
      - "GH's diabetogenic effect is peripheral insulin resistance, not α-cell stimulation."
      - "SGLT2 handles filtered glucose; GH doesn't act through it."
      - "Cortisol is also diabetogenic, but an ACTH source isn't suggested here; his tumor makes GH."
    src: { page: 333, quote: "↑ insulin resistance (diabetogenic)." }
    status: unverified
  # ---------- p333: antidiuretic hormone ----------
  - id: endo.L03.018
    kind: card
    topic: antidiuretic-hormone
    front: Where is ADH synthesized, and where is it stored and secreted?
    back: Made by neurons of the supraoptic and paraventricular nuclei in the hypothalamus; the posterior pituitary holds it and releases it.
    src: { page: 333, quote: "Synthesized in hypothalamus (supraoptic and paraventricular nuclei), stored and secreted by posterior pituitary." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.019
    kind: table
    topic: antidiuretic-hormone
    title: ADH receptors
    columns: [Receptor, Regulates]
    rows:
      - [V1, Blood pressure]
      - [V2, Serum osmolality (primary function)]
    blanks: [[0, 1], [1, 1]]
    src: { page: 333, quote: "Regulates b1ood pressure (V1-receptors) and serum osmolality (V2-receptors)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.020
    kind: cloze
    topic: antidiuretic-hormone
    text: ADH ↓ serum osmolality and ↑ urine osmolality by regulating insertion of {{c1::aquaporin channels}} in the {{c2::principal cells}} of the renal collecting duct.
    src: { page: 333, quote: "via regulation of aquaporin channel insertion in principal cells of renal collecting duct." }
    status: unverified
    tags: [high-yield]
