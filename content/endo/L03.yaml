  # ---------- p335: thyroid hormones ----------
  - id: endo.L03.032
    kind: card
    topic: thyroid-hormones
    front: Which enzyme converts T4 to T3 in peripheral tissue?
    back: 5′-deiodinase.
    src: { page: 335, quote: "5′-deiodinase converts T4 (the major thyroid product) to T3 in peripheral tissue" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.107
    kind: card
    topic: thyroid-hormones
    front: What activates and what inhibits peripheral T4 → T3 conversion?
    back: Growth hormone activates it; glucocorticoids, β-blockers and propylthiouracil (PTU) inhibit it.
    src: { page: 335, quote: "this pathway is activated by growth hormone and inhibited by glucocorticoids, β-blockers, and propylthiouracil (PTU)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.033
    kind: card
    topic: thyroid-hormones
    front: What is reverse T3, and what increases its production?
    back: A metabolically inactive byproduct of peripheral T4 conversion. Glucocorticoids increase its production.
    src: { page: 335, quote: "Reverse T3 (rT3) is a metabolically inactive byproduct of the peripheral conversion of T4 and its production is increased by glucocorticoids." }
    status: unverified
  - id: endo.L03.034
    kind: enumerate
    topic: thyroid-hormones
    prompt: Enumerate the functions of thyroid peroxidase (3).
    points:
      - Oxidation (of iodide)
      - Organification of iodine
      - Coupling of MIT and DIT
    pass: 3
    src: { page: 335, quote: "Functions of thyroid peroxidase include oxidation, organification of iodine, and coupling of monoiodotyrosine (MIT) and diiodotyrosine (DIT). Inhibited by PTU and methimazole." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.035
    kind: cloze
    topic: thyroid-hormones
    text: DIT + DIT = {{c1::T4}}. DIT + MIT = {{c2::T3}}. Thyroid peroxidase is inhibited by {{c3::PTU and methimazole}}.
    src: { page: 335, quote: "Inhibited by PTU and methimazole. DIT + DIT = T4. DIT + MIT = T3." }
    status: unverified
  - id: endo.L03.036
    kind: card
    topic: thyroid-hormones
    front: What is the Wolff-Chaikoff effect?
    back: A protective brake; a sudden iodine load briefly shuts down thyroid peroxidase, so the gland makes less T3/T4.
    src: { page: 335, quote: "Wolff-Chaikoff effect—protective autoregulation; sudden exposure to excess iodine temporarily turns off thyroid peroxidase → ↓ T3/T4 production." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.037
    kind: card
    topic: thyroid-hormones
    front: Which thyroid hormone binds the nuclear receptor with greater affinity, and which form is active?
    back: T3 binds with greater affinity than T4. Only free hormone is active.
    src: { page: 335, quote: "Only free hormone is active. T3 binds nuclear receptor with greater affinity than T4." }
    status: unverified
