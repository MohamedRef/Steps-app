    status: unverified
  - id: endo.L03.008
    kind: enumerate
    topic: hypothalamic-pituitary-hormones
    prompt: Enumerate the effects of a pituitary prolactinoma listed with the hypothalamic hormones (4).
    points:
      - Amenorrhea
      - Osteoporosis
      - Hypogonadism
      - Galactorrhea
    pass: 4
    hook: "الـ prolactinoma بيعمل 4 حاجات: 2 في الغدد (amenorrhea و hypogonadism)، 1 في العضم (osteoporosis)، و1 في الصدر (galactorrhea)."
    src: { page: 332, quote: "Pituitary prolactinoma → amenorrhea, osteoporosis, hypogonadism, galactorrhea" }
    status: unverified
  - id: endo.L03.009
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: Why is breastfeeding a natural contraceptive?
    back: Breastfeeding → ↑ prolactin → ↓ GnRH → delayed postpartum ovulation.
    src: { page: 332, quote: "Breastfeeding → ↑ prolactin → ↓ GnRH → delayed postpartum ovulation (natural contraception)" }
    status: unverified
  - id: endo.L03.010
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: Why can primary or secondary hypothyroidism cause galactorrhea?
    back: ↑ TRH stimulates prolactin secretion as well as TSH.
    src: { page: 332, quote: "↑ TRH (eg, in 1°/2° hypothyroidism) may increase prolactin secretion → galactorrhea" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.011
    kind: mcq
    topic: hypothalamic-pituitary-hormones
    stem: >-
      A 26-year-old woman with schizophrenia comes to the physician because of a milky discharge
      from both nipples and no menstrual periods for 4 months. Three months before her periods
      stopped, she started taking risperidone. A pregnancy test is negative. TSH is normal. Which
      of the following best explains her symptoms?
    options:
      - Loss of dopamine inhibition of lactotrophs
      - Increased TRH secretion
      - Increased oxytocin release from the posterior pituitary
      - Direct stimulation of breast tissue by the drug
      - Excess pulsatile GnRH secretion
    answer: 0
    why:
      - "Right. Dopamine is prolactin-inhibiting factor; antipsychotics block dopamine receptors → hyperprolactinemia → galactorrhea, and prolactin ↓ GnRH → amenorrhea."
      - "↑ TRH can raise prolactin in hypothyroidism, but her TSH is normal."
      - "Oxytocin causes milk letdown with suckling; it does not make milk or stop menses."
      - "The drug works through dopamine blockade, not on the breast directly."
      - "Prolactin suppresses GnRH; pulsatile GnRH would restore ovulation, not stop it."
    src: { page: 332, quote: "Dopamine antagonists (eg, antipsychotics) can cause galactorrhea due to hyperprolactinemia" }
    status: unverified
  # ---------- p333: growth hormone ----------
  - id: endo.L03.012
    kind: card
    topic: growth-hormone
    front: Through which mediator does GH stimulate linear growth and muscle mass, and where is it made?
    back: IGF-1 (somatomedin C), secreted by the liver.
    src: { page: 333, quote: "Stimulates linear growth and muscle mass through IGF-1 (somatomedin C) secretion by liver." }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.013
    kind: card
    topic: growth-hormone
    front: What is GH's effect on insulin sensitivity?
    back: GH ↑ insulin resistance (it is diabetogenic).
    src: { page: 333, quote: "↑ insulin resistance (diabetogenic)." }
    status: unverified
  - id: endo.L03.014
    kind: enumerate
    topic: growth-hormone
    prompt: Enumerate the factors that increase GH secretion (5).
    points:
      - (Deep) sleep
      - Hypoglycemia
      - Stress
      - Puberty
      - Exercise
    pass: 5
    hook: "الـ GH بيطلع وقت ما الجسم محتاج يبني أو يحمي السكر: نوم عميق، سكر واطي، stress، بلوغ، رياضة."
    src: { page: 333, quote: "Secretion ↑ during (deep) sleep, hypoglycemia, stress, puberty, exercise." }
    status: unverified
