  - id: endo.L03.016
    kind: card
    topic: growth-hormone
    front: What does GH excess (eg, a pituitary adenoma) cause in adults and in children?
    back: Acromegaly in adults; gigantism in children.
    src: { page: 333, quote: "Excess secretion of GH (eg, pituitary adenoma) may cause acromegaly (adults) or gigantism (children). Treatment: somatostatin analogs (eg, octreotide) or surgery." }
