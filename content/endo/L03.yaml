  - id: endo.L03.002
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: How does alcohol cause polyuria?
    back: Alcohol consumption ↓ ADH secretion → polyuria and dehydration.
    src: { page: 332, quote: "Alcohol consumption → ↓ ADH secretion → polyuria and dehydration" }
    status: unverified
  - id: endo.L03.003
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: What is prolactin-inhibiting factor, and why can antipsychotics cause galactorrhea?
    back: Prolactin-inhibiting factor is dopamine (↓ prolactin, ↓ TSH). Dopamine antagonists such as antipsychotics remove this inhibition → hyperprolactinemia → galactorrhea.
    src: { page: 332, quote: "Commonly referred to as dopamine Dopamine antagonists (eg, antipsychotics) can cause galactorrhea due to hyperprolactinemia" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.004
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: Which GHRH analog is used to treat HIV-associated lipodystrophy?
    back: Tesamorelin.
    src: { page: 332, quote: "Analog (tesamorelin) used to treat HIV-associated lipodystrophy" }
    status: unverified
  - id: endo.L03.005
    kind: cloze
    topic: hypothalamic-pituitary-hormones
    text: A {{c1::tonic}} GnRH analog (eg, leuprolide) suppresses the hypothalamic–pituitary–gonadal axis, whereas {{c2::pulsatile}} GnRH leads to puberty and fertility.
    src: { page: 332, quote: "Tonic GnRH analog (eg, leuprolide) suppresses hypothalamic–pituitary–gonadal axis. Pulsatile GnRH leads to puberty, fertility" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.006
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: Why does Cushing disease cause hyperpigmentation?
    back: MSH and ACTH share the same precursor molecule, POMC; ↑ MSH ↑ melanogenesis by melanocytes.
    src: { page: 332, quote: "Causes hyperpigmentation in Cushing disease, as MSH and ACTH share the same precursor molecule, POMC" }
    status: unverified
    tags: [high-yield]
  - id: endo.L03.007
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: What are the two classic functions of oxytocin?
    back: Uterine contractions during labor, and the milk letdown reflex in response to suckling.
    src: { page: 332, quote: "Oxytocin Causes uterine contractions during labor. Responsible for milk letdown reflex in response to suckling." }
    status: unverified
  - id: endo.L03.105
    kind: card
    topic: hypothalamic-pituitary-hormones
    front: Besides labor and milk letdown, what does oxytocin modulate?
    back: Fear, anxiety, social bonding, mood and depression.
    src: { page: 332, quote: "Modulates fear, anxiety, social bonding, mood, and depression." }
    status: unverified
  - id: endo.L03.112
    kind: table
