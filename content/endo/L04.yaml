    kind: table
    topic: hypothyroidism
    title: Thyroiditis
    columns: [Type, Thyroid, Key findings, Histology]
    rows:
      - [Hashimoto (chronic autoimmune), "Moderately enlarged, nontender", "Anti-TPO and antithyroglobulin; ↑ lymphoma risk", "Hürthle cells, lymphoid aggregates with germinal centers"]
