    kind: order
    topic: hypothyroidism
    prompt: Put the natural history of postpartum thyroiditis in order.
    steps:
      - Hyperthyroidism (within 3 months of birth)
      - Hypothyroidism
      - Recovery/euthyroid state
    src: { page: 345, quote: "Natural history: hyperthyroidism (within 3 months of birth) → hypothyroidism → recovery/euthyroid state." }
    status: unverified
  - id: endo.L04.163
    kind: card
    topic: hypothyroidism
    front: What is postpartum thyroiditis?
    back: A mild, self-limited variant of Hashimoto thyroiditis arising <1 year after delivery.
    src: { page: 345, quote: "Postpartum thyroiditis—mild, self-limited variant of Hashimoto thyroiditis arising <1 year after delivery." }
    status: unverified
