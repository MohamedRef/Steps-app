items:
  # ---------- p342: SIADH ----------
  - id: endo.L04.001
    kind: card
    topic: siadh
    front: What characterizes SIADH?
    back: Excessive free water retention, euvolemic hyponatremia with continued urinary Na+ excretion, and urine osmolality > serum osmolality.
    src: { page: 342, quote: "Characterized by excessive free water retention, euvolemic hyponatremia with continued urinary Na+ excretion, urine osmolality > serum osmolality." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.002
    kind: card
    topic: siadh
    front: Why is the hyponatremia of SIADH euvolemic?
    back: The body responds to water retention with ↓ aldosterone and ↑ ANP and BNP → ↑ urinary Na+ secretion → normalization of extracellular fluid volume.
    src: { page: 342, quote: "Body responds to water retention with ↓ aldosterone and ↑ ANP and BNP → ↑ urinary Na+ secretion → normalization of extracellular fluid volume → euvolemic hyponatremia." }
    status: unverified
  - id: endo.L04.003
    kind: enumerate
    topic: siadh
    prompt: Enumerate the causes of SIADH (HEELD-up water, 5).
    points:
      - Head trauma/CNS disorders
      - Ectopic ADH (eg, small cell lung cancer)
      - Exogenous hormones (eg, vasopressin, desmopressin, oxytocin)
      - Lung disease
      - Drugs (eg, SSRIs, carbamazepine, cyclophosphamide)
    pass: 5
    hook: "الكتاب بيقولك HEELD-up water: الماية محبوسة (held up). Head و Ectopic و Exogenous و Lung و Drugs."
    src: { page: 342, quote: "SIADH causes include (HEELD-up water): Head trauma/CNS disorders Ectopic ADH (eg, small cell lung cancer)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.004
    kind: enumerate
    topic: siadh
    prompt: Enumerate the treatments of SIADH (5).
    points:
      - Fluid restriction (first line)
      - Salt tablets
      - IV hypertonic saline
      - Diuretics
      - ADH antagonists (conivaptan, tolvaptan, demeclocycline)
    pass: 5
    src: { page: 342, quote: "Treatment: fluid restriction (first line), salt tablets, IV hypertonic saline, diuretics, ADH antagonists (eg, conivaptan, tolvaptan, demeclocycline)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.005
    kind: mcq
    topic: siadh
    stem: >-
      A 64-year-old man with a 50-pack-year smoking history comes to the physician because of
      fatigue and confusion for 2 weeks. He has lost 6 kg. He appears euvolemic. Serum sodium is
      122 mEq/L and serum osmolality is 255 mOsm/kg; urine osmolality is 480 mOsm/kg and urine
      sodium is 50 mEq/L. Chest CT shows a central hilar mass. Which of the following is the most
      appropriate first-line treatment for his electrolyte disorder?
    options:
      - Fluid restriction
      - Desmopressin
      - Isotonic saline infusion
      - Hydrochlorothiazide
      - Fludrocortisone
    answer: 0
    why:
      - "Right. A small cell lung cancer making ectopic ADH causes SIADH (euvolemic hyponatremia, urine osm > serum osm, continued urine Na+); fluid restriction is first line."
      - "Desmopressin is an ADH analog and would worsen the water retention."
      - "Isotonic saline is not on the book's list and the Na+ is excreted while the water is kept."
      - "Diuretics are on the list, but not first line."
      - "Aldosterone is already ↓ in SIADH as the body sheds volume; a mineralocorticoid isn't the treatment."
    src: { page: 342, quote: "Treatment: fluid restriction (first line), salt tablets, IV hypertonic saline, diuretics" }
    status: unverified
  # ---------- p342: primary polydipsia and DI ----------
  - id: endo.L04.006
    kind: card
    topic: primary-polydipsia-and-diabetes-insipidus
    front: What urine findings characterize primary polydipsia and diabetes insipidus?
    back: Large amounts of dilute urine (+/– thirst); urine specific gravity <1.006 and urine osmolality usually <300 mOsm/kg.
    src: { page: 342, quote: "Characterized by the production of large amounts of dilute urine +/– thirst. Urine specific gravity <1.006. Urine osmolality usually <300 mOsm/kg." }
    status: unverified
  - id: endo.L04.007
    kind: table
    topic: primary-polydipsia-and-diabetes-insipidus
    title: Primary polydipsia vs central DI vs nephrogenic DI
    columns: [Feature, Primary polydipsia, Central DI (AVP deficiency), Nephrogenic DI (AVP resistance)]
    rows:
      - [Definition, Excessive water intake, ↓ ADH release, ADH resistance]
      - [Causes, "Psychiatric illness, hypothalamic lesions of the thirst center", "Idiopathic, brain injury (trauma, hypoxia, tumor, surgery, infiltrative)", "Hereditary (V2-receptor mutation), drugs (lithium, demeclocycline), hypercalcemia, hypokalemia"]
      - [Serum osmolality, ↓, ↑, ↑]
      - [ADH level, ↓ or normal, ↓, Normal or ↑]
      - [Water restriction, Significant ↑ urine osm (>700 mOsm/kg), No change or slight ↑, No change or slight ↑]
      - [Desmopressin, —, Significant ↑ urine osm (>50%), Minimal change]
      - [Treatment, Water restriction, Desmopressin (DDAVP), "Treat the cause; low-solute diet, HCTZ, amiloride, indomethacin"]
    blanks: [[2, 1], [2, 2], [3, 1], [3, 3], [4, 1], [5, 2], [5, 3], [6, 3]]
    src: { page: 342, quote: "DEFINITION Excessive water intake ↓ ADH release ADH resistance" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.008
    kind: card
    topic: primary-polydipsia-and-diabetes-insipidus
    front: When can central DI be transient?
    back: If the damage is below the hypothalamic median eminence or in the posterior pituitary; ADH made in the hypothalamus can still be secreted systemically via portal capillaries in the median eminence.
    src: { page: 342, quote: "Central DI may be transient if damage is below hypothalamic median eminence or in the posterior pituitary" }
    status: unverified
  - id: endo.L04.009
    kind: card
    topic: primary-polydipsia-and-diabetes-insipidus
    front: How is the water restriction test done, and when is desmopressin given?
    back: No water for 2-3 hours, then hourly urine volume and osmolality and plasma Na+ and osmolality. Desmopressin is given if serum osmolality >295-300 mOsm/kg, plasma Na+ ≥145 mEq/L, or urine osmolality does not rise despite ↑ plasma osmolality.
    src: { page: 342, quote: "Desmopressin (ADH analog) is administered if serum osmolality >295-300 mOsm/kg, plasma Na+ ≥145 mEq/L, or urine osmolality does not increase despite ↑ plasma osmolality." }
    status: unverified
  - id: endo.L04.010
    kind: mcq
    topic: primary-polydipsia-and-diabetes-insipidus
    stem: >-
      A 41-year-old woman with bipolar disorder treated for 10 years comes to the physician because
      of thirst and urinating every hour, including at night. Serum sodium is 146 mEq/L and serum
      osmolality is 302 mOsm/kg; urine osmolality is 150 mOsm/kg. After water restriction, urine
      osmolality is unchanged. After desmopressin, it rises by 5%. Which of the following is the
      most appropriate treatment?
    options:
      - Amiloride
      - Desmopressin
      - Water restriction
      - Demeclocycline
      - Tolvaptan
    answer: 0
    why:
      - "Right. Lithium causes nephrogenic DI (ADH resistance; minimal response to desmopressin). Treatment manages the cause and uses a low-solute diet, HCTZ, amiloride or indomethacin."
      - "Desmopressin treats central DI; her kidneys do not respond to it."
      - "Water restriction treats primary polydipsia; her serum osmolality is high, not low."
      - "Demeclocycline itself causes nephrogenic DI; it is used for SIADH."
      - "Tolvaptan is an ADH antagonist for SIADH and would worsen her water loss."
    src: { page: 342, quote: "Manage the underlying cause; low-solute diet, HCTZ, amiloride, indomethacin" }
    status: unverified
  # ---------- p343: hypopituitarism ----------
  - id: endo.L04.011
    kind: enumerate
    topic: hypopituitarism
    prompt: Enumerate the causes of hypopituitarism (5).
    points:
      - Hypothalamic disease (mass lesion, radiation, infiltrative lesions)
      - Pituitary surgery
      - Pituitary disorders (mass effect of a nonsecreting adenoma, craniopharyngioma)
      - Empty sella
      - Sheehan syndrome
    pass: 5
    src: { page: 343, quote: "Undersecretion of pituitary hormones due to: Hypothalamic disease (ie, mass lesion, radiation, infiltrative lesions) Pituitary surgery" }
    status: unverified
  - id: endo.L04.012
    kind: card
    topic: hypopituitarism
    front: What is Sheehan syndrome and how does it usually present?
    back: Ischemic infarct of the pituitary after severe postpartum hemorrhage (pregnancy-induced pituitary growth ↑ susceptibility to hypoperfusion). It usually presents with failure to lactate, amenorrhea and cold intolerance (mainly anterior pituitary hormones).
    src: { page: 343, quote: "Sheehan syndrome—ischemic infarct of pituitary following severe postpartum hemorrhage; pregnancy-induced pituitary growth → ↑ susceptibility to hypoperfusion. Usually presents with failure to lactate, amenorrhea, cold intolerance" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.013
    kind: card
    topic: hypopituitarism
    front: How is hypopituitarism treated?
    back: Hormone replacement therapy (glucocorticoids, thyroxine, sex steroids, human growth hormone).
    src: { page: 343, quote: "Treatment: hormone replacement therapy (glucocorticoids, thyroxine, sex steroids, human growth hormone)" }
    status: unverified
  - id: endo.L04.014
    kind: mcq
    topic: hypopituitarism
    stem: >-
      A 30-year-old woman comes to the physician 6 weeks after delivering her second child. The
      delivery was complicated by placental abruption and blood loss requiring 6 units of packed
      red cells. Since then she has been unable to breastfeed, feels cold all the time and has
      not menstruated. Which of the following best explains why this complication followed her
      pregnancy?
    options:
      - Pregnancy-induced pituitary growth increased susceptibility to hypoperfusion
      - Autoimmune destruction of the posterior pituitary
      - Compression by a craniopharyngioma
      - Excess prolactin suppressing GnRH
      - Abrupt cessation of glucocorticoid therapy
    answer: 0
    why:
      - "Right. Sheehan syndrome: the pituitary enlarges in pregnancy, so severe postpartum hemorrhage causes an ischemic infarct, mainly hitting anterior pituitary hormones (no lactation, amenorrhea, cold intolerance)."
      - "The posterior pituitary is not the main site; her symptoms are anterior pituitary hormones."
      - "A craniopharyngioma is a mass lesion with no link to delivery."
      - "Prolactin excess would cause galactorrhea, but she cannot lactate."
      - "She has not been on glucocorticoids."
    src: { page: 343, quote: "pregnancy-induced pituitary growth → ↑ susceptibility to hypoperfusion. Usually presents with failure to lactate, amenorrhea, cold intolerance (anterior pituitary hormones mainly affected)." }
    status: unverified
  # ---------- p343: acromegaly ----------
  - id: endo.L04.015
    kind: card
    topic: acromegaly
    front: What causes acromegaly?
    back: Excess GH in adults, typically from a pituitary adenoma.
    src: { page: 343, quote: "Excess GH in adults. Typically caused by pituitary adenoma." }
    status: unverified
  - id: endo.L04.148
    kind: card
    topic: acromegaly
    front: What does ↑ GH cause in children, and why?
    back: Gigantism, with ↑ linear bone growth because the epiphyses are unfused ("acromegaly in adults, gigantism in j(g)uniors").
    src: { page: 343, quote: "↑ GH in children → gigantism (↑ linear bone growth due to unfused epiphysis)." }
    status: unverified
  - id: endo.L04.016
    kind: enumerate
    topic: acromegaly
    prompt: Enumerate the findings of acromegaly (10).
    points:
      - Large tongue with deep furrows
      - Frontal bossing
      - Coarsening of facial features with aging
      - Deep voice
      - Diaphoresis (excessive sweating)
      - Hypertrophic arthropathy
      - Impaired glucose tolerance (insulin resistance)
      - Hypertension
      - LVH
      - HFpEF (most common cause of death)
    pass: 8
    src: { page: 343, quote: "Large tongue with deep furrows, frontal bossing, coarsening of facial features with aging A , deep voice, diaphoresis (excessive sweating), hypertrophic arthropathy" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.017
    kind: card
    topic: acromegaly
    front: What is the most common cause of death in acromegaly?
    back: HFpEF (heart failure with preserved ejection fraction).
    src: { page: 343, quote: "hypertension, LVH, HFpEF (most common cause of death)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.018
    kind: card
    topic: acromegaly
    front: How is acromegaly diagnosed, and why not by a random GH level?
    back: ↑ serum IGF-1, failure to suppress serum GH after an oral glucose tolerance test, and a pituitary mass on brain MRI. GH levels are unreliable because they fluctuate through the day.
    src: { page: 343, quote: "↑ serum IGF-1 (GH levels unreliable as they fluctuate throughout the day); failure to suppress serum GH following oral glucose tolerance test" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.019
    kind: card
    topic: acromegaly
    front: How is acromegaly treated?
    back: Pituitary adenoma resection. If not cured, octreotide (somatostatin analog), pegvisomant (GH receptor antagonist) or dopamine agonists (eg, cabergoline).
    src: { page: 343, quote: "Pituitary adenoma resection. If not cured, treat with octreotide (somatostatin analog), pegvisomant (GH receptor antagonist), or dopamine agonists (eg, cabergoline)." }
    status: unverified
  - id: endo.L04.020
    kind: mcq
    topic: acromegaly
    stem: >-
      A 47-year-old man with coarse facial features, a large furrowed tongue, deep voice and
      excessive sweating has a serum IGF-1 three times the upper limit of normal. His GH stays
      high after an oral glucose load. MRI shows a pituitary macroadenoma, which is resected.
      Six months later IGF-1 is still elevated. He is started on a drug that blocks the hormone's
      receptor. Which drug was started?
    options:
      - Pegvisomant
      - Octreotide
      - Cabergoline
      - Tesamorelin
      - Desmopressin
    answer: 0
    why:
      - "Right. Pegvisomant is a GH receptor antagonist, used for acromegaly not cured by surgery."
      - "Octreotide is also used, but it is a somatostatin analog that lowers GH release, not a receptor blocker."
      - "Cabergoline is a dopamine agonist, another option, but not a receptor antagonist."
      - "Tesamorelin is a GHRH analog and would raise GH."
      - "Desmopressin is an ADH analog for central DI."
    src: { page: 343, quote: "pegvisomant (GH receptor antagonist)" }
    status: unverified
  # ---------- p344: hypothyroidism vs hyperthyroidism ----------
  - id: endo.L04.021
    kind: table
    topic: hypothyroidism-vs-hyperthyroidism
    title: Hypothyroidism vs hyperthyroidism
    columns: [System, Hypothyroidism, Hyperthyroidism]
    rows:
      - [Metabolic, "Cold intolerance, ↓ sweating, weight gain, hyponatremia (↓ free water clearance)", "Heat intolerance, ↑ sweating, weight loss (↑ Na+/K+-ATPase → ↑ BMR)"]
      - [Skin/hair, "Dry, cool skin; coarse, brittle hair; diffuse alopecia; brittle nails; myxedema (↑ GAGs)", "Warm, moist skin; fine hair; onycholysis; pretibial myxedema in Graves"]
      - [Ocular, Periorbital edema, "Graves ophthalmopathy (periorbital edema, exophthalmos), lid lag/retraction"]
      - [GI, "Constipation, ↓ appetite", "Hyperdefecation/diarrhea, ↑ appetite"]
      - [Musculoskeletal, "Hypothyroid myopathy (proximal weakness, ↑ CK), carpal tunnel, myoedema", "Thyrotoxic myopathy (proximal weakness, normal CK), osteoporosis/↑ fractures"]
      - [Reproductive, "Abnormal uterine bleeding, ↓ libido, infertility", "Abnormal uterine bleeding, gynecomastia, ↓ libido, infertility"]
      - [Neuropsychiatric, "Hypoactivity, lethargy, depressed mood, ↓ reflexes (slow relaxing)", "Hyperactivity, anxiety, insomnia, fine tremor, ↑ reflexes (brisk)"]
      - [Cardiovascular, "Bradycardia, dyspnea on exertion (↓ CO)", "Tachycardia, palpitations, arrhythmias (AF), chest pain, systolic hypertension"]
      - [Labs, "↑ TSH (if 1°), ↓ free T4, hypercholesterolemia", "↓ TSH (if 1°), ↑ free T3 and T4, ↓ LDL, HDL, total cholesterol"]
    blanks: [[0, 1], [0, 2], [4, 1], [4, 2], [6, 1], [6, 2], [8, 1], [8, 2]]
    src: { page: 344, quote: "Cold intolerance, ↓ sweating, weight gain (↓ basal metabolic rate → ↓ calorigenesis), hyponatremia (↓ free water clearance)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.022
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: What causes the nonpitting edema (myxedema) of hypothyroidism?
    back: ↑ GAGs in the interstitial spaces → ↑ osmotic pressure → water retention.
    src: { page: 344, quote: "puffy facies and generalized nonpitting edema (myxedema) due to ↑ GAGs in interstitial spaces → ↑ osmotic pressure → water retention" }
    status: unverified
  - id: endo.L04.023
    kind: cloze
    topic: hypothyroidism-vs-hyperthyroidism
    text: Hypothyroid myopathy has proximal weakness with {{c1::↑ CK}}; thyrotoxic myopathy has proximal weakness with {{c2::normal CK}}.
    src: { page: 344, quote: "Hypothyroid myopathy (proximal weakness, ↑ CK)" }
    status: unverified
  - id: endo.L04.024
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: What is myoedema?
    back: A small lump rising on the surface of a muscle when struck with a hammer, seen in hypothyroidism.
    src: { page: 344, quote: "myoedema (small lump rising on the surface of a muscle when struck with a hammer)" }
    status: unverified
  - id: endo.L04.025
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: Why does hyperthyroidism cause lid lag and retraction?
    back: ↑ sympathetic stimulation of the superior tarsal muscle.
    src: { page: 344, quote: "lid lag/ retraction (↑ sympathetic stimulation of superior tarsal muscle)" }
    status: unverified
  - id: endo.L04.026
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: Why does hyperthyroidism cause osteoporosis?
    back: T3 stimulates osteoclast differentiation, ↑ bone resorption and calcium release (it may also affect osteoblasts).
    src: { page: 344, quote: "T3 stimulates osteoclast differentiation, ↑ bone resorption, and release of calcium; may also affect osteoblasts" }
    status: unverified
  - id: endo.L04.027
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: What causes the cardiac effects of hyperthyroidism?
    back: ↑ number and sensitivity of β-adrenergic receptors, ↑ expression of cardiac sarcolemmal ATPase, and ↓ expression of phospholamban.
    src: { page: 344, quote: "↑ number and sensitivity of β-adrenergic receptors, ↑ expression of cardiac sarcolemmal ATPase, and ↓ expression of phospholamban" }
    status: unverified
  - id: endo.L04.028
    kind: card
    topic: hypothyroidism-vs-hyperthyroidism
    front: Why does hypothyroidism cause hypercholesterolemia?
    back: ↓ LDL receptor expression.
    src: { page: 344, quote: "Hypercholesterolemia (due to ↓ LDL receptor expression)" }
    status: unverified
  - id: endo.L04.029
    kind: mcq
    topic: hypothyroidism-vs-hyperthyroidism
    stem: >-
      A 52-year-old woman comes to the physician because of fatigue, constipation and weight gain
      for 6 months. She has trouble climbing stairs. Her skin is dry and cool, and her ankle
      reflexes relax slowly. TSH is 38 μU/mL and free T4 is low. Which additional laboratory
      finding is most likely?
    options:
      - Elevated creatine kinase
      - Hypernatremia
      - Low LDL cholesterol
      - Hypercalcemia
      - Low creatine kinase with normal strength
    answer: 0
    why:
      - "Right. Hypothyroid myopathy gives proximal weakness with ↑ CK (thyrotoxic myopathy has normal CK)."
      - "Hypothyroidism causes hyponatremia (↓ free water clearance), not hypernatremia."
      - "↓ LDL receptor expression raises cholesterol in hypothyroidism; low cholesterol is hyperthyroidism."
      - "Hypercalcemia isn't on the hypothyroid list; bone resorption rises in hyperthyroidism."
      - "Her proximal weakness and the expected CK rise don't fit this."
    src: { page: 344, quote: "Hypothyroid myopathy (proximal weakness, ↑ CK)" }
    status: unverified
  # ---------- p345: hypothyroidism ----------
  - id: endo.L04.030
    kind: card
    topic: hypothyroidism
    front: What is Hashimoto thyroiditis, and how common is it?
    back: Chronic autoimmune thyroiditis; the most common cause of hypothyroidism in iodine-sufficient regions.
    src: { page: 345, quote: "Most common cause of hypothyroidism in iodine sufficient regions." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.149
    kind: card
    topic: hypothyroidism
    front: Which HLA type is linked to Hashimoto thyroiditis, and which cancer does it raise the risk of?
    back: HLA-DR3 (differs by ethnicity); ↑ risk of primary thyroid lymphoma (typically diffuse large B-cell lymphoma).
    src: { page: 345, quote: "Associated with HLA-DR3 (differs by ethnicity), ↑ risk of primary thyroid lymphoma (typically diffuse large B-cell lymphoma)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.031
    kind: card
    topic: hypothyroidism
    front: What does the thyroid feel like in Hashimoto thyroiditis, and what may precede the hypothyroidism?
    back: Moderately enlarged and nontender; it may be preceded by transient hyperthyroidism ("Hashitoxicosis") from follicular rupture.
    src: { page: 345, quote: "May be preceded by transient hyperthyroid state (“Hashitoxicosis”) due to follicular rupture and thyroid hormone release." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.150
    kind: card
    topic: hypothyroidism
    front: Which antibodies are found in Hashimoto thyroiditis?
    back: Antithyroid peroxidase (antimicrosomal) and antithyroglobulin antibodies.
    src: { page: 345, quote: "Serology: ⊕ antithyroid peroxidase (antimicrosomal) and antithyroglobulin antibodies." }
    status: unverified
    tags: [high-yield]
  - id: endo.L04.151
    kind: card
    topic: hypothyroidism
    front: What is the histology of Hashimoto thyroiditis?
    back: Hürthle cells and lymphoid aggregates with germinal centers.
    src: { page: 345, quote: "Histology: Hürthle cells A , lymphoid aggregates with germinal centers B ." }
    status: unverified
    tags: [high-yield]
