  - id: endo.L05.019
    kind: mcq
    topic: diabetes-mellitus-therapy
    stem: >-
      A 61-year-old man with type 2 diabetes, heart failure with reduced ejection fraction and
      stage 4 chronic kidney disease has been taking the first-line oral agent for type 2 diabetes,
      which also helped him lose weight. He is admitted with septic shock. Serum lactate is
      9 mmol/L with an anion gap acidosis. Which mechanism of his diabetes drug best explains its
      role in this acidosis?
    options:
      - Inhibits hepatic gluconeogenesis via mGPD
      - Activates the nuclear receptor PPAR-γ
      - Closes K+ channels on pancreatic β cells
      - Inhibits brush-border α-glucosidases
      - Blocks proximal tubule glucose reabsorption
    answer: 0
    why:
      - "Right. The drug is metformin (first line, weight loss). It blocks mitochondrial glycerol-3-phosphate dehydrogenase (mGPD) and ↓ hepatic gluconeogenesis, and its feared adverse effect is lactic acidosis with renal insufficiency, sepsis or hypoperfusion, all present here."
      - "PPAR-γ activation is pioglitazone (edema, HF, fractures)."
      - "K+ channel closure is sulfonylureas (hypoglycemia)."
      - "α-glucosidase inhibitors cause GI upset and bloating."
      - "SGLT2 inhibitors cause glucosuria, UTIs, dehydration."
    src: { page: 359, quote: "lactic acidosis (in patients with renal insufficiency, cirrhosis, sepsis, or hypoperfusion)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.020
    kind: mcq
    topic: diabetes-mellitus-therapy
    stem: >-
      A 70-year-old woman with type 2 diabetes was started on a new oral agent 3 months ago. She
      now has bilateral ankle swelling, worsening dyspnea on exertion and a 4-kg weight gain, and
      last month she broke her wrist after a minor fall. The drug acts on which target?
    options:
      - A nuclear receptor (PPAR-γ)
      - AMP-activated protein kinase in the liver
      - ATP-sensitive K+ channels of β cells
      - Sodium-glucose co-transporter 2
      - Dipeptidyl peptidase-4
    answer: 0
    why:
      - "Right. Pioglitazone activates PPAR-γ; it causes weight gain, edema, HF and ↑ fractures."
      - "Metformin (AMPK) causes weight loss, not gain or edema."
      - "Sulfonylureas cause hypoglycemia and weight gain, but not edema, HF or fractures."
      - "SGLT2 inhibitors cause weight loss and dehydration."
      - "DPP-4 inhibitors are weight neutral; they cause respiratory and urinary infections."
    src: { page: 359, quote: "Weight gain, edema, HF, ↑ risk of fractures." }
    status: unverified
    tags: [high-yield]
