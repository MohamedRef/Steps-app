  - id: endo.L05.037
    kind: card
    topic: diabetes-mellitus-therapy
    front: What is the mechanism of α-glucosidase inhibitors (acarbose, miglitol)?
    back: They block the α-glucosidases on the gut brush border, so carbohydrates are broken down and absorbed more slowly and glucose rises less after meals.
    src: { page: 359, quote: "Inhibit intestinal brush-border α-glucosidases → delayed carbohydrate hydrolysis and glucose absorption → ↓ postprandial hyperglycemia." }
    status: unverified
    tags: [high-yield]
