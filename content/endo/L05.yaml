    topic: diabetes-mellitus-therapy
    front: What is the mechanism of GLP-1 receptor analogs (exenatide, liraglutide, semaglutide)?
    back: Bind GLP-1 receptors on β cells (Gs-coupled → ↑ cAMP) → ↑ insulin secretion, ↓ glucagon secretion; slow gastric emptying and absorption; ↑ satiety, weight loss.
