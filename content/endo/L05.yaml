      - "Gs-coupled GLP-1 receptor activation is how exenatide and liraglutide work; glyburide is a sulfonylurea."
      - "DPP-4 inhibitors protect GLP-1 and are glucose dependent."
      - "PPAR-γ activation is pioglitazone."
    src: { page: 359, quote: "Hypoglycemia (↑ risk in renal insufficiency), weight gain." }
    status: unverified
    tags: [high-yield]
