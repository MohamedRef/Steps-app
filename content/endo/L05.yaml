    status: unverified
  # ---------- p359: insulin sensitizers ----------
  - id: endo.L05.013
    kind: card
    topic: diabetes-mellitus-therapy
    front: What is the mechanism of metformin?
    back: It blocks mitochondrial glycerol-3-phosphate dehydrogenase (mGPD) and switches on AMP-activated protein kinase (AMPK). The liver then makes less glucose and glucagon works less, while glycolysis and peripheral glucose uptake rise (better insulin sensitivity) and weight falls.
    src: { page: 359, quote: "Metformin Inhibits mitochondrial glycerol-3-phosphate dehydrogenase (mGPD) and activates AMP- activated protein kinase (AMPK)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.014
    kind: enumerate
    topic: diabetes-mellitus-therapy
    prompt: Enumerate the adverse effects of metformin (3).
    points:
      - GI upset
      - Lactic acidosis (in renal insufficiency, cirrhosis, sepsis, or hypoperfusion)
      - Vitamin B12 deficiency
    pass: 3
    src: { page: 359, quote: "GI upset, lactic acidosis (in patients with renal insufficiency, cirrhosis, sepsis, or hypoperfusion), vitamin B12 deficiency." }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.015
    kind: cloze
    topic: diabetes-mellitus-therapy
    text: Metformin causes lactic acidosis in patients with {{c1::renal insufficiency}}, cirrhosis, sepsis, or hypoperfusion.
    src: { page: 359, quote: "lactic acidosis (in patients with renal insufficiency, cirrhosis, sepsis, or hypoperfusion)" }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.016
    kind: card
    topic: diabetes-mellitus-therapy
    front: What is the mechanism of pioglitazone?
    back: It switches on the nuclear receptor PPAR-γ, which raises insulin sensitivity and adiponectin and so adjusts how glucose is used and fat is stored.
    src: { page: 359, quote: "Pioglitazone Activates PPAR-γ (a nuclear receptor) → ↑ insulin sensitivity and levels of adiponectin" }
    status: unverified
    tags: [high-yield]
