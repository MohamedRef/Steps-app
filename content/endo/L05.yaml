      - Glucose itself drives K+ out of the body in urine
      - Glucose stabilizes the cardiac membrane
      - Glucose blocks insulin binding to its receptor
      - Glucose raises aldosterone to excrete K+
    answer: 0
    why:
      - "Right. Insulin ↑ K+ uptake into cells; glucose is given with it to prevent concomitant hypoglycemia."
      - "Glucose is not a kaliuretic; insulin does the shifting."
      - "Calcium stabilizes the membrane, not glucose."
      - "Glucose doesn't block the insulin receptor."
      - "Insulin with glucose works by shifting K+, not through aldosterone."
