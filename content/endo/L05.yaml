  # ---------- p359: glucose absorption ----------
  - id: endo.L05.034
    kind: card
    topic: diabetes-mellitus-therapy
    front: What is the mechanism of SGLT2 inhibitors (canagliflozin, dapagliflozin, empagliflozin)?
    back: They stop the proximal convoluted tubule from taking glucose back, so it spills into the urine; sodium and water follow (natriuresis, osmotic diuresis), lowering blood glucose, serum Na+, ECF volume and blood pressure.
    src: { page: 359, quote: "Block reabsorption of glucose in proximal convoluted tubule (glucosuria). Also cause natriuresis, osmotic diuresis" }
    status: unverified
    tags: [high-yield]
  - id: endo.L05.035
    kind: enumerate
    topic: diabetes-mellitus-therapy
    prompt: Enumerate the adverse effects of SGLT2 inhibitors (3).
    points:
      - Glucosuria (UTIs, vulvovaginal candidiasis)
      - Dehydration (orthostatic hypotension)
      - Weight loss
    pass: 3
    hook: "Glucose flows in urine ← UTI و candidiasis، وجفاف، ووزن بينزل"
    src: { page: 359, quote: "Glucosuria (UTIs, vulvovaginal candidiasis), dehydration (orthostatic hypotension), weight loss. Glucose flows in urine." }
    status: unverified
    tags: [high-yield]
