    front: Which hormones does the posterior pituitary store and release, where are they made, and how do they reach it?
    back: Vasopressin (ADH) and oxytocin. They are made in the supraoptic and paraventricular nuclei of the hypothalamus and carried to the posterior pituitary by neurophysins (carrier proteins).
    src: { page: 331, quote: "Stores and releases vasopressin (antidiuretic hormone, or ADH) and oxytocin, both made in the hypothalamus (supraoptic and paraventricular nuclei) and transported to posterior pituitary via neurophysins (carrier proteins)." }
    status: unverified
    tags: [high-yield]
  - id: endo.L02.008
    kind: mcq
    topic: pituitary-gland
    stem: >-
      A 27-year-old woman comes to the physician because she has not menstruated for 7 weeks. She
      has nausea in the mornings and breast tenderness. A serum test for pregnancy is ordered. The
      laboratory uses an antibody against the β subunit of human chorionic gonadotropin (hCG)
      rather than the α subunit. Which of the following best explains this choice?
    options:
      - The α subunit is shared with TSH, LH and FSH
      - The α subunit is cleaved off before hCG is secreted
      - The α subunit is derived from POMC
      - The α subunit is released by the posterior pituitary
      - The α subunit is bound by neurophysins in plasma
    answer: 0
    why:
      - "Right. TSH, LH, FSH and hCG share a common α subunit; only the β subunit determines hormone specificity, so it is the one an assay must detect."
      - "hCG is secreted as an intact α + β dimer, so the α subunit is present; it just cannot tell hCG from TSH, LH and FSH."
      - "POMC gives β-endorphin, ACTH and MSH, not the glycoprotein hormones."
      - "The posterior pituitary releases ADH and oxytocin only."
      - "Neurophysins carry ADH and oxytocin down the axons to the posterior pituitary; they don't bind hCG."
    src: { page: 331, quote: "α subunit—hormone subunit common to TSH, LH, FSH, and hCG. β subunit—determines hormone specificity." }
    status: unverified
