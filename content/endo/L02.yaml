  - id: endo.L02.016
    kind: mcq
    topic: endocrine-pancreas-cell-types
    stem: >-
      A 55-year-old woman has a new, itchy, blistering rash that spreads across her groin and buttocks,
      weight loss and mild diabetes. A CT scan shows a pancreatic mass. Biopsy shows a tumor of the islet
      cell type that normally sits at the periphery of the islet. The hormone this tumor overproduces
      does which of the following?
    options:
      - Raise blood glucose
      - Lower blood glucose by inserting GLUT4
      - Inhibit GH and TSH release
      - Stimulate pancreatic enzyme secretion
      - Stimulate gastric acid secretion
    answer: 0
    why:
      - "Right. This is a glucagonoma: α cells sit at the periphery of the islet and make glucagon, which raises blood glucose."
      - "Insulin lowers glucose, but β cells are central in the islet."
      - "That is somatostatin's action, and it comes from δ cells, which are interspersed, not at the rim."
      - "Enzymes come from exocrine acinar cells, not islet cells."
      - "Gastric acid secretion is not an action of the islet rim hormone, glucagon."
    src: { page: 331, quote: "α = glucαgon (peripheral) β = insulin (central) δ = somatostatin (interspersed)" }
    status: unverified
