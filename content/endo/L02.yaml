  - id: endo.L02.013
    kind: mcq
    topic: adrenal-cortex-and-medulla
    stem: >-
      A 58-year-old man with hypertension and type 2 diabetes is started on losartan. At follow-up 6
      weeks later his blood pressure is 128/78 mm Hg. Serum potassium has risen from 4.3 to 5.2 mEq/L,
      and plasma renin activity is high. Secretion of which hormone, from which adrenal layer, is most
      likely reduced, explaining the rise in potassium?
    options:
      - Aldosterone, from the zona glomerulosa
      - Cortisol, from the zona fasciculata
      - DHEA, from the zona reticularis
      - Epinephrine, from the medulla
      - Norepinephrine, from the medulla
    answer: 0
    why:
      - "Right. The zona glomerulosa (outer layer, salt) is regulated mainly by angiotensin II and makes aldosterone; blocking the AT1 receptor lowers aldosterone, so less K+ is excreted. Renin rises because the feedback is lost."
      - "The zona fasciculata is driven by ACTH and CRH, not angiotensin II."
      - "The zona reticularis is also driven by ACTH and CRH and makes androgens such as DHEA."
      - "The medulla's chromaffin cells respond to preganglionic sympathetic fibers."
      - "Medullary norepinephrine is under preganglionic sympathetic control, not angiotensin II, and does not set serum K+."
    src: { page: 331, quote: "Angiotensin II Mineralocorticoids Aldosterone Zona Fasciculata ACTH, CRH Glucocorticoids Cortisol" }
    status: unverified
