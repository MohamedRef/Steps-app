items:
  # ---------- p599: course of ureters ----------
  - id: renal.L03.001
    kind: card
    topic: course-of-ureters
    front: Describe the course of the ureter from the renal pelvis to the bladder.
    back: It arises from the renal pelvis, travels under the gonadal arteries → over the common iliac artery → under the uterine artery or vas deferens (retroperitoneal).
    src: { page: 599, quote: "arises from renal pelvis, travels under gonadal arteries → over common iliac artery → under uterine artery/vas deferens (retroperitoneal)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.002
    kind: cloze
    topic: course-of-ureters
    text: "First Aid's mnemonic for the ureter: water (ureters) flows {{c1::over the iliacs}} and {{c2::under the bridge}} (uterine artery or vas deferens)."
    src: { page: 599, quote: "Water (ureters) flows over the iliacs and under the bridge (uterine artery or vas deferens)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.003
    kind: enumerate
    topic: course-of-ureters
    prompt: Enumerate the 3 common points of ureteral obstruction.
    points:
      - Ureteropelvic junction
      - Pelvic inlet
      - Ureterovesical junction
    pass: 3
    hook: "الحصوة بتقف في 3 أماكن ضيقة: أول السكة (UPJ)، ونص السكة وهي بتعدّي فوق الـ iliac (pelvic inlet)، وآخر السكة (UVJ)."
    src: { page: 599, quote: "3 common points of ureteral obstruction: ureteropelvic junction, pelvic inlet, ureterovesical junction." }
    status: unverified
  - id: renal.L03.004
    kind: card
    topic: course-of-ureters
    front: What prevents urine reflux into the ureter during bladder contraction?
    back: Bladder contraction compresses the intramural ureter.
    src: { page: 599, quote: "Bladder contraction compresses the intramural ureter, preventing urine reflux." }
    status: unverified
  - id: renal.L03.005
    kind: mcq
    topic: course-of-ureters
    stem: >-
      A 46-year-old woman has an abdominal hysterectomy for symptomatic fibroids. On postoperative day 2
      she has left flank pain and fever, and her serum creatinine has risen. CT urography shows a dilated
      left ureter and pelvis down to the level of the cervix. Which step of the operation most likely
      caused this?
    options:
      - Ligation of the uterine artery
      - Division of the round ligament
      - Ligation of the ovarian ligament
      - Incision of the anterior rectus sheath
      - Closure of the vaginal cuff over the median umbilical ligament
    answer: 0
    why:
      - "Right. The ureter passes under the uterine artery (water under the bridge), so it can be caught when the uterine vessels are ligated, giving obstruction or a leak."
      - "The round ligament runs to the inguinal canal, away from the ureter."
      - "The ovarian ligament joins the ovary to the uterus; it does not cross the ureter near the cervix."
      - "The rectus sheath is in the abdominal wall, far from the ureter."
      - "The median umbilical ligament is the urachal remnant in the anterior wall; the ureter is retroperitoneal."
    src: { page: 599, quote: "Gynecologic procedures (eg, ligation of uterine or ovarian vessels) may damage ureter → ureteral obstruction or leak." }
    status: unverified
  # ---------- p599: fluid compartments ----------
  - id: renal.L03.006
    kind: cloze
    topic: fluid-compartments
    text: "60–40–20 rule (% of body weight): {{c1::60}}% total body water, {{c2::40}}% ICF, {{c3::20}}% ECF."
    src: { page: 599, quote: "60–40–20 rule (% of body weight for average person): ▘ 60% total body water ▘ 40% ICF" }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.007
    kind: table
    topic: fluid-compartments
    title: What the ICF and ECF are mainly made of
    columns: [Compartment, Main contents]
    rows:
      - [ICF, "K+, Mg2+, organic phosphates (eg, ATP)"]
      - [ECF, "Na+, Cl–, HCO3–, albumin"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 599, quote: "40% ICF, mainly composed of K+ , Mg2+ , organic phosphates (eg, ATP) ▘ 20% ECF, mainly composed of Na+ , Cl– ," }
    status: unverified
  - id: renal.L03.008
    kind: card
    topic: fluid-compartments
    front: "What is First Aid's mnemonic for the main intracellular cation?"
    back: "HIKIN': HI K+ INtracellularly."
    src: { page: 599, quote: "HIKIN’: HI K+ INtracellularly." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.009
    kind: cloze
    topic: fluid-compartments
    text: "Of total body water, {{c1::2/3}} is intracellular and {{c2::1/3}} extracellular; of the ECF, {{c3::75%}} is interstitial fluid and 25% plasma."
    src: { page: 599, quote: "1/3 extracellular ﬂuid 2/3 intracellular ﬂuid 75% interstitial ﬂuid" }
    status: unverified
  - id: renal.L03.010
    kind: table
    topic: fluid-compartments
    title: Measuring fluid compartments
    columns: [Compartment, Measured with]
    rows:
      - [Plasma volume, Radiolabeled albumin]
      - [Extracellular volume, Inulin or mannitol]
    blanks: [[0, 1], [1, 1]]
    src: { page: 599, quote: "Plasma volume can be measured by radiolabeling albumin." }
    status: unverified
  - id: renal.L03.011
    kind: cloze
    topic: fluid-compartments
    text: Normal serum osmolality is {{c1::275-295}} mOsm/kg H2O, and plasma volume = TBV × {{c2::(1 – Hct)}}.
    src: { page: 599, quote: "Serum osmolality = 275-295 mOsm/kg H2 O. Plasma volume = TBV × (1 – Hct)." }
    status: unverified
  - id: renal.L03.012
    kind: card
    topic: fluid-compartments
    front: A patient's total blood volume is 5 L and the hematocrit is 40%. What is the plasma volume, in liters?
    back: "Plasma volume = TBV × (1 – Hct) = 5 × (1 – 0.40) = 3 L."
    src: { page: 599, quote: "Plasma volume = TBV × (1 – Hct)." }
    status: unverified
  - id: renal.L03.151
    kind: cloze
    topic: fluid-compartments
    text: "Normal hematocrit is about {{c1::37%–50%}}."
    src: { page: 599, quote: "Normal Hct ≈ 37%–50%" }
    status: unverified
  - id: renal.L03.152
    kind: card
    topic: fluid-compartments
    front: "What two volumes make up the blood volume?"
    back: "Plasma volume plus RBC volume (about 6 L in First Aid's figure)."
    src: { page: 599, quote: "Blood volume = plasma + RBC volume (6 L)" }
    status: unverified
  - id: renal.L03.013
    kind: mcq
    topic: fluid-compartments
    stem: >-
      A 45-year-old woman is evaluated as a living kidney donor for her sister. She is healthy, with a
      blood pressure of 118/76 mm Hg and normal laboratory studies. As part of her workup, her
      extracellular fluid volume is measured: a substance is injected that distributes through the plasma
      and interstitial fluid but does not enter cells, and its dilution is measured once it has
      equilibrated. Which substance was most likely injected?
    options:
      - Radiolabeled albumin
      - Inulin
      - Heavy water (deuterium oxide)
      - Para-aminohippuric acid
      - Glucose
    answer: 1
    why:
      - "Radiolabeled albumin stays in the vessels; it measures plasma volume."
      - "Right. Inulin (or mannitol) stays outside cells and crosses capillaries, so it measures extracellular volume."
      - "Heavy water enters all compartments, cells included, so it measures total body water, not ECF only (not in First Aid's list)."
      - "PAH is cleared almost completely in one pass; it estimates effective renal plasma flow."
      - "Glucose enters cells and is metabolized."
    src: { page: 599, quote: "Extracellular volume can be measured by inulin or mannitol." }
    status: unverified
  # ---------- p599: glomerular filtration barrier ----------
  - id: renal.L03.014
    kind: enumerate
    topic: glomerular-filtration-barrier
    prompt: Enumerate the 3 components of the glomerular filtration barrier.
    points:
      - Fenestrated capillary endothelium
      - Glomerular basement membrane (GBM) with type IV collagen chains and heparan sulfate
      - Visceral epithelial layer of podocyte foot processes and the slit diaphragms between them
    pass: 3
    src: { page: 599, quote: "Composed of ▘ Fenestrated capillary endothelium ▘ Glomerular basement membrane (GBM) with type IV collagen chains and heparan sulfate" }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.015
    kind: card
    topic: glomerular-filtration-barrier
    front: How does the charge barrier of the glomerulus keep albumin out of the filtrate?
    back: The barrier contains ⊝ charged glycoproteins that prevent entry of ⊝ charged molecules such as albumin.
    src: { page: 599, quote: "Charge barrier—glomerular filtration barrier contains ⊝ charged glycoproteins that prevent entry of ⊝ charged molecules (eg, albumin)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.016
    kind: table
    topic: glomerular-filtration-barrier
    title: Size barrier of the glomerulus
    columns: [Structure, Keeps out]
    rows:
      - [Fenestrated capillary endothelium, Blood cells]
      - [Slit diaphragm, "Smaller molecules (eg, proteins)"]
      - [Podocyte foot processes with GBM, Both a charge and a size barrier]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 599, quote: "Size barrier—fenestrated capillary endothelium (prevents entry of blood cells); SD (prevents entry of smaller molecules, eg, proteins). Podocyte FPs interpose with GBM—both charge and size barrier." }
    status: unverified
  - id: renal.L03.017
    kind: mcq
    topic: glomerular-filtration-barrier
    stem: >-
      A 6-year-old boy has periorbital and leg edema 2 weeks after an upper respiratory infection. Urine
      shows 4+ protein, mostly albumin, with no red cells. Light microscopy of a biopsy is normal. Loss of
      which property of the glomerular filtration barrier best explains why albumin now crosses it?
    options:
      - Its negatively charged glycoproteins
      - The fenestrations of the capillary endothelium
      - The type IV collagen of the GBM tearing
      - The parietal layer of Bowman capsule
      - The mesangial matrix
    answer: 0
    why:
      - "Right. Albumin is negatively charged; the barrier's ⊝ charged glycoproteins normally repel it. Losing this charge barrier lets albumin leak (selective albuminuria)."
      - "The fenestrations keep out blood cells; there is no hematuria here."
      - "A torn GBM gives hematuria and a nephritic picture, not pure albuminuria with normal light microscopy."
      - "The parietal layer is not part of the filtration barrier."
      - "The mesangium supports the capillaries; it is not the barrier that repels albumin."
    src: { page: 599, quote: "Charge barrier—glomerular filtration barrier contains ⊝ charged glycoproteins that prevent entry of ⊝ charged molecules (eg, albumin)." }
    status: unverified
  # ---------- p600: renal clearance ----------
  - id: renal.L03.018
    kind: card
    topic: renal-clearance
    front: "Define renal clearance (Cx)."
    back: "The volume of plasma per unit time that is completely cleared of the substance into the urine."
    src: { page: 600, quote: "volume of plasma from which the substance is completely cleared in the urine per unit time." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.153
    kind: card
    topic: renal-clearance
    front: "What is the formula for the renal clearance of X (Cx)?"
    back: "Cx = (Ux × V) / Px: urine concentration × urine flow, divided by plasma concentration."
    src: { page: 600, quote: "Renal clearance Cx = (Ux V)/Px = volume of plasma from which the substance is completely cleared in the urine per unit time." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.019
    kind: table
    topic: renal-clearance
    title: Clearance compared with GFR
    columns: [Finding, Meaning]
    rows:
      - [Cx < GFR, Net tubular reabsorption and/or not freely filtered]
      - [Cx > GFR, Net tubular secretion of X]
      - [Cx = GFR, No net secretion or reabsorption]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 600, quote: "< GFR: net tubular reabsorption and/or not freely filtered." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.020
    kind: card
    topic: renal-clearance
    front: "A drug has a urine concentration of 10 mg/mL, a plasma concentration of 0.5 mg/mL, and urine flow is 2 mL/min. What is its clearance, in mL/min?"
    back: "Cx = (Ux × V) / Px = (10 × 2) / 0.5 = 40 mL/min."
    src: { page: 600, quote: "volume of plasma from which the substance is completely cleared in the urine per unit time." }
    status: unverified
  - id: renal.L03.021
    kind: mcq
    topic: renal-clearance
    stem: >-
      A 60-year-old man with gout is enrolled in a trial of a new urate-lowering drug. He has no other
      illnesses, and his GFR measured by inulin clearance is 100 mL/min. The drug is not bound to plasma
      proteins, and after a dose its renal clearance is 250 mL/min. Which of the following best describes
      how his kidneys handle this drug?
    options:
      - It is filtered and undergoes net tubular secretion
      - It is filtered and undergoes net tubular reabsorption
      - It is filtered with no net secretion or reabsorption
      - It is not freely filtered
      - It is metabolized by the proximal tubule
    answer: 0
    why:
      - "Right. When clearance exceeds GFR, more leaves in urine than was filtered, so there must be net tubular secretion."
      - "Net reabsorption makes clearance less than GFR."
      - "No net handling makes clearance equal to GFR, as with inulin."
      - "A substance that isn't freely filtered has clearance below GFR."
      - "Metabolism would lower urinary excretion, not raise clearance above GFR."
    src: { page: 600, quote: "> GFR: net tubular secretion of X." }
    status: unverified
  # ---------- p600: glomerular filtration rate ----------
  - id: renal.L03.022
    kind: card
    topic: glomerular-filtration-rate
    front: Why can inulin clearance be used to calculate GFR?
    back: Inulin is freely filtered and is neither reabsorbed nor secreted.
    src: { page: 600, quote: "Inulin clearance can be used to calculate GFR because it is freely filtered and is neither reabsorbed nor secreted." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.023
    kind: cloze
    topic: glomerular-filtration-rate
    text: "GFR = Kf [(PGC – PBS) – (πGC – πBS)], where πBS (Bowman space oncotic pressure) normally equals {{c1::zero}} and Kf is the {{c2::filtration coefficient}}."
    src: { page: 600, quote: "normally equals zero; Kf = filtration coefficient." }
    status: unverified
  - id: renal.L03.024
    kind: cloze
    topic: glomerular-filtration-rate
    text: Normal GFR is about {{c1::100}} mL/min.
    src: { page: 600, quote: "Normal GFR ≈ 100 mL/min." }
    status: unverified
  - id: renal.L03.025
    kind: card
    topic: glomerular-filtration-rate
    front: Does creatinine clearance overestimate or underestimate GFR, and why?
    back: "Slightly overestimates it: besides being filtered, some creatinine is also secreted by the proximal tubule, so more ends up in the urine than filtration alone puts there."
    src: { page: 600, quote: "Creatinine clearance is an approximate measure of GFR. Slightly overestimates GFR because creatinine is moderately secreted by proximal renal tubules." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.026
    kind: mcq
    topic: glomerular-filtration-rate
    stem: >-
      A 54-year-old man with type 2 diabetes has a 24-hour urine collection to assess kidney function.
      His creatinine clearance is 88 mL/min. On the same day, a research inulin clearance is 80 mL/min.
      Which of the following best explains the difference?
    options:
      - Creatinine is moderately secreted by the proximal tubule
      - Creatinine is partly reabsorbed in the collecting duct
      - Inulin is partly secreted by the proximal tubule
      - Inulin is bound to plasma albumin
      - Creatinine is produced by the kidney itself
    answer: 0
    why:
      - "Right. Creatinine is filtered and also moderately secreted by the proximal tubule, so its clearance slightly overestimates GFR."
      - "Reabsorption would make creatinine clearance lower than GFR, not higher."
      - "Inulin is neither secreted nor reabsorbed; that is why it measures GFR."
      - "Inulin is freely filtered."
      - "Creatinine comes from muscle, and renal production is not why its clearance runs high."
    src: { page: 600, quote: "Slightly overestimates GFR because creatinine is moderately secreted by proximal renal tubules." }
    status: unverified
  # ---------- p600: renal blood flow autoregulation ----------
  - id: renal.L03.027
    kind: card
    topic: renal-blood-flow-autoregulation
    front: What is the purpose of renal blood flow autoregulation?
    back: To keep RBF and GFR constant, protecting the kidney from rapid swings in renal perfusion pressure that could injure it and reduce glomerular filtration.
    src: { page: 600, quote: "Autoregulatory mechanisms help maintain a constant RBF and GFR to protect the kidney from rapid fluctuations in renal perfusion pressure" }
    status: unverified
  - id: renal.L03.028
    kind: table
    topic: renal-blood-flow-autoregulation
    title: The two mechanisms of renal autoregulation
    columns: [Mechanism, Trigger, Response]
    rows:
      - [Myogenic, ↑ arterial pressure stretches the afferent arteriole, "Mechanical activation of vascular smooth muscle → afferent arteriole vasoconstriction → ↓ RBF"]
      - [Tubuloglomerular, ↑ NaCl of the filtrate sensed by macula densa cells, "Paracrine-driven afferent arteriole vasoconstriction → ↓ RBF (opposite if ↓ NaCl)"]
    blanks: [[0, 1], [1, 1], [0, 2], [1, 2]]
    src: { page: 600, quote: "Tubuloglomerular: ↑ NaCl of the filtrate sensed by macula densa cells → paracrine-driven vasoconstriction of afferent arteriole → ↓ RBF." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.029
    kind: mcq
    topic: renal-blood-flow-autoregulation
    stem: >-
      A 22-year-old man with Fanconi syndrome has a generalized reabsorption defect in the proximal
      convoluted tubule, so more NaCl than normal reaches his macula densa. His blood pressure is 118/74
      mm Hg. Which change in his kidney follows the increased NaCl delivery within seconds?
    options:
      - Afferent arteriole constriction and ↓ renal blood flow
      - Afferent arteriole dilation and ↑ renal blood flow
      - Efferent arteriole constriction and ↑ GFR
      - Release of ADH from the posterior pituitary
      - Release of erythropoietin by peritubular interstitial cells
    answer: 0
    why:
      - "Right. Tubuloglomerular feedback: ↑ NaCl sensed by macula densa → paracrine afferent vasoconstriction → ↓ RBF (and GFR back down)."
      - "That is the opposite response, seen when NaCl delivery falls."
      - "Efferent constriction is the effect of angiotensin II after renin release, which ↓ NaCl delivery stimulates."
      - "ADH responds to osmolality and blood volume, not to NaCl at the macula densa."
      - "EPO responds to hypoxia."
    src: { page: 600, quote: "Tubuloglomerular: ↑ NaCl of the filtrate sensed by macula densa cells → paracrine-driven vasoconstriction of afferent arteriole → ↓ RBF." }
    status: unverified
  # ---------- p600: effective renal plasma flow ----------
  - id: renal.L03.030
    kind: card
    topic: effective-renal-plasma-flow
    front: Which substance's clearance estimates effective renal plasma flow (eRPF), and why does it work?
    back: Para-aminohippuric acid (PAH). Between filtration and secretion, nearly all PAH that enters the kidney is excreted (about 20% filtered, 80% secreted, 100% excreted).
    src: { page: 600, quote: "Effective renal plasma flow (eRPF) can be estimated using para-aminohippuric acid (PAH) clearance. Between filtration and secretion, there is nearly complete excretion of all PAH that enters the kidney." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.031
    kind: cloze
    topic: effective-renal-plasma-flow
    text: "Renal blood flow (RBF) = RPF / {{c1::(1 − Hct)}}; it is usually {{c2::20%-25%}} of cardiac output."
    src: { page: 600, quote: "Renal blood flow (RBF) = RPF/(1 − Hct). Usually 20%-25% of cardiac output." }
    status: unverified
  - id: renal.L03.032
    kind: card
    topic: effective-renal-plasma-flow
    front: Does eRPF (PAH clearance) overestimate or underestimate true renal plasma flow?
    back: It slightly underestimates true RPF.
    src: { page: 600, quote: "eRPF underestimates true renal plasma flow (RPF) slightly." }
    status: unverified
  - id: renal.L03.033
    kind: card
    topic: effective-renal-plasma-flow
    front: "PAH clearance is 600 mL/min and hematocrit is 40%. What is the renal blood flow, in mL/min?"
    back: "RBF = RPF / (1 − Hct) = 600 / 0.6 = 1000 mL/min."
    src: { page: 600, quote: "Renal blood flow (RBF) = RPF/(1 − Hct)." }
    status: unverified
  - id: renal.L03.034
    kind: mcq
    topic: effective-renal-plasma-flow
    stem: >-
      A 40-year-old man who lives at high altitude is evaluated as a living kidney donor for his brother.
      He is healthy. During renal function testing para-aminohippuric acid is infused: urine PAH is 30
      mg/mL, urine flow 1 mL/min, and plasma PAH 0.05 mg/mL. His hematocrit is 50%. Which value is closest
      to his renal blood flow?
    options:
      - 300 mL/min
      - 600 mL/min
      - 900 mL/min
      - 1200 mL/min
      - 1500 mL/min
    answer: 3
    why:
      - "300 comes from multiplying the eRPF by (1 − Hct) (600 × 0.5) instead of dividing by it; blood flow must be larger than plasma flow."
      - "600 mL/min is the eRPF (30 × 1 / 0.05), not the blood flow."
      - "900 would assume a hematocrit of about 33%."
      - "Right. eRPF = 30 × 1 / 0.05 = 600 mL/min; RBF = 600 / (1 − 0.5) = 1200 mL/min."
      - "1500 would assume a hematocrit of 60%."
    src: { page: 600, quote: "Renal blood flow (RBF) = RPF/(1 − Hct)." }
    status: unverified
  # ---------- p601: filtration ----------
  - id: renal.L03.035
    kind: cloze
    topic: filtration
    text: "Filtration fraction (FF) = {{c1::GFR / RPF}}; normal FF = {{c2::20%}}."
    src: { page: 601, quote: "Filtration fraction (FF) = GFR/RPF. Normal FF = 20%." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.036
    kind: cloze
    topic: filtration
    text: "Filtered load (mg/min) = {{c1::GFR (mL/min)}} × {{c2::plasma concentration (mg/mL)}}."
    src: { page: 601, quote: "Filtered load (mg/min) = GFR (mL/min) × plasma concentration (mg/mL)." }
    status: unverified
  - id: renal.L03.037
    kind: card
    topic: filtration
    front: "What do First Aid's mnemonics PDA and ACE say about the glomerular arterioles?"
    back: "Prostaglandins Dilate the Afferent arteriole (PDA): ↑ RPF and GFR, no change in FF. Angiotensin II Constricts the Efferent arteriole (ACE): ↓ RPF, ↑ GFR, ↑ FF."
    src: { page: 601, quote: "Prostaglandins Dilate Afferent arteriole (PDA). Angiotensin II Constricts Efferent arteriole (ACE)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.038
    kind: card
    topic: filtration
    front: Why should NSAIDs and ACE inhibitors not be given together?
    back: The combination constricts the afferent arteriole (NSAIDs block prostaglandins) and dilates the efferent arteriole (ACE inhibitors block angiotensin II), dropping GFR.
    src: { page: 601, quote: "NSAIDs and ACE inhibitors should not be given together → constriction of afferent and dilation of efferent arterioles." }
    status: unverified
    tags: [high-yield]
  - id: renal.L03.039
    kind: cloze
    topic: filtration
    text: "Net filtration pressure = ({{c1::PGC}} + πBS) – (PBS + {{c2::πGC}})."
    src: { page: 601, quote: "Net filtration pressure = (PGC + πBS ) – (PBS + πGC )" }
    status: unverified
  - id: renal.L03.040
    kind: table
    topic: filtration
    title: Changes in glomerular dynamics
    columns: [Change, GFR, RPF, "FF (GFR/RPF)"]
