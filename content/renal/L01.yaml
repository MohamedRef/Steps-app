items:
  # ---------- p596: kidney embryology ----------
  - id: renal.L01.001
    kind: table
    topic: kidney-embryology
    title: The three embryonic kidneys
    columns: [Stage, Appears, Fate]
    rows:
      - [Pronephros, Week 4, Then degenerates]
      - [Mesonephros, Week 4, "Interim kidney for the 1st trimester (both sexes); its duct persists in males as the Wolffian duct"]
      - [Metanephros, Week 5, "Permanent kidney; nephrogenesis normally completed by week 36"]
    blanks: [[0, 2], [1, 2], [2, 1], [2, 2]]
    src: { page: 596, quote: "Pronephros—week 4 of development; then degenerates. Mesonephros—week 4 of development; functions as interim kidney for 1st trimester in both sexes." }
    status: unverified
  - id: renal.L01.002
    kind: card
    topic: kidney-embryology
    front: What do the mesonephric ducts become in males, and what happens to them in females?
    back: "Males: they persist as the Wolffian duct, forming the ductus deferens and epididymis. Females: they degenerate."
    src: { page: 596, quote: "Mesonephric ducts persist in the male genital system as Wolffian duct, forming ductus deferens and epididymis. Mesonephric ducts degenerate in females." }
    status: unverified
  - id: renal.L01.003
    kind: cloze
    topic: kidney-embryology
    text: The metanephros (permanent kidney) first appears in week {{c1::5}} of development, and nephrogenesis is normally completed by week {{c2::36}} of gestation.
    src: { page: 596, quote: "Metanephros—permanent; first appears in week 5 of development; nephrogenesis is normally completed by week 36 of gestation." }
    status: unverified
  - id: renal.L01.004
    kind: table
    topic: kidney-embryology
    title: What the two metanephric tissues build
    columns: [Tissue, Origin, Forms]
    rows:
      - [Ureteric bud (metanephric diverticulum), Mesonephric duct, "Ureters, pelvises, calyces, and collecting ducts"]
      - [Metanephric mesenchyme (metanephric blastema), "Induced by the ureteric bud", Glomerulus through distal convoluted tubule (DCT)]
    blanks: [[0, 1], [0, 2], [1, 2]]
    src: { page: 596, quote: "derived from mesonephric duct to form ureters, pelvises, calyces, and collecting ducts" }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.005
    kind: cloze
    topic: kidney-embryology
    text: The ureteric bud is fully canalized by week {{c1::10}} of development.
    src: { page: 596, quote: "Ureteric bud (metanephric diverticulum) fully canalized by week 10 of development" }
    status: unverified
  - id: renal.L01.006
    kind: card
    topic: kidney-embryology
    front: Aberrant interaction between the ureteric bud and metanephric mesenchyme can cause which congenital kidney malformations (book examples)?
    back: Renal agenesis and multicystic dysplastic kidney.
    src: { page: 596, quote: "Aberrant interaction between these 2 tissues may result in several congenital malformations of the kidney (eg, renal agenesis, multicystic dysplastic kidney)" }
    status: unverified
  - id: renal.L01.007
    kind: card
    topic: kidney-embryology
    front: Which part of the ureter is the last to canalize, and what happens if it does not fully canalize?
    back: The ureteropelvic junction. Incomplete canalization → congenital obstruction (unilateral or bilateral).
    src: { page: 596, quote: "Ureteropelvic junction → last part of ureter to canalize; if doesn’t fully canalize → congenital obstruction. Can be unilateral or bilateral." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.008
    kind: card
    topic: kidney-embryology
    front: What is the most common pathologic cause of prenatal hydronephrosis, and how is it detected?
    back: Ureteropelvic junction obstruction (incomplete canalization), detected by prenatal ultrasound.
    src: { page: 596, quote: "Most common pathologic cause of prenatal hydronephrosis. Detected by prenatal ultrasound." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.009
    kind: mcq
    topic: kidney-embryology
    stem: >-
      A 32-year-old woman has a routine ultrasound at 22 weeks' gestation. The fetus has a dilated left
      renal pelvis and calyces, a normal-caliber left ureter, a normal right kidney, a normal bladder
      and a normal amount of amniotic fluid. Which of the following is the most likely cause of the
      fetal finding?
    options:
      - Incomplete canalization of the ureteropelvic junction
      - Persistent membrane in the posterior urethra
      - Failure of the ureteric bud to induce the metanephric mesenchyme
      - Bifurcation of the ureteric bud before it reaches the metanephric blastema
      - Fusion of the inferior poles of both kidneys
    answer: 0
    why:
      - "Right. The ureteropelvic junction is the last part of the ureter to canalize; if it doesn't fully canalize the pelvis dilates above it with a normal ureter below. It is the most common pathologic cause of prenatal hydronephrosis."
      - "Posterior urethral valves obstruct below the bladder: bilateral hydronephrosis with a dilated or thick-walled bladder, and oligohydramnios when severe."
      - "No induction gives a multicystic dysplastic kidney: cysts and connective tissue, not a dilated collecting system."
      - "A bifid ureter (duplex system) is linked to reflux and obstruction, but the ureter here is single and normal."
      - "Fused inferior poles is a horseshoe kidney, which sits low in the midline; the right kidney is normal here."
    src: { page: 596, quote: "Ureteropelvic junction → last part of ureter to canalize; if doesn’t fully canalize → congenital obstruction." }
    status: unverified
  # ---------- p596: Potter sequence ----------
  - id: renal.L01.010
    kind: order
    topic: potter-sequence
    prompt: Put the chain of the Potter sequence in order.
    steps:
      - Reduced fetal urine output (or chronic placental insufficiency)
      - Oligohydramnios
      - Compression of the developing fetus and of the chest, with no amniotic fluid aspirated into the lungs
      - Pulmonary hypoplasia (the cause of death)
    src: { page: 596, quote: "Oligohydramnios → compression of developing fetus → limb deformities (eg, club feet), facial anomalies (eg, low-set ears and retrognathia, flattened nose), compression of chest and lack of amniotic fluid aspiration into fetal lungs → pulmonary hypoplasia (cause of death)." }
    status: unverified
  - id: renal.L01.011
    kind: card
    topic: potter-sequence
    front: What is the cause of death in Potter sequence?
    back: Pulmonary hypoplasia (from compression of the chest and lack of amniotic fluid aspiration into the fetal lungs).
    src: { page: 596, quote: "compression of chest and lack of amniotic fluid aspiration into fetal lungs → pulmonary hypoplasia (cause of death)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.012
    kind: cloze
    topic: potter-sequence
    text: "In Potter sequence, fetal compression gives limb deformities (eg, {{c1::club feet}}) and facial anomalies (eg, {{c2::low-set ears}} and retrognathia, flattened nose)."
    src: { page: 596, quote: "limb deformities (eg, club feet), facial anomalies (eg, low-set ears and retrognathia, flattened nose)" }
    status: unverified
  - id: renal.L01.013
    kind: enumerate
    topic: potter-sequence
    prompt: Enumerate the causes of Potter sequence given by First Aid (6).
    points:
      - Chronic placental insufficiency
      - ARPKD
      - Obstructive uropathy (eg, posterior urethral valves)
      - Bilateral renal agenesis
      - Preterm premature rupture of membranes
      - Maternal ACE inhibitor use
    pass: 5
    hook: "الطفل اللي مش بيعرف «يعمل Pee» جوه الرحم: يا الكلية مش موجودة (agenesis) أو بايظة (ARPKD)، يا السكة مسدودة (valves)، يا الأم واخدة ACE inhibitor، يا المية نازلة (PPROM)، يا الـ placenta تعبانة. 6."
    src: { page: 596, quote: "Caused by chronic placental insufficiency or reduced fetal urine output, including ARPKD, obstructive uropathy (eg, posterior urethral valves), bilateral renal agenesis, preterm premature rupture of membranes, maternal ACE inhibitor use." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.014
    kind: enumerate
    topic: potter-sequence
    prompt: Enumerate the POTTER mnemonic of First Aid (6).
    points:
      - Pulmonary hypoplasia
      - Oligohydramnios (trigger)
      - Twisted face
      - Twisted skin
      - Extremity defects
      - Renal failure (in utero)
    pass: 6
    src: { page: 596, quote: "POTTER sequence associated with: Pulmonary hypoplasia Oligohydramnios (trigger) Twisted face Twisted skin Extremity defects Renal failure (in utero)" }
    status: unverified
  - id: renal.L01.015
    kind: mcq
    topic: potter-sequence
    stem: >-
      A 30-year-old woman with chronic hypertension treated with lisinopril throughout her pregnancy
      delivers a boy at 35 weeks. Prenatal ultrasound had shown severe oligohydramnios. The newborn has
      low-set ears, a flattened nose, retrognathia and bilateral club feet, and he develops severe
      respiratory distress within minutes of birth. Which of the following is the most likely cause of
      his respiratory failure?
    options:
      - Surfactant deficiency from prematurity
      - Pulmonary hypoplasia
      - Meconium aspiration
      - Congenital diaphragmatic hernia
      - Persistent fetal circulation from ductus arteriosus patency
    answer: 1
    why:
      - "At 35 weeks surfactant deficiency is possible, but it doesn't explain the facial and limb deformities of oligohydramnios."
      - "Right. Maternal ACE inhibitor use → reduced fetal urine output → oligohydramnios → chest compression and no fluid aspirated into the lungs → pulmonary hypoplasia, the cause of death in Potter sequence."
      - "Meconium aspiration needs amniotic fluid to aspirate; here there was almost none."
      - "A diaphragmatic hernia causes lung hypoplasia too, but not the club feet and Potter facies."
      - "A patent ductus is not what links oligohydramnios to respiratory failure."
    src: { page: 596, quote: "compression of chest and lack of amniotic fluid aspiration into fetal lungs → pulmonary hypoplasia (cause of death)." }
    status: unverified
  # ---------- p597: horseshoe kidney ----------
  - id: renal.L01.016
    kind: card
    topic: horseshoe-kidney
    front: In a horseshoe kidney, which poles fuse, and what structure traps the kidney low in the abdomen?
    back: The inferior poles fuse; during ascent from the pelvis the kidney is trapped under the inferior mesenteric artery.
    src: { page: 597, quote: "Inferior poles of both kidneys fuse abnormally A . As they ascend from pelvis during fetal development, horseshoe kidneys get trapped under inferior mesenteric artery and remain low in the abdomen." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.017
    kind: enumerate
    topic: horseshoe-kidney
    prompt: A horseshoe kidney can function normally but is associated with which problems (4)?
    points:
      - Hydronephrosis (eg, ureteropelvic junction obstruction)
      - Renal stones
      - Infection
      - ↑ risk of renal cancer
    pass: 4
    hook: "الحدوة واقعة تحت الـ IMA فالبول بيقف: يقف ← hydronephrosis، يقف ← stones، يقف ← infection، وفوقهم cancer. 4."
    src: { page: 597, quote: "Kidneys can function normally, but associated with hydronephrosis (eg, ureteropelvic junction obstruction), renal stones, infection, ↑ risk of renal cancer." }
    status: unverified
  - id: renal.L01.018
    kind: card
    topic: horseshoe-kidney
    front: Horseshoe kidney has a higher incidence in which chromosomal conditions?
    back: Chromosomal aneuploidy, eg, Turner syndrome and trisomies 13, 18, 21.
    src: { page: 597, quote: "Higher incidence in chromosomal aneuploidy (eg, Turner syndrome, trisomies 13, 18, 21)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.019
    kind: mcq
    topic: horseshoe-kidney
    stem: >-
      A 16-year-old girl with short stature, a webbed neck and primary amenorrhea has a CT scan of the
      abdomen after a minor car accident. It shows a single U-shaped kidney lying in front of the aorta
      and the inferior vena cava at the level of the lower lumbar vertebrae. Which structure prevented
      this kidney from ascending to its normal position?
    options:
      - Superior mesenteric artery
      - Inferior mesenteric artery
      - Celiac trunk
      - Left renal vein
      - Median umbilical ligament
    answer: 1
    why:
      - "The SMA arises higher; it is not what traps a horseshoe kidney. (It is the artery of SMA syndrome and the nutcracker of the left renal vein.)"
      - "Right. The fused inferior poles get caught under the inferior mesenteric artery during ascent, so the horseshoe kidney stays low. Turner syndrome raises the incidence."
      - "The celiac trunk is far higher, at the level of the upper abdomen."
      - "The left renal vein crosses in front of the aorta but does not stop renal ascent."
      - "The median umbilical ligament is the remnant of the urachus in the anterior abdominal wall."
    src: { page: 597, quote: "horseshoe kidneys get trapped under inferior mesenteric artery and remain low in the abdomen." }
    status: unverified
  # ---------- p597: congenital solitary functioning kidney ----------
  - id: renal.L01.020
    kind: card
    topic: congenital-solitary-functioning-kidney
    front: What is a congenital solitary functioning kidney, and how does the other kidney usually respond?
    back: Being born with only one functioning kidney. Most are asymptomatic, with compensatory hypertrophy of the contralateral kidney, but anomalies in the contralateral kidney are common.
    src: { page: 597, quote: "Condition of being born with only one functioning kidney. Majority asymptomatic with compensatory hypertrophy of contralateral kidney, but anomalies in contralateral kidney are common." }
    status: unverified
  - id: renal.L01.021
    kind: card
    topic: congenital-solitary-functioning-kidney
    front: How is a solitary functioning kidney often diagnosed, and what happens if agenesis or dysplasia is bilateral?
    back: Often diagnosed prenatally by ultrasound. Bilateral agenesis or dysplasia leads to Potter sequence.
    src: { page: 597, quote: "Often diagnosed prenatally via ultrasound bilateral agenesis or dysplasia leads to Potter sequence." }
    status: unverified
  - id: renal.L01.022
    kind: mcq
    topic: congenital-solitary-functioning-kidney
    stem: >-
      A 24-year-old man is evaluated as a possible living kidney donor for his brother. He has no
      symptoms, a normal blood pressure and a normal serum creatinine. Ultrasound shows no right kidney
      and an enlarged left kidney with normal echotexture. Which of the following best explains the size
      of his left kidney?
    options:
      - Compensatory hypertrophy of the contralateral kidney
      - Hydronephrosis from ureteropelvic junction obstruction
      - Multicystic dysplasia
      - Fusion with the absent kidney across the midline
      - Early autosomal dominant polycystic kidney disease
    answer: 0
    why:
      - "Right. With only one functioning kidney most people are asymptomatic because the other kidney undergoes compensatory hypertrophy."
      - "Hydronephrosis would show a dilated pelvis and calyces, not normal echotexture."
      - "A multicystic dysplastic kidney is nonfunctional cysts and connective tissue; his creatinine is normal."
      - "Fusion across the midline is a horseshoe kidney, which is low and U-shaped, not single and on one side."
      - "Polycystic disease would show cysts, usually bilateral."
    src: { page: 597, quote: "Majority asymptomatic with compensatory hypertrophy of contralateral kidney" }
    status: unverified
  # ---------- p597: unilateral renal agenesis ----------
  - id: renal.L01.023
    kind: card
    topic: unilateral-renal-agenesis
    front: What is the embryologic defect in unilateral renal agenesis, and what is missing?
    back: The ureteric bud fails to develop and induce differentiation of the metanephric mesenchyme → complete absence of the kidney and ureter.
    src: { page: 597, quote: "Ureteric bud fails to develop and induce differentiation of metanephric mesenchyme → complete absence of kidney and ureter." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.024
    kind: mcq
    topic: unilateral-renal-agenesis
    stem: >-
      A 28-year-old woman has cystoscopy for recurrent hematuria. The left ureteral orifice is normal,
      but no right ureteral orifice or right hemitrigone is seen. CT shows no right kidney and no right
      ureter. Which embryologic failure best explains these findings?
    options:
      - The ureteric bud never developed
      - The ureteric bud developed but did not induce the metanephric mesenchyme
      - The ureteric bud bifurcated before entering the metanephric blastema
      - The ureteropelvic junction failed to canalize
      - The kidney was trapped under the inferior mesenteric artery
    answer: 0
    why:
      - "Right. When the ureteric bud fails to develop, it can't induce the metanephric mesenchyme, so both the kidney and the ureter are absent (unilateral renal agenesis)."
      - "A bud that develops but fails to induce leaves a ureter and a multicystic dysplastic kidney, not nothing."
      - "Early bifurcation gives a Y-shaped bifid ureter (duplex system)."
      - "UPJ obstruction gives a hydronephrotic kidney, not an absent one."
      - "That is a horseshoe kidney, which is present but low."
    src: { page: 597, quote: "Ureteric bud fails to develop and induce differentiation of metanephric mesenchyme → complete absence of kidney and ureter." }
    status: unverified
  # ---------- p597: multicystic dysplastic kidney ----------
  - id: renal.L01.025
    kind: card
    topic: multicystic-dysplastic-kidney
    front: What is the embryologic defect in multicystic dysplastic kidney, and what does the kidney consist of?
    back: The ureteric bud develops but fails to induce differentiation of the metanephric mesenchyme → a nonfunctional kidney of cysts and connective tissue.
    src: { page: 597, quote: "Ureteric bud develops, but fails to induce differentiation of metanephric mesenchyme → nonfunctional kidney consisting of cysts and connective tissue." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.026
    kind: cloze
    topic: multicystic-dysplastic-kidney
    text: Multicystic dysplastic kidney has {{c1::nongenetic}} inheritance, though it tends to run in families, and it is usually {{c2::unilateral}}.
    src: { page: 597, quote: "Nongenetic inheritance, though tends to run in families; usually unilateral." }
    status: unverified
  - id: renal.L01.027
    kind: table
    topic: multicystic-dysplastic-kidney
    title: Unilateral renal agenesis vs multicystic dysplastic kidney
    columns: [Feature, Unilateral renal agenesis, Multicystic dysplastic kidney]
    rows:
      - [Ureteric bud, Fails to develop, Develops]
      - [Induction of metanephric mesenchyme, Fails, Fails]
      - [Result, Complete absence of kidney and ureter, Nonfunctional kidney of cysts and connective tissue]
    blanks: [[0, 1], [0, 2], [2, 1], [2, 2]]
    src: { page: 597, quote: "Ureteric bud develops, but fails to induce differentiation of metanephric mesenchyme → nonfunctional kidney consisting of cysts and connective tissue." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.028
    kind: mcq
    topic: multicystic-dysplastic-kidney
    stem: >-
      A 3-day-old girl has a palpable left flank mass. Ultrasound shows a left kidney replaced by many
      noncommunicating cysts of different sizes with no normal renal parenchyma, and a normal right
      kidney. A radionuclide scan shows no function on the left. Amniotic fluid was normal during the
      pregnancy. Which of the following best describes the cause?
    options:
      - The ureteric bud developed but failed to induce the metanephric mesenchyme
      - An autosomal recessive mutation in fibrocystin
      - The ureteric bud never formed
      - Incomplete canalization of the ureteropelvic junction
      - Obstruction by a membrane in the prostatic urethra
    answer: 0
    why:
      - "Right. A bud that forms but can't induce the blastema leaves a nonfunctional kidney of cysts and connective tissue: multicystic dysplastic kidney, usually unilateral."
      - "ARPKD is bilateral, inherited, and gives oligohydramnios; MCDK is nongenetic and usually one-sided."
      - "No ureteric bud means no kidney at all (agenesis), not a cystic mass."
      - "UPJ obstruction gives one dilated pelvis with calyces that connect, and the kidney still works."
      - "Posterior urethral valves happen in boys and cause bilateral hydronephrosis with a thick bladder."
    src: { page: 597, quote: "Ureteric bud develops, but fails to induce differentiation of metanephric mesenchyme → nonfunctional kidney consisting of cysts and connective tissue." }
    status: unverified
  # ---------- p597: duplex collecting system ----------
  - id: renal.L01.029
    kind: card
    topic: duplex-collecting-system
    front: Give the two ways a duplex collecting system can form.
    back: (1) The ureteric bud bifurcates before it enters the metanephric blastema → a Y-shaped bifid ureter. (2) Two ureteric buds reach and interact with the metanephric blastema.
    src: { page: 597, quote: "Bifurcation of ureteric bud before it enters the metanephric blastema creates a Y-shaped bifid ureter. Duplex collecting system can alternatively occur through two ureteric buds reaching and interacting with metanephric blastema." }
    status: unverified
  - id: renal.L01.030
    kind: card
    topic: duplex-collecting-system
    front: A duplex collecting system is strongly associated with what, and how does it frequently present?
    back: Vesicoureteral reflux and/or ureteral obstruction, with ↑ risk of UTIs. It frequently presents with hydronephrosis.
    src: { page: 597, quote: "Strongly associated with vesicoureteral reflux and/or ureteral obstruction, ↑ risk for UTIs. Frequently presents with hydronephrosis." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.031
    kind: mcq
    topic: duplex-collecting-system
    stem: >-
      A 4-year-old girl is evaluated for her third febrile urinary tract infection in a year. Voiding
      cystourethrography shows contrast refluxing from the bladder into the right ureter. Renal
      ultrasound shows a right kidney with two separate renal pelves and a Y-shaped ureter that joins
      before entering the bladder. Which of the following embryologic events explains her anatomy?
    options:
      - Bifurcation of the ureteric bud before it entered the metanephric blastema
      - Failure of the ureteric bud to induce the metanephric mesenchyme
      - Incomplete canalization of the ureteropelvic junction
      - Abnormal fusion of the inferior renal poles
      - Persistence of the mesonephric duct as the Wolffian duct
    answer: 0
    why:
      - "Right. Early bifurcation of the ureteric bud gives a Y-shaped bifid ureter: a duplex collecting system, strongly associated with vesicoureteral reflux, obstruction and UTIs."
      - "Failed induction gives a multicystic dysplastic kidney, a nonfunctional cystic mass."
      - "UPJ obstruction gives hydronephrosis with a single pelvis and no duplicated ureter."
      - "Fused inferior poles is a horseshoe kidney."
      - "The Wolffian duct forms the ductus deferens and epididymis in males; it is not the cause of a bifid ureter."
    src: { page: 597, quote: "Bifurcation of ureteric bud before it enters the metanephric blastema creates a Y-shaped bifid ureter." }
    status: unverified
  # ---------- p597: posterior urethral valves ----------
  - id: renal.L01.032
    kind: card
    topic: posterior-urethral-valves
    front: What are posterior urethral valves, and in whom do they occur?
    back: A membrane remnant in the posterior (prostatic) urethra in males; its persistence can lead to urethral obstruction.
    src: { page: 597, quote: "Membrane remnant in posterior (prostatic) urethra in males; its persistence can lead to urethral obstruction." }
    status: unverified
  - id: renal.L01.033
    kind: card
    topic: posterior-urethral-valves
    front: How are posterior urethral valves diagnosed prenatally, and what does severe obstruction cause in the fetus?
    back: Prenatal ultrasound shows bilateral hydronephrosis and a dilated or thick-walled bladder. Severe fetal obstruction is associated with oligohydramnios.
    src: { page: 597, quote: "Diagnosed prenatally by bilateral hydronephrosis and dilated or thick-walled bladder on ultrasound. Severe obstruction in fetus associated with oligohydramnios." }
    status: unverified
  - id: renal.L01.034
    kind: card
    topic: posterior-urethral-valves
    front: What is the most common cause of bladder outlet obstruction in male infants?
    back: Posterior urethral valves.
    src: { page: 597, quote: "Most common cause of bladder outlet obstruction in male infants." }
    status: unverified
    tags: [high-yield]
  - id: renal.L01.035
    kind: mcq
    topic: posterior-urethral-valves
    stem: >-
      A newborn boy has a weak urinary stream and a palpable suprapubic mass. Prenatal ultrasound at 28
      weeks had shown bilateral hydronephrosis, a thick-walled distended bladder and reduced amniotic
      fluid. Which of the following is the most likely location of the obstruction?
    options:
      - Both ureteropelvic junctions
      - Both ureterovesical junctions
      - The prostatic urethra
      - The penile urethra at the meatus
      - The urachus
    answer: 2
    why:
      - "Bilateral UPJ obstruction would spare the bladder; this bladder is thick and distended."
      - "Obstruction at both UVJs would also leave the bladder small, not thick-walled and full."
      - "Right. A membrane remnant in the posterior (prostatic) urethra blocks outflow: bilateral hydronephrosis, a thick-walled bladder, and oligohydramnios when severe. It is the most common cause of bladder outlet obstruction in male infants."
      - "Meatal stenosis is distal and rarely causes fetal hydronephrosis with oligohydramnios."
      - "A patent urachus leaks urine at the umbilicus; it doesn't obstruct the bladder."
    src: { page: 597, quote: "Membrane remnant in posterior (prostatic) urethra in males; its persistence can lead to urethral obstruction. Diagnosed prenatally by bilateral hydronephrosis and dilated or thick-walled bladder on ultrasound." }
    status: unverified
