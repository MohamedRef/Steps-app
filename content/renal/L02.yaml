  # ---------- p598: vesicoureteral reflux (end of Renal—Embryology) ----------
  - id: renal.L02.001
    kind: card
    topic: vesicoureteral-reflux
    front: "What is vesicoureteral reflux?"
    back: "Urine flowing backward, from the bladder up toward the ureters and kidneys."
    src: { page: 598, quote: "Retrograde flow of urine from bladder toward upper urinary tract." }
    status: unverified
    tags: [high-yield]
  - id: renal.L02.015
    kind: card
    topic: vesicoureteral-reflux
    front: "Which infection risk does vesicoureteral reflux raise?"
    back: "Recurrent UTIs."
    src: { page: 598, quote: "2° due to abnormally high bladder pressure resulting in retrograde flow via the UVJ. ↑ risk of recurrent UTIs." }
    status: unverified
    tags: [high-yield]
  - id: renal.L02.002
    kind: table
    topic: vesicoureteral-reflux
    title: Primary vs secondary vesicoureteral reflux
    columns: [Type, Cause]
    rows:
      - ["1°", "Abnormal or insufficient insertion of the ureter within the vesicular wall (ureterovesical junction, UVJ)"]
      - ["2°", "Abnormally high bladder pressure, giving retrograde flow via the UVJ"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 598, quote: "Can be 1° due to abnormal/ insufficient insertion of the ureter within the vesicular wall (ureterovesical junction [UVJ]) or 2° due to abnormally high bladder pressure resulting in retrograde flow via the UVJ." }
    status: unverified
  - id: renal.L02.003
    kind: mcq
    topic: vesicoureteral-reflux
    stem: >-
      A 6-year-old boy treated for posterior urethral valves in infancy has his fourth febrile urinary
      tract infection. Voiding cystourethrography shows a trabeculated bladder with high voiding pressures
      and contrast flowing back into both ureters and renal pelves. Which of the following best explains
      the reflux in this patient?
    options:
      - High bladder pressure forcing urine back through the ureterovesical junction
      - A short intravesical ureteral tunnel from abnormal insertion, present from birth
      - Incomplete canalization of the ureteropelvic junction narrowing its outflow
      - Early bifurcation of the ureteric bud creating a duplex collecting system
      - Failure of the urachus to close, leaving a bladder-umbilicus channel
    answer: 0
    why:
      - "Right. Secondary reflux comes from abnormally high bladder pressure pushing urine retrograde via the UVJ; his outlet obstruction left a high-pressure, trabeculated bladder."
      - "Abnormal or insufficient ureteral insertion into the bladder wall is primary reflux; here a clear high-pressure cause is present."
      - "UPJ obstruction blocks flow from the pelvis down; it does not send contrast up from the bladder."
      - "A duplex system is associated with reflux, but nothing here shows a bifid ureter."
      - "A patent urachus leaks urine at the umbilicus."
    src: { page: 598, quote: "2° due to abnormally high bladder pressure resulting in retrograde flow via the UVJ. ↑ risk of recurrent UTIs." }
    status: unverified
  # ---------- p598: renal blood flow ----------
  - id: renal.L02.004
    kind: order
    topic: renal-blood-flow
    prompt: Put the arterial path of renal blood flow in order, from the renal artery to the peritubular capillaries.
    steps:
      - Renal artery
      - Segmental artery
      - Interlobar artery
      - Arcuate artery
      - Interlobular artery
      - Afferent arteriole
      - Glomerulus
      - Efferent arteriole
      - Peritubular capillaries
    src: { page: 598, quote: "Renal artery Segmental artery Interlobar artery Interlobar vein Arcuate artery Arcuate vein Interlobular artery Afferent arteriole Efferent arteriole Peritubular capillaries Glomerulus" }
    status: unverified
  - id: renal.L02.014
    kind: order
    topic: renal-blood-flow
    prompt: "Put the venous drainage of the kidney in order, from the peritubular capillaries to the renal vein."
    steps:
      - "Peritubular capillaries"
      - "Interlobular vein"
      - "Arcuate vein"
      - "Interlobar vein"
      - "Renal vein"
    src: { page: 598, quote: "Renal artery Segmental artery Interlobar artery Interlobar vein Arcuate artery Arcuate vein Interlobular artery Afferent arteriole Efferent arteriole Peritubular capillaries Glomerulus Interlobular vein Renal vein" }
    status: unverified
  - id: renal.L02.005
    kind: card
    topic: renal-blood-flow
    front: Which two additional veins drain into the left renal vein?
    back: The left suprarenal vein and the left gonadal vein.
    src: { page: 598, quote: "Left renal vein receives two additional veins: left suprarenal and left gonadal veins." }
    status: unverified
    tags: [high-yield]
  - id: renal.L02.006
    kind: card
    topic: renal-blood-flow
    front: Why is the renal medulla vulnerable to ischemic damage such as ATN?
    back: "Its blood supply is much smaller than the cortex's, so it copes poorly with hypoxia and is the first to suffer ischemic injury."
    src: { page: 598, quote: "Renal medulla receives significantly less blood flow than the renal cortex. This makes medulla very sensitive to hypoxia and vulnerable to ischemic damage (eg, ATN)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L02.007
    kind: card
    topic: renal-blood-flow
    front: Which kidney is most commonly taken in living donor transplantation, and why (the "rule of Ls")?
    back: The Left kidney, because it has a Longer renal vein (Living donor transpLantation).
    src: { page: 598, quote: "Left kidney is most commonly taken during Living donor transpLantation because it has a Longer renal vein (rule of Ls)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L02.008
    kind: mcq
    topic: renal-blood-flow
    stem: >-
      A 45-year-old man is found to have a new left-sided varicocele that does not decompress when he lies
      down. He has had painless hematuria for 2 months. CT shows a 6-cm mass in the left kidney with tumor
      extending into the left renal vein. Which of the following best explains the varicocele?
    options:
      - The left gonadal vein drains into the left renal vein
      - The left gonadal vein drains directly into the inferior vena cava
      - The left suprarenal vein drains into the left gonadal vein
      - The renal medulla receives less blood flow than the cortex
      - The left renal vein is shorter than the right
    answer: 0
    why:
      - "Right. The left renal vein receives the left gonadal (and left suprarenal) vein, so a tumor blocking the left renal vein backs up the left gonadal vein → varicocele."
      - "That is the right gonadal vein; the left one drains into the left renal vein."
      - "The left suprarenal vein drains into the left renal vein, not into the gonadal vein."
      - "True, but the medulla's low flow explains its sensitivity to ischemia (ATN), not a varicocele."
      - "The left renal vein is the longer one; that is why the left kidney is preferred in living donation."
    src: { page: 598, quote: "Left renal vein receives two additional veins: left suprarenal and left gonadal veins." }
    status: unverified
  - id: renal.L02.009
    kind: mcq
    topic: renal-blood-flow
    stem: >-
      A 58-year-old man becomes hypotensive for 3 hours during emergency repair of a ruptured abdominal
      aortic aneurysm. Over the next 2 days his urine output falls and his creatinine rises from 1.0 to
      3.8 mg/dL. Urine microscopy shows muddy brown granular casts. Why was the injured part of the kidney
      most vulnerable?
    options:
      - It receives much less blood flow than the renal cortex
      - It receives more blood flow than the cortex, so it loses the most when flow falls
      - It lacks peritubular capillaries
      - It is drained by the left gonadal vein
      - Its capillaries are not fenestrated
    answer: 0
    why:
      - "Right. The medulla receives significantly less blood flow than the cortex, so it is very sensitive to hypoxia and vulnerable to ischemic damage such as ATN."
      - "The reverse is true: the medulla gets significantly less flow than the cortex, and that low baseline is what makes it vulnerable."
      - "The medulla is supplied by blood leaving the efferent arterioles; the point is the low flow."
      - "The gonadal vein drains the testis or ovary, not the medulla."
      - "Capillary fenestration is a feature of the glomerular filtration barrier, not the reason for ischemic injury."
    src: { page: 598, quote: "Renal medulla receives significantly less blood flow than the renal cortex. This makes medulla very sensitive to hypoxia and vulnerable to ischemic damage (eg, ATN)." }
    status: unverified
