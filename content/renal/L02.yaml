  - id: renal.L02.013
    kind: mcq
    topic: glomerular-anatomy
    stem: >-
      A kidney biopsy from a 7-year-old boy with heavy proteinuria and generalized edema is examined by
      electron microscopy. The cells whose foot processes rest on the outer surface of the glomerular
      basement membrane show diffuse effacement. Which part of the glomerulus do these cells form?
    options:
      - The visceral layer of Bowman capsule
      - The parietal layer of Bowman capsule
      - The fenestrated capillary endothelium
      - The mesangium
      - The juxtaglomerular apparatus
    answer: 0
    why:
      - "Right. Podocytes, with their foot processes on the basement membrane, are the visceral layer of Bowman capsule and the outer layer of the filtration barrier."
      - "The parietal layer is the outer wall of Bowman capsule; it is not part of the filtration barrier."
      - "The endothelium is on the blood side of the basement membrane and has fenestrations, not foot processes."
      - "Mesangial cells sit between capillary loops and support them."
      - "Juxtaglomerular cells are in the afferent arteriole wall at the vascular pole."
    src: { page: 598, quote: "Basement membrane Podocytes (visceral layer) Glomerular filtration barrier Fenestrated capillary endothelium" }
    status: unverified
