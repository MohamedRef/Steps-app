  # ---------- p625: diuretics, site of action ----------
  - id: renal.L05.001
    kind: table
    topic: diuretics-site-of-action
    title: "Diuretics: where along the nephron each class acts"
    columns: [Diuretic class, Site of action]
    rows:
      - [Mannitol, "Proximal convoluted tubule and descending limb (osmotic; segments permeable to water)"]
      - [Acetazolamide, Proximal convoluted tubule]
      - [Loop diuretics, Thick ascending limb of the loop of Henle]
      - [Thiazide diuretics, Early distal convoluted tubule]
      - [K+-sparing diuretics, Cortical collecting tubule]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 625, quote: "Mannitol Acetazolamide Loop diuretics Thiazide diuretics K+ -sparing diuretics" }
    status: unverified
    tags: [high-yield]
  - id: renal.L05.002
    kind: card
    topic: diuretics-site-of-action
    front: In the First Aid nephron diagram, which ions does the thick ascending limb reabsorb, and which diuretic class acts there?
    back: Na+, K+ and 2Cl− (with paracellular Ca2+ and Mg2+); loop diuretics act there.
    src: { page: 625, quote: "Ascending limb, loop of Henle (permeable to salts)" }
    status: unverified
  - id: renal.L05.003
    kind: mcq
    topic: diuretics-site-of-action
    stem: >-
      A 64-year-old man with heart failure is started on a diuretic. Two weeks later his serum K+ is high and he has new
      tenderness under both nipples. The drug acts at which segment of the nephron?
    options:
      - Proximal convoluted tubule
      - Descending limb of the loop of Henle
      - Thick ascending limb of the loop of Henle
      - Early distal convoluted tubule
      - Cortical collecting tubule
    answer: 4
    why:
      - "The PCT is where acetazolamide works; it causes hypokalemia, not hyperkalemia."
      - "The water-permeable descending limb is where mannitol pulls water; no gynecomastia."
      - "Loop diuretics work in the thick ascending limb and cause hypokalemia."
      - "Thiazides act in the early DCT and cause hypokalemia."
      - "Right. Hyperkalemia plus gynecomastia is spironolactone, an aldosterone receptor antagonist in the cortical collecting tubule."
    src: { page: 627, quote: "Spironolactone and eplerenone are competitive aldosterone receptor antagonists in cortical collecting tubule." }
    status: unverified
    tags: [high-yield]
