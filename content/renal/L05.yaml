  - id: renal.L05.019
    kind: mcq
    topic: acetazolamide
    stem: >-
      A 26-year-old woman plans to climb Kilimanjaro and takes a prophylactic drug for altitude sickness. On day 3 she
      notes tingling in her fingers. Which acid-base finding is most likely?
    options:
      - Metabolic alkalosis with low urine pH
      - Normal anion gap metabolic acidosis with alkaline urine
      - High anion gap metabolic acidosis
      - Respiratory acidosis
      - Hyperkalemic metabolic alkalosis
    answer: 1
    why:
      - "Contraction alkalosis with paradoxical aciduria is the loop or thiazide picture."
      - "Right. Acetazolamide causes a proximal (type 2) RTA: HCO3− is lost in the urine, so the urine is alkaline and the acidosis is non-anion gap."
      - "RTA does not add an unmeasured anion."
      - "Acetazolamide offsets respiratory alkalosis at altitude; it does not cause respiratory acidosis."
      - "Acetazolamide causes hypokalemia and acidosis."
    src: { page: 626, quote: "Proximal renal tubular acidosis (type 2 RTA), paresthesias" }
    status: unverified
    tags: [high-yield]
