  - id: renal.L05.007
    kind: card
    topic: diuretics-electrolyte-excretion
    front: Why do K+-sparing diuretics cause acidemia?
    back: Aldosterone blockade prevents K+ secretion and H+ secretion; the hyperkalemia also drives K+ into cells (via the H+/K+ exchanger) in exchange for H+ leaving cells.
    src: { page: 625, quote: "K+ sparing: aldosterone blockade prevents K+ secretion and H+ secretion." }
    status: unverified
  - id: renal.L05.008
    kind: enumerate
    topic: diuretics-electrolyte-excretion
    prompt: Enumerate the three mechanisms by which loop diuretics and thiazides cause alkalemia (3).
    points:
      - "Volume contraction → ↑ AT II → ↑ Na+/H+ exchange in PCT → ↑ HCO3− reabsorption (contraction alkalosis)"
      - "K+ loss → K+ leaves cells via the H+/K+ exchanger in exchange for H+ entering cells"
      - "In a low K+ state, H+ (rather than K+) is exchanged for Na+ in the cortical collecting tubule → alkalosis and paradoxical aciduria"
    pass: 3
    hook: "ناشف، ناقص K+، والـ H+ بيطلع بدل الـ K+: تلاتة طرق للـ alkalosis."
    src: { page: 625, quote: "Volume contraction → ↑ AT II → ↑ Na+ /H+ exchange in PCT → ↑ HCO − 3 reabsorption (“contraction alkalosis”)" }
    status: unverified
    tags: [high-yield]
  - id: renal.L05.009
    kind: card
    topic: diuretics-electrolyte-excretion
    front: What is "paradoxical aciduria" with loop or thiazide diuretics?
    back: In a low K+ state, the cortical collecting tubule exchanges H+ (rather than K+) for Na+, so acidic urine is passed despite metabolic alkalosis.
    src: { page: 625, quote: "In low K+ state, H+ (rather than K+ ) is exchanged for Na+ in cortical collecting tubule → alkalosis and “paradoxical aciduria”" }
    status: unverified
  - id: renal.L05.010
    kind: mcq
    topic: diuretics-electrolyte-excretion
    stem: >-
      A 58-year-old woman with heart failure takes high-dose furosemide. Labs show K+ 2.9 mEq/L and HCO3− 34 mEq/L, yet
      her urine pH is 5.0. Which mechanism best explains the acidic urine?
    options:
      - Inhibition of carbonic anhydrase in the proximal tubule
      - H+ secreted instead of K+ in exchange for Na+ in the cortical collecting tubule
      - Aldosterone receptor blockade in the collecting duct
      - Loss of NH3 synthesis in the proximal tubule
      - Increased bicarbonate excretion in the thick ascending limb
    answer: 1
    why:
      - "Carbonic anhydrase inhibition alkalinizes the urine and causes acidemia."
      - "Right. With low K+, the collecting tubule swaps H+ for Na+, giving paradoxical aciduria on top of contraction alkalosis."
      - "Aldosterone blockade (K+-sparing) lowers H+ secretion and causes acidemia."
      - "Less NH3 made in the proximal tubule means less acid excreted (the type 4 RTA mechanism, driven by hyperkalemia); it causes acidosis, not acidic urine with alkalosis, and her K+ is low, not high."
      - "Loop diuretics decrease, not increase, urinary HCO3− in the First Aid table."
    src: { page: 625, quote: "In low K+ state, H+ (rather than K+ ) is exchanged for Na+ in cortical collecting tubule" }
    status: unverified
    tags: [high-yield]
  # ---------- p626: mannitol ----------
  - id: renal.L05.011
    kind: card
    topic: mannitol
    front: How does mannitol work?
    back: "It is an osmotic diuretic: by raising plasma osmolality it pulls water out of the interstitium into the vessels, so urine flow rises and intracranial and intraocular pressure fall."
    src: { page: 626, quote: "Osmotic diuretic. ↑ serum osmolality → fluid shift from interstitium to intravascular space → ↑ urine flow, ↓ intracranial/intraocular pressure." }
    status: unverified
    tags: [high-yield]
  - id: renal.L05.012
    kind: enumerate
    topic: mannitol
    prompt: Enumerate the clinical uses of mannitol (4).
    points:
      - Drug overdose
      - Elevated intracranial pressure
      - Elevated intraocular pressure
      - Augmenting diuresis
    pass: 3
    src: { page: 626, quote: "Drug overdose, elevated intracranial/intraocular pressure, augmenting diuresis." }
    status: unverified
  - id: renal.L05.013
    kind: cloze
    topic: mannitol
    text: "Mannitol adverse effects: dehydration, hypo- or hypernatremia, {{c1::pulmonary edema}}. Contraindicated in {{c2::anuria}} and {{c3::HF}}."
    src: { page: 626, quote: "Dehydration, hypo- or hypernatremia, pulmonary edema. Contraindicated in anuria, HF." }
    status: unverified
    tags: [high-yield]
  - id: renal.L05.014
    kind: mcq
    topic: mannitol
    stem: >-
      A 30-year-old man with a head injury is given an IV drug to lower intracranial pressure. He has a history of
      severe heart failure, and within hours he becomes dyspneic with bilateral crackles. Which mechanism caused this?
    options:
      - Inhibition of the Na+/K+/2Cl− cotransporter
      - Blockade of aldosterone receptors
      - Fluid shift from the interstitium into the intravascular space
      - Accumulation of bradykinin
      - Inhibition of carbonic anhydrase
    answer: 2
    why:
      - "Loop diuretics relieve pulmonary edema; they do not cause it."
      - "Spironolactone helps in HF and does not cause acute edema."
      - "Right. Mannitol raises serum osmolality and expands plasma volume; in HF this causes pulmonary edema, so HF is a contraindication."
      - "Bradykinin accumulation (ACE inhibitors) causes cough and angioedema."
      - "Acetazolamide causes acidosis and paresthesias, not volume overload."
    src: { page: 626, quote: "Contraindicated in anuria, HF." }
    status: unverified
