items:
  # ---------- p612: casts in urine ----------
  - id: renal.L04.001
    kind: card
    topic: casts-in-urine
    front: What does the presence of casts in the urine tell you about hematuria or pyuria?
    back: That it is of glomerular or renal tubular origin. Bladder cancer and kidney stones give hematuria with no casts; acute cystitis gives pyuria with no casts.
    src: { page: 612, quote: "Presence of casts indicates that hematuria/pyuria is of glomerular or renal tubular origin. Bladder cancer, kidney stones → hematuria, no casts. Acute cystitis → pyuria, no casts." }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.002
    kind: card
    topic: casts-in-urine
    front: What is the matrix of all urinary casts, and what is its normal role?
    back: Tamm-Horsfall mucoprotein (uromodulin), secreted by renal tubular cells to prevent UTIs.
    src: { page: 612, quote: "All casts contain a matrix composed primarily of Tamm-Horsfall mucoprotein (uromodulin), secreted by renal tubular cells to prevent UTIs." }
    status: unverified
  - id: renal.L04.003
    kind: table
    topic: casts-in-urine
    title: Casts in urine
    columns: [Cast, Seen in]
    rows:
      - [RBC casts, "Glomerulonephritis, hypertensive emergency"]
      - [WBC casts, "Tubulointerstitial inflammation, acute pyelonephritis, transplant rejection"]
      - [Granular casts (can be "muddy brown"), Acute tubular necrosis (ATN)]
      - [Fatty casts ("oval fat bodies"), "Nephrotic syndrome (\"Maltese cross\" sign)"]
      - [Waxy casts, End-stage renal disease/chronic kidney disease]
      - [Hyaline casts, "Nonspecific; can be normal with dehydration, exercise, or diuretic therapy"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 612, quote: "RBC casts A Glomerulonephritis, hypertensive emergency. WBC casts Tubulointerstitial inflammation, acute pyelonephritis, transplant rejection. Granular casts B Acute tubular necrosis (ATN)." }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.004
    kind: mcq
    topic: casts-in-urine
    stem: >-
      A 34-year-old woman has fever to 39.4°C, chills and right flank pain for 2 days. There is right
      costovertebral angle tenderness. Urinalysis shows many neutrophils and bacteria. Which additional
      urine finding would best show that the infection involves the kidney rather than only the bladder?
    options:
      - WBC casts
      - RBC casts
      - Waxy casts
      - Hyaline casts
      - Fatty casts with a Maltese cross
    answer: 0
    why:
      - "Right. WBC casts form in the tubules, so they place the pyuria in the kidney: acute pyelonephritis. Cystitis gives pyuria with no casts."
      - "RBC casts point to glomerulonephritis or hypertensive emergency."
      - "Waxy casts point to end-stage or chronic kidney disease."
      - "Hyaline casts are nonspecific and can be normal."
      - "Fatty casts with a Maltese cross point to nephrotic syndrome."
    src: { page: 612, quote: "WBC casts Tubulointerstitial inflammation, acute pyelonephritis, transplant rejection." }
    status: unverified
  # ---------- p612: nomenclature of glomerular disorders ----------
  - id: renal.L04.005
    kind: table
    topic: nomenclature-of-glomerular-disorders
    title: Nomenclature of glomerular disorders
    columns: [Type, Characteristics, Example]
    rows:
      - [Focal, "< 50% of glomeruli involved", Focal segmental glomerulosclerosis]
      - [Diffuse, "> 50% of glomeruli involved", Diffuse proliferative glomerulonephritis]
      - [Proliferative, Hypercellular glomeruli, Membranoproliferative glomerulonephritis]
      - [Membranous, Thickening of GBM, Membranous nephropathy]
      - [Primary glomerular disease, 1° kidney disease specifically affecting the glomeruli, Minimal change disease]
      - [Secondary glomerular disease, "Systemic or other-organ disease that also affects the glomeruli", "SLE, diabetic nephropathy"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 2], [5, 2]]
    src: { page: 612, quote: "Focal <50% of glomeruli are involved Focal segmental glomerulosclerosis Diffuse >50% of glomeruli are involved Diffuse proliferative glomerulonephritis" }
    status: unverified
  - id: renal.L04.006
    kind: mcq
    topic: nomenclature-of-glomerular-disorders
    stem: >-
      A renal biopsy report from a 45-year-old man with proteinuria reads: "Sclerosis affecting part of
      the capillary tuft in 8 of 30 glomeruli sampled; the remaining glomeruli are normal." Which pair of
      terms best describes this pattern?
    options:
      - Focal and segmental
      - Diffuse and global
      - Diffuse and proliferative
      - Membranous and diffuse
      - Proliferative and focal
    answer: 0
    why:
      - "Right. Fewer than 50% of glomeruli (8 of 30) is focal, and part of each tuft is segmental: the pattern of focal segmental glomerulosclerosis."
      - "Diffuse means more than 50% of glomeruli involved."
      - "Proliferative means hypercellular glomeruli, and this is sclerosis in under half."
      - "Membranous means GBM thickening."
      - "Proliferative means hypercellular, not sclerotic."
    src: { page: 612, quote: "Focal <50% of glomeruli are involved Focal segmental glomerulosclerosis" }
    status: unverified
  # ---------- p613: glomerular diseases ----------
  - id: renal.L04.007
    kind: table
    topic: glomerular-diseases
    title: Nephritic vs nephrotic syndrome
    columns: [Feature, Nephritic syndrome, Nephrotic syndrome]
    rows:
      - [Mechanism, "Glomerular inflammation → GBM damage → RBCs lost into urine (dysmorphic RBCs)", "Podocyte damage → impaired charge barrier → proteinuria"]
      - [Urine, "Hematuria, RBC casts; proteinuria often < 3.5 g/day", "Massive proteinuria (> 3.5 g/day), frothy urine with fatty casts"]
      - [Other findings, "↓ GFR → oliguria, azotemia; ↑ renin release, hypertension", "Edema, hypoalbuminemia → ↑ hepatic lipogenesis → hypercholesterolemia"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 613, quote: "Podocyte damage → impaired charge barrier → proteinuria Massive proteinuria (>3.5 g/day) with edema, hypoalbuminemia" }
    status: unverified
    tags: [high-yield]
