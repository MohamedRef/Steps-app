    topic: nephrotic-syndrome
    front: "In which age group is minimal change disease more common?"
    back: "Children."
    src: { page: 616, quote: "rarely 2° to lymphoma (eg, cytokine-mediated damage). More common in children." }
    status: unverified
    tags: [high-yield]
