  # ---------- p618: hydronephrosis ----------
  - id: renal.L04.040
    kind: card
    topic: hydronephrosis
    front: What is hydronephrosis, and what are its causes?
    back: Distention/dilation of the renal pelvis and/or calyces, occurring proximal to the site of pathology. Mostly urinary tract obstruction (stones, severe BPH, congenital obstruction, locally advanced cervical cancer, ureteral injury); also retroperitoneal fibrosis and vesicoureteral reflux.
    src: { page: 618, quote: "Distention/dilation of renal pelvis and/or calyces A . Mostly caused by urinary tract obstruction (eg, urinary tract stones, severe BPH, congenital obstructions, locally advanced cervical cancer, injury to ureter); other causes include retroperitoneal fibrosis, vesicoureteral reflux." }
    status: unverified
  - id: renal.L04.041
    kind: card
    topic: hydronephrosis
    front: When does hydronephrosis raise serum creatinine, and what does it do to the kidney?
    back: When the obstruction is bilateral or the patient has an obstructed solitary kidney. It compresses the renal cortex and medulla and can cause atrophy.
    src: { page: 618, quote: "Serum creatinine becomes elevated if obstruction is bilateral or if patient has an obstructed solitary kidney. Leads to compression and possible atrophy of renal cortex and medulla." }
    status: unverified
