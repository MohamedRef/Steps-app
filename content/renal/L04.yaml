  - id: renal.L04.009
    kind: enumerate
    topic: glomerular-diseases
    prompt: Enumerate First Aid's examples of nephrotic syndrome, with 1° or 2° (5).
    points:
      - Focal segmental glomerulosclerosis (1° or 2°)
      - Minimal change disease (1° or 2°)
      - Membranous nephropathy (1° or 2°)
      - Amyloidosis (2°)
      - Diabetic glomerulonephropathy (2°)
    pass: 4
    src: { page: 613, quote: "Focal segmental glomerulosclerosis (1° or 2°) ▘ Minimal change disease (1° or 2°) ▘ Membranous nephropathy (1° or 2°) ▘ Amyloidosis (2°) ▘ Diabetic glomerulonephropathy (2°)" }
    status: unverified
  - id: renal.L04.010
    kind: card
    topic: glomerular-diseases
    front: Why does nephrotic syndrome cause a hypercoagulable state and ↑ infection risk?
    back: "Hypercoagulable (eg, renal vein thrombosis): antithrombin is lost in the urine. Infection: IgGs are lost in the urine and edema compromises soft tissue."
    src: { page: 613, quote: "Associated with hypercoagulable state (eg, renal vein thrombosis) due to antithrombin loss in urine and ↑ risk of infection (loss of IgGs in urine and soft tissue compromise by edema)" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.011
    kind: card
    topic: glomerular-diseases
    front: What is nephritic-nephrotic syndrome, and with which diseases is it most common?
    back: Severe GBM damage gives both hematuria and nephrotic-range proteinuria (> 3.5 g/day). It can occur with any nephritic syndrome but is most common with diffuse proliferative and membranoproliferative glomerulonephritis.
    src: { page: 613, quote: "Can occur with any form of nephritic syndrome, but is most common with: ▘ Diffuse proliferative glomerulonephritis ▘ Membranoproliferative glomerulonephritis" }
    status: unverified
  - id: renal.L04.012
    kind: mcq
    topic: glomerular-diseases
    stem: >-
      A 41-year-old man has 3 weeks of progressive leg swelling and foamy urine. Urine protein is
      6.2 g/day, serum albumin 2.1 g/dL and total cholesterol 340 mg/dL. Today he has sudden left flank
      pain and gross hematuria, and Doppler shows thrombus in the left renal vein. Urinary loss of which
      protein best explains the thrombosis?
    options:
      - Antithrombin
      - Fibrinogen
      - Plasminogen activator inhibitor
      - Factor VIII
      - von Willebrand factor
    answer: 0
    why:
      - "Right. In nephrotic syndrome antithrombin is lost in the urine, causing a hypercoagulable state such as renal vein thrombosis."
      - "Fibrinogen is large and actually rises in nephrotic syndrome; its loss would not cause clotting."
      - "Losing an inhibitor of fibrinolysis would favor bleeding, not clotting."
      - "Factor VIII is large and not lost; its loss would cause bleeding."
      - "von Willebrand factor is too large to cross the barrier."
    src: { page: 613, quote: "Associated with hypercoagulable state (eg, renal vein thrombosis) due to antithrombin loss in urine" }
    status: unverified
  # ---------- p614-615: nephritic syndrome ----------
  - id: renal.L04.013
    kind: table
    topic: nephritic-syndrome
    title: "Nephritic syndromes: microscopy"
    columns: [Disease, Light microscopy, Immunofluorescence, Electron microscopy]
    rows:
      - [Infection-related GN, Enlarged hypercellular glomeruli, "Granular (\"starry sky\", \"lumpy-bumpy\"): IgG, IgM, C3 along GBM and mesangium", Subepithelial IC humps]
      - [IgA nephropathy, Mesangial proliferation, IgA-based IC deposits in mesangium, Mesangial IC deposition]
      - [Rapidly progressive (crescentic) GN, "Crescents of fibrin, plasma proteins (C3b), parietal cells, monocytes, macrophages", "Linear (Goodpasture), negative (pauci-immune), or granular (PSGN, DPGN)", "Goodpasture: breaks in GBM, necrosis and crescents with no deposits; pauci-immune: usually no deposits; otherwise depends on the cause"]
      - [Diffuse proliferative GN, "\"Wire looping\" of capillaries", Granular, "Subendothelial (sometimes subepithelial or intramembranous) IgG ICs, often with C3"]
      - [Alport syndrome, "Irregular thinning, thickening and splitting of GBM", Initially negative (usually stays negative), "\"Basket-weave\" GBM"]
      - [Membranoproliferative GN, "Mesangial ingrowth; GBM splitting \"tram-track\" on H&E and PAS", "Granular IgG and C3 (IC type) or C3/C4 (complement type)", "Subendothelial (IC type); intramembranous and/or subendothelial (complement type)"]
    blanks: [[0, 2], [0, 3], [1, 2], [2, 1], [2, 3], [3, 1], [4, 3], [5, 1]]
    src: { page: 614, quote: "Granular (“starry sky”) appearance (“lumpy-bumpy”) B due to IgG, IgM, and C3 deposition along GBM and mesangium Subepithelial IC humps" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.014
    kind: card
    topic: nephritic-syndrome
    front: What is the mechanism and timing of infection-related glomerulonephritis in children, and which extra organism matters in adults?
    back: A type III hypersensitivity reaction with consumptive hypocomplementemia, about 2-4 weeks after group A streptococcal pharyngitis or skin infection. In adults, Staphylococcus is an additional cause.
    src: { page: 614, quote: "Type III hypersensitivity reaction with consumptive hypocomplementemia Children: seen ~2-4 weeks after group A streptococcal pharyngitis or skin infection Adults: Staphylococcus is additional causative agent" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.015
    kind: card
    topic: nephritic-syndrome
    front: When does IgA nephropathy (Berger disease) occur relative to infection, and why?
    back: Concurrently with respiratory or GI tract infections, because IgA is secreted by mucosal linings. It is the renal pathology of IgA vasculitis.
    src: { page: 614, quote: "Occurs concurrently with respiratory or GI tract infections (IgA is secreted by mucosal linings) Renal pathology of IgA vasculitis" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.016
    kind: table
    topic: nephritic-syndrome
    title: Rapidly progressive (crescentic) GN by immunofluorescence
    columns: [Immunofluorescence, Causes]
    rows:
      - [Linear, "Goodpasture syndrome (type II HSR; antibodies to GBM and alveolar basement membrane → hematuria/hemoptysis)"]
      - [Negative (pauci-immune), "Granulomatosis with polyangiitis (PR3-ANCA/c-ANCA), eosinophilic granulomatosis with polyangiitis, microscopic polyangiitis (MPO-ANCA/p-ANCA)"]
      - [Granular, PSGN or DPGN]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 614, quote: "Linear IF due to antibodies to GBM and alveolar basement membrane: Goodpasture syndrome hematuria/ hemoptysis" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.017
    kind: card
    topic: nephritic-syndrome
    front: What is the most common cause of diffuse proliferative glomerulonephritis, and what is its light-microscopy clue?
    back: "SLE (\"wire lupus\"): wire looping of the capillaries. DPGN and MPGN often present as nephritic and nephrotic syndromes together."
    src: { page: 614, quote: "Often due to SLE (think “wire lupus”); DPGN and MPGN often present as nephritic and nephrotic syndromes concurrently" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.018
    kind: card
    topic: nephritic-syndrome
    front: What is the defect in Alport syndrome, its usual inheritance, and its features?
    back: "Type IV collagen mutation → GBM alterations; mostly X-linked dominant. Eye problems (retinopathy, anterior lenticonus), glomerulonephritis, sensorineural hearing loss: \"can't see, can't pee, can't hear a bee\"."
    src: { page: 615, quote: "Type IV collagen mutation → GBM alterations; mostly X-linked dominant; eye problems (eg, retinopathy, anterior lenticonus), glomerulonephritis, sensorineural hearing loss (“can’t see, can’t pee, can’t hear a bee”)" }
    status: unverified
    tags: [high-yield]
  - id: renal.L04.019
    kind: card
    topic: nephritic-syndrome
    front: What are the two types of membranoproliferative glomerulonephritis?
    back: "Immune complex or monoclonal Ig-mediated (may be 2° to HBV, HCV or autoimmune disease): granular IgG and C3, subendothelial deposits. Complement-mediated (persistent alternative-pathway activation, eg, C3 or C4 GN, dense deposit disease): granular C3 or C4, intramembranous and/or subendothelial deposits."
    src: { page: 615, quote: "Immune complex (IC) or monoclonal Ig-mediated (may be 2° to HBV, HCV, or autoimmune disease) Granular IgG and C3 deposits Subendothelial IC deposits" }
    status: unverified
  - id: renal.L04.020
    kind: mcq
    topic: nephritic-syndrome
    stem: >-
      A 7-year-old boy has cola-colored urine and puffy eyes. Three weeks ago he had impetigo on his legs.
      Blood pressure is 138/90 mm Hg. Urinalysis shows RBC casts and 1+ protein. Which finding is most
      likely on renal biopsy?
    options:
      - Subepithelial immune complex humps on electron microscopy
      - Linear IgG along the GBM on immunofluorescence
      - Mesangial IgA deposits
      - Longitudinal splitting of the GBM with a basket-weave pattern
      - Effacement of podocyte foot processes only
    answer: 0
    why:
      - "Right. Infection-related GN after group A strep skin infection (2-4 weeks): granular lumpy-bumpy IF and subepithelial IC humps, with low complement."
      - "Linear IF is Goodpasture syndrome."
      - "Mesangial IgA is IgA nephropathy, which occurs during the infection, not weeks later."
      - "Basket-weave GBM is Alport syndrome."
      - "Foot process effacement alone is minimal change disease, a nephrotic syndrome."
    src: { page: 614, quote: "Children: seen ~2-4 weeks after group A streptococcal pharyngitis or skin infection" }
    status: unverified
  - id: renal.L04.021
    kind: mcq
    topic: nephritic-syndrome
    stem: >-
      A 26-year-old man has coughed up blood for 1 week and has had dark urine for 3 days. Serum creatinine
      is 4.2 mg/dL. Urinalysis shows RBC casts. Renal biopsy shows crescents in most glomeruli, and
      immunofluorescence shows linear IgG along the glomerular basement membrane. Which mechanism best
      explains his disease?
    options:
      - Type II hypersensitivity with antibodies against the GBM and alveolar basement membrane
      - Type III hypersensitivity with immune complexes deposited along the GBM and mesangium
      - Pauci-immune small-vessel vasculitis with PR3-ANCA (c-ANCA)
      - IgA-based immune complexes deposited in the mesangium
      - A type IV collagen mutation altering the GBM
    answer: 0
    why:
      - "Right. Crescentic GN with linear IF and hemoptysis is Goodpasture syndrome: a type II HSR, with antibodies to the GBM and alveolar basement membrane."
      - "Type III immune complex disease (infection-related GN, DPGN) gives granular, lumpy-bumpy IF, not linear."
      - "Granulomatosis with polyangiitis (PR3-ANCA) also hits lung and kidney, but it is pauci-immune: IF is negative, not linear."
      - "Mesangial IgA deposits are IgA nephropathy, which gives mesangial, not linear, IF."
      - "A type IV collagen mutation is Alport syndrome: no hemoptysis, and IF is initially negative."
    src: { page: 614, quote: "Linear IF due to antibodies to GBM and alveolar basement membrane: Goodpasture syndrome hematuria/ hemoptysis" }
    status: unverified
  - id: renal.L04.022
    kind: mcq
    topic: nephritic-syndrome
    stem: >-
      A 19-year-old man has had microscopic hematuria since childhood and now has a rising creatinine.
      His maternal uncle needed dialysis at 30. Audiometry shows bilateral sensorineural hearing loss, and
      slit-lamp examination shows a conical bulge of the anterior lens. A mutation in which protein is
      most likely?
    options:
      - Type IV collagen
      - Type I collagen
      - Fibrillin-1
      - Polycystin-1
      - Nephrin
    answer: 0
    why:
      - "Right. Alport syndrome: type IV collagen mutation (mostly X-linked dominant) → GBM disease, anterior lenticonus and sensorineural hearing loss (can't see, can't pee, can't hear a bee)."
      - "Type I collagen defects cause osteogenesis imperfecta."
      - "Fibrillin-1 defects cause Marfan syndrome (lens dislocation, not lenticonus)."
      - "Polycystin-1 is mutated in ADPKD."
      - "Nephrin is a slit-diaphragm protein; its defect gives congenital nephrotic syndrome, without deafness."
    src: { page: 615, quote: "Type IV collagen mutation → GBM alterations; mostly X-linked dominant; eye problems (eg, retinopathy, anterior lenticonus), glomerulonephritis, sensorineural hearing loss" }
    status: unverified
  # ---------- p616: nephrotic syndrome ----------
  - id: renal.L04.023
    kind: card
    topic: nephrotic-syndrome
    front: "What triggers minimal change disease (the 4 Is)?"
    back: "Often 1° (idiopathic), triggered by recent infection, immunization or another immune stimulus (4 Is); rarely 2° to lymphoma (eg, cytokine-mediated damage)."
    src: { page: 616, quote: "Often 1° (idiopathic), triggered by recent infection, immunization, immune stimulus (4 Is); rarely 2° to lymphoma (eg, cytokine-mediated damage)." }
    status: unverified
    tags: [high-yield]
