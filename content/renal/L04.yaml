      - Nonenzymatic glycation of tissue proteins
      - Mesangial expansion
      - GBM thickening and ↑ permeability
    src: { page: 616, quote: "Hyperglycemia → nonenzymatic glycation of tissue proteins → mesangial expansion → GBM thickening and ↑ permeability." }
    status: unverified
  - id: renal.L04.028
    kind: card
    topic: nephrotic-syndrome
