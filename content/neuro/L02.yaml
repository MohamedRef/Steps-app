  - id: neuro.L02.016
    kind: mcq
    topic: pns-glial-cells
    stem: >-
      A 36-year-old man develops symmetric ascending weakness and areflexia 2 weeks after a diarrheal
      illness. Nerve conduction studies show slowed conduction velocities. Immunostaining of the
      myelinating cells injured in this disorder would be positive for which marker?
    options:
      - GFAP
      - S100
      - Synaptophysin
      - Neurofilament protein
      - CD4
    answer: 1
    why:
      - "GFAP marks astrocytes, CNS cells not injured in Guillain-Barré syndrome."
      - "Right. Guillain-Barré injures Schwann cells, the PNS myelinating cells, which are S100 ⊕."
      - "Synaptophysin is a neuron marker."
      - "Neurofilament protein is a neuron marker."
      - "CD4 marks helper T cells and is the HIV receptor; it does not mark Schwann cells."
    src: { page: 503, quote: "Schwann cells Myelinate axons in PNS (including CN III-XII). S100 ⊕. Each myelinates a single axon (“Schwone”). Injured in Guillain-Barré syndrome." }
    status: unverified
  # ---------- p504: neuron action potential ----------
  - id: neuro.L02.017
    kind: order
    topic: neuron-action-potential
    prompt: Put the phases of the neuron action potential in order.
    steps:
      - "Resting: membrane more permeable to K+ than Na+; voltage-gated Na+ and K+ channels closed"
      - "Depolarization: Na+ activation gate opens, Na+ flows in"
      - "Repolarization: Na+ inactivation gate closes at the peak; K+ activation gate opens, K+ flows out"
      - "Hyperpolarization: K+ gates are slow to close, excess K+ efflux"
      - "Na+ channels return to resting state; Na+/K+ pump restores ion concentrations"
    src: { page: 504, quote: "Membrane depolarization: Na+ activation gate opens → Na+ flows inward." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L02.018
    kind: card
    topic: neuron-action-potential
    front: What stops Na+ inflow at the peak of the action potential?
    back: The Na+ inactivation gate closes at the peak potential.
    src: { page: 504, quote: "Membrane repolarization: Na+ inactivation gate closes at peak potential, thus stopping Na+ inflow. K+ activation gate opens → K+ flows outward." }
    status: unverified
  - id: neuro.L02.019
    kind: card
    topic: neuron-action-potential
    front: Why is there a brief hyperpolarization after an action potential?
    back: K+ activation gates are slow to close, so excess K+ leaves the cell.
    src: { page: 504, quote: "Membrane hyperpolarization: K+ activation gates are slow to close → excess K+ efflux and brief period of hyperpolarization." }
    status: unverified
  - id: neuro.L02.020
    kind: mcq
    topic: neuron-action-potential
    stem: >-
      A 34-year-old laboratory worker accidentally injects himself with a toxin that binds voltage-
      gated K+ channels in neurons and keeps them closed. The voltage-gated Na+ channels and the
      Na+/K+ ATPase are unaffected. Which process in his neuronal action potential is directly
      blocked, so that repolarization slows and the brief hyperpolarization after each spike
      disappears?
    options:
      - Opening of the Na+ activation gate
      - Closing of the Na+ inactivation gate
      - Opening of voltage-gated K+ channels
      - Na+/K+ ATPase activity
      - K+ leak at rest
    answer: 2
    why:
      - "Blocking Na+ activation gates would prevent the upstroke, which is normal here."
      - "Failure of Na+ inactivation would prolong the peak, but the undershoot comes from K+ efflux."
      - "Right. Repolarization and the hyperpolarization depend on K+ activation gates opening (and being slow to close); blocking them slows return and removes the undershoot."
      - "The pump restores ion gradients over time; it does not shape the repolarization phase."
      - "The resting K+ permeability sets the resting potential, which is unchanged."
    src: { page: 504, quote: "Membrane hyperpolarization: K+ activation gates are slow to close → excess K+ efflux and brief period of hyperpolarization." }
    status: unverified
