  - id: neuro.L02.012
    kind: card
    topic: cns-glial-cells
    front: What do HIV-infected microglia form in HIV-associated dementia?
    back: They fuse to form multinucleated giant cells in the CNS.
    src: { page: 503, quote: "HIV-infected microglia fuse to form multinucleated giant cells in CNS in HIV- associated dementia." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L02.013
    kind: mcq
    topic: cns-glial-cells
    stem: >-
      A 29-year-old woman has had two episodes of painful monocular vision loss and one of leg numbness
      over 3 years. MRI shows periventricular white matter plaques. Biopsy of an active lesion would show
      loss of cells that have which feature?
    options:
      - Each cell myelinates a single peripheral axon and is S100 positive
      - Each cell myelinates many CNS axons and has a fried-egg appearance
      - GFAP-positive cells that proliferate in reactive gliosis
      - Ciliated columnar cells that line the ventricles
      - Mesoderm-derived phagocytes that fuse in HIV infection
    answer: 1
    why:
      - "Schwann cells (S100 ⊕, one axon each) are PNS cells injured in Guillain-Barré, not MS."
      - "Right. Oligodendrocytes myelinate many CNS axons (including CN II, hence optic neuritis), look like fried eggs, and are injured in multiple sclerosis."
      - "Astrocytes are GFAP ⊕ and form the gliosis around plaques; they are not the cells lost."
      - "Ependymal cells line the ventricles and circulate CSF."
      - "Microglia are the mesoderm-derived scavengers that fuse into giant cells in HIV."
    src: { page: 503, quote: "Injured in multiple sclerosis, leukodystrophies, progressive multifocal leukoencephalopathy." }
    status: unverified
