  # ---------- p503: cells of the nervous system ----------
  - id: neuro.L02.001
    kind: card
    topic: cells-of-the-nervous-system
    front: Which parts of a neuron are seen on Nissl staining, and why are axons not?
    back: Dendrites and cell bodies. Nissl stains rough endoplasmic reticulum (RER), which is not present in axons.
    src: { page: 503, quote: "Dendrites and cell bodies can be seen on Nissl staining (stains rough endoplasmic reticulum [RER]; not present in axons)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L02.175
    kind: cloze
    topic: cells-of-the-nervous-system
    text: "Neurons are {{c1::permanent}}, signal-transmitting cells: dendrites {{c2::receive input}}, axons {{c3::send output}}."
    src: { page: 503, quote: "Neurons—permanent, signal-transmitting cells of the nervous system composed of dendrites (receive input), cell bodies, and axons (send output)." }
    status: unverified
  - id: neuro.L02.002
    kind: cloze
    topic: cells-of-the-nervous-system
    text: "Neuron markers: {{c1::neurofilament protein}} and {{c2::synaptophysin}}."
    src: { page: 503, quote: "Markers: neurofilament protein, synaptophysin." }
    status: unverified
  - id: neuro.L02.003
    kind: card
    topic: cells-of-the-nervous-system
    front: What are the embryologic origins of CNS glia and PNS glia?
    back: "CNS glia: neuroectoderm, except microglia (mesoderm). PNS glia: neural crest ectoderm."
    src: { page: 503, quote: "CNS glial cells—neuroectoderm (except microglia, which derive from mesoderm). PNS glial cells—neural crest ectoderm." }
    status: unverified
  - id: neuro.L02.004
    kind: card
    topic: cells-of-the-nervous-system
    front: How does myelin increase conduction velocity?
    back: It insulates the axon so action potentials jump between nodes of Ranvier (saltatory conduction), where Na+ channel density is very high.
    src: { page: 503, quote: "→ ↑ conduction velocity of transmitted signals via saltatory conduction of action potentials at nodes of Ranvier (↑↑ Na+ channel density)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L02.005
    kind: mcq
    topic: cells-of-the-nervous-system
    stem: >-
      A 66-year-old man dies of respiratory failure 3 years after the onset of progressive limb
      weakness with fasciculations and hyperreflexia. At autopsy, the anterior horn is stained with
      a dye that binds ribosomal RNA. The few remaining large motor neurons take up the stain in
      their cell bodies and proximal dendrites, but their axons leaving the ventral roots are
      unstained. What best explains the absence of staining in the axons?
    options:
      - Axons lack rough endoplasmic reticulum
      - Axons are wrapped in myelin that blocks the dye
      - Axons lack neurofilament protein
      - Axons lack synaptophysin
      - Axons have no mitochondria
    answer: 0
    why:
      - "Right. Nissl stain marks RER, present in cell bodies and dendrites but not in axons."
      - "Myelin is not the reason; Nissl substance (RER) is simply absent from axons."
      - "Neurofilament protein is a neuron marker found in axons; it isn't what Nissl stains."
      - "Synaptophysin is a neuron marker at synaptic vesicles; Nissl doesn't stain it."
      - "Axons do contain mitochondria; Nissl stain does not bind them."
    src: { page: 503, quote: "Dendrites and cell bodies can be seen on Nissl staining (stains rough endoplasmic reticulum [RER]; not present in axons)." }
    status: unverified
  - id: neuro.L02.239
    kind: cloze
    topic: cells-of-the-nervous-system
    text: "Myelin is a multilayer wrapping of {{c1::electrical insulation}} formed around axons → ↑ {{c2::conduction velocity}} via saltatory conduction at the {{c3::nodes of Ranvier}}."
    src: { page: 503, quote: "Myelin is a multilayer wrapping of electrical insulation formed around axons → ↑ conduction velocity of transmitted signals via saltatory conduction of action potentials at nodes of Ranvier" }
    status: unverified
