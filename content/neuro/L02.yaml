  - id: neuro.L02.010
    kind: card
    topic: cns-glial-cells
    front: "What are ependymal cells, and where are they?"
    back: "Glial cells that form a single layer of ciliated columnar cells over the inner surface of the ventricles and the spinal cord's central canal."
