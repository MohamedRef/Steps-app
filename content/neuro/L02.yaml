  # ---------- p505: neuronal response to axonal injury ----------
  - id: neuro.L02.029
    kind: card
    topic: neuronal-response-to-axonal-injury
    front: "What is chromatolysis?"
    back: "After axonal injury, the Nissl substance spreads out through the cytoplasm, so the RER no longer shows on staining."
