  # ---------- p558: INO ----------
  - id: neuro.L05.076
    kind: card
    topic: internuclear-ophthalmoplegia
    front: What is the medial longitudinal fasciculus, and why is it vulnerable in multiple sclerosis?
    back: "A pair of tracts linking the CN VI and CN III nuclei so both eyes move in the same horizontal direction. It is highly myelinated (must signal fast), so demyelination (MS) hits it; bilateral lesions are classic for MS, also stroke."
    src: { page: 558, quote: "Highly myelinated (must communicate quickly so eyes move at same time)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.077
