  # ---------- p549: vertigo, eye anatomy, conjunctivitis ----------
  - id: neuro.L05.001
    kind: card
    topic: vertigo
    front: What is vertigo, and which kind is more common?
    back: "A sensation of spinning while actually stationary, a subtype of dizziness distinct from lightheadedness. Peripheral vertigo is more common than central."
    src: { page: 549, quote: "Sensation of spinning while actually stationary. Subtype of “dizziness,” but distinct from “lightheadedness.” Peripheral vertigo is more common than central vertigo." }
    status: unverified
  - id: neuro.L05.002
    kind: card
    topic: vertigo
    front: What is benign paroxysmal positional vertigo, and how is it diagnosed and treated?
    back: "Semicircular canal debris → episodic vertigo lasting ≤1 minute, provoked by certain head movements. Diagnosed with the Dix-Hallpike maneuver, treated with the Epley maneuver."
    src: { page: 549, quote: "episodic vertigo lasting ≤1 minute provoked by certain head movements (diagnosed via Dix-Hallpike maneuver, treated via Epley maneuver)" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.003
    kind: enumerate
    topic: vertigo
    prompt: Enumerate the triad of Ménière disease (endolymphatic hydrops, 3).
    points:
      - Vertigo
      - Sensorineural hearing loss
      - Tinnitus
    pass: 3
    hook: "«Men wear vests»: Ménière = vertigo + sensorineural loss + tinnitus، من ↑ endolymph في الودن الداخلية."
    src: { page: 549, quote: "triad of vertigo, sensorineural hearing loss, tinnitus (“men wear vests”)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.004
    kind: table
    topic: vertigo
    title: Peripheral vs central vertigo
    columns: [Feature, Peripheral, Central]
    rows:
      - [Cause, "Inner ear (vestibular neuritis, BPPV, Ménière disease)", "Brainstem or cerebellum (stroke, demyelination, posterior fossa tumor)"]
      - [Nystagmus direction, "Mixed horizontal-torsional, never purely torsional or vertical; does not change direction", Any direction]
      - [Visual fixation, Suppresses nystagmus, Does not suppress]
      - [Other neurologic signs, None, "Diplopia, ataxia, dysmetria"]
    blanks: [[1, 1], [2, 1], [2, 2], [3, 2]]
    src: { page: 549, quote: "Findings: nystagmus of any direction that is not suppressible with visual fixation, neurologic findings (eg, diplopia, ataxia, dysmetria)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.005
    kind: mcq
    topic: vertigo
    stem: >-
      A 58-year-old man with hypertension has 6 hours of continuous spinning vertigo and vomiting. He has purely vertical
      nystagmus that does not lessen when he fixes his gaze on a target, and he cannot walk heel to toe; his finger-to-nose
      test is clumsy on the left. Hearing is normal. What is the most likely location of the lesion?
    options:
      - Brainstem or cerebellum
      - Semicircular canal
      - Vestibular nerve
      - Endolymphatic sac
      - Cochlea
    answer: 0
    why:
      - "Right. Purely vertical nystagmus not suppressed by fixation, with ataxia and dysmetria, points to central vertigo (eg, cerebellar or brainstem stroke)."
      - "Canal debris (BPPV) gives brief episodes on head movement with horizontal-torsional nystagmus."
      - "Vestibular neuritis is peripheral: nystagmus is suppressed by fixation and there is no dysmetria."
      - "Ménière disease brings hearing loss and tinnitus."
      - "Cochlear disease affects hearing, which is normal here."
    src: { page: 549, quote: "Due to brainstem or cerebellar lesions (eg, stroke affecting vestibular nuclei, demyelinating disease, or posterior fossa tumor)." }
    status: unverified
  - id: neuro.L05.006
    kind: table
    topic: normal-eye-anatomy
    title: Layers of the eye wall
    columns: [Layer, Front of the eye, Back of the eye]
    rows:
      - [Outer, Cornea, Sclera]
      - [Middle, "Iris, ciliary body", Choroid]
      - [Inner, "—", Retina]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 2]]
    src: { page: 549, quote: "Choroid (middle) Vitreous chamber Cornea (outer) Iris (middle)" }
    status: unverified
  - id: neuro.L05.007
    kind: card
    topic: normal-eye-anatomy
    front: What makes up the anterior segment of the eye, and what separates its two chambers?
    back: "The anterior chamber (between cornea and iris) and the posterior chamber (between iris and lens). The vitreous chamber behind the lens belongs to the posterior segment."
    src: { page: 549, quote: "ANTERIOR SEGMENT (anterior chamber + posterior chamber)" }
    status: unverified
  - id: neuro.L05.008
    kind: table
    topic: conjunctivitis
    title: Conjunctivitis
    columns: [Type, Clues, Management]
    rows:
      - [Allergic, "Itchy, bilateral", "—"]
      - [Bacterial, Purulent discharge, Antibiotics]
      - [Viral (most common), "Adenovirus; sparse mucous discharge, swollen preauricular node, ↑ lacrimation", Self-resolving]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 549, quote: "Viral—most common, often adenovirus; sparse mucous discharge, swollen preauricular node, ↑ lacrimation; self-resolving." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.009
    kind: table
    topic: conjunctivitis
    title: Neonatal conjunctivitis
    columns: [Cause, Onset after birth, Treatment]
    rows:
      - [C trachomatis serotypes D-K (most common), 5-14 days, Erythromycin or azithromycin]
      - [N gonorrhoeae, 2-5 days, "Ceftriaxone (prophylaxis: erythromycin eyedrops)"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 549, quote: "N gonorrhoeae—onset 2-5 days after birth; prophylaxis: erythromycin eyedrops; treat with ceftriaxone to prevent blindness." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.086
    kind: cloze
    topic: conjunctivitis
    text: "Neonatal conjunctivitis: bacterial causes are detected with {{c1::NAAT}}; {{c2::maternal prenatal screening and treatment}} ↓ incidence; other pathogens include HSV and {{c3::adenovirus}}."
    src: { page: 549, quote: "Detect bacterial etiologies with NAAT. Maternal prenatal screening and treatment ↓ incidence." }
    status: unverified
  - id: neuro.L05.010
    kind: mcq
    topic: conjunctivitis
    stem: >-
      A 9-day-old girl born vaginally has 2 days of swollen eyelids with watery-then-mucopurulent discharge from both eyes.
      She received erythromycin eye ointment at birth. Her mother had no prenatal care. Nucleic acid amplification of the
      discharge is positive. Which treatment is most appropriate?
    options:
      - Oral erythromycin or azithromycin
      - IM ceftriaxone
      - Topical erythromycin alone
      - IV acyclovir
      - No treatment; it will self-resolve
    answer: 0
    why:
      - "Right. Onset at 5-14 days fits C trachomatis (serotypes D-K), the most common cause; treat with erythromycin or azithromycin."
      - "Ceftriaxone treats gonococcal conjunctivitis, which starts earlier (2-5 days)."
      - "Topical prophylaxis does not reliably prevent or treat chlamydial disease."
      - "HSV is possible but the timing and NAAT for bacteria point to chlamydia."
      - "Self-resolution fits viral conjunctivitis in older children, not neonatal chlamydia."
    src: { page: 549, quote: "C trachomatis serotypes D-K (most common)—onset 5-14 days after birth; treat with erythromycin or azithromycin." }
    status: unverified
  # ---------- p550: lens, refraction, aqueous humor ----------
  - id: neuro.L05.011
    kind: card
    topic: lens-disorders
    front: What is presbyopia?
    back: "Age-related impairment of accommodation (focusing on near objects), likely from ↓ lens elasticity. Patients need reading glasses or magnifiers."
    src: { page: 550, quote: "Aging-related impairment in accommodation (focusing on near objects)." }
    status: unverified
  - id: neuro.L05.012
    kind: card
    topic: lens-disorders
    front: How does a cataract present, and how is it treated?
    back: "Painless, often bilateral lens opacification: glare, loss of red reflex, ↓ vision especially at night. Treatment: surgical replacement with an artificial lens."
    src: { page: 550, quote: "Painless, often bilateral, opacification of lens A . Can result in glare, loss of red reflex, and ↓ vision, especially at night." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.013
    kind: table
    topic: lens-disorders
    title: Risk factors for cataract
    columns: [Type, Risk factors]
    rows:
      - [Acquired, "↑ age, smoking, alcohol overuse, excessive sunlight, prolonged glucocorticoids, diabetes mellitus, trauma, infection"]
      - [Congenital, "Classic galactosemia, galactokinase deficiency, trisomies 13/18/21, TORCH (rubella), Marfan, Alport, myotonic dystrophy, NF-2"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 550, quote: "Congenital risk factors: classic galactosemia, galactokinase deficiency, trisomies (13, 18, 21), TORCH infections (eg, rubella), Marfan syndrome, Alport syndrome, myotonic dystrophy, NF-2." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.014
    kind: card
    topic: lens-disorders
    front: What is ectopia lentis, and with which systemic diseases does it occur?
    back: "Lens dislocation, usually from trauma, but also with Marfan syndrome and homocystinuria."
    src: { page: 550, quote: "Usually due to trauma, but may occur in association with systemic diseases (eg, Marfan syndrome, homocystinuria)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.015
    kind: table
    topic: refractive-errors
    title: Refractive errors
    columns: [Error, Problem, Focus, Correction]
    rows:
      - [Myopia (most common), Eye too long, In front of retina, Concave (diverging) lens]
      - [Hyperopia, Eye too short, Behind retina, Convex (converging) lens]
      - [Astigmatism, Irregular curvature of cornea or lens, Different at different axes, Cylindrical lens]
    blanks: [[0, 2], [0, 3], [1, 3], [2, 3]]
    src: { page: 550, quote: "Eye too long for refractive power of cornea and lens → light focused in front of retina. Correct with concave (diverging) lens." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.087
    kind: card
    topic: refractive-errors
    front: What is First Aid's mnemonic for the lenses that correct refractive errors?
    back: "\"My cave 'hy'-des (hides) vexed cylinders\": myopia → concave, hyperopia → convex, astigmatism → cylindrical."
    src: { page: 550, quote: "My cave “hy”-des (hides) vexed cylinders." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.016
    kind: card
    topic: aqueous-humor-pathway
    front: Where is aqueous humor made, and which drugs reduce its production?
    back: "By the nonpigmented epithelium of the ciliary body. ↓ by β-blockers (timolol), α2-agonists (brimonidine) and carbonic anhydrase inhibitors (acetazolamide)."
    src: { page: 550, quote: "Produced by nonpigmented epithelium on ciliary body" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.017
    kind: order
    topic: aqueous-humor-pathway
    prompt: Put the trabecular (main, 90%) outflow of aqueous humor in order.
    steps:
      - Ciliary body makes aqueous humor in the posterior chamber
      - Through the pupil into the anterior chamber
      - Trabecular meshwork at the angle
      - Canal of Schlemm
      - Episcleral vessels
    src: { page: 550, quote: "Drainage through trabecular meshwork canal of Schlemm episcleral vasculature" }
    status: unverified
  - id: neuro.L05.018
    kind: table
    topic: aqueous-humor-pathway
    title: Aqueous outflow and drugs that increase it
    columns: [Route, Share, Increased by]
    rows:
      - [Trabecular (meshwork → canal of Schlemm), 90%, "M3 agonists (carbachol, pilocarpine)"]
      - [Uveoscleral (uvea and sclera), 10%, "Prostaglandin agonists (latanoprost, bimatoprost)"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 550, quote: "Drainage into uvea and sclera with prostaglandin agonists (eg, latanoprost, bimatoprost)" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.020
    kind: mcq
    topic: refractive-errors
    stem: >-
      A 12-year-old boy cannot read the board from the back of the classroom but reads his books without difficulty.
      Ophthalmologic examination shows that parallel light focuses in front of his retina. Which lens corrects this?
    options:
      - Concave (diverging) lens
      - Convex (converging) lens
      - Cylindrical lens
      - Bifocal reading lens for presbyopia
      - Artificial lens implant
    answer: 0
    why:
      - "Right. Myopia: the eye is too long, light focuses in front of the retina, and a concave lens moves the focus back."
      - "Convex lenses correct hyperopia, where light focuses behind the retina."
      - "Cylindrical lenses correct astigmatism."
      - "Presbyopia is age-related loss of near focus, not a problem at 12."
      - "Lens replacement treats cataract."
    src: { page: 550, quote: "Correct with concave (diverging) lens." }
    status: unverified
  - id: neuro.L05.021
    kind: mcq
    topic: lens-disorders
    stem: >-
      A 4-week-old infant has jaundice, vomiting after feeds and hepatomegaly. Examination shows absent red reflexes in
      both eyes. Urine tests positive for reducing substances but negative on a glucose oxidase strip. What is the cause
      of the eye finding?
    options:
      - Galactitol accumulation in the lens
      - Retinoblastoma
      - Lens dislocation from fibrillin defect
      - Glaucoma from trabecular dysgenesis
      - Congenital rubella retinitis
    answer: 0
    why:
      - "Right. Classic galactosemia is a congenital cataract risk: galactitol builds up in the lens and opacifies it."
      - "Retinoblastoma gives leukocoria but no galactosemia picture."
      - "Fibrillin defects (Marfan) dislocate the lens rather than opacify it."
      - "Glaucoma does not explain jaundice and reducing sugars."
      - "Rubella causes cataract too, but not with reducing sugars in urine."
    src: { page: 550, quote: "Congenital risk factors: classic galactosemia, galactokinase deficiency" }
    status: unverified
  - id: neuro.L05.022
    kind: mcq
    topic: aqueous-humor-pathway
    stem: >-
      A 66-year-old man with open-angle glaucoma is started on latanoprost eye drops, and his
      intraocular pressure falls. By which route does this drug lower his intraocular pressure?
    options:
      - "↑ uveoscleral outflow (drainage into the uvea and sclera)"
      - "↑ trabecular outflow through the canal of Schlemm"
      - "↓ aqueous production by the nonpigmented ciliary epithelium"
      - "↑ flow of aqueous through the pupil into the anterior chamber"
      - "↑ drainage into the vitreous chamber"
    answer: 0
    why:
      - "Right. Prostaglandin agonists (latanoprost, bimatoprost) ↑ uveoscleral outflow, the 10% route into the uvea and sclera."
      - "Trabecular outflow (90%) is increased by M3 agonists such as pilocarpine and carbachol."
      - "Production is reduced by β-blockers (timolol), α2-agonists (brimonidine) and carbonic anhydrase inhibitors (acetazolamide)."
      - "Flow through the pupil matters in angle-closure (pupillary block), not in how latanoprost works."
      - "Aqueous does not drain into the vitreous chamber; it leaves through the trabecular and uveoscleral routes."
    src: { page: 550, quote: "Drainage into uvea and sclera with prostaglandin agonists (eg, latanoprost, bimatoprost)" }
    status: unverified
  # ---------- p551: glaucoma ----------
  - id: neuro.L05.023
    kind: card
    topic: glaucoma
    front: What is glaucoma, and what does funduscopy show?
    back: "Optic neuropathy with progressive vision loss (peripheral → central), usually but not always with ↑ IOP. Most often 1°, sometimes 2° (uveitis, glucocorticoids). Funduscopy: optic disc cupping (thinning of the outer rim)."
    src: { page: 551, quote: "Optic neuropathy causing progressive vision loss (peripheral → central). Usually, but not always, accompanied by ↑ intraocular pressure (IOP)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.088
    kind: cloze
    topic: glaucoma
    text: "Glaucoma is an optic neuropathy causing progressive vision loss from {{c1::peripheral}} to {{c2::central}}."
    src: { page: 551, quote: "Optic neuropathy causing progressive vision loss (peripheral → central)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.024
    kind: card
    topic: glaucoma
    front: What is open-angle glaucoma, who gets it, and how is it treated?
    back: "Angle is open; ↑ resistance to drainage through the trabecular meshwork. Most common type in the US. Risk factors: ↑ age, Black race, family history, diabetes. Usually asymptomatic, found incidentally. Treat with prostaglandins or β-blockers."
    src: { page: 551, quote: "Associated with ↑ resistance to aqueous humor drainage through trabecular meshwork." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.025
    kind: order
    topic: glaucoma
    prompt: Put the mechanism of angle-closure glaucoma in order.
    steps:
      - Anteriorly displaced lens rests against the central iris
      - ↓ aqueous flow through the pupil (pupillary block)
      - Pressure builds up in the posterior chamber
      - Peripheral iris is pushed against the cornea
      - Iris obstructs the drainage pathways
    src: { page: 551, quote: "↓ aqueous flow through pupil (pupillary block) → pressure buildup in posterior chamber → peripheral iris pushed against cornea → obstruction of drainage pathways by the iris." }
    status: unverified
  - id: neuro.L05.089
    kind: cloze
    topic: glaucoma
    text: "Angle-closure glaucoma is usually {{c1::chronic and asymptomatic}}, but may develop acutely."
    src: { page: 551, quote: "Usually chronic and asymptomatic, but may develop acutely." }
    status: unverified
  - id: neuro.L05.026
    kind: card
    topic: glaucoma
    front: How does acute angle-closure glaucoma present?
    back: "Severe eye pain, conjunctival erythema, sudden vision loss, halos around lights, headache, fixed mid-dilated pupil, nausea and vomiting. «Hurts in a hurry with halos, a headache, and a half-dilated pupil.» A true ophthalmic emergency."
    src: { page: 551, quote: "Presents with severe eye pain, conjunctival erythema C , sudden vision loss, halos around lights, headache, fixed and mid-dilated pupil, nausea and vomiting." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.027
    kind: cloze
    topic: glaucoma
    text: "In acute angle-closure glaucoma, {{c1::mydriatic agents}} are contraindicated; treat with β-blocker, α2-agonist, {{c2::pilocarpine}}, {{c3::acetazolamide}}, mannitol."
    src: { page: 551, quote: "Mydriatic agents are contraindicated. Treat with β-blocker, α2 -agonist, pilocarpine, acetazolamide, mannitol." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.028
    kind: mcq
    topic: glaucoma
    stem: >-
      A 67-year-old woman is given dilating drops for a fundus examination. One hour later she has severe right eye pain,
      blurred vision with colored halos around lights, headache and vomiting. The right eye is red with a hazy cornea and a
      fixed, mid-dilated pupil, and the globe is rock hard. Which drug is contraindicated now?
    options:
      - Tropicamide
      - Timolol
      - Pilocarpine
      - Acetazolamide
      - Mannitol
    answer: 0
    why:
      - "Right. Acute angle-closure glaucoma: mydriatics (like tropicamide, which likely triggered it) push the iris further into the angle and are contraindicated."
      - "Timolol ↓ aqueous production and is part of treatment."
      - "Pilocarpine constricts the pupil and pulls the iris out of the angle."
      - "Acetazolamide ↓ aqueous production."
      - "Mannitol lowers IOP osmotically."
    src: { page: 551, quote: "True ophthalmic emergency that requires immediate management to prevent blindness. Mydriatic agents are contraindicated." }
    status: unverified
  # ---------- p552-553: retinal disorders ----------
  - id: neuro.L05.029
    kind: table
    topic: retinal-disorders
    title: Age-related macular degeneration
    columns: [Type, Course, Finding]
    rows:
      - [Dry (most common), Gradual ↓ vision, Subretinal deposits (drusen)]
      - [Wet, Rapid ↓ vision, "Bleeding from choroidal neovascularization; metamorphopsia early"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 552, quote: "Wet—rapid ↓ in vision due to bleeding 2° to choroidal neovascularization." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.030
    kind: card
    topic: retinal-disorders
    front: What visual loss does macular degeneration cause, and what is its early wet symptom?
    back: "Loss of central vision (scotomas), since the macula is the central retina. Distortion of straight lines (metamorphopsia) is an early symptom of the wet type."
    src: { page: 552, quote: "Distortion of straight lines (metamorphopsia) is an early symptom." }
    status: unverified
  - id: neuro.L05.031
    kind: table
    topic: retinal-disorders
    title: Diabetic retinopathy
    columns: [Type, Findings, Main threat]
    rows:
      - ["Nonproliferative (most common)", "Microaneurysms, hemorrhages, cotton-wool spots, hard exudates", Macular edema]
      - [Proliferative, Retinal neovascularization from chronic hypoxia, "Vitreous hemorrhage, tractional retinal detachment"]
    blanks: [[0, 2], [1, 1], [1, 2]]
    src: { page: 552, quote: "Proliferative—retinal neovascularization due to chronic hypoxia. Abnormal new vessels may cause vitreous hemorrhage and tractional retinal detachment." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.032
    kind: card
    topic: retinal-disorders
    front: What does funduscopy show in hypertensive retinopathy, and which sign means an emergency?
    back: "Arteriovenous nicking, microaneurysms, hemorrhages, cotton-wool spots, hard exudates (may form a macular star). Papilledema means hypertensive emergency: lower blood pressure immediately."
    src: { page: 552, quote: "Presence of papilledema is indicative of hypertensive emergency and warrants immediate lowering of blood pressure." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.090
    kind: cloze
    topic: retinal-disorders
    text: "Hypertensive retinopathy: chronic hypertension → {{c1::spasm}}, {{c2::sclerosis}}, and {{c3::fibrinoid necrosis}} of retinal vessels."
    src: { page: 552, quote: "Chronic hypertension → spasm, sclerosis, and fibrinoid necrosis of retinal vessels." }
    status: unverified
  - id: neuro.L05.033
    kind: card
    topic: retinal-disorders
    front: What causes retinal artery occlusion, and what does it look like?
    back: "Usually embolism (carotid atherosclerosis > cardiogenic), less often giant cell arteritis. Acute painless monocular vision loss. Funduscopy: cloudy retina with a cherry-red spot at the fovea; emboli may be seen (cholesterol crystals = yellow refractile deposits)."
    src: { page: 552, quote: "Presents with acute, painless monocular vision loss. Funduscopy: cloudy retina with “cherry-red” spot at fovea D" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.034
    kind: card
    topic: retinal-disorders
    front: What causes central vs branch retinal vein occlusion, and what is the fundus picture?
    back: "Central: 1° thrombosis. Branch: 2° thrombosis at arteriovenous crossings (a sclerotic arteriole compresses the venule). Funduscopy: retinal hemorrhage and venous engorgement («blood and thunder»), retinal edema."
    src: { page: 552, quote: "Funduscopy: retinal hemorrhage and venous engorgement (“blood and thunder” appearance; arrows in E ), retinal edema in affected areas." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.035
    kind: card
    topic: retinal-disorders
    front: What is retinal detachment, and how does it present?
    back: "Separation of the neurosensory retina from the retinal pigment epithelium → loss of choroidal supply → photoreceptor degeneration. Rhegmatogenous (most common, retinal tears, posterior vitreous detachment; age, high myopia) or tractional/exudative. Floaters and flashes, then painless monocular «dark curtain». Surgical emergency."
    src: { page: 552, quote: "Commonly presents with symptoms of posterior vitreous detachment (eg, floaters, light flashes) followed by painless monocular vision loss (“dark curtain”)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L05.036
    kind: enumerate
    topic: retinal-disorders
    prompt: Enumerate the funduscopic triad of retinitis pigmentosa (3).
    points:
      - Optic disc pallor
      - Retinal vessel attenuation
      - Bone spicule-shaped pigment deposits
