  # ---------- p524: common brain lesions ----------
  - id: neuro.L03.001
    kind: card
    topic: common-brain-lesions
    front: What is frontal lobe syndrome, and where is the lesion?
    back: "A lesion of the prefrontal cortex. Patients lose inhibition and empathy, overeat, act on impulse, cannot plan or organize, and may become akinetic and mute. It is seen in frontotemporal dementia."
    src: { page: 524, quote: "Frontal lobe syndrome—disinhibition, hyperphagia, impulsivity, loss of empathy, impaired executive function, akinetic mutism. Seen in frontotemporal dementia." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.002
    kind: table
    topic: common-brain-lesions
    title: Gaze deviation by lesion site
    columns: [Lesion, Eyes look]
    rows:
      - ["Frontal eye fields (eg, MCA stroke)", "Toward the brain lesion (away from the hemiplegia)"]
      - [Paramedian pontine reticular formation, "Away from the brain lesion (toward the hemiplegia)"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 524, quote: "Frontal eye fields Eyes look toward brain lesion (ie, away from side of hemiplegia). Seen in MCA stroke. Paramedian pontine reticular formation Eyes look away from brain lesion (ie, toward side of hemiplegia)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.003
    kind: enumerate
    topic: common-brain-lesions
    prompt: Enumerate the features of Gerstmann syndrome (dominant parietal cortex, 4).
    points:
      - Agraphia
      - Acalculia
      - Finger agnosia
      - Left-right disorientation
    pass: 4
    hook: "Gerstmann مش عارف «يكتب ويحسب ويعدّ صوابعه ويفرّق يمين من شمال»: 4 حاجات بتاعة تلميذ ابتدائي."
    src: { page: 524, quote: "Gerstmann syndrome—agraphia, acalculia, finger agnosia, left-right disorientation." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.004
    kind: table
    topic: common-brain-lesions
    title: Common brain lesions
    columns: [Lesion, Result]
    rows:
      - [Nondominant parietal cortex, Hemispatial neglect (agnosia of the contralateral side of the world)]
      - [Basal ganglia, "Tremor at rest, chorea, athetosis (Parkinson, Huntington)"]
      - [Subthalamic nucleus, Contralateral hemiballismus]
      - [Mammillary bodies (bilateral), Wernicke-Korsakoff syndrome (thiamine deficiency)]
      - [Amygdala (bilateral), "Klüver-Bucy syndrome: disinhibition (hyperphagia, hypersexuality, hyperorality); HSV-1 encephalitis"]
      - [Hippocampus (bilateral), Anterograde amnesia (Alzheimer disease)]
      - [Dorsal midbrain, Parinaud syndrome (often pineal tumors)]
      - [Reticular activating system, "Reduced arousal and wakefulness, coma"]
      - [Medial longitudinal fasciculus, Internuclear ophthalmoplegia (multiple sclerosis)]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [8, 1]]
    src: { page: 524, quote: "Subthalamic nucleus Contralateral hemiballismus. Mammillary bodies Bilateral lesions → Wernicke-Korsakoff syndrome (due to thiamine deficiency)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.005
    kind: card
    topic: common-brain-lesions
    front: What is internuclear ophthalmoplegia, which structure is damaged, and in which disease is it seen?
    back: Impaired adduction of the ipsilateral eye with nystagmus of the contralateral abducting eye, from a medial longitudinal fasciculus lesion. Seen in multiple sclerosis.
    src: { page: 524, quote: "Internuclear ophthalmoplegia (impaired adduction of ipsilateral eye; nystagmus of contralateral eye with abduction). Seen in multiple sclerosis." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.006
    kind: table
    topic: common-brain-lesions
    title: Cerebellar hemisphere vs vermis lesions
    columns: [Lesion, Signs, Note]
    rows:
      - [Cerebellar hemisphere, "Intention tremor, limb ataxia, loss of balance; ipsilateral deficits, falls toward the lesion", Lateral location affects lateral limbs]
      - [Cerebellar vermis, "Truncal ataxia (wide-based \"drunken sailor\" gait), nystagmus, dysarthria", "Central location affects central body; degeneration with chronic alcohol overuse"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 524, quote: "Cerebellar vermis Truncal ataxia (wide-based, “drunken sailor” gait), nystagmus, dysarthria. Degeneration associated with chronic alcohol overuse." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.007
    kind: mcq
    topic: common-brain-lesions
    stem: >-
      A 24-year-old man recovering from HSV-1 encephalitis is very placid, puts inedible objects in his
      mouth, eats constantly and makes inappropriate sexual advances. Bilateral damage to which
      structure best explains his behavior?
    options:
      - Amygdala
      - Hippocampus
      - Mammillary bodies
      - Prefrontal cortex
      - Subthalamic nucleus
    answer: 0
    why:
      - "Right. Bilateral amygdala lesions cause Klüver-Bucy syndrome (hyperorality, hyperphagia, hypersexuality), seen in HSV-1 encephalitis."
      - "Bilateral hippocampal lesions cause anterograde amnesia."
      - "Bilateral mammillary body lesions cause Wernicke-Korsakoff syndrome."
      - "Prefrontal lesions cause frontal lobe syndrome (disinhibition, impulsivity, akinetic mutism) but the book ties hyperorality and hypersexuality after HSV-1 to the amygdala."
      - "Subthalamic lesions cause contralateral hemiballismus."
    src: { page: 524, quote: "Amygdala Bilateral lesions → Klüver-Bucy syndrome—disinhibition (eg, hyperphagia, hypersexuality, hyperorality). Seen in HSV-1 encephalitis." }
    status: unverified
  # ---------- p524: abnormal motor posturing ----------
  - id: neuro.L03.008
    kind: table
    topic: abnormal-motor-posturing
    title: Decorticate vs decerebrate posturing
    columns: ["", Decorticate (flexor), Decerebrate (extensor)]
    rows:
      - [Lesion, Above red nucleus (often cerebral cortex), Between red and vestibular nuclei (brainstem)]
      - [Overactive tracts, Rubrospinal and vestibulospinal, Vestibulospinal]
      - [Presentation, "Upper limb flexion, lower limb extension", Upper and lower limb extension]
      - [Note, "\"Your hands are near the cor (heart)\"", Worse prognosis]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 2]]
    src: { page: 524, quote: "SITE OF LESION Above red nucleus (often cerebral cortex) Between red and vestibular nuclei (brainstem) OVERACTIVE TRACTS Rubrospinal and vestibulospinal tracts Vestibulospinal tract" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.009
    kind: mcq
    topic: abnormal-motor-posturing
    stem: >-
      A 30-year-old man with a severe head injury has all four limbs rigidly extended, with arms
      internally rotated, in response to a painful stimulus. Where is his lesion, and what does this
      posture imply?
    options:
      - Between the red and vestibular nuclei; worse prognosis
      - Above the red nucleus; better prognosis
      - In the cerebellar vermis; truncal ataxia
      - In the subthalamic nucleus; hemiballismus
      - In the spinal cord below C5; flaccid paralysis
    answer: 0
    why:
      - "Right. Decerebrate (extensor) posturing: lesion in the brainstem between the red and vestibular nuclei, unopposed vestibulospinal tract; worse prognosis."
      - "A lesion above the red nucleus gives decorticate posturing: arms flexed (hands near the cor)."
      - "Vermis lesions cause truncal ataxia, not posturing."
      - "Subthalamic lesions cause contralateral hemiballismus."
      - "A complete cord injury at C5 gives flaccid (later spastic) paralysis below the level with a sensory level; it cannot produce a reflex posture of the arms, which needs brainstem motor nuclei above the cord."
    src: { page: 524, quote: "Between red and vestibular nuclei (brainstem)" }
    status: unverified
  # ---------- p525: ischemic brain disease ----------
  - id: neuro.L03.010
    kind: card
    topic: ischemic-brain-disease
    front: When does irreversible neuronal injury begin in hypoxia, and which areas are most vulnerable?
    back: "Once hypoxia passes 5 minutes. The most sensitive regions: CA1 of the hippocampus, the neocortex, cerebellar Purkinje cells and the watershed zones (\"vulnerable hippos need pure water\")."
    src: { page: 525, quote: "Irreversible neuronal injury begins after 5 minutes of hypoxia. Most vulnerable: hippocampus (CA1 region), neocortex, cerebellum (Purkinje cells), watershed areas (“vulnerable hippos need pure water”)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.011
    kind: card
    topic: ischemic-brain-disease
    front: Why is noncontrast CT done first in stroke, and how soon do CT and diffusion-weighted MRI show ischemia?
    back: To exclude hemorrhage before tPA can be given. CT detects ischemic changes in 6-24 hours; diffusion-weighted MRI within 3-30 minutes.
    src: { page: 525, quote: "Stroke imaging: noncontrast CT to exclude hemorrhage (before tPA can be given). CT detects ischemic changes in 6-24 hr. Diffusion-weighted MRI can detect ischemia within 3-30 min." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.012
    kind: table
    topic: ischemic-brain-disease
    title: Histology after ischemic stroke
    columns: [Time, Histologic features]
    rows:
      - [12-24 hours, Eosinophilic cytoplasm + pyknotic nuclei (red neurons)]
      - [24-72 hours, Necrosis + neutrophils]
      - [3-5 days, Macrophages (microglia)]
      - [1-2 weeks, Reactive gliosis (astrocytes) + vascular proliferation]
      - [">2 weeks", Glial scar]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 525, quote: "Eosinophilic cytoplasm + pyknotic nuclei (red neurons) Necrosis + neutrophils Macrophages (microglia) Reactive gliosis (astrocytes) + vascular proliferation Glial scar" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.013
    kind: mcq
    topic: ischemic-brain-disease
    stem: >-
      A 70-year-old woman dies 4 days after a large left MCA stroke. Microscopy of the infarcted cortex
      would most likely show which predominant cell type?
    options:
      - Macrophages (microglia)
      - Neutrophils
      - Red neurons only
      - Reactive astrocytes with new vessels
      - A dense glial scar
    answer: 0
    why:
      - "Right. At 3-5 days, macrophages (microglia) predominate."
      - "Neutrophils with necrosis predominate at 24-72 hours."
      - "Red neurons (eosinophilic cytoplasm, pyknotic nuclei) are seen at 12-24 hours."
      - "Reactive gliosis with vascular proliferation comes at 1-2 weeks."
      - "A glial scar forms after 2 weeks."
    src: { page: 525, quote: "Eosinophilic cytoplasm + pyknotic nuclei (red neurons) Necrosis + neutrophils Macrophages (microglia)" }
    status: unverified
  # ---------- p525: ischemic stroke ----------
  - id: neuro.L03.014
    kind: card
    topic: ischemic-stroke
    front: What type of necrosis follows brain infarction?
    back: Liquefactive necrosis (ischemia → infarction → liquefactive necrosis).
    src: { page: 525, quote: "Ischemia → infarction → liquefactive necrosis." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.015
    kind: table
    topic: ischemic-stroke
    title: Types of ischemic stroke
    columns: [Type, Cause, Examples / features]
    rows:
      - [Thrombotic, "Clot forming at the site of infarction, usually over a ruptured atherosclerotic plaque", Commonly the MCA]
      - [Embolic, "Embolus from elsewhere; can affect multiple vascular territories", "Atrial fibrillation, carotid stenosis, DVT with PFO (paradoxical), infective endocarditis"]
      - [Hypoxic, Systemic hypoperfusion or hypoxemia, "Cardiovascular surgery; watershed areas"]
    blanks: [[0, 1], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 525, quote: "Embolic—due to an embolus from another part of the body. Can affect multiple vascular territories. Examples: atrial fibrillation, carotid artery stenosis, DVT with patent foramen ovale (paradoxical embolism), infective endocarditis." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.016
    kind: card
    topic: ischemic-stroke
    front: When is tPA given for ischemic stroke, and when is thrombectomy used?
    back: tPA within 3-4.5 hours of onset with no hemorrhage or risk of hemorrhage; thrombectomy for a large artery occlusion.
    src: { page: 525, quote: "Treatment: tPA (if within 3-4.5 hr of onset and no hemorrhage/risk of hemorrhage) and/or thrombectomy (if large artery occlusion)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.017
    kind: card
    topic: ischemic-stroke
    front: How is the risk of further ischemic stroke reduced?
    back: "Medical therapy (aspirin, clopidogrel); optimum control of blood pressure, blood sugars and lipids; smoking cessation; and treating conditions that ↑ risk (atrial fibrillation, carotid artery stenosis)."
    src: { page: 525, quote: "Reduce risk with medical therapy (eg, aspirin, clopidogrel); optimum control of blood pressure, blood sugars, lipids; smoking cessation; and treat conditions that ↑ risk (eg, atrial fibrillation, carotid artery stenosis)." }
    status: unverified
  - id: neuro.L03.018
    kind: mcq
    topic: ischemic-stroke
    stem: >-
      A 72-year-old man with an irregularly irregular pulse has sudden right arm weakness and aphasia.
      A week later he develops left leg weakness from a second infarct in the right ACA territory.
      Which mechanism best explains infarcts in two different vascular territories?
    options:
      - Embolism
      - Thrombosis over a ruptured plaque
      - Systemic hypoperfusion
      - Lipohyalinosis of small penetrating arteries
      - Venous sinus thrombosis
    answer: 0
    why:
      - "Right. Embolic strokes can affect multiple vascular territories; atrial fibrillation is a classic source."
      - "Thrombotic stroke forms at one site over a plaque, commonly the MCA."
      - "Hypoperfusion affects watershed areas, typically during cardiovascular surgery."
      - "Lipohyalinosis causes small lacunar infarcts in the lenticulostriate territory."
      - "Venous sinus thrombosis presents with ↑ ICP and venous hemorrhage."
    src: { page: 525, quote: "Can affect multiple vascular territories. Examples: atrial fibrillation, carotid artery stenosis" }
    status: unverified
  # ---------- p525: TIA ----------
  - id: neuro.L03.019
    kind: card
    topic: transient-ischemic-attack
    front: What is a transient ischemic attack?
    back: "Focal neurologic symptoms from ischemia (eg, an embolus or small vessel stenosis) that go away on their own, usually within 15 minutes, with no infarct on MRI."
    src: { page: 525, quote: "Brief, reversible episode of focal neurologic dysfunction without acute infarction (⊝ MRI), with the majority resolving in <15 minutes; ischemia (eg, embolus, small vessel stenosis)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.020
    kind: mcq
    topic: transient-ischemic-attack
    stem: >-
      A 66-year-old man had a 5-minute episode in which a curtain came down over his right eye, then
      cleared completely. Examination and MRI of the brain are normal. A bruit is heard over the right
      neck. What is the most likely cause of his visual loss?
    options:
      - Retinal artery emboli from carotid artery disease
      - Optic neuritis from demyelination
      - Occipital lobe infarction
      - Acute angle-closure glaucoma
      - Papilledema from ↑ ICP
    answer: 0
    why:
      - "Right. Amaurosis fugax (transient monocular visual loss) is a TIA from retinal artery emboli from carotid artery disease."
      - "Optic neuritis is painful and lasts days, not minutes."
      - "An occipital infarct would show on MRI and affect a visual field, not one eye."
      - "Angle-closure glaucoma is painful with a red eye."
      - "Papilledema causes brief obscurations with ↑ ICP, not a carotid bruit picture."
    src: { page: 525, quote: "May present with amaurosis fugax (transient visual loss) due to retinal artery emboli from carotid artery disease." }
    status: unverified
  # ---------- p525: cerebral edema ----------
  - id: neuro.L03.021
    kind: table
    topic: cerebral-edema
    title: Cytotoxic vs vasogenic edema
    columns: ["", Cytotoxic, Vasogenic]
    rows:
      - [Where, Intracellular, Extracellular]
      - [Mechanism, "Osmotic shift (Na+/K+-ATPase dysfunction → ↑ intracellular Na+)", Disruption of the BBB (↑ permeability)]
      - [Causes, "Ischemia (early), hyperammonemia, SIADH", "Ischemia (late), trauma, hemorrhage, inflammation, tumors"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 525, quote: "Cytotoxic edema—intracellular fluid accumulation due to osmotic shift (eg, Na+ /K+ -ATPase dysfunction → ↑ intracellular Na+ ). Caused by ischemia (early), hyperammonemia, SIADH." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.022
    kind: mcq
    topic: cerebral-edema
    stem: >-
      A 55-year-old man with a lung mass has headaches. MRI shows a ring-enhancing lesion in the right
      frontal lobe surrounded by a large zone of T2 hyperintensity in the white matter. What is the
      mechanism of the surrounding fluid?
    options:
      - Breakdown of the blood-brain barrier with extracellular fluid
      - Na+/K+-ATPase failure with intracellular swelling
      - Obstruction of CSF outflow
      - Hyperammonemia drawing water into astrocytes
      - Excess ADH causing hyponatremia
    answer: 0
    why:
      - "Right. Tumors cause vasogenic edema: extracellular fluid from ↑ BBB permeability."
      - "That is cytotoxic edema (early ischemia, hyperammonemia, SIADH)."
      - "CSF obstruction gives hydrocephalus, not edema around a mass."
      - "Hyperammonemia causes cytotoxic edema."
      - "SIADH causes cytotoxic edema."
    src: { page: 525, quote: "Vasogenic edema—extracellular fluid accumulation due to disruption of BBB (↑ permeability). Caused by ischemia (late), trauma, hemorrhage, inflammation, tumors" }
    status: unverified
  # ---------- p526-527: effects of strokes ----------
  - id: neuro.L03.023
    kind: card
    topic: effects-of-strokes
    front: What does an anterior cerebral artery stroke cause?
    back: Contralateral paralysis and sensory loss of the lower limb, and urinary incontinence.
    src: { page: 526, quote: "Contralateral paralysis and sensory loss—lower limb, urinary incontinence." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.024
    kind: card
    topic: effects-of-strokes
    front: What does a middle cerebral artery stroke cause?
    back: "Contralateral paralysis and sensory loss of the lower face and upper limb; aphasia if in the dominant (usually left) hemisphere; hemineglect if in the nondominant (usually right) hemisphere."
    src: { page: 526, quote: "Contralateral paralysis and sensory loss—lower face and upper limb. Aphasia if in dominant (usually left) hemisphere. Hemineglect if lesion affects nondominant (usually right) hemisphere." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.025
    kind: card
    topic: effects-of-strokes
    front: Which visual field defect goes with Wernicke aphasia, and why?
    back: A right superior quadrant visual field defect, from temporal lobe involvement.
    src: { page: 526, quote: "Wernicke aphasia is associated with right superior quadrant visual field defect due to temporal lobe involvement." }
    status: unverified
  - id: neuro.L03.026
    kind: card
    topic: effects-of-strokes
    front: "Lenticulostriate artery stroke: area, symptoms and cause?"
    back: "Striatum and internal capsule: contralateral paralysis without cortical signs (pure motor stroke, the most common lacunar type). Lacunar infarcts from microatheroma and hyaline arteriosclerosis (lipohyalinosis) due to unmanaged hypertension."
    src: { page: 526, quote: "Pure motor stroke (most common). Common location of lacunar infarcts B , due to microatheroma and hyaline arteriosclerosis (lipohyalinosis) 2° to unmanaged hypertension." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.027
    kind: card
    topic: effects-of-strokes
    front: What does a posterior cerebral artery (occipital) stroke cause?
    back: "Contralateral hemianopia with macular sparing; alexia without agraphia (dominant hemisphere, extending to the splenium); prosopagnosia (nondominant hemisphere)."
    src: { page: 526, quote: "Contralateral hemianopia with macular sparing; alexia without agraphia (dominant hemisphere, extending to splenium of corpus callosum); prosopagnosia" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.028
    kind: card
    topic: effects-of-strokes
    front: What is Weber syndrome?
    back: A midbrain stroke from occlusion of paramedian branches of the PCA → ipsilateral CN III palsy and contralateral hemiplegia (ipsilateral cerebral peduncle damage).
    src: { page: 526, quote: "Weber syndrome—midbrain stroke due to occlusion of paramedian branches of PCA → ipsilateral CN III palsy and contralateral hemiplegia (damage to ipsilateral cerebral peduncle)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.029
    kind: card
    topic: effects-of-strokes
    front: "Locked-in syndrome: which artery is occluded, and which areas does it supply?"
    back: "The basilar artery: pons, medulla, lower midbrain."
    src: { page: 526, quote: "Basilar artery Pons, medulla, lower midbrain." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.232
    kind: cloze
    topic: effects-of-strokes
    text: "Basilar artery occlusion can cause {{c1::locked-in syndrome}} (memory aid: \"locked in the basement\" for basilar)."
    src: { page: 526, quote: "Locked-in syndrome (locked in the basement)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.221
    kind: card
    topic: effects-of-strokes
    front: "Which deficits make up locked-in syndrome?"
    back: "Quadriplegia; loss of voluntary facial (except blinking), mouth and tongue movements; loss of horizontal but not vertical eye movements."
    src: { page: 526, quote: "Quadriplegia; loss of voluntary facial (except blinking), mouth, and tongue movements. Loss of horizontal, but not vertical, eye movements." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L03.222
    kind: card
    topic: effects-of-strokes
    front: "In a basilar artery stroke, when is consciousness preserved?"
    back: "When the reticular activating system (RAS) is spared."
    src: { page: 526, quote: "If RAS spared, consciousness is preserved." }
    status: unverified
