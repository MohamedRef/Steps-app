  # ---------- p547: anatomy, otitis ----------
  - id: neuro.L04.001
    kind: table
    topic: auditory-anatomy-and-physiology
    title: Parts of the ear
    columns: [Part, Contents, Role]
    rows:
      - [Outer ear, "Pinna, auditory canal, tympanic membrane", Transfers sound waves via tympanic membrane vibration]
      - [Middle ear, "Air-filled; ossicles (malleus, incus, stapes); eustachian tube to nasopharynx", "Ossicles conduct and amplify sound; tube equalizes pressure"]
      - [Inner ear, "Fluid-filled cochlea with basilar membrane and hair cells", Transduces vibration into auditory nerve signals]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 547, quote: "Air-filled space with three bones called the ossicles (malleus, incus, stapes). Ossicles conduct and amplify sound from tympanic membrane to inner ear." }
    status: unverified
  - id: neuro.L04.002
    kind: card
    topic: auditory-anatomy-and-physiology
    front: "What connects the middle ear to the nasopharynx?"
    back: "The eustachian tube."
    src: { page: 547, quote: "Connected to nasopharynx via Eustachian tube (equalizes pressure)." }
    status: unverified
  - id: neuro.L04.028
    kind: card
    topic: auditory-anatomy-and-physiology
    front: "What does the eustachian tube do for the middle ear?"
    back: "It equalizes the pressure in the middle ear."
    src: { page: 547, quote: "Connected to nasopharynx via Eustachian tube (equalizes pressure)." }
    status: unverified
  - id: neuro.L04.003
    kind: cloze
    topic: auditory-anatomy-and-physiology
    text: "Cochlear tonotopy: low frequencies are heard at the {{c1::apex}} near the helicotrema, where the basilar membrane is {{c2::wide and flexible}}; high frequencies at the {{c3::base}}, where it is thin and rigid."
    src: { page: 547, quote: "Low frequency heard at apex near helicotrema (wide and flexible)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.004
    kind: order
    topic: auditory-anatomy-and-physiology
    prompt: Put the path of sound in order.
    steps:
      - Tympanic membrane vibrates
      - Ossicles conduct and amplify
      - Basilar membrane of the cochlea vibrates
      - Hair cells transduce the vibration
      - Auditory nerve signals the brainstem
    src: { page: 547, quote: "Vibration transduced via specialized hair cells → auditory nerve signaling → brainstem." }
    status: unverified
  - id: neuro.L04.024
    kind: mcq
    topic: auditory-anatomy-and-physiology
    stem: >-
      A 72-year-old man has had slowly worsening hearing in both ears for several years. He can follow
      a man's low voice but misses his granddaughter's high-pitched speech and the doorbell. Otoscopy
      is normal, and audiometry shows symmetric sensorineural loss limited to the high frequencies.
      The damaged hair cells sit on the part of the basilar membrane that has which features?
    options:
      - At the cochlear base, where the membrane is thin and rigid
      - At the cochlear apex, where the membrane is wide and flexible
      - At the cochlear apex, where the membrane is thin and rigid
      - At the cochlear base, where the membrane is wide and flexible
      - Near the helicotrema, where the membrane is thin and rigid
    answer: 0
    why:
      - "Right. High frequencies are heard best at the base (thin and rigid); presbycusis destroys hair cells there first."
      - "The apex (wide and flexible) hears low frequencies, which he keeps."
      - "The apex is wide and flexible, not thin and rigid."
      - "The base is thin and rigid, not wide and flexible."
      - "The helicotrema is at the apex, which is wide and flexible and hears low frequencies."
    src: { page: 547, quote: "High frequency heard best at base of cochlea (thin and rigid)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.035
    kind: card
    topic: auditory-anatomy-and-physiology
    front: "What is cochlear tonotopy?"
    back: "Each sound frequency makes the basilar membrane vibrate at its own specific location (low at the apex, high at the base)."
    src: { page: 547, quote: "Each frequency leads to vibration at specific location on basilar membrane (tonotopy)" }
    status: unverified
  - id: neuro.L04.036
    kind: card
    topic: auditory-anatomy-and-physiology
    front: "What makes up the outer ear, and what does it do?"
    back: "The visible pinna, the auditory canal and the tympanic membrane; it transfers sound waves by vibration of the tympanic membrane."
    src: { page: 547, quote: "Outer ear Visible portion of ear (pinna), includes auditory canal and tympanic membrane. Transfers sound waves via vibration of tympanic membrane." }
    status: unverified
  - id: neuro.L04.005
    kind: card
    topic: otitis-externa
    front: What is the most common cause of otitis externa, and what is it associated with?
    back: "Pseudomonas. Water exposure (swimmer's ear) and ear canal trauma or occlusion (eg, hearing aids)."
    src: { page: 547, quote: "Most commonly due to Pseudomonas. Associated with water exposure (swimmer’s ear), ear canal trauma/occlusion (eg, hearing aids)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.006
    kind: card
    topic: otitis-externa
    front: How does otitis externa present?
    back: "Otalgia that worsens with manipulation of the ear, pruritus, hearing loss, discharge."
    src: { page: 547, quote: "Presents with otalgia that worsens with ear manipulation, pruritus, hearing loss, discharge A ." }
    status: unverified
  - id: neuro.L04.007
    kind: card
    topic: otitis-externa
    front: "What is malignant (necrotizing) otitis externa, and who gets it?"
    back: "An invasive infection causing osteomyelitis; a complication of otitis externa seen mostly in older patients with diabetes."
    src: { page: 547, quote: "Malignant (necrotizing) otitis externa—invasive infection causing osteomyelitis. Complication of otitis externa mostly seen in older patients with diabetes." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.025
    kind: card
    topic: otitis-externa
    front: "How does malignant otitis externa present?"
    back: "Severe otalgia and otorrhea, granulation tissue in the ear canal; it may lead to cranial nerve palsies."
    src: { page: 547, quote: "Presents with severe otalgia and otorrhea. May lead to cranial nerve palsies. Physical exam shows granulation tissue in ear canal." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.008
    kind: mcq
    topic: otitis-externa
    stem: >-
      A 74-year-old man with poorly controlled type 2 diabetes has 3 weeks of severe left ear pain and purulent discharge
      despite antibiotic drops. Examination shows granulation tissue in the floor of the left ear canal and weakness of the
      left side of his face including the forehead. Which organism is most likely?
    options:
      - Pseudomonas aeruginosa
      - Streptococcus pneumoniae
      - Moraxella catarrhalis
      - Nontypeable Haemophilus influenzae
      - Herpes simplex virus 1
    answer: 0
    why:
      - "Right. Malignant otitis externa (osteomyelitis) in an older diabetic, with granulation tissue and a cranial nerve palsy: Pseudomonas."
      - "S pneumoniae causes acute otitis media in children."
      - "M catarrhalis is an otitis media pathogen."
      - "Nontypeable H influenzae is an otitis media pathogen."
      - "HSV-1 reactivation causes Bell palsy, without granulation tissue or otorrhea."
    src: { page: 547, quote: "Presents with severe otalgia and otorrhea. May lead to cranial nerve palsies. Physical exam shows granulation tissue in ear canal." }
    status: unverified
  - id: neuro.L04.009
    kind: enumerate
    topic: otitis-media
    prompt: Enumerate the most common causes of otitis media (3).
    points:
      - Nontypeable H influenzae
      - S pneumoniae
      - M catarrhalis
    pass: 3
    hook: "HSM: Haemophilus و Strep و Moraxella، التلاتة جايين من الـ nasopharynx عن طريق الـ eustachian tube."
    src: { page: 547, quote: "Most common causes: nontypeable H influenzae, S pneumoniae, M catarrhalis." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.010
    kind: card
    topic: otitis-media
    front: "Who gets otitis media, and what predisposes to it?"
    back: "Children aged 6 months to 3 years; eustachian tube dysfunction lets bacteria from the nasopharynx overgrow."
    src: { page: 547, quote: "Associated with eustachian tube dysfunction → bacterial overgrowth from nasopharynx. Common in children aged 6 months to 3 years." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.026
    kind: card
    topic: otitis-media
    front: "How does acute otitis media present, and what can rupture cause?"
    back: "Fever, otalgia, bulging erythematous tympanic membrane; rare rupture → temporary conductive hearing loss."
    src: { page: 547, quote: "Presents with fever, otalgia, bulging erythematous tympanic membrane A → rupture (rare) → temporary conductive hearing loss." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.011
    kind: order
    topic: otitis-media
    prompt: Put the course of mastoiditis in order.
    steps:
      - Acute otitis media
      - Infection spreads to the mastoid air cells
      - Postauricular pain, erythema, swelling
      - Subperiosteal abscess or meningitis
    src: { page: 547, quote: "infection spreads to mastoid air cells → postauricular pain, erythema, swelling → subperiosteal abscess or meningitis." }
    status: unverified
  - id: neuro.L04.012
    kind: mcq
    topic: otitis-media
    stem: >-
      A 2-year-old boy has fever and pulls at his right ear 4 days after a cold. Otoscopy shows a
      red, bulging tympanic membrane. Three weeks later he returns with fever, redness and a tender,
      boggy swelling behind the right ear that pushes the auricle forward. If this infection
      progresses, which complication is he most at risk of?
    options:
      - "Subperiosteal abscess"
      - "Skull base osteomyelitis with cranial nerve palsies"
      - "High-frequency sensorineural hearing loss from basal hair cell loss"
      - "Permanent conductive hearing loss from tympanic membrane rupture"
      - "Ossicle erosion by a painless keratinized cyst"
    answer: 0
    why:
      - "Right. Postauricular pain, redness and swelling after acute otitis media is mastoiditis (infection in the mastoid air cells), which can progress to a subperiosteal abscess or meningitis."
      - "Skull base osteomyelitis with cranial nerve palsies is malignant otitis externa, a Pseudomonas infection of older diabetics."
      - "Loss of hair cells at the cochlear base is presbycusis or noise damage, not a complication of mastoiditis."
      - "Tympanic membrane rupture in otitis media is rare and gives only temporary conductive loss."
      - "Ossicle erosion with painless otorrhea is cholesteatoma, a slow growth of squamous epithelium, not an acute tender swelling behind the ear."
    src: { page: 547, quote: "Mastoiditis—complication of acute otitis media; infection spreads to mastoid air cells → postauricular pain, erythema, swelling → subperiosteal abscess or meningitis." }
    status: unverified
  - id: neuro.L04.037
    kind: card
    topic: otitis-media
    front: "What is otitis media, and what usually comes before it?"
    back: "Inflammation of the middle ear, usually after an upper respiratory infection."
    src: { page: 547, quote: "Inflammation of middle ear, usually after upper respiratory infection." }
    status: unverified
    tags: [high-yield]
  # ---------- p548: hearing loss, cholesteatoma ----------
  - id: neuro.L04.013
    kind: card
    topic: common-causes-of-hearing-loss
    front: "Which cells does noise-induced hearing loss damage?"
    back: "The stereociliated (hair) cells of the organ of Corti."
    src: { page: 548, quote: "Damage to stereociliated cells in organ of Corti. Loss of high-frequency hearing first." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.029
    kind: card
    topic: common-causes-of-hearing-loss
    front: "In noise-induced hearing loss, which frequencies are lost first?"
    back: "The high frequencies."
    src: { page: 548, quote: "Loss of high-frequency hearing first." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.030
    kind: card
    topic: common-causes-of-hearing-loss
    front: "How can one sudden, extremely loud noise cause hearing loss?"
    back: "It can tear (rupture) the tympanic membrane."
    src: { page: 548, quote: "Sudden extremely loud noises can produce hearing loss due to tympanic membrane rupture." }
    status: unverified
  - id: neuro.L04.014
    kind: card
    topic: common-causes-of-hearing-loss
    front: "What is presbycusis?"
    back: "Hearing loss of aging: sensorineural, bilateral and symmetric, slowly progressive, and often worst at the higher frequencies."
    src: { page: 548, quote: "Aging-related progressive bilateral/symmetric sensorineural hearing loss (often of higher frequencies)" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.031
    kind: card
    topic: common-causes-of-hearing-loss
    front: "In presbycusis, which hair cells are destroyed?"
    back: "Those at the base of the cochlea."
    src: { page: 548, quote: "due to destruction of hair cells at the cochlear base" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.032
    kind: card
    topic: common-causes-of-hearing-loss
    front: "Why is low-frequency hearing kept in presbycusis?"
    back: "Low pitches are heard at the cochlear apex, and the apex hair cells are spared."
    src: { page: 548, quote: "(preserved low-frequency hearing at apex)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.015
    kind: table
    topic: common-causes-of-hearing-loss
    title: Temporal bone fracture and hearing loss
    columns: [Fracture, Hearing loss]
    rows:
      - [Longitudinal, Conductive]
      - [Transverse, Sensorineural]
    blanks: [[0, 1], [1, 1]]
    src: { page: 548, quote: "Transverse temporal bone fracture sensorineural hearing loss." }
    status: unverified
  - id: neuro.L04.016
    kind: card
    topic: common-causes-of-hearing-loss
    front: What can cause traumatic tympanic membrane rupture?
    back: "Blunt trauma, barotrauma (eg, scuba diving), penetrating injury, or acoustic trauma (which also damages stereociliated cells)."
    src: { page: 548, quote: "Tympanic membrane rupture from blunt trauma, barotrauma (eg, scuba diving), penetrating injury, or acoustic trauma" }
    status: unverified
  - id: neuro.L04.017
    kind: mcq
    topic: common-causes-of-hearing-loss
    stem: >-
      A 70-year-old woman has trouble following conversations in noisy restaurants for 3 years, worse for her
      granddaughter's high-pitched voice. Both tympanic membranes are normal. Audiometry shows symmetric bilateral loss
      at high frequencies with preserved low frequencies. Destruction of which structure explains this?
    options:
      - Hair cells at the base of the cochlea
      - Hair cells at the apex of the cochlea
      - The ossicles
      - The tympanic membrane
      - The vestibulocochlear nerve at the cerebellopontine angle
    answer: 0
    why:
      - "Right. Presbycusis: hair cells at the cochlear base (high frequency) are destroyed first; the apex (low frequency) is spared."
      - "The apex hears low frequencies, which are preserved here."
      - "Ossicle damage gives conductive loss with abnormal Rinne."
      - "Her tympanic membranes are normal; rupture gives conductive loss."
      - "A vestibular schwannoma gives unilateral loss with tinnitus and imbalance."
    src: { page: 548, quote: "Aging-related progressive bilateral/symmetric sensorineural hearing loss (often of higher frequencies)" }
    status: unverified
  - id: neuro.L04.018
    kind: table
    topic: diagnosing-hearing-loss
    title: Weber and Rinne tests
    columns: [Test, Normal, Conductive loss, Sensorineural loss]
    rows:
      - ["Weber (fork on vertex)", No localization, Localizes to affected ear, Localizes to unaffected ear]
      - ["Rinne (fork in front of ear vs on mastoid)", "Air > bone", "Bone > air", "Air > bone"]
    blanks: [[0, 2], [0, 3], [1, 2], [1, 3]]
    src: { page: 548, quote: "Localizes to affected ear ↓ transmission of background noise" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.019
    kind: card
    topic: diagnosing-hearing-loss
    front: Why does the Weber test lateralize to the affected ear in conductive hearing loss?
    back: "The conductive block ↓ transmission of background noise to that ear, so bone-conducted sound from the vertex seems louder there. In sensorineural loss all sound transmission is ↓ in the affected ear, so it lateralizes to the good ear."
    src: { page: 548, quote: "Localizes to unaffected ear ↓ transmission of all sound" }
    status: unverified
  - id: neuro.L04.020
    kind: mcq
    topic: diagnosing-hearing-loss
    stem: >-
      A 30-year-old man has had muffled hearing in his left ear since a cold a week ago. Otoscopy
      shows a dull left tympanic membrane with fluid behind it; the right ear is normal. On the
      left, a tuning fork held on the mastoid is heard longer than one held in front of the ear. A
      vibrating tuning fork is then placed on the vertex of his skull. Where will he hear it
      loudest, and why?
    options:
      - "Left ear, because less background noise reaches it"
      - "Right ear, because all sound transmission to the left ear is reduced"
      - "Left ear, because all sound transmission to the left ear is reduced"
      - "In the midline, with no localization"
      - "Right ear, because air conduction is better than bone conduction on the right"
    answer: 0
    why:
      - "Right. Fluid behind the drum with bone > air conduction is left conductive loss; the block cuts background noise to that ear, so Weber localizes to the affected (left) ear."
      - "Weber goes to the unaffected ear because all sound is reduced in sensorineural loss; his left Rinne (bone > air) shows conductive loss."
      - "Reduced transmission of all sound is the sensorineural mechanism, and it sends Weber to the other ear."
      - "No localization is the normal result; his left ear has a conductive block."
      - "Air > bone on the right is normal and does not pull Weber to the right."
    src: { page: 548, quote: "Localizes to affected ear ↓ transmission of background noise" }
    status: unverified
  - id: neuro.L04.021
    kind: card
    topic: cholesteatoma
    front: "What is a cholesteatoma?"
    back: "Abnormal growth of keratinized squamous epithelium in the middle ear («skin in the wrong place»)."
    src: { page: 548, quote: "Abnormal growth of keratinized squamous epithelium in middle ear A (“skin in wrong place”)." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.027
    kind: card
    topic: cholesteatoma
    front: "Are cholesteatomas usually acquired or congenital?"
    back: "Usually acquired, though some are present from birth."
    src: { page: 548, quote: "Usually acquired, but can be congenital." }
    status: unverified
  - id: neuro.L04.033
    kind: card
    topic: cholesteatoma
    front: "How does a 1° acquired cholesteatoma form?"
    back: "Eustachian tube dysfunction pulls the tympanic membrane inward into retraction pockets, where the skin collects."
    src: { page: 548, quote: "1° acquired results from tympanic membrane retraction pockets that form due to eustachian tube dysfunction." }
    status: unverified
  - id: neuro.L04.034
    kind: card
    topic: cholesteatoma
    front: "How does a 2° acquired cholesteatoma form?"
    back: "A hole in the tympanic membrane (eg, after otitis media) lets squamous epithelium grow into the middle ear."
    src: { page: 548, quote: "2° acquired results from tympanic membrane perforation (eg, due to otitis media) that permits migration of squamous epithelium to middle ear." }
    status: unverified
  - id: neuro.L04.022
    kind: cloze
    topic: cholesteatoma
    text: "Cholesteatoma classically presents with {{c1::painless otorrhea}} and may erode the {{c2::ossicles}} → {{c3::conductive}} hearing loss."
    src: { page: 548, quote: "Classically presents with painless otorrhea. May erode ossicles conductive hearing loss." }
    status: unverified
    tags: [high-yield]
  - id: neuro.L04.023
    kind: mcq
    topic: cholesteatoma
    stem: >-
      A 25-year-old woman with recurrent childhood ear infections has months of foul-smelling, painless discharge from her
      right ear and gradually worsening right-sided hearing. Otoscopy shows a pearly white mass behind a perforated
      tympanic membrane. Rinne is bone > air on the right. What is the mass made of?
    options:
      - Keratinized squamous epithelium
      - Granulation tissue from Pseudomonas osteomyelitis
      - Schwann cells
      - Cholesterol-laden macrophages from a vascular tumor
      - Middle ear mucosal polyp of respiratory epithelium
    answer: 0
    why:
      - "Right. Cholesteatoma is skin in the wrong place: keratinized squamous epithelium that migrated through a perforation and erodes the ossicles."
      - "Granulation tissue with severe pain points to malignant otitis externa in an older diabetic."
      - "Schwann cells form a vestibular schwannoma, with sensorineural loss."
      - "The name misleads: it is not a cholesterol or vascular tumor."
      - "The book defines it as keratinized squamous epithelium, not respiratory mucosa."
    src: { page: 548, quote: "2° acquired results from tympanic membrane perforation (eg, due to otitis media) that permits migration of squamous epithelium to middle ear." }
    status: unverified
