    title: Parkinson drugs by strategy
    columns: [Strategy, Drugs, Note]
    rows:
      - [Dopamine agonists, "Pramipexole, ropinirole (non-ergot); bromocriptine (ergot)", "Impulse control disorder, hallucinations, postural hypotension, sleepiness"]
