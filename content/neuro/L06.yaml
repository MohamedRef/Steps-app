  - id: neuro.L06.002
    kind: card
    topic: anticonvulsants
    front: "What are the common adverse effects of phenytoin?"
    back: "Sedation, dizziness, diplopia, gum overgrowth (folate supplements prevent it), rash, hirsutism, and drug interactions from CYP450 induction."
    src: { page: 560, quote: "Sedation, dizziness, diplopia, gingival hypertrophy (preventable with folate supplementation), rash, hirsutism, drug interactions (CYP450 induction)" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L06.084
    kind: card
    topic: anticonvulsants
    front: "What are the rare but serious adverse effects of phenytoin?"
    back: "SJS, DRESS, liver toxicity, neuropathy, osteoporosis, folate depletion, and teratogenicity."
    src: { page: 560, quote: "SJS, DRESS, hepatotoxicity, neuropathy, osteoporosis, folate depletion, teratogenicity" }
    status: unverified
    tags: [high-yield]
  - id: neuro.L06.003
    kind: card
    topic: anticonvulsants
    front: What are the notable adverse effects of carbamazepine?
    back: "Common: sedation, dizziness, diplopia, GI upset, SIADH, rash, CYP450 induction. Serious: SJS, DRESS, hepatotoxicity, agranulocytosis, aplastic anemia, folate depletion, teratogenicity."
