  - id: neuro.L06.004
    kind: card
    topic: anticonvulsants
    front: What are the serious adverse effects of valproate, and how does it affect CYP450?
    back: "Hepatotoxicity, pancreatitis, and the highest teratogenic risk of all anticonvulsants. It inhibits CYP450. Common: sedation, weight gain, hair loss, easy bruising."
    src: { page: 560, quote: "Hepatotoxicity, pancreatitis, teratogenicity (highest risk of all anticonvulsants)" }
    status: unverified
    tags: [high-yield]
