  - id: neuro.L06.017
    kind: mcq
    topic: benzodiazepines
    stem: >-
      A 52-year-old man with alcoholic cirrhosis and ascites is admitted for a hernia repair. On day 2 he becomes
      tremulous, sweaty and anxious, with a heart rate of 118/min. Which drug is best to prevent progression of his
      withdrawal?
    options:
      - Lorazepam
      - Chlordiazepoxide
      - Phenobarbital
      - Zolpidem
      - Flumazenil
    answer: 0
    why:
      - "Right. In liver disease, use benzodiazepines with minimal first-pass (hepatic) metabolism: Lorazepam, Oxazepam, Temazepam («LOT»)."
      - "Chlordiazepoxide is preferred for withdrawal in patients with a normal liver, but it relies on hepatic metabolism."
      - "Barbiturates are second-line and cause more respiratory depression."
      - "Zolpidem is a hypnotic, not withdrawal treatment."
      - "Flumazenil reverses benzodiazepines and can provoke seizures."
    src: { page: 562, quote: "Lorazepam, Oxazepam, and Temazepam can be used for those with liver disease who drink a LOT due to minimal first-pass metabolism." }
    status: unverified
