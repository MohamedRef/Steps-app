  - id: neuro.L06.073
    kind: mcq
    topic: triptans
    stem: >-
      A 34-year-old woman with migraine has taken sertraline for depression for a year. She takes
      several doses of sumatriptan over one day for a severe attack. That evening she is agitated
      and diaphoretic, with a temperature of 38.6°C, tachycardia, hyperreflexia and inducible
      clonus. Sumatriptan contributed to this reaction through its action at which receptors?
    options:
      - "Agonist at 5-HT1B/1D receptors"
      - "Antagonist at 5-HT3 receptors"
      - "Antagonist at D2 receptors"
      - "Agonist at μ-opioid receptors"
      - "Agonist at MT1 and MT2 receptors"
    answer: 0
    why:
      - "Right. Sumatriptan is a 5-HT1B/1D agonist; added to an SSRI, which raises synaptic serotonin, it can cause serotonin syndrome."
      - "5-HT3 antagonists (ondansetron) are antiemetics; sumatriptan stimulates serotonin receptors rather than blocking them."
      - "D2 antagonists (metoclopramide, prochlorperazine) are migraine antiemetics; their danger is neuroleptic malignant syndrome or parkinsonism, not this."
      - "Sumatriptan is not an opioid; μ agonists cause miosis and respiratory depression."
      - "MT1/MT2 agonism is ramelteon, a hypnotic."
    src: { page: 562, quote: "5-HT1B/1D agonists. Inhibit trigeminal nerve activation, prevent vasoactive peptide release, induce vasoconstriction." }
    status: unverified
  # ---------- p563-564: Parkinson and neurodegenerative therapy ----------
