  - id: neuro.L06.006
    kind: mcq
    topic: anticonvulsants
    stem: >-
      A 24-year-old woman with juvenile myoclonic epilepsy wants to become pregnant within the year. She takes the
      anticonvulsant that blocks Na+ and Ca2+ channels and GABA transaminase, and it has controlled her seizures.
      Which risk most strongly supports switching her drug before conception?
    options:
      - It has the highest teratogenic risk of all anticonvulsants
      - It causes agranulocytosis
      - It induces CYP450 and lowers contraceptive levels
      - It causes kidney stones
      - It causes gingival hypertrophy
    answer: 0
    why:
      - "Right. Valproate has the highest teratogenic risk (neural tube defects); switching before conception is preferred."
      - "Agranulocytosis is a carbamazepine risk."
      - "Valproate inhibits, not induces, CYP450."
      - "Kidney stones go with topiramate."
      - "Gingival hypertrophy goes with phenytoin."
    src: { page: 560, quote: "Hepatotoxicity, pancreatitis, teratogenicity (highest risk of all anticonvulsants)" }
    status: unverified
  - id: neuro.L06.007
    kind: mcq
    topic: anticonvulsants
    stem: >-
      A 9-year-old girl has frequent staring spells. EEG shows 3 Hz spike-and-wave discharges. Her parents want a drug
      that treats only this seizure type. Which drug fits, and how does it work?
    options:
      - Ethosuximide; blocks Ca2+ channels
      - Phenytoin; blocks Na+ channels
      - Levetiracetam; blocks SV2A
      - Carbamazepine; blocks Na+ channels
      - Gabapentin; blocks Ca2+ channels
    answer: 0
    why:
      - "Right. Ethosuximide is narrow spectrum for absence seizures only and blocks (T-type) Ca2+ channels."
      - "Phenytoin is for focal seizures and can worsen absence."
      - "Levetiracetam is broad spectrum, not absence only."
      - "Carbamazepine is for focal seizures and can worsen absence."
      - "Gabapentinoids are for focal seizures."
    src: { page: 560, quote: "Narrow spectrum (absence seizures only) Ethosuximide Blocks Ca2+ channel" }
    status: unverified
  - id: neuro.L06.008
    kind: mcq
    topic: anticonvulsants
    stem: >-
      A 35-year-old man with focal seizures has taken an anticonvulsant for 2 years. He now has overgrown, tender gums,
      coarse facial hair and a mildly low folate level. Which drug is he taking?
    options:
      - Phenytoin
      - Valproate
      - Lamotrigine
      - Levetiracetam
      - Ethosuximide
    answer: 0
    why:
      - "Right. Phenytoin: gingival hypertrophy (preventable with folate), hirsutism and folate depletion."
      - "Valproate causes hair loss and weight gain."
      - "Lamotrigine's signature is rash and SJS."
      - "Levetiracetam's signature is neuropsychiatric effects."
      - "Ethosuximide is for absence seizures."
    src: { page: 560, quote: "Sedation, dizziness, diplopia, gingival hypertrophy (preventable with folate supplementation), rash, hirsutism, drug interactions (CYP450 induction)" }
    status: unverified
