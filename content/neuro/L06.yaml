    kind: card
    topic: parkinson-disease-therapy
    front: What are the most effective Parkinson treatments, and who gets which?
    back: "Non-ergot dopamine agonists for younger patients and levodopa/carbidopa for older patients. Deep brain stimulation of the STN or GPi helps advanced disease."
    src: { page: 563, quote: "Most effective treatments are non-ergot dopamine agonists (younger patients) and levodopa/ carbidopa (older patients)." }
    status: unverified
