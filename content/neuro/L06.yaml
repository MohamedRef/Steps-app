  - id: neuro.L06.011
    kind: mcq
    topic: barbiturates
    stem: >-
      A 28-year-old woman is given a sedative for insomnia. Two days later she has severe abdominal pain, confusion and
      dark urine that darkens further on standing. Her neurologic examination shows proximal weakness. Which drug most
      likely caused this?
    options:
      - Phenobarbital
      - Zolpidem
      - Ramelteon
      - Lorazepam
      - Suvorexant
    answer: 0
    why:
      - "Right. Barbiturates induce CYP-450 (and ALA synthase demand) and can precipitate an attack of acute porphyria, so they are contraindicated in porphyria."
      - "Zolpidem is a nonbenzodiazepine hypnotic; First Aid lists porphyria as a contraindication only for barbiturates."
      - "Ramelteon is a melatonin agonist without this risk."
      - "Benzodiazepines such as lorazepam are not contraindicated in porphyria; barbiturates are."
      - "Suvorexant is an orexin antagonist."
    src: { page: 561, quote: "Contraindicated in porphyria." }
    status: unverified
