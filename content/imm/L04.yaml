  # ---------- p118: immunosuppressants ----------
  - id: imm.L04.001
    kind: card
    topic: immunosuppressants
    front: What do immunosuppressants do, why are they combined, and what is the risk of chronic use?
    back: They stop lymphocytes from activating and multiplying, so cellular immunity is damped and acute transplant rejection is prevented (prophylaxis). Combinations work better with less toxicity. Long-term use raises the risk of infection and malignancy.
    src: { page: 118, quote: "Agents that block lymphocyte activation and proliferation. Reduce acute transplant rejection by suppressing cellular immunity (used as prophylaxis). Frequently combined to achieve greater efficacy with ↓ toxicity. Chronic suppression ↑ risk of infection and malignancy." }
    status: unverified
  - id: imm.L04.002
    kind: table
    topic: immunosuppressants
    title: Calcineurin inhibitors, mTOR inhibitor and IL-2R blocker
    columns: [Drug, Mechanism, Indications, Toxicity]
    rows:
      - ["Cyclosporine", "Calcineurin inhibitor; binds cyclophilin; blocks T-cell activation by preventing IL-2 transcription", "Psoriasis, rheumatoid arthritis", "Nephrotoxicity, hypertension, hyperlipidemia, neurotoxicity, gingival hyperplasia, hirsutism"]
      - ["Tacrolimus (FK506)", "Calcineurin inhibitor; binds FKBP; blocks T-cell activation by preventing IL-2 transcription", "Immunosuppression after solid organ transplant", "Like cyclosporine, ↑ risk of diabetes and neurotoxicity; no gingival hyperplasia or hirsutism"]
      - ["Sirolimus (rapamycin)", "mTOR inhibitor; binds FKBP; blocks T-cell activation and B-cell differentiation by preventing response to IL-2", "Kidney transplant rejection prophylaxis specifically", "\"Pansirtopenia\" (pancytopenia), insulin resistance, hyperlipidemia; not nephrotoxic"]
      - ["Basiliximab", "Monoclonal antibody; blocks IL-2R", "Kidney transplant rejection prophylaxis (\"Sir Basil's kidney transplant\")", "Edema, hypertension, tremor"]
    blanks: [[0, 1], [0, 3], [1, 1], [1, 3], [2, 1], [2, 3], [3, 1], [3, 3]]
    src: { page: 118, quote: "Cyclosporine Calcineurin inhibitor; binds cyclophilin Blocks T-cell activation by preventing IL-2 transcription Psoriasis, rheumatoid arthritis Nephrotoxicity, hypertension, hyperlipidemia, neurotoxicity, gingival hyperplasia, hirsutism" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.003
    kind: card
    topic: immunosuppressants
    front: What toxicity do both calcineurin inhibitors share, and when is it worst?
    back: "Kidney damage (marked nephrotoxicity) from both cyclosporine and tacrolimus; the risk climbs with higher doses and in patients whose renal function is already reduced."
    src: { page: 118, quote: "Both calcineurin inhibitors are highly nephrotoxic, especially in higher doses or in patients with ↓ renal function" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.004
    kind: cloze
    topic: immunosuppressants
    text: "Cyclosporine binds {{c1::cyclophilin}}; tacrolimus binds {{c2::FKBP}} (FK506 binding protein). Both inhibit {{c3::calcineurin}}."
    src: { page: 118, quote: "Cyclosporine Calcineurin inhibitor; binds cyclophilin Blocks T-cell activation by preventing IL-2 transcription Psoriasis, rheumatoid arthritis Nephrotoxicity, hypertension, hyperlipidemia, neurotoxicity, gingival hyperplasia, hirsutism Both calcineurin inhibitors are highly nephrotoxic, especially in higher doses or in patients with ↓ renal function Tacrolimus (FK506) Calcineurin inhibitor; binds FK506 binding protein (FKBP)" }
    status: unverified
  - id: imm.L04.005
    kind: card
    topic: immunosuppressants
    front: How do the adverse effects of tacrolimus differ from cyclosporine?
    back: "Mostly the same toxicities, but tacrolimus carries a higher risk of diabetes and neurotoxicity, and it does not cause the gum overgrowth (gingival hyperplasia) or hirsutism seen with cyclosporine."
    src: { page: 118, quote: "Similar to cyclosporine, ↑ risk of diabetes and neurotoxicity; no gingival hyperplasia or hirsutism" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.006
    kind: card
    topic: immunosuppressants
    front: Which immunosuppressant "lets the kidney survive", and what are its other notes?
    back: Sirolimus (rapamycin), an mTOR inhibitor that is not nephrotoxic (kidney "sir-vives"). It is synergistic with cyclosporine and also used in drug-eluting stents.
    src: { page: 118, quote: "Kidney “sir-vives.” Synergistic with cyclosporine Also used in drug- eluting stents" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.007
    kind: mcq
    topic: immunosuppressants
    stem: >-
      A 45-year-old woman is maintained on a drug after a kidney transplant. At follow-up she has
      thickened, overgrown gums, new facial and arm hair, and a blood pressure of 158/96 mm Hg. Serum
      creatinine has risen from 1.1 to 1.8 mg/dL. Which mechanism best describes this drug?
    options:
      - Binds FKBP and inhibits mTOR
      - Binds cyclophilin and inhibits calcineurin
      - Inhibits IMP dehydrogenase
      - Blocks the IL-2 receptor as a monoclonal antibody
      - Inhibits NF-κB
    answer: 1
    why:
      - "Sirolimus (mTOR) is not nephrotoxic and doesn't cause gingival hyperplasia or hirsutism."
      - "Right. Cyclosporine binds cyclophilin and inhibits calcineurin; it causes nephrotoxicity, hypertension, gingival hyperplasia and hirsutism."
      - "Mycophenolate causes GI upset and pancytopenia and is less nephrotoxic."
      - "Basiliximab causes edema, hypertension and tremor, not gum overgrowth."
      - "Glucocorticoids cause Cushing features, not gingival hyperplasia."
    src: { page: 118, quote: "Cyclosporine Calcineurin inhibitor; binds cyclophilin Blocks T-cell activation by preventing IL-2 transcription Psoriasis, rheumatoid arthritis Nephrotoxicity, hypertension, hyperlipidemia, neurotoxicity, gingival hyperplasia, hirsutism" }
    status: unverified
  - id: imm.L04.008
    kind: mcq
    topic: immunosuppressants
    stem: >-
      A 58-year-old man with a kidney transplant has his calcineurin inhibitor replaced because of
      worsening graft function from drug toxicity. The new drug binds the same intracellular protein
      as tacrolimus, but blocks the T-cell response to IL-2 instead of IL-2 transcription. Which
      adverse effect is he now most at risk of?
    options:
      - Gingival hyperplasia
      - Pancytopenia
      - Nephrotoxicity
      - Invasive CMV infection
      - Avascular necrosis of the femoral head
    answer: 1
    why:
      - "Gingival hyperplasia is a cyclosporine effect."
      - "Right. Sirolimus (mTOR inhibitor, binds FKBP) causes \"pansirtopenia\" (pancytopenia), insulin resistance and hyperlipidemia, and is not nephrotoxic."
      - "Sirolimus is not nephrotoxic, which is why it was chosen."
      - "Invasive CMV is associated with mycophenolate."
      - "Avascular necrosis is a glucocorticoid effect."
    src: { page: 118, quote: "Sirolimus (Rapamycin) mTOR inhibitor; binds FKBP" }
    status: unverified
