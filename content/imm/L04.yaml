  - id: imm.L04.017
    kind: mcq
    topic: recombinant-cytokines
    stem: >-
      A 7-year-old boy has had recurrent Staphylococcus aureus liver abscesses and Serratia osteomyelitis.
      His neutrophils show abnormal dihydrorhodamine flow cytometry. He is started on prophylactic
      trimethoprim-sulfamethoxazole and itraconazole. Which recombinant cytokine is also used for his
      condition?
    options:
      - IFN-β
      - IFN-γ
      - Aldesleukin (IL-2)
      - Romiplostim
      - Epoetin alfa
    answer: 1
    why:
      - "IFN-β is for multiple sclerosis."
      - "Right. This is chronic granulomatous disease, and IFN-γ (which activates macrophages) is the recombinant cytokine used for it."
      - "Aldesleukin is for renal cell carcinoma and metastatic melanoma."
      - "Romiplostim is a TPO analog for autoimmune thrombocytopenia."
      - "Epoetin alfa is for anemia, especially in renal failure."
    src: { page: 119, quote: "IFN-γ Chronic granulomatous disease" }
    status: unverified
  # ---------- coverage pass: immunosuppressant pathway figure (p118) ----------
  - id: imm.L04.018
    kind: order
    topic: immunosuppressants
    prompt: "In the CD4+ helper T cell, put the steps from T-cell receptor signal to IL-2 gene transcription in order (and where cyclosporine and tacrolimus cut in)."
    steps:
      - "Antigen binds the TCR/CD3 complex of the CD4+ helper T cell"
      - "Calcineurin is activated (blocked by cyclosporine + cyclophilin, tacrolimus + FKBP)"
      - "Calcineurin dephosphorylates NFAT-P to NFAT"
      - "NFAT enters the nucleus and switches on IL-2 (proliferation) genes"
    src: { page: 118, quote: "NFAT–P NFAT NFAT PRPP amidotransferase IMP dehydrogenase Cyclophilin +" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.019
    kind: card
    topic: immunosuppressants
    front: "Where do basiliximab and sirolimus act on the IL-2 signal of the helper T cell?"
    back: Basiliximab blocks the IL-2 receptor itself (IL-2R) on the cell surface; sirolimus (rapamycin) binds FKBP and inhibits mTOR downstream of the IL-2R, so the cell cannot proliferate in response to IL-2.
    src: { page: 118, quote: "CD3 IL-2R Cyclosporine Glucocorticoids FKBP + Tacrolimus Sirolimus (rapamycin) FKBP + Basiliximab" }
    status: unverified
  - id: imm.L04.020
    kind: card
    topic: immunosuppressants
    front: "Which enzymes of de novo purine synthesis do azathioprine and mycophenolate block?"
    back: "Azathioprine (via 6-MP) blocks PRPP amidotransferase; mycophenolate blocks IMP dehydrogenase. Either way purine nucleotides run short and lymphocyte DNA replication stops."
    src: { page: 118, quote: "6–MP Purine nucleotides De novo purine synthesis" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.021
    kind: card
    topic: immunosuppressants
    front: "How do glucocorticoids suppress the T cell?"
    back: They block NF-κB, so the inflammatory cytokine genes are not transcribed.
    src: { page: 118, quote: "Inflammatory cytokine genes NF–κB" }
    status: unverified
  - id: imm.L04.022
    kind: card
    topic: immunosuppressants
    front: "What kind of drug is azathioprine, and what is it a precursor of?"
    back: "\"Azathio-purine\": it reminds you that azathioprine is a purine antimetabolite (precursor of 6-mercaptopurine)."
    src: { page: 119, quote: "Pronounce “azathio- purine”" }
    status: unverified
