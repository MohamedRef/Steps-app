  - id: imm.L04.010
    kind: card
    topic: immunosuppressants
    front: Why must azathioprine be dose-reduced with allopurinol?
    back: Azathioprine is a precursor of 6-mercaptopurine, which is degraded by xanthine oxidase. Allopurinol inhibits xanthine oxidase, so toxicity (pancytopenia) ↑.
    src: { page: 119, quote: "6-MP degraded by xanthine oxidase; toxicity ↑ by allopurinol" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.011
    kind: cloze
    topic: immunosuppressants
    text: Mycophenolate mofetil is associated with invasive {{c1::CMV}} infection.
    src: { page: 119, quote: "Associated with invasive CMV infection" }
    status: unverified
  - id: imm.L04.012
    kind: card
    topic: immunosuppressants
    front: Why do glucocorticoids raise the WBC count, and what happens if they are stopped abruptly after chronic use?
    back: Demargination of WBCs causes an artificial leukocytosis. Stopping abruptly after chronic use can cause adrenal insufficiency (adrenocortical atrophy).
    src: { page: 119, quote: "Demargination of WBCs causes artificial leukocytosis Adrenal insufficiency may develop if drug is stopped abruptly after chronic use" }
    status: unverified
    tags: [high-yield]
  - id: imm.L04.013
    kind: mcq
    topic: immunosuppressants
    stem: >-
      A 34-year-old man with Crohn disease has been well controlled on azathioprine for 2 years. He
      develops an acute attack of gout, and his primary care physician starts a drug to lower uric acid
      production. Three weeks later he has fever, oral ulcers and a WBC count of 1,200/mm3 with platelets
      of 40,000/mm3. Which mechanism explains this?
    options:
      - The new drug inhibited xanthine oxidase, which degrades 6-mercaptopurine
      - The new drug inhibited IMP dehydrogenase, blocking guanine synthesis
      - The new drug blocked NF-κB, cutting cytokine gene transcription
      - Azathioprine inhibited calcineurin, so IL-2 transcription stopped
      - Azathioprine caused demargination of WBCs from the vessel walls
    answer: 0
    why:
      - "Right. Allopurinol inhibits xanthine oxidase, which degrades 6-MP (azathioprine's active form), so 6-MP builds up and causes pancytopenia."
      - "IMP dehydrogenase is mycophenolate's target."
      - "NF-κB is inhibited by glucocorticoids."
      - "Calcineurin is the target of cyclosporine and tacrolimus."
      - "Demargination raises the WBC count; it is a glucocorticoid effect."
    src: { page: 119, quote: "Azathioprine Antimetabolite precursor of 6-mercaptopurine Inhibits lymphocyte proliferation by blocking nucleotide synthesis Rheumatoid arthritis, Crohn disease, glomerulonephritis, other autoimmune conditions Pancytopenia 6-MP degraded by xanthine oxidase; toxicity ↑ by allopurinol" }
    status: unverified
