  # ---------- p97: innate vs adaptive immunity ----------
  - id: imm.L02.001
    kind: table
    topic: innate-vs-adaptive-immunity
    title: Innate vs adaptive immunity
    columns: [Feature, Innate immunity, Adaptive immunity]
    rows:
      - [Components, "Neutrophils, macrophages, monocytes, dendritic cells, NK cells (lymphoid origin), complement, physical epithelial barriers, secreted enzymes", "T cells, B cells, circulating antibodies"]
      - [Mechanism, Germline encoded, Variation through V(D)J recombination during lymphocyte development]
      - [Response to pathogens, "Nonspecific; occurs rapidly (minutes to hours); no memory response", "Highly specific, refined over time; develops over long periods; memory response is faster and more robust"]
