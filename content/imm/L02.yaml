  # ---------- p99: NK cells ----------
  - id: imm.L02.024
    kind: card
    topic: natural-killer-cells
    front: How do natural killer cells kill, and which cells do they target?
    back: They use perforin and granzymes to induce apoptosis of virally infected cells and tumor cells. NK cells are the lymphocyte member of the innate immune system.
    src: { page: 99, quote: "Lymphocyte member of innate immune system. Use perforin and granzymes to induce apoptosis of virally infected cells and tumor cells." }
    status: unverified
  - id: imm.L02.025
    kind: cloze
    topic: natural-killer-cells
    text: NK cell activity is enhanced by {{c1::IL-2}}, {{c2::IL-12}}, IFN-α and IFN-β; NK cells produce {{c3::IFN-γ}}, which activates macrophages.
    src: { page: 99, quote: "Activity enhanced by IL-2, IL-12, IFN-α, and IFN-β. Produce IFN-γ → macrophage activation." }
    status: unverified
  - id: imm.L02.026
    kind: card
    topic: natural-killer-cells
    front: What two situations induce an NK cell to kill a target cell?
    back: Exposure to a nonspecific activation signal on the target cell and/or absence of an inhibitory signal such as MHC I on the target cell surface.
    src: { page: 99, quote: "Induced to kill when exposed to a nonspecific activation signal on target cell and/or to an absence of an inhibitory signal such as MHC I on target cell surface." }
    status: unverified
    tags: [high-yield]
  - id: imm.L02.027
    kind: card
    topic: natural-killer-cells
    front: How do NK cells perform antibody-dependent cell-mediated cytotoxicity (ADCC)?
    back: CD16 on the NK cell binds the Fc region of IgG bound to the target, activating the NK cell.
    src: { page: 99, quote: "Also kills via antibody-dependent cell-mediated cytotoxicity (CD16 binds Fc region of bound IgG, activating the NK cell)." }
    status: unverified
    tags: [high-yield]
  - id: imm.L02.028
    kind: mcq
    topic: natural-killer-cells
    stem: >-
      A researcher studies a human cell line infected with a herpesvirus that downregulates MHC I on the
      host cell surface. The infected cells escape killing by virus-specific CD8+ T cells. However, the
      cells are still killed by a population of large granular lymphocytes that express CD16 and CD56 and
      need no prior sensitization. What triggers these effector cells to kill?
    options:
      - Recognition of viral peptide on MHC II
      - Loss of an inhibitory signal from MHC I
      - CD40 ligand binding to CD40 on the target
      - B7 costimulation of the effector cell
      - Binding of IgE to Fc receptors
    answer: 1
    why:
      - "MHC II presents exogenous antigen to CD4+ cells; infected epithelial-type cells don't rely on it, and NK cells don't need antigen presentation."
      - "Right. These are NK cells; absence of an inhibitory signal such as MHC I on the target induces them to kill with perforin and granzymes."
      - "CD40-CD40L is how T helper cells activate B cells and macrophages."
      - "B7-CD28 is the second signal for naïve T-cell activation, not NK killing."
      - "IgE on Fc receptors arms mast cells and basophils; NK ADCC uses CD16 binding IgG."
    src: { page: 99, quote: "Induced to kill when exposed to a nonspecific activation signal on target cell and/or to an absence of an inhibitory signal such as MHC I on target cell surface." }
    status: unverified
  # ---------- p99: B and T cells ----------
  - id: imm.L02.029
    kind: enumerate
    topic: b-and-t-cells
    prompt: Enumerate the major functions of B cells (humoral immunity) (3).
    points:
      - Recognize and present antigen (somatic hypermutation optimizes antigen specificity)
      - Produce antibody (differentiate into plasma cells that secrete specific immunoglobulins)
      - Maintain immunologic memory (memory B cells persist and accelerate future responses)
    pass: 3
    hook: "الـ B cell شغلته 3: يقدّم (present)، يصنّع (antibody)، يفتكر (memory)."
    src: { page: 99, quote: "Recognize and present antigen—undergo somatic hypermutation to optimize antigen specificity. Produce antibody—differentiate into plasma cells to secrete specific immunoglobulins. Maintain immunologic memory" }
    status: unverified
  - id: imm.L02.030
    kind: enumerate
    topic: b-and-t-cells
    prompt: Enumerate the major functions of T cells (cell-mediated immunity) (4).
    points:
      - CD4+ T cells help B cells make antibodies and produce cytokines to recruit phagocytes and activate other leukocytes
      - CD8+ T cells directly kill virus-infected and tumor cells via perforin and granzymes
      - Type IV hypersensitivity reaction
      - Acute and chronic cellular organ rejection
    pass: 4
    src: { page: 99, quote: "CD4+ T cells help B cells make antibodies and produce cytokines to recruit phagocytes and activate other leukocytes. CD8+ T cells directly kill virus-infected and tumor cells via perforin and granzymes (similar to NK cells). Type IV hypersensitivity reaction. Acute and chronic cellular organ rejection." }
    status: unverified
  - id: imm.L02.031
    kind: mcq
    topic: b-and-t-cells
    stem: >-
      A 35-year-old nurse has a tuberculin skin test placed during routine screening. Forty-eight hours
      later she has an 18-mm area of induration at the site. Chest x-ray is normal. Which cell type is
      primarily responsible for initiating this reaction?
    options:
      - Plasma cells secreting IgE
      - CD4+ T cells
      - Neutrophils activated by complement
      - Memory B cells
      - Eosinophils
    answer: 1
    why:
      - "IgE from plasma cells mediates type I (immediate) hypersensitivity, within minutes."
      - "Right. A delayed (48-72 hours) induration is a type IV hypersensitivity reaction, a T-cell (cell-mediated) function."
      - "Complement-activated neutrophils are the effectors of type III immune complex injury."
      - "Memory B cells speed antibody responses; induration at 48 hours is T-cell mediated."
      - "Eosinophils are recruited in type I and parasitic responses."
    src: { page: 99, quote: "T cells Cell-mediated immunity. CD4+ T cells help B cells make antibodies and produce cytokines to recruit phagocytes and activate other leukocytes." }
    status: unverified
  # ---------- p100: differentiation of T cells ----------
  - id: imm.L02.032
    kind: order
    topic: t-cell-differentiation
    prompt: Put the steps of T-cell development in order, from where the cell is made.
    steps:
      - T-cell precursor in the bone marrow
      - Double-positive (CD4+ CD8+) thymocyte in the thymic cortex
      - Positive selection in the thymic cortex
      - Negative selection in the thymic medulla
      - Single-positive CD4+ or CD8+ T cell leaves for the blood and lymph nodes
    src: { page: 100, quote: "Positive selection Thymic cortex. Keeps T cells that recognize self-peptides to allow for cooperation in immune responses. Double positive thymocytes expressing TCRs that recognize self-peptide MHC complexes receive a survival signal." }
    status: unverified
