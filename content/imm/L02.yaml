  - id: imm.L02.004
    kind: card
    topic: innate-vs-adaptive-immunity
    front: What are Toll-like receptors, and what happens when they bind their ligands?
    back: Pattern recognition receptors of innate immunity that recognize pathogen- and damage-associated molecular patterns (PAMPs and DAMPs) → activation of NF-κB → release of pro-inflammatory cytokines.
    src: { page: 97, quote: "Toll-like receptors (TLRs): pattern recognition receptors that recognize pathogen- and damage-associated molecular patterns (PAMPs and DAMPs) → activation of NF-κB → release of pro-inflammatory cytokines." }
    status: unverified
    tags: [high-yield]
  - id: imm.L02.005
    kind: table
    topic: innate-vs-adaptive-immunity
    title: PAMPs vs DAMPs (examples)
    columns: [Pattern, Examples]
    rows:
      - [PAMPs, "LPS (gram ⊝ bacteria), flagellin (bacteria), nucleic acids (viruses)"]
      - [DAMPs, "Mitochondrial DNA, histones, heat shock proteins"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 97, quote: "Examples of PAMPs: LPS (gram ⊝ bacteria), flagellin (bacteria), nucleic acids (viruses). Examples of DAMPs: mitochondrial DNA, histones, heat shock proteins." }
    status: unverified
  - id: imm.L02.006
    kind: card
    topic: innate-vs-adaptive-immunity
    front: What are memory cells, and what happens to adaptive immune responses with age?
    back: Activated B and T cells; re-exposure to a previously encountered antigen gives a stronger, quicker response. Adaptive responses decrease with age (immunosenescence).
    src: { page: 97, quote: "Memory cells: activated B and T cells; subsequent exposure to a previously encountered antigen → stronger, quicker immune response. Adaptive immune responses decrease with age (immunosenescence)." }
    status: unverified
  - id: imm.L02.007
    kind: mcq
    topic: innate-vs-adaptive-immunity
    stem: >-
      A 68-year-old man is brought to the emergency department with fever, rigors and hypotension 2 days
      after a urinary catheter was placed. Blood cultures grow Escherichia coli. Lipopolysaccharide from
      the bacterial outer membrane binds a pattern recognition receptor on his macrophages. Which
      intracellular event most directly leads to the release of pro-inflammatory cytokines?
    options:
      - V(D)J recombination of the receptor gene
      - Activation of NF-κB
      - Binding of the antigen to MHC II
      - Class switching to IgG
      - Release of perforin and granzymes
    answer: 1
    why:
      - "V(D)J recombination makes T- and B-cell receptors; Toll-like receptors are germline encoded."
      - "Right. LPS is a PAMP that binds a Toll-like receptor → NF-κB activation → pro-inflammatory cytokines."
      - "MHC II presentation to CD4+ T cells is adaptive immunity and takes days, not the first minutes of sepsis."
      - "Class switching is a B-cell event that needs T-cell help; it is not how macrophages release cytokines."
      - "Perforin and granzymes are how NK and CD8+ T cells kill infected cells."
    src: { page: 97, quote: "Toll-like receptors (TLRs): pattern recognition receptors that recognize pathogen- and damage-associated molecular patterns (PAMPs and DAMPs) → activation of NF-κB → release of pro-inflammatory cytokines. Examples of PAMPs: LPS (gram ⊝ bacteria)" }
    status: unverified
  # ---------- p97: immune privilege ----------
  - id: imm.L02.008
    kind: card
    topic: immune-privilege
    front: What is immune privilege, which organs have it, and why does it matter for transplants?
    back: Organs and tissues (e.g., eye, brain, placenta, testes) where chemical or physical mechanisms limit immune responses to foreign antigens, to avoid damage from inflammation. Allograft rejection at these sites is less likely.
    src: { page: 97, quote: "Organs (eg, eye, brain, placenta, testes) and tissues where chemical or physical mechanisms limit immune responses to foreign antigens to avoid damage that would occur from inflammatory sequelae. Allograft rejection at these sites is less likely." }
    status: unverified
  - id: imm.L02.009
    kind: mcq
    topic: immune-privilege
    stem: >-
      A 45-year-old woman with corneal scarring from herpes keratitis undergoes corneal transplantation
      from a deceased donor. No HLA matching is done, and she receives only topical corticosteroids
      afterward. Two years later the graft remains clear. Which of the following best explains the low
      risk of rejection?
    options:
      - The cornea lacks all MHC I expression
      - The eye is an immune-privileged site
      - The donor cornea was tolerated through thymic negative selection
      - Topical steroids eliminate donor-specific memory B cells
      - The cornea is a primary lymphoid organ
    answer: 1
    why:
      - "Nucleated cells express MHC I; the cornea is protected by local mechanisms, not by lacking MHC."
      - "Right. The eye is immune privileged: chemical and physical mechanisms limit immune responses there, so allograft rejection is less likely."
      - "Negative selection removes T cells reactive to self antigens, not to a donor's antigens met in adulthood."
      - "Topical steroids reduce local inflammation; they do not erase memory B cells."
      - "Primary lymphoid organs are the bone marrow and thymus."
    src: { page: 97, quote: "Organs (eg, eye, brain, placenta, testes) and tissues where chemical or physical mechanisms limit immune responses to foreign antigens to avoid damage that would occur from inflammatory sequelae. Allograft rejection at these sites is less likely." }
    status: unverified
