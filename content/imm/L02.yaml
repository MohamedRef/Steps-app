    src: { page: 98, quote: "Antigen loaded following release of invariant chain in a lysosome" }
    status: unverified
  - id: imm.L02.015
    kind: mcq
    topic: mhc-i-and-ii
    stem: >-
      A 30-year-old man has an acute influenza A infection. Viral proteins synthesized in the cytosol of
      his respiratory epithelial cells are degraded into peptides. These peptides are then transported
      into the rough endoplasmic reticulum for display on the cell surface. Which molecule pairs with the
      presenting molecule's heavy chain at the cell surface?
    options:
      - Invariant chain
      - β2-microglobulin
      - CD4
      - B7 (CD80/86)
      - CD40 ligand
    answer: 1
    why:
      - "The invariant chain belongs to MHC II, which presents exogenous antigen and is released in the lysosome."
      - "Right. Cytosolic (endogenous) viral peptides go through TAP into the RER onto MHC I, whose associated protein is β2-microglobulin."
      - "CD4 is on helper T cells and binds MHC II, not part of the presenting molecule."
      - "B7 is a costimulatory molecule on APCs (signal 2), not part of MHC I."
      - "CD40L is on activated T helper cells; it binds CD40 on B cells and macrophages."
    src: { page: 98, quote: "Present endogenous antigens (eg, viral or cytosolic proteins) to CD8+ cytotoxic T cells" }
    status: unverified
  # ---------- p98: bare lymphocyte syndrome ----------
  - id: imm.L02.016
    kind: table
    topic: bare-lymphocyte-syndrome
    title: Bare lymphocyte syndrome (autosomal recessive; ↓ MHC → T-cell dysfunction)
    columns: [Type, Defect, Result, Clinical picture]
    rows:
      - [Type I, TAP mutation, ↓ MHC I → ↓ CD8+ T cells, "Chronic respiratory infections, skin granulomas, vasculitis; normal Ig"]
      - [Type II, Transcription factor mutations, ↓ MHC II → ↓ CD4+ T cells + APC/B-cell dysfunction, SCID-like infections; ↓ Ig]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [1, 3]]
    src: { page: 98, quote: "Type I: TAP mutation → ↓ MHC I → ↓ CD8+ T cells → chronic respiratory infections, skin granulomas, vasculitis; normal Ig." }
    status: unverified
  - id: imm.L02.017
    kind: card
    topic: bare-lymphocyte-syndrome
    front: What is the inheritance and treatment of bare lymphocyte syndrome?
    back: "Autosomal recessive. Treatment: allogeneic hematopoietic stem cell transplant, IVIG."
    src: { page: 98, quote: "Treatment: allogeneic hematopoietic stem cell transplant, IVIG." }
    status: unverified
  - id: imm.L02.018
    kind: mcq
    topic: bare-lymphocyte-syndrome
    stem: >-
      An 8-month-old girl, the child of consanguineous parents, has had recurrent pneumonia, chronic
      diarrhea and oral thrush since age 3 months. Serum IgG, IgA and IgM are very low. Flow cytometry
      shows normal numbers of B cells but markedly reduced CD4+ T cells; CD8+ T cells are normal. Her
      B cells and monocytes do not express HLA-DR. A defect in which of the following is most likely?
    options:
      - TAP transporter
      - Transcription factors that drive MHC II expression
      - β2-microglobulin
      - FOXP3
      - AIRE
    answer: 1
    why:
      - "A TAP defect lowers MHC I and CD8+ cells (type I bare lymphocyte syndrome) with normal Ig."
      - "Right. Type II bare lymphocyte syndrome: transcription factor mutations → ↓ MHC II (no HLA-DR) → ↓ CD4+ T cells and APC/B-cell dysfunction → SCID-like infections with ↓ Ig."
      - "β2-microglobulin is part of MHC I, so its loss would lower MHC I and CD8+ cells."
      - "FOXP3 deficiency is IPEX: autoimmune enteropathy and endocrinopathy in a boy."
      - "AIRE deficiency causes autoimmune polyendocrine syndrome, not low CD4+ counts."
    src: { page: 98, quote: "Type II: transcription factor mutations → ↓ MHC II → ↓ CD4+ T cells + antigen-presenting cell/B-cell dysfunction → SCID-like infections; ↓ Ig." }
    status: unverified
