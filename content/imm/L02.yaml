  - id: imm.L02.011
    kind: card
    topic: mhc-i-and-ii
    front: What do MHC molecules do, and which genes encode them?
    back: They present antigen fragments to T cells and bind T-cell receptors (TCRs). They are encoded by HLA genes.
    src: { page: 98, quote: "MHC encoded by HLA genes. Present antigen fragments to T cells and bind T-cell receptors (TCRs)." }
    status: unverified
