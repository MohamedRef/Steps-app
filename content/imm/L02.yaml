  - id: imm.L02.013
    kind: cloze
    topic: mhc-i-and-ii
    text: Peptides are loaded onto MHC I in the {{c1::RER}} after delivery by {{c2::TAP}} (transporter associated with antigen processing); MHC I associates with {{c3::β2-microglobulin}}.
    src: { page: 98, quote: "Antigen peptides loaded onto MHC I in RER after delivery via TAP (transporter associated with antigen processing)" }
    status: unverified
  - id: imm.L02.014
    kind: cloze
    topic: mhc-i-and-ii
