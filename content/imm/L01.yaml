    topic: lymphatic-drainage-associations
    title: Lymphatic drainage associations (abdomen, pelvis and leg)
    columns: [Lymph node cluster, Area of body drained, Associated pathology]
    rows:
      - ["Celiac", "Liver, stomach, spleen, pancreas, upper duodenum", "Mesenteric lymphadenitis; inflammatory bowel disease; celiac disease"]
      - ["Superior mesenteric", "Lower duodenum, jejunum, ileum, colon to splenic flexure", "Mesenteric lymphadenitis; inflammatory bowel disease; celiac disease"]
      - ["Inferior mesenteric", "Colon from splenic flexure to upper rectum", "Mesenteric lymphadenitis; inflammatory bowel disease; celiac disease"]
      - ["Periumbilical (Sister Mary Joseph node)", "Abdomen, pelvis", "Gastric cancer"]
      - ["Para-aortic", "Pair of testes, ovaries, kidneys, fallopian tubes, fundus of uterus", "Metastasis"]
