    topic: lymphatic-drainage-associations
    text: The anal canal above the pectinate line drains to the {{c1::internal iliac}} nodes; below the pectinate line it drains to the {{c2::superficial inguinal}} nodes.
    src: { page: 95, quote: "lower rectum to anal canal (above pectinate line) Superﬁcial inguinal Distal vagina, vulva, scrotum, urethra, anal canal (below pectinate line)" }
    status: unverified
  - id: imm.L01.018
    kind: cloze
    topic: lymphatic-drainage-associations
    text: "Lateral foot/leg cellulitis enlarges the {{c1::popliteal}} nodes (\"pop-lateral\"); medial foot/leg cellulitis enlarges the {{c2::superficial inguinal}} nodes."
    src: { page: 95, quote: "Popliteal (“pop-lateral”) Dorsolateral foot, posterior calf Lateral foot/leg cellulitis" }
    status: unverified
  - id: imm.L01.019
    kind: card
    topic: lymphatic-drainage-associations
    front: Epitrochlear lymphadenopathy is classically associated with which infection?
    back: Secondary syphilis (the epitrochlear nodes drain the hand and forearm).
    src: { page: 95, quote: "Epitrochlear Hand, forearm Secondary syphilis" }
    status: unverified
  - id: imm.L01.020
    kind: card
    topic: lymphatic-drainage-associations
    front: How does hilar adenopathy differ between pulmonary TB and sarcoidosis?
    back: "Pulmonary TB: unilateral hilar. Sarcoidosis: bilateral hilar."
    src: { page: 95, quote: "Pulmonary TB (unilateral hilar) Sarcoidosis (bilateral hilar)" }
    status: unverified
  - id: imm.L01.021
    kind: card
    topic: lymphatic-drainage-associations
    front: What do the right lymphatic duct and the thoracic duct drain, and where do they empty?
    back: "Right lymphatic duct: right side of the body above the diaphragm → junction of the right subclavian and internal jugular veins. Thoracic duct: everything below the diaphragm plus the left thorax and left upper limb → junction of the left subclavian and internal jugular veins."
    src: { page: 95, quote: "Right lymphatic duct drains right side of body above diaphragm into junction of the right subclavian and internal jugular vein Thoracic duct drains below the diaphragm and left thorax and upper limb into junction of left subclavian and internal jugular veins" }
    status: unverified
  - id: imm.L01.022
    kind: card
    topic: lymphatic-drainage-associations
    front: Rupture of the thoracic duct can cause what?
    back: Chylothorax.
    src: { page: 95, quote: "rupture of thoracic duct can cause chylothorax" }
    status: unverified
  - id: imm.L01.023
    kind: mcq
    topic: lymphatic-drainage-associations
    stem: >-
      A 31-year-old man comes to the physician because of a painless, firm mass in his left testis for
      2 months. Ultrasonography shows a solid intratesticular mass. Orchiectomy shows a germ cell tumor.
      To which lymph node group is this tumor most likely to spread first?
    options:
      - Superficial inguinal nodes
      - Para-aortic nodes
      - Internal iliac nodes
      - External iliac nodes
      - Inferior mesenteric nodes
    answer: 1
    why:
      - "Superficial inguinal nodes drain the scrotum, not the testis; a scrotal skin cancer would go there."
      - "Right. The testes drain to the para-aortic nodes, because they descend from the posterior abdominal wall and keep their lymphatics."
      - "Internal iliac nodes drain the cervix, prostate, inferior bladder and anal canal above the pectinate line."
      - "External iliac nodes drain the body of the uterus, cervix and superior bladder."
      - "Inferior mesenteric nodes drain the colon from the splenic flexure to the upper rectum."
    src: { page: 95, quote: "Para-aortic Pair of testes, ovaries, kidneys, fallopian tubes, fundus of uterus Metastasis" }
    status: unverified
  # ---------- p96: spleen ----------
  - id: imm.L01.024
    kind: card
    topic: spleen
    front: Where is the spleen, and why is it commonly injured?
    back: In the LUQ of the abdomen, anterolateral to the left kidney, deep to the 9th-11th ribs; commonly injured in blunt abdominal trauma.
    src: { page: 96, quote: "Located in LUQ of abdomen. Anterolateral to left kidney, deep to the 9th-11th ribs; commonly injured in blunt abdominal trauma." }
    status: unverified
  - id: imm.L01.025
    kind: table
    topic: spleen
    title: Spleen white pulp zones
    columns: [Zone, Cells, Location]
    rows:
      - [Periarteriolar lymphatic sheath (PALS), T cells, Within white pulp]
      - [Follicle, B cells, Within white pulp]
      - [Marginal zone, "Macrophages and specialized B cells; site where APCs capture blood-borne antigens", Between red pulp and white pulp]
    blanks: [[0, 1], [1, 1], [2, 1], [2, 2]]
    src: { page: 96, quote: "Contains T cells. Located within white pulp. Follicle Contains B cells. Located within white pulp. Marginal zone Contains macrophages and specialized B cells." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.026
    kind: card
    topic: spleen
    front: What happens in the splenic marginal zone?
    back: Antigen-presenting cells (APCs) capture blood-borne antigens for recognition by lymphocytes. It contains macrophages and specialized B cells and lies between red and white pulp.
    src: { page: 96, quote: "Contains macrophages and specialized B cells. Site where antigen-presenting cells (APCs) capture blood-borne antigens for recognition by lymphocytes. Located between red pulp and white pulp." }
    status: unverified
  - id: imm.L01.027
    kind: order
    topic: spleen
    prompt: Put the chain that links splenic dysfunction to infection in order.
    steps:
      - Splenic dysfunction (postsplenectomy, sickle cell autosplenectomy)
      - ↓ IgM
      - ↓ Complement activation
      - ↓ C3b opsonization
      - ↑ Susceptibility to encapsulated organisms
    src: { page: 96, quote: "Splenic dysfunction (eg, postsplenectomy, sickle cell disease autosplenectomy) IgM complement activation C3b opsonization susceptibility to encapsulated organisms" }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.028
    kind: cloze
    topic: spleen
    text: "After splenectomy, patients should be vaccinated against encapsulated organisms, from most to least common: {{c1::pneumococci}}, {{c2::meningococci}}, {{c3::Haemophilus influenzae type b}}."
    src: { page: 96, quote: "against which patients should be vaccinated (from most to least common: pneumococci, meningococci, Haemophilus influenzae type b [Hib])." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.029
    kind: enumerate
    topic: spleen
    prompt: Enumerate the postsplenectomy findings (4).
    points:
      - Howell-Jolly bodies (nuclear remnants)
      - Target cells
      - Thrombocytosis (loss of sequestration and removal)
      - Lymphocytosis (loss of sequestration)
    pass: 4
    hook: "الطحال كان الزبّال اللي بيلم: من غيره الـ RBCs بتفضل بزبالتها (Howell-Jolly و target cells)، والـ platelets والـ lymphocytes بتفضل سايبة في الدم (thrombocytosis و lymphocytosis)."
    src: { page: 96, quote: "Postsplenectomy findings: Howell-Jolly bodies (nuclear remnants) Target cells Thrombocytosis (loss of sequestration and removal) Lymphocytosis (loss of sequestration)" }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.030
    kind: mcq
    topic: spleen
    stem: >-
      A 24-year-old man is brought to the emergency department with fever, confusion and a petechial
      rash 12 hours after a sore throat. Three years ago he underwent splenectomy after a motorcycle
      crash. His blood pressure is 82/50 mm Hg. A peripheral blood smear taken before antibiotics would
      most likely show which of the following?
    options:
      - Schistocytes and thrombocytopenia
      - Howell-Jolly bodies and thrombocytosis
      - Spherocytes and reticulocytopenia
      - Ringed sideroblasts
      - Hypersegmented neutrophils
    answer: 1
    why:
      - "Schistocytes and low platelets suggest a microangiopathy (it may come later with DIC), but they are not the baseline asplenic smear."
      - "Right. Without a spleen, nuclear remnants stay in RBCs (Howell-Jolly bodies), and platelets are no longer sequestered or removed (thrombocytosis)."
      - "Spherocytes point to hereditary spherocytosis or autoimmune hemolysis, and a spleen would remove them."
      - "Ringed sideroblasts are a bone marrow finding of sideroblastic anemia."
      - "Hypersegmented neutrophils point to B12 or folate deficiency."
    src: { page: 96, quote: "Postsplenectomy findings: Howell-Jolly bodies (nuclear remnants) Target cells Thrombocytosis (loss of sequestration and removal)" }
    status: unverified
  # ---------- p96: thymus ----------
  - id: imm.L01.031
    kind: card
    topic: thymus
    front: Where is the thymus, and what is its function?
    back: In the anterosuperior mediastinum; the site of T-cell differentiation and maturation. It is encapsulated.
    src: { page: 96, quote: "Located in the anterosuperior mediastinum. Site of T-cell differentiation and maturation. Encapsulated." }
    status: unverified
  - id: imm.L01.032
    kind: cloze
    topic: thymus
    text: Thymus epithelium is derived from the {{c1::third pharyngeal pouch}} ({{c2::endoderm}}), whereas thymic lymphocytes are of {{c3::mesodermal}} origin.
    src: { page: 96, quote: "Thymus epithelium is derived from third pharyngeal pouch (endoderm), whereas thymic lymphocytes are of mesodermal origin." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.033
    kind: card
    topic: thymus
    front: How do the thymic cortex and medulla differ?
    back: The cortex is dense with immature T cells. The medulla is pale, with mature T cells and Hassall corpuscles (containing epithelial reticular cells).
    src: { page: 96, quote: "Cortex is dense with immature T cells; medulla is pale with mature T cells and Hassall corpuscles containing epithelial reticular cells." }
    status: unverified
  - id: imm.L01.034
    kind: card
    topic: thymus
    front: What does the normal neonatal thymus look like on chest x-ray, and when does it involute?
    back: '"Sail-shaped"; it involutes by age 3 years.'
    src: { page: 96, quote: "Normal neonatal thymus “sail-shaped” on CXR (arrows in A ), involutes by age 3 years." }
    status: unverified
  - id: imm.L01.035
    kind: card
    topic: thymus
    front: In which immunodeficiencies is the thymic shadow absent or the thymus hypoplastic?
    back: Some immunodeficiencies, e.g., SCID and DiGeorge syndrome.
    src: { page: 96, quote: "Absent thymic shadow or hypoplastic thymus seen in some immunodeficiencies (eg, SCID, DiGeorge syndrome)." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.036
    kind: enumerate
    topic: thymus
    prompt: Enumerate the conditions associated with thymoma (4).
    points:
      - Myasthenia gravis
      - Superior vena cava syndrome
      - Pure red cell aplasia
      - Good syndrome
    pass: 4
    hook: "الـ thymoma بيعمل MSPG: Myasthenia، SVC syndrome، Pure red cell aplasia، Good syndrome."
    src: { page: 96, quote: "Thymoma—neoplasm of thymus. Associated with myasthenia gravis, superior vena cava syndrome, pure red cell aplasia, Good syndrome." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.037
    kind: enumerate
    topic: thymus
    prompt: Enumerate the features of thymus involution (the book's "Thymus FADES").
    points:
      - "Fatty replacement of tissue"
      - "Age-related Atrophy (accelerated after puberty)"
      - "Decline in naïve T cells (↓ IL-7, thymopoietin)"
      - "Elderly immunosenescence (↓ vaccine response)"
      - "Partly reversible with ↓ cortisol; ↓ Size, cellularity, function"
    pass: 4
    hook: "الكتاب بيقولها: Thymus FADES، الغدة بتبهت: Fat، Atrophy، Decline في الـ naïve T، Elderly، Size."
    src: { page: 96, quote: "Thymus involution—Fatty replacement of tissue due to age-related Atrophy (accelerated after puberty) Decline in naïve T cells ( IL- 7, thymopoietin), Elderly immunosenescence ( vaccine response)" }
    status: unverified
  - id: imm.L01.038
    kind: mcq
    topic: thymus
    stem: >-
      A 52-year-old woman comes to the physician because of double vision and drooping eyelids that
      worsen toward evening. Her ptosis improves after an ice pack is placed on the eyelids. Serum
      acetylcholine receptor antibodies are positive. Further evaluation of this patient is most likely
      to show a mass in which location?
    options:
      - Anterosuperior mediastinum
      - Posterior mediastinum
      - Middle mediastinum, at the carina
      - Lung apex
      - Left upper quadrant of the abdomen
    answer: 0
    why:
      - "Right. This is myasthenia gravis, which is associated with thymoma; the thymus sits in the anterosuperior mediastinum."
      - "Posterior mediastinal masses are classically neurogenic tumors, not thymus."
      - "Carinal masses are lymph nodes or bronchogenic lesions, not the thymus."
      - "An apical lung (Pancoast) tumor causes Horner syndrome, not fatigable ptosis with AChR antibodies."
      - "The LUQ holds the spleen, not the thymus."
    src: { page: 96, quote: "Thymoma—neoplasm of thymus. Associated with myasthenia gravis" }
    status: unverified
    tags: [high-yield]
