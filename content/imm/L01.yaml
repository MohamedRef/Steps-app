    src: { page: 95, quote: "Para-aortic Pair of testes, ovaries, kidneys, fallopian tubes, fundus of uterus Metastasis" }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.014
    kind: card
    topic: lymphatic-drainage-associations
    front: Enlargement of the left supraclavicular (Virchow) node suggests malignancy where?
    back: The left supraclavicular node drains the left hemithorax, abdomen and pelvis, so malignancies of the thorax, abdomen or pelvis.
    src: { page: 95, quote: "Left (Virchow node): left hemithorax, abdomen, pelvis Malignancies of thorax, abdomen, pelvis" }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.015
    kind: card
    topic: lymphatic-drainage-associations
    front: What is the Sister Mary Joseph node, and with which cancer is it classically associated?
    back: A periumbilical node that drains the abdomen and pelvis; classically gastric cancer.
    src: { page: 95, quote: "Periumbilical (Sister Mary Joseph node) Abdomen, pelvis Gastric cancer" }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.016
    kind: card
    topic: lymphatic-drainage-associations
    front: Where does testicular (or ovarian) cancer first spread through lymphatics, and where does scrotal skin drain?
    back: "Testes and ovaries: para-aortic nodes. Scrotum: superficial inguinal nodes."
    src: { page: 95, quote: "Para-aortic Pair of testes, ovaries, kidneys, fallopian tubes, fundus of uterus Metastasis" }
    status: unverified
    tags: [high-yield]
