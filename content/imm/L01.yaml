  # ---------- p94: lymph node ----------
  - id: imm.L01.003
    kind: card
    topic: lymph-node
    front: Describe the structure of a lymph node (afferents, efferents, capsule).
    back: A 2° lymphoid organ with many afferent lymphatics and 1 or more efferents. It is encapsulated, with trabeculae.
    src: { page: 94, quote: "A 2° lymphoid organ that has many afferents, 1 or more efferents. Encapsulated, with trabeculae" }
    status: unverified
  - id: imm.L01.004
    kind: enumerate
    topic: lymph-node
    prompt: Enumerate the functions of a lymph node (3).
    points:
      - Nonspecific filtration by macrophages
      - Circulation of B and T cells
      - Immune response activation
    pass: 3
    hook: "الـ lymph node زي كمين على الطريق: بيفلتر (macrophages)، وبيلف فيه العساكر (B و T)، وبيدّي إنذار (activation)."
    src: { page: 94, quote: "Functions are nonspecific filtration by macrophages, circulation of B and T cells, and immune response activation." }
    status: unverified
  - id: imm.L01.005
    kind: card
    topic: lymph-node
    front: Where is the lymph node follicle, and what happens there?
    back: In the outer cortex; it is the site of B-cell localization and proliferation.
    src: { page: 94, quote: "Located in outer cortex; site of B-cell localization and proliferation." }
    status: unverified
  - id: imm.L01.006
    kind: card
    topic: lymph-node
    front: How do 1° and 2° lymph node follicles differ?
    back: 1° follicles are dense and quiescent. 2° follicles have pale central germinal centers and are active.
    src: { page: 94, quote: "1° follicles are dense and quiescent. 2° follicles have pale central germinal centers and are active." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.007
    kind: card
    topic: lymph-node
    front: What makes up the lymph node medulla?
    back: Medullary cords (closely packed lymphocytes and plasma cells) and medullary sinuses (reticular cells and macrophages). The medullary sinuses communicate with the efferent lymphatics.
    src: { page: 94, quote: "Consists of medullary cords (closely packed lymphocytes and plasma cells) and medullary sinuses (contain reticular cells and macrophages). Medullary sinuses communicate with efferent lymphatics." }
    status: unverified
  - id: imm.L01.008
    kind: cloze
    topic: lymph-node
    text: The lymph node paracortex contains {{c1::T cells}} and {{c2::high endothelial venules}}, through which T and B cells enter from blood.
    src: { page: 94, quote: "Paracortex Contains T cells. Region of cortex between follicles and medulla. Contains high endothelial venules through which T and B cells enter from blood." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.009
    kind: card
    topic: lymph-node
    front: In which syndrome is the lymph node paracortex underdeveloped, and why?
    back: DiGeorge syndrome. The paracortex is the T-cell zone, and DiGeorge patients lack a normal thymus, so they make few T cells.
    src: { page: 94, quote: "Underdeveloped in patients with DiGeorge syndrome." }
    status: unverified
    tags: [high-yield]
  - id: imm.L01.010
    kind: card
    topic: lymph-node
    front: Which lymph node region enlarges in an extreme cellular immune response, and with what infection is this classic?
    back: The paracortex (paracortical hyperplasia → lymphadenopathy), e.g., EBV and other viral infections.
    src: { page: 94, quote: "Paracortex enlarges in an extreme cellular immune response (eg, EBV and other viral infections paracortical hyperplasia lymphadenopathy)." }
    status: unverified
  - id: imm.L01.011
    kind: mcq
    topic: lymph-node
    stem: >-
      A 6-month-old boy is evaluated for recurrent viral and fungal infections. At birth he had
      hypocalcemic seizures, and echocardiography showed a conotruncal heart defect. Chest x-ray shows
      no thymic shadow. A biopsy of an inguinal lymph node is performed. Which region of the node is
      most likely to be poorly developed?
    options:
      - Primary follicles of the outer cortex
      - Germinal centers of secondary follicles
      - Paracortex
      - Medullary cords
      - Subcapsular sinus
    answer: 2
    why:
      - "Primary follicles hold B cells, which mature in the bone marrow and are spared in DiGeorge syndrome."
      - "Germinal centers are B-cell zones; they may be smaller from lack of T-cell help, but the zone the book names as underdeveloped is the T-cell zone."
      - "Right. This is DiGeorge syndrome (no thymus, hypocalcemia, conotruncal defect). The paracortex is the T-cell zone, and it is underdeveloped."
      - "Medullary cords hold lymphocytes and plasma cells (B-cell lineage); they are not the classic finding."
      - "The subcapsular sinus is where afferent lymph enters; it is not a T-cell zone."
    src: { page: 94, quote: "Paracortex Contains T cells. Region of cortex between follicles and medulla. Contains high endothelial venules through which T and B cells enter from blood. Underdeveloped in patients with DiGeorge syndrome." }
    status: unverified
  # ---------- p95: lymphatic drainage associations ----------
  - id: imm.L01.012
    kind: table
    topic: lymphatic-drainage-associations
    title: Lymphatic drainage associations (head, neck and chest)
    columns: [Lymph node cluster, Area of body drained, Associated pathology]
    rows:
      - ["Submandibular, submental", "Oral cavity, anterior tongue, lower lip", "Malignancy of and metastasis to the oral cavity"]
      - ["Deep cervical", "Head, neck, oropharynx", "Upper respiratory tract infection; infectious mononucleosis; Kawasaki disease; malignancy of head, neck, oropharynx"]
      - ["Supraclavicular", "Right: right hemithorax. Left (Virchow node): left hemithorax, abdomen, pelvis", "Malignancies of thorax, abdomen, pelvis"]
      - ["Mediastinal", "Trachea, esophagus", "Pulmonary TB (unilateral hilar); sarcoidosis (bilateral hilar); lung cancer; granulomatous disease"]
