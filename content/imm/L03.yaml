  - id: imm.L03.007
    kind: mcq
    topic: antibody-structure-and-function
    stem: >-
      A 4-month-old boy is brought to the physician because of recurrent oral candidiasis, chronic
      diarrhea and poor weight gain. He now has Pneumocystis pneumonia. His newborn screen showed absent
      T-cell receptor excision circles (TRECs). A chest x-ray shows no thymic shadow. Flow cytometry shows
      almost no T or B cells, with a normal number of NK cells. Adenosine deaminase activity in his red
      cells is normal. Which of the following processes is most likely defective in this patient?
    options:
      - Random addition of nucleotides by TdT
      - V(D)J recombination
      - Isotype switching of the constant region
      - Somatic hypermutation of the variable region
      - Pairing of heavy chains with light chains
    answer: 1
    why:
      - "TdT only adds extra nucleotides at the junctions to increase diversity; without it receptors still form, so T and B cells would not be absent."
      - "Right. Absent T and B cells with spared NK cells and normal ADA fits RAG1/RAG2 deficiency: the receptor genes cannot be cut and rejoined (VJ and V(D)J recombination), so neither T- nor B-cell receptors form and SCID results."
      - "Isotype switching is a later, antigen-driven step that needs CD40L and cytokines; it does not explain missing T cells."
      - "Somatic hypermutation happens in germinal centers after antigen exposure; it does not explain missing T and B cells."
      - "Random heavy-light pairing needs receptor genes that have already been recombined, and T cells do not use it."
    src: { page: 102, quote: "Random recombination of VJ (light-chain) or V(D)J (heavy-chain) genes by RAG1 and RAG2" }
    status: unverified
  # ---------- p103: immunoglobulin isotypes ----------
  - id: imm.L03.008
    kind: card
    topic: immunoglobulin-isotypes
    front: Which isotypes do mature naïve B cells express before activation, and what do they become?
    back: "IgM and IgD on the surface. In germinal centers they may isotype switch (gene rearrangement induced by cytokines and CD40L) and become plasma cells that secrete IgA, IgG or IgE (\"IgMom and IgDad mature to plasma cells as they AGE\")."
    src: { page: 103, quote: "Mature, naïve B cells prior to activation express IgM and IgD on their surfaces. They may differentiate in germinal centers of lymph nodes by isotype switching (gene rearrangement; induced by cytokines and CD40L) into plasma cells that secrete IgA, IgG, or IgE." }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.009
    kind: card
    topic: immunoglobulin-isotypes
    front: What is the difference between affinity and avidity?
    back: "Affinity is how tightly one antigen-binding site holds one antigen. Avidity is the total grip of a molecule that binds through several sites at once; the hinge region and heavy chain domains increase it."
    src: { page: 103, quote: "Affinity refers to the strength of a single antibody–antigen interaction. Avidity (enhanced by the hinge region and heavy chain domains) describes the overall binding strength resulting from multiple antibody–antigen interactions in a multivalent molecule." }
    status: unverified
  - id: imm.L03.010
    kind: table
    topic: immunoglobulin-isotypes
    title: Immunoglobulin isotypes
    columns: [Isotype, Key features]
    rows:
      - ["IgG", "Main antibody of the 2° response; most abundant in serum; fixes complement, opsonizes, neutralizes toxins and viruses; only isotype that crosses the placenta; warm AIHA"]
      - ["IgA", "Prevents attachment to mucous membranes; no complement fixation; monomer in blood, dimer (J chain) when secreted; transcytosis; most produced overall; in secretions and breast milk; secretory component"]
      - ["IgM", "First antibody produced; fixes complement; B-cell antigen receptor; monomer on B cell, pentamer (J chain) when secreted; cold AIHA"]
      - ["IgD", "On the surface of mature naïve B cells; low serum levels"]
      - ["IgE", "Binds mast cells and basophils; cross-linked by allergen → type I hypersensitivity; antiparasite immunity by activating eosinophils"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 103, quote: "Main antibody in 2° response to an antigen. Most abundant isotype in serum. Fixes complement, opsonizes bacteria, neutralizes bacterial toxins and viruses. Only isotype that crosses the placenta" }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.011
    kind: card
    topic: immunoglobulin-isotypes
    front: Which is the only immunoglobulin isotype that crosses the placenta, and what does it give the infant?
    back: "IgG (\"IgG Greets the Growing fetus\"). It provides passive immunity that starts to wane after birth."
    src: { page: 103, quote: "Only isotype that crosses the placenta (provides infants with passive immunity that starts to wane after birth). “IgG Greets the Growing fetus.”" }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.012
    kind: cloze
    topic: immunoglobulin-isotypes
    text: "{{c1::IgG}} is associated with warm autoimmune hemolytic anemia; {{c2::IgM}} is associated with cold autoimmune hemolytic anemia."
    src: { page: 103, quote: "Associated with warm autoimmune hemolytic anemia (“warm weather is Good!”). IgA J chain J chain IgG IgA IgM IgD IgE Prevents attachment of bacteria and viruses to mucous membranes; does not fix complement. Monomer (in circulation) or dimer (with J chain when secreted). Crosses epithelial cells by transcytosis. Produced in GI tract (eg, by Peyer patches) and protects against gut infections (eg, Giardia). Most produced antibody overall, but has lower serum concentrations. Released into secretions (tears, saliva, mucus) and breast milk. Picks up secretory component from epithelial cells, which protects the Fc portion from luminal proteases. IgM J chain J chain IgG IgA IgM IgD IgE First antibody to be produced during an immune response. Fixes complement. Antigen receptor on the surface of B cells. Monomer on B cell, pentamer with J chain when secreted. Pentamer enables avid binding to antigen while humoral response evolves. Associated with cold autoimmune hemolytic anemia." }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.013
    kind: card
    topic: immunoglobulin-isotypes
    front: IgA is the most produced antibody overall; why are its serum levels lower, and what protects it in the lumen?
    back: It is mostly released into secretions (tears, saliva, mucus) and breast milk, crossing epithelial cells by transcytosis. It picks up the secretory component from epithelial cells, which protects the Fc portion from luminal proteases.
    src: { page: 103, quote: "Most produced antibody overall, but has lower serum concentrations. Released into secretions (tears, saliva, mucus) and breast milk. Picks up secretory component from epithelial cells, which protects the Fc portion from luminal proteases." }
    status: unverified
  - id: imm.L03.014
    kind: cloze
    topic: immunoglobulin-isotypes
    text: IgA is produced in the GI tract (e.g., by {{c1::Peyer patches}}) and protects against gut infections such as {{c2::Giardia}}.
    src: { page: 103, quote: "Produced in GI tract (eg, by Peyer patches) and protects against gut infections (eg, Giardia)." }
    status: unverified
  - id: imm.L03.015
    kind: card
    topic: immunoglobulin-isotypes
    front: Why is IgM a pentamer when secreted?
    back: The pentamer (with J chain) enables avid binding to antigen while the humoral response evolves. IgM is the first antibody produced and fixes complement; it is a monomer on the B-cell surface.
    src: { page: 103, quote: "Monomer on B cell, pentamer with J chain when secreted. Pentamer enables avid binding to antigen while humoral response evolves." }
    status: unverified
  - id: imm.L03.016
    kind: mcq
    topic: immunoglobulin-isotypes
    stem: >-
      A 5-day-old boy born at term to a mother with documented immunity to measles is brought for a
      well-baby visit. The mother asks how her son is protected against measles before he can be
      vaccinated. Antibodies of which isotype in the infant's serum provide this protection, and what
      property allows them to be there?
    options:
      - IgA, which is secreted as a dimer with J chain
      - IgG, which crosses the placenta
      - IgM, which is the first antibody produced in a response
      - IgE, which binds mast cells
      - IgD, which is expressed on naïve B cells
    answer: 1
    why:
      - "Breast-milk IgA protects the gut lumen; it is not the serum antibody crossing from mother."
      - "Right. IgG is the only isotype that crosses the placenta, giving passive immunity that wanes after birth."
      - "IgM is a pentamer that does not cross the placenta; IgM in a newborn suggests fetal infection."
      - "IgE mediates allergy and antiparasite defense."
      - "IgD sits on naïve B cells and has low serum levels."
    src: { page: 103, quote: "Only isotype that crosses the placenta (provides infants with passive immunity that starts to wane after birth)." }
    status: unverified
  # ---------- p103: antigen type and memory ----------
  - id: imm.L03.017
    kind: table
    topic: antigen-type-and-memory
    title: Thymus-independent vs thymus-dependent antigens
    columns: [Antigen type, What it is, Consequence]
    rows:
      - ["Thymus-independent", "Lacks a peptide component (e.g., LPS of gram ⊝ bacteria); cannot be presented by MHC to T cells", "Weakly immunogenic; vaccines often need boosters and adjuvants (e.g., PPSV23 capsular polysaccharide)"]
      - ["Thymus-dependent", "Contains a protein component (e.g., diphtheria toxoid)", "Class switching and immunologic memory from direct contact of B cells with Th cells"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 103, quote: "Antigens lacking a peptide component (eg, lipopolysaccharides from gram ⊝ bacteria); cannot be presented by MHC to T cells. Weakly immunogenic; vaccines often require boosters and adjuvants" }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.018
    kind: mcq
    topic: antigen-type-and-memory
    stem: >-
      A 70-year-old man receives the 23-valent pneumococcal polysaccharide vaccine. Five years later his
      antipneumococcal antibody levels have fallen, and they rise only modestly after a second dose,
      without a faster or larger memory response. Which property of the vaccine antigen best explains
      this?
    options:
      - It is presented on MHC I to CD8+ T cells
      - It has no peptide to present on MHC to T cells
      - It is a live organism that reverts to virulence
      - It is a toxoid with an intact receptor binding site
      - It is degraded by the secretory component
    answer: 1
    why:
      - "Polysaccharides are not presented on MHC I or II."
      - "Right. A polysaccharide is a thymus-independent antigen: it cannot be shown to T cells, so there is no T-cell help for class switching and memory, and it is weakly immunogenic."
      - "PPSV23 is not live; it is a polysaccharide subunit vaccine."
      - "Toxoids (tetanus, diphtheria) are proteins and are thymus dependent."
      - "The secretory component protects IgA in the gut lumen; it has nothing to do with vaccine antigens."
    src: { page: 103, quote: "Antigens lacking a peptide component (eg, lipopolysaccharides from gram ⊝ bacteria); cannot be presented by MHC to T cells. Weakly immunogenic; vaccines often require boosters and adjuvants (eg, capsular polysaccharide subunit of Streptococcus pneumoniae PPSV23 vaccine)." }
    status: unverified
  # ---------- p104: complement ----------
  - id: imm.L03.019
    kind: card
    topic: complement
    front: What is complement, where is it made, and which test screens the classical pathway?
    back: Plasma proteins made by the liver that work in innate immunity and inflammation; their end product, the membrane attack complex (MAC), protects against gram ⊝ bacteria. The CH50 test screens the classical pathway.
    src: { page: 104, quote: "System of hepatically synthesized plasma proteins that play a role in innate immunity and inflammation. Membrane attack complex (MAC) defends against gram ⊝ bacteria. The CH50 test is used to screen for activation of the classical complement pathway." }
    status: unverified
