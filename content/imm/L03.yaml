  # ---------- p107: respiratory burst ----------
  - id: imm.L03.045
    kind: card
    topic: respiratory-burst
    front: What is the respiratory (oxidative) burst?
    back: Phagocytes such as neutrophils and monocytes switch on their NADPH oxidase complex, which consumes O2 and quickly releases reactive oxygen species (ROS). NADPH is needed both to make ROS and to neutralize them.
    src: { page: 107, quote: "Also called oxidative burst. Involves the activation of the phagocyte NADPH oxidase complex (eg, in neutrophils, monocytes), which utilizes O2 as a substrate." }
    status: unverified
