  - id: imm.L03.023
    kind: card
    topic: complement
    front: What are the two primary opsonins in bacterial defense, and what else does C3b do?
    back: C3b and IgG. They enhance phagocytosis. C3b also helps clear immune complexes (and binds bacterial lipopolysaccharides).
    src: { page: 104, quote: "Opsonins—C3b and IgG are the two 1° opsonins in bacterial defense; enhance phagocytosis. C3b also helps clear immune complexes." }
    status: unverified
    tags: [high-yield]
  - id: imm.L03.024
    kind: cloze
    topic: complement
    text: "{{c1::Decay-accelerating factor}} (DAF, CD55) and {{c2::C1 inhibitor}} prevent complement activation on self cells such as RBCs."
    src: { page: 104, quote: "Inhibitors—decay-accelerating factor (DAF, also called CD55) and C1 inhibitor (formerly called C1 esterase inhibitor) help prevent complement activation on self cells (eg, RBCs)." }
    status: unverified
  - id: imm.L03.025
    kind: mcq
    topic: complement
    stem: >-
      A 19-year-old college student is admitted with fever, neck stiffness and a petechial rash.
      Cerebrospinal fluid shows gram-negative diplococci. He had a similar illness 2 years ago and his
      older brother had meningococcal sepsis at age 16. Which complement function is most likely
      defective?
    options:
      - Opsonization by C3b
      - Neutrophil chemotaxis by C5a
      - Formation of C5b-9
      - Anaphylatoxin release by C3a and C4a
      - Inhibition of complement on RBCs by CD55
    answer: 2
    why:
      - "C3b deficiency gives severe recurrent pyogenic infections from many organisms, not a Neisseria-only picture."
      - "Loss of C5a chemotaxis alone does not give a selective Neisseria susceptibility; the MAC does."
      - "Right. The MAC (C5b-9) is important for neutralizing Neisseria; terminal complement deficiency gives recurrent Neisseria bacteremia."
      - "Anaphylatoxins cause vasodilation and mast-cell degranulation; their loss doesn't predispose to Neisseria."
      - "CD55 (DAF) loss causes complement-mediated hemolysis (PNH), not meningitis."
    src: { page: 104, quote: "MAC complex is important for neutralizing Neisseria species. Deficiency results in recurrent infection." }
    status: unverified
