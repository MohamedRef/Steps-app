  - id: imm.L03.034
    kind: mcq
    topic: complement-disorders
    stem: >-
      A 17-year-old girl has had recurrent episodes of painless, nonpitting swelling of her lips and
      hands, and colicky abdominal pain, since puberty. Episodes do not respond to antihistamines. Her
      father has similar episodes. Serum C4 is low. Which mediator is responsible for her swelling?
    options:
      - Histamine
      - Bradykinin
      - Leukotriene B4
      - C5a
      - Tryptase
    answer: 1
    why:
      - "Histamine-driven swelling comes with urticaria and responds to antihistamines."
      - "Right. C1 inhibitor deficiency → unregulated kallikrein → ↑ bradykinin → hereditary angioedema, with low C4. ACE inhibitors are contraindicated."
      - "Leukotriene B4 is a neutrophil chemoattractant."
      - "C5a is an anaphylatoxin and chemoattractant, not the cause of hereditary angioedema."
      - "Tryptase marks mast cell activation in anaphylaxis."
    src: { page: 105, quote: "Causes hereditary angioedema due to unregulated activation of kallikrein → ↑ bradykinin. Characterized by ↓ C4 levels." }
    status: unverified
  - id: imm.L03.035
    kind: mcq
    topic: complement-disorders
    stem: >-
      A 32-year-old man has fatigue and dark urine that is worst in the morning. Hemoglobin is 8.9 g/dL,
      with low leukocyte and platelet counts. Haptoglobin is undetectable and LDH is high. Direct
      Coombs test is negative. Abdominal ultrasonography shows hepatic vein thrombosis. Flow cytometry
      of his RBCs shows loss of a protein that normally inhibits formation of C5b-9. A drug against
      which target prevents his intravascular hemolysis?
    options:
      - C1 inhibitor
      - C5
