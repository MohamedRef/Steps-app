  # ---------- p102: antibody structure and function ----------
  - id: imm.L03.001
    kind: card
    topic: antibody-structure-and-function
    front: Which part of an antibody recognizes antigen, and which chains make it up?
    back: The Fab fragment, built from both a light and a heavy chain, is the part that binds antigen.
