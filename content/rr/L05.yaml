  - id: rr.L05.109
    kind: mcq
    topic: neurology
    stem: >-
      A 58-year-old woman is admitted with a serum sodium of 108 mEq/L. Her sodium is raised to 128 mEq/L
      over the next 24 hours. Three days later she develops quadriparesis, dysarthria and difficulty
      swallowing. MRI is most likely to show a lesion in which location?
    options:
      - Diffuse swelling of both cerebral hemispheres
      - Central pons
      - Left middle cerebral artery territory
      - Mammillary bodies
      - Ventral spinal nerve roots
    answer: 1
    why:
      - "Diffuse brain swelling is cerebral edema, the common distractor; it follows rapid ↓ Na+ (correcting hypernatremia too fast), not rapid ↑ Na+."
      - "Right. Correcting hyponatremia too fast (rapid ↑ Na+) causes osmotic demyelination, central pontine myelinolysis: demyelination in the central pons, which carries the corticospinal and corticobulbar tracts (quadriparesis, dysarthria, dysphagia)."
      - "An MCA stroke gives unilateral deficits, not quadriparesis with bulbar signs after a sodium correction."
      - "Mammillary body lesions are Wernicke-Korsakoff (thiamine deficiency): confusion, ophthalmoplegia, ataxia."
      - "Nerve root inflammation is Guillain-Barré, an ascending areflexic paralysis after an infection, not after correction of hyponatremia."
    src: { page: 741, quote: "Rapid ↑ Na+ = central pontine myelinolysis; rapid ↓ Na+ = cerebral edema" }
    status: unverified
