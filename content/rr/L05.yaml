  # ---------- p735-736: Biochemistry ----------
  - id: rr.L05.001
    kind: card
    topic: biochemistry
    front: "Shared features: hemolytic anemia with ↑ reticulocyte count and ↑ indirect bilirubin. The common distractor is G6PD deficiency; what is the correct answer, and which clues tell them apart?"
    back: "Pyruvate kinase deficiency. ↓ ATP → ↓ Na+/K+-ATPase function → echinocytes and hemolysis; the hallmark is ↑ 2,3-BPG (→ ↓ O2 affinity); autosomal recessive, so it affects both sexes."
    src: { page: 735, quote: "Involves ↓ ATP → ↓ Na+/K+-ATPase function → echinocytes/hemolysis; hallmark is ↑ 2,3-BPG (→ ↓ O2 affinity); autosomal recessive (affects both sexes)" }
    status: unverified
  - id: rr.L05.002
    kind: card
    topic: biochemistry
    front: "Shared features: tall, lanky adolescent with Marfanoid body habitus and lens dislocation. The common distractor is Marfan syndrome; what is the correct answer, and which clues tell them apart?"
    back: "Homocystinuria (eg, cystathionine-β-synthase deficiency). ↑ risk of thrombosis and inferomedial lens dislocation (Marfan: superotemporal); responsive to vitamin B6 and B12 supplementation."
    src: { page: 735, quote: "↑ risk of thrombosis and inferomedial lens dislocation (vs Marfan: superotemporal dislocation); responsive to vitamin B6 and B12 supplementation" }
    status: unverified
  - id: rr.L05.003
    kind: mcq
    topic: biochemistry
    stem: >-
      A 6-year-old girl is evaluated for fatigue and intermittent jaundice since infancy. Her parents are
      healthy and unaffected. Hemoglobin is low, the reticulocyte count is high, and indirect bilirubin is
      elevated. The blood smear shows echinocytes; no bite cells or Heinz bodies are seen. Red cell 2,3-BPG
      is markedly increased. Which of the following best explains her hemolysis?
    options:
      - Deficient NADPH from the pentose phosphate pathway, causing oxidant injury
      - Decreased ATP, impairing Na+/K+-ATPase function
      - Defective spectrin or ankyrin in the red cell membrane
      - Antibody-coated red cells removed in the spleen
      - Loss of GPI-anchored complement inhibitors
    answer: 1
    why:
      - "This is G6PD deficiency, the common distractor: X-linked, oxidant-triggered episodes with bite cells and Heinz bodies, not ↑ 2,3-BPG in a girl."
      - "Right. Pyruvate kinase deficiency: ↓ ATP → ↓ Na+/K+-ATPase → echinocytes and hemolysis; ↑ 2,3-BPG is the hallmark, and it is autosomal recessive (affects both sexes)."
      - "Membrane skeleton defects give hereditary spherocytosis (spherocytes), not echinocytes with ↑ 2,3-BPG."
      - "Autoimmune hemolysis gives spherocytes and a positive Coombs test, not a lifelong enzyme picture."
      - "Loss of GPI-anchored proteins is paroxysmal nocturnal hemoglobinuria, an intravascular complement-mediated hemolysis."
    src: { page: 735, quote: "Involves ↓ ATP → ↓ Na+/K+-ATPase function → echinocytes/hemolysis; hallmark is ↑ 2,3-BPG" }
    status: unverified
  - id: rr.L05.004
    kind: card
    topic: biochemistry
    front: "Shared features: infant with coarse facies, joint contractures and recurrent infections. The common distractor is Hurler syndrome (α-L-iduronidase deficiency); what is the correct answer, and which clues tell them apart?"
    back: "I-cell disease (N-acetylglucosamine-1-phosphotransferase defect). The Golgi apparatus fails to tag lysosomal enzymes with mannose-6-phosphate → ↑↑ plasma lysosomal enzymes; gingival hyperplasia."
    src: { page: 736, quote: "Golgi apparatus fails to tag lysosomal" }
    status: unverified
  - id: rr.L05.005
    kind: card
    topic: biochemistry
    front: "Shared features: young child with fasting hypoglycemia and hepatomegaly. The common distractor is Cori disease (debranching α-1,6-glucosidase deficiency); what is the correct answer, and which clue tells them apart?"
    back: "von Gierke disease (glucose-6-phosphatase deficiency). Lactic acidosis is present (the 'super-sick' kid); it is absent in Cori disease (the 'not-so-sick' kid)."
    src: { page: 736, quote: "Lactic acidosis present (“super-sick” kid); absent in Cori (“not-so-sick” kid)" }
    status: unverified
  - id: rr.L05.006
    kind: card
    topic: biochemistry
    front: "Shared features: inherited defect in a DNA repair pathway. The common distractor is a base-excision repair (glycosylase) defect; what is the correct answer, and which clues tell them apart?"
    back: "Nucleotide-excision repair defect → xeroderma pigmentosum. Pyrimidine dimers formed by UV radiation are not removed; presents with ↑ risk of skin cancer, +/– neurodegeneration."
    src: { page: 736, quote: "Defective nucleotide-excision repair → failure to remove pyrimidine dimers formed by UV radiation; presents with ↑ risk of skin cancer +/– neurodegeneration" }
    status: unverified
  - id: rr.L05.007
    kind: card
    topic: biochemistry
    front: "Shared features: familial clustering of colorectal cancer in multiple relatives. The common distractor is FAP or a base-excision repair defect; what is the correct answer, and which clues tell them apart?"
    back: "Lynch syndrome. Defective mismatch repair (MMR: MLH1/MSH2/MSH6/PMS2); microsatellite instability."
    src: { page: 736, quote: "Defective MMR (MLH1/MSH2/MSH6/PMS2); microsatellite instability" }
    status: unverified
  - id: rr.L05.008
    kind: mcq
    topic: biochemistry
    stem: >-
      A 2-year-old boy is brought to the clinic because he becomes lethargic and sweaty when meals are
      delayed. Examination shows a protuberant abdomen with a markedly enlarged liver. During an overnight
      fast his blood glucose falls to 35 mg/dL and arterial blood gas shows a high anion gap metabolic
      acidosis with a raised lactate. Deficiency of which enzyme is most likely?
    options:
      - Debranching enzyme (α-1,6-glucosidase)
      - Glucose-6-phosphatase
      - Lysosomal acid α-glucosidase
      - Muscle glycogen phosphorylase
      - α-L-iduronidase
    answer: 1
    why:
      - "Cori disease is the common distractor: fasting hypoglycemia and hepatomegaly too, but no lactic acidosis (the 'not-so-sick' kid)."
      - "Right. von Gierke disease: glucose-6-phosphatase deficiency; lactic acidosis is present (the 'super-sick' kid)."
      - "Acid α-glucosidase deficiency is Pompe disease, a lysosomal storage disease with cardiomegaly, not fasting hypoglycemia."
      - "Muscle phosphorylase deficiency (McArdle) gives exercise cramps and myoglobinuria, with no hypoglycemia or hepatomegaly."
      - "α-L-iduronidase deficiency is Hurler syndrome: coarse facies, corneal clouding, a storage disease, not fasting hypoglycemia."
    src: { page: 736, quote: "Lactic acidosis present (“super-sick” kid); absent in Cori (“not-so-sick” kid)" }
    status: unverified
  # ---------- p736: Immunology ----------
  - id: rr.L05.009
    kind: card
    topic: immunology
    front: "Shared features: teen with recurrent infections. The common distractor is CGD; what is the correct answer, and which clue tells them apart?"
    back: "C5-C9 (MAC) deficiency. Infection with Neisseria, to which patients with terminal complement defects are uniquely susceptible."
    src: { page: 736, quote: "Infection with Neisseria (to which patients with terminal complement defects are uniquely susceptible)" }
    status: unverified
  - id: rr.L05.010
    kind: card
    topic: immunology
    front: "Shared features: infant with disseminated mycobacterial/BCG infection. The common distractor is CGD; what is the correct answer, and which clues tell them apart?"
    back: "IL-12 receptor deficiency. Defective Th1 response → ↓ IFN-γ → severe mycobacterial infections."
    src: { page: 736, quote: "Defective Th1 response → ↓ IFN-γ → severe mycobacterial infections" }
    status: unverified
  - id: rr.L05.011
    kind: card
    topic: immunology
    front: "Shared features: boy with recurrent sinopulmonary infections and ↓ IgG/IgA. The common distractor is CVID; what is the correct answer, and which clues tell them apart?"
    back: "CD40L deficiency (X-linked hyper-IgM). Defective T-cell interaction with B cells → impaired class switching → ↑ IgM, ↓ IgG/IgA (CVID has no ↑ IgM)."
    src: { page: 736, quote: "Defective T-cell interaction with B cells → impaired class switching → ↑ IgM, ↓ IgG/IgA (vs no ↑ IgM in CVID)" }
    status: unverified
  - id: rr.L05.012
    kind: card
    topic: immunology
    front: "Shared features: recurrent facial/lip swelling. The common distractor is anaphylaxis; what is the correct answer, and which clues tell them apart?"
    back: "Hereditary angioedema. Mediated by bradykinin; lacks urticaria; can be precipitated by ACE inhibitors."
    src: { page: 736, quote: "Mediated by bradykinin; lacks urticaria; can be precipitated by ACE inhibitors" }
    status: unverified
  - id: rr.L05.013
    kind: card
    topic: immunology
    front: "Shared features: rash after drug exposure. The common distractor is type I hypersensitivity; what is the correct answer, and which clue tells it from an Arthus reaction?"
    back: "Type III hypersensitivity. It presents with a systemic reaction (an Arthus reaction is local immune complex deposition only)."
    src: { page: 736, quote: "Presents with systemic reaction (vs Arthus reaction: local immune complex deposition only)" }
    status: unverified
  - id: rr.L05.014
    kind: card
    topic: immunology
    front: "Shared features: child with recurrent skin infection. The common distractor is CGD; what is the correct answer, and which clues tell them apart?"
    back: "Job syndrome (hyper-IgE). Coarse facies with retained teeth; the susceptibility is due to impaired Th17 differentiation."
    src: { page: 736, quote: "Coarse facies with retained teeth; susceptibility is due to impaired Th17 differentiation" }
    status: unverified
  - id: rr.L05.015
    kind: card
    topic: immunology
    front: "Shared features: boy with immunodeficiency, recurrent infections and ↑ risk of malignancy. The common distractor is ataxia-telangiectasia; what is the correct answer, and which clues tell them apart?"
    back: "Wiskott-Aldrich syndrome. X-linked recessive; thrombocytopenia, eczema. Ataxia-telangiectasia instead has ataxia, ↑ AFP, telangiectasias, café-au-lait spots."
    src: { page: 736, quote: "X-linked recessive; thrombocytopenia, eczema (vs ataxia-telangiectasia: ataxia, ↑ AFP, telangiectasias, café-au-lait spots)" }
    status: unverified
  - id: rr.L05.016
    kind: card
    topic: immunology
    front: "Shared features: recurrent infections, autoimmune disease and allergic disorders. The common distractor is CVID; what is the correct answer, and which clues tell them apart?"
    back: "Selective IgA deficiency. ↓ IgA with normal IgM/IgG; ↑ risk of giardiasis."
    src: { page: 736, quote: "↓ IgA with normal IgM/IgG; ↑ risk of giardiasis" }
    status: unverified
  - id: rr.L05.017
    kind: mcq
    topic: immunology
    stem: >-
      A 17-year-old boy is admitted with fever, a petechial rash and neck stiffness. CSF Gram stain shows
      gram-negative diplococci. He had a similar meningococcal meningitis at age 14. Neutrophil oxidative
      burst testing (dihydrorhodamine) is normal. Serum immunoglobulin levels are normal. Which of the
      following is the most likely underlying defect?
    options:
      - NADPH oxidase deficiency
      - Deficiency of complement components C5-C9
      - Selective IgA deficiency
      - Common variable immunodeficiency
      - IL-12 receptor deficiency
    answer: 1
    why:
      - "CGD (NADPH oxidase) is the common distractor; it gives catalase ⊕ infections with an abnormal oxidative burst test, which is normal here."
      - "Right. Terminal complement (MAC, C5-C9) deficiency: patients are uniquely susceptible to Neisseria."
      - "Selective IgA deficiency has ↓ IgA, sinopulmonary infections, giardiasis and allergy, not recurrent Neisseria; his immunoglobulins are normal."
      - "CVID shows low immunoglobulins with recurrent sinopulmonary infections; his levels are normal."
      - "IL-12 receptor deficiency gives severe mycobacterial infections (↓ IFN-γ), not recurrent meningococcal disease."
    src: { page: 736, quote: "Infection with Neisseria (to which patients with terminal complement defects are uniquely susceptible)" }
    status: unverified
  - id: rr.L05.018
    kind: mcq
    topic: immunology
    stem: >-
      A 3-year-old boy has had recurrent sinusitis and two pneumonias, plus one episode of Pneumocystis
      pneumonia. His maternal uncle died of infections in childhood. Serum IgG and IgA are low, and IgM is
      markedly elevated. Which of the following is the most likely mechanism?
    options:
      - Failure of B cells to differentiate into plasma cells, with low levels of every immunoglobulin class
      - Defective CD40L on T cells, impairing class switching
      - Absent Bruton tyrosine kinase, with no mature B cells
      - Defective IL-12 receptor, with low IFN-γ
      - Defective microtubule polymerization in phagocytes
    answer: 1
    why:
      - "This describes CVID, the common distractor; CVID has no ↑ IgM."
      - "Right. CD40L deficiency (X-linked hyper-IgM): defective T-cell interaction with B cells → impaired class switching → ↑ IgM, ↓ IgG/IgA."
      - "Bruton agammaglobulinemia lowers all classes, IgM included."
      - "IL-12 receptor deficiency causes disseminated mycobacterial infection with normal immunoglobulin classes."
      - "Microtubule defects (Chédiak-Higashi) give albinism and pyogenic infections, not ↑ IgM with ↓ IgG/IgA."
    src: { page: 736, quote: "Defective T-cell interaction with B cells → impaired class switching → ↑ IgM, ↓ IgG/IgA (vs no ↑ IgM in CVID)" }
    status: unverified
  # ---------- p736-737: Microbiology ----------
  - id: rr.L05.019
    kind: card
    topic: microbiology
    front: "Shared features: acute bacterial meningitis due to a gram ⊝ organism in the CSF. The common distractor is Hib; what is the correct answer, and which clues tell them apart?"
    back: "N meningitidis. Epidemics + petechial rash + capsule; vaccines cover types A, C, Y, W-135; H influenzae is a coccobacillus."
    src: { page: 736, quote: "Epidemics + petechial rash + capsule; vaccines cover types A, C, Y, W-135; H influenzae is a coccobacillus" }
    status: unverified
  - id: rr.L05.020
    kind: card
    topic: microbiology
    front: "Shared features: soft tissue/wound infection with a gram ⊕, anaerobic, spore-forming bacillus. The common distractor is C tetani; what is the correct answer, and which clues tell them apart?"
    back: "C perfringens. Alpha toxin (phospholipase) → gas gangrene + bullae, rapid spread."
    src: { page: 737, quote: "Alpha toxin (phospholipase) → gas gangrene + bullae, rapid spread" }
    status: unverified
  - id: rr.L05.021
    kind: card
    topic: microbiology
    front: "Shared features: mononucleosis-like illness with atypical lymphocytosis and splenomegaly. The common distractor is CMV; what is the correct answer, and which test tells them apart?"
    back: "EBV. ⊕ heterophile (Monospot) test."
    src: { page: 737, quote: "EBV ⊕ heterophile (Monospot) test" }
    status: unverified
  - id: rr.L05.022
    kind: card
    topic: microbiology
    front: "Shared features: systemic infection caused by a budding yeast. The common distractor is B dermatitidis; what is the correct answer, and which clues tell them apart?"
    back: "C neoformans. Thick red polysaccharide capsule on mucicarmine stain, meningitis in HIV, pigeon droppings. Note: the p737 clue cell for C neoformans ends with 'broad-based budding', as printed, but Cryptococcus has narrow-based budding; broad-based budding is the classic clue for B dermatitidis."
    src: { page: 737, quote: "Thick red polysaccharide capsule on mucicarmine stain, HIV meningitis, pigeon droppings; broad-based budding" }
    status: unverified
  - id: rr.L05.023
    kind: card
    topic: microbiology
    front: "Shared features: organisms visualized on Giemsa stains in blood or tissue. The common distractor is Chlamydia or Rickettsia; what is the correct answer, and which clues tell them apart?"
    back: "Trypanosomes/Plasmodium. Parasites on the blood smear; cyclical fevers in malaria."
    src: { page: 737, quote: "Blood smear parasites, cyclical fevers for malaria" }
    status: unverified
  - id: rr.L05.024
    kind: card
    topic: microbiology
    front: "Shared features: acid-fast or partially acid-fast organisms detectable with Ziehl-Neelsen stain. The common distractor is M tuberculosis; what is the correct answer, and which clues tell them apart?"
    back: "Nocardia (partially acid fast). Weakly acid-fast branching filaments; brain abscesses."
    src: { page: 737, quote: "Weakly acid-fast branching filaments, brain abscesses" }
    status: unverified
  - id: rr.L05.025
    kind: card
    topic: microbiology
    front: "Shared features: patient with sickle cell disease with fever and focal bone pain due to osteomyelitis. The common distractor is S aureus osteomyelitis; what is the correct answer, and why?"
    back: "Salmonella osteomyelitis. Salmonella is the most common cause in sickle cell disease; S aureus is the most common overall."
    src: { page: 737, quote: "Salmonella most common in sickle cell disease; S aureus most common overall" }
    status: unverified
  - id: rr.L05.026
    kind: card
    topic: microbiology
    front: "Shared features: patient living with HIV with ring-enhancing brain lesions. The common distractor is primary CNS lymphoma; what is the correct answer, and which clues tell them apart?"
    back: "Toxoplasmosis. Multiple lesions and ↓ CD4+ cell count (lymphoma: a solitary lesion)."
    src: { page: 737, quote: "Multiple lesions and ↓ CD4+ cell count (vs solitary lesion in lymphoma)" }
    status: unverified
  - id: rr.L05.027
    kind: mcq
    topic: microbiology
    stem: >-
      A 34-year-old man living with HIV, who stopped his antiretroviral therapy a year ago, is brought in
      after a seizure. He has headache and mild right arm weakness. His CD4+ count is 60/mm3. Contrast MRI
      of the brain shows multiple ring-enhancing lesions in both hemispheres. Which of the following is the
      most likely cause?
    options:
      - Primary CNS lymphoma
      - Toxoplasma gondii
      - Cryptococcus neoformans
      - JC virus
      - Nocardia
    answer: 1
    why:
      - "Primary CNS lymphoma is the common distractor; it is classically a solitary lesion."
      - "Right. Toxoplasmosis: multiple ring-enhancing lesions with a low CD4+ count."
      - "C neoformans causes meningitis in HIV (capsule on mucicarmine), not multiple ring-enhancing masses."
      - "JC virus causes PML: nonenhancing white matter lesions."
      - "Nocardia can cause brain abscesses (weakly acid-fast branching filaments), but multiple ring lesions with a low CD4+ count in HIV point to toxoplasmosis."
    src: { page: 737, quote: "Multiple lesions and ↓ CD4+ cell count (vs solitary lesion in lymphoma)" }
    status: unverified
  - id: rr.L05.028
    kind: mcq
    topic: microbiology
    stem: >-
      A 24-year-old man injures his thigh in a motorcycle crash, and the wound is soiled with soil. Within
      24 hours the leg becomes swollen and exquisitely painful, with dusky skin, hemorrhagic bullae and
      crepitus spreading quickly up the thigh. Gram stain of the wound shows large gram-positive rods.
      Which virulence factor is mainly responsible for the tissue destruction?
    options:
      - Tetanospasmin, blocking release of GABA and glycine
      - Alpha toxin, a phospholipase
      - Botulinum toxin, cleaving SNARE proteins
      - Exotoxin A, inactivating EF-2
      - Streptolysin O
    answer: 1
    why:
      - "Tetanospasmin is C tetani's toxin, the common distractor: spastic paralysis and trismus, not gas gangrene."
      - "Right. C perfringens alpha toxin (phospholipase) → gas gangrene with bullae and rapid spread."
      - "Botulinum toxin gives descending flaccid paralysis, not myonecrosis."
      - "Exotoxin A belongs to Pseudomonas, a gram ⊝ rod."
      - "Streptolysin O is a group A strep hemolysin; group A strep are gram ⊕ cocci, not spore-forming rods."
    src: { page: 737, quote: "Alpha toxin (phospholipase) → gas gangrene + bullae, rapid spread" }
    status: unverified
  # ---------- p737: Pathology ----------
  - id: rr.L05.029
    kind: card
    topic: pathology
    front: "Shared features: gross hematuria occurring around the time of a URI. The common distractor is poststreptococcal glomerulonephritis (PSGN); what is the correct answer, and which clues tell them apart?"
    back: "IgA nephropathy (Berger disease). Hematuria concurrent with the infection (not weeks later); creatinine normal or ↑."
    src: { page: 737, quote: "Hematuria with concurrent infection; Cr normal/" }
    status: unverified
  - id: rr.L05.030
    kind: card
    topic: pathology
    front: "Shared features: progressive dysphagia with weight loss and an esophageal mass. The common distractor is adenocarcinoma; what is the correct answer, and which clues tell them apart?"
    back: "Squamous cell carcinoma. Upper/middle third (adenocarcinoma: distal third); associated with EtOH and hot beverages (adenocarcinoma: Barrett metaplasia)."
    src: { page: 737, quote: "Location: upper/middle third (vs adenocarcinoma: distal third); associated with EtOH and hot beverage consumption (vs adenocarcinoma: associated with Barrett metaplasia)" }
    status: unverified
  - id: rr.L05.031
    kind: card
    topic: pathology
    front: "Shared features: rapid-onset unilateral breast erythema + edema in a nonlactating female. The common distractor is acute mastitis; what is the correct answer, and which clues tell them apart?"
    back: "Inflammatory breast carcinoma. Dermal lymphatic invasion causing peau d'orange; no fever or leukocytosis."
    src: { page: 737, quote: "Dermal lymphatic invasion causing peau d’orange, no fever/leukocytosis" }
    status: unverified
  - id: rr.L05.032
    kind: mcq
    topic: pathology
    stem: >-
      A 22-year-old man has had cola-colored urine for 2 days. It began on the second day of a sore throat
      and runny nose that is still present. Blood pressure is 124/78 mm Hg and there is no edema. Urinalysis
      shows red cells and red cell casts; serum creatinine is normal. Which finding would a kidney biopsy
      most likely show?
    options:
      - Subepithelial immune complex humps
      - Mesangial IgA deposits
      - Subendothelial wire-loop deposits
      - Spike and dome thickening of the basement membrane
      - Apple-green birefringence with Congo red
    answer: 1
    why:
      - "Subepithelial humps are PSGN, the common distractor; PSGN follows the infection by weeks rather than coming with it."
      - "Right. IgA nephropathy (Berger disease): gross hematuria with a concurrent URI; creatinine normal or ↑."
      - "Wire-loop deposits are diffuse proliferative lupus nephritis."
      - "Spike and dome is membranous nephropathy, a nephrotic picture."
      - "Congo red birefringence is amyloidosis, also nephrotic."
    src: { page: 737, quote: "Hematuria with concurrent infection; Cr normal/" }
    status: unverified
  # ---------- p737-738: Pharmacology ----------
  - id: rr.L05.033
    kind: card
    topic: pharmacology
    front: "Shared features: hearing loss as a complication of UTI treatment. The common distractor is ciprofloxacin; what is the correct answer, and which clues tell them apart?"
    back: "Ampicillin + gentamicin. Ototoxicity and nephrotoxicity (fluoroquinolones: tendinopathy and prolonged QT)."
    src: { page: 737, quote: "Ototoxicity and nephrotoxicity (vs fluoroquinolones: tendinopathy and prolonged QT)" }
    status: unverified
  - id: rr.L05.034
    kind: card
    topic: pharmacology
    front: "Shared features: nausea with nonspecific systemic symptoms. The common distractor is hyperbilirubinemia; what is the correct answer, and which clues tell them apart?"
    back: "Digoxin toxicity. Xanthopsia (yellow vision) and ↑ K+ (hyperbilirubinemia gives jaundice: yellow skin)."
    src: { page: 738, quote: "Xanthopsia (yellow vision) and ↑ K+ (vs hyperbilirubinemia: jaundice [yellow skin])" }
    status: unverified
  - id: rr.L05.035
    kind: card
    topic: pharmacology
    front: "Shared features: anticoagulation in pregnancy. The common distractor is warfarin; what is the correct answer, and why?"
    back: "Heparin. Safe in pregnancy because it does not cross the placenta (warfarin is teratogenic)."
    src: { page: 738, quote: "Safe in pregnancy, does not cross placenta (vs warfarin: teratogenic)" }
    status: unverified
  - id: rr.L05.036
    kind: card
    topic: pharmacology
    front: "Shared features: history of gout, now an acute attack. The common distractor is allopurinol; what is the correct answer, and why?"
    back: "Colchicine or an NSAID: used for acute attacks (allopurinol is used only for prevention)."
    src: { page: 738, quote: "Used for acute attacks (vs allopurinol: used only for prevention)" }
    status: unverified
  - id: rr.L05.037
    kind: mcq
    topic: pharmacology
    stem: >-
      A 78-year-old woman with heart failure and atrial fibrillation is brought in with 3 days of nausea,
      poor appetite and fatigue. She says everything looks yellow. Her sclerae are not icteric. She recently
      started a new drug for another condition. Serum potassium is 6.0 mEq/L. Which of the following is the
      most likely cause of her symptoms?
    options:
      - Hyperbilirubinemia from drug-induced cholestasis
      - Digoxin toxicity
      - Amiodarone-induced hypothyroidism
      - Hypokalemia from loop diuretics
      - Warfarin-induced bleeding
    answer: 1
    why:
      - "Hyperbilirubinemia is the common distractor; it makes the skin yellow (jaundice), not the vision, and her sclerae are clear."
      - "Right. Digoxin toxicity: nausea, xanthopsia (yellow vision) and ↑ K+."
      - "Hypothyroidism gives fatigue and cold intolerance, not yellow vision or hyperkalemia."
      - "Her potassium is high, not low (hypokalemia would rather predispose to digoxin toxicity)."
      - "Warfarin causes bleeding, not xanthopsia or hyperkalemia."
    src: { page: 738, quote: "Xanthopsia (yellow vision) and ↑ K+ (vs hyperbilirubinemia: jaundice [yellow skin])" }
    status: unverified
  # ---------- p738: Public Health Sciences ----------
  - id: rr.L05.038
    kind: card
    topic: public-health
