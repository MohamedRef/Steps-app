    front: "Classic lab finding: ↓ T cells, ↓ PTH, ↓ Ca²⁺ and an absent thymic shadow on CXR. Diagnosis?"
    back: "Thymic aplasia: 22q11 microdeletion (DiGeorge syndrome, velocardiofacial syndrome). (First Aid p. 114)"
    src: { page: 726, quote: "↓ T cells, ↓ PTH, ↓ Ca , absent thymic shadow on CXR" }
    status: unverified
  - id: rr.L03.008
    kind: card
    topic: immunology
    front: "Classic lab finding: recurrent infections, eczema, thrombocytopenia, ↑ IgE and IgA, ↓ or normal IgG and IgM. Diagnosis?"
    back: "Wiskott-Aldrich syndrome (WAS gene mutation). (First Aid p. 115)"
    src: { page: 727, quote: "Recurrent infections, eczema, thrombocytopenia, ↑ IgE and IgA, ↓/normal IgG and IgM" }
    status: unverified
  - id: rr.L03.009
    kind: card
    topic: immunology
    front: "Classic lab finding: giant granules in phagocytes, pancytopenia (immunodeficiency). Diagnosis?"
    back: "Chédiak-Higashi disease: LYST gene mutation, a congenital failure of phagolysosome formation. (First Aid p. 115)"
    src: { page: 727, quote: "Giant granules in phagocytes, pancytopenia (immunodeficiency)" }
    status: unverified
  - id: rr.L03.010
    kind: mcq
    topic: immunology
    stem: >-
      A 3-day-old boy in the neonatal unit has a seizure. He was born at term with a harsh systolic murmur,
      a small jaw and low-set ears. Serum calcium is low and PTH is low. A chest x-ray shows no thymic
      shadow, and flow cytometry shows few T cells. Which of the following is the most likely cause of
      his condition?
    options:
      - 22q11 microdeletion
      - WAS gene mutation
      - LYST gene mutation
      - Autosomal recessive CFTR mutation
      - Antibodies against histones
    answer: 0
    why:
      - "Right. ↓ T cells, ↓ PTH, ↓ Ca²⁺ and an absent thymic shadow are thymic aplasia: the 22q11 microdeletion of DiGeorge (velocardiofacial) syndrome."
      - "WAS mutation gives Wiskott-Aldrich syndrome: infections, eczema and thrombocytopenia with ↑ IgE and IgA."
      - "LYST mutation gives Chédiak-Higashi disease: giant granules in phagocytes and pancytopenia."
      - "A CFTR mutation is cystic fibrosis: Pseudomonas lung colonies and ↑ sweat chloride."
      - "Anti-histone antibodies mark drug-induced lupus, not a newborn immunodeficiency."
    src: { page: 726, quote: "absent thymic shadow on CXR Thymic aplasia (22q11 microdeletion" }
    status: unverified
