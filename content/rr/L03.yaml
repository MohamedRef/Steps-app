  - id: rr.L03.024
    kind: mcq
    topic: microbiology
    stem: >-
      A 38-year-old man with untreated HIV infection is brought to the emergency department after a
      seizure. For 2 weeks he has had headache and confusion. His CD4+ count is 40/mm³. MRI of the brain
      shows multiple ring-enhancing lesions in both hemispheres. Which of the following is the most likely
      cause?
    options:
      - Toxoplasma gondii
      - CNS lymphoma
      - Trypanosoma cruzi
      - Rabies virus
      - Actinomyces israelii
    answer: 0
    why:
      - "Right. In AIDS, multiple ring-enhancing lesions point to Toxoplasma gondii."
      - "CNS lymphoma also ring-enhances in AIDS, but it may be solitary; multiple lesions favor Toxoplasma."
      - "T cruzi causes Chagas disease: dilated cardiomyopathy with apical atrophy, megacolon and megaesophagus."
      - "Rabies shows Negri bodies in Purkinje cells and hippocampal neurons, not ring-enhancing masses."
      - "Actinomyces israelii is a branching gram ⊕ rod with sulfur granules, not a classic AIDS brain lesion."
    src: { page: 727, quote: "Toxoplasma gondii (multiple), CNS lymphoma (may be solitary)" }
    status: unverified
