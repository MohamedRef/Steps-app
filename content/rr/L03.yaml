  - id: rr.L03.026
    kind: enumerate
    topic: pathology
    prompt: Enumerate the tumors with psammoma bodies (6).
    points:
      - Papillary thyroid carcinoma
      - Somatostatinoma
      - Meningioma
      - Mesothelioma
      - Ovarian serous papillary cystadenocarcinoma
      - Prolactinoma
    pass: 5
    hook: "الـ psammoma bodies كرات كالسيوم ملفوفة زي البصلة، وبتطلع في 6: papillary thyroid و somatostatinoma و meningioma و mesothelioma و serous ovarian و prolactinoma. افتكرها من حروف كلمة psammoma: P (papillary و prolactinoma)، S (somatostatinoma و serous)، M (meningioma)، M (mesothelioma)."
    src: { page: 727, quote: "ovarian serous papillary cystadenocarcinoma, prolactinoma" }
