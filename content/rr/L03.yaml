  - id: rr.L03.027
    kind: mcq
    topic: pathology
    stem: >-
      A 34-year-old woman has a painless nodule in the front of her neck. Fine-needle aspiration shows
      papillary clusters of cells with concentrically laminated calcified spherules. These same spherules
      are classically seen in which of the following tumors?
    options:
      - Meningioma
      - Ewing sarcoma
      - Glioblastoma
      - Yolk sac tumor
      - Burkitt lymphoma
    answer: 0
    why:
      - "Right. Psammoma bodies are seen in papillary thyroid carcinoma, somatostatinoma, meningioma, mesothelioma, ovarian serous papillary cystadenocarcinoma and prolactinoma."
      - "Ewing sarcoma is a small blue cell tumor with an onion-skin periosteal reaction."
      - "Glioblastoma shows pseudopalisading pleomorphic tumor cells."
      - "Yolk sac tumor shows Schiller-Duval bodies and ↑ AFP."
      - "Burkitt lymphoma shows a starry sky pattern, not psammoma bodies."
    src: { page: 727, quote: "ovarian serous papillary cystadenocarcinoma, prolactinoma" }
    status: unverified
