  # ---------- p726: biochemistry ----------
  - id: rr.L03.001
    kind: card
    topic: biochemistry
    front: "Classic lab finding: a child whose sputum grows Pseudomonas, with a high sweat chloride and high immunoreactive trypsinogen on newborn screen. Diagnosis?"
    back: "Cystic fibrosis: autosomal recessive mutation in the CFTR gene → fat-soluble vitamin deficiency and mucous plugs. (First Aid p. 58)"
    src: { page: 726, quote: "Colonies of Pseudomonas in lungs, ↑ Cl– on sweat test, ↑ immunoreactive trypsinogen" }
    status: unverified
  - id: rr.L03.002
    kind: card
    topic: biochemistry
    front: "Classic lab finding: ↓ AFP on second trimester screening. Which two diagnoses?"
    back: "Down syndrome and Edwards syndrome. (First Aid p. 61)"
    src: { page: 726, quote: "↓ AFP on second trimester screening Down syndrome, Edwards syndrome" }
    status: unverified
  - id: rr.L03.003
    kind: card
    topic: biochemistry
    front: "Classic lab finding: ↑ β-hCG and ↓ PAPP-A on first trimester screening. Diagnosis?"
    back: "Down syndrome. (First Aid p. 61)"
    src: { page: 726, quote: "↑ β-hCG, ↓ PAPP-A on first trimester screening Down syndrome" }
    status: unverified
  - id: rr.L03.004
    kind: card
    topic: biochemistry
    front: "Classic lab finding: ↑ homocysteine and ↑ methylmalonic acid. Diagnosis?"
    back: "Vitamin B12 deficiency. (First Aid p. 67)"
    src: { page: 726, quote: "↑ homocysteine, ↑ methylmalonic acid Vitamin B12 deficiency" }
    status: unverified
  - id: rr.L03.005
    kind: mcq
    topic: biochemistry
    stem: >-
      A 3-year-old boy is brought to the clinic for his third pneumonia this year. Sputum cultures have
      grown Pseudomonas aeruginosa each time. He has bulky, greasy stools and is below the 5th percentile
      for weight. A sweat test shows an elevated chloride concentration, and his newborn screen showed
      ↑ immunoreactive trypsinogen. Which of the following is most likely also present?
    options:
      - Deficiency of the fat-soluble vitamins
      - Elevated methylmalonic acid
      - Absent thymic shadow on chest x-ray
      - Giant granules in neutrophils
      - Decreased serum ceruloplasmin
    answer: 0
    why:
      - "Right. Cystic fibrosis (CFTR mutation) causes mucous plugs and fat-soluble vitamin deficiency, as the Rapid Review row states."
      - "↑ methylmalonic acid (with ↑ homocysteine) points to vitamin B12 deficiency, not cystic fibrosis."
      - "An absent thymic shadow with ↓ T cells, ↓ PTH and ↓ Ca²⁺ is thymic aplasia (DiGeorge syndrome)."
      - "Giant granules in phagocytes are Chédiak-Higashi disease (LYST mutation)."
      - "↓ ceruloplasmin is the classic lab of Wilson disease."
    src: { page: 726, quote: "Cystic fibrosis (autosomal recessive mutation in CFTR gene" }
    status: unverified
  # ---------- p726-727: immunology ----------
