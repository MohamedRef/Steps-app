  - id: rr.L03.034
    kind: mcq
    topic: cardiovascular
    stem: >-
      A 4-month-old boy is brought to the clinic because he turns blue and breathes fast while crying,
      and the episodes ease when he is held with his knees drawn to his chest. There is a harsh systolic
      ejection murmur at the left upper sternal border. A chest x-ray shows a boot-shaped heart. Which of
      the following best explains the shape of the heart on x-ray?
    options:
      - Right ventricular hypertrophy
      - Left ventricular hypertrophy
      - A large pericardial effusion
      - Collateral flow through intercostal arteries
      - An accessory bundle bypassing the AV node
    answer: 0
    why:
      - "Right. The boot-shaped heart of tetralogy of Fallot is due to RVH."
      - "LVH is not what shapes the boot in tetralogy of Fallot; the book names RVH."
      - "A large pericardial effusion goes with cardiac tamponade, whose classic ECG sign is electrical alternans."
      - "Collateral flow under the ribs gives inferior rib notching in coarctation of the aorta."
      - "An accessory bundle (bundle of Kent) is WPW: a delta wave and short PR interval."
    src: { page: 727, quote: "Boot-shaped heart on x-ray Tetralogy of Fallot (due to RVH)" }
    status: unverified
