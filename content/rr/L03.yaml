  - id: rr.L03.038
    kind: mcq
    topic: endocrine
    stem: >-
      A 42-year-old woman comes to the clinic for blood pressure of 168/102 mm Hg despite two drugs. She
      has muscle weakness and cramps. Serum potassium is 2.9 mEq/L and bicarbonate is 32 mEq/L. CT shows
      a 2-cm left adrenal mass. Which of the following hormone patterns is most likely?
    options:
      - ↑ aldosterone, ↓ renin
      - ↑ aldosterone, ↑ renin
      - ↓ aldosterone, ↓ renin
      - ↓ aldosterone, ↑ renin
      - Normal aldosterone, normal renin
    answer: 0
    why:
      - "Right. Hypertension, hypokalemia and metabolic alkalosis with ↑ aldosterone and ↓ renin is 1° hyperaldosteronism (eg, Conn syndrome): the high blood pressure suppresses renin."
      - "Both high means renin is driving aldosterone (secondary hyperaldosteronism), not an autonomous adrenal source."
      - "Low aldosterone could not cause this potassium loss and alkalosis."
      - "Low aldosterone with high renin is adrenal failure: hyperkalemia, not hypokalemia."
      - "Normal levels would not explain hypokalemia and metabolic alkalosis."
    src: { page: 727, quote: "↑ aldosterone, ↓ renin 1° hyperaldosteronism (eg, Conn syndrome)" }
    status: unverified
