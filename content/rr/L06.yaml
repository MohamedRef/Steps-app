    topic: public-health
    text: "Specificity = {{c1::TN / (TN + FP)}}"
    extra: "TN = true negatives, FP = false positives. (First Aid p. 260)"
    src: { page: 744, quote: "Specificity = TN / (TN + FP)" }
    status: unverified
  - id: rr.L06.020
    kind: cloze
    topic: public-health
    text: "Positive predictive value: PPV = {{c1::TP / (TP + FP)}}; PPV is proportional to {{c2::prevalence}}"
    extra: "(First Aid p. 260)"
    src: { page: 744, quote: "PPV = TP / (TP + FP); PPV is proportional to prevalence" }
    status: unverified
  - id: rr.L06.021
    kind: cloze
    topic: public-health
    text: "Negative predictive value: NPV = {{c1::TN / (TN + FN)}}; NPV is proportional to {{c2::1/prevalence}}"
