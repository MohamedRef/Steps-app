  - id: rr.L06.049
    kind: mcq
    topic: renal
    stem: >-
      A 72-year-old woman has had vomiting and poor oral intake for 3 days. Her creatinine has risen to 2 mg/dL.
      Urine sodium is 10 mEq/L, plasma sodium 140 mEq/L, urine creatinine 100 mg/dL. Which is the best
      interpretation of her fractional excretion of sodium?
    options:
      - "About 0.14%, pointing to prerenal azotemia"
      - "About 1.4%, an indeterminate value"
      - "About 14%, pointing to intrinsic renal failure"
      - "About 0.14%, pointing to acute tubular necrosis"
      - "It cannot be calculated without a timed urine volume"
    answer: 0
    why:
      - "Right. FENa = PCr × UNa / (UCr × PNa) = (2 × 10) / (100 × 140) = 0.0014, about 0.14%. Under 1% means the tubules are still saving sodium: prerenal azotemia."
      - "1.4% misplaces the decimal by a factor of 10."
      - "14% misplaces the decimal by a factor of 100."
      - "Acute tubular necrosis is intrinsic renal failure, where damaged tubules lose sodium and FENa is above 2%."
      - "The creatinine form, PCr × UNa / UCr × PNa, needs no urine volume: V cancels out."
    src: { page: 745, quote: "FENa+ = V × UNa / GFR × PNa = PCr × UNa / UCr × PNa" }
    status: unverified
  - id: rr.L06.050
    kind: case
    topic: renal
    stem: "A 19-year-old man with type 1 diabetes has DKA. Na+ 140 mEq/L, Cl− 100 mEq/L, HCO3− 12 mEq/L, arterial Pco2 40 mm Hg."
    steps:
      - question: "What is his anion gap?"
        options: ["12 mEq/L", "28 mEq/L", "40 mEq/L", "52 mEq/L"]
        answer: 1
        why: "Anion gap = Na+ − (Cl− + HCO3−) = 140 − (100 + 12) = 28 mEq/L, well above the normal 8–12 mEq/L."
      - question: "By the Winters formula, what Pco2 would full respiratory compensation give?"
        options: ["18 ± 2 mm Hg", "26 ± 2 mm Hg", "40 ± 2 mm Hg", "12 ± 2 mm Hg"]
        answer: 1
        why: "Pco2 = 1.5 × 12 + 8 ± 2 = 26 ± 2 mm Hg (24–28)."
      - question: "His measured Pco2 is 40 mm Hg. What does that mean?"
        options: ["Appropriate compensation", "Concomitant respiratory acidosis", "Concomitant respiratory alkalosis", "Concomitant metabolic alkalosis"]
        answer: 1
        why: "Measured Pco2 above the predicted 24–28 mm Hg means he is not blowing off enough CO2: a concomitant respiratory acidosis."
    src: { page: 745, quote: "Pco2 = 1.5 [HCO3–] + 8 ± 2" }
    status: unverified
  - id: rr.L06.051
    kind: case
    topic: renal
    stem: "A healthy volunteer has an inulin and PAH clearance study. Urine inulin is 30 mg/mL, plasma inulin 0.5 mg/mL and urine flow 2 mL/min. The effective renal plasma flow is 600 mL/min."
    steps:
      - question: "What is the GFR?"
        options: ["15 mL/min", "60 mL/min", "120 mL/min", "240 mL/min"]
        answer: 2
        why: "GFR = Cinulin = Uinulin × V / Pinulin = 30 × 2 / 0.5 = 120 mL/min."
      - question: "What is the filtration fraction?"
        options: ["5%", "12%", "20%", "50%"]
        answer: 2
        why: "FF = GFR / RPF = 120 / 600 = 0.20, 20%."
    src: { page: 745, quote: "Cinulin = GFR = Uinulin × V/Pinulin = K f [(PGC – PBS) – (πGC – πBS)]" }
    status: unverified
