  - id: rr.L06.055
    kind: mcq
    topic: respiratory
    stem: >-
      A 24-year-old man is brought in unresponsive after a heroin overdose. He is breathing room air at sea
      level, slowly and shallowly. Arterial PaCO2 is 80 mm Hg. What is his expected alveolar PO2?
    options:
      - "50 mm Hg"
      - "70 mm Hg"
      - "100 mm Hg"
      - "110 mm Hg"
      - "250 mm Hg"
    answer: 0
    why:
      - "Right. PAO2 ≈ 150 − PaCO2 / 0.8 = 150 − 100 = 50 mm Hg. Hypoventilation lets CO2 build up in the alveoli and leaves less room for O2."
      - "70 mm Hg subtracts 80 without dividing by the respiratory quotient."
      - "100 mm Hg is the normal alveolar PO2 with a PaCO2 of 40 mm Hg."
      - "110 mm Hg would need a PaCO2 of 32 mm Hg, hyperventilation."
      - "250 mm Hg adds the CO2 term (150 + 100) instead of subtracting it."
    src: { page: 745, quote: "PAo2 = PIo2 – Paco2 = 150 mm Hga – Paco2 / 0.8 RQ" }
    status: unverified
  - id: rr.L06.056
    kind: case
    topic: respiratory
    stem: "A 60-year-old man has a tidal volume of 500 mL. Arterial PaCO2 is 40 mm Hg and expired PECO2 is 28 mm Hg. At catheterization his mean pulmonary artery pressure is 25 mm Hg, left atrial pressure 10 mm Hg and cardiac output 5 L/min."
    steps:
      - question: "What is his physiologic dead space?"
        options: ["120 mL", "150 mL", "350 mL", "500 mL"]
        answer: 1
        why: "VD = VT × (PaCO2 − PECO2) / PaCO2 = 500 × (40 − 28) / 40 = 500 × 0.3 = 150 mL. 350 mL is VT minus VD."
      - question: "What is his pulmonary vascular resistance?"
        options: ["2 mm Hg·min/L", "3 mm Hg·min/L", "5 mm Hg·min/L", "7 mm Hg·min/L"]
        answer: 1
        why: "PVR = (P pulm artery − P L atrium) / CO = (25 − 10) / 5 = 3 mm Hg·min/L. 5 uses the pulmonary artery pressure alone."
    src: { page: 745, quote: "Physiologic dead space VD = VT ×" }
    status: unverified
