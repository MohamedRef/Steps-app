    src: { page: 744, quote: "NPV = TN / (TN + FN); NPV is proportional to 1/prevalence" }
    status: unverified
  - id: rr.L06.022
    kind: table
    topic: public-health
    title: "Test measures from the 2 × 2 table"
    columns: [Measure, Equation]
    rows:
      - [Sensitivity, "TP / (TP + FN)"]
      - [Specificity, "TN / (TN + FP)"]
      - [PPV, "TP / (TP + FP); proportional to prevalence"]
      - [NPV, "TN / (TN + FN); proportional to 1/prevalence"]
      - [LR+, "sensitivity / (1 − specificity)"]
      - [LR−, "(1 − sensitivity) / specificity"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 744, quote: "Sensitivity = TP / (TP + FN)" }
    status: unverified
  - id: rr.L06.023
    kind: mcq
    topic: public-health
    stem: >-
      In a case-control study of bladder cancer, 50 patients with the cancer and 50 controls without it are
      asked about smoking. Of the patients, 40 smoked; of the controls, 20 smoked. What is the odds ratio for
      bladder cancer associated with smoking?
    options:
      - "0.17"
      - "2"
      - "2.67"
      - "3"
      - "6"
    answer: 4
    why:
      - "0.17 is bc/ad, the equation turned upside down."
      - "2 is 40/20, the exposed cases over the exposed controls, leaving out the unexposed groups."
      - "2.67 is a relative risk, (40/60) / (10/40), which treats the study as a cohort. A case-control study starts from disease, so it gives an odds ratio."
      - "3 is 30/10, only the unexposed pair of cells; the odds ratio needs all four."
      - "Right. a = 40, b = 20, c = 10, d = 30. OR = ad / bc = (40 × 30) / (20 × 10) = 6."
    src: { page: 744, quote: "OR = a/c ad = b/d bc" }
    status: unverified
  - id: rr.L06.024
    kind: mcq
    topic: public-health
    stem: >-
      In a 2-year trial in adults with atrial fibrillation, 10 of 200 patients given a new anticoagulant had
      a stroke, compared with 20 of 200 patients given placebo. How many patients must be treated to prevent
      one stroke?
    options:
      - "2"
      - "5"
      - "10"
      - "20"
      - "50"
    answer: 3
    why:
      - "2 is the relative risk (10% / 5%) upside down, not the NNT."
      - "5 is the treated group's risk as a percentage."
      - "10 is the placebo group's risk as a percentage."
      - "Right. ARR = 20/200 − 10/200 = 0.10 − 0.05 = 0.05, and NNT = 1 / ARR = 20."
      - "50 would need an ARR of 0.02; here the ARR is 0.05. Do not use the 50% relative risk reduction for NNT."
    src: { page: 744, quote: "Number needed to treat NNT = 1/ARR" }
    status: unverified
  - id: rr.L06.025
    kind: mcq
    topic: public-health
    stem: >-
      A new rapid test for streptococcal pharyngitis has a sensitivity of 90% and a specificity of 80%.
      A 9-year-old girl with fever and sore throat tests positive. What is the positive likelihood ratio of
      this test?
    options:
      - "0.125"
      - "0.72"
      - "1.125"
      - "4.5"
      - "9"
    answer: 3
    why:
      - "0.125 is the negative likelihood ratio: (1 − 0.9) / 0.8."
      - "0.72 is sensitivity × specificity, which is not a likelihood ratio."
      - "1.125 is sensitivity / specificity."
      - "Right. LR+ = sensitivity / (1 − specificity) = 0.9 / 0.2 = 4.5."
      - "9 is sensitivity / (1 − sensitivity)."
    src: { page: 744, quote: "LR+ = sensitivity/(1 – specificity) = TP rate/FP rate" }
    status: unverified
  - id: rr.L06.026
    kind: mcq
    topic: public-health
    stem: >-
      A 52-year-old woman is referred to a specialist breast clinic after a palpable lump is found. The clinic
      screens her with the same test, at the same cut-off, that her primary care clinic uses, and the result is
      positive. In the specialist clinic the disease is three times as common as in primary care. Compared with
      the same positive result in primary care, which value is higher for her result here?
    options:
      - "Sensitivity"
      - "Specificity"
      - "Positive predictive value"
      - "Negative predictive value"
      - "Negative likelihood ratio"
    answer: 2
    why:
      - "Sensitivity, TP / (TP + FN), is a property of the test and does not change with prevalence."
      - "Specificity, TN / (TN + FP), is a property of the test and does not change with prevalence."
      - "Right. PPV = TP / (TP + FP) is proportional to prevalence: more diseased people make a positive result more often a true positive."
      - "NPV varies inversely with prevalence, so it falls when the disease is more common."
      - "Likelihood ratios are built from sensitivity and specificity only, so they do not change."
    src: { page: 744, quote: "PPV = TP / (TP + FP); PPV is proportional to prevalence" }
    status: unverified
  - id: rr.L06.027
    kind: case
    topic: public-health
    stem: "In a trial, 30 of 200 patients taking a new drug develop a rash, compared with 10 of 200 patients taking placebo."
    steps:
      - question: "What is the attributable risk of rash from the drug?"
        options: ["0.05", "0.10", "0.15", "3"]
        answer: 1
        why: "AR = a/(a + b) − c/(c + d) = 30/200 − 10/200 = 0.15 − 0.05 = 0.10. 3 is the relative risk (0.15 / 0.05), not the attributable risk."
      - question: "How many patients must take the drug for one extra rash?"
        options: ["3", "7", "10", "20"]
        answer: 2
        why: "NNH = 1 / AR = 1 / 0.10 = 10."
    src: { page: 744, quote: "Number needed to harm NNH = 1/AR" }
    status: unverified
