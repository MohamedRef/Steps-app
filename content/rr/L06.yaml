  - id: rr.L06.004
    kind: cloze
    topic: pharmacology
    text: "Loading dose: LD = {{c1::Cp × Vd / F}}"
    extra: "Cp = target plasma concentration, Vd = volume of distribution, F = bioavailability. (First Aid p. 229)"
    src: { page: 744, quote: "Cp × Vd" }
    status: unverified
  - id: rr.L06.005
    kind: cloze
    topic: pharmacology
    text: "Maintenance dose = {{c1::Cp × CL × τ / F}}"
    extra: "Cp = target plasma concentration, CL = clearance, τ = dosage interval, F = bioavailability. (First Aid p. 229)"
    src: { page: 744, quote: "Maintenance dose = Cp × CL × τ" }
    status: unverified
  - id: rr.L06.006
    kind: card
    topic: pharmacology
    front: "Equation for the therapeutic index?"
    back: "TI = median toxic dose / median effective dose = TD50 / ED50. (First Aid p. 233)"
    src: { page: 744, quote: "TI = median toxic dose/median effective dose = TD50/ED50" }
    status: unverified
  - id: rr.L06.007
    kind: mcq
    topic: pharmacology
    stem: >-
      A 64-year-old man with a ventricular arrhythmia needs an oral drug started quickly. The drug has a
      volume of distribution of 50 L and an oral bioavailability of 0.5. The target plasma concentration
      is 2 mg/L. Which oral loading dose reaches the target concentration?
    options:
      - "25 mg"
      - "50 mg"
      - "100 mg"
      - "200 mg"
      - "400 mg"
    answer: 3
    why:
      - "25 mg would be Cp × Vd divided by 4: there is no such step in the equation."
      - "50 mg is just Vd; the target concentration and bioavailability were left out."
      - "100 mg is Cp × Vd without dividing by F, the dose an IV drug (F = 1) would need."
      - "Right. LD = Cp × Vd / F = 2 mg/L × 50 L / 0.5 = 200 mg."
      - "400 mg multiplies by 2 twice; F divides only once."
    src: { page: 744, quote: "Cp × Vd" }
    status: unverified
  - id: rr.L06.008
    kind: case
    topic: pharmacology
    stem: "A drug has a volume of distribution of 40 L and a clearance of 7 L/h. It is eliminated by first-order kinetics."
    steps:
      - question: "What is its half-life?"
        options: ["2 hours", "4 hours", "5.7 hours", "28 hours"]
        answer: 1
        why: "t½ = 0.7 × Vd / CL = 0.7 × 40 / 7 = 4 hours. 5.7 hours forgets the 0.7; 28 hours (0.7 × 40) forgets to divide by CL."
      - reveal: "The target plasma concentration is 10 mg/L, the dosage interval is 8 hours and the oral bioavailability is 0.8."
        question: "What maintenance dose is given every 8 hours?"
        options: ["70 mg", "448 mg", "560 mg", "700 mg"]
        answer: 3
        why: "Maintenance dose = Cp × CL × τ / F = 10 × 7 × 8 / 0.8 = 700 mg. 560 mg forgets to divide by F; 448 mg multiplies by F instead."
    src: { page: 744, quote: "Maintenance dose = Cp × CL × τ" }
    status: unverified
  # ---------- Public health sciences ----------
  - id: rr.L06.009
    kind: cloze
    topic: public-health
    text: "Odds ratio (for case-control studies): OR = {{c1::(a/c) / (b/d)}} = {{c2::ad / bc}}"
    extra: "In the 2 × 2 table a = exposed with disease, b = exposed without disease, c = unexposed with disease, d = unexposed without disease. (First Aid p. 258)"
    src: { page: 744, quote: "OR = a/c ad = b/d bc" }
    status: unverified
  - id: rr.L06.010
    kind: cloze
    topic: public-health
    text: "Relative risk: RR = {{c1::[a/(a + b)] / [c/(c + d)]}}"
    extra: "Risk of disease in the exposed divided by risk in the unexposed. (First Aid p. 258)"
    src: { page: 744, quote: "RR = a/(a + b) c/(c + d)" }
    status: unverified
  - id: rr.L06.011
    kind: cloze
    topic: public-health
    text: "Attributable risk: AR = {{c1::a/(a + b) − c/(c + d)}}"
    extra: "(First Aid p. 258)"
    src: { page: 744, quote: "AR = a c − a+b c+d" }
    status: unverified
  - id: rr.L06.012
    kind: cloze
    topic: public-health
    text: "Relative risk reduction: RRR = {{c1::(ARC − ART) / ARC}} or RRR = {{c2::1 − RR}}"
    extra: "ARC = absolute risk in the control group, ART = absolute risk in the treatment group. (First Aid p. 258)"
    src: { page: 744, quote: "RRR = (ARC – ART)/ARC or RRR = 1 − RR" }
    status: unverified
  - id: rr.L06.013
    kind: cloze
    topic: public-health
    text: "Absolute risk reduction: ARR = {{c1::c/(c + d) − a/(a + b)}}"
    extra: "Here a and b are the treated group, c and d the control group. (First Aid p. 258)"
    src: { page: 744, quote: "ARR = c c+d a a+b" }
    status: unverified
  - id: rr.L06.014
    kind: card
    topic: public-health
    front: "Equation for the number needed to treat?"
    back: "NNT = 1 / ARR (absolute risk reduction). (First Aid p. 258)"
    src: { page: 744, quote: "Number needed to treat NNT = 1/ARR" }
    status: unverified
  - id: rr.L06.015
    kind: card
    topic: public-health
    front: "Equation for the number needed to harm?"
    back: "NNH = 1 / AR (attributable risk). (First Aid p. 258)"
    src: { page: 744, quote: "Number needed to harm NNH = 1/AR" }
    status: unverified
  - id: rr.L06.016
    kind: cloze
    topic: public-health
    text: "Positive likelihood ratio: LR+ = {{c1::sensitivity / (1 − specificity)}} = {{c2::TP rate / FP rate}}"
    extra: "(First Aid p. 259)"
    src: { page: 744, quote: "LR+ = sensitivity/(1 – specificity) = TP rate/FP rate" }
    status: unverified
  - id: rr.L06.017
    kind: cloze
    topic: public-health
    text: "Negative likelihood ratio: LR− = {{c1::(1 − sensitivity) / specificity}} = {{c2::FN rate / TN rate}}"
    extra: "(First Aid p. 259)"
    src: { page: 744, quote: "(1 – sensitivity)/specificity = FN rate/TN rate" }
    status: unverified
  - id: rr.L06.018
    kind: cloze
    topic: public-health
    text: "Sensitivity = {{c1::TP / (TP + FN)}}"
    extra: "TP = true positives, FN = false negatives. (First Aid p. 260)"
    src: { page: 744, quote: "Sensitivity = TP / (TP + FN)" }
    status: unverified
  - id: rr.L06.019
