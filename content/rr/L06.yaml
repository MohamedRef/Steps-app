    extra: "Pc and Pi = capillary and interstitial hydrostatic pressure; πc and πi = capillary and interstitial oncotic pressure; σ = reflection coefficient; Kf = filtration constant. (First Aid p. 301)"
    src: { page: 745, quote: "Jv = net fluid flow = K f [(Pc − Pi) − σ(πc − πi)]" }
    status: unverified
  - id: rr.L06.036
    kind: mcq
    topic: cardiovascular
    stem: >-
      A 30-year-old woman has a right heart catheterization. Her oxygen consumption is 250 mL/min, arterial
      O2 content is 0.20 mL O2/mL blood and pulmonary artery (mixed venous) O2 content is 0.15 mL O2/mL blood.
      What is her cardiac output?
    options:
      - "1.25 L/min"
      - "2.5 L/min"
      - "5 L/min"
      - "12.5 L/min"
      - "50 L/min"
    answer: 2
    why:
      - "1.25 L/min divides by the arterial content alone (250 / 0.20 = 1250 mL/min)."
      - "2.5 L/min halves the right answer; the difference is 0.05, not 0.10."
      - "Right. CO = O2 consumption / (arterial − venous O2 content) = 250 / (0.20 − 0.15) = 5000 mL/min = 5 L/min."
      - "12.5 L/min would need an arteriovenous difference of 0.02."
      - "50 L/min misplaces the decimal of the content difference."
    src: { page: 744, quote: "CO = rate of O2 consumption (arterial O2 content − venous O2 content)" }
    status: unverified
  - id: rr.L06.037
    kind: mcq
    topic: cardiovascular
    stem: >-
      A 67-year-old man with atherosclerosis has a plaque that narrows the radius of a renal artery segment to
      one half of normal. Viscosity, length and driving pressure are unchanged. By how much does the
      resistance of that segment change?
    options:
      - "It halves"
      - "It doubles"
      - "It rises 4-fold"
      - "It rises 8-fold"
      - "It rises 16-fold"
    answer: 4
    why:
      - "Resistance rises when the radius falls; it does not halve."
      - "Doubling would mean resistance varies with 1/r; it varies with 1/r^4."
      - "4-fold would be 1/r^2 (cross-sectional area), not the resistance equation."
      - "8-fold is the viscosity constant in the numerator, not the radius effect."
      - "Right. Resistance = 8η × length / (π × r^4): halving r multiplies resistance by 2^4 = 16."
    src: { page: 745, quote: "Resistance = driving pressure (ΔP) 8η (viscosity) × length = flow (Q) πr4" }
    status: unverified
  - id: rr.L06.038
    kind: case
    topic: cardiovascular
    stem: "A 55-year-old man has an echocardiogram: end-diastolic volume 120 mL, end-systolic volume 50 mL. His heart rate is 70/min and his blood pressure is 150/90 mm Hg."
    steps:
      - question: "What is his stroke volume?"
        options: ["50 mL", "70 mL", "120 mL", "170 mL"]
        answer: 1
        why: "SV = EDV − ESV = 120 − 50 = 70 mL."
      - question: "What is his ejection fraction?"
        options: ["42%", "58%", "70%", "140%"]
        answer: 1
        why: "EF = SV / EDV = 70 / 120 = 0.58, about 58%. 42% is ESV / EDV; 70% confuses the stroke volume in mL with a percentage."
      - question: "What is his cardiac output?"
        options: ["3.5 L/min", "4.9 L/min", "8.4 L/min", "1.0 L/min"]
        answer: 1
        why: "CO = SV × HR = 70 mL × 70/min = 4900 mL/min, 4.9 L/min. 8.4 L/min uses EDV instead of SV."
      - question: "What is his mean arterial pressure at this resting heart rate?"
        options: ["100 mm Hg", "110 mm Hg", "120 mm Hg", "130 mm Hg"]
        answer: 1
        why: "MAP = 2/3 DBP + 1/3 SBP = 60 + 50 = 110 mm Hg (or DBP + 1/3 PP = 90 + 20). 120 mm Hg is the simple average of 150 and 90."
    src: { page: 744, quote: "MAP (at resting HR) = 2 ⁄3 DBP + 1 ⁄3 SBP = DBP + 1 ⁄3 PP" }
    status: unverified
  # ---------- Hematology and oncology ----------
  - id: rr.L06.039
    kind: cloze
    topic: hematology-oncology
    text: "Reticulocyte production index: RPI = {{c1::% reticulocytes × (actual Hct / normal Hct)}} / {{c2::maturation time}}"
    extra: "Hct = hematocrit. (First Aid p. 423)"
    src: { page: 745, quote: "RPI = % reticulocytes × Hct / maturation time" }
    status: unverified
  - id: rr.L06.040
    kind: mcq
    topic: hematology-oncology
    stem: >-
      A 34-year-old woman has fatigue and pallor. Her hematocrit is 22.5% (normal 45%) and her reticulocyte
      count is 6%. For this hematocrit the reticulocyte maturation time is taken as 2 days. Which best
      describes her marrow response?
    options:
      - "RPI 1.5: inadequate marrow response to the anemia"
      - "RPI 3: adequate compensatory red cell production"
      - "RPI 6: adequate compensatory red cell production"
      - "RPI 12: adequate compensatory red cell production"
      - "RPI 0.75: no marrow response at all"
    answer: 0
    why:
      - "Right. RPI = 6 × (22.5 / 45) / 2 = 1.5. An RPI under 2 means the marrow is not responding enough to correct the anemia."
      - "3 corrects for the hematocrit but forgets to divide by the maturation time."
      - "6 is the raw reticulocyte count, which overstates production in anemia."
      - "12 skips the hematocrit correction and multiplies by the maturation time instead of dividing."
      - "0.75 divides by the maturation time twice."
    src: { page: 745, quote: "RPI = % reticulocytes × Hct / maturation time" }
    status: unverified
