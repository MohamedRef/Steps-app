  - id: rr.L07.059
    kind: mcq
    topic: psychiatry
    stem: >-
      A 26-year-old woman has 8 months of excessive worry about work, money and her family, with restlessness
      and poor sleep. She does not want a drug that causes dependence. She is started on a partial
      5-HT1A-receptor agonist. Which drug?
    options:
      - "Bupropion"
      - "Buspirone"
      - "Benztropine"
      - "Bromocriptine"
      - "Chlordiazepoxide"
    answer: 1
    why:
      - "Bupropion is a norepinephrine-dopamine reuptake inhibitor for depression and smoking cessation."
      - "Right. Buspirone treats generalized anxiety disorder as a partial 5-HT1A-receptor agonist."
      - "Benztropine is a cholinergic antagonist for Parkinson disease and extrapyramidal symptoms."
      - "Bromocriptine is a dopamine agonist for Parkinson disease and hyperprolactinemia."
      - "Chlordiazepoxide is a long-acting benzodiazepine, used for EtOH withdrawal."
    src: { page: 745, quote: "Buspirone Generalized anxiety disorder (partial 5-HT1A-receptor agonist)" }
    status: unverified
