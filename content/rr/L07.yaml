  - id: rr.L07.027
    kind: mcq
    topic: gastrointestinal
    stem: >-
      A 58-year-old man with alcohol-related cirrhosis is admitted for the third time with confusion and
      asterixis. Lactulose alone has not prevented relapses, so a drug is added that inhibits DNA-dependent RNA
      polymerase in gut bacteria. What is the main effect that helps him?
    options:
      - "↓ ammonia-producing gut bacteria"
      - "↓ gastric acid secretion by parietal cells"
      - "Killing of Mycobacterium tuberculosis"
      - "↓ fungal sterol synthesis"
      - "Blockade of the bacterial 50S ribosomal subunit"
    answer: 0
    why:
      - "Right. The drug is rifaximin: it inhibits bacterial DNA-dependent RNA polymerase and so ↓ the ammoniagenic bacteria that drive hepatic encephalopathy."
      - "That is omeprazole (H+/K+-ATPase) or cimetidine (H2 receptor), used for GERD, gastritis and ulcers."
      - "That is rifampin, its look-alike with the same mechanism, used as an antituberculous drug."
      - "That is ketoconazole, an antifungal."
      - "That is chloramphenicol, which blocks the 50S subunit; rifaximin acts on RNA polymerase."
    src: { page: 746, quote: "Rifaximin Hepatic encephalopathy (inhibits DNA-dependent RNA polymerase" }
    status: unverified
