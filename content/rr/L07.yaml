  - id: rr.L07.018
    kind: mcq
    topic: cardiovascular
    stem: >-
      A 66-year-old woman with palpitations has atrial fibrillation on ECG. Her cardiologist starts a drug that
      blocks K+ channels (class III antiarrhythmic). The pharmacist double-checks the order because the name
      looks like two other drugs on the ward. Which drug was ordered?
    options:
      - "Amiloride"
      - "Amlodipine"
      - "Amiodarone"
      - "Propafenone"
      - "Eplerenone"
    answer: 2
    why:
      - "Amiloride is a K+-sparing diuretic for HTN that blocks epithelial Na+ channels, not a K+ channel blocker."
      - "Amlodipine is a dihydropyridine Ca2+ channel blocker for HTN and angina."
      - "Right. Amiodarone treats ventricular arrhythmia, atrial fibrillation and SVT by blocking K+ channels (class III)."
      - "Propafenone also treats atrial fibrillation, but it is a Na+ channel blocker (class Ic)."
      - "Eplerenone is a selective mineralocorticoid receptor antagonist used for HTN."
    src: { page: 745, quote: "Amiodarone Ventricular arrhythmia, atrial fibrillation, supraventricular tachycardia (K+ channel blocker; class III antiarrhythmic)" }
    status: unverified
  - id: rr.L07.019
    kind: mcq
    topic: cardiovascular
    stem: >-
      A 52-year-old man stopped his antihypertensives a week ago. He has a severe headache and blurred vision;
      his blood pressure is 240/140 mm Hg and fundoscopy shows papilledema. He is given an IV drug that raises
      cGMP through nitric oxide. Which drug?
    options:
      - "Nitroglycerin"
      - "Nitroprusside"
      - "Clonidine"
      - "Amlodipine"
      - "Chlorthalidone"
    answer: 1
    why:
      - "Nitroglycerin works the same way (↑ cGMP/NO) but the table lists it for angina."
      - "Right. Nitroprusside is the hypertensive emergency drug, acting by ↑ cGMP/NO."
      - "Clonidine, an α2-receptor agonist, is listed for hypertensive urgency, not emergency."
      - "Amlodipine, a dihydropyridine Ca2+ channel blocker, is for HTN and angina."
      - "Chlorthalidone is a thiazide diuretic for HTN and edema."
    src: { page: 746, quote: "Nitroprusside Hypertensive emergency (↑ cGMP/NO)" }
    status: unverified
