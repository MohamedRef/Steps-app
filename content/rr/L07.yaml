  - id: rr.L07.005
    kind: mcq
    topic: microbiology
    stem: >-
      A 34-year-old man has 3 weeks of cough, night sweats and weight loss. Sputum shows acid-fast bacilli and
      he starts a four-drug regimen. One of the drugs shares its mechanism, inhibition of DNA-dependent RNA
      polymerase, with a look-alike drug used for hepatic encephalopathy. Which drug is it?
    options:
      - "Rifaximin"
      - "Rifampin"
      - "Ketoconazole"
      - "Chloramphenicol"
      - "Omeprazole"
    answer: 1
    why:
      - "Rifaximin has the same mechanism but is the hepatic encephalopathy drug: it cuts down the gut's ammonia-making bacteria."
      - "Right. Rifampin is the antituberculous drug that inhibits DNA-dependent RNA polymerase."
      - "Ketoconazole is an antifungal that inhibits fungal sterol synthesis."
      - "Chloramphenicol is an antibiotic that blocks the 50S ribosomal subunit, not RNA polymerase."
      - "Omeprazole treats GERD by inhibiting the H+/K+-ATPase of parietal cells."
    src: { page: 746, quote: "Rifampin Antituberculous drug/antimicrobial (inhibits DNA-dependent RNA polymerase)" }
    status: unverified
