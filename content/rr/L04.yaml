    topic: pathology
    stem: >-
      A 64-year-old man who has smoked for 45 years is brought to the emergency department after a
      generalized seizure. He has lost 8 kg over 4 months. MRI of the brain shows three well-circumscribed
      enhancing lesions at the gray-white junction with surrounding edema. Which of the following is the
      most likely primary site?
    options:
      - Lung
      - Breast
      - Melanoma of the skin
      - Colon
      - Prostate
    answer: 0
    why:
      - "Right. Brain metastases come from lung > breast >> melanoma > colon, prostate; a heavy smoker makes lung even likelier."
      - "Breast is second for brain metastases, and he is a man."
      - "Melanoma comes after lung and breast in the brain metastasis list."
      - "Colon is low on the brain list; it leads the list for liver metastases."
      - "Prostate is the classic source of bone metastases, not brain."
    src: { page: 731, quote: "Metastases to brain Lung > breast >> melanoma > colon, prostate" }
    status: unverified
