    back: "Gaucher disease. (First Aid p. 86)"
    src: { page: 731, quote: "Lysosomal storage disease Gaucher disease" }
    status: unverified
  - id: rr.L04.005
    kind: mcq
    topic: biochemistry
    stem: >-
      A 26-year-old woman comes to the clinic for exercise intolerance and muscle weakness since her teens.
      Serum lactate is elevated after mild exercise. A muscle biopsy shows ragged red fibers, and genetic
      testing confirms a mutation in mitochondrial DNA. She asks about the risk to her future children.
      Which of the following best describes the transmission of her disease?
    options:
      - All of her children will inherit the mutation, with variable severity
      - Half of her children will be affected, regardless of sex
      - Only her sons will be affected
      - One quarter of her children will be affected
      - None of her children will be affected unless her partner is a carrier
    answer: 0
    why:
      - "Right. Mitochondrial disease occurs in all offspring of affected females (maternal inheritance); heteroplasmy explains why severity varies."
      - "50% of offspring of either sex is autosomal dominant inheritance, not mitochondrial."
      - "Mostly affected sons from a carrier mother is X-linked recessive inheritance."
      - "25% of children with two carrier parents is autosomal recessive inheritance."
      - "Mitochondria come from the mother's egg, so the father's genotype does not matter."
    src: { page: 731, quote: "Mitochondrial inheritance Disease occurs in all offspring of affected females (maternal inheritance pattern), heteroplasmy" }
    status: unverified
