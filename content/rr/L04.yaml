  # ---------- p731: biochemistry ----------
  - id: rr.L04.001
    kind: card
    topic: biochemistry
    front: "Key association: mitochondrial inheritance. What is the pattern?"
    back: "Disease occurs in all offspring of affected females (maternal inheritance pattern), with heteroplasmy. (First Aid pp. 55, 57)"
    src: { page: 731, quote: "Mitochondrial inheritance Disease occurs in all offspring of affected females (maternal inheritance pattern), heteroplasmy" }
    status: unverified
  - id: rr.L04.002
    kind: card
    topic: biochemistry
    front: "Key association: intellectual disability. Most common sporadic cause and most common inherited cause?"
    back: "Down syndrome (sporadic) and fragile X syndrome (inherited). (First Aid pp. 60, 61)"
    src: { page: 731, quote: "Intellectual disability Down syndrome (sporadic), fragile X syndrome (inherited)" }
    status: unverified
  - id: rr.L04.003
    kind: card
    topic: biochemistry
    front: "Key association: most common vitamin deficiency in the USA. Which vitamin, who is at ↑ risk, and how long do body stores last?"
    back: "Folate. Pregnant women are at ↑ risk; the body stores only a 3–4 month supply. (First Aid p. 66)"
    src: { page: 731, quote: "Vitamin deficiency (USA) Folate (pregnant women are at ↑ risk; body stores only a 3–4 month supply)" }
    status: unverified
  - id: rr.L04.004
    kind: card
    topic: biochemistry
