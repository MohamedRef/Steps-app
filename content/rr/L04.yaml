  - id: rr.L04.008
    kind: mcq
    topic: immunology
    stem: >-
      A 46-year-old woman comes to the clinic for 4 months of morning stiffness lasting over an hour and
      swelling of the small joints of both hands. Anti-cyclic citrullinated peptide antibodies are
      positive. Her sister has type I diabetes mellitus. Which HLA subtype is most strongly linked to her
      joint disease in the Rapid Review table?
    options:
      - HLA-DR4
      - HLA-DR3
      - HLA-B27
      - HLA-DR3 only when Graves disease coexists
      - No HLA association is known
    answer: 0
    why:
      - "Right. HLA-DR4 goes with rheumatoid arthritis, type I DM and Addison disease."
      - "HLA-DR3 goes with type I DM, SLE, Graves disease, Hashimoto thyroiditis and Addison disease, but not rheumatoid arthritis."
      - "HLA-B27 goes with psoriatic arthritis, ankylosing spondylitis, IBD-associated arthritis and reactive arthritis, which spare this symmetric small-joint picture."
      - "Graves disease is a DR3 disease; it does not move rheumatoid arthritis to DR3."
      - "Rheumatoid arthritis has a classic HLA association: DR4."
    src: { page: 731, quote: "HLA-DR4 Rheumatoid arthritis, type I DM, Addison disease" }
    status: unverified
