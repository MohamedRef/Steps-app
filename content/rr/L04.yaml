    stem: >-
      A 9-year-old boy with sickle cell disease is brought to the emergency department with 4 days of fever
      and pain in his left shin. He cannot bear weight. The tibia is warm and tender, and MRI shows bone
      marrow edema with a periosteal abscess. Which of the following organisms is most likely responsible?
    options:
      - Salmonella
      - Staphylococcus aureus
      - Pseudomonas aeruginosa
      - Candida albicans
      - Streptococcus pneumoniae
    answer: 0
    why:
      - "Right. In sickle cell disease, osteomyelitis is caused by Salmonella more often than S aureus."
      - "S aureus is the most common cause of osteomyelitis overall, but in sickle cell disease Salmonella > S aureus."
      - "Pseudomonas is a classic cause with injection drug use."
      - "Candida joins S aureus and Pseudomonas in injection drug users."
      - "S pneumoniae is the classic cause of bacterial meningitis after 6 months of age, not osteomyelitis here."
    src: { page: 731, quote: "Osteomyelitis in sickle cell disease Salmonella > S aureus" }
    status: unverified
