    options:
      - "Schistocytes with low ADAMTS13 activity"
      - "Absent CD55 and CD59 on red cells by flow cytometry"
      - "Positive direct Coombs test (C3) with cold agglutinins"
      - "Heinz bodies and bite cells"
      - "Spherocytes with ↑ osmotic fragility"
    answer: 1
    why:
