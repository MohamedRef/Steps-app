  - id: rr.L02.038
    kind: mcq
    topic: immunology
    stem: >-
      A 4-year-old boy has had three episodes of pneumonia and a liver abscess. Cultures grew
      Staphylococcus aureus and Aspergillus. Biopsy of an enlarged lymph node shows granulomas. Which
      defect is most likely?
    options:
      - "STAT3"
      - "NADPH oxidase"
      - "LYST"
      - "LFA-1 (CD18) integrin"
      - "BTK tyrosine kinase"
    answer: 1
    why:
      - "STAT3 mutation is hyper-IgE (Job) syndrome: cold abscesses, eczema, ↑ IgE."
      - "Right. Recurrent infections and granulomas with catalase-positive organisms are chronic granulomatous disease, from defective NADPH oxidase."
      - "LYST mutation is Chédiak-Higashi: giant granules in phagocytes, not catalase-positive granulomas."
      - "Defective LFA-1 (CD18) is leukocyte adhesion deficiency: late cord separation and infections without pus."
      - "BTK defects give Bruton agammaglobulinemia: no mature B cells, recurrent bacterial infections, no granulomas."
    src: { page: 721, quote: "Recurrent infections and granulomas with catalase ⊕ organisms" }
    status: unverified
    tags: [high-yield]
