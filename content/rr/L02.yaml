    stem: >-
      A 34-year-old woman has a dry cough, red painful eyes and tender red nodules on her shins. Chest
      x-ray shows bilateral hilar lymphadenopathy. Which finding is most likely on biopsy of a hilar node?
    options:
      - "Noncaseating granulomas"
      - "Hypertrophied mucus glands"
      - "Reed-Sternberg cells"
      - "Ferruginous bodies"
      - "Caseating granulomas with acid-fast bacilli"
    answer: 0
    why:
      - "Right. Bilateral hilar adenopathy, uveitis, arthropathy and skin changes are sarcoidosis: immune-mediated noncaseating granulomas."
      - "Hypertrophied mucus glands are chronic bronchitis."
      - "Reed-Sternberg cells are Hodgkin lymphoma, which lacks uveitis and erythema nodosum."
      - "Ferruginous bodies are asbestosis."
      - "Caseating granulomas with AFB are tuberculosis."
