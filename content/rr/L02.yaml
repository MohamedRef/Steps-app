      ovarian mass, ascites and a right pleural effusion. After the mass is removed, the fluid resolves.
      She has had no vaginal bleeding and the endometrium is thin. Which tumor is the ovarian mass most likely
      to be?
    options:
      - "Fibroma"
      - "Granulosa cell tumor"
      - "Krukenberg tumor"
      - "Serous carcinoma with peritoneal spread"
      - "Mature cystic teratoma"
    answer: 0
    why:
      - "Right. Ovarian fibroma with ascites and pleural effusion is Meigs syndrome, which resolves when the tumor is removed."
      - "Granulosa cell tumors can also cause Meigs-like effusions, but they make estrogen (postmenopausal bleeding, a thickened endometrium), which she lacks."
      - "Krukenberg tumor is gastric cancer spread to both ovaries."
      - "Serous carcinoma spreading to the peritoneum would not settle with removal of one benign-behaving mass."
      - "A mature cystic teratoma is a cystic mass, often with teeth or hair, not this triad."
    src: { page: 726, quote: "Ovarian fibroma, ascites, pleural effusion" }
    status: unverified
    tags: [high-yield]
