      - "Right. Morning red urine, pancytopenia and venous thrombosis are paroxysmal nocturnal hemoglobinuria, where cells lack the complement-inhibiting CD55 and CD59."
      - "Cold autoimmune hemolysis: IgM cold agglutinins fix complement, so the direct Coombs test detects C3; it gives painful blue fingers in the cold, not thrombosis with pancytopenia."
      - "Heinz bodies and bite cells are G6PD deficiency."
      - "Spherocytes and osmotic fragility point to hereditary spherocytosis."
    src: { page: 724, quote: "Red/pink urine in the morning, pancytopenia, venous thrombosis" }
    status: unverified
    tags: [high-yield]
