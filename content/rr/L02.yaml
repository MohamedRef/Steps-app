  - id: rr.L02.031
    kind: mcq
    topic: biochemistry
    stem: >-
      A 14-year-old boy is evaluated for blurred vision. He is tall and thin with long, slender fingers
      and a pectus excavatum. Slit-lamp examination shows both lenses displaced downward and nasally. He
      has mild learning difficulty. His older sister had a deep vein thrombosis at 19. Deficiency of which
      enzyme is the most likely cause?
    options:
      - "Homogentisate oxidase"
      - "Fibrillin-1"
      - "Phenylalanine hydroxylase"
      - "Lysyl hydroxylase"
      - "Cystathionine synthase"
    answer: 4
    why:
      - "Homogentisate oxidase deficiency is alkaptonuria: dark connective tissue and urine, severe arthralgia."
      - "Fibrillin-1 is defective in Marfan syndrome, whose lens slips up and out (upward and temporal), and it is a structural protein, not an enzyme."
      - "Phenylalanine hydroxylase deficiency is phenylketonuria: musty odor, pale skin, eczema, intellectual disability."
      - "Lysyl hydroxylase problems belong to collagen disorders (some Ehlers-Danlos types), not a downward lens."
      - "Right. Long fingers, pectus and a lens displaced down and in point to homocystinuria, autosomal recessive cystathionine synthase deficiency."
    src: { page: 720, quote: "Arachnodactyly, pectus deformity, lens dislocation (downward and nasal)" }
    status: unverified
    tags: [high-yield]
