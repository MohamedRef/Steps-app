    stem: "A 45-year-old woman is brought to the emergency department with double vision, difficulty swallowing and weakness that began in her face and is now spreading to her arms. A day earlier she ate home-canned green beans. She is afebrile and alert. Pupils are dilated and poorly reactive, and deep tendon reflexes are reduced. Which mechanism best explains her weakness?"
