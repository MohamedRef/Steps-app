    topic: biochemistry
    front: "Ehlers-Danlos syndrome: what is the mechanism and what does it cause?"
    back: "Faulty collagen synthesis → hyperextensible skin, hypermobile joints, easy bruising. (First Aid p. 49)"
    src: { page: 708, quote: "Ehlers-Danlos syndrome Faulty collagen synthesis → hyperextensible skin, hypermobile joints, easy bruising" }
    status: unverified
  - id: rr.L01.006
    kind: cloze
    topic: biochemistry
    text: "Menkes disease: defective {{c1::ATP7A}} protein → impaired copper absorption and transport → ↓ {{c2::lysyl oxidase}} activity → ↓ collagen {{c3::cross-linking}}. (First Aid p. 49)"
