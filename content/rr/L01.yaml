    topic: biochemistry
    front: "Fragile X syndrome: what is the mechanism?"
    back: "CGG trinucleotide repeat in the FMR1 gene → hypermethylation of cytosine residues → ↓ expression. (First Aid p. 60)"
    src: { page: 708, quote: "CGG trinucleotide repeat in FMR1 gene → hypermethylation of cytosine residues → ↓ expression" }
    status: unverified
  - id: rr.L01.015
    kind: card
    topic: biochemistry
    front: "Bitot spots in vitamin A deficiency: what is the mechanism?"
    back: "↓ differentiation of epithelial cells into specialized tissue → conjunctival squamous metaplasia → keratin buildup. (First Aid p. 64)"
    src: { page: 708, quote: "differentiation of epithelial cells into specialized tissue → conjunctival squamous metaplasia → keratin buildup" }
    status: unverified
  - id: rr.L01.016
    kind: card
    topic: biochemistry
    front: "Why does giving glucose to a patient with alcohol use disorder worsen (or precipitate) Wernicke encephalopathy?"
    back: "Thiamine deficiency → impaired glucose breakdown → ATP depletion, which glucose infusion worsens. (First Aid p. 64)"
    src: { page: 708, quote: "Thiamine deficiency → impaired glucose breakdown → ATP depletion worsened by glucose infusion" }
    status: unverified
  - id: rr.L01.017
    kind: card
    topic: biochemistry
    front: "Why does malignant carcinoid syndrome cause pellagra?"
    back: "The tumor diverts tryptophan toward serotonin synthesis → B3 (niacin) deficiency, because B3 is derived from tryptophan. (First Aid p. 65)"
    src: { page: 708, quote: "Tryptophan is diverted towards serotonin synthesis by tumor → B3 deficiency" }
    status: unverified
  - id: rr.L01.018
    kind: cloze
    topic: biochemistry
    text: "Kwashiorkor: protein malnutrition → ↓ plasma {{c1::oncotic pressure}} (→ edema) and ↓ {{c2::apolipoprotein}} synthesis (→ {{c3::fatty changes in the liver}}). (First Aid p. 69)"
    src: { page: 708, quote: "Protein malnutrition → ↓ plasma oncotic pressure (→ edema), ↓ apolipoprotein synthesis (→ fatty changes in the liver)" }
    status: unverified
  - id: rr.L01.019
    kind: card
    topic: biochemistry
    front: "Aspirin-induced hyperthermia: what is the mechanism?"
    back: "↑ permeability of the inner mitochondrial membrane → ↓ proton gradient and ↑ O2 consumption (uncoupling) → heat production. (First Aid p. 76)"
    src: { page: 708, quote: "permeability of inner mitochondrial membrane → ↓ proton gradient and ↑ O2 consumption (uncoupling) → heat production" }
    status: unverified
  - id: rr.L01.020
    kind: card
    topic: biochemistry
    front: "Hereditary fructose intolerance: what is the mechanism?"
    back: "Aldolase B deficiency → fructose-1-phosphate accumulation → ↓ available phosphate → inhibition of glycogenolysis and gluconeogenesis. (First Aid p. 78)"
    src: { page: 708, quote: "Aldolase B deficiency → Fructose-1-phosphate accumulation → ↓ available phosphate → inhibition of glycogenolysis and gluconeogenesis" }
    status: unverified
  - id: rr.L01.021
    kind: mcq
    topic: biochemistry
    stem: "A 7-month-old boy is brought to the emergency department with lethargy, sweating and vomiting 30 minutes after his first meal of pureed fruit sweetened with table sugar. He was well on breast milk alone. His serum glucose is 38 mg/dL and the liver is enlarged. A urine dipstick for glucose is negative, but a test for reducing sugars is positive. Which mechanism best explains his hypoglycemia?"
    options:
      - "Accumulated fructose-1-phosphate traps phosphate, inhibiting glycogenolysis and gluconeogenesis"
      - "Accumulated fructose is converted by hexokinase to fructose-6-phosphate"
      - "Thiamine deficiency impairs glucose breakdown"
      - "Protein malnutrition decreases apolipoprotein synthesis"
      - "Uncoupling of oxidative phosphorylation wastes energy as heat"
    answer: 0
    why:
      - "Right. Aldolase B deficiency → fructose-1-phosphate builds up → ↓ available phosphate → glycogenolysis and gluconeogenesis stop → hypoglycemia."
      - "This is essential fructosuria (fructokinase deficiency): the hexokinase pathway handles the fructose and the child stays well."
      - "Thiamine deficiency (Wernicke) causes ATP depletion worsened by glucose; it doesn't follow a first fruit meal in an infant."
      - "↓ apolipoprotein synthesis explains the fatty liver of kwashiorkor, a chronic protein malnutrition."
      - "Uncoupling (eg, aspirin) explains hyperthermia, not hypoglycemia after fructose."
    src: { page: 708, quote: "Aldolase B deficiency → Fructose-1-phosphate accumulation → ↓ available phosphate → inhibition of glycogenolysis and gluconeogenesis" }
    status: unverified
  - id: rr.L01.022
    kind: card
    topic: biochemistry
    front: "Essential fructosuria: what is the mechanism, and why is it benign?"
    back: "Fructokinase deficiency → ↑ fructose; the hexokinase pathway converts fructose to fructose-6-phosphate. (First Aid p. 78)"
    src: { page: 709, quote: "Fructokinase deficiency → ↑ fructose; hexokinase pathway converts fructose to fructose-6-phosphate" }
    status: unverified
  - id: rr.L01.023
    kind: card
    topic: biochemistry
    front: "Classic galactosemia: what is the mechanism?"
    back: "Galactose-1-phosphate uridyltransferase deficiency → accumulation of toxic substances (eg, galactitol in the eye lens → cataracts). (First Aid p. 78)"
    src: { page: 709, quote: "Galactose-1-phosphate uridyltransferase deficiency → accumulation of toxic substances (eg, galactitol in eye lens → cataracts )" }
    status: unverified
  - id: rr.L01.024
    kind: card
    topic: biochemistry
    front: "Galactokinase deficiency: what is the mechanism?"
    back: "Galactokinase deficiency → ↑ galactose; aldose reductase converts galactose to galactitol. (First Aid p. 78)"
    src: { page: 709, quote: "Galactokinase deficiency → ↑ galactose; aldose reductase converts galactose to galactitol" }
    status: unverified
  - id: rr.L01.025
    kind: cloze
    topic: biochemistry
    text: "In DM, excess glucose → sorbitol via {{c1::aldose reductase}}; lens, retina, kidney and Schwann cells lack {{c2::sorbitol dehydrogenase}} → intracellular sorbitol accumulation → {{c3::osmotic}} damage. (First Aid p. 79)"
    src: { page: 709, quote: "Excess glucose → sorbitol (via aldose reductase) and sorbitol → fructose (via sorbitol dehydrogenase); lens, retina, kidney, and Schwann cells lack sorbitol dehydrogenase" }
    status: unverified
  # ---------- Immunology ----------
  - id: rr.L01.026
    kind: card
    topic: immunology
    front: "Recurrent Neisseria bacteremia: what is the mechanism?"
    back: "Terminal complement deficiencies (C5–C9) → failure of membrane attack complex (MAC) formation. (First Aid p. 105)"
    src: { page: 709, quote: "Recurrent Neisseria bacteremia Terminal complement deficiencies (C5–C9) → failure of MAC formation" }
    status: unverified
  - id: rr.L01.027
    kind: card
    topic: immunology
    front: "Hereditary angioedema: what is the mechanism?"
    back: "C1 inhibitor deficiency → unregulated activation of kallikrein → ↑ bradykinin. (First Aid p. 105)"
    src: { page: 709, quote: "Hereditary angioedema C1 inhibitor deficiency → unregulated activation of kallikrein → ↑ bradykinin" }
    status: unverified
  - id: rr.L01.028
    kind: cloze
    topic: immunology
    text: "PNH: {{c1::PIGA}} gene mutation → ↓ {{c2::GPI anchors}} for complement inhibitors (DAF/CD55, MIRL/CD59) → complement-mediated {{c3::intravascular}} hemolysis → ↓ haptoglobin. (First Aid p. 105)"
    src: { page: 709, quote: "PIGA gene mutation → ↓ GPI anchors for complement inhibitors (DAF/ CD55, MIRL/CD59) → complement-mediated intravascular hemolysis → ↓ haptoglobin" }
    status: unverified
  - id: rr.L01.029
    kind: mcq
    topic: immunology
    stem: "A 31-year-old man comes to the physician for fatigue and dark urine that is worst on waking. Hemoglobin is 9.1 g/dL, reticulocytes are increased, LDH is high and haptoglobin is undetectable. A direct antiglobulin (Coombs) test is negative. Flow cytometry shows red cells lacking CD55 and CD59. An acquired mutation in which gene is the underlying cause?"
    options:
      - "BTK"
      - "PIGA"
      - "LYST"
      - "CD40L"
      - "Gene for the C1 inhibitor"
    answer: 1
    why:
      - "BTK defects cause X-linked agammaglobulinemia: no B cells, recurrent bacterial infections, no hemolysis."
      - "Right. PIGA mutation → ↓ GPI anchors for DAF/CD55 and MIRL/CD59 → complement-mediated intravascular hemolysis → ↓ haptoglobin."
      - "LYST mutation is Chédiak-Higashi syndrome: a phagosome-lysosome fusion defect."
      - "Defective CD40L causes hyper-IgM syndrome, a class-switching defect."
      - "C1 inhibitor deficiency causes hereditary angioedema through ↑ bradykinin, not hemolysis."
    src: { page: 709, quote: "PIGA gene mutation → ↓ GPI anchors for complement inhibitors (DAF/ CD55, MIRL/CD59) → complement-mediated intravascular hemolysis → ↓ haptoglobin" }
    status: unverified
  - id: rr.L01.030
    kind: card
    topic: immunology
    front: "Type I hypersensitivity: what happens in the immediate and the late phase?"
    back: "Immediate (minutes): antigen cross-links IgE on mast cells → degranulation → release of histamine, tryptase, leukotrienes. Late (hours): mast cells secrete chemokines (attract inflammatory cells) and other mediators → inflammation, tissue damage. (First Aid p. 110)"
    src: { page: 709, quote: "Immediate (minutes): antigen crosslinks IgE on mast cells → degranulation → release of histamine, tryptase, leukotrienes" }
    status: unverified
  - id: rr.L01.031
    kind: card
    topic: immunology
    front: "Type II hypersensitivity: what is the mechanism?"
    back: "Antibodies bind cell-surface antigens or ECM → inflammation, cellular destruction and dysfunction. (First Aid p. 110)"
    src: { page: 709, quote: "Type II hypersensitivity Antibodies bind to cell-surface antigens or ECM → inflammation, cellular destruction, and dysfunction" }
    status: unverified
  - id: rr.L01.032
    kind: card
    topic: immunology
    front: "Type III hypersensitivity: what is the mechanism?"
    back: "Antigen-antibody complexes activate complement → attract neutrophils → release of lysosomal enzymes. (First Aid p. 111)"
    src: { page: 709, quote: "Type III hypersensitivity Antigen-antibody complexes activate complement → attract neutrophils → release of lysosomal enzymes" }
    status: unverified
  - id: rr.L01.033
    kind: card
    topic: immunology
    front: "Type IV hypersensitivity: what is the mechanism?"
    back: "T cell–mediated (no antibodies): APCs activate CD4+ T cells (→ cytokine release) or CD8+ T cells (→ direct cytotoxicity). (First Aid p. 111)"
    src: { page: 709, quote: "T cell–mediated (no antibodies involved); APCs activate CD4+ T cells (→ release of cytokines) or CD8+ T cells (→ direct cell cytotoxicity)" }
    status: unverified
  - id: rr.L01.034
    kind: card
    topic: immunology
    front: "Acute hemolytic transfusion reaction: what is the mechanism?"
    back: "Type II hypersensitivity reaction against donor RBCs (usually ABO antigens). (First Aid p. 112)"
    src: { page: 709, quote: "Acute hemolytic transfusion reaction Type II hypersensitivity reaction against donor RBCs (usually ABO antigens)" }
    status: unverified
  - id: rr.L01.035
