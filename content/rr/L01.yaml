    stem: "A 17-year-old boy has 6 months of a hand tremor, clumsy handwriting and falling grades. His aunt died of liver failure at 30. AST and ALT are mildly elevated, serum ceruloplasmin is low and 24-hour urinary copper is high. A mutation in which gene is most likely?"
    options:
