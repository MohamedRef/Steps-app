  # ---------- Microbiology ----------
  - id: rr.L01.043
    kind: card
    topic: microbiology
    front: "Why are patients with CGD prone to recurrent S aureus, Serratia and B cepacia infections?"
    back: "These catalase ⊕ organisms degrade H2O2 before it can be converted to microbicidal products by the myeloperoxidase system. (First Aid p. 126)"
    src: { page: 709, quote: "organisms degrade H2O2 before it can be converted to microbicidal products by the myeloperoxidase system" }
    status: unverified
  - id: rr.L01.044
    kind: card
    topic: microbiology
    front: "Hemolytic-uremic syndrome (from Shiga/Shiga-like toxin): what is the mechanism?"
    back: "Shiga/Shiga-like toxins inactivate the 60S ribosome → ↑ cytokine release. (First Aid pp. 130, 432)"
    src: { page: 710, quote: "Hemolytic-uremic syndrome Shiga/Shiga-like toxins inactivate 60S ribosome → ↑ cytokine release" }
    status: unverified
  - id: rr.L01.045
    kind: card
    topic: microbiology
    front: "Tetanus: what is the mechanism of tetanospasmin?"
    back: "Tetanospasmin cleaves SNARE → inhibits release of the inhibitory neurotransmitters GABA and glycine from Renshaw cells. (First Aid p. 130)"
    src: { page: 710, quote: "Tetanospasmin cleaves SNARE → inhibition of release of inhibitory neurotransmitters (GABA and glycine) from Renshaw cells" }
    status: unverified
  - id: rr.L01.046
    kind: card
    topic: microbiology
    front: "Botulism: what is the mechanism of the toxin?"
    back: "The toxin (a protease) cleaves SNARE → ↓ ACh release at the neuromuscular junction. (First Aid p. 130)"
    src: { page: 710, quote: "Botulism Toxin (protease) cleaves SNARE → ↓ neurotransmitter (ACh) release at NMJ" }
    status: unverified
  - id: rr.L01.047
    kind: mcq
    topic: microbiology
    stem: "A 45-year-old woman is brought to the emergency department with double vision, difficulty swallowing and weakness that began in her face and is now spreading to her arms. A day earlier she ate home-canned green beans. She is afebrile and alert. Pupils are dilated and poorly reactive, and deep tendon reflexes are reduced. Which mechanism best explains her weakness?"
    options:
      - "Cleavage of SNARE proteins → ↓ ACh release at the neuromuscular junction"
      - "Cleavage of SNARE proteins → ↓ release of GABA and glycine from Renshaw cells"
      - "ADP-ribosylation of EF-2 → inhibition of protein synthesis"
      - "Autoantibodies to presynaptic calcium channels → ↓ ACh release"
      - "Autoantibodies to postsynaptic nicotinic ACh receptors"
    answer: 0
    why:
      - "Right. Botulinum toxin is a protease that cleaves SNARE, so ACh vesicles can't fuse at the NMJ → descending flaccid paralysis."
      - "That is tetanospasmin: losing inhibitory transmitters gives spastic paralysis, not flaccid weakness."
      - "That is diphtheria exotoxin."
      - "Lambert-Eaton syndrome also ↓ ACh release, but it is autoimmune and gradual, not a day after canned food."
      - "That is myasthenia gravis, an autoimmune disease, not an acute foodborne illness."
    src: { page: 710, quote: "Botulism Toxin (protease) cleaves SNARE → ↓ neurotransmitter (ACh) release at NMJ" }
    status: unverified
  - id: rr.L01.048
    kind: card
    topic: microbiology
