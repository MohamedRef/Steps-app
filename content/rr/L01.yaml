    back: "Mutation in COL1A1 and COL1A2 → type 1 collagen defect → inability to form triple helices. (First Aid p. 49)"
    src: { page: 708, quote: "Osteogenesis imperfecta Mutation in COL1A1 and COL1A2 genes → Type 1 collagen defect → inability to form triple helices" }
