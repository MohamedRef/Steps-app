  # ---------- Biochemistry ----------
  - id: rr.L01.001
    kind: card
    topic: biochemistry
    front: "Lesch-Nyhan syndrome: what is the mechanism?"
    back: "HGPRT deficiency → ↓ purine salvage → ↑ de novo purine synthesis → ↑ uric acid. (First Aid p. 35)"
    src: { page: 708, quote: "Lesch-Nyhan syndrome HGPRT deficiency → ↓ purine salvage → ↑ de novo purine synthesis → ↑ uric acid" }
    status: unverified
  - id: rr.L01.002
    kind: cloze
    topic: biochemistry
    text: "Lynch syndrome (HNPCC): {{c1::MMR}} gene mutation (MLH1, MSH2) → failure of mismatch repair in {{c2::S}} phase → {{c3::microsatellite instability}} → ↑ risk of colorectal cancer (≈80%). (First Aid pp. 37, 395)"
    src: { page: 708, quote: "MMR gene mutation (MLH1, MSH2) → failure of mismatch repair (S phase) → microsatellite instability → ↑ risk of CRC (≈80%)" }
    status: unverified
  - id: rr.L01.003
    kind: card
    topic: biochemistry
    front: "β-thalassemia: what is the mechanism?"
    back: "Mutation at splice sites or promoter sequences on chromosome 11 → ↓ or absent β-globin synthesis. (First Aid pp. 38, 425)"
