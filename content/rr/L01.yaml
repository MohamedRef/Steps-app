  - id: rr.L01.067
    kind: mcq
    topic: pathology
    stem: "A 36-year-old man who recently emigrated from a country with high tuberculosis prevalence has 2 months of cough, night sweats and weight loss. Chest x-ray shows an upper-lobe cavity, and a lung biopsy shows caseating granulomas with epithelioid macrophages and multinucleated giant cells. Which cytokine, secreted by macrophages, drives naive CD4+ T cells to become the subset that sustains these granulomas?"
    options:
      - "IL-2"
      - "IL-4"
      - "IL-12"
      - "IFN-γ"
      - "IL-1"
    answer: 2
    why:
      - "IL-2 comes from T cells and drives T-cell growth; it isn't the macrophage signal that makes Th1 cells."
      - "IL-4 pushes CD4+ cells toward Th2, the response that fails to contain mycobacteria (as in lepromatous leprosy)."
      - "Right. Macrophages present antigen to CD4+ cells and secrete IL-12 → Th1 differentiation → IFN-γ → macrophage activation."
      - "IFN-γ is the Th1 cell's answer that activates macrophages; it is one step later and made by Th1 cells, not by the macrophage."
      - "IL-1 is a pyrogen; it isn't the signal for Th1 differentiation in the book's granuloma pathway."
    src: { page: 710, quote: "Macrophages present antigens to CD4+ and secrete IL-12 → CD4+ differentiation into Th1 → IFN-γ secretion → macrophage activation" }
    status: unverified
