    stem: "A 63-year-old man who smokes 2 packs a day has a central lung mass and is confused. Serum sodium is 121 mEq/L and serum osmolality is low, while urine osmolality is high and urine sodium is 60 mEq/L. He has no edema, his blood pressure is normal and the mucous membranes are moist. What best explains his high urine sodium?"
    options:
