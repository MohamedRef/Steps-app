    stem: "A 66-year-old man is in the coronary care unit 6 days after an anterior STEMI treated late. He suddenly becomes hypotensive and confused. Jugular veins are distended and heart sounds are muffled. Echocardiography shows a large pericardial effusion with a tear in the left ventricular free wall. The weakness of the wall at this time is mostly caused by which cells?"
    options:
      - "Neutrophils"
      - "Macrophages"
      - "Fibroblasts depositing collagen"
      - "Myocytes undergoing coagulative necrosis"
      - "Lymphocytes"
    answer: 1
    why:
      - "Neutrophils arrive early after the infarct; the book links the 3–14-day ruptures to macrophages."
      - "Right. Days 3–14 post-MI are the time of macrophage-mediated ruptures; the free wall ruptures at 5–14 days → tamponade."
      - "Collagen deposition strengthens the scar later; it doesn't cause rupture."
      - "Necrosis starts the process, but the softening that lets the wall rupture comes from macrophages clearing the debris."
      - "Lymphocytes are not the cells the book names for post-MI rupture."
    src: { page: 711, quote: "Macrophage-mediated ruptures: papillary muscle (2–7 days), interventricular septum (3–5 days), free wall (5–14 days)" }
