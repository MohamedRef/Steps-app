      - "Right. Mutated ATP7B → ↓ copper incorporation into apoceruloplasmin and ↓ biliary excretion → ↓ ceruloplasmin, ↑ copper in tissues and urine."
      - "HFE causes hemochromatosis: iron overload (↑ ferritin, ↑ transferrin saturation)."
      - "FBN1 causes Marfan syndrome."
      - "HTT causes Huntington disease; it causes movement and mood problems, but not low ceruloplasmin or liver disease."
    src: { page: 712, quote: "Mutated hepatocyte copper-transporting ATPase (ATP7B on chromosome 13) → ↓ copper incorporation into apoceruloplasmin, ↓ biliary excretion" }
    status: unverified
