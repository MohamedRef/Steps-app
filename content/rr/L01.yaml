    topic: biochemistry
    front: "Duchenne muscular dystrophy: what is the mechanism?"
    back: "Frameshift or nonsense mutations of the dystrophin gene → loss of dystrophin, the protein anchoring muscle to the ECM → myonecrosis. (First Aid p. 59)"
    src: { page: 708, quote: "Dystrophin gene frameshift or nonsense mutations → loss of anchoring protein to ECM (dystrophin) → myonecrosis" }
    status: unverified
