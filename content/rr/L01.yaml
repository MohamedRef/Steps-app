    topic: biochemistry
    front: "Becker muscular dystrophy: what is the mechanism, and why is it milder than Duchenne?"
    back: "Non-frameshift deletion of the dystrophin gene → partially functional protein → less severe than Duchenne. (First Aid p. 59)"
    src: { page: 708, quote: "Non-frameshift deletion of dystrophin gene → partially functional protein → less severe than Duchenne" }
