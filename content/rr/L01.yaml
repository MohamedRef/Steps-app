    topic: pathology
    text: "Granuloma: macrophages present antigen to CD4+ cells and secrete {{c1::IL-12}} → CD4+ differentiation into {{c2::Th1}} → {{c3::IFN-γ}} secretion → macrophage activation. (First Aid p. 213)"
