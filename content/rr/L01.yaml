      - "Right oculomotor nerve (efferent limb)"
      - "Dorsal midbrain"
      - "Sympathetic chain at the stellate ganglion"
      - "Right lens"
    answer: 0
    why:
      - "Right. A unilateral lesion of the afferent limb (retina, optic nerve) gives a relative afferent pupillary defect (Marcus Gunn pupil)."
      - "An efferent lesion would leave that pupil unable to constrict whichever eye is lit; both pupils would not dilate together."
      - "Dorsal midbrain compression (Parinaud) gives light-near dissociation and upward gaze palsy."
      - "Stellate ganglion compression gives Horner syndrome (miosis, ptosis)."
      - "A lens problem blurs vision but doesn't block the light signal on the afferent limb."
    src: { page: 718, quote: "Unilateral or asymmetric lesions of afferent limb of pupillary reflex" }
    status: unverified
