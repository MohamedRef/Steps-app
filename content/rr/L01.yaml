  - id: rr.L01.184
    kind: mcq
    topic: neurology
    stem: "A 64-year-old man with hypertension has sudden vertigo, hoarseness and trouble swallowing. Examination shows a drooping left eyelid with a small left pupil, loss of pain and temperature on the left face and the right side of the body, and left-sided ataxia. Occlusion of which artery is most likely?"
    options:
      - "Anterior spinal artery"
      - "Anterior inferior cerebellar artery"
      - "Posterior inferior cerebellar artery"
      - "Basilar artery"
      - "Middle meningeal artery"
    answer: 2
    why:
      - "Anterior spinal artery stroke gives medial medullary syndrome (motor and tongue findings), not hoarseness and crossed pain loss."
      - "AICA stroke gives lateral pontine syndrome: facial palsy and hearing loss, with no hoarseness. Hoarseness and dysphagia come from the nucleus ambiguus in the lateral medulla, which PICA supplies."
      - "Right. PICA stroke → lateral medullary (Wallenberg) syndrome, which also causes a 1st-neuron Horner syndrome."
      - "Basilar artery stroke gives locked-in syndrome."
      - "Middle meningeal artery rupture gives an epidural hematoma, not a stroke syndrome."
    src: { page: 715, quote: "Stroke of the posterior inferior cerebellar artery" }
    status: unverified
    tags: [high-yield]
