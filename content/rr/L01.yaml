      - "Primary aldosterone deficiency from adrenal destruction"
      - "Volume depletion from diuretic use"
      - "Osmotic diuresis from hyperglycemia"
      - "Hypoaldosteronism → ↑ K⁺ → ↓ NH3 synthesis"
    answer: 0
    why:
      - "Right. ↑ ADH → water retention → ↓ aldosterone, ↑ ANP, ↑ BNP → ↑ urinary Na⁺ secretion, which keeps him euvolemic."
      - "Adrenal insufficiency also wastes salt, but the setting (central lung mass, euvolemia) points to ectopic ADH."
      - "He takes no diuretic and is not volume depleted."
      - "Hyperglycemic osmotic diuresis is HHS; it would make him dehydrated with high serum osmolality."
      - "That is type 4 RTA, which gives hyperkalemic metabolic acidosis, not euvolemic hyponatremia."
    src: { page: 711, quote: "ADH → water retention → ↓ aldosterone, ↑ ANP, ↑ BNP → ↑ urinary Na" }
    status: unverified
