    front: "Prader-Willi syndrome: what is the mechanism?"
    back: "Imprinting, or maternal uniparental disomy (25%) → deletion or mutated expression of the paternal allele on chromosome 15. (First Aid p. 56)"
    src: { page: 708, quote: "Imprinting or maternal uniparental disomy (25%) → deletion or mutated expression of paternal allele on chromosome 15" }
    status: unverified
  - id: rr.L01.009
    kind: card
    topic: biochemistry
    front: "Angelman syndrome: what is the mechanism?"
    back: "Imprinting, or paternal uniparental disomy (5%) → deletion or mutated expression of UBE3A on the maternal chromosome 15. (First Aid p. 56)"
    src: { page: 708, quote: "Imprinting or paternal uniparental disomy (5%) → deletion or mutated expression of UBE3A on maternal chromosome 15" }
    status: unverified
  - id: rr.L01.010
    kind: cloze
    topic: biochemistry
    text: "Cystic fibrosis: ΔF508 CFTR deletion on chromosome {{c1::7}} → impaired ATP-gated Cl⁻ channel → {{c2::↓}} Cl⁻ secretion in lungs/GI tract and {{c3::↓ Cl⁻ reabsorption}} in sweat glands. (First Aid p. 58)"
    src: { page: 708, quote: "CFTR deletion on chromosome 7 → impaired ATP-gated Cl channel" }
