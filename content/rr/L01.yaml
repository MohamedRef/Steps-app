    topic: immunology
    front: "X-linked (Bruton) agammaglobulinemia: what is the mechanism?"
    back: "Defect in the BTK gene → no B-cell maturation → absent B cells in peripheral blood, ↓ Ig of all classes. (First Aid p. 114)"
    src: { page: 709, quote: "Defect in BTK gene → no B-cell maturation → absent B cells in peripheral blood, ↓ Ig of all classes" }
