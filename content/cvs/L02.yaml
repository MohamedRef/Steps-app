  # ---------- p287: heart anatomy ----------
  - id: cvs.L02.001
    kind: card
    topic: heart-anatomy
    front: Which chamber is the most posterior part of the heart?
    back: The left atrium (LA).
    src: { page: 287, quote: "LA is the most posterior part of the heart" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.002
    kind: enumerate
    topic: heart-anatomy
    prompt: Enumerate the 2 compression effects of left atrial enlargement (eg, in mitral stenosis), with the symptom each causes.
    points:
      - Compression of the esophagus → dysphagia
      - Compression of the left recurrent laryngeal nerve (branch of the vagus) → hoarseness (Ortner syndrome)
    pass: 2
    hook: "الـ LA ورا خالص، فلما يكبر بيدوس على اللي وراه: الـ esophagus (ما يعرفش يبلع) والـ recurrent laryngeal (صوته يتنبح)."
    src: { page: 287, quote: "LA enlargement (eg, in mitral stenosis) can lead to: Compression of esophagus → dysphagia" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.003
    kind: card
    topic: heart-anatomy
    front: What is Ortner syndrome?
    back: Hoarseness from compression of the left recurrent laryngeal nerve (a branch of the vagus) by an enlarged left atrium, eg in mitral stenosis.
    src: { page: 287, quote: "Compression of left recurrent laryngeal nerve (branch of vagus nerve → hoarseness (Ortner syndrome)" }
    status: unverified
  - id: cvs.L02.004
    kind: card
    topic: heart-anatomy
    front: Which chamber is the most anterior part of the heart, and what follows from that?
    back: The right ventricle. It is the chamber most commonly injured in trauma.
    src: { page: 287, quote: "RV is the most anterior part of the heart and most commonly injured in trauma." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.005
    kind: cloze
    topic: heart-anatomy
    text: The LV forms about {{c1::2/3}} and the RV about {{c2::1/3}} of the inferior (diaphragmatic) cardiac surface.
    src: { page: 287, quote: "LV is about 2/3 and RV is about 1/3 of the inferior (diaphragmatic) cardiac surface" }
    status: unverified
  - id: cvs.L02.006
    kind: mcq
    topic: heart-anatomy
    stem: >-
      A 38-year-old woman who emigrated from rural Egypt comes to the clinic because of progressive
      exertional dyspnea and a hoarse voice for 3 months. As a child she had recurrent sore throats
      and joint pains. Auscultation shows an opening snap followed by a low-pitched diastolic rumble
      at the apex. Laryngoscopy shows a paralyzed left vocal cord. Which of the following best explains
      her hoarseness?
    options:
      - Compression of the left recurrent laryngeal nerve by an enlarged left atrium
      - Compression of the left phrenic nerve by an enlarged pericardial sac
      - Compression of the esophagus by an enlarged right ventricle
      - Stretch of the right recurrent laryngeal nerve by a dilated superior vena cava
      - Laryngeal edema from right heart failure
    answer: 0
    why:
      - "Right. Rheumatic mitral stenosis enlarges the LA, the most posterior chamber, which compresses the left recurrent laryngeal nerve (Ortner syndrome)."
      - "The phrenic nerve supplies the pericardium and the diaphragm; it doesn't move the vocal cords."
      - "The RV is the most anterior chamber; it doesn't press on the esophagus, and the esophagus doesn't control the voice."
      - "The right recurrent laryngeal nerve loops under the right subclavian artery, away from the heart (standard anatomy, not on this page); an SVC doesn't stretch it."
      - "Right heart failure doesn't cause a paralyzed vocal cord."
    src: { page: 287, quote: "Compression of left recurrent laryngeal nerve (branch of vagus nerve → hoarseness (Ortner syndrome)" }
    status: unverified
  - id: cvs.L02.007
    kind: mcq
    topic: heart-anatomy
    stem: >-
      A 24-year-old man is brought to the emergency department after a stab wound just left of the
      sternum at the level of the fourth intercostal space. His blood pressure is 80/50 mm Hg and his
      neck veins are distended. Bedside ultrasonography shows a pericardial effusion. Which cardiac
      chamber is most likely to have been injured?
    options:
      - Left atrium
      - Left ventricle
      - Right atrium
      - Right ventricle
      - Coronary sinus
    answer: 3
    why:
      - "The LA is the most posterior chamber, the least reachable from the front."
      - "The LV is mostly posterior and lateral; it forms the apex but little of the anterior surface."
      - "The RA forms the right border; a parasternal wound on the left misses it."
      - "Right. The RV is the most anterior part of the heart and the chamber most commonly injured in trauma."
      - "The coronary sinus runs in the posterior AV groove."
    src: { page: 287, quote: "RV is the most anterior part of the heart and most commonly injured in trauma." }
    status: unverified
  # ---------- p287: pericardium ----------
  - id: cvs.L02.008
    kind: order
    topic: pericardium
    prompt: Put the layers of the pericardium in order from outer to inner.
    steps:
      - Fibrous pericardium
      - Parietal pericardium
      - Epicardium (visceral pericardium)
    src: { page: 287, quote: "Consists of 3 layers (from outer to inner): Fibrous pericardium Parietal pericardium Epicardium (visceral pericardium)" }
    status: unverified
  - id: cvs.L02.009
    kind: card
    topic: pericardium
    front: Between which two layers does the pericardial space lie?
    back: Between the parietal pericardium and the epicardium (visceral pericardium).
    src: { page: 287, quote: "Pericardial space lies between parietal pericardium and epicardium." }
    status: unverified
  - id: cvs.L02.010
    kind: card
    topic: pericardium
    front: Which nerve innervates the pericardium, and where can pericarditis refer pain?
    back: The phrenic nerve. Pericarditis can refer pain to the neck, arms, or one or both shoulders (often the left).
    src: { page: 287, quote: "Pericardium innervated by phrenic nerve. Pericarditis can cause referred pain to the neck, arms, or one or both shoulders (often left)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.011
    kind: mcq
    topic: pericardium
    stem: >-
      A 27-year-old man comes to the emergency department because of sharp chest pain for 2 days, 1 week
      after a viral upper respiratory infection. The pain is worse when he lies flat and better when he
      leans forward, and it spreads to the top of his left shoulder. A scratchy sound is heard at the left
      sternal border. Which nerve carries the pain he feels in his shoulder?
    options:
      - Vagus nerve
      - Phrenic nerve
      - Left recurrent laryngeal nerve
      - Intercostobrachial nerve
      - Greater splanchnic nerve
    answer: 1
    why:
      - "The vagus carries parasympathetic fibers to the heart; it doesn't explain shoulder pain."
      - "Right. The pericardium is innervated by the phrenic nerve (C3-C5, standard anatomy, not on this page), so pericarditis refers pain to the neck and shoulders, often the left."
      - "The recurrent laryngeal nerve supplies the larynx; compression gives hoarseness."
      - "The intercostobrachial nerve supplies skin of the axilla and medial arm, not the pericardium."
      - "Splanchnic nerves carry visceral pain from the abdomen."
    src: { page: 287, quote: "Pericardium innervated by phrenic nerve. Pericarditis can cause referred pain to the neck, arms, or one or both shoulders (often left)." }
    status: unverified
  # ---------- p287: coronary blood supply ----------
  - id: cvs.L02.012
    kind: card
    topic: coronary-blood-supply
    front: What does the LAD supply, and how often is it occluded?
    back: The anterior 2/3 of the interventricular septum, the anterolateral papillary muscle, and the anterior surface of the LV. It is the most commonly occluded coronary artery.
    src: { page: 287, quote: "LAD and its branches supply anterior 2/3 of interventricular septum, anterolateral papillary muscle, and anterior surface of LV. Most commonly occluded." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.013
    kind: enumerate
    topic: coronary-blood-supply
    prompt: Enumerate what the posterior descending artery (PDA) supplies (4).
    points:
      - Posterior 1/3 of the interventricular septum
      - Posterior 2/3 of the ventricular walls
      - Posteromedial papillary muscle
      - SA and AV nodes (as determined by dominance)
    pass: 4
    hook: "الـ posterior descending مسؤول عن كل حاجة posterior: تلت الـ septum، تلتين الحيطان، الـ posteromedial papillary، وزيادة عليهم الـ nodes."
    src: { page: 287, quote: "Posterior descending artery (PDA) supplies posterior 1/3 of interventricular septum, posterior 2/3 of ventricular walls, posteromedial papillary muscle, and SA and AV nodes (as determined by dominance)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.014
    kind: card
    topic: coronary-blood-supply
    front: What rhythm problems can an infarct in the posterior descending artery territory cause, and why?
    back: Nodal dysfunction (bradycardia or heart block), because the PDA supplies the SA and AV nodes (as determined by dominance).
    src: { page: 287, quote: "Infarct may cause nodal dysfunction (bradycardia or heart block)." }
    status: unverified
  - id: cvs.L02.015
    kind: card
    topic: coronary-blood-supply
    front: Which artery supplies the right ventricle?
    back: The right (acute) marginal artery.
    src: { page: 287, quote: "Right (acute) marginal artery supplies RV." }
    status: unverified
  - id: cvs.L02.016
    kind: table
    topic: coronary-blood-supply
    title: Coronary dominance
    columns: [Circulation, PDA arises from, How common]
    rows:
      - [Right-dominant, RCA, Most common]
      - [Left-dominant, LCX, ~5%-10% of patients]
      - [Codominant, Both LCX and RCA, ~10%-20% of patients]
    blanks: [[0, 1], [1, 1], [2, 1], [0, 2]]
    src: { page: 287, quote: "Right-dominant circulation (most common) = PDA arises from RCA" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.017
    kind: cloze
    topic: coronary-blood-supply
    text: Coronary blood flow to the LV and interventricular septum peaks in {{c1::early diastole}}.
    src: { page: 287, quote: "Coronary blood flow to LV and interventricular septum peaks in early diastole." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L02.018
    kind: cloze
    topic: coronary-blood-supply
    text: The coronary sinus runs in the {{c1::left AV groove}} and drains into the {{c2::RA}}.
    src: { page: 287, quote: "Coronary sinus runs in the left AV groove and drains into the RA." }
    status: unverified
  - id: cvs.L02.019
    kind: mcq
    topic: coronary-blood-supply
    stem: >-
      A 61-year-old man with hypertension and type 2 diabetes comes to the emergency department with
      crushing substernal pain for 1 hour. His pulse is 38/min. ECG shows ST elevation in leads II, III
      and aVF and complete heart block. Angiography shows a right-dominant coronary circulation. Occlusion
      of which artery best explains both his infarct and his heart block?
    options:
      - Left anterior descending artery
      - Left circumflex artery
      - Right coronary artery, proximal to the posterior descending artery
      - Obtuse marginal artery
      - Left main coronary artery
    answer: 2
    why:
      - "The LAD supplies the anterior LV and anterior 2/3 of the septum; its infarct gives anterior ST elevation."
      - "In a right-dominant heart the LCX doesn't give the PDA, so it doesn't supply the nodes."
      - "Right. In right-dominant circulation (most common) the PDA arises from the RCA; the PDA territory includes the SA and AV nodes, so an inferior infarct can cause bradycardia or heart block."
      - "The obtuse marginal is an LCX branch to the lateral LV wall."
      - "Left main occlusion threatens LAD and LCX territory, not the RCA-supplied nodes in a right-dominant heart."
    src: { page: 287, quote: "Infarct may cause nodal dysfunction (bradycardia or heart block)." }
    status: unverified
  - id: cvs.L02.020
    kind: mcq
    topic: coronary-blood-supply
    stem: >-
      A 66-year-old woman develops a new loud holosystolic murmur at the apex radiating to the axilla
      and acute pulmonary edema 4 days after an inferior wall myocardial infarction. Echocardiography
      shows a flail mitral leaflet from rupture of the posteromedial papillary muscle. Which artery most
      likely supplied this muscle?
    options:
      - Left anterior descending artery
      - Posterior descending artery
      - Right (acute) marginal artery
      - Obtuse marginal artery
      - Left main coronary artery
    answer: 1
    why:
      - "The LAD supplies the anterolateral papillary muscle, not the posteromedial one."
      - "Right. The posterior descending artery supplies the posteromedial papillary muscle; its infarct can rupture it and cause acute mitral regurgitation."
      - "The acute marginal artery supplies the RV."
      - "The obtuse marginal supplies the lateral LV wall."
      - "Left main occlusion would cause a massive anterior and lateral infarct."
    src: { page: 287, quote: "posteromedial papillary muscle, and SA and AV nodes (as determined by dominance)" }
    status: unverified
