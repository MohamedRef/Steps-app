  # ---------- p302: PPHN ----------
  - id: cvs.L04.029
    kind: card
    topic: persistent-pulmonary-hypertension-of-the-newborn
    front: What is persistent pulmonary hypertension of the newborn, and what are its risk factors?
    back: Pulmonary vascular resistance stays high after birth because the lung vessels developed or adapted abnormally. Inhaling meconium-stained amniotic fluid and neonatal pneumonia raise the risk.
    src: { page: 302, quote: "Persistence of ↑ pulmonary vascular resistance after birth. Associated with abnormal development and postpartum adaptation of pulmonary vasculature. Risk factors include aspiration of meconium- stained amniotic fluid and neonatal pneumonia." }
    status: unverified
  - id: cvs.L04.030
    kind: card
    topic: persistent-pulmonary-hypertension-of-the-newborn
    front: How does PPHN present, and how do pre- and postductal saturations compare?
    back: Right-to-left shunt through the foramen ovale and ductus → respiratory distress (eg, tachypnea) and often differential cyanosis. Preductal O2 saturation is often > postductal. Pulses are equal (no delay).
    src: { page: 302, quote: "Leads to right-to-left shunt through foramen ovale and ductus arteriosus. Preductal O2 saturation is often > postductal. Newborn presents with signs of respiratory distress (eg, tachypnea) and (often differential) cyanosis. Equal pulses (no delay)." }
    status: unverified
  - id: cvs.L04.031
    kind: mcq
    topic: persistent-pulmonary-hypertension-of-the-newborn
    stem: >-
      A term newborn delivered through thick meconium-stained amniotic fluid has tachypnea and cyanosis at
      6 hours of life. Pulse oximetry is 95% on the right hand and 82% on the foot. Upper and lower
      extremity pulses are equal with no delay. Which of the following best explains the difference in
      saturation?
    options:
      - Narrowing of the aorta near the ductus, slowing flow to the legs
      - Right-to-left flow through the ductus from high pulmonary resistance
      - Left-to-right flow through the ductus from low pulmonary resistance
      - Transposed great arteries, keeping the two circulations apart
      - Right-to-left flow through an atrial septal defect in isolation
    answer: 1
    why:
      - "Coarctation gives weak, delayed leg pulses; hers are equal."
      - "Right. PPHN (risk: meconium aspiration) keeps pulmonary resistance high, so blood shunts right to left through the ductus: preductal saturation > postductal, with equal pulses."
      - "Left-to-right ductal flow sends oxygenated blood to the lungs; it doesn't desaturate the legs."
      - "TGA gives severe cyanosis of the whole body, not a gap between arm and leg."
      - "An atrial shunt mixes before the aorta, so it can't make arm and leg saturations differ."
    src: { page: 302, quote: "Preductal O2 saturation is often > postductal." }
    status: unverified
