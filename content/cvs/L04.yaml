  # ---------- p300: right-to-left shunts ----------
  - id: cvs.L04.001
    kind: card
    topic: right-to-left-shunts
    front: How do right-to-left shunts present, and how are they usually managed at first?
    back: The baby is blue from the start ("blue babies"); the defect is usually found before birth or shows right after delivery. Treatment is often urgent surgery and/or prostaglandins to hold the ductus (PDA) open.
    src: { page: 300, quote: "Early cyanosis—“blue babies.” Often diagnosed prenatally or become evident immediately after birth. Usually require urgent surgical treatment and/or maintenance of a PDA via prostaglandin therapy." }
    status: unverified
  - id: cvs.L04.002
    kind: enumerate
    topic: right-to-left-shunts
    prompt: Enumerate the 5 T's of right-to-left shunts.
    points:
      - Truncus arteriosus (1 vessel)
      - Transposition (2 switched vessels)
      - Tricuspid atresia (3 = Tri)
      - Tetralogy of Fallot (4 = Tetra)
      - TAPVR (5 letters in the name)
    pass: 5
    hook: "الكتاب بيعدّهم بالأرقام: 1 vessel، 2 متبدلين، Tri = 3، Tetra = 4، و TAPVR 5 حروف."
    src: { page: 300, quote: "The 5 T’s: 1. Truncus arteriosus (1 vessel) 2. Transposition (2 switched vessels) 3. Tricuspid atresia (3 = Tri) 4. Tetralogy of Fallot (4 = Tetra) 5. TAPVR (5 letters in the name)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.003
    kind: card
    topic: right-to-left-shunts
    front: What is persistent truncus arteriosus, and what usually accompanies it?
    back: The truncus fails to divide into pulmonary trunk and aorta because the aorticopulmonary septum fails to form. Most patients also have a VSD.
    src: { page: 300, quote: "Truncus arteriosus fails to divide into pulmonary trunk and aorta due to failure of aorticopulmonary septum formation; most patients have accompanying VSD." }
    status: unverified
  - id: cvs.L04.004
    kind: card
    topic: right-to-left-shunts
    front: "In D-transposition of the great arteries, which vessel leaves which ventricle?"
    back: "The aorta leaves the RV (anteriorly) and the pulmonary trunk leaves the LV (posteriorly), so the systemic and pulmonary circulations are separate."
    src: { page: 300, quote: "Aorta leaves RV (anterior) and pulmonary trunk leaves LV (posterior) → separation of systemic and pulmonary circulations" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.204
    kind: card
    topic: right-to-left-shunts
    front: "What does an infant with D-transposition need to survive until surgery?"
    back: "A shunt that lets the circulations mix: a VSD, PDA or patent foramen ovale."
    src: { page: 300, quote: "Not compatible with life unless a shunt is present to allow mixing of blood (eg, VSD, PDA, or patent foramen ovale)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.205
    kind: card
    topic: right-to-left-shunts
    front: "What happens to infants with D-transposition without surgery?"
    back: "Most die within the first few months of life."
    src: { page: 300, quote: "Without surgical intervention, most infants die within the first few months of life." }
    status: unverified
  - id: cvs.L04.005
    kind: card
    topic: right-to-left-shunts
    front: What embryologic failure causes D-TGA, and what does the chest x-ray show?
    back: Failure of the aorticopulmonary septum to spiral. CXR shows an "egg on a string" (narrow superior mediastinum).
    src: { page: 300, quote: "Due to failure of the aorticopulmonary septum to spiral (narrow superior mediastinum causes “egg on a string” appearance on CXR)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.006
    kind: card
    topic: right-to-left-shunts
    front: "What is tricuspid atresia, and what does it need for viability?"
    back: "An absent tricuspid valve with a hypoplastic RV; it needs both an ASD and a VSD or PDA."
    src: { page: 300, quote: "Absence of tricuspid valve, hypoplastic RV; requires both ASD and VSD/PDA for viability." }
    status: unverified
  - id: cvs.L04.206
    kind: card
    topic: right-to-left-shunts
    front: "What does the ECG show in tricuspid atresia?"
    back: "RA hypertrophy (tall P waves) and LV hypertrophy (left axis deviation)."
    src: { page: 300, quote: "ECG shows hypertrophy of RA (tall P-waves) and LV (left axis deviation)." }
    status: unverified
  - id: cvs.L04.007
    kind: enumerate
    topic: right-to-left-shunts
    prompt: Enumerate the 4 components of tetralogy of Fallot (PROVe).
    points:
      - Pulmonary infundibular stenosis (most important determinant of prognosis)
      - Right ventricular hypertrophy (boot-shaped heart on CXR)
      - Overriding aorta (straddles the VSD, receives blood from both ventricles)
      - VSD
    pass: 4
    hook: "الكتاب بيقولها PROVe: Pulmonary stenosis و RVH و Overriding aorta و VSD."
    src: { page: 300, quote: "Pulmonary infundibular stenosis (most important determinant for prognosis) Right ventricular hypertrophy (RVH)— boot-shaped heart on CXR B Overriding aorta—straddles VSD, receives blood from both LV and RV VSD" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.008
    kind: card
    topic: right-to-left-shunts
    front: What embryologic defect causes tetralogy of Fallot?
    back: The infundibular septum is displaced anteriorly and superiorly.
    src: { page: 300, quote: "Caused by anterosuperior displacement of the infundibular septum." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.243
    kind: card
    topic: right-to-left-shunts
    front: "What is the most common cause of cyanosis in early childhood?"
    back: "Tetralogy of Fallot."
    src: { page: 300, quote: "Caused by anterosuperior displacement of the infundibular septum. Most common cause of early childhood cyanosis." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.244
    kind: card
    topic: right-to-left-shunts
    front: "Which genetic syndromes are associated with tetralogy of Fallot?"
    back: "22q11 syndromes."
    src: { page: 300, quote: "Associated with 22q11 syndromes." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.009
    kind: card
    topic: right-to-left-shunts
    front: What triggers "tet spells," and why does squatting help?
    back: Crying, fever and exercise worsen RV outflow obstruction, forcing more right-to-left flow across the VSD. Squatting ↑ SVR, ↓ the right-to-left shunt and improves cyanosis.
    src: { page: 300, quote: "“tet spells” (often caused by crying, fever, and exercise due to exacerbation of RV outflow obstruction). PROVe. Squatting: ↑ SVR, ↓ right-to-left shunt, improves cyanosis." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.010
    kind: card
    topic: right-to-left-shunts
    front: What is TAPVR, and what lets the baby survive?
    back: Total anomalous pulmonary venous return; the pulmonary veins drain into the right heart circulation (SVC, coronary sinus, etc). An ASD, and sometimes a PDA, allows right-to-left shunting to maintain CO.
    src: { page: 300, quote: "Pulmonary veins drain into right heart circulation (SVC, coronary sinus, etc); associated with ASD and sometimes PDA to allow for right-to-left shunting to maintain CO." }
    status: unverified
  - id: cvs.L04.011
    kind: card
    topic: right-to-left-shunts
    front: "What is Ebstein anomaly?"
    back: "Downward displacement of the tricuspid valve leaflets into the RV, which \"atrializes\" part of the ventricle."
    src: { page: 300, quote: "Displacement of tricuspid valve leaflets downward into RV, artificially “atrializing” the ventricle." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.207
    kind: card
    topic: right-to-left-shunts
    front: "What is Ebstein anomaly associated with?"
    back: "Tricuspid regurgitation, accessory conduction pathways and right-sided HF."
    src: { page: 300, quote: "Associated with tricuspid regurgitation, accessory conduction pathways, right-sided HF." }
    status: unverified
  - id: cvs.L04.208
    kind: card
    topic: right-to-left-shunts
    front: "Which in utero exposure can cause Ebstein anomaly?"
    back: "Lithium."
    src: { page: 300, quote: "Can be caused by lithium exposure in utero." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.012
    kind: mcq
    topic: right-to-left-shunts
    stem: >-
      A 4-year-old boy is brought to the clinic because he often squats down after running with his
      friends. During crying episodes his lips turn blue. Examination shows a harsh systolic ejection
      murmur at the left upper sternal border. Chest x-ray shows a boot-shaped heart. Which of the
      following best explains why squatting relieves his symptoms?
    options:
      - It lowers venous return, so less blood reaches the right ventricle
      - It raises systemic vascular resistance, so less blood crosses the VSD
      - It widens the infundibular outflow, so more blood reaches the lungs
      - It closes the ductus arteriosus, so less blood bypasses the lungs
      - It lowers pulmonary vascular resistance, so more blood reaches the lungs
    answer: 1
    why:
      - "Squatting compresses the leg veins and pushes blood back toward the heart, so venous return does not fall (standard physiology, not in First Aid); First Aid credits the rise in SVR."
      - "Right. In tetralogy of Fallot, squatting ↑ SVR, so less RV blood crosses the VSD into the aorta (↓ right-to-left shunt) and cyanosis improves."
      - "The infundibular stenosis is a fixed anatomic narrowing; a change in posture can't widen it."
      - "The ductus has long closed in a 4-year-old, so there is no ductal flow left to change."
      - "Squatting compresses systemic arteries in the legs; it acts on systemic, not pulmonary, resistance."
    src: { page: 300, quote: "Squatting: ↑ SVR, ↓ right-to-left shunt, improves cyanosis." }
    status: unverified
  - id: cvs.L04.013
    kind: mcq
    topic: right-to-left-shunts
    stem: >-
      A newborn boy develops tachycardia and cyanosis on day 2 of life. His mother took a mood stabilizer
      throughout pregnancy for bipolar disorder. ECG shows a short PR interval with a delta wave.
      Echocardiography shows the tricuspid leaflets displaced far into the right ventricle. Which
      additional finding is most likely?
    options:
      - Mitral stenosis
      - Tricuspid regurgitation
      - Coarctation of the aorta
      - Bicuspid aortic valve
      - Supravalvular aortic stenosis
    answer: 1
    why:
      - "Mitral stenosis is a late sequela of rheumatic fever."
      - "Right. Ebstein anomaly (lithium in utero) atrializes the RV and is associated with tricuspid regurgitation, accessory conduction pathways (WPW-type delta wave) and right-sided HF."
      - "Coarctation is associated with Turner syndrome and bicuspid aortic valve."
      - "Bicuspid aortic valve goes with Turner syndrome."
      - "Supravalvular aortic stenosis goes with Williams syndrome."
    src: { page: 300, quote: "Associated with tricuspid regurgitation, accessory conduction pathways, right-sided HF. Rare. Can be caused by lithium exposure in utero." }
    status: unverified
  - id: cvs.L04.014
    kind: mcq
    topic: right-to-left-shunts
    stem: >-
      A newborn girl born to a mother with poorly controlled type 1 diabetes becomes deeply cyanotic within
      hours of birth. There is no murmur. Chest x-ray shows a narrow superior mediastinum with an
      egg-shaped heart. Failure of which embryologic process caused her defect?
    options:
      - Fusion of the endocardial cushions
      - Spiraling of the aorticopulmonary septum
      - Fusion of septum primum and septum secundum
      - Formation of the aorticopulmonary septum
      - Downward displacement of the tricuspid leaflets
    answer: 1
    why:
      - "Cushion defects give AV septal defects (Down syndrome)."
      - "Right. D-TGA ('egg on a string', infant of a diabetic mother) is due to failure of the aorticopulmonary septum to spiral."
      - "Unfused septa give a patent foramen ovale."
      - "Failure to form the septum at all gives persistent truncus arteriosus."
      - "Displaced tricuspid leaflets are Ebstein anomaly."
    src: { page: 300, quote: "Due to failure of the aorticopulmonary septum to spiral (narrow superior mediastinum causes “egg on a string” appearance on CXR)." }
    status: unverified
  # ---------- p301: left-to-right shunts ----------
  - id: cvs.L04.015
    kind: cloze
    topic: left-to-right-shunts
    text: Left-to-right shunts are {{c1::acyanotic}} at presentation; cyanosis may occur years later. Frequency is {{c2::VSD > ASD > PDA}}.
    src: { page: 301, quote: "Acyanotic at presentation; cyanosis may occur years later. Frequency: VSD > ASD > PDA." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.016
    kind: card
    topic: left-to-right-shunts
    front: "When does a VSD cause symptoms?"
    back: "Not at birth. It may show up weeks later, or never cause symptoms at all."
    src: { page: 301, quote: "Asymptomatic at birth, may manifest weeks later or remain asymptomatic throughout life." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.245
    kind: card
    topic: left-to-right-shunts
    front: "What happens to small VSDs, and to large ones left without surgery?"
    back: "Most small ones close on their own. Large untreated ones flood the lungs with blood and overload the LV (Eisenmenger syndrome), which can end in HF."
    src: { page: 301, quote: "Most smaller defects self-resolve; larger defects, if left surgically untreated, cause ↑ pulmonary blood flow and LV overload (Eisenmenger syndrome), which may progress to HF." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.246
    kind: card
    topic: left-to-right-shunts
    front: "In a ventricular septal defect, a left-to-right shunt, where does O2 saturation step up?"
    back: "In the RV and pulmonary artery, not yet in the RA (an atrial septal defect raises it from the RA onward)."
    src: { page: 301, quote: "O2 saturation ↑ in RV and pulmonary artery." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.017
    kind: card
    topic: left-to-right-shunts
    front: What are the murmur and S2 findings of an ASD, and which type is most common?
    back: Systolic ejection murmur with a wide, fixed split S2. Ostium secundum defects are most common (usually isolated); ostium primum defects are rarer and come with other anomalies.
    src: { page: 301, quote: "systolic ejection murmur with wide, fixed split S2. Ostium secundum defects most common and usually an isolated finding; ostium primum defects rarer and usually occur with other cardiac anomalies." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.232
    kind: card
    topic: left-to-right-shunts
    front: "What symptoms can an ASD cause?"
    back: "Anything from no symptoms at all to HF."
    src: { page: 301, quote: "Symptoms range from none to HF." }
    status: unverified
  - id: cvs.L04.018
    kind: card
    topic: left-to-right-shunts
    front: "Where does O2 saturation step up in an ASD?"
    back: "In the RA, RV and pulmonary artery."
    src: { page: 301, quote: "O2 saturation ↑ in RA, RV, and pulmonary artery." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.194
    kind: card
    topic: left-to-right-shunts
    front: "How can an ASD cause a stroke?"
    back: "Paradoxical emboli: venous clots cross the ASD to the systemic arteries when the shunt temporarily reverses (eg, lifting weights, Eisenmenger syndrome)."
    src: { page: 301, quote: "May lead to paradoxical emboli (systemic venous emboli use ASD to bypass lungs and become systemic arterial emboli) in the setting of temporary shunt reversal" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.195
    kind: card
    topic: left-to-right-shunts
    front: "How does an ASD differ from a patent foramen ovale?"
    back: "PFO is a failure of fusion of the septum primum and secundum; an ASD is a true defect in the septal tissue."
    src: { page: 301, quote: "Distinct from patent foramen ovale, which is due to failed fusion." }
    status: unverified
  - id: cvs.L04.196
    kind: card
    topic: left-to-right-shunts
    front: "Which syndrome is associated with ASD?"
    back: "Down syndrome."
    src: { page: 301, quote: "Associated with Down syndrome." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.019
    kind: card
    topic: left-to-right-shunts
    front: Why does a PDA shunt change direction after birth?
    back: Before birth it shunts right to left, which is normal. After birth pulmonary vascular resistance falls, so flow turns left to right, and over time this leads to RVH and/or LVH and HF.
    src: { page: 301, quote: "In fetal period, shunt is right to left (normal). In neonatal period, ↓ pulmonary vascular resistance → shunt becomes left to right → progressive RVH and/or LVH and HF." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.247
    kind: card
    topic: left-to-right-shunts
    front: "What keeps a ductus arteriosus open?"
    back: "Prostaglandin E synthesis and a low O2 tension."
    src: { page: 301, quote: "Patency is maintained by PGE synthesis and low O2 tension." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.020
    kind: card
    topic: left-to-right-shunts
    front: What late sign can an uncorrected PDA cause?
    back: Late cyanosis of the lower extremities (differential cyanosis).
    src: { page: 301, quote: "Uncorrected PDA D can eventually result in late cyanosis in the lower extremities (differential cyanosis)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.271
    kind: card
    topic: left-to-right-shunts
    front: Is a patent ductus arteriosus abnormal in the fetus, and when does it normally close?
    back: No. The PDA is normal in utero and normally closes soon after birth.
    src: { page: 301, quote: "PDA is normal in utero and normally closes soon after birth." }
    status: unverified
  - id: cvs.L04.021
    kind: order
    topic: left-to-right-shunts
    prompt: Put the steps of Eisenmenger syndrome in order.
    steps:
      - Uncorrected left-to-right shunt (VSD, ASD, PDA)
      - ↑ pulmonary blood flow
      - Pathologic remodeling of the pulmonary vasculature
      - Pulmonary arterial hypertension
      - Compensatory RVH
      - Shunt becomes right to left when RV > LV pressure
    src: { page: 301, quote: "Uncorrected left-to-right shunt (VSD, ASD, PDA) → ↑ pulmonary blood flow → pathologic remodeling of vasculature → pulmonary arterial hypertension. RVH occurs to compensate → shunt becomes right to left when RV > LV pressure" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.022
    kind: card
    topic: left-to-right-shunts
    front: What are the clinical features of Eisenmenger syndrome?
    back: Late cyanosis, clubbing and polycythemia. Age of onset depends on the size and severity of the original left-to-right shunt.
    src: { page: 301, quote: "Causes late cyanosis, clubbing, and polycythemia. Age of onset varies depending on size and severity of initial left-to-right shunt." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.183
    kind: card
    topic: left-to-right-shunts
    front: "What murmur does a patent ductus arteriosus classically cause?"
    back: "A continuous, \"machinelike\" murmur."
    src: { page: 301, quote: "Associated with a continuous, “machinelike” murmur." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.023
    kind: mcq
    topic: left-to-right-shunts
    stem: >-
      A 28-year-old woman has had a known heart murmur since childhood that was never treated. She now has
      exertional dyspnea, clubbing of the toes only, and a hematocrit of 58%. Her toes are cyanotic
      but her fingers are pink. Femoral pulses are normal, and her arm and leg blood pressures are
      equal. Which lesion most likely underlies her condition?
    options:
      - Ventricular septal defect
      - Atrial septal defect
      - Patent ductus arteriosus
      - Tetralogy of Fallot
      - Coarctation of the aorta
    answer: 2
    why:
      - "A reversed VSD causes cyanosis of the whole body, not just the legs."
      - "A reversed ASD also mixes blood before the aorta, so cyanosis is generalized."
      - "Right. An uncorrected PDA leads to Eisenmenger (late cyanosis, clubbing, polycythemia); the reversed shunt enters the aorta beyond the arm vessels, so cyanosis is in the lower extremities (differential cyanosis)."
      - "Tetralogy gives early childhood cyanosis."
      - "Coarctation can cause leg cyanosis, but with weak, delayed femoral pulses and arm hypertension; her pulses and pressures are normal, and the polycythemia and clubbing here come from a reversed shunt."
    src: { page: 301, quote: "Uncorrected PDA D can eventually result in late cyanosis in the lower extremities (differential cyanosis)." }
    status: unverified
  - id: cvs.L04.024
    kind: mcq
    topic: left-to-right-shunts
    stem: >-
      A 30-year-old man undergoes right heart catheterization for exertional dyspnea. Oxygen saturation is
      70% in the superior vena cava, 84% in the right atrium, 84% in the right ventricle and 84% in the
      pulmonary artery. Which auscultatory finding is most likely?
    options:
      - Continuous machinelike murmur
      - Holosystolic murmur at the tricuspid area with normal splitting of S2
      - Systolic ejection murmur with wide, fixed splitting of S2
      - Opening snap followed by a diastolic rumble
      - Early diastolic decrescendo murmur
    answer: 2
    why:
      - "A PDA raises saturation only in the pulmonary artery (standard physiology; First Aid gives step-ups only for VSD and ASD)."
      - "A VSD raises saturation from the RV onward, not in the RA."
      - "Right. A step-up starting in the RA means an ASD: systolic ejection murmur with a wide, fixed split S2."
      - "That is mitral stenosis."
      - "That is aortic regurgitation."
    src: { page: 301, quote: "O2 saturation ↑ in RA, RV, and pulmonary artery." }
    status: unverified
  # ---------- p302: coarctation ----------
  - id: cvs.L04.025
    kind: card
    topic: coarctation-of-the-aorta
    front: Where is a coarctation of the aorta, and what is it associated with?
    back: Aortic narrowing near the insertion of the ductus arteriosus ("juxtaductal"). Associated with bicuspid aortic valve, other heart defects and Turner syndrome.
    src: { page: 302, quote: "Aortic narrowing A near insertion of ductus arteriosus (“juxtaductal”). Associated with bicuspid aortic valve, other heart defects, and Turner syndrome." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L04.026
    kind: card
    topic: coarctation-of-the-aorta
    front: What are the arm and leg findings in coarctation of the aorta?
