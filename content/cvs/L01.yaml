    topic: fetal-postnatal-derivatives
    text: The umbilical arteries become the {{c1::medial}} umbilical ligaments; the urachus (allantois) becomes the {{c2::median}} umbilical ligament.
    src: { page: 286, quote: "Allantois → urachus Median umbilical ligament Urachus is part of allantois between bladder and umbilicus Umbilical arteries Medial umbilical ligaments" }
    status: unverified
  # ---------- p286: fetal circulation ----------
  - id: cvs.L01.019
    kind: enumerate
    topic: fetal-circulation
    prompt: Enumerate the 3 important shunts of the fetal circulation.
    points:
      - Umbilical vein → ductus venosus → IVC, bypassing the hepatic circulation
      - Most of the highly oxygenated blood from the IVC → foramen ovale → LA
      - "Deoxygenated SVC blood → RA → RV → main pulmonary artery → ductus arteriosus → descending aorta (because fetal pulmonary artery resistance is high)"
    pass: 3
    hook: "الدم في الجنين بيزوّغ من 3 حاجات مش شغالة لسه: الكبد (ductus venosus)، والرئة مرتين (foramen ovale و ductus arteriosus)."
    src: { page: 286, quote: "3 important shunts: Umbilical vein → ductus venosus → IVC (bypassing hepatic circulation)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.020
    kind: order
    topic: fetal-circulation
    prompt: Put the events that close the foramen ovale at birth in order.
    steps:
      - The infant takes a breath
      - Resistance in the pulmonary vasculature falls
      - LA pressure rises above RA pressure
      - The foramen ovale closes (now the fossa ovalis)
    src: { page: 286, quote: "At birth, infant takes a breath → ↓ resistance in pulmonary vasculature → ↑ LA pressure vs RA pressure → foramen ovale closes (now called fossa ovalis)" }
    status: unverified
  - id: cvs.L01.021
    kind: card
    topic: fetal-circulation
    front: What two changes at birth close the ductus arteriosus?
    back: ↑ O2 (from breathing) and ↓ prostaglandins (from placental separation).
    src: { page: 286, quote: "↑ in O2 (from respiration) and ↓ in prostaglandins (from placental separation) → closure of ductus arteriosus." }
    status: unverified
  - id: cvs.L01.022
    kind: card
    topic: fetal-circulation
    front: Which drugs help close a patent ductus arteriosus, and which keep it open?
    back: "Close it: NSAIDs (indomethacin, ibuprofen) or acetaminophen (\"Endomethacin\" ends the PDA). Keep it open: prostaglandins E1 and E2 (\"kEEp\")."
    src: { page: 286, quote: "NSAIDs (eg, indomethacin, ibuprofen) or acetaminophen help close the patent ductus arteriosus (PDA)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.023
    kind: mcq
    topic: fetal-circulation
    stem: >-
      A newborn girl becomes deeply cyanotic 18 hours after birth. Echocardiography shows the aorta
      arising from the right ventricle and the pulmonary artery from the left ventricle. While she awaits
      surgery, an infusion is started to keep a fetal channel open so that oxygenated and deoxygenated
      blood can mix. Which drug is infused?
    options:
      - Indomethacin
      - Ibuprofen
      - Alprostadil (prostaglandin E1)
      - Acetaminophen
      - Supplemental oxygen at a high concentration
    answer: 2
    why:
      - "Indomethacin is an NSAID that closes the ductus: the opposite of what she needs."
      - "Ibuprofen, another NSAID, also closes the ductus."
      - "Right. Prostaglandins E1 and E2 kEEp the PDA open, letting the two circulations mix in transposition."
      - "Acetaminophen also helps close a PDA."
      - "Rising O2 is one of the signals that closes the ductus at birth."
    src: { page: 286, quote: "Prostaglandins E1 and E2 kEEp PDA open" }
    status: unverified
