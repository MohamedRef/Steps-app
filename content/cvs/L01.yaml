  # ---------- p284-285: heart morphogenesis ----------
  - id: cvs.L01.001
    kind: card
    topic: heart-morphogenesis
    front: What is the first functional organ in vertebrate embryos, and when does it start beating?
    back: The heart. It beats spontaneously by 4-5 weeks of development.
    src: { page: 284, quote: "First functional organ in vertebrate embryos; beats spontaneously by 4-5 weeks of development." }
    status: unverified
  - id: cvs.L01.002
    kind: cloze
    topic: heart-morphogenesis
    text: The primary heart tube loops to establish {{c1::left-right polarity}}, beginning in week {{c2::4}} of development.
    src: { page: 284, quote: "Primary heart tube loops to establish left-right polarity; begins in week 4 of development." }
    status: unverified
  - id: cvs.L01.003
    kind: card
    topic: heart-morphogenesis
    front: A defect in which protein disturbs cardiac looping and can cause dextrocardia, as in Kartagener syndrome?
    back: Left-right dynein (involved in left-right asymmetry).
    src: { page: 284, quote: "Defect in left-right dynein (involved in left-right asymmetry) can lead to dextrocardia, as seen in Kartagener syndrome." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.004
    kind: enumerate
    topic: heart-morphogenesis
    prompt: Enumerate the conotruncal abnormalities associated with failure of neural crest cell migration (3).
    points:
      - Transposition of great arteries (TGA)
      - Tetralogy of Fallot
      - Persistent truncus arteriosus
    pass: 3
    hook: "الـ neural crest لو ما هاجرش، الـ outflow tract بيبوظ بـ 3 Ts: Transposition و Tetralogy و Truncus."
    src: { page: 284, quote: "Conotruncal abnormalities associated with failure of neural crest cells to migrate: Transposition of great arteries (TGA). Tetralogy of Fallot. Persistent truncus arteriosus." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.005
    kind: cloze
    topic: heart-morphogenesis
    text: Neural crest cell migrations form the truncal and bulbar ridges, which spiral and fuse into the {{c1::aorticopulmonary septum}}, dividing the {{c2::ascending aorta}} from the {{c3::pulmonary trunk}}.
    src: { page: 284, quote: "Neural crest cell migrations → truncal and bulbar ridges that spiral and fuse to form aorticopulmonary septum → ascending aorta and pulmonary trunk." }
    status: unverified
  - id: cvs.L01.006
    kind: card
    topic: heart-morphogenesis
    front: Where do the aortic and pulmonary valves come from, and where do the mitral and tricuspid valves come from?
    back: "Aortic/pulmonary: endocardial cushions of the outflow tract. Mitral/tricuspid: fused endocardial cushions of the AV canal."
    src: { page: 284, quote: "Aortic/pulmonary: derived from endocardial cushions of outflow tract. Mitral/tricuspid: derived from fused endocardial cushions of the AV canal." }
    status: unverified
  - id: cvs.L01.007
    kind: order
    topic: heart-morphogenesis
    prompt: Put the steps of atrial septation in order.
    steps:
      - Septum primum grows toward the endocardial cushions, narrowing the ostium primum
      - Ostium secundum forms in septum primum by cell death (ostium primum regresses)
      - Septum secundum develops on the right side of septum primum, while ostium secundum keeps the right-to-left shunt
      - Septum secundum covers most of ostium secundum; the residual opening is the foramen ovale
      - The rest of septum primum forms the one-way valve of the foramen ovale
      - Soon after birth, septum primum closes against septum secundum (↑ LA and ↓ RA pressure)
      - Septum primum and septum secundum fuse in infancy or early childhood, forming the atrial septum
    src: { page: 284, quote: "Septum primum grows toward endocardial cushions, narrowing ostium primum. Ostium secundum forms in septum primum due to cell death" }
    status: unverified
  - id: cvs.L01.008
    kind: card
    topic: heart-morphogenesis
    front: What is a patent foramen ovale, how common is it, and what complication can it cause?
    back: Failure of septum primum and septum secundum to fuse after birth. Seen in 25% of the population; most are asymptomatic. It can cause paradoxical emboli (venous thromboemboli crossing a right-to-left shunt into the systemic arteries), as an ASD can.
    src: { page: 284, quote: "Patent foramen ovale—failure of septum primum and septum secundum to fuse after birth; seen in 25% of population." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.009
    kind: mcq
    topic: heart-morphogenesis
    stem: >-
      A 34-year-old woman is brought to the emergency department 1 hour after sudden weakness of her
      right arm and face. Two weeks ago she flew 14 hours and has had a swollen, tender left calf since.
      MRI shows an acute left middle cerebral artery infarct. ECG shows sinus rhythm. A bubble study on
      echocardiography shows bubbles in the left atrium within three beats after a Valsalva maneuver.
      Failure of which embryologic event best explains her stroke?
    options:
      - Fusion of septum primum and septum secundum
      - Fusion of the endocardial cushions
      - Spiraling of the aorticopulmonary septum
      - Growth of the muscular interventricular septum
      - Closure of the ductus arteriosus
    answer: 0
    why:
      - "Right. Unfused septa leave a patent foramen ovale; a DVT embolus crosses right-to-left (paradoxical embolus) to the brain."
      - "Incomplete endocardial cushion fusion gives an AV septal defect (primum ASD, cleft mitral valve, VSD), classically with Down syndrome, not this picture."
      - "Failed spiraling gives transposition of the great arteries: cyanosis at birth, not a stroke at 34."
      - "A muscular VSD shunts left-to-right; it doesn't pass a venous clot after Valsalva into the left atrium."
      - "A patent ductus shunts aorta to pulmonary artery and gives a continuous machine-like murmur; bubbles would not enter the left atrium."
    src: { page: 284, quote: "Can lead to paradoxical emboli (venous thromboemboli entering the systemic arterial circulation through right-to-left shunt)" }
    status: unverified
  - id: cvs.L01.010
    kind: cloze
    topic: heart-morphogenesis
    text: The {{c1::aorticopulmonary septum}} rotates and fuses with the muscular ventricular septum to form the {{c2::membranous interventricular septum}}, closing the interventricular foramen.
    src: { page: 285, quote: "Aorticopulmonary septum rotates and fuses with muscular ventricular septum to form membranous interventricular septum, closing interventricular foramen." }
    status: unverified
  - id: cvs.L01.011
    kind: card
    topic: heart-morphogenesis
    front: What is the most common congenital cardiac anomaly, and where does it usually occur?
    back: Ventricular septal defect, usually in the membranous septum.
    src: { page: 285, quote: "Ventricular septal defect—most common congenital cardiac anomaly, usually occurs in membranous septum." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.012
    kind: table
    topic: heart-morphogenesis
    title: Atrioventricular septal defect (endocardial cushion or AV canal defect)
    columns: [Type, Defects, VSD?]
    rows:
      - [Complete, Common AV valve with ASD and VSD, "Yes"]
      - [Partial, Primum ASD with cleft mitral valve → mitral regurgitation, "No"]
    blanks: [[0, 1], [1, 1], [1, 2]]
    src: { page: 285, quote: "Complete: common AV valve with ASD and VSD. Partial: primum ASD with cleft mitral valve → mitral regurgitation; no VSD. Associated with Down syndrome." }
    status: unverified
  - id: cvs.L01.013
    kind: mcq
    topic: heart-morphogenesis
    stem: >-
      A 2-month-old boy with upslanting palpebral fissures, a flat facial profile and a single palmar
      crease is evaluated for poor feeding and sweating during feeds. Examination shows a holosystolic
      murmur at the apex. Echocardiography shows a common atrioventricular valve with defects in both
      the atrial and the ventricular septa. Incomplete development of which embryonic structure caused
      this defect?
    options:
      - Neural crest-derived truncal ridges
      - Endocardial cushions
      - Septum secundum
      - Bulbus cordis
      - Left horn of the sinus venosus
    answer: 1
    why:
      - "Truncal ridge (neural crest) failure gives conotruncal defects: TGA, tetralogy of Fallot, persistent truncus."
      - "Right. Incomplete fusion of the endocardial cushions gives an AV septal defect; the complete form has a common AV valve with ASD and VSD, and it is associated with Down syndrome."
      - "A septum secundum defect gives a secundum ASD alone, with no AV valve or ventricular defect."
      - "Bulbus cordis becomes the smooth outflow parts of the ventricles; it doesn't form the AV valves."
      - "The left horn of the sinus venosus becomes the coronary sinus."
    src: { page: 285, quote: "incomplete fusion of endocardial cushions → defects in septa and AV valves. Complete: common AV valve with ASD and VSD." }
    status: unverified
  # ---------- p285: heart embryology (structure → derivative) ----------
  - id: cvs.L01.014
    kind: table
    topic: heart-embryology
    title: Heart embryology
    columns: [Embryonic structure, Gives rise to]
    rows:
      - [Right common/anterior cardinal veins, Superior vena cava (SVC)]
      - ["Posterior cardinal, subcardinal, and supracardinal veins", Inferior vena cava (IVC)]
      - [Right horn of sinus venosus, Smooth part of RA (sinus venarum)]
      - [Left horn of sinus venosus, Coronary sinus]
      - [Primitive pulmonary vein, Smooth part of LA]
      - [Primitive atrium, Trabeculated part of LA and RA]
      - [Endocardial cushion, "Atrial septum, membranous interventricular septum; AV and semilunar valves"]
      - [Primitive ventricle, Trabeculated part of LV and RV]
      - [Bulbus cordis, Smooth parts (outflow tract) of LV and RV]
      - [Truncus arteriosus, Ascending aorta and pulmonary trunk]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1]]
    src: { page: 285, quote: "Left horn of sinus venosus Coronary sinus Primitive pulmonary vein Smooth part of LA" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L01.015
    kind: card
    topic: heart-embryology
    front: The smooth part of the right atrium (sinus venarum) and the coronary sinus come from which embryonic structures?
    back: "Sinus venarum: right horn of the sinus venosus. Coronary sinus: left horn of the sinus venosus."
    src: { page: 285, quote: "Right horn of sinus venosus Smooth part of RA (sinus venarum) Left horn of sinus venosus Coronary sinus" }
    status: unverified
  - id: cvs.L01.016
    kind: card
    topic: heart-embryology
    front: Which embryonic structure gives the trabeculated parts of the ventricles, and which gives their smooth outflow parts?
    back: "Trabeculated LV and RV: primitive ventricle. Smooth outflow parts of LV and RV: bulbus cordis."
    src: { page: 285, quote: "Primitive ventricle Trabeculated part of LV and RV Bulbus cordis Smooth parts (outflow tract) of LV and RV" }
    status: unverified
