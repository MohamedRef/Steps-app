items:
  # ---------- p288: cardiac output variables ----------
  - id: cvs.L03.001
    kind: enumerate
    topic: cardiac-output-variables
    prompt: Enumerate the 3 variables that affect stroke volume, with the direction that raises SV.
    points:
      - ↑ Contractility (eg, anxiety, exercise)
      - ↑ Preload (eg, early pregnancy)
      - ↓ Afterload
    pass: 3
    hook: "الكتاب بيقولها SV CAP: Contractility و Afterload و Preload. الـ SV بيعلى لو الـ C والـ P علوا والـ A نزل."
    src: { page: 288, quote: "Stroke Volume affected by Contractility, Afterload, and Preload. ↑ SV with: ↑ Contractility (eg, anxiety, exercise) ↑ Preload (eg, early pregnancy) ↓ Afterload SV CAP." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.002
    kind: card
    topic: cardiac-output-variables
    front: What is stroke work, and what is it proportional to?
    back: The work done by the ventricle to eject the stroke volume. SW ∝ SV × MAP.
    src: { page: 288, quote: "Stroke work (SW) is work done by ventricle to eject SV. SW ∝ SV × MAP" }
    status: unverified
  - id: cvs.L03.003
    kind: order
    topic: cardiac-output-variables
    prompt: Put the steps by which β1 stimulation raises Ca2+ storage in the sarcoplasmic reticulum in order.
    steps:
      - Catecholamine binds the β1 receptor
      - Protein kinase A is activated
      - Phospholamban is phosphorylated
      - Ca2+ ATPase becomes active
      - Ca2+ storage in the sarcoplasmic reticulum rises
    src: { page: 288, quote: "Catecholamine stimulation via β1 receptor: Activated protein kinase A → phospholamban phosphorylation → active Ca2+ ATPase → ↑ Ca2+ storage in sarcoplasmic reticulum (SR)" }
    status: unverified
  - id: cvs.L03.004
    kind: card
    topic: cardiac-output-variables
    front: Besides phospholamban, how else does protein kinase A (from β1 stimulation) raise contractility?
    back: It phosphorylates Ca2+ channels → ↑ Ca2+ entry → ↑ Ca2+-induced Ca2+ release.
    src: { page: 288, quote: "Activated protein kinase A → Ca2+ channel phosphorylation → ↑ Ca2+ entry → ↑ Ca2+ -induced Ca2+ release" }
    status: unverified
  - id: cvs.L03.005
    kind: order
    topic: cardiac-output-variables
    prompt: Put the steps by which digoxin raises contractility in order.
    steps:
      - Digoxin blocks the Na+/K+ pump
      - Intracellular Na+ rises
      - Na+/Ca2+ exchanger activity falls
      - Intracellular Ca2+ rises
    src: { page: 288, quote: "Digoxin (blocks Na+ /K+ pump → ↑ intracellular Na+ → ↓ Na+ /Ca2+ exchanger activity → ↑ intracellular Ca2+ )" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.006
    kind: enumerate
    topic: cardiac-output-variables
    prompt: Enumerate the 5 things that decrease contractility (and SV).
    points:
      - β1-blockade (↓ cAMP)
      - Heart failure with systolic dysfunction
      - Acidosis
      - Hypoxia/hypercapnia (↓ Po2/↑ Pco2)
      - Nondihydropyridine Ca2+ channel blockers
    pass: 4
    hook: "القلب بيضعف من 2 أدوية (β1-blockade و non-DHP CCBs)، وقلب تعبان (HF with systolic dysfunction)، وجو وحش حواليه (acidosis و hypoxia/hypercapnia)."
    src: { page: 288, quote: "Contractility (and SV) ↓ with: β1-blockade (↓ cAMP) Heart failure (HF) with systolic dysfunction Acidosis Hypoxia/hypercapnia (↓ Po2/↑ Pco2) Nondihydropyridine Ca2+ channel blockers" }
    status: unverified
  - id: cvs.L03.007
    kind: card
    topic: cardiac-output-variables
    front: What approximates preload, and what does it depend on?
    back: It is estimated by the ventricle's end-diastolic volume (EDV), which is set by venous tone and blood volume, the two things that govern venous return.
    src: { page: 288, quote: "Preload approximated by ventricular end- diastolic volume (EDV); depends on venous tone and circulating blood volume, both of which affect venous return." }
    status: unverified
  - id: cvs.L03.123
    kind: card
    topic: cardiac-output-variables
    front: What happens to stroke volume in a failing heart, and what kinds of dysfunction cause it?
    back: Stroke volume falls, from systolic dysfunction, diastolic dysfunction, or both.
    src: { page: 288, quote: "A failing heart has ↓ SV (systolic and/or diastolic dysfunction)." }
    status: unverified
  - id: cvs.L03.124
    kind: card
    topic: cardiac-output-variables
    front: How does a rise in arterial pressure raise afterload?
    back: Higher pressure raises ventricular wall tension (by Laplace's law), and higher wall tension means higher afterload.
    src: { page: 288, quote: "↑ pressure → ↑ wall tension per Laplace's law → ↑ afterload." }
    status: unverified
  - id: cvs.L03.008
    kind: table
    topic: cardiac-output-variables
    title: Drugs that lower preload and afterload
    columns: [Drug, Preload, Afterload]
    rows:
      - ["Venous vasodilators (eg, nitroglycerin)", ↓, "-"]
      - ["Arterial vasodilators (eg, hydralazine)", "-", ↓]
      - [ACE inhibitors and ARBs, ↓, ↓]
    blanks: [[0, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 288, quote: "Arterial vasodilators (eg, hydralazine) ↓ afterload. ACE inhibitors and ARBs ↓ both preload and afterload." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.009
    kind: enumerate
    topic: cardiac-output-variables
    prompt: Enumerate the 4 things that increase myocardial O2 demand.
    points:
      - ↑ contractility
      - ↑ afterload (proportional to arterial pressure)
      - ↑ heart rate
      - ↑ diameter of ventricle (↑ wall tension)
    pass: 4
    hook: "القلب بيصرف أكسجين أكتر لما يشتغل أجمد (contractility)، ضد ضغط أعلى (afterload)، أسرع (HR)، وهو منفوخ (diameter)."
    src: { page: 288, quote: "Myocardial O2 demand is ↑ by: ↑ contractility ↑ afterload (proportional to arterial pressure) ↑ heart rate ↑ diameter of ventricle (↑ wall tension)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.010
    kind: card
    topic: cardiac-output-variables
    front: Which vessel contains the most deoxygenated blood in the body?
    back: The coronary sinus.
    src: { page: 288, quote: "Coronary sinus contains most deoxygenated blood in body." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.011
    kind: cloze
    topic: cardiac-output-variables
    text: "Laplace's law: wall tension = {{c1::pressure × radius}}; wall stress = {{c2::pressure × radius / (2 × wall thickness)}}."
    src: { page: 288, quote: "Wall tension follows Laplace’s law: Wall tension = pressure × radius Wall stress = pressure × radius 2 × wall thickness" }
    status: unverified
  - id: cvs.L03.012
    kind: card
    topic: cardiac-output-variables
    front: "What approximates afterload?"
    back: "Mean arterial pressure (MAP)."
    src: { page: 288, quote: "Afterload approximated by MAP." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.114
    kind: card
    topic: cardiac-output-variables
    front: "How does the LV compensate for a chronically raised afterload, and why?"
    back: "It thickens (hypertrophy), which lowers wall stress. So chronic hypertension (↑ MAP) leads to LV hypertrophy."
    src: { page: 288, quote: "LV compensates for ↑ afterload by thickening (hypertrophy) in order to ↓ wall stress." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.013
    kind: mcq
    topic: cardiac-output-variables
    stem: >-
      A 58-year-old man with atrial fibrillation and heart failure with reduced ejection fraction is
      started on a drug that increases the force of contraction. The drug binds the extracellular side of
      a membrane ATPase in cardiac myocytes. Which of the following is the most direct cause of the
      increased contractility?
    options:
      - Increased cAMP from β1-receptor activation in the myocyte membrane
      - Decreased Na+/Ca2+ exchanger activity, raising intracellular Ca2+
      - Phosphorylation of phospholamban by protein kinase A, freeing SERCA
      - Opening of HCN channels in the SA node, speeding phase 4 depolarization
      - Blockade of L-type Ca2+ channels, reducing Ca2+ entry in the plateau
    answer: 1
    why:
      - "That is how catecholamines (dobutamine) work, through PKA, not through an ATPase."
      - "Right. Digoxin blocks the Na+/K+ pump → ↑ intracellular Na+ → ↓ Na+/Ca2+ exchanger activity → ↑ intracellular Ca2+ → ↑ contractility."
      - "Phospholamban phosphorylation follows β1 stimulation and protein kinase A, not pump inhibition."
      - "HCN channels carry the funny current that sets the SA node rate; they don't change contractile force."
      - "L-type Ca2+ channel blockade (nondihydropyridines) ↓ contractility."
    src: { page: 288, quote: "Digoxin (blocks Na+ /K+ pump → ↑ intracellular Na+ → ↓ Na+ /Ca2+ exchanger activity → ↑ intracellular Ca2+ )" }
    status: unverified
  - id: cvs.L03.014
    kind: mcq
    topic: cardiac-output-variables
    stem: >-
      A 62-year-old woman has had poorly controlled hypertension for 20 years. Echocardiography shows
      concentric thickening of the left ventricular wall with a normal cavity size. Which of the following
      best explains why the wall thickened?
    options:
      - To increase preload and stroke volume
      - To reduce wall stress against a raised afterload
      - To increase the radius of the ventricle
      - To lower myocardial O2 demand by slowing the heart rate
      - To raise ventricular compliance
    answer: 1
    why:
      - "Hypertrophy doesn't raise preload; it makes the ventricle stiffer and fill less well."
      - "Right. Afterload is approximated by MAP; per Laplace, wall stress = pressure × radius / (2 × wall thickness), so a thicker wall lowers the stress."
      - "Concentric hypertrophy doesn't enlarge the radius; a larger radius would raise wall stress."
      - "Wall thickness doesn't set heart rate."
      - "A thick wall is less compliant, not more."
    src: { page: 288, quote: "LV compensates for ↑ afterload by thickening (hypertrophy) in order to ↓ wall stress." }
    status: unverified
  # ---------- p289: cardiac output equations ----------
  - id: cvs.L03.015
    kind: cloze
    topic: cardiac-output-equations
    text: "Stroke volume = {{c1::EDV − ESV}} (ESV = end-systolic volume)."
    src: { page: 289, quote: "Stroke volume SV = EDV − ESV ESV = end-systolic volume." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.130
    kind: cloze
    topic: cardiac-output-equations
    text: "Ejection fraction = {{c1::SV / EDV}}, which is (EDV − ESV) / EDV."
    src: { page: 289, quote: "Ejection fraction EF = SV = EDV − ESV EDV EDV" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.131
    kind: cloze
    topic: cardiac-output-equations
    text: "A normal ejection fraction is {{c1::50%-70%}}."
    src: { page: 289, quote: "EF is an index of ventricular contractility (↓ in systolic HF; usually normal in diastolic HF). Normal EF is 50%-70%." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.016
    kind: card
    topic: cardiac-output-equations
    front: What does ejection fraction index, and how does it behave in systolic vs diastolic HF?
    back: Ventricular contractility. It is ↓ in systolic HF and usually normal in diastolic HF.
    src: { page: 289, quote: "EF is an index of ventricular contractility (↓ in systolic HF; usually normal in diastolic HF). Normal EF is 50%-70%." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.017
    kind: card
    topic: cardiac-output-equations
    front: "Fick principle: how is cardiac output calculated?"
    back: CO = rate of O2 consumption / (arterial O2 content − venous O2 content). (Also CO = SV × HR.)
    src: { page: 289, quote: "Fick principle: CO = rate of O2 consumption (arterial O2 content – venous O2 content)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.018
    kind: card
    topic: cardiac-output-equations
    front: How is cardiac output maintained in early vs late exercise?
    back: "Early: ↑ HR and ↑ SV. Late: ↑ HR only (SV plateaus)."
    src: { page: 289, quote: "In early stages of exercise, CO maintained by ↑ HR and ↑ SV. In later stages, CO maintained by ↑ HR only (SV plateaus)." }
    status: unverified
  - id: cvs.L03.019
    kind: card
    topic: cardiac-output-equations
    front: Why does a very fast heart rate (eg, ventricular tachycardia) lower cardiac output?
    back: Diastole is shortened → ↓ diastolic filling time → ↓ SV → ↓ CO.
    src: { page: 289, quote: "Diastole is shortened with ↑↑ HR (eg, ventricular tachycardia) → ↓ diastolic filling time → ↓ SV → ↓ CO." }
    status: unverified
  - id: cvs.L03.020
    kind: card
    topic: cardiac-output-equations
    front: Pulse pressure is directly proportional to what, and inversely proportional to what?
    back: Directly proportional to stroke volume; inversely proportional to arterial compliance. (PP = SBP − DBP.)
    src: { page: 289, quote: "PP directly proportional to SV and inversely proportional to arterial compliance." }
    status: unverified
  - id: cvs.L03.021
    kind: table
    topic: cardiac-output-equations
    title: Causes of a wide and a narrow pulse pressure
    columns: [Pulse pressure, Causes]
    rows:
      - ["↑ PP", "Aortic regurgitation, aortic stiffening (isolated systolic hypertension in older adults), obstructive sleep apnea (↑ sympathetic tone), high-output state (eg, anemia, hyperthyroidism), exercise (transient)"]
      - ["↓ PP", "Aortic stenosis, cardiogenic shock, cardiac tamponade, advanced HF"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 289, quote: "↑ PP in aortic regurgitation, aortic stiffening (isolated systolic hypertension in older adults), obstructive sleep apnea (↑ sympathetic tone), high-output state (eg, anemia, hyperthyroidism), exercise (transient). ↓ PP in aortic stenosis, cardiogenic shock, cardiac tamponade, advanced HF." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.022
    kind: cloze
    topic: cardiac-output-equations
    text: "MAP = {{c1::CO × TPR}}; at resting HR, MAP = {{c2::2/3 DBP + 1/3 SBP}} = {{c3::DBP + 1/3 PP}}."
    src: { page: 289, quote: "MAP = CO × total peripheral resistance (TPR) MAP (at resting HR) = 2/3 DBP + 1/3 SBP = DBP + 1/3 PP." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.023
    kind: card
    topic: cardiac-output-equations
    front: "A patient consumes 250 mL O2/min; arterial O2 content is 20 mL/100 mL and mixed venous O2 content is 15 mL/100 mL. What is the cardiac output (Fick principle)?"
    back: "CO = 250 mL/min ÷ (5 mL O2 per 100 mL blood) = 250 ÷ 0.05 = 5000 mL/min = 5 L/min."
    src: { page: 289, quote: "Fick principle: CO = rate of O2 consumption (arterial O2 content – venous O2 content)" }
    status: unverified
  - id: cvs.L03.024
    kind: mcq
    topic: cardiac-output-equations
    stem: >-
      A 34-year-old woman comes to the clinic because of palpitations, heat intolerance and a 6-kg weight
      loss over 3 months. Her pulse is 112/min and blood pressure is 150/50 mm Hg. She has a fine tremor
      and a diffusely enlarged, nontender thyroid gland. Which of the following best explains her blood
      pressure pattern?
    options:
      - Decreased arterial compliance from atherosclerosis
      - A high-output state increasing stroke volume
      - Reduced stroke volume from impaired filling
      - Increased total peripheral resistance
      - Restricted ventricular filling from pericardial fluid
    answer: 1
    why:
      - "Aortic stiffening widens pulse pressure in older adults, not in a 34-year-old with thyrotoxicosis."
      - "Right. Hyperthyroidism is a high-output state; pulse pressure is directly proportional to SV, so PP widens (150 − 50 = 100 mm Hg)."
      - "A lower SV narrows pulse pressure."
      - "High TPR would raise diastolic pressure; hers is low."
      - "Tamponade narrows pulse pressure."
    src: { page: 289, quote: "high-output state (eg, anemia, hyperthyroidism), exercise (transient)" }
    status: unverified
  # ---------- p289: Starling curves ----------
  - id: cvs.L03.025
    kind: card
    topic: starling-curves
    front: "Frank-Starling: force of contraction is proportional to what?"
    back: The end-diastolic length of the cardiac muscle fiber (preload).
    src: { page: 289, quote: "Force of contraction is proportional to end- diastolic length of cardiac muscle fiber (preload)." }
    status: unverified
  - id: cvs.L03.026
    kind: table
    topic: starling-curves
    title: What shifts the Starling curve
    columns: [Contractility, Causes]
    rows:
      - ["↑ (curve up)", "Catecholamines, positive inotropes (eg, dobutamine, milrinone, digoxin)"]
      - ["↓ (curve down)", "Loss of functional myocardium (eg, MI), β-blockers (acutely), nondihydropyridine Ca2+ channel blockers, HF"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 289, quote: "↓ contractility with loss of functional myocardium (eg, MI), β-blockers (acutely), nondihydropyridine Ca2+ channel blockers, HF." }
    status: unverified
  - id: cvs.L03.145
    kind: card
    topic: starling-curves
    front: In the book's Starling curve drawing (stroke volume vs ventricular EDV), how do heart failure, a positive inotrope and exercise appear?
    back: "Heart failure lies on a lower curve (less SV at any EDV); heart failure + a positive inotrope shifts it back up toward normal. On the normal curve, rest → walking → running moves up and to the right (more EDV, more SV)."
    src: { page: 289, quote: "Normal (rest) Heart failure + positive inotrope Heart failure Stroke volume (CO) Ventricular EDV (preload) Running Walking Rest Myocardial contractility" }
    status: unverified
  - id: cvs.L03.027
    kind: mcq
    topic: starling-curves
    stem: >-
      A 67-year-old man in the coronary care unit has cardiogenic shock 2 days after an extensive
      anterior myocardial infarction. A drug is infused that inhibits phosphodiesterase-3 in cardiac
      myocytes. On a plot of stroke volume against end-diastolic volume, which change does this drug
      produce?
    options:
      - Movement to the right along the same curve
      - Movement to the left along the same curve
      - Shift of the curve upward
      - Shift of the curve downward
      - No change in the curve
    answer: 2
    why:
      - "Moving along the same curve is a change in preload, not contractility."
      - "Moving left along the curve is a fall in preload (eg, nitrates, diuretics)."
      - "Right. Milrinone is a positive inotrope; ↑ contractility shifts the Starling curve up (more SV at the same EDV)."
      - "A downward shift is ↓ contractility: the MI itself, β-blockers, nondihydropyridine CCBs."
      - "An inotrope changes contractility, so the curve moves."
    src: { page: 289, quote: "↑ contractility with catecholamines, positive inotropes (eg, dobutamine, milrinone, digoxin)." }
    status: unverified
  # ---------- p290: resistance, pressure, flow ----------
  - id: cvs.L03.028
    kind: cloze
    topic: resistance-pressure-flow
    text: "Resistance = driving pressure / flow = {{c1::8η × length / πr4}}, so resistance is proportional to {{c2::1/r4}}."
    src: { page: 290, quote: "Resistance (R) = driving pressure (ΔP) = 8η (viscosity) × length πr4" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.029
    kind: card
    topic: resistance-pressure-flow
    front: How do resistances add in series and in parallel?
    back: "Series: RT = R1 + R2 + R3 … Parallel: 1/RT = 1/R1 + 1/R2 + 1/R3 …"
    src: { page: 290, quote: "Total resistance of vessels in series: RT = R1 + R2 + R3" }
    status: unverified
  - id: cvs.L03.030
    kind: card
    topic: resistance-pressure-flow
    front: Which vessels have the highest total cross-sectional area and the lowest flow velocity?
    back: Capillaries.
    src: { page: 290, quote: "Capillaries have highest total cross-sectional area and lowest flow velocity." }
    status: unverified
  - id: cvs.L03.031
    kind: card
    topic: resistance-pressure-flow
    front: Which vessels account for most of TPR, and which provide most of the blood storage capacity?
    back: "Arterioles: most of TPR. Veins: most of the storage capacity."
    src: { page: 290, quote: "Arterioles account for most of TPR. Veins provide most of blood storage capacity." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.032
    kind: card
    topic: resistance-pressure-flow
    front: What does blood viscosity mostly depend on, and when does it rise or fall?
    back: "Mostly on hematocrit. ↑ in hyperproteinemic states (eg, multiple myeloma) and polycythemia; ↓ in anemia."
    src: { page: 290, quote: "Viscosity depends mostly on hematocrit. Viscosity ↑ in hyperproteinemic states (eg, multiple myeloma), polycythemia. Viscosity ↓ in anemia." }
    status: unverified
  - id: cvs.L03.033
    kind: mcq
    topic: resistance-pressure-flow
    stem: >-
      A 55-year-old man has claudication of the right calf. Angiography shows that the radius of the
      right superficial femoral artery is reduced to half of normal over a short segment. If pressure,
      viscosity and length stay the same, how does the resistance of that segment change?
    options:
      - It doubles
      - It increases 4-fold
      - It increases 8-fold
      - It increases 16-fold
      - It halves
    answer: 3
    why:
      - "That would be true if resistance varied with 1/r."
      - "That would be true if resistance varied with 1/r²."
      - "That would be true if resistance varied with 1/r³ (2³ = 8)."
      - "Right. R = 8ηl/πr4, so R ∝ 1/r4: halving r raises R by 2^4 = 16."
      - "A narrower vessel has more resistance, not less."
    src: { page: 290, quote: "∝ r4 R ∝ 1/r4" }
    status: unverified
  # ---------- p290: cardiac and vascular function curves ----------
  - id: cvs.L03.110
    kind: cloze
    topic: resistance-pressure-flow
    text: "Volumetric flow rate Q = {{c1::flow velocity (v) × cross-sectional area (A)}}."
    src: { page: 290, quote: "Volumetric flow rate ( ) = flow velocity (v) × cross-sectional area (A)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.132
    kind: cloze
    topic: resistance-pressure-flow
    text: "ΔP = {{c1::Q × R}}, which is analogous to {{c2::Ohm's law}} for electrical circuits (V = I × R)."
    src: { page: 290, quote: "∆P = × R is analogous to Ohm’s Law for electrical circuits (V = I × R)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.133
    kind: cloze
    topic: resistance-pressure-flow
    text: "Flow is proportional to {{c1::r⁴}}, so resistance is proportional to {{c2::1/r⁴}}."
    src: { page: 290, quote: "∝ r4 R ∝ 1/r4" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L03.125
    kind: card
    topic: resistance-pressure-flow
    front: Which way does a pressure gradient drive blood flow?
    back: From the region of higher pressure toward the region of lower pressure.
    src: { page: 290, quote: "Pressure gradient drives flow from high pressure to low pressure." }
    status: unverified
  - id: cvs.L03.034
    kind: card
    topic: cardiac-vascular-function-curves
    front: What does the intersection of the cardiac function curve and the vascular function curve represent?
    back: The operating point of the heart, where venous return and CO are equal (the circulation is a closed system).
    src: { page: 290, quote: "Intersection of curves = operating point of heart (ie, venous return and CO are equal, as circulatory system is a closed system)." }
    status: unverified
  - id: cvs.L03.035
    kind: table
    topic: cardiac-vascular-function-curves
    title: Cardiac and vascular function curves
    columns: [Change, Effect, Increased by, Decreased by]
    rows:
      - [Inotropy, "Contractility → SV → CO/venous return and RAP", "Catecholamines, dobutamine, digoxin, exercise", "HF with reduced EF, narcotic overdose, sympathetic inhibition"]
