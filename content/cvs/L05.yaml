  # ---------- p321: DVT ----------
  - id: cvs.L05.001
    kind: enumerate
    topic: deep-venous-thrombosis
    prompt: Enumerate the Virchow triad (SHE) that predisposes to DVT, with examples.
    points:
      - Stasis (post-op, long drive/flight)
      - Hypercoagulability (factor V Leiden, oral contraceptives, pregnancy)
      - Endothelial damage (exposed collagen triggers the clotting cascade)
    pass: 3
    hook: "الكتاب بيقولها SHE: الدم واقف، والدم بيتجلط بسهولة، والحيطة متعورة."
    src: { page: 321, quote: "Predisposed by Virchow triad (SHE): Stasis (eg, post-op, long drive/flight) Hypercoagulability (eg, defect in coagulation cascade proteins, such as factor V Leiden; oral contraceptive use; pregnancy) Endothelial damage (exposed collagen triggers clotting cascade)" }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.002
    kind: card
    topic: deep-venous-thrombosis
    front: Which DVTs are most likely to cause PE?
    back: Proximal veins (femoral, iliac, popliteal). Distal calf DVTs are less likely to embolize and often resolve spontaneously.
    src: { page: 321, quote: "DVT → PE risk highest in proximal veins (femoral, iliac, popliteal). Distal calf DVT less likely to embolize; often resolve spontaneously." }
    status: unverified
  - id: cvs.L05.003
    kind: card
    topic: deep-venous-thrombosis
    front: When is D-dimer useful in suspected DVT, and what is the imaging test of choice?
    back: D-dimer can rule out DVT when probability is low or moderate (high sensitivity, low specificity). Imaging of choice is compression ultrasound with Doppler.
    src: { page: 321, quote: "D-dimer test may be used clinically to rule out DVT if disease probability is low or moderate (high sensitivity, low specificity). Imaging test of choice is compression ultrasound with Doppler." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.004
    kind: card
    topic: deep-venous-thrombosis
    front: Which anticoagulants are used for DVT prophylaxis and acute management, and which for long-term prevention?
    back: Unfractionated heparin or LMWH (eg, enoxaparin) for prophylaxis and acute management; direct anticoagulants (eg, rivaroxaban, apixaban) for treatment and long-term prevention.
    src: { page: 321, quote: "Use unfractionated heparin or low-molecular weight heparins (eg, enoxaparin) for prophylaxis and acute management. Use direct anticoagulants (eg, rivaroxaban, apixaban) for treatment and long-term prevention." }
    status: unverified
  - id: cvs.L05.005
    kind: mcq
    topic: deep-venous-thrombosis
    stem: >-
      A 31-year-old woman taking combined oral contraceptives has had a swollen, tender left calf for 2 days
      after a 12-hour flight. Her clinical probability of DVT is moderate. Which of the following is the
      best use of a D-dimer test in her evaluation?
    options:
      - A positive result confirms DVT
      - A negative result helps rule out DVT
      - It identifies the location of the clot
      - It replaces ultrasonography in all patients
      - It distinguishes proximal from distal DVT
    answer: 1
    why:
      - "D-dimer has low specificity; a positive result doesn't confirm DVT."
      - "Right. D-dimer is highly sensitive, so a negative result rules out DVT when probability is low or moderate; compression ultrasound with Doppler is the imaging test of choice."
      - "D-dimer gives no location."
      - "Ultrasound remains the imaging test of choice."
      - "Location needs imaging."
    src: { page: 321, quote: "D-dimer test may be used clinically to rule out DVT if disease probability is low or moderate (high sensitivity, low specificity)." }
    status: unverified
  # ---------- p321: hypertension treatment ----------
  - id: cvs.L05.006
    kind: table
    topic: hypertension-treatment
    title: Hypertension treatment by setting
    columns: [Setting, Drugs, Notes]
    rows:
      - [Primary (essential), "Thiazides, ACE inhibitors, ARBs, Ca2+ channel blockers", ""]
      - [With heart failure, "ACE inhibitors/ARBs, β-blockers (compensated HF), aldosterone antagonists, diuretics", "β-blockers cautiously in decompensated HF; contraindicated in cardiogenic shock"]
      - [With diabetes, "ACE inhibitors/ARBs, Ca2+ channel blockers, thiazides, β-blockers", "ACEi/ARBs protect against diabetic nephropathy; β-blockers mask hypoglycemia"]
      - [With asthma, "ARBs, Ca2+ channel blockers, thiazides, cardioselective β-blockers", "Avoid nonselective β-blockers and ACE inhibitors (cough)"]
      - [With pregnancy, "Hydralazine, methyldopa, labetalol, nifedipine", "\"Hypertensive moms love nifedipine\""]
      - [With gout, "ACE inhibitors, Ca2+ channel blockers, ARBs (especially losartan)", Avoid loop and thiazide diuretics]
      - [With osteoporosis, "Thiazides (± ACEi or ARB)", Thiazides ↑ Ca2+ reabsorption]
      - [With pheochromocytoma, "Phentolamine, phenoxybenzamine (α-blockade first), then β-blockade", Avoid β-blockade first (unopposed α crisis)]
    blanks: [[0, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1]]
    src: { page: 321, quote: "Hypertension with pregnancy Hydralazine, methyldopa, labetalol, nifedipine. Hypertensive moms love nifedipine." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.007
    kind: card
    topic: hypertension-treatment
    front: Why avoid ACE inhibitors and nonselective β-blockers in a patient with hypertension and asthma?
    back: Nonselective β-blockers cause β2-mediated bronchoconstriction; ACE inhibitors cause a cough that can be confused with asthma.
    src: { page: 321, quote: "Avoid non-selective β-blockers to prevent β2- receptor–induced bronchoconstriction. Avoid ACE inhibitors to prevent confusion between drug- or asthma-related cough." }
    status: unverified
  - id: cvs.L05.008
    kind: card
    topic: hypertension-treatment
    front: In pheochromocytoma, which blockade must come first, and why?
    back: α-blockade first (phentolamine, phenoxybenzamine) before resection and β-blockade; β-blockade first leaves α effects unopposed → hypertensive crisis.
    src: { page: 321, quote: "Phentolamine, phenoxybenzamine (α-blockade first) prior to resection and β-blockade. Avoid β-blockade first to mitigate unopposed α-mediated hypertensive crisis." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.009
    kind: mcq
    topic: hypertension-treatment
    stem: >-
      A 58-year-old man with hypertension has had two attacks of a hot, swollen first metatarsophalangeal
      joint this year. His blood pressure is 152/94 mm Hg on hydrochlorothiazide. Which change is most
      appropriate?
    options:
      - Add furosemide
      - Replace hydrochlorothiazide with losartan
      - Increase hydrochlorothiazide
      - Add propranolol
      - Add chlorthalidone
    answer: 1
    why:
      - "Loop diuretics also cause gout flares."
      - "Right. In hypertension with gout, avoid loop and thiazide diuretics; use ACE inhibitors, CCBs or ARBs, especially losartan."
      - "More thiazide means more gout flares."
      - "Propranolol isn't the preferred agent here."
      - "Chlorthalidone is a thiazide-like diuretic and also triggers gout."
    src: { page: 321, quote: "ACE inhibitors, channel blockers, ARBs (especially losartan). Ca2+ Avoid loop and thiazide diuretics as these can cause gout flares." }
    status: unverified
  # ---------- p322: nitrates ----------
  - id: cvs.L05.010
    kind: card
    topic: nitrates
    front: How do nitrates work, and do they dilate veins or arteries more?
    back: '↑ NO in vascular smooth muscle → ↑ cGMP → smooth muscle relaxation. Veins >> arteries → ↓ preload. Examples: nitroglycerin, isosorbide dinitrate, isosorbide mononitrate.'
    src: { page: 322, quote: "Nitrates Nitroglycerin, isosorbide dinitrate, isosorbide mononitrate. MECHANISM Vasodilate by NO in vascular smooth muscle in cGMP and smooth muscle relaxation. Dilate veins >> arteries. preload." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.011
    kind: card
    topic: nitrates
    front: What are the uses and adverse effects of nitrates?
    back: "Uses: angina, ACS, pulmonary edema. Adverse: reflex tachycardia (treat with β-blockers), methemoglobinemia, hypotension, flushing, headache, \"Monday disease\"."
    src: { page: 322, quote: "Angina, ACS, pulmonary edema. AdvERSE EFFECTS Reflex tachycardia (treat with β-blockers), methemoglobinemia, hypotension, flushing, headache," }
    status: unverified
  - id: cvs.L05.012
    kind: card
    topic: nitrates
    front: What is "Monday disease"?
    back: In industrial nitrate exposure, tolerance develops over the work week and is lost over the weekend → tachycardia, dizziness and headache on reexposure (Monday).
    src: { page: 322, quote: "“Monday disease” in industrial nitrate exposure: development of tolerance for the vasodilating action during the work week and loss of tolerance over the weekend tachycardia, dizziness, headache upon reexposure." }
    status: unverified
  - id: cvs.L05.013
    kind: enumerate
    topic: nitrates
    prompt: Enumerate the 3 contraindications to nitrates.
    points:
      - Right ventricular infarction
      - Hypertrophic cardiomyopathy
      - Concurrent PDE-5 inhibitor use
    pass: 3
    hook: "التلاتة محتاجين preload: الـ RV infarct، والـ HCM، والـ sildenafil هيوقّع الضغط معاه."
    src: { page: 322, quote: "Contraindicated in right ventricular infarction, hypertrophic cardiomyopathy, and with concurrent PDE-5 inhibitor use." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.014
    kind: mcq
    topic: nitrates
    stem: >-
      A 61-year-old man is brought to the emergency department with chest pain that began 30 minutes after
      sexual activity. He took a drug for erectile dysfunction 2 hours ago. ECG shows ST depression in
      V4-V6. Which drug should be avoided?
    options:
      - Aspirin
      - Nitroglycerin
      - Metoprolol
      - Heparin
      - Atorvastatin
