    topic: calcium-channel-blockers
    text: "CCB potency on vascular smooth muscle: {{c1::amlodipine = nifedipine > diltiazem > verapamil}}; on the heart: {{c2::verapamil > diltiazem > amlodipine = nifedipine}}."
    src: { page: 323, quote: "Vascular smooth muscle—amlodipine = nifedipine > diltiazem > verapamil. Heart—verapamil > diltiazem > amlodipine = nifedipine." }
