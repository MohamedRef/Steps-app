    back: "Dihydropyridines (amlodipine, clevidipine, nicardipine, nifedipine, nimodipine): vascular smooth muscle. Nondihydropyridines (diltiazem, verapamil): heart."
    src: { page: 323, quote: "Amlodipine, clevidipine, nicardipine, nifedipine, nimodipine (dihydropyridines, act on vascular smooth muscle); diltiazem, verapamil (nondihydropyridines, act on heart)." }
    status: unverified
    tags: [high-yield]
