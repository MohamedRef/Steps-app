  - id: cvs.L05.029
    kind: mcq
    topic: antianginal-therapy
    stem: >-
      A 63-year-old man with stable angina uses sublingual nitroglycerin, but each dose gives him a pounding
      heartbeat. His physician adds metoprolol. Which of the following best explains why the combination is
      better than either drug alone?
    options:
      - Metoprolol increases preload, which nitroglycerin cannot do
      - Metoprolol blocks the reflex tachycardia and ↑ contractility from nitrates, while nitrates offset the ↑ EDV from β-blockade
      - Both drugs raise the ejection time
      - Both drugs raise coronary perfusion pressure
      - Nitroglycerin blocks the β1 receptor
    answer: 1
    why:
      - "Raising preload would raise O2 demand."
      - "Right. Nitrates cause reflex ↑ HR and contractility; β-blockers block that. β-blockers can ↑ EDV and ejection time; nitrates offset that. Together MVO2 falls most (↓↓)."
      - "Nitrates shorten ejection time."
      - "Both lower BP."
      - "Nitrates act through NO and cGMP."
    src: { page: 322, quote: "Reflex tachycardia (treat with β-blockers)" }
    status: unverified
  # ---------- p324: ranolazine ----------
  - id: cvs.L05.030
    kind: card
    topic: ranolazine
    front: How does ranolazine work, and what does it do to HR and BP?
    back: It inhibits the late phase of the inward Na+ current, which lowers diastolic wall tension and O2 consumption. It does not change heart rate or blood pressure.
    src: { page: 324, quote: "Inhibits the late phase of inward sodium current thereby reducing diastolic wall tension and oxygen consumption. Does not affect heart rate or blood pressure." }
    status: unverified
    tags: [high-yield]
