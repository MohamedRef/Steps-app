      - "Aspirin is part of ACS treatment."
      - "Right. Nitrates are contraindicated with concurrent PDE-5 inhibitor use: both raise cGMP and together cause profound hypotension."
      - "β-blockers are part of ACS treatment."
      - "Anticoagulation is part of ACS treatment."
      - "Statins are part of ACS treatment."
    src: { page: 322, quote: "Contraindicated in right ventricular infarction, hypertrophic cardiomyopathy, and with concurrent PDE-5 inhibitor use." }
    status: unverified
  # ---------- p323: CCBs ----------
