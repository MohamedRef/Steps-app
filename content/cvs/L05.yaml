  # ---------- p323: hydralazine ----------
  - id: cvs.L05.020
    kind: card
    topic: hydralazine
    front: How does hydralazine work, and what does it dilate?
    back: ↑ cGMP → smooth muscle relaxation. Arterioles > veins → afterload reduction.
    src: { page: 323, quote: "↑ cGMP → smooth muscle relaxation. Hydralazine vasodilates arterioles > veins; afterload reduction." }
    status: unverified
  - id: cvs.L05.021
    kind: card
    topic: hydralazine
    front: What are the uses and adverse effects of hydralazine?
    back: "Uses: severe (especially acute) hypertension, HF (with organic nitrate); safe in pregnancy; given with a β-blocker to prevent reflex tachycardia. Adverse: compensatory tachycardia (contraindicated in angina/CAD), fluid retention, headache, angina, drug-induced lupus."
    src: { page: 323, quote: "Compensatory tachycardia (contraindicated in angina/CAD), fluid retention, headache, angina, drug-induced lupus." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.022
    kind: mcq
    topic: hydralazine
    stem: >-
