    status: unverified
  # ---------- p323: hypertensive emergency ----------
  - id: cvs.L05.023
    kind: card
    topic: hypertensive-emergency
    front: Which drugs treat a hypertensive emergency?
    back: Labetalol, clevidipine, fenoldopam, nicardipine, nitroprusside.
    src: { page: 323, quote: "Treat with labetalol, clevidipine, fenoldopam, nicardipine, nitroprusside." }
    status: unverified
  - id: cvs.L05.024
    kind: card
    topic: hypertensive-emergency
    front: How does nitroprusside work, and what toxicity can it cause?
    back: A short-acting vasodilator (arteries = veins) through direct release of NO (↑ cGMP). It can cause cyanide toxicity.
    src: { page: 323, quote: "Short acting vasodilator (arteries = veins); via direct release of NO. Can cause cyanide toxicity (releases cyanide)." }
    status: unverified
    tags: [high-yield]
  - id: cvs.L05.025
    kind: card
    topic: hypertensive-emergency
    front: What is fenoldopam, and what does it do?
    back: 'A dopamine D1 receptor agonist → coronary, peripheral, renal and splanchnic vasodilation; ↓ BP and ↑ natriuresis. Also used postoperatively. Adverse effects: hypotension, tachycardia, flushing, headache, nausea.'
    src: { page: 323, quote: "Dopamine D1 receptor agonist—coronary, peripheral, renal, and splanchnic vasodilation. ↓ BP, ↑ natriuresis." }
    status: unverified
  - id: cvs.L05.026
    kind: mcq
    topic: hypertensive-emergency
    stem: >-
      A 50-year-old man with hypertensive encephalopathy is treated with a continuous infusion of a drug
      that releases nitric oxide directly. On day 3 he becomes confused, with a lactic acidosis and bright
      red venous blood. Which toxicity is most likely?
    options:
      - Methemoglobinemia
      - Cyanide toxicity
      - Hyperkalemia
      - Drug-induced lupus
      - Thiocyanate-induced hypothyroidism alone
    answer: 1
    why:
      - "Methemoglobinemia causes chocolate-colored blood and cyanosis, classically with nitrates."
      - "Right. Nitroprusside releases cyanide; cyanide blocks oxygen use, causing lactic acidosis and highly oxygenated venous blood."
      - "Hyperkalemia isn't a nitroprusside effect named here."
      - "Lupus is a hydralazine effect."
      - "That isn't the acute picture described."
    src: { page: 323, quote: "Can cause cyanide toxicity (releases cyanide)." }
    status: unverified
  # ---------- p323: antianginal therapy ----------
  - id: cvs.L05.027
    kind: card
    topic: antianginal-therapy
    front: What is the goal of antianginal therapy, and what determines MVO2?
    back: Reduce myocardial O2 consumption (MVO2) by lowering 1 or more of its determinants, end-diastolic volume, BP, HR and contractility.
    src: { page: 323, quote: "Goal is reduction of myocardial O2 consumption (MVO2) by 1 or more of the determinants of MVO2: end-diastolic volume, BP, HR, contractility." }
    status: unverified
