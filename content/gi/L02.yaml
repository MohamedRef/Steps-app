items:
  # ---------- p367: pancreas and spleen embryology ----------
  - id: gi.L02.001
    kind: card
    topic: pancreas-spleen-embryology
    front: Which pancreatic bud forms the uncinate process?
    back: The ventral pancreatic bud.
    src: { page: 367, quote: "Pancreas—derived from foregut. Ventral pancreatic bud contributes to uncinate process. Both ventral and dorsal buds contribute to pancreatic head and main pancreatic duct." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.002
    kind: card
    topic: pancreas-spleen-embryology
    front: What is annular pancreas, and what is it associated with?
    back: Abnormal rotation of the ventral pancreatic bud forms a ring of pancreatic tissue around the 2nd part of the duodenum, which may narrow it and cause vomiting. Associated with Down syndrome.
    src: { page: 367, quote: "Annular pancreas—abnormal rotation of ventral pancreatic bud forms a ring of pancreatic tissue → encircles 2nd part of duodenum; may cause duodenal narrowing (arrows in A ) and vomiting. Associated with Down syndrome." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.003
    kind: cloze
    topic: pancreas-spleen-embryology
    text: In pancreas divisum the ventral and dorsal ducts fail to fuse at {{c1::7}} weeks, so the dorsal duct drains through the {{c2::minor}} papilla (dominant) and the ventral duct through the {{c3::major}} papilla.
    src: { page: 367, quote: "Pancreas divisum—ventral and dorsal ducts fail to fuse at 7 weeks of development → separate dorsal (→ minor papilla, dominant) and ventral (→ major papilla) drainage." }
    status: unverified
  - id: gi.L02.004
    kind: card
    topic: pancreas-spleen-embryology
    front: Pancreas divisum is common. What can it cause?
    back: It is mostly asymptomatic, but it may cause chronic abdominal pain and/or pancreatitis.
    src: { page: 367, quote: "Pancreas divisum—ventral and dorsal ducts fail to fuse at 7 weeks of development → separate dorsal (→ minor papilla, dominant) and ventral (→ major papilla) drainage. Common anomaly; mostly asymptomatic, but may cause chronic abdominal pain and/or pancreatitis." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.005
    kind: card
    topic: pancreas-spleen-embryology
    front: Where does the spleen arise in development, and so what germ layer is it from?
    back: In the mesentery of the stomach (dorsal mesogastrium), so it is mesodermal.
    src: { page: 367, quote: "Spleen—arises in mesentery of the stomach (dorsal mesogastrium, hence, mesodermal), but has foregut supply (celiac trunk → splenic artery)." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.006
    kind: mcq
    topic: pancreas-spleen-embryology
    stem: >-
      A 2-day-old boy with trisomy 21 has repeated vomiting after feeds. Abdominal x-ray shows a dilated
      stomach and proximal duodenum. At surgery, the duodenum is patent but a band of tissue completely
      encircles its second part. Abnormal development of which structure is the most likely cause?
    options:
      - Ventral pancreatic bud
      - Dorsal pancreatic bud
      - Dorsal mesogastrium
      - Vitelline duct
      - Pyloric sphincter
    answer: 0
    why:
      - "Right. Abnormal rotation of the ventral bud leaves a ring of pancreas around the 2nd part of the duodenum (annular pancreas), associated with Down syndrome."
      - "The dorsal bud forms most of the pancreas; its failure to fuse with the ventral duct gives pancreas divisum, not a ring."
      - "The dorsal mesogastrium gives rise to the spleen."
      - "A persistent vitelline duct gives a Meckel diverticulum in the ileum."
      - "Pyloric hypertrophy gives an olive mass and nonbilious vomiting at 2-6 weeks, proximal to the duodenum."
    src: { page: 367, quote: "Annular pancreas—abnormal rotation of ventral pancreatic bud forms a ring of pancreatic tissue → encircles 2nd part of duodenum" }
    status: unverified
  # ---------- p367: retroperitoneal structures ----------
  - id: gi.L02.007
    kind: enumerate
    topic: retroperitoneal-structures
    prompt: Enumerate the retroperitoneal structures (SAD PUCKER, 9).
    points:
      - Suprarenal (adrenal) glands
      - Aorta and IVC
      - Duodenum (2nd through 4th parts)
      - Pancreas (except tail)
      - Ureters
      - Colon (descending and ascending)
      - Kidneys
      - Esophagus
      - Rectum (partially)
    pass: 7
    hook: "SAD PUCKER هي تحشيشة الكتاب نفسه: حرف لكل عضو، وافتكر الاستثناءين: الـ duodenum من غير أول جزء، والـ pancreas من غير الذيل."
    src: { page: 367, quote: "SAD PUCKER: Suprarenal (adrenal) glands [not shown] Aorta and IVC Duodenum (2nd through 4th parts) Pancreas (except tail) Ureters [not shown] Colon (descending and ascending) Kidneys Esophagus [not shown] Rectum (partially) [not shown]" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.008
    kind: card
    topic: retroperitoneal-structures
    front: Where are retroperitoneal structures, and what can injury to them cause?
    back: They lie behind the peritoneal cavity, outside it. When one is injured, blood or gas can collect in the retroperitoneal space.
    src: { page: 367, quote: "Retroperitoneal structures A are posterior to (and outside of) the peritoneal cavity. Injuries to retroperitoneal structures can cause blood or gas accumulation in retroperitoneal space." }
    status: unverified
  - id: gi.L02.009
    kind: mcq
    topic: retroperitoneal-structures
    stem: >-
      A 24-year-old man is brought to the emergency department after his car's steering wheel struck his
      upper abdomen. He has epigastric pain radiating to the back. CT shows air and fluid collecting in
      the right retroperitoneal space around the duodenum. Which part of the bowel is most likely
      injured?
    options:
      - Second part of the duodenum
      - First part of the duodenum
      - Jejunum
      - Transverse colon
      - Tail of the pancreas
    answer: 0
    why:
      - "Right. The duodenum from its 2nd to 4th parts is retroperitoneal, so a tear leaks gas and fluid into the retroperitoneal space."
      - "The 1st part of the duodenum is not on the SAD PUCKER list; it is intraperitoneal, so a tear would give free intraperitoneal air."
      - "The jejunum is intraperitoneal on a mesentery."
      - "Only the ascending and descending colon are retroperitoneal; the transverse colon is not."
      - "The pancreas is retroperitoneal except its tail, which lies in the splenorenal ligament, and it is not bowel."
    src: { page: 367, quote: "Duodenum (2nd through 4th parts)" }
    status: unverified
  # ---------- p368: GI ligaments ----------
  - id: gi.L02.010
    kind: table
    topic: gi-ligaments
    title: Important gastrointestinal ligaments
    columns: [Ligament, Connects, Contains]
    rows:
      - [Falciform, Liver to anterior abdominal wall, "Ligamentum teres hepatis (fetal umbilical vein), patent paraumbilical veins"]
      - [Hepatoduodenal, Liver to duodenum, "Portal triad: proper hepatic artery, portal vein, common bile duct"]
      - [Hepatogastric, Liver to lesser curvature of stomach, Gastric vessels]
      - [Gastrocolic, Greater curvature and transverse colon, Gastroepiploic arteries]
      - [Gastrosplenic, Greater curvature and spleen, "Short gastrics, left gastroepiploic vessels"]
      - [Splenorenal, Spleen to left pararenal space, "Splenic artery and vein, tail of pancreas"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2]]
    src: { page: 368, quote: "LIGAMENT CONNECTS STRUCTURES CONTAINED NOTES Falciform ligament Liver to anterior abdominal wall Ligamentum teres hepatis (derivative of fetal umbilical vein), patent paraumbilical veins Derivative of ventral mesentery Hepatoduodenal ligament Liver to duodenum Portal triad: proper hepatic artery, portal vein, common bile duct Derivative of ventral mesentery Pringle maneuver—ligament is compressed manually or with a vascular clamp in omental foramen to control bleeding from hepatic inflow source (portal vein, hepatic artery) vs outflow (hepatic veins, IVC) Borders the omental foramen, which connects the greater and lesser sacs Part of lesser omentum Hepatogastric ligament Liver to lesser curvature of stomach Gastric vessels Derivative of ventral mesentery Separates greater and lesser sacs on the right May be cut during surgery to access lesser sac Part of lesser omentum Gastrocolic ligament Greater curvature and transverse colon Gastroepiploic arteries Derivative of dorsal mesentery Part of greater omentum Gastrosplenic ligament Greater curvature and spleen Short gastrics, left gastroepiploic vessels Derivative of dorsal mesentery Separates greater and lesser sacs on the left Part of greater omentum Splenorenal ligament Spleen to left pararenal space Splenic artery and vein, tail of pancreas Derivative of dorsal mesentery" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.011
    kind: cloze
    topic: gi-ligaments
    text: The falciform, hepatoduodenal and hepatogastric ligaments derive from the {{c1::ventral}} mesentery; the gastrocolic, gastrosplenic and splenorenal ligaments derive from the {{c2::dorsal}} mesentery.
    src: { page: 368, quote: "LIGAMENT CONNECTS STRUCTURES CONTAINED NOTES Falciform ligament Liver to anterior abdominal wall Ligamentum teres hepatis (derivative of fetal umbilical vein), patent paraumbilical veins Derivative of ventral mesentery Hepatoduodenal ligament Liver to duodenum Portal triad: proper hepatic artery, portal vein, common bile duct Derivative of ventral mesentery Pringle maneuver—ligament is compressed manually or with a vascular clamp in omental foramen to control bleeding from hepatic inflow source (portal vein, hepatic artery) vs outflow (hepatic veins, IVC) Borders the omental foramen, which connects the greater and lesser sacs Part of lesser omentum Hepatogastric ligament Liver to lesser curvature of stomach Gastric vessels Derivative of ventral mesentery Separates greater and lesser sacs on the right May be cut during surgery to access lesser sac Part of lesser omentum Gastrocolic ligament Greater curvature and transverse colon Gastroepiploic arteries Derivative of dorsal mesentery Part of greater omentum Gastrosplenic ligament Greater curvature and spleen Short gastrics, left gastroepiploic vessels Derivative of dorsal mesentery Separates greater and lesser sacs on the left Part of greater omentum Splenorenal ligament Spleen to left pararenal space Splenic artery and vein, tail of pancreas Derivative of dorsal mesentery" }
    status: unverified
  - id: gi.L02.012
    kind: card
    topic: gi-ligaments
    front: What is the Pringle maneuver, and which bleeding does it control?
    back: Compressing the hepatoduodenal ligament at the omental foramen, by hand or with a vascular clamp, to stop bleeding from the liver's inflow (portal vein and hepatic artery).
    src: { page: 368, quote: "Pringle maneuver—ligament is compressed manually or with a vascular clamp in omental foramen to control bleeding from hepatic inflow source (portal vein, hepatic artery) vs outflow (hepatic veins, IVC)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.013
    kind: card
    topic: gi-ligaments
    front: Which ligament borders the omental foramen, and what does the foramen connect?
    back: The hepatoduodenal ligament (part of the lesser omentum). The omental foramen connects the greater and lesser sacs.
    src: { page: 368, quote: "Borders the omental foramen, which connects the greater and lesser sacs Part of lesser omentum" }
    status: unverified
  - id: gi.L02.014
    kind: cloze
    topic: gi-ligaments
    text: The {{c1::hepatogastric}} ligament separates the greater and lesser sacs on the right and may be cut in surgery to reach the lesser sac; the {{c2::gastrosplenic}} ligament separates them on the left.
    src: { page: 368, quote: "Separates greater and lesser sacs on the right May be cut during surgery to access lesser sac Part of lesser omentum" }
    status: unverified
  - id: gi.L02.015
    kind: mcq
    topic: gi-ligaments
    stem: >-
      A 40-year-old man undergoes laparotomy after a stab wound to the right upper quadrant. There is
      brisk bleeding from a laceration of the liver. The surgeon places a soft vascular clamp across the
      free edge of the lesser omentum at the omental foramen, but the bleeding continues unchanged.
      Which vessel is the most likely source of the bleeding?
    options:
      - Hepatic vein
      - Proper hepatic artery
      - Portal vein
      - Right gastric artery
      - Left gastroepiploic artery
    answer: 0
    why:
      - "Right. Clamping the hepatoduodenal ligament (Pringle maneuver) stops inflow from the portal vein and hepatic artery; bleeding that continues comes from outflow, the hepatic veins or IVC."
      - "The proper hepatic artery runs in the hepatoduodenal ligament, so clamping would stop it."
      - "The portal vein is in the portal triad inside the clamped ligament."
      - "The right gastric artery supplies the lesser curvature of the stomach, not the liver."
      - "The left gastroepiploic runs in the gastrosplenic ligament along the greater curvature, far from the liver."
    src: { page: 368, quote: "to control bleeding from hepatic inflow source (portal vein, hepatic artery) vs outflow (hepatic veins, IVC)" }
    status: unverified
  # ---------- p369: digestive tract anatomy ----------
  - id: gi.L02.016
    kind: order
    topic: digestive-tract-anatomy
    prompt: Put the layers of the gut wall in order from inside to outside (MSMS).
    steps:
      - Mucosa (epithelium, lamina propria, muscularis mucosa)
      - Submucosa (submucosal plexus of Meissner, vessels)
      - Muscularis externa (inner circular, myenteric plexus of Auerbach, outer longitudinal)
      - Serosa (intraperitoneal) or adventitia (retroperitoneal)
    src: { page: 369, quote: "Layers of gut wall A (inside to outside—MSMS):" }
    status: unverified
  - id: gi.L02.017
    kind: card
    topic: digestive-tract-anatomy
    front: Which nerve plexus lies in the submucosa?
    back: The submucosal plexus of Meissner.
    src: { page: 369, quote: "Submucosa—includes submucosal nerve plexus (Meissner), secretes fluid; contains vessels" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.018
    kind: card
    topic: digestive-tract-anatomy
    front: What is the difference in depth between an erosion and an ulcer?
    back: An erosion is in the mucosa only. An ulcer can extend into the submucosa or the inner or outer muscular layer.
    src: { page: 369, quote: "Ulcers can extend into submucosa, inner or outer muscular layer. Erosions are in mucosa only." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.019
    kind: cloze
    topic: digestive-tract-anatomy
    text: Slow waves (basal electric rhythm) originate in the {{c1::interstitial cells of Cajal}}; their frequency is highest in the {{c2::duodenum}}, then ileum, then stomach.
    src: { page: 369, quote: "Frequency of basal electric rhythm (slow waves), which originate in the interstitial cells of Cajal: duodenum > ileum > stomach." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.020
    kind: mcq
    topic: digestive-tract-anatomy
    stem: >-
      A 45-year-old woman has 8 months of abdominal distension, bloating and vomiting. Imaging shows
      dilated small bowel loops, and laparotomy finds no obstructing lesion. A full-thickness jejunal
      biopsy shows loss of the neurons that lie between the inner circular and outer longitudinal
      muscle layers; the mucosa and submucosa, including the submucosal nerve plexus, are normal.
      Which function of this segment is most directly impaired?
    options:
      - Motility
      - Absorption by villi and microvilli
      - Secretion of defensins and lysozyme by Paneth cells
      - Mucus production by goblet cells
      - Replacement of enterocytes by crypt stem cells
    answer: 0
    why:
      - "Right. The myenteric (Auerbach) plexus lies between the circular and longitudinal layers of the muscularis externa and helps with motility."
      - "Absorption is by the villi and microvilli of the mucosa, which is normal here."
      - "Paneth cells sit in the crypts of Lieberkühn in the mucosa, which is normal here."
      - "Goblet cells are mucosal epithelial cells, untouched by a loss of myenteric neurons."
      - "Crypt stem cells are in the mucosa and keep replacing enterocytes; the lesion is in the muscularis externa."
    src: { page: 369, quote: "Muscularis externa—circular inner, Auerbach, longitudinal outer layer; myenteric nerve plexus in the middle helps with motility" }
    status: unverified
  # ---------- p369: digestive tract histology ----------
  - id: gi.L02.021
    kind: card
    topic: digestive-tract-histology
    front: What epithelium and muscle line the esophagus?
    back: "Epithelium: stratified squamous, not keratinized. Muscle: skeletal (striated) in the top third, smooth in the middle and bottom two thirds, the two mixing where they meet."
    src: { page: 369, quote: "Esophagus Nonkeratinized stratified squamous epithelium. Upper 1/3, striated muscle; middle and lower 2/3 smooth muscle, with some overlap at the transition." }
    status: unverified
  - id: gi.L02.022
    kind: cloze
    topic: digestive-tract-histology
    text: In the gastric glands, parietal cells are {{c1::eosinophilic (pink)}} and chief cells are {{c2::basophilic}}.
    src: { page: 369, quote: "Gastric glands A . Parietal cells are eosinophilic (pink), chief cells are basophilic." }
    status: unverified
  - id: gi.L02.023
    kind: table
    topic: digestive-tract-histology
    title: Telling the bowel segments apart on histology
    columns: [Segment, Distinguishing features]
    rows:
      - [Duodenum, "Brunner glands (bicarbonate-secreting, submucosa); villi, crypts of Lieberkühn, plicae circulares (distal)"]
      - [Jejunum, "Plicae circulares taller, more prominent and numerous → feathered appearance with oral contrast"]
      - [Ileum, "Peyer patches (lymphoid aggregates in lamina propria and submucosa); plicae circulares (proximal ileum); largest number of goblet cells in the small intestine"]
      - [Colon, "Crypts of Lieberkühn with abundant goblet cells, but no villi"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 369, quote: "Duodenum Villi B and microvilli ↑ absorptive surface. Brunner glands (bicarbonate-secreting cells of submucosa), crypts of Lieberkühn (contain stem cells that replace enterocytes/goblet cells and Paneth cells that secrete defensins, lysozyme, and TNF), and plicae circulares (distal duodenum). Jejunum Villi, crypts of Lieberkühn, and plicae circulares (taller, more prominent, numerous [vs ileum]) → feathered appearance with oral contrast and ↑ surface area. Ileum Villi, Peyer patches (arrow in C ; lymphoid aggregates in lamina propria, submucosa), plicae circulares (proximal ileum), crypts of Lieberkühn. Largest number of goblet cells in small intestine. Colon Crypts of Lieberkühn with abundant goblet cells, but no villi" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.024
    kind: card
    topic: digestive-tract-histology
    front: What do the crypts of Lieberkühn contain, and what do Paneth cells secrete?
    back: Stem cells that replace enterocytes and goblet cells, and Paneth cells, which secrete defensins, lysozyme and TNF.
    src: { page: 369, quote: "crypts of Lieberkühn (contain stem cells that replace enterocytes/goblet cells and Paneth cells that secrete defensins, lysozyme, and TNF)" }
    status: unverified
  - id: gi.L02.025
    kind: mcq
    topic: digestive-tract-histology
    stem: >-
      A 52-year-old woman has 3 months of burning epigastric pain that eases when she eats. Upper
      endoscopy finds an ulcer just distal to the pylorus, and a biopsy of the nearby mucosa shows villi,
      crypts of Lieberkühn and, in the submucosa, clusters of glands. Which substance do these
      submucosal glands secrete?
    options:
      - Bicarbonate
      - Defensins and lysozyme
      - Pepsinogen
      - Hydrochloric acid
      - Secretin
    answer: 0
    why:
      - "Right. Villi with submucosal glands mark the duodenum, and its Brunner glands are bicarbonate-secreting cells of the submucosa."
      - "Defensins and lysozyme come from Paneth cells in the crypts of Lieberkühn, in the mucosa, not submucosal glands."
      - "Pepsinogen comes from gastric chief cells, in the stomach's gastric glands."
      - "Acid comes from gastric parietal cells, in the stomach, which has no villi."
      - "Secretin is a hormone of duodenal S cells in the mucosa, not the product of submucosal glands."
    src: { page: 369, quote: "Brunner glands (bicarbonate-secreting cells of submucosa)" }
    status: unverified
  # ---------- p370: abdominal aorta and branches ----------
  - id: gi.L02.026
    kind: card
    topic: abdominal-aorta-branches
    front: How do the aortic branches to GI structures differ from those to non-GI structures?
    back: Arteries to GI structures are single and branch anteriorly; arteries to non-GI structures are paired and branch laterally and posteriorly.
    src: { page: 370, quote: "Arteries supplying GI structures are single and branch anteriorly. Arteries supplying non-GI structures are paired and branch laterally and posteriorly." }
    status: unverified
  - id: gi.L02.027
    kind: card
    topic: abdominal-aorta-branches
    front: What are the two watershed areas of the colon, and which arteries meet there?
    back: "Splenic flexure: SMA and IMA. Rectosigmoid junction: IMA branches (the last sigmoid arterial branch and the superior rectal artery)."
    src: { page: 370, quote: "Splenic flexure—SMA and IMA Rectosigmoid junction—IMA branches (last sigmoid arterial branch and superior rectal artery)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.028
    kind: mcq
    topic: abdominal-aorta-branches
    stem: >-
      A 74-year-old man is in the intensive care unit with septic shock requiring two vasopressors. On
      day 2 he develops crampy left-sided abdominal pain and passes bloody stools. Colonoscopy shows
      patchy mucosal ischemia. Which part of the colon is most likely involved?
    options:
      - Splenic flexure
      - Cecum
      - Hepatic flexure
      - Mid ascending colon
      - Lower anal canal
    answer: 0
    why:
      - "Right. The splenic flexure is a watershed between the SMA and IMA territories, so it is susceptible to ischemia in hypotensive states."
      - "The cecum is supplied by the ileocolic branch of the SMA; it is not one of the two watershed areas the book names."
      - "The hepatic flexure lies within the SMA territory (right/middle colic)."
      - "The ascending colon is fed by SMA branches and is not a watershed zone."
      - "The anal canal below the pectinate line is supplied by the inferior rectal artery (internal pudendal), well away from the watersheds."
    src: { page: 370, quote: "Two areas of the colon have dual blood supply from distal arterial branches (“watershed areas”) → susceptible in colonic ischemia (hypotensive states, thromboemboli, or atheroemboli): ▘ Splenic flexure—SMA and IMA" }
    status: unverified
  # ---------- p370: nutcracker syndrome ----------
  - id: gi.L02.029
    kind: card
    topic: nutcracker-syndrome
    front: What is nutcracker syndrome?
    back: Compression of the left renal vein between the SMA and the aorta.
    src: { page: 370, quote: "Nutcracker syndrome Compression of left renal vein between superior mesenteric artery and aorta." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.030
    kind: mcq
    topic: nutcracker-syndrome
    stem: >-
      A 19-year-old thin man has intermittent left flank pain and two episodes of painless red urine over
      3 months. Examination shows a left scrotal mass that feels like a "bag of worms" and enlarges
      when he stands. Urine shows red blood cells with no casts. Doppler ultrasound shows a dilated left
      renal vein. Compression of this vein between which two structures best explains his findings?
    options:
      - Superior mesenteric artery and aorta
      - Inferior mesenteric artery and aorta
      - Left renal artery and left ureter
      - Celiac trunk and median arcuate ligament
      - Inferior vena cava and right crus of the diaphragm
    answer: 0
    why:
      - "Right. Nutcracker syndrome: the left renal vein is squeezed between the SMA and aorta, causing flank pain, hematuria from renal varicosities and a left varicocele."
      - "The left renal vein passes above the IMA origin, between the SMA and aorta."
      - "The left renal artery and ureter do not compress the vein."
      - "The median arcuate ligament compresses the celiac trunk, not the renal vein."
      - "The IVC receives the left renal vein; it does not compress it."
    src: { page: 370, quote: "Compression of left renal vein between superior mesenteric artery and aorta." }
    status: unverified
  # ---------- p370: SMA syndrome ----------
  - id: gi.L02.031
    kind: card
    topic: sma-syndrome
    front: What happens in superior mesenteric artery syndrome?
    back: The SMA and aorta compress the transverse (third) part of the duodenum, causing intermittent intestinal obstruction (mainly postprandial pain).
    src: { page: 370, quote: "Characterized by intermittent intestinal obstruction symptoms (primarily postprandial pain) when SMA and aorta compress transverse (third) portion of duodenum." }
    status: unverified
    tags: [high-yield]
  - id: gi.L02.082
    kind: card
    topic: sma-syndrome
    front: In which conditions does superior mesenteric artery syndrome typically occur?
    back: Conditions with diminished mesenteric fat, such as rapid weight loss, low body weight, malnutrition or gastric bypass surgery.
    src: { page: 370, quote: "Typically occurs in conditions associated with diminished mesenteric fat (eg, rapid weight loss, low body weight, malnutrition, gastric bypass surgeries)." }
    status: unverified
  - id: gi.L02.032
    kind: mcq
    topic: sma-syndrome
    stem: >-
      A 17-year-old girl with anorexia nervosa has lost 12 kg over 4 months. She now has epigastric pain,
