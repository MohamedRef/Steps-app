  # ---------- p383: oral pathologies ----------
  - id: gi.L04.260
    kind: card
    topic: oral-pathologies
    front: "What are aphthous ulcers?"
    back: "Canker sores: common painful, shallow, round-to-oval oral ulcers with a yellowish exudate on top."
    src: { page: 383, quote: "Also called canker sores. Common oral lesions that appear as painful, shallow, round to oval ulcers covered by yellowish exudate" }
    status: unverified
  - id: gi.L04.001
    kind: card
    topic: oral-pathologies
    front: "Which conditions are associated with recurrent aphthous stomatitis?"
    back: "Celiac disease, IBD, SLE, Behçet syndrome and HIV infection."
    src: { page: 383, quote: "Recurrent aphthous stomatitis is associated with celiac disease, IBD, SLE, Behçet syndrome, HIV infection." }
    status: unverified
  - id: gi.L04.002
    kind: card
    topic: oral-pathologies
    front: What is the most common malignancy of the oral cavity, and where does it usually arise?
    back: Squamous cell carcinoma, usually of the tongue.
    src: { page: 383, quote: "Most common malignancy of oral cavity. Usually affects the tongue." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.204
    kind: card
    topic: oral-pathologies
    front: Which risk factors are associated with oral squamous cell carcinoma?
    back: Tobacco, alcohol and HPV-16.
    src: { page: 383, quote: "Associated with tobacco, alcohol, HPV-16." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.205
    kind: card
    topic: oral-pathologies
    front: How does oral squamous cell carcinoma present?
    back: As a nonhealing ulcer with irregular margins and raised borders.
    src: { page: 383, quote: "Presents as nonhealing ulcer with irregular margins and raised borders." }
    status: unverified
  - id: gi.L04.206
    kind: cloze
    topic: oral-pathologies
    text: The precursor lesions of oral squamous cell carcinoma are {{c1::leukoplakia}} (white patch) and {{c2::erythroplakia}} (red patch).
    src: { page: 383, quote: "Leukoplakia (white patch B ) and erythroplakia (red patch) are precursor lesions." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.261
    kind: card
    topic: oral-pathologies
    front: "What is sialolithiasis?"
    back: "A stone forming in the duct of a major salivary gland (parotid, submandibular or sublingual)."
    src: { page: 383, quote: "Stone formation in major salivary gland ducts (parotid C , submandibular, or sublingual)." }
    status: unverified
  - id: gi.L04.262
    kind: card
    topic: oral-pathologies
    front: "Which factors are associated with sialolithiasis?"
    back: "Salivary stasis (eg, dehydration) and trauma."
    src: { page: 383, quote: "Associated with salivary stasis (eg, dehydration) and trauma." }
    status: unverified
  - id: gi.L04.003
    kind: card
    topic: oral-pathologies
    front: "How does sialolithiasis present?"
    back: "Pain and swelling of the affected gland that keep coming back before or around meals."
    src: { page: 383, quote: "Presents as recurrent pre-/periprandial pain and swelling in affected gland." }
    status: unverified
  - id: gi.L04.004
    kind: card
    topic: oral-pathologies
    front: What causes sialadenitis?
    back: A blocked duct, an infection (eg, S aureus or the mumps virus) or an immune process such as Sjögren syndrome; each inflames the gland.
    src: { page: 383, quote: "Inflammation of salivary gland due to obstruction, infection (eg, S aureus, mumps virus), or immune-mediated mechanisms (eg, Sjögren syndrome)." }
    status: unverified
  - id: gi.L04.005
    kind: card
    topic: oral-pathologies
    front: Are salivary gland tumors usually benign or malignant, and which gland do they most commonly affect?
    back: Usually benign, and most commonly in the parotid gland.
    src: { page: 383, quote: "Usually benign and most commonly affect the parotid gland." }
    status: unverified
  - id: gi.L04.207
    kind: card
    topic: oral-pathologies
    front: Tumors of which salivary glands are more likely to be malignant?
    back: The submandibular, sublingual and minor salivary glands.
    src: { page: 383, quote: "Submandibular, sublingual, and minor salivary gland tumors are more likely to be malignant." }
    status: unverified
  - id: gi.L04.208
    kind: card
    topic: oral-pathologies
    front: How do salivary gland tumors typically present?
    back: As a painless mass or swelling.
    src: { page: 383, quote: "Typically present as painless mass/ swelling." }
    status: unverified
  - id: gi.L04.209
    kind: card
    topic: oral-pathologies
    front: Which signs suggest that a salivary gland tumor is malignant?
    back: Facial paralysis or pain.
    src: { page: 383, quote: "Facial paralysis or pain suggests malignant involvement." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.006
    kind: table
    topic: oral-pathologies
    title: Salivary gland tumors
    columns: [Tumor, Features]
    rows:
      - [Pleomorphic adenoma (benign mixed tumor), "Most common; chondromyxoid stroma and epithelium; recurs if incompletely excised or ruptured; may become malignant"]
      - [Warthin tumor (papillary cystadenoma lymphomatosum), "Benign cystic tumor with germinal centers; may be bilateral or multifocal; people who smoke"]
      - [Mucoepidermoid carcinoma, "Most common malignant tumor; mucinous and squamous components"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 383, quote: "Pleomorphic adenoma (benign mixed tumor)—most common salivary gland tumor D. Composed of chondromyxoid stroma and epithelium and recurs if incompletely excised or ruptured intraoperatively." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.007
    kind: mcq
    topic: oral-pathologies
    stem: >-
      A 62-year-old man who has smoked 1 pack a day for 40 years notices a slowly growing, painless
      swelling in front of his left ear. On examination there is a soft, mobile mass; a similar smaller
      mass is felt on the right. Facial nerve function is normal. Biopsy would most likely show which
      feature?
    options:
      - Cystic spaces lined by epithelium over lymphoid tissue with germinal centers
      - Chondromyxoid stroma mixed with epithelium in a single encapsulated lobule
      - Mixed mucinous, squamous and intermediate cells forming an infiltrative mass
      - Keratin pearls from atypical squamous cells invading the deeper tissue
      - Noncaseating granulomas with multinucleated giant cells throughout the gland
    answer: 0
    why:
      - "Right. Warthin tumor is a benign cystic tumor with germinal centers, may be bilateral, and is typical in people who smoke (\"Warriors from Germany love smoking\")."
      - "Chondromyxoid stroma is pleomorphic adenoma, usually unilateral and not linked to smoking."
      - "Mucinous plus squamous components is mucoepidermoid carcinoma, the most common malignant salivary tumor."
      - "Keratin pearls suggest squamous cell carcinoma, which would not be bilateral, soft and mobile."
      - "Granulomas suggest sarcoidosis, which is not a tumor."
    src: { page: 383, quote: "Warthin tumor (papillary cystadenoma lymphomatosum)—benign cystic tumor with germinal centers. May be bilateral or multifocal. Typically found in people who smoke." }
    status: unverified
  # ---------- p383: achalasia ----------
  - id: gi.L04.008
    kind: card
    topic: achalasia
    front: What is the mechanism of achalasia?
    back: The NO- and VIP-containing inhibitory neurons of the Auerbach (myenteric) plexus degenerate, so the LES can no longer relax.
    src: { page: 383, quote: "Failure of LES to relax due to degeneration of inhibitory neurons (containing NO and VIP) in the myenteric (Auerbach) plexus of esophageal wall." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.009
    kind: card
    topic: achalasia
    front: What are the causes of achalasia?
    back: Most cases are primary (idiopathic). Secondary achalasia follows Chagas disease (T cruzi) or a malignancy outside the esophagus, through mass effect or a paraneoplastic effect.
    src: { page: 383, quote: "1° idiopathic. 2° from Chagas disease (T cruzi infection) or extraesophageal malignancies (mass effect or paraneoplastic)." }
    status: unverified
  - id: gi.L04.010
    kind: card
    topic: achalasia
    front: How does dysphagia in achalasia differ from mechanical obstruction, and what risk does achalasia carry?
    back: Achalasia gives progressive dysphagia to both solids and liquids (obstruction is primarily solids). It is associated with ↑ risk of esophageal cancer.
    src: { page: 383, quote: "Presents with progressive dysphagia to solids and liquids (vs obstruction—primarily solids). Associated with ↑ risk of esophageal cancer." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.011
    kind: cloze
    topic: achalasia
    text: "In achalasia, manometry shows uncoordinated or absent peristalsis with {{c1::↑ LES resting pressure}}."
    src: { page: 383, quote: "Manometry findings include uncoordinated or absent peristalsis with ↑ LES resting pressure." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.263
    kind: cloze
    topic: achalasia
    text: "In achalasia, barium swallow shows a dilated esophagus with distal stenosis: the {{c1::\"bird's beak\"}}."
    src: { page: 383, quote: "Barium swallow shows dilated esophagus with area of distal stenosis (“bird’s beak” A )." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.264
    kind: card
    topic: achalasia
    front: "Which treatments are used for achalasia?"
    back: "Surgery or endoscopic procedures, such as botulinum toxin injection."
    src: { page: 383, quote: "Treatment: surgery, endoscopic procedures (eg, botulinum toxin injection)." }
    status: unverified
  - id: gi.L04.012
    kind: mcq
    topic: achalasia
    stem: >-
      A 38-year-old woman from rural Bolivia has had 2 years of progressive difficulty swallowing both
      solids and liquids, with regurgitation of undigested food at night. Barium swallow shows a dilated
      esophagus tapering to a narrow distal segment. Loss of which neurons best explains her
      condition?
    options:
      - Inhibitory neurons containing NO and VIP in the myenteric plexus
      - Cholinergic excitatory neurons in the submucosal plexus
      - Vagal motor fibers to striated muscle of the upper esophagus
      - Sympathetic fibers from the celiac ganglion
      - Interstitial cells of Cajal in the stomach
    answer: 0
    why:
      - "Right. Achalasia is failure of LES relaxation from degeneration of inhibitory NO/VIP neurons in the myenteric (Auerbach) plexus; Chagas disease (T cruzi) is a 2° cause."
      - "Losing excitatory neurons would not keep the LES tightly closed."
      - "Upper esophageal striated muscle is not where the obstruction is."
      - "Sympathetic fibers are not the lost inhibitory neurons."
      - "Interstitial cells of Cajal set slow waves; the book does not tie them to achalasia."
    src: { page: 383, quote: "2° from Chagas disease (T cruzi infection) or extraesophageal malignancies (mass effect or paraneoplastic). Chagas disease can cause achalasia." }
    status: unverified
  # ---------- p384: other esophageal pathologies ----------
  - id: gi.L04.013
    kind: card
    topic: other-esophageal-pathologies
    front: "What is the mechanism of GERD?"
    back: "Short-lived drops in LES tone that let gastric contents reflux."
    src: { page: 384, quote: "Transient decreases in LES tone." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.265
    kind: card
    topic: other-esophageal-pathologies
    front: "What are the common presenting symptoms of GERD?"
    back: "Heartburn, regurgitation and dysphagia."
    src: { page: 384, quote: "Commonly presents as heartburn, regurgitation, dysphagia." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.266
    kind: card
    topic: other-esophageal-pathologies
    front: "Which extraesophageal features can GERD cause?"
    back: "Chronic cough and hoarseness (laryngopharyngeal reflux); GERD is also associated with asthma."
    src: { page: 384, quote: "May also present as chronic cough, hoarseness (laryngopharyngeal reflux). Associated with asthma." }
    status: unverified
  - id: gi.L04.267
    kind: enumerate
    topic: other-esophageal-pathologies
    prompt: "Enumerate the complications of GERD (3)."
    points:
      - "Erosive esophagitis"
      - "Strictures"
      - "Barrett esophagus"
    pass: 3
    src: { page: 384, quote: "Complications include erosive esophagitis, strictures, and Barrett esophagus." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.268
    kind: card
    topic: other-esophageal-pathologies
    front: "How does esophagitis present?"
    back: "With odynophagia (painful swallowing) and/or dysphagia."
    src: { page: 384, quote: "Inflammation of esophageal mucosa. Presents with odynophagia and/or dysphagia." }
    status: unverified
  - id: gi.L04.014
    kind: table
    topic: other-esophageal-pathologies
    title: Types of esophagitis
    columns: [Type, Cause or features]
    rows:
      - [Reflux (erosive), "Most common type; 2° to GERD"]
      - [Medication-induced, "Bisphosphonates, tetracyclines, NSAIDs, ferrous sulfate, potassium chloride"]
      - [Eosinophilic, "Chronic, immune-mediated; atopic disorders (eg, asthma); rings and linear furrows on endoscopy"]
      - [Infectious, "Candida (most common; white pseudomembranes), HSV-1 (punched-out ulcers), CMV (linear ulcers); immunosuppression"]
      - [Corrosive, Caustic ingestion]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 384, quote: "Infectious esophagitis—Candida (most common; white pseudomembranes A ), HSV-1 (punched-out ulcers), CMV (linear ulcers)." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.015
    kind: card
    topic: other-esophageal-pathologies
    front: What is the triad of Plummer-Vinson syndrome, and what cancer does it predispose to?
    back: Dysphagia, iron deficiency anemia and esophageal webs; it may come with glossitis. ↑ risk of esophageal squamous cell carcinoma ("Plumber dies").
    src: { page: 384, quote: "Triad of dysphagia, iron deficiency anemia, esophageal webs. ↑ risk of esophageal squamous cell carcinoma (\"Plumber dies\")." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.016
    kind: table
    topic: other-esophageal-pathologies
    title: Mallory-Weiss vs Boerhaave
    columns: ["", Mallory-Weiss syndrome, Boerhaave syndrome]
    rows:
      - [Depth, "Partial thickness, longitudinal lacerations confined to mucosa/submucosa", "Transmural rupture, usually distal esophagus"]
      - [Cause, Severe vomiting, Violent retching]
      - [Clinical, "Hematemesis +/- abdominal or back pain; alcohol use disorder, bulimia", "Pneumomediastinum and subcutaneous emphysema can indicate dissecting air"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 384, quote: "Partial thickness, longitudinal lacerations of gastroesophageal junction, confined to mucosa/ submucosa, due to severe vomiting." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.017
    kind: card
    topic: other-esophageal-pathologies
    front: "What are esophageal varices?"
    back: "Dilated veins in the submucosa of the lower third of the esophagus, secondary to portal hypertension."
    src: { page: 384, quote: "Dilated submucosal veins (red arrows in B ) in lower 1/3 of esophagus 2° to portal hypertension." }
    status: unverified
  - id: gi.L04.269
    kind: card
    topic: other-esophageal-pathologies
    front: "In which patients are esophageal varices common?"
    back: "Patients with cirrhosis."
    src: { page: 384, quote: "Common in patients with cirrhosis, may be source of life-threatening hematemesis." }
    status: unverified
  - id: gi.L04.270
    kind: card
    topic: other-esophageal-pathologies
    front: "Which life-threatening complication can esophageal varices cause?"
    back: "Hematemesis (variceal bleeding)."
    src: { page: 384, quote: "Common in patients with cirrhosis, may be source of life-threatening hematemesis." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.018
    kind: card
    topic: other-esophageal-pathologies
    front: "What is distal esophageal spasm?"
    back: "Spontaneous, uncoordinated (nonperistaltic) esophageal contractions while LES pressure stays normal; formerly called diffuse esophageal spasm."
    src: { page: 384, quote: "Formerly called diffuse esophageal spasm. Spontaneous, nonperistaltic (uncoordinated) contractions of the esophagus with normal LES pressure." }
    status: unverified
  - id: gi.L04.271
    kind: card
    topic: other-esophageal-pathologies
    front: "How does distal esophageal spasm present?"
    back: "Dysphagia and chest pain that mimics angina."
    src: { page: 384, quote: "Presents with dysphagia and anginalike chest pain." }
    status: unverified
  - id: gi.L04.272
    kind: card
    topic: other-esophageal-pathologies
    front: "What may barium swallow show in distal esophageal spasm?"
    back: "A \"corkscrew\" esophagus."
    src: { page: 384, quote: "Barium swallow may reveal “corkscrew” esophagus." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.273
    kind: card
    topic: other-esophageal-pathologies
    front: "Which test is diagnostic for distal esophageal spasm?"
    back: "Manometry."
    src: { page: 384, quote: "Manometry is diagnostic." }
    status: unverified
  - id: gi.L04.274
    kind: card
    topic: other-esophageal-pathologies
    front: "How is distal esophageal spasm treated?"
    back: "Nitrates and calcium channel blockers (CCBs)."
    src: { page: 384, quote: "Treatment includes nitrates and CCBs." }
    status: unverified
  - id: gi.L04.019
    kind: card
    topic: other-esophageal-pathologies
    front: "How does scleroderma cause reflux and dysphagia?"
    back: "Atrophy and fibrosis of the esophageal smooth muscle lower LES pressure and weaken distal motility, so acid refluxes and swallowing becomes hard."
    src: { page: 384, quote: "Esophageal smooth muscle atrophy and fibrosis → ↓ LES pressure and distal esophageal dysmotility → acid reflux and dysphagia" }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.275
    kind: card
    topic: other-esophageal-pathologies
    front: "Which complications follow the reflux and dysmotility of scleroderma esophagus?"
    back: "Stricture, Barrett esophagus and aspiration."
    src: { page: 384, quote: "acid reflux and dysphagia → stricture, Barrett esophagus, and aspiration." }
    status: unverified
  - id: gi.L04.276
    kind: card
    topic: other-esophageal-pathologies
    front: "Esophageal involvement in scleroderma is part of which syndrome?"
    back: "CREST syndrome."
    src: { page: 384, quote: "Part of CREST syndrome." }
    status: unverified
  - id: gi.L04.020
    kind: card
    topic: other-esophageal-pathologies
    front: "What is the most common cause of esophageal perforation?"
    back: "Iatrogenic injury during esophageal instrumentation."
    src: { page: 384, quote: "Most commonly iatrogenic following esophageal instrumentation." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.277
    kind: enumerate
    topic: other-esophageal-pathologies
    prompt: "Enumerate the noniatrogenic causes of esophageal perforation (4)."
    points:
      - "Spontaneous rupture"
      - "Foreign body ingestion"
      - "Trauma"
      - "Malignancy"
    pass: 3
    src: { page: 384, quote: "Noniatrogenic causes include spontaneous rupture, foreign body ingestion, trauma, malignancy." }
    status: unverified
  - id: gi.L04.021
    kind: mcq
    topic: other-esophageal-pathologies
    stem: >-
      A 44-year-old man with alcohol use disorder has repeated forceful retching after a binge. He then
      develops severe retrosternal chest pain and fever. Endoscopy is deferred. Given the most likely cause,
      which finding is most likely on examination or chest imaging?
    options:
      - Air in the mediastinum with crepitus over the neck
      - A "coffee bean" loop of colon
      - A "bird's beak" narrowing of the distal esophagus
      - A "corkscrew" esophagus on barium swallow
      - White pseudomembranes on the esophageal mucosa
    answer: 0
    why:
      - "Right. Violent retching causing a transmural distal esophageal rupture is Boerhaave syndrome; pneumomediastinum and subcutaneous emphysema (crepitus in the neck or chest wall) mark the dissecting air."
      - "A coffee bean sign is sigmoid volvulus, an obstruction in older adults, not chest pain after retching."
      - "A bird's beak is achalasia, with progressive dysphagia, not acute pain after retching."
      - "A corkscrew esophagus is distal esophageal spasm, which causes chest pain and dysphagia but no rupture."
      - "White pseudomembranes are Candida esophagitis, which causes odynophagia, not fever and pain after retching."
    src: { page: 384, quote: "Pneumomediastinum (arrows in C ) and subcutaneous emphysema (signs include crepitus in the neck region or chest wall) can indicate dissecting air." }
    status: unverified
  - id: gi.L04.022
    kind: mcq
    topic: other-esophageal-pathologies
    stem: >-
      A 19-year-old man with asthma and allergic rhinitis has had intermittent food impaction and
      difficulty swallowing solids for a year. A PPI trial did not help. Endoscopy shows multiple
      concentric rings and linear furrows along the esophagus. Biopsy is most likely to show which cell
      predominating?
    options:
      - Eosinophils
      - Neutrophils
      - Goblet cells in columnar epithelium
      - Multinucleated giant cells with intranuclear inclusions
      - Budding yeast and pseudohyphae
    answer: 0
    why:
      - "Right. Eosinophilic esophagitis is chronic, immune-mediated and eosinophil-predominant, associated with atopy, with rings and linear furrows on endoscopy."
      - "Neutrophils dominate in acute infectious or reflux injury."
      - "Goblet cells in columnar epithelium are Barrett esophagus."
      - "Multinucleated cells with inclusions suggest HSV-1 (punched-out ulcers)."
      - "Yeast and pseudohyphae are Candida, with white pseudomembranes."
    src: { page: 384, quote: "Eosinophilic esophagitis—chronic, immune-mediated, eosinophil-predominant. Associated with atopic disorders (eg, asthma). Esophageal rings and linear furrows on endoscopy." }
    status: unverified
  # ---------- p385: Barrett esophagus ----------
  - id: gi.L04.023
    kind: card
