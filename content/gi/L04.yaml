items:
  # ---------- p383: oral pathologies ----------
  - id: gi.L04.001
    kind: card
    topic: oral-pathologies
    front: What are aphthous ulcers, and which conditions are associated with recurrent aphthous stomatitis?
    back: Canker sores, painful shallow round-to-oval ulcers covered by yellowish exudate. Recurrent aphthous stomatitis is associated with celiac disease, IBD, SLE, Behçet syndrome and HIV infection.
    src: { page: 383, quote: "Recurrent aphthous stomatitis is associated with celiac disease, IBD, SLE, Behçet syndrome, HIV infection." }
    status: unverified
  - id: gi.L04.002
    kind: card
    topic: oral-pathologies
    front: What is the most common malignancy of the oral cavity, its risk factors, presentation and precursor lesions?
    back: Squamous cell carcinoma, usually of the tongue. Associated with tobacco, alcohol and HPV-16. A nonhealing ulcer with irregular margins and raised borders. Precursors are leukoplakia (white patch) and erythroplakia (red patch).
    src: { page: 383, quote: "Most common malignancy of oral cavity. Usually affects the tongue. Associated with tobacco, alcohol, HPV-16." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.003
    kind: card
    topic: oral-pathologies
    front: What is sialolithiasis, and how does it present?
    back: Stone formation in a major salivary gland duct (parotid, submandibular or sublingual), associated with salivary stasis (eg, dehydration) and trauma. Recurrent pain and swelling of the gland before or around meals.
    src: { page: 383, quote: "Presents as recurrent pre-/periprandial pain and swelling in affected gland." }
    status: unverified
  - id: gi.L04.004
    kind: card
    topic: oral-pathologies
    front: What causes sialadenitis?
    back: Obstruction, infection (eg, S aureus, mumps virus) or immune-mediated mechanisms (eg, Sjögren syndrome).
    src: { page: 383, quote: "Inflammation of salivary gland due to obstruction, infection (eg, S aureus, mumps virus), or immune-mediated mechanisms (eg, Sjögren syndrome)." }
    status: unverified
  - id: gi.L04.005
    kind: card
    topic: oral-pathologies
    front: Which salivary gland do tumors most commonly affect, which glands' tumors are more often malignant, and which signs suggest malignancy?
    back: Usually benign and most often in the parotid. Submandibular, sublingual and minor salivary gland tumors are more likely malignant. Facial paralysis or pain suggests malignant involvement; most present as a painless mass.
    src: { page: 383, quote: "Submandibular, sublingual, and minor salivary gland tumors are more likely to be malignant. Typically present as painless mass/ swelling. Facial paralysis or pain suggests malignant involvement." }
    status: unverified
  - id: gi.L04.006
    kind: table
    topic: oral-pathologies
    title: Salivary gland tumors
    columns: [Tumor, Features]
    rows:
      - [Pleomorphic adenoma (benign mixed tumor), "Most common; chondromyxoid stroma and epithelium; recurs if incompletely excised or ruptured; may become malignant"]
      - [Warthin tumor (papillary cystadenoma lymphomatosum), "Benign cystic tumor with germinal centers; may be bilateral or multifocal; people who smoke"]
      - [Mucoepidermoid carcinoma, "Most common malignant tumor; mucinous and squamous components"]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 383, quote: "Pleomorphic adenoma (benign mixed tumor)—most common salivary gland tumor D. Composed of chondromyxoid stroma and epithelium and recurs if incompletely excised or ruptured intraoperatively." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.007
    kind: mcq
    topic: oral-pathologies
    stem: >-
      A 62-year-old man who has smoked 1 pack a day for 40 years notices a slowly growing, painless
      swelling in front of his left ear. On examination there is a soft, mobile mass; a similar smaller
      mass is felt on the right. Facial nerve function is normal. Biopsy would most likely show which
      feature?
    options:
      - Cystic spaces lined by epithelium over lymphoid tissue with germinal centers
      - Chondromyxoid stroma mixed with epithelium
      - Mixed mucinous and squamous cells
      - Keratin pearls invading the dermis
      - Noncaseating granulomas
    answer: 0
    why:
      - "Right. Warthin tumor is a benign cystic tumor with germinal centers, may be bilateral, and is typical in people who smoke (\"Warriors from Germany love smoking\")."
      - "Chondromyxoid stroma is pleomorphic adenoma, usually unilateral and not linked to smoking."
      - "Mucinous plus squamous components is mucoepidermoid carcinoma, the most common malignant salivary tumor."
      - "Keratin pearls suggest squamous cell carcinoma, which would not be bilateral, soft and mobile."
      - "Granulomas suggest sarcoidosis, which is not a tumor."
    src: { page: 383, quote: "Warthin tumor (papillary cystadenoma lymphomatosum)—benign cystic tumor with germinal centers. May be bilateral or multifocal. Typically found in people who smoke." }
    status: unverified
  # ---------- p383: achalasia ----------
  - id: gi.L04.008
    kind: card
    topic: achalasia
    front: What is the mechanism of achalasia?
    back: Failure of the LES to relax, due to degeneration of inhibitory neurons (containing NO and VIP) in the myenteric (Auerbach) plexus of the esophageal wall.
    src: { page: 383, quote: "Failure of LES to relax due to degeneration of inhibitory neurons (containing NO and VIP) in the myenteric (Auerbach) plexus of esophageal wall." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.009
    kind: card
    topic: achalasia
    front: What are the causes of achalasia?
    back: 1° idiopathic; 2° from Chagas disease (T cruzi infection) or extraesophageal malignancies (mass effect or paraneoplastic).
    src: { page: 383, quote: "1° idiopathic. 2° from Chagas disease (T cruzi infection) or extraesophageal malignancies (mass effect or paraneoplastic)." }
    status: unverified
  - id: gi.L04.010
    kind: card
    topic: achalasia
    front: How does dysphagia in achalasia differ from mechanical obstruction, and what risk does achalasia carry?
    back: Achalasia gives progressive dysphagia to both solids and liquids (obstruction is primarily solids). It is associated with ↑ risk of esophageal cancer.
    src: { page: 383, quote: "Presents with progressive dysphagia to solids and liquids (vs obstruction—primarily solids). Associated with ↑ risk of esophageal cancer." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.011
    kind: cloze
    topic: achalasia
    text: In achalasia, manometry shows uncoordinated or absent peristalsis with {{c1::↑ LES resting pressure}}, and barium swallow shows a dilated esophagus with distal stenosis ({{c2::"bird's beak"}}). Treatment includes surgery and endoscopic procedures (eg, {{c3::botulinum toxin}} injection).
    src: { page: 383, quote: "Manometry findings include uncoordinated or absent peristalsis with ↑ LES resting pressure. Barium swallow shows dilated esophagus with area of distal stenosis (“bird’s beak” A )." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.012
    kind: mcq
    topic: achalasia
    stem: >-
      A 38-year-old woman from rural Bolivia has had 2 years of progressive difficulty swallowing both
      solids and liquids, with regurgitation of undigested food at night. Barium swallow shows a dilated
      esophagus tapering to a narrow distal segment. Esophageal biopsy is most likely to show loss of
      which neurons?
    options:
      - Inhibitory neurons containing NO and VIP in the myenteric plexus
      - Cholinergic excitatory neurons in the submucosal plexus
      - Vagal motor fibers to striated muscle of the upper esophagus
      - Sympathetic fibers from the celiac ganglion
      - Interstitial cells of Cajal in the stomach
    answer: 0
    why:
      - "Right. Achalasia is failure of LES relaxation from degeneration of inhibitory NO/VIP neurons in the myenteric (Auerbach) plexus; Chagas disease (T cruzi) is a 2° cause."
      - "Losing excitatory neurons would not keep the LES tightly closed."
      - "Upper esophageal striated muscle is not where the obstruction is."
      - "Sympathetic fibers are not the lost inhibitory neurons."
      - "Interstitial cells of Cajal set slow waves; the book does not tie them to achalasia."
    src: { page: 383, quote: "2° from Chagas disease (T cruzi infection) or extraesophageal malignancies (mass effect or paraneoplastic). Chagas disease can cause achalasia." }
    status: unverified
  # ---------- p384: other esophageal pathologies ----------
  - id: gi.L04.013
    kind: card
    topic: other-esophageal-pathologies
    front: What causes GERD, how does it present, and what are its complications?
    back: Transient decreases in LES tone. Heartburn, regurgitation, dysphagia; also chronic cough and hoarseness (laryngopharyngeal reflux); associated with asthma. Complications are erosive esophagitis, strictures and Barrett esophagus.
    src: { page: 384, quote: "Transient decreases in LES tone. Commonly presents as heartburn, regurgitation, dysphagia." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.014
    kind: table
    topic: other-esophageal-pathologies
    title: Types of esophagitis
    columns: [Type, Cause or features]
    rows:
      - [Reflux (erosive), "Most common type; 2° to GERD"]
      - [Medication-induced, "Bisphosphonates, tetracyclines, NSAIDs, ferrous sulfate, potassium chloride"]
      - [Eosinophilic, "Chronic, immune-mediated; atopic disorders (eg, asthma); rings and linear furrows on endoscopy"]
      - [Infectious, "Candida (most common; white pseudomembranes), HSV-1 (punched-out ulcers), CMV (linear ulcers); immunosuppression"]
      - [Corrosive, Caustic ingestion]
    blanks: [[1, 1], [2, 1], [3, 1]]
    src: { page: 384, quote: "Infectious esophagitis—Candida (most common; white pseudomembranes A ), HSV-1 (punched-out ulcers), CMV (linear ulcers)." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.015
    kind: card
    topic: other-esophageal-pathologies
    front: What is the triad of Plummer-Vinson syndrome, and what cancer does it predispose to?
    back: Dysphagia, iron deficiency anemia and esophageal webs; it may come with glossitis. ↑ risk of esophageal squamous cell carcinoma ("Plumber dies").
    src: { page: 384, quote: "Triad of dysphagia, iron deficiency anemia, esophageal webs. ↑ risk of esophageal squamous cell carcinoma (\"Plumber dies\")." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.016
    kind: table
    topic: other-esophageal-pathologies
    title: Mallory-Weiss vs Boerhaave
    columns: ["", Mallory-Weiss syndrome, Boerhaave syndrome]
    rows:
      - [Depth, "Partial thickness, longitudinal lacerations confined to mucosa/submucosa", "Transmural rupture, usually distal esophagus"]
      - [Cause, Severe vomiting, Violent retching]
      - [Clinical, "Hematemesis +/- abdominal or back pain; alcohol use disorder, bulimia", "Pneumomediastinum and subcutaneous emphysema can indicate dissecting air"]
    blanks: [[0, 1], [0, 2]]
    src: { page: 384, quote: "Partial thickness, longitudinal lacerations of gastroesophageal junction, confined to mucosa/ submucosa, due to severe vomiting." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.017
    kind: card
    topic: other-esophageal-pathologies
    front: What are esophageal varices?
    back: Dilated submucosal veins in the lower 1/3 of the esophagus, 2° to portal hypertension. Common in cirrhosis; may cause life-threatening hematemesis.
    src: { page: 384, quote: "Dilated submucosal veins (red arrows in B ) in lower 1/3 of esophagus 2° to portal hypertension." }
    status: unverified
  - id: gi.L04.018
    kind: card
    topic: other-esophageal-pathologies
    front: What is distal esophageal spasm, how is it diagnosed and treated?
    back: Spontaneous nonperistaltic (uncoordinated) contractions with normal LES pressure, causing dysphagia and anginalike chest pain; "corkscrew" esophagus on barium swallow. Manometry is diagnostic. Treatment includes nitrates and CCBs.
    src: { page: 384, quote: "Spontaneous, nonperistaltic (uncoordinated) contractions of the esophagus with normal LES pressure. Presents with dysphagia and anginalike chest pain." }
    status: unverified
  - id: gi.L04.019
    kind: card
    topic: other-esophageal-pathologies
    front: How does scleroderma affect the esophagus?
    back: Smooth muscle atrophy and fibrosis → ↓ LES pressure and distal dysmotility → acid reflux and dysphagia → stricture, Barrett esophagus and aspiration. Part of CREST syndrome.
    src: { page: 384, quote: "Esophageal smooth muscle atrophy and fibrosis → ↓ LES pressure and distal esophageal dysmotility → acid reflux and dysphagia → stricture, Barrett esophagus, and aspiration." }
    status: unverified
  - id: gi.L04.020
    kind: card
    topic: other-esophageal-pathologies
    front: What is the most common cause of esophageal perforation?
    back: Iatrogenic, after esophageal instrumentation. Noniatrogenic causes are spontaneous rupture, foreign body ingestion, trauma and malignancy.
    src: { page: 384, quote: "Most commonly iatrogenic following esophageal instrumentation. Noniatrogenic causes include spontaneous rupture, foreign body ingestion, trauma, malignancy." }
    status: unverified
  - id: gi.L04.021
    kind: mcq
    topic: other-esophageal-pathologies
    stem: >-
      A 44-year-old man with alcohol use disorder has repeated forceful retching after a binge. He then
      develops severe retrosternal chest pain. He is febrile, and crepitus is felt over the neck and upper
      chest. Chest x-ray shows air outlining the mediastinum. Which lesion is most likely?
    options:
      - Transmural rupture of the distal esophagus
      - Partial-thickness mucosal laceration at the gastroesophageal junction
      - Rupture of dilated submucosal esophageal veins
      - Uncoordinated nonperistaltic esophageal contractions
      - Candida esophagitis with white pseudomembranes
    answer: 0
    why:
      - "Right. Boerhaave syndrome is a transmural, usually distal, esophageal rupture from violent retching; pneumomediastinum and subcutaneous emphysema mark dissecting air."
      - "Mallory-Weiss tears are partial thickness and present with hematemesis, not mediastinal air."
      - "Variceal rupture gives massive hematemesis, not air in the mediastinum."
      - "Distal esophageal spasm gives chest pain and dysphagia, not perforation."
      - "Candida esophagitis causes odynophagia, not crepitus."
    src: { page: 384, quote: "Boerhaave syndrome—transmural, usually distal esophageal rupture due to violent retching." }
    status: unverified
  - id: gi.L04.022
    kind: mcq
    topic: other-esophageal-pathologies
    stem: >-
      A 19-year-old man with asthma and allergic rhinitis has had intermittent food impaction and
      difficulty swallowing solids for a year. A PPI trial did not help. Endoscopy shows multiple
      concentric rings and linear furrows along the esophagus. Biopsy is most likely to show which cell
      predominating?
    options:
      - Eosinophils
      - Neutrophils
      - Goblet cells in columnar epithelium
      - Multinucleated giant cells with intranuclear inclusions
      - Budding yeast and pseudohyphae
    answer: 0
    why:
      - "Right. Eosinophilic esophagitis is chronic, immune-mediated and eosinophil-predominant, associated with atopy, with rings and linear furrows on endoscopy."
      - "Neutrophils dominate in acute infectious or reflux injury."
      - "Goblet cells in columnar epithelium are Barrett esophagus."
      - "Multinucleated cells with inclusions suggest HSV-1 (punched-out ulcers)."
      - "Yeast and pseudohyphae are Candida, with white pseudomembranes."
    src: { page: 384, quote: "Eosinophilic esophagitis—chronic, immune-mediated, eosinophil-predominant. Associated with atopic disorders (eg, asthma). Esophageal rings and linear furrows on endoscopy." }
    status: unverified
  # ---------- p385: Barrett esophagus ----------
  - id: gi.L04.023
    kind: card
    topic: barrett-esophagus
    front: What is Barrett esophagus, what causes it, and what risk does it carry?
    back: Specialized intestinal metaplasia of the distal esophagus, where nonkeratinized stratified squamous epithelium is replaced by intestinal epithelium (nonciliated columnar with goblet cells). Due to chronic GERD. ↑ risk of esophageal adenocarcinoma.
    src: { page: 385, quote: "replacement of nonkeratinized stratified squamous epithelium with intestinal epithelium (nonciliated columnar with goblet cells [arrows in B ]) in distal esophagus. Due to chronic gastroesophageal reflux disease (GERD)." }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.024
    kind: mcq
    topic: barrett-esophagus
    stem: >-
      A 57-year-old obese man has had heartburn most days for 15 years, self-treated with antacids.
      Endoscopy shows salmon-colored mucosa extending 4 cm above the gastroesophageal junction. Biopsy of
      this area is most likely to show which epithelium?
    options:
      - Nonciliated columnar epithelium with goblet cells
      - Nonkeratinized stratified squamous epithelium
      - Keratinized stratified squamous epithelium
      - Ciliated pseudostratified columnar epithelium
      - Gastric body mucosa with parietal and chief cells
    answer: 0
    why:
      - "Right. Barrett esophagus is intestinal metaplasia: nonciliated columnar epithelium with goblet cells replacing squamous epithelium, from chronic GERD; it raises the risk of adenocarcinoma."
      - "Nonkeratinized stratified squamous is the normal esophageal lining that Barrett replaces."
      - "The esophagus is nonkeratinized."
      - "Ciliated pseudostratified epithelium lines the airway."
      - "The book defines Barrett as intestinal-type epithelium with goblet cells."
    src: { page: 385, quote: "Specialized intestinal metaplasia (arrow in A )—replacement of nonkeratinized stratified squamous epithelium with intestinal epithelium" }
    status: unverified
  # ---------- p385: esophageal cancer ----------
  - id: gi.L04.025
    kind: card
    topic: esophageal-cancer
    front: How does esophageal cancer present, and why is its course aggressive?
    back: Progressive dysphagia (first solids, then liquids) and weight loss. The esophageal wall lacks serosa, allowing rapid extension; prognosis is poor because disease is advanced at presentation.
    src: { page: 385, quote: "Typically presents with progressive dysphagia (first solids, then liquids) and weight loss. Aggressive course due to lack of serosa in esophageal wall, allowing rapid extension." }
    status: unverified
  - id: gi.L04.026
    kind: table
    topic: esophageal-cancer
    title: Esophageal cancer types
    columns: ["", Squamous cell carcinoma, Adenocarcinoma]
    rows:
      - [Part affected, Upper 2/3, Lower 1/3]
      - [Risk factors, "Alcohol, hot liquids, caustic strictures, smoking, achalasia, nitrosamine-rich foods", "Chronic GERD, Barrett esophagus, obesity, tobacco smoking"]
      - [Prevalence, More common worldwide, More common in America]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 385, quote: "Squamous cell carcinoma Upper 2/3 Alcohol, hot liquids, caustic strictures, smoking, achalasia, nitrosamine-rich foods More common worldwide" }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.027
    kind: mcq
    topic: esophageal-cancer
    stem: >-
      A 66-year-old man has had 4 months of difficulty swallowing meat and bread, which now includes
      liquids, and a 9-kg weight loss. He has drunk heavily for 40 years, smokes, and likes his tea very
      hot. Endoscopy shows an ulcerated mass in the mid esophagus. Which histology is most likely?
    options:
      - Squamous cell carcinoma
      - Adenocarcinoma arising in Barrett mucosa
      - Gastrointestinal stromal tumor
      - Small cell carcinoma
      - MALT lymphoma
    answer: 0
    why:
      - "Right. Squamous cell carcinoma affects the upper 2/3 and is linked to alcohol, hot liquids and smoking."
      - "Adenocarcinoma affects the lower 1/3 and follows chronic GERD, Barrett esophagus and obesity."
      - "GIST is a gastric tumor in the book's list, not this esophageal picture."
      - "Small cell carcinoma is not a type the book lists for the esophagus."
      - "MALT lymphoma is linked to H pylori in the stomach."
    src: { page: 385, quote: "Squamous cell carcinoma Upper 2/3 Alcohol, hot liquids, caustic strictures, smoking, achalasia, nitrosamine-rich foods" }
    status: unverified
  # ---------- p386: gastritis ----------
  - id: gi.L04.028
    kind: table
    topic: gastritis
    title: Causes of acute gastritis (erosions)
    columns: [Cause, Mechanism]
    rows:
      - [NSAIDs, ↓ PGE2 → ↓ gastric mucosa protection]
      - [Burns (Curling ulcer), Hypovolemia → mucosal ischemia]
      - [Brain injury (Cushing ulcer), ↑ vagal stimulation → ↑ ACh → ↑ H+ production]
    blanks: [[0, 1], [1, 1], [2, 1]]
    src: { page: 386, quote: "Burns (Curling ulcer)—hypovolemia → mucosal ischemia Brain injury (Cushing ulcer)—↑ vagal stimulation → ↑ ACh → ↑ H+ production" }
    status: unverified
