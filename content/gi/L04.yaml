    front: What is the defect in Wilson disease, and what does it do to ceruloplasmin and copper?
    back: Autosomal recessive mutations in the hepatocyte copper-transporting ATPase (ATP7B, chromosome 13) → ↓ copper incorporation into apoceruloplasmin and ↓ excretion into bile → ↓ serum ceruloplasmin, copper accumulation (liver, brain/basal ganglia, cornea, kidneys) and ↑ urine copper.
    src: { page: 402, quote: "Autosomal recessive mutations in hepatocyte copper-transporting ATPase (ATP7B gene; chromosome 13) → ↓ copper incorporation into apoceruloplasmin and excretion into bile → ↓ serum ceruloplasmin." }
