  - id: gi.L04.029
    kind: card
    topic: gastritis
    front: What are the book's mnemonics for Curling and Cushing ulcers?
    back: "\"Burned by the Curling iron\" (burns → Curling ulcer). \"Always Cushion the brain\" (brain injury → Cushing ulcer)."
    src: { page: 386, quote: "Burned by the Curling iron Always Cushion the brain" }
    status: unverified
  - id: gi.L04.030
    kind: card
    topic: gastritis
    front: What does chronic gastritis lead to?
    back: Mucosal inflammation, often leading to atrophy (hypochlorhydria → hypergastrinemia) and intestinal metaplasia (↑ risk of gastric cancers).
    src: { page: 386, quote: "Mucosal inflammation, often leading to atrophy (hypochlorhydria → hypergastrinemia) and intestinal metaplasia (↑ risk of gastric cancers)" }
    status: unverified
  - id: gi.L04.031
    kind: table
    topic: gastritis
    title: Chronic gastritis
    columns: ["", H pylori, Autoimmune]
    rows:
      - [Frequency, Most common, ""]
      - [Mechanism, Infection, "Autoantibodies (T-cell induced) to the H+/K+-ATPase of parietal cells and to intrinsic factor"]
      - [Risk, "Peptic ulcer disease, MALT lymphoma", Pernicious anemia]
      - [Site, "Antrum first, spreads to the body", Body/fundus]
    blanks: [[1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 386, quote: "Autoantibodies (T-cell induced) to the H+ /K+ -ATPase on parietal cells and to intrinsic factor. ↑ risk of pernicious anemia Affects body/fundus of stomach" }
    status: unverified
    tags: [high-yield]
  - id: gi.L04.032
    kind: mcq
    topic: gastritis
    stem: >-
      A 32-year-old man is in the burn unit with 45% total body surface area burns. On day 4 he vomits
      blood and his hemoglobin falls by 3 g/dL. Endoscopy shows multiple shallow gastric erosions. Which
      mechanism best explains the lesions?
    options:
      - Hypovolemia causing mucosal ischemia
      - Increased vagal stimulation raising acid production
      - Decreased PGE2 from NSAID use
      - Autoantibodies against the parietal cell proton pump
      - Chronic H pylori infection of the antrum
    answer: 0
    why:
      - "Right. A Curling ulcer follows burns: hypovolemia → mucosal ischemia (\"Burned by the Curling iron\")."
      - "↑ vagal stimulation and ↑ ACh is the Cushing ulcer of brain injury."
      - "NSAIDs reduce PGE2 and mucosal protection, but nothing here suggests NSAID use."
