  # ---------- p382: bilirubin ----------
  - id: gi.L03.050
    kind: order
    topic: bilirubin
    prompt: Put the steps of bilirubin metabolism in order.
    steps:
      - Heme is metabolized by heme oxygenase to biliverdin (green)
      - Biliverdin is reduced to bilirubin (yellow-brown)
      - Unconjugated bilirubin travels in blood bound to albumin
      - The liver removes it and conjugates it with glucuronate (UDP-glucuronosyltransferase)
      - Conjugated bilirubin is excreted in bile
      - Gut bacteria convert it to urobilinogen
    src: { page: 382, quote: "Heme is metabolized by heme oxygenase to biliverdin (green), which is subsequently reduced to bilirubin (yellow-brown). Unconjugated bilirubin is removed from blood by liver, conjugated with glucuronate, and excreted in bile." }
