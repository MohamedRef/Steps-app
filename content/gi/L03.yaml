      - ["Proteases (trypsin, chymotrypsin, elastase, carboxypeptidases A and B)", Protein digestion, Proenzymes (zymogens)]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2]]
    src: { page: 380, quote: "ENZYME ROLE NOTES α-amylase Starch digestion Secreted in active form Lipases Lipid digestion Secreted in active form Proteases Protein digestion Includes trypsin, chymotrypsin, elastase, carboxypeptidases A and B Secreted as proenzymes also called zymogens" }
    status: unverified
  - id: gi.L03.030
    kind: card
    topic: pancreatic-secretions
    front: Which enzyme converts trypsinogen to trypsin, and where is it?
    back: Enterokinase (enteropeptidase), a brush-border enzyme of the duodenal and jejunal mucosa.
    src: { page: 380, quote: "Converted to trypsin by enterokinase/ enteropeptidase, a brush-border enzyme on duodenal and jejunal mucosa" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.031
    kind: card
    topic: pancreatic-secretions
    front: Where are dipeptides and tripeptides broken down?
    back: Within the intestinal mucosa, by an intracellular process.
    src: { page: 380, quote: "Dipeptides and tripeptides degraded within intestinal mucosa via intracellular process" }
    status: unverified
  - id: gi.L03.032
    kind: mcq
    topic: pancreatic-secretions
    stem: >-
      A 4-month-old boy has failure to thrive, edema and loose stools. Sweat chloride is normal.
      Pancreatic amylase and lipase activity in duodenal fluid are normal, but trypsin, chymotrypsin and
      carboxypeptidase activities are all very low; adding a brush-border extract to the fluid restores
      them. Deficiency of which enzyme best explains the findings?
    options:
      - Enteropeptidase
      - Trypsinogen
      - α-amylase
      - Pancreatic lipase
      - Pepsin
    answer: 0
    why:
      - "Right. Enterokinase, a duodenal and jejunal brush-border enzyme, converts trypsinogen to trypsin, which then activates the other proteases; without it all protease activity falls."
      - "Trypsinogen is present; the brush-border extract activates it, so the missing piece is the activator."
      - "Amylase is secreted in its active form and is normal here."
      - "Lipase is secreted active and is normal here."
      - "Pepsin is a gastric enzyme, not part of duodenal fluid activation."
    src: { page: 380, quote: "Trypsinogen Converted to active enzyme trypsin → activation of other proenzymes and cleavage of additional trypsinogen molecules into active trypsin (positive feedback loop) Converted to trypsin by enterokinase/ enteropeptidase, a brush-border enzyme on duodenal and jejunal mucosa" }
    status: unverified
