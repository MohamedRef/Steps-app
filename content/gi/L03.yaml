  - id: gi.L03.033
    kind: table
    topic: carbohydrate-absorption
    title: Monosaccharide transporters of the enterocyte
    columns: [Sugar, Apical uptake, To blood]
    rows:
      - ["Glucose, galactose", SGLT1 (Na+ dependent), GLUT2]
      - [Fructose, GLUT5 (facilitated diffusion), GLUT2]
    blanks: [[0, 1], [1, 1], [0, 2]]
    src: { page: 381, quote: "Glucose and galactose are taken up by SGLT1 (Na+ dependent). Fructose is taken up via facilitated diffusion by GLUT5. All are transported to blood by GLUT2." }
