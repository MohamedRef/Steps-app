  # ---------- p378: GI regulatory substances ----------
  - id: gi.L03.001
    kind: table
    topic: gi-regulatory-substances
    title: GI regulatory substances and their sources
    columns: [Substance, Source]
    rows:
      - [Gastrin, "G cells (antrum of stomach, duodenum)"]
      - [Ghrelin, Stomach]
      - [Somatostatin, "D cells (pancreatic islets, GI mucosa)"]
      - [Cholecystokinin, "I cells (duodenum, jejunum)"]
      - [Secretin, S cells (duodenum)]
      - [Glucose-dependent insulinotropic peptide, "K cells (duodenum, jejunum)"]
      - [Motilin, Small intestine]
      - [Vasoactive intestinal polypeptide, "Parasympathetic ganglia in sphincters, gallbladder, small intestine"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1]]
    src: { page: 378, quote: "REGULATORY SUBSTANCE SOURCE ACTION REGULATION NOTES Gastrin G cells (antrum of stomach, duodenum) ↑ gastric H+ secretion ↑ gastric motility ↑ growth of gastric mucosa ↑ by stomach distention/ alkalinization, amino acids, peptides, vagal stimulation via gastrin-releasing peptide (GRP) ↓ by pH <1.5 ↑ by chronic PPI use ↑ in chronic atrophic gastritis (eg, H pylori) ↑↑ in Zollinger-Ellison syndrome (gastrinoma) Ghrelin Stomach ↑ appetite (“ghrowlin’ stomach”) ↑ in fasting state ↓ by food ↑ in Prader-Willi syndrome ↓ after gastric bypass surgery Somatostatin D cells (pancreatic islets, GI mucosa) ↓ gastric acid and pepsinogen secretion ↓ pancreatic and small intestine fluid secretion ↓ gallbladder contraction ↓ insulin and glucagon release ↑ by acid ↓ by vagal stimulation Inhibits secretion of various hormones (encourages somato-stasis) Octreotide is an analog used to treat acromegaly, carcinoid syndrome, VIPoma, and variceal bleeding Cholecystokinin I cells (duodenum, jejunum) ↑ pancreatic secretion ↑ gallbladder contraction ↓ gastric emptying ↑ sphincter of Oddi relaxation ↑ by fatty acids, amino acids Acts on neural muscarinic pathways to cause pancreatic secretion Secretin S cells (duodenum) ↑ pancreatic HCO – 3 secretion ↓ gastric acid secretion ↑ bile secretion ↑ by acid, fatty acids in lumen of duodenum ↑ neutralizes gastric acid in duodenum, allowing pancreatic enzymes to function HCO – 3 Glucose- dependent insulinotropic peptide K cells (duodenum, jejunum) Exocrine: ↓ gastric H+ secretion Endocrine: ↑ insulin release ↑ by fatty acids, amino acids, oral glucose Also called gastric inhibitory peptide (GIP) Oral glucose load ↑ insulin compared to IV equivalent due to GIP secretion Motilin Small intestine Produces migrating motor complexes (MMCs) ↑ in fasting state Motilin receptor agonists (eg, erythromycin) are used to stimulate intestinal peristalsis. Vasoactive intestinal polypeptide Parasympathetic ganglia in sphincters, gallbladder, small intestine ↑ intestinal water and electrolyte secretion ↑ relaxation of intestinal smooth muscle and sphincters ↓ gastric acid secretion ↑ by distention and vagal stimulation ↓ by adrenergic input VIPoma—non-α, non-β islet cell pancreatic tumor that secretes VIP; associated with Watery Diarrhea, Hypokalemia, Achlorhydria (WDHA syndrome) Nitric oxide ↑ smooth muscle relaxation, including lower esophageal sphincter (LES) Loss of NO secretion is implicated in ↑ LES tone of achalasia" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.002
    kind: card
    topic: gi-regulatory-substances
    front: What are the three actions of gastrin?
    back: ↑ gastric H+ secretion, ↑ gastric motility, and ↑ growth of the gastric mucosa.
    src: { page: 378, quote: "↑ gastric H+ secretion ↑ gastric motility ↑ growth of gastric mucosa" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.003
    kind: card
    topic: gi-regulatory-substances
    front: Below which gastric pH is gastrin release decreased?
    back: Below pH 1.5 (acid switches gastrin off).
    src: { page: 378, quote: "↑ by stomach distention/ alkalinization, amino acids, peptides, vagal stimulation via gastrin-releasing peptide (GRP) ↓ by pH <1.5" }
    status: unverified
  - id: gi.L03.004
    kind: enumerate
    topic: gi-regulatory-substances
    prompt: Enumerate the conditions in which gastrin is raised (3).
    points:
      - Chronic PPI use
      - Chronic atrophic gastritis (eg, H pylori)
      - Zollinger-Ellison syndrome (gastrinoma), ↑↑
    pass: 3
    hook: "3 بيرفعوا الـ gastrin: الـ PPI، والـ atrophic gastritis، والـ gastrinoma (ودي بترفعه ↑↑)."
    src: { page: 378, quote: "↑ by chronic PPI use ↑ in chronic atrophic gastritis (eg, H pylori) ↑↑ in Zollinger-Ellison syndrome (gastrinoma)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.005
    kind: card
    topic: gi-regulatory-substances
    front: What does ghrelin do?
    back: "It ↑ appetite (the book's \"ghrowlin' stomach\")."
    src: { page: 378, quote: "Ghrelin Stomach ↑ appetite (“ghrowlin’ stomach”)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.006
    kind: card
    topic: gi-regulatory-substances
    front: "What is somatostatin's overall effect on hormone secretion?"
    back: "It inhibits the secretion of various hormones: it encourages \"somato-stasis\"."
    src: { page: 378, quote: "↓ gastric acid and pepsinogen secretion ↓ pancreatic and small intestine fluid secretion ↓ gallbladder contraction ↓ insulin and glucagon release ↑ by acid ↓ by vagal stimulation Inhibits secretion of various hormones (encourages somato-stasis)" }
    status: unverified
  - id: gi.L03.007
    kind: cloze
    topic: gi-regulatory-substances
    text: Somatostatin is increased by {{c1::acid}} and decreased by {{c2::vagal stimulation}}.
    src: { page: 378, quote: "↑ by acid ↓ by vagal stimulation" }
    status: unverified
  - id: gi.L03.008
    kind: enumerate
    topic: gi-regulatory-substances
    prompt: Enumerate the uses of octreotide, the somatostatin analog (4).
    points:
      - Acromegaly
      - Carcinoid syndrome
      - VIPoma
      - Variceal bleeding
    pass: 4
    src: { page: 378, quote: "Octreotide is an analog used to treat acromegaly, carcinoid syndrome, VIPoma, and variceal bleeding" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.009
    kind: card
    topic: gi-regulatory-substances
    front: What are the actions of cholecystokinin (CCK)?
    back: ↑ pancreatic secretion, ↑ gallbladder contraction, ↓ gastric emptying, ↑ sphincter of Oddi relaxation.
    src: { page: 378, quote: "↑ pancreatic secretion ↑ gallbladder contraction ↓ gastric emptying ↑ sphincter of Oddi relaxation" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.054
    kind: cloze
    topic: gi-regulatory-substances
    text: Cholecystokinin is released by {{c1::I}} cells of the duodenum and jejunum, and its release is increased by {{c2::fatty acids and amino acids}}.
    src: { page: 378, quote: "Cholecystokinin I cells (duodenum, jejunum) ↑ pancreatic secretion ↑ gallbladder contraction ↓ gastric emptying ↑ sphincter of Oddi relaxation ↑ by fatty acids, amino acids" }
    status: unverified
  - id: gi.L03.055
    kind: card
    topic: gi-regulatory-substances
    front: Through which pathways does CCK cause pancreatic secretion?
    back: Neural muscarinic pathways.
    src: { page: 378, quote: "Acts on neural muscarinic pathways to cause pancreatic secretion" }
    status: unverified
  - id: gi.L03.010
    kind: card
    topic: gi-regulatory-substances
    front: What are the actions of secretin?
    back: ↑ pancreatic HCO3- secretion, ↓ gastric acid secretion, ↑ bile secretion.
    src: { page: 378, quote: "↑ pancreatic HCO3– secretion ↓ gastric acid secretion ↑ bile secretion" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.056
    kind: cloze
    topic: gi-regulatory-substances
    text: Secretin release from duodenal S cells is increased by {{c1::acid}} and {{c2::fatty acids}} in the lumen of the duodenum.
    src: { page: 378, quote: "↑ by acid, fatty acids in lumen of duodenum" }
    status: unverified
  - id: gi.L03.057
    kind: card
    topic: gi-regulatory-substances
    front: Why does the HCO3- that secretin releases matter for digestion?
    back: It neutralizes gastric acid in the duodenum, which lets pancreatic enzymes function.
    src: { page: 378, quote: "neutralizes gastric acid in duodenum, allowing pancreatic enzymes to function" }
    status: unverified
  - id: gi.L03.011
    kind: card
    topic: gi-regulatory-substances
    front: Why does an oral glucose load raise insulin more than the same glucose given IV?
    back: Oral glucose makes K cells secrete GIP, which ↑ insulin release; IV glucose skips the gut.
    src: { page: 378, quote: "Glucose- dependent insulinotropic peptide K cells (duodenum, jejunum) Exocrine: ↓ gastric H+ secretion Endocrine: ↑ insulin release ↑ by fatty acids, amino acids, oral glucose Also called gastric inhibitory peptide (GIP) Oral glucose load ↑ insulin compared to IV equivalent due to GIP secretion" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.058
    kind: cloze
    topic: gi-regulatory-substances
    text: Glucose-dependent insulinotropic peptide is also called {{c1::gastric inhibitory peptide}} (GIP); its release from K cells is increased by fatty acids, amino acids and {{c2::oral glucose}}.
    src: { page: 378, quote: "↑ by fatty acids, amino acids, oral glucose Also called gastric inhibitory peptide (GIP)" }
    status: unverified
  - id: gi.L03.012
    kind: card
    topic: gi-regulatory-substances
    front: What does motilin produce?
    back: Migrating motor complexes (MMCs).
    src: { page: 378, quote: "Motilin Small intestine Produces migrating motor complexes (MMCs)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.013
    kind: card
    topic: gi-regulatory-substances
    front: What are the actions of vasoactive intestinal polypeptide (VIP)?
    back: ↑ intestinal water and electrolyte secretion, ↑ relaxation of intestinal smooth muscle and sphincters, ↓ gastric acid secretion.
    src: { page: 378, quote: "↑ intestinal water and electrolyte secretion ↑ relaxation of intestinal smooth muscle and sphincters ↓ gastric acid secretion" }
    status: unverified
  - id: gi.L03.059
    kind: cloze
    topic: gi-regulatory-substances
    text: VIP release is increased by {{c1::distention}} and {{c2::vagal stimulation}}, and decreased by {{c3::adrenergic input}}.
    src: { page: 378, quote: "↑ by distention and vagal stimulation ↓ by adrenergic input" }
    status: unverified
  - id: gi.L03.014
    kind: cloze
    topic: gi-regulatory-substances
    text: A VIPoma is a non-α, non-β islet cell pancreatic tumor; it causes {{c1::WDHA}} syndrome (watery diarrhea, {{c2::hypokalemia}}, {{c3::achlorhydria}}).
    src: { page: 378, quote: "VIPoma—non-α, non-β islet cell pancreatic tumor that secretes VIP; associated with Watery Diarrhea, Hypokalemia, Achlorhydria (WDHA syndrome)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.015
    kind: card
    topic: gi-regulatory-substances
    front: What does nitric oxide do to gut smooth muscle?
    back: It ↑ smooth muscle relaxation, including the lower esophageal sphincter (LES).
    src: { page: 378, quote: "Nitric oxide ↑ smooth muscle relaxation, including lower esophageal sphincter (LES)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.016
    kind: mcq
    topic: gi-regulatory-substances
    stem: >-
      A 45-year-old woman has had large-volume watery diarrhea for 3 months that persists during a
      48-hour fast. She has muscle weakness. Serum potassium is 2.6 mEq/L. Gastric analysis shows almost
      no acid. CT shows a 3-cm mass in the tail of the pancreas. Which drug would best control her
      diarrhea while she awaits surgery?
    options:
      - Octreotide
      - Omeprazole
      - Erythromycin
      - Metoclopramide
      - Loperamide
    answer: 0
    why:
      - "Right. This is a VIPoma (watery diarrhea, hypokalemia, achlorhydria); octreotide, the somatostatin analog, is used to treat VIPoma by inhibiting hormone secretion."
      - "A PPI lowers acid, but she already has achlorhydria; it does nothing for VIP-driven secretion."
      - "Erythromycin is a motilin agonist that increases peristalsis, worsening diarrhea."
      - "Metoclopramide is a prokinetic; it would not stop secretory diarrhea."
      - "Loperamide slows transit but doesn't stop the hormone; the book's treatment is octreotide."
    src: { page: 378, quote: "Octreotide is an analog used to treat acromegaly, carcinoid syndrome, VIPoma, and variceal bleeding" }
    status: unverified
  - id: gi.L03.017
    kind: mcq
    topic: gi-regulatory-substances
    stem: >-
      A 38-year-old woman has had several episodes of dull right upper quadrant pain with nausea, each
      starting within an hour of a fatty meal and settling after a few hours. Vital signs and labs are
      normal, and ultrasound shows gallstones without gallbladder wall thickening. The hormone that
      triggered the gallbladder contraction behind her pain has which other effect?
    options:
      - Slows gastric emptying
      - Increases gastric acid secretion
      - Contracts the sphincter of Oddi
      - Increases appetite
      - Produces migrating motor complexes
    answer: 0
    why:
      - "Right. CCK from I cells contracts the gallbladder, relaxes the sphincter of Oddi, increases pancreatic secretion and decreases gastric emptying."
      - "Increased gastric acid is gastrin's action."
      - "CCK relaxes, not contracts, the sphincter of Oddi so bile can enter the duodenum."
      - "Increased appetite is ghrelin's action."
      - "Migrating motor complexes are produced by motilin in the fasting state."
    src: { page: 378, quote: "↑ pancreatic secretion ↑ gallbladder contraction ↓ gastric emptying ↑ sphincter of Oddi relaxation" }
    status: unverified
  - id: gi.L03.018
    kind: mcq
    topic: gi-regulatory-substances
    stem: >-
      A 52-year-old man has taken omeprazole daily for 6 years for reflux. A routine blood test shows a
      markedly elevated fasting serum gastrin. Gastric pH is 6. Which mechanism best explains the high
      gastrin?
    options:
      - Loss of acid inhibition of G cells
      - A gastrin-secreting tumor of the pancreas
      - Increased vagal release of gastrin-releasing peptide
      - Increased somatostatin release from D cells
      - Hypertrophy of parietal cells
    answer: 0
    why:
      - "Right. Gastrin is decreased by pH < 1.5; chronic PPI use removes that brake, so gastrin rises."
      - "A gastrinoma raises gastrin with high acid output, not a gastric pH of 6."
      - "GRP does stimulate gastrin, but the PPI's effect is loss of acid feedback."
      - "Somatostatin is stimulated by acid; with low acid it falls, and it inhibits, not raises, gastrin."
      - "Parietal cell hypertrophy can follow high gastrin; it is not the cause."
    src: { page: 378, quote: "↓ by pH <1.5 ↑ by chronic PPI use" }
    status: unverified
  # ---------- p379: GI secretory products ----------
  - id: gi.L03.019
    kind: card
    topic: gi-secretory-products
    front: What stimulates and what inhibits gastric acid secretion by parietal cells?
    back: "Stimulated by histamine, vagal stimulation (ACh) and gastrin. Inhibited by somatostatin, GIP, prostaglandin and secretin."
    src: { page: 379, quote: "↓ stomach pH ↑ by histamine, vagal stimulation (ACh), gastrin ↓ by somatostatin, GIP, prostaglandin, secretin" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.020
    kind: card
    topic: gi-secretory-products
    front: What follows autoimmune destruction of parietal cells?
    back: Chronic gastritis and pernicious anemia (parietal cells are pink/eosinophilic on histology).
    src: { page: 379, quote: "Autoimmune destruction of parietal cells (pink/ eosinophilic histology) → chronic gastritis and pernicious anemia" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.074
    kind: card
    topic: gi-secretory-products
    front: "In the gastric gland, which cells line the gastric pit and neck, and which lie in the upper vs deeper glandular layers?"
    back: "Gastric pit: surface mucous cells; neck: mucous neck cells. Upper glandular layer: parietal cells. Deeper glandular layer: chief cells and enterochromaffin-like (ECL) cells, above the muscularis mucosa and submucosa."
    src: { page: 379, quote: "Gastric pit Upper glandular layer Deeper glandular layer Muscularis mucosa Submucosa Surface mucous cells Mucous neck cell Enterochromaffin- like cell Parietal cell Chief cell" }
    status: unverified
  - id: gi.L03.021
    kind: card
    topic: gi-secretory-products
    front: Which cells make intrinsic factor, and what is it for?
    back: Parietal cells. It is a vitamin B12-binding protein required for B12 uptake in the terminal ileum.
    src: { page: 379, quote: "Intrinsic factor Parietal cells (stomach) Vitamin B12 –binding protein (required for uptake in terminal ileum)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.022
    kind: cloze
    topic: gi-secretory-products
    text: Pepsin comes from {{c1::chief cells}}; it is stimulated by vagal stimulation (ACh) and local acid, and pepsinogen is converted to pepsin in the presence of {{c2::H+}}.
    src: { page: 379, quote: "Pepsin Chief cells (stomach) Protein digestion ↑ by vagal stimulation (ACh), local acid Pepsinogen (inactive) is converted to pepsin (active) in the presence of H+" }
    status: unverified
  - id: gi.L03.023
    kind: card
    topic: gi-secretory-products
    front: Which cells secrete bicarbonate in the gut?
    back: Mucosal cells of the stomach, duodenum, salivary glands and pancreas, and the Brunner glands of the duodenum.
    src: { page: 379, quote: "Bicarbonate Mucosal cells (stomach, duodenum, salivary glands, pancreas) and Brunner glands (duodenum)" }
    status: unverified
  - id: gi.L03.024
    kind: mcq
    topic: gi-secretory-products
    stem: >-
      A 58-year-old woman with vitiligo and Hashimoto thyroiditis has fatigue and numbness in both feet.
      Hemoglobin is 8.9 g/dL with an MCV of 118 fL. Antibodies against intrinsic factor are present.
      Gastric biopsy would most likely show loss of cells with which feature?
    options:
      - Pink (eosinophilic) cytoplasm in the gastric body glands
      - Basophilic cytoplasm with zymogen granules
      - Location in the gastric antrum, releasing gastrin
      - Mucus-filled cytoplasm at the surface
      - Histamine-containing granules
    answer: 0
    why:
      - "Right. Autoimmune destruction of parietal cells, which are pink/eosinophilic, causes chronic gastritis and pernicious anemia (no intrinsic factor, so no B12 uptake)."
      - "Basophilic cells are chief cells, which make pepsinogen."
      - "G cells are in the antrum; autoimmune gastritis spares them, so gastrin rises."
      - "Surface mucous cells make mucus and bicarbonate."
      - "ECL cells release histamine; they are not the target that causes B12 deficiency."
    src: { page: 379, quote: "Autoimmune destruction of parietal cells (pink/ eosinophilic histology) → chronic gastritis and pernicious anemia" }
    status: unverified
  # ---------- p380: locations of secretory cells ----------
  - id: gi.L03.025
    kind: card
    topic: secretory-cell-locations
    front: Through which cell does gastrin mainly raise acid secretion?
    back: Through enterochromaffin-like (ECL) cells, which release histamine, rather than through a direct effect on parietal cells.
    src: { page: 380, quote: "Gastrin ↑ acid secretion primarily through its effects on enterochromaffin-like (ECL) cells (leading to histamine release) rather than through its direct effect on parietal cells." }
    status: unverified
    tags: [high-yield]
  - id: gi.L03.026
    kind: table
    topic: secretory-cell-locations
    title: "Where the secretory cells of the GI tract are"
    columns: [Site, Cells and products]
    rows:
      - ["Fundus and body", "Parietal cells (HCl, intrinsic factor), chief cells (pepsinogen), ECL cells (histamine)"]
      - [Antrum, "G cells (gastrin), D cells (somatostatin)"]
      - [Duodenum, "S cells (secretin), I cells (CCK), K cells (GIP)"]
      - [Pancreas, "Acinar cells (zymogen granules), duct cells (HCO3-)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 380, quote: "I cells S cells K cells Chief cells Parietal cells G cells ECL cells Mucous cells D cells Zymogen granules (trypsinogen, proelastase, chymotrypsinogen, procarboxypeptidases A and B) Acinar cells Pancreatic duct cells Vagus nerve Pyloric sphincter Trypsinogen Trypsin Enterokinase Fundus Cardia Body Pepsinogen Intrinsic factor HCl Duodenum GIP Secretin Antrum CCK Mucus Gastrin (to circulation) Somato- statin HCO3 – CCK-1 receptor GRP ACh ACh ACh Histamine" }
    status: unverified
  - id: gi.L03.027
    kind: mcq
    topic: secretory-cell-locations
    stem: >-
      A 30-year-old man takes famotidine, an H2 receptor blocker, for dyspepsia. A meal stimulates
      gastrin release, but his acid output rises much less than before he started the drug. Why does
      blocking H2 receptors blunt the effect of gastrin?
    options:
      - Gastrin acts mainly via histamine from ECL cells
      - Gastrin acts only on chief cells
      - H2 blockers stop G cells from releasing gastrin
      - Histamine is released by parietal cells themselves
      - Gastrin raises acid mainly through vagal ACh release
    answer: 0
    why:
      - "Right. Gastrin increases acid primarily through ECL cells releasing histamine, not through its direct effect on parietal cells, so blocking H2 receptors blunts it."
      - "Chief cells make pepsinogen; gastrin's acid effect is through ECL cells."
      - "H2 blockers act on parietal cell receptors; they do not block G cells."
      - "Histamine comes from ECL cells, not parietal cells."
      - "Vagal ACh is a separate pathway, also partly via histamine; it is not how gastrin works."
    src: { page: 380, quote: "Gastrin ↑ acid secretion primarily through its effects on enterochromaffin-like (ECL) cells (leading to histamine release)" }
    status: unverified
