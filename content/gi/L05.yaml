  # ---------- Pancreatic adenocarcinoma (p405) ----------
  - id: gi.L05.001
    kind: card
    topic: pancreatic-adenocarcinoma
    front: Where does pancreatic adenocarcinoma arise, and what is its prognosis?
    back: From the pancreatic ducts; very aggressive, often metastatic at presentation, average survival about 1 year after diagnosis.
    src: { page: 405, quote: "Very aggressive tumor arising from pancreatic ducts" }
    status: unverified
  - id: gi.L05.002
    kind: cloze
    topic: pancreatic-adenocarcinoma
    text: Pancreatic adenocarcinoma is more common in the pancreatic {{c1::head}}, so it leads to {{c2::obstructive jaundice}}.
    src: { page: 405, quote: "Tumors more common in pancreatic head B (lead to obstructive jaundice)." }
    status: unverified
    tags: [high-yield]
