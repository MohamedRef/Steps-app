    status: unverified
    tags: [high-yield]
  - id: gi.L05.039
    kind: mcq
    topic: misoprostol
    stem: >-
      A 70-year-old man with severe osteoarthritis needs long-term high-dose naproxen. He had a bleeding
      gastric ulcer 2 years ago. His physician adds a drug to prevent another NSAID-induced ulcer by
      replacing the mucosal factor that NSAIDs deplete. Which adverse effect should he be warned about?
    options:
      - Diarrhea
      - Constipation
      - Gynecomastia
      - Extrapyramidal symptoms
      - Black tongue
    answer: 0
    why:
      - "Right. Misoprostol is a PGE analog that prevents NSAID-induced ulcers (NSAIDs block prostaglandin production); its adverse effect is diarrhea."
      - "Constipation is an effect of aluminum hydroxide or opioid antidiarrheals."
      - "Gynecomastia is cimetidine's antiandrogenic effect."
      - "Extrapyramidal symptoms come from D2 antagonists such as metoclopramide."
      - "A black tongue and stool come from bismuth, not from a prostaglandin analog."
    src: { page: 406, quote: "Prevention of NSAID-induced peptic ulcers (NSAIDs block PGE1 production)." }
    status: unverified

