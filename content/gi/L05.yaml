  - id: gi.L05.072
    kind: mcq
    topic: acid-suppression-therapy
    stem: >-
      A 45-year-old man with a gastrinoma has recurrent duodenal and jejunal ulcers. His serum gastrin is
      markedly elevated. He is to start a drug that suppresses gastric acid no matter whether gastrin,
      histamine or acetylcholine is driving the parietal cell. Which target does this drug act on?
    options:
      - Gastric H+/K+-ATPase
      - "Histamine H2 receptor"
      - "Muscarinic M3 receptor"
      - "CCKB (gastrin) receptor"
      - "Prostaglandin receptor"
    answer: 0
    why:
      - "Right. Gastrin (CCKB), histamine (H2) and ACh (M3) signals all converge on the H+/K+-ATPase; PPIs block it irreversibly and are used in Zollinger-Ellison syndrome."
      - "H2-blockers block only the histamine signal, so gastrin and ACh still drive secretion."
      - "Blocking M3 (eg, atropine) stops only the vagal ACh signal."
      - "The CCKB receptor carries only the gastrin signal."
      - "Prostaglandins (misoprostol) reduce acid through the Gi pathway; they do not block the final common step."
    src: { page: 406, quote: "Peptic ulcer, gastritis, esophageal reflux, Zollinger-Ellison syndrome, component of therapy for H pylori, stress ulcer prophylaxis." }
    status: unverified
