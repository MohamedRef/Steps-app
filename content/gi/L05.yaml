  - id: gi.L05.008
    kind: cloze
    topic: pancreatic-adenocarcinoma
    text: Migratory thrombophlebitis with pancreatic cancer is {{c1::Trousseau}} syndrome; a palpable, nontender gallbladder with obstructive jaundice is the {{c2::Courvoisier}} sign.
    src: { page: 405, quote: "Migratory thrombophlebitis—redness and tenderness on palpation of extremities (Trousseau syndrome) ▘ Obstructive jaundice with palpable, nontender gallbladder (Courvoisier sign)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.009
    kind: mcq
    topic: pancreatic-adenocarcinoma
    stem: >-
      A 68-year-old man who has smoked 2 packs a day for 45 years has had 3 months of dull epigastric pain
      that radiates to his back and a 9-kg weight loss. He is jaundiced, and a nontender, distended
      gallbladder is palpable in the right upper quadrant. Last month he had a tender, red cord in his
      left calf, and now has a new one in his right forearm. Which serum marker is most likely elevated?
    options:
      - CA 19-9
      - α-fetoprotein
      - CA 125
      - Chromogranin A
      - Anti-mitochondrial antibody
    answer: 0
    why:
      - "Right. Painless-feeling jaundice with a palpable gallbladder (Courvoisier sign), migratory thrombophlebitis (Trousseau syndrome) and back pain point to pancreatic head adenocarcinoma, whose marker is CA 19-9."
      - "α-fetoprotein is the marker of hepatocellular carcinoma, which does not obstruct the bile duct like this or cause a palpable gallbladder."
      - "CA 125 is the marker of epithelial ovarian cancer."
      - "Chromogranin A marks neuroendocrine (carcinoid) tumors, which cause flushing and diarrhea rather than this picture."
      - "Anti-mitochondrial antibodies point to primary biliary cholangitis in a middle-aged woman with pruritus, not a smoker with a palpable gallbladder."
    src: { page: 405, quote: "Associated with CA 19-9 tumor marker (also CEA, less specific)." }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.010
    kind: mcq
    topic: pancreatic-adenocarcinoma
    stem: >-
      A 63-year-old woman with type 2 diabetes presents with jaundice, pruritus and clay-colored stools.
      She has no abdominal tenderness, but a smooth, nontender mass is felt under the right costal margin
      and moves with respiration. CT shows a mass in the head of the pancreas and a dilated common bile
      duct. Why is her gallbladder palpable?
    options:
      - Slow, malignant obstruction of the distal common bile duct distends a previously healthy gallbladder
      - A stone impacted in the cystic duct causes acute inflammation
      - Chronic gallstone disease has fibrosed the gallbladder wall
      - The tumor has metastasized to the gallbladder wall
      - Portal hypertension has enlarged the gallbladder
    answer: 0
    why:
      - "Right. The Courvoisier sign: a tumor in the pancreatic head slowly blocks the common bile duct, so bile backs up and distends a gallbladder that was never scarred."
      - "Cystic duct obstruction by a stone is acute cholecystitis, which is tender (Murphy sign) and does not cause jaundice by itself."
      - "Chronic gallstone disease leaves a shrunken, fibrotic gallbladder that cannot distend; that is why a palpable gallbladder points away from stones."
      - "The gallbladder is distended by backed-up bile, not by tumor deposits."
      - "Portal hypertension causes splenomegaly and varices, not a distended gallbladder."
    src: { page: 405, quote: "Obstructive jaundice with palpable, nontender gallbladder (Courvoisier sign)" }
    status: unverified

  # ---------- Acid suppression therapy (p405 figure) ----------
  - id: gi.L05.011
    kind: table
    topic: acid-suppression-therapy
    title: Where each drug acts on acid secretion (book figure)
    columns: [Drug, Target]
    rows:
      - [Atropine, "M3 receptor on the parietal cell (blocks ACh from the vagus)"]
      - [H2 blockers, "H2 receptor (blocks histamine from ECL cells)"]
      - [Proton pump inhibitors, "H+/K+ ATPase (the final common step)"]
      - [Antacids, Neutralize H+ in the lumen]
      - [Misoprostol, "Prostaglandin receptor (Gi) → ↓ cAMP, ↓ acid"]
      - ["Sucralfate, bismuth", Coat the ulcer base in the lumen]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1]]
    src: { page: 405, quote: "Atropine Vagus nerve Gastric parietal cell Lumen Carbonic anhydrase Gq Gs H2 blockers ECL cells G cells cAMP Sucralfate, bismuth GRP Proton pump inhibitors Antacids" }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.012
    kind: card
    topic: acid-suppression-therapy
    front: What is the "alkaline tide"?
    back: ↑ blood pH after gastric acid secretion (eg, after meals or vomiting), because the parietal cell sends HCO3- into the blood for each H+ it secretes.
    src: { page: 405, quote: "”alkaline tide”— ↑ blood pH after gastric acid secretion (eg, after meals, vomiting)" }
    status: unverified
  - id: gi.L05.013
    kind: card
    topic: acid-suppression-therapy
    front: In the book's figure, which G protein couples each parietal cell receptor (M3, CCKB, H2, prostaglandin)?
    back: "M3 and CCKB (gastrin): Gq → IP3/Ca2+. H2 (histamine): Gs → ↑ cAMP. Prostaglandin receptor: Gi → ↓ cAMP."
    src: { page: 405, quote: "Gq Gs H2 blockers ECL cells G cells cAMP" }
    status: unverified

  # ---------- H2-blockers (p406) ----------
  - id: gi.L05.014
