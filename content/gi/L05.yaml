    kind: mcq
    topic: antacids
    stem: >-
      A 58-year-old man with chronic kidney disease takes a large daily dose of an over-the-counter antacid
      for dyspepsia. Over months he develops constipation, bone pain and proximal muscle weakness.
      Serum phosphate is 1.8 mg/dL. Which antacid is he most likely taking?
    options:
      - Aluminum hydroxide
      - Magnesium hydroxide
      - Calcium carbonate
      - Sodium bicarbonate
      - Bismuth subsalicylate
    answer: 0
    why:
      - "Right. CHOPS: constipation, hypophosphatemia, osteodystrophy, proximal muscle weakness, seizures. Aluminum binds phosphate in the gut."
      - "Magnesium hydroxide causes diarrhea, not constipation, and hyporeflexia or hypotension at high levels."
      - "Calcium carbonate causes hypercalcemia (milk-alkali syndrome) and rebound acid, not hypophosphatemic bone disease."
      - "Sodium bicarbonate causes metabolic alkalosis and sodium load; it is not in the book's list of these effects."
      - "Bismuth coats ulcers and can blacken the stool; it does not cause this pattern."
