    back: They alter gastric and urinary pH or delay gastric emptying, changing absorption, bioavailability or urinary excretion of other drugs. All can cause hypokalemia.
    src: { page: 406, quote: "Can affect absorption, bioavailability, or urinary excretion of other drugs by altering gastric and urinary pH or by delaying gastric emptying. All can cause hypokalemia." }
