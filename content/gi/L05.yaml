    topic: misoprostol
    text: Misoprostol prevents {{c1::NSAID-induced peptic ulcers}} (NSAIDs block PGE1 production) and is used off-label for {{c2::induction of labor}} (ripens cervix).
    src: { page: 406, quote: "Prevention of NSAID-induced peptic ulcers (NSAIDs block PGE1 production). Also used off-label for induction of labor (ripens cervix)." }
    status: unverified
