    topic: antacids
    stem: >-
      A 45-year-old woman with peptic ulcer disease has been chewing large amounts of calcium carbonate
      tablets and drinking milk for weeks. She now has confusion, polyuria and constipation. Serum calcium
      is 13.4 mg/dL, bicarbonate is 34 mEq/L and creatinine is 1.9 mg/dL. Which is the most likely diagnosis?
    options:
      - Milk-alkali syndrome
      - Primary hyperparathyroidism
      - Zollinger-Ellison syndrome
      - Hypermagnesemia
      - Vitamin D deficiency
    answer: 0
    why:
      - "Right. Calcium carbonate can cause hypercalcemia (milk-alkali syndrome): hypercalcemia, metabolic alkalosis and acute kidney injury."
      - "Primary hyperparathyroidism causes hypercalcemia but not this alkalosis tied to antacid intake; PTH would be suppressed here."
      - "Zollinger-Ellison causes refractory ulcers and diarrhea, not hypercalcemia with alkalosis (unless MEN1 with hyperparathyroidism, not suggested here)."
      - "Hypermagnesemia comes from magnesium antacids and causes hyporeflexia and hypotension."
      - "Vitamin D deficiency lowers calcium."
    src: { page: 406, quote: "Calcium carbonate Hypercalcemia (milk-alkali syndrome), rebound acid ↑" }
    status: unverified

  # ---------- Bismuth, sucralfate (p406) ----------
  - id: gi.L05.033
    kind: card
    topic: bismuth-sucralfate
    front: How do bismuth and sucralfate work?
    back: They bind the ulcer base, giving physical protection and letting HCO3- secretion re-establish the pH gradient in the mucous layer.
    src: { page: 406, quote: "Bind to ulcer base, providing physical protection and allowing HCO – 3 secretion to reestablish pH gradient in the mucous layer." }
    status: unverified
  - id: gi.L05.034
    kind: card
    topic: bismuth-sucralfate
    front: Why is sucralfate not given with PPIs or H2-blockers?
    back: Sucralfate requires an acidic environment.
    src: { page: 406, quote: "Sucralfate requires acidic environment, not given with PPIs/H2 blockers." }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.035
    kind: cloze
    topic: bismuth-sucralfate
    text: Bismuth and sucralfate ↑ ulcer healing; bismuth also treats {{c1::travelers' diarrhea}} and is used in {{c2::quadruple therapy}} for H pylori.
    src: { page: 406, quote: "↑ ulcer healing, travelers’ diarrhea (bismuth). Bismuth also used in quadruple therapy for H pylori." }
    status: unverified

