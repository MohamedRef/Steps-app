    front: Name the H2-blockers.
    back: Cimetidine, famotidine, nizatidine.
    src: { page: 406, quote: "-blockers Cimetidine, famotidine, nizatidine." }
    status: unverified
  - id: gi.L05.015
    kind: cloze
    topic: h2-blockers
    text: H2-blockers cause a {{c1::reversible}} block of histamine H2 receptors → ↓ H+ secretion by {{c2::parietal cells}}.
    src: { page: 406, quote: "Reversible block of histamine H2 -receptors → ↓ H+ secretion by parietal cells." }
    status: unverified
  - id: gi.L05.016
    kind: card
    topic: h2-blockers
    front: What are the clinical uses of H2-blockers?
    back: Peptic ulcer, gastritis, mild esophageal reflux.
    src: { page: 406, quote: "Peptic ulcer, gastritis, mild esophageal reflux." }
    status: unverified
  - id: gi.L05.017
    kind: enumerate
    topic: h2-blockers
    prompt: Enumerate the adverse effects of cimetidine (5).
    points:
      - Potent cytochrome P-450 inhibitor (multiple drug interactions)
      - Antiandrogenic effects (prolactin release, gynecomastia, impotence, ↓ libido in males)
      - Crosses the blood-brain barrier (confusion, dizziness, headaches)
      - Crosses the placenta
      - ↓ renal excretion of creatinine
    pass: 4
    src: { page: 406, quote: "Cimetidine is a potent inhibitor of cytochrome P-450 (multiple drug interactions)" }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.018
    kind: card
    topic: h2-blockers
    front: Do famotidine and nizatidine share cimetidine's adverse effects?
    back: No; the other H2-blockers are relatively free of these effects.
    src: { page: 406, quote: "Other H2 blockers are relatively free of these effects." }
    status: unverified
  - id: gi.L05.019
    kind: mcq
    topic: h2-blockers
    stem: >-
      A 54-year-old man with atrial fibrillation on warfarin has had a stable INR for a year. He buys an
      over-the-counter drug for heartburn, and 10 days later he has gum bleeding and an INR of 6.2. He
      also notices tender breast enlargement. Which mechanism best explains the rise in his INR?
    options:
      - Inhibition of hepatic cytochrome P-450 enzymes
      - Displacement of warfarin from albumin
      - ↓ absorption of vitamin K from the gut
      - Induction of hepatic cytochrome P-450 enzymes
      - Inhibition of platelet cyclooxygenase
    answer: 0
    why:
      - "Right. Cimetidine is a potent cytochrome P-450 inhibitor, so warfarin is cleared more slowly; its antiandrogenic effect explains the gynecomastia."
      - "Protein-binding displacement causes only a brief rise in free drug and is not cimetidine's known interaction."
      - "Cimetidine does not block vitamin K absorption; the book names P-450 inhibition."
      - "Induction (eg, rifampin) would speed warfarin clearance and lower the INR."
      - "Cyclooxygenase inhibition (aspirin, NSAIDs) causes bleeding without changing the INR."
    src: { page: 406, quote: "Cimetidine is a potent inhibitor of cytochrome P-450 (multiple drug interactions); it also has antiandrogenic effects (prolactin release, gynecomastia, impotence, ↓ libido in males)" }
    status: unverified
    tags: [high-yield]

