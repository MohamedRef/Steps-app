  - id: gi.L05.025
    kind: mcq
    topic: proton-pump-inhibitors
    stem: >-
      A 74-year-old woman has taken omeprazole for 6 years for reflux. She is admitted after a fall with a
      hip fracture. Two weeks before, she finished a course of amoxicillin-clavulanate. On day 3 she
      develops 8 watery stools a day, fever and leukocytosis. Which additional finding would her long
      PPI use most likely also cause?
    options:
      - Hypomagnesemia
      - Hypercalcemia
      - Gynecomastia
      - Hyperkalemia
      - Folate excess
    answer: 0
    why:
      - "Right. PPIs ↓ serum Mg2+ and ↓ Ca2+ absorption (the fracture link) and ↑ the risk of C difficile infection, which fits her diarrhea after antibiotics."
      - "PPIs reduce calcium absorption; they do not raise serum calcium."
      - "Gynecomastia is cimetidine's antiandrogenic effect, not a PPI effect."
      - "Hyperkalemia is not a PPI effect in the book."
      - "The PPI-related vitamin problem is B12 malabsorption, not folate excess."
    src: { page: 406, quote: "↑ risk of C difficile infection, pneumonia, acute interstitial nephritis. Vitamin B12 malabsorption; ↓ serum Mg2+ /Ca2+ absorption" }
    status: unverified
    tags: [high-yield]

