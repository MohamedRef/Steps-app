  # ---------- Pancreatic adenocarcinoma (p405) ----------
  - id: gi.L05.001
    kind: card
    topic: pancreatic-adenocarcinoma
    front: "From which structures does pancreatic adenocarcinoma arise?"
    back: "The pancreatic ducts."
    src: { page: 405, quote: "Very aggressive tumor arising from pancreatic ducts" }
    status: unverified
  - id: gi.L05.068
    kind: card
    topic: pancreatic-adenocarcinoma
    front: "What is the prognosis of pancreatic adenocarcinoma?"
    back: "Poor: it is a very aggressive tumor that has often already spread when found, and patients live about a year on average after diagnosis."
    src: { page: 405, quote: "Very aggressive tumor arising from pancreatic ducts (disorganized glandular structure with cellular infiltration A ); often metastatic at presentation, with average survival ~1 year after diagnosis." }
    status: unverified
    tags: [high-yield]
  - id: gi.L05.069
