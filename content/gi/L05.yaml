  - id: gi.L05.019
    kind: mcq
    topic: h2-blockers
    stem: >-
      A 54-year-old man with atrial fibrillation on warfarin has had a stable INR for a year. He buys an
      over-the-counter drug for heartburn, and 10 days later he has gum bleeding and an INR of 6.2. He
      also notices tender breast enlargement. Which mechanism best explains the rise in his INR?
    options:
      - Inhibition of hepatic cytochrome P-450 enzymes
      - Displacement of warfarin from albumin
      - ↓ absorption of vitamin K from the gut
      - Induction of hepatic cytochrome P-450 enzymes
      - Inhibition of platelet cyclooxygenase
    answer: 0
    why:
      - "Right. Cimetidine is a potent cytochrome P-450 inhibitor, so warfarin is cleared more slowly; its antiandrogenic effect explains the gynecomastia."
      - "Protein-binding displacement causes only a brief rise in free drug and is not cimetidine's known interaction."
      - "Cimetidine does not block vitamin K absorption; the book names P-450 inhibition."
      - "Induction (eg, rifampin) would speed warfarin clearance and lower the INR."
      - "Cyclooxygenase inhibition (aspirin, NSAIDs) causes bleeding without changing the INR."
    src: { page: 406, quote: "Cimetidine is a potent inhibitor of cytochrome P-450 (multiple drug interactions); it also has antiandrogenic effects (prolactin release, gynecomastia, impotence, ↓ libido in males)" }
    status: unverified
    tags: [high-yield]

