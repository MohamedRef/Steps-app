items:
  # ---------- p268: Pearson correlation coefficient ----------
  - id: phs.L02.001
    kind: cloze
    topic: pearson-correlation
    text: "The Pearson correlation coefficient (r) measures {{c1::linear}} correlation between two variables and always lies between {{c2::−1 and +1}}; the closer |r| is to 1, the {{c3::stronger}} the correlation."
    src: { page: 268, quote: "A measure of the linear correlation between two variables. r is always between −1 and +1." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.002
    kind: card
    topic: pearson-correlation
    front: What does a negative Pearson r mean?
    back: The variables move in opposite directions; when one rises, the other falls (negative correlation).
    src: { page: 268, quote: "Negative r value → negative correlation (as one variable ↑, the other variable ↓)." }
    status: unverified
  - id: phs.L02.050
    kind: card
    topic: pearson-correlation
    front: "What does a positive Pearson r mean?"
    back: "The two variables move together: when one rises, so does the other (positive correlation)."
    src: { page: 268, quote: "Positive r value → positive correlation (as one variable ↑, the other variable ↑)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.051
    kind: cloze
    topic: pearson-correlation
    text: "{{c1::Variance}} measures how far the measured values in a data set spread from their average."
    src: { page: 268, quote: "Variance is how much the measured values differ from the average value in a data set." }
    status: unverified
  - id: phs.L02.003
    kind: cloze
    topic: pearson-correlation
    text: "The coefficient of determination, {{c1::r²}}, tells you what share of one variable's variance is accounted for by the other variable's variance."
    src: { page: 268, quote: "Coefficient of determination = r2 (proportion of variance in one variable that can be explained by variance in the other variable)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.004
    kind: card
    topic: pearson-correlation
    front: Does a strong correlation (r close to ±1) prove causation?
    back: No. Correlation does not necessarily imply causation.
    src: { page: 268, quote: "Correlation does not necessarily imply causation." }
    status: unverified
  - id: phs.L02.005
    kind: card
    topic: pearson-correlation
    front: Which shows a stronger correlation, r = −0.8 or r = +0.4?
    back: r = −0.8 (strong negative); r = +0.4 is a weak positive correlation. Strength depends on the absolute value.
    src: { page: 268, quote: "r = –0.8 Strong negative correlation r = –0.4 Weak negative correlation" }
    status: unverified
  - id: phs.L02.006
    kind: mcq
    topic: pearson-correlation
    stem: >-
      A study of 300 adults finds that daily minutes of exercise and resting heart rate have a Pearson
      correlation coefficient of r = −0.7. Which of the following is the best interpretation of this
      result?
    options:
      - Exercise time explains about 49% of the variance in heart rate
      - Exercise causes a 70% fall in resting heart rate
      - There is a weak positive linear correlation
      - 70% of the variance in heart rate is explained by exercise time
      - The two variables are not related because r is negative
    answer: 0
    why:
      - "Right. The coefficient of determination is r² = 0.49, the proportion of variance in one variable explained by the other."
      - "Correlation does not necessarily imply causation, and r is not a percentage change."
      - "A negative r means a negative correlation, and |0.7| is fairly strong."
      - "The proportion of variance explained is r², not r."
      - "A negative r is a negative correlation (one ↑, the other ↓), not no correlation; r = 0 is no correlation."
    src: { page: 268, quote: "Coefficient of determination = r2 (proportion of variance in one variable that can be explained by variance in the other variable)." }
    status: unverified
  # ---------- p268: core ethical principles ----------
  - id: phs.L02.007
    kind: table
    topic: core-ethical-principles
    title: Core ethical principles
    columns: [Principle, Meaning]
    rows:
      - [Autonomy, "Respect patients as individuals (truth-telling, confidentiality), create the conditions for autonomous choice (informed consent), honor their preference to accept or refuse care"]
      - [Beneficence, "\"Do good\": a special (fiduciary) duty to act in the patient's best interest"]
      - [Nonmaleficence, "\"Do no harm\": balanced against beneficence; if benefits outweigh risks the patient may make an informed decision to proceed"]
      - [Justice, "Treat persons fairly and equitably, which does not always mean equally (eg, triage)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 268, quote: "Nonmaleficence “Do no harm.” Must be balanced against beneficence" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.008
    kind: card
    topic: core-ethical-principles
    front: With what can beneficence conflict, and which traditionally wins?
    back: It can clash with the informed patient's own choice (autonomy) or with society's good (eg, compulsory TB treatment). The patient's interest usually comes first.
    src: { page: 268, quote: "May conflict with autonomy (an informed patient has the right to decide) or what is best for society (eg, mandatory TB treatment). Traditionally, patient interest supersedes." }
    status: unverified
  - id: phs.L02.009
    kind: cloze
    topic: core-ethical-principles
    text: "Principle of {{c1::double effect}}: in end-of-life care, facilitating {{c2::comfort}} is prioritized over potential side effects (eg, respiratory depression with opioids)."
    src: { page: 268, quote: "Principle of double effect—facilitating comfort is prioritized over potential side effects (eg, respiratory depression with opioid use) for patients receiving end-of-life care." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.010
    kind: card
    topic: core-ethical-principles
    front: Which ethical principle does triage illustrate?
    back: Justice. Treating fairly and equitably does not always mean equally.
    src: { page: 268, quote: "Justice To treat persons fairly and equitably. This does not always imply equally (eg, triage)." }
    status: unverified
  - id: phs.L02.011
    kind: mcq
    topic: core-ethical-principles
    stem: >-
      A 78-year-old woman with metastatic pancreatic cancer is receiving hospice care. She has severe
      pain despite her current dose of morphine. Her daughter worries that a higher dose may slow her
      breathing. Increasing the morphine dose to relieve her pain is best supported by which of the
      following?
    options:
      - Principle of double effect
      - Justice
      - Therapeutic privilege
      - Nonmaleficence
      - Duty to protect
    answer: 0
    why:
      - "Right. In end-of-life care, facilitating comfort is prioritized over potential side effects such as opioid respiratory depression."
      - "Justice is treating persons fairly and equitably (eg, triage), not weighing comfort against side effects."
      - "Therapeutic privilege is an exception to informed consent: withholding information whose disclosure would severely harm the patient."
      - "Nonmaleficence is balanced against beneficence; it does not forbid every treatment with risk."
      - "Duty to protect is an exception to confidentiality to protect a potential victim."
    src: { page: 268, quote: "Principle of double effect—facilitating comfort is prioritized over potential side effects (eg, respiratory depression with opioid use) for patients receiving end-of-life care." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.053
    kind: card
    topic: core-ethical-principles
    front: How does nonmaleficence apply to most surgeries and medications?
    back: Nonmaleficence ("do no harm") is balanced against beneficence; if the benefits outweigh the risks, the patient may make an informed decision to proceed, and most surgeries and medications fall into this category.
    src: { page: 268, quote: "Nonmaleficence “Do no harm.” Must be balanced against beneficence; if the benefits outweigh the risks, a patient may make an informed decision to proceed (most surgeries and medications fall into this category)." }
    status: unverified
  # ---------- p268: decision-making capacity ----------
  - id: phs.L02.012
    kind: table
    topic: decision-making-capacity
    title: Capacity vs competency
    columns: [Feature, Capacity, Competency]
    rows:
      - [Determined by, A physician, A judge]
      - [Scope, "A specific healthcare-related decision (eg, to refuse medical care)", "Legal: eg, legally unable to make any healthcare-related decision"]
    blanks: [[0, 1], [0, 2], [1, 1]]
    src: { page: 268, quote: "Capacity is determined by a physician for a specific healthcare-related decision (eg, to refuse medical care). Competency is determined by a judge" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.013
    kind: enumerate
    topic: decision-making-capacity
    prompt: Enumerate the four major components of decision-making (capacity).
    points:
      - Understanding (what do you know about your condition or the proposed treatment?)
      - Appreciation (what does your condition mean to you?)
      - Reasoning (how are you weighing your options?)
      - Expressing a choice (what would you like to do?)
    pass: 4
    hook: "فهم، وإحساس إن الكلام ده يخصه، ووزن، واختيار: Understanding ثم Appreciation ثم Reasoning ثم Expressing a choice."
    src: { page: 268, quote: "Four major components of decision-making: Understanding (what do you know about your condition/proposed procedure/ treatment?) Appreciation" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.014
    kind: card
    topic: decision-making-capacity
    front: Do intellectual disabilities or mental illnesses exclude decision-making capacity?
    back: No. They only matter if, right now, the condition stops the patient from making healthcare decisions.
    src: { page: 268, quote: "Intellectual disabilities and mental illnesses are not exclusion criteria unless the patient’s condition presently impairs their ability to make healthcare decisions." }
    status: unverified
  - id: phs.L02.015
    kind: card
    topic: decision-making-capacity
    front: Can a decision made with capacity be revoked because the patient later loses capacity?
    back: No. A choice made while the patient had capacity still stands after capacity is lost.
    src: { page: 268, quote: "Note that decisions made with capacity cannot be revoked simply if the patient later loses capacity." }
    status: unverified
  - id: phs.L02.016
    kind: mcq
    topic: decision-making-capacity
    stem: >-
      A 45-year-old man with schizophrenia, stable on medication, is admitted with a foot infection and
      refuses a recommended amputation. He correctly describes his infection, says it means he could
      lose his life, compares the risks of surgery with antibiotics alone, and clearly states that he
      wants antibiotics only. His sister says he cannot decide because of his mental illness. Which of
      the following is the most appropriate statement?
    options:
      - He has capacity for this decision, so his refusal stands
      - His schizophrenia alone means he lacks capacity
      - A judge must determine his capacity before he can refuse
      - His sister should make the decision as his surrogate
      - He must be found legally competent by a psychiatrist before refusing
    answer: 0
    why:
      - "Right. He shows understanding, appreciation, reasoning and expresses a choice; mental illness does not exclude capacity unless it presently impairs decision-making."
      - "Mental illness is not an exclusion criterion unless it presently impairs the ability to decide."
      - "Capacity is determined by a physician for a specific decision; a judge determines competency."
      - "A surrogate decides only when the patient loses decision-making capacity."
      - "Competency is a legal determination made by a judge, and capacity is what this decision needs."
    src: { page: 268, quote: "Intellectual disabilities and mental illnesses are not exclusion criteria unless the patient’s condition presently impairs their ability to make healthcare decisions." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.054
    kind: table
    topic: decision-making-capacity
    title: "Decision-making capacity: the question that tests each component"
    columns: [Question to the patient, Component]
    rows:
      - ["What do you know about your condition/proposed procedure/treatment?", Understanding]
      - ["What does your condition mean to you? Why do you think your doctor is recommending this course of treatment?", Appreciation]
      - ["How are you weighing your options?", Reasoning]
      - ["What would you like to do?", Expressing a choice]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 268, quote: "Appreciation (what does your condition mean to you? why do you think your doctor is recommending this course of treatment?)" }
    status: unverified
  - id: phs.L02.055
    kind: card
    topic: decision-making-capacity
    front: What must the physician determine when assessing decision-making capacity?
    back: Whether the patient is psychologically and legally capable of making that particular healthcare decision.
    src: { page: 268, quote: "Physician must determine whether the patient is psychologically and legally capable of making a particular healthcare decision." }
    status: unverified
  # ---------- p269: informed consent ----------
  - id: phs.L02.017
    kind: enumerate
    topic: informed-consent
    prompt: Enumerate what the informed consent process requires (4).
    points:
      - "Disclosure: discussion of pertinent information, including risks and benefits"
      - "Understanding: ability to comprehend"
      - "Capacity: ability to reason and make one's own decisions"
      - "Voluntariness: freedom from coercion and manipulation"
    pass: 4
    hook: "قول له (Disclosure)، اتأكد إنه فهم (Understanding)، وإنه قادر يقرر (Capacity)، ومن غير ضغط (Voluntariness)."
    src: { page: 269, quote: "Disclosure: discussion of pertinent information, including risks/benefits Understanding: ability to comprehend Capacity: ability to reason and make one’s own decisions" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.018
    kind: card
    topic: informed-consent
    front: Which alternative must always be included when discussing a proposed treatment for informed consent?
    back: No treatment, along with the risks and benefits of the proposed treatment and other alternatives.
    src: { page: 269, quote: "understanding of their diagnosis and the risks/ benefits of proposed treatment and alternative options, including no treatment." }
    status: unverified
  - id: phs.L02.019
    kind: card
    topic: informed-consent
    front: How can a patient revoke written consent?
    back: At any time, even orally; patients must be told they have this right.
    src: { page: 269, quote: "Patients must be informed of their right to revoke written consent at any time, even orally." }
    status: unverified
  - id: phs.L02.020
    kind: enumerate
    topic: informed-consent
    prompt: Enumerate the exceptions to informed consent ("WIPE it away") (4).
    points:
      - "Waiver: the patient explicitly relinquishes the right of informed consent"
      - "Legally Incompetent: the patient lacks decision-making capacity (obtain consent from a legal surrogate)"
      - "Therapeutic Privilege: withholding information when disclosure would severely harm the patient or undermine informed decision-making capacity"
      - "Emergency situation: implied consent may apply"
    pass: 4
    hook: "WIPE it away: Waiver و Incompetent و Privilege و Emergency."
    src: { page: 269, quote: "Exceptions to informed consent (WIPE it away): Waiver—patient explicitly relinquishes the right of informed consent" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.021
    kind: cloze
    topic: informed-consent
    text: "{{c1::Therapeutic privilege}} lets the physician hold back information if telling it would seriously harm the patient or damage their ability to make an informed decision."
    src: { page: 269, quote: "Therapeutic Privilege—withholding information when disclosure would severely harm the patient or undermine informed decision-making capacity" }
    status: unverified
  - id: phs.L02.022
    kind: mcq
    topic: informed-consent
    stem: >-
      A 30-year-old man is brought to the emergency department unconscious after a motorcycle crash.
      He has a ruptured spleen and is hypotensive. No family members can be reached, and there is no
      record of his wishes. Which of the following best justifies proceeding with emergency
      splenectomy?
    options:
      - Implied consent in an emergency
      - Therapeutic privilege
      - Waiver of informed consent
      - Consent from a court-appointed guardian
      - Principle of double effect
    answer: 0
    why:
      - "Right. In an emergency situation, implied consent may apply (the E of WIPE)."
      - "Therapeutic privilege is withholding information whose disclosure would severely harm the patient."
      - "A waiver is a patient explicitly giving up the right; this patient cannot speak."
      - "There is no time to seek a guardian in a life-threatening emergency."
      - "Double effect prioritizes comfort over side effects in end-of-life care."
    src: { page: 269, quote: "Emergency situation—implied consent may apply" }
    status: unverified
    tags: [high-yield]
  # ---------- p269: consent for minors ----------
  - id: phs.L02.023
    kind: card
    topic: consent-for-minors
    front: Who is generally considered a minor for healthcare consent?
    back: Anyone younger than 18 years.
    src: { page: 269, quote: "A minor is generally any person <18 years old." }
    status: unverified
  - id: phs.L02.052
    kind: card
    topic: consent-for-minors
    front: "Parental consent is generally needed for a minor; what are the two general exceptions?"
    back: "Emergency treatment (eg, a blood transfusion), and a minor who is legally emancipated (eg, married, self-supporting or serving in the military)."
    src: { page: 269, quote: "exceptions exist for emergency treatment (eg, blood transfusions) or if minor is legally emancipated (eg, married, self-supporting, or in the military)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.024
    kind: enumerate
    topic: consent-for-minors
    prompt: Enumerate the situations in which parental consent is usually not required for a minor ("Sex, drugs, and rock and roll") (3).
    points:
      - "Sex: contraception, STIs, prenatal care (usually not abortion)"
      - "Drugs: substance use disorder treatment"
      - "Rock and roll: emergency or trauma"
    pass: 3
    hook: "Sex و Drugs و Rock and roll: منع الحمل والأمراض الجنسية والحمل (مش الإجهاض)، علاج الإدمان، والطوارئ."
    src: { page: 269, quote: "Sex (contraception, STIs, prenatal care— usually not abortion) Drugs (substance use disorder treatment) Rock and roll (emergency/trauma)" }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.025
    kind: cloze
    topic: consent-for-minors
    text: "Even when a minor's consent is not legally required, the physician should seek the minor's {{c1::assent}} (agreement of someone unable to legally consent)."
    src: { page: 269, quote: "Physician should seek a minor’s assent (agreement of someone unable to legally consent) even if their consent is not required." }
    status: unverified
  - id: phs.L02.026
    kind: mcq
    topic: consent-for-minors
    stem: >-
      A 16-year-old girl comes to the clinic alone asking for oral contraception. She is sexually
      active with one partner and lives with her parents. She asks that her parents not be told. Which
      of the following is the most appropriate next step?
    options:
      - Provide contraception and encourage her to communicate with her parents
      - Require written parental consent before prescribing
      - Refuse because she is under 18 years old
      - Call her parents, because minors cannot keep health information confidential
      - Ask a judge to declare her emancipated
    answer: 0
    why:
      - "Right. Contraception is a situation (sex) in which parental consent is usually not required; physicians should still encourage healthy minor-guardian communication."
      - "Parental consent is usually not required for contraception."
      - "Being under 18 does not bar contraception care without parental consent."
      - "Her care falls under the exception, so the parents need not be involved without her agreement."
      - "Emancipation (married, self-supporting, military) is not needed for contraception."
    src: { page: 269, quote: "Physicians should always encourage healthy minor-guardian communication." }
    status: unverified
  - id: phs.L02.056
    kind: card
    topic: consent-for-minors
    front: Are parental consent laws for minors' healthcare the same everywhere, and what should physicians always encourage?
    back: They vary by state. Physicians should always encourage healthy minor-guardian communication.
    src: { page: 269, quote: "Parental consent laws in relation to healthcare vary by state." }
    status: unverified
  # ---------- p269: advance directives ----------
  - id: phs.L02.027
    kind: table
    topic: advance-directives
    title: Advance directives
    columns: [Type, Key point]
    rows:
      - [Oral advance directive, "Prior oral statements guide care; more valid if the patient was informed, the directive was specific, the patient made a choice and repeated it over time to multiple people"]
      - [Written advance directive, "Specific interventions the patient will accept or reject in a critical or life-threatening illness; a living will is an example"]
      - [Medical power of attorney, "Patient designates an agent to decide if capacity is lost; revocable while capacity is intact; more flexible than a living will"]
      - [Do not resuscitate order, "Prohibits CPR only; other life-sustaining measures may still be considered (intubation, feeding tube, chemotherapy)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 269, quote: "Patient designates an agent to make medical decisions in the event that the patient loses decision- making capacity." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.028
    kind: enumerate
    topic: advance-directives
    prompt: Enumerate what makes an oral advance directive more valid (4).
    points:
      - The patient was informed
      - The directive was specific
      - The patient made a choice
      - The decision was repeated over time to multiple people
    pass: 4
    hook: "كلام قديم يتاخد بيه لو كان عارف، ومحدد، واختار، وكرره لكذا حد على مدة."
    src: { page: 269, quote: "If patient was informed, directive was specific, patient made a choice, and decision was repeated over time to multiple people, then the oral directive is more valid." }
    status: unverified
  - id: phs.L02.029
    kind: card
    topic: advance-directives
    front: What does a DNR order prohibit, and what may the patient still consider?
    back: It rules out CPR only. Other life-sustaining care (eg, intubation, a feeding tube, chemotherapy) can still be chosen.
    src: { page: 269, quote: "DNR order prohibits cardiopulmonary resuscitation (CPR). Patient may still consider other life- sustaining measures (eg, intubation, feeding tube, chemotherapy)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.030
    kind: card
    topic: advance-directives
    front: What is a living will?
    back: An example of a written advance directive, delineating specific interventions the patient anticipates accepting or rejecting during a critical or life-threatening illness.
    src: { page: 269, quote: "Delineates specific healthcare interventions that patient anticipates accepting or rejecting during treatment for a critical or life-threatening illness. A living will is an example." }
    status: unverified
  - id: phs.L02.031
    kind: mcq
    topic: advance-directives
    stem: >-
      A 70-year-old man with COPD has a DNR order in his chart. He is admitted with pneumonia and
      worsening hypoxemia, is alert, and the team discusses noninvasive measures and possible
      intubation. Which of the following best describes the effect of his DNR order?
    options:
      - It prohibits CPR, but intubation may still be considered
      - It prohibits all life-sustaining treatment including antibiotics
      - It prohibits intubation but allows CPR
      - It transfers decisions to his medical power of attorney
      - It is void once he is admitted to the hospital
    answer: 0
    why:
      - "Right. A DNR order prohibits cardiopulmonary resuscitation; other life-sustaining measures such as intubation may still be considered."
      - "A DNR order covers CPR only, not every treatment."
      - "This reverses the order: CPR is what it prohibits."
      - "A medical power of attorney acts only when the patient loses decision-making capacity; he is alert."
      - "Nothing in the order lapses on admission."
    src: { page: 269, quote: "DNR order prohibits cardiopulmonary resuscitation (CPR). Patient may still consider other life- sustaining measures (eg, intubation, feeding tube, chemotherapy)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L02.032
    kind: mcq
    topic: advance-directives
    stem: >-
      A 62-year-old woman with early Alzheimer disease names her son as her agent to make medical
      decisions if she can no longer make them. Six months later, while still able to understand and
      weigh her options, she decides she wants her daughter instead. Which of the following is correct?
    options:
      - She can revoke it, since her capacity is intact
      - The designation cannot be changed once signed
      - Only a judge can change a medical power of attorney
      - Her son keeps the role because he was named first
      - She must first write a living will
    answer: 0
    why:
      - "Right. A medical power of attorney can be revoked by the patient if decision-making capacity is intact."
      - "It is revocable while she keeps capacity."
      - "No court is needed; the patient revokes it herself."
      - "Order of naming does not bind her while she has capacity."
      - "A living will is a separate written directive; a medical power of attorney is more flexible and stands alone."
    src: { page: 269, quote: "Can be revoked by patient if decision-making capacity is intact. More flexible than a living will." }
    status: unverified
  - id: phs.L02.057
    kind: card
    topic: advance-directives
    front: What is an advance directive?
    back: Instructions a patient gives in anticipation of the need for a medical decision; the details vary by state law.
    src: { page: 269, quote: "Instructions given by a patient in anticipation of the need for a medical decision. Details vary per state law." }
    status: unverified
  - id: phs.L02.058
    kind: card
    topic: advance-directives
    front: How is an incapacitated patient's oral advance directive used, and what is its problem?
    back: The patient's prior oral statements are commonly used as a guide, but problems arise from variance in interpretation.
    src: { page: 269, quote: "Incapacitated patient’s prior oral statements commonly used as guide. Problems arise from variance in interpretation." }
    status: unverified
  - id: phs.L02.059
    kind: cloze
    topic: advance-directives
    text: "With a medical power of attorney, the patient designates an {{c1::agent}} to make medical decisions if capacity is lost, and may also {{c2::specify decisions in clinical situations}}."
    src: { page: 269, quote: "Patient designates an agent to make medical decisions in the event that the patient loses decision-making capacity. Patient may also specify decisions in clinical situations." }
    status: unverified
  # ---------- p270: ventilator-assisted life support ----------
  - id: phs.L02.033
    kind: card
    topic: ventilator-life-support
