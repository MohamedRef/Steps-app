      - "Part A covers hospital Admissions, including hospice and skilled nursing."
      - "Part B covers Basic medical bills such as physician fees and diagnostic tests."
      - "Part C is A + B combined, delivered by approved private companies."
      - "Medicaid is for people with limited income or resources, not eligibility by age."
