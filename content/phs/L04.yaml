    kind: card
    topic: healthcare-payment-models
    front: Which payment model is most commonly used for elective surgery?
    back: Global payment, a single payment covering the surgery and the necessary pre- and postoperative visits.
    src: { page: 277, quote: "Most commonly used during elective surgeries, as it covers the cost of surgery as well as the necessary pre- and postoperative visits." }
