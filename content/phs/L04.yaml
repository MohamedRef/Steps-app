  - id: phs.L04.042
    kind: card
    topic: medicare-medicaid
    front: "Where did Medicare and Medicaid come from, and whom does each cover?"
    back: "Both are federal social healthcare programs that originated from amendments to the Social Security Act. MedicarE is for Elderly; MedicaiD is for Disadvantaged."
    src: { page: 277, quote: "Medicare and Medicaid—federal social healthcare programs that originated from amendments to the Social Security Act." }
