  # ---------- p276: disease prevention ----------
  - id: phs.L04.001
    kind: table
    topic: disease-prevention
    title: Levels of disease prevention
    columns: [Level, Target population, Goal, Example (diabetes)]
    rows:
      - [Primary, Susceptible/general population, Prevent disease onset (reduce risks or increase immunity), Healthy diet and exercise to prevent diabetes]
      - [Secondary, Subclinical (asymptomatic), "Screen for early detection and treatment; prevent symptom onset", Glucose screening for type 2 diabetes mellitus]
      - [Tertiary, Clinical (symptomatic), "Treat symptomatic disease; prevent progression and sequelae", Hemoglobin A1c monitoring to guide treatment and prevent complications]
      - [Quaternary, "Symptomatic but overmedicalized or not treatable", "Quit unnecessary interventions; prevent overtreatment and iatrogenic harm", Discontinuing a sulfonylurea after multiple hypoglycemic events]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [0, 3], [1, 3], [2, 3], [3, 3]]
    src: { page: 276, quote: "Prevent overtreatment and iatrogenic harm eg, discontinuing sulfonylurea after multiple hypoglycemic events" }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.002
    kind: cloze
    topic: disease-prevention
    text: "{{c1::Secondary}} prevention screens for early detection and treatment of presymptomatic disease (eg, glucose screening for type 2 diabetes)."
    src: { page: 276, quote: "Screen for early detection and treatment of presymptomatic disease" }
    status: unverified
  - id: phs.L04.003
    kind: cloze
    topic: disease-prevention
    text: "{{c1::Quaternary}} prevention quits unnecessary medical interventions to prevent {{c2::overtreatment and iatrogenic harm}}."
    src: { page: 276, quote: "Quit unnecessary medical interventions" }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.004
    kind: mcq
    topic: disease-prevention
    stem: >-
      A 66-year-old man has had type 2 diabetes for 10 years. His physician checks his hemoglobin A1c
      every 3 months and adjusts his metformin dose to the result to prevent complications of his
      diabetes. Which level of prevention does this monitoring represent?
    options:
      - Tertiary
      - Primary
      - Secondary
      - Quaternary
      - Primordial
    answer: 0
    why:
      - "Right. Tertiary prevention treats symptomatic (clinical) disease and prevents progression, sequelae and complications, like A1c monitoring to guide treatment."
      - "Primary prevention prevents disease onset in the general population (diet and exercise)."
      - "Secondary prevention screens for presymptomatic disease (glucose screening); his diabetes is already diagnosed and treated."
      - "Quaternary prevention stops unnecessary interventions to prevent iatrogenic harm."
      - "First Aid's levels here are primary to quaternary."
    src: { page: 276, quote: "Prevent clinical disease progression and sequelae associated morbidity, mortality, and disability eg, hemoglobin A1c monitoring to guide treatment and prevent complications" }
    status: unverified
  - id: phs.L04.005
    kind: mcq
    topic: disease-prevention
    stem: >-
      An 82-year-old woman with type 2 diabetes has been brought to the emergency department three times
      in 2 months with hypoglycemia. She takes glipizide. Her physician stops the glipizide and relaxes
      her glycemic target. Which level of prevention does this represent?
    options:
      - Quaternary
      - Tertiary
      - Secondary
      - Primary
      - None, because treatment was stopped
    answer: 0
    why:
      - "Right. Quaternary prevention quits unnecessary interventions to prevent overtreatment and iatrogenic harm, like stopping a sulfonylurea after multiple hypoglycemic events."
      - "Tertiary prevention treats symptomatic disease to prevent complications."
      - "Secondary prevention is screening for presymptomatic disease."
      - "Primary prevention prevents disease onset."
      - "Stopping a harmful intervention is itself prevention (quaternary)."
    src: { page: 276, quote: "eg, discontinuing sulfonylurea after multiple hypoglycemic events" }
    status: unverified
    tags: [high-yield]
  # ---------- p276: chemoprophylaxis ----------
  - id: phs.L04.006
    kind: table
    topic: chemoprophylaxis
    title: Chemoprophylaxis and post-exposure prophylaxis
    columns: [Exposure, Prophylaxis, Notes]
    rows:
      - ["HIV (sexual, occupational)", "Tenofovir disoproxil fumarate + emtricitabine + (raltegravir or dolutegravir) × 28 days", "Start ≤72 hr; test HIV at baseline, 6 wk, 3 mo, 6 mo"]
      - [Neisseria meningitidis (close contact), "Rifampin, ciprofloxacin, or ceftriaxone", Household or close exposure]
      - [Rabies (animal bite), "Wound cleaning + rabies vaccine + rabies immune globulin (if not previously immunized)", "Day 0, 3, 7, 14 schedule"]
      - [Hepatitis B virus, HBV vaccine ± hepatitis B immune globulin (if source positive and unvaccinated), Follow HBV serology]
      - [Malaria (travel), "Atovaquone-proguanil, doxycycline, or mefloquine", "Start before travel; continue post-return"]
      - [Sexual exposure (STI prevention), "Doxycycline ≤72 hr after sex, in patients with recent bacterial STI", "Prevents syphilis, chlamydia, gonorrhea; monitor q3-6 mo"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [0, 2], [2, 2]]
    src: { page: 276, quote: "Tenofovir disoproxil fumarate + emtricitabine + (raltegravir or dolutegravir) × 28 days." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.007
    kind: card
    topic: chemoprophylaxis
    front: When must HIV post-exposure prophylaxis start, how long is it given, and when is HIV tested?
    back: Start ≤72 hr after exposure, for 28 days; test HIV at baseline and at 6 wk, 3 mo and 6 mo.
    src: { page: 276, quote: "Start ≤72 hr after exposure; test HIV at baseline and 6 wk, 3 mo, 6 mo." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.008
    kind: card
    topic: chemoprophylaxis
    front: What is the post-exposure prophylaxis for a household contact of a patient with meningococcal meningitis?
    back: Rifampin, ciprofloxacin, or ceftriaxone.
    src: { page: 276, quote: "Neisseria meningitidis (close contact) Rifampin, ciprofloxacin, or ceftriaxone." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.009
    kind: cloze
    topic: chemoprophylaxis
    text: "Rabies post-exposure prophylaxis: {{c1::wound cleaning}} + rabies vaccine + {{c2::rabies immune globulin}} (if not previously immunized), on a day {{c3::0, 3, 7, 14}} schedule."
    src: { page: 276, quote: "Wound cleaning + rabies vaccine + rabies immune globulin (if not previously immunized). 0, 3, 7, 14 day schedule." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.010
    kind: card
    topic: chemoprophylaxis
    front: When is hepatitis B immune globulin added to HBV vaccine after an exposure?
    back: If the source is positive and the exposed person is unvaccinated; then follow HBV serology.
    src: { page: 276, quote: "HBV vaccine ± Hepatitis B immune globulin (if source positive and unvaccinated). Follow HBV serology." }
    status: unverified
  - id: phs.L04.011
    kind: card
    topic: chemoprophylaxis
    front: Which drugs are used for malaria travel prophylaxis, and when?
    back: Atovaquone-proguanil, doxycycline, or mefloquine; start before travel and continue after return.
    src: { page: 276, quote: "Atovaquone-proguanil, doxycycline, or mefloquine. Start before travel; continue post-return." }
    status: unverified
  - id: phs.L04.012
    kind: card
    topic: chemoprophylaxis
    front: How much does doxycycline post-exposure prophylaxis (Doxy-PEP) cut STIs?
    back: Syphilis and chlamydia fall by more than 70%; gonorrhea by about 50%.
    src: { page: 276, quote: "Effectiveness: ↓ syphilis/chlamydia >70%, ↓ gonorrhea ~50%." }
    status: unverified
  - id: phs.L04.038
    kind: card
    topic: chemoprophylaxis
    front: "Doxy-PEP: who gets it, and how soon after sex?"
    back: "Patients with a recent bacterial STI, within 72 hours of sex, to prevent syphilis, chlamydia and gonorrhea."
    src: { page: 276, quote: "Give ≤72 hr after sex to prevent syphilis, chlamydia, and gonorrhea in patients with recent bacterial STI." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.039
    kind: enumerate
    topic: chemoprophylaxis
    prompt: "Enumerate the 4 measures Doxy-PEP should be combined with."
    points:
      - "Regular STI/HIV testing"
      - "HIV pre-exposure prophylaxis"
      - "Vaccines (HPV, hepatitis A/B)"
      - "Counseling"
    pass: 4
    src: { page: 276, quote: "Use with regular STI/HIV testing, pre-exposure prophylaxis, vaccines (HPV, Hepatitis A/B), and counseling." }
    status: unverified
  - id: phs.L04.040
    kind: card
    topic: chemoprophylaxis
    front: "How often are patients on Doxy-PEP monitored?"
    back: "Every 3–6 months."
    src: { page: 276, quote: "Monitor q3-6 mo." }
    status: unverified
  - id: phs.L04.013
    kind: mcq
    topic: chemoprophylaxis
    stem: >-
      A 27-year-old nurse sustains a needlestick injury while drawing blood from a patient known to have
      HIV with a detectable viral load. She comes to occupational health 4 hours later. Which of the
      following is the most appropriate management?
    options:
      - Tenofovir, emtricitabine and dolutegravir for 28 days, with HIV tests at baseline, 6 wk, 3 mo and 6 mo
      - Repeat HIV testing in 3 months, and start antiretroviral treatment only if that test is positive
      - Zidovudine monotherapy for 7 days, with a single HIV test at the end of the course
      - Hepatitis B immune globulin alone, with HIV and hepatitis C testing in 6 weeks
      - No prophylaxis, because more than 2 hours have passed since the needlestick
    answer: 0
    why:
      - "Right. HIV post-exposure prophylaxis is tenofovir disoproxil fumarate + emtricitabine + (raltegravir or dolutegravir) × 28 days, started ≤72 hr, with HIV tests at baseline and follow-up."
      - "Prophylaxis must start within 72 hours; waiting loses the window."
      - "The book's regimen is three drugs for 28 days."
      - "This is for HBV exposure, not HIV."
      - "The window is ≤72 hours after exposure."
    src: { page: 276, quote: "HIV exposure (sexual, occupational) Tenofovir disoproxil fumarate + emtricitabine + (raltegravir or dolutegravir) × 28 days." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.014
    kind: mcq
    topic: chemoprophylaxis
    stem: >-
      A 34-year-old man is bitten on the hand by a raccoon while camping. He has never received a rabies
      vaccine. Which of the following is the most appropriate management in addition to wound cleaning?
    options:
      - Rabies vaccine and rabies immune globulin
      - Rabies vaccine alone
      - Rabies immune globulin alone
      - Observe the man for symptoms for 10 days
      - Doxycycline
    answer: 0
    why:
      - "Right. Rabies prophylaxis is wound cleaning + rabies vaccine + rabies immune globulin if not previously immunized, on a day 0, 3, 7, 14 schedule."
      - "An unimmunized person also needs rabies immune globulin."
      - "Immune globulin gives passive protection only; active vaccination is also needed."
      - "Waiting for symptoms is too late; rabies is prevented after exposure."
      - "Doxycycline is for STI prevention or malaria, not rabies."
    src: { page: 276, quote: "Wound cleaning + rabies vaccine + rabies immune globulin (if not previously immunized)." }
    status: unverified
  # ---------- p277: insurance plans ----------
