  # ---------- p277: Medicare and Medicaid ----------
  - id: phs.L04.022
    kind: card
    topic: medicare-medicaid
    front: Who is eligible for Medicare?
    back: Everyone aged 65 or older, younger people with certain disabilities, and anyone with end-stage renal disease.
    src: { page: 277, quote: "Medicare is available to patients ≥65 years old, <65 with certain disabilities, and those with end-stage renal disease." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.023
    kind: card
    topic: medicare-medicaid
    front: What is Medicaid?
    back: Health coverage paid for jointly by the federal government and the states, for people with low income or few resources ("MedicaiD is for Disadvantaged").
    src: { page: 277, quote: "Medicaid is joint federal and state health assistance for people with limited income and/ or resources." }
    status: unverified
    tags: [high-yield]
