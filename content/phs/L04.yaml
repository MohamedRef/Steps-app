  # ---------- p278: palliative care ----------
  - id: phs.L04.026
    kind: card
    topic: palliative-care
    front: Does palliative care require a terminal prognosis or stopping curative treatment?
    back: No. It aims for comfort, relief of suffering and quality of life in complex or life-threatening illness regardless of diagnosis or prognosis, and is often concurrent with curative or life-prolonging treatment.
    src: { page: 278, quote: "regardless of their diagnosis or prognosis. Often concurrent with curative or life-prolonging treatment." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.027
    kind: cloze
    topic: palliative-care
    text: "Hospice is the end-of-life form of palliative care: for an expected survival of {{c1::≤6 months}}, once {{c2::curative or life-prolonging}} treatment is no longer wanted or no longer helps."
    src: { page: 278, quote: "Hospice care (end-of-life care)—form of palliative care for patients with prognosis ≤6 months when curative or life-prolonging treatment is no longer wanted or beneficial." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.041
    kind: card
    topic: palliative-care
    front: "Who delivers palliative care, and where?"
    back: "A team from several disciplines (doctors, nurses and social workers among them); it can be given in the hospital, in clinics or at home."
    src: { page: 278, quote: "Delivered by interdisciplinary team (eg, physicians, nurses, social workers) in hospitals, outpatient clinics, or at home." }
    status: unverified
  - id: phs.L04.028
    kind: mcq
    topic: palliative-care
    stem: >-
      A 55-year-old man with newly diagnosed stage III colon cancer is starting curative chemotherapy.
      He has severe neuropathic pain and anxiety. His oncologist suggests a palliative care
      consultation. The patient asks whether this means he is dying. Which of the following is the best
      response?
    options:
      - Palliative care can relieve his symptoms alongside his curative treatment, whatever his prognosis
      - Palliative care is only for patients with ≤6 months to live
      - He must stop chemotherapy to receive palliative care
      - Palliative care is delivered only in hospice facilities
      - Palliative care is only for patients who have stopped all treatment
    answer: 0
    why:
      - "Right. Palliative care relieves suffering regardless of diagnosis or prognosis and is often concurrent with curative treatment."
      - "That describes hospice, a form of palliative care for a prognosis ≤6 months."
      - "It is often given at the same time as curative treatment."
      - "It is delivered by an interdisciplinary team in hospitals, outpatient clinics or at home."
      - "Stopping curative treatment is a feature of hospice, not palliative care in general."
    src: { page: 278, quote: "Medical care aiming to provide comfort, relieve suffering, and improve quality of life in patients with complex or life-threatening illness regardless of their diagnosis or prognosis." }
    status: unverified
  # ---------- p278: types of medical errors ----------
  - id: phs.L04.029
    kind: table
    topic: types-of-medical-errors
    title: Types of medical errors
    columns: [Type, Definition, Example, Impact]
    rows:
      - [Active error, At the level of the frontline operator, Wrong IV pump dose programmed, Immediate impact]
      - [Latent error, In processes indirect from the operator but affecting patient care, Different types of IV pumps used in the same hospital, Accident waiting to happen]
      - [Never event, "Identifiable, serious, usually preventable adverse event", Scalpel retained in a surgical patient's abdomen, Major error that should never occur]
      - [Near miss, "Unplanned event without harm, but with the potential for it", Pharmacist recognizes a drug interaction and cancels the order, Narrow prevention of harm that exposes dangers]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [0, 3], [1, 3]]
    src: { page: 278, quote: "Latent error Occurs in processes indirect from operator but impacts patient care (eg, different types of IV pumps used within same hospital)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.030
    kind: card
    topic: types-of-medical-errors
    front: What is a sentinel event?
    back: A never event whose result is death, lasting harm or severe short-term harm.
    src: { page: 278, quote: "Sentinel event—a never event that leads to death, permanent harm, or severe temporary harm." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.031
    kind: card
    topic: types-of-medical-errors
    front: Should a medical error that caused no harm be disclosed to the patient?
    back: Yes. Medical errors should be disclosed independent of the immediate outcome (harmful or not).
    src: { page: 278, quote: "Medical errors should be disclosed to patients, independent of immediate outcome (harmful or not)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.032
    kind: mcq
    topic: types-of-medical-errors
    stem: >-
      A hospital stocks two brands of insulin pens that look almost identical but have different
      concentrations. Over 6 months, several patients receive the wrong dose. Which type of error does
      the stocking practice represent?
    options:
      - Latent error
      - Active error
      - Near miss
      - Never event
      - Sentinel event
    answer: 0
    why:
      - "Right. A latent error lies in processes indirect from the operator but impacts patient care (like different IV pumps in one hospital): an accident waiting to happen."
      - "An active error occurs at the frontline operator, with immediate impact."
      - "A near miss causes no harm; here patients were harmed."
      - "A never event is a serious, identifiable, usually preventable event such as a retained scalpel."
      - "A sentinel event is a never event leading to death or severe harm."
    src: { page: 278, quote: "Occurs in processes indirect from operator but impacts patient care (eg, different types of IV pumps used within same hospital). Accident waiting to happen." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.033
    kind: mcq
    topic: types-of-medical-errors
    stem: >-
      A physician orders clarithromycin for a patient taking simvastatin. The pharmacist recognizes the
      interaction and calls the physician, who cancels the order. The patient never receives the drug.
      Which term best describes this event?
    options:
      - Near miss
      - Latent error
      - Active error with harm
      - Never event
      - Sentinel event
