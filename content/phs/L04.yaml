    kind: table
    topic: medical-insurance-plans
    title: Major medical insurance plans
    columns: [Plan, Network, Referral, Cost]
    rows:
      - [EPO (exclusive provider organization), "In-network only; out-of-network for emergencies", "—", "—"]
      - [HMO (health maintenance organization), Limited to in-network providers, Primary care referral for specialists, "Lower premiums, lower out-of-pocket cost"]
      - [PoS (point of service), "Out-of-network allowed at higher cost (HMO + PPO)", Requires primary care referrals, Higher cost out of network]
      - [PPO (preferred provider organization), In-network and out-of-network flexibility, No referral requirement, Higher cost for out-of-network]
      - [HDHP (high deductible health plan), "—", "—", "Low premiums, high out-of-pocket cost; compatible with an HSA"]
    blanks: [[0, 1], [1, 2], [2, 1], [3, 2], [4, 3]]
    src: { page: 277, quote: "Lower premiums, limited to in-network providers, requires primary care referral for specialists, lower out-of-pocket cost." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.016
    kind: card
    topic: medical-insurance-plans
    front: What is an accountable care organization (ACO)?
    back: Providers who choose to work together to coordinate the care of their Medicare patients.
    src: { page: 277, quote: "Group of providers who voluntarily coordinate care for Medicare patients." }
    status: unverified
  - id: phs.L04.017
    kind: card
    topic: medical-insurance-plans
    front: Which insurance plan pairs with a health savings account (HSA)?
    back: "A high deductible health plan (HDHP), which costs little each month but leaves the patient paying a lot out of pocket."
    src: { page: 277, quote: "Low premiums, high out-of-pocket cost, compatible with health savings account (HSA)." }
    status: unverified
  - id: phs.L04.018
    kind: mcq
    topic: medical-insurance-plans
    stem: >-
      A 38-year-old woman is choosing a health plan. She wants to see a dermatologist directly without
      first seeing a primary care physician, and wants coverage if she sees a doctor outside the
      network, even at higher cost. Which type of plan best fits her needs?
    options:
      - Preferred provider organization (PPO)
      - Health maintenance organization (HMO)
      - Point of service (PoS)
      - Exclusive provider organization (EPO)
      - Accountable care organization (ACO)
    answer: 0
    why:
      - "Right. A PPO gives in-network and out-of-network flexibility, higher cost out of network, and no referral requirement."
      - "An HMO is limited to in-network providers and requires a primary care referral for specialists."
      - "A PoS allows out-of-network care but requires primary care referrals."
      - "An EPO requires in-network care except for emergencies."
      - "An ACO is a group of providers coordinating care for Medicare patients, not an insurance plan she buys."
    src: { page: 277, quote: "Flexibility with in-network and out-of-network care, higher cost for out-of-network services, no referral requirement." }
    status: unverified
  # ---------- p277: payment models ----------
  - id: phs.L04.019
    kind: table
    topic: healthcare-payment-models
    title: Healthcare payment models
    columns: [Model, How payment works]
    rows:
      - [Bundled payment, "Organization receives a set amount per service, regardless of ultimate cost, divided among all providers and facilities involved"]
      - [Capitation, "Physicians receive a set amount per patient assigned per period of time, regardless of use; used by some HMOs"]
      - [Discounted fee-for-service, "Pays for each service at a discounted rate predetermined by providers and payers (eg, PPOs)"]
      - [Fee-for-service, Insurer and/or patient pays for each individual service]
      - [Global payment, "One payment for all expenses of a single incident of care; most common for elective surgery (covers surgery plus pre- and postoperative visits)"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 277, quote: "Capitation Physicians receive a set amount per patient assigned to them per period of time, regardless of how much the patient uses the healthcare system." }
    status: unverified
    tags: [high-yield]
  - id: phs.L04.020
    kind: mcq
    topic: healthcare-payment-models
    stem: >-
      A primary care physician joins a group that receives a fixed monthly payment for each of the 2,000
      patients assigned to her, whether those patients visit once a year or every week. Which payment
