items:
  # ---------- p271: patient-centered interviewing ----------
  - id: phs.L03.001
    kind: table
    topic: patient-centered-interviewing
    title: Patient-centered interviewing techniques
    columns: [Technique, What to do]
    rows:
      - [Introduction, "Introduce yourself, ask the patient's name and how they'd like to be addressed; use the name and pronouns given; sit at eye level, near, facing them"]
      - [Agenda setting, Identify concerns and set goals with a joint physician-patient agenda]
      - [Reflection, "Actively listen and synthesize what the patient offers, especially the primary concern(s)"]
      - [Validation, Legitimize or affirm the patient's perspectives]
      - [Recapitulation, Summarize what the patient has said so far to ensure correct interpretation]
      - [Facilitation, "Encourage the patient to speak freely, without guiding responses or leading questions; allow questions throughout"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 271, quote: "Recapitulation Summarize what the patient has said so far to ensure correct interpretation." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.002
    kind: card
    topic: patient-centered-interviewing
    front: Which interviewing technique encourages the patient to speak freely without leading questions?
    back: Facilitation (also allow the patient to ask questions throughout the encounter).
    src: { page: 271, quote: "Facilitation Encourage the patient to speak freely without guiding responses or leading questions." }
    status: unverified
  - id: phs.L03.003
    kind: card
    topic: patient-centered-interviewing
    front: How should the physician position themself during the introduction?
    back: Sit at eye level, near the patient, facing them directly.
    src: { page: 271, quote: "Sit at eye level, near the patient, while facing them directly." }
    status: unverified
  - id: phs.L03.004
    kind: mcq
    topic: patient-centered-interviewing
    stem: >-
      A 52-year-old man describes 3 weeks of chest tightness on exertion, his worry about his job and
      his trouble sleeping. Before moving on, the physician says, "So far you've told me that you get
      chest tightness when you climb stairs, that it's been going on for 3 weeks, and that you've been
      worried about work. Did I get that right?" Which interviewing technique is this?
    options:
      - Recapitulation
      - Validation
      - Facilitation
      - Agenda setting
      - Legitimization
    answer: 0
    why:
      - "Right. Recapitulation summarizes what the patient has said so far to ensure correct interpretation."
      - "Validation legitimizes or affirms the patient's perspectives."
      - "Facilitation encourages the patient to speak freely without leading questions."
      - "Agenda setting builds a joint agenda of concerns and goals."
      - "Legitimization (PEARLS) assures the patient that emotional responses are understandable."
    src: { page: 271, quote: "Recapitulation Summarize what the patient has said so far to ensure correct interpretation." }
    status: unverified
  # ---------- p271: establishing rapport (PEARLS) ----------
  - id: phs.L03.005
    kind: enumerate
    topic: establishing-rapport
    prompt: Enumerate the elements of establishing rapport (PEARLS) (6).
    points:
      - "Partnership: work together to identify concerns and develop preferred solutions"
      - "Empathy: acknowledge the emotions and show understanding of why the patient feels that way"
      - "Apology: take personal responsibility when appropriate"
      - "Respect: commend the patient for coming in, persevering or other constructive behaviors"
      - "Legitimization: assure the patient that emotional responses are understandable or common"
      - "Support: reassure that you will work together through difficult times; offer resources"
    pass: 6
    hook: "PEARLS: لؤلؤ العلاقة مع المريض، Partnership و Empathy و Apology و Respect و Legitimization و Support."
    src: { page: 271, quote: "Establishing rapport PEARLS Partnership Work together with patient to identify primary concerns and develop preferred solutions." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.006
    kind: card
    topic: establishing-rapport
    front: "A physician says, \"It's very common to feel overwhelmed after a diagnosis like this.\" Which PEARLS element is this?"
    back: Legitimization (assuring the patient that emotional responses are understandable or common).
    src: { page: 271, quote: "Legitimization Assure patient that emotional responses are understandable or common." }
    status: unverified
  - id: phs.L03.007
    kind: mcq
    topic: establishing-rapport
    stem: >-
      A 40-year-old woman with poorly controlled type 2 diabetes returns for follow-up. She says she
      has been walking every evening despite working two jobs. The physician says, "I really admire
      that you've kept walking with such a busy schedule." Which element of rapport building does
      this illustrate?
    options:
      - Respect
      - Partnership
      - Apology
      - Support
      - Recapitulation
    answer: 0
    why:
      - "Right. Respect commends the patient for pushing through challenging circumstances or other constructive behaviors."
      - "Partnership is working together to identify concerns and develop solutions."
      - "Apology is taking personal responsibility when appropriate."
      - "Support is reassuring the patient that you will work together through difficult times and offering resources."
      - "Recapitulation is an interviewing technique that summarizes what the patient said."
    src: { page: 271, quote: "Respect Commend the patient for coming in to discuss a problem, pushing through challenging circumstances, keeping a positive attitude, or other constructive behaviors." }
    status: unverified
  # ---------- p271: patients with disabilities ----------
  - id: phs.L03.008
    kind: card
    topic: patients-with-disabilities
    front: Person-first or identity-first language for a patient with a disability?
    back: Either may be preferred ("a person with a disability" vs "a disabled person"); ask the patient what terms they use.
    src: { page: 271, quote: "Patients may identify with person-first (ie, “a person with a disability”) or identity-first (ie, “a disabled person”) language. Ask patients what terms they use." }
    status: unverified
  - id: phs.L03.009
    kind: card
    topic: patients-with-disabilities
    front: To whom should the physician speak when a nonverbal patient comes with a caregiver?
    back: Under most circumstances, directly to the patient. Do not assume nonverbal patients do not understand; caregivers can add information as needed.
    src: { page: 271, quote: "Under most circumstances, talk directly to the patient. Do not assume that nonverbal patients do not understand." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.010
    kind: card
    topic: patients-with-disabilities
    front: How do you help a patient with speech difficulties whose speech is hard to understand?
    back: Allow extra time; consider asking them to write a few words or rephrase; repeat what they said to make sure you understood.
    src: { page: 271, quote: "For patients with speech difficulties, provide extra time for the interview." }
    status: unverified
  - id: phs.L03.011
    kind: card
    topic: patients-with-disabilities
    front: What kind of language and questions suit a patient with a cognitive impairment?
    back: Plain, concrete wording and short, direct questions.
    src: { page: 271, quote: "For patients with a cognitive impairment, use concrete, specific language. Ask simple, direct questions." }
    status: unverified
  - id: phs.L03.068
    kind: enumerate
    topic: patients-with-disabilities
    prompt: "Besides concrete language and simple questions, enumerate 3 more ways to communicate with a patient who has a cognitive impairment."
    points:
      - "Remove background noise and distractions"
      - "Don't assume the patient can read"
      - "Adapt to how the patient understands best (eg, hand gestures, asking them to demonstrate a task)"
    pass: 3
    src: { page: 271, quote: "Eliminate background noise and distractions. Do not assume the patient can read. Adjust to how the patient understands best (eg, use hand gestures or ask them to demonstrate a task)." }
    status: unverified
  - id: phs.L03.012
    kind: card
    topic: patients-with-disabilities
    front: How do you communicate with a patient who is deaf and prefers to lipread?
    back: Cut out background noise, keep your face toward them, and speak the way you normally do.
    src: { page: 271, quote: "For patients who prefer to speak and lipread, eliminate background noise, face the patient, and do not change your mode of speaking." }
    status: unverified
  - id: phs.L03.069
    kind: enumerate
    topic: patients-with-disabilities
    prompt: "Enumerate 3 general steps for communicating with a patient who is deaf or hard of hearing."
    points:
      - "Ask which way of communicating they prefer"
      - "Get their attention with a light touch or a wave"
      - "Use an interpreter when needed"
    pass: 3
    src: { page: 271, quote: "Ask patients who are deaf or hard of hearing their preferred mode of communication. Use light touch or waving to get their attention." }
    status: unverified
  - id: phs.L03.013
    kind: cloze
    topic: patients-with-disabilities
    text: "With a patient who has a disability, {{c1::ask whether they want help}} instead of assuming they can't manage on their own."
    src: { page: 271, quote: "Ask if assistance is desired rather than assuming the patient cannot do something alone." }
    status: unverified
  - id: phs.L03.070
    kind: card
    topic: patients-with-disabilities
    front: "A wheelchair user comes in with an ear infection. Should you raise the disability?"
    back: "No. Leave the disability out of the visit when it has nothing to do with the problem."
    src: { page: 271, quote: "do not bring up a disability if it is not relevant to a visit (eg, a patient in a wheelchair with an ear infection)." }
    status: unverified
  - id: phs.L03.071
    kind: card
    topic: patients-with-disabilities
    front: "A patient's disability makes the physical exam hard. May you skip relevant parts of it?"
    back: "No. Do every part of the exam that is relevant, even when it is challenging."
    src: { page: 271, quote: "Do not skip relevant parts of the physical exam even if the disability makes the exam challenging." }
    status: unverified
  - id: phs.L03.014
    kind: mcq
    topic: patients-with-disabilities
    stem: >-
      A 26-year-old man with cerebral palsy who uses a wheelchair and has dysarthric speech comes to the
      clinic with ear pain. His mother accompanies him. Which of the following is the most appropriate
      approach to the interview?
    options:
      - Speak directly to the patient and allow extra time for his answers
      - Address the questions to his mother because his speech is hard to understand
      - Begin by asking about the cause of his cerebral palsy
      - Skip the otoscopic exam because positioning him is difficult
      - Use simplified words because his speech is impaired
    answer: 0
    why:
      - "Right. Talk directly to the patient, and for speech difficulties provide extra time (ask him to write or rephrase if needed)."
      - "Caregivers can add information, but the interview is with the patient."
      - "Don't bring up a disability that isn't relevant to the visit."
      - "Do not skip relevant parts of the exam even if the disability makes it challenging."
      - "Speech difficulty is not cognitive impairment; don't assume he doesn't understand."
    src: { page: 271, quote: "As with other parts of a medical history, do not bring up a disability if it is not relevant to a visit (eg, a patient in a wheelchair with an ear infection)." }
    status: unverified
  - id: phs.L03.086
    kind: card
    topic: patients-with-disabilities
    front: Why ask a patient with a disability whether they want assistance instead of just helping?
    back: Most people, including people with disabilities, value their independence; do not assume the patient cannot do something alone.
    src: { page: 271, quote: "Ask if assistance is desired rather than assuming the patient cannot do something alone. Most people, including people with disabilities, value their independence." }
    status: unverified
  # ---------- p272: cultural formulation interview ----------
  - id: phs.L03.015
    kind: enumerate
    topic: cultural-formulation-interview
    prompt: Enumerate what the cultural formulation interview identifies (5).
    points:
      - The problem through the patient's perspective (in their own words)
      - Cultural perceptions of factors leading to the problem (why they think it's happening)
      - How the patient's background influences the problem (family, community, spirituality)
      - How culture may impact current and future interventions
      - Possible barriers to care based on culture
    pass: 5
    hook: "المشكلة بكلامه، وسببها في نظره، وخلفيته، وأثرها على العلاج، والحواجز."
    src: { page: 272, quote: "Identify the problem through the patient’s perspective. Ask the patient to describe the problem in their own words" }
    status: unverified
  - id: phs.L03.016
    kind: card
    topic: cultural-formulation-interview
    front: If a patient doesn't want to follow medical advice for cultural reasons, what should the physician investigate?
    back: Whether the patient's own plans can be fitted together with the standard treatment.
    src: { page: 272, quote: "If they do not want to follow medical advice, investigate if there is a way to combine their plans with the standard medical regimen." }
    status: unverified
  - id: phs.L03.017
    kind: mcq
    topic: cultural-formulation-interview
    stem: >-
      A 48-year-old woman recently immigrated from West Africa and has newly diagnosed hypertension.
      She says she has been drinking an herbal tea her grandmother recommended and is reluctant to start
      medication. Which of the following is the most appropriate next step?
    options:
      - Ask what she thinks causes it and whether the tea can be combined with treatment
      - Tell her the herbal tea is ineffective and that she must stop drinking it before treatment can begin
      - Refer her to a physician from her own culture who will better understand her beliefs about the tea
      - Start antihypertensive medication today without discussing the tea, since it is unlikely to interact
      - Document nonadherence in her chart and schedule a routine follow-up visit in 1 year
    answer: 0
    why:
      - "Right. Identify cultural perceptions of the problem and, if she does not want to follow advice, investigate combining her plans with the standard regimen."
      - "Dismissing her beliefs harms the patient-physician relationship."
      - "Referral avoids rather than explores her perspective."
      - "Culture may impact the intervention and needs discussing."
      - "This abandons care instead of addressing barriers."
    src: { page: 272, quote: "Identify cultural perceptions of factors leading to a problem. Ask the patient to explain why they think they are experiencing their problem." }
    status: unverified
  - id: phs.L03.087
    kind: table
    topic: cultural-formulation-interview
    title: "Cultural formulation interview: what to ask for each goal"
    columns: [What to ask, Goal]
    rows:
      - ["Describe the problem in your own words, or as you would describe it to family and friends", "The problem through the patient's perspective"]
      - ["Why do you think you are experiencing this problem?", Cultural perceptions of the causes]
      - ["What makes the problem better or worse? Roles of family, community and spirituality", How the patient's background influences the problem]
      - ["Any concerns or suggestions about the current plan of treatment?", How culture may impact current and future interventions]
      - ["Is there anything that would prevent you from seeking care in a standard medical institution? Probe for explanations", Possible barriers to care based on culture]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 272, quote: "Identify how the patient’s background influences their problem. Ask the patient about what makes their problem better or worse. Investigate roles of family, community, and spirituality." }
    status: unverified
  - id: phs.L03.088
    kind: card
    topic: cultural-formulation-interview
    front: When exploring cultural barriers to care, what should the physician probe for?
    back: Explanations, and what may increase the chance of maintaining a good patient-physician relationship.
    src: { page: 272, quote: "Ask the patient if there is anything that would prevent them from seeking care in a standard medical institution. Probe for explanations and what may increase the chance of maintaining a good patient-physician relationship." }
    status: unverified
  # ---------- p272: trauma-informed care ----------
  - id: phs.L03.018
    kind: card
    topic: trauma-informed-care
    front: What should be regularly assessed in a patient with a history of psychological trauma?
    back: Mood, substance use, social supports, and suicide risk (thorough behavioral health screening).
    src: { page: 272, quote: "Regularly assess mood, substance use, social supports, and suicide risk." }
    status: unverified
  - id: phs.L03.019
    kind: cloze
    topic: trauma-informed-care
    text: "In trauma-informed care, avoid invasive questions that make the patient recount the trauma {{c1::in detail}}, and get their {{c2::permission}} before talking about it."
    src: { page: 272, quote: "Do not ask invasive questions requiring the patient to describe trauma in detail. Ask permission prior to discussion." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.072
    kind: cloze
    topic: trauma-informed-care
    text: "Before examining a trauma survivor, tell them they can {{c1::signal to stop the exam at once}} if it becomes too uncomfortable physically or emotionally."
    src: { page: 272, quote: "Before the physical exam, reassure patients that they may signal to end it immediately if they experience too much physical or emotional discomfort." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.020
    kind: enumerate
    topic: trauma-informed-care
    prompt: Enumerate the 4 R's of trauma-informed care.
    points:
      - Realize
      - Recognize
      - Respond
      - Resist retraumatization
    pass: 4
    hook: "4 R: تفهم، تلاحظ، تتصرف، وما تجرحش تاني."
    src: { page: 272, quote: "Remember 4 R’s: Realize, Recognize, Respond, Resist retraumatization." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.021
    kind: mcq
    topic: trauma-informed-care
    stem: >-
      A 23-year-old woman who was sexually assaulted 6 months ago comes for a routine pelvic
      examination. She appears anxious. Which of the following is the most appropriate approach?
    options:
      - Tell her she may stop the exam at any time; offer support staff
      - Ask her to describe the assault in full detail so it can be documented completely
      - Proceed quickly with the full exam to keep the time of her distress short
      - Postpone all physical examinations until she has completed trauma counseling
      - Ask her family to stay in the room for support without first asking her
    answer: 0
    why:
      - "Right. Before the exam, reassure the patient she may end it immediately if she feels too much discomfort, and offer additional staff for support."
      - "Do not ask invasive questions requiring the patient to describe trauma in detail."
      - "Speed without reassurance and permission risks retraumatization."
      - "Counseling may be indicated, but needed care should not be withheld."
      - "Support is offered, with her permission, not imposed."
    src: { page: 272, quote: "Before the physical exam, reassure patients that they may signal to end it immediately if they experience too much physical or emotional discomfort. Offer the presence of additional staff for support." }
    status: unverified
  - id: phs.L03.089
    kind: card
    topic: trauma-informed-care
    front: In trauma-informed care, what should assessments focus on?
    back: Trauma-related symptoms that interfere with social and occupational function, always with empathy.
    src: { page: 272, quote: "Focus assessments on trauma-related symptoms that interfere with social and occupational function. Always be empathetic." }
    status: unverified
  - id: phs.L03.090
    kind: card
    topic: trauma-informed-care
    front: Besides letting the patient stop the exam, what support does trauma-informed care offer around the physical exam and after it?
    back: Offer the presence of additional staff for support. Psychological counseling may be indicated, and follow-up counseling is offered or advised as appropriate.
    src: { page: 272, quote: "Offer the presence of additional staff for support. Psychological counseling may be indicated. Follow-up counseling is offered (or advised) as appropriate." }
    status: unverified
  # ---------- p272: motivational interviewing ----------
  - id: phs.L03.022
    kind: card
    topic: motivational-interviewing
    front: What does motivational interviewing do, and must the patient be committed to change?
    back: It helps patients resolve ambivalence about change to facilitate behavior modification. It helps when the patient has some desire to change but does not require commitment to change.
    src: { page: 272, quote: "Helpful when patient has some desire to change, but it does not require that the patient be committed to making the change." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.073
    kind: card
    topic: motivational-interviewing
    front: "In motivational interviewing, what kinds of barriers should you assess?"
    back: "Anything that makes behavior change hard, such as poor access to food or untreated trauma."
    src: { page: 272, quote: "Assess barriers (eg, food access, untreated trauma) that may make behavior change difficult." }
    status: unverified
  - id: phs.L03.074
    kind: card
    topic: motivational-interviewing
    front: "Why assess a patient's readiness for change in motivational interviewing?"
    back: "It guides which goals the physician suggests."
    src: { page: 272, quote: "Assessing a patient’s readiness for change is also important for guiding physician-suggested goals." }
    status: unverified
  - id: phs.L03.023
    kind: enumerate
    topic: motivational-interviewing
    prompt: Enumerate the qualities of physician-suggested goals (SMART) (5).
    points:
      - Specific
      - Measurable
      - Achievable
      - Relevant
      - Time bound
    pass: 5
    hook: "الهدف الـ SMART: محدد، يتقاس، ممكن، مناسب، وليه ميعاد."
    src: { page: 272, quote: "These goals should be Specific, Measurable, Achievable, Relevant, and Time bound (SMART)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L03.024
    kind: mcq
    topic: motivational-interviewing
    stem: >-
      A 45-year-old man who smokes 1 pack per day says, "I know I should quit, and I'd like to be there
      for my kids, but smoking is the only thing that helps me relax." Which of the following is the
      most appropriate response?
    options:
      - "\"What do you like and dislike about smoking?\""
      - "\"You must quit today, or you will get lung cancer.\""
      - "\"Let's wait until you're fully committed to quitting.\""
      - "\"I'll refer you to a smoking cessation specialist.\""
      - "\"Many people relax without smoking; you can too.\""
    answer: 0
    why:
      - "Right. Motivational interviewing helps resolve ambivalence, examining how the behavior interferes with his life or why he might want to change."
      - "Fear and coercion are not motivational interviewing."
      - "It does not require that the patient be committed to the change; some desire is enough."
      - "Referral skips the conversation that resolves his ambivalence."
      - "This dismisses his stated barrier instead of exploring it."
    src: { page: 272, quote: "Counseling technique to facilitate behavior modification by helping patients resolve ambivalence about change." }
    status: unverified
  - id: phs.L03.091
    kind: card
    topic: motivational-interviewing
    front: For which conditions is motivational interviewing useful, and what might you ask the patient?
    back: Many conditions (eg, nicotine dependence, obesity). Ask the patient to examine how their behavior interferes with their life or why they might want to change it.
    src: { page: 272, quote: "Useful for many conditions (eg, nicotine dependence, obesity). Helpful when patient has some desire to change, but it does not require that the patient be committed to making the change. May involve asking patients to examine how their behavior interferes with their life or why they might want to change it." }
    status: unverified
  # ---------- p272: inclusive history taking ----------
  - id: phs.L03.025
    kind: card
    topic: inclusive-history-taking
    front: Can you infer sexual behavior from a patient's stated sexual orientation?
    back: No. Don't assume orientation, gender identity, gender expression or behavior; someone who identifies as heterosexual may still have same-sex partners.
    src: { page: 272, quote: "a patient who identifies as heterosexual may engage in same-sex sexual activity" }
    status: unverified
  - id: phs.L03.026
    kind: cloze
    topic: inclusive-history-taking
    text: "On first meeting a patient, use {{c1::gender-neutral}} terms (eg, \"partner\" rather than \"husband\" or \"wife\") until the patient instructs otherwise or uses specific pronouns."
    src: { page: 272, quote: "Use gender-neutral terms when referring to the patient or the patient’s family (eg, “partner” rather than “husband” or “wife”) upon first meeting the patient" }
    status: unverified
  - id: phs.L03.027
    kind: card
    topic: inclusive-history-taking
    front: Should you ask about gender identity when a gender-nonconforming patient comes for a hand laceration?
    back: No. Leave gender and sexuality out of a visit when they have nothing to do with the problem.
    src: { page: 272, quote: "Do not bring up gender or sexuality if it is not relevant to the visit (eg, a gender-nonconforming patient seeking care for a hand laceration)." }
    status: unverified
  - id: phs.L03.075
    kind: card
    topic: inclusive-history-taking
    front: "How can a physician model inclusive use of pronouns?"
    back: "State your own pronouns when you introduce yourself, ask how the patient wants to be addressed, and make sure the patient's correct name and pronouns are in the electronic medical record."
    src: { page: 272, quote: "Also consider ways of being inclusive (eg, ensuring correct name and pronouns are in the electronic medical record)." }
    status: unverified
  - id: phs.L03.076
    kind: card
    topic: inclusive-history-taking
    front: "What does the book ask you to remember about trust with gender- and sexuality-diverse patients?"
    back: "Reassure them that the visit is confidential, and know that trust grows over time by listening to and learning from the patient."
    src: { page: 272, quote: "Remember: trust is built over time, and listening to and learning from patients about how they would like to approach the topics discussed above is key." }
    status: unverified
  - id: phs.L03.028
    kind: mcq
    topic: inclusive-history-taking
    stem: >-
      A 34-year-old patient comes to a new primary care physician for a routine visit. The intake form
      lists the patient's name only. Which of the following is the most appropriate way to begin the
      sexual history?
    options:
      - "\"Do you have a partner? Tell me about your sexual partners.\""
      - "\"Tell me about your husband or wife.\""
      - "\"Since this is a routine visit, we can skip the sexual history.\""
      - "\"Do you have a girlfriend at the moment?\""
      - "\"What is your sexual orientation? That tells me which tests you need.\""
    answer: 0
    why:
      - "Right. Use gender-neutral terms such as \"partner\" until the patient instructs otherwise, and avoid assumptions."
      - "\"Husband or wife\" assumes the patient is married and uses gendered terms before the patient has said anything."
      - "A sexual history is part of a routine preventive visit; leaving it out is not the inclusive choice."
      - "\"Girlfriend\" assumes the partner's gender."
      - "Orientation doesn't predict behavior; a heterosexual-identifying patient may have same-sex activity, so ask about behavior."
    src: { page: 272, quote: "Avoid making assumptions about sexual orientation, gender identity, gender expression, and behavior" }
    status: unverified
  - id: phs.L03.092
    kind: card
    topic: inclusive-history-taking
    front: Can a patient's assigned sex at birth differ from their gender identity?
    back: Yes, they may differ, so avoid assumptions about gender identity, gender expression and behavior.
    src: { page: 272, quote: "A patient’s assigned sex at birth and gender identity may differ." }
