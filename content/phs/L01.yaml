  # ---------- p256: observational studies ----------
  - id: phs.L01.001
    kind: table
    topic: observational-studies
    title: Observational studies
    columns: [Study type, Design, Measure]
    rows:
      - [Case series, "Several patients with the same diagnosis, treatment or outcome; no comparison group", Description of clinical findings]
      - [Cross-sectional, Frequency of disease and risk factors assessed in the present, "Disease prevalence; association but not causality"]
      - [Case-control, "Retrospectively compares people with disease to people without; odds of prior exposure", Odds ratio (OR)]
      - [Cohort, "Compares exposed with unexposed; is exposure associated with later disease? Prospective or retrospective", "Disease incidence; relative risk (RR)"]
      - [Twin concordance, Compares how often both monozygotic vs both dizygotic twins develop the disease, Heritability and environment (nature vs nurture)]
      - [Adoption, Compares siblings raised by biological vs adoptive parents, Heritability and environment]
      - [Ecological, Compares disease and risk factors across populations, "Population data, not necessarily applicable to individuals (ecological fallacy)"]
    blanks: [[0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [6, 2], [2, 1], [3, 1]]
    src: { page: 256, quote: "Case-control study Retrospectively compares a group of people with disease to a group without disease." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.092
    kind: card
    topic: observational-studies
    front: "Twin concordance study: what does it show when one monozygotic twin has schizophrenia?"
    back: "The other monozygotic twin has a much higher concordance rate than a dizygotic twin would, pointing to a strong genetic component."
    src: { page: 256, quote: "If one monozygotic twin develops schizophrenia, the other twin has a much higher concordance rate than dizygotic twins, showing a strong genetic component." }
    status: unverified
  - id: phs.L01.093
    kind: card
    topic: observational-studies
    front: "Adoption study: what is the risk for an adopted child whose biological parent had schizophrenia?"
    back: "Higher risk of schizophrenia, whatever the health of the adoptive parents."
    src: { page: 256, quote: "An adopted child has a higher risk of developing schizophrenia if their biological parent had schizophrenia, regardless of the adoptive parents’ health." }
    status: unverified
  - id: phs.L01.002
    kind: card
    topic: observational-studies
    front: Why can't a case series show a risk factor association with disease?
    back: It has no comparison group.
    src: { page: 256, quote: "Has no comparison group, thus cannot show risk factor association with disease." }
    status: unverified
  - id: phs.L01.003
    kind: cloze
    topic: observational-studies
    text: A case-control study uses the {{c1::odds ratio}} ("control the case in the OR"); a cohort study uses the {{c2::relative risk}} ("cohort = relative risk").
    src: { page: 256, quote: "Odds ratio (OR). Control the case in the OR." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.004
    kind: card
    topic: observational-studies
    front: What is the ecological fallacy?
    back: Ecological studies measure population data that are not necessarily applicable to individuals.
    src: { page: 256, quote: "Measures population data not necessarily applicable to individuals (ecological fallacy)." }
    status: unverified
  - id: phs.L01.005
    kind: mcq
    topic: observational-studies
    stem: >-
      Researchers identify 200 patients with newly diagnosed pancreatic cancer and 400 people of similar
      age without cancer. Both groups are interviewed about their smoking history over the past 30
      years. Which measure of association is most appropriate for this study?
    options:
      - Odds ratio
      - Relative risk
      - Incidence rate
      - Attributable risk
      - Prevalence
    answer: 0
    why:
      - "Right. Comparing people with and without disease for prior exposure is a case-control study, which uses the odds ratio."
      - "Relative risk needs incidence in exposed vs unexposed groups, as in a cohort study."
      - "Incidence cannot be measured when subjects are chosen by disease status."
      - "Attributable risk is a difference in risk, which needs a cohort design."
      - "Prevalence is measured by a cross-sectional study."
    src: { page: 256, quote: "Looks to see if odds of prior exposure or risk factor differ by disease state. Odds ratio (OR)." }
    status: unverified
  # ---------- p257: clinical therapeutic trial ----------
  - id: phs.L01.006
    kind: card
    topic: clinical-therapeutic-trial
    front: Which three design features make a clinical trial higher quality?
    back: Randomization, a control group and double blinding.
    src: { page: 257, quote: "Study quality improves when clinical trial is randomized, controlled, and double-blinded (ie, neither subject nor researcher knows whether the subject is in the treatment or control group)." }
    status: unverified
  - id: phs.L01.075
    kind: card
    topic: clinical-therapeutic-trial
    front: "In a trial, what is the difference between double-blind and triple-blind?"
    back: "Double-blind: neither the subjects nor the researchers know who got which treatment. Triple-blind: the people analyzing the data are kept unaware as well."
    src: { page: 257, quote: "Triple-blind refers to additional blinding of the researchers analyzing the data." }
    status: unverified
  - id: phs.L01.007
    kind: card
    topic: clinical-therapeutic-trial
    front: What is a crossover clinical trial?
    back: Each subject receives a series of ≥2 treatments in randomized order, with a washout period between them, so subjects serve as their own controls.
    src: { page: 257, quote: "Crossover clinical trial—compares the effect of a series of ≥2 treatments on a subject. Order in which subjects receive treatments is randomized. Washout period occurs between treatments." }
    status: unverified
  - id: phs.L01.008
    kind: table
    topic: clinical-therapeutic-trial
    title: Ways to analyze a clinical trial
    columns: [Analysis, Who is analyzed and how, Bias]
    rows:
      - [Intention-to-treat, "All subjects by their original randomly assigned group (once randomized, always analyzed)", "Avoids bias from attrition, crossover and noncompliance; may dilute true effects"]
      - [As-treated, All subjects by the treatment they actually received, ↑ risk of bias]
      - [Per-protocol, Subjects who did not complete the assigned treatment are excluded, ↑ risk of bias]
    blanks: [[0, 1], [1, 1], [2, 1], [0, 2]]
    src: { page: 257, quote: "Intention-to-treat analysis—all subjects are analyzed according to their original, randomly assigned treatment. No one is excluded, ie, once randomized, always analyzed." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.009
    kind: table
    topic: clinical-therapeutic-trial
    title: Phases of clinical trials (Can I SWIM?)
    columns: [Phase, Purpose, Sample]
    rows:
      - [Preclinical, Lab animals and in vitro experiments, ""]
      - [Phase 0, "Initial PK/PD via microdosing; often skipped", "Very small number; open label"]
      - [Phase 1, "Safety: dose escalation, maximum tolerable dose", "Small number of healthy volunteers or patients; open label"]
      - [Phase 2, "Efficacy (does it Work?), short-term adverse effects", "Moderate number of patients; randomized, controlled"]
      - [Phase 3, "Effectiveness vs standard of care/placebo (any Improvement?)", "Large number of patients; randomized, controlled"]
      - [Phase 4, "Long-term or rare adverse effects (stay on the Market?)", "Postmarketing surveillance; open label"]
    blanks: [[1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 257, quote: "Clinical trials occur after preclinical studies and consist of five phases (“Can I SWIM?”)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.010
    kind: card
    topic: clinical-therapeutic-trial
    front: When does FDA approval happen relative to the clinical trial phases?
    back: After phase 3 and before phase 4 (postmarketing surveillance).
    src: { page: 257, quote: "FDA approval Phase 3" }
    status: unverified
  - id: phs.L01.011
    kind: mcq
    topic: clinical-therapeutic-trial
    stem: >-
      In a randomized trial of a new antihypertensive drug, 15% of patients assigned to the drug stop
      taking it because of dizziness, and some start taking the control drug instead. The investigators
      analyze every patient in the group to which they were originally randomized. What is the main
      advantage of this approach?
    options:
      - It avoids bias from attrition, crossover and nonrandom noncompliance
      - It shows the largest possible effect of the drug
      - It excludes patients who did not complete treatment
      - It analyzes patients by the treatment they actually received
      - It removes the need for blinding
    answer: 0
    why:
      - "Right. Intention-to-treat analysis keeps everyone in their randomized group (once randomized, always analyzed), avoiding bias from attrition, crossover and noncompliance."
      - "Intention-to-treat may dilute the true effect of the intervention, not maximize it."
      - "Excluding non-completers is per-protocol analysis, which ↑ risk of bias."
      - "Analyzing by treatment received is as-treated analysis, which ↑ risk of bias."
      - "Blinding is a separate design feature."
    src: { page: 257, quote: "Attempts to avoid bias from attrition, crossover, and nonrandom noncompliance, but may dilute the true effects of intervention." }
    status: unverified
  # ---------- p257: off-label ----------
  - id: phs.L01.012
    kind: card
    topic: off-label-drug-use
    front: What is off-label drug use?
    back: Giving a drug for a disease, a patient group, a form or a dose that the FDA has not specifically approved it for.
    src: { page: 257, quote: "Use of a drug to treat a disease in a form, population group, or dosage that is not specifically approved by the FDA." }
    status: unverified
  - id: phs.L01.076
    kind: card
    topic: off-label-drug-use
    front: "What are the two reasons the book gives for off-label drug use?"
    back: "The illness has no approved drug treatment, or the approved options have already failed and alternatives are being explored."
    src: { page: 257, quote: "Reasons for off-label use include treatment of an illness with no approved pharmacologic treatment or exploring alternative treatments after failure of approved options." }
    status: unverified
  - id: phs.L01.077
    kind: card
    topic: off-label-drug-use
    front: "What is the book's example of off-label drug use?"
    back: "Tricyclic antidepressants given for neuropathic or chronic pain."
    src: { page: 257, quote: "Example: use of tricyclic antidepressants for treating neuropathic/chronic pain." }
    status: unverified
  - id: phs.L01.013
    kind: mcq
    topic: off-label-drug-use
    stem: >-
      A 58-year-old woman has painful diabetic neuropathy that did not respond to two FDA-approved agents.
      Her physician prescribes amitriptyline at a low dose for the pain, although its approved
      indication is depression. Which term best describes this prescription?
    options:
      - Off-label drug use
      - A phase 4 trial
      - A crossover trial
      - Per-protocol treatment
      - An adverse drug reaction
    answer: 0
    why:
      - "Right. Using a TCA for neuropathic/chronic pain is the book's example of off-label use, here after failure of approved options."
      - "Phase 4 is postmarketing surveillance in a study, not individual prescribing."
      - "A crossover trial gives each subject several treatments in randomized order."
      - "Per-protocol is a way to analyze a trial."
      - "Nothing here describes an adverse reaction."
    src: { page: 257, quote: "Example: use of tricyclic antidepressants for treating neuropathic/chronic pain." }
    status: unverified
  # ---------- p257: Bradford Hill ----------
  - id: phs.L01.014
    kind: card
    topic: bradford-hill-criteria
    front: What are the Bradford Hill criteria?
    back: A set of principles that only partly supports a cause-and-effect claim; meeting them is needed but is not enough to prove causation.
    src: { page: 257, quote: "A group of principles that provide limited support (ie, necessary but not sufficient criteria) for establishing evidence of a causal relationship between presumed cause and effect." }
    status: unverified
  - id: phs.L01.015
    kind: table
    topic: bradford-hill-criteria
    title: Bradford Hill criteria
    columns: [Criterion, Meaning]
    rows:
      - [Strength, "The stronger the association, the more evidence for causation"]
      - [Consistency, Repeated findings in multiple distinct samples]
      - [Specificity, "The more specific the cause is to the effect, the stronger the evidence"]
      - [Temporality, The cause precedes the effect by an expected amount of time]
      - [Biological gradient, Greater effect with greater exposure (dose-response)]
      - [Plausibility, A conceivable mechanism exists]
      - [Coherence, Cause and effect do not conflict with scientific consensus]
      - [Experiment, "Empirical evidence (animal, in vitro studies)"]
      - [Analogy, Comparable to a similar established cause and effect]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1]]
    src: { page: 257, quote: "Temporality The presumed cause precedes the effect by an expected amount of time. Biological gradient Greater effect observed with greater exposure to the presumed cause (dose-response relationship)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.016
    kind: mcq
    topic: bradford-hill-criteria
    stem: >-
      A cohort study finds that workers with 1 year of asbestos exposure have a 2-fold risk of
      mesothelioma, those with 10 years a 5-fold risk, and those with 20 years a 10-fold risk. Which
      Bradford Hill criterion does this finding best support?
    options:
      - Biological gradient
      - Temporality
      - Consistency
      - Plausibility
      - Analogy
    answer: 0
    why:
      - "Right. A greater effect with greater exposure is the biological gradient (dose-response relationship)."
      - "Temporality is that the cause precedes the effect by an expected time."
      - "Consistency is the same finding repeated in multiple distinct samples."
      - "Plausibility is a conceivable mechanism."
      - "Analogy is similarity to an established cause and effect."
    src: { page: 257, quote: "Biological gradient Greater effect observed with greater exposure to the presumed cause (dose-response relationship)." }
    status: unverified
  # ---------- p258-259: quantifying risk ----------
  - id: phs.L01.017
    kind: card
    topic: quantifying-risk
    front: In a 2 × 2 table (a, b = exposed with/without disease; c, d = unexposed with/without disease), what are the formulas for OR and RR?
    back: "OR = (a/c)/(b/d) = ad/bc. RR = [a/(a + b)] / [c/(c + d)]."
    src: { page: 258, quote: "Definitions and formulas are based on the classic 2 × 2 or contingency table." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.018
    kind: card
    topic: quantifying-risk
    front: How do you interpret OR = 1, > 1 and < 1?
    back: "OR = 1: odds of exposure equal in cases and controls. OR > 1: odds of exposure greater in cases. OR < 1: odds of exposure greater in controls."
    src: { page: 258, quote: "OR = 1 → odds of exposure are equal in cases and controls. OR > 1 → odds of exposure are greater in cases. OR < 1 → odds of exposure are greater in controls." }
    status: unverified
  - id: phs.L01.019
    kind: card
    topic: quantifying-risk
    front: When does the odds ratio approximate the relative risk?
    back: For rare diseases (low prevalence).
    src: { page: 258, quote: "For rare diseases (low prevalence), OR approximates RR." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.020
    kind: table
    topic: quantifying-risk
    title: Risk formulas
    columns: [Measure, Formula]
    rows:
      - [Relative risk reduction, "RRR = 1 – RR = (ARC – ART)/ARC"]
      - [Attributable risk, "AR = a/(a + b) – c/(c + d); AR% = (RR – 1)/RR × 100"]
      - [Absolute risk reduction, "ARR = c/(c + d) – a/(a + b)"]
      - [Number needed to treat, NNT = 1/ARR (lower = better treatment)]
      - [Number needed to harm, NNH = 1/AR (higher = safer exposure)]
      - [Case fatality rate, "CFR% = deaths/cases × 100"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1]]
    src: { page: 258, quote: "Number needed to treat Number of patients who need to be treated for 1 patient to benefit. Lower number = better treatment. NNT = 1/ARR" }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.078
    kind: table
    topic: quantifying-risk
    title: Mortality rate and attack rate
    columns: [Measure, Formula]
    rows:
      - [Mortality rate, "Deaths per 1000 people per year"]
      - [Attack rate, "People who become ill / total people exposed"]
    blanks: [[0, 1], [1, 1]]
    src: { page: 259, quote: "Attack rate Proportion of exposed people who become ill." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.021
    kind: card
    topic: quantifying-risk
    front: How is attributable risk different from absolute risk reduction?
    back: Attributable risk is the difference in risk between exposed and unexposed groups. Absolute risk reduction is the difference in risk (not the proportion) attributable to an intervention compared with a control.
    src: { page: 258, quote: "The difference in risk between exposed and unexposed groups." }
    status: unverified
  - id: phs.L01.022
    kind: mcq
    topic: quantifying-risk
    stem: >-
      In a randomized trial, 10% of patients given placebo and 6% of patients given a new statin have a
      myocardial infarction over 5 years. How many patients need to be treated with the statin for 5
      years to prevent one myocardial infarction?
    options:
      - "25"
      - "4"
      - "40"
      - "16"
      - "60"
    answer: 0
    why:
      - "Right. ARR = 10% – 6% = 4% = 0.04; NNT = 1/ARR = 1/0.04 = 25."
      - "4 is the ARR in percent, not the NNT."
      - "RRR = 0.04/0.10 = 0.4 (40%), which is not the NNT."
      - "16 ≈ 1/0.06 inverts the drug group's event rate, not the ARR."
      - "60 is the RR (6%/10% = 0.6) as a percent, not the NNT; 1 – RR = 0.4 is the RRR."
    src: { page: 258, quote: "Number of patients who need to be treated for 1 patient to benefit. Lower number = better treatment. NNT = 1/ARR" }
    status: unverified
  - id: phs.L01.023
    kind: mcq
    topic: quantifying-risk
    stem: >-
      In a case-control study, 40 of 50 patients with bladder cancer and 20 of 50 controls report working
      with aniline dyes. What is the odds ratio for aniline dye exposure?
    options:
      - "6"
      - "2"
      - "4"
      - "0.17"
      - "8"
    answer: 0
    why:
      - "Right. a = 40, c = 10, b = 20, d = 30. OR = ad/bc = (40 × 30)/(20 × 10) = 1200/200 = 6."
      - "2 is the ratio of exposure proportions (80%/40%), which is not an odds ratio."
      - "4 is a/c (odds of exposure in cases) alone."
      - "0.17 is the inverse (bc/ad)."
      - "8 does not follow from ad/bc."
    src: { page: 258, quote: "Represents the odds of exposure among cases (a/c) vs odds of exposure among controls (b/d)." }
    status: unverified
  - id: phs.L01.024
    kind: card
    topic: quantifying-risk
    front: Define attack rate and give the book's example.
    back: The proportion of exposed people who become ill. If 80 people are exposed and 60 become ill, the attack rate is 75%.
    src: { page: 259, quote: "Proportion of exposed people who become ill. If 80 people in a town are exposed and 60 people become ill, attack rate is 75%." }
    status: unverified
  # ---------- p259: demographic transition ----------
  - id: phs.L01.025
    kind: table
    topic: demographic-transition
    title: Demographic transition (population pyramids)
    columns: [Feature, Pyramid (wide base), Column, Inverted base]
    rows:
      - [Birth rate, ↑↑, ↓, ↓↓]
      - [Mortality rate, ↑, ↓, ↓]
      - [Life expectancy, Short, Long, Long]
      - [Population, Growing, Stable, Declining]
    blanks: [[0, 1], [0, 3], [3, 1], [3, 2], [3, 3]]
    src: { page: 259, quote: "Birth rate ↑↑ ↓ ↓↓ Mortality rate ↑ ↓ ↓ Life expectancy Short Long Long Population Growing Stable Declining" }
    status: unverified
  - id: phs.L01.026
    kind: mcq
    topic: demographic-transition
    stem: >-
      A highly developed country's population pyramid is narrower at the base than at the middle. Its
      birth rate has fallen sharply over 30 years, mortality is low and life expectancy is long. What is
      most likely happening to its population?
    options:
      - It is declining
      - It is growing rapidly
      - It is stable
      - Its life expectancy is short
      - Its mortality rate is rising
    answer: 0
    why:
      - "Right. A very low birth rate (↓↓) with low mortality and long life expectancy gives a declining population."
      - "A growing population has ↑↑ birth rate and a wide-based pyramid."
      - "A stable population has a ↓ (not ↓↓) birth rate and a column shape."
      - "Life expectancy is long in developed countries."
      - "Mortality declines with development."
    src: { page: 259, quote: "As a country proceeds to higher levels of development, birth and mortality rates decline to varying degrees, changing the age composition of the population." }
    status: unverified
  # ---------- p259: likelihood ratio ----------
  - id: phs.L01.027
    kind: cloze
    topic: likelihood-ratio
    text: LR+ = sensitivity / ({{c1::1 – specificity}}) (TP rate/FP rate); LR– = ({{c2::1 – sensitivity}}) / specificity (FN rate/TN rate).
    src: { page: 259, quote: "probability of positive result in patient with disorder sensitivity TP rate probability of positive result in patient without disorder 1 – specificity FP rate" }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.028
    kind: card
    topic: likelihood-ratio
    front: What do LR+ > 10 and LR– < 0.1 tell you about a test?
    back: "A very large LR+ (above 10) points to a highly specific test; a very small LR– (below 0.1) points to a highly sensitive one."
    src: { page: 259, quote: "LR+ > 10 indicates a highly specific test, while LR– < 0.1 indicates a highly sensitive test." }
    status: unverified
  - id: phs.L01.079
    kind: cloze
    topic: likelihood-ratio
    text: "Multiply the {{c1::pretest odds}} by the LR to get the posttest odds; posttest probability = posttest odds ÷ ({{c2::posttest odds + 1}})."
    src: { page: 259, quote: "Pretest odds × LR = posttest odds. Posttest probability = posttest odds / (posttest odds + 1)." }
    status: unverified
    tags: [high-yield]
  - id: phs.L01.029
    kind: mcq
    topic: likelihood-ratio
    stem: >-
      A 58-year-old woman has a swollen, tender left calf 5 days after a hip replacement. Her physician
      estimates a 50% pretest probability of deep vein thrombosis. A test with a positive likelihood ratio
      of 3 comes back positive. What is her posttest probability of deep vein thrombosis?
    options:
      - "75%"
      - "50%"
      - "60%"
      - "90%"
      - "150%"
    answer: 0
    why:
      - "Right. Pretest odds = 0.5/0.5 = 1; posttest odds = 1 × 3 = 3; posttest probability = 3/(3 + 1) = 75%."
      - "A positive result with LR+ > 1 must raise the probability."
      - "60% does not follow from the odds calculation."
      - "90% would need posttest odds of 9."
      - "A probability cannot exceed 100%; multiplying probability (not odds) by LR is the error."
    src: { page: 259, quote: "Pretest odds × LR = posttest odds. Posttest probability = posttest odds / (posttest odds + 1)." }
    status: unverified
  # ---------- p259: Kaplan-Meier ----------
  - id: phs.L01.030
    kind: card
    topic: kaplan-meier-curve
    front: What does a Kaplan-Meier curve show, and which tests compare two curves?
    back: The probability of survival (y-axis) over time (x-axis), for time-to-event data. Survival probability = 1 – event probability. The P value for the difference uses the log rank test or Cox regression.
    src: { page: 259, quote: "Survival probability = 1 – (event probability). P value for the survival difference can be calculated using log rank test or Cox regression." }
    status: unverified
  - id: phs.L01.031
    kind: mcq
    topic: kaplan-meier-curve
    stem: >-
      A trial of a new chemotherapy plots the proportion of patients still alive in each arm against
      months since randomization. The investigators want a P value for the difference between the two
      survival curves. Which method is appropriate?
    options:
      - Log rank test
      - t-test
      - Chi-square test
      - Fisher's exact test
      - ANOVA
    answer: 0
    why:
      - "Right. The P value for the survival difference on Kaplan-Meier curves uses the log rank test (or Cox regression)."
      - "A t-test compares means of 2 groups, not time-to-event curves."
      - "Chi-square compares proportions at one time, not survival over time."
      - "Fisher's exact test compares 2 proportions in small samples."
      - "ANOVA compares means of 3 or more groups."
    src: { page: 259, quote: "P value for the survival difference can be calculated using log rank test or Cox regression." }
    status: unverified
  # ---------- p260: hazard ratio ----------
  - id: phs.L01.032
    kind: card
    topic: hazard-ratio
    front: How do you interpret a hazard ratio of 1, > 1 and < 1?
    back: "HR = 1: no difference between groups. HR > 1: the event occurs more often in the treatment/exposure group. HR < 1: the event occurs less often (protective effect)."
