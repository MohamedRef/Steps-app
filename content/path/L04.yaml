  # ---------- p225: normal aging ----------
  - id: path.L04.001
    kind: card
    topic: normal-aging
    front: What is normal aging, and which three kinds of alteration go with it?
    back: "Organs slowly work less well as the years pass, so disease takes hold more easily. Three kinds of change go with it: genetic (telomeres get shorter), epigenetic (DNA methylation changes) and metabolic (mitochondria work less well)."
    src: { page: 225, quote: "Time-dependent progressive decline in organ function resulting in ↑ susceptibility to disease. Associated with genetic (eg, telomere shortening), epigenetic (eg, DNA methylation), and metabolic (eg, mitochondrial dysfunction) alterations." }
    status: unverified
  - id: path.L04.002
    kind: enumerate
    topic: normal-aging
    prompt: Enumerate the cardiovascular changes of normal aging (6).
    points:
      - "↓ Arterial compliance (↑ stiffness)"
      - "↑ Aortic diameter"
      - "↓ LV cavity size with a sigmoid-shaped septum (myocardial hypertrophy)"
      - "↑ Left atrial cavity size"
      - "Aortic and mitral valve calcification"
      - "↓ Maximum heart rate"
    pass: 5
    src: { page: 225, quote: "↓ arterial compliance (↑ stiffness), ↑ aortic diameter, ↓ left ventricular cavity size and sigmoid- shaped interventricular septum (due to myocardial hypertrophy), ↑ left atrial cavity size, aortic and mitral valve calcification, ↓ maximum heart rate." }
    status: unverified
    tags: [high-yield]
  - id: path.L04.003
    kind: card
    topic: normal-aging
    front: Which arm of immunity does aging mainly affect, and which lymphocytes fall or are kept?
    back: Mainly adaptive immunity. The thymus involutes, so fewer naïve T cells are made (and, indirectly, fewer naïve B cells), while memory B and T cells are kept.
    src: { page: 225, quote: "Predominant effect on adaptive immunity: thymic involution → ↓ production of naïve T cells (and, indirectly, naïve B cells), while memory B and T cells are preserved." }
    status: unverified
    tags: [high-yield]
  - id: path.L04.015
    kind: cloze
    topic: normal-aging
    text: "The net effect of immune aging is a diminished response to {{c1::novel antigens}} (e.g., pathogens, vaccines)."
    src: { page: 225, quote: "Net effect = diminished response to novel antigens (eg, pathogens, vaccines)." }
    status: unverified
    tags: [high-yield]
