  - id: path.L04.005
    kind: table
    topic: normal-aging
    title: Aging by system (2)
    columns: [System, Changes]
    rows:
      - ["Skin", "Atrophy, flat dermal-epidermal junction; ↓ collagen and elastin (wrinkles, senile purpura); ↓ sweat glands (heat stroke); ↓ sebaceous glands (xerosis cutis)"]
      - ["Renal", "↓ GFR (↓ nephrons), ↓ RBF, ↓ hormonal function; voiding dysfunction"]
      - ["Male reproductive", "Testicular atrophy (↓ spermatogenesis), prostate enlargement, slower erection/ejaculation, longer refractory period; ↓ libido less pronounced than in females"]
      - ["Female reproductive", "Vulvovaginal atrophy; vagina shorter, thinner, drier, ↑ pH (↓ estrogen from exhaustion of ovarian follicles at menopause)"]
    blanks: [[0, 1], [1, 1], [3, 1]]
    src: { page: 225, quote: "Renal ↓ GFR (↓ nephrons), ↓ RBF, ↓ hormonal function. Voiding dysfunction (eg, urinary incontinence)." }
