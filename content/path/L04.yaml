  - id: path.L04.009
    kind: mcq
    topic: normal-aging
    stem: >-
      An 82-year-old woman who is otherwise healthy has pulmonary function tests before elective
      surgery. Compared with a healthy 25-year-old, which pattern is most expected from aging alone?
    options:
      - ↓ Lung compliance, ↓ RV, ↓ TLC
      - ↑ Lung compliance, ↑ RV, unchanged TLC
      - ↑ Chest wall compliance, ↓ A-a gradient
      - ↑ FEV1, ↑ FVC, unchanged RV
      - ↓ Lung compliance, ↑ ventilatory response to hypoxia
    answer: 1
    why:
      - "Low compliance and low volumes describe restrictive disease, not aging."
      - "Right. Aging ↓ elastic recoil (↑ lung compliance), ↑ RV, and TLC is unchanged; FEV1 and FVC fall and the A-a gradient rises."
      - "Chest wall compliance falls (↑ stiffness) and the A-a gradient rises with age."
      - "FEV1 and FVC fall with age."
      - "Lung compliance rises, and the ventilatory response to hypoxia is blunted."
    src: { page: 225, quote: "↑ lung compliance (↓ elastic recoil), ↓ chest wall compliance (↑ stiffness), ↓ respiratory muscle strength; ↓ FEV1, ↓ FVC, ↑ RV (TLC is unchanged); ↑ A-a gradient, ↑ mismatch." }
    status: unverified
  - id: path.L04.010
    kind: mcq
    topic: normal-aging
    stem: >-
      A healthy 79-year-old man receives a new vaccine against a virus he has never met. His
      antibody response is much weaker than his grandson's, yet his response to a tetanus booster
      is normal. Which change best explains this?
    options:
      - Loss of memory T and B cells
      - Thymic involution with ↓ naïve T-cell production
      - Complete loss of bone marrow B-cell production
      - ↑ Regulatory T-cell numbers from chronic infection
      - Deficiency of complement C3
    answer: 1
    why:
      - "Memory B and T cells are preserved with aging, which is why the booster works."
      - "Right. Thymic involution ↓ naïve T cells (and indirectly naïve B cells), so the response to novel antigens is weaker while memory responses are kept."
      - "Marrow mass falls, but B-cell production is not lost."
      - "The book doesn't explain the aging immune change by regulatory T cells."
      - "Complement deficiency doesn't give a selective defect to new antigens."
    src: { page: 225, quote: "thymic involution → ↓ production of naïve T cells (and, indirectly, naïve B cells), while memory B and T cells are preserved. Net effect = diminished response to novel antigens (eg, pathogens, vaccines)." }
    status: unverified
  - id: path.L04.011
    kind: mcq
    topic: normal-aging
    stem: >-
      An 86-year-old woman is admitted with a core temperature of 41 °C (105.8 °F) and confusion
      during a summer heat wave. Her skin is hot and dry. Which age-related change most increases
      her risk of this condition?
    options:
      - ↓ Sebaceous glands
      - ↓ Sweat glands
      - ↓ Dermal elastin
      - Flattened dermal-epidermal junction
      - Solar elastosis
    answer: 1
    why:
      - "↓ Sebaceous glands cause xerosis cutis (dry skin)."
      - "Right. Aging ↓ sweat glands, which the book links to heat stroke."
      - "↓ Elastin causes wrinkles and senile purpura."
      - "The flattened junction is part of skin atrophy."
      - "Solar elastosis is photoaging from UVA."
    src: { page: 225, quote: "↓ sweat glands (heat stroke), ↓ sebaceous glands (xerosis cutis)." }
    status: unverified
  # ---------- p225: lipofuscin ----------
  - id: path.L04.012
    kind: card
    topic: lipofuscin
    front: What is lipofuscin, and how is it formed?
    back: A yellow-brown "wear and tear" pigment of normal aging, made of lipid and phospholipid polymers complexed with protein. It may come from lipid peroxidation of polyunsaturated lipids in subcellular membranes.
    src: { page: 225, quote: "A yellow-brown, “wear and tear” pigment A associated with normal aging. Composed of polymers of lipids and phospholipids complexed with protein. May be derived through lipid peroxidation of polyunsaturated lipids of subcellular membranes." }
    status: unverified
    tags: [high-yield]
  - id: path.L04.013
    kind: mcq
    topic: lipofuscin
    stem: >-
      At autopsy of a 91-year-old man who died in his sleep, the heart is small and brown, and
      myocytes contain perinuclear yellow-brown granules that do not stain for iron. What are the
      granules most likely composed of?
    options:
      - Iron-containing hemosiderin from broken-down hemoglobin
      - Lipid–phospholipid polymers bound to protein after membrane peroxidation
      - Melanin pigment made by melanocytes from tyrosine
      - Extracellular protein fibrils in β-pleated sheets
      - Stored glucose polymers (glycogen) in the cytoplasm
    answer: 1
    why:
      - "Hemosiderin stains for iron."
      - "Right. Lipofuscin, the wear-and-tear pigment of aging, is lipid and phospholipid polymers complexed with protein, from lipid peroxidation of membranes. It is found in heart, colon, liver, kidney and eye."
      - "Melanin isn't the aging pigment of myocytes."
      - "Amyloid is extracellular and Congo red positive."
      - "Glycogen isn't a yellow-brown pigment."
    src: { page: 225, quote: "A yellow-brown, “wear and tear” pigment A associated with normal aging. Composed of polymers of lipids and phospholipids complexed with protein. May be derived through lipid peroxidation of polyunsaturated lipids of subcellular membranes. Autopsy of older adult will reveal deposits in heart, colon, liver, kidney, eye, and other organs." }
    status: unverified
  - id: path.L04.014
    kind: cloze
    topic: lipofuscin
    text: "At autopsy of an older adult, lipofuscin deposits are found in the {{c1::heart}}, {{c2::colon}}, {{c3::liver}}, kidney, eye and other organs."
    src: { page: 225, quote: "Autopsy of older adult will reveal deposits in heart, colon, liver, kidney, eye, and other organs." }
    status: unverified
