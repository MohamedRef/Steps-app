  - id: path.L03.009
    kind: table
    topic: tumor-nomenclature
    title: Hamartoma vs choristoma
    columns: [Term, Definition, Example]
    rows:
      - ["Hamartoma", "Disorganized overgrowth of tissues in their native location", "Peutz-Jeghers polyps"]
      - ["Choristoma", "Normal tissue in a foreign location", "Gastric tissue in the distal ileum (Meckel diverticulum)"]
    blanks: [[0, 1], [1, 1], [0, 2], [1, 2]]
    src: { page: 216, quote: "hamartoma (disorganized overgrowth of tissues in their native location, eg, Peutz-Jeghers polyps) and choristoma (normal tissue in a foreign location, eg, gastric tissue located in distal ileum in Meckel diverticulum)" }
    status: unverified
    tags: [high-yield]
  - id: path.L03.010
    kind: mcq
    topic: tumor-nomenclature
    stem: >-
      A 2-year-old boy has painless rectal bleeding. A technetium-99m pertechnetate scan shows uptake
      in the right lower quadrant, and resection shows a diverticulum of the distal ileum lined
      partly by acid-secreting gastric mucosa. Which term describes the gastric tissue?
    options:
      - Hamartoma
      - Choristoma
      - Metaplasia
      - Adenoma
      - Teratoma
    answer: 1
    why:
      - "A hamartoma is disorganized overgrowth of tissue in its native location, e.g., Peutz-Jeghers polyps."
      - "Right. Normal tissue in a foreign location is a choristoma; gastric tissue in a Meckel diverticulum is the book's example."
      - "Metaplasia is reprogramming of resident stem cells in response to a stressor."
      - "An adenoma is a benign epithelial neoplasm, not a malformation."
      - "A teratoma is a germ cell neoplasm with tissues from several germ layers."
    src: { page: 216, quote: "choristoma (normal tissue in a foreign location, eg, gastric tissue located in distal ileum in Meckel diverticulum)" }
    status: unverified
  # ---------- p216: grade vs stage ----------
  - id: path.L03.011
    kind: table
    topic: tumor-grade-vs-stage
    title: Grade vs stage
    columns: ["", Grade, Stage]
    rows:
      - ["Measures", "Cell differentiation and mitotic activity on histology", "Degree of invasion and spread from the initial site"]
      - ["Range", "Low grade (well differentiated) to high grade (poorly or undifferentiated, anaplastic)", "TNM: tumor size/invasion, regional nodes, distant metastasis"]
      - ["Prognosis", "Higher grade often more aggressive", "More prognostic value; stage determines survival"]
    blanks: [[0, 1], [0, 2], [2, 2]]
    src: { page: 216, quote: "Stage generally has more prognostic value than grade (eg, a high-stage yet low-grade tumor is usually worse than a low-stage yet high-grade tumor). Stage (spread) determines survival." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.012
    kind: cloze
    topic: tumor-grade-vs-stage
    text: "In the TNM staging system, the order of importance is {{c1::M > N > T}}."
    src: { page: 216, quote: "TNM staging system (importance: M > N > T)" }
    status: unverified
    tags: [high-yield]
  - id: path.L03.013
    kind: mcq
    topic: tumor-grade-vs-stage
    stem: >-
      Two patients are seen in the same oncology clinic. A 58-year-old woman had a positive fecal
      immunochemical test on screening; colonoscopy finds a 2-cm sigmoid adenocarcinoma, and the
      resection shows a poorly differentiated tumor confined to the submucosa with 0 of 18 lymph
      nodes involved. A 63-year-old man has fatigue and iron deficiency anemia; colonoscopy finds a
      cecal adenocarcinoma that is well differentiated, and CT shows three liver metastases. Which
      statement about their prognosis is most accurate?
    options:
      - The woman has the worse prognosis because grade determines survival
      - The man has the worse prognosis because stage determines survival
      - They have the same prognosis because both are adenocarcinomas
      - Prognosis depends mainly on tumor size
      - Nodal status matters more than distant metastasis
    answer: 1
    why:
      - "Her high grade (poor differentiation) has less prognostic value than stage, and her tumor is low stage."
      - "Right. Stage has more prognostic value than grade: a high-stage, low-grade tumor is usually worse than a low-stage, high-grade one. His distant metastasis (M) matters most."
      - "Histologic type alone doesn't set prognosis."
      - "Size (T) is the least important TNM component."
      - "In TNM, M > N > T."
    src: { page: 216, quote: "a high-stage yet low-grade tumor is usually worse than a low-stage yet high-grade tumor" }
    status: unverified
  # ---------- p217: hallmarks of cancer ----------
  - id: path.L03.014
    kind: enumerate
    topic: hallmarks-of-cancer
    prompt: Enumerate the gene classes whose mutation gives growth signal self-sufficiency, with the book's example of each (5).
    points:
      - "Proto-oncogenes → ↑ growth factors → autocrine loop (↑ PDGF in brain tumors)"
      - "Growth factor receptors → constitutive signaling (HER2 in breast cancer)"
      - "Signaling molecules (RAS)"
      - "Transcription factors (MYC)"
      - "Cell cycle regulators (cyclins, CDKs)"
    pass: 4
    src: { page: 217, quote: "Proto-oncogenes → ↑ growth factors → autocrine loop (eg, ↑ PDGF in brain tumors) Growth factor receptors → constitutive signaling (eg, HER2 in breast cancer) Signaling molecules (eg, RAS) Transcription factors (eg, MYC) Cell cycle regulators (eg, cyclins, CDKs)" }
    status: unverified
  - id: path.L03.015
    kind: table
    topic: hallmarks-of-cancer
    title: Hallmarks of cancer
    columns: [Hallmark, Mechanism]
    rows:
      - ["Anti-growth signal insensitivity", "Tumor suppressor mutations (Rb); loss of E-cadherin → loss of contact inhibition (NF2)"]
      - ["Evasion of apoptosis", "Mutations in apoptosis genes (TP53; BCL2 → follicular B-cell lymphoma)"]
      - ["Limitless replicative potential", "Reactivated telomerase maintains and lengthens telomeres"]
      - ["Sustained angiogenesis", "↑ Pro-angiogenic factors (VEGF) or ↓ inhibitors; neoangiogenesis or vasculogenesis"]
      - ["Warburg effect", "Glycolysis even with oxygen → biosynthetic intermediates, ↑ lactate"]
      - ["Immune evasion", "↓ MHC I, TGF-β and Tregs, immune checkpoint molecules"]
      - ["Tissue invasion", "Loss of E-cadherin → metalloproteinases degrade basement membrane and ECM → locomotion"]
    blanks: [[0, 1], [1, 1], [2, 1], [4, 1], [5, 1]]
    src: { page: 217, quote: "Reactivation of telomerase → maintenance and lengthening of telomeres → prevention of chromosome shortening and cell aging." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.016
    kind: card
    topic: hallmarks-of-cancer
    front: What is the Warburg effect, and why does it help cancer cells?
    back: A shift of glucose metabolism from mitochondrial oxidative phosphorylation to glycolysis even with oxygen present, driven by altered enzymes (pyruvate kinase M2, LDH-A). Aerobic glycolysis supplies intermediates for nucleotide, lipid and amino acid synthesis, with ↑ lactate.
    src: { page: 217, quote: "Shift of glucose metabolism from mitochondrial oxidative phosphorylation to glycolysis, even under aerobic conditions. Driven by altered metabolic enzymes (eg, pyruvate kinase M2, LDH-A)." }
    status: unverified
  - id: path.L03.017
    kind: enumerate
    topic: hallmarks-of-cancer
    prompt: Enumerate the ways tumors evade the immune system (3).
    points:
      - "↓ MHC class I → cytotoxic T cells can't recognize tumor cells"
      - "Secrete immunosuppressive factors (TGF-β) and recruit regulatory T cells"
      - "Upregulate immune checkpoint molecules"
    pass: 3
    src: { page: 217, quote: "↓ MHC class I expression by tumor cells → cytotoxic T cells are unable to recognize tumor cells. Tumor cells secrete immunosuppressive factors (eg, TGF-β) and recruit regulatory T cells to downregulate immune response." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.018
    kind: order
    topic: hallmarks-of-cancer
    prompt: Put the steps of tissue invasion in order.
    steps:
      - Loss of E-cadherin → loosened intercellular junctions
      - Metalloproteinases degrade basement membrane and ECM
      - Cells attach to ECM proteins (laminin, fibronectin)
      - Cells migrate through degraded ECM (locomotion)
      - Vascular dissemination
    src: { page: 217, quote: "Loss of E-cadherin function → loosening of intercellular junctions → metalloproteinases degrade basement membrane and ECM → cells attach to ECM proteins (eg, laminin, fibronectin) → cells migrate through degraded ECM (“locomotion”) → vascular dissemination." }
    status: unverified
  - id: path.L03.019
    kind: card
    topic: hallmarks-of-cancer
    front: How can the site of metastasis be predicted? Give the book's example of organ tropism.
    back: From the site of the primary tumor, because the target organ is often the first capillary bed the cells meet. Some cancers show organ tropism, e.g., lung cancers commonly metastasize to the adrenals.
    src: { page: 217, quote: "Site of metastasis can be predicted by site of 1° tumor, as the target organ is often the first-encountered capillary bed. Some cancers show organ tropism (eg, lung cancers commonly metastasize to adrenals)." }
    status: unverified
  - id: path.L03.020
    kind: mcq
    topic: hallmarks-of-cancer
    stem: >-
      A 61-year-old man has a sigmoid colon adenocarcinoma resected. In the research laboratory,
      cells from his tumor keep dividing through hundreds of passages in culture, whereas
      fibroblasts from his own skin stop dividing and age after a limited number of divisions.
      Unlike the fibroblasts, the tumor cells' chromosome ends do not shorten with each division.
      Which change in the tumor cells most likely explains this?
    options:
      - Loss of E-cadherin
      - Reactivation of telomerase
      - ↑ VEGF secretion
      - Shift to aerobic glycolysis
      - ↓ MHC class I expression
    answer: 1
    why:
      - "E-cadherin loss allows invasion and loss of contact inhibition, not endless division."
      - "Right. Telomerase reactivation maintains and lengthens telomeres, preventing chromosome shortening and cell aging: limitless replicative potential."
      - "VEGF sustains angiogenesis."
      - "The Warburg effect supplies building blocks but doesn't protect telomeres."
      - "↓ MHC I helps tumors evade cytotoxic T cells."
    src: { page: 217, quote: "Reactivation of telomerase → maintenance and lengthening of telomeres → prevention of chromosome shortening and cell aging." }
    status: unverified
  # ---------- p218: immune checkpoints ----------
  - id: path.L03.021
    kind: table
    topic: immune-checkpoint-interactions
    title: Immune checkpoints and their inhibitors
    columns: [Checkpoint, Effect, Inhibitors]
    rows:
      - ["PD-1 (T cell) – PD-L1/2 (tumor)", "T-cell dysfunction (exhaustion)", "Anti-PD-1: cemiplimab, nivolumab, pembrolizumab; anti-PD-L1: atezolizumab, durvalumab, avelumab"]
      - ["CTLA-4 (T cell) outcompetes CD28 for B7 (APC)", "Loss of T-cell costimulation", "Anti-CTLA-4: ipilimumab"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 218, quote: "CTLA-4 on T cells outcompetes CD28 for B7 on APCs → loss of T-cell costimulatory signal. Inhibited by antibodies against CTLA-4 (eg, ipilimumab)." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.022
    kind: cloze
    topic: immune-checkpoint-interactions
    text: "{{c1::Ipilimumab}} blocks CTLA-4, which otherwise outcompetes {{c2::CD28}} for B7 on APCs."
    src: { page: 218, quote: "CTLA-4 on T cells outcompetes CD28 for B7 on APCs → loss of T-cell costimulatory signal." }
    status: unverified
  - id: path.L03.023
    kind: mcq
    topic: immune-checkpoint-interactions
    stem: >-
      A 66-year-old man with melanoma metastatic to the lungs and liver starts nivolumab. After 3
      months his metastases have shrunk on CT, but he now has 8 watery stools a day and abdominal
      cramps. Stool studies are negative, and colonoscopy shows diffuse colitis with dense T-cell
      infiltrates. Blocking which interaction best explains both the tumor response and the colitis?
    options:
      - CTLA-4 binding to B7
      - PD-1 on T cells binding PD-L1
      - CD28 binding to B7
      - TCR binding to MHC I
      - VEGF binding to its receptor
    answer: 1
    why:
      - "CTLA-4 is blocked by ipilimumab, not nivolumab."
      - "Right. Nivolumab is an anti-PD-1 antibody. PD-1–PD-L1 binding normally causes T-cell exhaustion; releasing that brake restores the T-cell attack on the tumor and can also turn T cells against normal tissue such as the colon."
      - "CD28–B7 is the costimulatory signal that checkpoint blockade preserves, not blocks."
      - "TCR–MHC I is the antigen signal T cells need to attack."
      - "Anti-VEGF drugs target angiogenesis, not T-cell checkpoints."
    src: { page: 218, quote: "Interaction between PD-1 (on T cells) and PD-L1/2 (on tumor cells or immune cells in tumor microenvironment) → T-cell dysfunction (exhaustion). Inhibited by antibodies against PD-1 (eg, cemiplimab, nivolumab, pembrolizumab)" }
    status: unverified
