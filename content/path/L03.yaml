items:
  # ---------- p215: neoplastic progression ----------
  - id: path.L03.001
    kind: card
    topic: neoplastic-progression
    front: What is neoplasia, and what are the two components of every neoplasm?
    back: Uncontrolled, often monoclonal proliferation of cells, benign or malignant. Every neoplasm has parenchyma (the neoplastic cells) and supporting stroma (non-neoplastic, e.g., blood vessels and connective tissue).
    src: { page: 215, quote: "Uncontrolled, often monoclonal proliferation of cells. Can be benign or malignant. Any neoplastic growth has two components: parenchyma (neoplastic cells) and supporting stroma" }
    status: unverified
  - id: path.L03.002
    kind: order
    topic: neoplastic-progression
    prompt: Put the stages of neoplastic progression in order.
    steps:
      - Normal cells (basal → apical polarity)
      - Dysplasia
      - Carcinoma in situ
      - Invasive carcinoma
      - Metastasis
    src: { page: 215, quote: "Irreversible severe dysplasia that involves the entire thickness of epithelium but does not penetrate the intact basement membrane." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.003
    kind: card
    topic: neoplastic-progression
    front: What separates carcinoma in situ from invasive carcinoma?
    back: Carcinoma in situ is irreversible severe dysplasia through the entire epithelial thickness that does not penetrate the intact basement membrane. Invasive carcinoma has breached the basement membrane using collagenases and hydrolases (metalloproteinases).
    src: { page: 215, quote: "Invasive carcinoma Cells have invaded basement membrane using collagenases and hydrolases (metalloproteinases)." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.004
    kind: cloze
    topic: neoplastic-progression
    text: "In invasive carcinoma, cell–cell contacts are lost by inactivation of {{c1::E-cadherin}}."
    src: { page: 215, quote: "Cell-cell contacts lost by inactivation of E-cadherin." }
    status: unverified
    tags: [high-yield]
  - id: path.L03.005
    kind: mcq
    topic: neoplastic-progression
    stem: >-
      A 34-year-old woman has a cervical biopsy after an abnormal Pap test. Atypical cells with a
      high nuclear:cytoplasmic ratio replace the entire thickness of the squamous epithelium, and
      the basement membrane is intact throughout. Which term best describes the lesion?
    options:
      - Mild dysplasia
      - Carcinoma in situ
      - Invasive squamous cell carcinoma
      - Squamous metaplasia
      - Metastatic carcinoma
    answer: 1
    why:
      - "Mild dysplasia doesn't involve the full thickness and is often reversible."
      - "Right. Full-thickness, irreversible severe dysplasia that does not penetrate the intact basement membrane is carcinoma in situ."
      - "Invasive carcinoma has breached the basement membrane."
      - "Metaplasia replaces one cell type with another without atypia."
      - "Metastasis is spread to distant organs."
    src: { page: 215, quote: "Irreversible severe dysplasia that involves the entire thickness of epithelium but does not penetrate the intact basement membrane." }
    status: unverified
  # ---------- p216: tumor nomenclature ----------
  - id: path.L03.006
    kind: card
    topic: tumor-nomenclature
    front: What do "carcinoma" and "sarcoma" mean?
    back: Carcinoma means epithelial origin and sarcoma means mesenchymal origin. Both generally imply malignancy.
    src: { page: 216, quote: "Carcinoma implies epithelial origin, whereas sarcoma denotes mesenchymal origin. Both terms generally imply malignancy." }
    status: unverified
