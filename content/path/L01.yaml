items:
  # ---------- p202: cellular adaptations ----------
  - id: path.L01.001
    kind: card
    topic: cellular-adaptations
    front: What are cellular adaptations, and what happens if the stress is excessive or persistent?
    back: "Changes a cell makes to cope with stress that can still be undone. They may be normal (the uterus growing in pregnancy) or a sign of disease (a thick heart muscle from long-standing high blood pressure). If the stress is too strong or never lets up, adaptation gives way to injury (e.g., a very thick LV → damaged myocardium → HF)."
    src: { page: 202, quote: "Reversible changes that can be physiologic (eg, uterine enlargement during pregnancy) or pathologic (eg, myocardial hypertrophy 2° to systemic hypertension). If stress is excessive or persistent, adaptations can progress to cell injury" }
    status: unverified
  - id: path.L01.002
    kind: table
    topic: cellular-adaptations
    title: Cellular adaptations
    columns: [Adaptation, What changes, Example / causes]
    rows:
      - ["Hypertrophy", "↑ Structural proteins and organelles → ↑ cell size", "Cardiac hypertrophy"]
      - ["Hyperplasia", "Controlled proliferation of stem and differentiated cells → ↑ cell number", "Benign prostatic hyperplasia; pathologic: endometrial hyperplasia"]
      - ["Atrophy", "↓ Tissue mass from ↓ cell size and/or number", "Disuse, denervation, loss of blood supply, loss of hormones, poor nutrition"]
      - ["Metaplasia", "Stem cell reprogramming → one cell type replaced by another that suits the new stressor", "Barrett esophagus; squamous metaplasia of airway with smoking"]
      - ["Dysplasia", "Disordered, precancerous epithelial growth; not a true adaptation", "Usually preceded by persistent metaplasia or pathologic hyperplasia"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src:
      page: 202
      quote: |-
        Hypertrophy ↑ structural proteins and organelles → ↑ in size of cells. Example: cardiac hypertrophy.
        Hyperplasia Controlled proliferation of stem cells and differentiated cells → ↑ in number of cells (eg, benign prostatic hyperplasia). Excessive stimulation → pathologic hyperplasia (eg, endometrial hyperplasia), which may progress to dysplasia and cancer.
        Atrophy ↓ in tissue mass due to ↓ in size (↑ cytoskeleton degradation via ubiquitin-proteasome pathway and autophagy [programmed digestion of damaged/misfolded intracellular proteins]; ↓ protein synthesis) and/or number of cells (apoptosis). Causes include disuse, denervation, loss of blood supply, loss of hormonal stimulation, poor nutrition.
        Metaplasia Reprogramming of stem cells → replacement of one cell type by another that can adapt to a new stressor. Esophageal exposure to gastric acid: nonkeratinized stratified squamous → intestinal-type columnar epithelium (acid resistance), called Barrett esophagus. The opposite occurs upon airway exposure to tobacco smoke: pseudostratified ciliated columnar → stratified squamous epithelium (protection).
        May progress to dysplasia → malignant transformation with persistent insult (eg, Barrett esophagus → esophageal adenocarcinoma). Metaplasia of connective tissue can also occur (eg, myositis ossificans, the formation of bone within muscle after trauma).
        Dysplasia Disordered, precancerous epithelial cell growth; not considered a true adaptive response. Characterized by loss of uniformity of cell size and shape (pleomorphism); loss of tissue orientation; nuclear changes (eg, ↑ nuclear:cytoplasmic ratio and clumped chromatin). Mild and moderate dysplasias (ie, do not involve entire thickness of epithelium) may regress with alleviation of inciting cause. Severe dysplasia often becomes irreversible and progresses to carcinoma in situ. Usually preceded by persistent metaplasia or pathologic hyperplasia.
    status: unverified
    tags: [high-yield]
  - id: path.L01.003
    kind: card
    topic: cellular-adaptations
    front: By what mechanisms do cells shrink in atrophy?
    back: ↑ Cytoskeleton degradation via the ubiquitin-proteasome pathway and autophagy (programmed digestion of damaged or misfolded proteins), and ↓ protein synthesis. Cell number falls by apoptosis.
    src: { page: 202, quote: "↓ in tissue mass due to ↓ in size (↑ cytoskeleton degradation via ubiquitin-proteasome pathway and autophagy [programmed digestion of damaged/misfolded intracellular proteins]; ↓ protein synthesis) and/or number of cells (apoptosis)." }
    status: unverified
  - id: path.L01.004
    kind: table
    topic: cellular-adaptations
    title: Two classic epithelial metaplasias
    columns: [Exposure, From, To, Purpose]
    rows:
      - ["Esophagus to gastric acid (Barrett esophagus)", "Nonkeratinized stratified squamous", "Intestinal-type columnar", "Acid resistance"]
      - ["Airway to tobacco smoke", "Pseudostratified ciliated columnar", "Stratified squamous", "Protection"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 202, quote: "Esophageal exposure to gastric acid: nonkeratinized stratified squamous → intestinal-type columnar epithelium (acid resistance), called Barrett esophagus. The opposite occurs upon airway exposure to tobacco smoke: pseudostratified ciliated columnar → stratified squamous epithelium (protection)." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.005
    kind: card
    topic: cellular-adaptations
    front: Can metaplasia occur in connective tissue? Give the book's example.
    back: Yes, e.g., myositis ossificans, the formation of bone within muscle after trauma.
    src: { page: 202, quote: "Metaplasia of connective tissue can also occur (eg, myositis ossificans, the formation of bone within muscle after trauma)." }
    status: unverified
  - id: path.L01.006
    kind: enumerate
    topic: cellular-adaptations
    prompt: Enumerate the histologic features of dysplasia (3).
    points:
      - Loss of uniformity of cell size and shape (pleomorphism)
      - Loss of tissue orientation
      - "Nuclear changes (↑ nuclear:cytoplasmic ratio, clumped chromatin)"
    pass: 3
    src: { page: 202, quote: "Characterized by loss of uniformity of cell size and shape (pleomorphism); loss of tissue orientation; nuclear changes (eg, ↑ nuclear:cytoplasmic ratio and clumped chromatin)." }
    status: unverified
  - id: path.L01.007
    kind: card
    topic: cellular-adaptations
    front: Which dysplasias may regress, and which progress?
    back: Mild and moderate dysplasias (not involving the full epithelial thickness) may regress when the cause is removed. Severe dysplasia often becomes irreversible and progresses to carcinoma in situ.
    src: { page: 202, quote: "Mild and moderate dysplasias (ie, do not involve entire thickness of epithelium) may regress with alleviation of inciting cause. Severe dysplasia often becomes irreversible and progresses to carcinoma in situ." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.008
    kind: mcq
    topic: cellular-adaptations
    stem: >-
      A 56-year-old man has had heartburn most days for 15 years and takes antacids only occasionally.
      Upper endoscopy shows salmon-colored mucosa extending 4 cm above the gastroesophageal junction.
      Biopsy shows goblet cells within columnar epithelium, with no nuclear atypia. Which change has
      occurred, and to what may it progress if the acid exposure persists?
    options:
      - Hyperplasia progressing to squamous cell carcinoma
      - Metaplasia, then dysplasia, then adenocarcinoma
      - Dysplasia that will always regress with treatment
      - Atrophy progressing to leiomyoma
      - Hypertrophy progressing to achalasia
    answer: 1
    why:
      - "This is a change in cell type, not number, and Barrett esophagus leads to adenocarcinoma, not squamous carcinoma."
      - "Right. Barrett esophagus is metaplasia (squamous → intestinal-type columnar). With persistent insult it may progress to dysplasia and esophageal adenocarcinoma."
      - "There is no atypia yet, so this isn't dysplasia; and severe dysplasia often doesn't regress."
      - "Atrophy is a loss of mass, not a change in cell type."
      - "Hypertrophy is an increase in cell size."
    src: { page: 202, quote: "May progress to dysplasia → malignant transformation with persistent insult (eg, Barrett esophagus → esophageal adenocarcinoma)." }
    status: unverified
  # ---------- p203: cell injury ----------
  - id: path.L01.009
    kind: enumerate
    topic: cell-injury
    prompt: Enumerate the features of reversible cell injury (6).
    points:
      - "↓ ATP → ↓ Ca2+ and Na+/K+-ATPase pump activity → cellular swelling (earliest morphologic change)"
      - Ribosomal/polysomal detachment → ↓ protein synthesis
      - Plasma membrane changes (blebbing)
      - Nuclear changes (chromatin clumping)
      - Rapid loss of function (myocardium noncontractile after 1-2 minutes of ischemia)
      - Myelin figures (aggregated peroxidized lipids)
    pass: 5
    src: { page: 203, quote: "Ribosomal/polysomal detachment → ↓ protein synthesis Plasma membrane changes (eg, blebbing) Nuclear changes (eg, chromatin clumping) Rapid loss of function (eg, myocardial cells are noncontractile after 1-2 minutes of ischemia) Myelin figures (aggregation of peroxidized lipids)" }
    status: unverified
    tags: [high-yield]
  - id: path.L01.010
    kind: card
    topic: cell-injury
    front: What is the earliest morphologic manifestation of cell injury, and why does it happen?
    back: Cellular swelling (cytosol, mitochondria, ER/Golgi). ↓ ATP → ↓ activity of the Ca2+ and Na+/K+-ATPase pumps, so water follows the retained ions.
    src: { page: 203, quote: "cellular swelling (cytosol, mitochondria, endoplasmic reticulum/Golgi), which is the earliest morphologic manifestation" }
    status: unverified
    tags: [high-yield]
  - id: path.L01.011
    kind: enumerate
    topic: cell-injury
    prompt: Enumerate the features of irreversible cell injury (5).
    points:
      - "Plasma membrane breakdown → cytosolic enzymes (e.g., troponin) leak out; Ca2+ influx → degradative enzymes activated"
      - Mitochondrial damage → loss of electron transport chain → ↓ ATP
      - Rupture of lysosomes → autolysis
      - Nuclear degradation (pyknosis → karyorrhexis → karyolysis)
      - Amorphous densities/inclusions in mitochondria
    pass: 5
    src: { page: 203, quote: "Breakdown of plasma membrane → cytosolic enzymes (eg, troponin) leak outside of cell, influx of Ca2+ → activation of degradative enzymes" }
    status: unverified
    tags: [high-yield]
  - id: path.L01.012
    kind: order
    topic: cell-injury
    prompt: Put the stages of nuclear degradation in irreversible injury in order.
    steps:
      - Pyknosis (nuclear condensation)
      - Karyorrhexis (fragmentation by endonuclease-mediated cleavage)
      - Karyolysis (nuclear dissolution)
    src: { page: 203, quote: "Nuclear degradation: pyknosis (nuclear condensation) → karyorrhexis (nuclear fragmentation caused by endonuclease-mediated cleavage) → karyolysis (nuclear dissolution)" }
    status: unverified
    tags: [high-yield]
  - id: path.L01.013
    kind: mcq
    topic: cell-injury
    stem: >-
      A 61-year-old man is brought to the emergency department 6 hours after the onset of crushing chest
      pain. ECG shows ST elevation in leads V1-V4, and serum troponin I is markedly elevated. Which
      cellular event best explains the appearance of troponin in his serum?
    options:
      - Cellular swelling from failure of the Na+/K+-ATPase
      - Detachment of ribosomes from the endoplasmic reticulum
      - Breakdown of the plasma membrane
      - Formation of myelin figures
      - Chromatin clumping
    answer: 2
    why:
      - "Swelling is the earliest, reversible change; the membrane is still intact."
      - "Ribosomal detachment lowers protein synthesis but is reversible."
      - "Right. Plasma membrane breakdown is a feature of irreversible injury, letting cytosolic enzymes such as troponin leak out."
      - "Myelin figures are aggregated peroxidized lipids seen in reversible injury."
      - "Chromatin clumping is a reversible nuclear change."
    src: { page: 203, quote: "Breakdown of plasma membrane → cytosolic enzymes (eg, troponin) leak outside of cell" }
    status: unverified
  # ---------- p203: ferroptosis ----------
  - id: path.L01.014
    kind: card
    topic: ferroptosis
    front: What is ferroptosis, and what does it do to mitochondria?
    back: Iron-dependent cell death from lipid peroxidation → accumulation of lethal lipid species. Mitochondria shrink with loss of cristae and rupture of the outer membrane.
    src: { page: 203, quote: "Lipid peroxidation → accumulation of lethal lipid species → iron-dependent cell death. Results in shrinkage of mitochondria with loss of cristae and mitochondrial outer membrane rupture." }
    status: unverified
  - id: path.L01.015
    kind: card
    topic: ferroptosis
    front: In which diseases is ferroptosis involved, and what may prevent it?
    back: "MASLD/MASH, ischemia-reperfusion injury, neurodegeneration (and possible use in cancer therapy). May be prevented by iron chelators (deferiprone, deferoxamine) and small lipophilic antioxidants (ferrostatin, liproxstatin)."
    src: { page: 203, quote: "Involved in the pathogenesis of several disease states (eg, MASLD/MASH, ischemia–reperfusion injury, neurodegeneration), with potential therapeutic applications (eg, cancer therapy). May be preventable through the use of iron chelators (eg, deferiprone, deferoxamine)" }
    status: unverified
  - id: path.L01.016
    kind: mcq
    topic: ferroptosis
    stem: >-
      A 54-year-old man receives a deceased-donor liver transplant after a long cold ischemia time.
      Within 48 hours of reperfusion his aminotransferases rise above 4000 U/L. A graft biopsy shows
      hepatocyte death with marked lipid peroxidation, and electron microscopy shows shrunken
      mitochondria with loss of cristae and ruptured outer mitochondrial membranes. Pretreatment
      with which agent would most likely have prevented this form of cell death?
    options:
      - A pan-caspase inhibitor
      - Deferoxamine
      - A Bcl-2 inhibitor
      - An anti-Fas ligand antibody
      - A cyclooxygenase inhibitor
    answer: 1
    why:
      - "Caspases execute apoptosis; this iron-dependent lipid peroxidation death (ferroptosis) does not run through them."
      - "Right. This is ferroptosis: iron-dependent cell death from lipid peroxidation, with shrunken mitochondria that lose their cristae. Iron chelators (deferoxamine, deferiprone) and lipophilic antioxidants (ferrostatin, liproxstatin) may prevent it."
      - "Blocking antiapoptotic Bcl-2 would favor intrinsic apoptosis, not prevent this injury."
      - "Fas ligand triggers extrinsic apoptosis, which isn't this iron-dependent mechanism."
      - "COX inhibitors reduce prostaglandin-driven inflammation; they don't stop iron-dependent lipid peroxidation."
    src: { page: 203, quote: "May be preventable through the use of iron chelators (eg, deferiprone, deferoxamine) and small lipophilic antioxidants (eg, ferrostatin, liproxstatin)." }
    status: unverified
  # ---------- p204: apoptosis ----------
  - id: path.L01.017
    kind: card
    topic: apoptosis
    front: What is apoptosis, what do its pathways converge on, and what does that cause?
    back: Programmed cell death that needs ATP. All three pathways (intrinsic, extrinsic, perforin/granzyme B) switch on caspases, cytosolic proteases that break the cell down; the apoptotic bodies left behind are phagocytosed.
    src: { page: 204, quote: "Apoptosis ATP-dependent programmed cell death. Intrinsic, extrinsic, and perforin/granzyme B pathways → activate caspases (cytosolic proteases) → cellular breakdown including cell shrinkage, chromatin condensation, membrane blebbing, and formation of apoptotic bodies, which are then phagocytosed." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.057
    kind: enumerate
    topic: apoptosis
    prompt: Enumerate the morphologic features of apoptosis (8).
    points:
      - Cell shrinkage
      - Chromatin condensation
      - Membrane blebbing
      - Apoptotic bodies, then phagocytosed
      - Deeply eosinophilic cytoplasm
      - Basophilic nucleus
      - Pyknosis and karyorrhexis
      - "Cell membrane typically intact, without significant inflammation (unlike necrosis)"
    pass: 6
    src: { page: 204, quote: "Intrinsic, extrinsic, and perforin/granzyme B pathways → activate caspases (cytosolic proteases) → cellular breakdown including cell shrinkage, chromatin condensation, membrane blebbing, and formation of apoptotic bodies, which are then phagocytosed. Characterized by deeply eosinophilic cytoplasm and basophilic nucleus, pyknosis, and karyorrhexis. Cell membrane typically remains intact without significant inflammation (unlike necrosis)." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.018
    kind: cloze
    topic: apoptosis
    text: "{{c1::DNA laddering}} (fragments in multiples of {{c2::180}} bp) is a sensitive indicator of apoptosis."
    src: { page: 204, quote: "DNA laddering (fragments in multiples of 180 bp) is a sensitive indicator of apoptosis." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.019
    kind: card
    topic: apoptosis
    front: When does the intrinsic (mitochondrial) pathway of apoptosis occur?
    back: In tissue remodeling in embryogenesis; when a regulating factor is withdrawn from a proliferating population (e.g., ↓ IL-2 after an immune reaction → apoptosis of effector cells); and after injurious stimuli (radiation, toxins, hypoxia).
    src: { page: 204, quote: "Involved in tissue remodeling in embryogenesis. Occurs when a regulating factor is withdrawn from a proliferating cell population (eg, ↓ IL-2 after a completed immunologic reaction → apoptosis of proliferating effector cells)." }
    status: unverified
  - id: path.L01.020
    kind: table
    topic: apoptosis
    title: Bcl-2 family proteins
    columns: [Group, Proteins, Action]
    rows:
      - ["Proapoptotic (\"Bad for survival\")", "Bax, Bak", "Form pores in the outer mitochondrial membrane → cytochrome C released → caspases activated"]
      - ["Antiapoptotic (\"Be clever, live\")", "Bcl-2, Bcl-xL", "Keep the mitochondrial membrane impermeable → no cytochrome C release"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2]]
    src: { page: 204, quote: "Bax and Bak are proapoptotic (Bad for survival), while Bcl-2 and Bcl-xL are antiapoptotic (Be clever, live)." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.021
    kind: card
    topic: apoptosis
    front: How does Bcl-2 overexpression cause cancer, and in which lymphoma is it classic?
    back: Bcl-2 overexpression → ↓ caspase activation → tumorigenesis; classic in follicular lymphoma, t(14;18).
    src: { page: 204, quote: "Bcl-2 overexpression (eg, follicular lymphoma t[14;18]) → ↓ caspase activation → tumorigenesis." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.022
    kind: card
    topic: apoptosis
    front: What ligands trigger the extrinsic (death receptor) pathway, and where is Fas-FasL essential?
    back: FasL binding Fas (CD95), or TNF-α binding its receptor. Fas-FasL interaction is necessary in thymic medullary negative selection.
    src: { page: 204, quote: "Ligand receptor interactions: FasL binding to Fas (CD95) or TNF-α binding to its receptor. Fas-FasL interaction is necessary in thymic medullary negative selection." }
    status: unverified
  - id: path.L01.023
    kind: card
    topic: apoptosis
    front: What causes autoimmune lymphoproliferative syndrome, and how does it present?
    back: Defective Fas-FasL interaction → failure of clonal deletion → ↑ self-reacting lymphocytes. Lymphadenopathy, hepatosplenomegaly, autoimmune cytopenias.
    src: { page: 204, quote: "Autoimmune lymphoproliferative syndrome—caused by defective Fas-FasL interaction → failure of clonal deletion → ↑ numbers of self-reacting lymphocytes. Presents with lymphadenopathy, hepatosplenomegaly, autoimmune cytopenias." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.024
    kind: card
    topic: apoptosis
    front: How does the perforin/granzyme B pathway work?
    back: Cytotoxic T cells and NK cells release granules; perforin forms a pore through which granzyme B enters the target cell (and activates caspases).
    src: { page: 204, quote: "Release of granules containing perforin and granzyme B by immune cells (cytotoxic T-cell and natural killer cell) → perforin forms a pore for granzyme B to enter the target cell." }
    status: unverified
  - id: path.L01.025
    kind: mcq
    topic: apoptosis
    stem: >-
      A 58-year-old woman has painless, waxing and waning lymphadenopathy in the neck and groin for
      a year. Lymph node biopsy shows effacement by closely packed follicles of small cleaved cells.
      Cytogenetics shows t(14;18). The overexpressed protein in her tumor cells acts by which
      mechanism?
    options:
      - Forming pores in the outer mitochondrial membrane
      - Blocking cytochrome C release from mitochondria
      - Binding Fas to start the extrinsic pathway
      - Forming a membrane pore that lets granzyme B in
      - Cleaving DNA into 180-bp fragments (laddering)
    answer: 1
    why:
      - "Pore formation is what proapoptotic Bax and Bak do."
      - "Right. t(14;18) in follicular lymphoma overexpresses Bcl-2, which keeps the mitochondrial membrane impermeable, preventing cytochrome C release and caspase activation."
      - "FasL binding Fas triggers the extrinsic pathway; Bcl-2 doesn't do this."
      - "Perforin forms the pore for granzyme B."
      - "DNA laddering is a result of apoptosis, which Bcl-2 prevents."
    src: { page: 204, quote: "Bcl-2 keeps the mitochondrial membrane impermeable, thereby preventing cytochrome C release. Bcl-2 overexpression (eg, follicular lymphoma t[14;18]) → ↓ caspase activation → tumorigenesis." }
    status: unverified
  # ---------- p205: necrosis ----------
  - id: path.L01.026
    kind: card
    topic: necrosis
    front: How does necrosis differ from apoptosis in mechanism and consequence?
    back: "Necrosis: an outside injury breaks the plasma membrane, the cell's contents spill out, the cell is digested by enzymes and its proteins denature, and the spill sets off local inflammation. Apoptosis keeps the membrane intact and causes no inflammation."
    src: { page: 205, quote: "Exogenous injury → plasma membrane damage → intracellular components leak → cell undergoes enzymatic degradation and protein denaturation → local inflammatory reaction (unlike apoptosis)." }
    status: unverified
    tags: [high-yield]
  - id: path.L01.027
    kind: table
    topic: necrosis
    title: Types of necrosis
    columns: [Type, Seen in, Mechanism, Histology]
    rows:
      - ["Coagulative", "Ischemia/infarcts in most tissues (except brain)", "Injury denatures enzymes → proteolysis blocked", "Cell outlines preserved, nuclei disappear; ↑ eosinophilia"]
      - ["Liquefactive", "Bacterial abscesses, CNS infarcts", "Neutrophils release lysosomal enzymes that digest tissue", "Early: debris and macrophages; late: cystic spaces, cavitation (CNS)"]
      - ["Caseous", "TB, systemic fungi (Histoplasma), Nocardia", "Macrophages wall off the organism → granular debris", "Fragmented cells and debris in a granuloma; cheeselike gross"]
      - ["Fat", "Enzymatic: acute pancreatitis; nonenzymatic: trauma (breast)", "Lipase frees fatty acids that bind calcium → saponification", "Dead fat cell outlines without nuclei; saponified fat dark blue on H&E"]
      - ["Fibrinoid", "Immune (polyarteritis nodosa) and nonimmune (hypertensive emergency, preeclampsia) vascular reactions", "Immune complexes (type III) and/or plasma protein (fibrin) leakage", "Eosinophilic proteinaceous layer in vessel walls"]
      - ["Gangrenous", "Distal extremity and GI tract after chronic ischemia", "Dry: ischemia; wet: superinfection", "Dry: coagulative; wet: liquefactive on coagulative"]
    blanks: [[0, 1], [0, 3], [1, 1], [1, 2], [2, 1], [3, 2], [4, 1], [5, 3]]
    src:
      page: 205
      quote: |-
        TYPe SeeN IN DUe TO HISTOLOGY
        Coagulative Ischemia/infarcts in most tissues (except brain) Ischemia or infarction; injury denatures enzymes → proteolysis blocked Preserved cellular architecture (cell outlines seen), but nuclei disappear; ↑ cytoplasmic binding of eosin stain (→ ↑ eosinophilia; red/pink color) A
        Liquefactive Bacterial abscesses, CNS infarcts Neutrophils release lysosomal enzymes that digest the tissue Early: cellular debris and macrophages Late: cystic spaces and cavitation (CNS) B Neutrophils and cell debris seen with bacterial infection
        Caseous TB, systemic fungi (eg, Histoplasma capsulatum), Nocardia Macrophages wall off the infecting microorganism → granular debris Fragmented cells and debris surrounded by lymphocytes and macrophages (granuloma) Cheeselike gross appearance C
        Fat Enzymatic: acute pancreatitis (saponification of peripancreatic fat) Nonenzymatic: traumatic (eg, injury to breast tissue) Damaged pancreatic cells release lipase, which breaks down triglycerides; liberated fatty acids bind calcium → saponification (chalky-white appearance) Outlines of dead fat cells without peripheral nuclei; saponification of fat (combined with Ca2+ ) appears dark blue on H&E stain D
        Fibrinoid Immune vascular reactions (eg, polyarteritis nodosa) Nonimmune vascular reactions (eg, hypertensive emergency, preeclampsia) Immune complex deposition (type III hypersensitivity reaction) and/or plasma protein (eg, fibrin) leakage from damaged vessel Vessel walls contain eosinophilic layer of proteinaceous material (arrow in E )
        Gangrenous Distal extremity and GI tract, after chronic ischemia Dry: ischemia F Coagulative
        Wet: superinfection Liquefactive superimposed on coagulative
    status: unverified
    tags: [high-yield]
  - id: path.L01.028
    kind: cloze
    topic: necrosis
    text: "Infarcts in most tissues cause {{c1::coagulative}} necrosis, but brain infarcts cause {{c2::liquefactive}} necrosis."
    src:
      page: 205
      quote: |-
        Coagulative Ischemia/infarcts in most tissues (except brain) Ischemia or infarction; injury denatures enzymes → proteolysis blocked
        Preserved cellular architecture (cell outlines seen), but nuclei disappear; ↑ cytoplasmic binding of eosin stain (→ ↑ eosinophilia; red/pink color) A
        Liquefactive Bacterial abscesses, CNS infarcts Neutrophils release lysosomal enzymes that digest the tissue
    status: unverified
    tags: [high-yield]
  - id: path.L01.029
    kind: mcq
    topic: necrosis
    stem: >-
      A 48-year-old man is admitted with severe epigastric pain radiating to the back after a weekend of
      heavy drinking. Serum lipase is 12 times the upper limit of normal. He dies of multiorgan failure.
      At autopsy, the peripancreatic fat shows chalky-white areas. Microscopy of these areas would most
      likely show which of the following?
    options:
      - Preserved cell outlines with absent nuclei and intense eosinophilia
      - Outlines of dead fat cells without nuclei and dark-blue calcium deposits
      - Granulomas with central cheeselike debris
      - An eosinophilic layer of fibrin in arteriolar walls
      - Cystic cavities with macrophages
    answer: 1
    why:
      - "That is coagulative necrosis of an infarct."
      - "Right. Enzymatic fat necrosis: lipase frees fatty acids that bind calcium (saponification, chalky white); dead fat cell outlines without nuclei and dark-blue saponified fat on H&E."
      - "That is caseous necrosis (TB, fungi)."
      - "That is fibrinoid necrosis."
      - "That is late liquefactive necrosis, as in a brain infarct."
    src: { page: 205, quote: "Damaged pancreatic cells release lipase, which breaks down triglycerides; liberated fatty acids bind calcium → saponification (chalky- white appearance) Outlines of dead fat cells without peripheral nuclei; saponification of fat (combined with Ca2+ ) appears dark blue on H&E stain" }
    status: unverified
  # ---------- p206: ischemia ----------
  - id: path.L01.030
    kind: card
    topic: ischemia
    front: What is ischemia, and what are its mechanisms?
    back: Inadequate blood supply to meet demand. Mechanisms include ↓ arterial perfusion (atherosclerosis), ↓ venous drainage (testicular torsion, Budd-Chiari syndrome) and shock.
    src: { page: 206, quote: "Inadequate blood supply to meet demand. Mechanisms include ↓ arterial perfusion (eg, atherosclerosis), ↓ venous drainage (eg, testicular torsion, Budd-Chiari syndrome), shock." }
    status: unverified
  - id: path.L01.031
    kind: table
    topic: ischemia
    title: Regions most vulnerable to hypoxia/ischemia
    columns: [Organ, Susceptible region]
    rows:
      - ["Brain", "ACA/MCA/PCA boundary areas (watershed)"]
      - ["Heart", "Subendocardium of LV"]
      - ["Kidney", "Straight segment of proximal tubule and thick ascending limb (medulla)"]
