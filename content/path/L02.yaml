  - id: path.L02.035
    kind: mcq
    topic: leukocyte-extravasation
    stem: >-
      A 3-week-old boy has omphalitis, and his umbilical cord did not separate until day 30. His
      white blood cell count is 38,000/mm3 with marked neutrophilia, yet the infected tissue shows
      almost no neutrophils or pus. Flow cytometry is most likely to show a deficiency of which
      molecule?
    options:
