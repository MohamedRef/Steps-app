items:
  # ---------- p209: inflammation ----------
  - id: path.L02.001
    kind: card
    topic: inflammation
    front: What are the three goals of inflammation?
    back: "Remove what started the cell injury, clear out the necrotic cells that insult left behind, and get tissue repair going."
    src: { page: 209, quote: "Response to eliminate initial cause of cell injury, to remove necrotic cells resulting from the original insult, and to initiate tissue repair." }
    status: unverified
  - id: path.L02.002
    kind: enumerate
    topic: inflammation
    prompt: "Enumerate the three ways inflammation itself harms the host, with an example of each (3)."
    points:
      - "Excessive (septic shock)"
      - "Prolonged (persistent infections such as TB)"
      - "Inappropriate (autoimmune diseases such as SLE)"
    pass: 3
    src: { page: 209, quote: "The inflammatory response itself can be harmful to the host if the reaction is excessive (eg, septic shock), prolonged (eg, persistent infections such as TB), or inappropriate (eg, autoimmune diseases such as SLE)." }
    status: unverified
  - id: path.L02.003
    kind: mcq
    topic: inflammation
    stem: >-
      A 24-year-old woman has a malar rash, arthralgias and proteinuria. Anti-dsDNA antibodies are
      positive, and a renal biopsy shows immune complex deposition with inflammation of the
      glomeruli. Her kidney damage is best explained by an inflammatory response that is which of
      the following?
    options:
      - Excessive, as in septic shock
      - Prolonged, as in persistent infection
      - Inappropriate, directed against self
      - Appropriate, removing necrotic cells
      - Absent, allowing infection to spread
    answer: 2
    why:
      - "Septic shock is the book's example of an excessive response to an infection."
      - "Persistent infections such as TB are the book's example of a prolonged response."
      - "Right. SLE is the book's example of inappropriate inflammation: the response targets the host's own antigens."
      - "Removing necrotic cells is a goal of inflammation; here inflammation is causing the injury."
      - "Inflammation is present and is causing the damage."
    src: { page: 209, quote: "inappropriate (eg, autoimmune diseases such as SLE)" }
    status: unverified
  # ---------- p209: cardinal signs ----------
  - id: path.L02.004
    kind: table
    topic: cardinal-signs
    title: Cardinal signs of inflammation
    columns: [Sign, Mechanism, Mediators]
    rows:
      - ["Rubor and calor (redness, warmth)", "Vasodilation (arteriolar smooth muscle relaxes) → ↑ blood flow", "Histamine, prostaglandins, bradykinin, NO"]
      - ["Tumor (swelling)", "Endothelial contraction/disruption → ↑ permeability → exudate from postcapillary venules", "Leukotrienes C4, D4, E4; histamine; serotonin; bradykinin"]
      - ["Dolor (pain)", "Sensitization of sensory nerve endings", "Bradykinin, PGE2, histamine"]
      - ["Functio laesa (loss of function)", "Inflammation impairs function (e.g., can't make a fist with hand cellulitis)", "— (none listed)"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 2]]
    src:
      page: 209
      quote: |-
        SIGN MeCHANISM
        Cardinal signs
        Rubor and calor Redness and warmth. Vasodilation (relaxation of arteriolar smooth muscle) → ↑ blood flow. Mediated by histamine, prostaglandins, bradykinin, NO.
        Tumor Swelling. Endothelial contraction/disruption (eg, from tissue damage) → ↑ vascular permeability → leakage of protein-rich fluid from postcapillary venules into interstitial space (exudate) → ↑ interstitial oncotic pressure. Endothelial cell contraction is mediated by leukotrienes (C4, D4, E4), histamine, serotonin, bradykinin.
        Dolor Pain. Sensitization of sensory nerve endings. Mediated by bradykinin, PGE2, histamine.
        Functio laesa Loss of function. Inflammation impairs function (eg, inability to make fist due to hand cellulitis).
    status: unverified
    tags: [high-yield]
  - id: path.L02.005
    kind: card
    topic: cardinal-signs
    front: How does swelling (tumor) form in inflammation?
    back: Endothelial contraction or disruption → ↑ vascular permeability → protein-rich fluid leaks from postcapillary venules into the interstitium (exudate) → ↑ interstitial oncotic pressure.
    src: { page: 209, quote: "Endothelial contraction/disruption (eg, from tissue damage) → ↑ vascular permeability → leakage of protein-rich fluid from postcapillary venules into interstitial space (exudate) → ↑ interstitial oncotic pressure." }
    status: unverified
  - id: path.L02.006
    kind: cloze
    topic: cardinal-signs
    text: "Inflammatory pain (dolor) comes from sensitization of sensory nerve endings, mediated by {{c1::bradykinin}}, {{c2::PGE2}} and histamine."
    src: { page: 209, quote: "Dolor Pain. Sensitization of sensory nerve endings. Mediated by bradykinin, PGE2, histamine." }
    status: unverified
  - id: path.L02.007
    kind: mcq
    topic: cardinal-signs
    stem: >-
      A 30-year-old man is stung by a bee on the forearm. Within minutes the area becomes swollen
      with protein-rich interstitial fluid. Contraction of which cells, at which site, produces this
      swelling?
    options:
      - Arteriolar smooth muscle cells
      - Endothelial cells of postcapillary venules
      - Capillary pericytes in the arterioles
      - Lymphatic endothelial cells
      - Fibroblasts of the dermis
    answer: 1
    why:
      - "Arteriolar smooth muscle relaxation (vasodilation) gives redness and warmth, not exudate."
      - "Right. Endothelial contraction (leukotrienes C4/D4/E4, histamine, serotonin, bradykinin) opens junctions so protein-rich fluid leaks from postcapillary venules."
      - "The book places the leak at postcapillary venules, not arterioles."
      - "Lymphatics drain fluid; they do not create the exudate."
      - "Fibroblasts lay down collagen in repair; they do not cause acute swelling."
    src: { page: 209, quote: "leakage of protein-rich fluid from postcapillary venules into interstitial space (exudate) → ↑ interstitial oncotic pressure. Endothelial cell contraction is mediated by leukotrienes (C4, D4, E4), histamine, serotonin, bradykinin." }
    status: unverified
  # ---------- p209: systemic manifestations ----------
  - id: path.L02.008
    kind: order
    topic: systemic-manifestations
    prompt: Put the steps that raise the temperature set point in fever in order.
    steps:
      - Pyrogens (e.g., LPS) act on macrophages
      - Macrophages release IL-1 and TNF
      - ↑ COX activity in perivascular cells of the anterior hypothalamus
      - ↑ PGE2
      - ↑ Temperature set point
    src: { page: 209, quote: "Pyrogens (eg, LPS) induce macrophages to release IL-1 and TNF → ↑ COX activity in perivascular cells of anterior hypothalamus → ↑ PGE2 → ↑ temperature set point." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.009
    kind: card
    topic: systemic-manifestations
    front: What determines the predominant cell type in inflammatory leukocytosis?
    back: The inciting agent or injury, e.g., bacteria → ↑ neutrophils.
    src: { page: 209, quote: "↑ WBC count; type of predominant cell depends on inciting agent or injury (eg, bacteria → ↑ neutrophils)." }
    status: unverified
  - id: path.L02.010
    kind: cloze
    topic: systemic-manifestations
    text: "Acute-phase reactants are produced by the {{c1::liver}} and are notably induced by {{c2::IL-6}}."
    src: { page: 209, quote: "Produced by liver. Notably induced by IL-6." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.011
    kind: mcq
    topic: systemic-manifestations
    stem: >-
      A 45-year-old woman with gram-negative pyelonephritis has a temperature of 39.6 °C (103.3 °F).
      She takes ibuprofen and her fever falls within an hour. Which step in fever generation did the
      drug block?
    options:
      - Binding of LPS to macrophages
      - Release of IL-1 by macrophages
      - Prostaglandin E2 synthesis in the anterior hypothalamus
      - IL-6–driven hepatic acute-phase protein synthesis
      - Neutrophil release from the bone marrow
    answer: 2
    why:
      - "Ibuprofen does not stop LPS from acting on macrophages."
      - "IL-1 release comes before the step the drug blocks; NSAIDs act downstream."
      - "Right. IL-1 and TNF ↑ COX activity in the anterior hypothalamus → ↑ PGE2 → ↑ set point. A COX inhibitor blocks PGE2."
      - "Acute-phase proteins do not set the hypothalamic temperature."
      - "Leukocytosis is a separate systemic manifestation and does not set the temperature."
    src: { page: 209, quote: "Pyrogens (eg, LPS) induce macrophages to release IL-1 and TNF → ↑ COX activity in perivascular cells of anterior hypothalamus → ↑ PGE2 → ↑ temperature set point." }
    status: unverified
  # ---------- p209: acute-phase reactants ----------
  - id: path.L02.012
    kind: table
    topic: acute-phase-reactants
    title: Positive acute-phase reactants (upregulated)
    columns: [Reactant, Role]
    rows:
      - ["C-reactive protein", "Opsonin; fixes complement, aids phagocytosis; nonspecific marker of inflammation"]
      - ["Ferritin", "Binds and sequesters iron to inhibit microbial iron scavenging"]
      - ["Fibrinogen", "Coagulation factor; promotes endothelial repair; correlates with ESR"]
      - ["Haptoglobin", "Binds extracellular hemoglobin; protects against oxidative stress"]
      - ["Hepcidin", "↓ Iron absorption (degrades ferroportin) and ↓ release from macrophages → anemia of chronic disease"]
      - ["Procalcitonin", "Increases in bacterial infections"]
      - ["Serum amyloid A", "Prolonged elevation → secondary amyloidosis"]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1]]
    src:
      page: 209
      quote: |-
        Acute-phase reactants
        POSITIVe (UPReGULATeD)
        C-reactive protein Opsonin; fixes complement and facilitates phagocytosis. Measured clinically as a nonspecific sign of ongoing inflammation.
        Ferritin Binds and sequesters iron to inhibit microbial iron scavenging.
        Fibrinogen Coagulation factor; promotes endothelial repair; correlates with ESR.
        Haptoglobin Binds extracellular hemoglobin, protects against oxidative stress.
        Hepcidin ↓ iron absorption (by degrading ferroportin) and ↓ iron release (from macrophages) → anemia of chronic disease.
        Procalcitonin Increases in bacterial infections.
        Serum amyloid A Prolonged elevation can lead to secondary amyloidosis.
    status: unverified
    tags: [high-yield]
  - id: path.L02.013
    kind: enumerate
    topic: acute-phase-reactants
    prompt: Enumerate the negative (downregulated) acute-phase reactants (3).
    points:
      - Albumin
      - Transferrin
      - Transthyretin (prealbumin)
    pass: 3
    hook: "الـ 3 بيقلّوا: الـ albumin والـ transthyretin عشان الـ amino acids تروح للـ positive reactants، والـ transferrin بيدخل الـ macrophages عشان الحديد يتحبس."
    src: { page: 209, quote: "NeGATIVe (DOWNReGULATeD) Albumin Downregulation conserves amino acids for positive reactants. Transferrin Internalized by macrophages to sequester iron. Transthyretin Also called prealbumin." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.014
    kind: card
    topic: acute-phase-reactants
    front: How does hepcidin cause anemia of chronic disease?
    back: Hepcidin degrades ferroportin, so iron absorption falls and macrophages release less iron.
    src: { page: 209, quote: "Hepcidin ↓ iron absorption (by degrading ferroportin) and ↓ iron release (from macrophages) → anemia of chronic disease." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.015
    kind: card
    topic: acute-phase-reactants
    front: Why are albumin and transthyretin downregulated in the acute-phase response?
    back: Downregulating them conserves amino acids for the positive acute-phase reactants.
    src: { page: 209, quote: "Albumin Downregulation conserves amino acids for positive reactants." }
    status: unverified
  - id: path.L02.016
    kind: cloze
    topic: acute-phase-reactants
    text: "{{c1::Procalcitonin}} is the acute-phase reactant that increases in {{c2::bacterial}} infections."
    src: { page: 209, quote: "Procalcitonin Increases in bacterial infections." }
    status: unverified
  - id: path.L02.017
    kind: mcq
    topic: acute-phase-reactants
    stem: >-
      A 62-year-old man with rheumatoid arthritis for 20 years has fatigue. Hemoglobin is 10.1 g/dL
      with a normocytic picture, serum iron is low, ferritin is high and total iron-binding capacity
      is low. Which acute-phase reactant most directly lowers his serum iron?
    options:
      - Haptoglobin
      - Hepcidin
      - C-reactive protein
      - Serum amyloid A
      - Fibrinogen
    answer: 1
    why:
      - "Haptoglobin binds free hemoglobin; it does not trap iron."
      - "Right. Hepcidin degrades ferroportin → ↓ iron absorption and ↓ release from macrophages → anemia of chronic disease."
      - "CRP is an opsonin and a marker of inflammation; it does not regulate iron."
      - "Serum amyloid A can cause secondary amyloidosis after prolonged elevation, but not low iron."
      - "Fibrinogen raises the ESR; it does not handle iron."
    src: { page: 209, quote: "Hepcidin ↓ iron absorption (by degrading ferroportin) and ↓ iron release (from macrophages) → anemia of chronic disease." }
    status: unverified
  # ---------- p210: ESR ----------
  - id: path.L02.018
    kind: card
    topic: erythrocyte-sedimentation-rate
    front: Why does inflammation raise the ESR?
    back: RBCs normally stay apart through their negative surface charges. Inflammatory products (e.g., fibrinogen) coat RBCs → ↓ negative charge → ↑ aggregation. Denser aggregates fall faster in the tube → ↑ ESR.
    src: { page: 210, quote: "RBCs normally remain separated via ⊝ charges. Products of inﬂammation (eg, fibrinogen) coat RBCs → ↓ ⊝ charge → ↑ RBC aggregation. Denser RBC aggregates fall at a faster rate within a pipette tube → ↑ ESR." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.019
    kind: table
    topic: erythrocyte-sedimentation-rate
    title: What changes the ESR
    columns: [↑ ESR, ↓ ESR (lower than expected)]
    rows:
      - ["Most anemias", "Sickle cell anemia (altered shape)"]
      - ["Infections", "Polycythemia (↑ RBCs dilute aggregation factors)"]
      - ["Inflammation (giant cell arteritis, polymyalgia rheumatica)", "HF"]
      - ["Cancer (metastases, multiple myeloma)", "Microcytosis"]
      - ["Renal disease (end-stage or nephrotic syndrome)", "Hypofibrinogenemia"]
      - ["Pregnancy", ""]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1]]
    src: { page: 210, quote: "Most anemias Sickle cell anemia (altered shape) Infections Polycythemia (↑ RBCs “dilute” aggregation factors)" }
    status: unverified
    tags: [high-yield]
  - id: path.L02.020
    kind: cloze
    topic: erythrocyte-sedimentation-rate
    text: "The ESR is often co-tested with {{c1::CRP}}, the {{c2::more specific}} marker of inflammation."
    src: { page: 210, quote: "Often co-tested with CRP (more specific marker of inflammation)." }
    status: unverified
  - id: path.L02.021
    kind: mcq
    topic: erythrocyte-sedimentation-rate
    stem: >-
      A 19-year-old man with known sickle cell disease has fever and painful dactylitis. His CRP is
      markedly elevated, but his erythrocyte sedimentation rate is near zero. Which explanation best
      accounts for the low ESR?
    options:
      - Abnormal RBC shape prevents aggregation
      - Fibrinogen production is suppressed by sickling
      - The extra RBCs dilute the aggregation factors
      - Microcytosis from coexisting iron deficiency
      - Hemolysis lowers CRP production
    answer: 0
    why:
      - "Right. In sickle cell anemia the altered RBC shape prevents the stacking that makes cells fall fast, so the ESR is lower than expected."
      - "Fibrinogen is a positive acute-phase reactant and rises in inflammation."
      - "Dilution by extra RBCs is how polycythemia lowers the ESR; he has anemia."
      - "Microcytosis can lower the ESR, but sickle cell disease is the cause here; the book lists its altered shape."
      - "His CRP is high, and CRP doesn't explain the ESR."
    src: { page: 210, quote: "Sickle cell anemia (altered shape)" }
    status: unverified
  # ---------- p210: acute inflammation ----------
  - id: path.L02.022
    kind: card
    topic: acute-inflammation
    front: What characterizes acute inflammation (cells, onset, duration, arm of immunity)?
    back: Neutrophils in tissue, often with edema. Rapid onset (seconds to minutes) and short duration (minutes to days). It is a reaction of the innate immune system, less specific than chronic inflammation.
    src: { page: 210, quote: "Characterized by neutrophils in tissue A , often with associated edema. Rapid onset (seconds to minutes) and short duration (minutes to days). Represents a reaction of the innate immune system" }
    status: unverified
    tags: [high-yield]
  - id: path.L02.023
    kind: enumerate
    topic: acute-inflammation
    prompt: Enumerate the stimuli of acute inflammation (4).
    points:
      - Infections
      - Trauma
      - Necrosis
      - Foreign bodies
    pass: 4
    src: { page: 210, quote: "STIMULI Infections, trauma, necrosis, foreign bodies." }
    status: unverified
  - id: path.L02.024
    kind: card
    topic: acute-inflammation
    front: What is the inflammasome?
    back: "A protein complex inside the cytoplasm that senses danger signals from damaged tissue or microbes (microbial products, uric acid crystals) and switches on IL-1, which drives inflammation such as fever and a high WBC count."
    src: { page: 210, quote: "Inﬂammasome—cytoplasmic complex recognizing damage- and pathogen-associated molecular patterns (eg, microbial products, uric acid crystals) → IL-1 activation → inflammatory response (eg, fever, leukocytosis)." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.025
    kind: card
    topic: acute-inflammation
    front: What is the vascular component of acute inflammation?
    back: Vessels dilate, so flow rises and then slows (stasis), and they become leakier because endothelial cells contract and open the gaps between them.
    src: { page: 210, quote: "Vascular: vasodilation (→ ↑ blood flow and stasis) and ↑ endothelial permeability (contraction of endothelial cells opens interendothelial junctions)" }
    status: unverified
  - id: path.L02.058
    kind: card
    topic: acute-inflammation
    front: What is the cellular component of acute inflammation?
    back: Leukocytes, mostly neutrophils, leave the blood at postcapillary venules, gather at the site of injury and are activated there.
    src: { page: 210, quote: "Cellular: extravasation of leukocytes (mainly neutrophils) from postcapillary venules → accumulation of leukocytes in focus of injury → leukocyte activation" }
    status: unverified
  - id: path.L02.059
    kind: enumerate
    topic: acute-inflammation
    prompt: Enumerate the mediators of acute inflammation (9).
    points:
      - Toll-like receptors
      - Arachidonic acid metabolites
      - Neutrophils
      - Eosinophils
      - Antibodies (pre-existing)
      - Mast cells
      - Basophils
      - Complement
      - Hageman factor (factor XII)
    pass: 7
    src: { page: 210, quote: "Toll-like receptors, arachidonic acid metabolites, neutrophils, eosinophils, antibodies (pre- existing), mast cells, basophils, complement, Hageman factor (factor XII)." }
    status: unverified
    tags: [high-yield]
  - id: path.L02.026
    kind: table
    topic: acute-inflammation
    title: Outcomes of acute inflammation
    columns: [Outcome, Driver]
    rows:
      - ["Resolution and healing", "IL-10, TGF-β"]
      - ["Persistent acute inflammation", "IL-8"]
      - ["Abscess", "Acute inflammation walled off by fibrosis"]
      - ["Chronic inflammation", "Antigen presentation by macrophages and other APCs → CD4+ Th activation"]
      - ["Scarring", ""]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1]]
    src: { page: 210, quote: "Resolution and healing (IL-10, TGF-β) Persistent acute inflammation (IL-8) Abscess (acute inflammation walled off by fibrosis)" }
    status: unverified
  - id: path.L02.027
    kind: cloze
    topic: acute-inflammation
    text: "{{c1::Macrophages}} predominate in the late stages of acute inflammation, peaking {{c2::2-3 days}} after onset, and influence the outcome by secreting cytokines."
    src: { page: 210, quote: "Macrophages predominate in the late stages of acute inflammation (peak 2-3 days after onset) and influence outcome by secreting cytokines." }
    status: unverified
  - id: path.L02.028
    kind: mcq
    topic: acute-inflammation
    stem: >-
      A 58-year-old man wakes with a hot, swollen, exquisitely painful first metatarsophalangeal
      joint. His temperature is 38.4°C (101.1°F) and his leukocyte count is 14,000/mm3. Aspiration
      shows needle-shaped, negatively birefringent crystals and many neutrophils. Which of the
      following best explains how the crystals produce his fever and leukocytosis?
    options:
      - Crystals activate Hageman factor (factor XII), and bradykinin resets the hypothalamus
      - Crystals are recognized by the inflammasome, which activates IL-1
      - Crystals fix complement and form a membrane attack complex on synovial cells
      - Macrophages present crystal peptides on MHC class II to CD4+ Th cells
      - Macrophages release IL-10 and TGF-β around the crystals
    answer: 1
    why:
      - "Hageman factor is an acute inflammation mediator, but bradykinin mediates vasodilation, permeability and pain, not the fever set point; the book links crystal sensing to IL-1."
      - "Right. The inflammasome is a cytoplasmic complex that recognizes damage patterns such as uric acid crystals → IL-1 activation → fever and leukocytosis (IL-1 → COX → PGE2 → higher set point)."
      - "The membrane attack complex lyses cells; it doesn't explain fever and leukocytosis."
      - "Antigen presentation to CD4+ Th cells is the route to chronic inflammation; crystals are not peptides and this gout flare is acute."
      - "IL-10 and TGF-β drive resolution and healing, which damp inflammation rather than cause fever."
    src: { page: 210, quote: "Inflammasome—cytoplasmic complex recognizing damage- and pathogen-associated molecular patterns (eg, microbial products, uric acid crystals) → IL-1 activation → inflammatory response (eg, fever, leukocytosis)." }
    status: unverified
