      - CD18 integrin
      - PECAM-1 (CD31)
      - E-selectin
      - NADPH oxidase
    answer: 1
    why:
      - "↓ Sialyl LewisX is leukocyte adhesion deficiency type 2, a rolling defect."
      - "Right. Leukocyte adhesion deficiency type 1 (↓ CD18) blocks tight binding, so neutrophils stay in the blood and don't reach the tissue."
      - "PECAM-1 mediates diapedesis; the book doesn't link its deficiency to this syndrome."
      - "E-selectin is on the endothelium, not on the patient's leukocytes."
      - "NADPH oxidase deficiency is chronic granulomatous disease; neutrophils still reach tissue."
    src: { page: 211, quote: "defective in leukocyte adhesion deficiency type 1 (↓ CD18 integrin subunit)" }
    status: unverified
  # ---------- p212: chronic inflammation ----------
