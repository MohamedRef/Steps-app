  - id: repro.L03.012
    kind: order
    topic: estrogen
    prompt: Put the two-cell steps of ovarian estrogen synthesis in order.
    steps:
      - LH acts on theca cells
      - Theca cells convert cholesterol to androstenedione (desmolase)
      - Androstenedione moves to granulosa cells
      - FSH-stimulated aromatase in granulosa cells makes estrogen (estradiol)
    src: { page: 648, quote: "Granulosa cell Theca cell LH LHR FSHR cAMP cAMP Cholesterol Cholesterol Androstenedione Androstenedione Estrone Aromatase Desmolase Estrogen FSH Estradiol" }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.013
    kind: mcq
    topic: estrogen
    stem: >-
      A 31-year-old woman is having ovulation induction at a fertility clinic. Transvaginal
      ultrasound shows a growing dominant follicle in the right ovary, and her serum estradiol has
      risen steadily over 5 days. Within this follicle, theca cells make androstenedione under LH,
      and neighbouring granulosa cells turn it into estradiol under FSH. Which enzyme in the granulosa
      cells performs this final step?
    options:
      - Desmolase
      - Aromatase
      - 5α-reductase
      - 21-hydroxylase
      - 17α-hydroxylase
    answer: 1
    why:
      - "Desmolase acts in theca cells, starting from cholesterol, under LH."
      - "Right. FSH stimulates granulosa aromatase, which turns androstenedione from theca cells into estrogen."
      - "5α-reductase turns testosterone into DHT."
      - "21-hydroxylase is an adrenal enzyme for cortisol and aldosterone."
      - "17α-hydroxylase makes androgen precursors, not estrogen from androstenedione."
    src: { page: 648, quote: "Androstenedione Androstenedione Estrone Aromatase Desmolase Estrogen FSH Estradiol" }
    status: unverified
  # ---------- p649: oogenesis ----------
  - id: repro.L03.014
    kind: card
    topic: oogenesis
    front: When do 1° oocytes begin and complete meiosis I?
    back: They begin meiosis I during fetal life and complete it just prior to ovulation.
    src: { page: 649, quote: "1° oocytes begin meiosis I during fetal life and complete meiosis I just prior to ovulation." }
    status: unverified
  - id: repro.L03.015
    kind: cloze
    topic: oogenesis
    text: "Meiosis I is arrested in {{c1::prophase I}} until ovulation (1° oocytes); meiosis II is arrested in {{c2::metaphase II}} until fertilization (2° oocytes)."
    src: { page: 649, quote: "Meiosis I is arrested in prophase I (one) for years until ovulation (1° oocytes). Meiosis II is arrested in metaphase II (two) until fertilization (2° oocytes)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.016
    kind: card
    topic: oogenesis
    front: What happens to the 2° oocyte if fertilization does not occur?
    back: It degenerates if fertilization does not occur within 1 day.
    src: { page: 649, quote: "If fertilization does not occur within 1 day, the 2° oocyte degenerates." }
    status: unverified
  - id: repro.L03.017
    kind: mcq
    topic: oogenesis
    stem: >-
      A 30-year-old woman undergoes oocyte retrieval for in vitro fertilization after an hCG trigger
      mimicking the LH surge. The retrieved oocytes have extruded a first polar body. In which stage
      are these oocytes arrested, and what will release the arrest?
    options:
      - Prophase I, released by the LH surge
      - Metaphase I, released by ovulation
      - Metaphase II, released by fertilization
      - Anaphase II, released by implantation
      - Prophase II, released by hCG
    answer: 2
    why:
      - "Prophase I is the arrest of the 1° oocyte, which ends just before ovulation; a polar body means meiosis I is done."
      - "Metaphase I is not a long arrest point in the book."
      - "Right. The 2° oocyte is arrested in metaphase II (two) until fertilization."
      - "Implantation happens days after fertilization; the oocyte doesn't wait for it."
      - "Prophase II isn't the arrest point; hCG here only mimicked the LH surge."
    src: { page: 649, quote: "Meiosis II is arrested in metaphase II (two) until fertilization (2° oocytes)." }
    status: unverified
  # ---------- p649: ovulation ----------
  - id: repro.L03.018
    kind: card
    topic: ovulation
    front: What is ovulation, and what triggers it?
    back: The follicle ruptures and releases the 2° oocyte, triggered by the sudden midcycle LH surge.
    src: { page: 649, quote: "Caused by sudden LH release (LH surge) at midcycle. Estrogen normally inhibits LH release, but high estrogen at midcycle transiently stimulates LH release → LH surge → ovulation." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.088
    kind: card
    topic: ovulation
    front: Estrogen normally inhibits LH release. How does it cause the LH surge at midcycle?
    back: When estrogen gets high at midcycle, it briefly switches to stimulating LH release → LH surge → ovulation.
    src: { page: 649, quote: "Caused by sudden LH release (LH surge) at midcycle. Estrogen normally inhibits LH release, but high estrogen at midcycle transiently stimulates LH release → LH surge → ovulation." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.019
    kind: card
    topic: ovulation
    front: What is mittelschmerz?
    back: '"Middle hurts": pain with ovulation from peritoneal irritation by normal bleeding at follicular rupture. Typically unilateral and mild, but it can mimic acute appendicitis.'
    src: { page: 649, quote: "Mittelschmerz (“middle hurts”)—pain with ovulation. Associated with peritoneal irritation from normal bleeding upon follicular rupture. Typically unilateral and mild, but can mimic acute appendicitis." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.020
    kind: mcq
    topic: ovulation
    stem: >-
      A 22-year-old woman has mild right lower quadrant pain that began this morning. Her menses are
      regular every 28 days, and her last period began 14 days ago. She is afebrile, and the white cell
      count is normal. Ultrasound shows a small amount of free pelvic fluid and normal appendix. What
      is the most likely cause of the pain?
    options:
      - Peritoneal irritation from bleeding at follicular rupture
      - Twisting of the ovary on the infundibulopelvic ligament
      - Inflammation of the appendix
      - Ectopic implantation in the ampulla
      - Corpus luteum regression
    answer: 0
    why:
      - "Right. Midcycle pain with a little free fluid is mittelschmerz: normal bleeding at ovulation irritates the peritoneum."
      - "Torsion is severe with vomiting and an enlarged edematous ovary."
      - "Her appendix is normal on ultrasound, and she has no fever or leukocytosis; mittelschmerz can mimic appendicitis."
      - "Ectopic pregnancy needs a positive pregnancy test and a missed period."
      - "Corpus luteum regression happens at the end of the cycle, before menses."
    src: { page: 649, quote: "Mittelschmerz (“middle hurts”)—pain with ovulation. Associated with peritoneal irritation from normal bleeding upon follicular rupture." }
    status: unverified
