  - id: repro.L03.028
    kind: mcq
    topic: abnormal-uterine-bleeding
    stem: >-
      A 15-year-old girl has had heavy, prolonged periods since menarche, needing a pad change every
      hour. She bled for days after a dental extraction last year. Pelvic ultrasound is normal, and her
      platelet count is normal. In the PALM-COEIN system, which category best fits?
    options:
      - Polyp
      - Leiomyoma
      - Coagulopathy
      - Ovulatory
      - Malignancy/hyperplasia
    answer: 2
    why:
      - "A polyp is structural and would show on imaging; her ultrasound is normal."
      - "Leiomyoma is structural and unusual at 15."
      - "Right. Heavy bleeding since menarche with bleeding after dental work points to a coagulopathy (the C of COEIN), such as von Willebrand disease."
      - "Ovulatory dysfunction gives irregular cycles; the dental bleeding points elsewhere."
      - "Malignancy or hyperplasia is very unlikely at 15 with a normal ultrasound."
    src: { page: 651, quote: "▪ Nonstructural: Coagulopathy, Ovulatory, Endometrial, Iatrogenic, Not yet classified" }
    status: unverified
