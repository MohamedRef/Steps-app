  - id: repro.L03.024
    kind: mcq
    topic: menstrual-cycle
    stem: >-
      A 27-year-old woman comes to the gynecology clinic because she plans to conceive and wants to
      time intercourse. She has tracked her cycles in an app for a year: they vary between 26 and 34
      days, with 5 days of menses. She is healthy, and pelvic examination is normal. Which statement
      best explains the variation in her cycle length?
    options:
      - The luteal phase varies, and the follicular phase is fixed at 14 days
      - The follicular phase varies, and the luteal phase is fixed at 14 days
      - Both phases vary equally
      - The secretory phase varies because progesterone levels vary
      - Menses length explains the whole variation
    answer: 1
    why:
      - "It is the other way round: the luteal phase is fixed."
      - "Right. The follicular phase can fluctuate; the luteal phase (corpus luteum, LH-driven) lasts a fixed 14 days, so ovulation is about 14 days before the next period."
      - "The book gives a fixed luteal phase."
      - "The secretory phase matches the fixed luteal phase."
      - "Menses is part of the follicular phase; its few days can't explain an 8-day spread."
    src: { page: 650, quote: "can fluctuate in length. Luteal phase—corpus luteum formation from follicular remnants; stimulated by LH; lasts a fixed 14 days." }
    status: unverified
