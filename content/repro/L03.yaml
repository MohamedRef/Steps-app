  - id: repro.L03.004
    kind: card
    topic: spermatogenesis
    front: Why is a man with Kartagener syndrome (ciliary dyskinesia) infertile?
    back: His sperm tails can't move properly.
    src: { page: 647, quote: "Tail mobility impaired in ciliary dyskinesia/ Kartagener syndrome → infertility. Tail mobility normal in cystic fibrosis (in CF, absent vas deferens → infertility)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.087
    kind: card
    topic: spermatogenesis
    front: Why is a man with cystic fibrosis infertile, given that his sperm tails move normally?
    back: The vas deferens is absent, so sperm can't get out.
    src: { page: 647, quote: "Tail mobility impaired in ciliary dyskinesia/ Kartagener syndrome → infertility. Tail mobility normal in cystic fibrosis (in CF, absent vas deferens → infertility)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.005
    kind: mcq
    topic: spermatogenesis
    stem: >-
      A 29-year-old man is evaluated for infertility. He has had chronic sinusitis and recurrent
      pneumonia since childhood, and a chest x-ray shows the cardiac apex on the right. Semen analysis
      shows a normal sperm count, but the sperm are immotile. Which is the most likely cause of his
      infertility?
    options:
      - Absent vas deferens
      - Defective dynein in the sperm tail
      - Failure of spermiogenesis to form the acrosome
      - Raised scrotal temperature damaging Sertoli cells
      - Arrest of meiosis I in primary spermatocytes
    answer: 1
    why:
      - "Absent vas deferens is the cystic fibrosis cause; sperm would be missing from the ejaculate, not immotile."
      - "Right. Kartagener syndrome (ciliary dyskinesia, with dextrocardia) impairs tail mobility, so sperm are made but can't swim."
      - "Acrosome defects would affect egg penetration, not explain his sinus and lung disease."
      - "Heat lowers sperm production; his count is normal."
      - "A meiotic arrest would lower the count."
    src: { page: 647, quote: "Tail mobility impaired in ciliary dyskinesia/ Kartagener syndrome → infertility." }
    status: unverified
  - id: repro.L03.082
    kind: card
    topic: spermatogenesis
    front: What is the book's mnemonic for spermatogonium vs spermatozoon?
    back: '"Gonium" is going to be a sperm; "zoon" is "zooming" to egg.'
    src: { page: 647, quote: "“Gonium” is going to be a sperm; “zoon” is “zooming” to egg." }
    status: unverified
  # ---------- p648: estrogen ----------
  - id: repro.L03.006
    kind: card
    topic: estrogen
    front: What are the sources of estradiol, estriol and estrone, and their order of potency?
    back: "Estradiol: ovary. Estriol: placenta. Estrone: adipose tissue (via aromatization). Potency: estradiol > estrone > estriol."
    src: { page: 648, quote: "Ovary (estradiol), placenta (estriol), adipose tissue (estrone via aromatization). Potency: estradiol > estrone > estriol." }
    status: unverified
    tags: [high-yield]
  - id: repro.L03.083
    kind: card
    topic: estrogen
    front: What is the book's memory aid for the source of estradiol?
    back: Estradiol is produced from 2 ovaries.
    src: { page: 648, quote: "Estradiol is produced from 2 ovaries." }
    status: unverified
  - id: repro.L03.007
    kind: card
    topic: estrogen
    front: What does estrogen do to the genitalia, breasts, follicle, endometrium and myometrium?
    back: Development of internal/external genitalia, breasts and female fat distribution; growth of the follicle, endometrial proliferation, ↑ myometrial excitability.
    src: { page: 648, quote: "Development of internal/external genitalia, breasts, female fat distribution. Growth of follicle, endometrial proliferation, ↑ myometrial excitability." }
    status: unverified
  - id: repro.L03.008
    kind: card
    topic: estrogen
    front: What are estrogen's effects on receptors, gonadotropins and prolactin?
    back: Upregulates estrogen, LH and progesterone receptors; feedback inhibition of FSH and LH, then the LH surge; stimulates prolactin secretion but ↓ prolactin action on the breasts.
    src: { page: 648, quote: "Upregulation of estrogen, LH, and progesterone receptors; feedback inhibition of FSH and LH, then LH surge; stimulation of prolactin secretion, ↓ prolactin action on breasts." }
    status: unverified
