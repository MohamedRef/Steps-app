  # ---------- p655: sex chromosome disorders ----------
  - id: repro.L04.001
    kind: card
    topic: sex-chromosome-disorders
    front: What is the most common cause of sex chromosome aneuploidy?
    back: Meiotic nondisjunction.
    src: { page: 655, quote: "Aneuploidy most commonly due to meiotic nondisjunction." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.002
    kind: card
    topic: sex-chromosome-disorders
    front: What are the clinical features of Klinefelter syndrome (47,XXY)?
    back: Small, firm testes; infertility (azoospermia); tall stature with eunuchoid proportions (delayed epiphyseal closure → ↑ long bone length); gynecomastia; female hair distribution; may have developmental delay. ↑ risk of breast cancer.
    src: { page: 655, quote: "Small, firm testes; infertility (azoospermia); tall stature with eunuchoid proportions (delayed epiphyseal closure → ↑ long bone length); gynecomastia A ; female hair distribution. May present with developmental delay." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.003
    kind: card
    topic: sex-chromosome-disorders
    front: Why are FSH and LH both high in Klinefelter syndrome?
    back: Dysgenesis of the seminiferous tubules → ↓ inhibin B → ↑ FSH. Abnormal Leydig cell function → ↓ testosterone → ↑ LH.
    src: { page: 655, quote: "Dysgenesis of seminiferous tubules → ↓ inhibin B → ↑ FSH. Abnormal Leydig cell function → ↓ testosterone → ↑ LH." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.004
    kind: cloze
    topic: sex-chromosome-disorders
    text: "Klinefelter syndrome cells have a {{c1::Barr body}} (an inactivated X chromosome)."
    src: { page: 655, quote: "Presence of inactivated X chromosome (Barr body). Common cause of hypogonadism seen in infertility workup." }
    status: unverified
  - id: repro.L04.201
    kind: cloze
    topic: sex-chromosome-disorders
    text: "Klinefelter syndrome is a common cause of {{c1::hypogonadism}} seen in an infertility workup."
    src: { page: 655, quote: "Presence of inactivated X chromosome (Barr body). Common cause of hypogonadism seen in infertility workup." }
    status: unverified
  - id: repro.L04.202
    kind: cloze
    topic: sex-chromosome-disorders
    text: "Turner syndrome (45,XO) cells have {{c1::no Barr body}}."
    src: { page: 655, quote: "Most common cause of 1° amenorrhea. No Barr body." }
    status: unverified
  - id: repro.L04.005
    kind: enumerate
    topic: sex-chromosome-disorders
    prompt: Enumerate the features of Turner syndrome (45,XO).
    points:
      - Short stature (preventable with GH therapy)
      - Ovarian dysgenesis (streak ovary)
      - Broad chest with widely spaced nipples
      - Bicuspid aortic valve
      - Coarctation of the aorta (femoral < brachial pulse)
      - Lymphatic defects (webbed neck or cystic hygroma; lymphedema of feet and hands)
      - Horseshoe kidney
      - High-arched palate
      - Shortened 4th metacarpals
    pass: 7
    hook: "بنت Turner قصيرة ورقبتها عريضة: من فوق (رقبة وسقف حلق وصدر عريض)، للقلب (bicuspid و coarctation)، للبطن (horseshoe kidney و streak ovary)، لإيدها (4th metacarpal قصير ولمف ورم)."
    src: { page: 655, quote: "Short stature (preventable with GH therapy), ovarian dysgenesis (streak ovary), broad chest with widely spaced nipples, bicuspid aortic valve, coarctation of the aorta (femoral < brachial pulse), lymphatic defects (result in webbed neck or cystic hygroma; lymphedema in feet, hands), horseshoe kidney, high-arched palate, shortened 4th metacarpals." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.006
    kind: card
    topic: sex-chromosome-disorders
    front: What is the most common cause of 1° amenorrhea, and what are its hormone levels?
    back: Turner syndrome ("menopause before menarche"); ↓ estrogen leads to ↑ LH and FSH.
    src: { page: 655, quote: "Most common cause of 1° amenorrhea. No Barr body. B Menopause before menarche. ↓ estrogen leads to ↑ LH, FSH." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.007
    kind: card
    topic: sex-chromosome-disorders
    front: How do meiotic and mitotic errors cause Turner syndrome?
    back: Meiotic errors usually occur in paternal gametes (sperm missing the sex chromosome). Mitotic errors after zygote formation lose the sex chromosome in some cells → mosaic karyotype (45,X/46,XX).
    src: { page: 655, quote: "Meiosis errors usually occur in paternal gametes → sperm missing the sex chromosome. Mitosis errors occur after zygote formation → loss of sex chromosome in some but not all cells → mosaic karyotype (eg. 45,X/46,XX)." }
    status: unverified
  - id: repro.L04.008
    kind: card
    topic: sex-chromosome-disorders
    front: Which Turner mosaicism raises the risk of gonadoblastoma?
    back: 45,X/46,XY mosaicism.
    src: { page: 655, quote: "(45,X/46,XY) mosaicism associated with ↑ risk for gonadoblastoma. Pregnancy is possible in some cases (IVF, exogenous estradiol-17β and progesterone)." }
    status: unverified
  - id: repro.L04.203
    kind: card
    topic: sex-chromosome-disorders
    front: Can a patient with Turner syndrome become pregnant, and how?
    back: Sometimes, with IVF plus exogenous estradiol-17β and progesterone.
    src: { page: 655, quote: "(45,X/46,XY) mosaicism associated with ↑ risk for gonadoblastoma. Pregnancy is possible in some cases (IVF, exogenous estradiol-17β and progesterone)." }
    status: unverified
  - id: repro.L04.009
    kind: card
    topic: sex-chromosome-disorders
    front: What are the features of 47,XYY (double Y males)?
    back: Phenotypically normal (usually undiagnosed), very tall, normal fertility; may have severe acne, learning disability, autism spectrum disorders.
    src: { page: 655, quote: "Double Y males 47,XYY. Phenotypically normal (usually undiagnosed), very tall. Normal fertility. May be associated with severe acne, learning disability, autism spectrum disorders." }
    status: unverified
  - id: repro.L04.010
    kind: mcq
    topic: sex-chromosome-disorders
    stem: >-
      A 15-year-old girl is evaluated because she has not had a menstrual period. She is at the 2nd
      percentile for height and has a broad chest with widely spaced nipples. Blood pressure is higher
      in the arms than the legs, and femoral pulses are weak. Which hormone pattern is expected?
    options:
      - ↓ estrogen, ↑ LH, ↑ FSH
      - ↓ estrogen, ↓ LH, ↓ FSH
      - ↑ testosterone, ↑ LH
      - Normal estrogen, normal LH and FSH
      - ↑ prolactin, ↓ LH, ↓ FSH
    answer: 0
    why:
      - "Right. Turner syndrome (45,XO) has streak ovaries: ↓ estrogen removes feedback, so LH and FSH rise (menopause before menarche)."
      - "Low gonadotropins point to hypothalamic or pituitary failure, such as Kallmann syndrome."
      - "High testosterone with high LH fits androgen insensitivity in a genetic male."
      - "Müllerian agenesis has normal hormones, but these girls are of normal height."
      - "Hyperprolactinemia lowers GnRH pulses; it doesn't explain the coarctation or short stature."
    src: { page: 655, quote: "Most common cause of 1° amenorrhea. No Barr body. B Menopause before menarche. ↓ estrogen leads to ↑ LH, FSH." }
    status: unverified
  - id: repro.L04.011
    kind: mcq
    topic: sex-chromosome-disorders
    stem: >-
      A 32-year-old man is evaluated for infertility. He is 191 cm tall with long legs, sparse facial
      hair and bilateral gynecomastia. His testes are small and firm. Semen analysis shows azoospermia.
      Which finding explains his raised FSH?
    options:
      - Leydig cell hyperplasia producing estrogen
      - Seminiferous tubule dysgenesis lowering inhibin B
      - A pituitary adenoma secreting FSH
      - Exogenous testosterone use
      - Obstruction of the vas deferens
    answer: 1
    why:
      - "Leydig cell function is abnormal and low in Klinefelter, raising LH."
      - "Right. In Klinefelter syndrome (47,XXY), dysgenesis of the seminiferous tubules ↓ inhibin B → ↑ FSH."
      - "FSH rises from lost feedback, not from a tumor."
      - "Exogenous testosterone would lower FSH and LH."
      - "Vas obstruction gives azoospermia with normal FSH and normal testes."
    src: { page: 655, quote: "Dysgenesis of seminiferous tubules → ↓ inhibin B → ↑ FSH." }
    status: unverified
  # ---------- p655: other DSD ----------
  - id: repro.L04.012
    kind: card
    topic: other-dsd
    front: What defines a disorder of sex development (formerly intersex)?
    back: A discrepancy between phenotypic sex (external genitalia, influenced by hormones) and gonadal sex (testes vs ovaries, corresponding with the Y chromosome).
    src: { page: 655, quote: "Formerly called intersex states. Discrepancy between phenotypic sex (external genitalia, influenced by hormonal levels) and gonadal sex (testes vs ovaries, corresponds with Y chromosome)." }
    status: unverified
  - id: repro.L04.013
    kind: table
    topic: other-dsd
    title: Disorders of sex development
    columns: [Type, Gonads, Genitalia, Most common cause]
    rows:
      - ["46,XX DSD", Ovaries, Virilized or atypical, Congenital adrenal hyperplasia]
      - ["46,XY DSD", Testes, Feminized or atypical, Androgen insensitivity syndrome]
      - [Ovotesticular DSD, "Ovotestis (46,XX > 46,XY)", Atypical, ""]
    blanks: [[0, 1], [0, 3], [1, 1], [1, 3], [2, 1]]
    src: { page: 655, quote: "46,XX DSD Ovaries present, but external genitalia are virilized or atypical. Most commonly due to congenital adrenal hyperplasia (excessive exposure to androgens early in development)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.014
    kind: mcq
    topic: other-dsd
    stem: >-
      A newborn in the nursery has clitoromegaly and partially fused labioscrotal folds. No gonads are
      palpable. Karyotype is 46,XX, and ultrasound shows a uterus and ovaries. On day 7 she develops
      vomiting, hyponatremia and hyperkalemia. Which mechanism best explains her atypical external
      genitalia?
    options:
      - Defective androgen receptor
      - Excess fetal adrenal androgens early in development
      - Inability to convert testosterone into DHT
      - Gonads containing both ovarian and testicular tissue
      - Absent Müllerian-inhibiting substance
    answer: 1
    why:
      - "A defective androgen receptor is androgen insensitivity, a 46,XY DSD with testes."
      - "Right. 46,XX DSD (ovaries with virilized genitalia) is most commonly congenital adrenal hyperplasia, from excessive exposure to androgens early in development; salt wasting fits 21-hydroxylase deficiency."
      - "5α-reductase deficiency affects genetic males (46,XY)."
      - "Ovotesticular DSD has both tissues, but these are normal ovaries and it doesn't cause salt wasting."
      - "MIS is made by Sertoli cells in testes; its absence matters only in XY individuals."
    src: { page: 655, quote: "46,XX DSD Ovaries present, but external genitalia are virilized or atypical. Most commonly due to congenital adrenal hyperplasia (excessive exposure to androgens early in development)." }
    status: unverified
