    blanks: [[0, 2], [1, 2], [2, 2], [3, 2]]
    src: { page: 656, quote: "Testosterone LH Diagnosis ↑ ↑ Androgen insensitivity syndrome ↑ ↓ Testosterone-secreting tumor, exogenous androgenic steroids ↓ ↑ Hypergonadotropic (1°) hypogonadism ↓ ↓ Hypogonadotropic (2°) hypogonadism" }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.016
    kind: table
    topic: diagnosing-disorders
    title: Diagnosing disorders by uterus and breasts
    columns: [Uterus, Breasts, Diagnosis]
    rows:
      - [Present, Absent, "Hypergonadotropic (1°) or hypogonadotropic (2°) hypogonadism in a genotypic female"]
      - [Absent, Present, "Müllerian agenesis (genotypic female) or androgen insensitivity (genotypic male)"]
    blanks: [[0, 2], [1, 2]]
    src: { page: 656, quote: "Hypergonadotropic (1°) hypogonadism in genotypic female Hypogonadotropic (2°) hypogonadism in genotypic female ⊝ ⊕ Müllerian agenesis in genotypic female Androgen insensitivity syndrome in genotypic male" }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.017
    kind: mcq
    topic: diagnosing-disorders
    stem: >-
      A 17-year-old girl with primary amenorrhea has normal breast development. Pelvic ultrasound
      shows no uterus. Which test best distinguishes the two most likely diagnoses?
    options:
      - Serum FSH
      - Karyotype
      - Serum prolactin
      - MRI of the pituitary
      - Bone age x-ray
    answer: 1
    why:
      - "The book doesn't separate these two by FSH; it separates them by genotype."
      - "Right. No uterus with breasts is Müllerian agenesis in a genotypic female or androgen insensitivity in a genotypic male; the karyotype (and testosterone) separates them."
      - "Prolactin doesn't explain an absent uterus."
      - "The pituitary is not the problem when breasts have developed normally."
      - "Bone age doesn't separate these two."
    src: { page: 656, quote: "⊝ ⊕ Müllerian agenesis in genotypic female Androgen insensitivity syndrome in genotypic male" }
    status: unverified
  # ---------- p656: aromatase deficiency ----------
  - id: repro.L04.018
    kind: card
    topic: aromatase-deficiency
    front: In aromatase deficiency, why are both the female infant and her mother virilized?
    back: "No aromatase → the placenta can't turn fetal adrenal DHEA into estrogen → the DHEA ends up as testosterone in the tissues → the girl is born with atypical genitalia, and the androgens cross back to the mother → acne and hirsutism."
    src: { page: 656, quote: "Inability to synthesize endogenous estrogens. Autosomal recessive. During fetal life, DHEA produced by fetal adrenal glands cannot be converted to estrogen by the placenta and is converted to testosterone peripherally → virilization of both female infant (atypical genitalia) and mother (acne, hirsutism; fetal androgens can cross placenta)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.195
    kind: cloze
    topic: aromatase-deficiency
    text: "Aromatase deficiency is an {{c1::autosomal recessive}} inability to synthesize {{c2::endogenous estrogens}}."
    src: { page: 656, quote: "Inability to synthesize endogenous estrogens. Autosomal recessive." }
    status: unverified
  - id: repro.L04.019
    kind: mcq
    topic: aromatase-deficiency
    stem: >-
      A 28-year-old woman develops acne, deepening of her voice and new facial hair during the third
      trimester. She delivers at term in hospital a 46,XX infant with clitoromegaly and fused
      labioscrotal folds. The mother's symptoms resolve after delivery. The infant's
      17-hydroxyprogesterone is normal. Which mechanism explains the virilization of both mother and
      infant?
    options:
      - Diversion of fetal adrenal steroids to androgens by 21-hydroxylase deficiency
      - Fetal DHEA not converted to estrogen by the placenta, converted to testosterone that crosses the placenta
      - Defective androgen receptor in the fetus
      - Androgen secretion by a maternal ovarian Sertoli-Leydig cell tumor
      - Inability to convert testosterone into DHT
    answer: 1
    why:
      - "CAH virilizes the infant but not the mother, and 17-hydroxyprogesterone would be high."
      - "Right. In aromatase deficiency (autosomal recessive), fetal adrenal DHEA can't be made into estrogen by the placenta; it becomes testosterone peripherally and virilizes both baby and mother, since fetal androgens cross the placenta."
      - "Androgen insensitivity is 46,XY and gives female-appearing genitalia."
      - "A maternal tumor wouldn't resolve with delivery."
      - "5α-reductase deficiency affects genetic males only."
    src: { page: 656, quote: "During fetal life, DHEA produced by fetal adrenal glands cannot be converted to estrogen by the placenta and is converted to testosterone peripherally → virilization of both female infant (atypical genitalia) and mother (acne, hirsutism; fetal androgens can cross placenta)." }
    status: unverified
  # ---------- p656: androgen insensitivity ----------
  - id: repro.L04.020
    kind: card
    topic: androgen-insensitivity
    front: What is androgen insensitivity syndrome, and how does it look?
    back: "A 46,XY male whose androgen receptors don't work → the body reads as female outside (breasts, female vulva, short blind vagina, little pubic or axillary hair). Inside, the testes still make anti-Müllerian hormone → no uterus and no tubes."
    src: { page: 656, quote: "Defect in androgen receptor resulting in female-appearing genetic male (46,XY DSD); breast development and female external genitalia with scant axillary and pubic hair, rudimentary vagina; uterus and fallopian tubes absent due to persistence of anti-Müllerian hormone from testes." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.021
    kind: card
    topic: androgen-insensitivity
    front: In androgen insensitivity syndrome, what are the testes like and where are they often found?
    back: They work normally and often sit in the labia majora.
    src: { page: 656, quote: "Patients develop normal functioning testes (often found in labia majora; surgically removed to prevent malignancy). ↑ testosterone, estrogen, LH (vs sex chromosome disorders)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.204
    kind: card
    topic: androgen-insensitivity
    front: Why are the testes surgically removed in androgen insensitivity syndrome?
    back: To prevent malignancy.
    src: { page: 656, quote: "Patients develop normal functioning testes (often found in labia majora; surgically removed to prevent malignancy). ↑ testosterone, estrogen, LH (vs sex chromosome disorders)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.205
    kind: card
    topic: androgen-insensitivity
    front: What are the testosterone, estrogen and LH levels in androgen insensitivity syndrome?
    back: All three are ↑ (unlike sex chromosome disorders).
    src: { page: 656, quote: "Patients develop normal functioning testes (often found in labia majora; surgically removed to prevent malignancy). ↑ testosterone, estrogen, LH (vs sex chromosome disorders)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.022
    kind: mcq
    topic: androgen-insensitivity
    stem: >-
      A 16-year-old with primary amenorrhea has well-developed breasts but almost no pubic or axillary
      hair. The vagina is short and blind-ending. Bilateral firm masses are felt in the labia majora.
      Serum testosterone is in the adult male range and LH is high. Why is there no uterus?
    options:
      - Absent SRY gene
      - Anti-Müllerian hormone from the testes
      - Lack of DHT
      - Failure of Müllerian duct fusion
      - Lack of estrogen
    answer: 1
    why:
      - "SRY is present: testes formed."
      - "Right. Androgen insensitivity (46,XY): the testes still secrete anti-Müllerian hormone, so the Müllerian ducts regress; the receptor defect stops androgen action, so external genitalia are female."
      - "Lack of DHT action explains the female external genitalia, not the absent uterus."
      - "Failed fusion gives a didelphys or bicornuate uterus, not none."
      - "Estrogen is high (aromatized testosterone), which is why the breasts develop."
    src: { page: 656, quote: "uterus and fallopian tubes absent due to persistence of anti-Müllerian hormone from testes" }
    status: unverified
  # ---------- p656: 5α-reductase deficiency ----------
  - id: repro.L04.023
    kind: card
    topic: 5a-reductase-deficiency
    front: How is 5α-reductase deficiency inherited, and who does it affect?
    back: Autosomal recessive, limited to genetic males (46,XY DSD).
    src: { page: 656, quote: "Autosomal recessive; sex limited to genetic males (46,XY DSD). Inability to convert testosterone to DHT." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.206
    kind: card
    topic: 5a-reductase-deficiency
    front: What are the testosterone, estrogen and LH levels in 5α-reductase deficiency?
    back: Testosterone and estrogen are normal; LH is normal or ↑.
    src: { page: 656, quote: "Testosterone/estrogen levels are normal; LH is normal or ↑. Internal genitalia are normal." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.207
    kind: card
    topic: 5a-reductase-deficiency
    front: Are the internal genitalia normal in 5α-reductase deficiency, and why?
    back: Yes; they are built by testosterone, which is made normally. Only the DHT-dependent external genitalia are affected.
    src: { page: 656, quote: "Testosterone/estrogen levels are normal; LH is normal or ↑. Internal genitalia are normal." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.024
    kind: mcq
    topic: 5a-reductase-deficiency
    stem: >-
      A 46,XY child raised as a girl in a small, consanguineous community develops a deep voice,
      muscle growth and enlargement of the phallus at age 13. Testes are in the inguinal canals and
      internal male ducts are normal. Testosterone is normal for an adult male. Which ratio is
      abnormal?
    options:
      - Estrogen to testosterone, raised
      - Testosterone to DHT, raised
      - LH to FSH, raised
      - FSH to inhibin B, lowered
      - Testosterone to LH, raised
    answer: 1
    why:
      - "Estrogen is normal in 5α-reductase deficiency."
      - "Right. Testosterone can't become DHT, so testosterone is normal and DHT low; puberty's ↑ testosterone then masculinizes."
      - "LH:FSH is raised in PCOS."
      - "Sertoli function and inhibin B aren't the issue."
      - "LH is normal or high here, not suppressed."
    src: { page: 656, quote: "Atypical genitalia until puberty, when ↑ testosterone causes masculinization/↑ growth of external genitalia. Testosterone/estrogen levels are normal; LH is normal or ↑." }
    status: unverified
  # ---------- p656: Kallmann syndrome ----------
  - id: repro.L04.025
    kind: card
    topic: kallmann-syndrome
    front: What causes Kallmann syndrome, and what are its findings?
    back: "GnRH neurons fail to migrate and the olfactory bulbs don't form → the hypothalamus makes little GnRH (→ low FSH, LH and testosterone) and he can't smell well. Result: puberty never completes (hypogonadotropic hypogonadism) and infertility."
    src: { page: 656, quote: "Defective migration of neurons and subsequent failure of olfactory bulbs to develop → ↓ synthesis of GnRH in the hypothalamus; hyposmia/anosmia; ↓ GnRH, FSH, LH, testosterone." }
    status: unverified
    tags: [high-yield]
  - id: repro.L04.026
    kind: mcq
    topic: kallmann-syndrome
    stem: >-
      A 17-year-old boy has no pubertal development. He has never been able to smell smoke or food.
      Testes are 2 mL bilaterally. LH, FSH and testosterone are all low; karyotype is 46,XY. What is
      the underlying defect?
    options:
      - Seminiferous tubule dysgenesis with hyalinized tubules
      - Failed migration of GnRH neurons with olfactory bulb agenesis
      - Androgen receptor defect with end-organ androgen resistance
      - Prolactin-secreting pituitary adenoma suppressing GnRH
      - Leydig cell aplasia from an inactive LH receptor
    answer: 1
    why:
      - "Tubule dysgenesis (Klinefelter) gives high FSH."
      - "Right. Kallmann syndrome: neurons fail to migrate and the olfactory bulbs don't form → ↓ GnRH, ↓ LH/FSH/testosterone, with anosmia."
      - "Androgen receptor defects give high testosterone and LH."
      - "A prolactinoma wouldn't cause lifelong anosmia."
