  - id: repro.L02.013
    kind: mcq
    topic: female-reproductive-anatomy
    stem: >-
      A 46-year-old woman has a total abdominal hysterectomy for symptomatic fibroids. Two days later
      she has left flank pain and fever, and fluid leaks from the vaginal cuff. CT urography shows
      contrast extravasating from the distal left ureter. Ligation of the vessels in which ligament
      most likely caused this injury?
    options:
      - Infundibulopelvic ligament
      - Cardinal ligament
      - Round ligament
      - Utero-ovarian ligament
      - Uterosacral ligament
    answer: 1
    why:
      - "The infundibulopelvic ligament holds the ovarian vessels; tying them risks the ureter in an oophorectomy, but the hysterectomy step that risks it is the uterine vessels."
      - "Right. The cardinal ligament carries the uterine vessels; their ligation during hysterectomy risks the ureter (\"water under the bridge\")."
      - "The round ligament runs from uterine horn to labia majora through the inguinal canal and carries no major vessels in the table."
      - "The utero-ovarian ligament joins ovary to uterine horn and contains no listed vessels."
      - "The uterosacral ligament runs from cervix to sacrum and contains no listed vessels."
    src: { page: 643, quote: "Uterine vessels Condensation at the base of broad ligament Uterine vessel ligation during hysterectomy risks damaging the ureter" }
    status: unverified
  # ---------- p643: adnexal torsion ----------
  - id: repro.L02.014
    kind: order
    topic: adnexal-torsion
    prompt: Put the events of adnexal torsion in order.
    steps:
      - Ovary and fallopian tube twist around the infundibulopelvic and ovarian ligaments
      - Ovarian vessels in the infundibulopelvic ligament are compressed
      - Lymphatic and venous outflow is blocked while arterial perfusion continues
      - Ovarian edema
      - Complete blockage of arterial inflow
      - Necrosis and local hemorrhage
    src: { page: 643, quote: "Twisting of ovary and fallopian tube around infundibulopelvic ligament and ovarian ligament → compression of ovarian vessels in infundibulopelvic ligament → blockage of lymphatic and venous outflow. Continued arterial perfusion → ovarian edema → complete blockage of arterial inflow → necrosis, local hemorrhage." }
    status: unverified
    tags: [high-yield]
  - id: repro.L02.015
    kind: card
    topic: adnexal-torsion
    front: What is adnexal torsion associated with?
    back: Ovarian masses or cysts.
    src: { page: 643, quote: "Associated with ovarian masses/cysts. Presents with acute pelvic pain, adnexal mass, nausea/vomiting. Surgical emergency." }
    status: unverified
    tags: [high-yield]
