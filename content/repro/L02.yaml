  - id: repro.L02.016
    kind: mcq
    topic: adnexal-torsion
    stem: >-
      A 24-year-old woman has sudden, severe right lower abdominal pain that began while she was
      exercising, with repeated vomiting. She has a known 6-cm right ovarian cyst. Her pregnancy test
      is negative. Ultrasound shows an enlarged, edematous right ovary. Which structure is compressed
      first in the twisted pedicle, explaining the early ovarian swelling?
    options:
      - Ovarian vessels in the infundibulopelvic ligament
      - The uterine vessels in the cardinal ligament
      - The round ligament as it enters the deep inguinal ring
      - The ureter at the pelvic brim
      - The ovarian artery only, sparing the veins
    answer: 0
    why:
      - "Right. Twisting compresses the ovarian vessels in the infundibulopelvic ligament; venous and lymphatic outflow block first while arterial inflow continues, so the ovary swells before it infarcts."
      - "The uterine vessels lie in the cardinal ligament at the cervix, not in the adnexal pedicle."
      - "The round ligament carries no ovarian blood supply."
      - "The ureter is at risk in surgery near these vessels, but it isn't what twists in torsion."
      - "Low-pressure veins and lymphatics block first; arterial inflow is lost last, which is why edema comes before necrosis."
    src: { page: 643, quote: "compression of ovarian vessels in infundibulopelvic ligament → blockage of lymphatic and venous outflow. Continued arterial perfusion → ovarian edema" }
    status: unverified
