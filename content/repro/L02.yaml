  - id: repro.L02.027
    kind: mcq
    topic: male-reproductive-anatomy
    stem: >-
      A 34-year-old man has a vasectomy. Six months later his semen analysis shows no sperm, while
      semen volume is nearly unchanged. The cut structure lies between which two parts of the
      sperm pathway?
    options:
      - Seminiferous tubules and epididymis
      - Epididymis and ejaculatory ducts
      - Ejaculatory ducts and urethra
      - Rete testis and efferent ductules
      - Urethra and penis
    answer: 1
    why:
      - "Sperm pass from the seminiferous tubules to the epididymis inside the scrotum, before the vas."
      - "Right. In SEVEN UP the vas deferens runs from the epididymis to the ejaculatory ducts; cutting it stops sperm, while seminal vesicle and prostate fluid keep the volume."
      - "The vas has already joined the ejaculatory duct at that point."
      - "Rete testis and efferent ductules are inside the testis, before the epididymis."
      - "The urethra runs through the penis, far past the vas."
    src: { page: 644, quote: "Seminiferous tubules Epididymis Vas deferens Ejaculatory ducts (Nothing) Urethra Penis" }
    status: unverified
