  - id: repro.L02.020
    kind: mcq
    topic: pelvic-organ-prolapse
    stem: >-
      A 64-year-old woman who has had five vaginal deliveries reports a feeling of pelvic pressure and
      a bulge at the vaginal opening for 6 months, with urinary frequency. On examination, the anterior
      vaginal wall bulges outward when she strains; the cervix stays in place and the posterior wall is
      normal. Which organ is herniating?
    options:
      - Rectum
      - Small bowel
      - Uterus
      - Bladder
      - Vaginal vault
    answer: 3
    why:
      - "Rectum through the posterior wall is a rectocele; her posterior wall is normal."
      - "Small bowel herniates through the posterior compartment as an enterocele."
      - "The uterus prolapses through the apical compartment; her cervix stays in place."
      - "Right. Anterior compartment prolapse is the bladder (cystocele), the most common type, which fits her urinary frequency."
      - "Vaginal vault prolapse is apical, usually after hysterectomy."
    src: { page: 643, quote: "Anterior compartment prolapse—bladder (cystocele). Most common type." }
    status: unverified
