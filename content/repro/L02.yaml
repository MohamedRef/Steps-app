    front: What does a persistent patent processus vaginalis cause?
    back: A hydrocele.
    src: { page: 642, quote: "Persistent patent processus vaginalis → hydrocele" }
    status: unverified
    tags: [high-yield]
  - id: repro.L02.003
    kind: mcq
    topic: descent-of-testes-and-ovaries
    stem: >-
      A 3-month-old boy has a painless swelling of the right scrotum that has been present since birth.
      It is soft, does not reduce, and transilluminates; the testis is palpable within it and the
      swelling is not tender. Failure of which embryologic event explains the finding?
    options:
      - Descent of the testis guided by the gubernaculum
      - Obliteration of the processus vaginalis
      - Fusion of the labioscrotal swellings
      - Obliteration of the urachus
      - Regression of the paramesonephric duct
    answer: 1
    why:
      - "Failed descent gives an undescended testis; here the testis is in the scrotum."
      - "Right. A persistent patent processus vaginalis lets peritoneal fluid collect around the testis: a hydrocele."
      - "Labioscrotal swellings form the scrotum; failed fusion doesn't make a fluid sac."
      - "A patent urachus drains urine at the umbilicus."
      - "The paramesonephric duct leaves the appendix testis, not a fluid collection."
    src: { page: 642, quote: "Persistent patent processus vaginalis → hydrocele" }
    status: unverified
  # ---------- p642: drainage ----------
  - id: repro.L02.004
    kind: card
    topic: drainage-of-reproductive-organs
    front: Where do the right and left gonadal veins drain?
    back: Right ovary/testis → right gonadal vein → IVC. Left ovary/testis → left gonadal vein → left renal vein → IVC (the longer way).
    src: { page: 642, quote: "Right ovary/testis → right gonadal vein → IVC. Left ovary/testis → left gonadal vein → left renal vein → IVC (takes the longer way)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L02.005
    kind: order
    topic: drainage-of-reproductive-organs
    prompt: Put the chain that makes varicocele more common on the left in order.
    steps:
      - The left testicular vein enters the left renal vein at a 90° angle
      - Flow is less laminar on the left than on the right
      - Left venous pressure exceeds right venous pressure
      - Varicocele is more common on the left
    src: { page: 642, quote: "Left testicular vein enters left renal vein at 90° angle → flow is less laminar on the left than on the right → left venous pressure > right venous pressure → varicocele is more common on the left." }
    status: unverified
    tags: [high-yield]
