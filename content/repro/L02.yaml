  - id: repro.L02.008
    kind: mcq
    topic: drainage-of-reproductive-organs
    stem: >-
      A 28-year-old man has a painless, firm mass in the left testis. Ultrasound shows a solid
      intratesticular lesion and serum AFP and β-hCG are raised. Before surgery, CT is done to look
      for nodal spread. Which lymph node group is the first site of spread from this tumor?
    options:
      - Superficial inguinal
      - Deep inguinal
      - Internal iliac
      - External iliac
      - Para-aortic
    answer: 4
    why:
      - "Superficial inguinal nodes drain the scrotum, distal vagina, vulva and distal anal canal, not the testis."
      - "Deep inguinal nodes drain the glans penis and glans clitoris."
      - "Internal iliac nodes drain the prostate, corpus cavernosum, cervix and inferior bladder."
      - "External iliac nodes drain the superior bladder and the uterine body and cervix."
      - "Right. The testes descend from the abdomen and keep their para-aortic lymphatics."
    src: { page: 642, quote: "PARA-AORTIC Ovaries, fallopian tubes, uterine fundus Testes" }
    status: unverified
