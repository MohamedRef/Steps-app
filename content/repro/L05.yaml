  - id: repro.L05.024
    kind: mcq
    topic: tocolytics
    stem: >-
      A 29-year-old woman, gravida 2, para 1, at 30 weeks of gestation comes to the labor and
      delivery unit with regular painful contractions every 5 minutes. Cervical examination shows
      dilation from 1 cm to 3 cm over 2 hours, and membranes are intact. She is given a drug to relax
      the uterus. What is the main goal of this therapy?
    options:
      - To carry the pregnancy to term
      - To allow time for glucocorticoids or transfer to an obstetric center
      - To prevent neonatal infection
      - To treat preeclampsia
      - To speed cervical ripening
    answer: 1
    why:
      - "Tocolytics only ↓ contraction frequency for a while."
      - "Right. Tocolytics (terbutaline, indomethacin, nifedipine) buy time for glucocorticoids (fetal lung maturity) or transfer to an obstetric center."
      - "That needs antibiotics, not tocolytics."
      - "Nifedipine treats hypertension, but that isn't the goal here."
      - "Tocolytics do the opposite."
    src: { page: 675, quote: "Used to ↓ contraction frequency in preterm labor and allow time for administration of glucocorticoids (to promote fetal lung maturity) or transfer to appropriate medical center with obstetrical care." }
    status: unverified
  # ---------- p675: danazol ----------
  - id: repro.L05.025
    kind: card
    topic: danazol
    front: What is danazol, what is it used for, and what are its adverse effects?
    back: A synthetic androgen, partial agonist at androgen receptors. Used for endometriosis and hereditary angioedema. Adverse effects are weight gain, edema, acne, hirsutism, masculinization, ↓ HDL, hepatotoxicity and idiopathic intracranial hypertension.
    src: { page: 675, quote: "Synthetic androgen that acts as partial agonist at androgen receptors. CLINICAL USE Endometriosis, hereditary angioedema." }
    status: unverified
  # ---------- p675: testosterone ----------
  - id: repro.L05.026
    kind: card
    topic: testosterone
    front: What are the uses and adverse effects of testosterone and methyltestosterone?
    back: Used for hypogonadism and to promote 2° sex characteristics. Adverse effects are virilization in females, testicular atrophy in males, premature epiphyseal closure, acne, ↑ erythrocytosis, ↑ LDL and ↓ HDL.
    src: { page: 675, quote: "Virilization in females; testicular atrophy in males. Premature closure of epiphyseal plates. Risk of acne, ↑ erythrocytosis, ↑ LDL, ↓ HDL." }
    status: unverified
  # ---------- p676: anabolic steroids ----------
  - id: repro.L05.040
    kind: card
    topic: anabolic-steroids
    front: How do anabolic steroids build muscle through the androgen receptor?
    back: These synthetic testosterone derivatives bind the androgen receptor in muscle → ↑ protein synthesis, erythropoiesis and muscle mass.
    src: { page: 676, quote: "Exogenous synthetic testosterone derivatives bind androgen receptor in muscle → ↑ protein synthesis, erythropoiesis, muscle mass" }
    status: unverified
  - id: repro.L05.041
    kind: card
    topic: anabolic-steroids
    front: How do anabolic steroids limit muscle breakdown?
    back: By binding glucocorticoid receptors, which inhibits muscle breakdown.
    src: { page: 676, quote: "binding of glucocorticoid receptors inhibits muscle breakdown." }
    status: unverified
  - id: repro.L05.027
    kind: card
    topic: anabolic-steroids
    front: Why do anabolic steroids cause small testes and infertility?
    back: Negative feedback → ↓ GnRH → ↓ LH and FSH → ↓ intratesticular testosterone and spermatogenesis → azoospermia. Recovery is slow after stopping.
    src: { page: 676, quote: "Chronic use → ↓ GnRH → ↓ LH/FSH → ↓ intratesticular T → azoospermia, infertility. Recovery slow post-discontinuation." }
    status: unverified
    tags: [high-yield]
