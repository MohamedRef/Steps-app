      - Megestrol
    pass: 4
    src: { page: 674, quote: "Progestins Levonorgestrel, medroxyprogesterone, etonogestrel, norethindrone, megestrol." }
    status: unverified
  - id: repro.L05.016
    kind: card
    topic: progestins
    front: How do progestins act on the endometrium and cervix, and what are they used for?
    back: They bind progesterone receptors, ↓ growth and ↑ vascularization of the endometrium, and thicken cervical mucus. Used for contraception (pill, IUD, implant, depot), endometrial cancer and abnormal uterine bleeding.
    src: { page: 674, quote: "Bind progesterone receptors, ↓ growth and ↑ vascularization of endometrium, thicken cervical mucus." }
    status: unverified
  - id: repro.L05.017
    kind: card
    topic: progestins
    front: What does withdrawal bleeding after a progestin challenge exclude?
    back: Anatomic defects (eg, Asherman syndrome) and chronic anovulation without estrogen.
    src: { page: 674, quote: "Progestin challenge: presence of bleeding upon withdrawal of progestins excludes anatomic defects (eg, Asherman syndrome) and chronic anovulation without estrogen." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.018
    kind: cloze
    topic: progestins
    text: "Compared with combined pills, progestins are safe in {{c1::breastfeeding}} and preferred if estrogen is contraindicated ({{c2::DVT, migraine with aura, smoker >35}})."
    src: { page: 674, quote: "As compared to combined oral contraceptives, progestins are safe in breastfeeding; preferred if estrogen contraindcated (DVT, migraine with aura, smoker >35 years old)." }
    status: unverified
  # ---------- p675: antiprogestins ----------
  - id: repro.L05.019
    kind: card
    topic: antiprogestins
    front: What are mifepristone and ulipristal, and what is each used for?
    back: Competitive inhibitors at progesterone receptors. Mifepristone (with misoprostol) terminates pregnancy; ulipristal is emergency contraception.
    src: { page: 675, quote: "Competitive inhibitors of progestins at progesterone receptors. CLINICAL USE Termination of pregnancy (mifepristone with misoprostol); emergency contraception (ulipristal)." }
    status: unverified
    tags: [high-yield]
  # ---------- p675: contraception ----------
  - id: repro.L05.020
    kind: card
    topic: contraception
    front: How do hormonal contraceptives prevent ovulation, and what else do progestins do?
    back: ↓ GnRH → ↓ LH and FSH → no estrogen surge → no LH surge. Progestins also thicken cervical mucus (↓ sperm entry) and thin the endometrium (less suitable for implantation).
    src: { page: 675, quote: "Prevent ovulation by ↓ GnRH → ↓ LH/FSH → no estrogen surge → no LH surge" }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.021
    kind: table
    topic: contraception
    title: Contraception methods
    columns: [Method, Mechanism, Note]
    rows:
      - ["Hormonal (estrogen + progestin, or progestin only)", "↓ GnRH → ↓ LH/FSH → no estrogen surge → no LH surge (prevents ovulation)", "Forms include pill (OCPs), transdermal patch, vaginal ring"]
      - [Copper IUD, "Local inflammation toxic to sperm and ova, preventing fertilization and implantation", "Hormone free; ↑ abnormal uterine bleeding; not with active STI or heavy bleeding"]
      - [Progesterone IUD, Same as progestins, "IUDs ↑ abnormal uterine bleeding; not with active STI or heavy bleeding"]
      - [Vasectomy, No sperm in ejaculate, Irreversible]
      - [Tubal ligation, Sperm cannot reach ova, Irreversible]
    blanks: [[0, 2], [1, 1], [1, 2], [2, 1], [3, 1], [4, 1]]
    src: { page: 675, quote: "Copper IUD causes local inflammation that is toxic to sperm and ova preventing fertilization and implantation" }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.022
    kind: mcq
    topic: contraception
    stem: >-
      A 30-year-old woman with a history of deep venous thrombosis wants long-term, hormone-free
      contraception. She has regular, light periods and no current infection. Which method fits, and
      how does it work?
    options:
      - Combined pill; ↓ GnRH
      - Copper IUD; local inflammation toxic to sperm and ova
      - Vaginal ring; prevents the LH surge
      - Ulipristal; blocks progesterone receptors
      - Clomiphene; blocks hypothalamic estrogen receptors
    answer: 1
    why:
      - "The combined pill contains estrogen, contraindicated after DVT, and isn't hormone free."
      - "Right. The copper IUD is hormone free; its local inflammation is toxic to sperm and ova. It is avoided with active STI or heavy menstrual bleeding."
      - "The ring contains estrogen."
      - "Ulipristal is emergency contraception, not long term."
      - "Clomiphene induces ovulation."
    src: { page: 675, quote: "insertion contraindicated in patients with active STI and heavy menstrual bleeding" }
    status: unverified
