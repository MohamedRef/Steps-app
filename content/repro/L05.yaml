  # ---------- p673: GnRH analogs ----------
  - id: repro.L05.002
    kind: card
    topic: gnrh-analogs
    front: How do GnRH analogs (leuprolide, goserelin) act when given in pulses versus continuously?
    back: Pulsatile, they are GnRH agonists (used for infertility). Continuous, they first act as agonists (tumor flare), then downregulate pituitary GnRH receptors → ↓ FSH and LH → ↓ estrogen or testosterone.
    src: { page: 673, quote: "When used in continuous fashion, first transiently act as GnRH agonists (tumor flare), but subsequently act as GnRH antagonists (downregulate GnRH receptor in pituitary → ↓ FSH and ↓ LH → ↓ estrogen in females and ↓ testosterone in males)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.038
    kind: enumerate
    topic: gnrh-analogs
    prompt: Enumerate the GnRH analogs (4).
    points:
      - Leuprolide
      - Goserelin
      - Nafarelin
      - Histrelin
    pass: 3
    src: { page: 673, quote: "GnRH analogs Leuprolide, goserelin, nafarelin, histrelin." }
    status: unverified
  - id: repro.L05.003
    kind: enumerate
    topic: gnrh-analogs
    prompt: Enumerate the clinical uses of GnRH analogs.
    points:
      - Uterine fibroids
      - Endometriosis
      - Precocious puberty
      - Prostate cancer
      - Infertility (pulsatile)
    pass: 4
    hook: "كل حاجة عايز تطفي فيها الـ sex hormones (fibroids و endometriosis و بلوغ بدري و prostate cancer) تديه مستمر. والحالة الوحيدة اللي عايز تشغّلها فيها (infertility) تديه pulses."
    src: { page: 673, quote: "Uterine fibroids, endometriosis, precocious puberty, prostate cancer, infertility. Pulsatile for pregnancy, continuous for cancer." }
    status: unverified
  - id: repro.L05.004
    kind: cloze
    topic: gnrh-analogs
    text: "GnRH analogs: {{c1::pulsatile}} for pregnancy, {{c2::continuous}} for cancer. Adverse effects: hypogonadism, ↓ libido, erectile dysfunction, nausea, vomiting."
    src: { page: 673, quote: "Pulsatile for pregnancy, continuous for cancer. ADVERSE EFFECTS Hypogonadism, ↓ libido, erectile dysfunction, nausea, vomiting." }
    status: unverified
  - id: repro.L05.005
    kind: mcq
    topic: gnrh-analogs
    stem: >-
      A 70-year-old man with metastatic prostate cancer to the spine starts leuprolide. Ten days
      later he has worse back pain and new leg weakness. Which explains this?
    options:
      - Leuprolide causes hepatotoxicity
      - Transient agonist effect ↑ LH and testosterone at the start
      - Leuprolide blocks the androgen receptor too weakly
      - Leuprolide stimulates prolactin release
      - Downregulation of GnRH receptors ↑ estrogen
    answer: 1
    why:
      - "Liver toxicity doesn't explain bone pain."
      - "Right. Continuous GnRH analogs first act as agonists (tumor flare), raising testosterone before receptors downregulate; an antiandrogen or degarelix avoids this."
      - "Leuprolide doesn't act at the receptor at all."
      - "Prolactin isn't involved."
      - "Downregulation lowers sex hormones."
    src: { page: 673, quote: "first transiently act as GnRH agonists (tumor flare)" }
    status: unverified
  # ---------- p674: degarelix ----------
  - id: repro.L05.006
    kind: card
    topic: degarelix
    front: How does degarelix differ from leuprolide, and what are its adverse effects?
    back: Degarelix is a GnRH antagonist with no start-up flare, used for prostate cancer. Adverse effects are hot flashes and liver toxicity.
    src: { page: 674, quote: "MECHANISM GnRH antagonist. No start-up flare. CLINICAL USE Prostate cancer. ADVERSE EFFECTS Hot flashes, liver toxicity." }
    status: unverified
    tags: [high-yield]
  # ---------- p674: ethinyl estradiol ----------
  - id: repro.L05.007
    kind: card
    topic: ethinyl-estradiol
    front: What are the uses of ethinyl estradiol?
    back: Hypogonadism or ovarian failure, contraception (with progestins), and HRT in postmenopausal females (used <5 years to lower adverse effects).
    src: { page: 674, quote: "Hypogonadism or ovarian failure, contraception (combined with progestins), HRT in postmenopausal females (use for <5 years to lower risk of adverse effects)." }
    status: unverified
  - id: repro.L05.008
    kind: card
    topic: ethinyl-estradiol
    front: What are the adverse effects of ethinyl estradiol?
    back: ↑ endometrial cancer (when given without progesterone), postmenopausal bleeding, hepatic adenoma, breast tenderness, ↑ thrombi.
    src: { page: 674, quote: "↑ risk of endometrial cancer (when given without progesterone), bleeding in postmenopausal patients, hepatic adenoma, breast tenderness, ↑ risk of thrombi." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.009
    kind: enumerate
    topic: ethinyl-estradiol
    prompt: Enumerate the contraindications to estrogen (ethinyl estradiol).
    points:
      - Age >35 years with tobacco smoking
      - ↑ cardiovascular risk (history of VTE, coronary artery disease, stroke)
      - Migraine (especially with aura)
      - Breast cancer
      - Liver disease
    pass: 4
    hook: "الـ estrogen بيجلّط وبيأكّل الكبد وبيغذّي سرطان الصدر: يبقى ممنوع للي عندها جلطات أو قلب أو migraine بـ aura، والمدخنة فوق 35، وسرطان الصدر، والكبد."
    src: { page: 674, quote: "Contraindications—people >35 years old who smoke tobacco (↑ risk of cardiovascular events), patients with ↑ risk of cardiovascular disease (including history of venous thromboembolism, coronary artery disease, stroke), migraine (especially with aura), breast cancer, liver disease." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.010
    kind: mcq
    topic: ethinyl-estradiol
    stem: >-
      A 38-year-old woman who smokes a pack a day and has migraine with visual aura asks for oral
      contraception. Which is the most appropriate choice?
    options:
      - Combined ethinyl estradiol and progestin pill
      - Progestin-only method
      - Ethinyl estradiol alone
      - Combined vaginal ring
      - Combined transdermal patch
    answer: 1
    why:
      - "Estrogen is contraindicated in smokers >35 and in migraine with aura."
      - "Right. Progestins are preferred when estrogen is contraindicated (DVT, migraine with aura, smoker >35)."
      - "Unopposed estrogen is also contraindicated, and ↑ endometrial cancer."
      - "The ring still contains estrogen."
      - "The patch still contains estrogen."
    src: { page: 674, quote: "preferred if estrogen contraindcated (DVT, migraine with aura, smoker >35 years old)." }
    status: unverified
  # ---------- p674: SERMs ----------
  - id: repro.L05.011
    kind: table
    topic: serms
    title: Selective estrogen receptor modulators
    columns: [Drug, Action, Use, Key risk]
    rows:
      - [Clomiphene, Antagonist at hypothalamus → ↑ LH and FSH, Anovulatory infertility (PCOS), "Multiple pregnancies, ovarian enlargement, visual disturbances"]
      - [Tamoxifen, "Antagonist at breast; partial agonist at uterus, bone", ER/PR ⊕ breast cancer; prevent gynecomastia, "Thromboembolism, endometrial hyperplasia or cancer"]
      - [Raloxifene, "Antagonist at breast, uterus; agonist at bone", Postmenopausal osteoporosis, "Thromboembolism, but no ↑ endometrial cancer"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 3], [2, 1], [2, 2]]
    src: { page: 674, quote: "Antagonist at breast, uterus; agonist at bone; hot flashes, ↑ risk of thromboembolic events (especially with tobacco smoking), but no increased risk of endometrial cancer (vs tamoxifen, so you can “relax”); used primarily to treat postmenopausal osteoporosis." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.042
    kind: card
    topic: serms
    front: What is the book's memory aid for raloxifene and the endometrium?
    back: Raloxifene has no increased risk of endometrial cancer (vs tamoxifen), so you can "relax".
    src: { page: 674, quote: "but no increased risk of endometrial cancer (vs tamoxifen, so you can “relax”)" }
    status: unverified
  - id: repro.L05.012
    kind: card
    topic: serms
    front: How does clomiphene induce ovulation?
    back: It antagonizes estrogen receptors in the hypothalamus, preventing normal feedback inhibition, so LH and FSH release ↑ and ovulation is stimulated.
    src: { page: 674, quote: "Antagonist at estrogen receptors in hypothalamus. Prevents normal feedback inhibition and ↑ release of LH and FSH from pituitary, which stimulates ovulation." }
    status: unverified
    tags: [high-yield]
  - id: repro.L05.013
    kind: mcq
    topic: serms
    stem: >-
      A 55-year-old woman has taken a drug for 4 years after surgery for an ER-positive breast cancer.
      She now has postmenopausal vaginal bleeding, and the endometrial stripe is thickened. Which
      property of her drug explains this?
    options:
      - Antagonist at the hypothalamic estrogen receptor
      - Partial agonist at the uterine estrogen receptor
      - Inhibition of aromatase in fat
      - Antagonist at the uterine estrogen receptor
      - Agonist at progesterone receptors
    answer: 1
    why:
      - "That is clomiphene."
      - "Right. Tamoxifen is an antagonist at breast but a partial agonist at uterus and bone, so it ↑ endometrial hyperplasia and cancer."
      - "Aromatase inhibitors lower estrogen, so they don't stimulate the endometrium."
      - "That is raloxifene, which doesn't ↑ endometrial cancer."
      - "Progestins protect the endometrium."
    src: { page: 674, quote: "Antagonist at breast, partial agonist at uterus, bone. Hot flashes, ↑ risk of thromboembolic events (especially with tobacco smoking), and endometrial hyperplasia and/or cancer." }
    status: unverified
  - id: repro.L05.014
    kind: mcq
    topic: serms
    stem: >-
      A 28-year-old woman with irregular periods, hirsutism and polycystic ovaries wants to conceive.
      She is started on a drug that blocks estrogen feedback at the hypothalamus. Which adverse
      effect should she be warned about?
    options:
      - Osteoporosis
      - Multiple simultaneous pregnancies
      - Hypokalemia
      - Gynecomastia
      - Hepatic adenoma
    answer: 1
    why:
      - "Bone loss isn't a clomiphene effect."
      - "Right. Clomiphene ↑ LH and FSH, stimulating ovulation; it may cause hot flashes, ovarian enlargement, multiple pregnancies and visual disturbances."
      - "Hypokalemia is abiraterone."
      - "Not in a woman on clomiphene."
      - "That is estrogen."
    src: { page: 674, quote: "Used to treat infertility due to anovulation (eg, PCOS). May cause hot flashes, ovarian enlargement, multiple simultaneous pregnancies, visual disturbances." }
    status: unverified
  # ---------- p674: aromatase inhibitors ----------
  - id: repro.L05.015
    kind: card
    topic: aromatase-inhibitors
    front: How do anastrozole, letrozole and exemestane work, and what are they used for?
    back: They inhibit peripheral conversion of androgens to estrogen. Used for ER ⊕ breast cancer in postmenopausal females; letrozole can also treat anovulatory infertility (PCOS).
    src: { page: 674, quote: "Inhibit peripheral conversion of androgens to estrogen. CLINICAL USE ER ⊕ breast cancer in postmenopausal females. Letrozole can be used to treat infertility from anovulation (eg, PCOS)." }
    status: unverified
    tags: [high-yield]
