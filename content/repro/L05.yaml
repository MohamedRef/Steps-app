    status: unverified
  - id: repro.L05.030
    kind: mcq
    topic: anabolic-steroids
    stem: >-
      A 26-year-old competitive bodybuilder is evaluated for 1 year of infertility. He is very
      muscular, with acne, small testes and tender breast tissue. Hematocrit is 55%. Which hormone
      pattern is expected?
    options:
      - ↑ LH, ↑ FSH, ↓ intratesticular testosterone
      - ↓ LH, ↓ FSH, ↓ intratesticular testosterone
      - ↑ LH, normal FSH, ↑ testosterone
      - Normal LH and FSH, ↓ DHT
      - ↓ LH, ↑ FSH, ↓ inhibin
    answer: 1
