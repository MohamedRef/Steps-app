  - id: repro.L01.015
    kind: card
    topic: embryologic-derivatives
    front: What is the only postnatal derivative of the notochord?
    back: The nucleus pulposus of the intervertebral disc.
    src: { page: 631, quote: "its only postnatal derivative is the nucleus pulposus of the intervertebral disc." }
