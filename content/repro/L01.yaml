  - id: repro.L01.032
    kind: card
    topic: teratogens
    front: Which fish carry high methylmercury, and what does it do to the fetus?
    back: Top-predator fish (shark, swordfish, king mackerel, tilefish); it causes neurotoxicity.
    src: { page: 632, quote: "Methylmercury Neurotoxicity. ↑ concentration in top-predator fish (eg, shark, swordfish, king mackerel, tilefish)." }
    status: unverified
  - id: repro.L01.033
    kind: mcq
    topic: teratogens
    stem: >-
      A newborn boy is examined after an uncomplicated vaginal delivery. Echocardiography shows
      apical displacement of the tricuspid valve leaflets with an atrialized right ventricle. His
      mother has a chronic psychiatric illness that was treated throughout pregnancy with one
      medication, whose serum level was checked regularly. Which medication was she most likely taking?
    options:
      - Valproate
      - Lithium
      - Isotretinoin
      - Carbamazepine
      - Methimazole
    answer: 1
    why:
      - "Valproate, like other antiepileptics, mainly causes neural tube defects, cleft palate and skeletal abnormalities."
      - "Right. Lithium is the teratogen of Ebstein anomaly (displaced tricuspid valve); it is monitored by serum levels."
      - "Isotretinoin causes craniofacial, CNS, cardiac and thymic defects and is an acne drug, not a chronic psychiatric one."
      - "Carbamazepine is linked with neural tube defects among the antiepileptic drug effects."
      - "Methimazole causes aplasia cutis congenita, a scalp skin defect."
    src: { page: 632, quote: "Lithium Ebstein anomaly." }
    status: unverified
  # ---------- p633: errors in morphogenesis ----------
  - id: repro.L01.034
    kind: table
    topic: errors-in-morphogenesis
    title: Types of errors in morphogenesis
    columns: [Type, Definition, Example]
    rows:
      - [Agenesis, Absent organ due to absent primordial tissue, ""]
      - [Aplasia, Absent organ despite presence of primordial tissue, ""]
      - [Hypoplasia, Incomplete organ development; primordial tissue present, ""]
      - [Disruption, 2° breakdown of tissue with normal developmental potential, Amniotic band syndrome]
      - [Deformation, Extrinsic mechanical distortion (fetal period), Congenital torticollis]
