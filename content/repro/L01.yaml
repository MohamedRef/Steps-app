items:
  # ---------- p630: early embryonic development ----------
  - id: repro.L01.001
    kind: card
    topic: early-embryonic-development
    front: When does hCG secretion begin?
    back: Around the time the blastocyst implants (week 1).
    src: { page: 630, quote: "Week 1 hCG secretion begins around the time of blastocyst implantation. Blastocyst “sticks” on day six." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.124
    kind: card
    topic: early-embryonic-development
    front: On which day does the blastocyst implant ("stick")?
    back: Day 6 (week 1).
    src: { page: 630, quote: "Week 1 hCG secretion begins around the time of blastocyst implantation. Blastocyst “sticks” on day six." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.002
    kind: cloze
    topic: early-embryonic-development
    text: "Week 2 forms the {{c1::bilaminar}} embryonic disc, whose two layers are the {{c2::epiblast}} and the {{c3::hypoblast}}."
    src: { page: 630, quote: "Week 2 Formation of bilaminar embryonic disc; two layers = epiblast, hypoblast." }
    status: unverified
  - id: repro.L01.003
    kind: card
    topic: early-embryonic-development
    front: What happens in week 3 of development, and how?
    back: "Gastrulation forms the trilaminar embryonic disc: epiblast cells invaginate through the primitive streak, giving endoderm, mesoderm and ectoderm."
    src: { page: 630, quote: "Week 3 Formation of trilaminar embryonic disc via gastrulation (epiblast cell invagination through primitive streak); three layers = endoderm, mesoderm, ectoderm." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.004
    kind: cloze
    topic: early-embryonic-development
    text: "The notochord arises from midline {{c1::mesoderm}} and induces the overlying ectoderm via {{c2::SHH}} to become the {{c3::neural plate}}, which forms the neural tube by neurulation."
    src: { page: 630, quote: "Notochord arises from midline mesoderm and induces overlying ectoderm (via SHH) to become neural plate, which gives rise to neural tube via neurulation." }
    status: unverified
  - id: repro.L01.005
    kind: card
    topic: early-embryonic-development
    front: What happens in week 4 of development (the "fours")?
    back: The heart begins to beat (four chambers), with cardiac activity visible by transvaginal ultrasound, and the upper and lower limb buds begin to form (four limbs).
    src: { page: 630, quote: "Week 4 Heart begins to beat (four chambers). Cardiac activity visible by transvaginal ultrasound. Upper and lower limb buds begin to form (four limbs)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.006
    kind: card
    topic: early-embryonic-development
    front: By which week do the genitalia have male or female characteristics?
    back: Week 8 (pronounce "geneightalia").
    src: { page: 630, quote: "Week 8 Genitalia have male/female characteristics (pronounce “geneightalia”)." }
    status: unverified
  - id: repro.L01.007
    kind: mcq
    topic: early-embryonic-development
    stem: >-
      A 27-year-old woman whose last menstrual period was 6 weeks ago has a transvaginal ultrasound.
      An intrauterine gestational sac with an embryo is seen, and cardiac activity is visible. The
      embryo is about 4 weeks after fertilization. Which other developmental event begins at this
      same week?
    options:
      - Formation of the bilaminar disc
      - Formation of upper and lower limb buds
      - Gastrulation through the primitive streak
      - Male or female characteristics of the external genitalia
      - Implantation of the blastocyst
    answer: 1
    why:
      - "The bilaminar disc (epiblast and hypoblast) forms in week 2."
      - "Right. Week 4 is the week of fours: the four-chambered heart starts to beat and the four limb buds begin to form."
      - "Gastrulation (trilaminar disc) is week 3."
      - "The genitalia look male or female by week 8 (\"geneightalia\")."
      - "The blastocyst implants (\"sticks\") on day 6, in week 1."
    src: { page: 630, quote: "Week 4 Heart begins to beat (four chambers). Cardiac activity visible by transvaginal ultrasound. Upper and lower limb buds begin to form (four limbs)." }
    status: unverified
  # ---------- p631: embryologic derivatives ----------
  - id: repro.L01.008
    kind: card
    topic: embryologic-derivatives
    front: List the derivatives of surface ectoderm.
    back: Epidermis; adenohypophysis (from Rathke pouch); lens of eye; epithelial linings of the oral cavity, sensory organs of the ear, and olfactory epithelium; anal canal below the pectinate line; parotid, sweat and mammary glands.
    src: { page: 631, quote: "Surface ectoderm Epidermis; adenohypophysis (from Rathke pouch); lens of eye; epithelial linings of oral cavity, sensory organs of ear, and olfactory epithelium; anal canal below the pectinate line; parotid, sweat, mammary glands." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.009
    kind: card
    topic: embryologic-derivatives
    front: What is a craniopharyngioma, and what are its histologic hallmarks?
    back: A benign Rathke pouch (surface ectoderm) tumor with cholesterol crystals and calcifications.
    src: { page: 631, quote: "Craniopharyngioma—benign Rathke pouch tumor with cholesterol crystals, calcifications." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.010
    kind: card
    topic: embryologic-derivatives
    front: What does the neural tube (neuroectoderm) give rise to?
    back: "The brain (neurohypophysis, CNS neurons, oligodendrocytes, astrocytes, ependymal cells, pineal gland), the retina and the spinal cord. Neuroectoderm: think CNS."
    src: { page: 631, quote: "Neural tube Brain (neurohypophysis, CNS neurons, oligo- dendrocytes, astrocytes, ependymal cells, pineal gland), retina, spinal cord. Neuroectoderm—think CNS." }
    status: unverified
  - id: repro.L01.011
    kind: enumerate
    topic: embryologic-derivatives
    prompt: Enumerate the neural crest derivatives (EMO PASSES).
    points:
      - Enterochromaffin cells
      - Melanocytes
      - Odontoblasts
      - PNS ganglia (cranial, dorsal root, autonomic)
      - Adrenal medulla
      - Schwann cells
      - Spiral membrane (aorticopulmonary septum)
      - Endocardial cushions (also partly from mesoderm)
      - Skull bones
    pass: 7
    hook: "الكتاب بيقولها EMO PASSES: الـ neural crest «إيمو» عدّى الامتحان، وكل حرف خلية: E-M-O ثم P-A-S-S-E-S."
    src: { page: 631, quote: "Neural crest Enterochromaffin cells, Melanocytes, Odontoblasts, PNS ganglia (cranial, dorsal root, autonomic), Adrenal medulla, Schwann cells, Spiral membrane (aorticopulmonary septum), Endocardial cushions (also derived partially from mesoderm), Skull bones. EMO PASSES" }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.012
    kind: card
    topic: embryologic-derivatives
    front: Which immunohistochemical marker is positive in neural crest-derived cells?
    back: "S100. Neural crest: think PNS and non-neural structures nearby."
    src: { page: 631, quote: "Neural crest—think PNS and non-neural structures nearby. S100 positive." }
    status: unverified
  - id: repro.L01.013
    kind: card
    topic: embryologic-derivatives
    front: Which germ layer forms the serous linings of the body cavities (peritoneum, pericardium, pleura)?
    back: Mesoderm.
    src: { page: 631, quote: "Mesoderm Muscle, bone, connective tissue, serous linings of body cavities (eg, peritoneum, pericardium, pleura), spleen (develops within foregut mesentery), cardiovascular structures, lymphatics, blood, wall of gut tube, proximal vagina, kidneys, adrenal cortex, dermis, testes, ovaries, microglia, tracheal cartilage." }
    status: unverified
    tags: [high-yield]
