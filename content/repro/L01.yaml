    src: { page: 631, quote: "Endoderm Gut tube epithelium (including anal canal above the pectinate line), most of urethra and distal vagina (derived from urogenital sinus), luminal epithelial derivatives (eg, lungs, liver, gallbladder, pancreas, eustachian tube, thymus, parathyroid, thyroid follicular and parafollicular [C] cells)." }
    status: unverified
