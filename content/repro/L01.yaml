    status: unverified
  - id: repro.L01.018
    kind: table
    topic: embryologic-derivatives
    title: Same organ, two germ layers
    columns: [Structure, Part from one layer, Part from another]
    rows:
      - [Anal canal, "Below pectinate line: surface ectoderm", "Above pectinate line: endoderm"]
      - [Vagina, "Proximal: mesoderm", "Distal: endoderm (urogenital sinus)"]
      - [Pituitary, "Adenohypophysis: surface ectoderm (Rathke pouch)", "Neurohypophysis: neural tube"]
      - [Adrenal, "Cortex: mesoderm", "Medulla: neural crest"]
    blanks: [[0, 1], [0, 2], [1, 1], [1, 2], [2, 1], [2, 2], [3, 1], [3, 2]]
    src: { page: 631, quote: "anal canal below the pectinate line" }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.019
    kind: mcq
    topic: embryologic-derivatives
    stem: >-
      A 9-year-old boy is brought to the clinic because of headaches and bumping into objects for
      3 months. His height has fallen from the 50th to the 10th percentile. Examination shows
      bitemporal hemianopia. CT of the head shows a calcified suprasellar mass. Biopsy shows
      cholesterol crystals. This tumor arises from tissue of which embryologic origin?
    options:
      - Neural tube
      - Neural crest
      - Surface ectoderm
      - Mesoderm
      - Endoderm
    answer: 2
    why:
      - "The neural tube gives the neurohypophysis, not the Rathke pouch."
      - "Neural crest gives PNS ganglia, melanocytes, adrenal medulla and others (EMO PASSES), not the anterior pituitary."
      - "Right. This is a craniopharyngioma, a benign Rathke pouch tumor; the Rathke pouch (adenohypophysis) is surface ectoderm."
      - "Mesoderm gives muscle, bone, connective tissue and microglia."
      - "Endoderm gives gut tube and luminal epithelium such as thyroid and parathyroid."
    src: { page: 631, quote: "Craniopharyngioma—benign Rathke pouch tumor with cholesterol crystals, calcifications." }
    status: unverified
  # ---------- p632: teratogens ----------
  - id: repro.L01.020
    kind: card
    topic: teratogens
    front: When is the fetus most susceptible to teratogens, and what happens before implantation and after week 8?
    back: Most susceptible during organogenesis in the embryonic period (before week 8). Before implantation the effect is "all-or-none". After week 8 (fetal period), growth and function are affected.
    src: { page: 632, quote: "Most susceptible during organogenesis in embryonic period (before week 8 of development). Before implantation, “all-or-none” effect. After week 8 (fetal period), growth and function affected." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.021
    kind: table
    topic: teratogens
    title: Teratogenic medications
    columns: [Drug, Effect on fetus, Memory aid]
    rows:
      - [ACE inhibitors, "Renal failure, oligohydramnios, hypocalvaria", ""]
      - [Alkylating agents, "Multiple anomalies (ear/facial abnormalities, absence of digits)", ""]
      - [Aminoglycosides, Ototoxicity, "\"A mean guy hit the baby in the ear.\""]
      - [Antiepileptic drugs, "Neural tube defects, cardiac defects, cleft palate, skeletal abnormalities", ""]
      - [Diethylstilbestrol, "Vaginal clear cell adenocarcinoma, congenital Müllerian anomalies", ""]
      - [Fluoroquinolones, Cartilage damage, ""]
      - [Folate antagonists, Neural tube defects, ""]
      - [Isotretinoin, "Craniofacial, CNS, cardiac and thymic defects", "Pronounce \"isoteratinoin\""]
      - [Lithium, Ebstein anomaly, ""]
      - [Methimazole, Aplasia cutis congenita, ""]
      - [Tetracyclines, "Discolored teeth, inhibited bone growth", "Pronounce \"teethracyclines\""]
      - [Thalidomide, "Limb defects (phocomelia)", "Pronounce \"thalimbdomide\""]
      - [Warfarin, "Bone and cartilage deformities, optic nerve atrophy, cerebral hemorrhage", "\"In war, you need strong bones to march and optics to see the enemy.\""]
    blanks: [[0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1], [12, 1]]
    src: { page: 632, quote: "ACE inhibitors Renal failure, oligohydramnios, hypocalvaria." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.022
    kind: card
    topic: teratogens
    front: Which antiepileptic drugs most commonly cause birth defects, and what is recommended?
    back: Valproate, carbamazepine, phenytoin and phenobarbital; high-dose folate supplementation is recommended.
    src: { page: 632, quote: "Most commonly due to valproate, carbamazepine, phenytoin, phenobarbital; high-dose folate supplementation recommended." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.023
    kind: card
    topic: teratogens
    front: Which folate antagonists most commonly cause neural tube defects?
    back: Trimethoprim and methotrexate.
    src: { page: 632, quote: "Folate antagonists Neural tube defects. Most commonly due to trimethoprim, methotrexate." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.024
    kind: card
    topic: teratogens
    front: Which teratogen causes Ebstein anomaly?
    back: Lithium.
    src: { page: 632, quote: "Lithium Ebstein anomaly." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.025
    kind: card
    topic: teratogens
    front: Which antithyroid drug causes aplasia cutis congenita, and what is it?
    back: Methimazole; congenital absence of skin, typically on the scalp.
    src: { page: 632, quote: "Methimazole Aplasia cutis congenita (congenital absence of skin, typically on scalp)." }
    status: unverified
  - id: repro.L01.026
    kind: card
    topic: teratogens
    front: What does isotretinoin do to the fetus?
    back: Craniofacial (microtia, dysmorphism), CNS, cardiac and thymic defects ("isoteratinoin").
    src: { page: 632, quote: "Isotretinoin Craniofacial (eg, microtia, dysmorphism), CNS, cardiac, and thymic defects. Contraception mandatory." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.125
    kind: card
    topic: teratogens
    front: What is mandatory for a patient of childbearing potential taking isotretinoin?
    back: Contraception, because the drug is a strong teratogen.
    src: { page: 632, quote: "Isotretinoin Craniofacial (eg, microtia, dysmorphism), CNS, cardiac, and thymic defects. Contraception mandatory." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.027
    kind: card
    topic: teratogens
    front: What are the fetal effects of warfarin?
    back: Bone and cartilage deformities (stippled epiphyses, nasal and limb hypoplasia), optic nerve atrophy and cerebral hemorrhage.
    src: { page: 632, quote: "Warfarin Bone and cartilage deformities (stippled epiphyses, nasal and limb hypoplasia), optic nerve atrophy, cerebral hemorrhage. Use heparin during pregnancy (does not cross placenta)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.126
    kind: card
    topic: teratogens
    front: Which anticoagulant is used in pregnancy instead of warfarin, and why is it safe for the fetus?
    back: Heparin; it does not cross the placenta.
    src: { page: 632, quote: "Warfarin Bone and cartilage deformities (stippled epiphyses, nasal and limb hypoplasia), optic nerve atrophy, cerebral hemorrhage. Use heparin during pregnancy (does not cross placenta)." }
    status: unverified
    tags: [high-yield]
  - id: repro.L01.028
    kind: card
    topic: teratogens
    front: What does in utero diethylstilbestrol (DES) exposure cause?
    back: Vaginal clear cell adenocarcinoma and congenital Müllerian anomalies.
    src: { page: 632, quote: "Diethylstilbestrol Vaginal clear cell adenocarcinoma, congenital Müllerian anomalies." }
    status: unverified
