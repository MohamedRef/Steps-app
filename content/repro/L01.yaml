  - id: repro.L01.031
    kind: enumerate
    topic: teratogens
    prompt: Enumerate the fetal effects of maternal diabetes.
    points:
      - Caudal regression syndrome
      - Cardiac defects (transposition of great arteries, VSD)
      - Neural tube defects
      - Macrosomia
      - Neonatal hypoglycemia (islet cell hyperplasia)
      - Polycythemia
      - Respiratory distress syndrome
    pass: 5
    hook: "بنت الأم السكرية: تخينة (macrosomia)، والسكر يقع بعد الولادة (islets اتعودت تشتغل زيادة)، ودمها تقيل (polycythemia)، ورئتها متأخرة (RDS)، وتحت: caudal regression، وفوق: قلب و neural tube."
    src: { page: 632, quote: "Maternal diabetes Caudal regression syndrome, cardiac defects (eg, transposition of great arteries, VSD), neural tube defects, macrosomia, neonatal hypoglycemia (due to islet cell hyperplasia), polycythemia, respiratory distress syndrome." }
    status: unverified
