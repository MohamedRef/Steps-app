  - id: repro.L01.112
    kind: mcq
    topic: uterine-anomalies
    stem: >-
      A 28-year-old woman has had three first-trimester miscarriages. A hysterosalpingogram shows
      two uterine cavities. MRI shows a single, smooth, convex fundal contour with a fibrous band
      dividing the cavity down to the cervix. Which embryologic failure is responsible?
    options:
      - Incomplete fusion of the Müllerian ducts
      - Complete failure of fusion of the Müllerian ducts
      - Incomplete resorption of the septum between the fused ducts
      - Agenesis of the paramesonephric ducts
      - Persistence of the mesonephric ducts
    answer: 2
    why:
      - "Incomplete fusion gives a bicornuate uterus, with an indented, heart-shaped fundus outside."
      - "Complete failure of fusion gives uterus didelphys: two uteri, two cervices, two vaginas."
      - "Right. A normal outer fundus with an inner dividing wall is a septate uterus: the ducts fused but the septum wasn't resorbed. It is common and treated with septoplasty."
      - "Müllerian agenesis means no uterus at all."
      - "Mesonephric ducts persist as Gartner duct in females; they don't divide the uterus."
    src: { page: 640, quote: "Septate uterus Incomplete resorption of septum A . Common anomaly. Treat with septoplasty." }
    status: unverified
