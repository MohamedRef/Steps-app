[package]
name = "steps-core"
description = "Steps's pure logic: content schema and validation, review events, layout."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
steps-protocol.workspace = true
miniz_oxide = "0.8"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fsrs = "6.6"
# Update feeds (update.rs): Ed25519 signatures, base64 keys.
ed25519-dalek = "2"
base64 = "0.22"

# fsrs pulls rand → getrandom, which needs an explicit JS backend on wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_yaml_ng.workspace = true

[lints]
workspace = true
