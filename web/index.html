<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#11202b" />
    <title>Steps</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="icon-256.png" />
    <link rel="apple-touch-icon" href="icon-256.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f3f6f9; color: #193348; }
      @media (prefers-color-scheme: dark) { html, body { background: #11202b; color: #eef4f8; } }
      #main:not(:empty) ~ #boot { display: none; }
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
              justify-content: center; gap: 16px; font: 15px system-ui, sans-serif; text-align: center; }
      #boot img { inline-size: 96px; block-size: 96px; animation: pulse 1.6s ease-in-out infinite; }
      #boot p { margin: 0; padding-inline: 24px; opacity: .7; }
      #boot p:empty { display: none; }
      @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.07); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="main"></div>
    <div id="boot" role="status" aria-label="Steps بتفتح">
      <img src="icon-256.png" alt="" />
      <p id="boot-msg"></p>
    </div>
    <noscript>Steps needs JavaScript and WebAssembly.</noscript>
    <script type="module">
      // The content pack downloads alongside the wasm; the app waits for it.
      globalThis.stepsPack = fetch("./content.pack").then((r) => {
        if (!r.ok) throw new Error("content.pack: HTTP " + r.status);
        return r.arrayBuffer();
      });
      import init from "./steps.js";
      init({ module_or_path: "./steps_bg.wasm" })
        .then(() => globalThis.stepsPack)
        .then(() => {
          // Once this visit has everything, keep it on the device for the next.
          if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
        })
        .catch((e) => {
          document.querySelector("#boot img").style.animation = "none";
          const msg = document.getElementById("boot-msg");
          if (!msg.textContent) msg.textContent = "Steps مافتحتش في المتصفح ده: " + e;
        });
    </script>
  </body>
</html>
